<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>字裡小偵探｜之・則 文言小學堂</title>
<meta name="description" content="小學文言文「之」「則」看圖互動課：八張圖解卡、兩種玩法各六題、逐題講解、語音與音效，手機、平板、電腦皆可離線使用。">
<meta name="theme-color" content="#FBF1DA">
<style>
:root{
  --ink:#2A2118;
  --ink2:#584734;
  --muted:#8B7554;
  --paper:#FBF1DA;
  --paper-deep:#F3E1BC;
  --card:#FFFCF2;
  --red:#D94B32;
  --red-deep:#B23A24;
  --gold:#F2B33D;
  --gold-soft:#FBE3AE;
  --jade:#2C9A8B;
  --jade-soft:#DDF0E8;
  --blue:#37699F;
  --blue-soft:#DCE8F5;
  --plum:#8A5878;
  --line:4px solid var(--ink);
  --radius:22px;
  --shadow:7px 7px 0 rgba(42,33,24,.13);
  --font-ui:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --font-kai:"Kaiti TC","BiauKai","DFKai-SB","AR PL UKai TW","Noto Serif CJK TC",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px;scroll-behavior:smooth}
@media(min-width:768px){html{font-size:18px}}
@media(min-width:1180px){html{font-size:19px}}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--font-ui);
  line-height:1.65;
  background:
    radial-gradient(circle at 8% 4%, rgba(242,179,61,.30), transparent 34%),
    radial-gradient(circle at 94% 96%, rgba(44,154,139,.18), transparent 38%),
    var(--paper);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(42,33,24,.055) 1px, transparent 1.2px);
  background-size:17px 17px;
  opacity:.75;
}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none !important}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 16px 46px}
@media(min-width:768px){main{padding:0 24px 60px}}
.kai{font-family:var(--font-kai)}

/* ---------- 頂欄 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(251,241,218,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
@media(min-width:768px){.topbar-in{padding:11px 24px}}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
.brand-badge{width:42px;height:42px;flex:0 0 42px;display:block}
@media(min-width:768px){.brand-badge{width:50px;height:50px;flex-basis:50px}}
.brand h1{font-size:1.06rem;line-height:1.2;letter-spacing:.02em;white-space:nowrap}
.brand p{font-size:.68rem;color:var(--muted);letter-spacing:.14em;line-height:1.3;margin-top:1px}
@media(max-width:420px){.brand p{display:none}.brand h1{font-size:1rem}}
.nav-desk{display:none;gap:6px;background:rgba(42,33,24,.07);padding:4px;border-radius:999px}
@media(min-width:900px){.nav-desk{display:flex}}
.nav-desk button{
  padding:.42em 1.15em;border-radius:999px;font-weight:700;font-size:.9rem;
  color:var(--ink2);transition:background .15s,color .15s;
}
.nav-desk button[aria-selected="true"]{background:var(--ink);color:#FFF8E6}
.sound{
  display:flex;align-items:center;gap:6px;
  border:3px solid var(--ink);background:var(--card);border-radius:999px;
  padding:.36em .7em;font-size:.78rem;font-weight:800;flex:0 0 auto;
  box-shadow:0 3px 0 var(--ink);
}
.sound:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sound svg{width:19px;height:19px;display:block}
.sound .slash{display:none}
.sound[aria-pressed="false"]{background:var(--paper-deep);color:var(--muted)}
.sound[aria-pressed="false"] .wave{display:none}
.sound[aria-pressed="false"] .slash{display:block}
@media(max-width:520px){.sound span{display:none}.sound{padding:.42em}}

/* ---------- 首屏 ---------- */
.hero{position:relative;padding:20px 0 8px;display:grid;gap:10px}
@media(min-width:820px){.hero{grid-template-columns:1.05fr .95fr;align-items:center;gap:20px;padding:34px 0 12px}}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;font-weight:800;letter-spacing:.16em;color:var(--red-deep);
  background:rgba(217,75,50,.10);border:2px solid rgba(217,75,50,.4);
  padding:.24em .7em;border-radius:999px;
}
.hero h1{
  font-family:var(--font-kai);
  font-size:clamp(2.15rem,9.4vw,3.2rem);
  line-height:1.12;letter-spacing:.02em;margin:.42em 0 .28em;
}
.hero h1 .mark{position:relative;display:inline-block;color:var(--red-deep);white-space:nowrap}
.hero h1 .mark::after{
  content:"";position:absolute;left:-2%;right:-2%;bottom:.06em;height:.26em;
  background:rgba(242,179,61,.75);border-radius:4px;z-index:-1;transform:rotate(-1.4deg);
}
.hero p.desc{font-size:.98rem;color:var(--ink2);max-width:26em;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hero-stats{display:flex;gap:18px;margin-top:18px}
.hero-stats div{display:flex;flex-direction:column;line-height:1.15}
.hero-stats b{font-size:1.5rem;font-family:var(--font-kai)}
.hero-stats span{font-size:.72rem;color:var(--muted);letter-spacing:.08em}

.hero-art{position:relative;height:212px;order:-1}
@media(min-width:820px){.hero-art{height:300px;order:0}}
.hero-card{
  position:absolute;width:104px;height:132px;top:22px;left:9%;
  display:grid;place-items:center;
  font-family:var(--font-kai);font-size:3.6rem;line-height:1;
  border:4px solid var(--ink);border-radius:16px;
  box-shadow:7px 8px 0 rgba(42,33,24,.16);
  transform:rotate(-7deg);
}
.hero-card.z{background:var(--gold);color:var(--ink)}
.hero-card.e{background:var(--jade);color:#FFF8E6;left:auto;right:12%;top:10px;transform:rotate(6deg)}
.hero-card::before{
  content:"";position:absolute;top:-9px;left:50%;width:36px;height:14px;
  transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,248,230,.72);border:2px solid rgba(42,33,24,.35);border-radius:2px;
}
@media(min-width:820px){
  .hero-card{width:158px;height:198px;font-size:5.4rem;left:12%;top:34px}
  .hero-card.e{left:auto;right:14%}
}
.hero-mascot{position:absolute;left:50%;bottom:-4px;width:138px;transform:translateX(-50%)}
.hero-mascot svg{width:100%;height:auto;display:block}
@media(min-width:820px){.hero-mascot{width:208px;bottom:0}}

/* ---------- 按鈕 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid var(--ink);border-radius:999px;
  padding:.62em 1.25em;font-weight:800;font-size:.95rem;line-height:1.3;
  background:var(--card);box-shadow:0 4px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease,background .15s;
  text-decoration:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:19px;height:19px;flex:0 0 19px}
.btn-red{background:var(--red);color:#FFF8E6}
.btn-dark{background:var(--ink);color:#FFF8E6}
.btn-ghost{background:var(--card);color:var(--ink)}
.btn-jade{background:var(--jade);color:#FFF8E6}
.btn-lg{font-size:1.08rem;padding:.72em 1.5em;min-height:56px}
.btn-block{width:100%}

/* ---------- 區塊標題 ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-head h2{font-family:var(--font-kai);font-size:1.6rem;display:flex;align-items:center;gap:9px;line-height:1.2}
.sec-head h2::before{content:"";width:9px;height:28px;background:var(--red);border-radius:3px;border:2px solid var(--ink)}
.sec-head p{font-size:.78rem;color:var(--muted);text-align:right}

/* ---------- 字切換 ---------- */
.char-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.char-tab{
  display:flex;align-items:center;gap:10px;text-align:left;
  background:var(--card);border:3px solid rgba(42,33,24,.35);border-radius:16px;
  padding:8px 10px;box-shadow:0 3px 0 rgba(42,33,24,.15);
  transition:transform .15s,border-color .15s,background .15s;
}
.char-tab .glyph{
  width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;
  font-family:var(--font-kai);font-size:2.2rem;line-height:1;
  border:3px solid var(--ink);border-radius:12px;background:var(--paper-deep);
}
.char-tab .meta{display:flex;flex-direction:column;min-width:0}
.char-tab .meta b{font-size:.95rem;line-height:1.3}
.char-tab .meta small{font-size:.7rem;color:var(--muted);line-height:1.4;margin-top:2px}
.char-tab[aria-selected="true"]{border-color:var(--ink);background:var(--gold-soft);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.char-tab[aria-selected="true"] .glyph{background:var(--red);color:#FFF8E6}
@media(min-width:640px){
  .char-tab{padding:12px 16px;gap:14px}
  .char-tab .glyph{width:66px;height:66px;flex-basis:66px;font-size:2.6rem}
  .char-tab .meta b{font-size:1.05rem}
  .char-tab .meta small{font-size:.78rem}
}

/* ---------- 教學卡 ---------- */
.teach-grid{display:grid;gap:16px}
@media(min-width:900px){.teach-grid{grid-template-columns:1fr 1fr;gap:20px;align-items:start}}
.tcard{
  position:relative;background:var(--card);border:var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
.tcard:nth-child(2){animation-delay:.06s}
.tcard:nth-child(3){animation-delay:.12s}
.tcard:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:.92;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.tcard{animation:none}html{scroll-behavior:auto}}
.tcard-top{display:flex;align-items:center;gap:6px;padding:11px 13px 6px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.68rem;font-weight:800;letter-spacing:.06em;
  padding:.22em .6em;border-radius:999px;border:2px solid var(--ink);line-height:1.4;
}
.chip-tag{background:var(--paper-deep)}
.chip-lv{background:var(--jade-soft)}
.chip-lv.hard{background:var(--blue-soft)}
.card-no{
  margin-left:auto;font-family:var(--font-kai);font-size:1.1rem;color:var(--muted);
  letter-spacing:.1em;
}
.tcard-art{position:relative;padding:0 11px}
.tcard-art svg{width:100%;height:auto;display:block;border-radius:14px}
.art-badge{
  position:absolute;left:20px;bottom:10px;
  background:var(--card);border:3px solid var(--ink);border-radius:10px;
  padding:.1em .55em;font-size:.78rem;font-weight:800;
  box-shadow:3px 3px 0 rgba(42,33,24,.2);transform:rotate(-2.5deg);
  max-width:80%;
}
.art-badge b{color:var(--red-deep);font-size:.95em}
.tcard-body{padding:9px 14px 15px}
.tcard-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tcard-title h3{font-family:var(--font-kai);font-size:1.95rem;line-height:1.2;letter-spacing:.02em}
.tcard-title small{font-size:.76rem;color:var(--muted)}
.tcard-meaning{font-size:.92rem;color:var(--ink2);margin-top:1px;line-height:1.55}
.example{
  position:relative;margin-top:10px;padding:9px 11px 10px 14px;
  background:var(--paper);border:2px dashed rgba(42,33,24,.35);border-radius:12px;
}
.example::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;
  background:var(--gold);border-radius:0 4px 4px 0;
}
.ex-line{font-family:var(--font-kai);line-height:1.65;letter-spacing:.02em}
.ex-before,.ex-after{font-size:.8rem;color:var(--muted)}
.ex-main{font-size:1.16rem;margin:2px 0}
@media(min-width:768px){.ex-main{font-size:1.22rem}}
.hl{
  color:var(--red-deep);font-weight:700;font-style:normal;
  padding:0 1px;border-bottom:3px solid rgba(217,75,50,.45);
  background:linear-gradient(to top,rgba(242,179,61,.35) 38%,transparent 38%);
}
.ex-tools{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.icon-btn{
  display:inline-flex;align-items:center;gap:5px;
  border:2px solid var(--ink);border-radius:999px;background:var(--card);
  padding:.24em .62em;font-size:.72rem;font-weight:800;line-height:1.5;
  box-shadow:0 2px 0 var(--ink);
}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn svg{width:15px;height:15px;flex:0 0 15px}
.tip{
  display:flex;align-items:flex-start;gap:7px;margin-top:10px;
  background:rgba(242,179,61,.22);border-radius:10px;padding:7px 9px;
  font-size:.82rem;font-weight:700;line-height:1.5;
}
.tip svg{width:17px;height:17px;flex:0 0 17px;margin-top:2px}
details.more{margin-top:8px;border-top:2px dotted rgba(42,33,24,.22);padding-top:6px}
details.more summary{
  list-style:none;cursor:pointer;font-size:.76rem;font-weight:800;color:var(--blue);
  display:inline-flex;align-items:center;gap:4px;padding:.2em 0;
}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"＋";font-size:1em}
details.more[open] summary::after{content:"－"}
details.more p{font-size:.82rem;color:var(--ink2);line-height:1.6;margin-top:2px}
details.more .src{display:inline-block;font-size:.7rem;color:var(--muted);margin-top:3px}

.learn-cta{display:flex;justify-content:center;margin:22px 0 6px}

/* ---------- 練習場 ---------- */
.config-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:20px 0 12px}
.config-head h2{font-family:var(--font-kai);font-size:2rem;line-height:1.2}
.config-head p{font-size:.84rem;color:var(--muted)}
.config-block{
  background:var(--card);border:var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-bottom:14px;
}
.step{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.step .n{
  width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;
  background:var(--ink);color:#FFF8E6;border-radius:50%;font-size:.8rem;font-weight:900;
}
.step h3{font-size:1.05rem}
.step small{margin-left:auto;font-size:.72rem;color:var(--muted);text-align:right}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.pick{
  display:flex;align-items:center;gap:9px;text-align:left;
  background:var(--paper);border:3px solid rgba(42,33,24,.32);border-radius:14px;
  padding:9px;min-height:72px;
  transition:background .15s,border-color .15s,transform .12s;
}
.pick .ico{width:44px;height:44px;flex:0 0 44px}
.pick .ico svg{width:100%;height:100%;display:block}
.pick .t{display:flex;flex-direction:column;min-width:0}
.pick .t b{font-size:.95rem;line-height:1.25}
.pick .t small{font-size:.7rem;color:var(--muted);line-height:1.4;margin-top:1px}
.pick[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.pick[aria-pressed="true"] .t b{color:var(--ink)}
@media(max-width:359px){.pick{flex-direction:column;align-items:flex-start;gap:4px}.pick .ico{width:36px;height:36px;flex-basis:36px}}
.start-row{display:flex;flex-direction:column;gap:8px;align-items:stretch}
@media(min-width:640px){.start-row{flex-direction:row;align-items:center;justify-content:space-between}}
.start-summary{font-size:.8rem;color:var(--muted);text-align:center}
.config-hint{
  display:flex;align-items:center;gap:8px;justify-content:center;
  font-size:.8rem;color:var(--ink2);margin:4px 0 10px;text-align:center;
}
.config-hint svg{width:17px;height:17px;flex:0 0 17px}

/* ---------- 遊戲 ---------- */
.game-shell{padding-top:12px}
.game-top{
  position:sticky;top:66px;z-index:30;
  display:flex;align-items:center;gap:9px;
  background:rgba(251,241,218,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:8px 0 9px;margin-bottom:8px;
}
@media(min-width:768px){.game-top{top:74px}}
.quit{
  font-size:.76rem;font-weight:800;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);padding:.3em .6em;flex:0 0 auto;
}
.hud{flex:1 1 auto;min-width:0}
.hud-line{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700;color:var(--ink2);line-height:1.3}
.bar{height:9px;background:rgba(42,33,24,.14);border-radius:999px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--jade);border-radius:999px;transition:width .35s ease}
.score-chip{
  flex:0 0 auto;font-size:.76rem;font-weight:900;background:var(--gold);
  border:2px solid var(--ink);border-radius:999px;padding:.28em .6em;line-height:1.4;
}
.qcard{
  background:var(--card);border:var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:11px;animation:rise .35s ease both;
}
.qart{position:relative}
.qart svg{width:100%;height:auto;display:block;border-radius:13px}
.qtag{
  position:absolute;top:8px;left:8px;
  background:var(--card);border:2px solid var(--ink);border-radius:999px;
  font-size:.64rem;font-weight:900;padding:.15em .55em;letter-spacing:.05em;
}
.qsent{margin-top:10px;padding:0 3px}
.qsent .line{font-family:var(--font-kai);line-height:1.7;letter-spacing:.02em}
.qsent .before,.qsent .after{font-size:.78rem;color:var(--muted)}
.qsent .main{font-size:1.2rem;margin:2px 0}
@media(min-width:768px){.qsent .main{font-size:1.32rem}}
.qask{font-size:.84rem;font-weight:800;margin:10px 3px 8px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.qask::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px}
.opts{display:grid;gap:8px}
@media(min-width:820px){.opts{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--paper);border:3px solid rgba(42,33,24,.5);border-radius:14px;
  padding:10px 11px;min-height:58px;font-size:1rem;font-weight:700;line-height:1.45;
  box-shadow:0 3px 0 rgba(42,33,24,.22);
  transition:background .15s,border-color .15s,transform .1s;
}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt .key{
  width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;
  border-radius:50%;border:2px solid var(--ink);background:var(--card);
  font-family:var(--font-kai);font-size:1rem;font-weight:700;
}
.opt .txt{min-width:0}
.opt[data-state="right"]{background:var(--jade-soft);border-color:#1E7A62}
.opt[data-state="wrong"]{background:#FBE2D8;border-color:var(--red-deep)}
.opt[data-state="muted"]{opacity:.48}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:820px){.bins{grid-template-columns:repeat(4,1fr)}}
.bin{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:88px;padding:8px 6px;text-align:center;
  background:var(--paper);border:3px dashed rgba(42,33,24,.5);border-radius:14px;
  transition:background .15s,border-color .15s,transform .1s;
}
.bin:active{transform:scale(.98)}
.bin .ico{width:36px;height:36px}
.bin .ico svg{width:100%;height:100%;display:block}
.bin b{font-size:.9rem;line-height:1.3}
.bin small{font-size:.66rem;color:var(--muted);line-height:1.35}
.bin[data-state="right"]{background:var(--jade-soft);border-style:solid;border-color:#1E7A62}
.bin[data-state="wrong"]{background:#FBE2D8;border-style:solid;border-color:var(--red-deep)}
.bin[data-state="muted"]{opacity:.45}
.bin .mark{font-size:.68rem;font-weight:900;color:var(--jade);line-height:1.2}

/* 回饋 */
.fb{
  margin-top:12px;border:var(--line);border-radius:18px;padding:12px;
  background:var(--card);box-shadow:4px 4px 0 rgba(42,33,24,.12);
  animation:pop .28s ease both;
}
@keyframes pop{from{opacity:.9;transform:scale(.985)}to{opacity:1;transform:none}}
.fb-head{display:flex;align-items:center;gap:9px}
.fb-seal{width:40px;height:40px;flex:0 0 40px}
.fb-seal svg{width:100%;height:100%;display:block}
.fb-head b{font-size:1.02rem;line-height:1.3}
.fb-head span{font-size:.72rem;color:var(--muted);display:block}
.fb-sentence{font-family:var(--font-kai);font-size:1rem;line-height:1.6;background:var(--paper);border-radius:9px;padding:6px 9px;margin-top:8px;letter-spacing:.02em}
.fb-answer{
  margin-top:8px;font-size:.95rem;font-weight:800;line-height:1.5;
  background:rgba(44,154,139,.12);border-radius:9px;padding:6px 9px;
}
.fb.no .fb-sentence{font-family:var(--font-kai);font-size:1rem;line-height:1.6;background:var(--paper);border-radius:9px;padding:6px 9px;margin-top:8px;letter-spacing:.02em}
.fb-answer{background:rgba(217,75,50,.10)}
.fb-why{font-size:.9rem;line-height:1.65;margin-top:7px;color:var(--ink2)}
.fb-why b{color:var(--ink)}
.fb-trans{font-size:.84rem;line-height:1.6;color:var(--ink2);margin-top:6px;padding-left:9px;border-left:3px solid var(--gold)}
.fb-src{font-size:.7rem;color:var(--muted);margin-top:5px;display:block}
.fb-actions{display:flex;justify-content:flex-end;margin-top:10px}

/* 結果 */
.result-wrap{animation:rise .4s ease both}
.result-hero{
  background:var(--card);border:var(--line);border-radius:26px;box-shadow:var(--shadow);
  padding:20px 16px;text-align:center;position:relative;overflow:hidden;
}
.result-hero::before{
  content:"";position:absolute;left:-30px;right:-30px;top:-70px;height:140px;
  background:radial-gradient(ellipse at center,rgba(242,179,61,.45),transparent 70%);
}
.stars{display:flex;justify-content:center;gap:8px;margin:4px 0 2px;position:relative}
.stars svg{width:54px;height:54px;display:block}
.stars svg.off{opacity:.22}
.result-hero h2{font-family:var(--font-kai);font-size:1.9rem;line-height:1.25;margin-top:4px}
.result-score{font-size:.92rem;color:var(--ink2);margin-top:2px}
.result-score b{font-size:1.5rem;font-family:var(--font-kai);color:var(--red-deep)}
.result-msg{font-size:.86rem;color:var(--muted);margin-top:4px}
.result-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}
.review{margin-top:16px}
.review h3{font-size:1rem;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.review h3::before{content:"";width:8px;height:20px;background:var(--jade);border-radius:3px;border:2px solid var(--ink)}
.rev-row{
  display:flex;gap:9px;align-items:flex-start;
  background:var(--card);border:2px solid rgba(42,33,24,.22);border-radius:12px;
  padding:8px 10px;margin-bottom:7px;
}
.rev-no{font-size:.7rem;font-weight:900;color:var(--muted);flex:0 0 20px;padding-top:2px}
.rev-main{flex:1 1 auto;min-width:0}
.rev-main .s{font-family:var(--font-kai);font-size:.9rem;line-height:1.5}
.rev-main .a{font-size:.74rem;color:var(--ink2);margin-top:2px;line-height:1.45}
.rev-mark{flex:0 0 auto;font-weight:900;font-size:.8rem;padding-top:1px}
.rev-row.ok .rev-mark{color:#1E7A62}
.rev-row.no .rev-mark{color:var(--red-deep)}

/* 底部導覽 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:1fr 1fr;
  background:rgba(251,241,218,.97);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:3px solid var(--ink);
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px;border-radius:12px;font-size:.68rem;font-weight:800;color:var(--muted);
}
.tabbar button svg{width:24px;height:24px;display:block}
.tabbar button[aria-selected="true"]{color:var(--ink);background:rgba(242,179,61,.30)}
@media(min-width:900px){.tabbar{display:none}body{padding-bottom:0}}
body{padding-bottom:70px}
@media(min-width:900px){body{padding-bottom:0}}
body.playing .tabbar{display:none}
body.playing{padding-bottom:20px}

/* 頁尾 */
.foot{
  position:relative;z-index:1;text-align:center;font-size:.72rem;color:var(--muted);
  padding:18px 16px 26px;line-height:1.7;border-top:2px dotted rgba(42,33,24,.18);
  max-width:1120px;margin:18px auto 0;
}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);
  background:var(--ink);color:#FFF8E6;border-radius:999px;padding:.5em 1.1em;
  font-size:.82rem;font-weight:700;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
/* =========================================================
   插圖：全部內嵌 SVG（320×200 場景），離線可用
   ========================================================= */
var ART = {};
var INK = '#2A2118';

function svg(inner, bg){
  return '<svg viewBox="0 0 320 200" aria-hidden="true" focusable="false">' +
    '<rect x="4" y="4" width="312" height="192" rx="18" fill="' + (bg || '#FDF6E4') + '" stroke="' + INK + '" stroke-width="5"/>' +
    inner + '</svg>';
}
function waves(y, color, op){
  return '<path d="M8 ' + y + ' q20-8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="' + (color || '#37699F') + '" stroke-width="4" stroke-linecap="round" opacity="' + (op || '.5') + '"/>';
}
function ground(y){
  return '<path d="M0 ' + (y || 170) + 'h320" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
}
function sun(x, y, r){
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#F2B33D" stroke="' + INK + '" stroke-width="4"/>' +
    '<path d="M' + x + ' ' + (y - r - 12) + 'v-7M' + x + ' ' + (y + r + 12) + 'v7M' + (x - r - 12) + ' ' + y + 'h-7M' + (x + r + 12) + ' ' + y + 'h7" stroke="' + INK + '" stroke-width="3" stroke-linecap="round" opacity=".5"/>';
}

var HAIR = {
  boy: '<path d="M-21 -2q1-22 21-22t21 22q-9-9-21-7-12-2-21 7Z" fill="#2A2118"/>',
  girl: '<path d="M-21 -2q1-22 21-22t21 22q-9-9-21-7-12-2-21 7Z" fill="#2A2118"/><circle cx="0" cy="-25" r="8" fill="#2A2118"/><circle cx="0" cy="-25" r="3.2" fill="#D94B32"/>',
  old: '<path d="M-21 -2q1-22 21-22t21 22q-9-8-21-6-12-2-21 6Z" fill="#EFE6D2"/><path d="M-15 14q15 19 30 0-5 17-15 17t-15-17Z" fill="#EFE6D2"/>',
  scholar: '<path d="M-24 -11h48l-5-11h-38Z" fill="#2A2118"/><rect x="-12" y="-24" width="24" height="12" rx="3" fill="#2A2118"/>'
};

function chibi(o){
  o = o || {};
  var x = o.x || 160, y = o.y || 80, s = o.s || 1;
  var robe = o.robe || '#37699F';
  var mouth = o.sad ? 'M-6 11q6-5 12 0' : 'M-6 9q6 6 12 0';
  var arms = o.arms || ('<path d="M-15 29q-11 9-13 19" stroke="' + robe + '" stroke-width="10" fill="none" stroke-linecap="round"/>' +
    '<path d="M15 29q11 9 13 19" stroke="' + robe + '" stroke-width="10" fill="none" stroke-linecap="round"/>');
  var legs = o.sit ? '' : '<path d="M-8 57v13M8 57v13" stroke="' + INK + '" stroke-width="7" stroke-linecap="round"/>';
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
    '<path d="M-15 21q15-7 30 0l4 35q-19 7-38 0Z" fill="' + robe + '" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>' +
    arms + legs +
    '<circle cx="0" cy="0" r="21" fill="' + (o.skin || '#F7C98D') + '" stroke="' + INK + '" stroke-width="4"/>' +
    (HAIR[o.hair || 'boy'] || HAIR.boy) +
    '<circle cx="-7" cy="1" r="2.7" fill="' + INK + '"/><circle cx="7" cy="1" r="2.7" fill="' + INK + '"/>' +
    '<path d="' + mouth + '" stroke="' + INK + '" stroke-width="2.8" fill="none" stroke-linecap="round"/>' +
    '<circle cx="-14" cy="8" r="4.2" fill="#D94B32" opacity=".22"/><circle cx="14" cy="8" r="4.2" fill="#D94B32" opacity=".22"/>' +
    '</g>';
}

/* 1 讀書 */
ART.study = svg(
  sun(272, 40, 17) +
  '<rect x="30" y="30" width="92" height="74" rx="5" fill="#DCEBF7" stroke="' + INK + '" stroke-width="4"/>' +
  '<path d="M76 30v74M30 67h92" stroke="' + INK + '" stroke-width="3.4"/>' +
  '<path d="M30 30l46 37M122 30L76 67" stroke="' + INK + '" stroke-width="1.8" opacity=".3"/>' +
  chibi({ x: 196, y: 74, robe: '#37699F', hair: 'boy' }) +
  '<rect x="122" y="126" width="138" height="13" rx="6" fill="#C9A46E" stroke="' + INK + '" stroke-width="4"/>' +
  '<path d="M136 139v29M246 139v29" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>' +
  '<path d="M160 126q17-8 34 0v-11q-17-7-34 0Z" fill="#FFFCF2" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
  '<path d="M194 126q17-8 34 0v-11q-17-7-34 0Z" fill="#FFFCF2" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
  '<path d="M187 126v-11M175 120h-9M199 120h9" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>' +
  ground(168)
);

/* 2 蓮花 */
ART.lotus = svg(
  '<circle cx="268" cy="38" r="18" fill="#F2B33D" stroke="' + INK + '" stroke-width="4"/>' +
  '<ellipse cx="180" cy="164" rx="128" ry="24" fill="#CFE6F2" stroke="' + INK + '" stroke-width="4"/>' +
  '<ellipse cx="112" cy="156" rx="34" ry="12" fill="#7FB6A4" stroke="' + INK + '" stroke-width="3.6"/>' +
  '<path d="M100 156h24" stroke="' + INK + '" stroke-width="2.4" opacity=".35"/>' +
  '<path d="M212 160q-14-18 0-38 14 20 0 38Z" fill="#F2B33D" stroke="' + INK + '" stroke-width="3.6"/>' +
  '<path d="M212 160q-24-8-26-28 20 6 26 28Z" fill="#E8A0B4" stroke="' + INK + '" stroke-width="3.4"/>' +
  '<path d="M212 160q24-8 26-28-20 6-26 28Z" fill="#E8A0B4" stroke="' + INK + '" stroke-width="3.4"/>' +
  '<path d="M150 166q-9-14 0-27 10 13 0 27Z" fill="#F5D6A0" stroke="' + INK + '" stroke-width="3.2"/>' +
  chibi({ x: 66, y: 92, robe: '#8A5878', hair: 'girl', arms: '<path d="M15 29q14-8 24-16" stroke="#8A5878" stroke-width="10" fill="none" stroke-linecap="round"/>' }) +
  '<path d="M118 78l4-9 4 9 9 4-9 4-4 9-4-9-9-4Z" fill="#FFFCF2" stroke="' + INK + '" stroke-width="2.2"/>' +
  ground(182)
);

/* 3 送別 */
ART.boat = svg(
  sun(54, 46, 18) +

/* =========================================================
   工具
   ========================================================= */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function plain(html){
  var d = document.createElement('div');
  d.innerHTML = String(html == null ? '' : html);
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var scrollBehavior = reduceMotion ? 'auto' : 'smooth';
var toastTimer = null;
function toast(msg){
  var el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}

/* =========================================================
   音效與朗讀
   ========================================================= */
var AC = null;
var canAudio = !!(window.AudioContext || window.webkitAudioContext);
var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
var canSpeech = !!(synth && typeof window.SpeechSynthesisUtterance === 'function');
var voices = [];
var soundOn = true;

function refreshVoices(){
  if(!synth) return;
  try{ voices = synth.getVoices() || []; }catch(e){ voices = []; }
}
if(canSpeech){
  refreshVoices();
  if(typeof synth.addEventListener === 'function'){ synth.addEventListener('voiceschanged', refreshVoices); }
  else { synth.onvoiceschanged = refreshVoices; }
}
function audioCtx(){
  if(!canAudio) return null;
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; AC = new C(); }
    if(AC.state === 'suspended'){ AC.resume(); }
    return AC;
  }catch(e){ return null; }
}
function tone(freq, start, dur, type, vol){
  var c = audioCtx();
  if(!c) return;
  try{
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = c.currentTime + (start || 0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function sfx(kind){
  if(!soundOn || !canAudio) return;
  if(kind === 'tap'){ tone(620, 0, 0.06, 'sine', 0.05); }
  else if(kind === 'right'){ tone(659, 0, 0.10, 'sine', 0.10); tone(880, 0.09, 0.12, 'sine', 0.09); tone(1175, 0.18, 0.18, 'sine', 0.07); }
  else if(kind === 'wrong'){ tone(233, 0, 0.14, 'triangle', 0.09); tone(175, 0.13, 0.20, 'triangle', 0.08); }
  else if(kind === 'win'){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, i * 0.10, 0.22, 'sine', 0.08); }); }
  else if(kind === 'place'){ tone(784, 0, 0.07, 'sine', 0.06); }
}
function speak(text){
  if(!soundOn || !canSpeech) return;
  try{
    synth.cancel();
    var clean = plain(text).replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '');
    var u = new window.SpeechSynthesisUtterance(clean);
    u.lang = 'zh-TW'; u.rate = 0.82; u.pitch = 1.03; u.volume = 1;
    var v = null, i;
    for(i = 0; i < voices.length; i++){
      if(/zh[-_]TW|zh[-_]Hant|zh[-_]HK/i.test(voices[i].lang)){ v = voices[i]; break; }
    }
    if(!v){
      for(i = 0; i < voices.length; i++){ if(/^zh/i.test(voices[i].lang)){ v = voices[i]; break; } }
    }
    if(v){ u.voice = v; }
    synth.speak(u);
  }catch(e){}
}
document.addEventListener('pointerdown', function(){ audioCtx(); }, { once: true });

    soundOn = !soundOn;
    btn.setAttribute('aria-pressed', String(soundOn));
    label.textContent = soundOn ? '音效' : '靜音';
    btn.setAttribute('aria-label', soundOn ? '關閉音效' : '開啟音效');
    if(soundOn){ sfx('tap'); toast('音效已開啟'); }
    else { toast('音效已關閉'); }
  });
})();

/* =========================================================
   練習場設定
   ========================================================= */
$$('#level-row .pick').forEach(function(b){
  b.addEventListener('click', function(){
    state.level = b.dataset.level;
    sfx('tap');
    $$('#level-row .pick').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
    updateSummary();
  });
});
$$('#mode-row .pick').forEach(function(b){
  b.addEventListener('click', function(){
    state.mode = b.dataset.mode;
    sfx('tap');
    $$('#mode-row .pick').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
    updateSummary();
  });
});
function updateSummary(){
  $('#start-summary').textContent = LEVEL_NAME[state.level] + '・' + MODE_NAME[state.mode] + '・六題';
}
$('#btn-start').addEventListener('click', function(){ sfx('tap'); startGame(); });
$('#btn-quit').addEventListener('click', function(){ sfx('tap'); resetGame(); });

/* =========================================================
   遊戲
   ========================================================= */
function startGame(){
  state.phase = 'playing';
  state.idx = 0;
  state.score = 0;
  state.answers = [];
  state.locked = false;
  state.bank = (state.mode === 'pick') ? BANK[state.level].pick : BANK[state.level].sort.items;
  state.bins = (state.mode === 'pick') ? null : BANK[state.level].sort.bins;
  $('#play-config').hidden = true;
  $('#play-result').hidden = true;
  $('#play-game').hidden = false;
  document.body.classList.add('playing');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function updateHud(){
  $('#q-count').textContent = '第 ' + (state.idx + 1) + ' / ' + QUIZ_LEN + ' 題';
  $('#q-left').textContent = '還剩 ' + (QUIZ_LEN - state.idx - 1) + ' 題';
  $('#score-chip').textContent = state.score + ' 分';
  $('#q-bar').style.width = ((state.idx) / QUIZ_LEN * 100) + '%';
}
function currentQuestion(){
  return state.bank[state.idx];
}
function sentenceHTML(q){
  return '<div class="qsent">' +
    (q.before ? '<div class="line before">' + q.before + '</div>' : '') +
    '<div class="line main">' + q.main + '</div>' +
    (q.after ? '<div class="line after">' + q.after + '</div>' : '') +
  '</div>';
}
function renderQuestion(){
  var q = currentQuestion();
  var stage = $('#stage');
  state.locked = false;
  updateHud();
  if(state.mode === 'pick'){
    var order = shuffle(q.opts.map(function(_, i){ return i; }));
    var letters = ['A', 'B', 'C', 'D'];
    stage.innerHTML = '<div class="qcard">' +
      '<div class="qart">' + (ART[q.art] || '') + '<span class="qtag">字義挑戰</span></div>' +
      sentenceHTML(q) +
      '<p class="qask">紅色的字，是哪一個意思？</p>' +
      '<div class="opts" id="opts" role="group" aria-label="選項">' +
        order.map(function(oi, n){
          return '<button type="button" class="opt" data-val="' + q.opts[oi].replace(/"/g, '&quot;') + '" data-oi="' + oi + '">' +
            '<span class="key">' + letters[n] + '</span><span class="txt">' + q.opts[oi] + '</span></button>';
        }).join('') +
      '</div>' +
      '<div id="fb-slot"></div>' +
    '</div>';
    $$('#opts .opt').forEach(function(btn){
      btn.addEventListener('click', function(){ answerPick(btn, q); });
    });
  } else {
    stage.innerHTML = '<div class="qcard">' +
      '<div class="qart">' + (ART[q.art] || '') + '<span class="qtag">分類高手</span></div>' +
      sentenceHTML(q) +
      '<p class="qask">紅色的字，該放進哪一籃？</p>' +
      '<div class="bins" id="bins" role="group" aria-label="分類籃">' +
        (state.bins || []).map(function(b){
          return '<button type="button" class="bin" data-bin="' + b.id + '">' +
            '<span class="ico">' + (ART[b.art] || '') + '</span>' +
            '<b>' + b.label + '</b><small>' + b.sub + '</small></button>';
        }).join('') +
      '</div>' +
      '<div id="fb-slot"></div>' +
    '</div>';
    $$('#bins .bin').forEach(function(btn){
      btn.addEventListener('click', function(){ answerSort(btn, q); });
    });
  }
}
function feedbackHTML(ok, q, answerLabel){
  var seal = ok
    ? '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#DDF0E8" stroke="#2A2118" stroke-width="3.4"/><path d="M18 33l10 10 19-22" stroke="#1E7A62" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#FBE2D8" stroke="#2A2118" stroke-width="3.4"/><path d="M22 22l20 20M42 22L22 42" stroke="#B23A24" stroke-width="6" fill="none" stroke-linecap="round"/></svg>';
  return '<div class="fb ' + (ok ? 'ok' : 'no') + '" tabindex="-1" role="status" aria-live="polite">' +
    '<div class="fb-head">' +
      '<span class="fb-seal">' + seal + '</span>' +
      '<div><b>' + (ok ? '答對了！' : '再想想，差一點') + '</b>' +
        '<span>' + (ok ? '偵探筆記已更新' : '看看提示，下一題就會了') + '</span></div>' +
    '</div>' +
    '<div class="fb-sentence">' + q.main.replace(/<em class="hl">/g, '<em class="hl">') + '</div>' +
    '<div class="fb-answer">正解：' + answerLabel + '</div>' +
    '<p class="fb-why"><b>為什麼：</b>' + q.why + '</p>' +
    '<p class="fb-trans">整句白話：' + q.trans + '</p>' +
    '<span class="fb-src">出處：' + q.src + '</span>' +
    '<div class="fb-actions"><button type="button" class="btn btn-dark" id="btn-next">' +
      (state.idx === QUIZ_LEN - 1 ? '看成績' : '下一題 →') +
    '</button></div>' +
  '</div>';
}
function reveal(ok, q, answerLabel, chosenEl, rightEl){
  state.locked = true;
  state.score += ok ? 1 : 0;
  state.answers.push({ q: q, ok: ok, answer: answerLabel });
  $('#score-chip').textContent = state.score + ' 分';
  $('#q-bar').style.width = ((state.idx + 1) / QUIZ_LEN * 100) + '%';
  if(chosenEl){ chosenEl.setAttribute('data-state', ok ? 'right' : 'wrong'); }
  if(rightEl && rightEl !== chosenEl){ rightEl.setAttribute('data-state', 'right'); }
  $$('#opts .opt, #bins .bin').forEach(function(el){
    if(el !== chosenEl && el !== rightEl){ el.setAttribute('data-state', 'muted'); }
  });
  sfx(ok ? 'right' : 'wrong');
  var slot = $('#fb-slot');
  slot.innerHTML = feedbackHTML(ok, q, answerLabel);
  var fb = $('.fb', slot);
  setTimeout(function(){
    if(!fb) return;
    fb.scrollIntoView({ block: 'center', behavior: scrollBehavior });
    try{ fb.focus({ preventScroll: true }); }catch(e){ fb.focus(); }
  }, 70);
  $('#btn-next').addEventListener('click', function(){
    sfx('tap');
    state.idx += 1;
    if(state.idx >= QUIZ_LEN){ showResult(); }
    else { renderQuestion(); window.scrollTo({ top: 0, behavior: 'auto' }); }
  });
}
function answerPick(btn, q){
  if(state.locked) return;
  var oi = Number(btn.dataset.oi);
  var ok = oi === q.ans;
  reveal(ok, q, q.opts[q.ans], btn, null);
}
function answerSort(btn, q){
  if(state.locked) return;
  var ok = btn.dataset.bin === q.bin;
  var right = $('#bins .bin[data-bin="' + q.bin + '"]');
  var bin = (state.bins || []).filter(function(b){ return b.id === q.bin; })[0];
  reveal(ok, q, bin ? bin.label : '—', btn, right);
}
function showResult(){
  state.phase = 'result';
  document.body.classList.remove('playing');
  $('#play-game').hidden = true;
  var stars = state.score === QUIZ_LEN ? 3 : (state.score >= 4 ? 2 : (state.score >= 1 ? 1 : 0));
  var starHTML = '';
  for(var i = 0; i < 3; i++){
    starHTML += (i < stars ? ART.star : ART.starOff);
  }
  var msg = stars === 3 ? '全對！你已經是字裡小偵探。' : (stars === 2 ? '很不錯，再練一次就滿分。' : (stars === 1 ? '已經抓到一點線索，再試一次。' : '別急，先回教學館看圖卡。'));
  var review = state.answers.map(function(a, i){
    return '<div class="rev-row ' + (a.ok ? 'ok' : 'no') + '">' +
      '<span class="rev-no">' + (i + 1) + '</span>' +
      '<span class="rev-main"><span class="s">' + plain(a.q.main) + '</span>' +
        '<span class="a">正解：' + a.answer + (a.ok ? '' : '・' + plain(a.q.why)) + '</span></span>' +
      '<span class="rev-mark">' + (a.ok ? '✓' : '✗') + '</span>' +
    '</div>';
  }).join('');
  var host = $('#play-result');
  host.innerHTML = '<div class="result-wrap">' +
    '<div class="result-hero">' +
      '<div class="stars" aria-label="得到 ' + stars + ' 顆星">' + starHTML + '</div>' +
      '<h2>' + (stars === 3 ? '漂亮破案！' : (stars >= 2 ? '線索都對上了' : '再查一次線索')) + '</h2>' +
      '<p class="result-score">答對 <b>' + state.score + '</b> / ' + QUIZ_LEN + ' 題</p>' +
      '<p class="result-msg">' + msg + '</p>' +
      '<div class="result-actions">' +
        '<button type="button" class="btn btn-red" id="btn-again">再玩一次</button>' +
        '<button type="button" class="btn btn-ghost" id="btn-switch">換一種玩法</button>' +
        '<button type="button" class="btn btn-ghost" id="btn-back-learn">回教學館</button>' +
      '</div>' +
    '</div>' +
    '<div class="review"><h3>逐題回顧</h3>' + review + '</div>' +
  '</div>';
  host.hidden = false;
  $('#btn-again').addEventListener('click', function(){ sfx('tap'); startGame(); });
  $('#btn-switch').addEventListener('click', function(){
    sfx('tap');
    state.mode = state.mode === 'pick' ? 'sort' : 'pick';
    $$('#mode-row .pick').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.mode === state.mode)); });
    updateSummary();
    startGame();
  });
  $('#btn-back-learn').addEventListener('click', function(){ sfx('tap'); resetGame(); showView('learn'); });
  sfx('win');
  window.scrollTo({ top: 0, behavior: scrollBehavior });
}

/* 鍵盤：1–4 作答 */
document.addEventListener('keydown', function(e){
  if(state.phase !== 'playing' || state.mode !== 'pick' || state.locked) return;
  if(!/^[1-4]$/.test(e.key)) return;
  var opts = $$('#opts .opt');
  var btn = opts[Number(e.key) - 1];
  if(btn){ e.preventDefault(); btn.click(); }
});

/* =========================================================
   初始化
   ========================================================= */
(function init(){
  $('#hero-mascot').innerHTML = ART.mascot;
  $$('[data-art]').forEach(function(el){ el.innerHTML = ART[el.dataset.art] || ''; });
  renderTeach();
  updateSummary();
  if(!canSpeech){
    $$('.speak').forEach(function(b){ b.disabled = true; b.title = '此裝置不支援語音朗讀'; });
  }
})();
</script>
</body>
</html>
