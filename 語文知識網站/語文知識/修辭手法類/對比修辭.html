<!DOCTYPE html>
<html lang="zh-Hant" data-scale="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>對比小偵探｜小學對比修辭互動遊戲</title>
<meta name="description" content="用卡通繪本風格教小學生認識對比修辭，含教學關卡與三種互動遊戲，支援手機、平板與電腦。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#2B2118;
  --ink-soft:#6E5C4A;
  --cream:#FFF8EC;
  --card:#FFFFFF;
  --orange:#FF9F1C;
  --orange-d:#DE7A00;
  --blue:#3AA6E8;
  --blue-d:#1C7EB8;
  --green:#2FBF8F;
  --green-d:#199A6F;
  --pink:#FF6B8B;
  --yellow:#FFE08A;
  --line:#2B2118;
  --r-lg:26px;
  --r-md:18px;
  --shadow:0 6px 0 rgba(43,33,24,.9);
  --shadow-sm:0 4px 0 rgba(43,33,24,.9);
}
html{font-size:18px;-webkit-text-size-adjust:100%;}
html[data-scale="lg"]{font-size:20.5px;}
html[data-scale="xl"]{font-size:23px;}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'PingFang TC','Microsoft JhengHei','Heiti TC','Noto Sans TC','Songti TC',sans-serif;
  color:var(--ink);
  line-height:1.65;
  background:
    radial-gradient(circle at 10% 6%, #FFE7C2 0, rgba(255,231,194,0) 42%),
    radial-gradient(circle at 92% 10%, #D8EEFF 0, rgba(216,238,255,0) 38%),
    radial-gradient(circle at 50% 104%, #DDF7EC 0, rgba(221,247,236,0) 45%),
    var(--cream);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:3rem;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:radial-gradient(rgba(43,33,24,.055) 1.4px, transparent 1.4px);
  background-size:22px 22px;
  pointer-events:none;z-index:0;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 1rem;position:relative;z-index:1;}
.screen{display:none;}
.screen.on{display:block;animation:pop .32s cubic-bezier(.2,.8,.2,1) both;}
@keyframes pop{from{transform:translateY(10px);opacity:.85}to{transform:none;opacity:1}}

/* ---------- 頂欄 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem 0;
  backdrop-filter:blur(10px);
  background:rgba(255,248,236,.86);
  border-bottom:2px dashed rgba(43,33,24,.16);
  margin-bottom:1rem;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.05rem;letter-spacing:.02em;}
.brand svg{width:32px;height:32px;flex-shrink:0;}
.spacer{flex:1;}
.chip-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  min-height:42px;padding:0 .8rem;
  border:2.5px solid var(--line);border-radius:999px;
  background:#fff;color:var(--ink);
  font-weight:800;font-size:.9rem;line-height:1;
  box-shadow:0 3px 0 var(--line);
  cursor:pointer;transition:transform .12s, box-shadow .12s;
  font-family:inherit;
}
.chip-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line);}
.chip-btn[aria-pressed="true"]{background:var(--yellow);}

/* ---------- 首頁 ---------- */
.hero{
  display:grid;grid-template-columns:1.15fr .85fr;gap:1.2rem;align-items:center;
  padding:1.4rem 1.3rem;margin-bottom:1.3rem;
  background:#fff;
  border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;bottom:-50px;
  width:180px;height:180px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#FFE08A 0 12deg,transparent 12deg 24deg);
  opacity:.45;
}
.hero h1{
  font-size:2.2rem;line-height:1.2;margin:0 0 .5rem;font-weight:900;letter-spacing:.01em;
}
.hero h1 .hl{
  background:linear-gradient(transparent 58%,var(--yellow) 58%);
  padding:0 .1em;
}
.hero p{margin:0;font-size:1rem;color:var(--ink-soft);font-weight:600;}
.tag-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.9rem;}
.tag{
  font-size:.78rem;font-weight:800;padding:.28rem .65rem;border-radius:999px;
  border:2px solid var(--line);background:#fff;
}
.tag.b{background:#E4F4FF;}
.tag.o{background:#FFEBD0;}
.tag.g{background:#DFF8EE;}
.hero-art{display:flex;justify-content:center;}
.hero-art svg{width:100%;max-width:260px;height:auto;}

.sec-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.15rem;font-weight:900;margin:1.6rem 0 .8rem;
}
.sec-title svg{width:26px;height:26px;flex-shrink:0;}

/* ---------- 難度卡（已修正 .lv-body 直向排列） ---------- */
.lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.lv-card{
  display:flex;gap:.85rem;align-items:flex-start;
  padding:1.05rem;border:3px solid var(--line);border-radius:var(--r-lg);
  background:#fff;box-shadow:var(--shadow-sm);
  text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  transition:transform .14s, box-shadow .14s, background .14s;
  position:relative;
}
.lv-card:hover{transform:translateY(-3px);box-shadow:0 7px 0 rgba(43,33,24,.9);}
.lv-card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,33,24,.9);}
.lv-card.low{background:linear-gradient(160deg,#FFFDF6,#FFF1D8);}
.lv-card.high{background:linear-gradient(160deg,#F9FDFF,#E2F3FF);}
.lv-icon{
  width:56px;height:56px;flex-shrink:0;border-radius:16px;
  border:2.5px solid var(--line);display:grid;place-items:center;background:#fff;
}
.lv-icon svg{width:34px;height:34px;}
.lv-body{display:flex;flex-direction:column;gap:.18rem;flex:1 1 auto;min-width:0;}
.lv-name{display:block;font-size:1.1rem;font-weight:900;line-height:1.35;}
.lv-desc{display:block;font-size:.86rem;color:var(--ink-soft);font-weight:600;line-height:1.5;}
.lv-meta{
  display:inline-block;margin-top:.35rem;font-size:.74rem;font-weight:800;
  padding:.15rem .5rem;border-radius:999px;background:rgba(43,33,24,.08);
}
.lv-arrow{position:absolute;right:.9rem;top:.9rem;width:22px;height:22px;opacity:.5;}

.note-box{
  margin-top:1.2rem;padding:.85rem 1rem;border-radius:var(--r-md);
  border:2.5px dashed var(--line);background:#FFFCF2;
  font-size:.9rem;font-weight:700;color:var(--ink-soft);
  display:flex;gap:.6rem;align-items:flex-start;
}
.note-box svg{width:22px;height:22px;flex-shrink:0;margin-top:.15rem;}

/* ---------- 關卡地圖 ---------- */
.map-head{
  display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;
}
.back-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  min-height:44px;padding:0 .85rem;border:2.5px solid var(--line);border-radius:999px;
  background:#fff;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 0 var(--line);color:var(--ink);
}
.back-btn:active{transform:translateY(3px);box-shadow:none;}
.map-title{font-size:1.3rem;font-weight:900;margin:0;}
.map-sub{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin:0;}

.node-list{display:flex;flex-direction:column;gap:.85rem;position:relative;}
.node{
  display:flex;gap:.9rem;align-items:center;
  padding:1rem 1.1rem;background:#fff;
  border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit;
  color:var(--ink);text-align:left;transition:transform .14s;
  width:100%;
}
.node:hover{transform:translateX(4px);}
.node:active{transform:scale(.99);}
.node-num{
  width:52px;height:52px;flex-shrink:0;border-radius:50%;
  border:2.5px solid var(--line);display:grid;place-items:center;
  font-weight:900;font-size:1.15rem;background:var(--yellow);
}
.node.teach .node-num{background:#FFD9A0;}
.node.m1 .node-num{background:#CDEBFF;}
.node.m2 .node-num{background:#D8F7E8;}
.node.m3 .node-num{background:#FFE1E8;}
.node-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem;}
.node-name{font-size:1.02rem;font-weight:900;line-height:1.4;}
.node-desc{font-size:.84rem;color:var(--ink-soft);font-weight:600;line-height:1.5;}
.node-right{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;flex-shrink:0;}
.stars{display:flex;gap:2px;}
.stars svg{width:16px;height:16px;}
.node-cta{font-size:.74rem;font-weight:800;color:var(--orange-d);white-space:nowrap;}

/* ---------- 教學頁 ---------- */
.teach-card{
  background:#fff;border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:1.3rem;position:relative;overflow:hidden;
}
.teach-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--orange);
}
.teach-inner{padding-left:.6rem;}
.teach-tag{
  display:inline-block;font-size:.75rem;font-weight:900;padding:.2rem .6rem;
  border-radius:999px;border:2px solid var(--line);background:var(--yellow);margin-bottom:.6rem;
}
.teach-h{font-size:1.5rem;font-weight:900;margin:.1rem 0 .5rem;line-height:1.3;}
.teach-lead{font-size:1rem;font-weight:600;color:var(--ink-soft);margin:0 0 1rem;}
.teach-art{display:flex;justify-content:center;margin:.4rem 0 1rem;}
.teach-art svg{width:100%;max-width:300px;height:auto;}
.points{display:flex;flex-direction:column;gap:.7rem;}
.point{
  display:flex;gap:.7rem;align-items:flex-start;
  padding:.8rem .9rem;border-radius:var(--r-md);
  background:#FFFBF0;border:2px solid rgba(43,33,24,.14);
}
.point .dot{
  width:30px;height:30px;flex-shrink:0;border-radius:9px;
  border:2.5px solid var(--line);display:grid;place-items:center;
  font-weight:900;font-size:.85rem;background:#FFD9A0;
}
.point .dot.blue{background:#CDEBFF;}
.point .dot.green{background:#D8F7E8;}
.point .dot.pink{background:#FFE1E8;}
.point-text{font-size:.95rem;font-weight:600;line-height:1.6;}
.point-text b{font-weight:900;}
.ex-chip{
  display:inline-block;margin-top:.3rem;padding:.2rem .55rem;border-radius:8px;
  background:#fff;border:2px dashed rgba(43,33,24,.3);
  font-size:.9rem;font-weight:800;
}
.warn-item{
  border-left:6px solid var(--pink);
  background:#FFF6F8;
}
.teach-nav{display:flex;gap:.7rem;justify-content:space-between;margin-top:1.2rem;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  min-height:52px;padding:0 1.3rem;border-radius:999px;
  border:3px solid var(--line);font-weight:900;font-size:1rem;
  cursor:pointer;font-family:inherit;color:var(--ink);
  background:#fff;box-shadow:0 4px 0 var(--line);
  transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:none;}
.btn.primary{background:var(--orange);color:#3A2400;}
.btn.blue{background:#BFE6FF;}
.btn.ghost{background:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 4px 0 rgba(43,33,24,.3);}

/* ---------- 遊戲 ---------- */
.game-shell{
  background:#fff;border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:1.15rem;
}
.game-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;flex-wrap:wrap;}
.game-mode{font-size:1.02rem;font-weight:900;margin:0;}
.game-count{font-size:.85rem;font-weight:800;color:var(--ink-soft);margin-left:auto;}
.bar{
  height:16px;border-radius:999px;background:#F0E6D6;
  border:2.5px solid var(--line);overflow:hidden;margin-bottom:1.1rem;
}
.bar-fill{
  height:100%;width:0%;background:linear-gradient(90deg,var(--orange),#FFC85C);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
.q-text{
  font-size:1.25rem;font-weight:900;line-height:1.55;margin:.2rem 0 1.1rem;
  padding:.9rem 1rem;border-radius:var(--r-md);
  background:#FFFCF2;border:2.5px dashed rgba(43,33,24,.25);
}
.q-text:focus{outline:3px solid var(--blue);outline-offset:3px;}
.opts{display:flex;flex-direction:column;gap:.65rem;}
.opt{
  display:flex;align-items:center;gap:.75rem;
  padding:.85rem 1rem;border-radius:var(--r-md);
  border:2.5px solid var(--line);background:#fff;
  font-size:1.02rem;font-weight:700;line-height:1.5;
  cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;
  box-shadow:0 3px 0 rgba(43,33,24,.85);
  transition:transform .12s, box-shadow .12s, background .18s;
  min-height:56px;
}
.opt:hover:not(:disabled){background:#FFF9EC;}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:none;}
.opt .key{
  width:32px;height:32px;flex-shrink:0;border-radius:50%;
  border:2px solid var(--line);display:grid;place-items:center;
  font-weight:900;font-size:.88rem;background:#F3EADC;
}
.opt.correct{background:#DFF8EE;border-color:var(--green-d);}
.opt.correct .key{background:var(--green);color:#fff;}
.opt.wrong{background:#FFE6EB;border-color:#D63B5C;}
.opt.wrong .key{background:var(--pink);color:#fff;}
.opt:disabled{cursor:default;}
.opt.dim{opacity:.55;}

.explain{
  margin-top:.95rem;padding:.9rem 1rem;border-radius:var(--r-md);
  border:2.5px solid var(--line);background:#F2FBF7;
  display:none;
}
.explain.on{display:block;animation:pop .3s both;}
.explain.bad{background:#FFF4F6;}
.ex-head{display:flex;align-items:center;gap:.45rem;font-weight:900;font-size:1rem;margin-bottom:.35rem;}
.ex-head svg{width:22px;height:22px;flex-shrink:0;}
.ex-body{font-size:.94rem;font-weight:600;line-height:1.65;color:#3C3229;}
.game-actions{display:flex;justify-content:flex-end;margin-top:.9rem;}

/* ---------- 成績 ---------- */
.result-card{
  background:#fff;border:3px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:1.6rem 1.2rem;text-align:center;
  position:relative;overflow:hidden;
}
.result-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% -20%,rgba(255,224,138,.65),transparent 60%);
  pointer-events:none;
}
.result-emoji{display:none;}
.big-stars{display:flex;justify-content:center;gap:.5rem;margin:.5rem 0 .2rem;}
.big-stars svg{width:56px;height:56px;}
.score-num{font-size:2.6rem;font-weight:900;line-height:1.1;margin:.3rem 0;}
.score-num small{font-size:1.1rem;color:var(--ink-soft);font-weight:800;}
.result-msg{font-size:1rem;font-weight:700;color:var(--ink-soft);margin:.3rem 0 1.1rem;}
.result-acts{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;}

/* ---------- 響應式 ---------- */
@media (max-width:820px){
  .hero{grid-template-columns:1fr;text-align:left;}
  .hero-art{order:-1;max-width:200px;}
  .hero h1{font-size:1.85rem;}
  .lv-grid{grid-template-columns:1fr;}
}
@media (max-width:560px){
  html{font-size:17px;}
  .wrap{padding:0 .85rem;}
  .hero{padding:1.05rem;border-radius:22px;}
  .hero h1{font-size:1.6rem;}
  .hero-art{display:none;}
  .game-shell,.teach-card{padding:.95rem;border-radius:22px;}
  .q-text{font-size:1.12rem;padding:.8rem .85rem;}
  .opt{font-size:.98rem;padding:.75rem .8rem;}
  .btn{width:100%;}
  .teach-nav .btn{width:100%;}
  .node{padding:.85rem .9rem;gap:.7rem;}
  .node-num{width:44px;height:44px;font-size:1rem;}
  .node-cta{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>

    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">

<!-- 首頁 -->
<main class="wrap">
<section class="screen on" id="screen-home" aria-label="首頁">
  <div class="hero">

        <g>

        </g>
      </svg>
    </div>

/* ========== 畫面切換 ========== */
function showScreen(id) {
  var all = document.querySelectorAll('.screen');
  for (var i = 0; i < all.length; i++) { all[i].classList.remove('on'); }
  var el = document.getElementById('screen-' + id);
  if (el) { el.classList.add('on'); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ========== 地圖 ========== */
function renderMap() {
  var lv = S.level;
  document.getElementById('mapTitle').textContent = META[lv].label + ' · 關卡地圖';
  document.getElementById('mapSub').textContent = lv === 'low'
    ? '先學會四個小法寶，再挑戰三種遊戲'
    : '先分清對比與比喻，再挑戰三種進階遊戲';

  var list = document.getElementById('nodeList');
  list.innerHTML = '';
  var order = META[lv].order;

  for (var i = 0; i < order.length; i++) {
    var key = order[i];
    var isTeach = key === 'teach';
    var data = isTeach ? null : BANK[lv][key];
    var bestScore = S.best[lv + '_' + key];
    var has = typeof bestScore === 'number';

    var btn = document.createElement('button');
    btn.className = 'node ' + key;
    btn.setAttribute('type', 'button');
    btn.setAttribute('data-mode', key);

    var starsHTML = '';
    if (isTeach) {
      starsHTML = '';
    } else {
      var n = has ? starsFor(bestScore) : 0;
      starsHTML = '<div class="stars" aria-label="最佳成績 ' + (has ? bestScore : 0) + ' 分">' +
        I.star(n >= 1 ? '#FFCC3D' : '#E6DCCB') +
        I.star(n >= 2 ? '#FFCC3D' : '#E6DCCB') +
        I.star(n >= 3 ? '#FFCC3D' : '#E6DCCB') + '</div>';
    }

    btn.innerHTML =
      '<span class="node-num">' + (i + 1) + '</span>' +
      '<span class="node-body">' +
        '<span class="node-name">' + (isTeach ? '圖解教學' : data.name) + '</span>' +
        '<span class="node-desc">' + (isTeach ? '用圖和例子認識對比的核心概念' : data.desc) + '</span>' +
      '</span>' +
      '<span class="node-right">' + starsHTML +
        '<span class="node-cta">' + (isTeach ? '開始學習' : '開始挑戰') + '</span>' +
      '</span>';

    btn.addEventListener('click', (function (m) {
      return function () {
        sfx('tap');
        if (m === 'teach') { openTeach(); }
        else { startGame(m); }
      };
    })(key));

    list.appendChild(btn);
  }
}

function starsFor(score) {
  if (score >= 6) return 3;
  if (score >= 4) return 2;
  if (score >= 1) return 1;
  return 0;
}

/* ========== 教學 ========== */
function openTeach() {
  S.teachPage = 0;
  renderTeach();
  showScreen('teach');
}

function renderTeach() {
  var pages = TEACH[S.level];
  var p = pages[S.teachPage];
  var html =
    '<span class="teach-tag">' + p.tag + '</span>' +
    '<h2 class="teach-h">' + p.h + '</h2>' +
    '<p class="teach-lead">' + p.lead + '</p>' +
    '<div class="teach-art">' + artSVG(p.art) + '</div>' +
    '<div class="points">';

  var cls = { o: '', b: 'blue', g: 'green', p: 'pink' };
  for (var i = 0; i < p.points.length; i++) {
    var pt = p.points[i];
    html += '<div class="point' + (pt.c === 'p' ? ' warn-item' : '') + '">' +
      '<span class="dot ' + (cls[pt.c] || '') + '">' + (i + 1) + '</span>' +
      '<span class="point-text">' + pt.t + '</span>' +
    '</div>';
  }
  html += '</div>';
  document.getElementById('teachInner').innerHTML = html;

  var prev = document.getElementById('teachPrev');
  var next = document.getElementById('teachNext');
  prev.disabled = S.teachPage === 0;
  next.textContent = S.teachPage === pages.length - 1 ? '學完了，回地圖' : '下一頁';
}

document.getElementById('teachPrev').addEventListener('click', function () {
  if (S.teachPage > 0) { S.teachPage--; sfx('page'); renderTeach(); }
});
document.getElementById('teachNext').addEventListener('click', function () {
  var pages = TEACH[S.level];
  if (S.teachPage < pages.length - 1) {
    S.teachPage++; sfx('page'); renderTeach();
  } else {
    sfx('tap'); renderMap(); showScreen('map');
  }
});

/* ========== 遊戲 ========== */
function startGame(mode) {
  S.mode = mode;
  S.idx = 0;
  S.score = 0;
  S.answered = false;
  document.getElementById('gameMode').textContent = BANK[S.level][mode].name;
  renderQ();
  showScreen('game');
}

function renderQ() {
  var data = BANK[S.level][S.mode];
  var item = data.items[S.idx];
  S.answered = false;

  document.getElementById('gameCount').textContent = '第 ' + (S.idx + 1) + ' / ' + data.items.length + ' 題';
  document.getElementById('barFill').style.width = (S.idx / data.items.length * 100) + '%';
  var bar = document.getElementById('progressBar');
  bar.setAttribute('aria-valuenow', String(S.idx));
  bar.setAttribute('aria-valuemax', String(data.items.length));

  var qEl = document.getElementById('qText');
  qEl.textContent = item.q;

  var box = document.getElementById('opts');
  box.innerHTML = '';
  var letters = ['A', 'B', 'C', 'D'];

  for (var i = 0; i < item.o.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('data-i', String(i));
    b.innerHTML = '<span class="key">' + letters[i] + '</span><span>' + item.o[i] + '</span>';
    b.addEventListener('click', onPick);
    box.appendChild(b);
  }

  var ex = document.getElementById('explain');
  ex.classList.remove('on', 'bad');
  document.getElementById('nextBtn').style.display = 'none';
  qEl.focus({ preventScroll: true });
}

function onPick(e) {
  if (S.answered) return;
  S.answered = true;

  var data = BANK[S.level][S.mode];
  var item = data.items[S.idx];
  var picked = parseInt(e.currentTarget.getAttribute('data-i'), 10);
  var correct = picked === item.a;

  var opts = document.querySelectorAll('#opts .opt');
  for (var i = 0; i < opts.length; i++) {
    var btn = opts[i];
    btn.disabled = true;
    var idx = parseInt(btn.getAttribute('data-i'), 10);
    if (idx === item.a) { btn.classList.add('correct'); }
    else if (idx === picked) { btn.classList.add('wrong'); }
    else { btn.classList.add('dim'); }
  }

  var ex = document.getElementById('explain');
  var head = document.getElementById('exHead');
  ex.classList.add('on');
  ex.classList.remove('bad');

  if (correct) {
    S.score++;
    sfx('right');
    document.getElementById('exTitle').textContent = '答對了！';
    head.innerHTML = I.check + '<span>答對了！</span>';
  } else {
    sfx('wrong');
    ex.classList.add('bad');
    head.innerHTML = I.close + '<span>再想一想</span>';
  }
  document.getElementById('exBody').innerHTML = '<b>說明：</b>' + item.why;

  document.getElementById('barFill').style.width = ((S.idx + 1) / data.items.length * 100) + '%';
  document.getElementById('progressBar').setAttribute('aria-valuenow', String(S.idx + 1));

  var next = document.getElementById('nextBtn');
  next.style.display = 'inline-flex';
  next.textContent = (S.idx === data.items.length - 1) ? '看成績' : '下一題';
  next.focus({ preventScroll: true });
  next.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('nextBtn').addEventListener('click', function () {
  var data = BANK[S.level][S.mode];
  sfx('tap');
  if (S.idx < data.items.length - 1) {
    S.idx++;
    renderQ();
  } else {
    finish();
  }
});

function finish() {
  var total = BANK[S.level][S.mode].items.length;
  var key = S.level + '_' + S.mode;
  if (typeof S.best[key] !== 'number' || S.score > S.best[key]) {
    S.best[key] = S.score;
    saveBest();
  }

  var n = starsFor(S.score);
  var starsHTML = '';
  for (var i = 0; i < 3; i++) {
    starsHTML += I.star(i < n ? '#FFCC3D' : '#E6DCCB');
  }
  document.getElementById('bigStars').innerHTML = starsHTML;
  document.getElementById('scoreNum').innerHTML = S.score + ' <small>/ ' + total + ' 題</small>';

  var msg;
  if (S.score === total) { msg = '全對！你已經是對比修辭小達人了。'; }
  else if (S.score >= total - 2) { msg = '很不錯！再複習一下說明，就更穩了。'; }
  else if (S.score >= 2) { msg = '有抓到感覺了，回教學頁再看一次小法寶吧。'; }
  else { msg = '別灰心，先看圖解教學，再回來挑戰一次。'; }
  document.getElementById('resultMsg').textContent = msg;

  sfx('win');
  showScreen('result');
}

document.getElementById('retryBtn').addEventListener('click', function () {
  startGame(S.mode);
});

/* ========== 全域事件 ========== */
document.querySelectorAll('[data-level]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    S.level = btn.getAttribute('data-level');
    sfx('tap');
    renderMap();
    showScreen('map');
  });
});

document.querySelectorAll('[data-go]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var to = btn.getAttribute('data-go');
    sfx('tap');
    if (to === 'map') { renderMap(); }
    showScreen(to);
  });
});

var soundBtn = document.getElementById('soundBtn');
function paintSound() {
  soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  document.getElementById('soundTxt').textContent = soundOn ? '音效開' : '音效關';
}
soundBtn.addEventListener('click', function () {
  soundOn = !soundOn;
  try { localStorage.setItem('cd_sound', soundOn ? '1' : '0'); } catch (e) {}
  paintSound();
  if (soundOn) { sfx('tap'); }
});

var scaleBtn = document.getElementById('scaleBtn');
var SCALES = ['md', 'lg', 'xl'];
var SCALE_TXT = ['大字', '更大', '最大'];
function paintScale() {
  var cur = document.documentElement.getAttribute('data-scale');
  var i = SCALES.indexOf(cur);
  if (i < 0) i = 0;
  document.getElementById('scaleTxt').textContent = SCALE_TXT[i];
}
scaleBtn.addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-scale');
  var i = SCALES.indexOf(cur);
  if (i < 0) i = 0;
  var next = SCALES[(i + 1) % SCALES.length];
  document.documentElement.setAttribute('data-scale', next);
  try { localStorage.setItem('cd_scale', next); } catch (e) {}
  paintScale();
  sfx('tap');
});

(function init() {
  paintSound();
  try {
    var sc = localStorage.getItem('cd_scale');
    if (sc && SCALES.indexOf(sc) >= 0) { document.documentElement.setAttribute('data-scale', sc); }
  } catch (e) {}
  paintScale();
})();
</script>
</div>
</body>
</html>
