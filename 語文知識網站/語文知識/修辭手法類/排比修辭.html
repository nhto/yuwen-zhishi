<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排比島｜排比修辭互動教室</title>
<meta name="description" content="初小與高小兩版排比修辭圖文教學，配三種互動遊戲、每種六題，揭曉答案附解釋與音效。">
<meta name="theme-color" content="#FFF7E8">
<style>
/* ============ tokens ============ */
:root{
  --paper:#FFF7E8;
  --paper-2:#FFEED4;
  --ink:#252130;
  --ink-2:#585064;
  --ink-3:#8B8397;
  --white:#fff;
  --coral:#FF6B5A;
  --coral-2:#FFDED7;
  --teal:#1FB6A6;
  --teal-2:#D3F3EE;
  --sun:#FFC53D;
  --sun-2:#FFEFC2;
  --grape:#7B5CD6;
  --grape-2:#E8E1FF;
  --sky:#4FA8E8;
  --sky-2:#DDEEFC;
  --ok:#1E9E62;
  --no:#D9453A;
  --lvl:var(--coral);
  --lvl-2:var(--coral-2);
  --line:3px solid var(--ink);
  --shadow:0 6px 0 rgba(37,33,48,.14);
  --r-xl:28px;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --display:"Noto Serif TC","Songti TC","STSong","Noto Serif CJK TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:74px}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:900;line-height:1.25;letter-spacing:.01em;margin:0}
p{margin:0}
button{font-family:inherit}
svg{display:block}
svg.icon{width:22px;height:22px;flex:0 0 auto}

/* ============ background ============ */
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-deco::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(37,33,48,.13) 1.1px,transparent 1.1px);
  background-size:24px 24px;opacity:.42;
}
.blob{position:absolute;border-radius:50%;opacity:.55}
.b1{width:270px;height:270px;background:var(--sun-2);top:-90px;right:-90px}
.b2{width:230px;height:230px;background:var(--coral-2);bottom:8%;left:-130px}
.b3{width:190px;height:190px;background:var(--teal-2);top:46%;right:-105px}

/* ============ layout ============ */
#app{
  position:relative;z-index:1;width:100%;max-width:900px;margin:0 auto;
  padding:0 18px calc(28px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
.screen{flex:1;padding-top:2px}
.screen.enter{animation:screenIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:.9;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ topbar ============ */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;
  padding:11px 0 9px;
  background:linear-gradient(180deg,var(--paper) 74%,rgba(255,247,232,0));
}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;
  border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);
  box-shadow:0 3px 0 rgba(37,33,48,.2);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(37,33,48,.2)}
.icon-btn.is-hidden{visibility:hidden}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:none;border:none;padding:0;color:var(--ink)}
.brand-mark{width:36px;height:36px;display:grid;place-items:center;background:var(--teal-2);border:2.5px solid var(--ink);border-radius:11px;overflow:hidden}
.brand-mark svg{width:30px;height:30px}
.brand-text{font-weight:900;letter-spacing:.14em;font-size:14.5px}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:2px solid var(--ink);
  border-radius:99px;background:#fff;font-size:12px;font-weight:800;letter-spacing:.05em;white-space:nowrap;
}
.chip.junior{background:var(--coral-2)}
.chip.senior{background:var(--teal-2)}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 20px;
  border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);
  font-size:16px;font-weight:800;cursor:pointer;text-align:center;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--lvl)}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:0 3px 0 var(--ink);transform:none}
.btn svg{width:20px;height:20px}
.btn.small{min-height:44px;font-size:14px;padding:8px 14px;border-width:2.5px}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:2px solid var(--ink);
  border-radius:99px;background:var(--lvl-2);font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--ink);
}

/* ============ home ============ */
.hero{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;padding:8px 0 4px;position:relative}
.hero-copy{position:relative;z-index:1}
.hero-eyebrow{
  display:inline-block;transform:rotate(-2deg);background:var(--sun);border:2px solid var(--ink);
  padding:3px 12px;border-radius:7px;font-size:12px;font-weight:800;letter-spacing:.14em;
}
.hero-title{
  font-family:var(--display);font-size:clamp(50px,15vw,82px);line-height:.98;
  letter-spacing:.05em;margin:12px 0 8px;font-weight:900;
}
.hero-title em{font-style:normal;color:var(--coral);position:relative;display:inline-block;z-index:0}
.hero-title em::after{
  content:"";position:absolute;left:2px;right:0;bottom:3px;height:12px;
  background:var(--sun);opacity:.6;border-radius:6px;z-index:-1;transform:rotate(-1deg);
}
.hero-sub{color:var(--ink-2);font-size:16px;max-width:33ch;margin:0 0 14px;line-height:1.7}
.hero-sub b{color:var(--ink)}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px}
.hero-tags span{
  font-size:12px;font-weight:800;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff;
}
.hero-art{position:relative;display:flex;justify-content:center;padding:2px 0 8px}
.hero-art .mascot-wrap{width:min(52vw,210px)}
.hero-art svg{width:100%;height:auto;animation:bob 4.2s ease-in-out infinite}
.hero-badge{
  position:absolute;right:10%;top:2%;width:56px;height:56px;display:grid;place-items:center;
  background:var(--sun);border:3px solid var(--ink);border-radius:50%;
  font-weight:900;font-size:18px;transform:rotate(9deg);box-shadow:0 4px 0 rgba(37,33,48,.2);
}
.hero-dot{
  position:absolute;border-radius:50%;border:2.5px solid var(--ink);
}
.hd1{width:14px;height:14px;background:var(--coral);left:8%;bottom:20%}
.hd2{width:10px;height:10px;background:var(--teal);right:14%;bottom:30%}
.hd3{width:8px;height:8px;background:var(--grape);left:20%;top:12%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}

.section-title{font-size:20px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:10px;height:22px;background:var(--lvl);border:2px solid var(--ink);border-radius:4px;flex:0 0 auto}

.level-grid{display:grid;grid-template-columns:1fr;gap:14px}
.level-card{
  position:relative;overflow:hidden;text-align:left;padding:20px 18px 18px;
  border:3px solid var(--ink);border-radius:24px;background:#fff;color:var(--ink);
  box-shadow:0 6px 0 rgba(37,33,48,.16);cursor:pointer;font-family:inherit;
  transition:transform .15s ease,box-shadow .15s ease;
}
.level-card:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(37,33,48,.16)}
.level-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(37,33,48,.16)}
.level-card.junior{--c:var(--coral);--c2:var(--coral-2)}
.level-card.senior{--c:var(--teal);--c2:var(--teal-2)}
.level-card::after{
  content:"";position:absolute;width:150px;height:150px;right:-54px;bottom:-66px;border-radius:50%;
  background:var(--c2);z-index:0;
}
.level-card>*{position:relative;z-index:1}
.level-card .num{
  position:absolute;right:12px;top:2px;font-family:var(--display);font-size:58px;font-weight:900;
  color:rgba(37,33,48,.07);line-height:1;
}
.level-card h3{font-size:24px;margin:8px 0 2px}
.level-card .range{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:.06em}
.level-card ul{list-style:none;padding:0;margin:12px 0 16px;display:grid;gap:6px}
.level-card li{font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.level-card li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-top:7px;flex:0 0 auto}
.level-card .go{
  display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14.5px;
  padding:8px 14px;border-radius:10px;background:var(--c);border:2px solid var(--ink);
}
.level-card .go svg{width:17px;height:17px}
.footnote{font-size:12.5px;color:var(--ink-3);margin-top:18px;text-align:center}

/* ============ level screen ============ */
.level-hero{
  display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;
  background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.level-hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 100% 0,var(--lvl-2),transparent 62%);
}
.level-hero>*{position:relative;z-index:1}
.level-hero .lv-art svg{width:100%;height:auto;animation:bob 5s ease-in-out infinite}
.level-hero h1{font-size:clamp(22px,6vw,28px);margin:6px 0 2px}
.level-hero .tagline{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.level-stars{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;margin-top:8px;
  background:#fff;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;
}
.level-stars svg{width:14px;height:14px}

.action-grid{display:grid;gap:12px;margin-top:14px}
.action-card{
  display:flex;align-items:center;gap:14px;text-align:left;padding:15px 16px;
  border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);
  box-shadow:0 5px 0 rgba(37,33,48,.16);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.action-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(37,33,48,.16)}
.action-icon{
  width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
  border:2.5px solid var(--ink);flex:0 0 auto;
}
.action-icon svg{width:26px;height:26px}
.action-card.learn .action-icon{background:var(--sun-2)}
.action-card.play .action-icon{background:var(--lvl-2)}
.action-card .ac-body{display:flex;flex-direction:column;min-width:0}
.action-card strong{font-size:17px}
.action-card .ac-body span{font-size:13px;color:var(--ink-2)}
.action-card>svg:last-child{margin-left:auto;color:var(--ink-3);width:20px;height:20px}

/* ============ mode list ============ */
.page-head{margin:8px 0 4px}
.page-head h1{font-size:clamp(28px,8vw,38px);margin:8px 0 6px}
.page-head p{font-size:15px;color:var(--ink-2);max-width:40ch}
.mode-list{display:grid;gap:12px;margin-top:16px}
.mode-card{
  display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;
  border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);
  box-shadow:0 5px 0 rgba(37,33,48,.16);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.mode-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(37,33,48,.16)}
.mode-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:2.5px solid var(--ink);flex:0 0 auto}
.mode-icon svg{width:25px;height:25px}
.mode-icon.coral{background:var(--coral-2)}
.mode-icon.teal{background:var(--teal-2)}
.mode-icon.grape{background:var(--grape-2)}
.mode-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.mode-body strong{font-size:17px}
.mode-body>span{font-size:13px;color:var(--ink-2);line-height:1.45}
.stars-row{display:flex;align-items:center;gap:3px;margin-top:4px}
.stars-row svg{width:14px;height:14px}
.stars-row em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:700;margin-left:4px}
.mode-card>svg:last-child{margin-left:auto;color:var(--ink-3);width:20px;height:20px;flex:0 0 auto}
.back-link{
  display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:8px 2px;
  background:none;border:none;color:var(--ink-2);font-size:14px;font-weight:800;cursor:pointer;
  border-bottom:2px dashed var(--ink-3);
}
.back-link svg{width:18px;height:18px}

/* ============ lesson ============ */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.lesson-count{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dot.on{background:var(--lvl);transform:scale(1.15)}
.lesson-card{
  border:3px solid var(--ink);border-radius:28px;background:#fff;overflow:hidden;
  box-shadow:0 7px 0 rgba(37,33,48,.16);
}
.lesson-art{position:relative;border-bottom:3px solid var(--ink);background:var(--sun-2)}
.lesson-art svg{width:100%;height:auto}
.lesson-body{padding:18px 17px 22px}
.lesson-body h1{font-size:clamp(23px,6.4vw,30px);margin:0 0 8px}
.lesson-lead{font-size:15.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.7}
.points{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.points li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.6}
.points li svg{width:20px;height:20px;margin-top:3px;color:var(--lvl);flex:0 0 auto}
.example{border:2.5px dashed var(--ink);border-radius:16px;padding:12px 14px;background:var(--sun-2);margin-bottom:14px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ex-head>span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--ink)}
.ex-head svg{width:16px;height:16px}
.example p{margin:0;font-size:16px;font-weight:700;line-height:1.72}
.mini-btn{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  padding:5px 9px;border:2px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);cursor:pointer;
  white-space:nowrap;
}
.mini-btn svg{width:14px;height:14px}
.mini-btn:active{transform:translateY(1px)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--teal-2);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.tip svg{width:20px;height:20px;flex:0 0 auto;margin-top:2px}
.tip p{font-size:14.5px;line-height:1.55;margin:0}
.lesson-nav{display:flex;gap:10px;margin-top:16px}
.lesson-nav .btn{flex:1;min-width:0;font-size:15px;padding:10px 8px}

.table-wrap{margin:0 0 16px;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
.cmp th{background:var(--lvl-2);text-align:left;padding:9px 10px;font-size:12.5px;border-bottom:2.5px solid var(--ink);letter-spacing:.04em}
.cmp td{padding:10px;border-bottom:1.5px solid rgba(37,33,48,.14);vertical-align:top;line-height:1.5}
.cmp tr:last-child td{border-bottom:none}

/* ============ quiz ============ */
.quiz-wrap{max-width:760px;margin:0 auto}
.quiz-top{margin:6px 0 14px}
.quiz-info{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quiz-count{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lvl);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qcard{
  border:3px solid var(--ink);border-radius:26px;background:#fff;padding:17px;
  box-shadow:0 7px 0 rgba(37,33,48,.16);
}
.qtype{
  display:inline-block;font-size:11px;font-weight:900;letter-spacing:.16em;padding:3px 10px;
  border:2px solid var(--ink);border-radius:99px;background:var(--sun-2);margin-bottom:10px;
}
.qprompt{font-size:clamp(18px,5vw,23px);line-height:1.58;margin:0 0 8px;font-weight:800;letter-spacing:.01em}
.qprompt .quote{color:var(--ink)}
.qhint{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin:2px 0 10px}
.qhint svg{width:15px;height:15px;flex:0 0 auto}
.options{display:grid;gap:10px;margin-top:12px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 13px;min-height:58px;border:2.5px solid var(--ink);border-radius:16px;
  background:#fff;color:var(--ink);font-size:15.5px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 0 rgba(37,33,48,.16);
  transition:transform .1s ease,box-shadow .1s ease,background .15s ease;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(37,33,48,.16)}
.opt-key{
  width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);
  display:grid;place-items:center;font-weight:900;font-size:13.5px;flex:0 0 auto;
}
.opt-key svg{width:18px;height:18px}
.opt-text{flex:1;min-width:0;line-height:1.5}
.opt.is-correct{background:#DCF6E7;border-color:rgba(30,158,98,.9)}
.opt.is-correct .opt-key{background:var(--ok);color:#fff}
.opt.is-wrong{background:#FFE4DE;border-color:rgba(217,69,58,.9)}
.opt.is-wrong .opt-key{background:var(--no);color:#fff}
.opt:disabled{cursor:default;opacity:1}

.order-area{margin-top:12px}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{
  display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:7px 10px;
  border:2.5px dashed rgba(37,33,48,.35);border-radius:14px;background:var(--paper);
  font-family:inherit;font-size:14px;color:var(--ink-3);text-align:left;
}
.slot.filled{
  border-style:solid;border-color:var(--ink);background:#fff;color:var(--ink);font-weight:700;
  box-shadow:0 3px 0 rgba(37,33,48,.14);cursor:pointer;
}
.slot.filled:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(37,33,48,.14)}
.slot-no{
  width:26px;height:26px;border-radius:50%;background:var(--lvl-2);border:2px solid var(--ink);
  display:grid;place-items:center;font-size:11.5px;font-weight:900;flex:0 0 auto;color:var(--ink);
}
.slot-text{flex:1;min-width:0;line-height:1.45}
.pieces{display:grid;gap:8px;margin-bottom:12px}
.piece{
  padding:11px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--sky-2);
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 rgba(37,33,48,.16);text-align:left;line-height:1.45;
  transition:transform .1s ease,box-shadow .1s ease;
}
.piece:disabled{opacity:.42;cursor:default;transform:none;box-shadow:none}
.piece:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(37,33,48,.16)}
.piece.used{display:none}

.feedback{margin-top:16px;border:3px solid var(--ink);border-radius:20px;padding:14px;animation:fbIn .26s ease}
.feedback.ok{background:#E7F8EF}
.feedback.no{background:#FFEDE8}
.fb-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.fb-head>svg{width:28px;height:28px;flex:0 0 auto}
.feedback.ok .fb-head>svg{color:var(--ok)}
.feedback.no .fb-head>svg{color:var(--no)}
.fb-head strong{display:block;font-size:17px;line-height:1.3}
.fb-head span{font-size:12.5px;color:var(--ink-2)}
.fb-block{background:rgba(255,255,255,.74);border-radius:12px;padding:10px 12px;margin-bottom:9px}
.fb-block h4{margin:0 0 3px;font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.fb-block p{font-size:14.5px;line-height:1.65;margin:0}
.fb-ans{font-weight:800}
.fb-ans br{line-height:1.9}
@keyframes fbIn{from{opacity:.92;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ result ============ */
.result{text-align:center;padding:6px 0 0;max-width:640px;margin:0 auto}
.result-art{width:168px;margin:0 auto}
.result-art svg{width:100%;height:auto;animation:bob 3.8s ease-in-out infinite}
.big-stars{display:flex;justify-content:center;gap:8px;margin:4px 0 6px}
.big-stars svg{width:42px;height:42px;animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both}
.big-stars svg:nth-child(2){animation-delay:.12s}
.big-stars svg:nth-child(3){animation-delay:.24s}
@keyframes starPop{from{transform:scale(.55) rotate(-18deg);opacity:.45}to{transform:scale(1) rotate(0);opacity:1}}
.result h1{font-size:clamp(25px,7vw,34px);margin:8px 0 4px}
.result-score{font-size:15px;color:var(--ink-2);margin:0}
.result-score strong{font-size:22px;color:var(--ink);margin:0 2px}
.result-sub{font-size:14.5px;color:var(--ink-2);margin:8px auto 18px;max-width:32ch;line-height:1.65}
.result-actions{display:grid;gap:10px}
.review{margin-top:26px;text-align:left}
.review h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.review h3::before{content:"";width:8px;height:18px;background:var(--sun);border:2px solid var(--ink);border-radius:3px}
.review-item{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}
.review-q{font-weight:800;font-size:14px;margin:0 0 5px;line-height:1.55}
.review-a{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.6}
.review.all-right{background:#E7F8EF;border:2.5px solid var(--ink);border-radius:18px;padding:16px;text-align:center}
.review.all-right h3{justify-content:center;margin-bottom:4px}
.review.all-right p{font-size:14px;color:var(--ink-2)}

/* ============ toast & fx ============ */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:90;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti{
  position:absolute;width:9px;height:13px;border-radius:2px;
  animation:fly 1.25s cubic-bezier(.15,.7,.3,1) forwards;
}
@keyframes fly{
  from{transform:translate(0,0) rotate(0);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}
}
.site-foot{text-align:center;font-size:11px;color:var(--ink-3);padding:22px 0 4px;letter-spacing:.1em}

@media(min-width:640px){

/* ---------------- sound ---------------- */
var Sound = {
  ctx: null,
  ensure: function () {
    if (!state.sound) return null;
    try {
      if (!this.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  blip: function (freq, dur, type, vol, when) {
    if (!state.sound) return;
    var ctx = this.ensure();
    if (!ctx) return;
    try {
      var t = ctx.currentTime + (when || 0);
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol || 0.06, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  tap: function () { this.blip(640, 0.06, 'triangle', 0.035); },
  correct: function () {
    var self = this;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { self.blip(f, 0.16, 'sine', 0.065, i * 0.075); });
  },
  wrong: function () {
    this.blip(330, 0.14, 'sine', 0.05);
    this.blip(247, 0.2, 'sine', 0.045, 0.12);
  },
  star: function () {
    var self = this;
    [1046, 1318, 1568].forEach(function (f, i) { self.blip(f, 0.12, 'triangle', 0.045, i * 0.06); });
  },
  fanfare: function () {
    var self = this;
    [523, 659, 784, 1046, 1318].forEach(function (f, i) { self.blip(f, 0.22, 'triangle', 0.055, i * 0.1); });
  }
};

function speak(text) {
  if (!('speechSynthesis' in window)) {

/* ---------------- helpers ---------------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function currentMode() {
  var modes = DATA[state.level].modes;
  for (var i = 0; i < modes.length; i++) if (modes[i].id === state.mode) return modes[i];
  return modes[0];
}
function currentQ() { return currentMode().questions[state.qi]; }
function bestStars(modeId) { return state.progress[state.level][modeId] || 0; }
function totalStars() {
  var p = state.progress[state.level] || {};
  return (p.detective || 0) + (p.relay || 0) + (p.puzzle || 0);
}
function starsFor(c, total) {
  if (c >= total) return 3;
  if (c >= 4) return 2;
  if (c >= 2) return 1;
  return 0;
}
function shuffledIdx(n, seed) {
  var a = [];
  for (var i = 0; i < n; i++) a.push(i);
  var s = seed % 233280;
  for (var k = n - 1; k > 0; k--) {
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor((s / 233280) * (k + 1));
    var t = a[k]; a[k] = a[j]; a[j] = t;
  }
  var same = true;
  for (var m = 0; m < n; m++) if (a[m] !== m) { same = false; break; }
  if (same) a.push(a.shift());
  return a;
}
function tableHTML(t) {
  var head = t.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
  var rows = t.rows.map(function (r) {
    return '<tr>' + r.map(function (c, i) { return '<td data-label="' + esc(t.head[i]) + '">' + esc(c) + '</td>'; }).join('') + '</tr>';
  }).join('');
  return '<div class="table-wrap"><table class="cmp"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function pieceText(q, i) {

function orderNeed(q) {
  return q.type === 'build' ? (q.need || 3) : q.pieces.length;
}

function orderBody(q) {
  var build = q.type === 'build';
  var need = orderNeed(q);
  var order = state.shuffle[state.qi] || q.pieces.map(function (_, i) { return i; });
  var slots = '';
  for (var s = 0; s < need; s++) {
    var val = state.picked[s];
    if (val === undefined) {
      slots += '<div class="slot"><span class="slot-no">' + (s + 1) + '</span><span class="slot-text">' +
        (build ? '把句子放進來（先後不拘）' : '把句子排在這裡') + '</span></div>';
    } else {
      slots += '<button class="slot filled" data-act="unpick" data-slot="' + s + '">' +
        '<span class="slot-no">' + (s + 1) + '</span><span class="slot-text">' + esc(pieceText(q, val)) + '</span></button>';
    }
  }
  var pieces = order.filter(function (i) { return state.picked.indexOf(i) === -1; })
    .map(function (i) {
      return '<button class="piece" data-act="pick" data-i="' + i + '"' + (state.answered ? ' disabled' : '') + '>' +
        esc(pieceText(q, i)) + '</button>';
    }).join('');
  var submit = state.answered ? '' :
    '<button class="btn primary wide" data-act="submit-order"' + (state.picked.length < need ? ' disabled' : '') + '>' +
    (build ? '確定拼法' : '確定答案') + icon('check') + '</button>';
  return '<div class="order-area"><div class="slots">' + slots + '</div>' +
    '<div class="pieces">' + pieces + '</div>' + submit + '</div>';
}

          '<p class="review-a">' + esc(l.q.why) + '</p></div>';
      }).join('') + '</div>'
    : '<div class="review all-right"><h3>全部答對</h3><p>結構、數量、內容，你都看出來了。</p></div>';
  return '<div class="result">' +
    '<div class="result-art">' + mascot(stars >= 2 ? 'cheer' : 'happy') + '</div>' +
    '<div class="big-stars">' + starSVG(stars > 0) + starSVG(stars > 1) + starSVG(stars > 2) + '</div>' +
    '<h1>' + msg.t + '</h1>' +
    '<p class="result-score">答對 <strong>' + c + '</strong> / ' + total + ' 題</p>' +
    '<p class="result-sub">' + msg.s + '</p>' +
    '<div class="result-actions">' +
      '<button class="btn primary" data-act="retry">' + icon('refresh') + '再玩一次</button>' +
      '<button class="btn" data-act="modes">' + icon('game') + '挑戰其他模式</button>' +
    '</div>' + review +
  '</div>';
}

/* ---------------- render ---------------- */
function renderTopbar() {
  var bar = document.getElementById('topbar');
  bar.innerHTML = '<button class="icon-btn ' + (state.screen === 'home' ? 'is-hidden' : '') + '" data-act="back" aria-label="返回上一頁">' + icon('back') + '</button>' +
    '<button class="brand" data-act="home" aria-label="回到首頁"><span class="brand-mark">' + brandFace() + '</span><span class="brand-text">排比島</span></button>' +
    '<span class="spacer"></span>' +
    (state.level ? '<span class="chip ' + state.level + '">' + DATA[state.level].label + '</span>' : '') +
    '<button class="icon-btn" data-act="sound" aria-label="' + (state.sound ? '關閉音效' : '開啟音效') + '">' + (state.sound ? icon('sound') : icon('mute')) + '</button>';
}

function renderScreen(animate) {
  var screen = document.getElementById('screen');
  var html = '';
  if (state.screen === 'home') html = viewHome();
  else if (state.screen === 'level') html = viewLevel();
  else if (state.screen === 'lesson') html = viewLesson();
  else if (state.screen === 'modes') html = viewModes();
  else if (state.screen === 'quiz') html = viewQuiz();
  else if (state.screen === 'result') html = viewResult();
  screen.innerHTML = html;
  screen.classList.remove('enter');
  if (animate) {
    void screen.offsetWidth;
    screen.classList.add('enter');
  }
  var app = document.getElementById('app');
  if (state.level === 'senior') {
    app.style.setProperty('--lvl', 'var(--teal)');
    app.style.setProperty('--lvl-2', 'var(--teal-2)');
  } else {
    app.style.setProperty('--lvl', 'var(--coral)');
    app.style.setProperty('--lvl-2', 'var(--coral-2)');
  }
  renderTopbar();
  if (animate) window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ---------------- actions ---------------- */
function startMode(id) {
  var lv = DATA[state.level];
  var mode = null;
  for (var i = 0; i < lv.modes.length; i++) if (lv.modes[i].id === id) mode = lv.modes[i];
  if (!mode) return;
  state.mode = id;
  state.qi = 0;
  state.picked = [];
  state.answered = false;
  state.lastPick = null;
  state.lastCorrect = false;
  state.correctCount = 0;
  state.log = [];
  var seedBase = (state.level === 'senior' ? 101 : 7) + (id === 'detective' ? 3 : id === 'relay' ? 11 : 29);
  state.shuffle = mode.questions.map(function (q, i) {
    return (q.type === 'order' || q.type === 'build') ? shuffledIdx(q.pieces.length, seedBase + i * 37) : null;
  });
  state.screen = 'quiz';
  Sound.tap();
  renderScreen(true);
}

function answer(i) {
  if (state.answered) return;
  var q = currentQ();
  var ok = i === q.answer;
  state.answered = true;
  state.lastPick = i;
  state.lastCorrect = ok;
  state.log.push({ q: q, ok: ok, pick: i });
  if (ok) {
    state.correctCount++;
    Sound.correct();
    burstConfetti(14);
  } else {
    Sound.wrong();
  }
  renderScreen(false);
  setTimeout(function () {
    var fb = document.getElementById('feedback');
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function pick(i) {
  if (state.answered) return;
  if (state.picked.indexOf(i) !== -1) return;
  state.picked.push(i);
  Sound.tap();
  renderScreen(false);
}

function unpick(slot) {
  if (state.answered) return;
  state.picked.splice(slot, 1);
  Sound.tap();
  renderScreen(false);
}

function submitOrder() {
  if (state.answered) return;
  var q = currentQ();
  var build = q.type === 'build';
  var need = orderNeed(q);
  if (state.picked.length < need) {
    toast(build ? '先選滿三句' : '先把全部句子排好');
    return;
  }
  var ok = true;
  if (build) {
    for (var k = 0; k < state.picked.length; k++) {
      var p = q.pieces[state.picked[k]];
      if (!p || !p.ok) { ok = false; break; }
    }
  } else {
    for (var i = 0; i < q.pieces.length; i++) {
      if (state.picked[i] !== i) { ok = false; break; }
    }
  }
  state.answered = true;
  state.lastCorrect = ok;
  state.lastPick = null;
  state.log.push({ q: q, ok: ok, pick: state.picked.slice() });
  if (ok) {
    state.correctCount++;
    Sound.correct();
    burstConfetti(14);
  } else {
    Sound.wrong();
  }
  renderScreen(false);
  setTimeout(function () {
    var fb = document.getElementById('feedback');
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function nextQuestion() {
  var total = currentMode().questions.length;
  if (state.qi + 1 >= total) {
    finishMode();
    return;
  }
  state.qi++;
  state.answered = false;
  state.picked = [];
  state.lastPick = null;
  state.lastCorrect = false;
  Sound.tap();
  renderScreen(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finishMode() {
  var total = currentMode().questions.length;
  var stars = starsFor(state.correctCount, total);
  var prev = state.progress[state.level][state.mode] || 0;
  state.progress[state.level][state.mode] = Math.max(prev, stars);
  state.played[state.level][state.mode] = true;
  save();
  state.screen = 'result';
  renderScreen(true);
  if (stars >= 2) {
    Sound.fanfare();
    burstConfetti(34);
  } else {
    Sound.star();
  }
}

function goBack() {
  if (state.screen === 'quiz' || state.screen === 'result') {
    state.screen = 'modes';
  } else if (state.screen === 'modes' || state.screen === 'lesson') {
    state.screen = 'level';
  } else if (state.screen === 'level') {
    state.screen = 'home';
    state.level = null;
  }
  renderScreen(true);
}

function goHome() {
  state.screen = 'home';
  state.level = null;
  state.mode = null;
  renderScreen(true);
}

function toggleSound() {
  state.sound = !state.sound;
  if (state.sound) {
    Sound.tap();
    toast('音效已開啟');
  } else {
    toast('音效已關閉');
  }
  save();
  renderTopbar();
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
}

function burstConfetti(n) {
  var layer = document.getElementById('fx');
  if (!layer) return;
  var colors = ['#FF6B5A', '#1FB6A6', '#FFC53D', '#7B5CD6', '#4FA8E8'];
  for (var i = 0; i < n; i++) {
    var d = document.createElement('i');
    d.className = 'confetti';
    d.style.left = (50 + (Math.random() - 0.5) * 30) + '%';
    d.style.top = (38 + Math.random() * 12) + '%';
    d.style.background = colors[i % colors.length];
    d.style.setProperty('--dx', ((Math.random() - 0.5) * 320).toFixed(0) + 'px');
    d.style.setProperty('--dy', (-60 - Math.random() * 240).toFixed(0) + 'px');
    d.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
    d.style.animationDelay = (Math.random() * 0.12) + 's';
    layer.appendChild(d);
    (function (node) {
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 1500);
    })(d);
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  Sound.ensure();
  if (act === 'home') { goHome(); return; }
  if (act === 'back') { goBack(); return; }
  if (act === 'level') { state.level = t.getAttribute('data-level'); state.screen = 'level'; renderScreen(true); return; }
  if (act === 'lesson') {
    var i = parseInt(t.getAttribute('data-i') || '0', 10);
    state.lesson = isNaN(i) ? 0 : i;
    state.screen = 'lesson';
    renderScreen(true);
    return;
  }
  if (act === 'prev-lesson') {
    if (state.lesson > 0) { state.lesson--; Sound.tap(); renderScreen(true); }
    return;
  }
  if (act === 'next-lesson') {
    var n = DATA[state.level].lessons.length;
    if (state.lesson < n - 1) { state.lesson++; Sound.tap(); renderScreen(true); }
    else { state.screen = 'modes'; Sound.tap(); renderScreen(true); }
    return;
  }
  if (act === 'modes') { state.screen = 'modes'; renderScreen(true); return; }
  if (act === 'mode') { startMode(t.getAttribute('data-mode')); return; }
  if (act === 'answer') { answer(parseInt(t.getAttribute('data-i'), 10)); return; }
  if (act === 'pick') { pick(parseInt(t.getAttribute('data-i'), 10)); return; }
  if (act === 'unpick') { unpick(parseInt(t.getAttribute('data-slot'), 10)); return; }
  if (act === 'submit-order') { submitOrder(); return; }
  if (act === 'next') { nextQuestion(); return; }
  if (act === 'retry') { startMode(state.mode); return; }
  if (act === 'sound') { toggleSound(); return; }
  if (act === 'speak') { speak(t.getAttribute('data-text') || ''); return; }
});

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') {
    e.preventDefault();
    e.target.click();
  }
});

load();
if (window.FORCE_LEVEL && DATA[window.FORCE_LEVEL]) {
  state.level = window.FORCE_LEVEL;
  state.screen = 'level';
}
renderScreen(true);

</script>
</body>
</html>
