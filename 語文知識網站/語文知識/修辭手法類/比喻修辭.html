<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>比喻小偵探｜初小・高小分級比喻互動遊戲</title>
<meta name="description" content="初小版以短句打基礎，高小版加入明喻、暗喻、借喻；各有五站圖文教學與三種互動遊戲。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#2B2A4A;
  --paper:#FFFCF3;
  --sun:#FFC94D;
  --sun-soft:#FFF1C9;
  --coral:#FF7A6B;
  --coral-soft:#FFE3DE;
  --mint:#3FBF93;
  --mint-soft:#DDF6EC;
  --sky:#54B6E8;
  --sky-soft:#DFF2FF;
  --violet:#9C86F5;
  --violet-soft:#ECE6FF;
  --pink:#FFB3C7;
  --muted:#6E6884;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Yuanti TC','YuanTi TC','PingFang TC','Hiragino Sans TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 3%, rgba(255,201,77,.38), transparent 36%),
    radial-gradient(circle at 96% 0%, rgba(84,182,232,.30), transparent 34%),
    radial-gradient(circle at 50% 102%, rgba(63,191,147,.20), transparent 44%),
    #FFF9EC;
  min-height:100dvh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(43,42,74,.10) 1.3px, transparent 1.3px);
  background-size:18px 18px;opacity:.42;
}
#stage{position:relative;z-index:1;min-height:100dvh}
.app{max-width:520px;margin:0 auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom));min-height:100dvh}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.screen{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.92;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:.6;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(-1deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.08)}}

/* ---------- 共用元件 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-size:16px;font-weight:900;letter-spacing:.4px;line-height:1.25}
.tb-title span{display:block;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.8px;margin-top:2px}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border:2.6px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}
.star-row{display:inline-flex;align-items:center;gap:2px}
.star-row svg{width:15px;height:15px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:11px 18px;border:2.8px solid var(--ink);border-radius:16px;background:var(--sun);font-size:16px;font-weight:900;letter-spacing:.6px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.wide{width:100%;margin-top:13px}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;box-shadow:0 4px 0 var(--ink);cursor:default}
.btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--ink)}
.btn svg{width:18px;height:18px;flex:0 0 18px}

/* ---------- 首頁 ---------- */
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:42px;height:42px;flex:0 0 42px;border:2.6px solid var(--ink);border-radius:13px;background:var(--sun);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transform:rotate(-4deg);padding:3px;overflow:hidden}
.brand-mark svg{width:100%;height:100%}
.brand-mark-inner,.entry-art-inner,.result-art-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.brand-mark-inner svg,.entry-art-inner svg,.result-art-inner svg{width:100%;height:100%}
.brand-name b{display:block;font-size:15px;font-weight:900;letter-spacing:1px;line-height:1.2}
.brand-name span{display:block;font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-top:2px}
.hero{position:relative;border:3px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:0 7px 0 var(--ink);padding:16px 15px 0;overflow:hidden}
.hero::after{content:'';position:absolute;right:-34px;top:-34px;width:110px;height:110px;border:2.6px dashed rgba(43,42,74,.16);border-radius:50%;pointer-events:none}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--muted);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;transform:rotate(-1deg)}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--coral);display:block}
.hero h1{font-size:clamp(38px,11.5vw,46px);line-height:1.12;font-weight:900;letter-spacing:2px;margin:12px 0 0;position:relative;z-index:2}
.h1-tag{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:0 9px 2px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg);margin-right:2px}
.hero-sub{margin-top:11px;font-size:15px;line-height:1.6;font-weight:800;color:var(--muted);letter-spacing:.4px}
.hero-sub b{color:var(--ink);background:linear-gradient(transparent 55%,var(--sun-soft) 55%);padding:0 2px}
.hero-scene{position:relative;margin:13px -15px 0;border-top:3px solid var(--ink);background:#E4F3FF;overflow:hidden}
.scene-art{height:168px;display:flex;align-items:center;justify-content:center}
.scene-art svg{width:100%;height:100%}
.bubble{position:absolute;right:12px;top:12px;background:#fff;border:2.4px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:14px;font-weight:900;letter-spacing:.6px;box-shadow:0 3px 0 var(--ink);transform:rotate(1.5deg)}
.bubble b{color:var(--coral)}
.hero-foot{position:relative;margin:0 -15px;padding:9px 14px;border-top:2.4px dashed rgba(43,42,74,.25);background:var(--paper);font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.hero-foot svg{width:15px;height:15px;flex:0 0 15px}
.entry{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 12px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--ink);margin-top:14px;transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden}
.entry:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.entry-no{width:32px;height:32px;flex:0 0 32px;font-size:11.5px;border:2.4px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:900;letter-spacing:0}
.entry-info{flex:1;min-width:0}
.entry-info b{display:block;font-size:19px;font-weight:900;letter-spacing:1px}
.entry-info small{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-top:3px;line-height:1.45}
.entry-art{width:50px;height:50px;flex:0 0 50px;border:2.4px solid var(--ink);border-radius:16px;overflow:hidden;display:grid;place-items:center}
.entry-art svg{width:100%;height:100%}
.entry-go{width:27px;height:27px;flex:0 0 27px;border:2.4px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:#fff}
.entry-go svg{width:15px;height:15px}
.entry.learn .entry-no{background:var(--sun)}
.entry.learn .entry-art{background:var(--sky-soft)}
.entry.play .entry-no{background:var(--mint-soft)}
.entry.play .entry-art{background:var(--violet-soft)}
.entry-stars svg{width:13px;height:13px;flex:0 0 13px;color:var(--sun)}
.entry-stars{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.5px}
.home-note{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:10px 12px;border:2.4px dashed rgba(43,42,74,.3);border-radius:15px;background:rgba(255,255,255,.55);font-size:12px;line-height:1.6;font-weight:800;color:var(--muted)}
.home-note svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}
.foot{margin-top:18px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1.4px}

/* ---------- 教學 ---------- */
.learn-dots{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.learn-dots button{flex:1;height:9px;border:2px solid var(--ink);border-radius:99px;background:#fff;padding:0;transition:background .2s}
.learn-dots button.on{background:var(--sun)}
.learn-dots button.done{background:var(--mint)}
.learn-count{margin-left:6px;font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--muted);white-space:nowrap}
.learn-card{border:3px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 7px 0 var(--ink);padding:14px;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.learn-art{height:186px;border:2.6px solid var(--ink);border-radius:19px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.learn-art svg{width:100%;height:100%}
.station-tag{display:inline-flex;align-items:center;gap:6px;margin:13px 0 0;font-size:10.5px;font-weight:900;letter-spacing:1.6px;color:var(--muted)}
.station-tag i{display:block;width:18px;height:18px;border:2px solid var(--ink);border-radius:6px;background:var(--sun);font-style:normal;font-size:9.5px;display:grid;place-items:center;letter-spacing:0}
.learn-card h2{font-size:24px;line-height:1.3;font-weight:900;letter-spacing:1px;margin:7px 0 8px}
.learn-text{font-size:15.5px;line-height:1.75;font-weight:700;color:#4A4560;letter-spacing:.2px}
.learn-text b{color:var(--ink);background:linear-gradient(transparent 58%,var(--sun-soft) 58%);padding:0 1px}
.callout{margin-top:11px;padding:10px 12px;border:2.4px solid var(--ink);border-radius:14px;background:var(--sun-soft);font-size:14px;line-height:1.65;font-weight:800}
.callout .quote{display:block;font-size:19px;letter-spacing:1px;margin-bottom:4px}
.callout small{display:block;font-size:12.5px;font-weight:800;color:var(--muted);line-height:1.55;margin-top:3px}
.learn-nav{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:14px}
.learn-nav .btn{width:100%;min-height:52px;font-size:15.5px}

.part-sentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:14px 8px;border:2.6px solid var(--ink);border-radius:16px;background:var(--paper);font-size:25px;font-weight:900;letter-spacing:1.5px;margin:12px 0 4px}
.part-word{padding:2px 5px;border-radius:8px;transition:background .2s,transform .2s;cursor:pointer}
.part-word.b{background:var(--sky-soft)}
.part-word.c{background:var(--sun-soft)}
.part-word.y{background:var(--coral-soft)}
.part-word.lit{transform:translateY(-2px);box-shadow:0 3px 0 var(--ink);border:2px solid var(--ink);padding:0 3px}
.part-list{margin-top:9px}
.part-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:2.3px solid var(--ink);border-radius:13px;margin-top:7px;background:#fff;transition:transform .15s}
.part-row.on{transform:translateX(3px)}
.part-row:nth-child(1){background:var(--sky-soft)}
.part-row:nth-child(2){background:var(--sun-soft)}
.part-row:nth-child(3){background:var(--coral-soft)}
.part-dot{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--ink);border-radius:7px;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}
.part-row b{font-size:14.5px;font-weight:900;letter-spacing:.5px}
.part-row p{font-size:13.5px;line-height:1.5;font-weight:700;color:#4A4560;margin-top:1px}
.tip-line{display:flex;gap:7px;align-items:flex-start;margin-top:11px;font-size:12px;line-height:1.6;font-weight:800;color:var(--muted)}
.tip-line svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}

.word-box{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.word-chip{padding:8px 13px;border:2.6px solid var(--ink);border-radius:999px;background:#fff;font-size:16px;font-weight:900;letter-spacing:1px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.word-chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.word-chip.on{background:var(--sun);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.example-bubble{position:relative;margin-top:13px;padding:12px 14px;border:2.6px solid var(--ink);border-radius:16px;background:var(--sky-soft);font-size:16px;line-height:1.65;font-weight:800;min-height:64px}
.example-bubble::before{content:'';position:absolute;top:-11px;left:22px;width:16px;height:16px;background:var(--sky-soft);border-left:2.6px solid var(--ink);border-top:2.6px solid var(--ink);transform:rotate(45deg)}
.example-bubble b{color:var(--coral);border-bottom:3px solid var(--ink)}
.example-bubble small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:5px;letter-spacing:.4px}

.cond{display:flex;gap:10px;align-items:flex-start;padding:11px;border:2.6px solid var(--ink);border-radius:16px;margin-top:9px;background:#fff}
.cond-no{width:27px;height:27px;flex:0 0 27px;border:2.2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--sun)}
.cond b{font-size:15px;font-weight:900;letter-spacing:.5px}
.cond p{font-size:13.5px;line-height:1.6;font-weight:700;color:#4A4560;margin-top:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.cmp{border:2.4px solid var(--ink);border-radius:15px;padding:8px;background:#fff;text-align:center}
.cmp-art{height:80px;border-radius:11px;overflow:hidden;margin-bottom:6px;background:var(--paper)}
.cmp-art svg{width:100%;height:100%}
.cmp b{display:block;font-size:12px;font-weight:900;line-height:1.3}
.cmp small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:2px;line-height:1.4}
.cmp.good{background:var(--mint-soft)}
.cmp.bad{background:var(--coral-soft)}
.cmp .mark{display:inline-grid;place-items:center;width:19px;height:19px;border:2px solid var(--ink);border-radius:50%;background:#fff;font-size:10px;font-weight:900;margin-bottom:2px}

.trap{display:flex;gap:9px;align-items:center;padding:9px;border:2.4px solid var(--ink);border-radius:15px;background:var(--coral-soft);margin-top:8px}
.trap:nth-of-type(2){background:var(--sun-soft)}
.trap:nth-of-type(3){background:var(--violet-soft)}
.trap-x{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--coral)}
.trap-main{flex:1;min-width:0}
.trap-art{width:48px;height:48px;flex:0 0 48px;border:2.2px solid var(--ink);border-radius:12px;overflow:hidden}
.trap-art svg{width:100%;height:100%}
.trap b{font-size:14.5px;font-weight:900;letter-spacing:.3px;line-height:1.35}
.trap p{font-size:13px;font-weight:700;line-height:1.55;margin-top:3px;color:#4A4560}
.trap p em{font-style:normal;display:inline-block;background:#fff;border:1.8px solid var(--ink);border-radius:6px;padding:1px 5px;font-size:12px;font-weight:900;margin:2px 2px 0 0}
.mnemonic{margin-top:12px;padding:12px;border:2.8px solid var(--ink);border-radius:16px;background:var(--ink);color:#fff;text-align:center;box-shadow:0 4px 0 rgba(43,42,74,.25)}
.mnemonic b{font-size:16.5px;letter-spacing:2px}
.mnemonic span{display:block;font-size:11px;font-weight:800;letter-spacing:1px;margin-top:3px;color:#D9D5EA}

/* ---------- 玩法選單 ---------- */
.star-board{display:flex;align-items:center;gap:10px;padding:11px 13px;border:2.8px solid var(--ink);border-radius:17px;background:var(--sun-soft);box-shadow:0 4px 0 var(--ink);margin-bottom:14px}
.star-board .big{width:40px;height:40px;flex:0 0 40px;border:2.4px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center}
.star-board .big svg{width:24px;height:24px;color:var(--sun)}
.star-board b{display:block;font-size:13px;font-weight:900;letter-spacing:.5px}
.star-board small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:2px;letter-spacing:.4px}
.star-board .total{margin-left:auto;font-size:17px;font-weight:900;letter-spacing:1px}
.mode-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px;border:3px solid var(--ink);border-radius:21px;background:#fff;box-shadow:0 6px 0 var(--ink);margin-top:12px;transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden}
.mode-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mode-no{position:absolute;right:10px;top:8px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--muted);opacity:.65}
.mode-ico{width:56px;height:56px;flex:0 0 56px;border:2.4px solid var(--ink);border-radius:17px;display:grid;place-items:center}
.mode-ico svg{width:30px;height:30px}
.mode-info{flex:1;min-width:0}
.mode-info b{display:block;font-size:17.5px;font-weight:900;letter-spacing:.8px}
.mode-info small{display:block;font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.45;margin-top:3px;padding-right:14px}
.mode-info .star-row{margin-top:6px}
.mode-go{width:28px;height:28px;flex:0 0 28px;border:2.2px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center}
.mode-go svg{width:14px;height:14px}
.mode-card.a .mode-ico{background:var(--sun-soft)}
.mode-card.b .mode-ico{background:var(--sky-soft)}
.mode-card.c .mode-ico{background:var(--mint-soft)}
.relearn{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;margin-top:16px;padding:11px;border:2.4px dashed var(--ink);border-radius:15px;background:rgba(255,255,255,.55);font-size:13px;font-weight:900;letter-spacing:.6px;color:var(--muted)}
.relearn svg{width:17px;height:17px}

/* ---------- 遊戲 ---------- */
.progress{height:10px;border:2.4px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 2px 0 rgba(43,42,74,.14);margin-bottom:12px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.q-card{border:3px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:13px;position:relative}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.q-no{font-size:10.5px;font-weight:900;letter-spacing:1.4px;color:var(--muted)}
.q-type{font-size:10px;font-weight:900;letter-spacing:.8px;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--sky-soft)}
.q-art{height:164px;border:2.4px solid var(--ink);border-radius:17px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.q-art svg{width:100%;height:100%}
.q-sentence{font-size:23px;line-height:1.55;font-weight:900;letter-spacing:1.2px;text-align:center;padding:2px 4px 5px;text-wrap:balance}
.q-sentence .qmark{color:var(--coral)}
.q-hint{margin-top:7px;text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;line-height:1.5}
.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ans-btn{min-height:62px;border:3px solid var(--ink);border-radius:17px;font-size:18px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .2s}
.ans-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ans-btn svg{width:20px;height:20px;flex:0 0 20px}
.ans-btn.yes{background:var(--mint-soft)}
.ans-btn.no{background:var(--coral-soft)}

var Sfx = {
  ctx:null, on:true, _nb:null,
  init:function(){
    if(!this.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ try{ this.ctx = new AC(); }catch(e){ this.ctx = null; } }
    }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume(); }
    return this.ctx;
  },
  tone:function(freq, dur, type, vol, delay, slideTo){
    if(!this.on) return;
    var ctx = this.init(); if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05, t0+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  },
  noiseBuf:function(){
    var ctx=this.ctx; if(this._nb) return this._nb;
    var len=Math.floor(ctx.sampleRate*2);
    var b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._nb=b; return b;
  },
  noise:function(dur, vol, filter, freq, delay){
    if(!this.on) return;
    var ctx=this.init(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var src=ctx.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
    var bp=ctx.createBiquadFilter(); bp.type=filter||'lowpass'; bp.frequency.setValueAtTime(freq||1200,t0);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0+dur+0.03);
  },
  click:function(){ this.tone(540,0.05,'triangle',0.028); },
  flip:function(){ this.tone(430,0.07,'sine',0.03); this.tone(620,0.09,'sine',0.035,0.05); },
  pop:function(){ this.tone(780,0.08,'sine',0.05); },
  drop:function(){ this.tone(300,0.08,'triangle',0.04); this.tone(620,0.09,'sine',0.04,0.05); },
  correct:function(){ var s=this; [523,659,784].forEach(function(f,i){ s.tone(f,0.16,'sine',0.055,i*0.075); }); },
  wrong:function(){ this.tone(310,0.12,'sine',0.045); this.tone(225,0.2,'sine',0.038,0.11); },
  win:function(){ var s=this; [523,659,784,1047].forEach(function(f,i){ s.tone(f,0.22,'triangle',0.05,i*0.095); }); this.noise(0.5,0.02,'highpass',3000,0.1); },
  star:function(i){ this.tone(680+i*150,0.16,'sine',0.045,i*0.06); }
};

      '<div class="step3"><i>1</i><b>找本體</b><small>句子在說甚麼？</small></div>' +

/* ---------------- 遊戲 ---------------- */
function progressHTML(){
  var w = ((S.qi+1)/6)*100;
  return '<div class="progress"><div class="progress-fill" style="width:' + w + '%"></div></div>';
}
function partsHTML(parts){
  if(!parts) return '';
  var cls = ['b','c','y'];
  return '<div class="parts">' + parts.map(function(p,i){
    return '<span class="part-chip ' + cls[i] + '">' + esc(p) + '</span>';
  }).join('') + '</div>';
}
function nextLabel(){
  return S.qi>=5 ? '看成績' + ICON.check : '下一題' + ICON.arrowR;
}
function feedbackHTML(ok, title, text, parts){
  return '<div class="fb ' + (ok?'ok':'no') + '" id="feedback">' +
    '<div class="fb-head"><span class="fb-ico">' + (ok?'✓':'!') + '</span><b>' + esc(title) + '</b>' +
      '<span class="fb-verdict">' + (ok?'判斷正確':'再想一想') + '</span></div>' +
    '<p class="fb-text">' + text + '</p>' + (parts || '') +
    '<button class="btn wide" data-act="next">' + nextLabel() + '</button>' +
  '</div>';
}

function gameA(){
  var q = QD().a[S.qi];
  var answered = S.answered;
  var clsYes = 'ans-btn yes', clsNo = 'ans-btn no';
  if(answered){
    if(q.ok){ clsYes += ' right'; } else { clsNo += ' right'; }
    if(S.chosen===true && !q.ok) clsYes += ' wrong';
    if(S.chosen===false && q.ok) clsNo += ' wrong';
  }
  var fb = '';
  if(answered){
    var ok = (S.chosen === q.ok);
    var text;
    if(q.ok){
      text = (ok?'答得好！':'差一點！') + '這句話<b>是比喻</b>' + (q.kind?'，屬於<b>' + q.kind + '</b>':'') + '。' + esc(q.why);
    }else{
      text = (ok?'答得好！':'差一點！') + '這句話<b>不是比喻</b>。' + esc(q.why);
    }
    fb = feedbackHTML(ok, ok?'答對了！':'差一點！', text, q.ok?partsHTML(q.parts):'');
  }
  var long = q.s.length > 16 ? ' long' : '';
  var kc = (answered && q.kind) ? '<span class="kind-chip">' + q.kind + '</span>' : '';
  return '<div class="q-card">' +
    '<div class="q-head"><span class="q-no">第 ' + (S.qi+1) + ' 題</span>' + kc + '<span class="q-type">是比喻嗎？</span></div>' +
    '<div class="q-art" style="background:' + (ART_BG[q.art]||'#F4FAFF') + '">' + artSVG(q.art) + '</div>' +
    '<p class="q-sentence' + long + '">「' + esc(q.s) + '」</p>' +
    '<p class="q-hint">' + (S.ver==='senior' ? '先找本體和喻體，再看兩者是否不同類、有相似。' : '想一想：有沒有把一樣東西，比作另一樣不同的東西？') + '</p>' +
    '<div class="answer-row">' +
      '<button class="' + clsYes + '" data-act="ansA" data-val="1"' + (answered?' disabled':'') + '>' + ICON.check + '是比喻</button>' +
      '<button class="' + clsNo + '" data-act="ansA" data-val="0"' + (answered?' disabled':'') + '>' + ICON.cross + '不是比喻</button>' +
    '</div>' +
  '</div>' + fb;
}

function gameB(){
  var d = QD().b[S.qi];
  var opts = d.options.map(function(o,i){
    var cls = 'opt';
    var mark = '';
    var why = '';
    if(S.answered){
      if(o.ok){ cls += ' ok'; mark = '<span class="opt-mark">✓</span>'; }
      else if(i===S.chosen){ cls += ' bad'; mark = '<span class="opt-mark">✗</span>'; }
      why = '<span class="opt-why">' + (o.ok?'✓ ':'✗ ') + esc(o.why) + '</span>';
    }
    var long = o.s.length > 18 ? ' long' : '';
    return '<button class="' + cls + '" data-act="ansB" data-i="' + i + '"' + (S.answered?' disabled':'') + '>' +
      '<span class="opt-letter">' + 'ABC'[i] + '</span>' +
      '<span class="opt-main"><span class="opt-text' + long + '">' + esc(o.s) + '</span>' + why + '</span>' +
      mark +
    '</button>';
  }).join('');
  var fb = '';
  if(S.answered){
    var picked = d.options[S.chosen];
    var ok = picked && picked.ok;
    var right = '';
    d.options.forEach(function(o,i){ if(o.ok) right = 'ABC'[i]; });
    var text = ok
      ? '你找到比喻句了！<b>' + right + ' 句</b>把兩種不同類的東西連起來，而且有相似的地方。'
      : '正確答案是 <b>' + right + ' 句</b>。你選的這句不是比喻，看看上面的解釋，再分辨一次。';
    fb = feedbackHTML(ok, ok?'找到了！':'再看看', text, '');
  }
  return '<div class="q-card">' +
    '<div class="q-head"><span class="q-no">第 ' + (S.qi+1) + ' 題</span><span class="q-type">三句選一</span></div>' +
    '<div class="q-art" style="height:118px;background:' + (ART_BG[d.art]||'#F4FAFF') + '">' + artSVG(d.art) + '</div>' +
    '<p class="q-sentence" style="font-size:19px">哪一句是比喻句？</p>' +
    '<div class="opts">' + opts + '</div>' +
  '</div>' + fb;
}

function gameC(){
  var d = QD().c[S.qi];
  var cards = d.items.map(function(it,i){
    var cls = 'sort-card';
    if(S.placed[i]!==null && S.placed[i]!==undefined) cls += ' placed';
    if(S.sel===i) cls += ' sel';
    if(S.checked){ cls += (S.placed[i]===1)===it.ok ? ' ok' : ' bad'; }
    var tag = '';
    if(S.placed[i]!==null && S.placed[i]!==undefined){
      tag = '<span class="sc-tag">' + (S.placed[i]===1?'→ 比喻句':'→ 不是比喻') + '</span>';
    }
    var why = S.checked ? '<p class="sc-why">' + ((S.placed[i]===1)===it.ok?'✓ ':'✗ ') + esc(it.why) + '</p>' : '';
    var long = it.s.length > 18 ? ' long' : '';
    return '<button class="' + cls + '" data-act="pickCard" data-i="' + i + '"' + (S.checked?' disabled':'') + '>' +
      '<span class="sc-text' + long + '">「' + esc(it.s) + '」</span>' + tag +
    '</button>' + why;
  }).join('');
  var fb = '';
  if(S.checked){
    var all = true;
    d.items.forEach(function(it,i){ if((S.placed[i]===1)!==it.ok) all=false; });
    fb = feedbackHTML(all, all?'兩句都放對了！':'有一句放錯了', all
      ? '你能分清楚真的比喻，和只是描寫、猜想、同類比較或擬人的句子。繼續保持！'
      : '看看每句後面的解釋：<b>比喻</b>要有本體、喻體，而且兩樣東西不同類。', '');
  }
  return '<div class="q-card">' +
    '<div class="q-head"><span class="q-no">第 ' + (S.qi+1) + ' 題</span><span class="q-type">分類小偵探</span></div>' +
    '<div class="q-art" style="height:112px;background:' + (ART_BG[d.art]||'#F4FAFF') + '">' + artSVG(d.art) + '</div>' +
    '<p class="q-sentence" style="font-size:19px">把兩句放進正確的籃子</p>' +
    '<p class="sort-note">' + ICON.bulb + '先點一句句子，再點下面的籃子。放錯了可以再點句子拿出來。</p>' +
    cards +
    '<div class="bins">' +
      '<button class="bin yes" data-act="bin" data-val="1"' + (S.checked?' disabled':'') + '>' +
        '<span class="bin-ico">' + ICON.check + '</span><b>比喻句</b><small>有本體、喻體<br>兩樣不同類</small></button>' +
      '<button class="bin no" data-act="bin" data-val="0"' + (S.checked?' disabled':'') + '>' +
        '<span class="bin-ico">' + ICON.cross + '</span><b>不是比喻</b><small>描寫 · 猜想<br>同類比較 · 擬人</small></button>' +
    '</div>' +
    '<button class="btn wide" data-act="checkSort"' + (S.checked || S.placed[0]===null || S.placed[1]===null ? ' disabled':'') + '>' + (S.checked?'已檢查':'檢查答案') + '</button>' +
  '</div>' + fb;
}

function gameHTML(){
  var body = '';
  if(S.mode==='a') body = gameA();
  else if(S.mode==='b') body = gameB();
  else body = gameC();
  return '<div class="screen game">' +
    topbar(MODES[S.mode].name, V().name + ' · 第 ' + (S.qi+1) + ' / 6 題') +
    progressHTML() + body +
  '</div>';
}

/* ---------------- 成績 ---------------- */
function resultHTML(){
  var v = V();
  var n = S.correct >= 6 ? 3 : (S.correct >= 4 ? 2 : (S.correct >= 1 ? 1 : 0));
  var msg = n===3
      ? (S.ver==='senior' ? '神探級！明喻、暗喻、借喻都逃不過你的眼睛。' : '神探級！比喻逃不過你的眼睛。')
    : n===2 ? '很接近！再玩一次就滿星了。'
    : n===1 ? '有進步！記住三個陷阱再挑戰。'
    : '別灰心，先回去「先學一學」再來。';
  var note = S.ver==='senior'
    ? '高小口訣：<b>本體喻體不同類，相似之處說得通</b>。明喻有「像」，暗喻用「是」，借喻只剩喻體。'
    : '初小口訣：<b>不同類、有相似、有比喻詞</b>。有「好像」但只是猜想或同類比較，就不是比喻。';
  return '<div class="screen result-wrap">' +
    topbar('偵探報告', v.name + ' · 玩法：' + MODES[S.mode].name) +
    '<div class="result-card"><div class="result-inner">' +
      '<span class="result-tag">CASE REPORT · ' + v.name + '</span>' +
      '<div class="result-art">' + art('mascot','result-art-inner') + '</div>' +
      '<div class="result-stars">' + stars(n) + '</div>' +
      '<h2>' + (n>=2?'破案成功！':'繼續加油！') + '</h2>' +
      '<div class="result-score">' + ICON.star + '答對 ' + S.correct + ' / 6 題</div>' +
      '<p class="result-sub">' + msg + '</p>' +
      '<div class="result-actions">' +
        '<button class="btn" data-act="retry">' + ICON.retry + '再玩一次</button>' +
        '<button class="btn ghost" data-act="games">' + ICON.play + '換個玩法</button>' +
      '</div>' +
    '</div></div>' +
    '<div class="result-note">' + ICON.bulb + '<span>' + note + '</span></div>' +
  '</div>';
}

/* ---------------- 渲染 ---------------- */
var app = document.getElementById('app');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function render(){
  var html = '';
  if(S.screen==='home') html = homeHTML();
  else if(S.screen==='vhome') html = vhomeHTML();
  else if(S.screen==='learn') html = learnHTML();
  else if(S.screen==='games') html = gamesHTML();
  else if(S.screen==='game') html = gameHTML();
  else if(S.screen==='result') html = resultHTML();
  app.innerHTML = html;
  var brandInner = app.querySelector('.brand-mark svg');
  if(brandInner){ brandInner.setAttribute('width','100%'); brandInner.setAttribute('height','100%'); }
}
function scrollTop(){
  try{ window.scrollTo({top:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
}
function go(screen){
  S.screen = screen;
  render();
  scrollTop();
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
}
function scrollFeedback(){
  setTimeout(function(){
    var f = document.getElementById('feedback');
    if(f && f.scrollIntoView){ f.scrollIntoView({behavior:'smooth',block:'center'}); }
  }, 70);
}
function confetti(){
  var colors = ['#FFC94D','#FF7A6B','#3FBF93','#54B6E8','#9C86F5','#FFB3C7'];
  for(var i=0;i<28;i++){
    var d = document.createElement('i');
    d.className = 'confetti';
    d.style.left = (Math.random()*100) + '%';
    d.style.background = colors[i % colors.length];
    d.style.animationDelay = (Math.random()*0.55) + 's';
    d.style.width = (6 + Math.random()*6) + 'px';
    d.style.height = (9 + Math.random()*7) + 'px';
    document.body.appendChild(d);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3400); })(d);
  }
}

/* ---------------- 流程 ---------------- */
function startMode(m){
  S.mode = m; S.qi = 0; S.correct = 0;
  S.chosen = null; S.answered = false;
  S.placed = [null,null]; S.sel = null; S.checked = false;
  go('game');
}
function resetQuestion(){
  S.chosen = null; S.answered = false;
  S.placed = [null,null]; S.sel = null; S.checked = false;
}
function nextQuestion(){
  if(S.qi >= 5){
    var n = S.correct >= 6 ? 3 : (S.correct >= 4 ? 2 : (S.correct >= 1 ? 1 : 0));
    if(!store[S.ver]) store[S.ver] = {a:0,b:0,c:0};
    if(n > (store[S.ver][S.mode] || 0)){ store[S.ver][S.mode] = n; save(); }
    S.screen = 'result';
    render();
    scrollTop();
    Sfx.win();
    setTimeout(function(){ Sfx.star(0); }, 260);
    setTimeout(function(){ Sfx.star(1); }, 400);
    setTimeout(function(){ Sfx.star(2); }, 540);
    if(n >= 2) setTimeout(confetti, 220);
    return;
  }
  S.qi++;
  resetQuestion();
  render();
  scrollTop();
}

function answerA(val){
  if(S.answered) return;
  S.answered = true;
  S.chosen = (val === '1');
  var q = QD().a[S.qi];
  if(S.chosen === q.ok){ S.correct++; Sfx.correct(); }
  else { Sfx.wrong(); }
  render();
  scrollFeedback();
}
function answerB(i){
  if(S.answered) return;
  S.answered = true;
  S.chosen = i;
  var d = QD().b[S.qi];
  if(d.options[i].ok){ S.correct++; Sfx.correct(); }
  else { Sfx.wrong(); }
  render();
  scrollFeedback();
}
function pickCard(i){
  if(S.checked) return;
  if(S.placed[i] !== null && S.placed[i] !== undefined){
    S.placed[i] = null;
    S.sel = i;
  } else {
    S.sel = (S.sel === i) ? null : i;
  }
  Sfx.click();
  render();
}
function placeBin(val){
  if(S.checked) return;
  if(S.sel === null){ toast('先點一句句子，再選籃子'); return; }
  S.placed[S.sel] = val;
  S.sel = null;
  Sfx.drop();
  render();
}
function checkSort(){
  if(S.checked) return;
  if(S.placed[0] === null || S.placed[1] === null){ toast('兩句都要放入籃子哦'); return; }
  S.checked = true;
  var d = QD().c[S.qi];
  var all = true;
  d.items.forEach(function(it,i){ if((S.placed[i] === 1) !== it.ok) all = false; });
  if(all){ S.correct++; Sfx.correct(); } else { Sfx.wrong(); }
  render();
  scrollFeedback();
}

/* ---------------- 事件 ---------------- */
app.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.getAttribute('data-act');
  Sfx.init();
  if(act !== 'sound') Sfx.click();

  if(act==='sound'){
    store.mute = !store.mute;
    Sfx.on = !store.mute;
    save();
    render();
    if(!store.mute) Sfx.pop();
    toast(store.mute ? '已關閉音效' : '已開啟音效');
    return;
  }
  if(act==='home'){ S.screen='home'; render(); scrollTop(); return; }
  if(act==='vhome'){ S.screen='vhome'; render(); scrollTop(); return; }
  if(act==='ver'){
    S.ver = t.getAttribute('data-ver');
    S.screen = 'vhome';
    Sfx.flip();
    render(); scrollTop(); return;
  }
  if(act==='learn'){ S.screen='learn'; S.page=0; S.part=0; S.word=0; S.kind=0; S.reveal=false; Sfx.flip(); render(); scrollTop(); return; }
  if(act==='games'){ S.screen='games'; render(); scrollTop(); return; }
  if(act==='page'){ S.page = parseInt(t.getAttribute('data-i'),10); Sfx.flip(); render(); scrollTop(); return; }
  if(act==='nextpage'){ if(S.page<4){ S.page++; Sfx.flip(); render(); scrollTop(); } return; }
  if(act==='prevpage'){ if(S.page>0){ S.page--; Sfx.flip(); render(); scrollTop(); } return; }
  if(act==='word'){ S.word = parseInt(t.getAttribute('data-i'),10); Sfx.pop(); render(); return; }
  if(act==='part'){ S.part = parseInt(t.getAttribute('data-i'),10); Sfx.pop(); render(); return; }
  if(act==='kind'){ S.kind = parseInt(t.getAttribute('data-i'),10); Sfx.pop(); render(); return; }
  if(act==='reveal'){ S.reveal = !S.reveal; Sfx.flip(); render(); return; }
  if(act==='mode'){ startMode(t.getAttribute('data-mode')); return; }
  if(act==='ansA'){ answerA(t.getAttribute('data-val')); return; }
  if(act==='ansB'){ answerB(parseInt(t.getAttribute('data-i'),10)); return; }
  if(act==='pickCard'){ pickCard(parseInt(t.getAttribute('data-i'),10)); return; }
  if(act==='bin'){ placeBin(parseInt(t.getAttribute('data-val'),10)); return; }
  if(act==='checkSort'){ checkSort(); return; }
  if(act==='next'){ nextQuestion(); return; }
  if(act==='retry'){ startMode(S.mode); return; }
});

render();
</script>
</body>
</html>
