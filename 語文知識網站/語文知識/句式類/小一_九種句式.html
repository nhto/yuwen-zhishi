<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>句子小鎮 · 九種句式探險隊</title>
<meta name="description" content="小一、小二繁體中文句式遊戲：有……、有……還有……、又……又……、……得……、更……、一邊……一邊……、……，還……。、……一面……，一面……。、……有時……，有時……。，每種句式兩種玩法，Q版卡通圖文配合，手機可直接玩。">
<meta name="theme-color" content="#FBF6EA">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --font:"Yuanti TC","Yuanti SC","Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --paper:#FBF6EA;
  --card:#FFFDF7;
  --ink:#332F45;
  --ink-2:#615B78;
  --ink-3:#948DA8;
  --line:rgba(51,47,69,.14);
  --yellow:#FFC94A;
  --blue:#3FA9DC; --blue-l:#DDF2FC; --blue-d:#1B7BA8;
  --green:#57B98A; --green-l:#DFF4E9; --green-d:#2E8A61;
  --pink:#F2749A; --pink-l:#FDE3EC; --pink-d:#C74A72;
  --purple:#8B7BD8; --purple-l:#EAE5FC; --purple-d:#6353B8;
  --warn:#FFE7DA; --warn-d:#A94E27;
  --red:#E85A5A; --red-l:#FDE2E2; --red-d:#B83A3A;
  --teal:#2EB8A8; --teal-l:#D4F4F0; --teal-d:#1A8A7D;
  --orange:#FF8A5C; --orange-l:#FFE7DA; --orange-d:#A94E27;
  --brown:#B9805A; --brown-l:#F2E6D8; --brown-d:#8B5A3C;
  --lavender:#B8A9D9; --lavender-l:#F0EDF8; --lavender-d:#7A6BA8;
  --shadow:0 5px 0 rgba(51,47,69,.13);
  --shadow-sm:0 3px 0 rgba(51,47,69,.13);
  --accent:var(--blue); --accent-l:var(--blue-l); --accent-d:var(--blue-d);
}
[data-p="you"]{--accent:var(--blue);--accent-l:var(--blue-l);--accent-d:var(--blue-d)}
[data-p="haiyou"]{--accent:var(--green);--accent-l:var(--green-l);--accent-d:var(--green-d)}
[data-p="youyou"]{--accent:var(--pink);--accent-l:var(--pink-l);--accent-d:var(--pink-d)}
[data-p="de"]{--accent:var(--purple);--accent-l:var(--purple-l);--accent-d:var(--purple-d)}
[data-p="geng"]{--accent:var(--red);--accent-l:var(--red-l);--accent-d:var(--red-d)}
[data-p="yibian"]{--accent:var(--teal);--accent-l:var(--teal-l);--accent-d:var(--teal-d)}
[data-p="hai"]{--accent:var(--orange);--accent-l:var(--orange-l);--accent-d:var(--orange-d)}
[data-p="yimian"]{--accent:var(--brown);--accent-l:var(--brown-l);--accent-d:var(--brown-d)}
[data-p="youshi"]{--accent:var(--lavender);--accent-l:var(--lavender-l);--accent-d:var(--lavender-d)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100dvh;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 6% -8%, #FFE9C9 0, rgba(255,233,201,0) 38%),
    radial-gradient(circle at 98% 2%, #DDF2FC 0, rgba(221,242,252,0) 34%),
    radial-gradient(circle at 50% 106%, #E3F6EA 0, rgba(227,246,234,0) 44%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(51,47,69,.12) 1.2px, transparent 1.2px);
  background-size:24px 24px;opacity:.32;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent-d);outline-offset:3px;border-radius:14px}
[hidden]{display:none!important}
svg{display:block}
::selection{background:var(--accent-l)}
.app{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.is-active{display:block;animation:rise .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(10px)}to{transform:translateY(0)}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:42px;height:42px;flex:0 0 42px;filter:drop-shadow(0 3px 0 rgba(51,47,69,.14))}
.brand-text{min-width:0}
.brand-text strong{display:block;font-size:17px;font-weight:900;letter-spacing:.04em;line-height:1.2}
.brand-text span{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-3)}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;
  background:var(--card);border:2.5px solid var(--ink);border-radius:15px;box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:21px;height:21px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;margin-top:2px;padding:16px 16px 14px;
  background:var(--card);border:2.5px solid var(--ink);border-radius:28px;box-shadow:var(--shadow);
}
.hero::before{
  content:"";position:absolute;right:-52px;top:-58px;width:186px;height:186px;border-radius:50%;
  background:var(--yellow);opacity:.28;
}
.hero::after{
  content:"";position:absolute;right:34px;bottom:-46px;width:110px;height:110px;border-radius:50%;
  background:var(--blue-l);opacity:.8;
}
.hero-copy{position:relative;z-index:2;max-width:64%}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;margin:0 0 8px;padding:4px 9px;
  font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent-d);
  background:var(--accent-l);border:1.5px solid rgba(51,47,69,.18);border-radius:999px;
}
.hero h1{margin:0;font-size:clamp(30px,9vw,38px);line-height:1.08;font-weight:900;letter-spacing:.03em}
.hero h1 em{font-style:normal;color:var(--accent-d)}
.hero-sub{margin:8px 0 12px;font-size:13.5px;line-height:1.6;color:var(--ink-2);font-weight:600}
.stat-pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;
  background:#FFF3D4;border:2px solid var(--ink);border-radius:999px;
  font-size:13px;font-weight:800;box-shadow:0 2px 0 rgba(51,47,69,.16);
}
.stat-pill b{font-size:16px;color:#9A6B00}
.stat-pill svg{width:15px;height:15px}
.hero-art{position:absolute;right:-4px;bottom:-2px;width:140px;height:140px;z-index:1;pointer-events:none}
.hero-art svg{width:100%;height:100%}

/* ---------- section head ---------- */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:24px 2px 10px}
.section-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:.03em}
.section-head p{margin:0;font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:right;line-height:1.4}

/* ---------- trail / stations ---------- */
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding:4px 0 2px}
.trail::before{
  content:"";position:absolute;left:25px;top:22px;bottom:26px;width:0;
  border-left:3px dashed rgba(51,47,69,.2);
}
.station{
  position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:24px;
  padding:13px 13px 12px;box-shadow:var(--shadow);
}
.station:nth-child(even){margin-left:14px}
.station-top{display:flex;align-items:center;gap:11px}
.station-badge{
  width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;
  background:var(--accent-l);border:2.5px solid var(--ink);border-radius:15px;
  font-size:15px;font-weight:900;color:var(--accent-d);letter-spacing:.02em;
}
.station-info{flex:1;min-width:0}
.station-info h3{margin:0;font-size:21px;font-weight:900;line-height:1.2;letter-spacing:.02em}
.station-info p{margin:2px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station-mascot{width:52px;height:52px;flex:0 0 52px}
.station-mascot svg{width:100%;height:100%}
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.mode-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:9px 11px 8px;background:var(--accent-l);border:2px solid var(--ink);border-radius:15px;
  box-shadow:0 3px 0 rgba(51,47,69,.16);transition:transform .12s ease, box-shadow .12s ease;
}
.mode-btn:active{transform:translateY(3px);box-shadow:none}
.mode-name{font-size:14.5px;font-weight:800;letter-spacing:.02em}
.mode-stars{display:flex;align-items:center;gap:2px}
.mode-stars svg{width:12px;height:12px}

/* ---------- dictionary entry ---------- */
.dict-entry{
  width:100%;display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px;
  background:#FFF3D4;border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);
  text-align:left;transition:transform .12s ease, box-shadow .12s ease;
}
.dict-entry:active{transform:translateY(3px);box-shadow:none}
.dict-ico{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;background:var(--card);border:2px solid var(--ink);border-radius:13px}
.dict-ico svg{width:22px;height:22px}
.dict-txt{flex:1;min-width:0}
.dict-txt strong{display:block;font-size:15.5px;font-weight:900}
.dict-txt span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}
.dict-entry > svg{width:18px;height:18px;flex:0 0 18px}

.foot-note{margin:18px 4px 0;font-size:11.5px;line-height:1.7;color:var(--ink-3);text-align:center;font-weight:600}

/* ---------- game ---------- */
.game-bar{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.game-title{flex:1;min-width:0}
.game-title strong{display:block;font-size:18px;font-weight:900;line-height:1.25;letter-spacing:.02em}
.game-title span{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent-d)}
.q-pill{
  flex:0 0 auto;padding:7px 11px;background:var(--card);border:2.5px solid var(--ink);border-radius:13px;
  font-size:12px;font-weight:800;box-shadow:var(--shadow-sm);color:var(--ink-2);
}
.q-pill b{font-size:16px;color:var(--ink)}
.dots{display:flex;gap:5px;margin:0 1px 14px}
.dot{height:8px;flex:1;border-radius:99px;background:rgba(51,47,69,.13);transition:background .3s ease}
.dot.done{background:var(--accent)}
.dot.now{background:var(--accent);opacity:.45}

.pic-card{
  position:relative;margin:6px 0 0;padding:7px;background:#fff;
  border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);
  transform:rotate(-1.2deg);
}
.pic-card .tape{
  position:absolute;top:-11px;left:50%;z-index:3;width:66px;height:20px;
  transform:translateX(-50%) rotate(-2.5deg);
  background:rgba(255,201,74,.8);border:1.5px solid rgba(51,47,69,.28);border-radius:3px;
}
.pic-box{border-radius:16px;overflow:hidden;background:#EAF6FF;aspect-ratio:320/220}
.pic-box svg{width:100%;height:100%}

.q-panel{margin-top:16px}
.q-label{margin:0 0 7px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--accent-d)}
.sentence{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px;
  font-size:clamp(25px,7.4vw,30px);font-weight:900;line-height:1.5;letter-spacing:.02em;
  min-height:48px;
}
.sentence .txt{white-space:pre-wrap}
.blank{
  display:inline-grid;place-items:center;min-width:2.1em;padding:0 8px;margin:0 2px;
  border-bottom:4px dashed var(--accent);color:var(--accent-d);line-height:1.35;
}
.blank.filled{border-bottom-style:solid;background:var(--accent-l);border-radius:8px 8px 4px 4px}
.speak-btn{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;margin-left:2px;
  background:var(--accent-l);border:2px solid rgba(51,47,69,.2);border-radius:11px;
}
.speak-btn svg{width:17px;height:17px}

.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}
.opt{
  min-height:60px;display:grid;place-items:center;padding:8px 4px;
  background:var(--card);border:2.5px solid var(--ink);border-radius:16px;
  font-size:21px;font-weight:900;letter-spacing:.03em;box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease, opacity .2s ease;
}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.correct{background:var(--accent-l);border-color:var(--accent-d);color:var(--accent-d)}
.options.solved .opt:not(.correct){opacity:.42;border-color:rgba(51,47,69,.3);color:var(--ink-3)}
.opt.wrong{opacity:.4;text-decoration:line-through;border-color:rgba(51,47,69,.35)}
.opt[disabled]{cursor:default}

.build-area{margin-top:12px}
.slots{
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
  min-height:78px;padding:10px;border:2.5px dashed rgba(51,47,69,.3);border-radius:17px;
  background:rgba(255,255,255,.55);transition:border-color .2s ease,background .2s ease;
}
.slots.has-item{border-style:solid;border-color:rgba(51,47,69,.22);background:var(--card)}
.slots.shake{animation:shake .38s ease}
.slots.ok{border-color:var(--accent);background:var(--accent-l)}
.slots .ghost{font-size:12.5px;font-weight:700;color:var(--ink-3);align-self:center;margin:auto;text-align:center;line-height:1.5;padding:0 6px}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:56px}
.tile{
  padding:10px 13px;background:var(--accent-l);border:2.5px solid var(--ink);border-radius:14px;
  font-size:18px;font-weight:900;letter-spacing:.02em;box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease;
}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile.placed{background:#fff}
.tile.pop{animation:pop .25s ease}
.reset-btn{
  margin-top:12px;font-size:12.5px;font-weight:800;color:var(--ink-2);
  padding:7px 12px;border:2px dashed rgba(51,47,69,.28);border-radius:12px;background:rgba(255,255,255,.6);
}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.86)}to{transform:scale(1)}}

.feedback{
  display:flex;gap:9px;align-items:flex-start;margin-top:13px;padding:11px 12px;
  border:2px solid var(--ink);border-radius:16px;background:var(--accent-l);
  animation:rise .26s ease;
}
.feedback.bad{background:var(--warn)}
.fb-ico{width:26px;height:26px;flex:0 0 26px;margin-top:1px}
.fb-body{min-width:0}
.fb-body strong{display:block;font-size:14.5px;font-weight:900;margin-bottom:2px}
.fb-body p{margin:0;font-size:13.5px;line-height:1.55;font-weight:600;color:var(--ink-2)}
.feedback.bad .fb-body p{color:#6E3A22}
.next-btn{
  width:100%;margin-top:13px;padding:15px 16px;
  background:var(--accent);border:2.5px solid var(--ink);border-radius:18px;
  font-size:17px;font-weight:900;letter-spacing:.05em;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.next-btn:active{transform:translateY(4px);box-shadow:none}

/* ---------- result ---------- */
.result-wrap{padding-top:12px;text-align:center}
.result-card{
  position:relative;overflow:hidden;padding:24px 18px 20px;
  background:var(--card);border:2.5px solid var(--ink);border-radius:30px;box-shadow:var(--shadow);
}
.result-card::before{
  content:"";position:absolute;left:-60px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:var(--accent-l);
}
.result-mascot{position:relative;z-index:1;width:96px;height:96px;margin:0 auto 6px}
.result-mascot svg{width:100%;height:100%}
.result-kicker{position:relative;z-index:1;margin:0;font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent-d)}
.result-card h2{position:relative;z-index:1;margin:4px 0 4px;font-size:25px;font-weight:900;letter-spacing:.03em}
.result-sub{position:relative;z-index:1;margin:0;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.big-stars{position:relative;z-index:1;display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.big-stars svg{width:48px;height:48px;animation:starPop .45s cubic-bezier(.2,1.5,.4,1) backwards}
.big-stars svg:nth-child(1){animation-delay:.06s}
.big-stars svg:nth-child(2){animation-delay:.2s}
.big-stars svg:nth-child(3){animation-delay:.34s}
@keyframes starPop{from{transform:scale(.2) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
.score-line{position:relative;z-index:1;margin:8px 0 0;font-size:14px;font-weight:800;color:var(--ink-2)}
.score-line b{font-size:22px;color:var(--accent-d)}
.result-actions{display:grid;gap:10px;margin-top:18px;position:relative;z-index:1}
.btn-primary{
  padding:15px;background:var(--accent);border:2.5px solid var(--ink);border-radius:18px;
  font-size:16.5px;font-weight:900;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;
}
.btn-primary:active{transform:translateY(4px);box-shadow:none}
.btn-ghost{
  padding:13px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;
  font-size:15px;font-weight:800;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease;
}
.btn-ghost:active{transform:translateY(3px);box-shadow:none}
.new-best{
  display:inline-block;margin-top:10px;padding:5px 11px;background:var(--yellow);
  border:2px solid var(--ink);border-radius:999px;font-size:11.5px;font-weight:900;letter-spacing:.06em;
  transform:rotate(-2deg);
}
.confetti{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(520deg)}}

/* ---------- dictionary ---------- */
.dict-head{padding:8px 2px 14px}
.dict-head h2{margin:6px 0 4px;font-size:26px;font-weight:900;letter-spacing:.03em}
.dict-head p{margin:0;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.6}
.dict-card{
  position:relative;margin-bottom:12px;padding:14px;background:var(--card);
  border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);
}
.dict-card-top{display:flex;align-items:center;gap:10px}
.dict-num{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:11px;
  background:var(--accent-l);border:2px solid var(--ink);font-size:12px;font-weight:900;color:var(--accent-d);
}
.dict-card h3{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:10px 0 4px}
.formula span{
  padding:5px 9px;background:var(--accent-l);border:1.5px solid rgba(51,47,69,.22);
  border-radius:9px;font-size:12.5px;font-weight:800;color:var(--accent-d);
}
.formula em{font-style:normal;font-weight:900;color:var(--ink-3);font-size:13px}
.dict-ex{margin:8px 0 0;font-size:14.5px;font-weight:700;line-height:1.75;color:var(--ink-2)}
.dict-ex b{color:var(--accent-d)}
.dict-tip{margin:8px 0 0;padding-top:8px;border-top:1.5px dashed rgba(51,47,69,.18);font-size:12.5px;font-weight:600;color:var(--ink-3);line-height:1.6}

/* ---------- responsive ---------- */
@media (min-width:860px){
  .app{max-width:980px;padding:26px 28px 44px}
  .brand-text strong{font-size:19px}
  .hero{padding:24px 26px;border-radius:32px;min-height:220px;display:flex;align-items:center}
  .hero-copy{max-width:58%}
  .hero h1{font-size:46px}
  .hero-sub{font-size:15px;max-width:340px}
  .hero-art{width:210px;height:210px;right:34px;bottom:-6px}
  .section-head h2{font-size:24px}

    $('#gamePattern').textContent = DATA[pid].name;
    $('#gameMode').textContent = DATA[pid].modeLabels[mode];
    $('#qTotal').textContent = state.qs.length;

    go('screen-game');
    renderQ();
  }

  function renderQ() {
    var q = state.qs[state.i];
    state.first = true;
    state.locked = false;
    state.checking = false;
    state.placed = [];
    state.pool = [];

    $('#qNow').textContent = state.i + 1;
    renderDots();
    $('#picBox').innerHTML = ART[q.scene];
    $('#feedback').hidden = true;
    $('#feedback').innerHTML = '';
    $('#nextBtn').hidden = true;
    $('#nextBtn').textContent = state.i === state.qs.length - 1 ? '看成績' : '下一題';
    $('#buildArea').hidden = true;
    $('#options').hidden = true;
    $('#sentence').hidden = false;
    $('#sentence').innerHTML = '';
    $('#options').innerHTML = '';
    $('#options').classList.remove('solved');
    $('#slots').className = 'slots';
    $('#slots').innerHTML = '';
    $('#tray').innerHTML = '';
    $('#tray').style.minHeight = '';
    $('#resetBtn').hidden = false;

    if (state.mode === 'pick') renderPick(q);
    else renderBuild(q);
  }

  function renderDots() {
    var html = '';
    for (var i = 0; i < state.qs.length; i++) {
      var cls = 'dot';
      if (i < state.i) cls += ' done';
      else if (i === state.i) cls += ' now';
      html += '<span class="' + cls + '"></span>';
    }
    $('#dots').innerHTML = html;
  }

  /* ---------------- pick mode ---------------- */
  function renderPick(q) {
    $('#qLabel').textContent = '看圖，選出正確的詞';
    $('#sentence').innerHTML =
      '<span class="txt">' + q.before + '</span>' +
      '<span class="blank" id="blankSlot">＿</span>' +
      '<span class="txt">' + q.after + '</span>' +
      '<button class="speak-btn" id="speakBtn" type="button" aria-label="聆聽完整句子">' + SPEAKER_ICON + '</button>';

    var opts = shuffle(q.options);
    $('#options').innerHTML = opts.map(function (w) {
      return '<button class="opt" type="button" data-w="' + w + '">' + w + '</button>';
    }).join('');
    $('#options').hidden = false;

    var btn = $('#speakBtn');
    if (btn) {
      btn.addEventListener('click', function () {
        Sound.tap();
        speak(q.before.replace(/＿/g, '') + q.answer + q.after);
      });
    }
  }

  function onOptionClick(e) {
    var btn = e.target.closest ? e.target.closest('.opt') : null;
    if (!btn || state.mode !== 'pick' || state.locked) return;

    var q = state.qs[state.i];
    var word = btn.getAttribute('data-w');

    if (word === q.answer) {
      state.locked = true;
      btn.classList.add('correct');
      $('#options').classList.add('solved');
      var slot = $('#blankSlot');
      if (slot) {
        slot.textContent = q.answer;
        slot.classList.add('filled');
      }
      if (state.first) state.score += 1;
      Sound.correct();
      vibrate(14);
      showFeedback(true, q.why);
      showNext();
    } else {
      state.first = false;
      btn.classList.add('wrong');
      btn.disabled = true;
      Sound.wrong();
      vibrate([18, 40, 18]);
      showFeedback(false, q.hint);
    }
  }

  /* ---------------- build mode ---------------- */
  function renderBuild(q) {
    $('#qLabel').textContent = '把詞卡排成一句話';
    $('#sentence').hidden = true;
    $('#buildArea').hidden = false;
    state.pool = shuffle(q.tiles.map(function (t, i) { return { text: t, id: i }; }));
    state.placed = [];
    renderBuildState();
  }

  function renderBuildState() {
    var q = state.qs[state.i];
    var slots = $('#slots');
    if (state.placed.length === 0) {
      slots.className = 'slots';
      slots.innerHTML = '<span class="ghost">點下面的詞卡，按順序放進來</span>';
    } else {
      slots.className = 'slots has-item';
      slots.innerHTML = state.placed.map(function (t) {
        return '<button class="tile placed" type="button" data-id="' + t.id + '">' + t.text + '</button>';
      }).join('');
    }
    $('#tray').innerHTML = state.pool.map(function (t) {
      return '<button class="tile" type="button" data-id="' + t.id + '">' + t.text + '</button>';
    }).join('');
    $('#tray').style.minHeight = state.pool.length ? '' : '0px';
    if (state.placed.length === q.tiles.length) slots.classList.add('has-item');
  }

  function onTrayClick(e) {
    var btn = e.target.closest ? e.target.closest('.tile') : null;
    if (!btn || state.mode !== 'build' || state.locked) return;
    var id = Number(btn.getAttribute('data-id'));
    var idx = -1;
    for (var i = 0; i < state.pool.length; i++) {
      if (state.pool[i].id === id) { idx = i; break; }
    }
    if (idx < 0) return;
    var tile = state.pool.splice(idx, 1)[0];
    state.placed.push(tile);
    $('#feedback').hidden = true;
    Sound.place();
    renderBuildState();
    maybeCheckBuild();
  }

  function onSlotClick(e) {
    var btn = e.target.closest ? e.target.closest('.tile') : null;
    if (!btn || state.mode !== 'build' || state.locked) return;
    var id = Number(btn.getAttribute('data-id'));
    var idx = -1;
    for (var i = 0; i < state.placed.length; i++) {
      if (state.placed[i].id === id) { idx = i; break; }
    }
    if (idx < 0) return;
    var tile = state.placed.splice(idx, 1)[0];
    state.pool.push(tile);
    $('#feedback').hidden = true;
    Sound.tap();
    renderBuildState();
  }

  function maybeCheckBuild() {
    var q = state.qs[state.i];
    if (state.placed.length !== q.tiles.length || state.checking || state.locked) return;
    state.checking = true;
    window.setTimeout(function () {
      state.checking = false;
      if (state.locked) return;
      if (state.placed.length !== q.tiles.length) return;
      var joined = state.placed.map(function (t) { return t.text; }).join('');
      if (joined === q.tiles.join('')) {
        state.locked = true;
        state.score += state.first ? 1 : 0;
        $('#slots').classList.add('ok');
        $('#resetBtn').hidden = true;
        Sound.correct();
        vibrate(14);
        showFeedback(true, q.why);
        showNext();
      } else {
        state.first = false;
        Sound.wrong();
        vibrate([18, 40, 18]);
        var slots = $('#slots');
        slots.classList.remove('shake');
        void slots.offsetWidth;
        slots.classList.add('shake');
        showFeedback(false, q.hint + ' 點格子上的詞卡，可以把它拿回來重排。');
      }
    }, 170);
  }

  /* ---------------- shared ---------------- */
  function showFeedback(ok, text) {
    var el = $('#feedback');
    el.className = 'feedback' + (ok ? '' : ' bad');
    el.innerHTML = '<span class="fb-ico">' + (ok ? CHECK_ICON : BULB_ICON) + '</span>' +
      '<div class="fb-body"><strong>' + (ok ? '答對了！' : '再想一想') + '</strong>' +
      '<p>' + text + '</p></div>';
    el.hidden = false;
  }

  function showNext() {
    var btn = $('#nextBtn');
    btn.hidden = false;
    btn.textContent = state.i === state.qs.length - 1 ? '看成績' : '下一題';
  }

  function nextQuestion() {
    Sound.tap();
    if (state.i < state.qs.length - 1) {
      state.i += 1;
      renderQ();
    } else {
      finish();
    }
  }

  function finish() {
    var total = state.qs.length;
    var stars = state.score >= total ? 3 : (state.score >= total - 2 ? 2 : 1);
    var key = state.pid + '-' + state.mode;
    var prev = store.stars[key] || 0;
    var isNew = stars > prev;
    if (isNew) {
      store.stars[key] = stars;
      saveStore();
    }

    $('#screen-result').setAttribute('data-p', state.pid);
    $('#resultMascot').innerHTML = MASCOTS[state.pid];
    $('#resultKicker').textContent = '第 ' + DATA[state.pid].no + ' 站 · ' + DATA[state.pid].modeNames[state.mode];
    $('#resultTitle').textContent = stars === 3 ? '太厲害了！' : (stars === 2 ? '過關了！' : '完成挑戰！');
    $('#resultSub').textContent = stars === 3
      ? '每一題都答對，句式小達人就是你。'
      : (stars === 2 ? '只差一點點就滿分，再挑戰一次吧。' : '多讀幾次句子，下一次一定會更順。');
    $('#bigStars').innerHTML = starRow(stars);
    $('#resultScore').textContent = state.score;
    $('#resultTotal').textContent = total;

    var tag = '';
    if (isNew && stars > 0) tag = '<span class="new-best">新紀錄</span>';
    else if (prev > stars) tag = '<p class="result-sub" style="margin-top:8px">之前最佳：' + prev + ' 顆星</p>';
    $('#bestTag').innerHTML = tag;

    go('screen-result');
    Sound.win();
    confetti();
  }

  function confetti() {
    var box = document.createElement('div');
    box.className = 'confetti';
    var colors = ['#FFC94A', '#F2749A', '#3FA9DC', '#57B98A', '#8B7BD8', '#FF8A5C'];
    for (var i = 0; i < 26; i++) {
      var piece = document.createElement('i');
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDuration = (1.5 + Math.random() * 1.2) + 's';
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      box.appendChild(piece);
    }
    document.body.appendChild(box);
    window.setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 3400);
  }

  /* ---------------- sound toggle ---------------- */
  function updateSoundBtn() {
    $('#soundOnIcon').hidden = store.muted;
    $('#soundOffIcon').hidden = !store.muted;
    var b = $('#soundBtn');
    b.setAttribute('aria-pressed', String(!store.muted));
    b.setAttribute('aria-label', store.muted ? '開啟音效' : '關閉音效');
  }

  /* ---------------- dictionary ---------------- */
  function renderDict() {
    $('#dictGrid').innerHTML = ORDER.map(function (pid) {
      var p = DATA[pid];
      var formula = p.formula.map(function (part, i) {
        return (i ? '<em>＋</em>' : '') + '<span>' + part + '</span>';
      }).join('');
      return '<article class="dict-card" data-p="' + pid + '">' +
        '<div class="dict-card-top"><span class="dict-num">' + p.no + '</span><h3>' + p.name + '</h3></div>' +
        '<div class="formula">' + formula + '</div>' +
        '<p class="dict-ex">' + p.examples.join('<br>') + '</p>' +
        '<p class="dict-tip">' + p.formulaNote + '</p>' +
      '</article>';
    }).join('');
  }

  /* ---------------- events ---------------- */
  function bind() {
    renderHome();
    renderDict();
    updateSoundBtn();

    $('#trail').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.mode-btn') : null;
      if (!btn) return;
      Sound.tap();
      startGame(btn.getAttribute('data-p'), btn.getAttribute('data-m'));
    });

    $('#options').addEventListener('click', onOptionClick);
    $('#tray').addEventListener('click', onTrayClick);
    $('#slots').addEventListener('click', onSlotClick);

    $('#nextBtn').addEventListener('click', nextQuestion);

    $('#resetBtn').addEventListener('click', function () {
      if (state.mode !== 'build' || state.locked) return;
      var q = state.qs[state.i];
      state.pool = shuffle(q.tiles.map(function (t, i) { return { text: t, id: i }; }));
      state.placed = [];
      $('#feedback').hidden = true;
      Sound.tap();
      renderBuildState();
    });

    $('#backHome').addEventListener('click', function () { Sound.tap(); go('screen-home'); });
    $('#resultHome').addEventListener('click', function () { Sound.tap(); renderHome(); go('screen-home'); });
    $('#againBtn').addEventListener('click', function () {
      Sound.tap();
      startGame(state.pid, state.mode);
    });

    $('#openDict').addEventListener('click', function () { Sound.tap(); go('screen-dict'); });
    $('#dictBack').addEventListener('click', function () { Sound.tap(); go('screen-home'); });

    $('#soundBtn').addEventListener('click', function () {
      store.muted = !store.muted;
      saveStore();
      updateSoundBtn();
      if (!store.muted) Sound.tap();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var active = $('.screen.is-active');
        if (active && (active.id === 'screen-dict' || active.id === 'screen-game')) {
          go('screen-home');
        }
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();

</script>
</body>
</html>
