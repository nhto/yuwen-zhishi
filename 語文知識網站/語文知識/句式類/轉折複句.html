<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轉折小偵探｜小學轉折複句互動遊戲</title>
<meta name="description" content="九組關聯詞、兩種玩法、108 組題目的小學轉折複句互動課件，支援手機、平板與電腦。">
<style>
:root{
  --cream:#FFF7E8;--paper:#FFFFFF;--ink:#2B2A35;--ink-soft:#5D5A68;
  --orange:#FF8A3D;--orange-d:#E4681A;--sky:#3E7CB1;--sky-d:#2C5F8C;
  --purple:#7C6BD6;--purple-d:#5F4FBC;--green:#2FA97A;--yellow:#FFC94D;
  --pink:#FF6B8A;--line:rgba(43,42,53,.16);--shadow:0 6px 0 rgba(43,42,53,.14);
  --r:22px;
}
*{box-sizing:border-box}
html{font-size:clamp(17px,1.2vw + 13px,21px);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);line-height:1.6;
  font-family:"PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC","Noto Sans TC",system-ui,sans-serif;
  background:
    radial-gradient(circle at 8% 4%,rgba(255,214,160,.55) 0,transparent 38%),
    radial-gradient(circle at 94% 6%,rgba(190,224,255,.6) 0,transparent 36%),
    radial-gradient(circle at 50% 100%,rgba(255,196,214,.35) 0,transparent 45%),
    var(--cream);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(43,42,53,.13) 1px,transparent 1px);
  background-size:22px 22px;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit}
img,svg{display:block}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.6rem;
  padding:.55rem clamp(.7rem,2vw,1.2rem);
  background:rgba(255,247,232,.93);backdrop-filter:blur(10px);
  border-bottom:3px solid rgba(43,42,53,.12);
}
.topbar .grow{flex:1;min-width:0;text-align:center;font-weight:900;font-size:1rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:3rem;height:3rem;min-width:3rem;border-radius:50%;border:3px solid var(--ink);
  background:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 0 rgba(43,42,53,.2);transition:transform .12s,box-shadow .12s;
}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,42,53,.2)}
.iconbtn svg{width:1.4rem;height:1.4rem}
.iconbtn.off{opacity:.45}

/* ---------- shell ---------- */
.view{width:100%;max-width:1180px;margin:0 auto;padding:1rem clamp(.75rem,2.4vw,1.5rem) 3.2rem;flex:1}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-title{font-size:1.15rem;font-weight:900;margin:0 0 .7rem;display:flex;align-items:center;gap:.45rem}
.sec-title .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--orange);border:2px solid var(--ink)}
.sub{color:var(--ink-soft);font-size:.95rem;margin:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:3.2rem;padding:.55rem 1.2rem;border:3px solid var(--ink);border-radius:999px;
  background:#fff;color:var(--ink);font-size:1rem;font-weight:900;cursor:pointer;
  box-shadow:0 4px 0 rgba(43,42,53,.22);transition:transform .12s,box-shadow .12s,background .15s;
  text-align:center;line-height:1.35;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,42,53,.22)}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.btn.orange{background:var(--orange);color:var(--ink)}
.btn.sky{background:var(--sky);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 4px 0 rgba(43,42,53,.12)}
.btn .bi{width:1.35rem;height:1.35rem;flex:0 0 auto}
.btn .bi svg{width:100%;height:100%}

/* ---------- home ---------- */
.home{padding-top:.6rem;display:grid;gap:1.3rem;align-items:center}
@media(min-width:880px){.home{grid-template-columns:1.05fr .95fr;gap:2.2rem;padding-top:2rem}}
.badge{
  display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:.22rem .85rem;font-size:.82rem;font-weight:900;
  box-shadow:0 3px 0 rgba(43,42,53,.14)
}
.badge .bi{width:1rem;height:1rem}
.title{font-size:clamp(2.2rem,6.2vw,3.7rem);font-weight:900;line-height:1.15;margin:.7rem 0 .5rem;letter-spacing:.01em}
.title em{font-style:normal;color:var(--orange);text-shadow:2px 2px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.lead{font-size:1.05rem;color:var(--ink-soft);margin:0 0 1.1rem;max-width:30ch}
.home .cta{display:flex;flex-wrap:wrap;gap:.65rem}
.home .cta .btn{flex:1 1 12rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:1.2rem}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.55rem .5rem;text-align:center;box-shadow:0 4px 0 rgba(43,42,53,.12)}
.stat b{display:block;font-size:1.5rem;line-height:1.15}
.stat span{font-size:.76rem;color:var(--ink-soft);font-weight:700}
.hero-art{position:relative;display:grid;place-items:center}
.hero-art svg{width:min(100%,26rem);height:auto;filter:drop-shadow(0 10px 0 rgba(43,42,53,.1))}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.howto{margin-top:1.3rem;padding:1rem 1.1rem}
.howto ol{margin:.4rem 0 0;padding-left:1.3rem;font-size:.95rem}
.howto li{margin:.25rem 0}

/* ---------- map ---------- */
.map-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.6rem;margin:.2rem 0 1rem}
.map-head h1{font-size:clamp(1.5rem,3.4vw,2.1rem);margin:0}
.star-total{display:inline-flex;align-items:center;gap:.35rem;font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.25rem .8rem;box-shadow:0 3px 0 rgba(43,42,53,.14)}
.star-total svg{width:1.2rem;height:1.2rem}
.map{display:grid;grid-template-columns:1fr;gap:.85rem}
@media(min-width:620px){.map{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.map{grid-template-columns:repeat(3,1fr)}}
.mapcard{
  display:flex;gap:.75rem;align-items:center;padding:.7rem;text-align:left;cursor:pointer;
  background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s;width:100%;
}
.mapcard:hover{transform:translateY(-2px)}
.mapcard:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(43,42,53,.14)}
.mapcard:focus-visible,.ing:focus-visible,.mcard:focus-visible,.spk:focus-visible,.iconbtn:focus-visible,.mode-btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.mapcard .thumb{width:6rem;height:6rem;min-width:6rem;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:#EAF4FF;box-shadow:inset 0 -6px 0 rgba(43,42,53,.06)}
.mapcard .thumb svg{width:100%;height:100%}
.mapcard .meta{min-width:0;flex:1}
.mapcard .name{font-weight:900;font-size:1.02rem;line-height:1.3;margin-bottom:.15rem}
.mapcard .tag{font-size:.72rem;font-weight:800;color:var(--ink-soft);background:rgba(43,42,53,.06);border-radius:999px;padding:.05rem .5rem;display:inline-block}
.stars{display:flex;align-items:center;gap:.12rem;font-size:.72rem;font-weight:800;color:var(--ink-soft);margin-top:.28rem}
.stars svg{width:.95rem;height:.95rem}
.stars .lbl{min-width:2.6rem;color:var(--ink-soft)}

/* ---------- lesson ---------- */
.lesson{display:grid;gap:.9rem}
.lhero{display:grid;grid-template-columns:1fr;gap:.9rem;padding:.9rem;align-items:center}
@media(min-width:720px){.lhero{grid-template-columns:17rem 1fr;gap:1.2rem;padding:1.1rem}}
.lhero .pic{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#EAF4FF}
.lhero .pic svg{width:100%;height:auto}
.lhero h1{font-size:clamp(1.55rem,4.2vw,2.3rem);margin:.15rem 0 .3rem;line-height:1.25}
.lhero p{margin:0;color:var(--ink-soft);font-size:1rem}
.formula{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.formula span{font-weight:900;font-size:.85rem;padding:.2rem .6rem;border:2px solid var(--ink);border-radius:10px;background:#FFF3DA}
.formula .arw{border:none;background:none;padding:0 .1rem;font-weight:900;display:grid;place-items:center}
.panel{padding:1rem 1.05rem}
.points{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.points li{display:flex;gap:.6rem;align-items:flex-start;font-size:.98rem;background:#FFFBF2;border:2px dashed rgba(43,42,53,.28);border-radius:14px;padding:.5rem .7rem}
.points .num{width:1.7rem;height:1.7rem;min-width:1.7rem;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.85rem;border:2px solid var(--ink)}
.examples{display:grid;gap:.6rem}
.ex{display:grid;grid-template-columns:4.6rem 1fr auto;gap:.55rem;align-items:center;background:#F6FAFF;border:2px solid rgba(62,124,177,.35);border-radius:16px;padding:.5rem .6rem}
.ex .eximg{width:4.6rem;height:3rem;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#EAF4FF}
.ex .eximg svg{width:100%;height:100%}
@media(min-width:640px){.ex .eximg{width:5.6rem;height:3.5rem}}
.ex .txt{font-size:1rem;font-weight:700;line-height:1.7}
.ex .hl{color:var(--orange-d);background:rgba(255,201,77,.45);border-radius:.25rem;padding:0 .12rem}
.ex .note{font-size:.8rem;color:var(--ink-soft);font-weight:600;margin-top:.15rem}
.spk{width:2.9rem;height:2.9rem;min-width:2.9rem;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(43,42,53,.18)}
.spk:active{transform:translateY(2px);box-shadow:none}
.spk svg{width:1.3rem;height:1.3rem}
.tipbox{display:flex;gap:.55rem;align-items:flex-start;background:#FFF0F4;border:2px dashed rgba(255,107,138,.7);border-radius:14px;padding:.6rem .75rem;font-size:.92rem}
.tipbox .bi{width:1.4rem;height:1.4rem;flex:0 0 auto;margin-top:.1rem}
.modes{display:grid;gap:.7rem}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode-btn{display:flex;align-items:center;gap:.75rem;text-align:left;padding:.8rem .9rem;border:3px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.mode-btn .mi{width:3.2rem;height:3.2rem;min-width:3.2rem;border-radius:14px;display:grid;place-items:center;border:3px solid var(--ink);background:#EAF4FF}
.mode-btn .mi svg{width:2rem;height:2rem}
.mode-btn b{display:block;font-size:1.02rem}
.mode-btn small{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:700}

/* ---------- play shared ---------- */
.play{padding-top:.3rem}
.hud{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 .7rem}
.dots{display:flex;gap:.28rem;align-items:center}
.dots i{width:.7rem;height:.7rem;border-radius:50%;border:2px solid rgba(43,42,53,.5);background:#fff;display:block}
.dots i.done{background:var(--green);border-color:var(--ink)}
.dots i.now{background:var(--yellow);border-color:var(--ink);transform:scale(1.25)}
.score{display:inline-flex;align-items:center;gap:.3rem;font-weight:900;font-size:.9rem;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.18rem .7rem}
.score svg{width:1.05rem;height:1.05rem}

.playA{display:grid;gap:.85rem}
@media(min-width:900px){.playA{grid-template-columns:20rem 1fr;align-items:start}}
.artcard{padding:.55rem;overflow:hidden}
.artcard .frame{border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#EAF4FF}
.artcard .frame svg{width:100%;height:auto}
.artcard .cap{font-size:.98rem;font-weight:800;text-align:center;margin:.5rem .2rem .1rem;color:var(--ink-soft)}
@media(max-width:899px){.artcard .frame{max-height:32vh;display:grid;place-items:center}.artcard .frame svg{height:32vh;width:auto;max-width:100%}}

.burgerwrap{padding:.85rem}
.burger{display:flex;flex-direction:column;gap:.4rem;margin:.2rem 0 .8rem}
.bun{height:2.3rem;border:3px solid var(--ink);border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:.82rem;letter-spacing:.14em;background:var(--yellow)}
.bun.bottom{background:#F3B96B;height:1.8rem}
.layer{
  display:flex;align-items:center;gap:.55rem;border:3px solid var(--ink);border-radius:14px;
  padding:.5rem .65rem;background:#FFFDF6;font-size:1rem;font-weight:800;line-height:1.45;
  min-height:3.1rem;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  transition:transform .1s;
}
.layer .no{width:1.65rem;height:1.65rem;min-width:1.65rem;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:900;border:2px solid var(--ink)}
.layer.link{background:#FFF1C9}
.layer.empty{border-style:dashed;background:rgba(43,42,53,.03);color:var(--ink-soft);justify-content:center;font-weight:700;font-size:.88rem;cursor:default}
.layer.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tray-title{font-size:.82rem;font-weight:900;color:var(--ink-soft);margin:.2rem 0 .45rem;display:flex;align-items:center;gap:.4rem}
.tray{display:flex;flex-wrap:wrap;gap:.45rem;min-height:3rem}
.ing{
  display:flex;align-items:center;gap:.45rem;border:3px solid var(--ink);border-radius:999px;
  background:#fff;padding:.45rem .8rem;font-size:.95rem;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 rgba(43,42,53,.16);font-family:inherit;color:var(--ink);line-height:1.35;text-align:left;
}
.ing:active{transform:translateY(2px);box-shadow:none}
.ing.link{background:#FFF1C9}
.ing .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--orange);border:2px solid var(--ink);flex:0 0 auto}
.ing.pulse{animation:pulse .7s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.06);background:#FFE6A8}}
.actions{margin-top:.85rem;display:grid;gap:.5rem}
.hintline{font-size:.82rem;font-weight:700;color:var(--ink-soft);text-align:center}

.fb{margin-top:.8rem;border:3px solid var(--ink);border-radius:18px;padding:.8rem .85rem;background:#fff}
.fb.good{background:#EAF9F1;border-color:var(--ink)}
.fb.bad{background:#FFF2E8}
.fb h3{margin:0 0 .35rem;font-size:1.02rem;display:flex;align-items:center;gap:.4rem}
.fb h3 .bi{width:1.3rem;height:1.3rem}
.fb .sent{font-size:1.08rem;font-weight:900;line-height:1.75;margin:.2rem 0 .45rem}
.fb .sent mark{background:rgba(255,201,77,.65);color:var(--orange-d);border-radius:.2rem;padding:0 .1rem}
.fb .why{font-size:.94rem;margin:.2rem 0}
.fb .order{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.5rem 0 .2rem}
.fb .order .oc{font-size:.8rem;font-weight:800;background:#fff;border:2px solid rgba(43,42,53,.3);border-radius:8px;padding:.1rem .4rem}
.fb .order .oa{font-weight:900;color:var(--ink-soft)}
.fb .fbrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.fb .fbrow .btn{flex:1 1 9rem}

/* ---------- match ---------- */
.matchwrap{padding:.6rem}
@media(min-width:760px){.matchwrap{padding:.85rem}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
@media(min-width:760px){.match{gap:1rem}}
.mcol h2{font-size:.86rem;margin:0 0 .4rem;color:var(--ink-soft);font-weight:900;letter-spacing:.06em}
.mlist{display:grid;gap:.45rem}
.mcard{
  display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;font-family:inherit;color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;background:#fff;padding:.45rem;font-size:.9rem;
  font-weight:800;line-height:1.45;cursor:pointer;box-shadow:0 3px 0 rgba(43,42,53,.14);min-height:3.2rem;
}
.mcard .mic{width:2.5rem;height:2.5rem;min-width:2.5rem;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#EAF4FF}
.mcard .mic.linkic{display:grid;place-items:center;background:rgba(62,124,177,.12);color:var(--sky)}
.mcard .mic.linkic svg{width:1.35rem;height:1.35rem}
@media(min-width:760px){.mcard{padding:.5rem .6rem;font-size:.98rem}.mcard .mic{width:3.5rem;height:3.5rem;min-width:3.5rem;border-radius:12px}.mcard .mic.linkic svg{width:1.6rem;height:1.6rem}}
.mcard .mic svg{width:100%;height:100%}
.mcard .mtxt{flex:1;min-width:0}
.mcard.sel{background:#FFF1C9;box-shadow:0 0 0 3px rgba(255,201,77,.8),0 3px 0 rgba(43,42,53,.14)}
.mcard.done{background:#EAF9F1;border-color:var(--green);cursor:default;box-shadow:none}
.mcard.done .tick{width:1.3rem;height:1.3rem;color:var(--green)}
.mcard.wrong{animation:shake .38s;border-color:var(--pink)}
.mcard:disabled{color:var(--ink)}
.roundbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.12rem .65rem}

/* ---------- result ---------- */
.result{max-width:34rem;margin:1rem auto;padding:1.2rem;text-align:center}
.result .mascot{width:min(100%,15rem);margin:0 auto .4rem;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#EAF4FF;box-shadow:0 5px 0 rgba(43,42,53,.12)}
.result h1{font-size:clamp(1.6rem,4.5vw,2.2rem);margin:.2rem 0}
.bigstars{display:flex;justify-content:center;gap:.4rem;margin:.7rem 0}
.bigstars svg{width:3rem;height:3rem;animation:pop .45s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.result .rs{display:flex;justify-content:center;gap:1.4rem;margin:.5rem 0 1rem;flex-wrap:wrap}
.result .rs b{display:block;font-size:1.4rem}
.result .rs span{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.result .acts{display:grid;gap:.5rem}
@media(min-width:520px){.result .acts{grid-template-columns:1fr 1fr}}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,2rem);z-index:60;
  background:var(--ink);color:#fff;font-weight:800;font-size:.9rem;padding:.6rem 1rem;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.pop{animation:pop2 .25s}
@keyframes pop2{from{transform:scale(.96);opacity:.4}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

/* ---------- lesson steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.75rem}
.stepitem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.12rem;
  background:#FFFBF2;border:2px solid rgba(43,42,53,.18);border-radius:12px;padding:.4rem .25rem}
.stepitem .si{width:2rem;height:2rem}
.stepitem .si svg{width:100%;height:100%}
.stepitem b{font-size:.76rem;line-height:1.25}
.stepitem small{font-size:.66rem;line-height:1.25;color:var(--ink-soft)}

/* ---------- icon sizing / hidden fix ---------- */
.topbar[hidden]{display:none !important}
.btn > svg{width:1.3rem;height:1.3rem;flex:0 0 auto}
.mode-btn .mi svg{width:2rem;height:2rem}
.stepitem .si svg{width:100%;height:100%}

/* ---------- formula chips ---------- */
.formula{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.formula .fchip{display:inline-flex;align-items:center;gap:.28rem;font-weight:900;font-size:.82rem;
  padding:.2rem .55rem;border:2px solid var(--ink);border-radius:10px;background:#FFF3DA}
.formula .fchip i{font-style:normal;color:var(--ink-soft);font-size:.8rem}
.formula .arw{display:none}
@media(max-width:540px){.stepitem small{display:none}.stepitem b{font-size:.72rem}}

    var it = sc.items[i];
    out += P_(it[0], it[1], it[2], it[3], it[4] || {});
  }
  if (sc.sp) {
    for (var j = 0; j < sc.sp.length; j++) {

<script>
/* ===== 轉折小偵探 · 遊戲邏輯 ===== */
(function () {
  'use strict';

  var viewEl = document.getElementById('view');
  var topEl = document.getElementById('topbar');
  var titleEl = document.getElementById('topTitle');
  var backBtn = document.getElementById('backBtn');
  var soundBtn = document.getElementById('soundBtn');
  var toastEl = document.getElementById('toast');

  var KEY = 'zhexiaozhentan_v3';
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  if (!store.stars) store.stars = {};

  var S = {
    view: 'home', cat: 0, mode: 'A', qi: 0,
    placed: [], order: [], tries: 0, solved: false, good: 0, fb: null, hintIdx: -1,
    round: 0, roundPairs: [], left: [], right: [], selL: null, matched: {}, mistakes: 0,
    locked: false, wrongR: null, roundDone: false,
    resultStars: 0, resultGood: 0, resultMistakes: 0,
    sound: store.sound !== false
  };
  var lockTimer = null;

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function starsForA(n) { return n >= 6 ? 3 : n >= 4 ? 2 : 1; }
  function starsForB(m) { return m <= 1 ? 3 : m <= 3 ? 2 : 1; }
  function catStar(id, mode) {
    var rec = store.stars[id];
    return rec && rec[mode] ? rec[mode] : 0;
  }
  function totalStars() {
    var t = 0;
    for (var k in store.stars) {
      if (store.stars[k]) t += (store.stars[k].A || 0) + (store.stars[k].B || 0);
    }
    return t;
  }
  function saveStar(id, mode, n) {
    if (!store.stars[id]) store.stars[id] = { A: 0, B: 0 };
    if (!store.stars[id][mode] || n > store.stars[id][mode]) store.stars[id][mode] = n;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 私密模式：本次有效 */ }
  }
  function saveSound() {
    store.sound = S.sound;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* ---------- 音效 ---------- */
  var AC = null;
  function audio() {
    if (AC) return AC;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
    } catch (e) { AC = null; }
    return AC;
  }
  function tone(freq, start, dur, type, vol) {
    var c = audio();
    if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = c.currentTime + (start || 0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function sfx(name) {
    if (!S.sound) return;
    var c = audio();
    if (!c) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    if (name === 'tap') { tone(520, 0, 0.07, 'triangle', 0.07); }
    else if (name === 'place') { tone(680, 0, 0.09, 'triangle', 0.09); tone(880, 0.05, 0.08, 'sine', 0.05); }
    else if (name === 'good') { tone(523, 0, 0.16, 'sine', 0.13); tone(659, 0.12, 0.16, 'sine', 0.12); tone(784, 0.24, 0.26, 'sine', 0.12); }
    else if (name === 'bad') { tone(320, 0, 0.15, 'sine', 0.1); tone(240, 0.13, 0.2, 'sine', 0.09); }
    else if (name === 'match') { tone(660, 0, 0.12, 'sine', 0.1); tone(880, 0.1, 0.18, 'sine', 0.1); }
    else if (name === 'win') { tone(523, 0, 0.14, 'sine', 0.12); tone(659, 0.1, 0.14, 'sine', 0.12); tone(784, 0.2, 0.14, 'sine', 0.12); tone(1046, 0.3, 0.3, 'sine', 0.12); }
  }

  /* ---------- 語音 ---------- */
  var voiceWarned = false;
  function speak(text) {
    if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
      toast('這個瀏覽器不支援語音朗讀，可以看文字。');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text).replace(/[「」『』]/g, ''));
      u.lang = 'zh-TW';
      u.rate = 0.9;
      u.pitch = 1.05;
      var vs = window.speechSynthesis.getVoices() || [];
      var v = null, anyZh = null;
      for (var i = 0; i < vs.length; i++) {
        var lg = (vs[i].lang || '').toLowerCase();
        if (lg.indexOf('zh') === 0) {
          if (!anyZh) anyZh = vs[i];
          if (lg.indexOf('zh-tw') === 0 || lg.indexOf('zh-hk') === 0 || lg.indexOf('zh-hant') === 0) { v = vs[i]; break; }
        }
      }
      if (v || anyZh) u.voice = v || anyZh;
      u.onerror = function (ev) {
        if (ev && (ev.error === 'canceled' || ev.error === 'interrupted')) return;
        if (!voiceWarned) { voiceWarned = true; toast('語音暫時未能播放，請再試一次。'); }
      };
      window.speechSynthesis.speak(u);
    } catch (e) {
      if (!voiceWarned) { voiceWarned = true; toast('語音暫時未能播放，請再試一次。'); }
    }
  }

  function clearLock() {
    if (lockTimer) { clearTimeout(lockTimer); lockTimer = null; }
    S.locked = false; S.wrongR = null;
  }

  /* ---------- 頭欄 ---------- */
  var TITLES = { home: '', map: '學習地圖', lesson: '', play: '', result: '挑戰完成' };
  function catShort(c) { return c.short.replace(/^…+/, '').replace(/…+$/, ''); }
  function topbar() {
    var v = S.view;
    topEl.hidden = (v === 'home');
    if (v === 'home') return;
    var t = TITLES[v] || '';
    if (v === 'lesson') t = catShort(CATS[S.cat]);
    if (v === 'play') t = catShort(CATS[S.cat]) + ' · ' + (S.mode === 'A' ? '漢堡' : '配對');
    titleEl.textContent = t;
    soundBtn.innerHTML = S.sound ? ICON.sound : ICON.mute;
    soundBtn.classList.toggle('off', !S.sound);
    soundBtn.setAttribute('aria-label', S.sound ? '關閉音效' : '開啟音效');
  }

  /* ---------- 首頁 ---------- */
  function viewHome() {
    var total = totalStars();
    var h = '';
    h += '<section class="home">';
    h += '<div>';
    h += '<span class="badge"><span class="bi">' + ICON.star + '</span>小學語文 · 轉折複句</span>';
    h += '<h1 class="title">轉折<em>小偵探</em></h1>';
    h += '<p class="lead">句子轉個彎，意思更精彩！九組關聯詞，兩種玩法，一起找出句子裡的「轉折」。' + '</p>';
    h += '<div class="cta">';
    h += '<button class="btn orange" data-act="map">' + ICON.play + '開始學習</button>';
    h += '<button class="btn ghost" data-act="how">怎麼玩？</button>';
    h += '</div>';
    h += '<div class="stats">';
    h += '<div class="stat"><b>9</b><span>關聯詞家族</span></div>';
    h += '<div class="stat"><b>2</b><span>種玩法</span></div>';
    h += '<div class="stat"><b>108</b><span>組題目</span></div>';
    h += '<div class="stat"><b>' + total + '/54</b><span>已收集星星</span></div>';
    h += '</div>';
    h += '</div>';
    h += '<div class="hero-art">' + heroSVG() + '</div>';
    h += '</section>';

    h += '<section id="howto" class="card howto"' + '>';
    h += '<h2 class="sec-title"><span class="dot"></span>怎麼玩？</h2>';
    h += '<ol>';
    h += '<li><b>看圖學會</b>：每個家族都有一張情境圖、三條要點和兩句例句，點喇叭可以聽一次。</li>';
    h += '<li><b>句子漢堡</b>：把配料卡由左至右疊成完整句子；疊錯會指出第幾層接不上。</li>';
    h += '<li><b>句子配對</b>：先點前半句，再點後半句，配對成功就會說明前後的轉折關係。</li>';
    h += '<li><b>收集星星</b>：每族每種玩法最多三顆星，進度會保存在這部裝置。</li>';
    h += '</ol>';
    h += '</section>';
    return h;
  }

  /* ---------- 學習地圖 ---------- */
  function viewMap() {
    var h = '';
    h += '<div class="map-head"><div><h1>學習地圖</h1><p class="sub">選一個家族，先學再玩。</p></div>';
    h += '<span class="star-total">' + ICON.star + ' ' + totalStars() + ' / 54</span></div>';
    h += '<div class="map">';
    CATS.forEach(function (c, i) {
      h += '<button class="mapcard" data-act="lesson" data-i="' + i + '">';
      h += '<span class="thumb">' + sceneSVG(c.art, 'slice') + '</span>';
      h += '<span class="meta"><span class="name">' + esc(c.name) + '</span>';
      h += '<span class="tag">' + esc(c.tag) + '</span>';
      h += starRow(catStar(c.id, 'A'), catStar(c.id, 'B'));
      h += '</span></button>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 教學頁 ---------- */
  function viewLesson() {
    var c = CATS[S.cat];
    var h = '<section class="lesson">';
    h += '<div class="card lhero">';
    h += '<div class="pic">' + sceneSVG(c.art) + '</div>';
    h += '<div><span class="badge">' + esc(c.tag) + '</span>';
    h += '<h1>' + esc(c.name) + '</h1>';
    h += '<p>' + esc(c.tagline) + '</p>';
    h += '<div class="formula">';
    c.formula.forEach(function (f, i) {
      h += '<span class="fchip">' + esc(f) + (i < c.formula.length - 1 ? '<i>→</i>' : '') + '</span>';
    });
    h += '</div>';
    h += '<div class="steps">';
    h += '<div class="stepitem"><span class="si">' + ICON.eye + '</span><b>先看情況</b><small>前半句說的是甚麼</small></div>';
    h += '<div class="stepitem"><span class="si">' + ICON.link + '</span><b>找出轉折詞</b><small>它放在哪個位置</small></div>';
    h += '<div class="stepitem"><span class="si">' + ICON.arrow + '</span><b>讀出結果</b><small>後半句轉到哪裡</small></div>';
    h += '</div></div></div>';

    h += '<div class="card panel"><h2 class="sec-title"><span class="dot"></span>關聯詞小檔案</h2><ul class="points">';
    c.points.forEach(function (p, i) {
      h += '<li><span class="num">' + (i + 1) + '</span><span>' + esc(p) + '</span></li>';
    });
    h += '</ul></div>';

    h += '<div class="card panel"><h2 class="sec-title"><span class="dot"></span>聽一聽例句</h2><div class="examples">';
    c.examples.forEach(function (ex, xi) {
      var marked = highlight(ex.t, c.id);
      var ak = (EXART[c.id] || [])[xi];
      h += '<div class="ex">' + (ak ? '<span class="eximg" aria-hidden="true">' + sceneSVG(ak, 'slice') + '</span>' : '') + '<div><div class="txt">' + marked + '</div><div class="note">' + esc(ex.n) + '</div></div>';
      h += '<button class="spk" data-act="speak" data-t="' + esc(ex.t) + '" aria-label="朗讀例句">' + ICON.sound + '</button></div>';
    });
    h += '</div></div>';

    h += '<div class="tipbox">' + '<span class="bi">' + ICON.bulb + '</span><span><b>易錯提醒：</b>' + esc(c.tip) + '</span></div>';

    h += '<div class="modes">';
    h += '<button class="btn mode-btn" data-act="mode" data-m="A" style="background:#EAF4FF">';
    h += '<span class="mi">' + ICON.burger + '</span><span><b>玩法一：句子漢堡</b><small>把 4–5 張配料按順序疊成完整句子</small></span></button>';
    h += '<button class="btn mode-btn" data-act="mode" data-m="B" style="background:#F1EEFF">';
    h += '<span class="mi">' + ICON.match + '</span><span><b>玩法二：句子配對</b><small>把前半句和後半句配成一對</small></span></button>';
    h += '</div>';
    h += '</section>';
    return h;
  }

  var EXART = {
    sr: ['schoolRain', 'jacket'],
    jg: ['windTree', 'classroom'],
    que: ['running', 'darkStairs'],
    bd: ['rainHeavy', 'helpBox'],
    js: ['rainTrip', 'testPaper'],
    nk: ['crosswalk', 'familyDinner'],
    ks: ['sunnyRain', 'jacket'],
    be: ['umbrella', 'crying'],
    br: ['readBook', 'comicRead']
  };

  var FAMILY_WORDS = {
    sr: ['雖然','但是'],
    jg: ['儘管','還是'],
    que:['卻'],
    bd: ['不但','反而'],
    js: ['即使','也','也要','也不能','也能','我們也','旗也'],
    nk: ['寧可','也不'],
    ks: ['可是'],
    be: ['不是','而是'],
    br: ['不','而']
  };
  function highlight(text, cid) {
    var base = ['雖然','但是','儘管','還是','卻','不但','反而','即使','寧可','也不','可是','不是','而是','也要','也不能','也能','我們也','旗也'];
    var words = base.concat(FAMILY_WORDS[cid] || []);
    words = words.filter(function(w, i){ return words.indexOf(w) === i; });
    var sorted = words.slice().sort(function (a, b) { return b.length - a.length; });
    var src = esc(text);
    var re = new RegExp('(' + sorted.join('|') + ')', 'g');
    return src.split(re).map(function (part, i) {
      return (i % 2 === 1) ? '<span class="hl">' + part + '</span>' : part;
    }).join('');
  }

  /* ---------- 玩法一：句子漢堡 ---------- */
  var LINK_END = /(雖然|但是|儘管|還是|卻|不但|反而|即使|寧可|也不|可是|而是|不是|我們也|旗也|也不能|也要|不|而)$/;
  function isLink(s) {
    var t = s.replace(/[，。！？、]/g, '');
    return LINK_END.test(t);
  }
  function startA() {
    clearLock();
    S.mode = 'A'; S.qi = 0; S.good = 0; S.view = 'play';
    loadQ();
  }
  function loadQ() {
    var q = CATS[S.cat].A[S.qi];
    S.placed = [];
    S.order = shuffle(q.segs.map(function (_, i) { return i; }));
    S.tries = 0; S.solved = false; S.fb = null; S.hintIdx = -1;
    render();
  }
  function viewPlayA() {
    var c = CATS[S.cat];
    var q = c.A[S.qi];
    var total = q.segs.length;
    var h = '<section class="play">';
    h += hud();
    h += '<div class="playA">';

    h += '<div class="card artcard"><div class="frame">' + sceneSVG(q.art) + '</div>';
    h += '<div class="cap">' + esc(q.cap) + '</div></div>';

    h += '<div class="card burgerwrap">';
    h += '<div class="burger">';
    h += '<div class="bun">句子漢堡</div>';
    S.placed.forEach(function (idx, p) {
      h += '<button class="layer' + (isLink(q.segs[idx]) ? ' link' : '') + (S.fb && S.fb.type === 'bad' && S.fb.pos === p ? ' shake' : '') + '" data-act="layer" data-p="' + p + '">' +
        '<span class="no">' + (p + 1) + '</span><span>' + esc(q.segs[idx]) + '</span></button>';
    });
    if (!S.solved) {
      h += '<div class="layer empty">第 ' + (S.placed.length + 1) + ' 層 · 點配料放上來</div>';
    }
    h += '<div class="bun bottom"></div></div>';

    if (S.solved) {
      h += '<div class="hintline">漢堡疊好了！按「下一題」繼續。</div>';
    } else {
      h += '<div class="tray-title">配料盤 <span style="font-weight:700">（點一下放上漢堡）</span></div>';
      h += '<div class="hintline" style="text-align:left;margin:-.2rem 0 .5rem">點漢堡上的層，可以連同上面的層一起收回。</div>';
      h += '<div class="tray">';
      S.order.forEach(function (idx) {
        if (S.placed.indexOf(idx) >= 0) return;
        h += '<button class="ing' + (isLink(q.segs[idx]) ? ' link' : '') + (S.hintIdx === idx ? ' pulse' : '') + '" data-act="ing" data-i="' + idx + '">' +
          '<span class="dot"></span>' + esc(q.segs[idx]) + '</button>';
      });
      h += '</div>';
      h += '<div class="actions"><button class="btn orange wide" data-act="check"' + (S.placed.length < total ? ' disabled' : '') + '>疊好了，開動！</button>';
      h += '<div class="hintline">還有 ' + (total - S.placed.length) + ' 層未放</div></div>';
    }

    h += feedbackA(q);
    h += '</div></div></section>';
    return h;
  }
  function feedbackA(q) {
    if (!S.fb) return '';
    if (S.fb.type === 'bad') {
      return '<div class="fb bad" role="status"><h3><span class="bi">' + ICON.cross + '</span>再想想</h3>' +
        '<p class="why">' + esc(S.fb.msg) + '</p>' +
        '<p class="why" style="font-size:.86rem;color:#5D5A68">提示：先想清楚哪一張是關聯詞，它應該放在哪個位置。</p></div>';
    }
    var segs = q.segs;
    var sent = '';
    segs.forEach(function (s) {
      sent += isLink(s) ? '<mark>' + esc(s) + '</mark>' : esc(s);
    });
    var h = '<div class="fb good" role="status">';
    h += '<h3><span class="bi">' + ICON.check + '</span>疊對了！' + (S.fb.first ? '一次成功，很棒！' : '繼續努力！') + '</h3>';
    h += '<div class="sent">' + sent + '</div>';
    h += '<p class="why"><b>為甚麼這樣排：</b>' + esc(q.why) + '</p>';
    h += '<div class="order">';
    segs.forEach(function (s, i) {
      if (i) h += '<span class="oa">→</span>';
      h += '<span class="oc">' + esc(s.replace(/[，。！？]/g, '')) + '</span>';
    });
    h += '</div>';
    h += '<div class="fbrow">';
    h += '<button class="btn ghost" data-act="speak" data-t="' + esc(segs.join('')) + '">' + ICON.sound + '聽一聽完整句子</button>';
    h += '<button class="btn orange" data-act="next">' + (S.qi >= 5 ? '看結果' : '下一題') + '</button>';
    h += '</div></div>';
    return h;
  }
  function place(idx) {
    if (S.solved || S.placed.indexOf(idx) >= 0) return;
    S.placed.push(idx);
    S.fb = null; S.hintIdx = -1;
    sfx('place');
    render();
  }
  function unplace(p) {
    if (S.solved) return;
    S.placed = S.placed.slice(0, p);
    S.fb = null; S.hintIdx = -1;
    sfx('tap');
    render();
  }
  function checkA() {
    if (S.solved) return;
    var q = CATS[S.cat].A[S.qi];
    if (S.placed.length < q.segs.length) return;
    var pos = -1;
    for (var i = 0; i < S.placed.length; i++) {
      if (S.placed[i] !== i) { pos = i; break; }
    }
    if (pos === -1) {
      S.solved = true;
      var first = S.tries === 0;
      if (first) S.good++;
      S.fb = { type: 'good', first: first };
      sfx('good');
      render();
      return;
    }
    S.tries++;
    var msg;
    if (S.tries === 1) {
      msg = '第 ' + (pos + 1) + ' 層接不上。這一層放的是「' + q.segs[S.placed[pos]] + '」，想想它應該排在哪裡。';
    } else {
      msg = '第 ' + (pos + 1) + ' 層應該是「' + q.segs[pos] + '」。';
      if (S.placed.indexOf(pos) >= 0) {
        msg += '「' + q.segs[pos] + '」現在放在第 ' + (S.placed.indexOf(pos) + 1) + ' 層，先點那一層把它收回來。';
      } else {
        msg += '把它放上去再試一次。';
      }
      S.hintIdx = pos;
    }
    S.fb = { type: 'bad', msg: msg, pos: pos };
    sfx('bad');
    render();
  }
  function nextA() {
    if (S.qi < 5) { S.qi++; loadQ(); return; }
    finish();
  }

  /* ---------- 玩法二：句子配對 ---------- */
  function startB() {
    clearLock();
    S.mode = 'B'; S.round = 0; S.mistakes = 0; S.fb = null; S.view = 'play';
    buildRound();
  }
  function buildRound() {
    var all = CATS[S.cat].B;
    var base = S.round * 3;
    S.roundPairs = all.slice(base, base + 3).map(function (p, i) { return { id: i, l: p.l, r: p.r, art: p.art, why: p.why }; });
    S.left = shuffle(S.roundPairs);
    S.right = shuffle(S.roundPairs);
    S.selL = null; S.matched = {}; S.roundDone = false; S.wrongR = null; S.fb = null; S.locked = false;
    render();
  }
  function viewPlayB() {
    var h = '<section class="play">';
    h += '<div class="hud"><span class="pill">第 ' + (S.round + 1) + ' / 2 回合</span>';
    h += '<span class="score">' + ICON.check + ' 已配對 ' + Object.keys(S.matched).length + ' / 3</span>';
    h += '<span class="pill">錯誤 ' + S.mistakes + ' 次</span></div>';
    h += '<div class="card matchwrap"><p class="sub" style="margin:0 0 .6rem">先點左邊的前半句，再點右邊的後半句，配成一句完整的轉折句。</p>';
    if (S.roundDone) {
      h += '<div class="fb good" role="status"><h3><span class="bi">' + ICON.check + '</span>這一回合完成了！</h3>';
      h += '<p class="why">三組句子都配對了。讀一讀每組的關聯詞，看看後半句怎樣順著它轉到另一個意思。</p>';
      if (S.fb && S.fb.sent) {
        h += '<div class="sent">' + esc(S.fb.sent) + '</div>';
        h += '<p class="why">' + esc(S.fb.msg) + '</p>';
      }
      h += '<div class="fbrow"><button class="btn orange" data-act="nextround">' + (S.round === 0 ? '下一回合' : '看結果') + '</button></div></div>';
    } else {
      h += '<div class="match">';
      h += '<div class="mcol"><h2>前半句</h2><div class="mlist">';
      S.left.forEach(function (it) {
        var done = !!S.matched[it.id];
        h += '<button class="mcard' + (done ? ' done' : '') + (S.selL === it.id ? ' sel' : '') + '" data-act="pickL" data-i="' + it.id + '"' + (done ? ' disabled' : '') + '>';
        h += '<span class="mic">' + sceneSVG(it.art, 'slice') + '</span><span class="mtxt">' + esc(it.l) + '</span>';
        if (done) h += '<span class="tick">' + ICON.check + '</span>';
        h += '</button>';
      });
      h += '</div></div>';
      h += '<div class="mcol"><h2>後半句</h2><div class="mlist">';
      S.right.forEach(function (it) {
        var done = !!S.matched[it.id];
        h += '<button class="mcard' + (done ? ' done' : '') + (S.wrongR === it.id ? ' wrong' : '') + '" data-act="pickR" data-i="' + it.id + '"' + (done ? ' disabled' : '') + '>';
        h += '<span class="mic linkic" aria-hidden="true">' + ICON.link + '</span><span class="mtxt">' + esc(it.r) + '</span>';
        if (done) h += '<span class="tick">' + ICON.check + '</span>';
        h += '</button>';
      });
      h += '</div></div></div>';
    }
    if (S.fb && !S.roundDone) {
      h += '<div class="fb ' + (S.fb.type === 'good' ? 'good' : 'bad') + '" role="status" style="margin-top:.8rem">';
      h += '<h3><span class="bi">' + (S.fb.type === 'good' ? ICON.check : ICON.cross) + '</span>' + esc(S.fb.title || (S.fb.type === 'good' ? '配對了！' : '再試一次')) + '</h3>';
      if (S.fb.sent) h += '<div class="sent">' + esc(S.fb.sent) + '</div>';
      h += '<p class="why">' + esc(S.fb.msg) + '</p></div>';
    }
    h += '</div></section>';
    return h;
  }
  function pickL(id) {
    if (S.locked || S.matched[id]) return;
    S.selL = (S.selL === id ? null : id);
    S.fb = null;
    sfx('tap');
    render();
  }
  function pickR(id) {
    if (S.locked || S.matched[id]) return;
    if (S.selL === null) { toast('先點左邊的前半句，再點這一邊。'); return; }
    if (S.selL === id) {
      var pair = S.roundPairs.filter(function (p) { return p.id === id; })[0];
      S.matched[id] = true;
      S.selL = null;
      S.fb = { type: 'good', title: '配對了！', sent: pair.l + pair.r, msg: pair.why };
      sfx('match');
      if (Object.keys(S.matched).length === 3) {
        S.roundDone = true;
        setTimeout(function () { sfx('win'); }, 350);
      }
      render();
      return;
    }
    S.mistakes++;
    S.locked = true;
    S.wrongR = id;
    S.fb = { type: 'bad', title: '不對哦', msg: '後半句是不是轉到另一個意思？再讀一次前半句，找語氣接得上的那一句。' };
    sfx('bad');
    render();
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () {
      lockTimer = null;
      S.locked = false; S.wrongR = null; S.selL = null; S.fb = null;
      if (S.view === 'play' && S.mode === 'B') render();
    }, 900);
  }
  function nextRound() {
    if (S.round === 0) { S.round = 1; S.fb = null; buildRound(); }
    else finish();
  }

  /* ---------- 結果 ---------- */
  function finish() {
    var c = CATS[S.cat];
    if (S.mode === 'A') {
      S.resultGood = S.good;
      S.resultStars = starsForA(S.good);
      saveStar(c.id, 'A', S.resultStars);
    } else {
      S.resultStars = starsForB(S.mistakes);
      S.resultGood = 6;
      saveStar(c.id, 'B', S.resultStars);
    }
    S.view = 'result';
    sfx('win');
    render();
  }
  function viewResult() {
    var c = CATS[S.cat];
    var h = '<section class="card result">';
    h += '<div class="mascot">' + sceneSVG(c.art) + '</div>';
    h += '<h1>' + (S.resultStars === 3 ? '太厲害了！' : S.resultStars === 2 ? '做得不錯！' : '完成挑戰！') + '</h1>';
    h += '<p class="sub">' + esc(c.name) + ' · ' + (S.mode === 'A' ? '句子漢堡' : '句子配對') + '</p>';
    h += '<div class="bigstars">' + stars(S.resultStars) + '</div>';
    h += '<div class="rs">';
    if (S.mode === 'A') {
      h += '<div><b>' + S.resultGood + ' / 6</b><span>一次疊對</span></div>';
    } else {
      h += '<div><b>6 / 6</b><span>配對成功</span></div><div><b>' + S.mistakes + '</b><span>錯誤次數</span></div>';
    }
    h += '</div>';
    h += '<p class="why" style="margin:0 0 1rem">' + (S.resultStars === 3 ? '你已經掌握這組關聯詞的用法，可以去挑戰下一個家族了。' : S.resultStars === 2 ? '再練習一次，把說明讀一遍，就能拿三顆星。' : '把教學頁的三條要點再看一次，下一次會更順利。') + '</p>';
    h += '<div class="acts">';
    h += '<button class="btn orange" data-act="again">再玩一次</button>';
    h += '<button class="btn purple" data-act="other">試另一個玩法</button>';
    h += '<button class="btn ghost" data-act="toLesson">回教學頁</button>';
    h += '<button class="btn sky" data-act="toMap">回學習地圖</button>';
    h += '</div></section>';
    return h;
  }

  /* ---------- HUD ---------- */
  function hud() {
    var h = '<div class="hud"><span class="pill">第 ' + (S.qi + 1) + ' / 6 題</span><div class="dots">';
    for (var i = 0; i < 6; i++) {
      h += '<i class="' + (i < S.qi ? 'done' : i === S.qi ? 'now' : '') + '"></i>';
    }
    h += '</div><span class="score">' + ICON.star + ' ' + S.good + ' / 6</span></div>';
    return h;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    if (S.view === 'home') viewEl.innerHTML = viewHome();
    else if (S.view === 'map') viewEl.innerHTML = viewMap();
    else if (S.view === 'lesson') viewEl.innerHTML = viewLesson();
    else if (S.view === 'play') viewEl.innerHTML = (S.mode === 'A') ? viewPlayA() : viewPlayB();
    else if (S.view === 'result') viewEl.innerHTML = viewResult();
    topbar();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------- 事件 ---------- */
  viewEl.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || !viewEl.contains(t)) return;
    var act = t.getAttribute('data-act');
    if (act === 'map') { S.view = 'map'; sfx('tap'); render(); }
    else if (act === 'how') {
      var box = document.getElementById('howto');
      if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    else if (act === 'lesson') { S.cat = +t.getAttribute('data-i'); S.view = 'lesson'; sfx('tap'); render(); }
    else if (act === 'mode') {
      var m = t.getAttribute('data-m');
      if (m === 'A') startA(); else startB();
    }
    else if (act === 'ing') { place(+t.getAttribute('data-i')); }
    else if (act === 'layer') { unplace(+t.getAttribute('data-p')); }
    else if (act === 'check') { checkA(); }
    else if (act === 'next') { nextA(); }
    else if (act === 'pickL') { pickL(+t.getAttribute('data-i')); }
    else if (act === 'pickR') { pickR(+t.getAttribute('data-i')); }
    else if (act === 'nextround') { sfx('tap'); nextRound(); }
    else if (act === 'speak') { speak(t.getAttribute('data-t')); }
    else if (act === 'again') { if (S.mode === 'A') startA(); else startB(); }
    else if (act === 'other') { if (S.mode === 'A') startB(); else startA(); }
    else if (act === 'toLesson') { S.view = 'lesson'; render(); }
    else if (act === 'toMap') { S.view = 'map'; render(); }
  });

  backBtn.addEventListener('click', function () {
    sfx('tap');
    clearLock();
    if (S.view === 'play') { S.view = 'lesson'; render(); }
    else if (S.view === 'result') { S.view = 'map'; render(); }
    else if (S.view === 'lesson') { S.view = 'map'; render(); }
    else if (S.view === 'map') { S.view = 'home'; render(); }
    else { S.view = 'home'; render(); }
  });

  soundBtn.addEventListener('click', function () {
    S.sound = !S.sound;
    saveSound();
    if (!S.sound && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    topbar();
    if (S.sound) sfx('tap');
    toast(S.sound ? '音效已開啟' : '音效已關閉');
  });

  /* 預載語音清單（部分瀏覽器非同步） */
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.getVoices(); } catch (e) {}
  }

  /* ---------- 啟動 ---------- */
  backBtn.innerHTML = ICON.back;
  S.view = 'home';
  render();
  window.__ZX = S;
})();

</script>
</body>
</html>
