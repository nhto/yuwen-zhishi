<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即使……也……｜小學讓步複句互動遊戲</title>
<meta name="description" content="小學語文「即使……也……」互動教材：8 張圖文教學卡，句子小火車與前後配一配兩種遊戲，初階、高階各 6 題，附語音朗讀與答案解析。">
<style>
:root{
  --ink:#2f2a3d;
  --ink-soft:#625a78;
  --ink-faint:#8d86a0;
  --paper:#fff8ec;
  --card:#fffdf8;
  --sky:#c8ecff;
  --sky-deep:#6fbde8;
  --sun:#ffd166;
  --sun-deep:#e9a92f;
  --coral:#ff7a6b;
  --coral-soft:#ffe3dd;
  --mint:#6fd3b5;
  --mint-soft:#d9f6ec;
  --grape:#8b7be8;
  --grape-soft:#ece8ff;
  --pink:#ffb3c7;
  --line:3px solid var(--ink);
  --shadow:0 6px 0 rgba(47,42,61,.16);
  --shadow-sm:0 4px 0 rgba(47,42,61,.16);
  --radius:26px;
  --font:"PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Noto Sans TC","Source Han Sans TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font);
  font-size:clamp(17px,0.35vw + 15.6px,20px);
  line-height:1.65;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 8% 4%, rgba(255,209,102,.42) 0 9%, transparent 9.4%),
    radial-gradient(circle at 94% 2%, rgba(200,236,255,.75) 0 8%, transparent 8.4%),
    radial-gradient(circle at 88% 92%, rgba(111,211,181,.22) 0 12%, transparent 12.4%),
    radial-gradient(rgba(47,42,61,.055) 1.2px, transparent 1.3px);
  background-size:auto,auto,auto,22px 22px;
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
h1,h2,h3,p,ul{margin:0}
svg{display:block}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,2.2vw,26px);
  background:rgba(255,248,236,.94);
  backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(47,42,61,.12);
}
.icon-btn{
  width:48px;height:48px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border:2.5px solid var(--ink);border-radius:14px;background:var(--card);
  box-shadow:0 3px 0 rgba(47,42,61,.14);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{
  width:42px;height:42px;flex:none;display:grid;place-items:center;
  background:var(--sun);border:2.5px solid var(--ink);border-radius:13px;
  font-weight:900;font-size:1.15rem;transform:rotate(-4deg);
}
.brand-text{min-width:0}
.brand-text strong{display:block;font-size:1rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:.72rem;color:var(--ink-soft);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-right{display:flex;align-items:center;gap:8px;flex:none}
.level-chip{
  font-size:.76rem;font-weight:800;padding:6px 12px;border-radius:999px;
  background:var(--grape-soft);border:2px solid var(--grape);white-space:nowrap;
}
.sound-btn{
  display:inline-flex;align-items:center;gap:6px;
  min-height:46px;padding:6px 14px;
  border:2.5px solid var(--ink);border-radius:14px;background:var(--card);
  box-shadow:0 3px 0 rgba(47,42,61,.14);cursor:pointer;font-weight:800;font-size:.88rem;
  transition:transform .12s ease,box-shadow .12s ease;
}
.sound-btn:active{transform:translateY(3px);box-shadow:none}
.sound-btn[aria-pressed="false"]{background:#efeae0;color:var(--ink-faint)}

/* ---------- layout ---------- */
main{padding:clamp(16px,2.6vw,30px) clamp(12px,2.4vw,28px) 60px}
.screen{max-width:1120px;margin:0 auto;animation:rise .34s ease both}
.screen[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{
  display:inline-block;font-size:.8rem;font-weight:800;letter-spacing:.06em;
  color:var(--ink-soft);text-transform:uppercase;
}

/* ---------- cover ---------- */
.hero{
  display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(18px,3vw,44px);
  align-items:center;padding:clamp(8px,2vw,26px) 0 clamp(20px,3vw,36px);
}
.hero-title{
  font-size:clamp(2.7rem,7.6vw,4.9rem);
  line-height:1.08;letter-spacing:.02em;font-weight:900;
  margin:8px 0 6px;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px;
}
.hero-title .hl{
  position:relative;padding:0 .08em;border-radius:14px;
  text-shadow:0 3px 0 rgba(47,42,61,.12);
}
.hero-title .hl-a{background:linear-gradient(180deg,transparent 58%,var(--sun) 58% 92%,transparent 92%)}
.hero-title .hl-b{background:linear-gradient(180deg,transparent 58%,var(--mint) 58% 92%,transparent 92%)}
.hero-title .dots{color:var(--ink-faint);font-size:.7em;letter-spacing:-.06em}
.hero-sub{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:800;color:var(--ink-soft);margin-bottom:10px}
.hero-text{max-width:34em;color:var(--ink-soft);font-size:1.02rem;line-height:1.8}
.hero-facts{display:flex;gap:clamp(10px,2vw,26px);list-style:none;padding:18px 0 0;margin:0;flex-wrap:wrap}
.hero-facts li{display:flex;flex-direction:column;line-height:1.15}
.hero-facts b{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:900}
.hero-facts span{font-size:.78rem;color:var(--ink-soft);font-weight:700;margin-top:2px}
.hero-art{position:relative;display:grid;place-items:center;min-height:clamp(240px,30vw,400px)}
.hero-art::before{
  content:"";position:absolute;inset:6% 4%;
  background:radial-gradient(circle at 50% 50%,rgba(200,236,255,.85),rgba(200,236,255,0) 68%);
  border-radius:50%;
}
.hero-art svg{position:relative;width:min(84%,380px);height:auto;filter:drop-shadow(0 12px 0 rgba(47,42,61,.08))}
.float-card{
  position:absolute;padding:8px 16px;border:3px solid var(--ink);border-radius:14px;
  background:var(--card);font-weight:900;font-size:clamp(1rem,1.8vw,1.35rem);
  box-shadow:0 5px 0 rgba(47,42,61,.16);
}
.fc-1{top:8%;left:4%;transform:rotate(-8deg);background:var(--sky)}
.fc-2{top:20%;right:2%;transform:rotate(7deg);background:var(--mint)}
.fc-3{bottom:14%;left:2%;transform:rotate(4deg);background:var(--sun);font-size:clamp(.9rem,1.5vw,1.1rem)}
.section-label{font-size:clamp(1.2rem,2.4vw,1.55rem);margin:10px 0 16px;display:flex;align-items:center;gap:10px}
.section-label::before{content:"";width:14px;height:26px;background:var(--coral);border:2.5px solid var(--ink);border-radius:6px;transform:rotate(-8deg);flex:none}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,24px)}
.level-card{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  padding:clamp(18px,2.6vw,28px);
  background:var(--card);border:var(--line);border-radius:30px;
  box-shadow:0 8px 0 rgba(47,42,61,.15);
  transition:transform .16s ease,box-shadow .16s ease;
}
.level-card:hover{transform:translateY(-3px);box-shadow:0 11px 0 rgba(47,42,61,.15)}
.level-card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(47,42,61,.15)}
.level-basic{background:linear-gradient(160deg,#fffdf8 0 58%,#e7f7ff 58% 100%)}
.level-advanced{background:linear-gradient(160deg,#fffdf8 0 58%,#eeeaff 58% 100%)}
.lc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lc-tag{
  font-size:.84rem;font-weight:900;padding:6px 14px;border-radius:999px;
  border:2.5px solid var(--ink);background:var(--sky);
}
.level-advanced .lc-tag{background:var(--grape);color:#fff}
.lc-range{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.lc-title{font-size:clamp(1.4rem,2.8vw,1.9rem);font-weight:900;line-height:1.25;margin-top:4px}
.lc-desc{color:var(--ink-soft);font-size:.95rem;max-width:22em}
.lc-list{display:flex;flex-direction:column;gap:3px;font-size:.9rem;font-weight:700;color:var(--ink-soft);margin:4px 0 8px}
.lc-cta{
  display:inline-flex;align-items:center;gap:8px;margin-top:auto;
  padding:12px 22px;border:3px solid var(--ink);border-radius:16px;
  background:var(--sun);font-weight:900;box-shadow:0 5px 0 var(--ink);
}
.level-advanced .lc-cta{background:var(--mint)}
.lc-art{position:absolute;right:-16px;bottom:-18px;width:clamp(96px,15vw,164px);height:auto;opacity:.95;pointer-events:none}
.cover-foot{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:22px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:58px;padding:12px 26px;
  border:var(--line);border-radius:18px;background:var(--card);
  font-weight:900;font-size:1.02rem;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.btn:hover{background:#fff}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn--primary{background:var(--sun)}
.btn--primary:hover{background:#ffdc86}
.btn--mint{background:var(--mint)}
.btn--grape{background:var(--grape);color:#fff}
.btn--ghost{box-shadow:0 4px 0 rgba(47,42,61,.2);background:var(--card)}
.btn--ghost:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:0 4px 0 rgba(47,42,61,.15)}
.btn-sm{min-height:48px;padding:8px 16px;font-size:.9rem;border-width:2.5px;border-radius:14px;box-shadow:0 3px 0 rgba(47,42,61,.2)}
.btn-sm:active{transform:translateY(2px);box-shadow:none}

/* ---------- teaching ---------- */
.teach-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.teach-dots{display:flex;gap:7px;align-items:center}
.teach-dot{
  width:13px;height:13px;padding:0;border-radius:999px;border:2.5px solid var(--ink);
  background:transparent;cursor:pointer;transition:all .18s ease;
}
.teach-dot.on{background:var(--coral);width:34px}
.teach-card{
  display:grid;grid-template-columns:.92fr 1.08fr;gap:clamp(16px,3vw,34px);
  background:var(--card);border:var(--line);border-radius:34px;
  padding:clamp(16px,2.4vw,30px);box-shadow:0 9px 0 rgba(47,42,61,.13);
}
.teach-art{
  position:relative;display:grid;place-items:center;min-height:260px;
  border:2.5px solid rgba(47,42,61,.18);border-radius:26px;
  background:
    radial-gradient(rgba(47,42,61,.07) 1.4px,transparent 1.5px) 0 0/18px 18px,
    linear-gradient(160deg,#eaf8ff,#f6fdff);
  padding:10px;overflow:hidden;
}
.teach-art.is-advanced{background:
  radial-gradient(rgba(47,42,61,.07) 1.4px,transparent 1.5px) 0 0/18px 18px,
  linear-gradient(160deg,#f0ecff,#fbf9ff)}
.teach-art svg{width:100%;height:auto;max-width:440px}
.teach-body{display:flex;flex-direction:column;gap:12px;min-width:0;justify-content:center}
.teach-kicker{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--coral);text-transform:uppercase}
.teach-title{font-size:clamp(1.55rem,3vw,2.35rem);line-height:1.24;font-weight:900}
.teach-content .lead{color:var(--ink-soft);font-size:1.02rem;line-height:1.8;margin-bottom:12px}
.teach-content b{color:var(--ink)}
.formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:900}
.formula .f-part{padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;font-size:1rem;box-shadow:0 3px 0 rgba(47,42,61,.14)}
.formula .a{background:var(--sky)}
.formula .b{background:var(--sun)}
.formula .c{background:var(--mint)}
.formula .f-plus,.formula .f-comma{color:var(--ink-faint);font-size:1.1rem}
.formula .f-group{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.part-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.part-chip{display:flex;flex-direction:column;padding:10px 18px;border:2.5px solid var(--ink);border-radius:16px;background:var(--sky);box-shadow:0 3px 0 rgba(47,42,61,.14)}
.part-chip.b{background:var(--mint)}
.part-chip b{font-size:1.15rem;font-weight:900}
.part-chip span{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.part-eq{font-size:1.35rem;font-weight:900;color:var(--ink-faint)}
.check-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.check-list li{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem}
.ck{width:30px;height:30px;flex:none;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:9px;background:var(--mint);font-size:.9rem;font-weight:900}
.compare-list{display:flex;flex-direction:column;gap:7px}
.compare-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:#f8f5ee}
.compare-row .cw{font-weight:900;padding:3px 10px;border-radius:8px;border:2px solid var(--ink);font-size:.9rem;justify-self:start}
.cw.grape{background:var(--grape-soft)}
.cw.coral{background:var(--coral-soft)}
.cw.mint{background:var(--mint-soft)}
.compare-row .cd{font-size:.76rem;color:var(--ink-soft);font-weight:700}
.compare-row .ce{grid-column:1/-1;font-weight:800;font-size:.88rem}
.error-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(47,42,61,.12)}
.err b{font-size:.84rem;font-weight:900}
.err span{font-size:.72rem;color:#b8402f;font-weight:800}
.syn-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.syn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:2.5px solid var(--ink);border-radius:14px;background:var(--sky);text-align:center}
.syn:nth-child(2){background:var(--sun)}
.syn:nth-child(3){background:var(--pink)}
.syn b{font-size:1.05rem;font-weight:900}
.syn span{font-size:.68rem;font-weight:700;color:var(--ink-soft);line-height:1.3}
.expand-row{display:flex;flex-direction:column;gap:6px}
.ex-before,.ex-after{padding:10px 12px;border-radius:12px;border:2px solid rgba(47,42,61,.2);font-weight:700;font-size:.9rem;background:#f3efe6;color:var(--ink-soft)}
.ex-after{background:var(--mint-soft);border:2.5px solid var(--ink);color:var(--ink);font-size:.94rem}
.ex-after b{background:var(--sun);padding:0 4px;border-radius:5px}
.ex-arrow{text-align:center;font-weight:900;color:var(--ink-faint)}
.example-box{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff8e8;border:2.5px dashed rgba(47,42,61,.35);border-radius:18px;
  padding:12px 14px;
}
.example-box p{flex:1;min-width:180px;font-weight:800;font-size:1.1rem;line-height:1.5}
.say-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  min-height:46px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:999px;
  background:var(--sky);font-weight:900;font-size:.82rem;cursor:pointer;
  box-shadow:0 3px 0 rgba(47,42,61,.18);
  transition:transform .12s ease,box-shadow .12s ease;
}
.say-btn:active{transform:translateY(3px);box-shadow:none}
.say-btn.speaking{animation:pulse .7s ease infinite;background:var(--sun)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.teach-tip{
  display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;
  background:var(--grape-soft);border-radius:14px;padding:10px 14px;
  font-size:.86rem;color:var(--ink-soft);font-weight:700;
}
.tip-label{flex:none;font-size:.72rem;font-weight:900;background:var(--grape);color:#fff;padding:3px 8px;border-radius:7px}
.teach-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.teach-count{font-size:.86rem;font-weight:800;color:var(--ink-soft)}

/* ---------- mode menu ---------- */
.modes-head{text-align:center;max-width:640px;margin:6px auto 22px}
.modes-head h2{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:6px 0 6px;font-weight:900}
.modes-head p{color:var(--ink-soft);font-size:.95rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,22px);max-width:900px;margin:0 auto}
.mode-card{
  display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;
  padding:clamp(14px,2vw,22px);background:var(--card);
  border:var(--line);border-radius:24px;box-shadow:0 7px 0 rgba(47,42,61,.15);
  transition:transform .15s ease,box-shadow .15s ease;
}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 rgba(47,42,61,.15)}
.mode-card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(47,42,61,.15)}
.mode-art{width:clamp(66px,9vw,104px);flex:none;display:grid;place-items:center;background:var(--sky);border:2.5px solid var(--ink);border-radius:18px;padding:6px}
.mode-card[data-mode="pick"] .mode-art{background:var(--mint-soft)}
.mode-art svg{width:100%;height:auto}
.mode-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.mode-name{font-size:clamp(1.15rem,2vw,1.4rem);font-weight:900;line-height:1.3}
.mode-desc{font-size:.84rem;color:var(--ink-soft);line-height:1.45}
.mode-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pill{font-size:.72rem;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--sun);border:2px solid var(--ink)}
.best{font-size:.72rem;font-weight:800;color:var(--ink-soft)}
.modes-foot{display:flex;justify-content:center;margin-top:20px}

/* ---------- play ---------- */
.play-wrap{max-width:940px;margin:0 auto}
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:nowrap}
.progress-row .pmode{font-size:.84rem;font-weight:900;white-space:nowrap}
.progress{flex:1;height:12px;background:#ece5d8;border:2px solid var(--ink);border-radius:999px;overflow:hidden;min-width:60px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky-deep));transition:width .25s ease}
.progress-text{font-size:.82rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.play-card{
  background:var(--card);border:var(--line);border-radius:30px;
  padding:clamp(14px,2.4vw,26px);box-shadow:0 8px 0 rgba(47,42,61,.13);
}
.instruction{font-size:.9rem;font-weight:700;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.instruction .num{width:26px;height:26px;flex:none;display:grid;place-items:center;background:var(--sun);border:2px solid var(--ink);border-radius:8px;font-size:.78rem;font-weight:900}
.train-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.train-mini{width:58px;height:auto;flex:none}
.train-head b{display:block;font-size:.95rem}
.train-head span{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:700}
.train-scene{
  background:linear-gradient(165deg,#e9f8ff,#f8fdff);
  border:2.5px solid rgba(47,42,61,.18);border-radius:22px;
  padding:14px 12px 12px;position:relative;
}
.train-scene.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.track-wrap{position:relative}
.track{
  display:flex;gap:10px;overflow-x:auto;padding:4px 4px 14px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.carriage{
  position:relative;flex:0 0 auto;min-width:96px;height:82px;
  display:flex;align-items:center;justify-content:center;gap:0;
  padding:0 12px;border:3px solid var(--ink);border-radius:16px;
  background:#fff;font-weight:900;font-size:clamp(1rem,2vw,1.18rem);
  box-shadow:0 4px 0 rgba(47,42,61,.16);cursor:pointer;scroll-snap-align:center;
  transition:background .15s ease,transform .15s ease,border-color .15s ease;
}
.carriage.empty{border-style:dashed;color:#b4adc0;background:rgba(255,255,255,.65);box-shadow:none;font-size:1.3rem}
.carriage.filled{background:#fff7dd}
.carriage.filled:hover{transform:translateY(-2px)}
.carriage.ok{background:var(--mint-soft);border-color:#2b9b78}
.carriage.reveal{background:#fff0c4;border-color:#b8891f}
.car-punc{font-weight:900;color:var(--coral);font-size:1.05em;margin-left:1px}
.rail{
  height:9px;margin-top:-10px;border-radius:5px;
  background:repeating-linear-gradient(90deg,#d9cdb8 0 16px,rgba(0,0,0,0) 16px 26px);
  opacity:.9;
}
.scroll-tip{font-size:.72rem;color:var(--ink-faint);text-align:center;margin-top:4px;font-weight:700}
.pool-head{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.pool-head span{font-size:.82rem;font-weight:900;letter-spacing:.06em}
.pool-head small{font-size:.74rem;color:var(--ink-faint);font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.word{
  min-height:58px;padding:10px 20px;border:3px solid var(--ink);border-radius:16px;
  background:#fff;font-weight:900;font-size:clamp(1rem,2vw,1.15rem);
  box-shadow:0 4px 0 rgba(47,42,61,.18);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;
}
.word:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(47,42,61,.18)}
.word:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(47,42,61,.18)}
.word.used{opacity:.32;background:#f0ece2;box-shadow:none;transform:translateY(3px);cursor:default}
.word:disabled{cursor:default}
.pool.is-locked .word{opacity:.45;box-shadow:none;transform:none}
.pool.is-locked .word.used{opacity:.25}
.carriage:disabled{cursor:default}
.carriage:disabled:hover{transform:none}
.play-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.play-actions .btn{flex:1 1 auto;min-width:140px}
@media(min-width:720px){.play-actions .btn{flex:0 0 auto;min-width:160px}}

.scene-box{
  background:var(--sky);border:2.5px solid var(--ink);border-radius:18px;
  padding:12px 16px;margin-bottom:14px;
}
.scene-box b{display:inline-block;font-size:.72rem;background:var(--card);border:2px solid var(--ink);border-radius:7px;padding:1px 8px;margin-right:8px;vertical-align:2px}
.scene-box span{font-size:.95rem;font-weight:700;line-height:1.6}
.stem{
  font-size:clamp(1.18rem,2.6vw,1.6rem);font-weight:900;line-height:1.55;margin-bottom:12px;
}
.stem .blank{color:var(--coral);letter-spacing:.05em}
.blank-line{display:inline-block;min-width:2.4em;border-bottom:3px dashed var(--coral);text-align:center;color:var(--coral)}
.listen-row{margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:14px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;
  font-size:clamp(1rem,2.1vw,1.14rem);font-weight:800;line-height:1.55;
  box-shadow:0 4px 0 rgba(47,42,61,.16);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background .15s ease;
}
.option:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(47,42,61,.16)}
.option:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(47,42,61,.16)}
.opt-badge{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  border:2.5px solid var(--ink);border-radius:10px;background:var(--sky);
  font-weight:900;font-size:.9rem;
}
.opt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.opt-why{display:none;font-size:.84rem;font-weight:700;color:var(--ink-soft);line-height:1.55;border-top:2px dashed rgba(47,42,61,.2);padding-top:6px}
.option.selected{border-color:var(--grape);background:var(--grape-soft);box-shadow:0 4px 0 var(--grape)}
.option.selected .opt-badge{background:var(--grape);color:#fff}
.option.correct{background:var(--mint-soft);border-color:#2b9b78;box-shadow:0 4px 0 #2b9b78}
.option.correct .opt-badge{background:var(--mint)}
.option.wrong{background:var(--coral-soft);border-color:#d8574a;box-shadow:0 4px 0 #d8574a}
.option.wrong .opt-badge{background:var(--coral)}
.option.answered{cursor:default;transform:none;box-shadow:none}
.option.answered .opt-why{display:block}
.option.dim{opacity:.72}
.opt-tag{display:none;align-self:flex-start;font-size:.68rem;font-weight:900;padding:1px 8px;border-radius:999px;border:2px solid currentColor}
.option.correct .opt-tag,.option.wrong .opt-tag{display:inline-block}
.option.correct .opt-tag{color:#1f7a5d}
.option.wrong .opt-tag{color:#b2402f}
.feedback{position:relative;margin-top:16px;border:3px solid var(--ink);border-radius:22px;padding:16px;background:var(--sky);animation:rise .25s ease both}
.feedback.ok{background:#e6faf2;border-color:#2b9b78}
.feedback.no{background:#ffeae5;border-color:#d8574a}
.feedback:focus{outline:none}
.feedback:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.feedback.reveal{background:#fff4d1;border-color:#b8891f}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;margin-bottom:8px}
.fb-head .ic{width:1.4em;height:1.4em}
.fb-answer{background:#fff;border:2px solid rgba(47,42,61,.2);border-radius:12px;padding:9px 13px;font-weight:900;font-size:1.02rem;line-height:1.55;margin-bottom:8px}
.fb-note{font-size:.9rem;line-height:1.7;color:var(--ink-soft);font-weight:600}
.fb-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fb-actions .btn{flex:1 1 auto;min-width:120px}
@media(min-width:600px){.fb-actions .btn{flex:0 0 auto}}

/* ---------- result ---------- */
.result-card{
  max-width:700px;margin:10px auto;text-align:center;
  background:var(--card);border:var(--line);border-radius:34px;
  padding:clamp(20px,3.4vw,38px);box-shadow:0 9px 0 rgba(47,42,61,.14);
}
.result-art{width:clamp(90px,16vw,140px);height:auto;margin:0 auto 6px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars .star{width:clamp(44px,7vw,60px);height:clamp(44px,7vw,60px);color:#ded8ca}
.stars .star.on{color:#ffc23d;filter:drop-shadow(0 3px 0 rgba(47,42,61,.16))}
.result-title{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:900;line-height:1.3;margin:4px 0}
.result-score{font-size:1rem;font-weight:800;color:var(--ink-soft)}
.result-score b{font-size:1.5rem;color:var(--ink)}
.retry-note{display:block;font-size:.78rem;color:var(--ink-faint);font-weight:700;margin-top:2px}
.wrong-box{text-align:left;margin:18px 0;background:#fff;border:2.5px solid rgba(47,42,61,.2);border-radius:18px;padding:12px 14px}
.wrong-box h3{font-size:.84rem;letter-spacing:.05em;margin-bottom:6px;color:var(--ink-soft);font-weight:900}
.wrong-box ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.wrong-box li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding-bottom:8px;border-bottom:2px dashed rgba(47,42,61,.14)}
.wrong-box li:last-child{border-bottom:none;padding-bottom:0}
.wrong-box .wq{flex:none;font-size:.72rem;font-weight:900;background:var(--coral-soft);border:2px solid var(--coral);border-radius:7px;padding:1px 7px;margin-top:2px}
.wrong-box .wt{font-weight:700;line-height:1.5}
.wrong-empty{font-weight:800;font-size:.95rem;color:#1f7a5d;text-align:center;padding:6px 0}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result-actions .btn{flex:1 1 auto;min-width:150px}
@media(min-width:640px){.result-actions .btn{flex:0 0 auto}}

#feedback:empty{display:none}
.train-preview{
  margin:8px 2px 0;font-size:.82rem;font-weight:700;color:var(--ink-soft);
  background:rgba(255,255,255,.72);border-radius:10px;padding:6px 10px;
  min-height:34px;line-height:1.55;word-break:break-word;
}
.train-preview b{color:var(--ink);font-weight:900;margin-right:6px}
.track-wrap{position:relative}
.track-wrap.can-scroll::after{
  content:"";position:absolute;top:0;right:0;bottom:14px;width:26px;
  background:linear-gradient(90deg,rgba(233,248,255,0),rgba(233,248,255,.96));
  pointer-events:none;border-radius:0 10px 10px 0;transition:opacity .18s ease;
}
.track-wrap.at-end::after{opacity:0}
@media(min-width:900px){
  #screen-play{padding-top:clamp(10px,4vh,44px)}
}
@media(min-width:1200px){
  .carriage{min-width:112px;height:96px;font-size:1.26rem}
  .word{min-height:66px;font-size:1.2rem;padding:12px 24px}
  .pool{gap:12px}
  .instruction{font-size:1rem}
  .play-card{padding:30px}
  .result-card{margin-top:18px}
}
/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;font-weight:800;font-size:.9rem;
  padding:11px 20px;border-radius:999px;z-index:120;
  max-width:calc(100vw - 32px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  box-shadow:0 6px 18px rgba(47,42,61,.25);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media(max-width:880px){
  .hero{grid-template-columns:1fr;gap:6px}
  .hero-art{order:-1;min-height:220px}
  .hero-art svg{width:min(62%,270px)}
  .hero-text{font-size:.98rem}
  .teach-card{grid-template-columns:1fr}
  .teach-art{min-height:220px}
  .teach-body{justify-content:flex-start}
}
@media(max-width:700px){
  .level-grid,.mode-grid{grid-template-columns:1fr}
  .level-card{min-height:0}
  .lc-art{width:116px;right:-14px;bottom:-16px}
  .lvl-list{font-size:.86rem}
  .teach-top{gap:8px}
  .teach-title{font-size:1.6rem}
  .teach-nav .btn{min-height:54px;padding:10px 18px;font-size:.95rem}
  .error-grid{grid-template-columns:1fr 1fr}
  .progress-row{gap:8px}
  .progress-row .pmode{font-size:.76rem}
  .progress-text{font-size:.74rem}
  .brand-text small{display:none}
  .brand-mark{width:38px;height:38px;font-size:1rem}
}
@media(max-width:430px){
  .topbar{gap:8px;padding:8px 12px}
  .icon-btn{width:44px;height:44px}
  .sound-btn{padding:6px 10px}
  .sound-btn span{display:none}
  .level-chip{display:none}
  .hero-facts{gap:16px}
  .hero-title{font-size:2.55rem}
  .teach-card{border-radius:26px;padding:14px}
  .play-card{border-radius:24px;padding:14px}
  .carriage{min-width:88px;height:76px}
  .option{padding:12px}
  .opt-badge{width:32px;height:32px}
  .result-card{border-radius:26px;padding:18px 14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

  var state = {

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sentenceOf(cards){
    var s = '';
    cards.forEach(function(c,i){
      s += c;
      if(i === 1) s += '，';
    });
    return s + '。';
  }
  function prefersReduce(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function focusEl(el){
    if(!el) return;
    try{ el.focus({ preventScroll:true }); }
    catch(e){ try{ el.focus(); }catch(err){} }

  /* =========================================================
     3. STORAGE
     ========================================================= */
  var store = {
    get: function(k, fallback){
      try{
        var v = window.localStorage.getItem(k);
        return v === null ? fallback : v;
      }catch(e){ return fallback; }
    },
    set: function(k, v){
      try{ window.localStorage.setItem(k, v); return true; }
      catch(e){ return false; }
    }
  };

  /* =========================================================
     4. SOUND
     ========================================================= */
  var soundOn = store.get('evsound','on') !== 'off';
  var speechOn = store.get('evspeech','on') !== 'off';
  var actx = null;
  var master = null;

  function audio(){
    if(!soundOn) return null;
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.9;
        master.connect(actx.destination);
      }
      if(actx.state === 'suspended'){ actx.resume(); }
      return actx;
    }catch(e){ return null; }
  }
  function tone(freq, when, dur, type, vol){
    var c = audio();
    if(!c || !master) return;
    try{
      var t = c.currentTime + (when || 0);
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.075, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + dur + 0.03);
    }catch(e){}
  }
  function sfxClick(){ tone(720, 0, 0.055, 'triangle', 0.045); }
  function sfxBoard(){ tone(440, 0, 0.07, 'triangle', 0.06); tone(660, 0.055, 0.09, 'sine', 0.05); }
  function sfxCorrect(){ [523.25, 659.25, 783.99].forEach(function(f,i){ tone(f, i*0.085, 0.22, 'sine', 0.075); }); }
  function sfxWrong(){ tone(392, 0, 0.16, 'triangle', 0.06); tone(311.13, 0.13, 0.24, 'triangle', 0.055); }
  function sfxReveal(){ tone(493.88, 0, 0.14, 'sine', 0.06); tone(587.33, 0.1, 0.2, 'sine', 0.055); }
  function sfxFanfare(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f,i){ tone(f, i*0.1, 0.26, 'sine', 0.075); });
    [523.25, 659.25, 783.99].forEach(function(f){ tone(f, 0.42, 0.5, 'sine', 0.045); });
  }

  function updateSoundBtn(){

  /* =========================================================
     5. SPEECH
     ========================================================= */
  function speak(text, btn){
    if(!speechOn){ toast('朗讀已關閉，先開啟朗讀再聽一次。'); return; }
    if(!('speechSynthesis' in window)){
      toast('這個瀏覽器不支援語音朗讀，請跟着文字讀一次。');
      return;
    }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-HK';
      u.rate = 0.88;
      u.pitch = 1.04;
      var voices = window.speechSynthesis.getVoices() || [];
      var pick = null;
      for(var i=0;i<voices.length;i++){
        var v = voices[i];
        var tag = (v.lang || '') + ' ' + (v.name || '');
        if(/yue|zh[-_]HK|zh[-_]TW|zh[-_]Hant/i.test(tag)){ pick = v; break; }
      }
      if(!pick){
        for(var j=0;j<voices.length;j++){
          if(/^zh/i.test(voices[j].lang || '')){ pick = voices[j]; break; }
        }
      }
      if(pick) u.voice = pick;

      var started = false;
      var myBtn = btn || null;
      if(myBtn) myBtn.classList.add('speaking');
      u.onstart = function(){ started = true; };
      u.onend = function(){ if(myBtn) myBtn.classList.remove('speaking'); };
      u.onerror = function(){
        if(myBtn) myBtn.classList.remove('speaking');
        toast('語音暫時不可用，請跟着文字讀一次。');
      };
      window.speechSynthesis.speak(u);
      window.setTimeout(function(){
        if(!started && !window.speechSynthesis.speaking && !window.speechSynthesis.pending){
          if(myBtn) myBtn.classList.remove('speaking');
          toast('此裝置未能播放語音，請跟着文字讀一次。');
        }
      }, 1400);
    }catch(e){
      toast('語音暫時不可用，請跟着文字讀一次。');
    }
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-say]') : null;
    if(!b) return;
    speak(b.getAttribute('data-say'), b);
  });

  /* =========================================================
     7. SCREEN MANAGEMENT

  function showScreen(name){
    state.screen = name;
    screens.forEach(function(s){
      s.hidden = s.getAttribute('data-screen') !== name;
    });
    backBtn.hidden = (name === 'cover');
    levelChip.hidden = !state.level;
    levelChip.textContent = state.level ? DATA[state.level].label : '';
    brandSub.textContent = state.level ? (DATA[state.level].label + ' · ' + DATA[state.level].range) : '小學讓步複句 · 互動學習';
    window.scrollTo(0,0);
    var focusMap = { cover:'coverTitle', teach:'teachTitle', modes:'modesTitle', play:'playModeName', result:'resultTitle' };
    var target = $(focusMap[name]);
    if(target && name !== 'cover'){
      if(!target.hasAttribute('tabindex')) target.setAttribute('tabindex','-1');
      window.setTimeout(function(){ focusEl(target); }, 90);
    }
  }

  backBtn.addEventListener('click', function(){
    sfxClick();
    try{ window.speechSynthesis.cancel(); }catch(e){}
    if(state.screen === 'teach'){ showScreen('cover'); }
    else if(state.screen === 'modes'){ state.teachIndex = DATA[state.level].teach.length - 1; renderTeach(); showScreen('teach'); }
    else if(state.screen === 'play'){ showScreen('modes'); renderModes(); }
    else if(state.screen === 'result'){ showScreen('modes'); renderModes(); }
    else { showScreen('cover'); }
  });

     8. TEACHING

    list.forEach(function(ex){

  function bestOf(level, mode){
    var n = parseInt(store.get('evbest-' + level + '-' + mode, '0'), 10);
    if(isNaN(n) || n < 0) n = 0;
    if(n > 3) n = 3;
    return n;
  }
  function starText(n){
    var s = '';
    for(var i=0;i<3;i++){ s += (i < n ? '★' : '☆'); }
    return s;
  }
  function renderModes(){
    var d = DATA[state.level];
    $('modesLevel').textContent = d.label + ' · ' + d.range;
    $('best-train').textContent = '最佳 ' + starText(bestOf(state.level,'train'));

  /* =========================================================
     10. RUN LIFECYCLE
     ========================================================= */
  function startRun(mode, indices, isRetry){
    state.run = {
      level: state.level,
      mode: mode,
      queue: indices.slice(),
      pos: 0,
      isRetry: !!isRetry,
      results: []
    };
    showScreen('play');
    renderQuestion();
  }

  function currentQ(){
    var r = state.run;
    return DATA[r.level][r.mode][r.queue[r.pos]];
  }

  function renderQuestion(){
    var r = state.run;
    var q = currentQ();
    var total = r.queue.length;

    $('playModeName').textContent = r.mode === 'train' ? '句子小火車' : '前後配一配';
    $('progressText').textContent = r.isRetry
      ? '重練 ' + (r.pos + 1) + ' / ' + total + ' · 原第 ' + (r.queue[r.pos] + 1) + ' 題'
      : '第 ' + (r.pos + 1) + ' / ' + total + ' 題';
    var bar = $('progressBar');
    bar.setAttribute('aria-valuemax', String(total));
    bar.setAttribute('aria-valuenow', String(r.pos + 1));
    $('progressFill').style.width = ((r.pos + 1) / total * 100) + '%';

    $('feedback').innerHTML = '';
    $('feedback').className = '';
    try{ window.speechSynthesis.cancel(); }catch(e){}

    if(r.mode === 'train') renderTrainQ(q);
    else renderPickQ(q);

    if(r.pos > 0){
      window.setTimeout(function(){
        var first = $('pool') ? $('pool').querySelector('button:not([disabled])') : null;
        if(!first && $('options')) first = $('options').querySelector('.option');
        if(first) focusEl(first);
      }, 140);
    }
  }

  /* =========================================================
     11. MODE A — SENTENCE TRAIN
     ========================================================= */
  function renderTrainQ(q){
    var totalCards = q.cards.length;
    var pool = q.cards.map(function(t,i){ return { id:'c' + i, text:t, used:false }; });
    if(q.dis){ pool.push({ id:'d0', text:q.dis, used:false }); }
    state.train = {
      slots: new Array(totalCards).fill(null),
      pool: shuffle(pool),
      locked: false,
      attempts: 0,
      revealed: false,
      recorded: false
    };

    $('instruction').innerHTML = '<span class="num">玩法</span><span>' +
      (q.dis ? '7 張詞卡中有一張是干擾卡。點詞卡上車，排出正確的「即使……也……」句子。' : '點詞卡上車，按順序排成一句完整的「即使……也……」句子。點車廂可以下車。') +
      '</span>';

    var body = $('playBody');
    body.innerHTML =
      '<div class="train-head">' +
        '<svg class="train-mini" viewBox="0 0 240 175" aria-hidden="true"><use href="#train"/></svg>' +
        '<div><b>句子小火車</b><span>' + (q.dis ? '7 張卡 · 含 1 張干擾卡' : totalCards + ' 張卡 · 排出完整句子') + '</span></div>' +
      '</div>' +
      '<div class="train-scene" id="trainScene">' +
        '<div class="track-wrap"><div class="track" id="track" aria-label="句子車廂"></div></div>' +
        '<div class="rail" aria-hidden="true"></div>' +
      '</div>' +
      '<p class="train-preview" id="trainPreview" aria-live="polite"></p>' +
      '<p class="scroll-tip">車廂可左右拖動 · 點已上車的詞卡可退回</p>' +
      '<div class="pool-head"><span>詞卡</span><small>點一下即可上車</small></div>' +
      '<div class="pool" id="pool"></div>' +
      '<div class="play-actions">' +
        '<button class="btn btn--ghost" type="button" id="resetTrain"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> 重排</button>' +
        '<button class="btn btn--primary" type="button" id="checkTrain"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg> 檢查答案</button>' +
      '</div>';

    $('track').addEventListener('click', onTrackClick);
    $('pool').addEventListener('click', onPoolClick);
    $('resetTrain').addEventListener('click', function(){
      if(state.train.locked) return;
      state.train.slots = new Array(totalCards).fill(null);
      state.train.pool.forEach(function(p){ p.used = false; });
      state.train.attempts = 0;
      $('feedback').innerHTML = '';
      sfxBoard();
      paintTrain();
      var first = $('pool') && $('pool').querySelector('button:not([disabled])');
      if(first) focusEl(first);
    });
    $('checkTrain').addEventListener('click', checkTrain);
    $('track').addEventListener('scroll', updateTrackEdge, { passive:true });
    $('track').setAttribute('role','group');
    paintTrain();
  }

  function paintTrain(scrollTo){
    var tr = state.train;
    var q = currentQ();
    var track = $('track');
    var poolEl = $('pool');
    if(!track || !poolEl) return;
    var n = q.cards.length;

    var html = '';
    for(var i=0;i<n;i++){
      var item = tr.slots[i];
      var cls = 'carriage';
      var inner = '<span class="car-q">?</span>';
      if(item){
        cls += ' filled';
        if(tr.revealed) cls += ' reveal';
        inner = '<span>' + esc(item.text) + '</span>';
        if(i === 1) inner += '<span class="car-punc">，</span>';
        if(i === n - 1) inner += '<span class="car-punc">。</span>';
      }else{
        cls += ' empty';
      }
      html += '<button class="' + cls + '" type="button" data-slot="' + i + '"' + (tr.locked ? ' disabled' : '') + ' aria-label="第 ' + (i+1) + ' 個車廂' + (item ? '：' + esc(item.text) : '：空白') + '">' + inner + '</button>';
    }
    track.innerHTML = html;

    var resetBtn = $('resetTrain');
    var checkBtn = $('checkTrain');
    if(resetBtn) resetBtn.disabled = tr.locked;
    if(checkBtn) checkBtn.disabled = tr.locked;

    poolEl.className = 'pool' + (tr.locked ? ' is-locked' : '');
    poolEl.innerHTML = tr.pool.map(function(p){
      return '<button class="word' + (p.used ? ' used' : '') + '" type="button" data-word="' + p.id + '"' + ((p.used || tr.locked) ? ' disabled' : '') + ' aria-label="詞卡：' + esc(p.text) + '">' + esc(p.text) + '</button>';
    }).join('');

    var allFilled = tr.slots.every(function(x){ return !!x; });
    var preview = $('trainPreview');
    if(preview){
      if(allFilled){
        preview.innerHTML = '<b>現在排成</b>' + esc(sentenceOf(tr.slots.map(function(x){ return x.text; })));
      }else{
        preview.innerHTML = '<b>現在排成</b>' + tr.slots.map(function(x){ return x ? esc(x.text) : '＿＿'; }).join('　');
      }
    }

    if(scrollTo !== undefined){
      var el = track.querySelector('[data-slot="' + scrollTo + '"]');
      if(el){
        var left = el.offsetLeft - (track.clientWidth - el.offsetWidth) / 2;
        try{ track.scrollTo({ left: left, behavior: prefersReduce() ? 'auto' : 'smooth' }); }
        catch(e){ track.scrollLeft = left; }
      }
    }
    updateTrackEdge();
  }

  function updateTrackEdge(){
    var track = $('track');
    if(!track) return;
    var wrap = track.parentNode;
    var can = track.scrollWidth > track.clientWidth + 4;
    wrap.classList.toggle('can-scroll', can);
    wrap.classList.toggle('at-end', can && (track.scrollLeft + track.clientWidth >= track.scrollWidth - 6));
  }

  function onTrackClick(e){
    var b = e.target.closest('[data-slot]');
    if(!b) return;
    if(state.train.locked) return;
    var i = parseInt(b.getAttribute('data-slot'), 10);
    var item = state.train.slots[i];
    if(!item) return;
    item.used = false;
    state.train.slots[i] = null;
    sfxBoard();
    $('feedback').innerHTML = '';
    paintTrain();
    var next = $('pool') && $('pool').querySelector('button:not([disabled])');
    if(next) focusEl(next);
  }

  function onPoolClick(e){
    var b = e.target.closest('[data-word]');
    if(!b) return;
    if(state.train.locked) return;
    var id = b.getAttribute('data-word');
    var item = null;
    state.train.pool.forEach(function(p){ if(p.id === id) item = p; });
    if(!item || item.used) return;
    var slot = state.train.slots.indexOf(null);
    if(slot === -1){ toast('車廂滿了，先點車廂把詞卡拿下來。'); sfxWrong(); return; }
    state.train.slots[slot] = item;
    item.used = true;
    sfxBoard();
    $('feedback').innerHTML = '';
    paintTrain(slot);
    var next = $('pool').querySelector('button:not([disabled])');
    if(next) focusEl(next);
    else { var chk = $('checkTrain'); if(chk) focusEl(chk); }
  }

  function checkTrain(){
    var tr = state.train;
    if(tr.locked) return;
    var q = currentQ();
    if(tr.slots.indexOf(null) !== -1){
      toast('還有空車廂，先把詞卡都放上去。');
      sfxWrong();
      return;
    }
    var seq = tr.slots.map(function(s){ return s.text; });
    if(seq.join('|') === q.cards.join('|')){
      tr.locked = true;
      tr.revealed = false;
      paintTrain();
      var track = $('track');
      if(track){
        Array.prototype.forEach.call(track.children, function(el){ el.classList.add('ok'); });
      }
      sfxCorrect();
      recordTrain(true);
      var sentence = sentenceOf(q.cards);
      showFeedback('ok', '答對了！', sentence, q.note, '下一題', nextQuestion, sentence);
      celebrate();
    }else{
      tr.attempts++;
      var scene = $('trainScene');
      if(scene){
        scene.classList.remove('shake');
        void scene.offsetWidth;
        scene.classList.add('shake');
      }
      sfxWrong();
      var hint = q.dis
        ? '這題有一張干擾卡「' + q.dis + '」。先想清楚兩句是甚麼關係，再決定它要不要上車。'
        : '想一想句子的骨架：「即使＋情況，主語＋也＋結果」。「也」要放在主語後面。';
      if(tr.attempts >= 2){
        hint += ' 想要的話，可以按「看正確答案」一起對一對。';
        showFeedback('no', '差一點點，再排一次', '', hint, '看正確答案', revealTrain, '');
      }else{
        hint += ' 先檢查「即使」和「也」的位置，再試一次。';
        showFeedback('no', '差一點點，再排一次', '', hint, '再排一次', dismissFeedback, '');
      }
    }
  }

  function dismissFeedback(){
    var fb = $('feedback');
    if(fb){ fb.innerHTML = ''; fb.className = ''; }
    var pool = $('pool');
    var b = pool && pool.querySelector('button:not([disabled])');
    if(b) focusEl(b);
  }

  function revealTrain(){
    var tr = state.train;
    if(tr.locked) return;
    var q = currentQ();
    tr.locked = true;
    tr.revealed = true;
    tr.pool.forEach(function(p){ p.used = false; });
    for(var i=0;i<q.cards.length;i++){
      var found = null;
      for(var j=0;j<tr.pool.length;j++){
        if(tr.pool[j].text === q.cards[i] && !tr.pool[j].used){ found = tr.pool[j]; break; }
      }
      tr.slots[i] = found;
      if(found) found.used = true;
    }
    paintTrain();
    sfxReveal();
    recordTrain(false);
    var sentence = sentenceOf(q.cards);
    showFeedback('reveal', '一起看答案', sentence, q.note, '下一題', nextQuestion, sentence);
  }

  function recordTrain(ok){
    var tr = state.train;
    if(tr.recorded) return;
    tr.recorded = true;
    state.run.results.push({ qi: state.run.queue[state.run.pos], ok: ok });
  }

  /* =========================================================
     12. MODE B — PICK THE ENDING
     ========================================================= */
  function renderPickQ(q){
    var order = shuffle(q.options.map(function(o,i){
      return { id:'o' + i, t:o.t, ok:o.ok, why:o.why };
    }));
    state.pick = { order: order, selected: null, locked: false, recorded: false };

    $('instruction').innerHTML = '<span class="num">玩法</span><span>' +
      (q.scene ? '先讀情境，再選出最恰當的一句。確定後會逐項說明。' : '選出能接上前半句的後半句。確定後會逐項說明。') +
      '</span>';

    var sayText = (q.scene ? q.scene + ' ' : '') + q.stem.replace(/＿+/g, '');
    var body = $('playBody');
    body.innerHTML =
      (q.scene ? '<div class="scene-box"><b>情境</b><span>' + esc(q.scene) + '</span></div>' : '') +
      '<p class="stem" id="stemText">' + esc(q.stem).replace(/＿+/g, '<span class="blank-line">＿＿</span>') + '</p>' +
      '<div class="listen-row"><button class="say-btn" type="button" data-say="' + esc(sayText) + '" aria-label="朗讀題目">' +
        '<svg class="ic" aria-hidden="true"><use href="#i-speaker"/></svg>聽一聽題目</button></div>' +
      '<div class="options" id="options" role="group" aria-label="選項"></div>' +
      '<div class="play-actions"><button class="btn btn--primary" type="button" id="confirmPick" disabled>確定</button></div>';

    $('options').addEventListener('click', onOptionClick);
    $('confirmPick').addEventListener('click', checkPick);
    paintPick();
  }

  function paintPick(){
    var pk = state.pick;
    var box = $('options');
    if(!box) return;
    var letters = ['A','B','C','D','E'];
    box.innerHTML = pk.order.map(function(o, i){
      var cls = 'option';
      var tag = '';
      if(pk.locked){
        cls += ' answered';
        if(o.ok){ cls += ' correct'; tag = '<span class="opt-tag">正確</span>'; }
        else if(o.id === pk.selected){ cls += ' wrong'; tag = '<span class="opt-tag">你的選擇</span>'; }
        else { cls += ' dim'; }
      }else if(o.id === pk.selected){
        cls += ' selected';
      }
      return '<button class="' + cls + '" type="button" data-opt="' + o.id + '" aria-pressed="' + (o.id === pk.selected ? 'true' : 'false') + '"' + (pk.locked ? ' disabled' : '') + '>' +
        '<span class="opt-badge">' + letters[i] + '</span>' +
        '<span class="opt-body"><span class="opt-text">' + esc(o.t) + '</span>' + tag +
        '<span class="opt-why">' + esc(o.why) + '</span></span>' +
        '</button>';
    }).join('');
  }

  function onOptionClick(e){
    var b = e.target.closest('[data-opt]');
    if(!b) return;
    if(state.pick.locked) return;
    state.pick.selected = b.getAttribute('data-opt');
    sfxClick();
    paintPick();
    var again = $('options').querySelector('[data-opt="' + state.pick.selected + '"]');
    if(again) focusEl(again);
    var btn = $('confirmPick');
    if(btn) btn.disabled = false;
  }

  function checkPick(){
    var pk = state.pick;
    if(pk.locked || !pk.selected) return;
    var q = currentQ();
    pk.locked = true;
    paintPick();
    var confirm = $('confirmPick');
    if(confirm && confirm.parentNode) confirm.parentNode.hidden = true;

    var chosen = null;
    pk.order.forEach(function(o){ if(o.id === pk.selected) chosen = o; });
    var ok = !!(chosen && chosen.ok);
    recordPick(ok);

    var firstWrongWhy = '';
    if(!ok){
      pk.order.forEach(function(o){
        if(o.id === pk.selected) firstWrongWhy = o.why;
      });
    }

    if(ok){
      sfxCorrect();
      showFeedback('ok', '答對了！', q.answer, q.note + ' 其他選項的原因，已在上面逐項標示。', '下一題', nextQuestion, q.answer);
      celebrate();
    }else{
      sfxWrong();
      showFeedback('no', '再想一想', q.answer, '你選的那一項：' + firstWrongWhy + ' 正確答案是標着「正確」的那一句。' + q.note, '下一題', nextQuestion, q.answer);
    }
  }

  function recordPick(ok){
    if(state.pick.recorded) return;
    state.pick.recorded = true;
    state.run.results.push({ qi: state.run.queue[state.run.pos], ok: ok });
  }

  /* =========================================================
     13. FEEDBACK + FLOW
     ========================================================= */
  function showFeedback(kind, title, answer, note, btnLabel, btnFn, sayText){
    var fb = $('feedback');
    if(state.run) state.run.__moving = false;
    var icon = kind === 'ok' ? '#i-check' : (kind === 'reveal' ? '#i-bulb' : '#i-x');
    fb.className = 'feedback ' + kind;
    fb.innerHTML =
      '<div class="fb-head"><svg class="ic" aria-hidden="true"><use href="' + icon + '"/></svg><span>' + esc(title) + '</span></div>' +
      (answer ? '<p class="fb-answer">' + esc(answer) + '</p>' : '') +
      '<p class="fb-note">' + esc(note) + '</p>' +
      '<div class="fb-actions">' +
        (sayText ? '<button class="say-btn" type="button" data-say="' + esc(sayText) + '"><svg class="ic" aria-hidden="true"><use href="#i-speaker"/></svg>聽一聽句子</button>' : '') +
        '<button class="btn btn--primary" type="button" id="fbNext">' + esc(btnLabel) + '</button>' +
      '</div>';
    $('fbNext').addEventListener('click', function(){
      if(!state.run || state.run.__moving) return;
      state.run.__moving = true;
      sfxClick();
      btnFn();
    });
    if(!fb.hasAttribute('tabindex')) fb.setAttribute('tabindex','-1');
    try{
      fb.scrollIntoView({ behavior: prefersReduce() ? 'auto' : 'smooth', block: 'nearest' });
    }catch(e){}
    window.setTimeout(function(){ focusEl(fb); }, 60);
  }

  function nextQuestion(){
    var r = state.run;
    r.__moving = false;
    r.pos++;
    if(r.pos >= r.queue.length){
      finishRun();
    }else{
      renderQuestion();
      window.scrollTo({ top: Math.max(0, $('screen-play').offsetTop - 80), behavior: prefersReduce() ? 'auto' : 'smooth' });
    }
  }

  /* =========================================================
     14. RESULT
     ========================================================= */
  function finishRun(){
    var r = state.run;
    var total = r.queue.length;
    var correct = r.results.filter(function(x){ return x.ok; }).length;
    var stars = 0;
    var isRetry = !!r.isRetry;
    if(total === 6 && !isRetry){
      if(correct === 6) stars = 3;
      else if(correct >= 4) stars = 2;
      else if(correct >= 2) stars = 1;
    }else{
      if(correct === total) stars = 3;
      else if(correct >= Math.ceil(total * 0.6)) stars = 2;
      else if(correct >= 1) stars = 1;
    }

    if(!isRetry){
      var key = 'evbest-' + r.level + '-' + r.mode;
      if(stars > bestOf(r.level, r.mode)) store.set(key, String(stars));
    }

    var d = DATA[r.level];
    $('resultKicker').textContent = d.label + ' · ' + (r.mode === 'train' ? '句子小火車' : '前後配一配') + (isRetry ? ' · 錯題重練' : '');
    $('resultTitle').textContent = stars === 3 ? '太厲害了！' : stars === 2 ? '很不錯！' : stars === 1 ? '再練一下就更好' : '別灰心，再來一次';

    var starHtml = '';
    for(var i=0;i<3;i++){
      starHtml += '<svg class="star' + (i < stars ? ' on' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>';
    }
    $('resultStars').innerHTML = starHtml;
    $('resultStars').setAttribute('aria-label', '獲得 ' + stars + ' 顆星，共 3 顆' + (isRetry ? '（本輪重練，不計入最佳紀錄）' : ''));
    $('resultScore').innerHTML = '答對 <b>' + correct + '</b> / ' + total + ' 題' + (correct === total ? '　全部正確！' : '') +
      (isRetry ? '<span class="retry-note">本輪重練，不計入最佳紀錄</span>' : '');

    var wrong = r.results.filter(function(x){ return !x.ok; });
    var box = $('wrongBox');
    if(wrong.length === 0){
      box.innerHTML = '<h3>錯題</h3><p class="wrong-empty">沒有錯題，全部答對！</p>';
    }else{
      var list = wrong.map(function(x){
        var q = DATA[r.level][r.mode][x.qi];
        var txt = r.mode === 'train' ? sentenceOf(q.cards) : q.stem.replace(/＿+/g, '＿＿');
        if(txt.length > 26) txt = txt.slice(0, 26) + '…';
        return '<li><span class="wq">' + (isRetry ? '原第 ' : '第 ') + (x.qi + 1) + ' 題</span><span class="wt">' + esc(txt) + '</span></li>';
      }).join('');
      box.innerHTML = '<h3>這次要留意的題目</h3><ul>' + list + '</ul>';
    }

    var actions = $('resultActions');
    var btns = [];
    if(wrong.length > 0){
      btns.push({ id:'retryWrong', cls:'btn--primary', label:'再練這 ' + wrong.length + ' 題', icon:'#i-refresh' });
      btns.push({ id:'replay', cls:'btn--ghost', label:'重玩整個模式', icon:'#i-refresh' });
      btns.push({ id:'toModes', cls:'btn--ghost', label:'返回模式選單', icon:'#i-home' });
    }else{
      btns.push({ id:'replay', cls:'btn--primary', label:'再玩一次', icon:'#i-refresh' });
      btns.push({ id:'otherMode', cls:'btn--mint', label:'挑戰另一個模式', icon:'#i-arrow' });
      btns.push({ id:'toModes', cls:'btn--ghost', label:'返回模式選單', icon:'#i-home' });
    }
    actions.innerHTML = btns.map(function(b){
      return '<button class="btn ' + b.cls + '" type="button" id="' + b.id + '"><svg class="ic" aria-hidden="true"><use href="' + b.icon + '"/></svg>' + b.label + '</button>';
    }).join('');

    if(wrong.length > 0){
      $('retryWrong').addEventListener('click', function(){
        sfxClick();
        startRun(r.mode, wrong.map(function(x){ return x.qi; }), true);
      });
    }
    $('replay').addEventListener('click', function(){
      sfxClick();
      startRun(r.mode, [0,1,2,3,4,5]);
    });
    if($('otherMode')){
      $('otherMode').addEventListener('click', function(){
        sfxClick();
        startRun(r.mode === 'train' ? 'pick' : 'train', [0,1,2,3,4,5]);
      });
    }
    $('toModes').addEventListener('click', function(){
      sfxClick();
      renderModes();
      showScreen('modes');
    });

    showScreen('result');
    if(stars === 3) sfxFanfare();
    else if(stars >= 1) sfxCorrect();
    window.setTimeout(function(){ $('resultTitle').focus(); }, 80);
  }

  /* =========================================================
     15. CELEBRATION (local, no layout shift)
     ========================================================= */
  function celebrate(){
    if(prefersReduce()) return;
    var fb = $('feedback');
    if(!fb || !fb.className) return;
    for(var i=0;i<10;i++){
      (function(i){
        var s = document.createElement('span');
        s.textContent = i % 2 ? '★' : '●';
        s.setAttribute('aria-hidden','true');
        s.style.cssText = 'position:absolute;left:' + (18 + Math.random()*64) + '%;top:' + (16 + Math.random()*24) + '%;' +
          'font-size:' + (12 + Math.random()*14) + 'px;color:' + (i%2 ? '#ffc23d' : '#6fd3b5') + ';' +
          'pointer-events:none;z-index:5;opacity:1;transition:transform .9s ease,opacity .9s ease;';
        fb.appendChild(s);
        window.setTimeout(function(){
          s.style.transform = 'translate(' + (Math.random()*70-35) + 'px,' + (-(40+Math.random()*40)) + 'px) rotate(' + (Math.random()*180) + 'deg)';
          s.style.opacity = '0';
        }, 20);
        window.setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
      })(i);
    }
  }

  /* =========================================================
     16. START
     ========================================================= */
  showScreen('cover');
  if('speechSynthesis' in window){
    try{ window.speechSynthesis.getVoices(); }catch(e){}
  }
})();
</script>
</body>
