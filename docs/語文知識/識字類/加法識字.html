<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>加法識字 · 拼字小甲蟲</title>
<meta name="description" content="把兩個部件加起來，拼出一個新字。初小版與高小版各 30 組繁體字，配有音效與朗讀。">
<style>
  :root{
    --cream:#FFF8EA;
    --paper:#FFFDF7;
    --ink:#4A3B2F;
    --ink-2:#7C6757;
    --ink-3:#A99684;
    --mint:#8FDCC0;
    --mint-2:#DDF7EC;
    --sky:#93C9F2;
    --sky-2:#E0F1FD;
    --peach:#FFB49A;
    --peach-2:#FFE5DA;
    --butter:#FFD976;
    --butter-2:#FFF2CE;
    --coral:#FF8E7A;
    --leaf:#6FBF8F;
    --lilac:#C9B8F0;
    --shadow:0 4px 0 rgba(74,59,47,.20);
    --shadow-lg:0 7px 0 rgba(74,59,47,.16);
    --font:"Yuanti TC","YuanTi TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 6%, #FFE9C8 0%, rgba(255,233,200,0) 52%),
      radial-gradient(circle at 92% 2%, #D8F5E8 0%, rgba(216,245,232,0) 46%),
      radial-gradient(circle at 50% 104%, #FFE3DA 0%, rgba(255,227,218,0) 54%),
      var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.38;
    background-image:radial-gradient(rgba(74,59,47,.16) 1.4px, transparent 1.4px);
    background-size:24px 24px;
  }
  button{font-family:inherit;color:inherit}
  button:focus-visible,a:focus-visible{outline:3px solid #4A90D9;outline-offset:3px}
  [hidden]{display:none !important}

  #app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
  .screen{
    flex:1;width:100%;max-width:920px;margin:0 auto;
    padding:0 clamp(14px,4.2vw,24px) calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
    animation:screenIn .26s ease-out;
  }
  .screen.play{max-width:640px}
  @keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 0 8px;
    flex:none;
  }
  .bar-title{
    flex:1;min-width:0;text-align:center;
    font-size:clamp(15px,4.2vw,18px);font-weight:800;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    flex:none;width:44px;height:44px;border-radius:15px;
    border:2.5px solid var(--ink);background:var(--paper);
    display:grid;place-items:center;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.2)}
  .icon-btn.spacer{visibility:hidden;pointer-events:none}

  /* ---------- home ---------- */
  .home-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:8px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.04em}
  .brand-dots{display:flex;gap:3px}
  .brand-dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);display:block}
  .brand-dots i:nth-child(1){background:var(--coral)}
  .brand-dots i:nth-child(2){background:var(--butter)}
  .brand-dots i:nth-child(3){background:var(--mint)}

  .hero{padding:clamp(6px,2vw,18px) 0 clamp(14px,3vw,22px)}
  .eyebrow{
    display:inline-block;margin:0 0 8px;padding:5px 12px;
    border:2px solid var(--ink);border-radius:999px;background:var(--butter-2);
    font-size:12px;font-weight:800;letter-spacing:.14em;
  }
  .hero h1{
    margin:0;font-size:clamp(27px,7.4vw,40px);line-height:1.22;letter-spacing:.01em;
  }
  .hero h1 em{font-style:normal;color:#2F8F6B;position:relative;white-space:nowrap}
  .hero h1 em::after{
    content:"";position:absolute;left:0;right:0;bottom:2px;height:8px;border-radius:6px;
    background:rgba(143,220,192,.55);z-index:-1;
  }
  .lede{margin:10px 0 0;color:var(--ink-2);font-size:clamp(13.5px,3.7vw,15px);line-height:1.7;max-width:30em}

  .hero-demo{
    margin-top:clamp(12px,3vw,18px);
    display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,10px);
    padding:clamp(14px,3.4vw,20px) 10px clamp(10px,2.6vw,14px);
    border:3px solid var(--ink);border-radius:26px;
    background:linear-gradient(180deg,#FFFDF7,#FFF1D9);
    box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  }
  .hero-demo::before{
    content:"";position:absolute;width:120px;height:120px;border-radius:50%;
    background:rgba(143,220,192,.28);top:-52px;right:-30px;
  }
  .hero-demo::after{
    content:"";position:absolute;width:90px;height:90px;border-radius:50%;
    background:rgba(255,180,154,.24);bottom:-46px;left:-24px;
  }
  .mini-holder{position:relative;padding-top:20px;display:flex;flex-direction:column;align-items:center}
  .mini-bug{position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;z-index:2}
  .mini-tile{
    width:clamp(48px,13.5vw,60px);aspect-ratio:1/1;display:grid;place-items:center;
    border:2.5px solid var(--ink);border-radius:16px;background:#fff;
    font-size:clamp(24px,7vw,30px);font-weight:800;line-height:1;
    box-shadow:0 3px 0 rgba(74,59,47,.18);position:relative;z-index:3;
  }
  .mini-tile.result{background:var(--butter-2);border-color:var(--ink)}
  .mini-op{font-size:clamp(18px,5vw,22px);font-weight:800;color:var(--ink-2);padding-top:20px}
  .demo-note{
    position:absolute;right:12px;bottom:8px;font-size:10.5px;color:var(--ink-3);
    font-weight:700;letter-spacing:.06em;
  }

  .levels{display:grid;gap:12px}
  .level-card{
    position:relative;overflow:hidden;text-align:left;cursor:pointer;
    border:3px solid var(--ink);border-radius:26px;padding:16px 18px;
    background:var(--paper);box-shadow:var(--shadow-lg);
    transition:transform .14s,box-shadow .14s;
  }
  .level-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,47,.18)}
  .level-card.junior{background:linear-gradient(150deg,#FFFDF7 42%,var(--mint-2))}
  .level-card.senior{background:linear-gradient(150deg,#FFFDF7 42%,var(--sky-2))}
  .level-card .blob{
    position:absolute;right:-34px;top:-44px;width:120px;height:120px;border-radius:50%;
    border:3px solid rgba(74,59,47,.12);
  }
  .level-card.junior .blob{background:rgba(143,220,192,.5)}
  .level-card.senior .blob{background:rgba(147,201,242,.5)}
  .lv-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;position:relative}
  .lv-tag{
    font-size:12px;font-weight:800;letter-spacing:.1em;padding:4px 10px;
    border:2px solid var(--ink);border-radius:999px;background:#fff;
  }
  .lv-name{font-size:clamp(18px,5vw,22px);font-weight:800;letter-spacing:.02em}
  .lv-starcount{
    margin-left:auto;display:inline-flex;align-items:center;gap:3px;
    font-size:12px;font-weight:800;color:var(--ink-2);white-space:nowrap;
  }
  .lv-starcount svg{width:15px;height:15px}
  .lv-desc{margin:2px 0 12px;color:var(--ink-2);font-size:13px;line-height:1.6;max-width:26em}
  .lv-bar{height:10px;border-radius:999px;background:rgba(74,59,47,.12);overflow:hidden;border:1.5px solid rgba(74,59,47,.14)}
  .lv-bar i{display:block;height:100%;border-radius:999px;background:var(--leaf);transition:width .4s}
  .lv-meta{display:flex;justify-content:space-between;gap:10px;margin-top:7px;padding-right:46px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
  .lv-arrow{
    position:absolute;right:14px;bottom:12px;width:36px;height:36px;border-radius:50%;
    border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;
  }

  .book-entry{
    margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px;border:2.5px dashed rgba(74,59,47,.5);border-radius:18px;
    background:rgba(255,253,247,.75);font-size:14px;font-weight:800;cursor:pointer;
  }
  .book-entry span{color:var(--ink-2);font-weight:700;font-size:12.5px}
  .foot-note{margin:12px 0 0;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:1.7}

  /* ---------- map ---------- */
  .map-hero{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
  .map-mascot{
    flex:none;width:clamp(72px,20vw,92px);aspect-ratio:1/1;border-radius:24px;
    border:3px solid var(--ink);background:var(--butter-2);
    display:grid;place-items:center;box-shadow:var(--shadow);
  }
  .map-mascot svg{width:76%;height:auto}
  .map-copy h2{margin:0 0 4px;font-size:clamp(20px,5.6vw,26px)}
  .map-copy p{margin:0;color:var(--ink-2);font-size:12.8px;line-height:1.6}
  .stages{display:grid;gap:11px}
  .stage-card{
    position:relative;text-align:left;cursor:pointer;
    border:3px solid var(--ink);border-radius:22px;padding:14px 16px;
    background:var(--paper);box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
  }
  .stage-card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.2)}
  .stage-no{font-size:16px;font-weight:800;letter-spacing:.03em}
  .stage-words{grid-column:1;font-size:12.5px;color:var(--ink-2);letter-spacing:.12em}
  .stage-stars{grid-column:2;grid-row:1;display:flex;gap:3px}
  .stage-stars svg{width:17px;height:17px}
  .stage-go{
    grid-column:2;grid-row:2;justify-self:end;
    font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;
    border:2px solid var(--ink);background:var(--butter-2);
  }
  .stage-card.cleared{background:linear-gradient(140deg,#FFFDF7,#E9F8F1)}

  /* ---------- play ---------- */
  .play-wrap{flex:1;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%}
  .dots{display:flex;gap:5px;justify-content:center;margin:0 0 10px;flex:none}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(74,59,47,.16);transition:all .2s}
  .dot.done{background:var(--leaf)}
  .dot.now{background:var(--coral);transform:scale(1.35)}

  .hint{
    flex:none;text-align:center;padding:8px 12px;margin-bottom:10px;
    border-radius:16px;background:rgba(255,253,247,.8);
    border:2px dashed rgba(74,59,47,.35);
  }
  .hint-word{
    font-size:clamp(22px,6.4vw,28px);font-weight:800;letter-spacing:.1em;
    display:flex;justify-content:center;align-items:center;gap:2px;line-height:1.3;
  }
  .hint-word .blank{
    display:inline-grid;place-items:center;min-width:1.15em;height:1.15em;
    margin:0 .06em;border-bottom:3px solid var(--coral);color:var(--coral);
    font-size:.92em;
  }
  .hint-main{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.6}

  .stage{
    position:relative;flex:1;min-height:172px;
    border:3px solid var(--ink);border-radius:28px;
    background:linear-gradient(180deg,#FFFDF7 0%,#FFF4DF 100%);
    box-shadow:var(--shadow-lg);
    display:flex;align-items:center;justify-content:center;
    padding:26px 8px 18px;overflow:hidden;
  }
  .stage::before{
    content:"";position:absolute;width:150px;height:150px;border-radius:50%;
    background:rgba(143,220,192,.20);top:-70px;right:-46px;
  }
  .stage::after{
    content:"";position:absolute;width:110px;height:110px;border-radius:50%;
    background:rgba(255,180,154,.18);bottom:-56px;left:-34px;
  }
  .eq{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(3px,1.4vw,9px);
  }
  .holder{position:relative;display:flex;flex-direction:column;align-items:center}
  .bughead{
    position:absolute;top:-27px;left:50%;transform:translateX(-50%);
    width:clamp(46px,13.5vw,58px);z-index:2;pointer-events:none;
    animation:bob 3.2s ease-in-out infinite;
  }
  .holder:nth-child(1) .bughead{animation-delay:-.4s}
  .holder:nth-child(3) .bughead{animation-delay:-1.6s}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
  .tile{
    width:clamp(58px,18.5vw,82px);aspect-ratio:1/1;
    display:grid;place-items:center;
    border:3px solid var(--ink);border-radius:20px;background:#fff;
    font-size:clamp(30px,9.6vw,46px);font-weight:800;line-height:1;
    box-shadow:0 4px 0 rgba(74,59,47,.2);
    position:relative;z-index:3;
    transition:transform .25s,background .25s;
  }
  .tile.tile-b.mystery{border-style:dashed;color:var(--ink-3);background:#FFFBF0}
  .tile.tile-c{border-style:dashed;border-color:rgba(74,59,47,.35);background:#FFFBF0}
  .tile.tile-c.ghost{
    color:rgba(74,59,47,.18);
    background:#FFF9EC;
  }
  @supports (-webkit-text-stroke:1px #000){
    .tile.tile-c.ghost{
      color:transparent;
      -webkit-text-stroke:1.4px rgba(74,59,47,.42);
    }
  }
  .tile.tile-c.unknown{color:rgba(74,59,47,.3);border-style:dashed}
  .tile.tile-c.reveal{
    border-style:solid;background:linear-gradient(160deg,#FFE9A8,#FFD976);
    animation:popIn .46s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes popIn{0%{transform:scale(.55) rotate(-8deg);opacity:.2}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  .tile.pop{animation:popTile .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes popTile{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  .op{font-size:clamp(20px,6vw,28px);font-weight:800;color:var(--ink-3);padding-top:6px}
  .eq.merged .tile-a{transform:translateX(5px) rotate(-3deg)}
  .eq.merged .tile-b{transform:translateX(-5px) rotate(3deg)}
  .spark{
    position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
    pointer-events:none;z-index:5;
  }
  @keyframes sparkFly{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}
  }

  .choices{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));
    gap:10px;margin-top:14px;flex:none;
  }
  .choice{
    aspect-ratio:1/1;min-height:62px;border:3px solid var(--ink);border-radius:20px;
    background:#fff;font-size:clamp(27px,8.2vw,36px);font-weight:800;line-height:1;
    box-shadow:0 4px 0 rgba(74,59,47,.2);cursor:pointer;
    transition:transform .12s,box-shadow .12s,background .2s;
  }
  .choice:nth-child(1){background:#FFF3D6}
  .choice:nth-child(2){background:#E3F7EE}
  .choice:nth-child(3){background:#E4F1FC}
  .choice:nth-child(4){background:#F7E7E1}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.2)}
  .choice.correct{background:#B9EBD2;border-color:#2F8F6B}
  .choice.wrong{background:#FFD3CB;border-color:#C9523F;animation:shake .42s}
  .choice:disabled{opacity:.4;cursor:default}
  .choice.wrong:disabled{opacity:.55}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  .feedback{
    min-height:20px;margin:8px 2px 0;text-align:center;
    font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5;
  }
  .feedback.bad{color:#B4462F}
  .feedback.good{color:#2F7F5C}

  .learn{
    margin-top:12px;flex:none;
    border:3px solid var(--ink);border-radius:24px;background:var(--paper);
    box-shadow:var(--shadow-lg);padding:12px 14px;
    animation:slideUp .32s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .learn-head{display:flex;align-items:center;gap:12px}
  .learn-char{
    flex:none;width:clamp(56px,15vw,66px);aspect-ratio:1/1;display:grid;place-items:center;
    border:2.5px solid var(--ink);border-radius:18px;
    background:linear-gradient(160deg,#FFEFB9,#FFD976);
    font-size:clamp(32px,9vw,40px);font-weight:800;line-height:1;
  }
  .learn-info{min-width:0;flex:1}
  .learn-word{
    font-size:clamp(16px,4.6vw,19px);font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  .learn-word .pill{
    font-size:10.5px;letter-spacing:.04em;font-weight:800;color:var(--ink-2);
    background:rgba(74,59,47,.08);border-radius:999px;padding:3px 8px;
  }
  .learn-sent{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .learn-btns{display:flex;gap:9px;margin-top:10px}
  .btn{
    border:2.5px solid var(--ink);border-radius:15px;padding:11px 14px;
    font-size:14px;font-weight:800;cursor:pointer;background:#fff;
    box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.2)}
  .btn.primary{flex:1;background:var(--butter)}
  .btn.ghost-btn{flex:none;background:#fff}
  .btn svg{width:17px;height:17px}

  /* ---------- overlay ---------- */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}
  .backdrop{
    position:absolute;inset:0;background:rgba(74,59,47,.42);
    backdrop-filter:blur(3px);animation:fadeIn .2s;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .result-card{
    position:relative;width:100%;max-width:360px;
    border:3px solid var(--ink);border-radius:28px;background:var(--paper);
    box-shadow:0 10px 0 rgba(74,59,47,.22);padding:22px 20px 18px;text-align:center;
    animation:popCard .4s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes popCard{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  .result-tag{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.15em;
    padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--butter-2);
  }
  .result-card h2{margin:10px 0 4px;font-size:clamp(22px,6.4vw,27px);letter-spacing:.02em}
  .result-card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6}
  .big-stars{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
  .big-stars svg{width:38px;height:38px;animation:starIn .45s cubic-bezier(.2,1.5,.4,1) both}
  .big-stars svg:nth-child(2){animation-delay:.1s}
  .big-stars svg:nth-child(3){animation-delay:.2s}
  @keyframes starIn{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  .result-btns{display:grid;gap:8px;margin-top:16px}
  .result-btns .row{display:flex;gap:8px}
  .result-btns .btn{flex:1}

  /* ---------- book ---------- */
  .tabs{display:flex;gap:8px;margin:4px 0 14px}
  .tab{
    flex:1;padding:10px 8px;border-radius:15px;border:2.5px solid var(--ink);
    background:#fff;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
  }
  .tab[aria-selected="true"]{background:var(--butter-2);box-shadow:0 2px 0 rgba(74,59,47,.22);transform:translateY(2px)}
  .book-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .char-btn{
    aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:14px;background:#fff;
    font-size:clamp(20px,6vw,26px);font-weight:800;cursor:pointer;
    box-shadow:0 3px 0 rgba(74,59,47,.16);position:relative;line-height:1;

  /* ================= 動畫 ================= */

  function burst(){
    var stage = document.getElementById('stage');
    if(!stage) return;
    var colors = ['#FFD976','#FF8E7A','#8FDCC0','#93C9F2','#C9B8F0'];
    for(var i=0;i<14;i++){
      var s = document.createElement('i');
      s.className = 'spark';
      var ang = Math.random()*Math.PI*2;
      var dist = 40 + Math.random()*70;
      s.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
      s.style.setProperty('--dy', (Math.sin(ang)*dist).toFixed(1)+'px');
      s.style.background = colors[i % colors.length];
      s.style.animation = 'sparkFly '+(0.55+Math.random()*0.3)+'s ease-out forwards';
      stage.appendChild(s);
      (function(node){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 950);
      })(s);
    }
  }

  /* ================= 流程 ================= */

  function setScreen(name){
    state.screen = name;
    state.overlay = null;
    render();
    try{ window.scrollTo(0,0); }catch(e){}
  }

  function startStage(level, stage){
    state.level = level;
    state.stage = stage;
    state.index = 0;
    state.phase = 'ask';
    state.firstTry = true;
    state.stageFirst = 0;
    lock = false;
    Speech.stop();
    setScreen('play');
  }

  function choose(opt, btn){
    if(state.phase !== 'ask' || lock) return;
    var item = currentItem();

    if(opt === item.b){
      lock = true;
      Sfx.correct();
      btn.classList.add('correct');

      var tileB = document.getElementById('tileB');
      var tileC = document.getElementById('tileC');
      if(tileB){
        tileB.textContent = item.b;
        tileB.classList.remove('mystery');
        tileB.classList.add('pop');
      }
      var all = document.querySelectorAll('.choice');
      for(var i=0;i<all.length;i++) all[i].disabled = true;

      setTimeout(function(){
        Sfx.merge();
        var eq = document.getElementById('eq');
        if(eq) eq.classList.add('merged');
        if(tileC){
          tileC.textContent = item.c;
          tileC.classList.remove('ghost','unknown');
          tileC.classList.add('reveal');
        }
        burst();
      }, 280);

      setTimeout(function(){
        state.phase = 'reveal';
        if(state.firstTry) state.stageFirst++;
        addLearned(item.c);
        showLearn();
        lock = false;
      }, 900);
      return;
    }

    state.firstTry = false;
    btn.classList.add('wrong');
    btn.disabled = true;
    Sfx.wrong();
    setFeedback('這個部件合起來不是這個字，再試試看', true);
  }

  function setFeedback(text, bad){
    var el = document.getElementById('feedback');
    if(!el) return;
    el.textContent = text;
    el.classList.remove('bad','good');
    if(bad) el.classList.add('bad');
  }

  function showLearn(){
    var item = currentItem();
    var choices = document.getElementById('choices');
    var learn = document.getElementById('learn');
    var fb = document.getElementById('feedback');
    if(choices) choices.hidden = true;
    if(fb){ fb.textContent = '拼對了！'; fb.classList.remove('bad'); fb.classList.add('good'); }
    if(!learn) return;

    learn.hidden = false;
    learn.innerHTML = ''
      + '<div class="learn-head">'
      +   '<div class="learn-char">'+esc(item.c)+'</div>'
      +   '<div class="learn-info">'
      +     '<div class="learn-word">'+esc(item.word)+'<span class="pill">'+esc(item.a)+' ＋ '+esc(item.b)+'</span></div>'
      +     '<p class="learn-sent">'+esc(item.sent)+'</p>'
      +   '</div>'
      + '</div>'
      + '<div class="learn-btns">'
      +   '<button class="btn ghost-btn" data-act="speak">'+icon('play')+' 聽一聽</button>'
      +   '<button class="btn primary" data-act="next">'+(state.index === STAGE_SIZE-1 ? '完成本關' : '下一個')+'</button>'
      + '</div>';

    if(state.sound){
      setTimeout(function(){
        if(state.phase === 'reveal') Speech.say(item.c + '，' + item.word);
      }, 420);
    }
  }

  function nextItem(){
    if(state.phase !== 'reveal') return;
    Speech.stop();
    state.index++;
    state.firstTry = true;
    state.phase = 'ask';
    lock = false;
    if(state.index >= STAGE_SIZE){
      finishStage();
    }else{
      render();
      try{ window.scrollTo(0,0); }catch(e){}
    }
  }

  function finishStage(){
    var s = starsFor(state.stageFirst);
    if(s > stars[state.level][state.stage]){
      stars[state.level][state.stage] = s;
    }
    saveStore();
    state.phase = 'done';
    render();
    Sfx.fanfare();
  }

  /* ================= 事件 ================= */

  app.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if(!el || el.disabled) return;
    var act = el.getAttribute('data-act');

    if(act === 'level'){
      state.level = el.getAttribute('data-level');
      Sfx.tap();
      setScreen('map');
      return;
    }
    if(act === 'stage'){
      startStage(state.level, parseInt(el.getAttribute('data-stage'),10) || 0);
      Sfx.tap();
      return;
    }
    if(act === 'home'){
      Speech.stop();
      Sfx.tap();
      setScreen('home');
      return;
    }
    if(act === 'map'){
      Speech.stop();
      Sfx.tap();
      setScreen('map');
      return;
    }
    if(act === 'book'){
      var lv = el.getAttribute('data-level');
      if(lv) state.bookLevel = lv;
      state.sheet = null;
      Sfx.tap();
      setScreen('book');
      return;
    }
    if(act === 'book-tab'){
      state.bookLevel = el.getAttribute('data-level');
      state.sheet = null;
      Sfx.tap();
      render();
      return;
    }
    if(act === 'open-char'){
      state.sheet = parseInt(el.getAttribute('data-i'),10) || 0;
      Sfx.pop();
      render();
      return;
    }
    if(act === 'close-sheet'){
      state.sheet = null;
      render();
      return;
    }
    if(act === 'speak-char'){
      var it = DATA[state.bookLevel].items[state.sheet];
      var ok = Speech.say(it.c + '，' + it.word);
      var st = document.getElementById('sheetStatus');
      if(st) st.textContent = ok ? '正在朗讀：' + it.word : '這個裝置暫時不能朗讀，請跟著大人讀一遍。';
      return;
    }
    if(act === 'choose'){
      choose(el.getAttribute('data-opt'), el);
      return;
    }
    if(act === 'speak'){
      var item = currentItem();
      var good = Speech.say(item.c + '，' + item.word);
      if(!good) setFeedback('這個裝置暫時不能朗讀，請跟著大人讀一遍', true);
      return;
    }
    if(act === 'next'){
      nextItem();
      return;
    }
    if(act === 'replay'){
      startStage(state.level, state.stage);
      return;
    }
    if(act === 'next-stage'){
      var nxt = Math.min(state.stage + 1, STAGE_COUNT - 1);
      startStage(state.level, nxt);
      return;
    }
    if(act === 'toggle-sound'){
      state.sound = !state.sound;
      saveStore();
      if(!state.sound) Speech.stop();
      else Sfx.tap();
      var soundBtns = document.querySelectorAll('[data-act="toggle-sound"]');
      for(var si=0; si<soundBtns.length; si++){
        soundBtns[si].innerHTML = icon('sound');
        soundBtns[si].setAttribute('aria-label', state.sound ? '關閉音效' : '開啟音效');
      }
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(state.sheet !== null){
        state.sheet = null;
        render();
      }
    }
  });

  /* ================= 啟動 ================= */

  loadStore();
  render();
})();
</script>
</body>
</html>
