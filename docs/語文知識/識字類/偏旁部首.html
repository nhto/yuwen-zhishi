/* ---------- 進度儲存 ---------- */
function prog(){try{const s=localStorage.getItem('pp4_prog');return s?JSON.parse(s):{};}catch(e){return {};}}
function saveProg(r,st){try{const p=prog();if(!p[r]||p[r]<st){p[r]=st;localStorage.setItem('pp4_prog',JSON.stringify(p));}}catch(e){}}
function stars(r){const p=prog();return p[r]||0;}
function starStr(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'☆';return s;}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}

/* ---------- 音效 ---------- */
function beep(f,d,type,delay){
  if(!soundOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.18,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
function sfx(kind){
  if(kind==='ok'){[523,659,784].forEach(function(f,i){beep(f,0.14,'triangle',i*0.07);});}
  else if(kind==='no'){beep(220,0.18,'sawtooth',0);beep(165,0.22,'sawtooth',0.12);}
  else if(kind==='tap'){beep(660,0.06,'square',0);}
  else if(kind==='win'){[523,659,784,1046].forEach(function(f,i){beep(f,0.2,'triangle',i*0.13);});}
}

/* ---------- 語音：優先普通話 ---------- */
let VOICES=[];
function loadVoices(){try{if(!window.speechSynthesis)return;VOICES=speechSynthesis.getVoices()||[];}catch(e){VOICES=[];}}
function hasSpeech(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance);}
if(hasSpeech()){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function pickVoice(){
  if(!VOICES.length)loadVoices();
  let i;
  for(i=0;i<VOICES.length;i++){if(/^zh[-_]CN/i.test(VOICES[i].lang||''))return VOICES[i];}
  for(i=0;i<VOICES.length;i++){if(/^zh[-_]Hans/i.test(VOICES[i].lang||''))return VOICES[i];}
  for(i=0;i<VOICES.length;i++){if(/^zh/i.test(VOICES[i].lang||''))return VOICES[i];}
  return null;
}
function speak(text){
  if(!voiceOn||!hasSpeech()||!text)return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=0.82;u.pitch=1.1;
    const v=pickVoice();if(v)u.voice=v;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t;}return b;}
function sample(arr,n,ex){const f=arr.filter(function(x){return !ex||ex.indexOf(x)<0;});return shuffle(f).slice(0,n);}

function art(ch,cls){
  const spec=PIC[ch.c]||'face';
  const plus=spec.indexOf('+'), tilde=spec.indexOf('~');
  let inner='';
  if(plus>0){
    const a=spec.slice(0,plus),b=spec.slice(plus+1);
    inner='<g transform="translate(33,66) scale(.86)">'+(SYM[a]||SYM.star)+'</g>'+
      '<g transform="translate(87,64) scale(.84)">'+(SYM[b]||SYM.star)+'</g>';
  }else if(tilde>0){
    const m=spec.slice(0,tilde),p=spec.slice(tilde+1);
    inner='<g transform="translate(53,72) scale(1.24)">'+(SYM[m]||SYM.star)+'</g>'+
      '<g transform="translate(95,30) scale(.72)">'+(SYM[p]||SYM.star)+'</g>';
  }else{
    inner='<g transform="translate(60,62) scale(1.45)">'+(SYM[spec]||SYM.star)+'</g>';
  }
  return '<svg class="'+(cls||'')+'" viewBox="0 0 120 120" role="img" aria-label="'+esc(ch.w)+'">'+
    '<rect width="120" height="120" rx="20" fill="'+ch.bg+'"/>'+
    '<circle cx="100" cy="18" r="13" fill="#fff" opacity=".45"/>'+
    '<circle cx="14" cy="104" r="18" fill="#fff" opacity=".3"/>'+
    '<ellipse cx="60" cy="104" rx="34" ry="6" fill="#000" opacity=".06"/>'+
    inner+'</svg>';
}

/* ---------- 出題 ---------- */
function makeOptions(correct,n){
  const seen={};seen[correct.c]=1;
  const others=[],cand=shuffle(POOL);
  for(let i=0;i<cand.length&&others.length<n-1;i++){
    const x=cand[i];
    if(!seen[x.c]){seen[x.c]=1;others.push({c:x.c,w:x.w});}
  }
  return shuffle([{c:correct.c,w:correct.w}].concat(others));
}
function makeOne(type,ch){
  if(type==='fill'){
    const blank=ch.w.replace(ch.c,'＿');
    return {t:'fill',tag:CFG.fill,ch:ch,word:blank,opts:makeOptions(ch,4)};
  }
  return {t:type,tag:CFG[type],ch:ch,opts:makeOptions(ch,4)};
}
function pickOutsiders(rad,n,used){
  const skip={};used.forEach(function(c){skip[c]=1;});
  return sample(POOL.filter(function(x){return x.r!==rad.r&&!skip[x.c];}),n);
}
function makeOdd(rad){
  const inn=sample(rad.chars,3);
  const out=pickOutsiders(rad,1,inn.map(function(x){return x.c;}))[0];
  const items=shuffle([{c:inn[0].c,ok:false},{c:inn[1].c,ok:false},{c:inn[2].c,ok:false},{c:out.c,ok:true}]);
  return {t:'odd',tag:CFG.odd,items:items,rad:rad};
}
function makeSpot(rad){
  const inn=sample(rad.chars,2);
  const out=pickOutsiders(rad,6,inn.map(function(x){return x.c;}));
  const items=shuffle(inn.map(function(x){return {c:x.c,ok:true};}).concat(out.map(function(x){return {c:x.c,ok:false};})));
  return {t:'spot',tag:CFG.spot,items:items,rad:rad,found:0};
}
function qSig(q){
  if(q.t==='odd'||q.t==='spot')return q.t+'|'+q.items.map(function(x){return x.c;}).sort().join('');
  return q.t+'|'+q.ch.c;
}
function makeQuestions(rad){
  const seq=shuffle(rad.chars.slice());let k=0;
  const next=function(){const c=seq[k%seq.length];k++;return c;};
  const seen={};
  return PLAN.map(function(t){
    let q=null,tries=0;
    do{
      q=t==='odd'?makeOdd(rad):(t==='spot'?makeSpot(rad):makeOne(t,next()));
      tries++;
    }while(seen[qSig(q)]&&tries<20);
    seen[qSig(q)]=1;
    return q;
  });
}
function startLevel(r){
  S.rad=findRad(r);S.qs=makeQuestions(S.rad);S.qi=0;S.score=0;S.locked=false;
  S.renderedQi=-1;S.done=false;
  S.screen='game';render();
}

/* ---------- 題目畫面 ---------- */
function game(){
  const rad=S.rad,q=S.qs[S.qi];
  if(S.renderedQi!==S.qi){S.renderedQi=S.qi;S.locked=false;}
  renderTop(PLABEL[rad.pos]+' · '+rad.name,'levels');
  const pct=Math.round((S.qi/8)*100);
  let body='',foot='';
  if(q.t==='listen'){
    const noVoice=!hasSpeech();
    body='<button class="spk" onclick="speak(\''+q.ch.w+'\');sfx(\'tap\')" aria-label="播放讀音">'+ic('speaker')+'</button>'+
      '<p class="qtext">聽一聽，選出正確的字</p>'+
      '<button class="pyhint" onclick="showPy()">聽不到？看拼音</button>'+
      '<div class="pybox" id="pybox"'+(noVoice?'':' hidden')+'>'+esc(q.ch.p)+'</div>'+
      (noVoice?'<div class="note" style="margin-top:8px;font-size:13px">此裝置沒有中文語音，已顯示拼音代替。</div>':'');
    foot='<div class="opts">'+q.opts.map(function(o){return '<button class="opt" onclick="answer(this,\''+o.c+'\',\''+q.ch.c+'\')">'+o.c+'</button>';}).join('')+'</div>';
  }else if(q.t==='fill'){
    body='<p class="qtext">把字放進詞語裡</p><div class="wordblank">'+q.word.split('').map(function(x){return x==='＿'?'<i></i>':x;}).join('')+'</div><div class="qart" style="width:min(38vw,140px)">'+art(q.ch)+'</div>';
    foot='<div class="opts">'+q.opts.map(function(o){return '<button class="opt" onclick="answer(this,\''+o.c+'\',\''+q.ch.c+'\')">'+o.c+'</button>';}).join('')+'</div>';
  }else if(q.t==='odd'){
    body='<p class="qtext">哪一個字<b>沒有</b>「'+rad.name+'」？</p>';
    foot='<div class="opts" style="grid-template-columns:1fr 1fr">'+q.items.map(function(o,i){return '<button class="opt" data-i="'+i+'" onclick="answerOdd(this,'+(o.ok?1:0)+')">'+o.c+'</button>';}).join('')+'</div>';
  }else if(q.t==='spot'){
    body='<p class="qtext">在 8 個字裡找出 <b>2 個</b>有「'+rad.name+'」的字</p>';
    foot='<div class="grid9">'+q.items.map(function(o,i){return '<button class="cell9" data-i="'+i+'" onclick="answerSpot(this,'+(o.ok?1:0)+')">'+o.c+'</button>';}).join('')+'</div>';
  }
  app.innerHTML='<div class="qhead"><div class="pbar"><i style="width:'+pct+'%"></i></div><span class="qcount">'+(S.qi+1)+' / 8</span></div>'+
    '<div class="qcard"><span class="qtag">'+q.tag+'</span>'+body+'</div>'+foot+
    '<div class="note">第 '+(S.qi+1)+' 題 · 答對 '+S.score+' 題</div>';
  if(q.t==='listen'&&hasSpeech()){setTimeout(function(){if(S.screen==='game'&&S.qs[S.qi]===q)speak(q.ch.w);},280);}
}
function showPy(){const el=document.getElementById('pybox');if(el)el.hidden=!el.hidden;sfx('tap');}
function toast(txt,good){
  toastEl.textContent=txt;toastEl.className='toast show '+(good?'good':'bad');
  clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.className='toast';},900);
}
function nextQ(ok){
  if(ok)S.score++;
  setTimeout(function(){
    S.qi++;
    if(S.qi>=8){finish();}else{render();}
  },ok?820:1250);
}
function answer(el,val,correct){
  if(S.locked)return;S.locked=true;
  const q=S.qs[S.qi],ok=val===correct;
  document.querySelectorAll('.opt').forEach(function(b){if(b.textContent===correct)b.classList.add('ok');});
  if(ok){el.classList.add('ok');sfx('ok');toast('答對了！',true);speak(q.ch.w);}
  else{el.classList.add('no');sfx('no');toast('再想想～',false);}
  nextQ(ok);
}
function answerOdd(el,ok){
  if(S.locked)return;S.locked=true;
  const q=S.qs[S.qi];
  document.querySelectorAll('.opt').forEach(function(b,i){if(q.items[i].ok)b.classList.add('ok');});
  if(ok){el.classList.add('ok');sfx('ok');toast('找到了！',true);}
  else{el.classList.add('no');sfx('no');toast('這個字有這個偏旁喔',false);}
  nextQ(ok);
}
function answerSpot(el,ok){
  if(S.locked||el.disabled)return;
  const q=S.qs[S.qi];
  if(!ok){
    S.locked=true;el.classList.add('no');
    document.querySelectorAll('.cell9').forEach(function(b,i){if(q.items[i].ok)b.classList.add('ok');});
    sfx('no');toast('這一個沒有偏旁',false);nextQ(false);return;
  }
  el.classList.add('ok');el.disabled=true;q.found++;sfx('tap');
  if(q.found>=2){S.locked=true;sfx('ok');toast('兩個都找到！',true);nextQ(true);}
}
/* ---------- 結算 ---------- */
function finish(){
  const rad=S.rad,st=S.score>=8?3:(S.score>=6?2:1);
  if(!S.done){S.done=true;saveProg(rad.r,st);sfx('win');}
  S.screen='result';
  renderTop('本關結算','levels');
  app.innerHTML='<div class="result card" style="padding:20px">'+
    '<div class="stars" aria-label="獲得 '+st+' 顆星">'+starStr(st)+'</div>'+
    '<h2>'+rad.name+' 完成！</h2>'+
    '<p>答對 '+S.score+' / 8 題 · 答案與選項每次都重新洗牌</p>'+
    '<div class="recap">'+rad.chars.map(function(c){return '<div><span class="artbox">'+art(c)+'</span><b style="color:'+rad.color+'">'+c.c+'</b></div>';}).join('')+'</div>'+

      '<button class="btn grn wide" onclick="radDetail(\''+rad.r+'\')">'+ic('book')+'複習這個部首</button>'+
    '</div></div>';
}
function render(){
  if(S.screen==='home')home();
  else if(S.screen==='teach')teach();

  else if(S.screen==='play')playHome();
