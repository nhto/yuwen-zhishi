<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>閱讀小偵探｜找關鍵詞・找中心句・進階挑戰</title>
<meta name="description" content="香港小學中文科閱讀策略互動遊戲：跟着小偵探學會找關鍵詞和找中心句，24 題練習與挑戰，另設五六年級進階雙重任務，支援手機、平板和電腦。">
<style>
/* ============ 基礎 ============ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FFF6E9;
  --ink:#332E4E;
  --ink-soft:#6E6889;
  --line:rgba(51,46,78,.16);
  --orange:#FF8A3D;
  --orange-d:#C95F16;
  --yellow:#FFD447;
  --yellow-d:#C99B00;
  --teal:#2FC1B2;
  --teal-d:#1B8B80;
  --purple:#7A6CF0;
  --purple-d:#5040C4;
  --pink:#FF7BA9;
  --pink-d:#C9426F;
  --blue:#4AA8FF;
  --blue-d:#1E76C4;
  --green:#2FA36B;
  --green-bg:#E2F7EC;
  --red:#D64545;
  --red-bg:#FFE6E6;
  --card:#FFFFFF;
  --r-lg:34px;
  --r-md:24px;
  --r-sm:18px;
  --fs-body:clamp(17px,1.55vw,20px);
  --pad:clamp(14px,3.4vw,34px);
  --maxw:1120px;
  --shadow-card:0 10px 0 rgba(51,46,78,.13);
}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","PingFang HK","Microsoft JhengHei","Heiti TC","Hiragino Sans GB",sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:var(--fs-body);
  line-height:1.75;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(51,46,78,.075) 1.6px, transparent 1.7px);
  background-size:24px 24px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(680px 460px at 8% -4%, rgba(255,212,71,.34), transparent 62%),
    radial-gradient(620px 420px at 96% 4%, rgba(47,193,178,.22), transparent 62%),
    radial-gradient(700px 520px at 50% 108%, rgba(122,108,240,.16), transparent 66%);
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
button{font-family:inherit}
:where(button,[role="button"],a):focus-visible{outline:4px solid var(--blue);outline-offset:3px;border-radius:10px}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ 版面 ============ */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 clamp(14px,3.6vw,30px)}
.view{padding:clamp(14px,2.4vw,26px) 0 clamp(28px,5vw,60px);animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.92;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 頂欄 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,246,233,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
}
.topbar .inner{
  max-width:var(--maxw);margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) clamp(12px,3.6vw,30px) 8px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:46px;height:46px;flex:none}
.brand .txt{min-width:0}
.brand b{display:block;font-size:clamp(17px,2.2vw,22px);line-height:1.2;letter-spacing:.02em}
.brand span{display:block;font-size:clamp(11px,1.3vw,13px);color:var(--ink-soft);line-height:1.3;font-weight:600}
.spacer{flex:1 1 auto}
.iconbtn{
  flex:none;width:clamp(44px,6vw,54px);height:clamp(44px,6vw,54px);
  display:grid;place-items:center;border-radius:50%;
  border:3px solid var(--ink);background:#fff;color:var(--ink);
  box-shadow:0 4px 0 rgba(51,46,78,.2);cursor:pointer;
  transition:transform .1s,box-shadow .1s,background .2s;
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,46,78,.2)}
.iconbtn.off{color:#A9A4BC;background:#F4F1EA}
.iconbtn svg{width:55%;height:55%}
.starpill{
  display:flex;align-items:center;gap:6px;flex:none;
  padding:4px 14px 4px 8px;border-radius:999px;border:3px solid var(--ink);
  background:var(--yellow);font-weight:900;font-size:clamp(14px,1.7vw,18px);
  box-shadow:0 4px 0 rgba(51,46,78,.2);line-height:1.3;
}
.starpill svg{width:22px;height:22px;flex:none}

/* ============ 按鈕 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-family:inherit;font-weight:900;font-size:clamp(17px,1.9vw,21px);line-height:1.2;
  padding:.72em 1.5em;border-radius:999px;border:3px solid var(--ink);
  background:var(--yellow);color:var(--ink);cursor:pointer;
  box-shadow:0 6px 0 rgba(51,46,78,.92);
  transition:transform .08s,box-shadow .08s,filter .2s;
  text-decoration:none;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(51,46,78,.92)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:0 6px 0 rgba(51,46,78,.92)}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn.orange{background:var(--orange);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff}
.btn.lg{font-size:clamp(19px,2.3vw,25px);padding:.8em 1.9em}
.btn.block{display:flex;width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:clamp(14px,2.6vw,26px)}

/* ============ 卡片 ============ */
.card{
  background:#fff;border:3px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);
}
.sect-head{display:flex;align-items:center;gap:12px;margin:clamp(6px,1.4vw,14px) 0 clamp(12px,2vw,20px)}
.sect-head .bar{width:12px;height:clamp(28px,4vw,40px);border-radius:99px;background:var(--orange);border:3px solid var(--ink);flex:none}
.sect-head h2{font-size:clamp(21px,3vw,30px);line-height:1.25;letter-spacing:.02em}
.sect-head p{font-size:clamp(13px,1.5vw,16px);color:var(--ink-soft);font-weight:600}

/* ============ 首頁 ============ */
.hero{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:minmax(150px,.78fr) 1.5fr;
  gap:clamp(10px,3vw,34px);align-items:center;
  padding:var(--pad);
  border:3px solid var(--ink);border-radius:var(--r-lg);
  background:linear-gradient(155deg,#FFEAC6 0%,#FFF9EE 52%,#E8FBF6 100%);
  box-shadow:var(--shadow-card);
  margin-top:clamp(8px,2vw,18px);
}
.hero .mascot{width:100%;max-width:270px;margin:0 auto;filter:drop-shadow(0 8px 0 rgba(51,46,78,.1))}
.hero-copy h1{
  font-size:clamp(30px,6.2vw,58px);line-height:1.12;letter-spacing:.01em;
  font-weight:900;
  color:var(--ink);
  text-shadow:3px 3px 0 #fff, 6px 6px 0 rgba(255,138,61,.35);
}
.hero-copy .sub{
  margin-top:.45em;font-size:clamp(15px,2vw,21px);font-weight:800;color:var(--ink-soft);line-height:1.6;
}
.hero-copy .sub em{font-style:normal;color:var(--orange-d);background:linear-gradient(transparent 62%, rgba(255,212,71,.85) 62%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(10px,2vw,18px)}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 12px;border-radius:999px;border:2.5px solid var(--ink);
  background:#fff;font-size:clamp(12px,1.4vw,15px);font-weight:800;
}
.chip svg{width:1.05em;height:1.05em;flex:none}

.entry-grid{
  display:grid;gap:clamp(12px,2.2vw,22px);margin-top:clamp(16px,3vw,30px);
  grid-template-columns:repeat(3,1fr);
}
.entry{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:clamp(16px,2.4vw,26px);border:3px solid var(--ink);border-radius:var(--r-md);
  background:#fff;cursor:pointer;text-align:left;font-family:inherit;
  box-shadow:0 8px 0 rgba(51,46,78,.13);
  transition:transform .1s,box-shadow .1s;
  overflow:hidden;
}
.entry::after{
  content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:var(--tint,var(--yellow));opacity:.28;
}
.entry:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(51,46,78,.13)}
.entry .ic{
  width:clamp(56px,7vw,68px);height:clamp(56px,7vw,68px);border-radius:20px;
  display:grid;place-items:center;border:3px solid var(--ink);
  background:var(--tint,var(--yellow));color:#fff;flex:none;
}
.entry .ic svg{width:60%;height:60%}
.entry .t{display:block;font-size:clamp(20px,2.4vw,25px);line-height:1.25;margin-top:4px;font-weight:900}
.entry .d{display:block;font-size:clamp(13px,1.5vw,16px);color:var(--ink-soft);font-weight:600;line-height:1.55}
.entry .d b{color:var(--ink)}
.entry .go{
  margin-top:auto;padding-top:10px;display:inline-flex;align-items:center;gap:6px;
  font-weight:900;font-size:clamp(14px,1.6vw,17px);color:var(--ink);
}
.entry .go svg{width:1.1em;height:1.1em;transition:transform .2s}
.entry:hover .go svg{transform:translateX(4px)}
.entry .badge{
  position:absolute;right:clamp(12px,2vw,20px);top:clamp(12px,2vw,20px);
  font-size:12px;font-weight:900;padding:2px 10px;border-radius:99px;
  border:2.5px solid var(--ink);background:#fff;
}

/* ============ 教學 ============ */
.seg{
  display:flex;gap:6px;padding:6px;border:3px solid var(--ink);border-radius:999px;
  background:#fff;box-shadow:0 6px 0 rgba(51,46,78,.13);
  width:100%;max-width:560px;margin:0 auto clamp(16px,2.6vw,26px);
}
.seg button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:.6em .5em;border:0;border-radius:999px;background:transparent;color:var(--ink-soft);
  font-family:inherit;font-weight:900;font-size:clamp(15px,1.9vw,20px);cursor:pointer;
  transition:background .2s,color .2s,transform .1s;
}
.seg button svg{width:1.15em;height:1.15em;flex:none}
.seg button[aria-selected="true"]{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-d)}
.seg button[aria-selected="true"]:active{transform:translateY(2px)}

.teach-hero{
  display:grid;grid-template-columns:1.35fr .95fr;gap:clamp(12px,2.4vw,26px);
  align-items:center;padding:clamp(16px,2.6vw,28px);
  border:3px solid var(--ink);border-radius:var(--r-lg);
  background:linear-gradient(140deg,#FFFFFF,#F4F0FF);
  box-shadow:var(--shadow-card);
}
.nw{white-space:nowrap}
.teach-hero h3{font-size:clamp(22px,3.2vw,32px);line-height:1.25}
.teach-hero p{margin-top:.5em;font-size:clamp(15px,1.7vw,18px);color:var(--ink-soft);font-weight:600}
.teach-hero .pic{display:grid;place-items:center}
.teach-hero .pic svg{width:100%;max-width:230px;height:auto}

.steps{
  display:grid;gap:clamp(10px,1.8vw,18px);margin-top:clamp(14px,2.4vw,24px);
  grid-template-columns:repeat(4,1fr);
}
.step{
  position:relative;padding:clamp(14px,2vw,22px);
  border:3px solid var(--ink);border-radius:var(--r-md);background:#fff;
  box-shadow:0 7px 0 rgba(51,46,78,.12);
}
.step .no{
  position:absolute;right:10px;top:10px;
  font-size:clamp(12px,1.35vw,13.5px);font-weight:900;line-height:1.5;
  color:var(--tint,var(--teal));background:rgba(51,46,78,.06);
  border:2px solid currentColor;border-radius:99px;padding:1px 9px;
}
.step .ic{
  width:clamp(50px,6.4vw,62px);height:clamp(50px,6.4vw,62px);border-radius:18px;
  border:3px solid var(--ink);display:grid;place-items:center;color:#fff;
  background:var(--tint,var(--teal));
}
.step .ic svg{width:60%;height:60%}
.step h4{font-size:clamp(19px,2.1vw,24px);margin-top:10px;line-height:1.3;padding-right:56px}
.step p{font-size:clamp(15.5px,1.7vw,18.5px);color:var(--ink-soft);font-weight:600;line-height:1.7;margin-top:6px}

.demo{
  margin-top:clamp(14px,2.4vw,24px);padding:clamp(16px,2.6vw,28px);
  border:3px solid var(--ink);border-radius:var(--r-lg);background:#FFFDF6;
  box-shadow:var(--shadow-card);
}
.demo .lbl{
  display:inline-flex;align-items:center;gap:6px;padding:3px 14px;border-radius:99px;
  background:var(--ink);color:#fff;font-weight:900;font-size:clamp(13px,1.5vw,15px);
}
.demo .lbl svg{width:1em;height:1em}
.demo .txt{
  margin-top:14px;font-size:clamp(20px,2.7vw,28px);line-height:2;font-weight:800;
}
.demo .hl{
  position:relative;color:var(--ink);padding:0 .12em;border-radius:8px;
  background:linear-gradient(transparent 18%,rgba(255,212,71,.95) 18%,rgba(255,212,71,.95) 88%,transparent 88%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.demo .hl.teal{background:linear-gradient(transparent 18%,rgba(47,193,178,.45) 18%,rgba(47,193,178,.45) 88%,transparent 88%)}
.demo .note{
  margin-top:16px;padding:12px 16px;border-radius:var(--r-sm);
  background:rgba(47,193,178,.12);border:2.5px dashed rgba(27,139,128,.6);
  font-size:clamp(14px,1.65vw,17px);font-weight:700;line-height:1.7;
}
.demo .note b{color:var(--teal-d)}
.sentbox{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sentline{
  display:flex;gap:10px;align-items:flex-start;font-size:clamp(18px,2.4vw,25px);
  font-weight:800;line-height:1.75;padding:6px 10px;border-radius:14px;
  transition:background .2s;
}
.sentline .n{
  flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;
  border:2.5px solid var(--ink);background:#fff;font-size:.62em;font-weight:900;margin-top:.35em;
}
.sentline.on{background:rgba(47,193,178,.16)}
.sentline.on .n{background:var(--teal);color:#fff}


/* ============ 進階挑戰區 ============ */
.entry.adv{
  grid-column:1/-1;gap:clamp(12px,2.4vw,24px);
  background:linear-gradient(120deg,#EAF4FF 0%,#FFFFFF 46%,#F3F0FF 100%);
}
.entry.adv::after{background:var(--blue);opacity:.18;width:200px;height:200px;right:-60px;top:-70px}
.entry.adv .body{flex:1;min-width:0}
@media (min-width:761px){
  .entry.adv{flex-direction:row;align-items:center}
  .entry.adv .go{margin-top:0;padding-top:0;white-space:nowrap}
}
.entry.adv .badge{background:var(--blue);color:#fff;border-color:var(--ink)}
.entry.adv .t{color:var(--blue-d)}
.mode-grid.solo{grid-template-columns:1fr}
.tipband{
  display:flex;align-items:flex-start;gap:12px;margin-bottom:clamp(14px,2.4vw,22px);
  padding:clamp(12px,2vw,20px);border:3px dashed rgba(30,118,196,.55);border-radius:var(--r-md);
  background:rgba(74,168,255,.09);
}
.tipband .ti{
  flex:none;width:clamp(40px,5vw,50px);height:clamp(40px,5vw,50px);border-radius:14px;
  display:grid;place-items:center;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);
}
.tipband .ti svg{width:62%;height:62%}
.tipband b{font-size:clamp(15px,1.8vw,19px);color:var(--blue-d)}
.tipband p{font-size:clamp(13.5px,1.6vw,17px);font-weight:700;color:var(--ink-soft);line-height:1.65;margin-top:2px}
.tipband p b{color:var(--ink)}

.stagebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:clamp(10px,1.8vw,14px)}
.stage{
  padding:3px 14px;border-radius:99px;border:2.5px solid rgba(51,46,78,.28);
  background:#fff;color:var(--ink-soft);font-weight:900;font-size:clamp(12.5px,1.5vw,15px);
}
.stage.on{background:var(--blue);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 rgba(51,46,78,.2)}
.stage.done{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.taphint{
  display:inline-flex;align-items:center;gap:8px;margin-top:2px;
  font-size:clamp(13.5px,1.6vw,16px);font-weight:800;color:var(--blue-d);
}
.taphint svg{width:1.15em;height:1.15em;flex:none}

.advpassage{display:flex;flex-direction:column;gap:8px}
.advpassage .sentline{
  border:2.5px solid transparent;border-radius:16px;cursor:default;
  font-size:clamp(18px,2.3vw,25px);padding:8px 10px;
}
.advpassage .sentline.pick{cursor:pointer;background:rgba(74,168,255,.06);border-color:rgba(74,168,255,.35)}
.advpassage .sentline.pick:hover{background:rgba(74,168,255,.16);border-color:var(--blue)}
.advpassage .sentline.pick:active{transform:translateY(2px)}
.advpassage .sentline.ok{background:var(--green-bg);border-color:var(--green)}
.advpassage .sentline.ok .n{background:var(--green);color:#fff;border-color:var(--green)}
.advpassage .sentline.bad{background:var(--red-bg);border-color:var(--red)}
.advpassage .sentline.bad .n{background:var(--red);color:#fff;border-color:var(--red)}
.advpassage .sentline.dimline{opacity:.58}
.optgrid.g1{grid-template-columns:1fr}
.recap{
  margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.75);border:2px dashed rgba(51,46,78,.28);
  font-size:clamp(13.5px,1.6vw,16px);font-weight:700;line-height:1.65;color:var(--ink-soft);
}
.recap b{color:var(--ink)}

.howto{display:grid;gap:clamp(10px,2vw,18px);grid-template-columns:repeat(2,1fr);margin-top:clamp(12px,2.2vw,20px)}
.how{
  display:flex;gap:12px;align-items:flex-start;padding:clamp(12px,2vw,20px);
  border:3px solid var(--ink);border-radius:var(--r-md);background:#fff;
  box-shadow:0 6px 0 rgba(51,46,78,.1);
}
.how .n{
  flex:none;width:clamp(34px,4vw,44px);height:clamp(34px,4vw,44px);border-radius:50%;
  display:grid;place-items:center;background:var(--blue);color:#fff;border:3px solid var(--ink);
  font-weight:900;font-size:clamp(15px,1.8vw,19px);
}
.how b{font-size:clamp(15px,1.9vw,20px);color:var(--blue-d)}
.how p{font-size:clamp(13px,1.55vw,16px);font-weight:600;color:var(--ink-soft);line-height:1.65;margin-top:2px}

/* ============ 模式選擇 ============ */
.mode-grid{display:grid;gap:clamp(14px,2.4vw,24px);grid-template-columns:repeat(2,1fr)}
.mode{
  position:relative;display:flex;flex-direction:column;gap:10px;
  padding:clamp(18px,2.8vw,30px);border:3px solid var(--ink);border-radius:var(--r-lg);
  background:#fff;box-shadow:var(--shadow-card);text-align:left;cursor:pointer;
  font-family:inherit;overflow:hidden;
  transition:transform .1s,box-shadow .1s;
}
.mode:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(51,46,78,.13)}
.mode .top{display:flex;align-items:center;gap:12px}
.mode .ic{
  width:clamp(54px,7vw,66px);height:clamp(54px,7vw,66px);border-radius:20px;flex:none;
  border:3px solid var(--ink);display:grid;place-items:center;background:var(--tint,var(--orange));color:#fff;
}
.mode .ic svg{width:58%;height:58%}
.mode .tt{min-width:0}
.mode .t{display:block;font-size:clamp(19px,2.5vw,27px);line-height:1.25;font-weight:900}
.mode .meta{display:block;font-size:clamp(12.5px,1.4vw,15px);font-weight:800;color:var(--ink-soft);line-height:1.5}
.mode .mdesc{display:block;font-size:clamp(14px,1.65vw,17px);color:var(--ink-soft);font-weight:600;line-height:1.6}
.mode .stars{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:6px}
.mode .stars svg{width:clamp(22px,2.6vw,28px);height:clamp(22px,2.6vw,28px)}
.mode .ribbon{
  position:absolute;right:-2px;top:16px;padding:4px 16px 4px 14px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:900;border-radius:99px 0 0 99px;
}

/* ============ 遊戲 ============ */
.gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(10px,1.8vw,16px)}
.gamebar .qcount{
  font-weight:900;font-size:clamp(14px,1.7vw,18px);
  padding:3px 14px;border-radius:99px;background:#fff;border:3px solid var(--ink);
}
.gamebar .score{
  font-weight:900;font-size:clamp(14px,1.7vw,18px);
  padding:3px 14px;border-radius:99px;background:var(--yellow);border:3px solid var(--ink);
}
.gamebar .combo{font-weight:900;font-size:clamp(13px,1.5vw,16px);color:var(--orange-d)}
.dots{display:flex;gap:6px;flex:1;min-width:120px}
.dots i{
  flex:1;height:12px;border-radius:99px;background:rgba(51,46,78,.14);
  border:2px solid rgba(51,46,78,.2);transition:background .3s;
}
.dots i.done{background:var(--teal);border-color:var(--teal-d)}
.dots i.now{background:var(--yellow);border-color:var(--ink)}

.qcard{padding:clamp(16px,2.8vw,32px)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:clamp(10px,1.8vw,16px)}
.qhead h2{flex:1 1 100%;order:3;margin-top:2px}
.qtag{
  flex:none;padding:3px 12px;border-radius:99px;border:3px solid var(--ink);
  font-size:clamp(12px,1.4vw,14px);font-weight:900;background:var(--yellow);
}
.qhead h2{font-size:clamp(19px,2.5vw,26px);line-height:1.35}
.speak{
  flex:none;white-space:nowrap;min-height:42px;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:99px;border:2.5px solid var(--ink);background:#fff;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:clamp(12.5px,1.4vw,15px);color:var(--ink);
  box-shadow:0 3px 0 rgba(51,46,78,.2);
}
.speak:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(51,46,78,.2)}
.speak svg{width:1.1em;height:1.1em}

.passage{
  position:relative;
  scroll-margin-top:96px;
  margin:clamp(10px,2vw,18px) 0;
  padding:clamp(14px,2.4vw,26px);
  border:3px dashed rgba(51,46,78,.42);border-radius:var(--r-md);
  background:#FFFDF7;
  font-size:clamp(20px,2.9vw,31px);line-height:1.95;font-weight:800;letter-spacing:.01em;
}
.passage .sentline{padding:4px 6px}
.passage .sentline .n{font-size:.6em}
.passage .k{color:var(--ink)}
.quotemark{position:absolute;left:10px;top:-6px;font-size:2.6em;font-weight:900;color:rgba(51,46,78,.1);line-height:1}

.optgrid{display:grid;gap:clamp(9px,1.6vw,14px);margin-top:clamp(10px,2vw,18px)}
.optgrid.g2{grid-template-columns:repeat(2,1fr)}
.optgrid.g4{grid-template-columns:repeat(4,1fr)}
.opt{
  position:relative;display:flex;align-items:center;gap:.55em;width:100%;
  padding:.85em .9em;border:3px solid var(--ink);border-radius:var(--r-sm);
  background:#fff;color:var(--ink);font-family:inherit;font-weight:800;
  font-size:clamp(18px,2.35vw,27px);line-height:1.35;text-align:left;cursor:pointer;
  box-shadow:0 5px 0 rgba(51,46,78,.17);
  transition:transform .08s,box-shadow .08s,background .2s,border-color .2s;
  min-height:clamp(58px,7vw,76px);
}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(51,46,78,.17)}
.opt .k{
  flex:none;width:clamp(30px,3.4vw,38px);height:clamp(30px,3.4vw,38px);
  display:grid;place-items:center;border-radius:50%;
  border:2.5px solid rgba(51,46,78,.35);background:rgba(51,46,78,.06);
  font-size:.72em;font-weight:900;line-height:1;
}
.opt .lbl{flex:1;min-width:0;overflow-wrap:break-word}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green-bg);border-color:var(--green);box-shadow:0 5px 0 var(--green)}
.opt.correct .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);box-shadow:0 5px 0 var(--red)}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.5}
.opt .mark{width:1.1em;height:1.1em;flex:none}
.optgrid.g4 .opt{justify-content:center;text-align:center;padding:.75em .3em;gap:.3em}
.optgrid.g4 .opt .lbl{white-space:nowrap}
.optgrid.g4 .opt .k{display:none}

.feedback{
  scroll-margin-top:96px;
  margin-top:clamp(14px,2.4vw,22px);padding:clamp(14px,2.2vw,24px);
  border:3px solid var(--ink);border-radius:var(--r-md);
  animation:popIn .34s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes popIn{from{opacity:.4;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.feedback.ok{background:var(--green-bg)}
.feedback.no{background:var(--red-bg)}
.feedback .fbhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.feedback .fbhead .ic{width:clamp(36px,4.4vw,44px);height:clamp(36px,4.4vw,44px);flex:none;color:var(--green)}
.feedback.no .fbhead .ic{color:var(--red)}
.feedback .fbhead .ic svg{width:100%;height:100%}
.feedback .fbhead b{font-size:clamp(19px,2.4vw,25px);line-height:1.3}
.feedback p{font-size:clamp(15.5px,1.85vw,19px);font-weight:700;line-height:1.75}
.feedback p b{color:var(--teal-d)}
.feedback .ansline{
  margin-top:8px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 14px;border-radius:99px;background:#fff;border:2.5px solid var(--ink);
  font-weight:900;font-size:clamp(14px,1.7vw,17px);
}
.feedback .ansline .dot{width:.75em;height:.75em;border-radius:50%;background:var(--green);flex:none}

/* 計時 */
.timer{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.timer .t{font-weight:900;font-size:clamp(16px,2vw,21px);min-width:4.2em}
.timer .track{
  flex:1;height:16px;border-radius:99px;background:rgba(51,46,78,.13);
  border:2.5px solid var(--ink);overflow:hidden;
}
.timer .fill{height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--yellow),var(--orange));transition:width .5s linear}
.timer.low .t{color:var(--red)}
.timer.low{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}

/* 結果 */
.result{text-align:center;padding:clamp(20px,3.4vw,40px)}
.result .mascot{width:clamp(110px,18vw,180px);margin:0 auto}
.result h2{font-size:clamp(24px,4vw,40px);margin-top:10px;line-height:1.2}
.result .bigscore{
  font-size:clamp(44px,9vw,78px);font-weight:900;line-height:1;color:var(--orange-d);
  letter-spacing:-.02em;margin:8px 0 2px;
}
.result .bigscore small{font-size:.32em;color:var(--ink-soft);font-weight:800;letter-spacing:0}
.result .starrow{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.result .starrow svg{width:clamp(40px,7vw,60px);height:clamp(40px,7vw,60px)}
.result .msg{font-size:clamp(15px,2vw,20px);font-weight:800;color:var(--ink-soft);line-height:1.7;margin-top:6px}
.kv{display:flex;justify-content:center;gap:clamp(14px,3vw,34px);flex-wrap:wrap;margin-top:clamp(14px,2.4vw,22px)}
.kv div{text-align:center}
.kv b{display:block;font-size:clamp(22px,3.4vw,32px);line-height:1.1}
.kv span{font-size:clamp(12px,1.4vw,14px);font-weight:800;color:var(--ink-soft)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  z-index:80;padding:10px 22px;border-radius:99px;border:3px solid var(--ink);
  background:var(--ink);color:#fff;font-weight:900;font-size:clamp(14px,1.7vw,17px);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.foot{
  margin-top:auto;padding:18px 0 calc(22px + env(safe-area-inset-bottom));
  text-align:center;font-size:clamp(11.5px,1.3vw,13px);color:var(--ink-soft);font-weight:600;line-height:1.7;
}

/* ============ 響應式 ============ */
@media (max-width:960px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .teach-hero{grid-template-columns:1fr;text-align:center}
  .teach-hero .pic{order:-1}
  .teach-hero .pic svg{max-width:190px}
}
@media (max-width:760px){
  .entry-grid{grid-template-columns:1fr}
  .entry{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
  .entry .ic{width:54px;height:54px;border-radius:16px}
  .entry .body{flex:1;min-width:0}
  .entry .go{padding-top:0;margin-top:0;width:100%}

  .mode-grid{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center;padding-bottom:clamp(18px,4vw,28px)}
  .hero .mascot{max-width:170px}
  .hero-copy h1{text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(255,138,61,.35)}
  .chips{justify-content:center}
  .brand span{display:none}
  .optgrid.g2{grid-template-columns:1fr}
  .seg{max-width:100%}
}
@media (max-width:430px){
  .steps{grid-template-columns:1fr}
  .passage{font-size:21px}
  .optgrid.g4{grid-template-columns:repeat(2,1fr);gap:8px}
  .optgrid.g2 .opt{min-height:62px}
  .starpill{padding:3px 10px 3px 6px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>

        '<button class="btn purple" data-go="' + (teachTab === "kw" ? "practice" : "practice") + '">' + "去練習區" + icon("i-right") + "</button>" +
      "</div>" +
    "</section>";
    main.innerHTML = html;
    return { back: true, title: "教學區" };
  }

  function strategyArt(kind) {

      '<rect x="40" y="144" width="150" height="12" rx="6" fill="#E7E2F2"/>' +
      '<path d="M204 44v30" stroke="#FF8A3D" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M190 58h26" stroke="#FF8A3D" stroke-width="7" stroke-linecap="round"/>' +
      "</svg>";
  }

  /* ================= 模式選擇 ================= */
  function renderMenu(area) {
    var keys = area === "practice" ? ["kw", "cs"] : area === "advanced" ? ["adv"] : ["sprint", "judge"];
    var cards = keys.map(function (k) {
      var m = MODES[k], st = progress.stars[k] || 0;
      var stars = "";
      for (var i = 0; i < 3; i++) stars += '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + (i < st ? "i-star" : "i-star-o") + '"></use></svg>';
      return '<button class="mode" type="button" data-go="play" data-mode="' + k + '" style="--tint:' + m.tint + '">' +
        (progress.best[k] ? '<span class="ribbon">最佳 ' + progress.best[k] + " 分</span>" : "") +
        '<span class="top"><span class="ic">' + icon(m.ic) + "</span>" +
        "<span class=\"tt\"><span class=\"t\">" + m.name + "</span><span class=\"meta\">" + m.sub + "</span></span></span>" +
        '<span class="mdesc">' + m.desc + "</span>" +
        '<span class="stars">' + stars + '<span style="font-weight:900;font-size:clamp(12px,1.4vw,14px);color:var(--ink-soft);margin-left:6px">' + (st ? st + " / 3 星" : "未挑戰") + "</span></span>" +
      "</button>";
    }).join("");

    var title = area === "practice" ? "練習區" : area === "advanced" ? "進階挑戰區" : "挑戰區";
    var lead = area === "practice"
      ? "每種模式 6 題，題目全部不同。答完會即時講解為甚麼。"
      : area === "advanced"
        ? "適合五、六年級。每題有兩關：先找中心句，再概括主旨。"
        : "兩種模式，考驗你是否真的學會。答完同樣有詳細講解。";

    var howto = area === "advanced"
      ? '<div class="howto">' +
          '<div class="how"><span class="n">1</span><div><b>找中心句</b><p>點一點段落中最能概括全段的那一句。留意段首的總起句、段中的轉折句和段末的總結句。</p></div></div>' +
          '<div class="how"><span class="n">2</span><div><b>概括主旨</b><p>從三個標題中選一個。好的標題要「不太窄、不太闊」，能包住整段話。</p></div></div>' +
        "</div>"
      : "";

    var tipband = area === "advanced"
      ? '<div class="tipband"><span class="ti">' + icon("i-bulb") + "</span><div><b>高分秘訣</b><p>好的標題要「剛剛好」：<b>不太窄</b>（只講一個例子），也<b>不太闊</b>（超出這段話的範圍）。</p></div></div>"
      : "";

    main.innerHTML = '<section class="view">' +
      '<div class="sect-head"><span class="bar" style="background:' + (area === "practice" ? "var(--teal)" : area === "advanced" ? "var(--blue)" : "var(--orange)") + '"></span>' +
        "<div><h2>" + title + "</h2><p>" + lead + "</p></div></div>" +
      tipband +
      '<div class="mode-grid' + (area === "advanced" ? " solo" : "") + '">' + cards + "</div>" +
      howto +
      '<div class="btn-row"><button class="btn ghost" data-go="home">返回首頁</button>' +
        '<button class="btn teal" data-go="teach" data-strategy="' + (area === "practice" ? "kw" : "cs") + '">' + icon("i-book") + "先看教學</button></div>" +
    "</section>";
    return { back: true, title: title };
  }

  /* ================= 遊戲 ================= */
  function startGame(mode) {
    S.mode = mode;
    S.list = (mode === "adv" ? ADV : BANK[mode === "kw" ? "kw" : mode === "cs" ? "cs" : mode === "sprint" ? "sprint" : "judge"]).slice();
    S.idx = 0; S.score = 0; S.correct = 0; S.answered = false; S.pick = -1; S.combo = 0; S.bestCombo = 0;
    S.timeLeft = 90; S.step = 1; S.answered1 = false; S.pick1 = -1;
    renderQ();
  }

  function stopTimer() { if (S.timerId) { clearInterval(S.timerId); S.timerId = null; } }
  function startTimer() {
    stopTimer();
    S.timerId = setInterval(function () {
      if (S.answered) return;
      S.timeLeft--;
      var bar = document.getElementById("timerfill"), lab = document.getElementById("timertext"), tEl = document.getElementById("timer");
      if (bar) bar.style.width = Math.max(0, S.timeLeft / 90 * 100) + "%";
      if (lab) lab.textContent = "剩 " + Math.max(0, S.timeLeft) + " 秒";
      if (tEl) tEl.classList.toggle("low", S.timeLeft <= 10);
      if (S.timeLeft <= 10 && S.timeLeft > 0) SFX.tick();
      if (S.timeLeft <= 0) { stopTimer(); SFX.timeup(); endGame(true); }
    }, 1000);
  }

  function renderQ() {
    if (S.mode === "adv") { renderAdv(); return; }
    var q = S.list[S.idx], m = MODES[S.mode], total = S.list.length;
    var dots = "";
    for (var i = 0; i < total; i++) dots += "<i class=\"" + (i < S.idx ? "done" : i === S.idx ? "now" : "") + "\"></i>";

    var body = "";
    if (q.sents) {
      body = '<div class="passage">' + q.sents.map(function (s, i) {
        return '<div class="sentline"><span class="n">' + CIRCLED[i] + "</span><span>" + s + "</span></div>";
      }).join("") + "</div>";
    } else {
      body = '<div class="passage">' + q.text + "</div>";
    }

    var claim = q.claim ? '<div class="passage" style="border-style:solid;background:#FFF3F7;border-color:rgba(201,66,111,.55)">' +
      '<div style="font-size:.62em;font-weight:900;color:var(--pink-d);letter-spacing:.08em">有人這樣說</div>' +
      "「" + q.claim + "」</div>" : "";

    var optHtml = "";
    if (q.claim) {
      optHtml = '<div class="optgrid g2">' +
        q.order.map(function (lab, i) {
          return '<button class="opt" type="button" data-ans="' + i + '"><span class="k">' + lab + '</span><span class="lbl">' + (lab === "對" ? "說得對" : "說得不對") + "</span></button>";
        }).join("") + "</div>";
    } else if (q.opts) {
      optHtml = '<div class="optgrid g2">' + q.opts.map(function (o, i) {
        return '<button class="opt" type="button" data-ans="' + i + '"><span class="k">' + LETTERS[i] + '</span><span class="lbl">' + o + "</span></button>";
      }).join("") + "</div>";
    } else {
      optHtml = '<div class="optgrid g4">' + q.sents.map(function (_, i) {
        return '<button class="opt" type="button" data-ans="' + i + '"><span class="lbl">第' + CIRCLED[i] + "句</span></button>";
      }).join("") + "</div>";
    }

    var timerHtml = S.mode === "sprint"
      ? '<div class="timer" id="timer"><span class="t" id="timertext">剩 90 秒</span><span class="track"><span class="fill" id="timerfill" style="width:100%"></span></span></div>'
      : "";

    var readText = q.sents ? q.sents.join("") : q.text;

    main.innerHTML = '<section class="view">' +
      '<div class="gamebar">' +
        '<span class="qcount">第 ' + (S.idx + 1) + " / " + total + " 題</span>" +
        '<span class="dots">' + dots + "</span>" +
        '<span class="score" id="scorebox">' + S.score + " 分</span>" +
      "</div>" +
      timerHtml +
      '<div class="qcard card">' +
        '<div class="qhead"><span class="qtag" style="background:' + m.tint + ';color:#fff">' + m.tag + "</span>" +
          '<button class="speak" type="button" id="btn-speak" style="margin-left:auto">' + icon("i-sound") + "朗讀</button>" +
          "<h2>" + q.q + "</h2>" +
        "</div>" +
        body + claim + optHtml +
        '<div id="fb"></div>' +
      "</div>" +
    "</section>";

    S.answered = false; S.pick = -1;
    main.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () { answer(+b.getAttribute("data-ans")); });
    });
    var sp = document.getElementById("btn-speak");
    if (sp) sp.addEventListener("click", function () { speak(readText); });
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (S.mode === "sprint" && !S.timerId) startTimer();
    SFX.flip();
  }


  /* ================= 進階：雙重任務 ================= */
  function renderAdv() {
    var q = S.list[S.idx], total = S.list.length, step = S.step || 1;
    var dots = "";
    for (var i = 0; i < total; i++) dots += "<i class=\"" + (i < S.idx ? "done" : i === S.idx ? "now" : "") + "\"></i>";

    var sents = q.sents.map(function (s, i) {
      var cls = "sentline" + (step === 1 && !S.answered1 ? " pick" : "");
      if (S.answered1) {
        if (i === q.ans1) cls += " ok";
        else if (i === S.pick1) cls += " bad";
        else cls += " dimline";
      } else if (step === 2) {
        cls += i === q.ans1 ? " ok" : " dimline";
      }
      return '<div class="' + cls + '" role="button" tabindex="0" aria-label="第' + CIRCLED[i] + '句：' + s.replace(/"/g, "&quot;") + '" data-sent="' + i + '"><span class="n">' + CIRCLED[i] + "</span><span>" + s + "</span></div>";
    }).join("");

    var stagebar = '<div class="stagebar">' +
      '<span class="stage ' + (step === 1 && !S.answered1 ? "on" : "done") + '">第 1 關・找中心句</span>' +
      '<span class="stage ' + (step === 2 ? "on" : "") + '">第 2 關・概括主旨</span>' +
    "</div>";

    var head = step === 1 ? q.q1 : q.q2;
    var hint = step === 1 && !S.answered1
      ? '<p class="taphint">' + icon("i-target") + "直接點一點段落裏的句子作答</p>" : "";

    var optHtml = "";
    if (step === 2) {
      optHtml = '<div class="optgrid g1">' + q.opts.map(function (o, i) {
        return '<button class="opt" type="button" data-ans="' + i + '"><span class="k">' + LETTERS[i] + '</span><span class="lbl">' + o + "</span></button>";
      }).join("") + "</div>";
    }

    main.innerHTML = '<section class="view">' +
      '<div class="gamebar">' +
        '<span class="qcount">第 ' + (S.idx + 1) + " / " + total + " 題</span>" +
        '<span class="dots">' + dots + "</span>" +
        '<span class="score" id="scorebox">' + S.score + " 分</span>" +
      "</div>" +
      stagebar +
      '<div class="qcard card">' +
        '<div class="qhead"><span class="qtag" style="background:' + MODES.adv.tint + ';color:#fff">' + (step === 1 ? "第 1 關" : "第 2 關") + "</span>" +
          '<button class="speak" type="button" id="btn-speak" style="margin-left:auto">' + icon("i-sound") + "朗讀</button>" +
          "<h2>" + head + "</h2>" +
        "</div>" +
        '<div class="passage advpassage">' + sents + "</div>" +
        hint + optHtml +
        '<div id="fb"></div>' +
      "</div>" +
    "</section>";

    if (step === 1 && !S.answered1) {
      main.querySelectorAll(".sentline.pick").forEach(function (el) {
        el.addEventListener("click", function () { answerAdv1(+el.getAttribute("data-sent")); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
        });
      });
    }
    if (step === 2) {
      main.querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () { answerAdv2(+b.getAttribute("data-ans")); });
      });
    }
    var sp = document.getElementById("btn-speak");
    if (sp) sp.addEventListener("click", function () { speak(q.sents.join("")); });
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (step === 2) {
      setTimeout(function () {
        var g = main.querySelector(".optgrid");
        if (g) g.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 260);
    }
    SFX.flip();
  }

  function answerAdv1(i) {
    if (S.answered1) return;
    var q = S.list[S.idx];
    S.answered1 = true; S.pick1 = i;
    var ok = i === q.ans1;
    if (ok) { S.correct++; S.score += 10; SFX.correct(); burst(16); }
    else { SFX.wrong(); }
    var sb = document.getElementById("scorebox");
    if (sb) sb.textContent = S.score + " 分";

    main.querySelectorAll(".sentline").forEach(function (el) {
      var v = +el.getAttribute("data-sent");
      el.classList.remove("pick");
      el.removeAttribute("role"); el.removeAttribute("tabindex"); el.removeAttribute("aria-label");
      if (v === q.ans1) el.classList.add("ok");
      else if (v === i) el.classList.add("bad");
      else el.classList.add("dimline");
    });
    var hintEl = main.querySelector(".taphint");
    if (hintEl) hintEl.parentNode.removeChild(hintEl);

    document.getElementById("fb").innerHTML = '<div class="feedback ' + (ok ? "ok" : "no") + '" role="status">' +
      '<div class="fbhead"><span class="ic">' + icon(ok ? "i-check" : "i-cross") + "</span>" +
      "<b>" + (ok ? "找對了！" : "差一點，再看一次") + "</b></div>" +
      "<p>" + q.why1 + "</p>" +
      '<span class="ansline"><span class="dot"></span>中心句：第 ' + CIRCLED[q.ans1] + " 句</span>" +
      '<div class="btn-row" style="justify-content:flex-start;margin-top:16px">' +
        '<button class="btn blue" type="button" id="btn-stage2">進入第 2 關' + icon("i-right") + "</button>" +
      "</div>" +
    "</div>";
    document.getElementById("btn-stage2").addEventListener("click", function () {
      SFX.flip(); S.step = 2; renderAdv();
    });
  }

  function answerAdv2(i) {
    if (S.answered) return;
    var q = S.list[S.idx], ok = i === q.ans2;
    S.answered = true; S.pick = i;
    if (ok) { S.correct++; S.score += 10; SFX.correct(); burst(18); }
    else { SFX.wrong(); }
    var sb = document.getElementById("scorebox");
    if (sb) sb.textContent = S.score + " 分";

    main.querySelectorAll(".opt").forEach(function (b) {
      var v = +b.getAttribute("data-ans");
      b.disabled = true;
      if (v === q.ans2) b.classList.add("correct");
      else if (v === i) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    document.getElementById("fb").innerHTML = '<div class="feedback ' + (ok ? "ok" : "no") + '" role="status">' +
      '<div class="fbhead"><span class="ic">' + icon(ok ? "i-check" : "i-cross") + "</span>" +
      "<b>" + (ok ? "兩關都答對了！" : "第 2 關再想一想") + "</b></div>" +
      "<p>" + q.why2 + "</p>" +
      '<div class="recap"><b>第 1 關回顧：</b>' + q.why1 + "</div>" +
      '<span class="ansline"><span class="dot"></span>中心句：第 ' + CIRCLED[q.ans1] + " 句　·　主旨：" + LETTERS[q.ans2] + "</span>" +
      '<div class="btn-row" style="justify-content:flex-start;margin-top:16px">' +
        '<button class="btn ' + (ok ? "blue" : "orange") + '" type="button" id="btn-next">' +
          (S.idx + 1 < S.list.length ? "下一題" : "看成績") + icon("i-right") +
        "</button>" +
      "</div>" +
    "</div>";
    document.getElementById("btn-next").addEventListener("click", nextQ);
    setTimeout(function () {
      var el = document.getElementById("fb");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 120);
  }

  function answer(i) {
    if (S.answered) return;
    var q = S.list[S.idx];
    var ok = i === q.ans;
    S.answered = true; S.pick = i;
    var opts = main.querySelectorAll(".opt");
    opts.forEach(function (b) {
      var v = +b.getAttribute("data-ans");
      b.disabled = true;
      if (v === q.ans) { b.classList.add("correct"); }
      else if (v === i) { b.classList.add("wrong"); }
      else { b.classList.add("dim"); }
    });

    if (ok) {
      S.correct++;
      S.combo++;
      S.bestCombo = Math.max(S.bestCombo, S.combo);
      var gain = 10 + (S.mode === "sprint" ? Math.min(10, (S.combo - 1) * 2) : 0);
      S.score += gain;
      SFX.correct();
      burst(18);
    } else {
      S.combo = 0;
      SFX.wrong();
    }
    var sb = document.getElementById("scorebox");
    if (sb) sb.textContent = S.score + " 分";

    var correctLabel = q.claim ? (q.order[q.ans] === "對" ? "說得對" : "說得不對")
      : q.opts ? q.opts[q.ans] : "第" + CIRCLED[q.ans] + "句";

    var fb = document.getElementById("fb");
    fb.innerHTML = '<div class="feedback ' + (ok ? "ok" : "no") + '" role="status">' +
      '<div class="fbhead"><span class="ic">' + icon(ok ? "i-check" : "i-cross") + "</span>" +
      "<b>" + (ok ? "答對了！" : "再想一想") + "</b>" +
      (ok && S.mode === "sprint" && S.combo > 1 ? '<span class="combo">連答 ' + S.combo + " 題！</span>" : "") +
      "</div>" +
      "<p>" + q.why + "</p>" +
      '<span class="ansline"><span class="dot"></span>正確答案：' + correctLabel + "</span>" +
      '<div class="btn-row" style="justify-content:flex-start;margin-top:16px">' +
        '<button class="btn ' + (ok ? "teal" : "orange") + '" type="button" id="btn-next">' +
          (S.idx + 1 < S.list.length ? "下一題" : "看成績") + icon("i-right") +
        "</button>" +
      "</div>" +
    "</div>";
    document.getElementById("btn-next").addEventListener("click", nextQ);
    setTimeout(function () {
      var el = document.getElementById("fb");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 120);
  }

  function nextQ() {
    S.idx++;
    S.step = 1; S.answered1 = false; S.pick1 = -1; S.answered = false; S.pick = -1;
    if (S.idx >= S.list.length) { endGame(false); return; }
    renderQ();
  }

  function endGame(timeout) {
    stopTimer();
    var total = S.mode === "adv" ? S.list.length * 2 : S.list.length;
    var ratio = S.correct / total;
    var stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.5 ? 1 : 0;
    var mode = S.mode;
    if (stars > (progress.stars[mode] || 0)) progress.stars[mode] = stars;
    if (S.score > (progress.best[mode] || 0)) progress.best[mode] = S.score;
    save(); refreshStars();
    if (stars >= 2) { SFX.win(); burst(110); }
    else if (stars === 1) { SFX.flip(); burst(30); }

    var msg = stars === 3 ? "太厲害了！你已經是小偵探隊長，可以教其他同學了。"
      : stars === 2 ? "做得好！再練一次，就可以拿到三顆星。"
      : stars === 1 ? "有進步！記住口訣，再看一次教學區會更清楚。"
      : "別灰心，先到教學區看一次示範，再回來挑戰。";

    var head = timeout ? "時間到！" : stars === 3 ? "全部過關！" : "完成挑戰！";
    var starRow = "";
    for (var i = 0; i < 3; i++) starRow += '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + (i < stars ? "i-star" : "i-star-o") + '"></use></svg>';

    main.innerHTML = '<section class="view">' +
      '<div class="result card">' +
        '<svg class="mascot" viewBox="0 0 200 210" aria-hidden="true"><use href="#mascot"></use></svg>' +
        "<h2>" + head + "</h2>" +
        '<div class="starrow">' + starRow + "</div>" +
        '<div class="bigscore">' + S.score + "<small> 分</small></div>" +
        '<p class="msg">' + msg + "</p>" +
        '<div class="kv">' +
          "<div><b>" + S.correct + " / " + total + "</b><span>" + (S.mode === "adv" ? "答對關卡" : "答對題數") + "</span></div>" +
          "<div><b>" + Math.round(ratio * 100) + "%</b><span>正確率</span></div>" +
          (S.mode === "adv"
            ? "<div><b>" + S.list.length + "</b><span>完成題目</span></div>"
            : "<div><b>" + S.bestCombo + "</b><span>最長連答</span></div>") +
        "</div>" +
        '<div class="btn-row">' +
          '<button class="btn ' + (stars >= 2 ? "teal" : "orange") + '" type="button" id="again">' + icon("i-play") + "再玩一次</button>" +
          '<button class="btn ghost" type="button" data-go="' + (MODES[mode].area) + '">返回選單</button>' +
          '<button class="btn purple" type="button" data-go="home">返回首頁</button>' +
        "</div>" +
      "</div>" +
    "</section>";
    document.getElementById("again").addEventListener("click", function () { SFX.tap(); startGame(mode); });
    window.scrollTo({ top: 0, behavior: "smooth" });
    return { back: true, title: "成績" };
  }

  /* ================= 路由 ================= */
  var backTarget = { teach: "home", practice: "home", challenge: "home", advanced: "home", play: null };
  var current = "home";

  function go(view, opt) {
    opt = opt || {};
    stopTimer();
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}
    if (view !== "play" && view !== "home" && view !== "teach") { if (S.mode) backTarget.play = MODES[S.mode].area; }
    current = view;
    var info;
    if (view === "home") info = renderHome();
    else if (view === "teach") { if (opt.strategy) teachTab = opt.strategy; info = renderTeach(); }
    else if (view === "practice") info = renderMenu("practice");
    else if (view === "challenge") info = renderMenu("challenge");
    else if (view === "advanced") info = renderMenu("advanced");
    else if (view === "play") { info = { back: true, title: MODES[opt.mode].name }; startGame(opt.mode); }
    else info = renderHome();

    btnHome.style.display = info && info.back ? "grid" : "none";
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function goBack() {
    if (current === "play") { go(MODES[S.mode].area); return; }
    if (current === "teach" || current === "practice" || current === "challenge" || current === "advanced") { go("home"); return; }
    go("home");
  }

  /* ================= 事件 ================= */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go]");
    if (el) {
      SFX.tap();
      var v = el.getAttribute("data-go");
      var o = {};
      if (el.getAttribute("data-mode")) o.mode = el.getAttribute("data-mode");
      if (el.getAttribute("data-strategy")) o.strategy = el.getAttribute("data-strategy");
      go(v, o);
      return;
    }
    var tab = e.target.closest("[data-tab]");
    if (tab) { SFX.tap(); teachTab = tab.getAttribute("data-tab"); renderTeach(); btnHome.style.display = "grid"; }
  });

  btnHome.addEventListener("click", function () { SFX.tap(); goBack(); });
  btnSound.addEventListener("click", function () {
    muted = !muted;
    progress.sound = !muted; save();
    refreshStars();
    if (!muted) { ctxAudio(); SFX.tap(); toast("音效已開啟"); }
    else { try { window.speechSynthesis.cancel(); } catch (e) {} toast("音效已關閉"); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { goBack(); }
    if (current === "play" && S.mode === "adv" && S.step === 1 && !S.answered1 && /^[1-5]$/.test(e.key)) {
      var sl = main.querySelector('.sentline[data-sent="' + (+e.key - 1) + '"]');
      if (sl) sl.click();
    }
    if (current === "play" && S.mode === "adv" && S.step === 1 && S.answered1 && (e.key === "Enter" || e.key === " ")) {
      var s2 = document.getElementById("btn-stage2");
      if (s2) { e.preventDefault(); s2.click(); }
    }
    if (current === "play" && !S.answered && /^[1-4]$/.test(e.key)) {
      var b = main.querySelector('.opt[data-ans="' + (+e.key - 1) + '"]');
      if (b) b.click();
    }
    if (current === "play" && S.answered && (e.key === "Enter" || e.key === " ")) {
      var n = document.getElementById("btn-next");
      if (n) { e.preventDefault(); n.click(); }
    }
  });

  // 首次互動解鎖音訊
  ["pointerdown", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, function once() { ctxAudio(); document.removeEventListener(ev, once); }, { once: true });
  });

  /* ================= 啟動 ================= */
  refreshStars();
  go("home");
})();

</script>
</body>
</html>
