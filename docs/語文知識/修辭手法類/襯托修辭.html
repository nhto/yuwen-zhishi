<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>襯托小教室 V3｜正襯與反襯互動練習</title>
<meta name="description" content="用卡通圖解學會正襯與反襯，三種互動遊戲、初階與高階共 36 題，適合國小國語課堂與自學。">
<style>
:root{
  --ink:#33302B;
  --ink-soft:#6F685E;
  --paper:#FFFFFF;
  --cream:#FFFBF2;
  --yellow:#FFD24C;
  --orange:#FF9A3C;
  --blue:#7EC8E8;
  --blue-soft:#E4F4FB;
  --green:#9BD97A;
  --green-soft:#EAF8E2;
  --green-deep:#3F8B32;
  --pink:#FFB7B2;
  --red:#EA5F51;
  --red-soft:#FDEAE7;
  --purple:#C3B2EC;
  --purple-soft:#F1ECFC;
  --radius:26px;
  --shadow:0 6px 0 rgba(51,48,43,.15);
  --fs-body:clamp(17px,1.7vw,20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC','Heiti TC','Yuanti TC',sans-serif;
  font-size:var(--fs-body);
  line-height:1.65;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 4%, rgba(255,210,76,.42), transparent 38%),
    radial-gradient(circle at 92% 8%, rgba(126,200,232,.34), transparent 36%),
    radial-gradient(circle at 50% 104%, rgba(155,217,122,.30), transparent 42%),
    var(--cream);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(51,48,43,.075) 2px, transparent 2px);
  background-size:26px 26px;
  opacity:.6;
}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
svg{display:block}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:10px 16px 56px}

/* ---------- 頂欄 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:10px 4px 12px;
  background:linear-gradient(180deg, rgba(255,251,242,.96) 70%, rgba(255,251,242,0));
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(17px,2vw,22px);letter-spacing:.02em}
.brand-dot{width:16px;height:16px;border-radius:50%;background:var(--orange);border:3px solid var(--ink);flex:none}
.icon-btn{
  width:56px;height:56px;flex:none;display:grid;place-items:center;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 rgba(51,48,43,.16);cursor:pointer;transition:transform .12s, box-shadow .12s;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,48,43,.16)}
.icon-btn svg{width:28px;height:28px}
.spacer{flex:1}

/* ---------- 通用元件 ---------- */
.screen{display:none}
.screen.on{display:block;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.86;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{
  background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:60px;padding:0 26px;
  font-size:clamp(17px,1.9vw,21px);font-weight:900;
  background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 5px 0 rgba(51,48,43,.18);cursor:pointer;
  transition:transform .12s, box-shadow .12s, background .15s;
}
.btn svg{width:24px;height:24px;flex:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(51,48,43,.18)}
.btn.primary{background:var(--yellow)}
.btn.orange{background:var(--orange)}
.btn.green{background:var(--green)}
.btn.ghost{background:#fff}
.btn.small{min-height:48px;padding:0 18px;font-size:clamp(15px,1.6vw,17px)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.opt:focus-visible,.mode-card:focus-visible,.basket:focus-visible,.dot:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- 首頁 ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:14px;align-items:center;padding:14px 6px 6px}
@media(min-width:760px){.hero{grid-template-columns:290px 1fr;gap:28px}}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:clamp(168px,32vw,252px);height:auto;filter:drop-shadow(0 10px 0 rgba(51,48,43,.10))}
.hero h1{margin:0 0 6px;font-size:clamp(34px,6vw,56px);line-height:1.18;letter-spacing:.02em;font-weight:900}
.hero h1 .hl{background:linear-gradient(180deg,transparent 62%,var(--yellow) 62%,var(--yellow) 94%,transparent 94%)}
.hero .sub{margin:0 0 18px;color:var(--ink-soft);font-size:clamp(16px,1.9vw,21px);font-weight:700}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;
  padding:6px 16px;border:3px solid var(--ink);border-radius:999px;
  background:var(--blue-soft);font-size:clamp(13px,1.4vw,15px);font-weight:900;letter-spacing:.08em;
}
.eyebrow svg{width:18px;height:18px;flex:none}

.star-panel{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 22px;margin:10px 0 18px}
.star-panel .sp-num{font-size:clamp(24px,3.4vw,34px);font-weight:900;line-height:1.1}
.star-panel .sp-label{font-size:clamp(14px,1.5vw,16px);font-weight:800;color:var(--ink-soft)}
.progress{flex:1;min-width:170px;height:22px;border:3px solid var(--ink);border-radius:999px;background:#F1EADA;overflow:hidden}
.progress i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow),var(--yellow) 12px,#FFC02E 12px,#FFC02E 24px);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.section-title{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:clamp(20px,2.4vw,26px);font-weight:900}
.section-title .bar{width:10px;height:30px;border-radius:6px;background:var(--orange);border:3px solid var(--ink);flex:none}

.level-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.level-btn{
  padding:14px 16px;border:3px solid var(--ink);border-radius:20px;background:#fff;
  box-shadow:0 5px 0 rgba(51,48,43,.15);cursor:pointer;text-align:left;transition:transform .12s, box-shadow .12s;
}
.level-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,48,43,.15)}
.level-btn b{display:block;font-size:clamp(18px,2.1vw,22px);font-weight:900}
.level-btn span{display:block;font-size:clamp(13px,1.4vw,15px);font-weight:700;color:var(--ink-soft)}
.level-btn.on{background:var(--yellow)}
.level-btn.on span{color:#5A4A1E}

.mode-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.mode-grid{grid-template-columns:repeat(3,1fr)}}
.mode-card{
  display:flex;flex-direction:column;gap:8px;text-align:left;padding:20px;
  background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s, box-shadow .15s;
}
@media(hover:hover){
  .mode-card:hover{transform:translateY(-4px);box-shadow:0 10px 0 rgba(51,48,43,.14)}
}
.mode-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(51,48,43,.15)}
.mode-top{display:flex;align-items:center;gap:12px}
.mode-icon{width:58px;height:58px;flex:none;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px}
.mode-icon svg{width:32px;height:32px}
.mode-name{font-size:clamp(19px,2.2vw,23px);font-weight:900;line-height:1.25}
.mode-desc{display:block;font-size:clamp(15px,1.6vw,17px);color:var(--ink-soft);font-weight:600;line-height:1.6}
.mode-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  border:2.5px solid var(--ink);font-size:clamp(13px,1.4vw,15px);font-weight:900;background:#F6F1E5;
}
.badge svg{width:15px;height:15px;flex:none}
.go-arrow{font-size:24px;font-weight:900;line-height:1}
.teach-entry{margin-top:18px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--green-soft)}
.teach-entry .te{display:flex;align-items:center;gap:12px}
.teach-entry b{font-size:clamp(17px,2vw,21px);font-weight:900;display:block}
.teach-entry small{color:var(--ink-soft);font-weight:700;font-size:14px}

/* ---------- 教學 ---------- */
.teach-wrap{display:grid;grid-template-columns:1fr;gap:16px;padding:18px}
@media(min-width:800px){.teach-wrap{grid-template-columns:290px 1fr;gap:28px;align-items:center}}
.teach-art{display:flex;justify-content:center;align-items:center;background:var(--blue-soft);border:3px solid var(--ink);border-radius:22px;padding:12px}
.teach-art svg{width:100%;max-width:270px;height:auto}
.teach-step{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px}
.teach-title{margin:0 0 10px;font-size:clamp(24px,3.4vw,34px);line-height:1.28;font-weight:900}
.teach-line{margin:0 0 8px;font-size:clamp(17px,2vw,21px);font-weight:700;line-height:1.7}
.sentence-box{margin-top:12px;padding:12px 16px;border:3px dashed var(--ink);border-radius:18px;background:#FFFDF6}
.sb-label{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.1em;background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.sentence-box p{margin:0;font-size:clamp(17px,2vw,21px);font-weight:800;line-height:1.65}
.tip-box{margin-top:10px;padding:11px 15px;border-radius:16px;background:var(--green-soft);border:3px solid var(--ink);font-weight:800;font-size:clamp(15px,1.8vw,18px)}
.dots{display:flex;justify-content:center;gap:2px;margin:8px 0}
.dot{width:44px;height:44px;padding:0;border:0;background:transparent;position:relative;cursor:pointer}
.dot::after{content:'';position:absolute;left:15px;top:15px;width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:#fff}
.dot.on::after{background:var(--orange);transform:scale(1.15)}
.teach-nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:2px}

/* ---------- 遊戲 ---------- */
.game-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.qcount{font-size:clamp(15px,1.7vw,18px);font-weight:900;color:var(--ink-soft)}
.pips{display:flex;gap:7px}
.pip{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.pip.done{background:var(--green)}
.pip.now{background:var(--yellow);transform:scale(1.2)}
.board{padding:clamp(18px,2.6vw,30px)}
.target-tag{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 16px;
  background:var(--purple-soft);border:3px solid var(--ink);border-radius:999px;
  font-weight:900;font-size:clamp(16px,1.9vw,20px);line-height:1.5;
}
.target-tag svg{width:20px;height:20px;flex:none}
.sentence{margin:0 0 12px;font-size:clamp(21px,3vw,30px);line-height:1.7;font-weight:800;letter-spacing:.01em}
.ask{
  margin:0 0 16px;padding-top:12px;border-top:3px dashed rgba(51,48,43,.25);
  font-size:clamp(17px,2vw,21px);font-weight:900;color:#8A4B12;
}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 16px;min-height:66px;
  background:#fff;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 5px 0 rgba(51,48,43,.14);cursor:pointer;
  font-size:clamp(17px,2.1vw,22px);font-weight:800;line-height:1.55;
  transition:transform .12s, box-shadow .12s, background .18s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,48,43,.14)}
.opt .k{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border:3px solid var(--ink);border-radius:14px;background:#F6F1E5;font-weight:900;font-size:19px;
}
.opt.ok{background:var(--green-soft);border-color:var(--green-deep)}
.opt.ok .k{background:var(--green);border-color:var(--green-deep)}
.opt.bad{background:var(--red-soft);border-color:var(--red)}
.opt.bad .k{background:var(--pink);border-color:var(--red)}
.opt:disabled{cursor:default}
.opt .mark{margin-left:auto;flex:none}
.opt .mark svg{width:26px;height:26px}

.feedback{margin-top:16px;padding:16px 18px;border-radius:22px;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(51,48,43,.13)}
.feedback.ok{background:var(--green-soft)}
.feedback.bad{background:var(--red-soft)}
.fb-head{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.4vw,24px);font-weight:900;margin-bottom:6px}
.fb-head svg{width:28px;height:28px;flex:none}
.fb-exp{margin:0 0 14px;font-size:clamp(16px,1.9vw,20px);font-weight:700;line-height:1.75}
.fb-right{margin:0 0 10px;font-size:clamp(16px,1.9vw,20px);font-weight:900}
.fb-right b{background:rgba(255,210,76,.65);padding:1px 6px;border-radius:6px}

/* ---------- 分類模式 ---------- */
.sort-hint{font-size:clamp(16px,1.9vw,20px);font-weight:800;margin:0 0 14px;color:#7A4A12;line-height:1.6}
.pool{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:700px){.pool{grid-template-columns:1fr 1fr}}
.pool-label{font-size:14px;font-weight:900;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:8px}
.pcard{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;min-height:64px;background:#fff;border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 rgba(51,48,43,.13);cursor:pointer;font-size:clamp(16px,1.9vw,19px);font-weight:800;line-height:1.6;
  transition:transform .12s, box-shadow .12s, background .18s;
}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,48,43,.13)}
.pcard.sel{background:var(--yellow);outline:4px solid var(--ink);outline-offset:2px}
.pcard .idx{width:34px;height:34px;flex:none;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:10px;background:#F6F1E5;font-size:15px;font-weight:900}
.pcard.sel .idx{background:#fff}
.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:18px}
@media(max-width:600px){
  .baskets{grid-template-columns:repeat(2,1fr);gap:10px}
  .baskets.three .basket:last-child{grid-column:1/-1;min-height:104px}
  .basket{min-height:112px;padding:12px}
}
.basket{
  display:flex;flex-direction:column;gap:6px;min-height:148px;padding:14px;
  background:#fff;border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 5px 0 rgba(51,48,43,.14);cursor:pointer;text-align:left;
  transition:transform .12s, background .18s, box-shadow .12s;
}
.basket:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(51,48,43,.14)}
.basket.c-pos{background:var(--green-soft)}
.basket.c-neg{background:var(--blue-soft)}
.basket.c-none{background:var(--purple-soft)}
.basket.armed{outline:5px solid var(--yellow);outline-offset:2px;transform:translateY(-3px)}
.basket-title{display:flex;align-items:center;gap:8px;font-size:clamp(18px,2.1vw,22px);font-weight:900;line-height:1.4}
.basket-title svg{width:22px;height:22px;flex:none}
.basket-sub{font-size:clamp(13px,1.4vw,15px);font-weight:800;color:var(--ink-soft)}
.basket-count{font-size:13px;font-weight:900;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.chip{
  display:inline-block;padding:5px 9px;border-radius:10px;border:2.5px solid var(--ink);
  background:#fff;color:var(--ink);
  font-size:clamp(12px,1.35vw,14px);font-weight:800;line-height:1.35;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
}
.sort-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sort-note{font-size:14px;font-weight:800;color:var(--ink-soft);margin:10px 0 0}

/* ---------- 結算 ---------- */
.result-card{padding:clamp(20px,3vw,32px);text-align:center;margin-bottom:16px}
.stars-big{display:flex;justify-content:center;gap:14px;margin:6px 0 8px}
.stars-big svg{width:clamp(52px,9vw,76px);height:auto;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.stars-big svg:nth-child(2){animation-delay:.1s}
.stars-big svg:nth-child(3){animation-delay:.2s}
@keyframes pop{from{transform:scale(.86);opacity:.9}to{transform:scale(1);opacity:1}}
.score{font-size:clamp(26px,4vw,38px);font-weight:900;margin:2px 0 4px}
.score small{font-size:.55em;font-weight:800;color:var(--ink-soft)}
.verdict{font-size:clamp(16px,1.9vw,20px);font-weight:800;color:var(--ink-soft);margin:0}
.newrec{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 16px;border-radius:999px;border:3px solid var(--ink);background:var(--yellow);font-weight:900;font-size:15px}
.newrec svg{width:18px;height:18px;flex:none}
.review-title{display:flex;align-items:center;gap:10px;margin:10px 0 12px;font-size:clamp(19px,2.3vw,24px);font-weight:900}
.review-title .bar{width:10px;height:26px;border-radius:6px;background:var(--orange);border:3px solid var(--ink);flex:none}
.rv-item{padding:15px 17px;margin-bottom:12px}
.rv-q{font-size:clamp(16px,1.9vw,19px);font-weight:800;line-height:1.65;margin-bottom:6px}
.rv-ask{margin:0 0 8px;font-size:clamp(14px,1.6vw,16px);font-weight:900;color:#8A4B12}
.rv-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;border:2.5px solid var(--ink);font-size:clamp(13px,1.4vw,15px);font-weight:900;max-width:100%}
.tag.ok{background:var(--green-soft)}
.tag.bad{background:var(--red-soft)}
.tag.info{background:#F6F1E5}
.rv-exp{margin:0;font-size:clamp(15px,1.7vw,17px);font-weight:700;color:var(--ink-soft);line-height:1.7}
.result-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0 8px}

.footer-note{text-align:center;color:var(--ink-soft);font-size:13px;font-weight:700;margin-top:24px}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div id="app" data-generated-by="aurora-frontend-design">

/* ============ 音效 ============ */
function audioCtx(){
  if(!ac){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ac = new AC();
    }catch(e){ ac = null; }
  }
  if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function beep(freq, dur, type, vol, delay){
  if(!state.sound) return;
  var c = audioCtx();
  if(!c) return;
  var o = c.createOscillator();
  var g = c.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  var t = c.currentTime + (delay || 0);
  var v = (vol == null ? 0.1 : vol);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}

/* ============ 儲存 ============ */
var STORE_KEY = 'chentuo_v3_store';
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && typeof d === 'object'){
      if(d.best && typeof d.best === 'object'){
        var clean = {};
        Object.keys(d.best).forEach(function(k){
          var n = Number(d.best[k]);
          if(isFinite(n)) clean[k] = Math.max(0, Math.min(6, Math.round(n)));
        });
        state.best = clean;
      }
      if(typeof d.sound === 'boolean') state.sound = d.sound;
    }
  }catch(e){}
}
function saveStore(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ best: state.best, sound: state.sound }));
  }catch(e){}
}
/* 每關最多 3 星；首頁累計上限 18 星，與結算頁同一口徑 */
function starsOf(n){
  n = Number(n) || 0;
  return n >= 6 ? 3 : (n >= 4 ? 2 : (n >= 2 ? 1 : 0));
}
function totalStars(){
  var sum = 0;
  ['basic','adv'].forEach(function(lv){
    [1,2,3].forEach(function(m){
      sum += starsOf(state.best[lv + '-' + m] || 0);
    });
  });
  return sum;   /* 0 - 18 */
}

/* ============ 工具 ============ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortText(s, n){
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function currentList(){
  if(state.mode === 1) return DATA[state.level].m1;
  if(state.mode === 3) return DATA[state.level].m3;
  return DATA[state.level].m2;
}
function cats(){
  if(state.level === 'basic'){
    return [ {id:'pos', label:'正襯', hint:'同類相比', cls:'c-pos'}, {id:'neg', label:'反襯', hint:'相反相比', cls:'c-neg'} ];
  }
  return [ {id:'pos', label:'正襯', hint:'同類相比', cls:'c-pos'}, {id:'neg', label:'反襯', hint:'相反相比', cls:'c-neg'}, {id:'none', label:'不是襯托', hint:'只是並列', cls:'c-none'} ];
}
function speak(text){
  if(!CAN_SPEAK || !text) return false;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = 0.92;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
function stopSpeak(){
  if(!CAN_SPEAK) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
}

/* ============ 畫面切換 ============ */
function show(name){
  state.screen = name;
  stopSpeak();
  var screens = document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('on');
  document.getElementById('screen-' + name).classList.add('on');
  document.getElementById('backBtn').hidden = (name === 'home');
  document.getElementById('crumb').textContent = name === 'home' ? '襯托小教室' : (name === 'teach' ? '教學小教室' : (name === 'result' ? '本次成績' : MODE_INFO[state.mode].name));
  document.getElementById('soundBtn').innerHTML = icon(state.sound ? 'sound' : 'mute');
  document.getElementById('soundBtn').setAttribute('aria-label', state.sound ? '關閉音效' : '開啟音效');
  window.scrollTo(0, 0);
}

/* ============ 開始遊戲 ============ */
function startGame(mode){
  state.mode = mode;
  state.idx = 0;
  state.correct = 0;
  state.picked = null;
  state.answered = false;
  state.review = [];
  state.selected = null;
  state.placed = {};
  if(mode === 2){
    var cards = DATA[state.level].m2;
    var idxs = [];
    for(var i=0;i<cards.length;i++) idxs.push(i);
    state.order = shuffle(idxs);
  } else {
    state.order = [];
  }
  SFX.click();
  renderGame();
}

function renderGame(){
  if(state.mode === 2) renderSort();
  else renderChoice();
  show('game');
}

function pipHtml(total, idx){
  var out = '';
  for(var i=0;i<total;i++){
    var cls = i < idx ? 'done' : (i === idx ? 'now' : '');
    out += '<span class="pip ' + cls + '"></span>';
  }
  return out;
}

/* --- 模式一 / 三 --- */
function renderChoice(){
  var list = currentList();
  var q = list[state.idx];
  var letters = ['A','B','C'];

  var headHtml = '';
  if(state.mode === 3){
    headHtml = '<div class="target-tag">' + icon('target') + esc(q.target) + '</div>';
    headHtml += '<p class="ask">下面哪一句最能襯托它？</p>';
  } else {
    headHtml = '<p class="sentence">' + esc(q.text) + '</p>';
    headHtml += '<p class="ask">' + esc(q.ask) + '</p>';
  }

  var optsHtml = q.opts.map(function(o, i){
    var cls = 'opt';
    var mark = '';
    if(state.answered){
      if(i === q.ans){ cls += ' ok'; mark = '<span class="mark">' + icon('check') + '</span>'; }
      else if(i === state.picked){ cls += ' bad'; mark = '<span class="mark">' + icon('x') + '</span>'; }
    }
    return '<button class="' + cls + '" data-act="answer" data-i="' + i + '" ' + (state.answered ? 'disabled' : '') + '>' +
      '<span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span>' + mark + '</button>';
  }).join('');

  var readText;
  if(state.mode === 3){
    readText = q.target + '。下面哪一句最能襯托它？' +
      'A，' + q.opts[0] + '。B，' + q.opts[1] + '。C，' + q.opts[2] + '。';
  } else {
    readText = q.text + '。' + q.ask;
  }

  var feedbackHtml = '';
  if(state.answered){
    var ok = state.picked === q.ans;
    feedbackHtml = '<div class="feedback ' + (ok ? 'ok' : 'bad') + '" role="status" aria-live="polite">' +
      '<div class="fb-head">' + icon(ok ? 'check' : 'x') + (ok ? '答對了！' : '再看一次說明') + '</div>' +
      (ok ? '' : '<p class="fb-right">正解是：<b>' + esc(q.opts[q.ans]) + '</b></p>') +
      '<p class="fb-exp">' + esc(q.explain) + '</p>' +
      '<button class="btn primary" data-act="next">' + (state.idx === list.length - 1 ? '看成績' : '下一題') + '</button>' +
    '</div>';
  }

  document.getElementById('screen-game').innerHTML =
    '<div class="game-head">' +
      '<span class="qcount">第 ' + (state.idx + 1) + ' / ' + list.length + ' 題</span>' +
      '<div class="pips" aria-hidden="true">' + pipHtml(list.length, state.idx) + '</div>' +
    '</div>' +
    '<div class="card board">' +
      headHtml +
      '<div class="opts' + (state.mode === 3 ? ' two' : '') + '">' + optsHtml + '</div>' +
      feedbackHtml +
      (CAN_SPEAK
        ? '<div class="sort-foot" style="margin-top:16px">' +
            '<button class="btn ghost small" data-act="speak" data-text="' + esc(readText) + '">' + icon('speaker') + '朗讀題目</button>' +
          '</div>'
        : '') +
    '</div>';
}

/* --- 模式二 --- */
function renderSort(){
  var cards = DATA[state.level].m2;
  var cs = cats();
  var placed = state.placed;
  var placedCount = 0;
  for(var k=0;k<cards.length;k++){ if(placed[k]) placedCount++; }
  var allPlaced = placedCount === cards.length;

  var basketsHtml = cs.map(function(c){
    var own = [];
    for(var i=0;i<cards.length;i++){
      if(placed[i] && placed[i].cat === c.id) own.push(i);
    }
    var chips = own.map(function(i){
      return '<button class="chip" data-act="remove" data-i="' + i + '" title="點一下拿回來">' +
        esc(shortText(cards[i].t, 12)) + '</button>';
    }).join('');
    var armed = state.selected !== null ? ' armed' : '';
    return '<div class="basket ' + c.cls + armed + '" data-act="place" data-cat="' + c.id + '" role="group" tabindex="0" aria-label="' + c.label + '籃子，按 Enter 放入已選的句子">' +
      '<span class="basket-title">' + icon('leaf') + c.label + '</span>' +
      '<span class="basket-sub">' + c.hint + '</span>' +
      '<span class="basket-count">' + own.length + ' 句</span>' +
      '<span class="chips">' + chips + '</span>' +
    '</div>';
  }).join('');

  var poolCards = state.order.filter(function(i){ return !placed[i]; });
  var poolHtml = poolCards.map(function(i){
    var sel = state.selected === i ? ' sel' : '';
    var no = state.order.indexOf(i) + 1;
    return '<button class="pcard' + sel + '" data-act="selectCard" data-i="' + i + '" aria-pressed="' + (state.selected === i ? 'true' : 'false') + '">' +
      '<span class="idx">' + no + '</span><span>' + esc(cards[i].t) + '</span></button>';
  }).join('');
  if(!poolHtml) poolHtml = '<p class="sort-hint">六張卡都放好了，按下面的「看成績」揭曉結果。</p>';

  var hint;
  if(allPlaced){
    hint = '六句都放好了，按下面的「看成績」揭曉結果。';
  } else if(state.selected !== null){
    hint = '已選好句子，現在點下面的籃子（還有 ' + poolCards.length + ' 張）。';
  } else {
    hint = '第 1 步：點一張句子卡（還有 ' + poolCards.length + ' 張）。第 2 步：點下面的籃子。';
  }

  var readAll = cards.map(function(c){ return c.t; }).join('。');

  document.getElementById('screen-game').innerHTML =
    '<div class="game-head">' +
      '<span class="qcount">分類快手 · ' + (state.level === 'basic' ? '初階' : '高階') + '</span>' +
      '<div class="pips" aria-hidden="true">' + pipHtml(cards.length, placedCount) + '</div>' +
    '</div>' +
    '<div class="card board">' +
      '<p class="sort-hint" role="status" aria-live="polite">' + hint + '</p>' +
      '<div class="pool-label">句子卡</div>' +
      '<div class="pool">' + poolHtml + '</div>' +
      '<div class="pool-label">放進籃子</div>' +
      '<div class="baskets' + (cs.length === 3 ? ' three' : '') + '">' + basketsHtml + '</div>' +
      '<div class="sort-foot">' +
        '<span class="qcount">已放 ' + placedCount + ' / ' + cards.length + '</span>' +
        '<button class="btn green" data-act="finishSort">' + icon('check') + '看成績</button>' +
      '</div>' +
      '<p class="sort-note">放進籃子時不會馬上公布對錯；也可以先按「看成績」，沒放的會算答錯。</p>' +
      (CAN_SPEAK ? '<div class="sort-foot" style="margin-top:10px"><button class="btn ghost small" data-act="speak" data-text="' + esc(readAll) + '">' + icon('speaker') + '朗讀全部句子</button></div>' : '') +
    '</div>';
}

/* ============ 作答 ============ */
function answer(i){
  if(state.answered) return;
  var list = currentList();
  var q = list[state.idx];
  state.picked = i;
  state.answered = true;
  var ok = (i === q.ans);
  if(ok) state.correct++;
  state.review.push({
    q: state.mode === 3 ? q.target : q.text,
    ask: state.mode === 3 ? '下面哪一句最能襯托它？' : q.ask,
    yours: q.opts[i],
    right: q.opts[q.ans],
    ok: ok,
    explain: q.explain
  });
  if(ok) SFX.correct(); else SFX.wrong();
  renderChoice();
  var fb = document.querySelector('.feedback');
  if(fb){
    if(fb.scrollIntoView) fb.scrollIntoView({ block:'nearest', behavior:'smooth' });
    var nb = fb.querySelector('.btn');
    if(nb) setTimeout(function(){ try{ nb.focus({preventScroll:true}); }catch(e){ nb.focus(); } }, 80);
  }
}

function nextQuestion(){
  var list = currentList();
  if(state.idx < list.length - 1){
    state.idx++;
    state.answered = false;
    state.picked = null;
    SFX.click();
    renderChoice();
    window.scrollTo(0, 0);
  } else {
    goResult();
  }
}

function selectCard(i){
  if(state.placed[i]) return;
  state.selected = (state.selected === i ? null : i);
  SFX.pick();
  renderSort();
  var bs = document.querySelector('.baskets');
  if(bs && state.selected !== null && bs.scrollIntoView){
    setTimeout(function(){ bs.scrollIntoView({ block:'nearest', behavior:'smooth' }); }, 40);
  }
}

function placeCard(catId){
  if(state.selected === null) return;
  var cards = DATA[state.level].m2;
  var i = state.selected;
  if(state.placed[i]){ state.selected = null; renderSort(); return; }
  state.placed[i] = { cat: catId };
  state.selected = null;
  SFX.drop();
  renderSort();
}

function removeCard(i){
  if(!state.placed[i]) return;
  delete state.placed[i];
  SFX.drop();
  renderSort();
}

function finishSort(){
  var cards = DATA[state.level].m2;
  var correct = 0;
  state.review = [];
  for(var i=0;i<cards.length;i++){
    var p = state.placed[i];
    var ok = !!(p && p.cat === cards[i].cat);
    if(ok) correct++;
    state.review.push({
      q: cards[i].t,
      ask: '這句應該放進哪一個籃子？',
      yours: p ? CAT_LABEL[p.cat] : '未作答',
      right: CAT_LABEL[cards[i].cat],
      ok: ok,
      explain: cards[i].explain
    });
  }
  state.correct = correct;
  goResult();
}

/* ============ 結算 ============ */
function goResult(){
  var correct = state.correct;
  var key = state.level + '-' + state.mode;
  var prevBest = state.best[key];
  var improved = (prevBest == null) ? (correct > 0) : (correct > prevBest);
  if(prevBest == null || correct > prevBest){
    state.best[key] = correct;
    saveStore();
  }
  state.isNewRecord = improved;
  state.resultStars = starsOf(correct);
  renderResult();
  if(state.resultStars >= 3) SFX.win();
  else if(correct >= 2) SFX.correct();
  else SFX.drop();
}

function renderResult(){
  var total = 6;
  var correct = state.correct;
  var stars = state.resultStars;

  var verdict;
  if(correct >= 6) verdict = '太厲害了！你已經是完全的襯托小達人。';
  else if(correct >= 4) verdict = '很棒！再練習一下，就能全部答對。';
  else if(correct >= 2) verdict = '有進步空間，回去看看教學再挑戰一次。';
  else verdict = '別灰心，先回教學複習「主角」和「綠葉」的分別。';

  var starsHtml = bigStar(stars >= 1) + bigStar(stars >= 2) + bigStar(stars >= 3);

  var reviewHtml = state.review.map(function(r, i){
    return '<div class="card rv-item">' +
      '<div class="rv-q">' + (i + 1) + '. ' + esc(r.q) + '</div>' +
      (r.ask ? '<p class="rv-ask">問：' + esc(r.ask) + '</p>' : '') +
      '<div class="rv-row">' +
        '<span class="tag ' + (r.ok ? 'ok' : 'bad') + '">你的答案：' + esc(r.yours) + '</span>' +
        '<span class="tag info">正解：' + esc(r.right) + '</span>' +
      '</div>' +
      '<p class="rv-exp">' + esc(r.explain) + '</p>' +
    '</div>';
  }).join('');

  document.getElementById('screen-result').innerHTML =
    '<div class="card result-card" role="status" aria-live="polite">' +
      '<div class="stars-big">' + starsHtml + '</div>' +
      '<div class="score">' + correct + ' <small>/ ' + total + ' 題</small></div>' +
      '<p class="verdict">' + verdict + '</p>' +
      (state.isNewRecord ? '<span class="newrec">' + icon('star') + '新紀錄！</span>' : '') +
    '</div>' +
    '<div class="review-title"><span class="bar"></span>逐題回顧與說明</div>' +
    '<div aria-live="polite">' + reviewHtml + '</div>' +
    '<div class="result-actions">' +
      '<button class="btn primary" data-act="again">' + icon('play') + '再玩一次</button>' +
      '<button class="btn ghost" data-act="teach">' + icon('book') + '看教學</button>' +
      '<button class="btn ghost" data-act="home">' + icon('home') + '回首頁</button>' +
    '</div>';
  show('result');
}

/* ============ 事件 ============ */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.getAttribute('data-act');

  if(act === 'home'){
    SFX.click();
    renderHome();
    return;
  }
  if(act === 'sound'){
    state.sound = !state.sound;
    saveStore();
    document.getElementById('soundBtn').innerHTML = icon(state.sound ? 'sound' : 'mute');
    document.getElementById('soundBtn').setAttribute('aria-label', state.sound ? '關閉音效' : '開啟音效');
    if(state.sound) SFX.click();
    return;
  }
  if(act === 'level'){
    state.level = t.getAttribute('data-level');
    SFX.click();
    renderHome();
    return;
  }
  if(act === 'teach'){
    state.teachReturn = (state.screen === 'result') ? 'result' : 'home';
    state.teachPage = 0;
    SFX.click();
    renderTeach();
    return;
  }
  if(act === 'teachPage'){
    var p = parseInt(t.getAttribute('data-page'), 10);
    if(isNaN(p) || p < 0 || p >= TEACH.length) return;
    state.teachPage = p;
    SFX.click();
    renderTeach();
    return;
  }
  if(act === 'teachDone'){
    SFX.correct();
    if(state.teachReturn === 'result' && state.review.length){
      renderResult();
    } else {
      renderHome();
    }
    return;
  }
  if(act === 'start'){
    var m = parseInt(t.getAttribute('data-mode'), 10);
    if(m >= 1 && m <= 3) startGame(m);
    return;
  }
  if(act === 'answer'){
    answer(parseInt(t.getAttribute('data-i'), 10));
    return;
  }
  if(act === 'next'){
    nextQuestion();
    return;
  }
  if(act === 'selectCard'){
    selectCard(parseInt(t.getAttribute('data-i'), 10));
    return;
  }
  if(act === 'place'){
    placeCard(t.getAttribute('data-cat'));
    return;
  }
  if(act === 'remove'){
    removeCard(parseInt(t.getAttribute('data-i'), 10));
    return;
  }
  if(act === 'finishSort'){
    finishSort();
    return;
  }
  if(act === 'again'){
    startGame(state.mode);
    return;
  }
  if(act === 'speak'){
    speak(t.getAttribute('data-text') || '');
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-act') === 'place'){
    e.preventDefault();
    placeCard(t.getAttribute('data-cat'));
  }
});

/* ============ 啟動 ============ */
loadStore();
renderHome();
</script>
</body>
</html>
