<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>議論小達人｜小學議論手法互動教室</title>
<meta name="description" content="小學議論手法互動遊戲：五種議論手法教學、五個互動練習模式與兩個辨析挑戰區，繁體字、卡通Q版、附音效。">
<style>
:root{
  --ink:#22344A; --ink-2:#3C5269; --soft:#6B7C90;
  --cream:#FFF7EA; --paper:#FFFFFF;
  --sun:#FFC93C; --coral:#FF8A5B; --mint:#2FBF9B; --sky:#459DF5; --violet:#8877E0; --pink:#FF8FA8;
  --line:rgba(34,52,74,.12);
  --r-lg:30px; --r-md:20px; --r-sm:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --hard:0 6px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);background:var(--cream);
  font-family:"Noto Sans HK","Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC","LiHei Pro",sans-serif;
  font-size:17px;line-height:1.65;letter-spacing:.01em;
  background-image:radial-gradient(circle at 1px 1px, rgba(34,52,74,.06) 1px, transparent 0);
  background-size:24px 24px;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 420px at 8% 3%, #FFEBC9 0%, rgba(255,235,201,0) 62%),
    radial-gradient(720px 520px at 96% 16%, #D6EEFF 0%, rgba(214,238,255,0) 62%),
    radial-gradient(680px 520px at 62% 104%, #FFE1EB 0%, rgba(255,225,235,0) 66%);
  opacity:.85;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
button{font-family:inherit}
:focus-visible{outline:4px solid rgba(69,157,245,.5);outline-offset:3px;border-radius:12px}
.shell{max-width:1140px;margin:0 auto;padding:0 clamp(14px,3.2vw,30px) 130px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 頂欄 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 0;margin-bottom:4px;
  background:linear-gradient(180deg, rgba(255,247,234,.96) 60%, rgba(255,247,234,0));
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 8px 6px 4px;border-radius:18px;cursor:pointer;color:inherit;text-align:left}
.brand svg{width:46px;height:46px;flex:none}
.brand-name{display:block;font-size:1.02rem;font-weight:900;line-height:1.15;letter-spacing:.02em}
.brand-sub{display:block;font-size:.7rem;font-weight:700;color:var(--soft);letter-spacing:.06em}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:50px;height:50px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 rgba(34,52,74,.08);transition:transform .15s var(--ease), background .2s;
}
.icon-btn:hover{transform:translateY(-2px)}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="true"]{background:#FFF1D6}

/* ---------- 按鈕 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:58px;padding:12px 26px;border-radius:18px;border:2.5px solid var(--ink);
  background:#fff;color:var(--ink);font-size:1.02rem;font-weight:900;letter-spacing:.02em;
  cursor:pointer;box-shadow:var(--hard);transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:22px;height:22px;flex:none}
.btn-sun{background:var(--sun)}
.btn-mint{background:#BFF3E5}
.btn-ghost{box-shadow:0 4px 0 rgba(34,52,74,.14);border-color:var(--line);background:#fff}
.btn-ghost:active{box-shadow:0 1px 0 rgba(34,52,74,.14)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:0 3px 0 rgba(34,52,74,.15)!important}

/* ---------- 畫面切換 ---------- */
.screen{display:none}
.screen.is-active{display:block;animation:screenIn .42s var(--ease) both}
@keyframes screenIn{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 首頁 ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(10px,3vw,40px);align-items:center;padding:clamp(10px,2vw,22px) 0 clamp(18px,3vw,30px)}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:900;letter-spacing:.16em;
  color:var(--ink-2);background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 16px;box-shadow:0 3px 0 rgba(34,52,74,.06)
}
.eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--coral);display:block}
.hero h1{font-size:clamp(2.5rem,7.2vw,4.6rem);line-height:1.04;font-weight:900;margin:14px 0 10px;letter-spacing:.01em}
.hl{position:relative;display:inline-block;z-index:0}
.hl::after{content:"";position:absolute;left:-2%;right:-2%;bottom:6%;height:36%;background:#FFE08A;border-radius:8px;z-index:-1;transform:rotate(-1.2deg)}
.hero p.lead{font-size:clamp(1.02rem,2vw,1.22rem);color:var(--ink-2);font-weight:600;max-width:30em;line-height:1.75}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hero-note{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--ink-2);background:rgba(255,255,255,.8);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
.pill svg{width:15px;height:15px;flex:none}
.hero-art{position:relative;display:flex;justify-content:center}
.hero-art .owl-wrap{width:min(100%,340px);animation:floaty 6s ease-in-out infinite}
.hero-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 24px rgba(34,52,74,.14))}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bubble{
  position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 14px;
  font-size:.9rem;font-weight:900;box-shadow:0 4px 0 rgba(34,52,74,.14);white-space:nowrap;
}
.bubble::after{content:"";position:absolute;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);bottom:-8px;left:26px;transform:rotate(45deg)}
.b1{top:6%;left:-2%;transform:rotate(-4deg);color:#C75B32}
.b2{top:34%;right:-3%;transform:rotate(3deg);color:#2F8FB8}
.b3{bottom:12%;left:2%;transform:rotate(-2deg);color:#3E9E7E}

/* ---------- 首頁三個入口 ---------- */
.modules{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,2vw,20px);margin-top:8px}
.mod{
  position:relative;overflow:hidden;text-align:left;border:2.5px solid var(--ink);border-radius:var(--r-lg);
  padding:clamp(20px,3vw,30px);background:#fff;cursor:pointer;color:inherit;font-family:inherit;
  box-shadow:0 8px 0 rgba(34,52,74,.9);transition:transform .16s var(--ease), box-shadow .16s var(--ease);
}
.mod:hover{transform:translateY(-4px);box-shadow:0 12px 0 rgba(34,52,74,.9)}
.mod:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(34,52,74,.9)}
.mod-a{grid-column:span 12;background:linear-gradient(135deg,#FFF3D9,#FFE6C7 70%)}
.mod-b{grid-column:span 7;background:linear-gradient(135deg,#E4F7F1,#D2F2E8 80%)}
.mod-c{grid-column:span 5;background:linear-gradient(135deg,#E8F1FF,#DCE9FF 80%)}
.mod-no{font-size:.74rem;font-weight:900;letter-spacing:.2em;color:var(--ink-2);opacity:.7}
.mod h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:900;margin:6px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod p{font-size:1rem;color:var(--ink-2);font-weight:600;max-width:34em}
.mod-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.86);border:1.5px solid rgba(34,52,74,.14)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.mod-go{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-weight:900;font-size:.95rem}
.mod-go svg{width:18px;height:18px;transition:transform .2s}
.mod:hover .mod-go svg{transform:translateX(4px)}
.mod-art{position:absolute;right:14px;bottom:-6px;width:clamp(90px,17vw,150px);opacity:.95;pointer-events:none}
.mod-art svg{width:100%;height:auto;display:block}
.mod-b .mod-art{width:clamp(80px,14vw,124px);bottom:-10px;right:8px}
.mod-c .mod-art{width:clamp(80px,14vw,124px);bottom:-10px;right:8px}

/* ---------- 學習路線 ---------- */
.road{margin-top:clamp(24px,4vw,40px)}
.road-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.road-head h2{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:900}
.road-head span{font-size:.85rem;color:var(--soft);font-weight:700}
.road-list{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.road-item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center;box-shadow:0 4px 0 rgba(34,52,74,.05)}
.road-item b{display:block;font-size:.78rem;color:var(--soft);letter-spacing:.1em}
.road-item span{display:block;font-size:.88rem;font-weight:900;margin-top:2px;line-height:1.3}
.road-item em{display:block;font-style:normal;font-size:.72rem;color:var(--soft);font-weight:700;margin-top:2px}
.road-item .dot{width:10px;height:10px;border-radius:50%;margin:0 auto 6px;display:block}

/* ---------- 教學館 ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:clamp(10px,2vw,20px) 0 18px}
.page-head h1{font-size:clamp(1.8rem,4.4vw,2.7rem);font-weight:900;line-height:1.15}
.page-head p{color:var(--ink-2);font-weight:600;margin-top:4px}
.teach-wrap{display:grid;grid-template-columns:236px 1fr;gap:clamp(14px,2.4vw,26px);align-items:start}
.rail{position:sticky;top:80px;display:flex;flex-direction:column;gap:8px}
.rail-btn{
  display:flex;align-items:center;gap:10px;text-align:left;padding:11px 13px;border-radius:16px;border:2px solid transparent;
  background:rgba(255,255,255,.65);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.92rem;font-weight:800;
  transition:transform .15s var(--ease), background .2s, border-color .2s;
}
.rail-btn:hover{transform:translateX(3px);background:#fff}
.rail-btn i{width:12px;height:12px;border-radius:4px;flex:none;display:block;background:var(--c)}
.rail-btn small{display:block;font-size:.68rem;font-weight:700;color:var(--soft);letter-spacing:.04em}
.rail-btn[aria-current="true"]{background:#fff;border-color:var(--ink);box-shadow:0 4px 0 rgba(34,52,74,.14)}
.rail-btn.all i{background:linear-gradient(135deg,var(--coral),var(--violet))}

.teach-card{background:#fff;border:2.5px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 9px 0 rgba(34,52,74,.10);overflow:hidden}
.teach-top{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2.6vw,26px);align-items:center;padding:clamp(18px,3vw,30px);background:var(--tint)}
.teach-illu{width:clamp(110px,17vw,180px);flex:none}
.teach-illu svg{width:100%;height:auto;display:block}
.teach-kicker{font-size:.76rem;font-weight:900;letter-spacing:.18em;color:var(--tc-ink);opacity:.8}
.teach-title{font-size:clamp(1.55rem,3.6vw,2.25rem);font-weight:900;line-height:1.2;margin:4px 0 6px;color:var(--tc-ink)}
.teach-title small{font-size:.72em;font-weight:800;opacity:.72;margin-left:8px}
.teach-def{font-size:clamp(1rem,1.9vw,1.16rem);font-weight:700;line-height:1.7;color:var(--ink-2);max-width:34em}
.teach-kou{display:flex;align-items:flex-start;gap:8px;margin-top:12px;background:#fff;border:2px solid var(--tc-ink);border-radius:16px;padding:8px 14px;font-weight:900;font-size:.92rem;line-height:1.5;color:var(--tc-ink);max-width:34em}
.teach-kou svg{width:18px;height:18px;flex:none;margin-top:2px}
.teach-body{padding:clamp(18px,3vw,30px);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbox{border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:#FFFDF8}
.tbox h3{font-size:.82rem;font-weight:900;letter-spacing:.12em;color:var(--soft);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tbox h3 svg{width:16px;height:16px;flex:none}
.tbox p{font-size:1rem;font-weight:600;color:var(--ink-2);line-height:1.7}
.tbox ul{margin:0;padding-left:1.1em;font-size:.98rem;color:var(--ink-2);font-weight:600}
.tbox li{margin:3px 0}
.tbox code{font-family:inherit;background:#FFF0CF;border-radius:6px;padding:1px 6px;font-weight:800;color:#8A5A12}
.fchip{display:inline-block;background:#FFF0CF;border-radius:9px;padding:3px 10px;margin:2px 5px 2px 0;font-weight:800;color:#8A5A12;font-size:.9rem;white-space:nowrap}
.tbox.wide{grid-column:1/-1}
.example-box{grid-column:1/-1;border:2.5px solid var(--tc-ink);border-radius:20px;padding:clamp(14px,2.4vw,22px);background:#fff;position:relative;overflow:hidden}
.example-box::before{content:"“";position:absolute;right:10px;top:-16px;font-size:8rem;line-height:1;color:var(--tint-strong);font-family:Georgia,serif;opacity:.7}
.example-box h3{font-size:.8rem;font-weight:900;letter-spacing:.14em;color:var(--tc-ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.example-box h3 svg{width:16px;height:16px;flex:none}
.example-text{position:relative;font-size:clamp(1.02rem,2vw,1.2rem);font-weight:700;line-height:1.85;color:var(--ink);z-index:1}
mark{background:linear-gradient(transparent 52%, var(--mark) 52%);padding:0 2px;font-weight:900;color:inherit}
.teach-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 clamp(18px,3vw,30px) clamp(18px,3vw,26px)}
.teach-nav{display:flex;gap:8px}
.teach-nav .btn{min-height:50px;padding:10px 18px;font-size:.92rem}
.teach-cta{display:flex;gap:8px;flex-wrap:wrap}

/* 總覽頁 */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ov-card{border:2px solid var(--line);border-radius:22px;padding:18px;background:#FFFDF8;text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:transform .16s var(--ease), border-color .2s}
.ov-card:hover{transform:translateY(-3px);border-color:var(--ink)}
.ov-card .ov-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ov-card .ov-top svg{width:46px;height:46px;flex:none}
.ov-card h3{font-size:1.06rem;font-weight:900}
.ov-card p{font-size:.92rem;font-weight:600;color:var(--ink-2);line-height:1.6}
.ov-card .ov-tag{display:inline-block;margin-top:10px;font-size:.76rem;font-weight:900;color:var(--soft);letter-spacing:.08em}
.structure{margin-top:18px;border:2.5px dashed rgba(34,52,74,.22);border-radius:22px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#FFFDF8}
.structure .st{text-align:center;padding:10px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.structure b{display:block;font-size:1rem;font-weight:900}
.structure span{font-size:.82rem;color:var(--soft);font-weight:700}

/* ---------- 練習場 ---------- */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:16px}
.mode-card{
  position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:clamp(16px,2.4vw,22px);
  border:2.5px solid var(--ink);border-radius:26px;background:#fff;cursor:pointer;color:inherit;font-family:inherit;
  box-shadow:0 7px 0 rgba(34,52,74,.85);transition:transform .16s var(--ease), box-shadow .16s var(--ease);
  overflow:hidden;
}
.mode-card:hover{transform:translateY(-4px);box-shadow:0 11px 0 rgba(34,52,74,.85)}
.mode-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(34,52,74,.85)}
.mode-card .MC-art{position:absolute;right:-8px;top:-6px;width:104px;opacity:.9;pointer-events:none}
.mode-card .MC-art svg{width:100%;height:auto;display:block}
.mode-card .MC-tag{font-size:.72rem;font-weight:900;letter-spacing:.14em;color:#fff;background:var(--mc);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;align-self:flex-start;border:2px solid var(--ink)}
.mode-card h3{font-size:clamp(1.2rem,2.4vw,1.45rem);font-weight:900;margin-top:8px;line-height:1.25;padding-right:70px}
.mode-card .MC-sub{font-size:.8rem;font-weight:800;color:var(--mc-deep);letter-spacing:.04em}
.mode-card p{font-size:.94rem;font-weight:600;color:var(--ink-2);line-height:1.6;margin-top:4px}
.mode-card .MC-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--line)}
.stars{display:inline-flex;gap:3px}
.stars svg{width:20px;height:20px}
.stars .off{opacity:.22}
.MC-go{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:.9rem;color:var(--mc-deep)}
.MC-go svg{width:16px;height:16px}
.badge-done{position:absolute;right:14px;bottom:14px;font-size:.72rem;font-weight:900;color:var(--mc-deep);background:#fff;border:1.5px solid var(--mc);border-radius:999px;padding:2px 8px}

/* ---------- 遊戲 ---------- */
.game{max-width:860px;margin:0 auto}
.game-head{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.game-head .gtitle{flex:1;min-width:0}
.game-head h1{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-head small{display:block;font-size:.76rem;font-weight:800;color:var(--soft);letter-spacing:.04em}
.score-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:.88rem;flex:none}
.score-pill svg{width:17px;height:17px}
.progress{height:14px;border-radius:999px;background:rgba(34,52,74,.09);overflow:hidden;margin-bottom:16px;border:2px solid rgba(34,52,74,.06)}
.progress span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--mc-light),var(--mc));transition:width .45s var(--ease)}
.q-card{background:#fff;border:2.5px solid var(--ink);border-radius:26px;padding:clamp(18px,3vw,28px);box-shadow:0 8px 0 rgba(34,52,74,.10)}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.q-index{font-size:.76rem;font-weight:900;letter-spacing:.14em;color:var(--mc-deep);background:var(--mc-soft);border-radius:999px;padding:4px 11px}
.q-kind{font-size:.74rem;font-weight:800;color:var(--soft);letter-spacing:.06em}
.q-stem{font-size:clamp(1.08rem,2.3vw,1.36rem);font-weight:900;line-height:1.66;color:var(--ink)}
.q-sub{font-size:.96rem;font-weight:700;color:var(--ink-2);margin-top:8px}
.q-extra{margin-top:10px;font-size:.92rem;font-weight:700;color:var(--soft)}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:15px 16px;border:2.5px solid rgba(34,52,74,.16);border-radius:18px;background:#FFFDF8;color:var(--ink);
  font-family:inherit;font-size:clamp(.98rem,2vw,1.1rem);font-weight:700;line-height:1.6;cursor:pointer;
  transition:transform .14s var(--ease), border-color .18s, background .18s, box-shadow .18s;
  box-shadow:0 4px 0 rgba(34,52,74,.07);
}
.opt:hover{transform:translateY(-2px);border-color:var(--mc);box-shadow:0 6px 0 rgba(34,52,74,.10)}
.opt .tick{
  flex:none;width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--mc-soft);color:var(--mc-deep);font-weight:900;font-size:.92rem;border:2px solid rgba(34,52,74,.10);
}
.opt .label{flex:1;min-width:0}
.opt.correct{border-color:#2FBF9B;background:#E9FBF4;box-shadow:0 4px 0 rgba(47,191,155,.35)}
.opt.correct .tick{background:#2FBF9B;color:#fff;border-color:#1B8F72}
.opt.wrong{border-color:#F26A5A;background:#FFEFEC;box-shadow:0 4px 0 rgba(242,106,90,.3)}
.opt.wrong .tick{background:#F26A5A;color:#fff;border-color:#C94B3D}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.opt .mark{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:none}
.opt.correct .mark,.opt.wrong .mark{display:block}

/* 選項變體 */
.opts.v-case .opt{border-radius:20px 20px 20px 6px}
.opts.v-puzzle{gap:14px}
.opts.v-puzzle .opt{border-radius:14px;border-style:dashed}
.opts.v-puzzle .opt::after{content:"";position:absolute;left:-11px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--cream);border:2.5px dashed rgba(34,52,74,.3)}
.opts.v-quote .opt{border-left-width:10px;border-left-color:var(--mc)}
.opts.v-detect{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.v-detect .opt{padding:12px 13px;font-size:.98rem;border-radius:16px}
.opts.v-detect .opt .tick{width:30px;height:30px;font-size:.8rem;border-radius:9px}

/* 天平 */
.balance-stage{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.scale{width:min(100%,420px);height:auto;display:block}
.scale .beam-g{transform-origin:160px 84px;transition:transform .55s var(--ease)}
.scale.tilt-left .beam-g{transform:rotate(-11deg)}
.scale.tilt-right .beam-g{transform:rotate(11deg)}
.scale.tilt-left .pan-l{transform:translateY(18px)}
.scale.tilt-right .pan-r{transform:translateY(18px)}
.scale .pan-l,.scale .pan-r{transition:transform .55s var(--ease)}
.pan-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:6px}
.pan-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border-radius:20px;border:2.5px solid var(--ink);
  background:#fff;cursor:pointer;font-family:inherit;font-weight:900;font-size:1.02rem;color:var(--ink);box-shadow:0 5px 0 var(--ink);
  transition:transform .14s var(--ease), box-shadow .14s var(--ease);
}
.pan-btn:hover{transform:translateY(-2px)}
.pan-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pan-btn small{font-size:.76rem;font-weight:700;color:var(--soft)}
.pan-btn.pro{background:#EAF9F3}
.pan-btn.con{background:#FFF0EC}
.pan-btn[disabled]{opacity:.55;cursor:default;transform:none}

/* 分類 */
.sort-hint{font-size:.88rem;font-weight:800;color:var(--soft);margin-top:10px;display:flex;align-items:center;gap:6px}
.sort-hint svg{width:16px;height:16px;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;min-height:0}
.sort-card{
  border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:11px 14px;font-family:inherit;
  font-size:.95rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;line-height:1.5;
  box-shadow:0 4px 0 rgba(34,52,74,.12);transition:transform .14s var(--ease), box-shadow .14s, background .2s;
  flex:1 1 100%;
}
.sort-card:hover{transform:translateY(-2px)}
.sort-card.sel{background:#FFF2CE;border-color:#C98A00;box-shadow:0 4px 0 #E0A200;transform:translateY(-3px)}
.sort-card.done{display:none}
.bins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.bin{
  border:2.5px dashed rgba(34,52,74,.3);border-radius:16px;background:#FFFDF8;padding:10px 8px;min-height:96px;
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit;color:var(--ink);
  transition:transform .15s var(--ease), background .2s, border-color .2s;
}
.bin:hover{background:#fff;border-color:var(--ink)}
.bin .bin-ico{width:30px;height:30px;flex:none}
.bin .bin-ico svg{width:100%;height:100%;display:block}
.bin b{font-size:.8rem;font-weight:900;line-height:1.25;text-align:center}
.bin .bin-items{display:flex;flex-direction:column;gap:4px;width:100%}
.bin .bin-tag{font-size:.7rem;font-weight:800;background:var(--mc-soft);border-radius:8px;padding:3px 6px;line-height:1.35;color:var(--ink-2)}
.bin.shake{animation:shake .42s}
.bin.good{background:#EAFBF4;border-color:#2FBF9B;border-style:solid}

/* 類比搭橋 */
.bridge-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:16px}
.bank{
  border:2.5px solid var(--ink);border-radius:18px;background:#FFFDF8;padding:13px 15px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;
  box-shadow:0 5px 0 rgba(34,52,74,.10);
}
.bank small{font-size:.72rem;font-weight:900;color:var(--soft);letter-spacing:.1em}
.bank b{font-size:clamp(.98rem,2.2vw,1.12rem);font-weight:900;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}
.bank-right{border-style:dashed;border-color:rgba(34,52,74,.3);background:#FFFBF0;align-items:center;text-align:center}
.bank-right b{color:var(--soft);font-size:1.5rem;line-height:1.3}
.bank-right.filled{border-style:solid;border-color:var(--ink);background:#fff}
.bank-right.filled b{color:var(--ink);font-size:clamp(.98rem,2.2vw,1.12rem);line-height:1.55}
.bridge-mid{display:flex;align-items:center;justify-content:center}
.bridge-mid .eq{
  width:48px;height:48px;border-radius:50%;background:var(--mc-soft);border:2.5px solid var(--ink);
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(34,52,74,.14);
}
.bridge-mid .eq svg{width:26px;height:26px;display:block}
.bridge-ask{margin-top:18px;display:flex;align-items:center;gap:6px;font-size:.96rem;font-weight:900;line-height:1.5;color:var(--mc-deep)}
.bridge-hint{
  display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:14px;
  font-size:.92rem;font-weight:700;line-height:1.6;border:2px solid #F5C57E;background:#FFF8E8;color:#7A5200;
}
.bridge-hint[hidden]{display:none}
.bridge-hint svg{width:18px;height:18px;flex:none;margin-top:3px}
@media(max-width:560px){
  .bridge-stage{grid-template-columns:1fr;gap:8px}
  .bridge-mid .eq{width:42px;height:42px}
  .bank{padding:11px 13px}
}

/* 回饋 */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:0 10px;background:rgba(34,52,74,.22);animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet .sheet-in{
  width:100%;max-width:860px;pointer-events:auto;background:#fff;border:2.5px solid var(--ink);border-bottom:0;
  border-radius:24px 24px 0 0;padding:16px clamp(16px,3vw,24px) calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px rgba(34,52,74,.18);animation:sheetUp .38s var(--ease) both;
  max-height:64vh;overflow:auto;overscroll-behavior:contain;
}
@keyframes sheetUp{from{transform:translateY(110%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheet-badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:900;padding:4px 11px;border-radius:999px;border:2px solid}
.sheet-badge.ok{background:#E9FBF4;color:#167A5E;border-color:#67D7B9}
.sheet-badge.no{background:#FFEFEC;color:#B33E2E;border-color:#F5A79B}
.sheet-badge svg{width:15px;height:15px}
.sheet h3{font-size:1.08rem;font-weight:900}
.sheet-text{font-size:1rem;font-weight:600;color:var(--ink-2);line-height:1.72;margin:4px 0 12px}
.sheet-text b{color:var(--ink);font-weight:900}
.sheet .btn{min-height:52px;width:100%}

/* ---------- 結算 ---------- */
.summary{max-width:760px;margin:0 auto;text-align:center}
.summary-card{background:#fff;border:2.5px solid var(--ink);border-radius:30px;padding:clamp(22px,4vw,36px);box-shadow:0 10px 0 rgba(34,52,74,.12)}
.summary .trophy{width:clamp(110px,22vw,160px);margin:0 auto 6px}
.summary .trophy svg{width:100%;height:auto;display:block}
.summary h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:900;line-height:1.25}
.summary .verdict{font-size:1rem;font-weight:700;color:var(--ink-2);margin-top:6px}
.ring{width:150px;height:150px;margin:16px auto 6px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--mc) var(--p), rgba(34,52,74,.09) 0)}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.ring b{position:relative;font-size:2rem;font-weight:900;line-height:1}
.ring span{position:relative;display:block;font-size:.78rem;color:var(--soft);font-weight:800;letter-spacing:.08em}
.big-stars{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}
.big-stars svg{width:44px;height:44px}
.big-stars .off{opacity:.2}
.review{text-align:left;margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.review h3{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.review h3 svg{width:20px;height:20px;flex:none}
.review-item{background:#FFF9F0;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.review-item .ri-q{font-size:.9rem;font-weight:700;color:var(--ink-2);line-height:1.6}
.review-item .ri-a{font-size:.9rem;font-weight:900;color:#167A5E;margin-top:4px}
.review-item .ri-e{font-size:.86rem;font-weight:600;color:var(--soft);margin-top:3px;line-height:1.6}
.sum-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.sum-actions .btn{flex:1 1 180px}

/* ---------- 補充狀態 ---------- */
.pan-btn.correct{border-color:#2FBF9B;background:#E9FBF4}
.pan-btn.wrong{border-color:#F26A5A;background:#FFEFEC}
.sort-fb{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:14px;font-size:.93rem;font-weight:700;line-height:1.6;border:2px solid}
.sort-fb.ok{background:#E9FBF4;border-color:#8FE0C8;color:#12664E}
.sort-fb.no{background:#FFEFEC;border-color:#F5A79B;color:#9E3628}
.sort-fb svg{width:18px;height:18px;flex:none;margin-top:3px}
.ring>div{position:relative;text-align:center}
.sheet[hidden]{display:none}
.opt .label{word-break:break-word}
.bin-tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 其他 ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);z-index:90;background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:999px;font-weight:800;font-size:.9rem;transition:transform .35s var(--ease);pointer-events:none;
}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- 響應式 ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-art{order:-1;max-width:300px;margin:0 auto}

  .rail-btn{flex:none;white-space:nowrap;padding:9px 12px}
  .rail-btn small{display:none}
  .road-list{grid-template-columns:repeat(4,1fr)}
  .bins{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:680px){

  .bin{min-height:82px}
  .game-head h1{font-size:1.05rem;white-space:normal}

}

  .bins{grid-template-columns:1fr 1fr}
}

  body{font-size:18px}
  .shell{max-width:1200px}
}

function starsHTML(n) {

  var el = $("#toast");

  S.game = {

  root.style.setProperty("--mc-soft", c.soft);
  root.style.setProperty("--mc-light", c.soft);
  root.innerHTML =
    '<div class="game-head">' +
      '<button class="icon-btn" data-action="quit" aria-label="退出並返回">' + ICON.back + '</button>' +

    '</div>' +
    '<div class="progress"><span id="progBar"></span></div>' +
    '<div id="qArea"></div>';

  if (m.type === "sort") { buildRound(); return; }
  renderQuestion();
}

function updateScore() { var n = $("#scoreNum"); if (n) n.textContent = S.game.correct; }
function updateBar() {
  var g = S.game;
  if (!g) return;
  var m = g.mode;
  var total = m.type === "sort" ? 10 : m.questions.length;
  var done = m.type === "sort" ? g.placed : g.q;
  if (m.type === "bridge") {
    done = g.q + (g.answered ? 1 : 0);
  }
  var bar = $("#progBar");
  if (bar) bar.style.width = Math.min(100, (done / total) * 100) + "%";
}

/* ---- 選擇題 ---- */
function renderQuestion() {
  var g = S.game, m = g.mode;
  if (m.type === "balance") { renderBalance(); return; }
  if (m.type === "bridge") { renderBridge(); return; }
  var q = m.questions[g.q];
  g.answered = false;
  var letters = q.options.length > 5 ? "ABCDEF" : LETTERS;
  var opts = q.options.map(function (o, i) {
    return '<button class="opt" data-i="' + i + '">' +
      '<span class="tick">' + letters[i] + '</span>' +
      '<span class="label">' + o.text + '</span>' +
      '</button>';
  }).join("");
  $("#qArea").innerHTML =
    '<div class="q-card">' +
      '<div class="q-top">' +
        '<span class="q-index">第 ' + (g.q + 1) + ' 題 / ' + m.questions.length + '</span>' +
        '<span class="q-kind">' + m.kind + '</span>' +
      '</div>' +
      '<p class="q-stem">' + q.stem + '</p>' +
      (q.sub ? '<p class="q-sub">' + q.sub + '</p>' : '') +
      '<div class="opts ' + (m.variant ? "v-" + m.variant : "") + '" id="opts">' + opts + '</div>' +
    '</div>';

  $$("#opts .opt").forEach(function (btn) {

function answer(i) {
  var g = S.game, m = g.mode, q = m.questions[g.q];
  if (g.answered) return;
  if (!q.options[i]) return;
  g.answered = true;
  var ok = !!q.options[i].ok;
  var right = 0;
  q.options.forEach(function (o, idx) { if (o.ok) right = idx; });

  $$("#qArea .opt").forEach(function (el, idx) {
    el.disabled = true;
    if (q.options[idx].ok) el.classList.add("correct");
    if (idx === i && !ok) el.classList.add("wrong");
    if (idx !== i && !q.options[idx].ok) el.classList.add("dim");
  });

  if (ok) {
    g.correct++;
    SFX.correct();
  } else {
    SFX.wrong();
    g.wrongs.push({
      stem: q.stem,
      picked: (LETTERS[i] || "?") + ". " + q.options[i].text,
      right: (LETTERS[right] || "?") + ". " + q.options[right].text,
      explain: q.explain
    });
  }
  updateScore();

  var isLast = g.q + 1 >= m.questions.length;
  showSheet(ok, ok ? "答對了，很會找重點！" : "差一點，看看解說",
    (ok ? "" : '<b>正確答案：' + (LETTERS[right] || "?") + ". " + q.options[right].text + "</b><br>") + q.explain,
    isLast ? "查看成績" : "下一題", function () {
      if (isLast) { finish(); return; }
      closeSheet();
      g.q++;
      renderQuestion();
      window.scrollTo(0, 0);
    });
}

/* ---- 類比題：兩步搭橋 ---- */
function shuffleIdx(n, seed) {
  var arr = [], i, j, t, s = seed * 9301 + 49297;
  for (i = 0; i < n; i++) arr.push(i);
  for (i = n - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    j = Math.floor((s / 233280) * (i + 1));
    t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

var EQ_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c2.7-3 5.3-3 8 0s5.3 3 8 0M4 15c2.7-3 5.3-3 8 0s5.3 3 8 0" stroke="#8A5A00" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>';

function renderBridge() {
  var g = S.game, m = g.mode, q = m.questions[g.q];
  if (g.bridgeQ !== g.q) {
    g.bridgeQ = g.q; g.step = 1; g.mistakes = 0;
    g.vehicle = ""; g.point = ""; g.hint = ""; g.answered = false;
    g.vOrder = shuffleIdx(q.options.length, g.q * 2 + 3);
    g.pOrder = shuffleIdx(q.points.length, g.q * 2 + 8);
  }
  var step1 = g.step === 1;
  var src = step1 ? q.options : q.points;
  var order = step1 ? g.vOrder : g.pOrder;
  var opts = order.map(function (oi, pos) {
    var o = src[oi];
    var cls = "opt";
    if (g.answered && o.ok) cls += " correct";
    return '<button class="' + cls + '" data-i="' + oi + '"' + (g.answered ? " disabled" : "") + '>' +
      '<span class="tick">' + "ABC".charAt(pos) + '</span>' +
      '<span class="label">' + o.text + '</span></button>';
  }).join("");

  $("#qArea").innerHTML =
    '<div class="q-card">' +
      '<div class="q-top">' +
        '<span class="q-index">第 ' + (g.q + 1) + ' 題 / ' + m.questions.length + '</span>' +
        '<span class="q-kind">' + (step1 ? "第 1 步 · 選類比物" : "第 2 步 · 找相同點") + '</span>' +
      '</div>' +
      (q.sub ? '<p class="q-sub">' + q.sub + '</p>' : '') +
      '<div class="bridge-stage">' +
        '<div class="bank bank-left"><small>要說明的觀點</small><b>' + q.stem + '</b></div>' +
        '<div class="bridge-mid"><span class="eq">' + EQ_SVG + '</span></div>' +
        '<div class="bank bank-right' + (g.vehicle ? " filled" : "") + '"><small>熟悉的事</small><b>' + (g.vehicle || "？") + '</b></div>' +
      '</div>' +
      '<p class="bridge-ask">' + (step1 ? "第一步：哪一件事的道理和它相同？" : "第二步：兩件事的相同點是甚麼？") + '</p>' +
      '<div class="opts" id="bridgeOpts">' + opts + '</div>' +
      '<div class="bridge-hint"' + (g.hint ? "" : " hidden") + '>' + ICON.info + '<span id="bridgeHint">' + (g.hint || "") + '</span></div>' +
    '</div>';

  $$("#bridgeOpts .opt").forEach(function (btn) {
    btn.addEventListener("click", function () { pickBridge(parseInt(btn.getAttribute("data-i"), 10)); });
  });
  updateBar();
  updateScore();
}

function pickBridge(i) {
  var g = S.game, q = g.mode.questions[g.q];
  if (g.answered) return;
  var step1 = g.step === 1;
  var list = step1 ? q.options : q.points;
  var o = list[i];
  if (!o) return;
  var btn = $('#bridgeOpts .opt[data-i="' + i + '"]');
  if (!btn || !document.contains(btn)) return;

  if (!o.ok) {
    g.mistakes++;
    SFX.wrong();
    g.hint = (step1 ? "再想想：這一句" : "再想想：這個說法") + (o.why || "跟觀點的道理不同") + "。";
    var box = $("#bridgeHint"), wrap = $("#qArea .bridge-hint");
    if (box) box.textContent = g.hint;
    if (wrap) {
      wrap.hidden = false;
      if (wrap.scrollIntoView) wrap.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    if (btn) {
      btn.classList.add("wrong");
      setTimeout(function () { if (btn) btn.classList.remove("wrong"); }, 900);
    }
    return;
  }

  SFX.correct();
  if (step1) {
    g.vehicle = o.text;
    g.step = 2;
    g.hint = "";
    renderBridge();
  } else {
    g.point = o.text;
    finishBridge();
  }
}

function finishBridge() {
  var g = S.game, m = g.mode, q = m.questions[g.q];
  var ok = g.mistakes === 0;
  var rightVeh = "", rightPt = "";
  q.options.forEach(function (o) { if (o.ok) rightVeh = o.text; });
  q.points.forEach(function (o) { if (o.ok) rightPt = o.text; });

  if (ok) {
    g.correct++;
  } else {
    g.wrongs.push({
      stem: "觀點：" + q.stem,
      picked: "錯了 " + g.mistakes + " 次",
      right: "「" + rightVeh + "」＋「" + rightPt + "」",
      explain: q.explain
    });
  }

  g.answered = true;
  g.hint = "";
  renderBridge();
  updateScore();

  var isLast = g.q + 1 >= m.questions.length;
  showSheet(ok, ok ? "橋搭好了，道理也通了！" : "橋搭好了，看看道理",
    (ok ? "" : "<b>正確的類比：「" + rightVeh + "」；相同點是「" + rightPt + "」。</b><br>") + q.explain,
    isLast ? "查看成績" : "下一題", function () {
      if (isLast) { finish(); return; }
      closeSheet();
      g.q++;
      g.bridgeQ = -1;
      renderBridge();
      window.scrollTo(0, 0);
    });
}

/* ---- 分類題 ---- */
function buildRound() {
  var g = S.game, m = g.mode;
  g.pool = m.rounds[g.round].map(function (it, i) {
    return { text: it.text, tech: it.tech, why: it.why, uid: g.round + "-" + i };
  });
  g.done = [];
  g.selected = null;
  g.roundCorrect = 0;
  g.lastFb = null;
  renderSort();
}

function renderSort() {
  var g = S.game, m = g.mode;
  var totalPlaced = g.round * 5 + g.done.length;
  var poolHTML = g.pool.map(function (it, i) {
    return '<button class="sort-card" data-item="' + i + '">' + it.text + '</button>';
  }).join("");

  var binsHTML = TECH.map(function (t) {
    var tags = (g.history[t.key] || []).map(function (txt) {
      var short = txt.length > 11 ? txt.slice(0, 11) + "…" : txt;
      return '<span class="bin-tag" title="' + txt.replace(/"/g, "&quot;") + '">' + short + '</span>';
    }).join("");
    return '<button class="bin" data-bin="' + t.key + '" style="--mc-soft:' + t.soft + '">' +
      '<span class="bin-ico">' + ART_SMALL[t.key] + '</span>' +
      '<b>' + t.short + '</b>' +
      '<span class="bin-items">' + tags + '</span>' +
      '</button>';
  }).join("");

  $("#qArea").innerHTML =
    '<div class="q-card">' +
      '<div class="q-top">' +
        '<span class="q-index">第 ' + Math.min(totalPlaced + 1, 10) + ' 句 / 10</span>' +
        '<span class="q-kind">第 ' + (g.round + 1) + ' 回合 · 共 2 回合</span>' +
      '</div>' +
      '<p class="q-stem">把句子放進正確的手法箱</p>' +
      '<p class="sort-hint">' + ICON.info + '先點一句句子，再點下面的分類箱。</p>' +
      '<div class="pool" id="sortPool">' + poolHTML + '</div>' +
      '<div class="bins" id="bins">' + binsHTML + '</div>' +
      (g.lastFb ? '<div class="sort-fb ' + (g.lastFb.ok ? "ok" : "no") + '">' +
        (g.lastFb.ok ? ICON.check : ICON.cross) + '<span>' + g.lastFb.text + '</span></div>' : '') +
    '</div>';

  $$("#sortPool .sort-card").forEach(function (btn) {
    btn.addEventListener("click", function () {
      g.selected = parseInt(btn.getAttribute("data-item"), 10);
      $$("#sortPool .sort-card").forEach(function (b) { b.classList.remove("sel"); });
      btn.classList.add("sel");
      SFX.pick();
    });
  });

  $$("#bins .bin").forEach(function (bin) {
    bin.addEventListener("click", function () { placeInto(bin.getAttribute("data-bin"), bin); });
  });

  updateBar();
  updateScore();
}

function placeInto(techKey, binEl) {
  var g = S.game;
  if (g.selected === null) { toast("先點一句句子，再點分類箱"); SFX.tap(); return; }
  var idx = g.selected;
  var item = g.pool[idx];
  if (!item) return;

  var ok = item.tech === techKey;
  g.history[item.tech] = g.history[item.tech] || [];
  g.history[item.tech].push(item.text);
  g.pool.splice(idx, 1);
  g.done.push(item);
  g.placed++;
  g.selected = null;

  if (ok) {
    g.correct++;
    g.roundCorrect++;
    SFX.correct();
  } else {
    SFX.wrong();
    g.wrongs.push({
      stem: item.text,
      picked: TECH_BY_KEY[techKey].name,
      right: TECH_BY_KEY[item.tech].name,
      explain: item.why
    });
  }

  g.lastFb = {
    ok: ok,
    text: (ok ? "放對了！" : "這句其實是「" + TECH_BY_KEY[item.tech].name + "」。") + item.why
  };

  var roundDone = g.done.length >= 5;
  renderSort();
  if (roundDone) {
    setTimeout(function () {
      if (g.round === 0) {
        showSheet(g.roundCorrect === 5, "第一回合完成",
          "這一回合你放對了 <b>" + g.roundCorrect + " / 5</b> 句。<br>下一回合會換上另外五句，五種手法同樣各佔一句。",
          "進入第二回合", function () {
            closeSheet();
            g.round = 1;
            buildRound();
            window.scrollTo(0, 0);
          });
      } else {
        finish();
      }
    }, 700);
  }
}

/* ---------------- 結算 ---------------- */
function finish() {
  var g = S.game, m = g.mode;
  closeSheet();
  var total = m.type === "sort" ? 10 : m.questions.length;
  var correct = g.correct;
  var stars = correct >= 9 ? 3 : correct >= 7 ? 2 : correct >= 5 ? 1 : 0;
  var prev = S.progress[m.id];
  if (!prev || correct > prev.correct) S.progress[m.id] = { correct: correct, total: total, stars: stars };
  S.lastResult = { id: m.id, mode: m, correct: correct, total: total, stars: stars, wrongs: g.wrongs.slice() };
  renderSummary();
  show("summary");
  if (stars >= 2) SFX.win(); else if (stars === 1) SFX.correct();
}

function quitGame() {

/* ---------------- 路由 ---------------- */
function go(page) {
  if (page === "home") { renderRoad(); show("home"); return; }
  if (page === "teach") { show("teach"); return; }
  if (page === "play") { renderPlay(); show("play"); return; }
  if (page === "challenge") { renderChallenge(); show("challenge"); return; }
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", function (e) {
  var t = e.target;
  if (!t || !t.closest) return;

  var nav = t.closest("[data-nav]");
  if (nav) { SFX.tap(); go(nav.getAttribute("data-nav")); return; }

  var mode = t.closest("[data-mode]");
  if (mode) { SFX.pick(); startMode(mode.getAttribute("data-mode")); return; }

  var tech = t.closest("[data-tech]");
  if (tech) {
    SFX.tap();
    var i = parseInt(tech.getAttribute("data-tech"), 10);
    renderTeach(i);
    var card = $("#teachCard");
    if (card && S.screen === "teach") {
      var top = card.getBoundingClientRect().top + window.pageYOffset - 80;
      window.scrollTo({ top: top, behavior: "smooth" });
    }
    return;
  }

  var act = t.closest("[data-action]");
  if (act && act.getAttribute("data-action") === "quit") { SFX.tap(); quitGame(); return; }
});

document.addEventListener("keydown", function (e) {
  if (S.screen !== "game") return;
  var g = S.game;
  if (!g) return;
  if (e.key === "Escape") { quitGame(); return; }
  if (!g.answered && g.mode.type === "bridge" && /^[1-3]$/.test(e.key)) {
    var bopts = $$("#bridgeOpts .opt");
    var bi = parseInt(e.key, 10) - 1;
    if (bopts[bi]) { e.preventDefault(); bopts[bi].click(); }
  }
  if (!g.answered && g.mode.type === "choice" && /^[1-5]$/.test(e.key)) {
    var i = parseInt(e.key, 10) - 1;
    if (g.mode.questions[g.q].options[i]) { e.preventDefault(); answer(i); }
  }
  if (g.answered && (e.key === "Enter" || e.key === " ")) {
    var b = $("#sheetNext");
    if (b && document.activeElement !== b) { e.preventDefault(); b.click(); }
  }
});

/* ---------------- 初始化 ---------------- */
function init() {
  $("#homeChips").innerHTML = TECH.map(function (t) {
    return '<span class="chip"><i style="background:' + t.color + '"></i>' + t.name + '</span>';
  }).join("");
  $("#homeArt1").innerHTML = ART.example;
  $("#homeArt2").innerHTML = ART.contrast;

  $("#brandHome").addEventListener("click", function () { SFX.tap(); go("home"); });

  var soundBtn = $("#soundBtn");
  soundBtn.addEventListener("click", function () {
    var muted = SFX.toggle();
    soundBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    soundBtn.setAttribute("aria-label", muted ? "開啟音效" : "關閉音效");
    var w1 = soundBtn.querySelector(".wave1"), w2 = soundBtn.querySelector(".wave2"), mx = soundBtn.querySelector(".mute-x");
    if (w1) w1.style.display = muted ? "none" : "";
    if (w2) w2.style.display = muted ? "none" : "";
    if (mx) mx.style.display = muted ? "" : "none";
    if (!muted) toast("音效已開啟");
  });

  renderTeach(-1);
  renderPlay();
  renderChallenge();
  renderRoad();
}

init();
})();
</script>
</body>
</html>
