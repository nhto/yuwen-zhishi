<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff7e9">
<title>描寫小偵探｜小學描寫手法互動遊戲</title>
<meta name="description" content="用小偵探闖關的方式，學會外貌、動作、語言、神態、心理五種描寫手法；42 道題目、每題附解說，手機、平板、電腦均可使用。">
<style>
:root{
  --ink:#2f2a44;
  --ink-soft:#5d5674;
  --cream:#fff7e9;
  --paper:#fffdf8;
  --coral:#ff8a71;
  --coral-deep:#e96b52;
  --teal:#3fb8a8;
  --teal-soft:#dcf7f1;
  --yellow:#ffc857;
  --yellow-soft:#fff2c9;
  --purple:#9b7bea;
  --pink:#f78fb3;
  --blue:#6fb7ff;
  --green:#7fc98b;
  --line:3px solid var(--ink);
  --radius:26px;
  --shadow:0 .4rem 0 rgba(47,42,68,.13);
  --shadow-strong:0 .6rem 0 rgba(47,42,68,.18);
}

*{box-sizing:border-box;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",system-ui,-apple-system,sans-serif;
  font-size:clamp(18px,1.2vw,20px);
  line-height:1.65;
  background:
    radial-gradient(circle at 8% 4%, #ffe6c9 0 10%, transparent 10.4%),
    radial-gradient(circle at 92% 10%, #d9f4ee 0 9%, transparent 9.4%),
    radial-gradient(circle at 86% 92%, #ffe3ec 0 11%, transparent 11.4%),
    var(--cream);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(47,42,68,.10) 1.6px, transparent 1.7px);
  background-size:26px 26px;
  opacity:.45;
  pointer-events:none;
  z-index:0;
}
button{font-family:inherit;color:inherit;}
button:focus-visible,a:focus-visible{outline:4px solid #2b7fff;outline-offset:3px;}
[hidden]{display:none !important;}
svg{display:block;}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem clamp(1rem,3vw,2.4rem);
  background:rgba(255,247,233,.92);
  backdrop-filter:blur(10px);
  border-bottom:3px solid rgba(47,42,68,.12);
}
.brand{display:flex;align-items:center;gap:.65rem;background:none;border:0;padding:.2rem;cursor:pointer;}
.brand-mark{width:clamp(2.6rem,4.4vw,3.3rem);height:auto;}
.brand-name{font-size:clamp(1.15rem,1.9vw,1.55rem);font-weight:900;letter-spacing:.04em;}
.brand-name span{color:var(--coral-deep);}
.top-actions{display:flex;align-items:center;gap:.65rem;}
.star-pill{
  display:flex;align-items:center;gap:.4rem;
  background:#fff;border:var(--line);border-radius:999px;
  padding:.35rem .9rem .35rem .55rem;font-weight:900;font-size:1.05rem;
  box-shadow:0 .22rem 0 rgba(47,42,68,.14);
}
.star-pill svg{width:1.5rem;height:1.5rem;}
.icon-btn{
  width:3rem;height:3rem;display:grid;place-items:center;
  background:#fff;border:var(--line);border-radius:1rem;cursor:pointer;
  box-shadow:0 .22rem 0 rgba(47,42,68,.14);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);}
.icon-btn svg{width:1.6rem;height:1.6rem;}
.icon-btn[aria-pressed="false"]{background:#efe9e1;color:#8b849e;}

main{flex:1;width:100%;}
.view{
  width:100%;max-width:1180px;margin:0 auto;
  padding:clamp(1.1rem,2.4vw,2.2rem) clamp(1rem,3vw,2.6rem) 4.5rem;
  animation:viewIn .32s ease both;
}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- shared bits ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.5rem;min-height:3.4rem;
  border:var(--line);border-radius:999px;background:#fff;
  font-size:clamp(1.02rem,1.6vw,1.18rem);font-weight:900;
  cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(3px);box-shadow:0 .1rem 0 rgba(47,42,68,.14);}
.btn svg{width:1.35rem;height:1.35rem;flex:0 0 auto;}
.btn-primary{background:var(--coral);}
.btn-yellow{background:var(--yellow);}
.btn-teal{background:var(--teal);}
.btn-purple{background:var(--purple);color:#fff;}
.btn-ghost{background:#fff;}
.btn-sm{padding:.55rem 1rem;min-height:2.7rem;font-size:.98rem;}

.section-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.section-head h1{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:0;line-height:1.25;font-weight:900;}
.section-head .sub{color:var(--ink-soft);font-size:1rem;margin:.15rem 0 0;}
.back-btn{
  width:3.2rem;height:3.2rem;flex:0 0 auto;display:grid;place-items:center;
  background:#fff;border:var(--line);border-radius:50%;cursor:pointer;
  box-shadow:var(--shadow);
}
.back-btn svg{width:1.5rem;height:1.5rem;}
.back-btn:active{transform:translateY(3px);box-shadow:none;}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(1rem,3vw,2.4rem);align-items:center;padding:.6rem 0 1.4rem;}
.eyebrow{
  display:inline-flex;align-items:center;gap:.45rem;
  background:var(--yellow-soft);border:2.5px solid var(--ink);border-radius:999px;
  padding:.28rem .85rem;font-size:.92rem;font-weight:900;letter-spacing:.05em;
}
.eyebrow i{width:.65rem;height:.65rem;border-radius:50%;background:var(--coral);display:inline-block;}
.hero h1{
  font-size:clamp(2.15rem,4.8vw,3.9rem);line-height:1.18;margin:.7rem 0 .8rem;font-weight:900;
  letter-spacing:.01em;
}
.hero h1 .hl{position:relative;z-index:0;color:var(--coral-deep);white-space:nowrap;}
.hero h1 .hl::after{
  content:"";position:absolute;left:0;right:0;bottom:.02em;height:.28em;
  background:rgba(255,200,87,.55);border-radius:999px;z-index:-1;
}
.hero-lead{font-size:clamp(1.05rem,1.7vw,1.25rem);color:var(--ink-soft);max-width:34em;margin:0 0 1.2rem;}
.hero-cta{display:flex;gap:.8rem;flex-wrap:wrap;}
.hero-mascot{display:grid;place-items:center;}
.hero-mascot svg{width:min(100%,420px);height:auto;filter:drop-shadow(0 14px 0 rgba(47,42,68,.10));}

.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:1.1rem;}
.gate{
  position:relative;text-align:left;background:var(--paper);border:var(--line);
  border-radius:28px;padding:1.25rem 1.25rem 1.35rem;cursor:pointer;
  box-shadow:var(--shadow-strong);transition:transform .15s ease,box-shadow .15s ease;
}
.gate:hover{transform:translateY(-5px);box-shadow:0 .8rem 0 rgba(47,42,68,.16);}
.gate:active{transform:translateY(3px);box-shadow:var(--shadow);}
.gate .tile{
  width:5rem;height:5rem;border-radius:1.35rem;border:var(--line);
  display:grid;place-items:center;margin-bottom:.8rem;
}
.gate .tile svg{width:3.2rem;height:3.2rem;}
.gate h3{margin:0;font-size:clamp(1.25rem,2vw,1.55rem);font-weight:900;}
.gate p{margin:.25rem 0 0;color:var(--ink-soft);font-size:.98rem;line-height:1.5;}
.gate .go{
  position:absolute;right:1.1rem;bottom:1.1rem;width:2.3rem;height:2.3rem;
  display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;
}
.gate .go svg{width:1.15rem;height:1.15rem;}
.gate.c1 .tile{background:#ffe1d8;}
.gate.c2 .tile{background:#dff7f2;}
.gate.c3 .tile{background:#ece2ff;}
.gate.c1 .go{background:var(--coral-deep);}
.gate.c2 .go{background:#2c9a8c;}
.gate.c3 .go{background:#7c5fd3;}

.home-note{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;justify-content:center;
  margin-top:1.6rem;color:var(--ink-soft);font-size:.95rem;
}
.home-note .chip{background:#fff;border:2px solid rgba(47,42,68,.28);border-radius:999px;padding:.2rem .7rem;font-weight:700;}

/* ---------- learn ---------- */
.tabs{display:flex;gap:.55rem;overflow-x:auto;padding:.25rem .15rem .9rem;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;display:flex;align-items:center;gap:.45rem;
  padding:.6rem 1rem;border-radius:999px;border:var(--line);background:#fff;
  font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 .2rem 0 rgba(47,42,68,.12);
}
.tab svg{width:1.35rem;height:1.35rem;}
.tab.active{background:var(--ink);color:#fff;}
.tab.active svg{color:#fff;}
.tab:active{transform:translateY(2px);box-shadow:none;}

.learn-grid{display:grid;grid-template-columns:.86fr 1.14fr;gap:clamp(1rem,2.4vw,1.8rem);align-items:start;}
.learn-art{
  position:relative;background:#fff;border:var(--line);border-radius:30px;
  padding:1rem;min-height:300px;display:grid;place-items:center;
  box-shadow:var(--shadow-strong);overflow:hidden;
}
.learn-art::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(47,42,68,.09) 1.5px, transparent 1.6px);
  background-size:20px 20px;opacity:.7;
}
.learn-art svg{position:relative;width:100%;max-width:410px;height:auto;}
.learn-art .sticker{
  position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:.25rem .7rem;font-size:.85rem;font-weight:900;box-shadow:0 .18rem 0 rgba(47,42,68,.14);
}
.learn-art .s1{top:1rem;left:1rem;transform:rotate(-5deg);}
.learn-art .s2{bottom:1rem;right:1rem;transform:rotate(4deg);}

.learn-body h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin:0 0 .1rem;font-weight:900;line-height:1.2;}
.learn-body .tagline{color:var(--coral-deep);font-weight:900;margin:0 0 .7rem;font-size:1.05rem;}
.definition{font-size:clamp(1.05rem,1.7vw,1.2rem);margin:0 0 1rem;}
.formula{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  background:var(--yellow-soft);border:2.5px dashed var(--ink);border-radius:18px;
  padding:.75rem 1rem;margin:0 0 1rem;font-weight:900;
}
.formula .label{background:var(--ink);color:#fff;border-radius:999px;padding:.1rem .6rem;font-size:.82rem;letter-spacing:.06em;}
.formula .eq{font-size:clamp(1.02rem,1.8vw,1.2rem);}
.points{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.65rem;}
.points li{display:flex;gap:.75rem;align-items:flex-start;background:#fff;border:2.5px solid rgba(47,42,68,.9);border-radius:16px;padding:.66rem .8rem;box-shadow:0 .18rem 0 rgba(47,42,68,.1);}
.points .num{
  flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;
  background:var(--yellow);border:2.5px solid var(--ink);font-weight:900;font-size:.98rem;
}
.points li:nth-child(2) .num{background:#bfe9ff;}
.points li:nth-child(3) .num{background:#ffd6e3;}
.points span{font-size:1.02rem;line-height:1.55;}

.example{background:#fff;border:var(--line);border-radius:20px;padding:.9rem 1rem;margin:0 0 1rem;}
.example .row{display:flex;gap:.6rem;align-items:flex-start;margin:.25rem 0;}
.example .badge{flex:0 0 auto;font-size:.78rem;font-weight:900;border-radius:999px;padding:.08rem .55rem;border:2px solid var(--ink);background:#eee;}
.example .badge.good{background:#c9f3e8;}
.example .txt{font-size:1.03rem;line-height:1.6;}
.example mark{background:linear-gradient(transparent 58%,#ffe08a 58%);font-weight:900;padding:0 .1em;}
.tip{
  display:flex;gap:.7rem;align-items:flex-start;
  background:#fff3f6;border:2.5px dashed #d97b9a;border-radius:18px;padding:.8rem .95rem;
  font-size:.98rem;line-height:1.6;
}
.tip .bulb{flex:0 0 auto;width:1.8rem;height:1.8rem;color:#d97b9a;}
.learn-cta{margin-top:1.1rem;display:flex;gap:.7rem;flex-wrap:wrap;}

/* ---------- practice menu ---------- */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.1rem;}
.mode-card{
  text-align:left;background:var(--paper);border:var(--line);border-radius:24px;
  padding:1.15rem;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:.55rem;
  transition:transform .15s ease,box-shadow .15s ease;
}
.mode-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-strong);}
.mode-card:active{transform:translateY(2px);}
.mode-card .top{display:flex;align-items:center;gap:.8rem;}
.mode-card .mode-icon{
  flex:0 0 auto;width:4.2rem;height:4.2rem;border-radius:1.15rem;border:var(--line);
  display:grid;place-items:center;
}
.mode-card .mode-icon svg{width:2.7rem;height:2.7rem;}
.mode-card h3{margin:0;font-size:1.2rem;font-weight:900;line-height:1.3;}
.mode-card .kicker{font-size:.82rem;font-weight:900;color:var(--ink-soft);letter-spacing:.06em;}
.mode-card p{margin:0;color:var(--ink-soft);font-size:.95rem;line-height:1.5;}
.mode-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.35rem;}
.q-count{font-size:.85rem;font-weight:900;background:#fff;border:2px solid rgba(47,42,68,.3);border-radius:999px;padding:.12rem .6rem;}
.mini-stars{display:flex;gap:.15rem;}
.mini-stars svg{width:1.15rem;height:1.15rem;color:#ded7e8;}
.mini-stars svg.on{color:var(--yellow);}
.mode-card.c-appearance .mode-icon{background:#ffe1ec;}
.mode-card.c-action .mode-icon{background:#dff7f2;}
.mode-card.c-speech .mode-icon{background:#e2efff;}
.mode-card.c-expression .mode-icon{background:#fff0c9;}
.mode-card.c-psychology .mode-icon{background:#ece2ff;}
.mode-card.c-challengeSort .mode-icon,.mode-card.c-challengePick .mode-icon{background:#ffe3d8;}

.challenge-band{
  margin-top:1.8rem;padding:1.2rem;border:var(--line);border-radius:26px;
  background:linear-gradient(120deg,#ffe9de,#fff6e2 55%,#e7f8f3);
  box-shadow:var(--shadow);
}
.challenge-band h2{margin:0 0 .2rem;font-size:clamp(1.4rem,2.4vw,1.8rem);display:flex;align-items:center;gap:.5rem;}
.challenge-band h2 svg{width:1.9rem;height:1.9rem;color:var(--coral-deep);}
.challenge-band p{margin:0 0 1rem;color:var(--ink-soft);font-size:.98rem;}

/* ---------- game ---------- */
.game{max-width:940px;margin:0 auto;}
.game-top{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
.game-top .titles{min-width:0;}
.game-top .kicker{font-size:.82rem;font-weight:900;letter-spacing:.08em;color:var(--ink-soft);}
.game-top h2{margin:0;font-size:clamp(1.35rem,2.6vw,1.8rem);line-height:1.25;}
.game-score{
  margin-left:auto;display:flex;align-items:center;gap:.45rem;
  background:#fff;border:var(--line);border-radius:999px;padding:.3rem .85rem;
  font-weight:900;font-size:1.05rem;box-shadow:0 .2rem 0 rgba(47,42,68,.12);
}
.game-score svg{width:1.35rem;height:1.35rem;}
.progress-row{display:flex;align-items:center;gap:.8rem;margin:.9rem 0 .2rem;flex-wrap:wrap;}
.dots{display:flex;gap:.42rem;flex-wrap:wrap;}
.dot{width:.78rem;height:.78rem;border-radius:50%;background:#ded6e9;transition:background .2s,transform .2s;}
.dot.done{background:var(--teal);}
.dot.cur{background:var(--yellow);transform:scale(1.25);box-shadow:0 0 0 2.5px var(--ink);}
.progress-text{font-size:.9rem;font-weight:900;color:var(--ink-soft);}
.timer-wrap{margin:.6rem 0 0;height:.85rem;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));transition:width .1s linear;}
.timer-bar.low{background:linear-gradient(90deg,#ff9b7d,#e9553d);}

.qcard{
  background:var(--paper);border:var(--line);border-radius:28px;
  padding:clamp(1.1rem,2.6vw,1.9rem);box-shadow:var(--shadow-strong);
  margin-top:.9rem;
}
.qhead{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.7rem;}
.qbadge{font-size:.8rem;font-weight:900;letter-spacing:.08em;background:var(--ink);color:#fff;border-radius:999px;padding:.15rem .7rem;}
.qhint{font-size:.95rem;color:var(--ink-soft);font-weight:700;}
.qtext{font-size:clamp(1.24rem,2.5vw,1.72rem);font-weight:800;line-height:1.7;margin:0 0 1.1rem;letter-spacing:.01em;}
.qtext .quote{color:var(--coral-deep);}

.options{display:grid;gap:.8rem;}
.opt{
  display:flex;align-items:center;gap:.85rem;text-align:left;
  padding:.85rem 1rem;min-height:3.7rem;
  background:#fff;border:var(--line);border-radius:18px;
  font-size:clamp(1.04rem,2vw,1.22rem);font-weight:700;line-height:1.55;
  cursor:pointer;box-shadow:0 .2rem 0 rgba(47,42,68,.1);
  transition:transform .12s,background .12s,box-shadow .12s;
}
.opt:hover{transform:translateY(-2px);}
.opt .badge{
  flex:0 0 auto;width:2.15rem;height:2.15rem;border-radius:50%;
  display:grid;place-items:center;border:2.5px solid var(--ink);
  background:#f3eefb;font-weight:900;font-size:1rem;
}
.opt.selected{background:var(--yellow-soft);box-shadow:0 0 0 3px #ffcf5c inset;}
.opt.correct{background:#d6f6ee;border-color:#1e8a78;}
.opt.correct .badge{background:#8fe3d3;}
.opt.wrong{background:#ffe4de;border-color:#c94b3c;}
.opt.wrong .badge{background:#ffb4a5;}
.opt:disabled{cursor:default;opacity:1;}
.opt.dim{opacity:.45;}

.avatar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
.avatar-card{
  background:#fff;border:var(--line);border-radius:20px;padding:.45rem .45rem .55rem;
  cursor:pointer;box-shadow:0 .2rem 0 rgba(47,42,68,.1);
  transition:transform .12s,box-shadow .12s,background .12s;
}
.avatar-card:hover{transform:translateY(-3px);}
.avatar-card svg{width:100%;height:auto;border-radius:14px;}
.avatar-card .label{
  display:block;text-align:center;font-weight:900;font-size:1rem;margin-top:.15rem;
}
.avatar-card.selected{background:var(--yellow-soft);box-shadow:0 0 0 3px #ffcf5c inset;}
.avatar-card.correct{background:#d6f6ee;box-shadow:0 0 0 3px #2aa48f inset;}
.avatar-card.wrong{background:#ffe4de;box-shadow:0 0 0 3px #c94b3c inset;}

.order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;}
.order-card{
  position:relative;text-align:left;background:#fff;border:var(--line);border-radius:18px;
  padding:1rem .85rem;min-height:5.2rem;font-size:1.05rem;font-weight:800;line-height:1.45;
  cursor:pointer;box-shadow:0 .2rem 0 rgba(47,42,68,.1);
}
.order-card .idx{
  position:absolute;top:-.65rem;left:-.45rem;width:1.9rem;height:1.9rem;border-radius:50%;
  background:var(--yellow);border:2.5px solid var(--ink);display:none;place-items:center;
  font-weight:900;font-size:.92rem;
}
.order-card.picked{background:var(--yellow-soft);}
.order-card.picked .idx{display:grid;}
.order-card.correct{background:#d6f6ee;border-color:#1e8a78;}
.order-card.wrong{background:#ffe4de;border-color:#c94b3c;}

.sentence{
  font-size:clamp(1.3rem,2.5vw,1.72rem);font-weight:800;
  line-height:2.25;margin:0 0 1.1rem;letter-spacing:.02em;
}
.sentence .plain{display:inline;}
.sentence .chip{
  display:inline-block;vertical-align:baseline;
  background:#fff;border:2.5px solid var(--ink);border-radius:10px;
  padding:.05em .24em;margin:0 .05em;font:inherit;font-weight:800;line-height:1.35;
  cursor:pointer;box-shadow:0 .14rem 0 rgba(47,42,68,.1);
}
.sentence .chip.selected{background:var(--yellow-soft);}
.sentence .chip.correct{background:#bff0e5;border-color:#1e8a78;}
.sentence .chip.missed{background:#fff3c4;border-color:#c99b1a;box-shadow:0 0 0 3px #ffd75e inset;}
.sentence .chip.wrong{background:#ffd9d1;border-color:#c94b3c;}

.gamecta{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.1rem;align-items:center;}
.gamecta .note{font-size:.92rem;color:var(--ink-soft);font-weight:700;}

/* ---------- feedback ---------- */
.feedback{
  margin-top:1.1rem;border:var(--line);border-radius:24px;padding:1rem 1.15rem 1.15rem;
  background:#e2faf4;box-shadow:var(--shadow);animation:pop .28s ease both;
}
.feedback.bad{background:#fff0ea;}
.feedback.timed{background:#fff7dd;}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
.fb-head{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
.fb-icon{width:2.9rem;height:2.9rem;flex:0 0 auto;}
.fb-title{font-size:clamp(1.2rem,2.2vw,1.45rem);font-weight:900;}
.fb-answer{font-size:.98rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:.2rem .7rem;margin-left:auto;max-width:100%;line-height:1.55;text-align:left;}
.fb-explain{margin:.65rem 0 0;font-size:clamp(1rem,1.7vw,1.12rem);line-height:1.7;}
.fb-explain strong{color:var(--coral-deep);}
.feedback .btn{margin-top:.9rem;}

/* ---------- result ---------- */
.result-wrap{max-width:720px;margin:1rem auto 0;}
.result-card{
  background:var(--paper);border:var(--line);border-radius:34px;
  padding:clamp(1.4rem,4vw,2.6rem);text-align:center;box-shadow:var(--shadow-strong);
  position:relative;overflow:hidden;
}
.result-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 10% 0%,#ffe6c9 0 18%,transparent 18.4%),
             radial-gradient(circle at 92% 8%,#d9f4ee 0 16%,transparent 16.4%);
  opacity:.9;pointer-events:none;
}
.result-card > *{position:relative;}
.result-mascot{width:clamp(8.6rem,19vw,12rem);margin:0 auto .4rem;}
.result-card h2{margin:0 0 .2rem;font-size:clamp(1.8rem,3.6vw,2.5rem);}
.result-sub{color:var(--ink-soft);margin:0 0 1rem;font-size:1.05rem;}
.stars-row{display:flex;justify-content:center;gap:.7rem;margin:.3rem 0 1rem;}
.stars-row .star{width:clamp(3.2rem,8vw,4.4rem);height:auto;color:#e2dbe9;}
.stars-row .star.on{color:var(--yellow);animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both;}
.stars-row .star.on:nth-child(2){animation-delay:.12s;}
.stars-row .star.on:nth-child(3){animation-delay:.24s;}
@keyframes starPop{from{transform:scale(.4) rotate(-18deg);opacity:0;}to{transform:none;opacity:1;}}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin:0 auto 1.2rem;max-width:26rem;}
.score-box{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:.65rem .8rem;}
.score-box .k{font-size:.85rem;color:var(--ink-soft);font-weight:800;}
.score-box .v{font-size:clamp(1.5rem,3vw,2rem);font-weight:900;line-height:1.2;}
.result-actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;}
.result-tip{margin:1rem 0 0;font-size:.95rem;color:var(--ink-soft);}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(200%);
  background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:999px;
  font-weight:800;font-size:.95rem;z-index:80;transition:transform .3s ease;
  box-shadow:0 8px 24px rgba(47,42,68,.28);max-width:calc(100vw - 2rem);text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;text-align:center;padding-top:.2rem;}
  .hero-copy{order:2;}
  .hero-mascot{order:1;}
  .hero-mascot svg{width:min(72vw,330px);}
  .hero-lead{margin-left:auto;margin-right:auto;}

  .gates{grid-template-columns:1fr;}
  .gate{display:grid;grid-template-columns:auto 1fr;gap:0 1rem;align-items:center;padding:1rem 1.1rem;}
  .gate .tile{grid-row:span 2;margin:0;width:4.4rem;height:4.4rem;}
  .gate .tile svg{width:2.8rem;height:2.8rem;}
  .gate .go{display:none;}
  .learn-grid{grid-template-columns:1fr;}
  .learn-art{min-height:230px;}
  .learn-art svg{max-width:300px;}
  .game-top h2{font-size:1.4rem;}
  .game-score{font-size:.98rem;}
}
@media (max-width:560px){
  html{font-size:15.5px;}
  .brand-name{font-size:1.02rem;}
  .star-pill{padding:.28rem .65rem .28rem .4rem;font-size:.95rem;}
  .star-pill svg{width:1.25rem;height:1.25rem;}
  .icon-btn{width:2.7rem;height:2.7rem;border-radius:.85rem;}
  .topbar{gap:.4rem;padding:.55rem .8rem;}
  .view{padding-left:.85rem;padding-right:.85rem;}
  .hero h1{font-size:clamp(1.95rem,9vw,2.6rem);}
  .hero-lead{font-size:1.02rem;}
  .hero-cta .btn{width:auto;flex:1 1 44%;padding:.8rem 1rem;}
  .learn-cta .btn{width:100%;}
  .tabs{flex-wrap:wrap;overflow:visible;gap:.45rem;padding-bottom:.7rem;}
  .tab{padding:.5rem .78rem;font-size:.98rem;}
  .section-head{gap:.7rem;}
  .back-btn{width:2.8rem;height:2.8rem;}
  .mode-grid{grid-template-columns:1fr;}
  .challenge-band{padding:.9rem;}
  .avatar-grid{gap:.45rem;}
  .avatar-card{padding:.3rem .3rem .45rem;border-radius:16px;}
  .avatar-card .label{font-size:.82rem;}
  .order-grid{grid-template-columns:1fr 1fr;}
  .order-card{min-height:4.6rem;padding:.75rem .65rem;font-size:.98rem;}
  .sentence{font-size:1.22rem;line-height:2.15;}
  .sentence .chip{padding:.04em .2em;}
  .game-top{gap:.6rem;}
  .game-top .titles{flex:1 1 60%;}
  .game-score{margin-left:0;}
  .qtext{font-size:1.21rem;line-height:1.75;}

@media (min-width:561px) and (max-width:900px){

  .gate .go{position:absolute;right:.8rem;bottom:.8rem;}

<script>
/* =========================================================

(function () {
  'use strict';

  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  const state = {
    view: 'home',
    learnKey: 'appearance',
    modeKey: null,
    mode: null,
    index: 0,
    correct: 0,
    score: 0,
    locked: false,
    picked: [],
    orderItems: [],
    timerId: null,
    deadline: 0,
    timerActive: false,
    pausedRemaining: 0
  };

  /* ---------- 星星紀錄 ---------- */
  let starData = {};
  try {
    const raw = localStorage.getItem('miaoxie-stars');
    starData = raw ? JSON.parse(raw) : {};
    if (!starData || typeof starData !== 'object') starData = {};
  } catch (e) { starData = {}; }

  function totalStars() {
    return Object.keys(starData).reduce(function (sum, k) {
      const v = parseInt(starData[k], 10);
      return sum + (isNaN(v) ? 0 : v);
    }, 0);
  }
  function updateStarPill() {
    const el = $('#starTotal');
    if (el) el.textContent = String(totalStars());
  }
  function saveStars() {
    try { localStorage.setItem('miaoxie-stars', JSON.stringify(starData)); } catch (e) { /* 私密模式或空間不足時只保留今次進度 */ }
  }

  /* ---------- 音效 ---------- */
  let audioCtx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('miaoxie-sound') !== '0'; } catch (e) { /* 使用預設開啟 */ }

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') { audioCtx.resume().catch(function () {}); }
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  }

  function tone(freq, dur, type, delay, vol) {
    if (!soundOn || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
      const t = audioCtx.currentTime + (delay || 0);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.09, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    } catch (e) { /* 音效失敗不影響遊戲 */ }
  }
  function sfxClick() { tone(540, 0.07, 'triangle', 0, 0.05); }
  function sfxPick() { tone(660, 0.06, 'sine', 0, 0.05); }
  function sfxCorrect() {
    tone(523.25, 0.14, 'sine', 0, 0.09);
    tone(659.25, 0.14, 'sine', 0.09, 0.09);
    tone(783.99, 0.2, 'sine', 0.18, 0.09);
  }
  function sfxWrong() {
    tone(220, 0.16, 'sawtooth', 0, 0.05);
    tone(164.81, 0.22, 'sawtooth', 0.15, 0.05);
  }
  function sfxWin() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      tone(f, 0.2, 'triangle', i * 0.11, 0.085);
    });
  }

  /* ---------- 通用工具 ---------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function escapeText(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function highlight(text, words) {
    let out = escapeText(text);
    words.forEach(function (w) {
      out = out.split(escapeText(w)).join('<mark>' + escapeText(w) + '</mark>');
    });
    return out;
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  /* ---------- 視圖切換 ---------- */
  function showView(name) {
    $$('.view').forEach(function (v) { v.hidden = true; });
    const target = $('#view-' + name);
    if (target) target.hidden = false;
    state.view = name;
    window.scrollTo(0, 0);
  }

  function go(name) {
    if (name === 'home') {
      stopTimer();
      showView('home');
      updateStarPill();
      return;
    }
    if (name === 'learn') {
      stopTimer();
      renderLearn(state.learnKey);
      showView('learn');
      return;
    }
    if (name === 'practice') {
      stopTimer();
      renderPractice();
      showView('practice');
      return;
    }
  }

  /* ---------- 教學區 ---------- */
  function renderLearn(key) {
    const item = LEARN.find(function (l) { return l.key === key; }) || LEARN[0];
    state.learnKey = item.key;

    $('#learnTabs').innerHTML = LEARN.map(function (l) {
      return '<button class="tab' + (l.key === item.key ? ' active' : '') + '" data-learn="' + l.key + '" aria-pressed="' + (l.key === item.key) + '">' +
        icon(l.key) + '<span>' + l.name + '</span></button>';
    }).join('');

    $('#learnArt').innerHTML = LEARN_ART[item.key] +
      '<span class="sticker s1">' + item.tagline + '</span>' +
      '<span class="sticker s2">看圖學描寫</span>';

    $('#learnBody').innerHTML =
      '<h2>' + item.name + '</h2>' +
      '<p class="tagline">' + item.tagline + '</p>' +
      '<p class="definition">' + item.intro + '</p>' +
      '<div class="formula"><span class="label">口訣</span><span class="eq">' + item.formula + '</span></div>' +
      '<ul class="points">' + item.points.map(function (p, i) {
        return '<li><span class="num">' + (i + 1) + '</span><span>' + p + '</span></li>';
      }).join('') + '</ul>' +
      '<div class="example">' +
        '<div class="row"><span class="badge">普通</span><span class="txt">' + escapeText(item.before) + '</span></div>' +
        '<div class="row"><span class="badge good">生動</span><span class="txt">' + highlight(item.after, item.highlights) + '</span></div>' +
      '</div>' +
      '<div class="tip"><span class="bulb">' + icon('bulb') + '</span><span><strong>小提醒：</strong>' + item.tip + '</span></div>' +
      '<div class="learn-cta"><button class="btn btn-primary" data-start="' + item.key + '">去練習這種描寫' + icon('arrow') + '</button></div>';
  }

  /* ---------- 練習選單 ---------- */
  function modeCard(key) {
    const m = MODES[key];
    const best = starData[key] || 0;
    return '<button class="mode-card c-' + m.cat + '" data-mode="' + key + '">' +
      '<div class="top"><span class="mode-icon">' + icon(m.icon) + '</span>' +
      '<div><span class="kicker">' + m.kicker + '</span><h3>' + m.title + '</h3></div></div>' +
      '<p>' + m.desc + '</p>' +
      '<div class="foot"><span class="q-count">' + m.count + ' 題</span><span class="mini-stars" aria-label="最佳成績 ' + best + ' 星">' + starsMarkup(best) + '</span></div>' +
      '</button>';
  }

  function renderPractice() {
    const keys = ['appearance', 'action', 'speech', 'expression', 'psychology'];
    const challenges = ['challengeSort', 'challengePick'];
    $('#practiceGrid').innerHTML = keys.map(modeCard).join('');
    $('#challengeGrid').innerHTML = challenges.map(modeCard).join('');
    updateStarPill();
  }

  /* ---------- 開始遊戲 ---------- */
  function startMode(key) {
    const mode = MODES[key];
    if (!mode) return;
    state.modeKey = key;
    state.mode = mode;
    state.index = 0;
    state.correct = 0;
    state.score = 0;
    state.locked = false;
    state.picked = [];
    state.pausedRemaining = 0;
    stopTimer();
    $('#gameKicker').textContent = mode.kicker;
    $('#gameTitle').textContent = mode.title;
    showView('game');
    renderQuestion();
  }

  function renderProgress() {
    const m = state.mode;
    const dots = [];
    for (let i = 0; i < m.count; i++) {
      const cls = i < state.index ? 'dot done' : (i === state.index ? 'dot cur' : 'dot');
      dots.push('<span class="' + cls + '"></span>');
    }
    $('#progressDots').innerHTML = dots.join('');
    $('#progressText').textContent = '第 ' + (state.index + 1) + ' / ' + m.count + ' 題';
    $('#gameScore').textContent = String(state.score);
  }

  function renderQuestion() {
    const m = state.mode;
    const q = m.bank[state.index];
    state.locked = false;
    state.picked = [];
    state.pausedRemaining = 0;
    $('#feedbackHost').innerHTML = '';
    $('#timerWrap').hidden = true;
    $('#timerBar').style.width = '100%';
    $('#timerBar').classList.remove('low');
    renderProgress();

    const qcard = $('#qcard');
    if (m.type === 'avatar') qcard.innerHTML = buildAvatar(q);
    else if (m.type === 'order') qcard.innerHTML = buildOrder(q);
    else if (m.type === 'choice') qcard.innerHTML = buildChoice(q);
    else if (m.type === 'wordtap') qcard.innerHTML = buildWordtap(q);
    else if (m.type === 'sortcat') qcard.innerHTML = buildSortcat(q);
    else if (m.type === 'pick') { qcard.innerHTML = buildPick(q); startTimer(m.timeLimit); }

    bindQuestion(q);
  }

  /* ---------- 題型：外貌頭像 ---------- */
  function buildAvatar(q) {
    const labels = ['甲', '乙', '丙'];
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">讀一讀，哪位人物的特徵完全符合？</span></div>' +
      '<p class="qtext">「' + escapeText(q.text) + '」</p>' +
      '<div class="avatar-grid">' + q.options.map(function (o, i) {
        return '<button class="avatar-card" data-opt="' + i + '" aria-label="選項' + labels[i] + '">' +
          avatarSVG(o.avatar) + '<span class="label">' + labels[i] + '</span></button>';
      }).join('') + '</div>';
  }

  /* ---------- 題型：動作排序 ---------- */
  function buildOrder(q) {
    state.orderItems = shuffle(q.items.map(function (_, i) { return i; }));
    let guard = 0;
    while (state.orderItems.every(function (v, i) { return v === i; }) && q.items.length > 1 && guard < 20) {
      state.orderItems = shuffle(state.orderItems);
      guard++;
    }
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">按事情先後順序，依次點選四張卡</span></div>' +
      '<p class="qtext">' + escapeText(q.prompt) + '</p>' +
      '<div class="order-grid">' + state.orderItems.map(function (itemIndex) {
        return '<button class="order-card" data-item="' + itemIndex + '">' +
          '<span class="idx"></span>' + escapeText(q.items[itemIndex]) + '</button>';
      }).join('') + '</div>' +
      '<div class="gamecta"><button class="btn btn-teal" id="checkOrder" disabled>確認順序' + icon('check') + '</button>' +
      '<button class="btn btn-ghost btn-sm" id="resetOrder">重新排</button>' +
      '<span class="note" id="orderNote">已選 0 / ' + q.items.length + '</span></div>';
  }

  /* ---------- 題型：選擇 ---------- */
  function buildChoice(q) {
    const letters = ['A', 'B', 'C', 'D'];
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">' + escapeText(q.hint || '選出最適合的一個答案') + '</span></div>' +
      '<p class="qtext">' + escapeText(q.prompt || q.text) + '</p>' +
      '<div class="options">' + q.options.map(function (o, i) {
        return '<button class="opt" data-opt="' + i + '"><span class="badge">' + letters[i] + '</span><span>' + escapeText(o) + '</span></button>';
      }).join('') + '</div>';
  }

  /* ---------- 題型：神態詞語 ---------- */
  function buildWordtap(q) {
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">點出兩個描寫神態的詞語</span></div>' +
      '<p class="sentence">' + q.tokens.map(function (tok, i) {
        if (tok.ok || tok.no) {
          return '<button class="chip" data-chip="' + i + '">' + escapeText(tok.t) + '</button>';
        }
        return '<span class="plain">' + escapeText(tok.t) + '</span>';
      }).join('') + '</p>' +
      '<div class="gamecta"><button class="btn btn-teal" id="checkChips" disabled>確認答案' + icon('check') + '</button>' +
      '<span class="note" id="chipNote">已選 0 / 2 個詞語</span></div>';
  }

  /* ---------- 題型：分類王 ---------- */
  function buildSortcat(q) {
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">這是哪一種描寫手法？</span></div>' +
      '<p class="qtext">「' + escapeText(q.text) + '」</p>' +
      '<div class="options">' + SORT_CATS.map(function (c, i) {
        return '<button class="opt" data-opt="' + i + '"><span class="badge">' + icon(c.key) + '</span><span>' + c.name + '描寫</span></button>';
      }).join('') + '</div>';
  }

  /* ---------- 題型：限時選句 ---------- */
  function buildPick(q) {
    const letters = ['A', 'B', 'C'];
    return '<div class="qhead"><span class="qbadge">第 ' + (state.index + 1) + ' 題</span>' +
      '<span class="qhint">20 秒內找出正確句子</span></div>' +
      '<p class="qtext">哪一句是「<span class="quote">' + escapeText(q.typeName) + '</span>」？</p>' +
      '<div class="options">' + q.options.map(function (o, i) {
        return '<button class="opt" data-opt="' + i + '"><span class="badge">' + letters[i] + '</span><span>' + escapeText(o) + '</span></button>';
      }).join('') + '</div>';
  }

  /* ---------- 綁定 ---------- */
  function bindQuestion(q) {
    const qcard = $('#qcard');
    const type = state.mode.type;

    if (type === 'avatar' || type === 'choice' || type === 'sortcat' || type === 'pick') {
      $$('.opt, .avatar-card', qcard).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (state.locked) return;
          const idx = parseInt(btn.getAttribute('data-opt'), 10);
          sfxClick();
          commitChoice(idx);
        });
      });
      return;
    }

    if (type === 'order') {
      $$('.order-card', qcard).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (state.locked) return;
          const idx = parseInt(btn.getAttribute('data-item'), 10);
          const pos = state.picked.indexOf(idx);
          if (pos > -1) {
            state.picked.splice(pos, 1);
            sfxClick();
          } else {
            if (state.picked.length >= q.items.length) return;
            state.picked.push(idx);
            sfxPick();
          }
          refreshOrderUI(q);
        });
      });
      $('#resetOrder').addEventListener('click', function () {
        if (state.locked) return;
        state.picked = [];
        sfxClick();
        refreshOrderUI(q);
      });
      $('#checkOrder').addEventListener('click', function () {
        if (state.locked || state.picked.length !== q.items.length) return;
        commitOrder(q);
      });
      return;
    }

    if (type === 'wordtap') {
      $$('.chip', qcard).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (state.locked) return;
          const idx = parseInt(btn.getAttribute('data-chip'), 10);
          const pos = state.picked.indexOf(idx);
          if (pos > -1) {
            state.picked.splice(pos, 1);
            sfxClick();
          } else {
            if (state.picked.length >= 2) {
              toast('只需選兩個詞語，點一下已選的可以取消');
              return;
            }
            state.picked.push(idx);
            sfxPick();
          }
          refreshChipUI(q);
        });
      });
      $('#checkChips').addEventListener('click', function () {
        if (state.locked || state.picked.length !== 2) return;
        commitChips(q);
      });
    }
  }

  function refreshOrderUI(q) {
    $$('.order-card', $('#qcard')).forEach(function (btn) {
      const idx = parseInt(btn.getAttribute('data-item'), 10);
      const pos = state.picked.indexOf(idx);
      btn.classList.toggle('picked', pos > -1);
      const badge = $('.idx', btn);
      badge.textContent = pos > -1 ? String(pos + 1) : '';
    });
    $('#orderNote').textContent = '已選 ' + state.picked.length + ' / ' + q.items.length;
    $('#checkOrder').disabled = state.picked.length !== q.items.length;
  }

  function refreshChipUI(q) {
    $$('.chip', $('#qcard')).forEach(function (btn) {
      const idx = parseInt(btn.getAttribute('data-chip'), 10);
      btn.classList.toggle('selected', state.picked.indexOf(idx) > -1);
    });
    $('#chipNote').textContent = '已選 ' + state.picked.length + ' / 2 個詞語';
    $('#checkChips').disabled = state.picked.length !== 2;
  }

  /* ---------- 判定 ---------- */
  function commitChoice(idx) {
    const q = state.mode.bank[state.index];
    const ok = idx === q.answer;
    state.locked = true;
    stopTimer();

    $$('.opt, .avatar-card', $('#qcard')).forEach(function (btn) {
      const i = parseInt(btn.getAttribute('data-opt'), 10);
      if (i === q.answer) btn.classList.add('correct');
      else if (i === idx) btn.classList.add('wrong');
      else btn.classList.add('dim');
      btn.disabled = true;
    });

    settle(ok, q, idx, false);
  }

  function commitOrder(q) {
    const ok = state.picked.every(function (v, i) { return v === i; });
    state.locked = true;
    $$('.order-card', $('#qcard')).forEach(function (btn) {
      const idx = parseInt(btn.getAttribute('data-item'), 10);
      const pos = state.picked.indexOf(idx);
      if (pos === idx) btn.classList.add('correct');
      else btn.classList.add('wrong');
    });
    $('#checkOrder').disabled = true;
    $('#resetOrder').disabled = true;
    settle(ok, q, null, false);
  }

  function commitChips(q) {
    const picked = state.picked.slice().sort(function (a, b) { return a - b; });
    const ans = [];
    q.tokens.forEach(function (tok, i) { if (tok.ok) ans.push(i); });
    const ok = picked.length === ans.length && picked.every(function (v, i) { return v === ans[i]; });
    state.locked = true;

    $$('.chip', $('#qcard')).forEach(function (btn) {
      const idx = parseInt(btn.getAttribute('data-chip'), 10);
      const isAns = ans.indexOf(idx) > -1;
      const isPick = picked.indexOf(idx) > -1;
      if (isAns && isPick) btn.classList.add('correct');
      else if (isAns) btn.classList.add('missed');
      else if (isPick) btn.classList.add('wrong');
    });
    $('#checkChips').disabled = true;
    settle(ok, q, null, false);
  }

  function answerLabel(q) {
    const type = state.mode.type;
    if (type === 'avatar') return ['甲', '乙', '丙'][q.answer];
    if (type === 'sortcat') return SORT_CATS[q.answer].name + '描寫';
    if (type === 'wordtap') return q.tokens.filter(function (t) { return t.ok; }).map(function (t) { return t.t; }).join('、');
    if (type === 'order') return q.items.join(' → ');
    if (type === 'pick' || type === 'choice') return ['A', 'B', 'C', 'D'][q.answer] + '. ' + q.options[q.answer];
    return '';
  }

  function settle(ok, q, choice, timedOut) {
    if (ok) {
      state.correct++;
      state.score += 10;
      sfxCorrect();
    } else {
      sfxWrong();
    }
    $('#gameScore').textContent = String(state.score);
    renderFeedback(ok, q, timedOut);
  }

  function renderFeedback(ok, q, timedOut) {
    const last = state.index + 1 >= state.mode.count;
    const cls = timedOut ? 'timed' : (ok ? '' : 'bad');
    const title = timedOut ? '時間到！' : (ok ? '答對了！' : '再看看這一句');
    const iconMark = timedOut ? icon('clock') : (ok ? icon('check') : icon('cross'));
    const iconCls = timedOut ? 'no' : (ok ? 'ok' : 'no');

    const html = '<div class="feedback ' + cls + '" role="status" aria-live="polite">' +
      '<div class="fb-head"><span class="fb-icon ' + iconCls + '">' + iconMark + '</span>' +
      '<span class="fb-title">' + title + '</span>' +
      '<span class="fb-answer">正確答案：' + escapeText(answerLabel(q)) + '</span></div>' +
      '<p class="fb-explain"><strong>解說：</strong>' + escapeText(q.explain) + '</p>' +
      '<button class="btn ' + (ok ? 'btn-teal' : 'btn-primary') + '" id="nextBtn">' + (last ? '看成績' : '下一題') + icon('arrow') + '</button>' +
      '</div>';

    $('#feedbackHost').innerHTML = html;
    $('#nextBtn').addEventListener('click', function () {
      sfxClick();
      if (last) finishMode();
      else { state.index++; renderQuestion(); }
    });

    const fb = $('.feedback');
    if (fb) {
      setTimeout(function () {
        try { fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { fb.scrollIntoView(); }
      }, 60);
    }
  }

  /* ---------- 計時器 ---------- */
  function startTimer(seconds) {
    const wrap = $('#timerWrap');
    const bar = $('#timerBar');
    wrap.hidden = false;
    bar.style.width = '100%';
    bar.classList.remove('low');
    state.deadline = performance.now() + seconds * 1000;
    state.timerActive = true;
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(tickTimer, 100);
    tickTimer();
  }

  function tickTimer() {
    if (!state.timerActive || !state.mode || !state.mode.timeLimit) return;
    const total = state.mode.timeLimit * 1000;
    const left = state.deadline - performance.now();
    const pct = Math.max(0, Math.min(1, left / total));
    const bar = $('#timerBar');
    if (bar) {
      bar.style.width = (pct * 100).toFixed(1) + '%';
      bar.classList.toggle('low', pct < 0.3);
    }
    if (left <= 0) {
      stopTimer();
      if (!state.locked) {
        state.locked = true;
        const q = state.mode.bank[state.index];
        $$('.opt', $('#qcard')).forEach(function (btn) {
          const i = parseInt(btn.getAttribute('data-opt'), 10);
          if (i === q.answer) btn.classList.add('correct');
          btn.disabled = true;
        });
        settle(false, q, -1, true);
      }
    }
  }

  function stopTimer() {
    state.timerActive = false;
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (state.timerActive) {
        state.pausedRemaining = Math.max(0, state.deadline - performance.now());
        stopTimer();
      }
    } else if (state.pausedRemaining > 0 && state.view === 'game' && !state.locked) {
      const remain = state.pausedRemaining / 1000;
      state.pausedRemaining = 0;
      startTimer(remain);
    }
  });

  /* ---------- 結算 ---------- */
  function starFor(correct, total) {
    if (correct >= total) return 3;
    if (correct >= Math.ceil(total * 0.66)) return 2;
    if (correct >= Math.ceil(total * 0.33)) return 1;
    return 0;
  }

  function finishMode() {
    stopTimer();
    const m = state.mode;
    const stars = starFor(state.correct, m.count);
    const prev = starData[state.modeKey] || 0;
    if (stars > prev) {
      starData[state.modeKey] = stars;
      saveStars();
    }
    updateStarPill();

    let title = '再試一次吧！';
    if (stars === 3) title = '太厲害了！';
    else if (stars === 2) title = '做得很好！';
    else if (stars === 1) title = '繼續加油！';

    $('#resultMascot').innerHTML = MASCOT;
    $('#resultTitle').textContent = title;
    $('#resultSub').textContent = m.title + ' · 答對 ' + state.correct + ' / ' + m.count + ' 題';
    $('#resultStars').innerHTML = starsMarkup(stars, 'star');
    $('#resultStars').setAttribute('aria-label', '獲得 ' + stars + ' 星');
    $('#resultScore').textContent = String(state.score);
    $('#resultCorrect').textContent = state.correct + ' / ' + m.count;

    if (stars === 3) {
      sfxWin();
      $('#resultTip').textContent = '你已經掌握這種描寫了，試試挑戰擂台吧！';
    } else if (stars === 2) {
      $('#resultTip').textContent = '快成功了！再玩一次，留意每題的解說。';
    } else if (stars === 1) {
      $('#resultTip').textContent = '先回到教學區看看口訣，再來挑戰一次。';
    } else {
      $('#resultTip').textContent = '別灰心，慢慢讀句子，找出關鍵詞語。';
    }

    showView('result');
  }

  /* ---------- 事件綁定 ---------- */
  function bindGlobal() {
    document.addEventListener('pointerdown', initAudio, { once: true, capture: true });

    document.addEventListener('click', function (e) {
      const goBtn = e.target.closest('[data-go]');
      if (goBtn) { sfxClick(); go(goBtn.getAttribute('data-go')); return; }

      const learnBtn = e.target.closest('[data-learn]');
      if (learnBtn) { sfxClick(); renderLearn(learnBtn.getAttribute('data-learn')); return; }

      const startBtn = e.target.closest('[data-start]');
      if (startBtn) { sfxClick(); startMode(startBtn.getAttribute('data-start')); return; }

      const modeBtn = e.target.closest('[data-mode]');
      if (modeBtn) { sfxClick(); startMode(modeBtn.getAttribute('data-mode')); return; }
    });

    $('#brandBtn').addEventListener('click', function () { sfxClick(); go('home'); });
    $('#soundBtn').addEventListener('click', function () {
      soundOn = !soundOn;
      try { localStorage.setItem('miaoxie-sound', soundOn ? '1' : '0'); } catch (e) { /* 忽略 */ }
      updateSoundBtn();
      if (soundOn) { initAudio(); sfxClick(); toast('音效已開啟'); }
      else toast('音效已關閉');
    });
    $('#gameBack').addEventListener('click', function () { sfxClick(); stopTimer(); go('practice'); });
    $('#retryBtn').addEventListener('click', function () { sfxClick(); if (state.modeKey) startMode(state.modeKey); });
    $('#resultBackBtn').addEventListener('click', function () { sfxClick(); go('practice'); });
  }

  function updateSoundBtn() {
    const btn = $('#soundBtn');
    btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    btn.setAttribute('aria-label', soundOn ? '關閉音效' : '開啟音效');
    btn.innerHTML = soundOn ? icon('sound') : icon('muted');
  }

  /* ---------- 啟動 ---------- */
  function init() {
    $('#brandMark').innerHTML = icon('face');
    $('#heroMascot').innerHTML = MASCOT;
    $('#resultMascot').innerHTML = MASCOT;
    updateSoundBtn();
    updateStarPill();
    renderLearn('appearance');
    renderPractice();
    bindGlobal();
    showView('home');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
