<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>誇張放大鏡｜超乎常理的誇張修辭（修訂版）</title>
<meta name="description" content="用 13 幅卡通情境圖與三種互動遊戲，學會誇張修辭。分初小版與高小版，每題附詳細解說，可離線遊玩。">
<style>
  :root{
    --cream:#FFF8EC;
    --paper:#FFFDF8;
    --ink:#3B3026;
    --ink-soft:#6E5C4B;
    --yellow:#FFD25A;
    --yellow-soft:#FFF0BE;
    --coral:#FF8A6B;
    --coral-soft:#FFE3DA;
    --mint:#66D3A3;
    --mint-soft:#DDF7EA;
    --sky:#67C1F5;
    --sky-soft:#DDF1FF;
    --grape:#B79CF0;
    --grape-soft:#EEE5FF;
    --line:3px solid var(--ink);
    --shadow:0 6px 0 rgba(59,48,38,.14);
    --shadow-sm:0 4px 0 rgba(59,48,38,.12);
    --r-lg:26px;
    --r-md:18px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans TC",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #FFE9B8 0, rgba(255,233,184,0) 34%),
      radial-gradient(circle at 88% 18%, #DDF1FF 0, rgba(221,241,255,0) 36%),
      radial-gradient(circle at 50% 100%, #FFE3DA 0, rgba(255,227,218,0) 46%),
      var(--cream);
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(59,48,38,.10) 1.2px, transparent 1.2px);
    background-size:22px 22px;
    opacity:.35;
    z-index:0;
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:0 18px calc(26px + env(safe-area-inset-bottom));
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .screen{display:block;animation:screenIn .3s ease both;}
  .screen[hidden]{display:none;}
  @keyframes screenIn{from{opacity:.94;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(11px + env(safe-area-inset-top)) 0 10px;
    background:rgba(255,248,236,.96);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(59,48,38,.08);
  }
  .topbar[hidden]{display:none;}
  .icon-btn{
    flex:0 0 auto;
    width:44px;height:44px;
    display:grid;place-items:center;
    border:2.5px solid var(--ink);
    border-radius:15px;
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 3px 0 rgba(59,48,38,.16);
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,48,38,.16);}
  .icon-btn svg{width:22px;height:22px;}
  .topbar-mid{flex:1;min-width:0;text-align:center;line-height:1.2;}
  .topbar-title{display:block;font-size:15px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-sub{display:block;font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .sound-float{
    position:fixed;
    right:calc(50% - 240px + 18px);
    right:max(14px, calc(50vw - 240px + 14px));
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:45;
    width:46px;height:46px;
    background:rgba(255,253,248,.94);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .sound-float[hidden]{display:none;}
  @media (max-width:520px){
    .sound-float{right:14px;}
  }

  /* ---------- home ---------- */
  .home{padding:8px 0 54px;display:flex;flex-direction:column;justify-content:center;gap:16px;flex:1;}
  .brand{text-align:center;}
  .mascot-wrap{width:min(50vw,196px);margin:0 auto -2px;}
  .mascot{width:100%;height:auto;display:block;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(59,48,38,.06));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-7px) rotate(1.2deg);}}
  .kicker{
    display:inline-flex;align-items:center;gap:6px;
    margin:0 0 6px;padding:5px 12px;
    font-size:12px;font-weight:800;letter-spacing:1.5px;
    color:var(--ink);background:var(--yellow);
    border:2px solid var(--ink);border-radius:999px;
    box-shadow:0 3px 0 rgba(59,48,38,.14);
  }
  h1{
    margin:8px 0 4px;
    font-size:clamp(30px,9.2vw,42px);
    line-height:1.12;
    letter-spacing:2px;
    font-weight:900;
    text-shadow:3px 3px 0 var(--yellow);
  }
  .tagline{
    margin:8px auto 0;
    max-width:310px;
    font-size:14px;line-height:1.6;
    color:var(--ink-soft);font-weight:600;
  }
  .level-picker{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    background:rgba(255,255,255,.55);
    padding:6px;border:2px solid rgba(59,48,38,.14);border-radius:22px;
  }
  .level-btn{
    min-height:58px;
    border:2.5px solid transparent;
    border-radius:16px;
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:16px;font-weight:900;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:all .16s ease;
  }
  .level-btn span{font-size:10.5px;font-weight:700;opacity:.8;letter-spacing:.4px;}
  .level-btn.is-active{
    background:var(--yellow);
    border-color:var(--ink);
    color:var(--ink);
    box-shadow:0 4px 0 rgba(59,48,38,.16);
    transform:translateY(-1px);
  }
  .home-actions{display:flex;flex-direction:column;gap:10px;}
  .btn{
    min-height:52px;
    padding:12px 18px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:var(--line);
    border-radius:var(--r-md);
    font-family:inherit;
    font-size:16.5px;font-weight:900;letter-spacing:.5px;
    color:var(--ink);
    background:var(--paper);
    box-shadow:0 5px 0 rgba(59,48,38,.18);
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease,background .16s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,48,38,.18);}
  .btn svg{width:20px;height:20px;flex:0 0 auto;}
  .btn-primary{background:var(--coral);}
  .btn-yellow{background:var(--yellow);}
  .btn-ghost{background:var(--paper);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.38;box-shadow:0 2px 0 rgba(59,48,38,.12);cursor:default;}
  .btn[disabled]:active{transform:none;}
  .home-note{
    margin:0;text-align:center;font-size:11.5px;font-weight:700;
    color:var(--ink-soft);letter-spacing:.4px;
  }
  .home-chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
  .chip{
    font-size:11px;font-weight:800;padding:5px 10px;
    border:1.5px solid rgba(59,48,38,.28);border-radius:999px;
    background:rgba(255,255,255,.7);color:var(--ink-soft);
  }

  /* ---------- menu ---------- */
  .menu-hero{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px 12px 8px;
    background:var(--paper);
    border:var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .menu-mascot{width:84px;flex:0 0 auto;}
  .menu-mascot svg{width:100%;height:auto;display:block;animation:bob 4s ease-in-out infinite;}
  .eyebrow{margin:0 0 3px;font-size:11.5px;font-weight:900;letter-spacing:1px;color:var(--ink-soft);}
  .menu-hero h2{margin:0;font-size:21px;line-height:1.25;font-weight:900;letter-spacing:.5px;}
  .menu-sub{margin:5px 0 0;font-size:12px;line-height:1.5;color:var(--ink-soft);font-weight:600;}
  .star-total{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;margin-bottom:12px;
    background:var(--yellow-soft);
    border:2px dashed rgba(59,48,38,.35);border-radius:16px;
    font-size:12.5px;font-weight:800;color:var(--ink);
  }
  .star-total b{font-size:17px;}
  .star-total .starrow{display:flex;align-items:center;gap:4px;}
  .star-total svg{width:17px;height:17px;color:#E0A21B;}
  .lesson-entry{
    width:100%;display:flex;align-items:center;gap:13px;
    padding:14px;margin-bottom:18px;
    background:var(--grape-soft);
    border:var(--line);border-radius:22px;
    box-shadow:var(--shadow-sm);
    font-family:inherit;color:var(--ink);
    text-align:left;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .lesson-entry:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,48,38,.14);}
  .entry-icon{
    width:54px;height:54px;flex:0 0 auto;display:grid;place-items:center;
    background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;color:var(--grape);
  }
  .entry-icon svg{width:28px;height:28px;}
  .entry-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .entry-body strong{font-size:15.5px;font-weight:900;}
  .entry-body span{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .entry-arrow{width:22px;height:22px;flex:0 0 auto;color:var(--ink);}
  .section-title{
    margin:0 0 4px;font-size:13px;font-weight:900;letter-spacing:1.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .section-title::after{content:"";height:2px;flex:1;background:rgba(59,48,38,.16);border-radius:2px;}
  .section-note{margin:0 0 10px;font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.5;}
  .mode-list{display:flex;flex-direction:column;gap:11px;}
  .mode-card{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:14px 13px;
    background:var(--paper);
    border:var(--line);border-radius:22px;
    box-shadow:var(--shadow-sm);
    font-family:inherit;color:var(--ink);text-align:left;
    cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
  }
  .mode-card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,48,38,.14);}
  .mode-icon{
    width:56px;height:56px;flex:0 0 auto;display:grid;place-items:center;
    border:2.5px solid var(--ink);border-radius:18px;
  }
  .mode-icon svg{width:30px;height:30px;}
  .tone-yellow{background:var(--yellow);}
  .tone-coral{background:var(--coral);}
  .tone-mint{background:var(--mint);}
  .tone-sky{background:var(--sky);}
  .tone-grape{background:var(--grape);}
  .mode-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .mode-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .mode-top strong{font-size:15.5px;font-weight:900;}
  .mode-badge{
    font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;
    background:rgba(59,48,38,.08);color:var(--ink-soft);letter-spacing:.5px;
  }
  .mode-desc{font-size:11.5px;line-height:1.45;color:var(--ink-soft);font-weight:600;}
  .mode-progress{display:flex;align-items:center;gap:4px;margin-top:2px;flex-wrap:wrap;}
  .mode-progress i{width:7px;height:7px;border-radius:50%;background:rgba(59,48,38,.16);display:block;}
  .mode-progress i.on{background:var(--coral);}
  .mode-progress em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink-soft);margin-left:4px;}
  .mode-arrow{width:20px;height:20px;flex:0 0 auto;color:var(--ink-soft);}

  /* ---------- learn ---------- */
  .learn-tabs{
    display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
    padding:5px;margin-bottom:14px;
    background:rgba(255,255,255,.72);
    border:2px solid rgba(59,48,38,.16);border-radius:18px;
    position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:20;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
  }
  .learn-tab{
    min-height:44px;padding:5px 2px;
    border:none;border-radius:12px;background:transparent;
    font-family:inherit;font-size:11.5px;line-height:1.2;font-weight:900;color:var(--ink-soft);
    cursor:pointer;transition:all .16s ease;
  }
  .learn-tab.is-active{background:var(--ink);color:var(--cream);box-shadow:0 3px 0 rgba(59,48,38,.2);}
  .learn-card{
    background:var(--paper);border:var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:18px 16px 16px;
  }
  .lesson-mark{
    display:inline-flex;align-items:center;gap:5px;
    margin:0 0 7px;padding:4px 9px;
    font-size:10px;font-weight:900;letter-spacing:1px;color:var(--ink-soft);
    background:rgba(59,48,38,.07);border-radius:999px;
  }
  .lesson-title{margin:0 0 7px;font-size:22px;line-height:1.35;font-weight:900;letter-spacing:.3px;}
  .lesson-lead{margin:0 0 13px;font-size:13.5px;line-height:1.75;color:var(--ink-soft);font-weight:600;}
  .scene{
    margin:0 0 12px;border:2.5px solid var(--ink);border-radius:17px;
    overflow:hidden;background:#fff;box-shadow:0 4px 0 rgba(59,48,38,.12);
  }
  .scene-svg{display:block;width:100%;height:auto;}
  .scene figcaption{
    display:block;padding:7px 10px;
    font-size:11.5px;line-height:1.45;font-weight:700;color:var(--ink-soft);
    background:var(--yellow-soft);border-top:2px solid rgba(59,48,38,.18);
  }
  .scene-grid{display:grid;grid-template-columns:1fr;gap:9px;margin:0 0 12px;}
  .compare-panel{
    padding:8px;border:2.5px dashed rgba(59,48,38,.4);border-radius:16px;
    background:#FFF9EE;
  }
  .compare-panel.is-hyper{background:var(--coral-soft);border-style:solid;border-color:var(--ink);}
  .compare-tag{
    display:inline-block;margin-bottom:6px;padding:2px 8px;
    font-size:10px;font-weight:900;letter-spacing:1px;
    background:var(--paper);border:2px solid var(--ink);border-radius:999px;
  }
  .compare-panel .scene{margin:0 0 6px;border-width:2px;border-radius:11px;box-shadow:none;}
  .compare-text{margin:0;font-size:12.5px;line-height:1.55;font-weight:800;}
  .vs-arrow{display:flex;justify-content:center;align-items:center;color:var(--coral);padding:1px 0;}
  .vs-arrow svg{width:22px;height:22px;}
  .stamp{
    display:inline-block;margin:0 0 12px;padding:7px 12px;
    font-size:13px;font-weight:900;letter-spacing:.5px;
    background:var(--yellow);border:2.5px solid var(--ink);border-radius:11px;
    box-shadow:0 3px 0 rgba(59,48,38,.16);transform:rotate(-2deg);
  }
  .point-list{list-style:none;margin:0 0 13px;padding:0;display:flex;flex-direction:column;gap:9px;}
  .point-list li{
    display:flex;gap:9px;align-items:flex-start;
    font-size:13px;line-height:1.65;font-weight:600;color:var(--ink);
  }
  .point-list li .dot{
    flex:0 0 auto;width:20px;height:20px;margin-top:2px;
    display:grid;place-items:center;border-radius:50%;
    background:var(--mint-soft);color:#1F7A55;
    border:1.5px solid rgba(31,122,85,.4);
  }
  .point-list li .dot svg{width:12px;height:12px;}
  .example-box{
    background:var(--yellow-soft);
    border:2px dashed rgba(59,48,38,.4);
    border-radius:16px;padding:12px 13px;margin-bottom:12px;
  }
  .example-label{display:block;font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--ink-soft);margin-bottom:4px;}
  .example-text{margin:0;font-size:15px;line-height:1.7;font-weight:800;}
  .example-text mark{background:var(--yellow);color:var(--ink);padding:0 3px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .example-note{margin:6px 0 0;font-size:12px;line-height:1.65;color:var(--ink-soft);font-weight:600;}
  .check-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;}
  .check-item{
    display:flex;gap:9px;align-items:flex-start;
    padding:10px;border-radius:14px;
    background:#FFF9EE;border:2px solid rgba(59,48,38,.16);
  }
  .check-num{
    flex:0 0 auto;width:25px;height:25px;display:grid;place-items:center;
    background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:50%;
    font-size:12px;font-weight:900;
  }
  .check-copy{min-width:0;flex:1;}
  .check-copy strong{display:block;font-size:13px;font-weight:900;margin-bottom:1px;}
  .check-copy span{display:block;font-size:12px;line-height:1.6;font-weight:600;color:var(--ink-soft);}
  .move-list{display:flex;flex-direction:column;gap:12px;margin-top:2px;}
  .move-item{
    overflow:hidden;background:#fff;
    border:2.5px solid var(--ink);border-radius:18px;
    box-shadow:0 4px 0 rgba(59,48,38,.1);
  }
  .move-head{display:flex;gap:10px;align-items:center;padding:10px 11px 7px;}
  .move-icon{
    width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;
    border:2px solid var(--ink);border-radius:13px;
  }
  .move-icon svg{width:24px;height:24px;}
  .move-copy{min-width:0;flex:1;}
  .move-copy strong{display:block;font-size:15px;font-weight:900;margin-bottom:1px;}
  .move-copy em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);font-weight:700;line-height:1.45;}
  .move-body{padding:0 11px 11px;}
  .move-body .scene{margin:0 0 8px;border-width:2px;border-radius:11px;box-shadow:none;}
  .move-body .scene figcaption{font-size:10.5px;padding:5px 8px;}
  .move-normal{
    margin:0 0 5px;font-size:11.5px;line-height:1.55;font-weight:600;color:var(--ink-soft);
  }
  .move-normal b{color:var(--ink);}
  .move-ex{margin:0;font-size:12.5px;line-height:1.6;font-weight:800;}
  .move-ex .tag{
    display:inline-block;margin-right:4px;padding:1px 6px;
    font-size:9.5px;font-weight:900;border-radius:999px;
    background:var(--yellow);border:1.5px solid var(--ink);
  }
  .effect-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .effect-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px;border-radius:15px;
    background:#FFF9EE;border:2px solid rgba(59,48,38,.16);
  }
  .effect-ico{
    width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;
    border:2px solid var(--ink);border-radius:13px;
  }
  .effect-ico svg{width:23px;height:23px;}
  .effect-copy{min-width:0;flex:1;}
  .effect-copy strong{display:block;font-size:13.5px;font-weight:900;}
  .effect-copy p{margin:1px 0 3px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);font-weight:600;}
  .effect-copy em{display:block;font-style:normal;font-size:12px;line-height:1.55;font-weight:800;}
  .mantra{
    margin:4px 0 14px;padding:18px 14px;text-align:center;
    background:var(--sky-soft);
    border:2.5px solid var(--ink);border-radius:22px;
    font-size:clamp(21px,6.2vw,26px);line-height:1.55;font-weight:900;letter-spacing:1px;
    position:relative;
  }
  .mantra::before,.mantra::after{
    content:"“";position:absolute;font-size:44px;line-height:1;color:var(--sky);
    font-family:Georgia,serif;opacity:.7;
  }
  .mantra::before{left:10px;top:4px;}
  .mantra::after{right:10px;bottom:-12px;transform:rotate(180deg);}
  .flow{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .flow-step{
    display:flex;gap:10px;align-items:center;
    padding:9px 11px;background:#fff;border:2px solid rgba(59,48,38,.18);border-radius:14px;
  }
  .flow-ico{
    width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
    border:2px solid var(--ink);border-radius:12px;
  }
  .flow-ico svg{width:20px;height:20px;}
  .flow-copy{min-width:0;flex:1;}
  .flow-copy strong{display:block;font-size:12.5px;font-weight:900;}
  .flow-copy span{display:block;font-size:11.5px;line-height:1.55;color:var(--ink-soft);font-weight:600;}

  var KEY_BEST = 'hyperbole-magnifier-best-v2';
  var KEY_SOUND = 'hyperbole-magnifier-sound-v1';

  function safeGet(k){
    try{ return window.localStorage.getItem(k); }catch(e){ return null; }
  }
  function safeSet(k,v){
    try{ window.localStorage.setItem(k,v); }catch(e){ /* 私隱模式或不支援時忽略 */ }
  }
  function loadBest(){
    var raw = safeGet(KEY_BEST);
    if(!raw) return {};
    try{
      var obj = JSON.parse(raw);
      return (obj && typeof obj === 'object') ? obj : {};
    }catch(e){ return {}; }
  }
  function persistBest(){ safeSet(KEY_BEST, JSON.stringify(state.best)); }

  state.best = loadBest();
  var savedSound = safeGet(KEY_SOUND);
  if(savedSound === '0') state.soundOn = false;

  /* ============ 音效 ============ */
  var audioCtx = null;
  function getCtx(){
    if(!state.soundOn) return null;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      return audioCtx;
    }catch(e){ return null; }
  }
  function beep(freq, delay, dur, type, vol){
    var c = getCtx();
    if(!c) return;
    try{
      var t0 = c.currentTime + delay;
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(c.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    }catch(e){ /* 音效失敗不影響流程 */ }
  }
  function sfx(name){
    if(!state.soundOn) return;
    if(name === 'tap') beep(640, 0, 0.06, 'triangle', 0.05);
    else if(name === 'correct'){
      beep(523.25, 0, 0.14, 'sine', 0.10);
      beep(659.25, 0.10, 0.14, 'sine', 0.10);
      beep(783.99, 0.20, 0.20, 'sine', 0.10);
    } else if(name === 'wrong'){
      beep(330, 0, 0.16, 'sine', 0.06);
      beep(262, 0.13, 0.22, 'sine', 0.05);
    } else if(name === 'reveal'){
      beep(880, 0, 0.10, 'sine', 0.05);
    } else if(name === 'win'){
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){
        beep(f, i * 0.11, 0.22, 'sine', 0.08);
      });
    }
  }

  /* ============ 遊戲 ============ */
  function optionsFor(q){
    if(state.mode === 'judge'){
      return [{label:'是誇張'},{label:'不是誇張'}];
    }
    if(state.mode === 'pick'){
      return q.options.map(function(o){ return {label:o.text}; });
    }
    return q.options.map(function(t){ return {label:t}; });
  }
  function correctIndexOf(q){
    if(state.mode === 'judge') return q.answer ? 0 : 1;
    if(state.mode === 'pick') return q.options.map(function(o){ return !!o.ok; }).indexOf(true);
    return q.answer;
  }
  function questionText(q){
    if(state.mode === 'judge') return q.text;
    if(state.mode === 'pick') return '「'+q.prompt+'」<span class="q-hint">哪一句改寫最有誇張效果？</span>';
    var word = state.phase === 'revealed' ? q.options[q.answer] : '＿＿';
    return q.sentence.replace('____', '<span class="blank '+(state.phase === 'revealed' ? 'is-filled' : '')+'">'+word+'</span>');
  }

  function renderQuestion(){
    var mode = getMode();
    var q = mode.questions[state.index];
    var total = mode.questions.length;
    var revealed = state.phase === 'revealed';
    var opts = optionsFor(q);
    var cidx = correctIndexOf(q);

    var dots = '';
    for(var i = 0; i < total; i++){
      var cls = i < state.index ? 'done' : (i === state.index ? 'now' : '');
      dots += '<i class="'+cls+'"></i>';
    }

    var optHTML = '';
    opts.forEach(function(o, i){
      var cls = '';
      var mark = '';
      if(revealed){
        if(i === cidx){
          cls = 'is-correct';
          mark = icon('check');
        } else if(i === state.selected){
          cls = 'is-wrong';
          mark = icon('cross');
        }
      }
      optHTML += ''+
        '<button type="button" class="opt '+cls+'" data-action="answer" data-value="'+i+'" '+(revealed ? 'disabled' : '')+'>'+
          '<span class="opt-key">'+String.fromCharCode(65 + i)+'</span>'+
          '<span class="opt-text">'+o.label+'</span>'+
          '<span class="opt-mark">'+mark+'</span>'+
        '</button>';
    });

    var fb = '';
    if(revealed){
      var right = state.selected === cidx;
      var correctLabel = opts[cidx].label;
      var pickedLabel = opts[state.selected] ? opts[state.selected].label : '';
      fb = ''+
        '<div class="feedback '+(right ? 'ok' : 'no')+'">'+
          '<div class="fb-head"><span class="fb-badge">'+icon(right ? 'check' : 'cross')+'</span><strong>'+(right ? '答對了！' : '再看看，也沒關係。')+'</strong></div>'+
          '<span class="fb-tag">手法：'+q.tag+'</span>'+
          '<p class="fb-answer">正確答案：<b>'+correctLabel+'</b></p>'+
          (right ? '' : '<p class="fb-pick">你選了：'+pickedLabel+'</p>')+
          '<p class="fb-explain"><span class="ex-label">為甚麼：</span>'+q.explain+'</p>'+
          '<button type="button" class="btn btn-primary btn-block" data-action="next">'+
            (state.index === total - 1 ? '看成績' : '下一題')+icon('arrow')+
          '</button>'+
        '</div>';
    }

    screens.play.innerHTML = ''+
      '<div class="play-wrap"><div class="play-inner">'+
      '<div class="play-head">'+
        '<div class="dots" role="img" aria-label="第 '+(state.index+1)+' 題，共 '+total+' 題">'+dots+'</div>'+
        '<p class="q-count">第 '+(state.index+1)+' / '+total+' 題</p>'+
      '</div>'+
      '<p class="mode-hint">'+mode.bank+' · '+mode.desc+'</p>'+
      '<div class="q-card">'+
        '<div class="q-icon '+mode.tone+'">'+icon(q.icon)+'</div>'+
        '<p class="q-text">'+questionText(q)+'</p>'+
      '</div>'+
      '<div class="options">'+optHTML+'</div>'+
      (revealed ? '' : '<p class="play-tip">選一個答案，馬上揭曉解釋</p>')+
      fb+
      '</div></div>';

    if(revealed){
      requestAnimationFrame(function(){
        var el = screens.play.querySelector('.feedback');
        if(el && el.scrollIntoView){
          el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }
      });
    }
  }

  function startMode(modeKey){
    state.mode = modeKey;
    state.index = 0;
    state.score = 0;
    state.selected = null;
    state.phase = 'answering';
    state.correctIndex = -1;
    showScreen('play');
    setTopbar(getMode().name, getLevel().label);
    renderQuestion();
  }

  function answer(value){
    if(state.screen !== 'play') return;
    if(state.phase !== 'answering') return;
    if(state.mode === null) return;
    var q = getMode().questions[state.index];
    if(!q) return;
    var cidx = correctIndexOf(q);
    if(value < 0 || value >= optionsFor(q).length) return;

    state.phase = 'revealed';
    state.selected = value;
    state.correctIndex = cidx;
    var right = value === cidx;
    if(right) state.score += 1;
    sfx(right ? 'correct' : 'wrong');

    var opts = optionsFor(q);
    live.textContent = (right ? '答對了。' : '答錯了。') +
      '正確答案是' + opts[cidx].label + '。手法：' + q.tag + '。' + q.explain;

    renderQuestion();
  }

  function nextQuestion(){
    if(state.phase !== 'revealed') return;
    var total = getMode().questions.length;
    if(state.index < total - 1){
      state.index += 1;
      state.phase = 'answering';
      state.selected = null;
      state.correctIndex = -1;
      sfx('tap');
      renderQuestion();
      window.scrollTo(0, 0);
    } else {
      showScreen('result');
    }
  }

  /* ============ 結算 ============ */
  function starsFor(score){
    if(score >= 6) return 3;
    if(score >= 4) return 2;
    if(score >= 2) return 1;
    return 0;
  }
  function resultCopy(stars){
    var jr = state.level === 'junior';
    if(stars === 3) return {
      title: jr ? '太厲害了，小誇張偵探！' : '滿分！你已掌握誇張的分寸',
      sub: jr ? '六題全對，超乎常理的句子完全難不倒你。' : '六題全對，言過其實用得恰到好處。'
    };
    if(stars === 2) return {
      title: '表現不錯，就快滿星了',
      sub: jr ? '再玩一次，記住每題的解釋，就能拿三顆星。' : '再留意「誇張」與「客觀描述」的分別，就會更準。'
    };
    if(stars === 1) return {
      title: '有進步，繼續加油',
      sub: jr ? '記住口訣：不是真的，但很有感覺。' : '把每題的解說讀完，你會進步得很快。'
    };
    return {
      title: '先重溫一下，再來挑戰',
      sub: jr ? '回去看看「超乎常理」和三個招式，再玩一次一定更好。' : '重看三層檢驗與四招圖鑑，再回來挑戰吧。'
    };
  }
  function renderResult(){
    if(!state.mode) { showScreen('menu'); return; }
    var total = getMode().questions.length;
    var stars = starsFor(state.score);
    var copy = resultCopy(stars);
    var key = state.level + ':' + state.mode;
    var prev = state.best[key];
    if(!prev || typeof prev.stars !== 'number' || typeof prev.score !== 'number' || stars > prev.stars || (stars === prev.stars && state.score > prev.score)){
      state.best[key] = {stars:stars, score:state.score};
      persistBest();
    }

    var starHTML = starSVG(stars >= 1) + starSVG(stars >= 2) + starSVG(stars >= 3);

    screens.result.innerHTML = ''+
      '<div class="result-wrap">'+
        '<div class="result-card">'+
          '<div class="result-mascot" aria-hidden="true">'+mascotSVG()+'</div>'+
          '<span class="result-label">'+getLevel().label+' · '+getMode().name+'</span>'+
          '<div class="star-row" aria-label="獲得 '+stars+' 顆星，共 3 顆">'+starHTML+'</div>'+
          '<p class="result-score">'+state.score+' <span>/ '+total+' 題</span></p>'+
          '<h2 class="result-title">'+copy.title+'</h2>'+
          '<p class="result-sub">'+copy.sub+'</p>'+
          '<div class="result-actions">'+
            '<button type="button" class="btn btn-primary btn-block" data-action="restart">'+icon('refresh')+' 再玩一次</button>'+
            '<button type="button" class="btn btn-ghost btn-block" data-action="go-menu">'+icon('arrow')+' 換個模式</button>'+
            '<button type="button" class="btn btn-ghost btn-block" data-action="go-home">回到首頁</button>'+
          '</div>'+
        '</div>'+
      '</div>';

    setTopbar('成績', getLevel().label + ' · ' + getMode().name);
    if(stars > 0) sfx('win');
  }

  /* ============ 音效按鈕 ============ */
  function syncSoundBtn(){
    var ic = icon(state.soundOn ? 'soundOn' : 'soundOff');
    var lab = state.soundOn ? '關閉音效' : '開啟音效';
    [soundBtn, soundHomeBtn].forEach(function(btn){
      if(!btn) return;
      btn.innerHTML = ic;
      btn.setAttribute('aria-label', lab);
      btn.setAttribute('aria-pressed', state.soundOn ? 'true' : 'false');
      btn.style.opacity = state.soundOn ? '1' : '.6';
    });
  }

  /* ============ 事件 ============ */
  document.addEventListener('click', function(e){
    var target = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!target) return;
    var action = target.getAttribute('data-action');

    if(action === 'set-level'){
      var lv = target.getAttribute('data-level');
      if(lv === state.level) return;
      state.level = lv;
      state.lessonIndex = 0;
      syncLevelButtons();
      sfx('tap');
      return;
    }
    if(action === 'start-learn' || action === 'go-learn'){
      state.lessonIndex = 0;
      sfx('tap');
      showScreen('learn');
      setTopbar('修辭小教室', getLevel().label);
      return;
    }
    if(action === 'start-play'){
      sfx('tap');
      showScreen('menu');
      setTopbar('學習主頁', getLevel().label);
      return;
    }
    if(action === 'go-menu'){
      sfx('tap');
      showScreen('menu');
      setTopbar('學習主頁', getLevel().label);
      return;
    }
    if(action === 'go-home'){
      sfx('tap');
      showScreen('home');
      syncLevelButtons();
      return;
    }
    if(action === 'back'){
      sfx('tap');
      if(state.screen === 'learn' || state.screen === 'play' || state.screen === 'result'){
        showScreen('menu');
        setTopbar('學習主頁', getLevel().label);
      } else {
        showScreen('home');
        syncLevelButtons();
      }
      return;
    }
    if(action === 'open-mode'){
      sfx('tap');
      startMode(target.getAttribute('data-mode'));
      return;
    }
    if(action === 'learn-tab'){
      var idx = parseInt(target.getAttribute('data-tab'), 10);
      if(isNaN(idx)) return;
      state.lessonIndex = idx;
      sfx('tap');
      renderLearn();
      window.scrollTo(0, 0);
      return;
    }
    if(action === 'learn-prev'){ goLearn(-1); return; }
    if(action === 'learn-next'){ goLearn(1); return; }
    if(action === 'answer'){
      answer(parseInt(target.getAttribute('data-value'), 10));
      return;
    }
    if(action === 'next'){
      nextQuestion();
      return;
    }
    if(action === 'restart'){
      sfx('tap');
      if(state.mode) startMode(state.mode);
      return;
    }
    if(action === 'sound'){
      state.soundOn = !state.soundOn;
      safeSet(KEY_SOUND, state.soundOn ? '1' : '0');
      syncSoundBtn();
      if(state.soundOn){ sfx('tap'); }
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(state.screen !== 'play' || state.phase !== 'answering') return;
    if(e.key === '1' || e.key === '2' || e.key === '3'){
      var idx = parseInt(e.key, 10) - 1;
      var total = optionsFor(getMode().questions[state.index]).length;
      if(idx < total){ e.preventDefault(); answer(idx); }
    }
  });

  /* ============ 初始化 ============ */
  document.getElementById('home-mascot').innerHTML = mascotSVG();
  syncLevelButtons();
  syncSoundBtn();
  soundHomeBtn.hidden = false;

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.documentElement.style.scrollBehavior = 'auto';
  }
})();
</script>
</body>
</html>
