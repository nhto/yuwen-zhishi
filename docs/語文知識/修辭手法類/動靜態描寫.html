<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E9">
<title>動靜描寫小偵探｜小學語文互動遊戲</title>
<meta name="description" content="小學語文動態描寫與靜態描寫互動教學遊戲：圖文教學、四種遊戲模式、每題即時講解，適用手機、平板與電腦。">
<style>
:root{
  --paper:#FFF7E9;
  --paper2:#FFFDF7;
  --ink:#4A3B32;
  --ink-soft:#8A7466;
  --orange:#FF8A65;
  --orange-soft:#FFD9C9;
  --blue:#4FC3F7;
  --blue-soft:#D6F0FF;
  --green:#7BC96F;
  --green-soft:#CFF3C8;
  --yellow:#FFD166;
  --purple:#B39DDB;
  --line:rgba(74,59,50,.18);
  --shadow:0 6px 0 rgba(74,59,50,.12), 0 12px 26px rgba(74,59,50,.10);
  font-size:clamp(17px,0.5vw + 14px,21px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(circle at 10% 6%, #FFE7CB 0, rgba(255,231,203,0) 40%),
    radial-gradient(circle at 90% 2%, #DCF1FF 0, rgba(220,241,255,0) 38%),
    radial-gradient(circle at 50% 104%, #E4F8E0 0, rgba(228,248,224,0) 46%);
  background-attachment:fixed;
  font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.62;
  font-size:1rem;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
p{margin:0}
h1,h2,h3{margin:0;line-height:1.3}
svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== app shell ===== */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body.sheet-open .app{padding-bottom:66vh;min-height:168dvh}
@media(min-width:900px){body.sheet-open .app{padding-bottom:54vh;min-height:156dvh}}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:.55rem;
  padding:.5rem .9rem .5rem .7rem;
  background:rgba(255,247,233,.94);
  border-bottom:2px dashed var(--line);
  backdrop-filter:blur(8px);
}
.topbar-left{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1}
.brand{display:flex;align-items:center;gap:.5rem;min-width:0}
.brand-mark{width:2.1rem;height:2.1rem;flex:none;border-radius:.7rem;background:var(--orange-soft);border:2.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.brand-mark svg{width:1.6rem;height:1.6rem}
.brand-text{min-width:0}
.brand-title{font-size:1rem;font-weight:900;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.72rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:2.7rem;height:2.7rem;flex:none;border-radius:.9rem;
  border:2.5px solid var(--ink);background:var(--paper2);
  display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(74,59,50,.16);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,59,50,.16)}
.icon-btn .ic{width:1.4rem;height:1.4rem}
.icon-btn:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.icon-btn.off{background:#EFE6D8;color:#A6968A}

main{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:.9rem .9rem 2.4rem}
.screen{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:.9rem;min-height:calc(100dvh - 7.4rem);justify-content:flex-start;animation:fadeUp .26s ease-out}
#screen-home,#screen-menu,#screen-result,#screen-teach{justify-content:center}
#gameHost{display:flex;flex-direction:column;gap:.9rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== shared bits ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  min-height:3.2rem;padding:.7em 1.15em;
  border:3px solid var(--ink);border-radius:1.1rem;
  background:var(--paper2);color:var(--ink);
  font-weight:900;font-size:1rem;letter-spacing:.02em;
  box-shadow:0 5px 0 rgba(74,59,50,.18);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  text-align:center;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,59,50,.18)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default;transform:none}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.btn .ic{width:1.35rem;height:1.35rem;flex:none}
.btn-primary{background:var(--orange)}
.btn-blue{background:var(--blue)}
.btn-yellow{background:var(--yellow)}
.btn-ghost{background:var(--paper2);color:var(--ink-soft)}
.btn-block{width:100%}
.ic{width:1.2rem;height:1.2rem;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:.3em;
  padding:.2em .7em;border-radius:99px;
  background:var(--paper2);border:2px solid var(--ink);
  font-size:.86rem;font-weight:900;letter-spacing:.02em;
}
.chip .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c,var(--orange));flex:none}

/* ===== home ===== */
.home-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding-top:.3rem}
.hero-art{width:clamp(6.4rem,16vw,9rem);height:auto}
.hero-art svg{width:100%;height:auto}
.hero-title{font-size:clamp(1.85rem,5.2vw,2.9rem);font-weight:900;letter-spacing:.04em;margin-top:.1rem}
.hero-title em{font-style:normal;color:var(--orange)}
.hero-sub{font-size:clamp(.95rem,1.8vw,1.1rem);color:var(--ink-soft);font-weight:700}
.tag-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.2rem}
.tag{background:#fff;border:2px solid var(--line);border-radius:99px;padding:.15em .75em;font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.entries{display:grid;gap:.75rem;grid-template-columns:1fr;margin-top:.3rem}
@media(min-width:820px){.entries{grid-template-columns:repeat(3,1fr)}}
.entry{
  position:relative;display:flex;align-items:center;gap:.9rem;
  padding:.9rem 1rem;border:3px solid var(--ink);border-radius:1.4rem;
  background:var(--paper2);text-align:left;
  box-shadow:0 6px 0 rgba(74,59,50,.14), 0 12px 22px rgba(74,59,50,.08);
  transition:transform .12s ease, box-shadow .12s ease;
  overflow:hidden;
}
.entry::before{content:"";position:absolute;inset:0 auto 0 0;width:.55rem;background:var(--c)}
.entry:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,50,.14)}
.entry:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.entry-icon{width:3.6rem;height:3.6rem;flex:none;border-radius:1.1rem;background:var(--soft);border:2.5px solid var(--ink);display:grid;place-items:center}
.entry-icon .ic{width:2rem;height:2rem}
.entry-body{min-width:0;flex:1}
.entry-name{display:block;font-size:1.25rem;font-weight:900;line-height:1.25}
.entry-desc{display:block;font-size:.92rem;color:var(--ink-soft);font-weight:700;margin-top:.15rem;line-height:1.45}
.entry-go{margin-left:auto;flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.entry-go .ic{width:1.05rem;height:1.05rem}
.best-row{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;font-size:.82rem;color:var(--ink-soft);font-weight:800;margin-top:.2rem}
.best-pill{display:inline-flex;align-items:center;gap:.3em;background:#fff;border:2px dashed var(--line);border-radius:99px;padding:.2em .7em}
.best-pill .ic{width:1rem;height:1rem;color:var(--yellow)}
.home-note{font-size:.84rem;color:var(--ink-soft);text-align:center;line-height:1.7}
.home-note b{color:var(--ink)}

/* ===== teaching ===== */
.section-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.section-title{font-size:clamp(1.25rem,2.8vw,1.7rem);font-weight:900}
.section-sub{font-size:.85rem;color:var(--ink-soft);font-weight:700}
.teach-wrap{display:grid;gap:.9rem}
@media(min-width:900px){.teach-wrap{grid-template-columns:1.02fr 1fr;align-items:center;gap:1.3rem}}
.teach-art{
  border:3px solid var(--ink);border-radius:1.6rem;background:#fff;
  padding:.55rem;box-shadow:var(--shadow);position:relative;
}
.teach-art > svg{width:100%;height:auto;border-radius:1.1rem}
.teach-card{border:3px solid var(--ink);border-radius:1.6rem;background:var(--paper2);padding:1.1rem;box-shadow:var(--shadow)}
.kicker{display:inline-flex;align-items:center;gap:.35em;font-size:.78rem;font-weight:900;color:var(--ink-soft);letter-spacing:.08em}
.kicker .pin{width:.5rem;height:.5rem;border-radius:50%;background:var(--orange)}
.teach-title{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:900;margin:.15rem 0 .5rem;line-height:1.3}
.teach-text{font-size:1.02rem;line-height:1.8;display:flex;flex-direction:column;gap:.4rem}
.teach-text b{color:var(--orange)}
.teach-example{
  margin-top:.8rem;padding:.7rem .85rem;border-radius:1rem;
  background:#FFF3D6;border:2px dashed rgba(74,59,50,.35);
  font-size:.98rem;font-weight:700;line-height:1.7;
}
.teach-example span{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:900;letter-spacing:.08em;margin-bottom:.15rem}
.chip-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.mini-chip{display:inline-flex;align-items:center;gap:.3em;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:.22em .65em;font-size:.8rem;font-weight:800}
.mini-chip .ic{width:1rem;height:1rem;color:var(--orange)}
.teach-nav{display:flex;align-items:center;gap:.55rem;justify-content:space-between;margin-top:.2rem}
.teach-nav .btn{flex:none;white-space:nowrap;padding-left:.85em;padding-right:.85em;font-size:.95rem}
.dots{display:flex;gap:.35rem;align-items:center;justify-content:center;flex:1}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:#E2D3BE;transition:width .2s, background .2s}
.dots i.on{width:1.4rem;border-radius:99px;background:var(--orange)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.compare figure{margin:0;border:2.5px solid var(--ink);border-radius:1rem;overflow:hidden;background:#fff}
.compare figcaption{font-size:.78rem;font-weight:900;text-align:center;padding:.25em 0;background:var(--paper)}
.compare svg{width:100%;height:auto;display:block}
.compare .lbl-a{background:var(--blue-soft)}
.compare .lbl-b{background:var(--orange-soft)}
.teach-steps{display:flex;flex-direction:column;gap:.55rem;margin-top:.9rem}
.step-row{display:flex;align-items:flex-start;gap:.6rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.55rem .7rem}
.step-no{width:1.7rem;height:1.7rem;flex:none;border-radius:50%;background:var(--orange);border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:.9rem}
.step-row p{font-size:.9rem;font-weight:700;line-height:1.55}
.motto{
  font-size:clamp(1.25rem,3.2vw,1.75rem);font-weight:900;line-height:1.65;
  background:#fff;border:3px dashed rgba(74,59,50,.4);border-radius:1.2rem;
  padding:1rem;text-align:center;letter-spacing:.05em;
}
.motto span{color:var(--orange)}

/* ===== menu ===== */
.mode-list{display:grid;gap:.8rem;grid-template-columns:1fr}
@media(min-width:760px){.mode-list{grid-template-columns:1fr 1fr}}
.mode-card{
  display:flex;align-items:center;gap:.9rem;text-align:left;
  padding:1rem;border:3px solid var(--ink);border-radius:1.5rem;background:var(--paper2);
  box-shadow:0 6px 0 rgba(74,59,50,.14);transition:transform .12s ease, box-shadow .12s ease;
}
.mode-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,50,.14)}
.mode-card:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.mode-icon{width:4rem;height:4rem;flex:none;border-radius:1.2rem;background:var(--soft);border:2.5px solid var(--ink);display:grid;place-items:center}
.mode-icon .ic{width:2.2rem;height:2.2rem}
.mode-body{min-width:0;flex:1}
.mode-name{display:block;font-size:1.3rem;font-weight:900;line-height:1.25}
.mode-desc{display:block;font-size:.88rem;color:var(--ink-soft);font-weight:700;margin-top:.1rem;line-height:1.5}
.mode-meta{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.35rem}
.mode-meta span{font-size:.76rem;font-weight:800;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:.05em .55em;color:var(--ink-soft)}
.menu-tip{font-size:.9rem;color:var(--ink-soft);font-weight:700;background:#fff;border:2px dashed var(--line);border-radius:1rem;padding:.6rem .85rem;line-height:1.65}

/* ===== game ===== */
.game-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.progress{flex:1;min-width:5.5rem;height:.72rem;background:#EFE2CE;border-radius:99px;border:2px solid rgba(74,59,50,.22);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--c,var(--orange));transition:width .35s ease}
.counter{font-size:.82rem;font-weight:900;color:var(--ink-soft);white-space:nowrap}
.qcard{background:var(--paper2);border:3px solid var(--ink);border-radius:1.5rem;padding:1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.85rem}
.q-head{display:flex;align-items:center;gap:.5rem;font-size:.94rem;font-weight:900;color:var(--ink-soft)}
.q-head .ic{width:1.15rem;height:1.15rem;color:var(--orange)}
.q-prompt{font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:900;line-height:1.75;letter-spacing:.02em}
.q-sentence{
  font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:800;line-height:1.8;
  background:#fff;border:2.5px dashed rgba(74,59,50,.3);border-radius:1rem;padding:.75rem .9rem;
}
.q-sentence .hl{color:var(--orange)}
.tokens{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;padding:.15rem 0}
.token{
  font-size:clamp(1.05rem,2.4vw,1.45rem);font-weight:900;letter-spacing:.02em;
  padding:.5em .78em;border:3px solid var(--ink);border-radius:1rem;background:#fff;
  box-shadow:0 4px 0 rgba(74,59,50,.15);
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.token:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,50,.15)}
.token:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.token.correct{background:var(--green-soft);border-color:#3E8E3A}
.token.wrong{background:#FFD3CB;border-color:#C9563F;opacity:.95}
.pic-grid{display:grid;gap:.8rem;grid-template-columns:1fr}
@media(min-width:620px){.pic-grid{grid-template-columns:repeat(3,1fr)}}
.pic{
  position:relative;display:block;padding:.4rem;
  border:3px solid var(--ink);border-radius:1.2rem;background:#fff;
  box-shadow:0 5px 0 rgba(74,59,50,.14);
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.pic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,50,.14)}
.pic:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.pic-no{
  position:absolute;top:.2rem;left:.2rem;z-index:1;
  width:1.6rem;height:1.6rem;border-radius:50%;
  display:grid;place-items:center;
  background:var(--paper2);border:2.5px solid var(--ink);
  font-size:.82rem;font-weight:900;line-height:1;
}
.pic-art{display:block;width:100%;aspect-ratio:4/3;border-radius:.9rem;overflow:hidden;background:#F7FBFF}
.pic-art svg{width:100%;height:100%}
.pic.correct{background:var(--green-soft);border-color:#3E8E3A}
.pic.wrong{background:#FFD3CB;border-color:#C9563F}

/* 挑戰二：看圖選句 */
.see-art{
  width:100%;max-width:24rem;margin:0 auto;
  border:3px solid var(--ink);border-radius:1.2rem;overflow:hidden;background:#F7FBFF;
  box-shadow:0 5px 0 rgba(74,59,50,.14);
}
.see-art svg{width:100%;height:auto}
.say-list{display:grid;gap:.6rem}
.say{
  display:flex;align-items:flex-start;gap:.65rem;text-align:left;
  padding:.72rem .85rem;border:3px solid var(--ink);border-radius:1.1rem;background:#fff;
  box-shadow:0 4px 0 rgba(74,59,50,.14);
  font-weight:800;font-size:clamp(1rem,2.2vw,1.18rem);line-height:1.55;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,50,.14)}
.say:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.say-no{
  flex:none;width:1.7rem;height:1.7rem;border-radius:50%;
  display:grid;place-items:center;
  background:var(--green-soft);border:2.5px solid var(--ink);
  font-size:.85rem;font-weight:900;line-height:1;
}
.say-text{min-width:0}
.say.correct{background:var(--green-soft);border-color:#3E8E3A}
.say.wrong{background:#FFD3CB;border-color:#C9563F}
.type-tag{
  display:inline-flex;align-items:center;gap:.3em;
  margin-top:.55rem;padding:.12em .75em;border-radius:99px;border:2px solid;
  font-size:.85rem;font-weight:900;letter-spacing:.03em;
}
.type-tag.dyn{background:var(--orange-soft);border-color:#C9563F;color:#8E3B24}
.type-tag.sta{background:var(--blue-soft);border-color:#2F7FA8;color:#1F5F7E}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.choice{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  padding:.9rem .4rem;border:3px solid var(--ink);border-radius:1.3rem;
  font-weight:900;font-size:clamp(1rem,2.2vw,1.25rem);
  box-shadow:0 6px 0 rgba(74,59,50,.16);
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.choice .ic{width:2rem;height:2rem}
.choice .sub{font-size:.72rem;font-weight:800;color:var(--ink-soft)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,50,.16)}
.choice:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.choice.dyn{background:var(--orange-soft)}
.choice.sta{background:var(--blue-soft)}
.choice.correct{background:var(--green-soft);border-color:#3E8E3A}
.choice.wrong{background:#FFD3CB;border-color:#C9563F}

/* ===== answer sheet ===== */
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(94vw,640px);max-height:76vh;overflow:auto;z-index:50;
  background:var(--paper2);border:3px solid var(--ink);border-bottom:none;
  border-radius:1.5rem 1.5rem 0 0;
  padding:.85rem 1rem calc(1rem + env(safe-area-inset-bottom));
  box-shadow:0 -12px 34px rgba(74,59,50,.22);
  animation:sheetUp .26s cubic-bezier(.2,.9,.3,1.2);
}
@media(min-width:900px){
  .sheet{bottom:1rem;border-bottom:3px solid var(--ink);border-radius:1.5rem}
}
@media(max-width:899px){
  .sheet{max-height:68vh}
}
@keyframes sheetUp{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
.sheet-grab{width:3rem;height:.32rem;border-radius:99px;background:#E2D3BE;margin:0 auto .55rem}
.sheet-head{display:flex;align-items:center;gap:.6rem}
.sheet-badge{width:2.9rem;height:2.9rem;flex:none;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink)}
.sheet-badge .ic{width:1.7rem;height:1.7rem}
.sheet-badge.ok{background:var(--green-soft)}
.sheet-badge.no{background:#FFD3CB}
.sheet-title{font-size:1.25rem;font-weight:900;line-height:1.3}
.sheet-sub{font-size:.84rem;font-weight:800;color:var(--ink-soft)}
.answer-box{margin-top:.65rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.5rem .75rem;display:flex;gap:.5rem;align-items:baseline}
.answer-box b{font-size:.75rem;font-weight:900;color:var(--ink-soft);letter-spacing:.08em;white-space:nowrap}
.answer-box span{font-size:1.05rem;font-weight:900;color:#3E8E3A;line-height:1.5}
.why-text{font-size:.98rem;line-height:1.78;margin-top:.55rem}

    Object.keys(MODES).forEach(function (k) {
      var b = state.best[k];
      if (b && typeof b.stars === 'number') n += b.stars;
    });
    return n;
  }

  /* =========================================================
     Render: home
  ========================================================= */
  function renderHome() {
    homeEl.innerHTML =
      '<div class="home-hero">' +
        '<div class="hero-art">' + ART.cat() + '</div>' +
        '<h1 class="hero-title">動靜描寫<em>小偵探</em></h1>' +
        '<p class="hero-sub">看一看、點一點，找出會動的句子和定格的句子</p>' +
        '<div class="tag-row">' +
          '<span class="tag">小學語文</span>' +
          '<span class="tag">24 道題目</span>' +
          '<span class="tag">每題都有講解</span>' +
        '</div>' +
      '</div>' +
      '<div class="entries">' +
        entryBtn('teach', '#4FC3F7', '#D6F0FF', 'book', '教學區', '6 張圖文卡 · 3 分鐘') +
        entryBtn('practice', '#FF8A65', '#FFD9C9', 'pencil', '練習區', '動詞尋寶 · 看句子選畫面') +
        entryBtn('challenge', '#B39DDB', '#E7DFF7', 'trophy', '挑戰區', '動靜分類 · 看圖選句') +
      '</div>' +
      '<div class="best-row">' +
        '<span class="best-pill">' + icon('star') + '已收集星星 ' + totalStars() + ' / 12</span>' +
        '<span class="best-pill">' + icon('check') + '進度自動保存在這部裝置</span>' +
      '</div>' +
      '<p class="home-note">建議老師用投影機或大屏開啟：<b>字大、圖大、按鈕大</b>，後排同學也看得清楚。</p>';
  }

  function entryBtn(area, color, soft, ic, name, desc) {
    return '<button class="entry" type="button" data-area="' + area + '" style="--c:' + color + ';--soft:' + soft + '">' +
      '<span class="entry-icon">' + icon(ic) + '</span>' +
      '<span class="entry-body"><span class="entry-name">' + name + '</span><span class="entry-desc">' + desc + '</span></span>' +
      '<span class="entry-go">' + icon('right') + '</span>' +
      '</button>';
  }

  /* =========================================================
     Render: teaching
  ========================================================= */
  function renderTeach() {
    var c = TEACH[state.teachIndex];
    var last = state.teachIndex === TEACH.length - 1;
    var body = '';
    body += '<div class="teach-art">' + c.art() + '</div>';
    body += '<div class="teach-card">';
    body += '<span class="kicker"><span class="pin"></span>' + c.kicker + '</span>';
    body += '<h3 class="teach-title">' + c.title + '</h3>';
    body += '<div class="teach-text">' + c.text.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div>';
    if (c.steps) {
      body += '<div class="teach-steps">' + c.steps.map(function (s, i) {
        return '<div class="step-row"><span class="step-no">' + (i + 1) + '</span><p>' + s + '</p></div>';
      }).join('') + '</div>';
    }
    if (c.motto) body += '<div class="motto">' + c.motto + '</div>';
    if (c.example) body += '<div class="teach-example"><span>例句</span>' + c.example + '</div>';
    if (c.chips) body += '<div class="chip-row">' + c.chips.map(function (ch) {
      return '<span class="mini-chip">' + icon(ch.ic) + ch.label + '</span>';
    }).join('') + '</div>';
    body += '</div>';

    teachEl.innerHTML =
      '<div class="section-head">' +
        '<h2 class="section-title">教學區</h2>' +
        '<span class="section-sub">第 ' + (state.teachIndex + 1) + ' / ' + TEACH.length + ' 張</span>' +
      '</div>' +
      '<div class="teach-wrap">' + body + '</div>' +
      '<div class="teach-nav">' +
        '<button class="btn btn-ghost" type="button" data-act="prev"' + (state.teachIndex === 0 ? ' disabled' : '') + '>' + icon('left') + '上一張</button>' +
        '<div class="dots">' + TEACH.map(function (_, i) {
          return '<i class="' + (i === state.teachIndex ? 'on' : '') + '"></i>';
        }).join('') + '</div>' +
        (last
          ? '<button class="btn btn-primary" type="button" data-act="toPractice">去練習' + icon('right') + '</button>'
          : '<button class="btn btn-primary" type="button" data-act="next">下一張' + icon('right') + '</button>') +
      '</div>';
  }

  /* =========================================================
     Render: mode menu
  ========================================================= */
  function renderMenu() {
    var isPractice = state.area === 'practice';
    var modes = modeList().filter(function (m) { return m.area === state.area; });
    menuEl.innerHTML =
      '<div class="section-head">' +
        '<h2 class="section-title">' + (isPractice ? '練習區' : '挑戰區') + '</h2>' +
        '<span class="section-sub">' + (isPractice ? '每種模式 6 題 · 答完有講解' : '兩種模式 · 每種 6 題') + '</span>' +
      '</div>' +
      (isPractice ? '' : '<p class="menu-tip">挑戰區把動態和靜態混在一起：一句話要分進正確的籃子，一幅圖要找出最貼切的句子。</p>') +
      '<div class="mode-list">' + modes.map(function (m) {
        return '<button class="mode-card" type="button" data-mode="' + m.id + '" style="--soft:' + m.soft + ';--c:' + m.color + '">' +
          '<span class="mode-icon">' + icon(m.icon) + '</span>' +
          '<span class="mode-body">' +
            '<span class="mode-name">' + m.name + '</span>' +
            '<span class="mode-desc">' + m.desc + '</span>' +
            '<span class="mode-meta"><span>' + m.tag + '</span><span>6 題</span><span>答後講解</span></span>' +
          '</span>' +
          '</button>';
      }).join('') + '</div>' +
      '<p class="menu-tip">答錯不要緊，每一題都會告訴你答案和原因。可以重複玩，直到全部答對。</p>';
  }

  /* =========================================================
     Render: question
  ========================================================= */
  function orderOptions(q) {
    var arr = q.options.slice();
    var k = (state.qIndex + (state.mode === 'seesay' ? 1 : 0)) % arr.length;
    return arr.slice(k).concat(arr.slice(0, k));
  }

  function renderQuestion() {
    var mode = MODES[state.mode];
    var q = currentQ();
    var total = QUESTIONS[state.mode].length;
    var body = '';

    if (state.mode === 'find') {
      body = '<div class="q-head">' + icon('run') + '任務：點出句子中表示動作的詞語</div>' +
        '<div class="tokens">' + q.tokens.map(function (t) {
          return '<button class="token" type="button" data-act="token" data-id="' + t.id + '">' + t.text + '</button>';
        }).join('') + '</div>' +
        '<p class="menu-tip">小提示：動作詞會讓畫面「動起來」；名詞和「怎樣做」的詞都不是動作。</p>';
    } else if (state.mode === 'picture') {
      body = '<div class="q-head">' + icon('search') + '讀一讀，選出最符合句子的一幅圖</div>' +
        '<div class="q-sentence">' + q.sentence + '</div>' +
        '<div class="pic-grid">' + orderOptions(q).map(function (o, i) {
          return '<button class="pic" type="button" data-act="pic" data-id="' + o.id + '" aria-label="選項' + '一二三'.charAt(i) + '">' +
            '<span class="pic-no" aria-hidden="true">' + 'ABC'.charAt(i) + '</span>' +
            '<span class="pic-art">' + ART[o.id]() + '</span>' +
            '</button>';
        }).join('') + '</div>';
    } else if (state.mode === 'classify') {
      body = '<div class="q-head">' + icon('trophy') + '挑戰一：這句話屬於哪一種描寫？</div>' +
        '<div class="q-sentence">' + q.text + '</div>' +
        judgeButtons();
    } else if (state.mode === 'seesay') {
      body = '<div class="q-head">' + icon('eye') + '挑戰二：看圖，選出最貼切的描寫句子</div>' +
        '<div class="see-art">' + ART[q.art]() + '</div>' +
        '<div class="say-list">' + orderOptions(q).map(function (o, i) {
          return '<button class="say" type="button" data-act="say" data-id="' + o.id + '" aria-label="句子' + '一二三'.charAt(i) + '">' +
            '<span class="say-no" aria-hidden="true">' + 'ABC'.charAt(i) + '</span>' +
            '<span class="say-text">' + o.text + '</span>' +
            '</button>';
        }).join('') + '</div>';
    }

    hostEl.innerHTML =
      '<div class="game-top">' +
        '<span class="chip" style="--c:' + mode.color + '"><span class="dot"></span>' + mode.name + '</span>' +
        '<div class="progress" style="--c:' + mode.color + '"><i style="width:' + (((state.qIndex + 1) / total) * 100) + '%"></i></div>' +
        '<span class="counter">第 ' + (state.qIndex + 1) + ' / ' + total + ' 題</span>' +
      '</div>' +
      '<div class="qcard">' + body + '</div>';

  }

  function judgeButtons() {
    return '<div class="choices">' +
      '<button class="choice dyn" type="button" data-act="judge" data-val="dynamic">' + icon('run') + '動態描寫<span class="sub">畫面會動</span></button>' +
      '<button class="choice sta" type="button" data-act="judge" data-val="static">' + icon('shape') + '靜態描寫<span class="sub">畫面定格</span></button>' +
      '</div>';
  }

  /* =========================================================
     Answering
  ========================================================= */
  function answerText(q) {
    if (state.mode === 'find') {
      for (var i = 0; i < q.tokens.length; i++) if (q.tokens[i].id === q.answer) return q.tokens[i].text;
      return '';
    }
    if (state.mode === 'picture') {
      for (var j = 0; j < q.options.length; j++) if (q.options[j].id === q.answer) return q.options[j].label;
      return '';
    }
    if (state.mode === 'seesay') {
      for (var k = 0; k < q.options.length; k++) if (q.options[k].id === q.answer) return q.options[k].text;
      return '';
    }
    return q.answer === 'dynamic' ? '動態描寫' : '靜態描寫';
  }

  function handleAnswer(choiceId) {
    if (state.locked) return;
    var q = currentQ();
    if (!q) return;
    state.locked = true;
    var correct = choiceId === q.answer;
    state.answers.push({ id: q.id, correct: correct });
    if (correct) state.score += 10;

    paintAnswer(choiceId, q);
    if (correct) AudioKit.correct(); else AudioKit.wrong();
    liveEl.textContent = correct ? '答對了，答案是' + answerText(q) : '答錯了，正確答案是' + answerText(q);
    showSheet(correct, q);
  }

  function paintAnswer(choiceId, q) {
    var sel = state.mode === 'find' ? '[data-act="token"]' : (state.mode === 'picture' ? '[data-act="pic"]' : (state.mode === 'seesay' ? '[data-act="say"]' : '[data-act="judge"]'));
    var nodes = hostEl.querySelectorAll(sel);
    for (var i = 0; i < nodes.length; i++) {
      var btn = nodes[i];
      var val = btn.getAttribute('data-id') || btn.getAttribute('data-val');
      if (val === q.answer) btn.classList.add('correct');
      else if (val === choiceId) btn.classList.add('wrong');
    }
  }

  function showSheet(correct, q) {
    var isLast = state.qIndex >= QUESTIONS[state.mode].length - 1;
    sheetEl.innerHTML =
      '<div class="sheet-grab"></div>' +
      '<div class="sheet-head">' +
        '<div class="sheet-badge ' + (correct ? 'ok' : 'no') + '">' + icon(correct ? 'check' : 'x') + '</div>' +
        '<div><div class="sheet-title">' + (correct ? '答對了！' : '再想想～') + '</div>' +
        '<div class="sheet-sub">' + (correct ? '你的眼睛真利' : '看看正確答案，再讀一次句子') + '</div></div>' +
      '</div>' +
      '<div class="answer-box"><b>答案</b><span>' + answerText(q) + '</span></div>' +
      (state.mode === 'seesay' && q.type ? '<div class="type-tag ' + (q.type === 'dynamic' ? 'dyn' : 'sta') + '">' + (q.type === 'dynamic' ? '這一句是動態描寫' : '這一句是靜態描寫') + '</div>' : '') +
      '<p class="why-text">' + q.explain + '</p>' +
      '<div class="tip-box"><b>小提示：</b>' + q.tip + '</div>' +
      '<button class="btn btn-primary btn-block" type="button" data-act="sheetNext">' + (isLast ? '看成績' : '下一題') + '</button>';
    sheetEl.hidden = false;
    document.body.classList.add('sheet-open');
    window.setTimeout(scrollToAnswer, reduceMotion ? 30 : 340);
    var nextBtn = sheetEl.querySelector('[data-act="sheetNext"]');
    if (nextBtn) { try { nextBtn.focus({ preventScroll: true }); } catch (e) { } }
  }

  function scrollToAnswer() {
    var target = hostEl.querySelector('.correct');
    if (!target || sheetEl.hidden) return;
    var sheetTop = sheetEl.getBoundingClientRect().top;
    var rect = target.getBoundingClientRect();
    var pad = 14;
    if (rect.bottom > sheetTop - pad) {
      if (window.scrollBy) window.scrollBy({ top: rect.bottom - sheetTop + pad, behavior: reduceMotion ? 'auto' : 'smooth' });
      else window.scrollBy(0, rect.bottom - sheetTop + pad);
    }
  }

  function closeSheet() {
    sheetEl.hidden = true;
    sheetEl.innerHTML = '';
    document.body.classList.remove('sheet-open');
  }

  function nextQuestion() {
    closeSheet();
    if (state.qIndex < QUESTIONS[state.mode].length - 1) {
      state.qIndex += 1;
      state.locked = false;
      renderQuestion();
      window.scrollTo(0, 0);
    } else {
      go('result');
    }
  }

  /* =========================================================
     Round lifecycle
  ========================================================= */
  function startRound(modeId) {
    state.mode = modeId;
    state.qIndex = 0;
    state.answers = [];
    state.score = 0;
    state.locked = false;
    closeSheet();
    go('game');
  }

  function finishRound() {
    closeSheet();
    go('result');
  }

  function renderResult() {
    var mode = MODES[state.mode];
    var total = QUESTIONS[state.mode].length;
    var correct = state.answers.filter(function (a) { return a.correct; }).length;
    var stars = correct >= total ? 3 : (correct >= 4 ? 2 : (correct >= 2 ? 1 : 0));

    var prev = state.best[state.mode];
    if (!prev || state.score > (prev.score || 0)) {
      state.best[state.mode] = { score: state.score, correct: correct, stars: stars };
      saveBest();
    }

    var starHtml = [0, 1, 2].map(function (i) {
      return '<span class="st ' + (i < stars ? 'on' : '') + (i === 1 ? ' mid' : '') + '">' + icon('star') + '</span>';
    }).join('');

    var msg = (RESULT_TEXT[state.mode] || {})[stars] || '';

    resultEl.innerHTML =
      '<div class="result-card">' +
        '<span class="chip" style="--c:' + mode.color + '"><span class="dot"></span>' + mode.name + '</span>' +
        '<div class="stars" aria-label="獲得 ' + stars + ' 顆星">' + starHtml + '</div>' +
        '<h2 class="result-title">' + (stars === 3 ? '全部答對，太棒了！' : (stars === 2 ? '表現不錯！' : (stars === 1 ? '繼續努力！' : '再試一次吧！'))) + '</h2>' +
        '<p class="result-score">答對 <b>' + correct + '</b> / ' + total + ' 題 · 得分 ' + state.score + ' 分</p>' +
        '<p class="result-msg">' + msg + '</p>' +
        '<div class="result-actions">' +
          '<button class="btn btn-primary" type="button" data-act="again">' + icon('refresh') + '再玩一次</button>' +
          '<button class="btn" type="button" data-act="toMenu">' + icon('left') + '返回' + (mode.area === 'practice' ? '練習區' : '挑戰區') + '</button>' +
        '</div>' +
        '<p class="result-note">' + icon('star') + ' 已收集星星 ' + totalStars() + ' / 12</p>' +
      '</div>';

    if (stars >= 2) {
      AudioKit.win();
      popConfetti();
    }
  }

  function popConfetti() {
    if (reduceMotion) return;
    confettiEl.innerHTML = '';
    var colors = ['#FF8A65', '#4FC3F7', '#FFD166', '#7BC96F', '#B39DDB'];
    for (var i = 0; i < 34; i++) {
      var bit = document.createElement('i');
      bit.style.left = (Math.random() * 100) + '%';
      bit.style.background = colors[i % colors.length];
      bit.style.animationDuration = (1.7 + Math.random() * 1.3) + 's';
      bit.style.animationDelay = (Math.random() * 0.45) + 's';
      bit.style.opacity = '0.9';
      confettiEl.appendChild(bit);
    }
    window.setTimeout(function () { confettiEl.innerHTML = ''; }, 3400);
  }

  /* =========================================================
     Router
  ========================================================= */
  function go(screen) {
    closeSheet();
    if (screen !== 'result') confettiEl.innerHTML = '';
    state.screen = screen;
    ['home', 'teach', 'menu', 'game', 'result'].forEach(function (n) {
      var el = document.getElementById('screen-' + n);
      if (el) el.hidden = (n !== screen);
    });
    backBtn.hidden = (screen === 'home');
    if (screen === 'home') renderHome();
    else if (screen === 'teach') renderTeach();
    else if (screen === 'menu') renderMenu();
    else if (screen === 'game') renderQuestion();
    else if (screen === 'result') renderResult();
    window.scrollTo(0, 0);
  }

  function openArea(area) {
    if (area === 'teach') {
      state.teachIndex = 0;
      go('teach');
    } else {
      state.area = area;
      go('menu');
    }
  }

  function onBack() {
    if (state.screen === 'teach') go('home');
    else if (state.screen === 'menu') go('home');
    else if (state.screen === 'game') go('menu');
    else if (state.screen === 'result') go('menu');
    else go('home');
  }

  /* =========================================================
     Sound toggle
  ========================================================= */
  function applySoundUI() {
    soundBtn.innerHTML = icon(state.sound ? 'speaker' : 'speakerOff');
    soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', state.sound ? '關閉音效' : '開啟音效');
    soundBtn.classList.toggle('off', !state.sound);
  }

  soundBtn.addEventListener('click', function () {
    state.sound = !state.sound;
    saveSound();
    applySoundUI();
    if (state.sound) AudioKit.click();
  });

  /* =========================================================
     Global click routing
  ========================================================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act],[data-area],[data-mode]') : null;
    if (!el) return;
    if (el.hasAttribute('disabled')) return;

    if (el.hasAttribute('data-area')) { AudioKit.click(); openArea(el.getAttribute('data-area')); return; }
    if (el.hasAttribute('data-mode')) { AudioKit.click(); startRound(el.getAttribute('data-mode')); return; }

    var act = el.getAttribute('data-act');
    if (act === 'back') { AudioKit.click(); onBack(); }
    else if (act === 'prev') { AudioKit.click(); if (state.teachIndex > 0) { state.teachIndex -= 1; renderTeach(); } }
    else if (act === 'next') { AudioKit.click(); if (state.teachIndex < TEACH.length - 1) { state.teachIndex += 1; renderTeach(); } }
    else if (act === 'toPractice') { AudioKit.click(); state.area = 'practice'; go('menu'); }
    else if (act === 'token' || act === 'pic' || act === 'say') { handleAnswer(el.getAttribute('data-id')); }
    else if (act === 'judge') { handleAnswer(el.getAttribute('data-val')); }
    else if (act === 'sheetNext') { AudioKit.click(); nextQuestion(); }
    else if (act === 'again') { AudioKit.click(); startRound(state.mode); }
    else if (act === 'toMenu') { AudioKit.click(); go('menu'); }
  });

  backBtn.addEventListener('click', function () { AudioKit.click(); onBack(); });

  document.addEventListener('pointerdown', function () { if (state.sound) AudioKit.ensure(); }, { once: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.screen !== 'home') { onBack(); }
  });

  /* =========================================================
     Init
  ========================================================= */
  loadBest();
  loadSound();
  applySoundUI();
  go('home');
})();
</script>
</body>
</html>
