<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>呼告小偵探｜小學呼告修辭互動教室</title>
<meta name="description" content="跟著小偵探呼呼學會呼告修辭：圖文教學、初階與高階雙版本、三種互動遊戲各六題，答題即時解說，手機、平板、電腦都能玩。">
<style>
  :root{
    --ink:#1f3350;
    --ink2:#5a7292;
    --paper:#ffffff;
    --cream:#fffaf0;
    --blue:#3aa0ff;
    --blue-soft:#dff1ff;
    --yellow:#ffc94d;
    --yellow-soft:#fff2cc;
    --coral:#ff8a75;
    --green:#2fbf8a;
    --green-soft:#e2fbf1;
    --red:#e0563f;
    --red-soft:#ffefec;
    --purple:#a78bfa;
    --shadow:0 8px 0 rgba(31,51,80,.16);
    --radius:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:18px;}
  html[data-fs="lg"]{font-size:20px;}
  html[data-fs="xl"]{font-size:22px;}
  body{
    margin:0;
    font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 12% -8%, #ffffff 0%, rgba(255,255,255,0) 60%),
      radial-gradient(900px 520px at 92% 4%, #fff3d6 0%, rgba(255,243,214,0) 62%),
      linear-gradient(180deg,#e7f6ff 0%,#f3fbff 46%,#fff7e8 100%);
    background-attachment:fixed;
    min-height:100dvh;
    line-height:1.6;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;
    background:rgba(255,255,255,.72);filter:blur(.5px);
  }
  body::before{width:220px;height:110px;left:-70px;top:16%;box-shadow:90px 18px 0 -12px rgba(255,255,255,.72),170px -16px 0 -22px rgba(255,255,255,.72);}
  body::after{width:180px;height:90px;right:-60px;bottom:14%;box-shadow:-80px -20px 0 -14px rgba(255,255,255,.6);}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  .app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(10px,1.8vw,22px) clamp(12px,2.4vw,26px) 28px;min-height:100dvh;display:flex;flex-direction:column;gap:clamp(10px,1.4vw,18px);}
  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:.6rem;min-height:52px;}
  .icon-btn{
    flex:0 0 auto;width:2.9rem;height:2.9rem;border-radius:50%;
    border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 rgba(31,51,80,.18);
    display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;
    transition:transform .12s ease,box-shadow .12s ease;line-height:1;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,51,80,.18);}
  .icon-btn[hidden]{display:none;}
  .brand{display:flex;flex-direction:column;min-width:0;flex:1;}
  .brand b{font-size:1.05rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand span{font-size:.72rem;color:var(--ink2);line-height:1.2;}
  .level-pill{
    flex:0 0 auto;font-size:.8rem;font-weight:900;padding:.35rem .85rem;border-radius:999px;
    border:2px solid var(--ink);background:var(--yellow);box-shadow:0 3px 0 rgba(31,51,80,.18);
  }
  /* ---------- screens ---------- */
  .stage{flex:1;display:flex;}
  .screen{display:none;width:100%;flex-direction:column;gap:clamp(12px,1.8vw,20px);}
  .screen.active{display:flex;animation:pop .32s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
  /* ---------- home ---------- */
  .hero{
    display:flex;align-items:center;gap:clamp(8px,2vw,26px);
    background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);
    padding:clamp(14px,2.4vw,28px);box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:200px;height:200px;border-radius:50%;background:var(--blue-soft);z-index:0;}
  .hero-copy{position:relative;z-index:1;min-width:0;flex:1;}
  .kicker{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:900;letter-spacing:.18em;color:#2b7fc4;background:var(--blue-soft);border-radius:999px;padding:.25rem .8rem;}
  .hero h1{margin:.45rem 0 .2rem;font-size:clamp(1.58rem,6vw,3.1rem);line-height:1.2;letter-spacing:.02em;}
  .hero h1 em{font-style:normal;color:#2b7fc4;position:relative;}
  .hero h1 .nb{white-space:nowrap;}
  .hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.22em;background:var(--yellow);z-index:-1;border-radius:4px;}
  .hero p{margin:.3rem 0 0;color:var(--ink2);font-size:.95rem;max-width:34em;}
  .mascot{flex:0 0 auto;width:clamp(110px,19vw,190px);height:auto;display:block;position:relative;z-index:1;}
  .level-grid{display:grid;grid-template-columns:1fr;gap:clamp(12px,1.6vw,18px);}
  @media(min-width:720px){.level-grid{grid-template-columns:1fr 1fr;}}
  .level-card{
    text-align:left;display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);
    background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);
    padding:clamp(14px,2vw,22px);box-shadow:var(--shadow);transition:transform .14s ease,box-shadow .14s ease;
    width:100%;
  }
  .level-card:hover{transform:translateY(-3px);box-shadow:0 11px 0 rgba(31,51,80,.16);}
  .level-card:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(31,51,80,.16);}
  .level-card .lv-icon{flex:0 0 auto;width:clamp(56px,8vw,76px);height:clamp(56px,8vw,76px);}
  .level-card h2{margin:0;font-size:1.28rem;}
  .level-card p{margin:.15rem 0 .45rem;font-size:.82rem;color:var(--ink2);line-height:1.45;}
  .lv-tags{display:flex;flex-wrap:wrap;gap:.35rem;}
  .lv-tags span{font-size:.68rem;font-weight:800;padding:.12rem .55rem;border-radius:999px;background:var(--blue-soft);color:#22618f;}
  .level-card[data-level="advanced"] .lv-tags span{background:#efe6ff;color:#5b3fa8;}
  .foot-note{text-align:center;font-size:.72rem;color:#7d90a8;}
  /* ---------- hub ---------- */
  .hub-head{display:flex;align-items:center;gap:clamp(10px,2vw,18px);background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);padding:clamp(12px,2vw,20px);box-shadow:var(--shadow);}
  .hub-head .mascot{width:clamp(76px,11vw,110px);}
  .hub-head h2{margin:0;font-size:clamp(1.2rem,2.6vw,1.6rem);}
  .hub-head p{margin:.15rem 0 0;font-size:.84rem;color:var(--ink2);}
  .section-title{display:flex;align-items:center;gap:.5rem;font-size:.86rem;font-weight:900;letter-spacing:.06em;color:var(--ink2);margin:.2rem 0 -.2rem;}
  .section-title::before{content:"";width:8px;height:18px;border-radius:6px;background:var(--yellow);border:2px solid var(--ink);}
  .teach-entry{
    width:100%;display:flex;align-items:center;gap:clamp(10px,1.6vw,16px);text-align:left;
    background:linear-gradient(120deg,#fffef7,#fff5d8);border:4px solid var(--ink);border-radius:var(--radius);
    padding:clamp(12px,1.8vw,18px);box-shadow:var(--shadow);
  }
  .teach-entry:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(31,51,80,.16);}
  .teach-entry .te-icon{flex:0 0 auto;width:clamp(52px,7vw,64px);height:clamp(52px,7vw,64px);}
  .teach-entry b{display:block;font-size:1.1rem;}
  .teach-entry small{display:block;font-size:.78rem;color:var(--ink2);line-height:1.4;}
  .teach-entry .go{margin-left:auto;flex:0 0 auto;font-weight:900;font-size:.8rem;background:var(--ink);color:#fff;border-radius:999px;padding:.4rem .8rem;white-space:nowrap;}
  .mode-grid{display:grid;grid-template-columns:1fr;gap:clamp(10px,1.5vw,16px);}
  @media(min-width:760px){.mode-grid{grid-template-columns:repeat(3,1fr);}}
  .mode-card{
    text-align:left;display:flex;flex-direction:column;gap:.4rem;background:var(--paper);
    border:4px solid var(--ink);border-radius:var(--radius);padding:clamp(12px,1.8vw,18px);box-shadow:var(--shadow);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(31,51,80,.16);}
  .mode-card .mc-top{display:flex;align-items:center;gap:.6rem;}
  .mode-card .mc-icon{width:3rem;height:3rem;flex:0 0 auto;border-radius:14px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;background:var(--blue-soft);}
  .mode-card[data-mode="b"] .mc-icon{background:var(--green-soft);}
  .mode-card[data-mode="c"] .mc-icon{background:#f1e9ff;}
  .mode-card b{font-size:1.05rem;line-height:1.25;}
  .mode-card small{color:var(--ink2);font-size:.76rem;line-height:1.45;}
  .stars{font-size:.9rem;letter-spacing:.12em;color:#d9a400;min-height:1.3em;}
  .stars .off{color:#c9d4e0;}
  .stat-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:.78rem;color:var(--ink2);}
  .chip{background:var(--paper);border:2px solid #cfe0ee;border-radius:999px;padding:.28rem .7rem;font-weight:800;color:var(--ink);}
  .seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper);}
  .seg button{border:0;background:transparent;padding:.4rem .75rem;font-weight:900;font-size:.78rem;border-right:2px solid #dbe6f0;}
  .seg button:last-child{border-right:0;}
  .seg button[aria-pressed="true"]{background:var(--yellow);}
  /* ---------- teach ---------- */
  .teach-card{background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(14px,2.2vw,26px);display:grid;gap:clamp(10px,2vw,22px);grid-template-columns:1fr;}
  @media(min-width:760px){.teach-card{grid-template-columns:1.02fr 1fr;align-items:center;}}
  .teach-art{background:linear-gradient(160deg,#f4fbff,#fff8e6);border:3px dashed #b9d7ee;border-radius:22px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:clamp(170px,26vh,290px);}
  .teach-art svg{width:100%;height:auto;max-height:clamp(170px,26vh,290px);display:block;}
  .teach-copy h2{margin:0 0 .3rem;font-size:clamp(1.35rem,3vw,1.9rem);line-height:1.25;}
  .teach-copy .lead{font-size:clamp(1rem,1.7vw,1.15rem);margin:0 0 .6rem;}
  .teach-copy ul{margin:.2rem 0 .5rem;padding-left:1.2rem;}
  .teach-copy li{margin:.2rem 0;font-size:.94rem;}
  .example{background:var(--yellow-soft);border-left:8px solid var(--yellow);border-radius:12px;padding:.6rem .8rem;font-size:.92rem;margin:.4rem 0 0;}
  .example b{display:block;font-size:.68rem;letter-spacing:.14em;color:#9a7300;margin-bottom:.15rem;}
  .teach-nav{display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;}
  .teach-nav .btn{flex:0 1 auto;min-width:0;}
  .teach-nav .dots{order:3;flex:1 1 100%;justify-content:center;}
  .dots{display:flex;gap:.35rem;margin:0 auto;}
  .dot{width:.62rem;height:.62rem;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;}
  .dot[aria-current="true"]{background:var(--yellow);transform:scale(1.15);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
    border:3px solid var(--ink);border-radius:18px;background:var(--yellow);
    padding:.75rem 1.25rem;font-size:1rem;font-weight:900;box-shadow:0 6px 0 rgba(31,51,80,.22);
    transition:transform .1s ease,box-shadow .1s ease;min-height:56px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,51,80,.22);}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn.ghost{background:#fff;}
  .btn:disabled{opacity:.45;box-shadow:0 6px 0 rgba(31,51,80,.12);}
  /* ---------- game ---------- */
  .game-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .qcount{font-weight:900;font-size:.9rem;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:.25rem .8rem;box-shadow:0 3px 0 rgba(31,51,80,.16);}
  .score-pill{margin-left:auto;font-weight:900;font-size:.9rem;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:.25rem .85rem;box-shadow:0 3px 0 rgba(31,51,80,.16);}
  .bar{height:.78rem;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc7ff,#3aa0ff);border-radius:999px;transition:width .35s ease;}
  .q-card{background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(14px,2.2vw,24px);display:flex;flex-direction:column;gap:clamp(10px,1.6vw,16px);}
  .q-tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:900;letter-spacing:.1em;color:#22618f;background:var(--blue-soft);border-radius:999px;padding:.2rem .7rem;align-self:flex-start;}
  .q-stem{margin:0;font-size:clamp(1.12rem,2.4vw,1.5rem);line-height:1.55;font-weight:900;}
  .q-stem .hl{color:#1f6fb2;border-bottom:4px solid var(--yellow);}
  .q-sub{margin:-.3rem 0 0;font-size:.82rem;color:var(--ink2);display:flex;align-items:center;gap:.5rem;}
  .speak{border:2px solid #bcd8ee;background:#f2faff;color:#22618f;border-radius:999px;padding:.2rem .7rem;font-size:.74rem;font-weight:900;}
  .opts{display:grid;grid-template-columns:1fr;gap:.65rem;}
  @media(min-width:760px){.opts.two{grid-template-columns:1fr 1fr;}}
  .opt{
    display:flex;align-items:center;gap:.7rem;text-align:left;width:100%;
    background:#fff;border:3px solid #c9dced;border-radius:18px;padding:.85rem .9rem;
    font-size:clamp(.95rem,1.9vw,1.1rem);line-height:1.5;font-weight:700;
    transition:transform .1s ease,border-color .15s ease,background .15s ease;min-height:60px;
  }
  .opt .idx{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;border:2px solid var(--ink);background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;}
  .opt:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--green-soft);border-color:var(--green);}
  .opt.correct .idx{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{background:var(--red-soft);border-color:var(--red);}
  .opt.wrong .idx{background:var(--red);color:#fff;border-color:var(--red);}
  .opt.dim{opacity:.5;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
  .cat{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
    background:#fff;border:3px solid #c9dced;border-radius:18px;padding:.75rem .5rem;min-height:88px;
    font-size:clamp(.9rem,2vw,1.05rem);font-weight:900;
  }
  .cat .badge{width:2.3rem;height:2.3rem;border-radius:12px;background:var(--blue-soft);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.05rem;}
  .cat:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);}
  .cat.correct{background:var(--green-soft);border-color:var(--green);}
  .cat.wrong{background:var(--red-soft);border-color:var(--red);}
  .cat.dim{opacity:.5;}
  .feedback{border:3px solid var(--ink);border-radius:22px;padding:clamp(12px,1.8vw,18px);background:var(--cream);display:none;flex-direction:column;gap:.45rem;animation:pop .28s ease;}
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--green-soft);border-color:#1f9d63;}
  .feedback.no{background:var(--red-soft);border-color:var(--red);}
  .fb-head{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.08rem;}
  .fb-mark{width:1.9rem;height:1.9rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;font-weight:900;flex:0 0 auto;}
  .feedback.ok .fb-mark{background:#1f9d63;}
  .feedback.no .fb-mark{background:var(--red);}
  .fb-ans{font-size:.95rem;font-weight:900;}
  .fb-ans span{background:rgba(255,255,255,.75);border-radius:8px;padding:.1rem .45rem;}
  .fb-why{font-size:.92rem;line-height:1.65;margin:0;}
  .fb-why b{color:#1f6fb2;}
  .fb-actions{display:flex;justify-content:flex-end;margin-top:.2rem;}
  /* ---------- result ---------- */
  .result-card{background:var(--paper);border:4px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3vw,32px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem;}
  .result-card h2{margin:0;font-size:clamp(1.4rem,3.2vw,2rem);}
  .big-stars{font-size:clamp(2rem,6vw,3rem);letter-spacing:.18em;color:#e8b400;line-height:1.1;}
  .big-stars .off{color:#d6dfe9;}
  .result-score{font-size:1.05rem;font-weight:900;}
  .result-score em{font-style:normal;color:#2b7fc4;font-size:1.5em;}
  .result-tip{font-size:.88rem;color:var(--ink2);max-width:32em;margin:0;}
  .result-actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.4rem;}
  .review{width:100%;text-align:left;border-top:3px dashed #d7e3ee;padding-top:.8rem;margin-top:.4rem;}
  .review h3{font-size:.86rem;margin:0 0 .4rem;color:var(--ink2);letter-spacing:.08em;}
  .review-item{display:flex;gap:.5rem;font-size:.84rem;padding:.32rem 0;border-bottom:1px dashed #e6eef6;}
  .review-item:last-child{border-bottom:0;}
  .review-item .ri-mark{flex:0 0 auto;width:1.35rem;height:1.35rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#fff;}
  .ri-ok{background:#1f9d63;}
  .ri-no{background:var(--red);}
  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translate(-50%,-16px);
    background:rgba(31,51,80,.94);color:#fff;font-size:.82rem;font-weight:700;
    padding:.6rem 1rem;border-radius:999px;opacity:0;pointer-events:none;transition:.25s ease;z-index:50;
    max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  .confetti{position:fixed;top:-14px;width:10px;height:16px;border-radius:3px;z-index:40;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9;}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>

  var actx = null;
  function ensureAudio(){
    if(!state.sound) return null;
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
      }
      if(actx.state === "suspended") actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  function tone(freq, at, dur, type, vol){
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + at);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + at);
      gain.gain.exponentialRampToValueAtTime(vol || 0.16, ctx.currentTime + at + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + at);
      osc.stop(ctx.currentTime + at + dur + 0.02);
    }catch(e){}
  }
  function sfx(name){
    if(!state.sound) return;
    if(name === "click"){ tone(660, 0, 0.07, "triangle", 0.09); }
    else if(name === "correct"){ tone(523.25,0,0.12,"sine",0.14); tone(659.25,0.09,0.12,"sine",0.14); tone(783.99,0.18,0.22,"sine",0.16); }
    else if(name === "wrong"){ tone(220,0,0.16,"square",0.07); tone(174.61,0.13,0.24,"square",0.07); }
    else if(name === "win"){ [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){ tone(f, i*0.11, 0.24, "sine", 0.15); }); }
    else if(name === "star"){ tone(1046.5,0,0.1,"sine",0.1); tone(1318.5,0.08,0.16,"sine",0.1); }
  }
  function speak(text){
    if(!("speechSynthesis" in window)){ toast("這個瀏覽器不支援語音朗讀，請看文字題目"); return; }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-TW";
      u.rate = 0.88;
      u.pitch = 1.05;
      var voices = window.speechSynthesis.getVoices() || [];
      for(var i=0;i<voices.length;i++){
        if(/zh[-_]?(TW|Hant)/i.test(voices[i].lang) || /台灣|臺灣|繁體/.test(voices[i].name)){ u.voice = voices[i]; break; }
      }
      window.speechSynthesis.speak(u);
    }catch(e){ toast("語音暫時無法使用，請看文字題目"); }
  }

  var TEACH = {
    basic:[
      {tag:"第 1 張 · 概念", title:"什麼是呼告？", body:'<p class="lead">把不在面前的人或物，當作就在眼前，<b>直接稱呼它、對它說話</b>。</p><ul><li>不一定要對方聽得到</li><li>重點是「稱呼 ＋ 傾訴」</li></ul><div class="example"><b>例子</b>「太陽公公啊，請你快點出來吧！」</div>'},
      {tag:"第 2 張 · 三要素", title:"一句呼告，有三個部分", body:'<p class="lead">拆開來看，就一點也不難。</p><ul><li><b>誰在說</b>：寫句子的人（作者）</li><li><b>向誰說</b>：被稱呼的對象</li><li><b>說什麼</b>：祈求、讚美、思念或提問</li></ul><div class="example"><b>例子</b>「小草啊，你為什麼低著頭？」→ 作者向小草發問。</div>'},
      {tag:"第 3 張 · 對象", title:"可以呼告的四類對象", body:'<ul><li><b>人物</b>：媽媽、奶奶、朋友</li><li><b>物件</b>：國旗、老樹、小貓</li><li><b>大自然</b>：大海、風、月亮</li><li><b>上天神明</b>：老天爺</li></ul><div class="example"><b>小提示</b>對象可以是看得見的，也可以是看不見的。</div>'},
      {tag:"第 4 張 · 易錯點", title:"面對面說話，不算呼告", body:'<p class="lead">「小明，你過來一下。」只是<b>稱呼語</b>，因為小明就在面前，能立刻回答。</p><ul><li>呼告的對象：通常不在面前、不會回答</li><li>有沒有逗號、感嘆號，不是判斷標準</li></ul><div class="example"><b>對比</b>「月亮啊，你想我嗎？」← 月亮不會回答，是呼告。</div>'},
      {tag:"第 5 張 · 語氣", title:"讀出聲，感情就出來了", body:'<p class="lead">呼告常用「啊、呀、吧、呢」等語氣詞，配合感嘆號。</p><ul><li>祈求：請你……吧！</li><li>讚美：你真……！</li><li>思念：你可知道……？</li></ul><div class="example"><b>試試看</b>先小聲讀，再大聲讀，比較哪一種更像在呼喚。</div>'}
    ],
    advanced:[
      {tag:"第 1 張 · 再認識", title:"呼告＝稱呼 ＋ 傾訴", body:'<p class="lead">對象可以是具體的人、物、景物，也可以是<b>抽象概念</b>。</p><ul><li>具體：媽媽、老樹、大海</li><li>抽象：時間、自由、青春、祖國</li></ul><div class="example"><b>例子</b>「時間啊，請你慢一點走！」</div>'},
      {tag:"第 2 張 · 辨析", title:"呼告與擬人，差在哪裡？", body:'<ul><li><b>擬人</b>：把物當人寫，不一定稱呼它</li><li><b>呼告</b>：一定直接稱呼，並對它說話</li><li>兩者可以同時出現，例如「花兒啊，你為什麼紅著臉？」</li></ul><div class="example"><b>對比</b>「花兒在風中笑。」是擬人；「花兒啊，你為誰紅了臉？」是呼告。</div>'},
      {tag:"第 3 張 · 作用", title:"作者為什麼要呼告？", body:'<ul><li><b>抒情</b>：把強烈情感直接說出來</li><li><b>呼籲</b>：號召讀者一起行動</li><li><b>營造氣勢</b>：連續呼喊，語氣更有力</li><li><b>拉近距離</b>：像面對面說話，更親切</li></ul><div class="example"><b>例子</b>「風啊，你刮吧！雨啊，你下吧！」→ 氣勢豪邁。</div>'},
      {tag:"第 4 張 · 判斷", title:"三個問題，快速判斷", body:'<ul><li>① 有沒有直接稱呼？</li><li>② 對象在不在面前？能不能回答？</li><li>③ 有沒有對它說話的內容？</li></ul><div class="example"><b>口訣</b>有稱呼、不在場、有話說 → 呼告。</div>'},
      {tag:"第 5 張 · 賞析", title:"讀出呼告的力量", body:'<p class="lead">同一個對象，寫法不同，力量也不同。</p><ul><li>平淡：媽媽回來了。</li><li>呼告：媽媽啊，你終於回來了！</li></ul><div class="example"><b>想一想</b>加了稱呼與感嘆，句子多了什麼？（期待、驚喜、思念）</div>'}

  /* =========================================================
     5. 畫面切換
     ========================================================= */
  var screens = ["home","hub","teach","game","result"];
  var current = "home";

  function show(name){
    current = name;
    screens.forEach(function(k){
      var el = $("screen-" + k);
      if(el) el.classList.toggle("active", k === name);
    });
    $("backBtn").hidden = (name === "home");
    $("levelPill").hidden = (name === "home");
    window.scrollTo({top:0, behavior:"smooth"});
    if(name === "hub") renderStars();
  }

  function setLevel(level){
    state.level = level;
    $("levelPill").textContent = level === "basic" ? "初階版" : "高階版";
    $("hubTitle").textContent = (level === "basic" ? "初階版" : "高階版") + " · 偵探訓練";
    $("hubDesc").textContent = level === "basic"
      ? "先看 5 分鐘圖文教學，再挑一種遊戲模式挑戰。"
      : "先複習呼告與擬人的分別，再挑戰高階辨析。";
    renderModes();
    renderStars();
  }

  /* =========================================================
     6. 首頁 / 選單
     ========================================================= */
  function renderModes(){
    var grid = $("modeGrid");
    grid.innerHTML = "";
    MODES.forEach(function(m, i){
      var btn = document.createElement("button");
      btn.className = "mode-card";
      btn.setAttribute("data-mode", m.id);
      btn.innerHTML =
        '<div class="mc-top"><div class="mc-icon">' + m.icon + '</div><b>模式' + "一二三".charAt(i) + " · " + m.name + '</b></div>' +
        '<small>' + m.desc + '</small>' +
        '<div class="stars" data-stars="' + m.id + '"></div>' +
        '<div class="stat-row"><span class="chip">' + m.tip + '</span><span class="chip">6 題</span></div>';
      btn.addEventListener("click", function(){ startGame(m.id); });
      grid.appendChild(btn);
    });
  }

  function renderStars(){
    var total = 0;
    MODES.forEach(function(m){
      var n = state.best[state.level][m.id] || 0;
      total += n;
      var el = document.querySelector('[data-stars="' + m.id + '"]');
      if(el){
        var html = "";
        for(var i=0;i<3;i++){ html += '<span class="' + (i < n ? "" : "off") + '">★</span>'; }
        el.innerHTML = html;
        el.setAttribute("aria-label", "最佳成績 " + n + " 顆星");
      }
    });
    $("starTotal").textContent = "★ " + total + " / 9";
    $("starHint").textContent = state.level === "basic" ? "初階三模式" : "高階三模式";
  }

  /* =========================================================
     7. 教學
     ========================================================= */
  function openTeach(idx){
    state.teachIndex = idx || 0;
    renderTeach();
    show("teach");
  }
  function renderTeach(){
    var list = TEACH[state.level];
    var i = state.teachIndex;
    var item = list[i];
    $("teachArt").innerHTML = ART[state.level][i];
    $("teachTag").textContent = item.tag;
    $("teachTitle").textContent = item.title;
    $("teachBody").innerHTML = item.body;
    var dots = $("teachDots");
    dots.innerHTML = "";
    list.forEach(function(_, j){
      var b = document.createElement("button");
      b.className = "dot";
      b.setAttribute("aria-label", "第 " + (j+1) + " 張");
      b.setAttribute("aria-current", j === i ? "true" : "false");
      b.addEventListener("click", function(){ state.teachIndex = j; renderTeach(); sfx("click"); });
      dots.appendChild(b);
    });
    $("teachPrev").disabled = (i === 0);
    var last = (i === list.length - 1);
    $("teachNext").textContent = last ? "去挑戰 →" : "下一張 →";
    $("teachNext").classList.toggle("blue", true);
  }

  /* =========================================================
     8. 遊戲
     ========================================================= */
  function questions(){
    return BANK[state.level][state.mode];
  }

  function startGame(mode){
    state.mode = mode;
    state.index = 0;
    state.score = 0;
    state.answers = [];
    state.locked = false;
    show("game");
    renderQuestion();
  }

  function renderQuestion(){
    clearTimeout(toastTimer);
    $("toast").classList.remove("show");
    var qs = questions();
    var q = qs[state.index];
    state.locked = false;

    $("qCount").textContent = "第 " + (state.index + 1) + " / " + qs.length + " 題";
    $("qScore").textContent = "★ " + state.score;
    $("qBar").style.width = ((state.index) / qs.length * 100) + "%";

    var m = MODES.filter(function(x){ return x.id === state.mode; })[0];
    $("qTag").textContent = "模式" + "一二三".charAt(MODES.indexOf(m)) + " · " + m.name;
    $("qStem").textContent = q.stem;

    $("qSub").hidden = false;
    $("qOptions").className = "opts" + (state.mode === "b" ? "" : " two");

    var fb = $("feedback");
    fb.className = "feedback";
    fb.classList.remove("show");

    var box = $("qOptions");
    box.innerHTML = "";

    if(state.mode === "b"){
      var cats = CATS[state.level];
      cats.forEach(function(cat, i){
        var b = document.createElement("button");
        b.className = "cat";
        b.type = "button";
        b.innerHTML = '<span class="badge">' + cat.badge + '</span><span>' + cat.label + '</span>';
        b.addEventListener("click", function(){ pick(i, b); });
        box.appendChild(b);
      });
    }else{
      q.options.forEach(function(text, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.type = "button";
        b.innerHTML = '<span class="idx">' + "①②③④".charAt(i) + '</span><span class="opt-text"></span>';
        b.querySelector(".opt-text").textContent = text;
        b.addEventListener("click", function(){ pick(i, b); });
        box.appendChild(b);
      });
    }
  }

  function pick(choice, btn){
    if(state.locked) return;
    state.locked = true;

    var qs = questions();
    var q = qs[state.index];
    var ok = (choice === q.answer);

    var buttons = Array.prototype.slice.call($("qOptions").children);
    buttons.forEach(function(el, i){
      el.disabled = true;
      if(i === q.answer) el.classList.add("correct");
      else if(i === choice) el.classList.add("wrong");
      else el.classList.add("dim");
    });

    if(ok){
      state.score += 1;
      sfx("correct");
    }else{
      sfx("wrong");
    }
    $("qScore").textContent = "★ " + state.score;
    state.answers.push({ok:ok, stem:q.stem, answer:q.options[q.answer], explain:q.explain});

    var fb = $("feedback");
    fb.className = "feedback show " + (ok ? "ok" : "no");
    $("fbMark").textContent = ok ? "✓" : "!";
    $("fbTitle").textContent = ok ? "答對了！" : "再想一想";
    $("fbAns").innerHTML = '正解：<span></span>';
    $("fbAns").querySelector("span").textContent = q.options[q.answer];
    $("fbWhy").textContent = q.explain;
    $("nextBtn").textContent = (state.index === qs.length - 1) ? "看成績 →" : "下一題 →";

    if(ok){ burst(); }

    setTimeout(function(){
      try{
        var r = $("feedback").getBoundingClientRect();
        var over = r.bottom - (window.innerHeight - 16);
        if(over > 0){
          window.scrollBy({top: Math.min(over, 220), behavior:"smooth"});
        }
      }catch(e){}
    }, 120);
  }

  function nextQuestion(){
    var qs = questions();
    state.index += 1;
    if(state.index >= qs.length){
      finish();
      return;
    }
    sfx("click");
    renderQuestion();
  }

  /* =========================================================
     9. 結算
     ========================================================= */
  function starsFor(score, total){
    var rate = score / total;
    if(score >= total - 1) return 3;
    if(rate >= 0.5) return 2;
    return 1;
  }

  function finish(){
    var qs = questions();
    var total = qs.length;
    var stars = starsFor(state.score, total);

    if(stars > (state.best[state.level][state.mode] || 0)){
      state.best[state.level][state.mode] = stars;
      saveStore();
    }

    $("resultStars").innerHTML = "";
    for(var i=0;i<3;i++){
      var s = document.createElement("span");
      s.textContent = "★";
      if(i >= stars) s.className = "off";
      $("resultStars").appendChild(s);
    }
    $("resultStars").setAttribute("aria-label", "獲得 " + stars + " 顆星");

    $("resultScore").innerHTML = "答對 <em>" + state.score + "</em> / " + total + " 題";
    var titles = ["再接再厲，偵探實習生！","不錯喔，快要破案了！","太厲害了，呼告小偵探！"];
    $("resultTitle").textContent = titles[stars - 1];
    var tips = [
      "先回教學小教室看一次「稱呼＋傾訴」，再回來挑戰，你會發現題目變簡單了。",
      "你已經抓到重點了！再玩一次，試著把每題的解釋讀出聲。",
      "太厲害了！可以挑戰另一個版本，看看高階的呼告與擬人辨析。"
    ];
    $("resultTip").textContent = (stars === 3 && state.score < total)
      ? "只差一題就全對！再玩一次，把錯的那一題解析讀一遍。"
      : tips[stars - 1];
    $("resultMascot").innerHTML = mascot(stars >= 3 ? "wow" : (stars === 2 ? "happy" : "sad"));

    var box = $("reviewBox");
    box.innerHTML = "";
    if(state.score < total){
      var h = document.createElement("h3");
      h.textContent = "再想一次的題目";
      box.appendChild(h);
      state.answers.forEach(function(a){
        if(a.ok) return;
        var row = document.createElement("div");
        row.className = "review-item";
        var mark = document.createElement("span");
        mark.className = "ri-mark ri-no";
        mark.textContent = "!";
        var txt = document.createElement("span");
        txt.textContent = a.stem + "　正解：" + a.answer;
        row.appendChild(mark); row.appendChild(txt);
        box.appendChild(row);
      });
    }

    sfx("win");
    if(stars === 3){ burst(); setTimeout(burst, 420); }
    show("result");
  }

  /* =========================================================
     10. 彩帶
     ========================================================= */
  var COLORS = ["#ffc94d","#3aa0ff","#ff8a75","#2fbf8a","#a78bfa"];
  function burst(){
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for(var i=0;i<18;i++){
      var d = document.createElement("div");
      d.className = "confetti";
      d.style.left = (Math.random()*100) + "vw";
      d.style.background = COLORS[i % COLORS.length];
      d.style.animationDuration = (1.6 + Math.random()*1.1) + "s";
      d.style.animationDelay = (Math.random()*0.25) + "s";
      d.style.transform = "rotate(" + Math.random()*180 + "deg)";
      document.body.appendChild(d);
      (function(node){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 3200);
      })(d);
    }
  }

  /* =========================================================
     11. 事件綁定
     ========================================================= */
  function applyFs(){
    document.documentElement.setAttribute("data-fs", state.fs);
    Array.prototype.forEach.call($("fsSeg").children, function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-fs") === state.fs ? "true" : "false");
    });
  }

  function updateSoundBtn(){
    $("soundBtn").textContent = state.sound ? "♪" : "×";
    $("soundBtn").setAttribute("aria-pressed", state.sound ? "true" : "false");
    $("soundBtn").setAttribute("aria-label", state.sound ? "關閉音效" : "開啟音效");
  }

  function init(){
    validateBank();
    loadStore();
    applyFs();
    updateSoundBtn();

    $("homeMascot").innerHTML = mascot("happy");
    $("hubMascot").innerHTML = mascot("wow");
    $("resultMascot").innerHTML = mascot("happy");

    Array.prototype.forEach.call(document.querySelectorAll(".level-card"), function(card){
      card.addEventListener("click", function(){
        ensureAudio();
        sfx("click");
        setLevel(card.getAttribute("data-level"));
        show("hub");
      });
    });

    $("backBtn").addEventListener("click", function(){
      sfx("click");
      if(current === "game"){ show("hub"); }
      else if(current === "result"){ show("hub"); }
      else if(current === "teach"){ show("hub"); }
      else if(current === "hub"){ show("home"); }
    });

    $("soundBtn").addEventListener("click", function(){
      state.sound = !state.sound;
      updateSoundBtn();
      saveStore();
      if(state.sound){ sfx("click"); toast("音效已開啟"); }
      else{ toast("音效已關閉"); }
    });

    $("teachEntry").addEventListener("click", function(){ sfx("click"); openTeach(0); });

    $("teachPrev").addEventListener("click", function(){
      if(state.teachIndex > 0){ state.teachIndex -= 1; sfx("click"); renderTeach(); }
    });
    $("teachNext").addEventListener("click", function(){
      var list = TEACH[state.level];
      if(state.teachIndex < list.length - 1){ state.teachIndex += 1; sfx("click"); renderTeach(); }
      else{ sfx("click"); show("hub"); toast("選一種模式，開始挑戰吧！"); }
    });

    $("speakBtn").addEventListener("click", function(){
      var qs = questions();
      var q = qs[state.index];
      var text = q.stem;
      if(state.mode !== "b"){
        text += "。選項：" + q.options.join("；");
      }else{
        text += "。請選擇類別：" + q.options.join("、");
      }
      speak(text);
    });

    $("nextBtn").addEventListener("click", nextQuestion);

    $("againBtn").addEventListener("click", function(){ sfx("click"); startGame(state.mode); });
    $("otherBtn").addEventListener("click", function(){ sfx("click"); show("hub"); });
    $("teachBtn2").addEventListener("click", function(){ sfx("click"); openTeach(0); });

    Array.prototype.forEach.call($("fsSeg").children, function(b){
      b.addEventListener("click", function(){
        state.fs = b.getAttribute("data-fs");
        applyFs();
        saveStore();
        sfx("click");
      });
    });

    // 教學區左右滑動（手機）
    var touchX = null;
    var teachScreen = $("screen-teach");
    teachScreen.addEventListener("touchstart", function(e){
      if(e.touches.length === 1) touchX = e.touches[0].clientX;
    }, {passive:true});
    teachScreen.addEventListener("touchend", function(e){
      if(touchX === null) return;
      var dx = (e.changedTouches[0].clientX - touchX);
      touchX = null;
      if(Math.abs(dx) < 50) return;
      var list = TEACH[state.level];
      if(dx < 0 && state.teachIndex < list.length - 1){ state.teachIndex += 1; renderTeach(); }
      else if(dx > 0 && state.teachIndex > 0){ state.teachIndex -= 1; renderTeach(); }
    }, {passive:true});

    // 鍵盤：1-4 選答、Enter 下一題
    document.addEventListener("keydown", function(e){
      if(current !== "game") return;
      if(e.key === "Enter" && $("feedback").classList.contains("show")){
        e.preventDefault();
        nextQuestion();
        return;
      }
      var n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4 && !state.locked){
        var btns = $("qOptions").children;
        if(btns[n-1]) btns[n-1].click();
      }
    });

    show("home");
  }

  init();
})();
</script>
</body>
</html>
