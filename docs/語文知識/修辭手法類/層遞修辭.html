<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>層層向上 · 小學層遞修辭互動小學堂</title>
<meta name="description" content="小學層遞修辭互動學習遊戲：圖卡教學＋兩種互動模式（階梯排序、修辭小偵探／句子急診室），初階與高階各 12 題，即時解說與音效回饋。">
<style>
  :root{
    --cream:#FFF6E6;
    --paper:#FFFDF7;
    --ink:#322C4A;
    --ink2:#6B6490;
    --edge:#322C4A;
    --coral:#FF7A59;
    --coral-d:#F0603E;
    --sun:#FFC94B;
    --sun-l:#FFE9B8;
    --mint:#2FBF97;
    --mint-l:#E4F9F1;
    --sky:#5AA9E6;
    --sky-l:#E4F1FB;
    --grape:#8C7BE0;
    --pink:#FF9AB5;
    --shadow:0.2rem 0.2rem 0 rgba(50,44,74,0.16);
    --shadow-lg:0.34rem 0.34rem 0 rgba(50,44,74,0.18);
    --bd:0.16rem solid var(--edge);
    --r:1.5rem;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;-webkit-text-size-adjust:100%;}
  @media (min-width:48em){html{font-size:17.5px;}}
  @media (min-width:75em){html{font-size:21px;}}
  @media (min-width:75em){
    .home{padding-top:1.4rem;}
    .hero-ill{width:24rem;}
    .level-grid{max-width:52rem;}
    .teach-card{padding:2.1rem;}
    .ill-wrap{min-height:15rem;}
  }

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    color:var(--ink);
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 8% 4%, #FFE1AC 0 14%, transparent 46%),
      radial-gradient(circle at 93% 8%, #CFF0E5 0 12%, transparent 44%),
      radial-gradient(circle at 50% 104%, #FFDCE4 0 16%, transparent 52%);
    background-attachment:fixed;
    font-family:"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC","Heiti TC","Hiragino Sans GB",sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  svg text{font-family:inherit;}
  button{font-family:inherit;}

  #app{width:100%;max-width:72rem;margin:0 auto;padding:0.7rem clamp(0.8rem,3.2vw,2rem) 3rem;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:0.8rem;padding:0.15rem 0 0.9rem;}
  .brand{display:flex;align-items:center;gap:0.55rem;font-weight:900;font-size:0.95rem;letter-spacing:0.02em;color:var(--ink);}
  .brand svg{width:2rem;height:2rem;flex:none;}
  .sound-btn{
    width:2.9rem;height:2.9rem;flex:none;display:grid;place-items:center;
    background:var(--paper);border:var(--bd);border-radius:50%;
    box-shadow:var(--shadow);cursor:pointer;color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .sound-btn svg{width:1.45rem;height:1.45rem;}
  .sound-btn:active{transform:translate(0.1rem,0.1rem);box-shadow:none;}

  /* ---------- generic ---------- */
  .view-in{animation:pop 0.32s cubic-bezier(.22,1.2,.36,1) both;}
  @keyframes pop{from{opacity:0;transform:translateY(0.8rem) scale(.985);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .view-in{animation:none;}
    *{animation-duration:0.001s !important;transition-duration:0.001s !important;}
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:0.45rem;
    font:inherit;font-weight:800;font-size:1rem;line-height:1.35;
    min-height:3.1rem;padding:0.6rem 1.2rem;
    color:var(--ink);background:var(--paper);
    border:var(--bd);border-radius:1.1rem;
    box-shadow:var(--shadow);cursor:pointer;text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease,box-shadow .08s ease,background .15s ease;
  }
  .btn:hover{background:#fff;}
  .btn:active{transform:translate(0.14rem,0.14rem);box-shadow:0.04rem 0.04rem 0 rgba(50,44,74,0.16);}
  .btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.slot:focus-visible,.hub-card:focus-visible,.level-card:focus-visible,.sound-btn:focus-visible{
    outline:0.18rem solid var(--sky);outline-offset:0.16rem;
  }
  .btn[disabled]{opacity:0.45;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn.primary{background:var(--coral);color:#fff;}
  .btn.primary:hover{background:var(--coral-d);}
  .btn.mint{background:var(--mint);color:#fff;}
  .btn.wide{width:100%;}
  .btn.sm{min-height:2.6rem;font-size:0.9rem;padding:0.4rem 0.85rem;border-radius:0.9rem;}
  .btn.ghost{background:transparent;box-shadow:none;border-color:rgba(50,44,74,0.25);}
  .btn.ghost:hover{background:rgba(255,255,255,0.6);}
  .btn.icon{width:3.1rem;height:3.1rem;padding:0;min-height:0;}
  .btn.icon svg{width:1.5rem;height:1.5rem;}

  .pill{
    display:inline-flex;align-items:center;gap:0.4rem;
    background:var(--sun-l);border:0.12rem solid var(--edge);border-radius:999px;
    padding:0.25rem 0.9rem;font-weight:800;font-size:0.85rem;
  }
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap;}

  /* ---------- home ---------- */
  .home{text-align:center;padding-top:0.4rem;}
  .hero-ill{width:min(21rem,76vw);margin:0 auto -0.2rem;}
  .hero-ill svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0.4rem 0 rgba(50,44,74,0.08));}
  .eyebrow{display:inline-block;margin:0 0 0.3rem;font-size:0.82rem;font-weight:800;letter-spacing:0.22em;color:var(--ink2);}
  .hero-title{
    margin:0;font-size:clamp(2.5rem,9vw,4.2rem);line-height:1.05;letter-spacing:0.04em;font-weight:900;
  }
  .hero-title em{font-style:normal;color:var(--ink);position:relative;display:inline-block;isolation:isolate;}
  .hero-title em::after{
    content:"";position:absolute;left:-1.5%;right:-1.5%;bottom:0.02em;height:0.32em;
    background:var(--sun);border-radius:0.22em;z-index:-1;
  }
  .hero-sub{margin:0.5rem 0 0;font-size:1.25rem;font-weight:800;color:var(--ink);}
  .hero-desc{margin:0.6rem auto 1.4rem;max-width:30rem;color:var(--ink2);font-size:1rem;font-weight:600;}

  .level-grid{display:grid;gap:1rem;grid-template-columns:1fr;text-align:left;max-width:46rem;margin:0 auto;}
  @media (min-width:46em){.level-grid{grid-template-columns:1fr 1fr;}}
  .level-card{
    position:relative;display:flex;flex-direction:column;gap:0.35rem;
    padding:1.15rem 1.25rem 1.1rem;background:var(--paper);
    border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow-lg);
    cursor:pointer;text-align:left;color:var(--ink);
    -webkit-tap-highlight-color:transparent;transition:transform .1s ease,box-shadow .1s ease;
  }
  .level-card:hover{transform:translate(-0.1rem,-0.1rem);box-shadow:0.44rem 0.44rem 0 rgba(50,44,74,0.18);}
  .level-card:active{transform:translate(0.14rem,0.14rem);box-shadow:0.08rem 0.08rem 0 rgba(50,44,74,0.16);}
  .level-card .big-ic{position:absolute;right:0.9rem;top:0.9rem;width:3.2rem;height:3.2rem;opacity:0.95;}
  .level-card .big-ic svg{width:100%;height:100%;}
  .level-badge{display:inline-block;width:fit-content;font-size:0.75rem;font-weight:900;letter-spacing:0.12em;
    padding:0.15rem 0.65rem;border-radius:999px;background:var(--mint-l);border:0.12rem solid var(--edge);}
  .level-card.hard .level-badge{background:var(--sky-l);}
  .level-name{font-size:1.7rem;font-weight:900;letter-spacing:0.03em;margin-top:0.15rem;}
  .level-meta{font-size:0.92rem;color:var(--ink2);font-weight:700;}
  .level-go{margin-top:0.55rem;font-size:0.95rem;font-weight:900;color:var(--coral);display:inline-flex;align-items:center;gap:0.3rem;}
  .level-go svg{width:1rem;height:1rem;}
  .hint-line{margin:1.5rem auto 0;font-size:0.85rem;color:var(--ink2);font-weight:600;max-width:34rem;}

  /* ---------- hub ---------- */
  .page-title{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);font-weight:900;letter-spacing:0.03em;}
  .page-sub{margin:0.15rem 0 1.3rem;color:var(--ink2);font-weight:700;}
  .hub-grid{display:grid;gap:1rem;grid-template-columns:1fr;}
  @media (min-width:48em){.hub-grid{grid-template-columns:repeat(3,1fr);}}
  .hub-card{
    display:flex;flex-direction:column;gap:0.4rem;text-align:left;
    padding:1.15rem;background:var(--paper);border:var(--bd);border-radius:var(--r);
    box-shadow:var(--shadow);cursor:pointer;color:var(--ink);
    -webkit-tap-highlight-color:transparent;transition:transform .1s ease,box-shadow .1s ease;
  }
  .hub-card:hover{transform:translate(-0.08rem,-0.08rem);box-shadow:0.34rem 0.34rem 0 rgba(50,44,74,0.18);}
  .hub-card:active{transform:translate(0.12rem,0.12rem);box-shadow:0.06rem 0.06rem 0 rgba(50,44,74,0.16);}
  .hub-card.teach{background:var(--sun-l);}
  .hub-ic{width:3.4rem;height:3.4rem;border-radius:1rem;background:#fff;border:var(--bd);display:grid;place-items:center;margin-bottom:0.35rem;}
  .hub-ic svg{width:2rem;height:2rem;}
  .hub-t{font-size:1.22rem;font-weight:900;}
  .hub-d{font-size:0.9rem;color:var(--ink2);font-weight:600;line-height:1.5;}
  .hub-tag{margin-top:auto;padding-top:0.5rem;font-size:0.78rem;font-weight:900;letter-spacing:0.06em;color:var(--coral);}

  /* ---------- teach ---------- */
  .teach-card{
    display:grid;gap:1.1rem;grid-template-columns:1fr;align-items:center;
    background:var(--paper);border:var(--bd);border-radius:1.8rem;box-shadow:var(--shadow-lg);
    padding:clamp(0.9rem,3vw,1.8rem);
  }
  @media (min-width:52em){.teach-card{grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:1.8rem;}}
  .ill-wrap{
    background:linear-gradient(160deg,#FFF3D6,#FFE7E9 60%,#E7F7F0 100%);
    border:0.12rem dashed rgba(50,44,74,0.35);border-radius:1.4rem;
    padding:clamp(0.6rem,2vw,1.1rem);display:grid;place-items:center;min-height:11rem;
  }
  .ill-wrap svg{width:100%;height:auto;max-width:24rem;display:block;}
  .teach-kicker{margin:0;font-size:0.8rem;font-weight:900;letter-spacing:0.16em;color:var(--coral);}
  .teach-title{margin:0.2rem 0 0.10rem;font-size:clamp(1.45rem,4.4vw,2.05rem);font-weight:900;line-height:1.3;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
  .teach-lead{margin:0.3rem 0 0.7rem;font-size:1.08rem;font-weight:800;color:var(--ink);}
  .teach-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0.45rem;}
  .teach-list li{display:flex;gap:0.6rem;align-items:flex-start;font-size:1rem;font-weight:600;color:var(--ink);}
  .teach-list li .num{
    flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--sun);
    border:0.12rem solid var(--edge);display:grid;place-items:center;font-size:0.85rem;font-weight:900;
    margin-top:0.15rem;
  }
  .example{
    margin-top:0.9rem;padding:0.8rem 0.95rem;background:var(--sky-l);
    border:0.12rem solid rgba(50,44,74,0.25);border-radius:1rem;
  }
  .ex-label{display:inline-block;font-size:0.75rem;font-weight:900;letter-spacing:0.12em;color:#2C6FA8;background:#fff;
    border-radius:999px;padding:0.05rem 0.5rem;border:0.1rem solid rgba(50,44,74,0.25);}
  .example p{margin:0.4rem 0 0;font-size:1.05rem;font-weight:800;line-height:1.6;}
  .tip{margin-top:0.8rem;display:flex;gap:0.55rem;align-items:flex-start;padding:0.7rem 0.9rem;background:var(--mint-l);
    border-left:0.35rem solid var(--mint);border-radius:0.6rem 1rem 1rem 0.6rem;}
  .tip svg{width:1.4rem;height:1.4rem;flex:none;margin-top:0.1rem;}
  .tip p{margin:0;font-size:0.98rem;font-weight:700;}

  .teach-foot{display:flex;align-items:center;justify-content:space-between;gap:0.8rem;margin-top:1.1rem;}
  .dots{display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;justify-content:center;}
  .dot{width:0.62rem;height:0.62rem;border-radius:999px;background:rgba(50,44,74,0.18);}
  .dot.on{background:var(--coral);width:1.5rem;}

  /* ---------- game ---------- */
  .game-wrap{max-width:52rem;margin:0 auto;}
  .game-head{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.7rem;}
  .game-title{flex:1;min-width:0;}
  .mode-name{font-size:1.1rem;font-weight:900;line-height:1.3;}
  .mode-sub{font-size:0.82rem;font-weight:700;color:var(--ink2);}
  .score-chip{
    flex:none;display:inline-flex;align-items:center;gap:0.3rem;background:#fff;border:var(--bd);
    border-radius:999px;padding:0.3rem 0.8rem;font-weight:900;font-size:0.95rem;box-shadow:0.12rem 0.12rem 0 rgba(50,44,74,0.12);
  }
  .score-chip svg{width:1rem;height:1rem;}

  .progress{height:0.85rem;background:#fff;border:0.12rem solid var(--edge);border-radius:999px;overflow:hidden;margin-bottom:1rem;}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:999px;transition:width .35s ease;}

  .q-card{background:var(--paper);border:var(--bd);border-radius:1.6rem;box-shadow:var(--shadow-lg);padding:clamp(0.9rem,3vw,1.6rem);}
  .q-kicker{margin:0 0 0.2rem;font-size:0.78rem;font-weight:900;letter-spacing:0.16em;color:var(--coral);}
  .q-text{margin:0 0 1rem;font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:900;line-height:1.55;}
  .q-hint{margin:-0.6rem 0 0.9rem;font-size:0.9rem;color:var(--ink2);font-weight:700;}

  /* order mode */
  .slots{display:flex;flex-direction:column;gap:0.55rem;margin-bottom:0.9rem;}
  .slot{
    display:flex;align-items:center;gap:0.7rem;width:auto;text-align:left;
    background:#fff;border:0.14rem dashed rgba(50,44,74,0.45);border-radius:1rem;
    padding:0.65rem 0.8rem;min-height:3.3rem;color:var(--ink);font:inherit;
    font-size:1rem;font-weight:700;cursor:default;
    transition:margin .25s ease,background .2s ease,border-color .2s ease;
  }
  .slot:nth-child(1){margin-left:0;}
  .slot:nth-child(2){margin-left:clamp(0.7rem,3vw,2rem);}
  .slot:nth-child(3){margin-left:clamp(1.4rem,6vw,4rem);}
  .slot:nth-child(4){margin-left:clamp(2.1rem,9vw,6rem);}
  .slot.filled{background:var(--sun-l);border-style:solid;cursor:pointer;}
  .slot .slot-no{
    flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--sun);border:0.12rem solid var(--edge);
    display:grid;place-items:center;font-weight:900;font-size:0.95rem;
  }
  .slot .slot-text{flex:1;min-width:0;line-height:1.45;}
  .slot .slot-text.empty{color:rgba(50,44,74,0.42);font-weight:600;font-size:0.92rem;}
  .slot .slot-x{flex:none;font-size:1.3rem;font-weight:900;color:rgba(50,44,74,0.4);line-height:1;}
  .slot .slot-mark{flex:none;width:1.6rem;height:1.6rem;display:grid;place-items:center;}
  .slot .slot-mark svg{width:1.4rem;height:1.4rem;}
  .slot.ok{background:var(--mint-l);border-color:var(--mint);border-style:solid;}
  .slot.ok .slot-no{background:var(--mint);color:#fff;}
  .slot.bad{background:#FFEDE8;border-color:var(--coral);border-style:solid;}
  .slot.bad .slot-no{background:var(--coral);color:#fff;}

  .chips-label{font-size:0.8rem;font-weight:900;letter-spacing:0.1em;color:var(--ink2);margin:0 0 0.45rem;}
  .chips{display:grid;gap:0.55rem;margin-bottom:1rem;}
  .chip{
    display:flex;align-items:center;gap:0.65rem;width:100%;text-align:left;
    background:#fff;border:var(--bd);border-radius:1rem;padding:0.7rem 0.85rem;
    font:inherit;font-size:1rem;font-weight:700;color:var(--ink);cursor:pointer;
    box-shadow:0.12rem 0.12rem 0 rgba(50,44,74,0.12);
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease,background .15s ease;
  }
  .chip:hover{background:var(--sky-l);}
  .chip:active{transform:translate(0.1rem,0.1rem);box-shadow:none;}
  .chip .chip-dot{flex:none;width:0.55rem;height:0.55rem;border-radius:50%;background:var(--grape);}

  /* pick mode */
  .options{display:grid;gap:0.65rem;grid-template-columns:1fr;margin-bottom:0.4rem;}
  @media (min-width:56em){.options{grid-template-columns:1fr 1fr;}}
  .opt{
    display:flex;align-items:flex-start;gap:0.7rem;text-align:left;width:100%;
    background:#fff;border:var(--bd);border-radius:1rem;padding:0.75rem 0.85rem;
    font:inherit;font-size:1rem;font-weight:700;color:var(--ink);line-height:1.5;
    cursor:pointer;box-shadow:0.12rem 0.12rem 0 rgba(50,44,74,0.12);
    -webkit-tap-highlight-color:transparent;transition:transform .08s ease,background .15s ease;
  }
  .opt:hover{background:var(--sky-l);}
  .opt:active{transform:translate(0.1rem,0.1rem);box-shadow:none;}
  .opt:disabled{cursor:default;transform:none;}
  .opt .opt-no{
    flex:none;width:1.8rem;height:1.8rem;border-radius:0.6rem;background:var(--sun-l);
    border:0.12rem solid var(--edge);display:grid;place-items:center;font-weight:900;font-size:0.9rem;margin-top:0.05rem;
  }
  .opt .opt-t{flex:1;min-width:0;}
  .opt .opt-mark{flex:none;width:1.5rem;height:1.5rem;display:grid;place-items:center;opacity:0;}
  .opt .opt-mark svg{width:1.4rem;height:1.4rem;}
  .opt.correct{background:var(--mint-l);border-color:var(--mint);}
  .opt.correct .opt-no{background:var(--mint);color:#fff;}
  .opt.correct .opt-mark{opacity:1;}
  .opt.wrong{background:#FFEDE8;border-color:var(--coral);}
  .opt.wrong .opt-no{background:var(--coral);color:#fff;}
  .opt.wrong .opt-mark{opacity:1;}
  .opt.dim{opacity:0.5;}

  /* reveal */
  .reveal{
    margin-top:1rem;background:#FFFCF0;border:0.16rem solid var(--edge);border-radius:1.4rem;
    padding:clamp(0.85rem,2.6vw,1.2rem);box-shadow:var(--shadow);
    animation:rise .35s cubic-bezier(.22,1.1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(0.7rem);}to{opacity:1;transform:none;}}
  .reveal.ok{background:var(--mint-l);}
  .reveal.no{background:#FFF1EC;}
  .reveal-head{display:flex;align-items:center;gap:0.7rem;}
  .reveal-ic{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:#fff;border:var(--bd);display:grid;place-items:center;}
  .reveal-ic svg{width:1.5rem;height:1.5rem;}
  .reveal-title{margin:0;font-size:1.15rem;font-weight:900;line-height:1.3;}
  .reveal-sub{margin:0.1rem 0 0;font-size:0.9rem;font-weight:700;color:var(--ink2);line-height:1.45;}
  .reveal-note{margin:0.7rem 0 0.9rem;font-size:0.98rem;font-weight:600;line-height:1.7;}
  .reveal-note b{color:var(--coral-d);}

  /* result */
  .result{
    text-align:center;max-width:38rem;margin:0.6rem auto 0;
    padding:clamp(1.4rem,4vw,2.4rem) clamp(1rem,3.4vw,2rem);
    background:var(--paper);border:var(--bd);border-radius:2rem;box-shadow:var(--shadow-lg);
  }
  .stars{display:flex;justify-content:center;gap:0.5rem;margin-bottom:0.6rem;}
  .star{width:clamp(3rem,11vw,4.4rem);height:auto;}
  .result-score{font-size:clamp(2.6rem,9vw,3.6rem);font-weight:900;line-height:1.1;margin:0;letter-spacing:0.02em;}
  .result-score small{font-size:1.1rem;color:var(--ink2);font-weight:800;}
  .result-title{margin:0.3rem 0 0.6rem;font-size:clamp(1.3rem,4.2vw,1.7rem);font-weight:900;}
  .result-desc{margin:0 auto 1.4rem;color:var(--ink2);font-weight:700;max-width:26rem;}
  .result-actions{display:flex;flex-direction:column;gap:0.7rem;}
  @media (min-width:34em){.result-actions{flex-direction:row;justify-content:center;}}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:2rem;transform:translate(-50%,2rem);

              {t:'他愛山，也愛海。'}
            ],
            note:'答案是 B。分辨關鍵是「次序能不能換」：A、C 各項可以隨便調換，是排比；B 由「小山」→「大山」→「整片山林」，範圍一層比一層大，又有「更」字推進，次序不能換，所以是<b>層遞</b>。D 只有兩項。'
          }
        ]
      }
    ]
  }
};

/* =========================================================
   3. 音效（Web Audio 即時合成，無外部檔案）
   ========================================================= */
let actx = null;
function audio(){
  if(!actx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ actx = new Ctx(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended'){ actx.resume().catch(function(){}); }
  return actx;
}
function tone(freq, delay, dur, type, vol){
  if(!app.sound) return;
  const ctx = audio();
  if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}
const sfx = {
  tap:function(){ tone(680,0,0.07,'triangle',0.07); },
  page:function(){ tone(520,0,0.08,'sine',0.07); tone(700,0.06,0.09,'sine',0.05); },
  place:function(){ tone(880,0,0.07,'triangle',0.07); },
  correct:function(){ tone(523,0,0.14,'triangle',0.13); tone(659,0.1,0.14,'triangle',0.13); tone(784,0.2,0.26,'triangle',0.14); },
  wrong:function(){ tone(233,0,0.16,'sawtooth',0.07); tone(185,0.13,0.24,'sawtooth',0.07); },
  win:function(){
    [523,659,784,1047].forEach(function(f,i){ tone(f, i*0.12, 0.3, 'triangle', 0.12); });
    tone(1319,0.55,0.5,'triangle',0.12);
  }
};

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function starsFor(score, total){
  const r = score/total;
  if(r >= 0.99) return 3;
  if(r >= 0.66) return 2;
  if(r >= 0.34) return 1;
  return 0;
}
function starMarkup(n){
  let out = '';
  for(let i=0;i<3;i++){
    const on = i < n;
    out += '<svg class="star" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M12 2.6l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.66l-5.9 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6Z" ' +
      'fill="' + (on ? '#FFC94B' : '#FFFFFF') + '" stroke="#322C4A" stroke-width="1.7" stroke-linejoin="round" ' +
      'opacity="' + (on ? '1' : '0.35') + '"/></svg>';
  }
  return out;
}
function speak(text){
  if(!('speechSynthesis' in window)){
    toast('這個瀏覽器不支援語音朗讀');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = 0.92;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){
    toast('語音朗讀暫時不可用');
  }
}

function slotMarkup(pos){
  const q = question();
  const chip = app.order[pos];
  let cls = 'slot';
  let text = '<span class="slot-text empty">點下面的句子，放進第 ' + (pos+1) + ' 層</span>';
  let tail = '';
  if(chip !== undefined && chip !== null){
    cls += ' filled';
    text = '<span class="slot-text">' + q.steps[chip] + '</span>';
    if(!app.reveal){
      tail = '<span class="slot-x" aria-hidden="true">×</span>';
    }
  }
  if(app.reveal){
    const ok = app.order[pos] === pos;
    cls += ok ? ' ok' : ' bad';
    tail = '<span class="slot-mark">' + (ok ? ICON.check : ICON.cross) + '</span>';
  }
  return '<button class="' + cls + '" data-act="remove" data-pos="' + pos + '"' +
    (app.reveal || chip === undefined || chip === null ? ' disabled' : '') +
    ' aria-label="第 ' + (pos+1) + ' 層">' +
    '<span class="slot-no">' + (pos+1) + '</span>' + text + tail +
  '</button>';
}

function orderBody(){
  const q = question();
  const used = app.order;
  const remain = app.chips.filter(function(i){ return used.indexOf(i) === -1; });

  let slots = '';
  for(let p=0;p<q.steps.length;p++){ slots += slotMarkup(p); }

  let chips = '';
  if(remain.length){
    chips = remain.map(function(i){
      return '<button class="chip" data-act="chip" data-i="' + i + '">' +
        '<span class="chip-dot"></span><span>' + q.steps[i] + '</span></button>';
    }).join('');
  }

  return '<div class="slots">' + slots + '</div>' +
    (remain.length ? '<p class="chips-label">可以選的句子</p><div class="chips">' + chips + '</div>' : '') +
    (!app.reveal && !remain.length ? '<p class="q-hint">都放好了，按下面的按鈕確認吧。</p>' : '') +
    (app.reveal ? '' : '<button class="btn primary wide" data-act="confirm-order"' +
      (app.order.length < q.steps.length ? ' disabled' : '') + '>確認答案</button>');
}

function pickBody(){
  const q = question();
  const opts = q.options.map(function(o, i){
    let cls = 'opt';
    let mark = '';
    if(app.reveal){
      if(o.ok){ cls += ' correct'; mark = ICON.check; }
      else if(app.reveal.chosen === i){ cls += ' wrong'; mark = ICON.cross; }
      else { cls += ' dim'; }
    }
    return '<button class="' + cls + '" data-act="answer" data-i="' + i + '"' + (app.reveal ? ' disabled' : '') + '>' +
      '<span class="opt-no">' + 'ABCD'[i] + '</span>' +
      '<span class="opt-t">' + o.t + '</span>' +
      '<span class="opt-mark">' + mark + '</span>' +
    '</button>';
  }).join('');
  return '<div class="options">' + opts + '</div>';
}

function revealMarkup(){
  const q = question();
  const r = app.reveal;
  if(!r) return '';
  const isOrder = mode().type === 'order';
  let sub = '';
  if(isOrder){
    sub = '正確次序：' + q.steps.join(' → ');
  }else{
    let ci = 0;
    q.options.forEach(function(o, i){ if(o.ok) ci = i; });
    sub = '正確答案：' + 'ABCD'[ci];
  }
  return '<section class="reveal ' + (r.ok ? 'ok' : 'no') + '" aria-live="polite">' +
    '<div class="reveal-head">' +
      '<span class="reveal-ic">' + (r.ok ? ICON.check : ICON.cross) + '</span>' +
      '<div><p class="reveal-title">' + (r.ok ? '答對了！' : '差一點，一起看看') + '</p>' +
      '<p class="reveal-sub">' + sub + '</p></div>' +
    '</div>' +
    '<p class="reveal-note">' + q.note + '</p>' +
    '<button class="btn primary wide" data-act="next-q">' +
      (app.qIndex + 1 >= mode().questions.length ? '看成績 →' : '下一題 →') +
    '</button>' +
  '</section>';
}

function render(){
  if(app.view === 'home'){ stage.innerHTML = viewHome(); }
  else if(app.view === 'hub'){ stage.innerHTML = viewHub(); }
  else if(app.view === 'teach'){ stage.innerHTML = viewTeach(); }
  else if(app.view === 'game'){ stage.innerHTML = viewGame(); }
  else if(app.view === 'result'){ stage.innerHTML = viewResult(); }
  soundBtn.innerHTML = app.sound ? ICON.soundOn : ICON.soundOff;
  window.scrollTo(0, 0);
}

/* =========================================================
   6. 流程控制
   ========================================================= */
function setView(v){
  app.view = v;
  render();
}
function startGame(modeIndex){
  app.modeIndex = modeIndex;
  app.qIndex = 0;
  app.score = 0;
  resetQuestion();
  setView('game');
}
function resetQuestion(){
  app.reveal = null;
  app.order = [];
  const q = question();
  if(mode().type === 'order'){
    app.chips = shuffle(q.steps.map(function(_, i){ return i; }));
  }else{
    app.chips = [];
  }
}
function scrollToReveal(){
  requestAnimationFrame(function(){
    const el = document.querySelector('.reveal');
    if(el && el.getBoundingClientRect().bottom > window.innerHeight){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
    }
  });
}

/* =========================================================
   7. 事件（統一委派）
   ========================================================= */
document.getElementById('app').addEventListener('click', function(e){
  const btn = e.target.closest('[data-act]');
  if(!btn || btn.disabled) return;
  const act = btn.getAttribute('data-act');

  if(act === 'sound'){
    app.sound = !app.sound;
    soundBtn.innerHTML = app.sound ? ICON.soundOn : ICON.soundOff;
    if(app.sound){ sfx.page(); }
    toast(app.sound ? '音效已開啟' : '音效已關閉');
    return;
  }

  if(act !== 'chip' && act !== 'answer' && act !== 'remove' && act !== 'confirm-order'){ sfx.tap(); }

  if(act === 'home'){
    app.levelKey = null;
    setView('home');
  }
  else if(act === 'hub'){
    setView('hub');
  }
  else if(act === 'pick-level'){
    app.levelKey = btn.getAttribute('data-level');
    app.teachIndex = 0;
    sfx.page();
    setView('hub');
  }
  else if(act === 'open-teach'){
    app.teachIndex = 0;
    setView('teach');
  }
  else if(act === 'open-game'){
    const mi = parseInt(btn.getAttribute('data-mode'), 10);
    startGame(mi);
  }
  else if(act === 'teach-prev'){
    if(app.teachIndex > 0){ app.teachIndex--; sfx.page(); render(); }
  }
  else if(act === 'teach-next'){
    if(app.teachIndex < level().teach.length - 1){ app.teachIndex++; sfx.page(); render(); }
  }
  else if(act === 'teach-end'){
    setView('hub');
  }
  else if(act === 'speak'){
    const p = level().teach[app.teachIndex];
    speak(p.title + '。' + p.lead + '。' + p.list.join('。') + '。例子：' + p.example);
  }
  else if(act === 'chip'){
    if(app.reveal) return;
    const i = parseInt(btn.getAttribute('data-i'), 10);
    if(app.order.indexOf(i) === -1){
      app.order.push(i);
      sfx.place();
      render();
    }
  }
  else if(act === 'remove'){
    if(app.reveal) return;
    const pos = parseInt(btn.getAttribute('data-pos'), 10);
    if(app.order[pos] !== undefined){
      app.order.splice(pos, 1);
      sfx.tap();
      render();
    }
  }
  else if(act === 'confirm-order'){
    const q = question();
    if(app.order.length < q.steps.length || app.reveal) return;
    let ok = true;
    for(let i=0;i<q.steps.length;i++){ if(app.order[i] !== i){ ok = false; break; } }
    app.reveal = { ok:ok, chosen:null };
    if(ok) app.score++;
    if(ok){ sfx.correct(); } else { sfx.wrong(); }
    render();
    scrollToReveal();
  }
  else if(act === 'answer'){
    if(app.reveal) return;
    const i = parseInt(btn.getAttribute('data-i'), 10);
    const ok = !!question().options[i].ok;
    app.reveal = { ok:ok, chosen:i };
    if(ok) app.score++;
    if(ok){ sfx.correct(); } else { sfx.wrong(); }
    render();
    scrollToReveal();
  }
  else if(act === 'next-q'){
    if(app.qIndex + 1 >= mode().questions.length){
      sfx.win();
      setView('result');
    }else{
      app.qIndex++;
      resetQuestion();
      sfx.page();
      render();
    }
  }
  else if(act === 'restart'){
    startGame(app.modeIndex);
  }
  else if(act === 'other-mode'){
    startGame(app.modeIndex === 0 ? 1 : 0);
  }
});

/* 鍵盤：1-4 選答案、Enter 下一題、左右鍵換教學頁 */
document.addEventListener('keydown', function(e){
  if(app.view === 'game'){
    const m = mode();
    if(m.type === 'pick' && !app.reveal && /^[1-4]$/.test(e.key)){
      const i = parseInt(e.key, 10) - 1;
      if(i < question().options.length){
        const el = document.querySelector('.opt[data-i="' + i + '"]');
        if(el) el.click();
      }
      return;
    }
    if(e.key === 'Enter'){
      if(app.reveal){
        const nb = document.querySelector('[data-act="next-q"]');
        if(nb) nb.click();
      }else if(m.type === 'order'){
        const cb = document.querySelector('[data-act="confirm-order"]');
        if(cb && !cb.disabled) cb.click();
      }
    }
  }else if(app.view === 'teach'){
    if(e.key === 'ArrowRight'){
      const nb = document.querySelector('[data-act="teach-next"]');
      if(nb) nb.click();
    }else if(e.key === 'ArrowLeft'){
      const pb = document.querySelector('[data-act="teach-prev"]');
      if(pb && !pb.disabled) pb.click();
    }
  }
});

/* 首次互動時解鎖音訊 */
document.addEventListener('pointerdown', function(){ audio(); }, { once:true });

/* 啟動 */
render();
</script>
</body>
</html>
