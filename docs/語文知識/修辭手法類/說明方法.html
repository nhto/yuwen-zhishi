<!DOCTYPE html>
<html lang="zh-Hant">

<title>說明方法小達人｜六招教學 × 三種挑戰</title>
<meta name="description" content="用卡通圖示學會舉例子、列數據、比喻、引用、分類、比較六種說明方法，再玩三種互動挑戰，每題附答案解析。">
<style>
  :root{
    --ink:#3b2b2b;
    --ink-soft:#7a6459;
    --paper:#fff8ec;
    --card:#fffdf7;
    --coral:#ff8a6b;
    --teal:#4ecdc4;
    --sun:#ffc93c;
    --sky:#7ec8f2;
    --grape:#b39ddb;
    --leaf:#8fd47a;
    --rose:#ff9fb2;
    --shadow:rgba(59,43,43,.16);
    --line:rgba(59,43,43,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 10% 4%, #ffe6cd 0, rgba(255,230,205,0) 42%),
      radial-gradient(circle at 92% 2%, #d7f0ff 0, rgba(215,240,255,0) 38%),
      radial-gradient(circle at 50% 104%, #e4f8dd 0, rgba(228,248,221,0) 46%),
      var(--paper);
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(59,43,43,.13) 1.4px, transparent 1.4px);
    background-size:20px 20px;
    opacity:.32;
    mask-image:linear-gradient(#000 0%, #000 55%, transparent 100%);
    -webkit-mask-image:linear-gradient(#000 0%, #000 55%, transparent 100%);
  }
  [hidden]{display:none !important}
  button{font:inherit;color:inherit}
  button,input{ -webkit-tap-highlight-color:transparent }
  :focus-visible{outline:3px dashed var(--coral);outline-offset:3px}

  .app{
    position:relative;z-index:1;
    width:min(100%,760px);
    margin:0 auto;
    padding:10px 14px calc(30px + env(safe-area-inset-bottom));
    min-height:100vh;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.02em;font-size:1rem;min-width:0}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--coral);border:2.5px solid var(--ink);flex:0 0 auto}
  .brand span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .icon-btn{
    width:46px;height:46px;flex:0 0 auto;
    display:grid;place-items:center;
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:15px;
    box-shadow:0 4px 0 var(--shadow);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .icon-btn:hover{background:#fff3e0}
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .icon-btn svg{width:22px;height:22px;display:block}
  .icon-btn[aria-pressed="false"]{opacity:.55}

  /* ---------- generic ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:54px;padding:13px 20px;
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:19px;
    font-weight:900;font-size:1rem;
    box-shadow:0 5px 0 var(--shadow);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-align:center;
  }
  .btn:hover{filter:brightness(1.02)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  .btn svg{width:22px;height:22px;flex:0 0 auto}
  .btn-block{display:flex;width:100%}
  .btn-sun{background:var(--sun)}
  .btn-mint{background:#b8f0e8}
  .btn-coral{background:#ffc4b5}
  .btn-quiet{background:#fff}

  .card{
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:24px;
    box-shadow:0 6px 0 var(--shadow);
  }
  .section-title{
    font-size:1.06rem;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }
  .section-title::before{
    content:"";width:8px;height:22px;border-radius:5px;background:var(--coral);border:2.5px solid var(--ink);
  }
  .muted{color:var(--ink-soft)}
  .tiny{font-size:.8rem}

  /* ---------- home ---------- */
  .hero{text-align:center;padding:2px 0 6px}
  .mascot{width:clamp(128px,34vw,178px);margin:0 auto;display:block}
  .hero h1{
    font-size:clamp(1.62rem,7.2vw,2.3rem);
    line-height:1.25;margin:.15em 0 0;letter-spacing:.01em;
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(59,43,43,.1);
  }
  .hero .sub{margin:.45em auto 0;max-width:26em;font-size:.95rem;color:var(--ink-soft);font-weight:600}
  .hero .sub b{color:var(--ink)}
  .hero-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}

  .badge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  @media (min-width:560px){ .badge-row{grid-template-columns:repeat(6,1fr)} }
  .mini-method{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px 9px;
    background:var(--card);border:2.5px solid var(--ink);border-radius:16px;
    box-shadow:0 3px 0 var(--shadow);
    min-width:0;
  }
  .mini-method svg{width:38px;height:34px;display:block}
  .mini-method span{font-size:.76rem;font-weight:800;white-space:nowrap}

  .howto{display:grid;gap:8px;margin-top:10px}
  .howto li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:.9rem}
  .howto{padding:0;margin-left:0}
  .step-num{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    background:var(--sun);border:2.5px solid var(--ink);
    display:grid;place-items:center;font-size:.76rem;font-weight:900;margin-top:2px;
  }

  /* ---------- learn ---------- */
  .learn-progress{
    display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:12px;
    background:#fff3e0;border:2.5px solid var(--ink);border-radius:18px;
    font-weight:800;font-size:.86rem;
  }
  .learn-progress .bar{flex:1 1 auto;height:12px;border-radius:999px;background:#f0e0cb;border:2px solid var(--ink);overflow:hidden}
  .learn-progress .bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .35s ease}

  .method-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:13px;padding:14px;margin-bottom:14px}
  @media (max-width:420px){ .method-card{grid-template-columns:80px minmax(0,1fr);gap:11px;padding:12px} }
  .ill{
    border:3px solid var(--ink);border-radius:19px;padding:6px;
    display:grid;place-items:center;align-self:start;
  }
  .ill svg{width:100%;height:auto;display:block}
  .method-card h3{margin:0;font-size:1.12rem;font-weight:900;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .method-card h3 .idx{
    font-size:.68rem;background:var(--ink);color:#fff;border-radius:8px;padding:1px 7px;font-weight:800;letter-spacing:.05em;
  }
  .method-card .def{margin:.35em 0 .5em;font-size:.92rem;color:#5d4a42}
  .quote-line{
    background:#fffaf0;border-left:5px solid var(--sun);border-radius:0 12px 12px 0;
    padding:8px 11px;font-size:.92rem;margin:0 0 8px;
  }
  .quote-line b{color:var(--ink)}
  mark{background:#ffe28a;color:inherit;border-radius:5px;padding:0 2px;font-weight:800;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .tag{
    font-size:.74rem;font-weight:800;background:#eef7ff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;
  }
  .trick{
    font-size:.82rem;font-weight:800;color:#5d4a42;background:#f3fbe9;
    border:2px dashed rgba(59,43,43,.4);border-radius:12px;padding:6px 10px;margin-bottom:9px;
  }
  .learn-btn{
    min-height:40px;padding:6px 12px;font-size:.8rem;border-radius:12px;box-shadow:0 3px 0 var(--shadow);
    background:#fff;display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);font-weight:800;cursor:pointer;
  }
  .learn-btn.done{background:#d9f5cf}
  .learn-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow)}

  /* ---------- hub ---------- */
  .mode-card{
    display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:12px;width:100%;text-align:left;
    cursor:pointer;border:3px solid var(--ink);border-radius:22px;background:var(--card);
    box-shadow:0 6px 0 var(--shadow);transition:transform .12s ease,box-shadow .12s ease;
  }
  .mode-card:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--shadow)}
  .mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  .mode-card .m-ill{
    width:68px;height:68px;flex:0 0 auto;border:3px solid var(--ink);border-radius:18px;
    display:grid;place-items:center;background:#fff;
  }
  .mode-card .m-ill svg{width:46px;height:46px}
  .mode-card .m-body{flex:1 1 auto;min-width:0}
  .mode-card h3{margin:0 0 2px;font-size:1.05rem;font-weight:900}
  .mode-card p{margin:0;font-size:.82rem;color:var(--ink-soft);line-height:1.45}
  .mode-card .m-best{
    flex:0 0 auto;font-size:.72rem;font-weight:900;background:#fff3e0;border:2px solid var(--ink);
    border-radius:10px;padding:3px 7px;white-space:nowrap;
  }

  /* ---------- game ---------- */
  .game-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .game-top .gt-title{font-weight:900;font-size:.95rem;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    font-size:.76rem;font-weight:900;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px;white-space:nowrap;
  }
  .progress{height:13px;border-radius:999px;background:#f0e2d0;border:2.5px solid var(--ink);overflow:hidden;margin-bottom:14px}
  .progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s ease}

  .q-card{padding:16px 15px;margin-bottom:13px}
  .q-label{font-size:.74rem;font-weight:900;letter-spacing:.12em;color:var(--ink-soft);margin:0 0 6px}
  .q-text{font-size:clamp(1.02rem,4.2vw,1.16rem);font-weight:800;line-height:1.75;margin:0}
  .q-text .hl{background:#ffe28a;border-radius:5px;padding:0 2px}

  .opts{display:grid;gap:9px;margin-bottom:6px}
  .opt{
    width:100%;text-align:left;display:flex;align-items:center;gap:11px;
    padding:13px 14px;min-height:58px;
    background:#fff;border:3px solid var(--ink);border-radius:17px;
    box-shadow:0 4px 0 var(--shadow);cursor:pointer;font-weight:800;font-size:.98rem;
    transition:transform .1s ease,box-shadow .1s ease,background .15s ease;
  }
  .opt:hover{background:#fffaf0}
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .opt .opt-key{
    flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    border:2.5px solid var(--ink);background:#f6efe3;font-size:.82rem;font-weight:900;
  }
  .opt.correct{background:#d6f5d0}
  .opt.wrong{background:#ffd9d4}
  .opt.dim{opacity:.55}

  .token{
    display:inline;padding:2px 3px;border-radius:8px;cursor:pointer;
    border-bottom:3px dashed rgba(59,43,43,.35);
    transition:background .15s ease;
  }
  .token:hover{background:#fff3cf}
  .token.sel{background:#ffe08a;border-bottom-color:var(--ink)}
  .token.hit{background:#c6efbd;border-bottom-color:var(--ink)}
  .token.miss{background:#ffd4cd}

  .hintbar{
    display:flex;align-items:center;gap:8px;justify-content:center;
    min-height:24px;font-size:.82rem;font-weight:800;color:var(--coral);margin:2px 0 8px;text-align:center;
  }
  .shake{animation:shake .42s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(3px)}
  }

  /* mode 3 */
  .pool{display:grid;gap:8px;margin-bottom:12px}
  .sent-card{
    width:100%;text-align:left;padding:12px 13px;background:#fff;border:3px solid var(--ink);border-radius:16px;
    box-shadow:0 4px 0 var(--shadow);cursor:pointer;font-size:.9rem;font-weight:700;line-height:1.55;
    display:flex;gap:9px;align-items:flex-start;
    transition:transform .1s ease,box-shadow .1s ease,background .15s ease;
  }
  .sent-card .num{
    flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:#f6efe3;border:2px solid var(--ink);
    display:grid;place-items:center;font-size:.72rem;font-weight:900;margin-top:1px;
  }
  .sent-card.sel{background:#fff3cf;transform:translateY(-2px);box-shadow:0 6px 0 var(--shadow)}
  .sent-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}

  .box-title{font-size:.84rem;font-weight:900;margin:4px 0 8px;display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
  .grid6{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media (min-width:560px){ .grid6{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .method-box{
    display:flex;align-items:center;gap:7px;
    padding:8px;min-height:60px;
    background:#fff;border:3px dashed rgba(59,43,43,.45);border-radius:15px;
    cursor:pointer;font-weight:800;font-size:.83rem;text-align:left;
    transition:background .15s ease,border-color .15s ease,transform .1s ease;
  }
  .method-box .mb-icon{width:34px;height:30px;flex:0 0 auto;display:block}
  .method-box .mb-name{min-width:0;line-height:1.25}
  .method-box .mb-name small{display:block;font-size:.66rem;font-weight:800;color:var(--ink-soft);letter-spacing:.02em}
  .method-box:hover{background:#fffaf0;border-color:var(--ink)}
  .method-box.filled{border-style:solid;background:#e6f8de;border-color:var(--ink);cursor:default}
  .method-box.filled::after{content:"✓";margin-left:auto;font-weight:900;color:#3f8a33;font-size:1rem}
  .method-box.bad{border-color:#d9534f;background:#ffe6e1}

  /* ---------- sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet .backdrop{position:absolute;inset:0;background:rgba(59,43,43,.38);animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet-card{
    position:relative;z-index:1;width:min(100%,760px);
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--card);
    border:3px solid var(--ink);border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:16px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 0 rgba(59,43,43,.09);
    animation:slideup .26s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .res-badge{
    font-size:.76rem;font-weight:900;padding:3px 10px;border-radius:999px;border:2.5px solid var(--ink);white-space:nowrap;
  }
  .res-badge.ok{background:#c9f0bf}
  .res-badge.no{background:#ffd0c9}
  .sheet-head h3{margin:0;font-size:1.08rem;font-weight:900;line-height:1.3}
  .sheet-sentence{font-size:.92rem;background:#fffaf0;border:2px dashed rgba(59,43,43,.3);border-radius:13px;padding:9px 11px;margin:0 0 10px;line-height:1.65}
  .answer-line{display:flex;align-items:center;gap:8px;font-weight:900;margin:0 0 8px;font-size:.95rem;flex-wrap:wrap}
  .answer-line .swatch{width:22px;height:22px;border-radius:7px;border:2.5px solid var(--ink);flex:0 0 auto}
  .why{font-size:.9rem;line-height:1.72;margin:0 0 9px;color:#4c3b35}
  .why b{color:#000}
  .cue-line{font-size:.82rem;font-weight:800;color:#5d4a42;margin:0 0 8px}
  .cue-line span{background:#e8f4ff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;display:inline-block;margin:2px 3px 0 0}

  /* ---------- result ---------- */
  .result-wrap{text-align:center;padding:8px 0 0}
  .score-ring{
    width:clamp(150px,44vw,190px);aspect-ratio:1/1;margin:6px auto 4px;
    border-radius:50%;border:4px solid var(--ink);
    display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 50% 35%,#fffdf3,#ffeec7);
    box-shadow:0 8px 0 var(--shadow);
  }
  .score-ring .num{font-size:clamp(2.4rem,11vw,3.2rem);font-weight:900;line-height:1}
  .score-ring .den{font-size:.86rem;font-weight:800;color:var(--ink-soft);margin-top:2px}
  .stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
  .stars svg{width:38px;height:38px}
  .result-msg{font-size:1rem;font-weight:800;margin:6px 0 2px}
  .review{margin-top:16px;text-align:left}
  .review h4{font-size:.92rem;margin:0 0 8px;font-weight:900}
  .review-item{
    background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:9px 11px;margin-bottom:8px;font-size:.84rem;line-height:1.6;
  }
  .review-item .ri-s{display:block;color:#5d4a42;margin-bottom:3px}
  .review-item .ri-a{font-weight:900}
  .result-actions{display:grid;gap:9px;margin-top:14px}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>

  var audioCtx = null;

  function getCtx() {
    if (!state.sound) { return null; }
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return null; }
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    return audioCtx;
  }

  function tone(freq, delay, dur, type, vol) {
    var c = getCtx();
    if (!c) { return; }
    var t0 = c.currentTime + delay;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

      if (!raw) { return; }
      var data = JSON.parse(raw);
      if (typeof data.sound === 'boolean') { state.sound = data.sound; }
      if (Object.prototype.toString.call(data.learned) === '[object Array]') {
        state.learned = data.learned.filter(function (id) { return methodById(id); });

      if (data.best && typeof data.best === 'object') {

          var v = Number(data.best[k]);
          if (v >= 0 && v <= 6) { state.best[k] = v; }

      /* 儲存不可用時以預設值運作 */

    if (!game) { return; }

  /* ---- 模式一：方法偵探 ---- */
  function renderM1() {
    var q = QUIZ.m1[game.i];
    var opts = q.opts.map(function (id, i) {
      var m = methodById(id);
      return '<button class="opt" type="button" data-opt="' + i + '">' +
        '<span class="opt-key">' + 'ABCD'.charAt(i) + '</span>' +
        '<span>' + m.name + '</span></button>';
    }).join('');

    views.game.innerHTML =
      gameHeader('第 ' + (game.i + 1) + ' / 6 題', game.i / 6 * 100) +
      '<div class="q-card card">' +
      '<p class="q-label">讀一讀</p>' +
      '<p class="q-text">' + esc(q.q) + '</p>' +
      '</div>' +
      '<p class="tiny muted" style="margin:0 0 8px;font-weight:800">' + MODE_INFO.m1.tipLabel + '</p>' +
      '<div class="opts">' + opts + '</div>';

    views.game.querySelectorAll('[data-opt]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        answerM1(Number(btn.getAttribute('data-opt')));
      });
    });
  }

  function answerM1(pick) {
    if (!game || game.answered || game.busy) { return; }
    game.answered = true;
    game.busy = true;

    var q = QUIZ.m1[game.i];
    var correct = q.opts[pick] === q.a;
    var correctIdx = q.opts.indexOf(q.a);

    views.game.querySelectorAll('[data-opt]').forEach(function (btn) {
      var i = Number(btn.getAttribute('data-opt'));
      if (i === correctIdx) { btn.classList.add('correct'); }
      else if (i === pick) { btn.classList.add('wrong'); }
      else { btn.classList.add('dim'); }
    });

    if (correct) {
      game.score += 1;
      Sound.play('correct');
    } else {
      game.wrong.push({ sentence: q.q, a: q.a, cue: q.cue, why: q.why });
      Sound.play('wrong');
      var box = views.game.querySelector('.q-card');
      if (box) { box.classList.add('shake'); }
    }

    var snapshot = game;
    pendingTimer = window.setTimeout(function () {
      if (game !== snapshot) { return; }
      openAnswerSheet({
        ok: correct,
        sentence: q.q,
        answerId: q.a,
        why: q.why,
        cue: q.cue,
        index: game.i,
        mode: 'm1'
      });
      game.busy = false;
    }, 300);
  }

  /* ---- 模式二：訊號詞尋寶 ---- */
  function renderM2() {
    var q = QUIZ.m2[game.i];
    var tokens = q.tokens.map(function (tk, i) {
      var parts = splitPunct(tk.t);
      return '<span class="token" role="button" tabindex="0" data-tok="' + i + '">' + esc(parts[0]) + '</span>' + esc(parts[1]);
    }).join('');

    views.game.innerHTML =
      gameHeader('第 ' + (game.i + 1) + ' / 6 題', game.i / 6 * 100) +
      '<div class="q-card card">' +
      '<p class="q-label">讀一讀，找出關鍵詞</p>' +
      '<p class="q-text" id="tokWrap">' + tokens + '</p>' +
      '</div>' +
      '<p class="tiny muted" style="margin:0 0 10px;font-weight:800">' + MODE_INFO.m2.tipLabel + '（點一下即可）</p>' +
      '<div class="hintbar" id="hintbar" aria-live="polite">點一下你認為最關鍵的訊號詞</div>' +
      '<button class="btn btn-sun btn-block" type="button" id="btn-check" disabled>檢查答案</button>';

    var checkBtn = document.getElementById('btn-check');
    var hint = document.getElementById('hintbar');

    views.game.querySelectorAll('[data-tok]').forEach(function (tok) {
      function pick() {
        if (game.answered) { return; }
        var idx = Number(tok.getAttribute('data-tok'));
        views.game.querySelectorAll('[data-tok]').forEach(function (t) { t.classList.remove('sel'); });
        tok.classList.add('sel');
        game.selected = idx;
        checkBtn.disabled = false;
        hint.textContent = '已選：「' + q.tokens[idx].t.replace(/[，。、；：]$/, '') + '」';
        Sound.play('tap');
      }
      tok.addEventListener('click', pick);
      tok.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
      });
    });

    checkBtn.addEventListener('click', function () {
      answerM2();
    });
  }

  function answerM2() {
    if (!game || game.answered || game.busy) { return; }
    if (game.selected === null) { return; }
    game.answered = true;
    game.busy = true;

    var q = QUIZ.m2[game.i];
    var tapped = q.tokens[game.selected];
    var correct = !!tapped.k;

    views.game.querySelectorAll('[data-tok]').forEach(function (t) {
      var i = Number(t.getAttribute('data-tok'));
      if (q.tokens[i].k) { t.classList.add('hit'); }
      if (i === game.selected && !q.tokens[i].k) { t.classList.add('miss'); }
    });

    var checkBtn = document.getElementById('btn-check');
    if (checkBtn) { checkBtn.disabled = true; }

    if (correct) {
      game.score += 1;
      Sound.play('correct');
    } else {
      game.wrong.push({ sentence: q.tokens.map(function (t) { return t.t; }).join(''), a: q.a, cue: q.cue, why: q.why });
      Sound.play('wrong');
      var w = views.game.querySelector('#tokWrap');
      if (w) { w.classList.add('shake'); }
    }

    var snapshot = game;
    pendingTimer = window.setTimeout(function () {
      if (game !== snapshot) { return; }
      openAnswerSheet({
        ok: correct,
        sentence: q.tokens.map(function (t) { return t.t; }).join(''),
        answerId: q.a,
        why: q.why,
        cue: q.cue,
        index: game.i,
        mode: 'm2'
      });
      game.busy = false;
    }, 320);
  }

  /* ---- 模式三：句子歸位 ---- */
  function renderM3() {
    var placedCount = Object.keys(game.placed).length;
    var pool = game.pool.filter(function (p) { return !p.placed; });

    var poolHtml = pool.map(function (p) {
      return '<button class="sent-card' + (game.selected === p.id ? ' sel' : '') + '" type="button" data-sent="' + p.id + '">' +
        '<span class="num">' + (p.id + 1) + '</span>' +
        '<span>' + esc(p.sentence) + '</span>' +
        '</button>';
    }).join('');

    var boxes = METHODS.map(function (m) {
      var filled = Object.prototype.hasOwnProperty.call(game.placed, m.id);
      return '<button class="method-box' + (filled ? ' filled' : '') + '" type="button" data-box="' + m.id + '"' + (filled ? ' aria-disabled="true"' : '') + '>' +
        '<span class="mb-icon" style="color:' + m.color + '">' +
        '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="5" y="8" width="38" height="32" rx="9"/><path d="M13 20 h14"/><path d="M13 28 h9"/></svg>' +
        '</span>' +
        '<span class="mb-name">' + m.name + '<small>' + m.short + '法</small></span>' +
        '</button>';
    }).join('');

    views.game.innerHTML =
      gameHeader('已歸位 ' + placedCount + ' / 6', placedCount / 6 * 100) +
      '<p class="tiny muted" style="margin:0 0 10px;font-weight:800">先點選一個句子，再點下面的方法箱，把它送回家。</p>' +
      '<div class="pool">' + (poolHtml || '<p class="tiny muted" style="text-align:center;margin:6px 0">全部歸位了！</p>') + '</div>' +
      '<div class="box-title">' + MODE_INFO.m3.tipLabel + '</div>' +
      '<div class="grid6">' + boxes + '</div>' +
      '<div class="hintbar" id="hintbar" aria-live="polite"></div>';

    var hint = document.getElementById('hintbar');

    views.game.querySelectorAll('[data-sent]').forEach(function (b) {
      b.addEventListener('click', function () {
        game.selected = Number(b.getAttribute('data-sent'));
        Sound.play('tap');
        renderM3();
        var h = document.getElementById('hintbar');
        if (h) { h.textContent = '已選第 ' + (game.selected + 1) + ' 句，現在點一個方法箱'; }
      });
    });

    views.game.querySelectorAll('[data-box]').forEach(function (box) {
      box.addEventListener('click', function () {
        placeSentence(box.getAttribute('data-box'), box);
      });
    });
  }

  function placeSentence(methodId, boxEl) {
    if (!game || game.busy || game.done) { return; }
    if (Object.prototype.hasOwnProperty.call(game.placed, methodId)) { return; }
    var hint = document.getElementById('hintbar');

    if (game.selected === null) {
      if (hint) { hint.textContent = '先點上面其中一個句子，再點這個箱'; }
      boxEl.classList.remove('shake');
      void boxEl.offsetWidth;
      boxEl.classList.add('shake');
      Sound.play('wrong');
      return;
    }

    var item = null;
    for (var i = 0; i < game.pool.length; i++) {
      if (game.pool[i].id === game.selected) { item = game.pool[i]; }
    }
    if (!item) { return; }

    if (item.a !== methodId) {
      game.firstTry[item.id] = false;
      if (!game.recorded[item.id]) {
        game.recorded[item.id] = true;
        game.wrong.push({ sentence: item.sentence, a: item.a, cue: item.cue, why: item.why });
      }
      if (hint) { hint.textContent = '這箱不對哦，再想想這句的訊號詞是甚麼'; }
      boxEl.classList.remove('shake');
      void boxEl.offsetWidth;
      boxEl.classList.add('shake');
      Sound.play('wrong');
      return;
    }

    /* 配對成功 */
    game.busy = true;
    item.placed = true;
    game.placed[methodId] = item.id;
    if (game.firstTry[item.id]) { game.score += 1; }
    Sound.play('place');
    game.selected = null;

    var snapshot = game;
    pendingTimer = window.setTimeout(function () {
      if (game !== snapshot) { return; }
      var isLast = Object.keys(game.placed).length >= 6;
      openAnswerSheet({
        ok: true,
        sentence: item.sentence,
        answerId: item.a,
        why: item.why,
        cue: item.cue,
        mode: 'm3',
        isLast: isLast
      });
      game.busy = false;
      renderM3();
      var h = document.getElementById('hintbar');
      if (h && !isLast) { h.textContent = '很好！繼續把剩下的句子歸位'; }
    }, 280);
  }

  /* ============================================================
     11 · 答案解析面板
     ============================================================ */
  function openAnswerSheet(cfg) {
    var m = methodById(cfg.answerId);
    var sentence = esc(cfg.sentence);
    (cfg.cue || []).forEach(function (c) {
      if (sentence.indexOf(esc(c)) >= 0) {
        sentence = sentence.split(esc(c)).join('<mark>' + esc(c) + '</mark>');
      }
    });

    var tags = (cfg.cue || []).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('');
    var nextLabel = cfg.mode === 'm3'
      ? (cfg.isLast ? '看成績' : '繼續歸位')
      : (cfg.index === 5 ? '看成績' : '下一題');

    var html =
      '<div class="sheet-head">' +
      '<span class="res-badge ' + (cfg.ok ? 'ok' : 'no') + '">' + (cfg.ok ? '答對了' : '差一點點') + '</span>' +
      '<h3 id="sheet-title">' + (cfg.ok ? '這句用了「' + m.name + '」' : '正確答案是「' + m.name + '」') + '</h3>' +
      '</div>' +
      '<p class="sheet-sentence">' + sentence + '</p>' +
      '<div class="answer-line"><span class="swatch" style="background:' + m.color + '"></span>方法：' + m.name + '</div>' +
      '<p class="why">' + cfg.why + '</p>' +
      (tags ? '<p class="cue-line">訊號詞：' + tags + '</p>' : '') +
      '<p class="cue-line">口訣：' + m.trick + '</p>' +
      (cfg.ok ? '' : '<p class="tiny muted" style="margin:0 0 10px">記住這些訊號詞，下次一看到就能認出來。</p>') +
      '<button class="btn btn-sun btn-block" type="button" id="sheet-next">' + nextLabel + '</button>';

    sheetCard.innerHTML = html;
    sheet.hidden = false;
    sheetOnClose = function () { advance(cfg); };

    var btn = document.getElementById('sheet-next');
    if (btn) {
      btn.addEventListener('click', closeSheet);
      btn.focus({ preventScroll: true });
    }
    Sound.play('sheet');
  }

  function closeSheet() {
    if (sheet.hidden) { return; }
    sheet.hidden = true;
    sheetCard.innerHTML = '';
    var cb = sheetOnClose;
    sheetOnClose = null;
    if (cb) { cb(); }
  }

  function advance(cfg) {
    if (!game) { return; }
    if (cfg.mode === 'm3') {
      if (Object.keys(game.placed).length >= 6) { finishGame(); }
      return;
    }
    game.i += 1;
    game.answered = false;
    game.selected = null;
    if (game.i >= 6) {
      finishGame();
    } else {
      renderGame();
    }
  }

  /* ============================================================
     12 · 結算頁
     ============================================================ */
  function starSvg(on) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6.05 6.6.9-4.8 4.62 1.18 6.53L12 17.5l-5.88 3.2 1.18-6.53L2.5 9.55l6.6-.9z" fill="' +
      (on ? '#ffc93c' : 'none') + '" stroke="#3b2b2b" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  }

  function finishGame() {
    if (!game || game.done) { return; }
    game.done = true;
    var mode = game.mode;
    var score = game.score;
    if (score > state.best[mode]) {
      state.best[mode] = score;
      saveStore();
    }
    Sound.play('win');
    renderResult(mode, score, game.wrong);
    show('result');
  }

  function renderResult(mode, score, wrongList) {
    var info = MODE_INFO[mode];
    var stars = score >= 6 ? 3 : score >= 5 ? 2 : score >= 4 ? 1 : 0;
    var msg, sub;
    if (score === 6) {
      msg = '六題全對！你已經是說明方法小達人！';
      sub = '不但認得出來，連訊號詞都抓得準。試試另外兩種模式吧。';
    } else if (score === 5) {
      msg = '很接近滿分，只差一點點！';
      sub = '看看下面那一題的解說，再挑戰一次就完美了。';
    } else if (score === 4) {
      msg = '不錯！有四招已經很穩。';
      sub = '其餘兩招再看一次教學，特別是訊號詞的部分。';
    } else {
      msg = '別灰心，先把六張圖卡看一遍。';
      sub = '說明方法靠的是「看到訊號詞就想起方法」，但也要看句意；多練幾次就會快。';
    }

    var review = '';
    if (wrongList.length) {
      review = '<div class="review"><h4>要留意的 ' + wrongList.length + ' 題</h4>' +
        wrongList.map(function (w) {
          var m = methodById(w.a);
          return '<div class="review-item">' +
            '<span class="ri-s">' + esc(w.sentence) + '</span>' +
            '<span class="ri-a">→ ' + m.name + '</span>：' + w.why +
            '</div>';
        }).join('') + '</div>';
    }

    views.result.innerHTML =
      '<div class="result-wrap">' +
      '<p class="pill" style="display:inline-block">模式' + (mode === 'm1' ? '1' : mode === 'm2' ? '2' : '3') + '：' + info.name + '</p>' +
      '<div class="score-ring"><div><div class="num">' + score + '</div><div class="den">/ 6 題</div></div></div>' +
      '<div class="stars">' + starSvg(stars >= 1) + starSvg(stars >= 2) + starSvg(stars >= 3) + '</div>' +
      '<p class="result-msg">' + msg + '</p>' +
      '<p class="tiny muted" style="max-width:26em;margin:0 auto">' + sub + '</p>' +
      review +
      '<div class="result-actions">' +
      '<button class="btn btn-sun btn-block" type="button" id="btn-again">再玩一次</button>' +
      '<button class="btn btn-mint btn-block" type="button" id="btn-other">選另一種模式</button>' +
      '<button class="btn btn-quiet btn-block" type="button" id="btn-backlearn">回去看教學</button>' +
      '</div></div>';

    document.getElementById('btn-again').addEventListener('click', function () {
      Sound.play('tap');
      startGame(mode);
    });
    document.getElementById('btn-other').addEventListener('click', function () {
      Sound.play('tap');
      renderHub();
      show('hub');
    });
    document.getElementById('btn-backlearn').addEventListener('click', function () {
      Sound.play('tap');
      renderLearn();
      show('learn');
    });
  }

  /* ============================================================
     13 · 全域事件與啟動
     ============================================================ */
  btnHome.addEventListener('click', function () {
    Sound.play('tap');
    if (sheet.hidden === false) { sheetOnClose = null; closeSheet(); }
    renderHome();
    show('home');
  });

  btnSound.addEventListener('click', function () {
    state.sound = !state.sound;
    renderSoundButton();
    saveStore();
    if (state.sound) { Sound.play('correct'); }
  });

  sheetBackdrop.addEventListener('click', closeSheet);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); }
  });

  function init() {
    loadStore();
    renderSoundButton();
    renderHome();
    show('home');
  }

  init();
})();

</script>
</body>
</html>
