<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>敘事六要素互動遊戲｜初小 · 高小</title>
<meta name="description" content="小學中文敘事六要素互動學習遊戲，分初小版與高小版，含圖解教學與兩種遊戲模式，支援手機、平板及電腦，離線可用。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FF8A3D'/%3E%3Ctext x='32' y='43' font-size='30' font-family='sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3E%E5%85%AD%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --ink:#2B2A3C;
  --paper:#FFF9F0;
  --c-time:#3E8BF0;
  --c-place:#2FB98A;
  --c-person:#FF8A3D;
  --c-cause:#9B7EDE;
  --c-process:#F2688F;
  --c-result:#E8B33A;
  --muted:#6B6880;
  --line:rgba(43,42,60,.14);
  --fs-sm:clamp(13px,0.7vw + 11px,15px);
  --fs-body:clamp(16px,0.95vw + 13px,20px);
  --fs-lead:clamp(18px,1.1vw + 14px,23px);
  --fs-h3:clamp(20px,1.3vw + 15px,27px);
  --fs-h2:clamp(24px,1.9vw + 17px,36px);
  --fs-h1:clamp(34px,4.6vw + 16px,68px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'PingFang HK','PingFang TC','Noto Sans HK','Noto Sans TC','Microsoft JhengHei','Heiti TC','Apple LiGothic',sans-serif;
  font-size:16px;line-height:1.5;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 9% 4%, rgba(255,201,77,.40), transparent 34%),
    radial-gradient(circle at 94% 8%, rgba(62,139,240,.20), transparent 32%),
    radial-gradient(circle at 50% 103%, rgba(47,185,138,.22), transparent 40%),
    radial-gradient(rgba(43,42,60,.07) 1.5px, transparent 1.6px);
  background-size:auto,auto,auto,24px 24px;
  background-attachment:fixed;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid rgba(62,139,240,.9);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app-shell{max-width:1240px;margin:0 auto;padding:clamp(12px,2.4vw,26px) clamp(12px,3vw,28px) calc(40px + env(safe-area-inset-bottom))}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:4px 0 14px;
}
.icon-btn{
  width:clamp(46px,5vw,54px);height:clamp(46px,5vw,54px);
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer;flex:0 0 auto;
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:24px;height:24px;display:block}
.topbar-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.topbar-kicker{font-size:var(--fs-sm);color:var(--muted);letter-spacing:.08em;font-weight:600}
.topbar-title{font-size:clamp(16px,1.2vw + 12px,20px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:8px;flex:0 0 auto}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:6px 12px;font-size:var(--fs-sm);font-weight:800;
}

/* ---------- views ---------- */
.view{display:none}
.view.active{display:block;animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.92;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{padding:clamp(6px,2vw,22px) 0 clamp(10px,2vw,18px)}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(43,42,60,.06);border:2px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:var(--fs-sm);font-weight:800;color:var(--muted);
  letter-spacing:.06em;
}
.hero h1{
  font-size:var(--fs-h1);line-height:1.08;letter-spacing:-.02em;
  margin:14px 0 6px;font-weight:900;
}
.hero h1 .hl{
  position:relative;display:inline-block;z-index:0;
  color:var(--c-person);
}
.hero h1 .hl::after{
  content:"";position:absolute;left:2%;right:2%;bottom:.04em;height:.22em;
  background:rgba(255,201,77,.55);border-radius:99px;z-index:-1;
}
.hero-lead{
  font-size:var(--fs-lead);line-height:1.65;color:#4A4760;margin:10px 0 0;max-width:34em;font-weight:500;
}
.hero-icons{
  display:flex;flex-wrap:wrap;gap:clamp(6px,1.6vw,16px);margin:clamp(16px,3vw,26px) 0 clamp(18px,3vw,30px);
}
.hero-icons .mini{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  flex:0 0 auto;
  animation:bob 3.6s ease-in-out infinite;
}
.hero-icons .mini svg{width:clamp(46px,7vw,72px);height:clamp(46px,7vw,72px);display:block}
.hero-icons .mini span{font-size:var(--fs-sm);font-weight:800;letter-spacing:.04em}
@media(max-width:480px){.hero-icons{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;row-gap:10px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.grade-grid{display:grid;grid-template-columns:1fr;gap:clamp(12px,2vw,20px)}
@media(min-width:760px){.grade-grid{grid-template-columns:1fr 1fr}}
.grade-card{
  width:100%;font:inherit;color:inherit;
  position:relative;display:flex;align-items:center;gap:clamp(12px,2vw,20px);
  background:#fff;border:3.5px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 var(--ink);padding:clamp(16px,2.4vw,26px);
  cursor:pointer;text-align:left;transition:transform .14s ease,box-shadow .14s ease;
  overflow:hidden;
}
.grade-card:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--ink)}
.grade-card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.grade-card .band{
  position:absolute;inset:0 auto 0 0;width:12px;
}
.grade-card .gc-body{flex:1;min-width:0;padding-left:8px}
.grade-card .gc-tag{
  font-size:var(--fs-sm);font-weight:800;letter-spacing:.1em;color:var(--muted);
}
.grade-card h2{margin:2px 0 6px;font-size:clamp(26px,2.6vw + 14px,40px);line-height:1.1;font-weight:900}
.grade-card p{margin:0;font-size:var(--fs-body);line-height:1.55;color:#4A4760}
.grade-card .gc-fig{flex:0 0 auto;width:clamp(74px,12vw,110px);height:clamp(74px,12vw,110px)}
.grade-card .gc-fig svg{width:100%;height:100%;display:block}
.foot-note{
  margin-top:clamp(18px,3vw,30px);font-size:var(--fs-sm);color:var(--muted);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;
}
.foot-note .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}


.hero-txt{min-width:0}
.hero-art{display:none}
@media(min-width:900px){
  .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center}
  .hero-art{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .hero-art .hero-kid{width:clamp(180px,16vw,250px);height:clamp(180px,16vw,250px)}
  .hero-art .hero-kid svg{width:100%;height:100%;display:block}
  .hero-art .bubble{
    background:#fff;border:3.5px solid var(--ink);border-radius:22px;
    box-shadow:0 6px 0 var(--ink);padding:12px 18px;margin-bottom:14px;
    font-size:clamp(16px,1.1vw + 10px,20px);font-weight:900;line-height:1.5;text-align:center;
    position:relative;
  }
  .hero-art .bubble::after{
    content:"";position:absolute;left:50%;bottom:-13px;margin-left:-9px;
    width:18px;height:18px;background:#fff;border-right:3.5px solid var(--ink);
    border-bottom:3.5px solid var(--ink);transform:rotate(45deg) ;
  }
}
.slot-exp{font-size:clamp(14px,0.9vw + 11px,17px)}

/* ---------- menu ---------- */
.menu-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.menu-head h2{margin:0;font-size:var(--fs-h2);font-weight:900;line-height:1.15}
.menu-head p{margin:6px 0 0;font-size:var(--fs-body);color:var(--muted);line-height:1.55}
.menu-grid{display:grid;grid-template-columns:1fr;gap:clamp(12px,2vw,18px);margin-top:clamp(14px,2.4vw,22px)}
@media(min-width:860px){.menu-grid{grid-template-columns:1.15fr 1fr 1fr}}
.menu-card{
  background:#fff;border:3.5px solid var(--ink);border-radius:24px;
  box-shadow:0 7px 0 var(--ink);padding:clamp(16px,2.2vw,24px);
  display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease;
}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--ink)}
.menu-card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.menu-card .mc-top{display:flex;align-items:center;gap:12px}
.menu-card .mc-top svg{width:clamp(52px,7vw,64px);height:clamp(52px,7vw,64px);flex:0 0 auto}
.menu-card h3{margin:0;font-size:var(--fs-h3);font-weight:900;line-height:1.2}
.menu-card .mc-tag{font-size:var(--fs-sm);font-weight:800;color:var(--muted);letter-spacing:.06em}
.menu-card p{margin:0;font-size:var(--fs-body);line-height:1.6;color:#4A4760}
.menu-card .mc-cta{
  margin-top:auto;display:inline-flex;align-items:center;gap:8px;
  font-size:var(--fs-body);font-weight:900;
}
.menu-card .mc-cta svg{width:20px;height:20px;flex:0 0 auto}

/* ---------- learn ---------- */
.chant{
  background:var(--ink);color:#FFF6E6;border-radius:22px;
  padding:clamp(14px,2vw,20px) clamp(16px,2.4vw,26px);
  display:flex;align-items:center;gap:clamp(12px,2vw,20px);flex-wrap:wrap;
  box-shadow:0 7px 0 rgba(43,42,60,.28);
}
.chant .chant-ico{width:clamp(40px,5vw,52px);height:clamp(40px,5vw,52px);flex:0 0 auto}
.chant .chant-txt{font-size:clamp(17px,1.3vw + 13px,24px);font-weight:800;line-height:1.5;letter-spacing:.02em}
.chant .chant-txt b{color:#FFC94D}

.section-label{
  display:flex;align-items:center;gap:10px;margin:clamp(22px,3.4vw,34px) 0 clamp(10px,2vw,16px);
  font-size:var(--fs-h3);font-weight:900;
}
.section-label .bar{width:8px;height:1.1em;border-radius:99px;background:var(--c-person)}

.el-grid{display:grid;grid-template-columns:1fr;gap:clamp(12px,2vw,18px)}
@media(min-width:700px){.el-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.el-grid{grid-template-columns:1fr 1fr 1fr}}
.el-card{
  background:#fff;border:3.5px solid var(--ink);border-radius:24px;
  box-shadow:0 6px 0 var(--ink);padding:clamp(14px,2vw,20px);
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.el-card .el-strip{position:absolute;top:0;left:0;right:0;height:10px}
.el-card .el-top{display:flex;align-items:center;gap:12px;margin-top:6px}
.el-card .el-top svg{width:clamp(56px,8vw,72px);height:clamp(56px,8vw,72px);flex:0 0 auto}
.el-card h3{margin:0;font-size:clamp(23px,2vw + 15px,32px);font-weight:900;line-height:1.1}
.el-card .el-q{margin:2px 0 0;font-size:var(--fs-sm);font-weight:800;opacity:.75}
.el-card .el-eg{
  font-size:var(--fs-body);line-height:1.6;
  background:rgba(43,42,60,.045);border-radius:14px;padding:10px 14px;
  border-left:6px solid currentColor;
}
.el-card .el-tip{
  font-size:var(--fs-body);line-height:1.6;color:#4A4760;
  border-top:2px dashed var(--line);padding-top:10px;
}
.el-card .el-tip b{color:var(--ink)}

.demo{
  background:#fff;border:3.5px solid var(--ink);border-radius:26px;
  box-shadow:0 7px 0 var(--ink);padding:clamp(16px,2.6vw,28px);
}
.demo h3{margin:0 0 4px;font-size:var(--fs-h3);font-weight:900}
.demo .demo-sub{margin:0 0 14px;font-size:var(--fs-sm);color:var(--muted);font-weight:700}
.demo-body{font-size:clamp(18px,1.05vw + 15px,24px);line-height:2.1}
.tk{
  border-radius:8px;padding:1px 5px;font-weight:800;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.demo-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.demo-legend span{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:800;
  border-radius:999px;padding:5px 12px;border:2px solid currentColor;
}
.demo-legend i{width:10px;height:10px;border-radius:50%;background:currentColor;display:block}

/* ---------- quiz shell ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:clamp(12px,2vw,18px)}
.dots{display:flex;gap:7px;flex:1;min-width:120px}
.dots i{
  height:12px;flex:1;border-radius:99px;background:rgba(43,42,60,.14);
  transition:background .3s ease,transform .3s ease;display:block;
}
.dots i.done{background:var(--c-place)}
.dots i.now{background:var(--c-person);transform:scaleY(1.35)}
.dots i.wrongmark{background:var(--c-process)}
.counter{font-size:var(--fs-body);font-weight:900;white-space:nowrap}
.counter small{font-size:var(--fs-sm);color:var(--muted);font-weight:800}

.qcard{
  background:#fff;border:3.5px solid var(--ink);border-radius:26px;
  box-shadow:0 7px 0 var(--ink);padding:clamp(16px,2.6vw,30px);
  margin-bottom:clamp(14px,2.2vw,22px);
}
.qcard .q-label{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--fs-sm);font-weight:900;letter-spacing:.1em;
  background:rgba(43,42,60,.06);border-radius:999px;padding:5px 14px;margin-bottom:12px;
}
.q-sentence{
  font-size:clamp(22px,2.1vw + 14px,38px);line-height:1.6;font-weight:800;margin:0;
  letter-spacing:.01em;
}
.q-sentence .q-quote{opacity:.35;font-weight:900}
.q-hint{margin:12px 0 0;font-size:var(--fs-body);color:var(--muted);line-height:1.6}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(9px,1.6vw,14px)}
@media(min-width:640px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 5px 0 var(--ink);padding:clamp(10px,1.5vw,14px) clamp(10px,1.6vw,16px);
  cursor:pointer;text-align:left;font-size:clamp(18px,1.1vw + 14px,24px);font-weight:900;
  transition:transform .12s ease,box-shadow .12s ease,background .2s ease,opacity .2s ease;
  min-height:64px;
}
.opt svg{width:clamp(38px,4.6vw,48px);height:clamp(38px,4.6vw,48px);flex:0 0 auto}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.picked{outline:4px solid rgba(43,42,60,.18)}
.opt.right{background:#E9F9F2;border-color:var(--c-place);box-shadow:0 5px 0 var(--c-place)}
.opt.wrong{background:#FDEDF1;border-color:var(--c-process);box-shadow:0 5px 0 var(--c-process)}
.opt.dim{opacity:.42}
.opt:disabled{cursor:default}

/* ---------- feedback ---------- */
.feedback{
  margin-top:clamp(14px,2vw,20px);
  border:3.5px solid var(--ink);border-radius:24px;padding:clamp(14px,2vw,22px);
  background:#fff;box-shadow:0 6px 0 var(--ink);
  display:none;
}
.feedback.show{display:block;animation:popIn .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes popIn{from{opacity:.9;transform:scale(.97)}to{opacity:1;transform:none}}
.fb-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fb-head svg{width:clamp(38px,5vw,50px);height:clamp(38px,5vw,50px);flex:0 0 auto}
.fb-head strong{font-size:clamp(20px,1.6vw + 14px,28px);font-weight:900}
.fb-body{font-size:var(--fs-body);line-height:1.72;color:#403D53}
.fb-body p{margin:0 0 8px}
.fb-body p:last-child{margin:0}
.fb-key{
  display:inline-block;border-radius:8px;padding:1px 8px;font-weight:900;color:#fff;
}
.fb-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:3px solid var(--ink);border-radius:18px;padding:13px 22px;
  background:#fff;font-size:var(--fs-body);font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;
  min-height:54px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--c-person);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.go{background:var(--c-place);color:#fff}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn svg{width:22px;height:22px;flex:0 0 auto}

/* ---------- mode B ---------- */
.pool-wrap{margin-bottom:clamp(14px,2vw,20px)}
.pool-title{font-size:var(--fs-sm);font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.pool{
  display:flex;flex-wrap:wrap;gap:10px;
  background:rgba(255,255,255,.7);border:3px dashed rgba(43,42,60,.28);
  border-radius:22px;padding:clamp(10px,1.6vw,16px);min-height:72px;
}
.chip{
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--ink);padding:10px 14px;cursor:pointer;
  font-size:var(--fs-body);font-weight:700;line-height:1.45;text-align:left;
  transition:transform .12s ease,box-shadow .12s ease;max-width:100%;
}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.sel{background:#FFF3D6;border-color:var(--c-person);box-shadow:0 4px 0 var(--c-person);transform:translateY(-2px)}
.chip.used{display:none}
.pool-empty{font-size:var(--fs-body);color:var(--muted);font-weight:700;padding:6px 4px}

.slots{display:grid;grid-template-columns:1fr;gap:clamp(9px,1.5vw,14px)}
@media(min-width:680px){.slots{grid-template-columns:1fr 1fr}}
.slot{
  background:#fff;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 5px 0 var(--ink);padding:12px 14px;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background .2s ease,border-color .2s ease;
  display:flex;flex-direction:column;gap:8px;min-height:96px;
}
.slot:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.slot .slot-head{display:flex;align-items:center;gap:8px}
.slot .slot-head svg{width:clamp(30px,3.6vw,38px);height:clamp(30px,3.6vw,38px);flex:0 0 auto}
.slot .slot-name{font-size:var(--fs-sm);font-weight:900;letter-spacing:.06em}
.slot .slot-body{font-size:var(--fs-body);line-height:1.55;font-weight:700;min-height:1.6em;color:#6B6880}
.slot.filled .slot-body{color:var(--ink)}
.slot.target{border-color:var(--c-person);box-shadow:0 0 0 4px rgba(255,138,61,.28),0 5px 0 var(--c-person)}
.slot.ok{border-color:var(--c-place);box-shadow:0 5px 0 var(--c-place);background:#F2FBF7}
.slot.no{border-color:var(--c-process);box-shadow:0 5px 0 var(--c-process);background:#FEF3F6}
.slot .slot-mark{width:26px;height:26px;margin-left:auto;flex:0 0 auto;display:none}
.slot.ok .slot-mark,.slot.no .slot-mark{display:block}
.slot-exp{
  font-size:clamp(14px,0.45vw + 12.5px,17px);line-height:1.62;border-top:2px dashed var(--line);
  padding-top:8px;margin-top:2px;display:none;
}

/* ===== 小工具 ===== */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed || 1;
  for (let i = a.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ===== 音效 ===== */
let ac = null;
let soundOn = true;
function audioCtx(){
  if (!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; }
  }
  if (ac && ac.state === 'suspended'){ ac.resume(); }
  return ac;
}
function tone(freq, start, dur, type, vol){
  const c = audioCtx();
  if (!c) return;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, c.currentTime + start);
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, c.currentTime + start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start);
  o.stop(c.currentTime + start + dur + 0.04);
}
function sfx(name){
  if (!soundOn) return;
  if (name === 'tap'){ tone(680, 0, 0.07, 'triangle', 0.10); }
  else if (name === 'pick'){ tone(880, 0, 0.08, 'sine', 0.10); }
  else if (name === 'right'){
    tone(660, 0, 0.11, 'sine', 0.15);
    tone(880, 0.09, 0.13, 'sine', 0.15);
    tone(1175, 0.19, 0.20, 'sine', 0.13);
  }
  else if (name === 'wrong'){
    tone(300, 0, 0.14, 'triangle', 0.13);
    tone(220, 0.11, 0.22, 'triangle', 0.12);
  }
  else if (name === 'win'){
    [523, 659, 784, 1046].forEach(function(f, i){ tone(f, i * 0.11, 0.22, 'sine', 0.15); });
    tone(1318, 0.46, 0.40, 'sine', 0.10);
  }
  else if (name === 'drop'){ tone(520, 0, 0.09, 'sine', 0.10); }
}

function startModeA(){
  state.mode = 'a';
  state.idx = 0;
  state.score = 0;
  renderModeA();
  setView('a');
}

function renderModeA(){
  const d = DATA[state.grade];
  const q = d.a[state.idx];

  $('#dots-a').innerHTML = d.a.map(function(_, i){
    return '<i class="' + (i < state.idx ? 'done' : (i === state.idx ? 'now' : '')) + '"></i>';
  }).join('');
  $('#counter-a').innerHTML = '第 ' + (state.idx + 1) + ' 題 <small>/ ' + d.a.length + '</small>';

  $('#qcard-a').innerHTML =
    '<span class="q-label">要素偵探 · 找出主要要素</span>' +
    '<p class="q-sentence"><span class="q-quote">「</span>' + q.s + '<span class="q-quote">」</span></p>' +
    '<p class="q-hint">這個片段最主要的要素是甚麼？點一個答案。</p>';

  $('#opts-a').innerHTML = ELS.map(function(e){
    return '<button class="opt" data-k="' + e.k + '">' + iconSVG(e.k) + '<span>' + e.name + '</span></button>';
  }).join('');

  $('#fb-a').className = 'feedback';
  $('#fb-a').innerHTML = '';

  $$('#opts-a .opt').forEach(function(b){
    b.addEventListener('click', function(){ answerA(b.dataset.k); });
  });
}

function answerA(k){
  const d = DATA[state.grade];
  const q = d.a[state.idx];
  const right = (k === q.k);
  if (right) state.score++;
  sfx(right ? 'right' : 'wrong');

  $$('#opts-a .opt').forEach(function(b){
    b.disabled = true;
    if (b.dataset.k === q.k) b.classList.add('right');
    else if (b.dataset.k === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const c = EM[q.k].color;
  const picked = EM[k];
  const last = state.idx === d.a.length - 1;
  const fb = $('#fb-a');
  fb.className = 'feedback show';
  fb.innerHTML =
    '<div class="fb-head">' + iconSVG(q.k) +
      '<strong style="color:' + c + '">' + (right ? '答對了！' : '差一點點') + '</strong></div>' +
    '<div class="fb-body">' +
      '<p>正確答案是 <span class="fb-key" style="background:' + c + '">' + EM[q.k].name + '</span>。</p>' +
      '<p>' + q.why + '</p>' +
      (right ? '' : '<p>你選了「' + picked.name + '」，但這個片段沒有回答「' + picked.ask + '」這個問題。</p>') +
      '<p style="color:#6B6880">小提示：' + EM[q.k].howto + '</p>' +
    '</div>' +
    '<div class="fb-actions"><button class="btn primary" id="next-a">' +
      (last ? '看成績' : '下一題') +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>' +
    '</button></div>';

  $('#next-a').addEventListener('click', function(){
    sfx('tap');
    if (last){ showResult(); }
    else { state.idx++; renderModeA(); window.scrollTo({ top:0, behavior:'smooth' }); }
  });
  scrollToEl(fb, 10);
}

/* ===== 遊戲二：故事拼圖 ===== */
function startModeB(){
  state.mode = 'b';
  state.idx = 0;
  state.score = 0;
  renderModeB();
  setView('b');
}

function renderModeB(){
  const d = DATA[state.grade];
  const g = d.b[state.idx];
  state.bPlaced = {};
  state.bSelected = null;
  state.bChecked = false;
  state.poolOrder = seededShuffle(g.items.map(function(_, i){ return i; }), (state.idx + 1) * 17 + 5);

  $('#dots-b').innerHTML = d.b.map(function(_, i){
    return '<i class="' + (i < state.idx ? 'done' : (i === state.idx ? 'now' : '')) + '"></i>';
  }).join('');
  $('#counter-b').innerHTML = '第 ' + (state.idx + 1) + ' 組 <small>/ ' + d.b.length + '</small>';

  $('#qcard-b').innerHTML =
    '<span class="q-label">故事拼圖 · 第 ' + (state.idx + 1) + ' 篇</span>' +
    '<p class="q-sentence" style="font-size:clamp(22px,1.7vw + 15px,30px)">《' + g.title + '》</p>' +
    '<p class="q-hint">先點一張句子卡，再點下面的要素格子。放錯了，可以再點格子把句子取回。</p>';

  $('#fb-b').className = 'feedback';
  $('#fb-b').innerHTML = '';
  const btn = $('#btn-check-b');
  btn.disabled = true;
  btn.className = 'btn go';
  btn.innerHTML = '還差 6 格';

  renderPoolB();
  renderSlotsB();
}

function renderPoolB(){
  const g = DATA[state.grade].b[state.idx];
  const used = Object.keys(state.bPlaced).map(function(k){ return state.bPlaced[k]; });
  const left = state.poolOrder.filter(function(i){ return used.indexOf(i) === -1; });
  const pool = $('#pool-b');
  pool.removeAttribute('aria-hidden');

  if (!left.length){
    pool.innerHTML = '<div class="pool-empty">句子卡都放好了，按「檢查答案」看看對不對。</div>';
  } else {
    pool.innerHTML = left.map(function(i){
      return '<button class="chip' + (state.bSelected === i ? ' sel' : '') + '" data-i="' + i + '">' + g.items[i].t + '</button>';
    }).join('');
  }

  $$('#pool-b .chip').forEach(function(ch){
    ch.addEventListener('click', function(){
      const i = parseInt(ch.dataset.i, 10);
      state.bSelected = (state.bSelected === i) ? null : i;
      sfx('pick');
      renderPoolB();
      renderSlotsB();
      const again = $('#pool-b .chip[data-i="' + i + '"]');
      if (again) again.focus({ preventScroll: true });
    });
  });
}

function renderSlotsB(){
  const g = DATA[state.grade].b[state.idx];
  const box = $('#slots-b');

  box.innerHTML = ELS.map(function(e){
    const idx = state.bPlaced[e.k];
    const item = (idx != null) ? g.items[idx] : null;
    const canTarget = (state.bSelected != null && !item && !state.bChecked);
    return '<div class="slot' + (item ? ' filled' : '') + (canTarget ? ' target' : '') + '" data-k="' + e.k + '"' +
      ' role="button" tabindex="0" aria-label="' + e.name + '：' + (item ? item.t : '未放置句子') + '">' +
      '<div class="slot-head">' + iconSVG(e.k) +
        '<span class="slot-name" style="color:' + e.color + '">' + e.name + '</span>' +
      '</div>' +
      '<div class="slot-body">' + (item ? item.t : '點一下，把句子放在這裏') + '</div>' +
    '</div>';
  }).join('');

  $$('#slots-b .slot').forEach(function(slot){
    slot.addEventListener('click', function(){ tapSlot(slot.dataset.k); });
    slot.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
        ev.preventDefault();
        tapSlot(slot.dataset.k);
      }
    });
  });
}

function tapSlot(k){
  if (state.bChecked) return;
  const g = DATA[state.grade].b[state.idx];
  const idx = state.bPlaced[k];
  let focusSel = '';

  if (idx != null){
    delete state.bPlaced[k];
    state.bSelected = idx;
    focusSel = '#pool-b .chip[data-i="' + idx + '"]';
    sfx('tap');
  } else if (state.bSelected != null){
    // 若這句已放在別的格子，先取回
    Object.keys(state.bPlaced).forEach(function(key){
      if (state.bPlaced[key] === state.bSelected) delete state.bPlaced[key];
    });
    state.bPlaced[k] = state.bSelected;
    state.bSelected = null;
    focusSel = '#slots-b .slot[data-k="' + k + '"]';
    sfx('drop');
  } else {
    toast('先點一張句子卡，再點格子');
    return;
  }

  renderPoolB();
  renderSlotsB();
  if (focusSel){
    const el = $(focusSel);
    if (el) el.focus({ preventScroll: true });
  }
  const filled = Object.keys(state.bPlaced).length;
  const btn = $('#btn-check-b');
  btn.disabled = filled < 6;
  btn.innerHTML = filled < 6
    ? '還差 ' + (6 - filled) + ' 格'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>檢查答案';
  if (filled === 6){
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>檢查答案';
  }
}

function checkB(){
  const d = DATA[state.grade];
  const g = d.b[state.idx];
  state.bChecked = true;

  let correct = 0;
  const marks = {};

  ELS.forEach(function(e){
    const idx = state.bPlaced[e.k];
    const item = (idx != null) ? g.items[idx] : null;
    const ok = !!(item && item.k === e.k);
    if (ok) correct++;
    marks[e.k] = { item:item, ok:ok, answer:(g.items.filter(function(x){ return x.k === e.k; })[0] || {}).t };
  });

  state.score += correct;
  sfx(correct >= 5 ? 'win' : (correct >= 3 ? 'right' : 'wrong'));

  $('#slots-b').innerHTML = ELS.map(function(e){
    const m = marks[e.k];
    const cls = m.ok ? 'ok' : 'no';
    const actual = m.item ? EM[m.item.k] : null;
    const exp = m.ok
      ? '這一句是「' + e.name + '」：' + e.explain
      : '這一格是「' + e.name + '」，但放入的句子其實是' + (actual ? '「' + actual.name + '」' : '空的') + '。<span class="fix">「' + e.name + '」應放：' + m.answer + '</span>';
    return '<div class="slot filled ' + cls + '" data-k="' + e.k + '" role="group" tabindex="-1">' +
      '<div class="slot-head">' + iconSVG(e.k) +
        '<span class="slot-name" style="color:' + e.color + '">' + e.name + '</span>' +
        '<span class="slot-mark">' + (m.ok
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="#2FB98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 13 5 5L20 7"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="#F2688F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>') +
        '</span>' +
      '</div>' +
      '<div class="slot-body">' + (m.item ? m.item.t : '（沒有放入句子）') + '</div>' +
      '<div class="slot-exp show">' + exp + '</div>' +
    '</div>';
  }).join('');

  $('#pool-b').innerHTML = '<div class="pool-empty">這一篇已完成，請看下面每一格的解釋。</div>';
  $('#pool-b').setAttribute('aria-hidden', 'true');

  const fb = $('#fb-b');
  fb.className = 'feedback show';
  fb.innerHTML =
    '<div class="fb-head">' + iconSVG('result') +
      '<strong>這一篇放對了 ' + correct + ' / 6 格</strong></div>' +
    '<div class="fb-body">' +
      '<p>' + (correct === 6 ? '六個要素全部歸位，很準確！' : '看看每一格下面的解釋，就知道為甚麼要這樣放。') + '</p>' +
      '<p>' + g.note + '</p>' +
    '</div>';

  const btn = $('#btn-check-b');
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>' +
    (state.idx === d.b.length - 1 ? '看成績' : '下一篇');
  scrollToEl($('#slots-b'), 12);
}

/* ===== 成績 ===== */
function starSVG(filled, color){
  return '<svg viewBox="0 0 24 24" class="' + (filled ? '' : 'off') + '" aria-hidden="true">' +
    '<path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.46l-5.9 3.11 1.13-6.57L2.45 9.34l6.6-.96z" fill="' + (filled ? color : '#2B2A3C') + '" stroke="#2B2A3C" stroke-width="1.5" stroke-linejoin="round"/></svg>';
}

function showResult(){
  const d = DATA[state.grade];
  const isA = state.mode === 'a';
  const total = isA ? d.a.length : d.b.length * 6;
  const unit = isA ? '題' : '格';
  const pct = Math.round((state.score / total) * 100);
  const stars = pct >= 90 ? 3 : (pct >= 65 ? 2 : (pct >= 35 ? 1 : 0));

  let msg = '';
  if (stars === 3) msg = '六個要素都認得清清楚楚，可以做小老師了。';
  else if (stars === 2) msg = '很接近了，再讀一次解釋，下次一定更好。';
  else if (stars === 1) msg = '不錯的開始，回去「學一學」再看一次圖示。';
  else msg = '不要灰心，先看圖學一學，再玩一次。';

  const starColor = stars === 3 ? '#E8B33A' : (stars === 2 ? '#FFC94D' : '#FF8A3D');

  $('#result-box').innerHTML =
    '<div class="stars">' + starSVG(stars > 0, starColor) + starSVG(stars > 1, starColor) + starSVG(stars > 2, starColor) + '</div>' +
    '<h2>' + (stars === 3 ? '太棒了！' : (stars >= 1 ? '做得不錯！' : '再試一次吧')) + '</h2>' +
    '<p class="r-sub">' + msg + '</p>' +
    '<div class="score">' + state.score + '<small> / ' + total + ' ' + unit + '</small></div>' +
    '<div class="r-grid">' +
      '<div class="r-cell"><span>答對率</span><strong>' + pct + '%</strong></div>' +
      '<div class="r-cell"><span>遊戲模式</span><strong class="r-mode">' + (isA ? '要素偵探' : '故事拼圖') + '</strong></div>' +
    '</div>' +
    '<div class="r-actions">' +
      '<button class="btn primary" id="r-again">再玩一次</button>' +
      '<button class="btn ghost" id="r-menu">選其他遊戲</button>' +
    '</div>';

  sfx('win');
  setView('result');

  $('#r-again').addEventListener('click', function(){
    sfx('tap');
    if (isA) startModeA(); else startModeB();
  });
  $('#r-menu').addEventListener('click', function(){
    sfx('tap');
    renderMenu();
    setView('menu');
  });
}

/* ===== 提示 ===== */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ===== 音效按鈕 ===== */
function updateSoundIcon(){
  const svg = $('#sound-ico');
  if (soundOn){
    svg.innerHTML = '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
    svg.style.opacity = '1';
  } else {
    svg.innerHTML = '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16.5 9.5 4.5 5"/><path d="m21 9.5-4.5 5"/>';
    svg.style.opacity = '.5';
  }
}

/* ===== 初始化 ===== */
function init(){
  renderHomeIcons();
  $('#fig-junior').innerHTML = charSVG(false);
  $('#fig-senior').innerHTML = charSVG(true);
  var hk = $('#hero-kid');
  if (hk) hk.innerHTML = charSVG(false);
  setView('home');

  $$('.grade-card').forEach(function(card){
    function enterGrade(){
      sfx('tap');
      audioCtx();
      state.grade = card.dataset.grade;
      renderMenu();
      setView('menu');
    }
    card.addEventListener('click', enterGrade);
    card.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
        ev.preventDefault();
        enterGrade();
      }
    });
  });

  $('#btn-back').addEventListener('click', goBack);

  $('#btn-sound').addEventListener('click', function(){
    soundOn = !soundOn;
    updateSoundIcon();
    $('#btn-sound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    toast(soundOn ? '音效已開啟' : '音效已關閉');
    if (soundOn){ audioCtx(); sfx('right'); }
  });

  $('#menu-grid').addEventListener('click', function(ev){
    const btn = ev.target.closest('.menu-card');
    if (!btn) return;
    sfx('tap');
    audioCtx();
    const act = btn.dataset.act;
    if (act === 'learn'){ renderLearn(); setView('learn'); }
    else if (act === 'a'){ startModeA(); }
    else if (act === 'b'){ startModeB(); }
  });

  $('#learn-to-game').addEventListener('click', function(){
    sfx('tap');
    startModeA();
  });

  $('#btn-check-b').addEventListener('click', function(){
    if (state.bChecked){
      const total = DATA[state.grade].b.length;
      if (state.idx === total - 1){ showResult(); }
      else {
        state.idx++;
        renderModeB();
        window.scrollTo({ top:0, behavior:'smooth' });
      }
    } else {
      checkB();
    }
  });
}

init();

</script>
