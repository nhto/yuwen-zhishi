<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>借代變裝屋｜小學修辭互動遊戲</title>
<meta name="description" content="用卡通圖文學會借代修辭：初階、高階圖文教學，加上三種互動遊戲，每種六題，即時解說。">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#2B2A45;
  --ink-2:#5C5B7A;
  --paper:#FFF7E9;
  --card:#FFFDF7;
  --blue:#3D7BF7; --blue-soft:#DDE8FF;
  --yellow:#FFC93C; --yellow-soft:#FFF0C2;
  --coral:#FF7A66; --coral-soft:#FFE3DC;
  --mint:#2FC4A0; --mint-soft:#D6F6EC;
  --grape:#8A7CF0; --grape-soft:#E9E5FF;
  --shadow-lg:0 8px 0 rgba(43,42,69,.13), 0 18px 34px rgba(43,42,69,.10);
  --shadow-md:0 5px 0 rgba(43,42,69,.14);
  --r-xl:32px; --r-lg:26px; --r-md:20px; --r-sm:14px;
}
html{font-size:clamp(16.5px,0.55vw + 13.6px,20px);-webkit-text-size-adjust:100%}
html body{
  margin:0;color:var(--ink);line-height:1.62;
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  background:
    radial-gradient(circle at 10% 6%, rgba(255,201,60,.22), transparent 40%),
    radial-gradient(circle at 92% 2%, rgba(61,123,247,.16), transparent 38%),
    radial-gradient(circle at 82% 94%, rgba(47,196,160,.18), transparent 42%),
    radial-gradient(circle at 4% 86%, rgba(255,122,102,.14), transparent 38%),
    var(--paper);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(43,42,69,.10) 1.2px, transparent 1.2px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(#000, rgba(0,0,0,.25));
  mask-image:linear-gradient(#000, rgba(0,0,0,.25));
}
button{font-family:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:1rem;top:1rem;z-index:99;background:#fff;padding:.6rem 1rem;border:3px solid var(--ink);border-radius:12px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.55rem;
  padding:.5rem clamp(.8rem,3vw,1.5rem);
  background:rgba(255,247,233,.92);backdrop-filter:blur(12px);
  border-bottom:3px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:.5rem;min-width:0}
.brand-mark{
  width:2.3rem;height:2.3rem;flex:0 0 auto;border-radius:13px;background:var(--yellow);
  border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;
}
.brand-mark svg{width:1.6rem;height:1.6rem}
.brand-name{font-weight:900;font-size:1.02rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:.45rem}
.icon-btn{
  width:2.65rem;height:2.65rem;flex:0 0 auto;display:grid;place-items:center;color:var(--ink);
  background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);
  cursor:pointer;transition:transform .1s ease,box-shadow .1s ease;
}
.icon-btn svg{width:1.42rem;height:1.42rem}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
body[data-screen="home"] #btnHome{visibility:hidden;pointer-events:none}
.badge{
  display:none;align-items:center;gap:.3rem;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:.18rem .62rem;font-size:.8rem;font-weight:900;white-space:nowrap;
}
.badge.on{display:inline-flex}
.badge .dotp{width:.52rem;height:.52rem;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink)}

/* ---------- layout ---------- */
.screen{
  display:none;position:relative;z-index:1;
  width:min(1080px,100%);margin:0 auto;
  padding:clamp(1rem,2.4vw,1.8rem) clamp(.9rem,3.2vw,1.8rem) 5rem;
}
.screen.is-active{display:block;animation:screenIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:.93;transform:translateY(8px)}to{opacity:1;transform:none}}
.sticker{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
}
.eyebrow{font-size:.82rem;font-weight:900;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.section-title{font-size:clamp(1.55rem,4.6vw,2.3rem);font-weight:900;line-height:1.25;margin:.15rem 0 .35rem}
.section-sub{font-size:1rem;font-weight:700;color:var(--ink-2)}
.kicker{font-size:.78rem;font-weight:900;letter-spacing:.12em;color:var(--ink-2)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:3px solid var(--ink);border-radius:999px;padding:.72rem 1.5rem;
  font-size:1.02rem;font-weight:900;color:var(--ink);background:var(--yellow);
  box-shadow:0 5px 0 var(--ink);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;min-height:3rem;
}
.btn svg{width:1.15rem;height:1.15rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.42;box-shadow:0 5px 0 var(--ink);cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 5px 0 var(--ink)}
.btn-primary{background:var(--blue);color:#fff}
.btn-mint{background:var(--mint)}
.btn-ghost{background:#fff}
.btn.wide{width:100%}
.chip-btn{
  border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:.32rem .85rem;
  font-weight:900;font-size:.86rem;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);
}
.chip-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ---------- home ---------- */
.hero{
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:relative;overflow:hidden;
  padding:clamp(1.1rem,3vw,2.1rem);margin-bottom:1rem;
}
.hero-copy{flex:1 1 0%;min-width:0}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:.22rem .7rem;font-size:.77rem;font-weight:900;letter-spacing:.05em;
}
.pill-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink)}
.hero h1{font-size:clamp(1.95rem,7vw,3.4rem);line-height:1.08;margin:.55rem 0 .45rem;font-weight:900;letter-spacing:.015em}
#homeTitle .hl{background:linear-gradient(transparent 56%,var(--yellow) 56%,var(--yellow) 94%,transparent 94%);padding:0 .06em;border-radius:6px}
.hero-sub{font-size:1.03rem;font-weight:700;color:var(--ink-2);max-width:30ch}
.hero-sub strong{color:var(--ink);font-weight:900}
.hero-art{flex:0 0 auto;width:clamp(5.2rem,20vw,9.2rem);aspect-ratio:1;display:grid;place-items:center;position:relative}
.hero-art .blob{
  position:absolute;inset:6%;background:var(--mint-soft);border:3px solid var(--ink);
  border-radius:44% 56% 52% 48%/52% 44% 56% 48%;transform:rotate(-7deg);
}
.hero-art svg{position:relative;width:72%;height:72%}
.hero-art .art-tag{
  position:absolute;right:-.2rem;bottom:-.2rem;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:.1rem .5rem;font-size:.68rem;font-weight:900;white-space:nowrap;
  box-shadow:0 2px 0 var(--ink);
}
.level-grid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:780px){.level-grid{grid-template-columns:1fr 1fr}}
.level-card{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:.7rem;padding:1.15rem 1.15rem 1rem;
  background:var(--card);border:3px solid var(--ink);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);
  color:var(--ink);transition:transform .14s ease,box-shadow .14s ease;
}
.level-card:hover{transform:translateY(-3px);box-shadow:0 11px 0 rgba(43,42,69,.13),0 22px 36px rgba(43,42,69,.12)}
.level-card:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(43,42,69,.14)}
.level-card::before{content:"";position:absolute;inset:0 0 auto;height:9px;background:var(--accent)}
.level-tab{
  align-self:flex-start;margin-top:.35rem;background:var(--accent-soft);border:2.5px solid var(--ink);
  border-radius:999px;padding:.16rem .7rem;font-size:.8rem;font-weight:900;letter-spacing:.08em;
}
.level-main{display:flex;align-items:center;gap:.9rem}
.mascot{
  width:4.9rem;height:4.9rem;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(43,42,69,.14);
}
.mascot svg{width:3.1rem;height:3.1rem}
.level-main h2{font-size:1.42rem;font-weight:900;line-height:1.25}
.level-main p{font-size:.97rem;font-weight:700;color:var(--ink-2);line-height:1.55;margin-top:.15rem}
.level-points{display:flex;flex-wrap:wrap;gap:.4rem}
.level-points .point{
  font-size:.8rem;font-weight:800;background:rgba(43,42,69,.06);border:2px solid rgba(43,42,69,.14);
  border-radius:999px;padding:.14rem .58rem;
}
.level-cta{
  display:inline-flex;align-items:center;gap:.4rem;margin-top:auto;padding-top:.5rem;
  font-weight:900;font-size:1rem;color:var(--ink);
}
.level-cta svg{width:1.15rem;height:1.15rem}
.level-card:hover .level-cta svg{transform:translateX(3px)}
.level-cta svg{transition:transform .16s ease}

.howto{margin-top:1rem;padding:1rem 1.1rem;display:grid;gap:.65rem;grid-template-columns:1fr}
@media(min-width:700px){.howto{grid-template-columns:repeat(3,1fr);gap:.8rem}}
.step{display:flex;gap:.6rem;align-items:flex-start;min-width:0}
.step-num{
  width:1.85rem;height:1.85rem;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  background:var(--yellow);border:2.5px solid var(--ink);font-weight:900;font-size:.88rem;
}
.step b{display:block;font-size:.95rem;line-height:1.35}
.step span{font-size:.84rem;font-weight:700;color:var(--ink-2);line-height:1.5}

/* ---------- teach ---------- */
.deck-top{display:flex;align-items:flex-end;justify-content:space-between;gap:.8rem;margin-bottom:.9rem;flex-wrap:wrap}
.dots{display:flex;gap:.36rem;align-items:center;flex-wrap:wrap;padding-bottom:.3rem}
.dot{
  width:.68rem;height:.68rem;border-radius:50%;background:#fff;border:2px solid var(--ink);
  transition:transform .18s ease,background .18s ease;
}
.dot.done{background:var(--mint)}
.dot.now{background:var(--yellow);transform:scale(1.32)}
.teach-card{padding:clamp(1.05rem,3vw,1.8rem);position:relative;overflow:hidden;animation:cardIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:.92;transform:translateY(10px)}to{opacity:1;transform:none}}
.teach-head{display:flex;align-items:center;gap:.95rem;margin-bottom:.85rem}
.teach-icon{
  width:clamp(4.4rem,13vw,6.4rem);aspect-ratio:1;flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent-soft);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 rgba(43,42,69,.15);
}
.teach-icon svg{width:72%;height:72%}
.teach-head-text{min-width:0}
.teach-head h3{font-size:clamp(1.42rem,4.4vw,1.95rem);font-weight:900;line-height:1.25;margin-top:.12rem}
.teach-text{font-size:clamp(1.02rem,2.6vw,1.16rem);font-weight:600;line-height:1.8;color:#3B3A58}
.example{
  position:relative;margin:.95rem 0 .85rem;padding:1rem 1.05rem .9rem;
  background:#fff;border:3px dashed rgba(43,42,69,.42);border-radius:22px;
}
.ex-label{
  position:absolute;top:-.78rem;left:.9rem;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:999px;padding:.02rem .55rem;font-size:.74rem;font-weight:900;letter-spacing:.1em;
}
.ex-sentence{font-size:clamp(1.1rem,3.2vw,1.42rem);font-weight:800;line-height:1.75;margin-top:.15rem}
.ex-sentence mark{
  background:linear-gradient(transparent 54%,var(--yellow) 54%,var(--yellow) 95%,transparent 95%);
  color:inherit;font-weight:900;padding:0 .1em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.ex-meaning{margin-top:.5rem;font-size:.96rem;font-weight:700;color:var(--ink-2);line-height:1.65}
.tip{
  display:flex;gap:.6rem;align-items:flex-start;background:var(--mint-soft);
  border:2.5px solid var(--ink);border-radius:18px;padding:.7rem .85rem;
  font-size:.96rem;font-weight:800;line-height:1.6;
}
.tip svg{width:1.6rem;height:1.6rem;flex:0 0 auto;margin-top:.05rem}
.deck-nav{display:flex;gap:.6rem;justify-content:space-between;margin-top:1rem}
.deck-nav .btn{flex:1}
@media(min-width:620px){.deck-nav{justify-content:flex-end}.deck-nav .btn{flex:0 0 auto;min-width:9rem}}

/* ---------- hub ---------- */
.mode-list{display:grid;gap:.8rem;margin:.9rem 0 1.1rem}
.mode-card{
  display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;cursor:pointer;
  padding:.9rem 1rem;background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);color:var(--ink);transition:transform .14s ease,box-shadow .14s ease;
}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(43,42,69,.16)}
.mode-card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(43,42,69,.16)}
.mode-icon{
  width:3.7rem;height:3.7rem;flex:0 0 auto;display:grid;place-items:center;border-radius:18px;
  background:var(--accent-soft);border:3px solid var(--ink);
}
.mode-icon svg{width:2.4rem;height:2.4rem}
.mode-body{min-width:0;display:flex;flex-direction:column;gap:.05rem}
.mode-name{font-size:1.16rem;font-weight:900;line-height:1.35}
.mode-desc{font-size:.9rem;font-weight:700;color:var(--ink-2);line-height:1.5}
.mode-meta{
  display:inline-flex;align-self:flex-start;margin-top:.25rem;font-size:.76rem;font-weight:900;
  background:var(--accent-soft);border:2px solid var(--ink);border-radius:999px;padding:.02rem .55rem;
}
.mode-arrow{margin-left:auto;flex:0 0 auto;width:2rem;height:2rem;display:grid;place-items:center}
.mode-arrow svg{width:1.5rem;height:1.5rem}

/* ---------- play ---------- */
.play-top{display:flex;align-items:center;gap:.55rem;margin-bottom:.7rem}
.play-mode{font-size:.86rem;font-weight:900;color:var(--ink-2);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-chip{
  margin-left:auto;display:inline-flex;align-items:center;gap:.28rem;background:#fff;
  border:2.5px solid var(--ink);border-radius:999px;padding:.16rem .55rem;font-weight:900;font-size:.86rem;
}
.score-chip svg{width:1.05rem;height:1.05rem}
.play-dots{margin-bottom:.75rem}
.q-card{padding:clamp(1.05rem,3vw,1.7rem);animation:cardIn .3s cubic-bezier(.2,.8,.2,1)}
.q-sentence{font-size:clamp(1.28rem,3.8vw,1.72rem);font-weight:900;line-height:1.68;margin:.35rem 0 .75rem;letter-spacing:.01em}
.q-ask{font-size:1rem;font-weight:800;color:var(--ink-2);margin-bottom:.75rem}
.q-context{
  font-size:.92rem;font-weight:700;color:var(--ink-2);background:rgba(43,42,69,.05);
  border-radius:14px;padding:.5rem .7rem;margin-bottom:.85rem;line-height:1.6;
}
.term-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
  background:var(--grape-soft);border:3px solid var(--ink);border-radius:24px;
  padding:.8rem 1rem;margin:.5rem 0 .9rem;
}
.term-card .term{font-size:clamp(2rem,7vw,2.9rem);font-weight:900;letter-spacing:.08em;line-height:1.3}
.term-card .term-label{font-size:.74rem;font-weight:900;letter-spacing:.2em;color:var(--ink-2)}
.options{display:grid;gap:.65rem;grid-template-columns:1fr}
@media(min-width:620px){.options.two{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:3px solid var(--ink);border-radius:18px;padding:.78rem .9rem;
  font-size:clamp(1rem,2.6vw,1.12rem);font-weight:800;color:var(--ink);line-height:1.45;
  box-shadow:0 4px 0 rgba(43,42,69,.17);min-height:3.5rem;
  transition:transform .12s ease,box-shadow .12s ease,background .18s ease;
}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,42,69,.2)}
.opt .key{
  width:1.9rem;height:1.9rem;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  background:var(--blue-soft);border:2px solid var(--ink);font-size:.86rem;font-weight:900;
}
.opt .opt-text{min-width:0}
.opt.correct{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);box-shadow:0 4px 0 var(--coral);animation:shake .34s ease}
.opt.correct .key{background:var(--mint)}
.opt.wrong .key{background:var(--coral)}
.opt:disabled{cursor:default;opacity:1}
.opt:disabled:hover{transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.4rem}
.judge-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  padding:.85rem .5rem;background:#fff;border:3px solid var(--ink);border-radius:22px;cursor:pointer;
  color:var(--ink);box-shadow:0 5px 0 rgba(43,42,69,.17);min-height:8.2rem;
  transition:transform .12s ease,box-shadow .12s ease,background .18s ease;
}
.judge-btn svg{width:3.1rem;height:3.1rem;margin-bottom:.2rem}
.judge-btn .j-name{font-size:1.16rem;font-weight:900}
.judge-btn .j-sub{font-size:.76rem;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.4}
.judge-btn:hover{transform:translateY(-2px)}
.judge-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,42,69,.2)}
.judge-btn.correct{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 5px 0 var(--mint)}
.judge-btn.wrong{background:var(--coral-soft);border-color:var(--coral);box-shadow:0 5px 0 var(--coral);animation:shake .34s ease}
.judge-btn:disabled{cursor:default;opacity:1}

/* ---------- answer sheet ---------- */
.sheet-mask{
  position:fixed;inset:0;background:rgba(43,42,69,.42);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .26s ease;backdrop-filter:blur(2px);
}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:61;width:min(640px,100%);
  transform:translateX(-50%) translateY(110%);visibility:hidden;
  background:var(--card);border:3px solid var(--ink);border-bottom:none;
  border-radius:28px 28px 0 0;padding:1.1rem 1.15rem calc(1.15rem + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s;
  box-shadow:0 -10px 40px rgba(43,42,69,.22);
}
.sheet.open{transform:translateX(-50%) translateY(0);visibility:visible}
.sheet:focus{outline:none}
@media(min-width:760px){
  .sheet{
    top:50%;bottom:auto;border:3px solid var(--ink);border-radius:28px;
    transform:translate(-50%,-44%) scale(.97);opacity:0;visibility:hidden;max-height:84vh;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .24s ease,visibility .28s;
  }
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
}
.sheet-head{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem}
.res-icon{
  width:3.2rem;height:3.2rem;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  border:3px solid var(--ink);box-shadow:0 3px 0 rgba(43,42,69,.16);
}
.res-icon.ok{background:var(--mint)}
.res-icon.no{background:var(--coral)}
.res-icon svg{width:1.7rem;height:1.7rem}
.sheet h3{font-size:1.3rem;font-weight:900;line-height:1.3}
.res-answer{font-size:.95rem;font-weight:800;color:var(--ink-2);margin-top:.1rem}

var audioCtx = null;
function getCtx(){
  try {
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();

function tone(ctx, freq, start, dur, type, vol){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || "triangle";
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(vol || 0.12, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.03);
}
function sfx(name){
  if(!state.sound) return;
  var ctx = getCtx();
  if(!ctx) return;
  var t = ctx.currentTime + 0.02;
  if(name === "click"){
    tone(ctx, 640, t, 0.07, "square", 0.07);
  } else if(name === "correct"){
    tone(ctx, 523.25, t, 0.12, "triangle", 0.12);
    tone(ctx, 659.25, t + 0.09, 0.12, "triangle", 0.12);
    tone(ctx, 783.99, t + 0.18, 0.22, "triangle", 0.13);
  } else if(name === "wrong"){
    tone(ctx, 311.13, t, 0.15, "sawtooth", 0.07);
    tone(ctx, 207.65, t + 0.14, 0.24, "sawtooth", 0.07);
  } else if(name === "finish"){
    tone(ctx, 523.25, t, 0.12, "triangle", 0.12);
    tone(ctx, 659.25, t + 0.12, 0.12, "triangle", 0.12);
    tone(ctx, 783.99, t + 0.24, 0.12, "triangle", 0.12);
    tone(ctx, 1046.5, t + 0.36, 0.36, "triangle", 0.13);
  }
}
function renderSoundBtn(){
  $("#soundIcon").innerHTML = state.sound ? ICONS.speakerOn : ICONS.speakerOff;
  $("#btnSound").setAttribute("aria-pressed", state.sound ? "true" : "false");
  $("#btnSound").setAttribute("aria-label", state.sound ? "音效開關，目前開啟" : "音效開關，目前關閉");
}

/* ================= 導航 ================= */
function showScreen(name){
  $$(".screen").forEach(function(s){
    s.classList.toggle("is-active", s.id === "screen-" + name);
  });
  document.body.dataset.screen = name;
  closeSheet(true);
  window.scrollTo(0, 0);
  state.screen = name;
}
function setBadge(levelKey){
  var lv = LEVELS[levelKey];
  var badge = $("#levelBadge");
  if(!lv){ badge.classList.remove("on"); return; }
  $("#levelBadgeText").textContent = lv.name;
  badge.classList.add("on");
  badge.style.background = lv.accentSoft;
}
function hideBadge(){ $("#levelBadge").classList.remove("on"); }

/* ================= 首頁 ================= */
function renderHome(){
  var grid = $("#levelGrid");
  grid.innerHTML = Object.keys(LEVELS).map(function(k){
    var lv = LEVELS[k];
    return '' +
      '<button type="button" class="level-card" data-level="' + k + '" style="--accent:' + lv.accent + ';--accent-soft:' + lv.accentSoft + '">' +
        '<span class="level-tab">' + lv.name + '版</span>' +
        '<span class="level-main">' +
          '<span class="mascot" aria-hidden="true">' + ICONS[lv.icon] + '</span>' +
          '<span style="min-width:0">' +
            '<h2>' + lv.title + '</h2>' +
            '<p>' + lv.desc + '</p>' +
          '</span>' +
        '</span>' +
        '<span class="level-points">' +
          '<span class="point">' + lv.teach.length + ' 張圖文教學卡</span>' +
          '<span class="point">3 種遊戲 · 每種 6 題</span>' +
        '</span>' +
        '<span class="level-cta">開始學習' + ICONS.arrow + '</span>' +
      '</button>';
  }).join("");
  $$(".level-card", grid).forEach(function(btn){
    btn.addEventListener("click", function(){
      sfx("click");
      openTeach(btn.getAttribute("data-level"));
    });
  });
}

/* ================= 教學 ================= */
function openTeach(levelKey){
  state.level = levelKey;
  state.teachIndex = 0;
  setBadge(levelKey);
  renderTeach();
  showScreen("teach");
}
function fmtExample(str){
  return String(str).replace(/【(.+?)】/g, "<mark>$1</mark>");
}
function renderTeach(){
  var lv = LEVELS[state.level];
  var card = lv.teach[state.teachIndex];
  $("#teachLevelName").textContent = lv.name + "版 · " + lv.tag;
  $("#teachDots").innerHTML = lv.teach.map(function(_, i){
    return '<span class="dot' + (i === state.teachIndex ? " now" : (i < state.teachIndex ? " done" : "")) + '"></span>';
  }).join("");
  $("#teachBody").innerHTML = '' +
    '<article class="teach-card sticker" style="--accent:' + lv.accent + ';--accent-soft:' + lv.accentSoft + '">' +
      '<div class="teach-head">' +
        '<div class="teach-icon" aria-hidden="true">' + ICONS[card.icon] + '</div>' +
        '<div class="teach-head-text">' +
          '<p class="kicker">' + card.kicker + '</p>' +
          '<h3>' + card.title + '</h3>' +
        '</div>' +
      '</div>' +
      '<p class="teach-text">' + card.text + '</p>' +
      '<div class="example">' +
        '<span class="ex-label">例句</span>' +
        '<p class="ex-sentence">' + fmtExample(card.example) + '</p>' +
        '<p class="ex-meaning">' + card.meaning + '</p>' +
      '</div>' +
      '<div class="tip">' + ICONS.bulb + '<span>' + card.tip + '</span></div>' +
    '</article>';
  var last = state.teachIndex === lv.teach.length - 1;
  $("#teachNext").textContent = last ? "去挑戰遊戲" : "下一張";
  $("#teachPrev").disabled = state.teachIndex === 0;
}

/* ================= 模式選擇 ================= */
function getGame(key){
  var list = LEVELS[state.level].games;
  for(var i = 0; i < list.length; i++){
    if(list[i].key === (key || state.gameKey)) return list[i];
  }
  return list[0];
}
function bestOf(levelKey, gameKey){
  var v = state.best[levelKey + ":" + gameKey];
  return (typeof v === "number") ? v : null;
}
function renderHub(){
  var lv = LEVELS[state.level];
  setBadge(state.level);
  $("#hubLevelName").textContent = lv.name + "版 · " + lv.tag;
  $("#hubModes").innerHTML = GAME_META.map(function(meta){
    var best = bestOf(state.level, meta.key);
    return '' +
      '<button type="button" class="mode-card" data-mode="' + meta.key + '" style="--accent:' + meta.accent + ';--accent-soft:' + meta.soft + '">' +
        '<span class="mode-icon" aria-hidden="true">' + ICONS[meta.icon] + '</span>' +
        '<span class="mode-body">' +
          '<span class="mode-name">' + meta.name + '</span>' +
          '<span class="mode-desc">' + meta.desc + '</span>' +
          '<span class="mode-meta">6 題 · ' + (best === null ? "尚未挑戰" : "最佳 " + best + "/6") + '</span>' +
        '</span>' +
        '<span class="mode-arrow" aria-hidden="true">' + ICONS.arrow + '</span>' +
      '</button>';
  }).join("");
  $$(".mode-card", $("#hubModes")).forEach(function(btn){
    btn.addEventListener("click", function(){
      sfx("click");
      startGame(btn.getAttribute("data-mode"));
    });
  });
}
function openHub(){
  renderHub();
  showScreen("hub");
}

/* ================= 遊戲 ================= */
function startGame(modeKey){
  state.gameKey = modeKey;
  state.qIndex = 0;
  state.correct = 0;
  state.locked = false;
  state.advancing = false;
  var meta = GAME_META.filter(function(m){ return m.key === modeKey; })[0];
  $("#playModeName").textContent = LEVELS[state.level].name + "版 · " + meta.name;
  renderPlay();
  showScreen("play");
}
function shuffled(list){
  var a = list.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function renderPlay(){
  var game = getGame();
  var q = game.questions[state.qIndex];
  var total = game.questions.length;
  $("#playScore").textContent = state.correct;
  $("#playDots").innerHTML = game.questions.map(function(_, i){
    return '<span class="dot' + (i < state.qIndex ? " done" : (i === state.qIndex ? " now" : "")) + '"></span>';
  }).join("");

  var head = '<p class="kicker">第 ' + (state.qIndex + 1) + ' 題 / 共 ' + total + ' 題</p>';
  var body = "";

  if(state.gameKey === "spot"){
    body = '' +
      '<article class="q-card sticker">' +
        head +
        '<p class="q-sentence">' + q.sentence + '</p>' +
        '<p class="q-ask">句中哪一個詞是「借體」？</p>' +
        '<div class="options" id="options">' +
          shuffled(q.options.map(function(_, i){ return i; })).map(function(i, pos){
            var o = q.options[i];
            return '<button type="button" class="opt" data-idx="' + i + '"><span class="key">' + "ABCD".charAt(pos) + '</span><span class="opt-text">' + o + '</span></button>';
          }).join("") +
        '</div>' +
      '</article>';
  } else if(state.gameKey === "match"){
    body = '' +
      '<article class="q-card sticker">' +
        head +
        '<div class="term-card"><span class="term">' + q.term + '</span><span class="term-label">借 體</span></div>' +
        '<p class="q-ask">「' + q.term + '」代替的是什麼？</p>' +
        '<p class="q-context">' + q.sentence + '</p>' +
        '<div class="options two" id="options">' +
          shuffled(q.options.map(function(_, i){ return i; })).map(function(i, pos){
            var o = q.options[i];
            return '<button type="button" class="opt" data-idx="' + i + '"><span class="key">' + "ABCD".charAt(pos) + '</span><span class="opt-text">' + o + '</span></button>';
          }).join("") +
        '</div>' +
      '</article>';
  } else {
    body = '' +
      '<article class="q-card sticker">' +
        head +
        '<p class="q-sentence">' + q.sentence + '</p>' +
        '<p class="q-ask">這句話用了哪一種修辭？</p>' +
        '<div class="judge-grid" id="options"' + (Math.random() < 0.5 ? ' style="flex-direction:row-reverse"' : '') + '>' +
          '<button type="button" class="judge-btn" data-val="借代">' + ICONS.mask +
            '<span class="j-name">借代</span><span class="j-sub">借個相關的來說</span></button>' +
          '<button type="button" class="judge-btn" data-val="比喻">' + ICONS.compare +
            '<span class="j-name">比喻</span><span class="j-sub">找個相似的來說</span></button>' +
        '</div>' +
      '</article>';
  }

  $("#playBody").innerHTML = body;
  $$("#options .opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      handleChoice(Number(btn.getAttribute("data-idx")), btn);
    });
  });
  $$("#options .judge-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      handleChoice(btn.getAttribute("data-val"), btn);
    });
  });
}
function handleChoice(pick, btn){
  if(state.locked) return;
  state.locked = true;
  var q = getGame().questions[state.qIndex];
  var ok, correctLabel, pickedLabel;

  if(state.gameKey === "judge"){
    ok = pick === q.answer;
    correctLabel = q.answer;
    pickedLabel = pick;
    $$("#options .judge-btn").forEach(function(b){
      b.disabled = true;
      if(b.getAttribute("data-val") === q.answer) b.classList.add("correct");
    });
    if(!ok) btn.classList.add("wrong");
  } else {
    ok = pick === q.answer;
    correctLabel = q.options[q.answer];
    pickedLabel = q.options[pick];
    $$("#options .opt").forEach(function(b){
      b.disabled = true;
      if(Number(b.getAttribute("data-idx")) === q.answer) b.classList.add("correct");
    });
    if(!ok) btn.classList.add("wrong");
  }

  if(ok){
    state.correct += 1;
    $("#playScore").textContent = state.correct;
  }
  sfx(ok ? "correct" : "wrong");
  window.setTimeout(function(){
    openSheet(ok, correctLabel, pickedLabel, q);
  }, ok ? 200 : 430);
}

/* ================= 答案解說 ================= */
function openSheet(ok, correctLabel, pickedLabel, q){
  var game = getGame();
  var isLast = state.qIndex >= game.questions.length - 1;
  $("#sheetBody").innerHTML = '' +
    '<div class="sheet-head">' +
      '<span class="res-icon ' + (ok ? "ok" : "no") + '" aria-hidden="true">' + (ok ? ICONS.check : ICONS.cross) + '</span>' +
      '<div style="min-width:0">' +
        '<h3 id="sheetTitle">' + (ok ? "答對了！" : "再想一想") + '</h3>' +
        '<p class="res-answer">正解：<strong>' + correctLabel + '</strong></p>' +
      '</div>' +
    '</div>' +
    (q.tag ? '<span class="res-tag">' + q.tag + '</span>' : '') +
    (ok ? '' : '<p class="res-pick">你選了「' + pickedLabel + '」。</p>') +
    '<p class="res-text" id="sheetText">' + q.explain + '</p>' +
    '<button type="button" class="btn btn-primary wide" id="sheetNext">' + (isLast ? "看成績" : "下一題") + '</button>';

  state.advancing = false;
  $("#sheetMask").classList.add("open");
  $("#sheet").classList.add("open");
  document.body.style.overflow = "hidden";
  var main = $("#main");
  if(main) main.inert = true;
  $("#sheet").scrollTop = 0;
  var next = $("#sheetNext");
  next.addEventListener("click", function(){ closeSheetAndNext(); });
  window.setTimeout(function(){
    var tries = 0;
    (function tryFocus(){
      if(!$("#sheet").classList.contains("open")) return;
      try { $("#sheet").focus({ preventScroll: true }); } catch(e){}
      if(document.activeElement !== $("#sheet") && tries < 12){
        tries += 1;
        window.setTimeout(tryFocus, 50);
      }
    })();
  }, 300);
}
function closeSheet(immediate){
  $("#sheetMask").classList.remove("open");
  $("#sheet").classList.remove("open");
  document.body.style.overflow = "";
  var main = $("#main");
  if(main) main.inert = false;
  if(immediate) return;
}
function closeSheetAndNext(){
  if(state.advancing) return;
  state.advancing = true;
  var next = $("#sheetNext");
  if(next) next.disabled = true;
  closeSheet(true);
  window.setTimeout(function(){
    var game = getGame();
    if(state.qIndex >= game.questions.length - 1){
      finishGame();
    } else {
      state.qIndex += 1;
      state.locked = false;
      renderPlay();
    }
  }, 220);
}

/* ================= 結算 ================= */
function starSVG(on){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z" fill="' + (on ? "#FFC93C" : "#EDE5D6") + '" stroke="#2B2A45" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
function finishGame(){
  var lv = LEVELS[state.level];
  var game = getGame();
  var total = game.questions.length;
  var c = state.correct;
  var stars = c >= total ? 3 : (c >= 4 ? 2 : 1);
  var pct = Math.round(c / total * 100);
  var key = state.level + ":" + state.gameKey;
  if(bestOf(state.level, state.gameKey) === null || c > state.best[key]){
    state.best[key] = c;
    saveBest();
  }

  var title, msg;
  if(c === total){
    title = "滿分！借代小達人";
    msg = "六題全對，你不只認得出借體，還能說出它代替的本體。";
  } else if(c >= 4){
    title = "很接近滿分了";
    msg = "大部分借體都逃不過你的眼睛，再挑戰一次就完美。";
  } else if(c >= 2){
    title = "已經抓到要領";
    msg = "記得先問一句：這個詞和本體有甚麼關係？回去看教學會更穩。";
  } else {
    title = "別灰心，再來一次";
    msg = "先看圖文教學，認清特徵、部分和比喻的分別，再回來挑戰。";
  }

  $("#resultBody").innerHTML = '' +
    '<article class="result-card sticker">' +
      '<div class="result-art" aria-hidden="true">' + ICONS.trophy + '</div>' +
      '<p class="eyebrow">' + lv.name + "版 · " + GAME_META.filter(function(m){ return m.key === state.gameKey; })[0].name + '</p>' +
      '<h2>' + title + '</h2>' +
      '<div class="stars" aria-label="獲得 ' + stars + ' 顆星">' + starSVG(stars >= 1) + starSVG(stars >= 2) + starSVG(stars >= 3) + '</div>' +
      '<p class="score-big">' + c + '<span>/ ' + total + '</span></p>' +
      '<p class="result-msg">' + msg + '<br>正確率 ' + pct + '%。</p>' +
      '<div class="result-actions">' +
        '<button type="button" class="btn btn-primary wide" data-act="again">再玩一次</button>' +
        '<div class="row2">' +
          '<button type="button" class="btn btn-ghost" data-act="hub">換個模式</button>' +
          '<button type="button" class="btn btn-ghost" data-act="teach">回看教學</button>' +
        '</div>' +
      '</div>' +
    '</article>';

  $$("#resultBody [data-act]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var act = btn.getAttribute("data-act");
      sfx("click");
      if(act === "again") startGame(state.gameKey);
      else if(act === "hub") openHub();
      else openTeach(state.level);
    });
  });

  showScreen("result");
  sfx("finish");
}

/* ================= 進度儲存 ================= */
function saveBest(){
  try { window.localStorage.setItem("jiedai-best-v1", JSON.stringify(state.best)); } catch(e){}
}
function loadBest(){
  try {
    var raw = window.localStorage.getItem("jiedai-best-v1");
    if(raw){
      var obj = JSON.parse(raw);
      if(obj && typeof obj === "object") state.best = obj;
    }
  } catch(e){}
}

/* ================= 事件綁定 ================= */
$("#btnHome").addEventListener("click", function(){
  sfx("click");
  hideBadge();
  renderHome();
  showScreen("home");
});
$("#btnSound").addEventListener("click", function(){
  state.sound = !state.sound;
  renderSoundBtn();
  if(state.sound) sfx("click");
});
$("#teachPrev").addEventListener("click", function(){
  if(state.teachIndex > 0){
    state.teachIndex -= 1;
    renderTeach();
    sfx("click");
  }
});
$("#teachNext").addEventListener("click", function(){
  var lv = LEVELS[state.level];
  sfx("click");
  if(state.teachIndex < lv.teach.length - 1){
    state.teachIndex += 1;
    renderTeach();
  } else {
    openHub();
  }
});
$("#hubBackTeach").addEventListener("click", function(){
  sfx("click");
  state.teachIndex = 0;
  renderTeach();
  showScreen("teach");
});
$("#playQuit").addEventListener("click", function(){
  sfx("click");
  openHub();
});

/* ================= 啟動 ================= */
loadBest();
renderSoundBtn();
renderHome();
document.body.dataset.screen = "home";
})();
</script>
</body>
</html>
