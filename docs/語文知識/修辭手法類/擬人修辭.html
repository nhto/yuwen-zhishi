<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>擬人小劇場｜初小・高小分級擬人互動遊戲</title>
<meta name="description" content="把萬物當作人來寫！初小版以短句認識擬人，高小版分辨擬人、比喻與借喻；各有五站圖文教學與三種互動遊戲。">
<style>
:root{
  --ink:#2B2440;
  --ink-soft:#4C4468;
  --paper:#FFF8EA;
  --card:#FFFDF7;
  --coral:#EE6A55;
  --coral-deep:#C94B38;
  --coral-soft:#FFE7E1;
  --gold:#FFC44D;
  --gold-deep:#E0A21F;
  --gold-soft:#FFF1CB;
  --mint:#3FBE9A;
  --mint-deep:#2A9A7B;
  --mint-soft:#DDF7EE;
  --sky:#57B6E6;
  --sky-soft:#E0F3FF;
  --violet:#9A85F0;
  --violet-soft:#EEE8FF;
  --pink:#FFAFC5;
  --pink-soft:#FFEBF1;
  --muted:#6F6885;
  --stage:#3B2B58;
  --stage-deep:#241A3B;
  --shadow:0 4px 0 var(--ink);
  --shadow-sm:0 3px 0 var(--ink);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Yuanti TC','YuanTi TC','PingFang TC','Hiragino Sans TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 0% 0%, rgba(255,196,77,.36), transparent 38%),
    radial-gradient(circle at 100% 6%, rgba(87,182,230,.26), transparent 36%),
    radial-gradient(circle at 46% 102%, rgba(63,190,154,.18), transparent 46%),
    var(--paper);
  min-height:100dvh;
  overflow-x:hidden;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(43,36,64,.11) 1.2px, transparent 1.2px);
  background-size:19px 19px;opacity:.4;
}
#app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom));min-height:100dvh}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
b,strong{font-weight:900}
svg{display:block}
.screen{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.94;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fall{0%{transform:translateY(-12px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(300px) rotate(220deg);opacity:0}}
@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:.9}}

/* ---------- 共用元件 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tb-title{flex:1;min-width:0;text-align:center}
.tb-title b{display:block;font-size:15.5px;font-weight:900;letter-spacing:.4px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{display:block;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.8px;margin-top:1px}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.icon-btn svg{width:21px;height:21px}
.icon-btn.ghost{background:transparent;box-shadow:none;border-color:transparent;width:38px;flex-basis:38px}
.stars{display:inline-flex;align-items:center;gap:2px}
.stars svg{width:14px;height:14px;flex:0 0 14px}
.star-total{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:900;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.star-total svg{width:15px;height:15px;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:15px;background:var(--card);font-weight:900;font-size:15px;padding:12px 16px;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .1s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn.mint{background:var(--mint);color:#0E3B2F}
.btn.ghost{background:transparent;box-shadow:none;border-color:rgba(43,36,64,.22);color:var(--ink-soft)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px;flex:0 0 18px}
.btn:disabled{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;border:1.8px solid rgba(43,36,64,.16);background:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.section-title{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-size:15px;font-weight:900;letter-spacing:.4px}
.section-title::before{content:'';width:18px;height:4px;border-radius:2px;background:var(--coral)}
.section-title span{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:800}
.tip-note{display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding:12px 13px;border:2px dashed rgba(43,36,64,.3);border-radius:14px;background:rgba(255,241,203,.5);font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.tip-note svg{width:19px;height:19px;flex:0 0 19px;margin-top:1px;color:var(--gold-deep)}
.tip-note b{color:var(--ink)}

/* ---------- 首頁舞台 ---------- */
.stage{
  position:relative;border:3px solid var(--ink);border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg,#4A376C 0%,var(--stage) 45%,var(--stage-deep) 100%);
  box-shadow:0 6px 0 var(--ink);
  padding:30px 16px 0;
  isolation:isolate;
}
.valance{position:absolute;top:0;left:0;right:0;height:34px;z-index:4;background:linear-gradient(180deg,#F58A72,#E45E47);border-bottom:3px solid var(--ink)}
.valance::after{content:'';position:absolute;left:0;right:0;bottom:-14px;height:15px;background-image:radial-gradient(circle at 18px 0,#E45E47 15px,transparent 16px);background-size:36px 15px;background-repeat:repeat-x;filter:drop-shadow(0 3px 0 var(--ink))}
.curtain{position:absolute;top:0;bottom:0;width:24px;z-index:3;background:repeating-linear-gradient(90deg,#C9452F 0 7px,#EE6A55 7px 13px,#D8503B 13px 19px);border-right:3px solid var(--ink)}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1)}
.stage-glow{position:absolute;right:-24px;top:6px;width:220px;height:230px;z-index:0;background:radial-gradient(ellipse at 55% 42%,rgba(255,213,120,.5),rgba(255,213,120,0) 66%);animation:glowpulse 4.5s ease-in-out infinite}
.stage-body{position:relative;z-index:2;display:flex;align-items:center;gap:6px;min-height:190px;padding-bottom:14px}
.hero-copy{flex:1;min-width:0;padding-left:4px}
.brand-chip{display:inline-flex;align-items:center;gap:5px;border:1.6px solid rgba(255,196,77,.65);background:rgba(255,196,77,.13);color:#FFE1A0;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:900;letter-spacing:1.6px;white-space:nowrap}
.hero-copy h1{color:#FFF9EC;font-size:clamp(26px,9vw,36px);line-height:1.12;letter-spacing:1px;margin:9px 0 0;text-shadow:0 3px 0 rgba(15,8,30,.45)}
.hero-copy h1 em{font-style:normal;color:var(--gold);display:inline-block;position:relative}
.hero-copy .tagline{color:#E9DFF8;font-size:12.5px;font-weight:700;letter-spacing:2px;margin-top:7px}
.hero-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.hero-badges span{font-size:10px;font-weight:900;color:#FFF4D6;background:rgba(255,255,255,.12);border:1.4px solid rgba(255,255,255,.26);border-radius:999px;padding:2px 7px;letter-spacing:.5px}
.hero-art{flex:0 0 112px;width:112px;position:relative;animation:floaty 5s ease-in-out infinite}
.hero-art svg{width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(16,9,30,.3))}
.stage-star{position:absolute;z-index:1;color:var(--gold);animation:twinkle 3s ease-in-out infinite}
.stage-star svg{width:100%;height:100%}
.stage-floor{position:relative;z-index:2;margin:0 -16px;height:24px;border-top:3px solid var(--ink);background:repeating-linear-gradient(90deg,#E8B44C 0 26px,#F4C96D 26px 52px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.stage-floor::after{content:'';position:absolute;left:50%;top:-9px;transform:translateX(-50%);width:150px;height:14px;border:2.5px solid var(--ink);border-radius:50%;background:rgba(255,224,150,.35)}

/* ---------- 版本票券 ---------- */
.home-intro{display:flex;align-items:flex-end;gap:10px;margin:22px 2px 10px}
.home-intro h2{font-size:19px;font-weight:900;letter-spacing:.5px;line-height:1.2}
.home-intro p{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.tickets{display:flex;flex-direction:column;gap:12px}
.ticket{position:relative;display:flex;align-items:stretch;text-align:left;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;transition:transform .1s,box-shadow .1s}
.ticket:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.ticket-badge{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:2.5px dashed rgba(43,36,64,.38);padding:14px 6px;position:relative}
.ticket.jr .ticket-badge{background:var(--mint-soft)}
.ticket.sr .ticket-badge{background:var(--violet-soft)}
.ticket-badge b{font-size:21px;font-weight:900;line-height:1.1}
.ticket-badge span{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.6px}
.ticket-badge i{font-size:9.5px;font-style:normal;font-weight:800;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.ticket-badge::before,.ticket-badge::after{content:'';position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);z-index:2}
.ticket-badge::before{top:-9px}
.ticket-badge::after{bottom:-9px}
.ticket-body{flex:1;min-width:0;padding:13px 6px 13px 14px}
.ticket-top{display:flex;align-items:center;gap:8px}
.ticket-top b{font-size:17px;font-weight:900;letter-spacing:.5px}
.ticket-top .stars{margin-left:auto}
.ticket-body p{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.45}
.ticket-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ticket-tags i{font-style:normal;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:rgba(43,36,64,.07);color:var(--ink-soft);letter-spacing:.3px}
.ticket-go{flex:0 0 30px;display:grid;place-items:center;padding-right:8px;color:var(--ink)}
.ticket-go svg{width:20px;height:20px}
.ticket.jr .ticket-go{color:var(--mint-deep)}
.ticket.sr .ticket-go{color:#6C55C9}
.home-foot{text-align:center;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;margin-top:18px}

/* ---------- 版本首頁 ---------- */
.ver-head{position:relative;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:15px 15px 14px;overflow:hidden}
.ver-head.jr{background:linear-gradient(150deg,#F2FCF7,#FFFDF7 62%)}
.ver-head.sr{background:linear-gradient(150deg,#F7F3FF,#FFFDF7 62%)}
.ver-head::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,196,77,.2)}
.ver-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.ver-pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#FFF9EC;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:900;letter-spacing:.8px}
.ver-head.jr .ver-pill{background:var(--mint-deep)}
.ver-head.sr .ver-pill{background:#6C55C9}
.ver-head h2{font-size:21px;font-weight:900;letter-spacing:.5px;margin-top:11px;position:relative;z-index:1}
.ver-head p{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px;position:relative;z-index:1}
.entry-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;border:2.5px solid var(--ink);border-radius:20px;background:linear-gradient(120deg,#FFF3CF,#FFFDF7);box-shadow:var(--shadow);padding:14px;transition:transform .1s,box-shadow .1s}
.entry-card:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.entry-icon{flex:0 0 52px;width:52px;height:52px;border:2.5px solid var(--ink);border-radius:15px;background:var(--gold);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.entry-icon svg{width:26px;height:26px}
.entry-txt{flex:1;min-width:0}
.entry-txt b{display:block;font-size:16.5px;font-weight:900;letter-spacing:.4px}
.entry-txt span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px}
.entry-meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.entry-meta .seen{font-size:9.5px;font-weight:900;color:var(--mint-deep);background:var(--mint-soft);border-radius:999px;padding:2px 6px;border:1.4px solid rgba(42,154,123,.3)}
.entry-go{color:var(--ink)}
.entry-go svg{width:19px;height:19px}
.mode-list{display:flex;flex-direction:column;gap:10px}
.mode-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:17px;background:var(--card);box-shadow:var(--shadow-sm);padding:11px 12px;transition:transform .1s,box-shadow .1s}
.mode-card:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.mode-ic{flex:0 0 40px;width:40px;height:40px;border:2.3px solid var(--ink);border-radius:12px;display:grid;place-items:center;background:var(--sky-soft)}
.mode-ic svg{width:21px;height:21px}
.mode-card:nth-child(2) .mode-ic{background:var(--pink-soft)}
.mode-card:nth-child(3) .mode-ic{background:var(--violet-soft)}
.mode-txt{flex:1;min-width:0}
.mode-txt b{display:block;font-size:15px;font-weight:900;letter-spacing:.3px;line-height:1.3}
.mode-txt em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:700;margin-top:1px;line-height:1.4}
.mode-meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mode-meta i{font-style:normal;font-size:9.5px;font-weight:800;color:var(--muted)}

/* ---------- 教學 ---------- */
.learn-head{margin:2px 2px 10px}
.lesson-kicker{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:1.6px;color:var(--coral-deep);background:var(--coral-soft);border-radius:999px;padding:3px 9px}
.lesson-kicker::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--coral)}
.learn-head h2{font-size:22px;line-height:1.25;font-weight:900;letter-spacing:.5px;margin-top:8px}
.learn-head .sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
.dots{display:flex;gap:6px;margin:12px 2px 13px}
.dots i{flex:1;height:6px;border-radius:3px;background:rgba(43,36,64,.12)}
.dots i.done{background:var(--coral)}
.dots i.on{background:var(--ink)}
.art-frame{position:relative;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);height:196px;display:flex;align-items:center;justify-content:center}
.art-frame svg.art{width:100%;height:100%}
.art-frame .art-cap{position:absolute;left:9px;bottom:9px;background:rgba(255,253,247,.94);border:1.8px solid var(--ink);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:900;letter-spacing:.4px;box-shadow:0 2px 0 rgba(43,36,64,.85)}
.art-frame.small{height:150px}
.art-frame.tiny{height:118px}
.lead{font-size:15.5px;line-height:1.8;font-weight:700;margin-top:13px;color:var(--ink)}
.lead b{background:linear-gradient(transparent 62%,rgba(255,196,77,.75) 62%);padding:0 1px}
.body-note{font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin-top:9px}
.body-note b{color:var(--ink)}
.keybox{display:flex;gap:10px;margin-top:13px;border:2.5px solid var(--ink);border-radius:15px;background:var(--gold-soft);padding:11px 12px;box-shadow:var(--shadow-sm)}
.keybox .kb-ic{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center}
.keybox .kb-ic svg{width:17px;height:17px}
.keybox p{font-size:13px;line-height:1.65;font-weight:700}
.keybox p b{display:block;font-size:13.5px;margin-bottom:2px}
.compare{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.cmp{border:2.5px solid var(--ink);border-radius:16px;background:var(--card);padding:11px 12px;box-shadow:var(--shadow-sm);position:relative}
.cmp.plain{background:#F7F4EC}
.cmp.person{background:var(--mint-soft)}
.cmp .cmp-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;letter-spacing:.8px;border-radius:999px;padding:2px 8px;background:rgba(43,36,64,.08);color:var(--ink-soft)}
.cmp.person .cmp-tag{background:#BEEBDC;color:#155D49}
.cmp .cmp-s{font-size:18px;font-weight:900;letter-spacing:.5px;margin-top:7px;line-height:1.5}
.cmp .cmp-why{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px;line-height:1.55}
.cmp .cmp-why b{color:var(--coral-deep)}
.act-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.act-tab{display:flex;align-items:center;gap:7px;border:2.3px solid rgba(43,36,64,.24);border-radius:13px;background:var(--card);padding:9px 9px;font-size:12.5px;font-weight:900;color:var(--ink-soft);transition:transform .1s}
.act-tab .at-ic{flex:0 0 26px;width:26px;height:26px;border-radius:8px;background:rgba(43,36,64,.07);display:grid;place-items:center}
.act-tab .at-ic svg{width:15px;height:15px}
.act-tab.on{border-color:var(--ink);background:var(--gold-soft);color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.act-tab.on .at-ic{background:var(--gold)}
.act-panel{margin-top:10px;border:2.5px solid var(--ink);border-radius:16px;background:#FFFDF7;padding:12px;box-shadow:var(--shadow-sm);animation:pop .25s ease}
.act-panel .ap-top{display:flex;gap:10px;align-items:center}
.act-panel .ap-art{flex:0 0 74px;width:74px;height:74px;border:2px solid var(--ink);border-radius:13px;overflow:hidden}
.act-panel .ap-art svg{width:100%;height:100%}
.act-panel .ap-body{flex:1;min-width:0}
.act-panel .ap-s{font-size:16px;font-weight:900;line-height:1.55;letter-spacing:.4px}
.act-panel .ap-why{font-size:11.5px;color:var(--ink-soft);font-weight:700;line-height:1.6;margin-top:3px}
.act-panel .ap-why b{color:var(--coral-deep)}
.wordline{display:flex;flex-wrap:wrap;align-items:center;gap:5px;border:2.5px dashed rgba(43,36,64,.35);border-radius:15px;background:#fff;padding:14px 12px;margin-top:14px}
.wchip{border:2px solid transparent;border-radius:9px;background:transparent;padding:3px 6px;font-size:18px;font-weight:900;letter-spacing:.5px;line-height:1.45;transition:transform .1s,background .15s}
.wchip:active{transform:scale(.96)}
.wchip.found{background:var(--mint-soft);border-color:var(--mint-deep);color:#145A47;animation:pop .3s ease}
.wchip.miss{animation:shake .35s ease}
.wchip .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--coral);margin-left:4px;vertical-align:middle;opacity:.7}
.wchips-note{font-size:11px;color:var(--muted);font-weight:700;margin-top:7px;text-align:center}

var Sfx = {
  on:true, ctx:null,
  init:function(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; }
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone:function(freq,dur,type,vol,delay,slideTo){
    if(!this.on) return;
    var ctx=this.init(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freq,t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  },
  noiseBuf:function(){
    var ctx=this.ctx; if(this._nb) return this._nb;
    var len=Math.floor(ctx.sampleRate*2);
    var b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._nb=b; return b;
  },
  noise:function(dur,vol,filter,freq,delay){
    if(!this.on) return;
    var ctx=this.init(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var src=ctx.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
    var bp=ctx.createBiquadFilter(); bp.type=filter||'lowpass'; bp.frequency.setValueAtTime(freq||1200,t0);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0+dur+0.03);
  },
  click:function(){ this.tone(560,0.05,'triangle',0.026); },
  pop:function(){ this.tone(760,0.08,'sine',0.045); },
  flip:function(){ this.tone(420,0.07,'sine',0.028); this.tone(640,0.09,'sine',0.032,0.05); },
  curtain:function(){ this.noise(0.45,0.028,'bandpass',900,0); this.tone(180,0.3,'sine',0.03,0,120); },
  drop:function(){ this.tone(320,0.08,'triangle',0.035); this.tone(620,0.09,'sine',0.035,0.05); },

  wrong:function(){ this.tone(320,0.12,'sine',0.04); this.tone(232,0.2,'sine',0.032,0.11); },
  star:function(i){ this.tone(660+i*140,0.16,'sine',0.04,i*0.06); },
  win:function(){
    var s=this; [523,659,784,1047].forEach(function(f,i){ s.tone(f,0.22,'triangle',0.045,i*0.095); });
    this.noise(0.55,0.018,'highpass',2800,0.1);
    this.noise(0.35,0.014,'bandpass',1600,0.5);
  },
  applause:function(){
    var s=this;

function setAct(i){ S.act=i; Sfx.pop(); render(); }
function toggleTrap(i){ S.openTrap = (S.openTrap===i ? -1 : i); Sfx.pop(); render(); }
function tapWord(i){
  var w=WORDS[i];
  if(!w) return;
  if(!w.ok){
    S.msg=w.hint || ('「' + w.t + '」不是人的動作或表情。再看看。');
    Sfx.wrong(); render(); return;
  }
  if(S.found.indexOf(i)>=0) return;
  S.found.push(i);
  if(S.found.length>=2){ S.msg=''; Sfx.correct(); } else { S.msg='找到一個了，還有一個。'; Sfx.pop(); }
  render();
}

function learnGo(d){

/* ---------------- 遊戲 ---------------- */
function questions(){ return QD()[S.mode] || []; }
function startMode(m){
  S.mode=m; S.qi=0; S.correct=0; S.answered=false; S.choice=null;
  S.screen='game'; Sfx.curtain(); window.scrollTo(0,0); render();
}
function promptText(){
  if(S.mode==='a') return '這句是擬人句嗎？';
  if(S.mode==='b') return '哪一句用了擬人？';
  return S.ver==='senior' ? '這句最明顯屬於哪一類？' : '這句最明顯用了哪一種「人味」？';
}
function sentenceCard(s){
  return '<div class="sentence-card"><span class="sc-q">”</span><p>「' + s + '」</p></div>';
}
function qbarHTML(){
  var out='';
  for(var i=0;i<6;i++){
    var cls = i===S.qi ? 'on' : (i<S.qi ? 'done' : '');
    out += '<i class="' + cls + '"></i>';
  }
  return '<div class="qbar"><span class="qn">第 ' + (S.qi+1) + ' / 6 題</span><div class="qdots">' + out + '</div></div>';
}
function choiceCls(isCorrect, chosen){
  if(!S.answered) return '';
  if(isCorrect) return 'correct';
  if(chosen) return 'wrong';
  return 'dim';
}
function optionsA(q){
  var yc = choiceCls(!!q.ok, S.choice===1);
  var nc = choiceCls(!q.ok, S.choice===0);
  return '<div class="options"><div class="choice-row">' +
    '<button class="choice yes ' + yc + '" onclick="answerA(1)"><span class="ci">' + ICON.check + '</span>是擬人</button>' +
    '<button class="choice no ' + nc + '" onclick="answerA(0)"><span class="ci">' + ICON.cross + '</span>不是擬人</button>' +
  '</div></div>';
}
function optionsB(q){
  var letters=['A','B','C'];
  return '<div class="options">' + q.options.map(function(o,i){
    return '<button class="sent-opt ' + choiceCls(!!o.ok, S.choice===i) + '" onclick="answerB(' + i + ')">' +
      '<span class="so-l">' + letters[i] + '</span><span class="so-t">' + o.s + '</span>' +
    '</button>';
  }).join('') + '</div>';
}
function optionsC(q){
  var opts=C_OPTS[S.ver];
  return '<div class="options"><div class="type-grid">' + opts.map(function(t,i){
    var cls=choiceCls(i===q.ans, S.choice===i) + (i===4?' full':'');
    return '<button class="type-opt ' + cls + '" onclick="answerC(' + i + ')">' +
      '<span class="to-ic">' + ICON[C_ICONS[i]] + '</span><span class="to-t">' + t + '</span>' +
    '</button>';
  }).join('') + '</div></div>';
}
function feedbackHTML(ok, label, why, extra){
  return '<div class="feedback ' + (ok?'ok':'no') + '" id="feedback" role="status" aria-live="polite">' +
    '<div class="fb-head">' +
      '<span class="fb-ico">' + (ok?ICON.check:ICON.cross) + '</span>' +
      '<b>' + (ok?'答對了！':'差一點！') + '</b>' +
      '<span class="fb-badge">正確答案：' + label + '</span>' +
    '</div>' +
    '<p class="fb-why">' + why + '</p>' +
    (extra||'') +
    '<button class="btn ' + (ok?'mint':'primary') + '" onclick="nextQ()">' + (S.qi===5?'看成績':'下一題') + ' ' + ICON.arrowR + '</button>' +
  '</div>';
}
function gameHTML(){
  var d=V(), md=MODES[S.mode], q=questions()[S.qi];
  if(!q) return verHTML();
  var body='';
  if(S.mode==='b'){
    body = '<div class="prompt-chip">' + ICON.search + promptText() + '</div>' +
      art(q.art,'art-frame tiny') +
      optionsB(q);
    if(S.answered){
      var ok = !!q.options[S.choice].ok;
      var extra = '<div class="fb-list">' + q.options.map(function(o,i){
        return '<div class="fb-item ' + (o.ok?'yes':'no') + '"><i>' + (o.ok?'✓':'✗') + '</i><div><b>' + ['A','B','C'][i] + '.</b> ' + o.s + '<br>' + o.why + '</div></div>';
      }).join('') + '</div>';
      body += feedbackHTML(ok, ['A','B','C'][q.options.findIndex(function(o){return o.ok;})], q.options.filter(function(o){return o.ok;})[0].why, extra);
    }
  }else if(S.mode==='a'){
    body = '<div class="prompt-chip">' + ICON.check + promptText() + '</div>' +
      art(q.art,'art-frame small') +
      sentenceCard(q.s) +
      optionsA(q);
    if(S.answered){
      body += feedbackHTML((S.choice===1)===!!q.ok, q.ok?'是擬人':'不是擬人', q.why, '');
    }
  }else{
    body = '<div class="prompt-chip">' + ICON.mask + promptText() + '</div>' +
      art(q.art,'art-frame small') +
      sentenceCard(q.s) +
      optionsC(q) +
      '<div class="hint-line">' + ICON.bulb + (S.ver==='senior'?'提示：先判斷是不是擬人，再看它用了哪一種「人味」。':'提示：先找句子裏像人的詞語。') + '</div>';
    if(S.answered){
      body += feedbackHTML(S.choice===q.ans, C_OPTS[S.ver][q.ans], q.why, '');
    }
  }
  return '<div class="screen">' +
    topbar(md.name, d.name + ' · ' + md.short) +
    qbarHTML() +
    body +
  '</div>';
}
function answerA(v){
  if(S.answered) return;
  var q=questions()[S.qi];
  S.answered=true; S.choice=v;
  var ok=((v===1)===!!q.ok);
  if(ok) S.correct++;
  if(ok) Sfx.correct(); else Sfx.wrong();
  render(); scrollFeedback();
}
function answerB(i){
  if(S.answered) return;
  var q=questions()[S.qi];
  S.answered=true; S.choice=i;
  var ok=!!q.options[i].ok;
  if(ok) S.correct++;
  if(ok) Sfx.correct(); else Sfx.wrong();
  render(); scrollFeedback();
}
function answerC(i){
  if(S.answered) return;
  var q=questions()[S.qi];
  S.answered=true; S.choice=i;
  var ok=(i===q.ans);
  if(ok) S.correct++;
  if(ok) Sfx.correct(); else Sfx.wrong();
  render(); scrollFeedback();
}
function scrollFeedback(){
  setTimeout(function(){
    var f=document.getElementById('feedback');
    if(f && f.scrollIntoView) f.scrollIntoView({behavior:'smooth',block:'nearest'});
  },80);
}
function nextQ(){
  if(!S.answered) return;
  if(S.qi<5){
    S.qi++; S.answered=false; S.choice=null;
    Sfx.flip(); window.scrollTo(0,0); render();
  }else{
    finish();
  }
}

/* ---------------- 成績 ---------------- */
function finish(){
  var st=starsFor(S.correct);
  S.lastStars=st;
  var best=store[S.ver][S.mode]||0;
  if(st>best){ store[S.ver][S.mode]=st; save(); }
  S.screen='result';
  Sfx.win();
  window.scrollTo(0,0); render();
  setTimeout(function(){ Sfx.applause(); confetti(); },320);
}
function resultNote(n){
  if(n>=3) return '全部答對！你不只找到「人味」，還說得出原因，是真正的擬人大導演。';
  if(n>=2) return '演得不錯！已經看懂大部分句子，再練一次就可以拿到三顆星。';
  if(n>=1) return '已經抓到一點「人味」了。回去看看教學的五站，再上台挑戰吧。';
  return '別灰心，先看一次圖文教學，認住「動作、說話、心情、身份」四種人味，再來一次。';
}
function resultHTML(){
  var d=V(), md=MODES[S.mode], best=modeStars(S.ver,S.mode);
  var starHTML='';
  for(var i=0;i<3;i++) starHTML += '<span style="color:' + (i<S.lastStars?'#FFC44D':'#8C86A0') + '">' + (i<S.lastStars?ICON.star:ICON.starEmpty) + '</span>';
  return '<div class="screen result">' +
    topbar('演出結束', d.name + ' · ' + md.name) +
    '<div class="result-stage">' +
      '<div class="rs-glow"></div>' +
      '<div class="rs-art">' + artSVG('mascot', true) + '</div>' +
      '<h2>' + (S.lastStars>=2?'演出成功！':'演出完成！') + '</h2>' +
      '<div class="rs-score">答對 ' + S.correct + ' / 6 題</div>' +
    '</div>' +
    '<div class="big-stars">' + starHTML + '</div>' +
    '<p class="result-note">' + resultNote(S.lastStars) + '</p>' +
    '<p class="result-note" style="font-size:11.5px;color:#6F6885">這個遊戲的最佳成績：' + best + ' 顆星</p>' +
    '<div class="result-actions">' +
      '<button class="btn primary wide" onclick="startMode(\'' + S.mode + '\')">' + ICON.retry + ' 再演一次</button>' +
      '<div class="row">' +
        '<button class="btn" onclick="goVer()">' + ICON.curtain + ' 返回劇場</button>' +
        '<button class="btn" onclick="openLearn()">' + ICON.book + ' 看教學</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function goVer(){ S.screen='ver'; window.scrollTo(0,0); render(); }
function confetti(){
  var colors=['#EE6A55','#FFC44D','#3FBE9A','#57B6E6','#9A85F0','#FFAFC5'];
  var box=document.createElement('div');
  box.className='confetti';
  var html='';
  for(var i=0;i<16;i++){
    var left=Math.round(Math.random()*92)+4;
    var delay=(Math.random()*0.5).toFixed(2);
    var dur=(2.1+Math.random()*1.1).toFixed(2);
    var col=colors[i%colors.length];
    html += '<i style="left:' + left + '%;background:' + col + ';animation-delay:' + delay + 's;animation-duration:' + dur + 's"></i>';
  }
  box.innerHTML=html;
  document.body.appendChild(box);
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); },3400);
}

/* ---------------- 主渲染 ---------------- */
function render(){
  var app=document.getElementById('app');
  var html='';
  if(S.screen==='home') html=homeHTML();
  else if(S.screen==='ver') html=verHTML();
  else if(S.screen==='learn') html=learnHTML();
  else if(S.screen==='game') html=gameHTML();
  else if(S.screen==='result') html=resultHTML();
  app.innerHTML=html;
}
function openVer(v){
  S.ver=v; S.screen='ver';
  Sfx.flip(); window.scrollTo(0,0); render();
}
document.addEventListener('pointerdown', function(){ Sfx.init(); }, {once:true});
render();
</script>
</body>
</html>
