<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人物描寫小偵探｜小學高年級互動教學遊戲</title>
<meta name="description" content="香港小學高年級人物描寫互動教學遊戲：直接描寫五類、間接描寫三類，共十種玩法、一百道題目，附即時解說與音效。">
<style>
/* ============ 1. 基礎與主題 ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FFF6E6; --ink:#3B2B20; --ink2:#6C5540; --card:#FFFDF7;
  --orange:#E9813A; --orange-s:#FFE2C4; --orange-d:#B85C1D;
  --blue:#3E7CC9; --blue-s:#DCE8F9; --blue-d:#255CA0;
  --green:#3F9459; --green-s:#D8EDDD;
  --red:#C94F45; --red-s:#FBE0DC;
  --yellow:#F2B93F; --yellow-s:#FFF0C6;
  --line:rgba(59,43,32,.16);
  --r:22px;
  --fs:clamp(18px, 1.1vw + 12.5px, 20px);
  --fs-q:clamp(21px, 1.55vw + 14px, 28px);
  --fs-opt:clamp(18px, 1.05vw + 13px, 21.5px);
  --fs-h1:clamp(31px, 4.6vw, 46px);
  --fs-h2:clamp(23px, 2.8vw, 31px);
  --fs-h3:clamp(19px, 1.8vw, 23px);
  --shadow:0 5px 0 rgba(59,43,32,.13), 0 14px 28px rgba(59,43,32,.07);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC","Hiragino Sans GB","Source Han Sans TC",sans-serif;
  font-size:var(--fs); line-height:1.72; letter-spacing:0;
  background:
    radial-gradient(circle at 10% 4%, #FFE4C0 0, transparent 40%),
    radial-gradient(circle at 92% 2%, #DCE8F9 0, transparent 36%),
    radial-gradient(circle at 50% 104%, #FFF0C6 0, transparent 44%),
    var(--paper);
  background-attachment:fixed;
}
img{max-width:100%;display:block}
button{font-family:inherit}
[hidden]{display:none !important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em}
.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ 2. 版面骨架 ============ */
.shell{max-width:1120px;margin:0 auto;padding:clamp(12px,2.2vw,26px) clamp(12px,2.6vw,26px) 60px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,246,230,.94);backdrop-filter:blur(10px);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.5rem clamp(12px,2.6vw,26px)}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:clamp(16px,1.6vw,19px);line-height:1.2;min-width:0}
.brand .mark{width:2.05em;height:2.05em;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:grid;place-items:center;font-size:.95em;flex:none;box-shadow:0 3px 0 rgba(59,43,32,.18)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.iconbtn{width:44px;height:44px;min-width:44px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(59,43,32,.16);transition:transform .12s}
.iconbtn:active{transform:translateY(2px);box-shadow:none}
.iconbtn .ic{width:1.2em;height:1.2em}
.view{animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 3. 通用元件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);
  font-weight:900;font-size:clamp(16px,1.35vw,18.5px);padding:.68em 1.35em;
  cursor:pointer;box-shadow:0 4px 0 rgba(59,43,32,.85);transition:transform .1s, box-shadow .1s;
  min-height:48px;line-height:1.2;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,43,32,.85)}
.btn.primary{background:var(--orange);color:#2A1808}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff}
.btn.small{font-size:clamp(15px,1.2vw,17px);padding:.5em 1em;min-height:44px;box-shadow:0 3px 0 rgba(59,43,32,.8)}
.btn.wfull{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 3px 0 rgba(59,43,32,.3)}
.chip{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.16em .7em;font-size:.78em;font-weight:800;background:var(--orange-s);color:var(--orange-d);border:2px solid rgba(59,43,32,.14)}
.chip.blue{background:var(--blue-s);color:var(--blue-d)}
.hl{background:linear-gradient(transparent 58%, var(--yellow-s) 58%);padding:0 .06em;border-radius:4px}

.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}

/* ============ 4. 首頁 ============ */
.hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(14px,2.4vw,28px);padding:clamp(16px,2.4vw,26px);align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:var(--yellow-s);z-index:0}
.hero-art{position:relative;z-index:1;border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:#FBEBD7;box-shadow:0 6px 0 rgba(59,43,32,.14)}
.hero-art img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1}
.hero-txt{position:relative;z-index:1;min-width:0}
.kicker{margin:0 0 .2rem;font-weight:800;font-size:.82em;letter-spacing:.16em;color:var(--orange-d)}
h1{font-size:var(--fs-h1);line-height:1.16;margin:.1rem 0 .5rem;font-weight:900;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--orange-d);position:relative;white-space:nowrap}
.lede{margin:.2rem 0 .9rem;color:var(--ink2);font-size:1em;max-width:34em}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.badges span{border:2px dashed rgba(59,43,32,.35);border-radius:10px;padding:.12em .6em;font-size:.8em;font-weight:700;background:#fff}
.cta{display:flex;flex-wrap:wrap;gap:.6rem}

.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,18px);margin-top:clamp(14px,2.2vw,24px)}
.quick{display:flex;flex-direction:column;gap:.3rem;text-align:left;padding:clamp(14px,1.8vw,20px);border-radius:20px;border:3px solid var(--ink);background:var(--card);cursor:pointer;box-shadow:var(--shadow);transition:transform .14s}
.quick:hover{transform:translateY(-3px)}
.quick:active{transform:translateY(1px)}
.quick .qno{font-size:.74em;font-weight:900;letter-spacing:.1em;color:var(--ink2)}
.quick h3{margin:0;font-size:var(--fs-h3);font-weight:900}
.quick p{margin:0;color:var(--ink2);font-size:.88em;line-height:1.55}
.quick .qic{width:2.6em;height:2.6em;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.15em;border:2.5px solid var(--ink);margin-bottom:.35rem;background:var(--orange-s);color:var(--orange-d)}
.quick.b .qic{background:var(--blue-s);color:var(--blue-d)}
.quick.c .qic{background:var(--yellow-s);color:#8A5B00}
.progressline{margin-top:clamp(14px,2vw,20px);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:14px 18px;border:3px dashed rgba(59,43,32,.3);border-radius:18px;background:rgba(255,255,255,.6);font-size:.9em}
.pbar{flex:1;min-width:120px;height:14px;border-radius:999px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .4s}

/* ============ 5. 頁頭 / 教學 ============ */
.viewhead{display:flex;align-items:flex-start;gap:.8rem;margin:0 0 clamp(10px,1.6vw,16px)}
.viewhead .txt{min-width:0}
.viewhead h2{font-size:var(--fs-h2);margin:.1rem 0 .15rem;font-weight:900;line-height:1.2}
.viewhead p{margin:0;color:var(--ink2);font-size:.9em}
.backbtn{width:46px;height:46px;min-width:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(59,43,32,.16);color:var(--ink)}
.backbtn:active{transform:translateY(2px);box-shadow:none}

.tabs{display:flex;gap:.5rem;margin-bottom:clamp(12px,1.8vw,18px);flex-wrap:wrap}
.tab{flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;padding:.6rem .9rem;border-radius:16px;border:3px solid var(--ink);background:#fff;cursor:pointer;font-weight:900;font-size:clamp(16px,1.4vw,19px);box-shadow:0 4px 0 rgba(59,43,32,.15);color:var(--ink)}
.tab small{font-weight:700;font-size:.72em;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--orange-s);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.tab.b[aria-selected="true"]{background:var(--blue-s)}
.tab:active{transform:translateY(2px);box-shadow:none}

.banner{border-radius:var(--r);border:3px solid var(--ink);padding:clamp(16px,2.2vw,24px);margin-bottom:clamp(14px,2vw,20px);position:relative;overflow:hidden;background:var(--orange-s)}
.banner.b{background:var(--blue-s)}
.banner .water{position:absolute;right:-6px;bottom:-40px;font-size:150px;font-weight:900;line-height:1;color:rgba(255,255,255,.55);pointer-events:none;user-select:none}
.banner h3{margin:0 0 .1rem;font-size:clamp(21px,2.2vw,27px);font-weight:900;position:relative}
.banner .alias{margin:0 0 .5rem;font-size:.82em;font-weight:800;color:var(--ink2)}
.banner p.def{margin:0 0 .7rem;font-size:1em;max-width:36em;position:relative}
.banner ul{margin:0;padding:0;list-style:none;display:grid;gap:.35rem;position:relative}
.banner li{display:flex;gap:.45rem;font-size:.9em;line-height:1.6}
.banner li .ic{color:var(--orange-d);margin-top:.22em}
.banner.b li .ic{color:var(--blue-d)}

.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.8vw,20px)}
.tcard{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.tart{position:relative;border-bottom:3px solid var(--ink);background:#FCF6EC}
.tart img{width:100%;aspect-ratio:1/1;max-height:340px;height:auto;object-fit:contain}
.tno{position:absolute;top:10px;left:10px;background:var(--orange);color:#2A1808;border:2.5px solid var(--ink);border-radius:999px;padding:.1em .7em;font-size:.76em;font-weight:900}
.tcard.blue .tno{background:var(--blue);color:#fff}
.tbody{padding:clamp(13px,1.6vw,18px);display:flex;flex-direction:column;gap:.55rem;min-width:0}
.tbody h3{margin:0;font-size:var(--fs-h3);font-weight:900;line-height:1.3}
.tbody .alias{margin:-.35rem 0 0;font-size:.78em;color:var(--ink2);font-weight:700}
.tbody .def{margin:0;font-size:.95em}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:.3rem}
.pts li{display:flex;gap:.45rem;font-size:.88em;line-height:1.6;color:#4A3627}
.pts .ic{color:var(--green);margin-top:.2em}
.egs{display:grid;gap:.4rem}
.eg{border-left:5px solid var(--yellow);background:#FFF9EA;border-radius:0 12px 12px 0;padding:.45rem .7rem}
.eg p{margin:0;font-size:.9em;line-height:1.62}
.eg span{display:block;margin-top:.1rem;font-size:.78em;color:var(--ink2)}
.words{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.8em}
.words b{color:var(--ink2);font-size:.95em}
.words i{font-style:normal;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.02em .45em}
.tbody .btn{align-self:flex-start;margin-top:.2rem}

/* ============ 6. 選模式 ============ */
.sechead{display:flex;align-items:center;gap:.5rem;margin:clamp(14px,2vw,22px) 0 .6rem;font-weight:900;font-size:clamp(17px,1.6vw,20px)}
.sechead .dot{width:.7em;height:.7em;border-radius:50%;background:var(--orange);border:2px solid var(--ink)}
.sechead.b .dot{background:var(--blue)}
.sechead.y .dot{background:var(--yellow)}
.sechead small{font-weight:700;color:var(--ink2);font-size:.78em}
.modegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.5vw,16px)}
.modecard{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.7rem;border:3px solid var(--ink);border-radius:18px;background:var(--card);cursor:pointer;box-shadow:0 4px 0 rgba(59,43,32,.14);transition:transform .12s;min-width:0}
.modecard:hover{transform:translateY(-2px)}
.modecard:active{transform:translateY(1px);box-shadow:none}
.modecard .mimg{width:clamp(68px,8vw,88px);height:clamp(68px,8vw,88px);flex:none;border-radius:14px;overflow:hidden;border:2.5px solid var(--ink);background:#FBEBD7}
.modecard .mimg img{width:100%;height:100%;object-fit:cover}
.modecard .mtxt{min-width:0;display:flex;flex-direction:column;gap:.1rem}
.modecard .mtag{font-size:.72em;font-weight:900;color:var(--orange-d);letter-spacing:.04em}
.modecard.blue .mtag{color:var(--blue-d)}
.modecard.chal .mtag{color:#8A5B00}
.modecard h4{margin:0;font-size:clamp(17px,1.55vw,20px);font-weight:900;line-height:1.3}
.modecard p{margin:0;font-size:.84em;color:var(--ink2);line-height:1.5}
.modecard .best{font-size:.78em;font-weight:800;color:var(--green);margin-top:.15rem}
.modecard .best.none{color:#9A8672}

/* ============ 7. 答題 ============ */
.qhead{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.55rem}
.qhead .qmode{font-weight:900;font-size:clamp(16px,1.5vw,19px);min-width:0}
.qhead .qmode small{display:block;font-weight:700;color:var(--ink2);font-size:.72em}
.qhead .qstat{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:.9em}
.qstat .pill{border:2.5px solid var(--ink);border-radius:999px;padding:.1em .6em;background:#fff;font-size:.92em;white-space:nowrap}
.qstat .pill.star{background:var(--yellow-s)}
.bar{height:11px;border-radius:999px;background:#fff;border:2px solid var(--ink);overflow:hidden;margin-bottom:clamp(10px,1.5vw,14px)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .3s}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);padding:clamp(14px,2vw,24px);box-shadow:var(--shadow)}
.qtag{display:inline-flex;align-items:center;gap:.35rem;font-size:.76em;font-weight:900;color:#8A5B00;background:var(--yellow-s);border:2px solid rgba(59,43,32,.16);border-radius:999px;padding:.12em .7em;margin-bottom:.55rem}
.qtext{margin:0 0 clamp(12px,1.8vw,18px);font-size:var(--fs-q);font-weight:800;line-height:1.62;overflow-wrap:anywhere}
.qtext.passage-text{border-left:6px solid var(--yellow);background:#FFF9EA;border-radius:0 14px 14px 0;padding:.6rem .85rem;}
.qtext .blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--orange);text-align:center;color:var(--orange-d);font-weight:900;padding:0 .15em}
.qtext .blank.filled{border-bottom-style:solid}
.qnote{margin:-.4rem 0 .9rem;font-size:.85em;color:var(--ink2)}
.opts{display:grid;gap:.55rem;margin-bottom:1rem}
.opt{display:flex;align-items:flex-start;gap:.6rem;width:100%;text-align:left;border:3px solid rgba(59,43,32,.3);border-radius:16px;background:#fff;padding:.65rem .8rem;cursor:pointer;font-size:var(--fs-opt);line-height:1.55;color:var(--ink);min-height:56px;transition:background .15s,border-color .15s,transform .1s;overflow-wrap:anywhere}
.opt .lab{flex:none;width:1.85em;height:1.85em;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:.8em;background:var(--yellow-s)}
.opt .txt{min-width:0;padding-top:.05em}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.995)}
.opt[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-s);box-shadow:inset 0 0 0 2px var(--orange)}
.opt.ok{border-color:var(--green);background:var(--green-s);box-shadow:inset 0 0 0 2px var(--green)}
.opt.ok .lab{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-s);box-shadow:inset 0 0 0 2px var(--red)}
.opt.bad .lab{background:var(--red);color:#fff;border-color:var(--red)}
.opt[disabled]{cursor:default}
.opt[disabled]:active{transform:none}

.passage{display:grid;gap:.5rem;margin-bottom:1rem}
.pline{display:flex;align-items:flex-start;gap:.6rem;text-align:left;border:3px solid rgba(59,43,32,.3);border-radius:16px;background:#fff;padding:.6rem .75rem;font-size:var(--fs-opt);line-height:1.65;cursor:pointer;color:var(--ink);min-height:56px}
.pline .num{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--blue-s);border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:.8em}
.pline[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-s);box-shadow:inset 0 0 0 2px var(--blue)}
.pline.ok{border-color:var(--green);background:var(--green-s);box-shadow:inset 0 0 0 2px var(--green)}
.pline.bad{border-color:var(--red);background:var(--red-s);box-shadow:inset 0 0 0 2px var(--red)}
.pline.ok .num{background:var(--green);color:#fff;border-color:var(--green)}
.pline.bad .num{background:var(--red);color:#fff;border-color:var(--red)}

.binwrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,16px);margin-bottom:1rem}
.binbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;border:3px solid var(--ink);border-radius:20px;padding:clamp(12px,2vw,18px) .6rem;background:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(59,43,32,.16);min-height:clamp(104px,16vw,140px);color:var(--ink)}
.binbtn .big{font-size:clamp(34px,5vw,48px);font-weight:900;line-height:1;color:var(--orange-d)}
.binbtn .lbl{font-weight:900;font-size:clamp(15px,1.4vw,18px)}
.binbtn .sub{font-size:.72em;color:var(--ink2);font-weight:700}
.binbtn[aria-pressed="true"]{background:var(--orange-s);box-shadow:inset 0 0 0 3px var(--orange),0 4px 0 rgba(59,43,32,.16)}
.binbtn.b[aria-pressed="true"]{background:var(--blue-s);box-shadow:inset 0 0 0 3px var(--blue),0 4px 0 rgba(59,43,32,.16)}
.binbtn.b .big{color:var(--blue-d)}
.binbtn.ok{background:var(--green-s);border-color:var(--green);box-shadow:inset 0 0 0 3px var(--green)}
.binbtn.bad{background:var(--red-s);border-color:var(--red);box-shadow:inset 0 0 0 3px var(--red)}
.binbtn:active{transform:translateY(2px);box-shadow:none}

.timer{display:flex;align-items:center;gap:.55rem;margin:0 0 .8rem;font-weight:900;font-size:.86em;color:var(--ink2)}
.timer .tbar{flex:1;height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.timer .tbar i{display:block;height:100%;width:100%;background:var(--green);transition:width .1s linear}
.timer.warn .tbar i{background:var(--red)}
.timer.warn{color:var(--red)}

.fb{border:3px solid var(--ink);border-radius:18px;padding:clamp(12px,1.7vw,18px);margin:0 0 1rem;background:#fff;animation:pop .26s ease both}
.fb.ok{background:var(--green-s);border-color:var(--green)}
.fb.bad{background:var(--red-s);border-color:var(--red)}
.fbhead{display:flex;align-items:center;gap:.45rem;font-weight:900;font-size:clamp(17px,1.6vw,20px);margin-bottom:.35rem;flex-wrap:wrap}
.fbhead .fbic{width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:#fff;border:2.5px solid currentColor;flex:none}
.fb.ok .fbhead{color:#256B3B}
.fb.bad .fbhead{color:#9C352C}
.fbhead .fbtag{margin-left:auto;font-size:.66em;font-weight:800;color:var(--ink2);background:#fff;border:2px solid rgba(59,43,32,.15);border-radius:999px;padding:.1em .6em}
.fbans{margin:0 0 .45rem;font-size:.95em;font-weight:800;line-height:1.6}

const DATA = {"teach":{"overview":{"direct":{"title":"直接描寫","alias":"正面描寫","def":"直接寫人物本人：他的外貌、說話、動作、心理和神態。","points":["主角一出場，樣子和舉動都由作者直接寫出來。","五個小類：外貌、語言、動作、心理、神態。","優點是清楚、集中，讀者一眼就認識這個人。"]},"indirect":{"title":"間接描寫","alias":"側面描寫","def":"不直接寫本人，透過環境、旁人和其他事物來烘托他。","points":["主角可以不露面，特點卻由四周的人和景反映出來。","三個小類：環境烘托、人物襯托、他人反應。","優點是含蓄、有想像空間，讀者自己得出結論。"]}},"cards":[{"id":"appearance","group":"direct","no":"直接 1","name":"外貌描寫","alias":"又叫肖像描寫","img":"appearance","chi":"貌","def":"寫人物的容貌、身材、衣着和打扮。","points":["抓住一兩個最特別的特徵，不必由頭寫到腳。","用比喻把特徵寫具體，例如「白髮像落了一層霜」。","特徵要配合年紀、身份和生活環境。"],"examples":[{"s":"他個子瘦小，一雙眼睛又圓又亮，笑起來露出兩顆小虎牙。","n":"身形、眼睛、虎牙，三個特徵已足夠認人。"},{"s":"爺爺的頭髮白得像落了一層霜，背也彎了。","n":"用比喻寫白髮，畫面立刻具體。"}],"words":["烏黑","圓潤","瘦削","濃眉","酒窩","補丁","白髮蒼蒼"]},{"id":"dialogue","group":"direct","no":"直接 2","name":"語言描寫","alias":"寫人物說的話","img":"dialogue","chi":"言","def":"寫人物說的話，包括用詞和語氣。","points":["一句話要配合人物的年紀、身份和心情。","可配合動作、神態，一邊做一邊說更生動。","不必長篇，一句就足以見性格。"],"examples":[{"s":"「你先吃，我不餓。」婆婆把碗推到我面前。","n":"一句話加一個動作，寫出婆婆的疼愛。"},{"s":"「再來一次，我一定贏你！」他抹了抹汗。","n":"語氣強硬，好勝的性格馬上浮現。"}],"words":["低聲說","笑着說","忍不住","連忙","悄悄地","一口拒絕"]},{"id":"action","group":"direct","no":"直接 3","name":"動作描寫","alias":"寫人物的舉動","img":"action","chi":"動","def":"寫人物的舉動，關鍵是選對動詞。","points":["動詞要準確：是「扶」不是「抱」，是「拋」不是「推」。","連續動作可以寫出過程，也寫出心情。","動作要合乎年齡、身份和環境。"],"examples":[{"s":"她扶着欄杆，一步一步走上樓梯。","n":"「扶」和「一步一步」寫出小心翼翼。"},{"s":"他把球拋得高高的，然後跳起接住。","n":"幾個動詞，畫面像慢鏡重播。"}],"words":["踮","扶","拋","翻","拄","搓","裹","摘"]},{"id":"psychology","group":"direct","no":"直接 4","name":"心理描寫","alias":"寫人物的內心","img":"psychology","chi":"心","def":"寫人物心裏想的、感受到的。","points":["常用「想、覺得、害怕、希望、擔心」。","可以寫內心獨白，像自己跟自己說話。","借動作神態推想心情，不算直接的心理描寫。"],"examples":[{"s":"他望着試卷上的紅叉，心裏像壓了一塊石頭。","n":"用比喻寫沉重的心情，比「不開心」具體。"},{"s":"她在心裏對自己說：就當作在課室練習吧。","n":"內心獨白，寫出自我安定。"}],"words":["怦怦直跳","七上八下","生怕","盼望","後悔","忐忑"]},{"id":"expression","group":"direct","no":"直接 5","name":"神態描寫","alias":"寫面部表情","img":"expression","chi":"神","def":"寫面部表情、眼神和臉色的變化。","points":["眼神最會說話，一個「瞪」字已見情緒。","神態是剎那的變化，可以寫出先後。","神態不是外貌：外貌寫長相，神態寫變化。"],"examples":[{"s":"她的眉毛一下子揚起，眼睛睜得圓圓的。","n":"三個部位同時變化，驚訝就出來了。"},{"s":"他垂下眼簾，嘴角慢慢往下垮。","n":"表情的變化寫出失望。"}],"words":["瞪","抿嘴","皺眉","臉紅","垂下眼簾","咧嘴","呆住"]},{"id":"setting","group":"indirect","no":"間接 1","name":"環境烘托","alias":"借景物寫心情","img":"setting","chi":"景","def":"寫天氣、景物、光線、聲音，藉此烘托人物心情。","points":["景語即情語：灰暗的天配合失落，陽光配合雀躍。","可用相近氣氛正襯，也可用相反景物反襯。","寫景要合乎時間、地點和天氣。"],"examples":[{"s":"天灰沉沉的，雨點打在傘面上，一下一下，像誰在耳邊嘆氣。","n":"雨聲被寫成嘆氣，失落的心情就出來了。"},{"s":"陽光把跑道曬得發白，擴音器裏傳來點名的叫聲。","n":"幾筆寫出運動會前的熱鬧。"}],"words":["灰沉沉","昏黃","悶熱","寂靜","空蕩蕩","潮濕"]},{"id":"contrast","group":"indirect","no":"間接 2","name":"人物襯托","alias":"綠葉襯紅花","img":"contrast","chi":"襯","def":"用其他人或物作綠葉，突出主角這朵紅花。","points":["先想清楚要比甚麼：快慢、強弱、粗疏細心。","綠葉不能搶戲，點到即止。","對比要有共同點，才有比較的意義。"],"examples":[{"s":"幾個比他高一個頭的同學都看傻了眼。","n":"用旁人的吃驚襯出他跑得快。"},{"s":"同學的紙鶴歪歪扭扭，只有她的一隻穩穩站着。","n":"以眾人的笨拙襯出她的靈巧。"}],"words":["比起","只有","連……也","反而","相比之下"]},{"id":"reaction","group":"indirect","no":"間接 3","name":"他人反應","alias":"借旁人的眼","img":"reaction","chi":"眾","def":"寫旁人的說話、表情、動作和評價，從側面寫主角。","points":["反應要真實，合乎情境，不可誇張失實。","不同身份的人，反應也不同。","可以寫群眾、家人、老師，甚至陌生人。"],"examples":[{"s":"全場靜了一秒，接着爆出一陣掌聲。","n":"一秒的靜，比直接讚美更有力。"},{"s":"鄰居都說，這孩子從小就懂得替人着想。","n":"借別人的口，寫出主角的為人。"}],"words":["圍觀","議論","鼓掌","搖頭","豎起拇指","鬆一口氣"]}]},"modes":[{"id":"appearance","group":"direct","name":"特徵拼圖","topic":"外貌描寫","chi":"貌","img":"appearance","hint":"看句子，找出寫外貌的那一句，或想想這個特徵寫出了甚麼。","label":"句子","type":"choice","questions":[{"q":"哪一句是外貌描寫？","options":["她把書包甩到肩上，三步併作兩步跑下樓梯。","「今天由我來當組長！」她舉手說。","他個子瘦小，一雙眼睛又圓又亮，笑起來露出兩顆小虎牙。","他望着試卷上的紅叉，心裏像壓了一塊石頭。"],"answer":2,"explain":"「個子、眼睛、虎牙」全是外形特徵，所以是外貌描寫。寫跑步舉動的是動作描寫；引號裏那句是語言描寫；寫內心感受的是心理描寫。"},{"q":"「陳老師一頭短髮梳得整整齊齊，鼻樑上架着一副圓框眼鏡，身上那件灰色外套洗得發白。」這幾句主要在寫甚麼？","options":["外貌","語言","神態","動作"],"answer":0,"explain":"短髮、眼鏡、外套都是看得見的外形和衣着，所以是外貌描寫。神態寫的是面部表情的變化，這幾句沒有寫表情，所以不對。"},{"q":"哪一句最能寫出婆婆年紀大？","options":["婆婆每天清晨都到公園打太極。","婆婆說：「你們先吃，我不餓。」","婆婆走路時總愛哼着舊歌。","婆婆的臉上布滿深深的皺紋，手背上的青筋一條條凸起。"],"answer":3,"explain":"皺紋、凸起的青筋都是身體特徵，直接寫出年老的模樣。其餘三句分別寫習慣、說話和愛好，只能側面猜測，不是外貌描寫。"},{"q":"「妹妹今年六歲，個子只到我胸口，兩條辮子隨着她跳橡筋一上一下地擺。」這段外貌描寫突出了妹妹甚麼特點？","options":["做事認真","個子小、年紀輕","膽子很大","不愛說話"],"answer":1,"explain":"「六歲」和「只到我胸口」寫出年紀和身高，辮子一上一下更添孩子氣。外貌描寫要挑最能代表人物的特徵，這兩點已經足夠。"},{"q":"下面哪一個詞語不是用來寫外貌的？","options":["濃眉","酒窩","固執","雀斑"],"answer":2,"explain":"濃眉、酒窩、雀斑都是看得見的外形特徵；「固執」是性格，要靠說話和行為表現出來，不是外貌。"},{"q":"「她有一頭______的長髮，像黑色的瀑布一樣垂到腰間。」橫線上最合適的是哪一個詞？","options":["烏黑","響亮","愉快","匆忙"],"answer":0,"explain":"句子寫的是頭髮，「烏黑」寫顏色，正好配合「像黑色的瀑布」這個比喻。「響亮」寫聲音，「愉快」「匆忙」寫心情和動作，都配不上頭髮。"},{"q":"哪一句外貌描寫用了比喻，令形象更具體？","options":["他的臉很圓。","他有一張臉。","他的臉朝着窗外。","他的臉圓圓的，像一個剛出爐的麵包。"],"answer":3,"explain":"把圓臉比作剛出爐的麵包，既寫出形狀，也給人溫暖可愛的感覺。其餘句子只是平鋪直敘，讀者腦海裏沒有畫面。"},{"q":"要寫出一個同學「愛整潔」，哪一句外貌描寫最合用？","options":["他每天放學都跑着回家。","他的校服領子永遠扣到最上一顆，白襪子乾淨得發亮。","他說：「我最怕弄髒衣服。」","他望着地上的紙屑，皺了皺眉。"],"answer":1,"explain":"扣到最上一顆的領子、發亮的白襪，都是衣着打扮的細節，直接從外貌看出愛整潔。其餘三句分別寫動作、語言和神態，都不是外貌。"},{"q":"外貌描寫中寫「他左邊眉毛上有一道淺淺的疤痕」，這個細節有甚麼作用？","options":["說明他一定很頑皮","交代故事發生的地點","令人物形象獨特，容易辨認","代替人物說話"],"answer":2,"explain":"一道疤痕是獨一無二的標記，讀者一看到就記住這個人。細節不必多，但要選得特別，人物才會「活」起來。"},{"q":"下面哪一句不是外貌描寫？","options":["他把外套拉鏈拉到下巴。","她個子高瘦，皮膚曬得黑黑的。","她有一雙笑起來會瞇成一條線的眼睛。","爺爺的頭髮白得像落了一層霜。"],"answer":0,"explain":"拉鏈拉到下巴是動作，不是外形。「她個子高瘦，皮膚曬得黑黑的」寫身材和膚色，「她有一雙笑起來會瞇成一條線的眼睛」寫眼睛，「爺爺的頭髮白得像落了一層霜」用比喻寫白髮，三句都是外貌描寫。"}]},{"id":"dialogue","group":"direct","name":"對白配音室","topic":"語言描寫","chi":"言","img":"dialogue","hint":"聽聽這個人說的話，想想他的身份、性格和當時的心情。","label":"對白","type":"choice","questions":[{"q":"家明不小心撞倒了同學的模型，哪一句說話最符合他的表現？","options":["「對不起，我幫你撿起來，好嗎？」","「又不是故意的，叫甚麼叫？」","「這個模型很貴嗎？」","「是你自己放得太外面。」"],"answer":0,"explain":"道歉、承擔、提出補救，一句話就看出家明有禮貌、肯負責。其餘幾句都在推卸責任，與「不小心撞倒」之後應有的反應不合。"},{"q":"「我才不怕呢！再來一次，我一定贏你！」這句話表現出人物甚麼性格？","options":["膽小怕事","溫柔體貼","沉默寡言","好勝、不服輸"],"answer":3,"explain":"「再來一次」「一定贏你」語氣強硬，充滿鬥志，可見他好勝心強。語言描寫就是這樣，一句話足以見性格。"},{"q":"哪一句是語言描寫？","options":["婆婆的手背上滿是青筋。","「你先吃，我不餓。」婆婆把碗推到我面前。","婆婆慢慢地走進廚房。","婆婆心裏想着故鄉的舊屋。"],"answer":1,"explain":"引號裏的話就是人物說的話，屬語言描寫。「婆婆的手背上滿是青筋」是外貌，「婆婆慢慢地走進廚房」是動作，「婆婆心裏想着故鄉的舊屋」是心理。"},{"q":"「媽媽把鍋鏟往鍋邊一敲：『飯都涼了，你還捧着電話！』」這句話除了語言，還配合了哪一種描寫？","options":["外貌","心理","動作","環境"],"answer":2,"explain":"「把鍋鏟往鍋邊一敲」是動作。語言描寫常與動作、神態配合，人物一邊做一邊說，畫面就更生動，語氣也更可信。"},{"q":"一個護士要安慰害怕打針的小孩，哪一句最合適？","options":["「別怕，我數三下就好，你可以抓住我的手。」","「打針一點都不痛，你哭甚麼？」","「快點坐好，後面還有人等。」","「你自己決定打不打。」"],"answer":0,"explain":"護士的說話要溫柔、具體，給孩子安全感。「數三下」「抓住我的手」都是可行的安撫，語氣也配合她的身份。"},{"q":"哪一句最能表現老師的耐心？","options":["「這麼簡單都不會？」","「放學留下來，自己想想。」","「你還是問同學吧。」","「不要緊，我們再來一次，這次先看清題目。」"],"answer":3,"explain":"「不要緊」「再來一次」加上具體指示，語氣平和，還幫學生找出方法，這就是耐心。其餘幾句帶責備或推搪。"},{"q":"哥哥把最後一塊蛋糕推給我，說：「______」橫線上最符合哥哥性格的一句是？","options":["「我一塊也不分給你。」","「你愛吃，留給你吧。」","「蛋糕是誰買的？」","「你吃慢一點，我要看着。」"],"answer":1,"explain":"把蛋糕推給弟弟，再說一句讓他的話，行動和語言一致，寫出哥哥的疼愛。語言要與動作配合，不能自相矛盾。"},{"q":"「你自己看着辦吧。」這句話在下面哪一種情況下最可能表示生氣？","options":["老師笑着把選擇權交給同學。","同學之間商量旅行路線。","媽媽問了三次，我還是只顧打遊戲，她冷冷地說完就轉身走出房間。","爸爸鼓勵我獨立決定。"],"answer":2,"explain":"同一句話，語氣和情境不同，意思就不同。媽媽「冷冷地」「轉身走出房間」，配合這句話就變成失望和生氣。"},{"q":"語言描寫能幫助我們了解人物的甚麼？","options":["性格、身份和心情","身高和樣貌","故事發生的天氣","作者的寫作年齡"],"answer":0,"explain":"說話的內容、用詞和語氣，會隨人物的性格、身份、心情而不同。所以寫好人物的話，等於讓人物自己介紹自己。"},{"q":"下面哪一句不是語言描寫？","options":["她低聲說：「別告訴別人。」","「快跑！」他拉着我衝出門。","「明天見。」她揮揮手。","他張了張嘴，最後一句話也沒說。"],"answer":3,"explain":"「他張了張嘴，最後一句話也沒說」只寫張嘴、沒有說話，屬於動作和神態，並沒有寫出說話的內容。其餘三句都有引號裏的話。"}]},{"id":"action","group":"direct","name":"動詞填空站","topic":"動作描寫","chi":"動","img":"action","hint":"把最準確的動詞放進空格，想想這個動作合不合理。","label":"動詞","type":"cloze","questions":[{"q":"弟弟______起腳尖，悄悄地把餅乾從櫃頂拿下來。","options":["踏","踢","跺","踮"],"answer":3,"explain":"「踮起腳尖」是腳跟離地、用腳尖站立的動作，最配合「悄悄」和「從櫃頂拿」的情形。「踏」「踢」「跺」都會發出聲響，不合這個情境。"},{"q":"她______着欄杆，一步一步走上樓梯。","options":["抱","扶","摟","拋"],"answer":1,"explain":"扶着欄杆才走得穩，動作合理。「抱」「摟」要抱住整個物件，「拋」是扔出去，都與上樓梯的動作不合。"},{"q":"他把球______得高高的，然後跳起接住。","options":["踢","推","拋","滾"],"answer":2,"explain":"向上丟叫「拋」，與「得高高的」「跳起接住」完全配合。動詞選得準，讀者才看得見畫面。"},{"q":"媽媽握住鍋鏟，把青菜來回______。","options":["翻","搖","篩","壓"],"answer":0,"explain":"炒菜時把食物翻過來叫「翻」，與鍋鏟和「來回」的動作配合。一個準確的動詞，就把炒菜的情景寫活了。"},{"q":"老爺爺______着拐杖，慢慢地走過馬路。","options":["提","揮","舉","拄"],"answer":3,"explain":"「拄」是用棍子支撐身體，正合老人家走路的情形。「提」「揮」「舉」都把拐杖當成拿起的物件，沒有支撐的意思。"},{"q":"她緊張得手心冒汗，把衣角______了又______。","options":["撕","搓","拋","拍"],"answer":1,"explain":"「搓」是雙手來回摩擦，這個小動作最能寫出緊張。動作描寫選對了，人物的心情也跟着流露出來。"},{"q":"小貓______上沙發，縮成一團睡着了。","options":["滾","走","跳","爬"],"answer":2,"explain":"「跳上沙發」最符合貓的敏捷，也配合後面「縮成一團」的動作。下筆前先想想：這種動物平時怎樣動？"},{"q":"班長______起手，把答案大聲說出來。","options":["舉","抬","提","托"],"answer":0,"explain":"回答問題時把手向上伸叫「舉手」。「抬」多用於抬起物件，「提」「托」都帶拿着東西的意思。"},{"q":"他______下眼鏡，用衣角抹了又抹。","options":["拔","扯","挖","摘"],"answer":3,"explain":"「摘下眼鏡」是常用配搭。「拔」「扯」「挖」都太用力，不符合擦拭鏡片這個細心的小動作。"},{"q":"風一吹，她把外套______得緊緊的。","options":["綁","裹","掛","披"],"answer":1,"explain":"「裹」是把衣物包緊身體，配合「風一吹」和「緊緊的」。「披」只是搭在肩上，不會緊；「綁」「掛」都不合穿外套的情形。"}]},{"id":"psychology","group":"direct","name":"心聲探測器","topic":"心理描寫","chi":"心","img":"psychology","hint":"走進人物的內心，聽聽他此刻在想甚麼、怕甚麼、盼望甚麼。","label":"心聲","type":"choice","questions":[{"q":"「她望着台上的麥克風，心裏不停想：如果明天忘詞怎麼辦？」這句屬於哪一種描寫？","options":["外貌描寫","心理描寫","環境描寫","語言描寫"],"answer":1,"explain":"「心裏不停想」直接寫出她腦裏的念頭，是心理描寫。雖然也提到麥克風，但那只是背景，重心仍是內心的擔憂。"},{"q":"「他低着頭，把試卷反過來蓋在桌上，一句話也不說。」此時他心裏最可能想甚麼？","options":["這次考得很好，我要給全班看。","這張紙真好看。","這次考得真差，千萬別讓媽媽看見。","老師今天穿了新衣服。"],"answer":2,"explain":"把試卷反過來蓋住、低頭不說話，是不想讓人看見成績的表現。從動作神態推想內心，就是讀懂人物心理的第一步。"},{"q":"哪一句是心理描寫？","options":["他心裏像有十五個吊桶，七上八下。","他咬着嘴唇，手指不停敲桌子。","他大聲說：「我不怕！」","他的臉紅得像蘋果。"],"answer":0,"explain":"「心裏像有十五個吊桶」直接寫內心的感受，是心理描寫。「他咬着嘴唇，手指不停敲桌子」是動作，「他大聲說：我不怕」是語言，「他的臉紅得像蘋果」是神態。"},{"q":"「我的心像十五個吊桶打水，七上八下。」這句話表現甚麼心情？","options":["開心興奮","生氣憤怒","無聊沉悶","緊張不安"],"answer":3,"explain":"吊桶上下不定，正比喻心情起伏、安定不下來。用具體事物寫抽象心情，比單說「我很緊張」更傳神。"},{"q":"第一次站在比賽台上，台下坐滿了人。哪一句最適合做他的內心獨白？","options":["台下坐着三百人，禮堂的天花板很高。","我深呼吸一下，在心裏對自己說：就當作在課室練習吧。","他走上台，向評判鞠了一個躬。","「大家好，我是三號參賽者。」"],"answer":1,"explain":"「在心裏對自己說」是內心獨白，寫出他自我安定的過程。「台下坐着三百人，禮堂的天花板很高」是環境，「他走上台，向評判鞠了一個躬」是動作，「大家好，我是三號參賽者」是語言。"},{"q":"心理描寫常用「想、覺得、害怕、希望」等詞語。下面哪一句沒有寫出人物的內心？","options":["他希望明天不要下雨。","她覺得這道題很難。","他把窗關上，拉好窗簾。","他害怕一個人留在家。"],"answer":2,"explain":"「他把窗關上，拉好窗簾」只寫動作，沒有寫想法或感受。判斷心理描寫，要看句子有沒有走進人物的腦子和心裏。"},{"q":"「他咬着唇，手指在桌下不停地敲。」這句是直接的心理描寫嗎？","options":["不是，這是動作和神態，只能推想他的心情。","是，因為他心裏很緊張。","是，因為句子寫了「他」。","是，因為句子很短。"],"answer":0,"explain":"句子只寫看得見的動作，沒有寫他在想甚麼，所以不算直接的心理描寫。不過這種寫法能讓讀者猜到心情，是常用的間接手法。"},{"q":"「翻開舊相簿，看見那張一年級的合照，他______」橫線上最適合寫他內心的一句是？","options":["把相簿放回書架最高一格。","問媽媽晚餐吃甚麼。","走到窗前，看見街上很多人。","忽然覺得那些吵吵鬧鬧的日子，原來那麼可愛。"],"answer":3,"explain":"「覺得……原來那麼可愛」是內心的感受，配合舊相簿勾起回憶的情境。其餘幾句都是動作和語言，沒有走進內心。"},{"q":"心理描寫對讀者最大的幫助是甚麼？","options":["知道人物的身高體重","了解人物的內心，明白他為甚麼這樣做","知道故事發生的年份","學會記敘文的格式"],"answer":1,"explain":"人物做的事往往由心裏的想法推動。寫出內心，讀者才明白他的選擇，人物也不會只剩下「好人」或「壞人」兩個字。"},{"q":"哪一句心理描寫最能寫出「後悔」？","options":["我明天一定要買一隻新的紙鶴。","紙鶴是甚麼顏色的？","要是當時我沒有鬆手就好了，那隻紙鶴也許還能飛。","他折紙鶴的動作很熟練。"],"answer":2,"explain":"「要是當時……就好了」是回想過去、希望改變已發生的事，正是後悔的語氣。其餘幾句都沒有這種回望的口吻。"}]},{"id":"expression","group":"direct","name":"表情掃描儀","topic":"神態描寫","chi":"神","img":"expression","hint":"看眉毛、眼睛、嘴角的變化，讀出人物這一刻的心情。","label":"表情","type":"choice","questions":[{"q":"「她的眉毛一下子揚起，眼睛睜得圓圓的，嘴巴張成一個圓形。」這句寫的是甚麼？","options":["憤怒的神態","疲倦的神態","驚訝的神態","悲傷的神態"],"answer":2,"explain":"眉毛揚起、眼睛睜大、嘴巴張開，是典型的驚訝反應。神態描寫就是抓住臉上這幾個部位同時的變化。"},{"q":"下面哪一句最能寫出生氣的神態？","options":["他緊抿着嘴，眉頭擰成一個結，眼睛直直地盯着我。","他笑着向我點頭。","他低着頭，慢慢走開。","他的頭髮很短。"],"answer":0,"explain":"抿嘴、眉頭打結、直盯着人，都是生氣時臉上的變化。「他笑着向我點頭」是友善，「他低着頭，慢慢走開」偏動作，「他的頭髮很短」是外貌。"},{"q":"哪一句是神態描寫？","options":["她有一雙大眼睛。","她每天早上七時起床。","她說：「我很開心。」","她笑得眼睛彎成兩道月牙。"],"answer":3,"explain":"「笑得眼睛彎成月牙」寫的是表情的變化，屬神態。「她有一雙大眼睛」寫天生的長相，是外貌；其餘是習慣和語言。"},{"q":"「他的臉一下子紅到耳根，低下頭不敢看人。」這句寫出他甚麼心情？","options":["憤怒","害羞","不耐煩","得意"],"answer":1,"explain":"臉紅到耳根、低頭避開目光，是不好意思的表現。神態往往比說話更早洩露心情，所以作家愛寫面部變化。"},{"q":"要寫出「失望」，哪一句神態描寫最貼切？","options":["他拍手大叫：「太好了！」","他皺起鼻子，用力跺腳。","他垂下眼簾，嘴角慢慢往下垮。","他睜大眼睛，張大了嘴。"],"answer":2,"explain":"眼簾垂下、嘴角向下，是失望時最常見的表情。其餘三句分別是興奮、生氣和驚訝。"},{"q":"「她笑起來，眼睛彎成兩道月牙。」這句話用了甚麼方法令描寫更生動？","options":["比喻","排比","反問","引用"],"answer":0,"explain":"把彎彎的眼睛比作月牙，形狀相近，畫面馬上就出來了。神態描寫加上比喻，會比「她笑得很開心」更具體。"},{"q":"「她有一雙大眼睛。」與「她瞪大了眼睛。」兩句有甚麼分別？","options":["兩句都寫外貌","前一句寫神態，後一句寫外貌","兩句都寫心理","前一句寫外貌，後一句寫神態"],"answer":3,"explain":"「有」寫天生的樣貌，是外貌；「瞪」是眼睛剎那間的變化，是神態。同一部位，動與不動，分別就在這裏。"},{"q":"「聽到自己得獎，他先______，接着咧嘴笑了起來。」橫線上最合適的神態是？","options":["閉上眼睛睡覺","呆了一呆","把書包放下","走到台前"],"answer":1,"explain":"「呆了一呆」是驚訝得呆住的表情，與後面「接着咧嘴笑」形成先驚後喜的變化。神態可以寫變化過程，不只寫一個定格。"},{"q":"神態描寫最能反映人物的甚麼？","options":["年齡和身高","家庭背景","心情和態度","說話習慣"],"answer":2,"explain":"一個眼神、一個嘴角的動作，往往即時反映心情和對人的態度。所以寫神態，其實是在寫人物當下的內心。"},{"q":"下面哪一句不是神態描寫？","options":["他穿了一件藍色外套。","他的嘴角微微向上。","她的眼神忽然暗了下來。","他的眉毛皺成一團。"],"answer":0,"explain":"外套是衣着，屬外貌描寫。其餘三句都寫臉上部位的細微變化，是神態。"}]},{"id":"setting","group":"indirect","name":"天氣調色盤","topic":"環境烘托","chi":"景","img":"setting","hint":"同樣的街，晴天和雨天感覺完全不同。選一段最配合心情的景物。","label":"景","type":"choice","questions":[{"q":"考試失利的他一個人回家，哪一段環境描寫最能烘托他的心情？","options":["天灰沉沉的，雨點打在傘面上，一下一下，像誰在耳邊嘆氣。","太陽猛得刺眼，街上的雪糕車排着長龍。","公園裏鑼鼓喧天，舞獅隊正在採青。","天空藍得像洗過一樣，白雲一朵一朵。"],"answer":0,"explain":"灰暗的天色、一下一下的雨聲，與失落的心情同調。景語即情語，選景物之前，先想清楚人物此刻的心情。"},{"q":"明天要去旅行，他興奮得睡不着。哪一段環境描寫最配合？","options":["風把窗吹得砰砰作響，屋裏黑得看不見手指。","雨下了整個晚上，街道空無一人。","天色陰沉，遠處傳來幾聲悶雷。","天還沒亮，窗外已泛起一層淡淡的橙，鳥兒在樹上叫個不停。"],"answer":3,"explain":"天將亮、鳥聲不斷，寫出等待天亮的雀躍。環境與心情一致叫「正襯」；用陰暗景物寫興奮，就會前後矛盾。"},{"q":"環境描寫在人物描寫中起甚麼作用？","options":["直接寫出人物的樣貌","烘托人物心情，交代人物所處的環境","代替人物說話","計算人物的年齡"],"answer":1,"explain":"環境不會自己說話，但可以感染讀者。同樣的街道，晴天和雨天給人的感覺完全不同，這就是烘托。"},{"q":"哪一句是環境描寫？","options":["他坐在課室裏發呆。","他心裏很亂。","課室裏只剩下風扇轉動的聲音。","他的頭髮被風吹亂了。"],"answer":2,"explain":"寫的是課室裏的聲音，屬於周圍環境。「他坐在課室裏發呆」是動作，「他心裏很亂」是心理，「他的頭髮被風吹亂了」是外貌，都不是寫景物。"},{"q":"「全班都走了，課室只剩下他一個，風把窗簾吹得一下一下拍着牆。」這段烘托甚麼心情？","options":["孤單失落","熱鬧興奮","輕鬆自在","憤怒不平"],"answer":0,"explain":"空蕩蕩的課室、一下一下的拍牆聲，把「只剩下他一個」的孤單放大。景物空洞而重複，正好配合失落。"},{"q":"要寫出「緊張」，哪一段環境描寫最合用？","options":["窗外陽光普照，花開滿園。","小食部傳來陣陣香味。","同學在操場上打球，笑聲不斷。","走廊的鐘滴答滴答，每一聲都像敲在他心口上。"],"answer":3,"explain":"鐘聲被寫成敲在心口上，時間變得又慢又重，正是緊張的感覺。其餘幾段都太輕鬆愉快。"},{"q":"環境描寫一定要直接寫出人物的心情嗎？","options":["一定要，否則讀者不明白","不必，可以透過景物側面烘托","一定要，而且要寫在句子最後","不必，景物與心情完全無關"],"answer":1,"explain":"好的環境描寫不會明說「他很傷心」，而是讓灰暗的天、冷冷的風替人物說話，讀者自然感受到。"},{"q":"運動會開始前，操場上是甚麼景象？哪一段環境描寫最合適？","options":["夜裏的操場空無一人，只有路燈亮着。","雪花一片一片落在跑道上。","陽光把跑道曬得發白，擴音器裏傳來點名的叫聲。","課室裏的燈全關了，靜得聽見呼吸。"],"answer":2,"explain":"日曬的跑道、擴音器的叫聲，都是運動會前的真實景象。環境描寫要合乎時間、地點和天氣。"},{"q":"哪一段環境描寫最能配合「溫暖」的感覺？","options":["冬日的陽光斜斜照進廚房，鍋裏的湯冒着白煙。","寒風從門縫鑽進來，窗玻璃結了一層霜。","暴雨打在鐵皮上，噼噼啪啪響個不停。","濃霧鎖着街道，五步之外看不見人。"],"answer":0,"explain":"陽光、熱湯、白煙，都給人暖意。寒冷、暴雨、濃霧則是另一種氣氛，選景物要先定好想營造的感覺。"},{"q":"「屋裏只有一盞昏黃的燈，桌上是吃了一半的冷飯。」這段環境描寫暗示了甚麼？","options":["家裏非常熱鬧","主人剛搬新屋","主人很喜歡做飯","生活冷清簡樸"],"answer":3,"explain":"昏黃的燈、吃了一半的冷飯，說明屋裏人少、生活簡單，甚至有點孤清。環境描寫也能暗示人物的處境。"}]},{"id":"contrast","group":"indirect","name":"綠葉搜查線","topic":"人物襯托","chi":"襯","img":"contrast","hint":"在短文裏點出那片「綠葉」，想想它襯托了主角的甚麼。","label":"句","type":"sentence","questions":[{"q":"點出用來襯托子朗跑得快的一句。","passage":["發令槍一響，子朗就像一支箭衝了出去。","跑道旁幾個比他高一個頭的六年級同學，都看傻了眼。","他第一個衝過終點，全班歡呼起來。"],"answer":1,"explain":"第二句沒有寫子朗的速度，而是寫高年級同學「看傻了眼」。用旁人的吃驚反襯出子朗快得驚人，這就是襯托。"},{"q":"點出用來襯托妹妹勇敢的一句。","passage":["停電的晚上，妹妹拿着電筒走進漆黑的走廊。","哥哥比她大五歲，卻緊緊抓着我的衣角，一步也不敢走。","妹妹回頭說：「跟我來，不用怕。」"],"answer":1,"explain":"寫哥哥的害怕，是為了突出妹妹的勇敢。以弱襯強，比直接說「妹妹很勇敢」更有說服力。"},{"q":"這段文字用哪一句襯托美儀的手藝？","passage":["手工課上，同學們的紙鶴不是歪了脖子，就是塌了翅膀。","只有美儀指頭一翻，一隻紙鶴穩穩站在桌上。","老師拿起來看了又看，捨不得放下。"],"answer":0,"explain":"第一句寫其他同學的手忙腳亂，正是綠葉。以眾人的笨拙襯托美儀的靈巧，主角連「很厲害」三個字都不用說。"},{"q":"點出襯托主角演講精彩的一句。","passage":["禮堂裏幾百對眼睛都看着他。","連平日最安靜、從不鼓掌的陳小敏也站起來拍手。","他說完最後一句，向台下鞠了一躬。"],"answer":1,"explain":"用「最安靜、從不鼓掌」的同學也站起來拍手，襯出這段演講打動人心。選綠葉，要選反差最大的那一個。"},{"q":"點出以景物襯托小白花的一句。","passage":["園裏的玫瑰開得又大又紅，人人走過都要停下拍照。","牆角那株小小的白花，一聲不響地開着，香氣卻飄滿整個園子。","我每天放學都去看它一眼。"],"answer":0,"explain":"用搶眼的玫瑰反襯不起眼的小白花，突出它安靜而實在的好。以物襯人，是人物襯托常見的寫法。"},{"q":"點出襯托班長冷靜的一句。","passage":["火警鐘突然響起，同學們慌得撞翻了椅子。","班長一手扶着門框，一手示意大家排隊，聲音不大，卻人人聽得清楚。","我們跟着他，兩分鐘就到了操場。"],"answer":0,"explain":"第一句寫眾人的慌亂，第二句才寫班長的冷靜。沒有那片混亂，班長的沉着就顯不出來。"},{"q":"這段文字用哪一句襯托姐姐的節儉？","passage":["妹妹的衣櫃塞得關不上門，每一季都要買新衣。","姐姐的外套穿了三年，袖口補過一次，仍然洗得乾淨。","媽媽常說，姐姐的衣服最省心。"],"answer":0,"explain":"妹妹的鋪張是綠葉，姐姐的節儉是紅花。兩姊妹一對比，節儉的特點就清楚了。"},{"q":"點出襯托教練嚴厲的一句。","passage":["天還沒亮，球場的燈已經亮了。","隊員們私下說，寧願跑十個圈，也不想聽他多說一句話。","可是每次比賽，我們都排在頭三名。"],"answer":1,"explain":"隊員「寧願跑十個圈」的抱怨，反過來寫出教練的嚴厲。這是借旁人的感受來襯托人物。"},{"q":"點出襯托主角歌聲的一句。","passage":["聯歡會上，音響忽然失靈，全場一片嘈雜。","他一開口，連走廊上走過的人都停住了腳步。","一曲唱完，擴音器才修好。"],"answer":1,"explain":"沒有音響，卻能令走廊上的人停下腳步，這比「他唱得很好聽」有力得多。襯托要靠具體反應，不要空泛讚美。"},{"q":"這段文字用哪一句襯托主角的細心？","passage":["組員們交上來的報告，錯字、漏頁、格式各有一套。","他把每一份重新排好，連標點也逐個改正，第二天一早放在老師桌上。","老師說，這份報告可以直接貼在壁報板上。"],"answer":0,"explain":"組員的粗疏，正好襯出主角的細心。襯托不一定要寫「另一個人很差」，但一定要有一個清楚的比較點。"}]},{"id":"reaction","group":"indirect","name":"旁人鏡頭","topic":"他人反應","chi":"眾","img":"reaction","hint":"主角不說話，鏡頭轉向旁人，看他們的表情和行動。","label":"鏡頭","type":"choice","questions":[{"q":"主角的魔術表演成功，哪一句最能寫出觀眾的反應？","options":["他把帽子反過來，再從裏面拿出一朵花。","全場靜了一秒，接着爆出一陣掌聲，連平日最嚴肅的陳老師也笑出聲來。","他為這個魔術練了三個星期。","舞台的燈光很亮。"],"answer":1,"explain":"寫全場的反應、老師的笑容，是從側面寫表演成功。其餘三句寫的是主角的動作、背景和環境，不是他人反應。"},{"q":"主角說了一個冷笑話，哪一句旁人的反應最真實？","options":["全場感動得哭了出來。","大家立刻起立鼓掌三分鐘。","同學們互相看了一眼，有人忍不住「噗」一聲笑出來。","所有人嚇得躲到桌子下面。"],"answer":2,"explain":"冷笑話的反應通常是先呆一下，再有人失笑。反應要合乎情境，太過誇張反而失真。"},{"q":"下雨天，主角扶起跌倒的婆婆，哪一句寫出旁人的反應？","options":["排隊等巴士的人都望過來，有人走過去替他們撐傘。","他一手撐傘，一手扶住婆婆的手臂。","婆婆的菜籃子掉在地上，橙子滾了一地。","雨越下越大，路面積了一層水。"],"answer":0,"explain":"「都望過來」「替他們撐傘」是旁人的行動，屬他人反應。「他一手撐傘，一手扶住婆婆的手臂」是主角動作，「婆婆的菜籃子掉在地上」和「雨越下越大」是物件和環境。"},{"q":"寫旁人的反應，屬於哪一種描寫？","options":["直接描寫（正面描寫）","外貌描寫","心理描寫","間接描寫（側面描寫）"],"answer":3,"explain":"主角沒有出場，只寫旁人怎樣看、怎樣說，讀者卻能推想主角的好，所以是間接描寫。"},{"q":"哪一句是他人反應，而不是主角自己的動作？","options":["他深吸一口氣，把手舉高。","圍觀的同學捂着嘴，眼睛瞪得大大的。","他一步一步走上台階。","他把講稿捏得皺巴巴。"],"answer":1,"explain":"「圍觀的同學」是旁人，寫他們的表情就是他人反應。其餘三句的主語都是主角本人。"},{"q":"他人反應在人物描寫中有甚麼作用？","options":["代替主角說話","交代主角的年齡","從側面突出主角的特點，令描寫更客觀可信","增加文章的字數"],"answer":2,"explain":"旁人的眼睛代替作者作證，主角的好與壞由別人反應出來，讀者會覺得更真實。"},{"q":"主角把功課借給忘記帶書的同學，哪一句旁人反應最合適？","options":["那個同學鬆了一口氣，小聲說：「幸好有你。」","他把功課翻到第三頁。","課室的鐘指向八時正。","他昨天覆習到很晚。"],"answer":0,"explain":"同學鬆一口氣、道謝，是直接的反應，寫出主角的幫助來得及時。反應要貼着事件發生的一刻。"},{"q":"要突出主角「受歡迎」，哪一句他人反應最有力？","options":["他每天早上七時半回到學校。","他的書包是藍色的。","他喜歡吃咖喱魚蛋。","他剛走進課室，幾個同學同時招手：「這邊！留了位給你。」"],"answer":3,"explain":"同學主動留位、招手，熱情自然流露。寫歡迎，不必說「他很受歡迎」，讓旁人的舉動說出來。"},{"q":"「他低着頭不說話。」這句是他人反應嗎？","options":["是，因為他沒有說話","不是，這是主角本身的神態和動作","是，因為句中有人物","是，因為句子很短"],"answer":1,"explain":"他人反應的主角必須是旁人。這句寫的是本人低頭沉默，屬神態和動作描寫，只能說可能與心情有關。"},{"q":"如果主角把事情做得一團糟，旁人的反應應該是哪一種？","options":["全場起立鼓掌，讚不絕口","大家感動得流下眼淚","有人搖頭嘆氣，有人忍不住笑，也有人走過去幫他收拾","所有人都視而不見，一句話也不說"],"answer":2,"explain":"反應要與事情的結果一致。做得不好而人人稱讚，前後矛盾，讀者就不會相信這個故事。"}]},{"id":"binary","group":"challenge","name":"快閃分類賽","topic":"直接與間接辨析","chi":"辨","img":"challenge","hint":"二十秒內判斷：這一句是直接描寫，還是間接描寫？","label":"分類","type":"binary","timeLimit":20,"questions":[{"q":"她說話時總是把頭髮撥到耳後。","answer":"direct","tag":"動作描寫","explain":"這是她自己的小動作，直接寫本人，屬直接描寫中的動作描寫。"},{"q":"他一進門，原本鬧哄哄的課室忽然靜了下來。","answer":"indirect","tag":"他人反應","explain":"沒有寫他怎樣，只寫課室因他而靜，用旁人的反應烘托他的氣場，屬間接描寫。"},{"q":"窗外的風把樹影搖得亂七八糟，他卻一動也不動。","answer":"indirect","tag":"環境烘托","explain":"風和樹影是環境，用來烘托他心裏的翻騰或沉默，屬間接描寫。"},{"q":"他咬着牙，把最後一分力氣都用盡了。","answer":"direct","tag":"動作描寫","explain":"咬牙、用力都是本人的動作和神態，直接寫本人，屬直接描寫。"},{"q":"其他選手個個高他一個頭，可是一起跑，全都只能看着他的背影。","answer":"indirect","tag":"人物襯托","explain":"沒有寫他跑得多快，只寫其他選手「只能看着他的背影」，用旁人襯出他的速度，屬間接描寫中的人物襯托。"},{"q":"「讓我來吧。」她接過我手上的掃帚。","answer":"direct","tag":"語言描寫","explain":"引號裏是她說的話，配合她本人的動作，屬直接描寫。"},{"q":"鄰居都說，這孩子從小就懂得替人着想。","answer":"indirect","tag":"他人反應","explain":"借鄰居的評價寫主角，主角沒有出場，屬間接描寫中的他人反應。"},{"q":"她心裏怦怦直跳，生怕被人發現。","answer":"direct","tag":"心理描寫","explain":"直接寫她內心的跳動和害怕，屬直接描寫中的心理描寫。"},{"q":"桌上那碗湯還冒着熱氣，旁邊壓着一張字條。","answer":"indirect","tag":"環境烘托","explain":"湯和字條是桌上的物件，借物件營造有人默默照顧他的氣氛，屬間接描寫中的環境烘托。"},{"q":"他的臉漲得通紅，連耳根都紅了。","answer":"direct","tag":"神態描寫","explain":"臉和耳根的顏色變化是本人神態，直接寫本人，屬直接描寫。"}]},{"id":"detective","group":"challenge","name":"手法偵查課","topic":"綜合辨析","chi":"查","img":"challenge","hint":"讀完一段文字，判斷它主要用了哪一種描寫手法。","label":"手法","type":"detective","questions":[{"q":"放學的鐘聲響過，課室空了。他把課本一本一本放進書包，動作很慢，眼睛不時望向門口。","options":["動作描寫","外貌描寫","環境烘托","語言描寫"],"answer":0,"explain":"「放進」「望向」是連續動作，而且動作很慢，透出他在等人。開頭的環境只是背景，重點仍在動作。"},{"q":"「你自己決定吧。」媽媽把報名表推回我面前，起身走進廚房。","options":["心理描寫","外貌描寫","他人反應","語言描寫"],"answer":3,"explain":"重心是媽媽說的那句話，推表、起身的動作只是配合，屬語言描寫。這句話也顯出她尊重孩子的態度。"},{"q":"他站在鏡子前，把校服領子翻了又翻，頭髮梳了三次，還是覺得不對。","options":["神態描寫","動作描寫","環境烘托","心理描寫"],"answer":1,"explain":"翻領子、梳頭髮是反覆的動作，寫出他重視這次見面。雖然包含心情，但沒有直接寫出想法，所以歸動作描寫。"},{"q":"台下黑壓壓坐滿了人，燈光打在臉上，他的手心全是汗，心裏只有一句：不要忘詞。","options":["外貌描寫","語言描寫","心理描寫","人物襯托"],"answer":2,"explain":"「心裏只有一句」直接寫內心，屬心理描寫。台下的情況只是背景，作用是把緊張推高。"},{"q":"她接過成績表，先看名次，再看分數，然後把紙對摺，放進書包最深的一格。","options":["動作描寫","神態描寫","語言描寫","環境烘托"],"answer":0,"explain":"一連串動作，加上「對摺」「最深的一格」，寫出她不想讓人看見結果。動作的次序本身就在說話。"},{"q":"雨停了，走廊的水窪映着天光。樓梯間空無一人，只有風一陣一陣從窗口吹進來，把地上的紙吹得貼着牆角打轉。","options":["動作描寫","語言描寫","他人反應","環境烘托"],"answer":3,"explain":"雨後的水窪、空無一人的樓梯間、一陣一陣的風，營造出安靜而孤單的氣氛，屬環境烘托。"},{"q":"我還沒有說完，旁邊的同學已經笑得趴在桌上，連老師也別過臉去。","options":["語言描寫","他人反應","外貌描寫","心理描寫"],"answer":1,"explain":"笑到趴在桌上、老師別過臉，都是旁人的反應，從側面寫出「我」說的話很好笑。"},{"q":"他的眉毛先是一挑，接着整張臉亮了起來，嘴角怎麼也壓不住。","options":["外貌描寫","動作描寫","神態描寫","環境烘托"],"answer":2,"explain":"眉毛、整張臉、嘴角的變化，是表情的連續變化，屬神態描寫。外貌寫的是固定的長相，不會這樣一瞬間改變。"},{"q":"婆婆的圍裙上補了幾個不同顏色的布塊，褲腳捲起，露出一雙舊布鞋。","options":["外貌描寫","神態描寫","心理描寫","他人反應"],"answer":0,"explain":"圍裙、褲腳、布鞋都是衣着打扮，屬外貌描寫。補布的顏色不一，也悄悄寫出她的節儉。"},{"q":"放學後，他把課室的椅子一張一張翻上桌面，抹乾淨，才鎖門離開。","options":["外貌描寫","環境烘托","語言描寫","動作描寫"],"answer":3,"explain":"翻椅子、抹桌面、鎖門，一連串動作寫出他的責任感；動詞準確，過程清楚，屬動作描寫。"}]}]};

const $  = function(s, r){ return (r || document).querySelector(s); };
const $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
const esc = function(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
  });
};
const icon = function(id, extra){
  return '<svg class="ic ' + (extra || '') + '" aria-hidden="true"><use href="#i-' + id + '"></use></svg>';
};

/* =========================================================
   1. 音效（Web Audio，自行合成，無外部檔案）
   ========================================================= */
const Sound = (function(){
  var ctx = null, muted = false, supported = true, lastTick = 0;
  try { muted = localStorage.getItem('renwu-muted') === '1'; } catch(e){}

  function ensure(){
    if (!supported) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { supported = false; return null; }
        ctx = new AC();
      }
      if (ctx.state === 'suspended') { ctx.resume(); }
      return ctx;
    } catch(e){ supported = false; return null; }
  }
  function tone(freq, delay, dur, type, vol){
    if (muted) return;
    var c = ensure(); if (!c) return;
    try {
      var t0 = c.currentTime + delay;
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime((vol || 0.16), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch(e){}
  }
  return {
    tap:   function(){ tone(660, 0, 0.07, 'triangle', 0.1); },
    pick:  function(){ tone(520, 0, 0.06, 'sine', 0.09); },
    ok:    function(){ tone(784, 0, 0.14, 'triangle', 0.15); tone(1046.5, 0.1, 0.2, 'triangle', 0.14); },
    bad:   function(){ tone(220, 0, 0.16, 'sawtooth', 0.09); tone(174.6, 0.12, 0.22, 'sawtooth', 0.08); },
    next:  function(){ tone(587, 0, 0.08, 'sine', 0.1); tone(784, 0.06, 0.1, 'sine', 0.09); },
    tick:  function(){ var n = Date.now(); if (n - lastTick < 480) return; lastTick = n; tone(1000, 0, 0.04, 'square', 0.05); },
    finish:function(){ [523.3, 659.3, 784, 1046.5].forEach(function(f, i){ tone(f, i * 0.11, 0.26, 'triangle', 0.14); }); },
    setMuted: function(v){ muted = !!v; try { localStorage.setItem('renwu-muted', muted ? '1' : '0'); } catch(e){} },
    isMuted: function(){ return muted; },
    isSupported: function(){ return supported; },
    unlock: function(){ ensure(); }
  };
})();

/* =========================================================
   2. 進度（localStorage，失敗則只在記憶體中）
   ========================================================= */
const Store = (function(){
  var KEY = 'renwu-progress-v1', data = {};
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') data = o; }
  } catch(e){ data = {}; }
  return {
    best: function(id){ return Number(data[id]) || 0; },
    setBest: function(id, score){
      if (score > this.best(id)) {
        data[id] = score;
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){}
      }
    },
    cleared: function(){ return MODES.filter(function(m){ return (Number(data[m.id]) || 0) >= 10; }).length; }
  };
})();

/* =========================================================
   3. 狀態與畫面切換
   ========================================================= */
var state = { view:'home', teachTab:'direct', quiz:null, lastMode:null, modeFilter:'all' };

function show(view){
  if (view !== 'quiz') stopTimer();
  state.view = view;
  $$('[data-view]').forEach(function(sec){ sec.hidden = (sec.dataset.view !== view); });
  window.scrollTo({ top:0, behavior:'auto' });
  if (view === 'home') renderHome();
  if (view === 'teach') renderTeach();
  if (view === 'modes') renderModes();
}

function go(view){
  Sound.tap();
  if (view === 'modes' || view === 'challenge'){
    state.modeFilter = (view === 'challenge') ? 'challenge' : 'all';
    show('modes');
    return;
  }
  show(view);
}

/* =========================================================
   4. 首頁
   ========================================================= */
function renderHome(){
  var done = Store.cleared();
  $('#homeProg').textContent = done + ' / 10 個模式';
  $('#homeBar').style.width = (done * 10) + '%';
}

    '<div class="banner' + (g === 'indirect' ? ' b' : '') + '">' +
      '<div class="water" aria-hidden="true">' + (g === 'direct' ? '直' : '間') + '</div>' +

      '<p class="def">' + esc(ov.def) + '</p>' +
      '<ul>' + ov.points.map(function(p){ return '<li>' + icon('check') + '<span>' + esc(p) + '</span></li>'; }).join('') + '</ul>' +
    '</div>';

  var list = cards.map(function(c){
    var mode = MODE[c.id];
    var best = Store.best(c.id);
    return '' +
    '<article class="tcard' + (g === 'indirect' ? ' blue' : '') + '">' +
      '<div class="tart"><img data-img="' + esc(c.img) + '" alt="' + esc(c.name) + '示意插圖"><span class="tno">' + esc(c.no) + '</span></div>' +
      '<div class="tbody">' +
        '<h3>' + esc(c.name) + '</h3>' +
        '<p class="alias">' + esc(c.alias) + '</p>' +
        '<p class="def">' + esc(c.def) + '</p>' +
        '<ul class="pts">' + c.points.map(function(p){ return '<li>' + icon('check') + '<span>' + esc(p) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="egs">' + c.examples.map(function(e){
            return '<div class="eg"><p>「' + esc(e.s) + '」</p><span>' + esc(e.n) + '</span></div>';
          }).join('') + '</div>' +
        '<div class="words"><b>好用詞語</b>' + c.words.map(function(w){ return '<i>' + esc(w) + '</i>'; }).join('') + '</div>' +
        '<button class="btn small ghost" type="button" data-play="' + esc(c.id) + '">' +
          icon('play') + '去玩「' + esc(mode.name) + '」' +
        '</button>' +
      '</div>' +
    '</article>';
  }).join('');

  $('#teachBody').innerHTML = banner + '<div class="tgrid">' + list + '</div>';
  hydrateImages($('#teachBody'));
}

/* =========================================================
   6. 模式選單
   ========================================================= */
function modeCard(m){
  var best = Store.best(m.id);
  var cls = 'modecard' + (m.group === 'indirect' ? ' blue' : '') + (m.group === 'challenge' ? ' chal' : '');
  var groupTxt = m.group === 'direct' ? '直接描寫' : (m.group === 'indirect' ? '間接描寫' : '辨析挑戰');
  var bestTxt = best > 0 ? ('最佳 ' + best + ' / 10' + (best === 10 ? ' · 已通關' : '')) : '尚未挑戰';
  return '' +
  '<button class="' + cls + '" type="button" data-mode="' + esc(m.id) + '">' +
    '<span class="mimg"><img data-img="' + esc(m.img) + '" alt=""></span>' +
    '<span class="mtxt">' +
      '<span class="mtag">' + groupTxt + ' · ' + esc(m.topic) + '</span>' +
      '<h4>' + esc(m.name) + '</h4>' +
      '<p>' + esc(m.hint) + '</p>' +
      '<span class="best' + (best > 0 ? '' : ' none') + '">' + bestTxt + ' · 10 題</span>' +
    '</span>' +
  '</button>';
}

function renderModes(){
  var only = state.modeFilter === 'challenge';
  $('#modesTitle').textContent = only ? '辨析挑戰區' : '技能訓練場';
  var html = '';
  if (!only){
    html += '<div class="sechead"><span class="dot"></span>直接描寫<span><small>五種手法 · 五個玩法</small></span></div>';
    html += '<div class="modegrid">' + MODES.filter(function(m){ return m.group === 'direct'; }).map(modeCard).join('') + '</div>';
    html += '<div class="sechead b"><span class="dot"></span>間接描寫<span><small>三種手法 · 三個玩法</small></span></div>';
    html += '<div class="modegrid">' + MODES.filter(function(m){ return m.group === 'indirect'; }).map(modeCard).join('') + '</div>';
  }
  html += '<div class="sechead y"><span class="dot"></span>辨析挑戰區<span><small>兩種模式 · 考驗眼光</small></span></div>';
  html += '<div class="modegrid">' + MODES.filter(function(m){ return m.group === 'challenge'; }).map(modeCard).join('') + '</div>';
  $('#modesBody').innerHTML = html;
  hydrateImages($('#modesBody'));
  var p = $('.viewhead p', $('[data-view="modes"]'));
  p.textContent = only
    ? '兩種模式：限時快閃分類，以及短文手法偵查。每種十題。'
    : '選一種手法開始，每種模式十道題，答完即時解說。';
}

/* =========================================================
   7. 答題引擎
   ========================================================= */
var LETTERS = ['A','B','C','D'];
var CIRCLED = ['①','②','③','④'];

function startMode(id){
  Sound.unlock();
  Sound.tap();
  var m = MODE[id];
  if (!m) return;
  state.lastMode = id;
  state.quiz = {
    mode: m,
    idx: 0,
    sel: null,
    revealed: false,
    score: 0,
    log: [],
    timedOut: false,
    deadline: 0,
    remainMs: 0,
    timerId: null,
    warned: false
  };
  show('quiz');
  renderQuestion();
}

function stopTimer(){
  if (state.quiz && state.quiz.timerId){ clearInterval(state.quiz.timerId); state.quiz.timerId = null; }
  var w = $('#qTimerWrap'); if (w) w.innerHTML = '';
}

function startTimer(){
  var q = state.quiz, limit = (q.mode.timeLimit || 20) * 1000;
  q.deadline = Date.now() + limit;
  q.remainMs = limit;
  q.warned = false;
  renderTimer(limit, limit);
  q.timerId = setInterval(function(){
    var left = q.deadline - Date.now();
    if (left <= 0){
      stopTimer();
      if (!q.revealed){ q.timedOut = true; q.sel = null; reveal(); }
      return;
    }
    renderTimer(left, limit);
    if (left < 5200) Sound.tick();
  }, 100);
}

function renderTimer(left, limit){
  var w = $('#qTimerWrap'); if (!w) return;
  if (!w.firstChild){
    w.innerHTML = '<div class="timer"><span>' + icon('timer') + '</span><div class="tbar"><i></i></div><span class="tnum">' + Math.ceil(limit / 1000) + '</span></div>';
  }
  var box = w.firstChild;
  var pct = Math.max(0, Math.min(100, (left / limit) * 100));
  $('i', box).style.width = pct + '%';
  $('.tnum', box).textContent = Math.max(0, Math.ceil(left / 1000)) + ' 秒';
  box.classList.toggle('warn', left < 5200);
}

function questionHTML(q){
  var m = state.quiz.mode;
  if (m.type === 'sentence'){
    $('#qTag').textContent = '點出其中一句';
    return '<div class="opts passage" role="group" aria-label="短文句子">' +
      q.passage.map(function(line, i){
        return '<button class="pline" type="button" data-i="' + i + '" aria-pressed="false">' +
          '<span class="num">' + CIRCLED[i] + '</span><span class="txt">' + esc(line) + '</span></button>';
      }).join('') + '</div>';
  }
  if (m.type === 'binary'){
    $('#qTag').textContent = '這句屬於哪一類？';
    return '<div class="binwrap">' +
      '<button class="binbtn" type="button" data-v="direct" aria-pressed="false"><span class="big">直</span><span class="lbl">直接描寫</span><span class="sub">寫本人</span></button>' +
      '<button class="binbtn b" type="button" data-v="indirect" aria-pressed="false"><span class="big">間</span><span class="lbl">間接描寫</span><span class="sub">寫四周</span></button>' +
    '</div>';
  }
  var isCloze = m.type === 'cloze';
  $('#qTag').textContent = isCloze ? '選一個動詞填進空格' : '請選出最合適的答案';
  return '<div class="opts" role="group" aria-label="選項">' + q.options.map(function(o, i){
    return '<button class="opt" type="button" data-i="' + i + '" aria-pressed="false">' +
      '<span class="lab">' + LETTERS[i] + '</span><span class="txt">' + esc(o) + '</span></button>';
  }).join('') + '</div>';
}

function renderQuestion(){
  var q = state.quiz, item = q.mode.questions[q.idx];
  q.sel = null; q.revealed = false; q.timedOut = false;
  $('#qModeName').textContent = q.mode.name;
  $('#qTopic').textContent = q.mode.topic + ' · 第 ' + (q.idx + 1) + ' 題';
  var total = q.mode.questions.length;
  $('#qCount').textContent = '第 ' + (q.idx + 1) + ' / ' + total + ' 題';
  $('#qScore').textContent = '★ ' + q.score;
  $('#qBar').style.width = ((q.idx + 1) / total * 100) + '%';

  var text = esc(item.q);
  if (q.mode.type === 'cloze') text = text.replace(/______/g, '<span class="blank">　　</span>');
  $('#qText').innerHTML = text;
  $('#qText').classList.toggle('passage-text', q.mode.type === 'detective');

  $('#qArea').innerHTML = questionHTML(item);
  $('#qFb').hidden = true;
  $('#qFb').innerHTML = '';
  $('#qFb').className = 'fb';

  var act = $('#qAct');
  act.textContent = '確認答案';
  act.disabled = true;

  if (q.mode.type === 'binary'){ startTimer(); } else { stopTimer(); }

  var first = $('.opt, .pline, .binbtn', $('#qArea'));
  if (first) first.focus({ preventScroll:true });
}

function selectOption(btn){
  var q = state.quiz;
  if (!q || q.revealed) return;
  Sound.pick();
  if (q.mode.type === 'binary'){
    var v = btn.dataset.v;
    q.sel = v;
    $$('.binbtn', $('#qArea')).forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
  } else {
    var i = Number(btn.dataset.i);
    q.sel = i;
    $$('.opt, .pline', $('#qArea')).forEach(function(b){ b.setAttribute('aria-pressed', String(Number(b.dataset.i) === i)); });
    if (q.mode.type === 'cloze'){
      $$('.blank', $('#qText')).forEach(function(blank){
        blank.textContent = q.mode.questions[q.idx].options[i];
        blank.classList.add('filled');
      });
    }
  }
  $('#qAct').disabled = false;
}

function labelOf(item, val){
  if (state.quiz.mode.type === 'binary'){
    return val === 'direct' ? '直接描寫（' + item.tag + '）' : '間接描寫（' + item.tag + '）';
  }
  if (state.quiz.mode.type === 'sentence'){
    return CIRCLED[val] + ' ' + item.passage[val];
  }
  return LETTERS[val] + '. ' + item.options[val];
}

function reveal(){
  var q = state.quiz, item = q.mode.questions[q.idx];
  if (q.revealed) return;
  q.revealed = true;
  stopTimer();

  var typed = q.mode.type;
  var correctVal = item.answer;
  var userVal = q.sel;
  var ok = !q.timedOut && (typed === 'binary' ? userVal === correctVal : userVal === correctVal);

  if (typed === 'binary'){
    $$('.binbtn', $('#qArea')).forEach(function(b){
      if (b.dataset.v === correctVal) b.classList.add('ok');
      if (b.dataset.v === userVal && userVal !== correctVal) b.classList.add('bad');
      b.setAttribute('aria-pressed', String(b.dataset.v === userVal));
    });
  } else {
    $$('.opt, .pline', $('#qArea')).forEach(function(b){
      var i = Number(b.dataset.i);
      if (i === correctVal) b.classList.add('ok');
      if (i === userVal && userVal !== correctVal) b.classList.add('bad');
      b.setAttribute('aria-pressed', String(i === userVal));
    });
  }

  if (ok) q.score += 1;
  $('#qScore').textContent = '★ ' + q.score;

  var head = ok ? '答對了！' : (q.timedOut ? '時間到，未作答' : '差一點！');
  var fb = $('#qFb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = '' +
    '<div class="fbhead">' + icon(ok ? 'check' : 'cross') + '<b>' + head + '</b>' +
      '<span class="fbtag">' + esc(q.mode.topic) + '</span></div>' +
    '<p class="fbans">正確答案：' + esc(labelOf(item, correctVal)) + '</p>' +
    (ok ? '' : '<p class="fbans">你的選擇：' + (q.timedOut ? '未作答' : esc(labelOf(item, userVal))) + '</p>') +
    '<p class="fbexp"><b>為甚麼？</b>' + esc(item.explain) + '</p>';
  fb.hidden = false;
  ok ? Sound.ok() : Sound.bad();

  q.log.push({
    ok: ok,
    brief: item.q,
    user: q.timedOut ? '未作答' : labelOf(item, userVal),
    right: labelOf(item, correctVal),
    explain: item.explain
  });

  var act = $('#qAct');
  act.disabled = false;
  act.textContent = q.idx === q.mode.questions.length - 1 ? '看成績' : '下一題';
  act.focus({ preventScroll:true });
  if (fb.scrollIntoView) { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

function nextQuestion(){
  var q = state.quiz;
  if (!q.revealed) return;
  Sound.next();
  if (q.idx >= q.mode.questions.length - 1){ finishMode(); return; }
  q.idx += 1;
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function finishMode(){
  var q = state.quiz, total = q.mode.questions.length;
  var score = q.score;
  stopTimer();
  Store.setBest(q.mode.id, score);

  var stars = score >= 9 ? 3 : (score >= 7 ? 2 : (score >= 5 ? 1 : 0));
  $('#resTitle').innerHTML = '答對 <span class="score">' + score + '</span> / ' + total + ' 題';
  $('#resStars').innerHTML = [0,1,2].map(function(i){
    return '<svg class="ic' + (i < stars ? ' on' : '') + '" aria-hidden="true"><use href="#i-star"></use></svg>';
  }).join('');

  var verdict;
  if (score === 10) verdict = '十題全中！這雙眼睛已經是偵探級，可以去教別人了。';
  else if (score >= 9) verdict = '非常準確！只差一點點就滿分，回去看看那一題的解說就明白。';
  else if (score >= 7) verdict = '掌握得不錯。再讀一次這類描寫的要點，然後挑戰「辨析挑戰區」吧。';
  else if (score >= 5) verdict = '已經抓到大方向，細節還要再看清楚。建議先回教學館讀一讀例子。';
  else verdict = '別急，這一類手法要慢慢看。先看教學卡的三個要點，再玩一次，會順很多。';
  $('#resVerdict').textContent = verdict;

  var card = CARDS[q.mode.id];
  $('#resTake').innerHTML = card
    ? '<b>記住這一句：</b>' + esc(card.points[0])
    : '<b>小提示：</b>直接描寫寫本人，間接描寫寫四周，先問一句「這句在寫誰」。';

  $('#resList').innerHTML = q.log.map(function(r, i){
    return '<details class="rev ' + (r.ok ? 'ok' : 'bad') + '">' +
      '<summary><span class="no">' + (i + 1) + '</span><span class="rq">' + esc(r.brief) + '</span>' +
        '<span class="mark">' + icon(r.ok ? 'check' : 'cross') + '</span></summary>' +
      '<div class="revbody">' +
        '<p class="rqfull">題目：' + esc(r.brief) + '</p>' +
        '<p>你的答案：<span class="' + (r.ok ? 'right' : 'wrong') + '">' + esc(r.user) + '</span></p>' +
        '<p>正確答案：<span class="right">' + esc(r.right) + '</span></p>' +
        '<p class="exp">' + esc(r.explain) + '</p>' +
      '</div></details>';
  }).join('');

  show('result');
  Sound.finish();
}

/* =========================================================
   8. 圖片注入
   ========================================================= */
function hydrateImages(root){
  $$('img[data-img]', root || document).forEach(function(img){
    var key = img.dataset.img;
    if (IMG[key]) img.src = IMG[key];
  });
}

/* =========================================================
   9. 事件綁定
   ========================================================= */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-go],[data-tab],[data-play],[data-mode],.opt,.pline,.binbtn') : null;
  if (!el) return;

  if (el.dataset.go){ go(el.dataset.go); return; }
  if (el.dataset.tab){
    state.teachTab = el.dataset.tab;
    $$('.tab').forEach(function(t){ t.setAttribute('aria-selected', String(t.dataset.tab === state.teachTab)); });
    Sound.tap();
    renderTeach();
    return;
  }
  if (el.dataset.play){ startMode(el.dataset.play); return; }
  if (el.dataset.mode){ startMode(el.dataset.mode); return; }
  if (el.classList.contains('opt') || el.classList.contains('pline') || el.classList.contains('binbtn')){
    if (state.view === 'quiz') selectOption(el);
  }
}, false);

$('#qAct').addEventListener('click', function(){
  var q = state.quiz;
  if (!q) return;
  if (!q.revealed){
    if (q.sel === null) return;
    Sound.tap();
    reveal();
  } else {
    nextQuestion();
  }
});

$('#quizBack').addEventListener('click', function(){
  Sound.tap();
  stopTimer();
  state.quiz = null;
  show('modes');
});

$('#againBtn').addEventListener('click', function(){
  if (state.lastMode) startMode(state.lastMode);
});

$('#backMenuBtn').addEventListener('click', function(){
  Sound.tap();
  show('modes');
});

$('#homeBtn').addEventListener('click', function(){ Sound.tap(); show('home'); });

$('#soundBtn').addEventListener('click', function(){
  var next = !Sound.isMuted();
  Sound.setMuted(next);
  if (!next) Sound.tap();
  renderSoundBtn();
});

function renderSoundBtn(){
  var btn = $('#soundBtn');
  if (!Sound.isSupported()){
    btn.hidden = true;
    return;
  }
  btn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-' + (Sound.isMuted() ? 'mute' : 'sound') + '"></use></svg>';
  btn.setAttribute('aria-label', Sound.isMuted() ? '音效已關閉，點擊開啟' : '音效已開啟，點擊關閉');
  btn.style.opacity = Sound.isMuted() ? '.55' : '1';
}

/* 切到背景時暫停計時，回來再續 */
document.addEventListener('visibilitychange', function(){
  var q = state.quiz;
  if (!q || q.mode.type !== 'binary' || q.revealed) return;
  if (document.hidden){
    if (q.timerId){ q.remainMs = Math.max(0, q.deadline - Date.now()); clearInterval(q.timerId); q.timerId = null; }
  } else if (!q.timerId && q.remainMs <= 0){
    q.timedOut = true; q.sel = null; reveal();
  } else if (!q.timerId && q.remainMs > 0){
    q.deadline = Date.now() + q.remainMs;
    q.timerId = setInterval(function(){
      var left = q.deadline - Date.now();
      if (left <= 0){ stopTimer(); if (!q.revealed){ q.timedOut = true; q.sel = null; reveal(); } return; }
      renderTimer(left, (q.mode.timeLimit || 20) * 1000);
      if (left < 5200) Sound.tick();
    }, 100);
  }
});

/* 鍵盤：1-4 選項、Enter 確認／下一題 */
document.addEventListener('keydown', function(ev){
  if (state.view !== 'quiz') return;
  var q = state.quiz; if (!q) return;
  if (ev.key === 'Enter'){
    var onOpt = ev.target.closest && ev.target.closest('.opt,.pline,.binbtn');
    if (onOpt && !q.revealed) return;
    ev.preventDefault();
    if (q.revealed) nextQuestion();
    else if (q.sel !== null) reveal();
    return;
  }
  var n = parseInt(ev.key, 10);
  if (!isNaN(n) && n >= 1 && n <= 4 && !q.revealed){
    var list = $$('.opt, .pline', $('#qArea'));
    if (list[n - 1]) { selectOption(list[n - 1]); ev.preventDefault(); }
  }
  if (q.mode.type === 'binary' && !q.revealed){
    if (ev.key === '1' || ev.key === 'ArrowLeft') { var a = $('.binbtn[data-v="direct"]'); if (a) selectOption(a); }
    if (ev.key === '2' || ev.key === 'ArrowRight') { var b = $('.binbtn[data-v="indirect"]'); if (b) selectOption(b); }
  }
});

/* =========================================================
   10. 啟動
   ========================================================= */
(function init(){
  hydrateImages(document);
  renderSoundBtn();
  renderHome();
  show('home');
})();
</script>
