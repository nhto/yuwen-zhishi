<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>修辭小偵探 · 句子裡的秘密</title>
<meta name="description" content="初小版與高小版修辭分辨遊戲：讀句子、找線索、認出比喻、擬人、排比、誇張、反問等修辭，全繁體字，Q版手繪風，手機可直接玩。">
<meta name="theme-color" content="#FBF4E3">
<style>
:root{
  --paper:#FBF4E3;
  --paper2:#FFFCF2;
  --ink:#3D3831;
  --ink-soft:#6E6455;
  --ink-faint:#A2957F;
  --red:#CF513C;
  --yellow:#F2BE4E;
  --green:#4F8F6C;
  --green-soft:#E4F3E8;
  --blue:#4C7FA8;
  --blue-soft:#E3F0F7;
  --purple:#8675AB;
  --accent:#D99A2B;
  --accent-soft:#F9E5B6;
  --accent-deep:#A96F12;
  --accent2:#CF7A52;
  --line:rgba(61,56,49,.14);
  --shadow:3px 4px 0 rgba(61,56,49,.16);
  --shadow-sm:2px 3px 0 rgba(61,56,49,.14);
  --font-hand:"Kaiti TC","BiauKai","DFKai-SB","KaiTi","STKaiti","Noto Serif TC","Songti TC",serif;
  --font-body:"PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --r1:22px 18px 24px 16px;
  --r2:16px 20px 15px 19px;
}
body[data-mode="high"]{
  --accent:#42869E;
  --accent-soft:#D8EBF2;
  --accent-deep:#2C667B;
  --accent2:#8675AB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:var(--font-body);
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(242,190,78,.18), transparent 44%),
    radial-gradient(circle at 92% 2%, rgba(134,117,171,.13), transparent 40%),
    radial-gradient(circle at 50% 104%, rgba(207,122,82,.12), transparent 46%),
    repeating-linear-gradient(0deg, rgba(76,127,168,.055) 0 1px, transparent 1px 27px);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(61,56,49,.13) 1.2px, transparent 1.2px);
  background-size:23px 23px;opacity:.28;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
svg{display:block}
::selection{background:var(--accent-soft)}

.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.screen{
  display:flex;flex-direction:column;
  width:100%;max-width:540px;min-height:100dvh;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
}
.screen[hidden]{display:none}

/* ---------- shared bits ---------- */
.icon-btn{
  flex:none;width:42px;height:42px;border:2.5px solid var(--ink);border-radius:14px 16px 13px 15px;
  background:var(--paper2);display:grid;place-items:center;box-shadow:var(--shadow-sm);
  transition:transform .12s ease,box-shadow .12s ease;
}
.icon-btn:active{transform:translate(2px,3px);box-shadow:0 0 0 rgba(0,0,0,0)}
.icon-btn svg{width:21px;height:21px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kicker{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--ink-soft);
  background:var(--paper2);border:2px solid var(--ink);border-radius:999px;
  padding:5px 12px 5px 10px;box-shadow:var(--shadow-sm);
}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.tiny{margin:0;text-align:center;font-size:12px;color:var(--ink-faint);letter-spacing:.02em}

/* ---------- home ---------- */
#screen-home{justify-content:flex-start;gap:0}
.home-top{position:relative;padding-top:4px}
.home-top .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  font-family:var(--font-hand);font-weight:700;
  font-size:clamp(34px,10vw,46px);line-height:1.16;letter-spacing:.02em;
  margin:18px 0 12px;
}
h1 .marker{position:relative;display:inline-block;color:var(--accent-deep)}
h1 .marker::after{
  content:"";position:absolute;left:-4px;right:-6px;bottom:2px;height:12px;z-index:-1;
  background:var(--accent-soft);border-radius:40% 60% 45% 55%/60% 40% 60% 40%;
  transform:rotate(-1.4deg);
}
.lede{margin:0;font-size:15px;line-height:1.75;color:var(--ink-soft);max-width:35em}
.hero{
  position:relative;display:flex;align-items:flex-end;gap:10px;
  margin:20px 0 20px;padding-left:2px;
}
.mascot{width:102px;flex:none;animation:bob 4.2s ease-in-out infinite}
.mascot svg{width:100%;height:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.speech{
  position:relative;flex:1;min-width:0;
  font-family:var(--font-hand);font-size:16px;line-height:1.65;
  background:var(--paper2);border:2.5px solid var(--ink);
  border-radius:6px 18px 18px 18px;padding:12px 14px;box-shadow:var(--shadow-sm);
  transform:rotate(.6deg);
}
.speech::before{
  content:"";position:absolute;left:-11px;top:16px;width:16px;height:16px;
  background:var(--paper2);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);
  transform:rotate(45deg);
}
.mode-list{display:flex;flex-direction:column;gap:15px}
.mode-card{
  position:relative;text-align:left;width:100%;
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r1);
  padding:16px 17px 14px;box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease;
  overflow:hidden;
}
.mode-card::after{
  content:"";position:absolute;right:-28px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:var(--accent-soft);opacity:.7;
}
.mode-card[data-pick="high"]::after{background:#DCEBF2}
.mode-card:active{transform:translate(2px,4px);box-shadow:1px 1px 0 rgba(61,56,49,.18)}
.mode-card:focus-visible{outline-offset:4px}
.mode-head{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1}
.mode-name{font-family:var(--font-hand);font-size:26px;font-weight:700;letter-spacing:.04em}
.mode-sub{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:3px 9px}
.mode-desc{position:relative;z-index:1;margin:9px 0 12px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);letter-spacing:.02em}
.mode-foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:2px dashed var(--line);padding-top:10px;font-size:12.5px;color:var(--ink-faint)}
.mode-go{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13.5px;color:var(--accent-deep)}
.mode-go svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.text-btn{
  margin:20px auto 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-hand);font-size:16px;font-weight:700;color:var(--ink);
  border-bottom:2.5px solid var(--ink);padding:4px 2px;
}
.text-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.home-foot{margin-top:auto;padding-top:18px}

/* ---------- play bar ---------- */
.play-bar{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.play-title{flex:1;min-width:0;text-align:center;font-family:var(--font-hand);font-size:17px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-title .sep{margin:0 7px;color:var(--ink-faint)}
.hud{display:flex;align-items:center;gap:10px;padding:0 2px 12px}
.hud-track{flex:1;height:9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper2);overflow:hidden}
.hud-fill{height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.hud-num{font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:.06em;font-variant-numeric:tabular-nums}

.play-main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
@media (min-height:720px){.play-main{justify-content:center}}
.q-card{
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r1);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  position:relative;
}
.q-card::after{
  content:"";position:absolute;left:16px;top:-9px;width:46px;height:17px;background:rgba(242,190,78,.6);
  transform:rotate(-3deg);border-left:1px dashed rgba(61,56,49,.18);border-right:1px dashed rgba(61,56,49,.18);
}
.art-box{
  position:relative;height:clamp(128px,22vh,182px);flex:none;
  background:var(--accent-soft);
  border-bottom:2px dashed rgba(61,56,49,.28);
  overflow:hidden;
}
.art-box svg{width:100%;height:100%;display:block}
.q-text{padding:13px 15px 15px}
.q-prompt{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-faint)}
.prompt-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.sentence{
  margin:8px 0 0;font-family:var(--font-hand);font-weight:700;color:var(--ink);
  font-size:clamp(19px,5.4vw,24px);line-height:1.62;letter-spacing:.03em;
}
.sentence mark{background:linear-gradient(transparent 56%, var(--accent-soft) 56%);color:inherit;padding:0 1px;border-radius:3px}
.sentence mark::after{content:"";}

.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  position:relative;display:flex;align-items:center;gap:9px;text-align:left;
  min-height:56px;padding:10px 12px 10px 10px;
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r2);
  box-shadow:var(--shadow-sm);font-size:17px;font-weight:800;letter-spacing:.08em;
  transition:transform .1s ease,box-shadow .1s ease,background .2s ease;
}
.opt:active{transform:translate(2px,3px);box-shadow:none}
.opt .idx{
  flex:none;width:28px;height:28px;display:grid;place-items:center;
  border:2px solid var(--ink);border-radius:50% 46% 52% 48%;
  font-size:12px;font-weight:800;color:var(--ink-soft);
  background:var(--paper);
}
.opt .txt{min-width:0}
.opt.correct{background:var(--green-soft);border-color:var(--green);box-shadow:2px 3px 0 rgba(79,143,108,.35)}
.opt.correct .idx{border-color:var(--green);color:var(--green);background:#fff}
.opt.correct::after{
  content:"";position:absolute;right:12px;top:50%;width:16px;height:9px;
  border-left:3px solid var(--green);border-bottom:3px solid var(--green);
  transform:translateY(-70%) rotate(-45deg);
  animation:checkIn .3s ease both;
}
@keyframes checkIn{from{transform:translateY(-70%) rotate(-45deg) scale(.4);opacity:.2}to{transform:translateY(-70%) rotate(-45deg) scale(1);opacity:1}}
.opt.wrong{border-style:dashed;border-color:var(--ink-faint);color:var(--ink-faint);background:var(--paper);animation:shake .4s ease}
.opt.wrong .idx{border-color:var(--ink-faint);color:var(--ink-faint)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-1deg)}45%{transform:translateX(5px) rotate(1deg)}70%{transform:translateX(-3px)}85%{transform:translateX(2px)}}
.opt:disabled{cursor:default}

.hint-row{display:flex;align-items:center;gap:9px;padding:2px 2px 4px;min-height:46px}
.mascot-mini{width:40px;flex:none;transition:transform .2s ease}
.mascot-mini svg{width:100%;height:auto}
.mascot-mini.happy{animation:hop .6s ease}
.mascot-mini.sad{animation:sink .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-8px) rotate(-4deg)}65%{transform:translateY(-3px) rotate(3deg)}}
@keyframes sink{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(4px) rotate(-3deg)}}
.hint-bubble{
  flex:1;margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-soft);
  background:rgba(255,252,242,.8);border:1.5px dashed rgba(61,56,49,.3);
  border-radius:12px 14px 13px 15px;padding:7px 10px;
}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(61,56,49,.32);backdrop-filter:blur(2px);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.sheet-panel{
  position:relative;width:100%;max-width:540px;
  background:var(--paper2);border-top:3px solid var(--ink);
  border-radius:26px 26px 0 0;
  padding:24px 20px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 0 rgba(61,56,49,.08);
  animation:slideUp .3s cubic-bezier(.2,.85,.25,1) both;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-panel::before{
  content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:44px;height:5px;border-radius:99px;background:rgba(61,56,49,.2);
}
.stamp{
  position:absolute;top:-30px;right:16px;width:88px;height:88px;
  display:grid;place-items:center;text-align:center;
  border:3px double var(--red);border-radius:50% 47% 52% 48%;
  color:var(--red);font-family:var(--font-hand);font-size:19px;font-weight:700;line-height:1.15;
  letter-spacing:.06em;background:rgba(255,252,242,.94);
  transform:rotate(-9deg);
  animation:stampIn .45s cubic-bezier(.2,.9,.3,1.5) both;
}
@keyframes stampIn{from{transform:rotate(-28deg) scale(1.7);opacity:.2}to{transform:rotate(-9deg) scale(1);opacity:1}}
.sheet-panel h3{
  margin:2px 96px 8px 0;font-family:var(--font-hand);font-size:23px;letter-spacing:.03em;
}
.sheet-panel h3 .cat{color:var(--accent-deep)}
.why{margin:0 0 10px;font-size:15px;line-height:1.75;color:var(--ink)}
.clue-line{
  margin:0 0 16px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  background:var(--accent-soft);border-radius:12px;padding:8px 11px;
  border:1.5px dashed rgba(61,56,49,.18);
}
.primary-btn{
  width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:var(--paper2);border:2.5px solid var(--ink);
  border-radius:16px 19px 15px 18px;font-size:16px;font-weight:800;letter-spacing:.1em;
  box-shadow:3px 4px 0 rgba(61,56,49,.22);
  transition:transform .12s ease,box-shadow .12s ease;
}
.primary-btn:active{transform:translate(2px,4px);box-shadow:none}
.primary-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlay / result ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(61,56,49,.36);backdrop-filter:blur(3px);
  animation:fadeIn .2s ease;
}
.result-card{
  position:relative;width:100%;max-width:360px;text-align:center;
  background:var(--paper2);border:3px solid var(--ink);border-radius:26px 22px 28px 24px;
  padding:26px 20px 20px;box-shadow:6px 8px 0 rgba(61,56,49,.2);
  animation:popIn .35s cubic-bezier(.2,.9,.3,1.35) both;
}
@keyframes popIn{from{transform:scale(.9) rotate(-1deg);opacity:.4}to{transform:scale(1) rotate(0);opacity:1}}
.result-card::before{
  content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:92px;height:24px;background:rgba(242,190,78,.65);
  border-left:1px dashed rgba(61,56,49,.2);border-right:1px dashed rgba(61,56,49,.2);
}
.stars{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.stars svg{width:44px;height:44px}
.stars .star-on{animation:starIn .45s cubic-bezier(.2,.9,.3,1.5) both}
.stars .star-on:nth-child(2){animation-delay:.1s}
.stars .star-on:nth-child(3){animation-delay:.2s}
@keyframes starIn{from{transform:scale(.3) rotate(-25deg);opacity:.2}to{transform:scale(1) rotate(0);opacity:1}}
.result-card h2{margin:0 0 6px;font-family:var(--font-hand);font-size:28px;letter-spacing:.04em}
.result-sub{margin:0 0 16px;font-size:14px;line-height:1.65;color:var(--ink-soft)}
.result-stats{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.stat{flex:1;background:var(--paper);border:2px dashed rgba(61,56,49,.25);border-radius:13px;padding:9px 6px}
.stat b{display:block;font-size:20px;font-family:var(--font-hand)}
.stat span{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.result-actions{display:flex;flex-direction:column;gap:9px}
.ghost-btn{
  width:100%;min-height:46px;border:2.5px solid var(--ink);border-radius:15px 18px 14px 17px;
  background:transparent;font-size:14.5px;font-weight:700;letter-spacing:.08em;
  transition:transform .12s ease;
}
.ghost-btn:active{transform:translateY(2px)}
.ghost-btn.strong{background:var(--accent-soft);border-color:var(--ink)}

/* ---------- handbook ---------- */
#screen-book{max-width:560px}
.book-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.book-tabs::-webkit-scrollbar{display:none}
.book-tab{
  flex:none;padding:7px 13px;border:2px solid var(--ink);border-radius:999px;
  background:var(--paper2);font-size:13px;font-weight:800;letter-spacing:.06em;box-shadow:var(--shadow-sm);
}
.book-tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--ink)}
.book-tab[aria-selected="true"]:focus-visible{outline-color:var(--ink)}
.book-sep{flex:none;width:2px;align-self:stretch;margin:3px 4px;background:repeating-linear-gradient(180deg,var(--ink-faint) 0 3px,transparent 3px 7px);opacity:.55;border-radius:2px}
.book-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:1px 2px 14px;-webkit-overflow-scrolling:touch}
.entry{
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r2);
  padding:14px 15px;box-shadow:var(--shadow-sm);position:relative;
}
.entry h3{margin:0 0 6px;font-family:var(--font-hand);font-size:21px;letter-spacing:.05em}
.entry h3 span{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:2px;letter-spacing:.06em}
.entry p{margin:0;font-size:14.5px;line-height:1.72;color:var(--ink)}
.entry .eg{margin-top:8px;font-family:var(--font-hand);font-size:15px;color:var(--accent-deep);border-left:3px solid var(--accent);padding-left:9px;line-height:1.6}
.entry .how{margin-top:8px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px}
.entry .how b{color:var(--ink)}
.book-note{margin:0;text-align:center;font-size:11.5px;color:var(--ink-faint);padding:2px 0 4px}

/* ---------- responsive ---------- */
@media (min-width:720px){
  .screen{max-width:760px;padding-left:28px;padding-right:28px;padding-top:calc(26px + env(safe-area-inset-top))}
  #screen-home{max-width:600px}
  .mode-list{flex-direction:row;gap:16px}
  .mode-card{flex:1}
  .mode-desc{min-height:46px}
  .mascot{width:120px}
  .speech{font-size:17px;padding:14px 16px}
  .q-card{display:grid;grid-template-columns:42% 58%}
  .art-box{height:auto;min-height:250px;border-bottom:0;border-right:2px dashed rgba(61,56,49,.28)}
  .q-text{display:flex;flex-direction:column;justify-content:center;padding:20px 22px}
  .sentence{font-size:27px}
  .options{grid-template-columns:repeat(4,1fr);gap:12px}
  .opt{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;min-height:82px;font-size:17px}
  .opt.correct::after{top:16px;right:12px;transform:rotate(-45deg)}
  .sheet-panel{border:3px solid var(--ink);border-radius:26px;margin-bottom:20px;max-width:520px}
  .hint-row{padding-bottom:8px}
  .result-card{max-width:400px;padding:30px 26px 24px}
  .result-actions{flex-direction:row;flex-wrap:wrap}
  .result-actions>*{flex:1;min-width:130px}
}
@media (max-width:340px){
  .screen{padding-left:13px;padding-right:13px}
  .opt{font-size:15.5px;min-height:52px;padding-right:8px}

    <ellipse cx="73" cy="120" rx="10" ry="5.5" fill="${C.paper}"/>
    <circle cx="100" cy="76" r="13" fill="#DCEBF2" fill-opacity=".85"/>
    <path d="M110 87l11 11" stroke-width="5"/>
    <path d="M33 42 26 14l24 13M83 42l7-28-24 13" fill="#F3C777"/>
    <path d="M34 38 30 23l13 8M82 38l4-15-13 8" fill="${C.p}" stroke="none"/>
    <circle cx="58" cy="57" r="30" fill="#F3C777"/>
    <path d="M29 34c2-15 14-24 29-24s27 9 29 24Z" fill="#8198BE"/>
    <path d="M24 34h68" stroke-width="5"/>
    <path d="M58 10V5" stroke-width="2.6"/>
    <circle cx="47" cy="57" r="3" fill="${C.ink}" stroke="none"/>
    <circle cx="69" cy="57" r="3" fill="${C.ink}" stroke="none"/>
    <path d="M54 64l4 4 4-4" fill="#E58A7A"/>
    <path d="M58 68v4M58 72c-3 4-7 3-9 0M58 72c3 4 7 3 9 0" fill="none" stroke-width="2.6"/>
    <path d="M31 61H20M32 67H22M85 61h11M84 67h10" stroke-width="2"/>
    <circle cx="39" cy="65" r="5" fill="#E58A7A" opacity=".35" stroke="none"/>
    <circle cx="77" cy="65" r="5" fill="#E58A7A" opacity=".35" stroke="none"/>
  </g>
</svg>`;

/* ============ 插圖 ============ */
function bgMarkup(bg) {
  if (bg === 'night') {
    return `<rect width="240" height="160" fill="#DFE7F4"/>
      <circle cx="30" cy="26" r="2" fill="#B6C6DF"/><circle cx="72" cy="44" r="1.6" fill="#B6C6DF"/>
      <circle cx="204" cy="26" r="2.2" fill="#B6C6DF"/><circle cx="178" cy="52" r="1.5" fill="#B6C6DF"/>
      <path d="M0 142q60-7 120 0t120 0" stroke="#BCCBE1" stroke-width="2.5" fill="none"/>`;
  }
  if (bg === 'grass') {
    return `<rect width="240" height="160" fill="#E8F3E4"/>
      <path d="M0 137q60-8 120 0t120 0" stroke="#A2C7AA" stroke-width="3" fill="none"/>
      <path d="M16 149c0-8 2-12 2-16M22 149c0-8-2-12-2-16M214 150c0-8 2-12 2-16M220 150c0-8-2-12-2-16" stroke="#A2C7AA" stroke-width="2"/>`;
  }
  if (bg === 'room') {
    return `<rect width="240" height="160" fill="#FBF0DC"/>
      <path d="M0 134h240" stroke="#DECBAA" stroke-width="2.5"/>
      <path d="M14 22l20-9M204 20l22 9M28 38l12-5M196 40l10-4" stroke="#E5D3B3" stroke-width="2"/>`;
  }
  return `<rect width="240" height="160" fill="#EAF4F8"/>
    <path d="M0 139q60-8 120 0t120 0" stroke="#BCD8E0" stroke-width="3" fill="none"/>
    <path d="M0 24c18-10 34-10 52 0M186 18c14-8 28-8 42 0" stroke="#D2E8EF" stroke-width="2.4" fill="none"/>`;
}

function renderArt(q) {
  const items = q.art || [];
  const lay = LAYOUT[items.length] || LAYOUT[2];
  let si = 0;
  const body = items.map((it) => {
    let t, x, y, s;
    if (typeof it === 'string') {
      t = it;
      const p = lay[si++] || [120, 84, 1];
      x = p[0]; y = p[1]; s = p[2];
    } else { t = it.t; x = it.x; y = it.y; s = it.s || 1; }
    return `<g transform="translate(${x} ${y}) scale(${s})">${ART[t] || ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 240 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    ${bgMarkup(q.bg || 'sky')}
    <g transform="rotate(-0.45 120 80)">${body}</g>
  </svg>`;
}

/* ============ 畫面切換 ============ */
function show(id) {
  ['screen-home', 'screen-play', 'screen-book'].forEach((s) => { $('#' + s).hidden = (s !== id); });
  window.scrollTo(0, 0);
}

function mascotHTML() { return MASCOT; }

/* ============ 首頁 ============ */
function renderHome() {
  $('#mascot-home').innerHTML = mascotHTML();
  $('#mascot-mini').innerHTML = mascotHTML();
  const data = Store.read();
  $$('.mode-card').forEach((card) => {
    const m = card.dataset.pick;
    const rec = data[m];
    const foot = card.querySelector('.mode-foot span');
    const base = '30 題 · 5 關 · 每關 6 題';
    if (rec && rec.stars && rec.stars.some((n) => n > 0)) {
      const total = rec.stars.reduce((a, b) => a + b, 0);
      foot.textContent = `${base} · 已獲 ${total}★`;
    } else { foot.textContent = base; }
  });
  syncSound();
}

/* ============ 音效按鈕 ============ */
function syncSound() {
  [['#sound-home'], ['#sound-play']].forEach(([sel]) => {
    const b = $(sel); if (!b) return;
    b.setAttribute('aria-pressed', S.soundOn ? 'true' : 'false');
    const icon = b.querySelector('svg');
    if (icon) icon.style.stroke = S.soundOn ? 'var(--ink)' : 'var(--ink-faint)';
    b.style.borderStyle = S.soundOn ? 'solid' : 'dashed';
    b.setAttribute('aria-label', S.soundOn ? '關閉音效' : '開啟音效');
  });
}
function toggleSound() {
  S.soundOn = !S.soundOn;
  const data = Store.read(); data.sound = S.soundOn; Store.write(data);
  syncSound();
  if (S.soundOn) SND.tap();
}

/* ============ 出題 ============ */
function buildDeck(qs) {
  const groups = {};
  qs.forEach((q) => { (groups[q.a] = groups[q.a] || []).push(q); });
  Object.values(groups).forEach((arr) => shuffle(arr));
  const cats = shuffle(Object.keys(groups));
  const seq = [];
  let more = true;
  while (more) {
    more = false;
    cats.forEach((c) => {
      if (groups[c].length) { seq.push(groups[c].shift()); more = true; }
    });
  }
  const deck = [];
  for (let i = 0; i < seq.length; i += 6) deck.push(seq.slice(i, i + 6));
  return deck;
}

function buildOptions(q) {
  const pool = MODES[S.mode].cats.filter((c) => c !== q.a);
  shuffle(pool);
  const opts = [q.a].concat(pool.slice(0, 3));
  return shuffle(opts);
}

function startGame(mode) {
  S.mode = mode;
  document.body.dataset.mode = mode;
  S.stars = [0, 0, 0, 0, 0];
  S.deck = buildDeck(MODES[mode].qs);
  startStage(0);
  SND.tap();
}

function hideLayers() {
  const ov = $('#overlay'), sh = $('#sheet');
  if (ov && !ov.hidden) ov.hidden = true;
  if (sh && !sh.hidden) sh.hidden = true;
}

function startStage(i) {
  if (S.busy) return;
  if (!S.deck[i]) return;
  S.busy = true;
  // 先收起結算層：避免模糊遮罩與新題插圖同時重繪，造成按「下一關」時的卡頓
  hideLayers();
  S.stage = i;
  S.stageQs = S.deck[i];
  S.qi = 0;
  S.correctFirst = 0;
  S.wrong = 0;
  $('#play-mode').textContent = MODES[S.mode].name;
  show('screen-play');
  renderQuestion();
  // 短暫鎖定：吸收換關瞬間的殘留觸控，避免誤按新題選項
  setTimeout(() => { S.busy = false; }, 220);
}

function renderQuestion() {
  const q = S.stageQs[S.qi];
  S.current = q;
  S.answered = false;
  $('#play-stage').textContent = '第 ' + (S.stage + 1) + ' 關';
  $('#hud-num').textContent = (S.qi + 1) + ' / 6';
  $('#hud-fill').style.width = (((S.qi + 1) / 6) * 100) + '%';
  $('#art-box').innerHTML = renderArt(q);
  $('#sentence').innerHTML = esc(q.s);
  $('#hint').textContent = '先慢慢讀一次句子，再選答案。留意那些「不像平常說話」的地方。';
  const mini = $('#mascot-mini');
  mini.classList.remove('happy', 'sad');

  const box = $('#options');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  buildOptions(q).forEach((cat, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('data-cat', cat);
    b.innerHTML = '<span class="idx">' + letters[i] + '</span><span class="txt">' + esc(cat) + '</span>';
    b.addEventListener('click', () => choose(cat, b));
    box.appendChild(b);
  });
}

/* ============ 作答 ============ */
function choose(cat, btn) {
  if (S.answered || S.busy) return;
  const q = S.current;
  if (cat === q.a) {
    S.answered = true;
    S.correctFirst++;
    btn.classList.add('correct');
    $$('#options .opt').forEach((b) => { b.disabled = true; });
    $('#sentence').innerHTML = markSentence(q);
    $('#hint').textContent = '抓到線索了！線索就藏在亮起來的字裡。';
    const mini = $('#mascot-mini');
    mini.classList.remove('sad'); void mini.offsetWidth; mini.classList.add('happy');
    SND.correct(); SND.stamp();
    setTimeout(() => openSheet(q), 380);
  } else {
    S.wrong++;
    btn.classList.add('wrong');
    btn.disabled = true;
    const mini = $('#mascot-mini');
    mini.classList.remove('happy'); void mini.offsetWidth; mini.classList.add('sad');
    SND.wrong();
    if (S.wrong === 1) {
      $('#hint').textContent = '不對哦。再讀一次句子，想想它有沒有把事物比作另一樣東西，或者把物當成人。';
    } else {
      $('#hint').textContent = '小提示：' + CATS[q.a].clue;
    }
  }
}

function markSentence(q) {
  let html = esc(q.s);
  (q.mk || []).forEach((m) => {
    const safe = esc(m);
    html = html.split(safe).join('<mark>' + safe + '</mark>');
  });
  return html;
}

function openSheet(q) {
  $('#sheet-title').innerHTML = '這是「<span class="cat">' + esc(q.a) + '</span>」';
  $('#sheet-why').textContent = q.why;
  $('#sheet-clue').textContent = '偵探筆記：' + CATS[q.a].clue;
  const last = S.qi >= S.stageQs.length - 1;
  $('#btn-next').firstChild.textContent = last ? '看看這一關的成績 ' : '下一題 ';
  $('#sheet').hidden = false;
  setTimeout(() => $('#btn-next').focus({ preventScroll: true }), 60);
}

function nextQuestion() {
  if (S.busy) return;
  $('#sheet').hidden = true;
  if (S.qi < S.stageQs.length - 1) {
    S.qi++;
    renderQuestion();
  } else {
    finishStage();
  }
}

/* ============ 結算 ============ */
function starsFor(correct) {
  if (correct >= 6) return 3;
  if (correct >= 4) return 2;
  return 1;
}

function starSVG(on) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6 6.2 20.7l1.1-6.5L2.6 9.6l6.5-.9Z" fill="' + (on ? '#F5C65B' : 'none') + '" stroke="#3D3831" stroke-width="1.7" stroke-linejoin="round"/></svg>';
}

function finishStage() {
  const got = starsFor(S.correctFirst);
  S.stars[S.stage] = got;
  const data = Store.read();
  const rec = data[S.mode] || { stars: [0, 0, 0, 0, 0] };
  rec.stars = rec.stars || [0, 0, 0, 0, 0];
  rec.stars[S.stage] = Math.max(rec.stars[S.stage] || 0, got);
  data[S.mode] = rec;
  Store.write(data);

  SND.win();
  $('#result-stars').innerHTML = [0, 1, 2].map((i) => starSVG(i < got)).join('');
  $('#result-title').textContent = got === 3 ? '太厲害了！' : (got === 2 ? '過關！' : '完成一關！');
  $('#result-sub').textContent = '第 ' + (S.stage + 1) + ' 關 · 一次答對 ' + S.correctFirst + ' / 6 題';
  $('#result-stats').innerHTML =
    '<div class="stat"><b>' + S.correctFirst + '</b><span>一次答對</span></div>' +
    '<div class="stat"><b>' + S.wrong + '</b><span>再試次數</span></div>' +
    '<div class="stat"><b>' + got + '★</b><span>本關星數</span></div>';

  const actions = $('#result-actions');
  actions.innerHTML = '';
  if (S.stage < 4) {
    actions.appendChild(mkBtn('下一關', 'strong', () => startStage(S.stage + 1)));
    actions.appendChild(mkBtn('再玩本關', '', () => startStage(S.stage)));
    actions.appendChild(mkBtn('回首頁', '', goHome));
  } else {
    actions.appendChild(mkBtn('看總成績', 'strong', showFinal));
    actions.appendChild(mkBtn('再玩一次', '', () => startGame(S.mode)));
    actions.appendChild(mkBtn('回首頁', '', goHome));
  }
  $('#overlay').hidden = false;
}

function showFinal() {
  const total = S.stars.reduce((a, b) => a + b, 0);
  const level = total >= 13 ? 3 : (total >= 9 ? 2 : 1);
  $('#result-stars').innerHTML = [0, 1, 2].map((i) => starSVG(i < level)).join('');
  $('#result-title').textContent = '全部通關！';
  const rank = total >= 13 ? '金牌小偵探' : (total >= 9 ? '銀牌小偵探' : '見習小偵探');
  $('#result-sub').textContent = '你完成了 ' + MODES[S.mode].name + ' 全部 5 關，獲得「' + rank + '」稱號。';
  $('#result-stats').innerHTML =
    '<div class="stat"><b>' + total + '</b><span>總星數 / 15</span></div>' +
    '<div class="stat"><b>' + MODES[S.mode].cats.length + '</b><span>修辭類型</span></div>' +
    '<div class="stat"><b>30</b><span>完成題數</span></div>';
  const actions = $('#result-actions');
  actions.innerHTML = '';
  actions.appendChild(mkBtn('再玩一次', 'strong', () => { hideLayers(); startGame(S.mode); }));
  actions.appendChild(mkBtn('翻開圖鑑', '', () => { openBook('result'); }));
  actions.appendChild(mkBtn('回首頁', '', () => { hideLayers(); goHome(); }));
  SND.win();
}

function mkBtn(text, cls, fn) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ghost-btn ' + (cls || '');
  b.textContent = text;
  b.addEventListener('click', fn);
  return b;
}

function goHome() {
  S.busy = false;
  hideLayers();
  renderHome();
  show('screen-home');
}

/* ============ 圖鑑 ============ */
function openBook(from) {
  S.bookReturn = from || 'home';
  if (S.bookReturn === 'result') $('#overlay').hidden = true;
  const cats = MODES[S.bookMode].cats;
  if (!cats.includes(S.bookCat)) S.bookCat = cats[0];
  renderBook();
  show('screen-book');
}

function renderBook() {
  const tabs = $('#book-tabs');
  tabs.innerHTML = '';
  const modes = [['low', '初小'], ['high', '高小']];
  modes.forEach(([m, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'book-tab';
    b.textContent = label;
    b.setAttribute('aria-selected', S.bookMode === m ? 'true' : 'false');
    b.addEventListener('click', () => {
      S.bookMode = m;
      S.bookCat = MODES[m].cats[0];
      renderBook();
      SND.tap();
    });
    tabs.appendChild(b);
  });
  const sep = document.createElement('span');
  sep.className = 'book-sep';
  tabs.appendChild(sep);

  MODES[S.bookMode].cats.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'book-tab';
    b.textContent = c;
    b.setAttribute('aria-selected', S.bookCat === c ? 'true' : 'false');
    b.addEventListener('click', () => { S.bookCat = c; renderBook(); SND.tap(); });
    tabs.appendChild(b);
  });

  const cat = CATS[S.bookCat];
  const inLow = MODES.low.cats.includes(S.bookCat);
  const inHigh = MODES.high.cats.includes(S.bookCat);
  const tag = inLow && inHigh ? '初小 · 高小' : (inLow ? '初小版' : '高小版');
  const qs = MODES[S.bookMode].qs.filter((q) => q.a === S.bookCat);
  const examples = qs.slice(0, 3);

  $('#book-body').innerHTML =
    '<article class="entry">' +
      '<h3>' + esc(S.bookCat) + '<span>' + tag + '</span></h3>' +
      '<p>' + esc(cat.def) + '</p>' +
      '<p class="eg">' + esc(cat.eg) + '</p>' +
      '<div class="how"><b>偵探提示：</b>' + esc(cat.clue) + '</div>' +
    '</article>' +
    '<article class="entry">' +
      '<h3>本版例句<span>' + MODES[S.bookMode].name + '</span></h3>' +
      examples.map((q) => '<p class="eg" style="margin-top:6px">' + esc(q.s) + '</p>').join('') +
      '<div class="how">在遊戲裡遇到不確定的句子，可以先回來讀一讀定義，再回去作答。</div>' +
    '</article>';
}

/* ============ 事件 ============ */
document.addEventListener('DOMContentLoaded', () => {
  const data = Store.read();
  if (typeof data.sound === 'boolean') S.soundOn = data.sound;
  renderHome();

  $$('.mode-card').forEach((card) => {
    card.addEventListener('click', () => startGame(card.dataset.pick));
  });
  $('#sound-home').addEventListener('click', toggleSound);
  $('#sound-play').addEventListener('click', toggleSound);
  $('#btn-open-book').addEventListener('click', () => openBook('home'));
  $('#btn-book-back').addEventListener('click', () => {
    if (S.bookReturn === 'result') { show('screen-play'); $('#overlay').hidden = false; }
    else if (S.bookReturn === 'home') { show('screen-home'); }

  });
  $('#btn-home').addEventListener('click', goHome);
  $('#btn-next').addEventListener('click', nextQuestion);

  document.addEventListener('keydown', (e) => {
    if (!$('#sheet').hidden && (e.key === 'Enter' || e.key === ' ')) {
      if (document.activeElement && document.activeElement.id === 'btn-next') return;
      e.preventDefault(); nextQuestion(); return;
    }
    if ($('#screen-play').hidden || !$('#sheet').hidden) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      const b = $$('#options .opt')[n - 1];
      if (b && !b.disabled) b.click();
    }
  });
});

</script>
