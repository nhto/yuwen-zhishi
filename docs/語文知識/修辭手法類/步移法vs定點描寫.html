<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>描寫小達人｜步移法 × 定點描寫</title>
<meta name="description" content="小學中文描寫手法互動遊戲：透過教學卡、路線排序、層次標籤與兩種挑戰模式，學會步移法與定點描寫。">
<meta name="theme-color" content="#FFF6E6">
<style>
:root{
  --ink:#2F2A44;
  --ink-soft:#5A5470;
  --cream:#FFF6E6;
  --paper:#FFFDF8;
  --coral:#FF7A6B;
  --coral-soft:#FFE3DE;
  --teal:#2FBFAD;
  --teal-soft:#D9F5F0;
  --sun:#FFC94A;
  --sun-soft:#FFF0C9;
  --sky:#6EC1E4;
  --sky-soft:#DDF1FA;
  --purple:#9B8CFF;
  --purple-soft:#ECE8FF;
  --green:#5FBF6E;
  --green-soft:#DDF4DF;
  --red:#E4574C;
  --red-soft:#FFE1DE;
  --shadow:0 6px 0 rgba(47,42,68,.14);
  --line:3px solid var(--ink);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:clamp(18px,1.7vw,21px);
  line-height:1.65;
  overflow-x:hidden;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,201,74,.28) 0 9px, transparent 10px),
    radial-gradient(circle at 88% 12%, rgba(110,193,228,.26) 0 7px, transparent 8px),
    radial-gradient(circle at 78% 82%, rgba(255,122,107,.20) 0 8px, transparent 9px),
    radial-gradient(circle at 8% 76%, rgba(47,191,173,.20) 0 10px, transparent 11px),
    radial-gradient(rgba(47,42,68,.09) 1.2px, transparent 1.3px);
  background-size:auto,auto,auto,auto,26px 26px;
  pointer-events:none;
  z-index:0;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
h1,h2,h3,h4,p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
svg{display:block;}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:8px;}

.app{position:relative;z-index:1;padding-bottom:calc(28px + env(safe-area-inset-bottom));}
.wrap{width:min(100%,1040px);margin:0 auto;padding:0 clamp(14px,3vw,26px);}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,246,230,.92);
  backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
}
.topbar-in{
  width:min(100%,1040px);margin:0 auto;
  padding:8px clamp(14px,3vw,26px);
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.brand-mark{width:clamp(38px,6vw,46px);flex:0 0 auto;}
.brand-txt{min-width:0;}
.brand-txt strong{
  display:block;font-size:clamp(17px,2.2vw,21px);font-weight:900;letter-spacing:.02em;white-space:nowrap;
}
.brand-txt span{display:block;font-size:clamp(11px,1.4vw,13px);color:var(--ink-soft);font-weight:700;letter-spacing:.08em;white-space:nowrap;}
.icon-btn{
  width:clamp(44px,7vw,50px);height:clamp(44px,7vw,50px);
  flex:0 0 auto;display:grid;place-items:center;
  background:var(--paper);border:var(--line);border-radius:14px;
  box-shadow:0 4px 0 rgba(47,42,68,.16);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(47,42,68,.16);}
.icon-btn svg{width:60%;height:60%;}
.icon-btn.is-off{background:#EFE8DA;}
.icon-btn.is-off::after{
  content:"";position:absolute;left:50%;top:50%;width:60%;height:3px;background:var(--red);
  transform:translate(-50%,-50%) rotate(-45deg);border-radius:3px;
}
.icon-btn{position:relative;}

/* ---------- generic ---------- */
.screen{display:none;}
.screen.active{display:block;animation:fadeUp .3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.panel{
  background:var(--paper);
  border:var(--line);
  border-radius:clamp(18px,3vw,26px);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:clamp(48px,7vw,56px);
  padding:10px clamp(18px,3.2vw,28px);
  border:var(--line);border-radius:999px;
  background:var(--paper);font-weight:900;
  box-shadow:0 5px 0 rgba(47,42,68,.22);
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  text-align:center;line-height:1.25;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(47,42,68,.22);}
.btn.primary{background:var(--coral);color:var(--ink);}
.btn.teal{background:var(--teal);color:var(--ink);}
.btn.sun{background:var(--sun);}
.btn.ghost{background:var(--paper);}
.btn:disabled{opacity:.45;box-shadow:0 5px 0 rgba(47,42,68,.12);cursor:not-allowed;}
.btn-lg{min-height:clamp(54px,8vw,64px);font-size:clamp(18px,2.1vw,21px);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--sun-soft);border:2.5px solid var(--ink);border-radius:999px;
  padding:3px 14px;font-size:clamp(12px,1.5vw,14px);font-weight:900;letter-spacing:.12em;
}

/* ---------- home ---------- */
.home{padding-top:clamp(14px,2.6vw,26px);}
.hero{
  display:grid;gap:clamp(14px,2.5vw,22px);
  align-items:center;
  margin-bottom:clamp(18px,3vw,26px);
}
@media(min-width:760px){.hero{grid-template-columns:1.05fr .95fr;}}
.hero-copy h1{
  font-size:clamp(30px,5.6vw,52px);
  line-height:1.16;font-weight:900;letter-spacing:.01em;
  margin:10px 0 10px;
}
.hero-copy h1 em{font-style:normal;color:var(--coral);position:relative;white-space:nowrap;}
.hero-copy h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:.02em;height:.16em;
  background:var(--sun);z-index:-1;border-radius:4px;opacity:.85;
}
.hero-copy p{color:var(--ink-soft);font-weight:700;font-size:clamp(15px,1.9vw,18px);max-width:34em;}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.fact{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-size:clamp(12px,1.6vw,14px);font-weight:900;
}
.fact svg{width:1.15em;height:1.15em;flex:0 0 auto;}
.hero-art{position:relative;}
.hero-art .panel{padding:0;overflow:hidden;background:#C7EBF7;}
.hero-art svg{width:100%;height:auto;}
.hero-badge{
  position:absolute;right:-6px;top:-14px;transform:rotate(7deg);
  background:var(--sun);border:3px solid var(--ink);border-radius:16px;
  padding:6px 14px;font-weight:900;font-size:clamp(12px,1.7vw,15px);
  box-shadow:0 4px 0 rgba(47,42,68,.2);
}

.section-title{display:flex;align-items:center;gap:10px;margin:6px 0 14px;}
.section-title h2{font-size:clamp(20px,2.7vw,26px);font-weight:900;letter-spacing:.02em;}
.section-title .dash{flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 16px);opacity:.3;border-radius:2px;}

.mode-grid{display:grid;gap:clamp(12px,2vw,18px);grid-template-columns:1fr;}
@media(min-width:640px){.mode-grid{grid-template-columns:1fr 1fr;}}
.mode-card{
  position:relative;display:flex;align-items:flex-start;gap:clamp(10px,1.8vw,16px);
  padding:clamp(14px,2.2vw,20px);
  text-align:left;width:100%;
  background:var(--paper);border:var(--line);border-radius:24px;
  box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease;
  overflow:hidden;
}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(47,42,68,.15);}
.mode-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(47,42,68,.15);}
.mode-ico{
  width:clamp(54px,8vw,68px);height:clamp(54px,8vw,68px);flex:0 0 auto;
  border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;
}
.mode-ico svg{width:66%;height:66%;}
.mode-body{min-width:0;flex:1;}
.mode-body .mh{display:block;font-size:clamp(18px,2.3vw,22px);font-weight:900;line-height:1.25;margin-bottom:4px;}
.mode-body .mp{text-wrap:balance;display:block;font-size:clamp(13.5px,1.7vw,15.5px);color:var(--ink-soft);font-weight:700;line-height:1.5;}
.mode-tag{
  position:absolute;right:14px;top:12px;
  font-size:clamp(11px,1.4vw,12.5px);font-weight:900;letter-spacing:.06em;
  background:var(--sun-soft);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;
}
.mode-card.c1 .mode-ico{background:var(--coral-soft);}
.mode-card.c2 .mode-ico{background:var(--teal-soft);}
.mode-card.c3 .mode-ico{background:var(--sky-soft);}
.mode-card.c4 .mode-ico{background:var(--purple-soft);}
.mode-card.best{padding-bottom:clamp(30px,3.4vw,38px);}
.mode-card.best::after{
  content:"最佳 " attr(data-best) "%";
  position:absolute;right:12px;bottom:10px;
  font-size:11px;font-weight:900;color:var(--ink-soft);
  background:#F3EEDF;border-radius:999px;padding:2px 9px;
}

/* ---------- teach ---------- */
.screen-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:clamp(12px,2vw,18px) 0 12px;
}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:900;font-size:clamp(13px,1.7vw,15px);box-shadow:0 3px 0 rgba(47,42,68,.15);}
.back-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(47,42,68,.15);}
.back-btn svg{width:16px;height:16px;}
.screen-head h2{font-size:clamp(20px,3vw,28px);font-weight:900;margin-left:2px;}
.teach-progress{display:flex;gap:6px;margin-left:auto;}
.teach-progress i{width:9px;height:9px;border-radius:50%;background:#DCD3C2;display:block;}
.teach-progress i.on{background:var(--coral);}

.challenge-lead{font-weight:800;font-size:clamp(16px,2.1vw,19px);line-height:1.6;margin:2px 0 14px;}
.teach-card{display:grid;gap:clamp(14px,2.4vw,22px);padding:clamp(14px,2.2vw,20px);}
#screen-teach.active{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 72px);min-height:calc(100dvh - 72px);}
@media(min-width:820px){.teach-card{grid-template-columns:1.02fr .98fr;align-items:stretch;}}
.teach-art{border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#C7EBF7;position:relative;}
.teach-art svg{width:100%;height:100%;min-height:clamp(200px,34vw,320px);}
.teach-txt{min-width:0;display:flex;flex-direction:column;gap:10px;}
.teach-txt h3{font-size:clamp(24px,4vw,34px);font-weight:900;line-height:1.2;}
.teach-txt .lead{font-size:clamp(17px,2.1vw,19px);font-weight:800;color:var(--ink-soft);}
.chant{
  text-wrap:balance;
  background:var(--sun-soft);border:2.5px dashed var(--ink);border-radius:16px;
  padding:10px 14px;font-weight:900;font-size:clamp(16px,2.1vw,19px);line-height:1.5;
}
.points{display:flex;flex-direction:column;gap:8px;}
.points li{display:flex;align-items:flex-start;gap:9px;font-weight:700;font-size:clamp(16px,2vw,18px);line-height:1.5;}
.points .num{
  flex:0 0 auto;width:1.65em;height:1.65em;border-radius:50%;background:var(--teal);color:var(--ink);
  display:grid;place-items:center;font-weight:900;font-size:.86em;border:2px solid var(--ink);margin-top:.1em;
}
.points .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--coral);margin-top:.55em;}
.tagline{display:flex;flex-wrap:wrap;gap:6px;}
.tagline span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:clamp(12.5px,1.6vw,14px);font-weight:900;}
.compare{width:100%;border-collapse:separate;border-spacing:0;font-size:clamp(15px,1.9vw,17.5px);}
.compare th,.compare td{border-bottom:2px solid rgba(47,42,68,.16);padding:8px 10px;text-align:left;vertical-align:top;}
.compare thead th{background:var(--sun-soft);font-weight:900;border-bottom:2.5px solid var(--ink);}
.compare thead th:first-child{border-top-left-radius:12px;}
.compare thead th:last-child{border-top-right-radius:12px;}
.compare td:first-child{font-weight:900;color:var(--ink-soft);white-space:nowrap;}
.compare tr:last-child td{border-bottom:none;}
.teach-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;}
.teach-nav .btn{flex:1;max-width:220px;}

/* ---------- game ---------- */
.game-top{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:clamp(10px,1.8vw,16px) 0 10px;
}
.game-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(16px,2.1vw,19px);min-width:0;}
.game-title .pill{background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.8em;}
.progress-dots{display:flex;gap:6px;margin-left:auto;}
.progress-dots i{width:clamp(9px,1.5vw,11px);height:clamp(9px,1.5vw,11px);border-radius:50%;background:#E2D9C8;border:2px solid rgba(47,42,68,.18);display:block;}
.progress-dots i.done{background:var(--teal);border-color:var(--ink);}
.progress-dots i.now{background:var(--coral);border-color:var(--ink);transform:scale(1.15);}
@media(max-width:560px){
  .game-title{flex:1 1 auto;font-size:clamp(15.5px,4.2vw,18px);}
  .score-chip{order:3;margin-left:auto;}
  .progress-dots{order:5;flex-basis:100%;margin-left:0;justify-content:flex-end;}
}
.score-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:2px 11px;font-weight:900;font-size:clamp(13px,1.7vw,15px);}
.score-chip svg{width:1.1em;height:1.1em;}

.game-main{display:grid;gap:clamp(12px,2vw,20px);align-items:start;}
@media(min-width:900px){.game-main{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);}}
.game-visual{position:sticky;top:78px;}
@media(max-width:899px){.game-visual{position:static;}}
.game-visual .panel{overflow:hidden;padding:0;background:#C7EBF7;}
.game-visual svg{width:100%;height:auto;display:block;}
.visual-cap{
  display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;
  border-top:3px solid var(--ink);font-weight:800;font-size:clamp(13px,1.7vw,15px);color:var(--ink-soft);
}
.visual-cap .pin{width:1.3em;height:1.3em;flex:0 0 auto;}

.q-card{padding:clamp(14px,2.2vw,20px);}
.q-kicker{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.q-kicker span{background:var(--coral-soft);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:clamp(12px,1.5vw,13.5px);font-weight:900;letter-spacing:.06em;}
.q-text{text-wrap:balance;font-size:clamp(21px,2.8vw,28px);font-weight:900;line-height:1.5;}
.q-sub{font-size:clamp(15px,1.9vw,17px);color:var(--ink-soft);font-weight:700;margin-top:4px;}

/* step game */
.slots{display:grid;gap:8px;margin:12px 0;}
.slot{
  display:flex;align-items:center;gap:10px;
  min-height:clamp(50px,7vw,56px);
  padding:8px 12px;border:2.5px dashed rgba(47,42,68,.35);border-radius:14px;
  background:#FBF6EA;font-weight:800;font-size:clamp(16px,2vw,18.5px);
  color:#6E6659;text-align:left;width:100%;
}
.slot .idx{
  flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;
  background:#E6DECE;border:2px solid rgba(47,42,68,.25);
  display:grid;place-items:center;font-weight:900;font-size:.86em;color:var(--ink-soft);
}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(47,42,68,.12);}
.slot.filled .idx{background:var(--sun);border-color:var(--ink);color:var(--ink);}
.slot.ok{background:var(--green-soft);border-color:var(--green);}
.slot.no{background:var(--red-soft);border-color:var(--red);}
.slot .mark{margin-left:auto;font-weight:900;font-size:1.1em;}
.slot .mark.ok{color:var(--green);}
.slot .mark.no{color:var(--red);}

.opt-list{display:grid;gap:8px;margin-top:6px;}
.opt{
  display:flex;align-items:flex-start;gap:10px;
  min-height:clamp(50px,7vw,56px);
  padding:10px 13px;text-align:left;width:100%;
  background:#fff;border:2.5px solid var(--ink);border-radius:14px;
  font-weight:800;font-size:clamp(16px,2.1vw,19px);line-height:1.45;
  box-shadow:0 3px 0 rgba(47,42,68,.14);
  transition:transform .1s ease, background .15s ease;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(47,42,68,.14);}
.opt .bul{
  flex:0 0 auto;width:1.55em;height:1.55em;border-radius:8px;
  background:var(--sky-soft);border:2px solid var(--ink);
  display:grid;place-items:center;font-weight:900;font-size:.8em;margin-top:.1em;
}
.opt.used{opacity:.4;}
.opt.ok{background:var(--green-soft);border-color:var(--green);}
.opt.no{background:var(--red-soft);border-color:var(--red);}
.opt:disabled{cursor:default;}
.q-card.locked .opt,.q-card.locked .pick,.q-card.locked .chip,.q-card.locked .slot{pointer-events:none;}

/* point game */
.sentence-list{display:grid;gap:10px;margin-top:12px;}
.sent{
  background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:10px 12px;box-shadow:0 3px 0 rgba(47,42,68,.12);
}
.sent p{font-weight:800;font-size:clamp(17px,2.2vw,20px);line-height:1.55;}
.sent .lv-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.chip{
  flex:1 1 0;min-width:74px;min-height:clamp(44px,6vw,48px);
  border:2.5px solid var(--ink);border-radius:11px;background:#FBF6EA;
  font-weight:900;font-size:clamp(14.5px,1.85vw,16px);
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  transition:background .14s ease, transform .1s ease;
}
.chip:active{transform:translateY(2px);}
.chip.on{background:var(--sun);box-shadow:inset 0 0 0 2px #fff;}
.chip.ok{background:var(--green-soft);border-color:var(--green);}
.chip.no{background:var(--red-soft);border-color:var(--red);}
.sent-why{margin-top:8px;font-size:clamp(13px,1.7vw,15px);font-weight:700;color:var(--ink-soft);border-top:2px dashed rgba(47,42,68,.2);padding-top:7px;display:none;}
.sent.revealed .sent-why{display:block;}
.sent.revealed .lv-row{opacity:.55;}

/* challenge */
.passage{
  background:#FBF6EA;border:2.5px solid var(--ink);border-radius:16px;
  padding:clamp(12px,2vw,16px);font-size:clamp(18px,2.3vw,21px);font-weight:800;line-height:1.8;
}
.passage b{background:var(--sun);border-radius:4px;padding:0 3px;}
.pick-row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px;}
@media(max-width:360px){.pick-row{grid-template-columns:1fr;}}
.pick{
  min-height:clamp(64px,10vw,76px);border:3px solid var(--ink);border-radius:18px;
  background:#fff;font-weight:900;font-size:clamp(17px,2.3vw,21px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 4px 0 rgba(47,42,68,.16);
  transition:transform .1s ease, background .15s ease;
}
.pick:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(47,42,68,.16);}
.pick small{font-size:.62em;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
.pick.ok{background:var(--green-soft);border-color:var(--green);}
.pick.no{background:var(--red-soft);border-color:var(--red);}
.pick:disabled{cursor:default;}

/* feedback */
.feedback{display:none;margin-top:14px;}
.feedback.show{display:block;animation:pop .25s ease both;}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.fb-box{
  border:3px solid var(--ink);border-radius:18px;padding:clamp(12px,2vw,16px);
  background:var(--green-soft);
}
.fb-box.bad{background:var(--red-soft);}
.fb-head{display:flex;align-items:center;gap:9px;font-weight:900;font-size:clamp(17px,2.2vw,20px);margin-bottom:6px;}
.fb-ico{width:1.7em;height:1.7em;flex:0 0 auto;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:#fff;}
.fb-ico svg{width:70%;height:70%;}
.fb-body{text-wrap:pretty;font-weight:700;font-size:clamp(14.5px,1.9vw,17px);line-height:1.7;}
.fb-body strong{background:#fff;border-radius:5px;padding:0 4px;}
.fb-list{margin-top:6px;display:grid;gap:3px;}
.fb-list li{font-size:clamp(13.5px,1.75vw,15.5px);font-weight:700;padding-left:1.1em;position:relative;}
.fb-list li::before{content:"·";position:absolute;left:.25em;font-weight:900;}
.fb-next{display:flex;justify-content:flex-end;margin-top:10px;}
.fb-next .btn{width:100%;}
@media(min-width:520px){.fb-next .btn{width:auto;min-width:180px;}}

/* result */
.result-wrap{max-width:640px;margin:clamp(16px,4vw,40px) auto;padding:clamp(18px,3vw,30px);text-align:center;}
.result-stars{display:flex;justify-content:center;gap:8px;margin:6px 0 8px;}
.result-stars svg{width:clamp(44px,8vw,60px);height:clamp(44px,8vw,60px);}
.result-stars .off{opacity:.22;}
.result-wrap h2{text-wrap:balance;font-size:clamp(24px,4.4vw,34px);font-weight:900;line-height:1.25;}
.result-score{font-size:clamp(40px,8vw,64px);font-weight:900;color:var(--coral);line-height:1.1;margin:6px 0;}
.result-score small{font-size:.35em;color:var(--ink-soft);font-weight:800;}
.result-msg{font-weight:800;color:var(--ink-soft);font-size:clamp(15px,2vw,18px);margin-bottom:16px;}
.result-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.stat{background:#FBF6EA;border:2.5px solid var(--ink);border-radius:14px;padding:7px 16px;min-width:96px;}
.stat b{display:block;font-size:clamp(20px,3.2vw,26px);line-height:1.2;}
.stat span{font-size:clamp(11.5px,1.6vw,13px);font-weight:800;color:var(--ink-soft);}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* misc */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.hint-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:clamp(13px,1.7vw,15px);font-weight:800;color:var(--ink-soft);}
.hint-line svg{width:1.25em;height:1.25em;flex:0 0 auto;}
.footer-note{text-align:center;color:var(--ink-soft);font-size:clamp(12.5px,1.6vw,13.5px);font-weight:700;margin-top:22px;}

@media(max-width:380px){.chip{min-width:0;font-size:13.5px;}}
@media (prefers-reduced-motion: reduce){

}

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    screen: "home",
    teachIdx: 0,
    mode: null,
    idx: 0,
    score: 0,
    total: 0,
    answered: false,
    selection: [],
    labels: {},
    picks: {}
  };

  /* 為每句描寫建立穩定識別碼（判定與畫面位置脫鉤） */
  POINT.forEach(function (q, qi) {
    q.items.forEach(function (it, ii) { it.id = "p" + (qi + 1) + "abcd".charAt(ii); });
  });
  C2.forEach(function (q, qi) {
    q.items.forEach(function (it, ii) { it.id = "c" + (qi + 1) + "abcd".charAt(ii); });
  });

  /* ---------------- 音效（Web Audio 即時合成，無外部檔案） ---------------- */
  var Sound = {
    ctx: null,
    on: true,
    init: function () {
      if (!this.ctx) {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) { this.ctx = null; }
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume().catch(function () {});
      }
    },
    tone: function (freq, delay, dur, type, vol) {
      if (!this.ctx) return;
      var t0 = this.ctx.currentTime + delay;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.11, t0 + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(this.ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    },
    play: function (name) {
      if (!this.on) return;
      this.init();
      if (!this.ctx) return;
      if (name === "click") {
        this.tone(640, 0, 0.07, "triangle", 0.08);
      } else if (name === "select") {
        this.tone(520, 0, 0.06, "triangle", 0.07);
        this.tone(780, 0.05, 0.08, "triangle", 0.06);
      } else if (name === "correct") {
        this.tone(523.25, 0, 0.16, "sine", 0.12);
        this.tone(659.25, 0.09, 0.16, "sine", 0.12);
        this.tone(783.99, 0.18, 0.24, "sine", 0.13);
      } else if (name === "partial") {
        this.tone(587.33, 0, 0.14, "sine", 0.1);
        this.tone(698.46, 0.1, 0.18, "sine", 0.1);
      } else if (name === "wrong") {
        this.tone(220, 0, 0.14, "sawtooth", 0.07);
        this.tone(164.81, 0.1, 0.22, "sawtooth", 0.06);
      } else if (name === "next") {
        this.tone(440, 0, 0.07, "triangle", 0.07);
      } else if (name === "finish") {
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
          Sound.tone(f, i * 0.12, 0.3, "sine", 0.12);
        });
      }
    }
  };

  /* ---------------- 本機最佳成績 ---------------- */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  var BEST_KEY = "miao_best_v1_";

  function refreshBest() {
    ["step", "point", "c1", "c2"].forEach(function (m) {
      var card = document.querySelector('.mode-card[data-mode="' + m + '"]');
      if (!card) return;
      var v = lsGet(BEST_KEY + m);
      if (v !== null && v !== "") {
        card.classList.add("best");
        card.setAttribute("data-best", v);
      }
    });
  }

  /* ---------------- 畫面切換 ---------------- */
  function show(name) {
    var all = document.querySelectorAll(".screen");
    for (var i = 0; i < all.length; i++) {
      all[i].classList.toggle("active", all[i].id === "screen-" + name);
    }
    state.screen = name;
    window.scrollTo(0, 0);
  }

  /* ---------------- 教學區 ---------------- */
  function renderTeach() {
    var t = TEACH[state.teachIdx];
    $("teachArt").innerHTML = SCENES[t.art]();
    var html = "<h3>" + t.title + "</h3>";
    html += '<p class="lead">' + t.lead + "</p>";
    t.blocks.forEach(function (b) {
      if (b.t === "chant") {
        html += '<div class="chant">口訣：' + b.text + "</div>";
      } else if (b.t === "points") {
        html += '<ul class="points">';
        b.items.forEach(function (it, i) {
          html += '<li><span class="num">' + (i + 1) + "</span><span>" + it + "</span></li>";
        });
        html += "</ul>";
      } else if (b.t === "tags") {
        html += '<div class="tagline">';
        b.items.forEach(function (it) { html += "<span>" + it + "</span>"; });
        html += "</div>";
      } else if (b.t === "table") {
        html += '<div style="overflow-x:auto"><table class="compare"><thead><tr>';
        b.head.forEach(function (h) { html += "<th>" + h + "</th>"; });
        html += "</tr></thead><tbody>";
        b.rows.forEach(function (r) {
          html += "<tr>";
          r.forEach(function (c) { html += "<td>" + c + "</td>"; });
          html += "</tr>";
        });
        html += "</tbody></table></div>";
      }
    });
    $("teachTxt").innerHTML = html;

    var dots = "";
    TEACH.forEach(function (_, i) {
      dots += '<i class="' + (i === state.teachIdx ? "on" : "") + '"></i>';
    });
    $("teachDots").innerHTML = dots;
    $("teachCount").textContent = (state.teachIdx + 1) + " / " + TEACH.length;
    $("teachPrev").disabled = state.teachIdx === 0;
    $("teachNext").textContent = state.teachIdx === TEACH.length - 1 ? "去練習" : "下一步";
  }

  function openTeach(i) {
    state.teachIdx = i;
    renderTeach();
    show("teach");
    Sound.play("click");
  }

  $("teachPrev").addEventListener("click", function () {
    if (state.teachIdx > 0) {
      state.teachIdx--;
      renderTeach();
      Sound.play("click");
    }
  });
  $("teachNext").addEventListener("click", function () {
    if (state.teachIdx < TEACH.length - 1) {
      state.teachIdx++;
      renderTeach();
      Sound.play("click");
    } else {
      startMode("step");
    }
  });

  /* ---------------- 遊戲共用 ---------------- */
  function startMode(mode) {
    state.mode = mode;
    state.idx = 0;
    state.score = 0;
    state.total = 0;
    resetRound();
    show("game");
    renderGame();
    Sound.play("select");
  }

  function resetRound() {
    state.answered = false;
    state.selection = [];
    state.labels = {};
    state.picks = {};
  }

  function renderDots() {
    var html = "";
    for (var i = 0; i < MODES[state.mode].total; i++) {
      var cls = i < state.idx ? "done" : (i === state.idx ? "now" : "");
      html += '<i class="' + cls + '"></i>';
    }
    $("progressDots").innerHTML = html;
    $("scoreTxt").textContent = state.score;
  }

  function renderGame() {
    var mode = state.mode;
    var meta = MODES[mode];
    $("qCard").classList.remove("locked");
    $("gameTitle").innerHTML = meta.name + ' <span class="pill">' + meta.sub + "</span>";
    renderDots();

    if (mode === "step") {
      var qs = STEP[state.idx];
      $("gameArt").innerHTML = SCENES[qs.scene]();
      $("visualCap").textContent = qs.cap;
      buildStep(qs);
    } else if (mode === "point") {
      var qp = POINT[state.idx];
      $("gameArt").innerHTML = SCENES[qp.scene]();
      $("visualCap").textContent = qp.cap;
      buildPoint(qp);
    } else if (mode === "c1") {
      var q1 = C1[state.idx];
      $("gameArt").innerHTML = SCENES[q1.scene]();
      $("visualCap").textContent = q1.cap;
      buildC1(q1);
    } else {
      var q2 = C2[state.idx];
      $("gameArt").innerHTML = SCENES[q2.scene]();
      $("visualCap").textContent = q2.cap;
      buildC2(q2);
    }
  }

  function headHTML(label, tone, unit) {
    return '<div class="q-kicker"><span>第 ' + (state.idx + 1) + " " + (unit || "題") + "</span>" +
      '<span style="background:' + tone + '">' + label + "</span></div>";
  }

  /* ---------------- 步移法：路線排序 ---------------- */
  function buildStep(q) {
    var html = headHTML("路線排序", "#D9F5F0");
    html += '<p class="q-text">' + q.prompt + "</p>";
    html += '<p class="q-sub">提示：留意「走進、經過、來到、最後」這些位置詞。</p>';
    html += '<div class="slots" id="stepSlots">';
    for (var i = 0; i < 4; i++) {
      html += '<button class="slot" type="button" data-act="slot" data-slot="' + i + '">' +
        '<span class="idx">' + (i + 1) + '</span><span class="txt">點選下面的句子</span>' +
        '<span class="mark"></span></button>';
    }
    html += "</div>";
    html += '<div class="opt-list">';
    q.disp.forEach(function (di) {
      var s = q.steps[di];
      html += '<button class="opt" type="button" data-act="opt" data-opt="' + s.id + '">' +
        '<span class="bul">＋</span><span>' + s.t + "</span></button>";
    });
    html += "</div>";
    html += '<div class="btn-row" id="actionRow" style="margin-top:14px">' +
      '<button class="btn primary btn-lg" type="button" data-act="check" id="checkBtn" disabled>確定答案</button></div>';
    html += '<div class="feedback" id="fb" aria-live="polite"></div>';
    $("qCard").innerHTML = html;
    paintStep();
  }

  function paintStep() {
    var q = STEP[state.idx];
    var slots = document.querySelectorAll("#stepSlots .slot");
    for (var i = 0; i < slots.length; i++) {
      var el = slots[i];
      var id = state.selection[i];
      var step = null;
      if (id) {
        for (var j = 0; j < q.steps.length; j++) {
          if (q.steps[j].id === id) step = q.steps[j];
        }
      }
      el.classList.toggle("filled", !!step);
      el.querySelector(".txt").textContent = step ? step.t : "點選下面的句子";
      el.querySelector(".mark").textContent = "";
    }
    var opts = document.querySelectorAll("#qCard .opt");
    for (var k = 0; k < opts.length; k++) {
      var used = state.selection.indexOf(opts[k].getAttribute("data-opt")) >= 0;
      opts[k].classList.toggle("used", used);
    }
    var btn = $("checkBtn");
    if (btn) btn.disabled = state.selection.length !== 4;
  }

  function checkStep() {
    var q = STEP[state.idx];
    var ok = 0;
    var slots = document.querySelectorAll("#stepSlots .slot");
    for (var i = 0; i < 4; i++) {
      var chosen = state.selection[i];
      var right = q.steps[i].id;
      var good = chosen === right;
      if (good) ok++;
      slots[i].classList.add(good ? "ok" : "no");
      slots[i].querySelector(".mark").textContent = good ? "✓" : "✗";
      slots[i].querySelector(".mark").className = "mark " + (good ? "ok" : "no");
    }
    finishRound(ok, 4, q.why, buildRouteList(q));
  }

  function buildRouteList(q) {
    var out = '<ul class="fb-list">';
    q.steps.forEach(function (s, i) {
      out += "<li>" + "①②③④".charAt(i) + " " + s.t + "</li>";
    });
    return out + "</ul>";
  }

  /* ---------------- 定點描寫：層次標籤 ---------------- */
  function buildPoint(q) {
    var html = headHTML("層次標籤", "#DDF1FA");
    html += '<p class="q-text">' + q.prompt + "</p>";
    html += '<p class="q-sub">提示：先找最遠的景物，再一路拉近到身邊。</p>';
    html += '<div class="sentence-list">';
    var order = q.disp || q.items.map(function (_, i) { return i; });
    order.forEach(function (di) {
      var it = q.items[di];
      html += '<div class="sent" id="sent-' + it.id + '">';
      html += "<p>" + it.t + "</p>";
      html += '<div class="lv-row">';
      [["far", "遠景"], ["mid", "中景"], ["near", "近景"]].forEach(function (lv) {
        html += '<button class="chip" type="button" data-act="label" data-id="' + it.id + '" data-lv="' + lv[0] + '">' + lv[1] + "</button>";
      });
      html += "</div>";
      html += '<p class="sent-why">' + it.why + "</p>";
      html += "</div>";
    });
    html += "</div>";
    html += '<div class="btn-row" id="actionRow" style="margin-top:14px">' +
      '<button class="btn primary btn-lg" type="button" data-act="check" id="checkBtn" disabled>確定答案</button></div>';
    html += '<div class="feedback" id="fb" aria-live="polite"></div>';
    $("qCard").innerHTML = html;
    paintPoint();
  }

  function paintPoint() {
    var q = POINT[state.idx];
    var chips = document.querySelectorAll('[data-act="label"]');
    for (var i = 0; i < chips.length; i++) {
      var id = chips[i].getAttribute("data-id");
      var lv = chips[i].getAttribute("data-lv");
      chips[i].classList.toggle("on", state.labels[id] === lv);
    }
    var btn = $("checkBtn");
    if (btn) btn.disabled = Object.keys(state.labels).length < q.items.length;
  }

  function checkPoint() {
    var q = POINT[state.idx];
    var ok = 0;
    q.items.forEach(function (it) {
      var chosen = state.labels[it.id];
      var good = chosen === it.lv;
      if (good) ok++;
      var box = $("sent-" + it.id);
      box.classList.add("revealed");
      var chips = box.querySelectorAll('[data-act="label"]');
      for (var i = 0; i < chips.length; i++) {
        var lv = chips[i].getAttribute("data-lv");
        if (lv === it.lv) chips[i].classList.add("ok");
        if (lv === chosen && !good) chips[i].classList.add("no");
      }
    });
    finishRound(ok, q.items.length, q.why, '<p style="font-size:.92em;opacity:.85">每句下方的說明，就是判斷的依據。</p>');
  }

  /* ---------------- 挑戰一：快閃判斷 ---------------- */
  function buildC1(q) {
    var html = headHTML("快閃判斷", "#ECE8FF");
    html += '<p class="q-text">讀一讀，這段話用了哪一種描寫方法？</p>';
    html += '<div class="passage">' + q.passage + "</div>";
    html += '<div class="pick-row">';
    html += '<button class="pick" type="button" data-act="answer" data-a="step">步移法<small>人一直走動</small></button>';
    html += '<button class="pick" type="button" data-act="answer" data-a="point">定點描寫<small>站定一個位置</small></button>';
    html += "</div>";
    html += '<div class="feedback" id="fb" aria-live="polite"></div>';
    $("qCard").innerHTML = html;
  }

  function checkC1(chosen) {
    var q = C1[state.idx];
    var good = chosen === q.answer;
    var picks = document.querySelectorAll("#qCard .pick");
    for (var i = 0; i < picks.length; i++) {
      var a = picks[i].getAttribute("data-a");
      picks[i].disabled = true;
      if (a === q.answer) picks[i].classList.add("ok");
      if (a === chosen && !good) picks[i].classList.add("no");
    }
    finishRound(good ? 1 : 0, 1, q.why, "");
  }

  /* ---------------- 挑戰二：句子分類 ---------------- */
  function buildC2(q) {
    var html = headHTML("句子分類", "#ECE8FF", "回合");
    html += '<p class="q-text">' + q.prompt + "</p>";
    html += '<div class="sentence-list">';
    q.items.forEach(function (it) {
      html += '<div class="sent" id="sent-' + it.id + '">';
      html += "<p>" + it.t + "</p>";
      html += '<div class="lv-row">';
      html += '<button class="chip" type="button" data-act="pick" data-id="' + it.id + '" data-a="step">步移法</button>';
      html += '<button class="chip" type="button" data-act="pick" data-id="' + it.id + '" data-a="point">定點描寫</button>';
      html += "</div>";
      html += '<p class="sent-why">' + it.why + "</p>";
      html += "</div>";
    });
    html += "</div>";
    html += '<div class="btn-row" id="actionRow" style="margin-top:14px">' +
      '<button class="btn primary btn-lg" type="button" data-act="check" id="checkBtn" disabled>確定答案</button></div>';
    html += '<div class="feedback" id="fb" aria-live="polite"></div>';
    $("qCard").innerHTML = html;
    paintC2();
  }

  function paintC2() {
    var q = C2[state.idx];
    var chips = document.querySelectorAll('[data-act="pick"]');
    for (var i = 0; i < chips.length; i++) {
      var id = chips[i].getAttribute("data-id");
      var a = chips[i].getAttribute("data-a");
      chips[i].classList.toggle("on", state.picks[id] === a);
    }
    var btn = $("checkBtn");
    if (btn) btn.disabled = Object.keys(state.picks).length < q.items.length;
  }

  function checkC2() {
    var q = C2[state.idx];
    var ok = 0;
    q.items.forEach(function (it) {
      var chosen = state.picks[it.id];
      var good = chosen === it.a;
      if (good) ok++;
      var box = $("sent-" + it.id);
      box.classList.add("revealed");
      var chips = box.querySelectorAll('[data-act="pick"]');
      for (var i = 0; i < chips.length; i++) {
        var a = chips[i].getAttribute("data-a");
        if (a === it.a) chips[i].classList.add("ok");
        if (a === chosen && !good) chips[i].classList.add("no");
      }
    });
    finishRound(ok, q.items.length, "分辨的關鍵：句子裏有沒有「位置移動」。有移動就是步移法；站定一處、按空間順序描寫，就是定點描寫。", '<p style="font-size:.92em;opacity:.85">每句下方的說明，就是判斷的依據。</p>');
  }

  /* ---------------- 結算與回饋 ---------------- */
  function finishRound(ok, total, why, extra) {
    state.answered = true;
    $("qCard").classList.add("locked");
    state.score += ok;
    state.total += total;
    $("scoreTxt").textContent = state.score;

    var row = $("actionRow");
    if (row) row.style.display = "none";

    var full = ok === total;
    if (full) Sound.play("correct");
    else if (ok > 0) Sound.play("partial");
    else Sound.play("wrong");

    var label = full ? "全對了！" : (ok > 0 ? "答對 " + ok + " / " + total : "再看一次講解");
    var mark = full ? "✓" : (ok > 0 ? "◆" : "✗");
    var fb = $("fb");
    fb.innerHTML = '<div class="fb-box ' + (full ? "" : "bad") + '">' +
      '<div class="fb-head"><span class="fb-ico">' + mark + "</span>" + label + "</div>" +
      '<div class="fb-body">' + extra + "<p>" + why + "</p></div>" +
      '<div class="fb-next"><button class="btn ' + (full ? "teal" : "primary") + '" type="button" data-act="next">' +
      (state.idx === MODES[state.mode].total - 1 ? "看成績" : "下一題") + "</button></div>" +
      "</div>";
    fb.classList.add("show");

    if (fb.getBoundingClientRect().bottom > window.innerHeight + 40) {
      fb.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function nextQuestion() {
    Sound.play("next");
    if (state.idx >= MODES[state.mode].total - 1) {
      showResult();
      return;
    }
    state.idx++;
    resetRound();
    renderGame();
    window.scrollTo(0, 0);
  }

  function showResult() {
    var pct = state.total ? Math.round((state.score / state.total) * 100) : 0;
    var stars = pct >= 90 ? 3 : (pct >= 70 ? 2 : (pct >= 40 ? 1 : 0));
    var title, msg;
    if (stars === 3) {
      title = "太厲害了！";
      msg = "你已經是一位小描寫家，步移法和定點描寫都難不倒你。";
    } else if (stars === 2) {
      title = "做得不錯！";
      msg = "大部分都答對了。回到教學基地再看一次口訣，下次一定更熟練。";
    } else if (stars === 1) {
      title = "繼續加油！";
      msg = "有些地方還沒分清。記住：有位置移動就是步移法；站定一處、按順序看就是定點描寫。";
    } else {
      title = "先複習一下";
      msg = "別灰心，回到教學基地再看一次口訣，然後回來挑戰。";
    }

    var prev = parseInt(lsGet(BEST_KEY + state.mode) || "0", 10);
    if (pct > prev) lsSet(BEST_KEY + state.mode, String(pct));
    refreshBest();

    var starHTML = "";
    for (var i = 0; i < 3; i++) {
      starHTML += '<svg class="' + (i < stars ? "" : "off") + '" style="color:#FFC94A" aria-hidden="true"><use href="#i-star"/></svg>';
    }

    $("resultBox").innerHTML =
      '<div class="result-stars">' + starHTML + "</div>" +
      "<h2>" + title + "</h2>" +
      '<div class="result-score">' + pct + "<small>%</small></div>" +
      '<p class="result-msg">' + msg + "</p>" +
      '<div class="result-stats">' +
      '<div class="stat"><b>' + state.score + "</b><span>答對小題</span></div>" +
      '<div class="stat"><b>' + state.total + "</b><span>小題總數</span></div>" +
      '<div class="stat"><b>' + MODES[state.mode].sub + "</b><span>遊戲模式</span></div>" +
      "</div>" +
      '<div class="btn-row">' +
      '<button class="btn primary btn-lg" type="button" data-act="again">再玩一次</button>' +
      (stars <= 1 ? '<button class="btn teal btn-lg" type="button" data-act="teach">看教學</button>' : '') +
      '<button class="btn ghost btn-lg" type="button" data-act="home">返回主頁</button>' +
      "</div>";

    show("result");
    Sound.play("finish");
    if (stars >= 2) confetti();
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var box = $("confetti");
    var colors = ["#FF7A6B", "#FFC94A", "#2FBFAD", "#6EC1E4", "#9B8CFF", "#5FBF6E"];
    var html = "";
    for (var i = 0; i < 46; i++) {
      var left = Math.random() * 100;
      var delay = Math.random() * 0.7;
      var dur = 2.1 + Math.random() * 1.4;
      var c = colors[i % colors.length];
      var w = 7 + Math.round(Math.random() * 7);
      html += '<i style="left:' + left.toFixed(1) + "%;background:" + c + ";width:" + w +
        "px;height:" + (w + 5) + "px;animation-delay:" + delay.toFixed(2) + "s;animation-duration:" + dur.toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
    window.setTimeout(function () { box.innerHTML = ""; }, 4400);
  }

  /* ---------------- 事件 ---------------- */
  $("qCard").addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "next") { nextQuestion(); return; }
    if (state.answered) return;

    if (act === "opt") {
      var id = el.getAttribute("data-opt");
      if (state.selection.indexOf(id) >= 0) return;
      if (state.selection.length >= 4) return;
      state.selection.push(id);
      Sound.play("select");
      paintStep();
    } else if (act === "slot") {
      var i = parseInt(el.getAttribute("data-slot"), 10);
      if (i < state.selection.length) {
        state.selection.splice(i, 1);
        Sound.play("click");
        paintStep();
      }
    } else if (act === "label") {
      state.labels[el.getAttribute("data-id")] = el.getAttribute("data-lv");
      Sound.play("select");
      paintPoint();
    } else if (act === "pick") {
      state.picks[el.getAttribute("data-id")] = el.getAttribute("data-a");
      Sound.play("select");
      paintC2();
    } else if (act === "answer") {
      checkC1(el.getAttribute("data-a"));
    } else if (act === "check") {
      if (state.mode === "step") checkStep();
      else if (state.mode === "point") checkPoint();
      else if (state.mode === "c2") checkC2();
    }
  });

  $("resultBox").addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "again") {
      startMode(state.mode);
    } else if (act === "teach") {
      openTeach(0);
    } else {
      Sound.play("click");
      show("home");
    }
  });

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]");
    if (b) {
      var mode = b.getAttribute("data-mode");
      if (mode === "teach") openTeach(0);
      else if (mode === "c1") { startMode("c1"); }
      else startMode(mode);
      return;
    }
    var g = e.target.closest("[data-go]");
    if (g) {
      Sound.play("click");
      show(g.getAttribute("data-go"));
    }
  });

  $("soundBtn").addEventListener("click", function () {
    Sound.on = !Sound.on;
    lsSet("miao_sound", Sound.on ? "1" : "0");
    paintSound();
    if (Sound.on) Sound.play("click");
  });

  function paintSound() {
    var btn = $("soundBtn");
    btn.classList.toggle("is-off", !Sound.on);
    btn.setAttribute("aria-pressed", Sound.on ? "true" : "false");
    btn.setAttribute("aria-label", Sound.on ? "關閉音效" : "開啟音效");
    btn.querySelector("use").setAttribute("href", Sound.on ? "#i-sound" : "#i-mute");
  }

  document.addEventListener("pointerdown", function () { Sound.init(); }, { once: true });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.screen !== "home") {
      show("home");
    }
  });

  /* ---------------- 初始化 ---------------- */
  var savedSound = lsGet("miao_sound");
  Sound.on = savedSound !== "0";
  paintSound();
  refreshBest();
  $("heroArt").innerHTML = SCENES.hero();
  document.body.setAttribute("data-ready", "1");
})();
</script>
</body>
</html>
