<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>標點精靈大冒險｜小學標點符號互動學習</title>
<meta name="description" content="為香港小學生設計的標點符號互動學習遊戲：12 種標點圖文教學（含括號）、兩種互動練習、初階與高階混合挑戰，對應《香港小學學習字詞表》標準用字，附即時解說與音效，支援手機、平板及電腦。">
<style>
  :root{
    --cream:#FFF8EC;
    --paper:#FFFFFF;
    --ink:#2E2A26;
    --muted:#6F665C;
    --line:rgba(46,42,38,.14);
    --teal:#2FBF9B;
    --teal-deep:#1E9C7C;
    --coral:#FF7A59;
    --yellow:#FFC94D;
    --purple:#9B8CF5;
    --ok-bg:#E4F7F0;
    --no-bg:#FFF0E9;
    --radius:24px;
    --shadow:0 6px 0 rgba(46,42,38,.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:"Noto Sans HK","Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC","Source Han Sans HK","Source Han Sans TC",system-ui,-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.7;
    font-size:clamp(18px,1.15vw,19px);
    -webkit-tap-highlight-color:transparent;
    text-rendering:optimizeLegibility;
  }
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(46,42,38,.055) 1.3px, transparent 1.3px);
    background-size:24px 24px;
  }
  #app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(12px,2vw,24px) clamp(14px,3vw,32px) 56px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .screen{animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 clamp(12px,2vw,20px)}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px;margin:0;font:inherit;font-weight:900;color:var(--ink);cursor:pointer;border-radius:14px;font-size:clamp(15px,1.4vw,19px)}
  .brand:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
  .logo-dot{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:13px;background:var(--teal);border:3px solid var(--ink);color:var(--ink);font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(46,42,38,.2)}
  .icon-btn{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(46,42,38,.18);transition:transform .12s}
  .icon-btn:active{transform:translateY(3px);box-shadow:none}
  .icon-btn svg{width:26px;height:26px}
  .icon-btn[aria-pressed="false"]{background:#EFE9DF;color:#8C8378}

  /* ---------- buttons ---------- */
  .btn{
    font:inherit;font-weight:900;color:var(--ink);background:var(--paper);
    border:3px solid var(--ink);border-radius:999px;
    padding:12px 26px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;box-shadow:0 4px 0 rgba(46,42,38,.9);
    transition:transform .12s ease, box-shadow .12s ease;
    font-size:clamp(16px,1.5vw,19px);line-height:1.2;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(46,42,38,.9)}
  .btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
  .btn.primary{background:var(--teal)}
  .btn.accent{background:var(--yellow)}
  .btn.coral{background:var(--coral)}
  .btn.ghost{box-shadow:0 4px 0 rgba(46,42,38,.18)}
  .btn.big{min-height:62px;padding:14px 34px;font-size:clamp(18px,1.9vw,22px)}
  .btn.small{min-height:46px;padding:8px 18px;font-size:clamp(14px,1.3vw,16px);border-width:2.5px;box-shadow:0 3px 0 rgba(46,42,38,.9)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px}

  /* ---------- cards ---------- */
  .card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,2.4vw,28px)}
  .card h3{margin:0 0 10px;font-size:clamp(19px,1.85vw,23px);line-height:1.3}
  .card p{margin:0}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(16px,3vw,40px);align-items:center;padding:clamp(8px,2vw,24px) 0 clamp(18px,3vw,32px)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(155,140,245,.18);color:#5B4CB8;border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(13px,1.2vw,15px);letter-spacing:.04em}
  .hero h1{margin:14px 0 10px;font-size:clamp(40px,6vw,72px);line-height:1.1;letter-spacing:.01em;font-weight:900}
  .hero h1 em{font-style:normal;color:var(--coral)}
  .lead{margin:0 0 22px;color:var(--muted);font-size:clamp(17px,1.6vw,21px);max-width:30em}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:clamp(13px,1.2vw,15px);font-weight:700;color:var(--muted)}
  .hero-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:260px}
  .hero-art svg.mascot{width:min(100%,420px);height:auto;filter:drop-shadow(0 10px 0 rgba(46,42,38,.08))}
  .float-mark{position:absolute;font-weight:900;color:var(--ink);opacity:.9;text-shadow:2px 3px 0 rgba(255,255,255,.9);user-select:none}
  .float-mark.m1{font-size:clamp(26px,3.4vw,44px);color:var(--coral);top:6%;left:4%;transform:rotate(-12deg)}
  .float-mark.m2{font-size:clamp(24px,3vw,40px);color:var(--purple);bottom:12%;right:4%;transform:rotate(10deg)}
  .float-mark.m3{font-size:clamp(20px,2.4vw,32px);color:var(--teal-deep);top:18%;right:10%;transform:rotate(8deg)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(10px,1.6vw,16px);margin:6px 0 26px}
  .stat{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 18px;box-shadow:0 5px 0 rgba(46,42,38,.14)}
  .stat b{display:block;font-size:clamp(22px,2.4vw,30px);line-height:1.2}
  .stat span{color:var(--muted);font-size:clamp(13px,1.2vw,15px);font-weight:700}
  .home-note{display:flex;gap:12px;align-items:flex-start;background:rgba(47,191,155,.10);border:2px dashed rgba(30,156,124,.4);border-radius:18px;padding:14px 18px;color:#28695A;font-size:clamp(14px,1.25vw,16px)}
  .home-note svg{flex:0 0 auto;width:22px;height:22px;margin-top:2px}
  .home-tools{display:flex;justify-content:center;margin-top:18px}
  .link-btn{background:none;border:0;font:inherit;font-size:clamp(13px,1.15vw,15px);font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:10px 14px;border-radius:12px}
  .link-btn:hover{color:var(--ink)}
  .link-btn:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

  /* ---------- page header ---------- */
  .page-head{display:flex;align-items:center;gap:12px;margin:0 0 clamp(14px,2vw,22px);flex-wrap:wrap}
  .page-head h2{margin:0;font-size:clamp(24px,3vw,36px);line-height:1.2}
  .page-head .sub{margin:0;color:var(--muted);font-weight:600;font-size:clamp(14px,1.3vw,17px)}
  .back-btn{width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(46,42,38,.18);flex:0 0 auto;color:var(--ink)}
  .back-btn:active{transform:translateY(3px);box-shadow:none}
  .back-btn svg{width:24px;height:24px}

  /* ---------- map ---------- */
  .mark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:clamp(10px,1.6vw,18px)}
  .mark-card{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:#fff;border:3px solid var(--ink);border-radius:24px;padding:16px 10px 14px;
    cursor:pointer;font:inherit;color:var(--ink);text-align:center;
    box-shadow:0 5px 0 rgba(46,42,38,.16);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .mark-card:hover{transform:translateY(-4px);box-shadow:0 9px 0 rgba(46,42,38,.16)}
  .mark-card:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(46,42,38,.16)}
  .mark-card:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
  .mc-name{font-weight:900;font-size:clamp(18px,1.65vw,21px);line-height:1.2}
  .mc-tag{color:var(--muted);font-size:clamp(13px,1.15vw,15px);line-height:1.45;min-height:2.7em;display:flex;align-items:center}
  .mc-go{margin-top:2px;font-size:clamp(12px,1.1vw,14px);font-weight:800;color:var(--teal-deep);background:rgba(47,191,155,.14);border-radius:999px;padding:3px 12px}
  .mc-done{margin-top:2px;font-size:clamp(12px,1.1vw,14px);font-weight:800;color:#fff;background:var(--teal-deep);border-radius:999px;padding:3px 12px}
  .sticker{display:block}

  /* ---------- teach ---------- */
  .teach-grid{display:grid;grid-template-columns:minmax(230px,.82fr) 1.5fr;gap:clamp(14px,2.4vw,26px);align-items:start}
  .teach-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:sticky;top:12px}
  .teach-hero h2{margin:10px 0 0;font-size:clamp(28px,3.2vw,40px);line-height:1.15}
  .tagline{color:var(--muted);font-weight:700;margin:0}
  .mode-pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(155,140,245,.16);color:#5B4CB8;border-radius:999px;padding:6px 14px;font-weight:800;font-size:clamp(12px,1.15vw,14px)}
  .teach-body{display:flex;flex-direction:column;gap:clamp(12px,1.8vw,18px)}
  .def{background:linear-gradient(180deg,#FFFDF6,#FFF6E4)}
  .def p{font-size:clamp(20px,2vw,25px);font-weight:800;line-height:1.6}
  .points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .points li{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:clamp(17px,1.45vw,19px)}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--teal);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;margin-top:2px}
  .examples{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .examples li{background:#FFF9EF;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:clamp(19px,1.75vw,23px);font-weight:700;line-height:1.95}
  .hl{color:#C2410C;background:#FFE3D2;border-radius:6px;padding:0 2px}
  .mk-dash{display:inline-block;width:1.72em;height:.17em;background:currentColor;border-radius:999px;vertical-align:.30em;margin:0 .04em}
  .tip{background:#FFF4D6;border-color:#E0A93B}
  .tip h3{color:#8A5A00}
  .teach-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:clamp(16px,2.4vw,26px)}
  .teach-actions .side{display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- challenge ---------- */
  .level-card{margin-bottom:clamp(16px,2.4vw,26px)}
  .level-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .level-badge{display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:14px;padding:6px 16px;font-weight:900;font-size:clamp(16px,1.6vw,20px);box-shadow:0 3px 0 rgba(46,42,38,.2)}
  .level-badge.easy{background:var(--teal)}
  .level-badge.hard{background:var(--coral)}
  .level-head p{margin:0;color:var(--muted);font-weight:600;font-size:clamp(13px,1.25vw,16px)}
  .group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:clamp(10px,1.6vw,16px)}
  .group-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;box-shadow:0 4px 0 rgba(46,42,38,.16);transition:transform .14s}
  .group-btn:hover{transform:translateY(-3px)}
  .group-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(46,42,38,.16)}
  .g-top{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;flex-wrap:nowrap}
  .g-mode{flex:0 0 auto;font-size:clamp(9px,.95vw,11px);font-weight:900;padding:2px 6px;border-radius:999px;background:rgba(47,191,155,.16);color:#1E7A63;border:1.5px solid rgba(30,156,124,.4);line-height:1.5;white-space:nowrap}
  .g-mode.multi{background:rgba(155,140,245,.18);color:#5B4CB8;border-color:rgba(123,107,224,.45)}
  .mode-legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 clamp(12px,2vw,18px)}
  .mode-legend span{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:clamp(12px,1.15vw,14px);font-weight:800;color:var(--muted)}
  .mode-legend i{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block}
  .mode-legend i.multi{background:var(--purple)}
  .group-btn b{font-size:clamp(16px,1.5vw,19px);white-space:nowrap}
  .group-btn small{color:var(--muted);font-size:clamp(13px,1.15vw,15px);font-weight:600;line-height:1.45}
  .stars{display:flex;gap:2px;margin-top:4px}
  .stars svg{width:18px;height:18px}

  /* ---------- quiz ---------- */
  .quiz-wrap{max-width:900px;margin:0 auto}
  .quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .quiz-meta{flex:1;min-width:0}
  .quiz-meta h2{margin:0;font-size:clamp(17px,1.7vw,21px);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quiz-meta p{margin:2px 0 0;color:var(--muted);font-size:clamp(12px,1.15vw,14px);font-weight:700}
  .counter{font-weight:900;font-size:clamp(15px,1.5vw,18px);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;white-space:nowrap}
  .bar{height:14px;background:#EDE5D8;border-radius:999px;overflow:hidden;margin:0 0 clamp(14px,2vw,20px);border:2px solid rgba(46,42,38,.12)}
  .bar > i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s ease}
  .q-card{padding:clamp(18px,2.6vw,30px)}
  .q-type{display:inline-flex;align-items:center;gap:6px;font-size:clamp(12px,1.15vw,14px);font-weight:800;color:#5B4CB8;background:rgba(155,140,245,.14);border-radius:999px;padding:4px 14px;margin-bottom:12px}
  .sentence{font-size:clamp(26px,2.9vw,38px);line-height:2.15;font-weight:800;margin:4px 0 clamp(16px,2vw,22px);word-break:normal;overflow-wrap:break-word}
  .slot{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:1.5em;height:1.45em;padding:0 .1em;margin:0 .04em;
    border:0;border-bottom:5px dashed var(--coral);
    background:rgba(255,122,89,.10);border-radius:10px 10px 4px 4px;
    font:inherit;font-size:.9em;font-weight:900;color:var(--ink);
    vertical-align:-0.12em;cursor:pointer;line-height:1;
  }
  .slot.wide{min-width:2.1em}
  .keep{white-space:nowrap;word-break:keep-all;overflow-wrap:normal}
  .slot.filled{border-bottom-style:solid;border-bottom-color:var(--teal-deep);background:rgba(47,191,155,.16)}
  .slot.wrong{border-bottom-color:#D93B3B;background:rgba(217,59,59,.13)}
  .slot.reveal{border-bottom-color:#D93B3B;background:rgba(217,59,59,.08)}
  .slot:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.4vw,14px)}
  .tray{grid-template-columns:repeat(3,1fr)}
  .opt{
    min-height:clamp(74px,10vw,100px);
    font-family:inherit;font-weight:900;font-size:clamp(30px,4.2vw,46px);
    color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:20px;
    box-shadow:0 5px 0 rgba(46,42,38,.18);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, box-shadow .12s, background .12s;
    line-height:1;
  }
  .tray .opt{font-size:clamp(26px,3.4vw,38px);min-height:clamp(62px,8vw,84px)}
  .opt:hover:not([disabled]){transform:translateY(-2px)}
  .opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 rgba(46,42,38,.18)}
  .opt:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
  .opt.correct{background:#D6F5E8;border-color:var(--teal-deep);box-shadow:0 5px 0 var(--teal-deep);animation:pop .3s ease}
  .opt.dim{opacity:.4}
  .opt.wrong{background:#F2EDE7;color:#9C9388;border-color:#C6BDB2;box-shadow:none;opacity:.65}
  .opt[disabled]{cursor:default}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s ease}

  .feedback{margin-top:clamp(14px,2vw,20px);border-radius:18px;padding:16px 18px;border:3px solid;display:flex;gap:12px;align-items:flex-start}
  .feedback.ok{background:var(--ok-bg);border-color:var(--teal-deep)}
  .feedback.no{background:var(--no-bg);border-color:#E8845F}
  .feedback.hint{background:#FFF8E3;border-color:#E0A93B}
  .feedback .fb-icon{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid currentColor}
  .feedback.ok .fb-icon{color:var(--teal-deep)}
  .feedback.no .fb-icon{color:#C9542F}
  .feedback.hint .fb-icon{color:#A9761B}
  .feedback .fb-icon svg{width:22px;height:22px}
  .feedback h4{margin:0 0 4px;font-size:clamp(16px,1.55vw,19px);line-height:1.3}
  .feedback p{margin:0;font-size:clamp(16px,1.45vw,18px);line-height:1.7;font-weight:600}
  .feedback .ans{font-weight:900;color:#B03A1C;background:#FFE2D3;border-radius:6px;padding:0 5px}

  .quiz-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:clamp(14px,2vw,20px);flex-wrap:wrap}
  .quiz-actions .btn{min-width:150px}

  /* ---------- result ---------- */
  .result{max-width:720px;margin:0 auto;text-align:center}
  .result .big-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
  .result .big-stars svg{width:clamp(58px,8vw,84px);height:clamp(58px,8vw,84px)}
  .result h2{font-size:clamp(28px,3.6vw,42px);margin:6px 0 4px;line-height:1.2}
  .result .scoreline{font-size:clamp(18px,1.9vw,22px);font-weight:800;color:var(--muted);margin:0 0 6px}
  .result .msg{font-size:clamp(16px,1.5vw,19px);margin:0 auto 20px;max-width:26em;color:var(--muted);font-weight:600}
  .result .btn-row{justify-content:center}
  .result-art{display:flex;justify-content:center;margin-bottom:4px}
  .result-art svg{width:clamp(130px,18vw,180px);height:auto}

  /* ---------- modal & toast ---------- */

/* ======================= 儲存 ======================= */
function loadProgress(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || typeof o !== 'object') return;
    if(Array.isArray(o.learned)) state.progress.learned = o.learned.filter(function(x){ return typeof x === 'string'; });
    if(o.cleared && typeof o.cleared === 'object' && !Array.isArray(o.cleared)) state.progress.cleared = o.cleared;
    if(typeof o.soundOn === 'boolean') state.soundOn = o.soundOn;
  }catch(e){ /* 忽略損壞資料 */ }
}
function saveProgress(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      learned: state.progress.learned,
      cleared: state.progress.cleared,
      soundOn: state.soundOn
    }));
  }catch(e){ /* 私隱模式下降級為本次記憶 */ }
}

/* ======================= 音效 ======================= */
let actx = null;
function audioCtx(){
  if(!state.soundOn) return null;
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function beep(freq, delay, dur, type, vol){
  const ctx = audioCtx();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }catch(e){ /* 靜默降級 */ }
}
function sfx(kind){
  if(!state.soundOn) return;
  if(kind === 'tap'){ beep(660, 0, 0.07, 'sine', 0.06); }
  else if(kind === 'ok'){ beep(523.25, 0, 0.12, 'sine', 0.11); beep(659.25, 0.1, 0.2, 'sine', 0.11); }
  else if(kind === 'no'){ beep(196, 0, 0.12, 'triangle', 0.09); beep(146.83, 0.1, 0.2, 'triangle', 0.08); }
  else if(kind === 'win'){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ beep(f, i * 0.11, 0.2, 'sine', 0.1); }); }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
}

function highlight(text, m){
  let s = esc(text);

  });

  s = s.split('—').join(markHTML('—'));
  return s;
}

}

/* ======================= 挑戰選單 ======================= */
function viewChallenge(){
  const modeOf = function(g){
    const single = g.qs.filter(function(q){ return q.mode === 'single'; }).length;
    if(single === g.qs.length) return 'single';
    if(single === 0) return 'multi';
    return 'mixed';
  };
  const countMode = function(want){
    let n = 0;
    ['easy','hard'].forEach(function(k){
      DATA.challenges[k].groups.forEach(function(g){ if(modeOf(g) === want) n += 1; });
    });
    return n;
  };
  function levelBlock(key){
    const lv = DATA.challenges[key];
    const groups = lv.groups.map(function(g, i){
      const starN = state.progress.cleared[key + '-' + (i + 1)] || 0;
      const mm = modeOf(g);
      const badge = mm === 'multi'
        ? '<span class="g-mode multi">排一排</span>'
        : (mm === 'single' ? '<span class="g-mode">選一選</span>' : '<span class="g-mode multi">混合</span>');
      return '<button class="group-btn" data-action="start-group" data-level="' + key + '" data-g="' + i + '">' +
        '<span class="g-top"><b>' + esc(g.name) + '</b>' + badge + '</span>' +
        '<small>' + esc(g.theme) + ' · ' + g.qs.length + ' 題</small>' +
        starsSVG(starN, 16) +
      '</button>';
    }).join('');
    const done = lv.groups.filter(function(_, i){ return (state.progress.cleared[key + '-' + (i + 1)] || 0) > 0; }).length;
    return '<div class="card level-card">' +
      '<div class="level-head">' +
        '<span class="level-badge ' + key + '">' + esc(lv.title) + '</span>' +
        '<p>' + esc(lv.subtitle) + '　·　已通關 ' + done + ' / 7</p>' +
      '</div>' +
      '<div class="group-grid">' + groups + '</div>' +
    '</div>';
  }
  return '<section class="screen">' + topbar() +
    pageHead('混合挑戰', '兩種難度，各 7 關，題庫不重複', 'go-home', '返回首頁') +
    '<div class="mode-legend"><span><i></i>選一選：' + countMode('single') + ' 關</span><span><i class="multi"></i>排一排：' + countMode('multi') + ' 關</span></div>' +
    levelBlock('easy') +
    levelBlock('hard') +
    '<div class="home-note">' + ICON.bulb + '<span>初階版以單空格判斷為主，高階版以多空格推理為主；全個挑戰區共有 14 關（初階7關 + 高階7關）。每題揭曉答案時都會說明理由。</span></div>' +
  '</section>';
}

/* ======================= 答題引擎 ======================= */
function resetQuestionView(){
  const qz = state.quiz;
  if(!qz) return;
  const q = qz.questions[qz.index];
  const n = (q.text.match(/▢/g) || []).length;
  qz.filled = new Array(n).fill('');
  qz.attempts = 0;
  qz.wrongOpts = [];
  qz.wrongSlots = [];
  qz.status = 'answering';
}
function startQuiz(config){
  state.quiz = {
    config: config,
    title: config.title,
    subtitle: config.subtitle || '',
    questions: config.questions,
    kind: config.kind,
    key: config.key,
    backTo: config.backTo,
    index: 0,
    score: 0,
    status: 'answering',
    attempts: 0,
    filled: [],
    wrongOpts: [],
    wrongSlots: [],
    results: []
  };
  lastQuizIndex = 0;
  resetQuestionView();
  state.screen = 'quiz';
  render();
}
function currentQ(){
  return state.quiz ? state.quiz.questions[state.quiz.index] : null;
}
function chooseOption(mark){
  const qz = state.quiz;
  if(!qz || qz.status !== 'answering') return;
  const q = currentQ();
  if(!q || q.mode !== 'single') return;
  if(qz.wrongOpts.indexOf(mark) >= 0) return;
  if(mark === q.answer){
    qz.filled = [mark];
    qz.score += (qz.attempts === 0 ? 2 : 1);
    qz.results.push({ first: qz.attempts === 0 });
    qz.status = 'resolved';
    sfx('ok');
    render();
  }else{
    qz.attempts += 1;
    qz.wrongOpts.push(mark);
    if(qz.attempts >= 2){
      qz.filled = [q.answer];
      qz.status = 'resolved';
      qz.results.push({ first: false });
      sfx('no');
      render();
    }else{
      sfx('no');
      render();
      const opt = app.querySelector('.opt[data-mark="' + cssEscape(mark) + '"]');
      if(opt){ opt.classList.add('shake'); setTimeout(function(){ opt.classList.remove('shake'); }, 320); }
    }
  }
}
function cssEscape(s){
  return String(s).replace(/["\\]/g, '\\$&');
}
function tapSlot(i){
  const qz = state.quiz;
  if(!qz || qz.status !== 'answering') return;
  const q = currentQ();
  if(!q || q.mode !== 'multi') return;
  if(qz.filled[i]){
    qz.filled[i] = '';
    qz.wrongSlots = [];
    sfx('tap');
    render();
  }
}
function pickTray(mark){
  const qz = state.quiz;
  if(!qz || qz.status !== 'answering') return;
  const q = currentQ();
  if(!q || q.mode !== 'multi') return;
  let idx = -1;
  for(let i = 0; i < qz.filled.length; i++){ if(!qz.filled[i]){ idx = i; break; } }
  if(idx < 0){ toast('空格已填滿，點一下空格可以取回再選。'); return; }
  qz.filled[idx] = mark;
  qz.wrongSlots = [];
  sfx('tap');
  render();
}
function checkAnswer(){
  const qz = state.quiz;
  if(!qz || qz.status !== 'answering') return;
  const q = currentQ();
  if(!q || q.mode !== 'multi') return;
  if(qz.filled.some(function(v){ return !v; })){ toast('還有空格未填啊！'); return; }
  const wrong = [];
  q.answers.forEach(function(a, i){ if(qz.filled[i] !== a) wrong.push(i); });
  if(wrong.length === 0){
    qz.score += (qz.attempts === 0 ? 2 : 1);
    qz.results.push({ first: qz.attempts === 0 });
    qz.status = 'resolved';
    qz.wrongSlots = [];
    sfx('ok');
    render();
  }else{
    qz.attempts += 1;
    qz.wrongSlots = wrong;
    sfx('no');
    if(qz.attempts >= 2){
      qz.filled = q.answers.slice();
      qz.status = 'resolved';
      qz.results.push({ first: false });
    }
    render();
  }
}
function nextQuestion(){
  const qz = state.quiz;
  if(!qz) return;
  if(qz.index < qz.questions.length - 1){
    qz.index += 1;
    lastQuizIndex = qz.index;
    resetQuestionView();
    sfx('tap');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }else{
    finishQuiz();
  }
}
function finishQuiz(){
  const qz = state.quiz;
  const total = qz.questions.length;
  const max = total * 2;
  const rate = qz.score / max;
  const stars = rate >= 0.9 ? 3 : (rate >= 0.7 ? 2 : 1);
  if(qz.kind === 'challenge' && qz.key){
    const prev = Number(state.progress.cleared[qz.key]) || 0;
    state.progress.cleared[qz.key] = Math.max(prev, stars);
    saveProgress();
  }
  if(qz.kind === 'practice' && qz.config.markId){
    if(state.progress.learned.indexOf(qz.config.markId) < 0){
      state.progress.learned.push(qz.config.markId);
    }
    saveProgress();
  }
  state.result = {
    stars: stars,
    score: qz.score,
    max: max,
    total: total,
    firstTry: qz.results.filter(function(r){ return r.first; }).length,
    kind: qz.kind,
    title: qz.title,
    backTo: qz.backTo,
    config: qz.config
  };
  state.screen = 'result';
  sfx(stars === 3 ? 'win' : 'ok');
  render();
}

/* ======================= 答題頁 ======================= */
function renderSentence(q, qz){
  const parts = q.text.split('▢');
  let html = '';
  parts.forEach(function(p, i){
    if(i >= parts.length - 1){ html += richText(p); return; }
    const cut = Math.max(0, p.length - 2);
    html += richText(p.slice(0, cut)) + '<span class="keep">' + richText(p.slice(cut));
    {
      const val = qz.filled[i] || '';
      const expected = q.mode === 'single' ? q.answer : (q.answers[i] || '');
      const wide = (expected === '——' || expected === '……') ? ' wide' : '';
      let cls = 'slot' + wide;
      if(val){
        cls += ' filled';
        if(qz.status === 'resolved'){
          if(q.mode === 'multi' && qz.wrongSlots.indexOf(i) >= 0){ cls += ' reveal'; }
        }else if(qz.wrongSlots.indexOf(i) >= 0){
          cls += ' wrong';
        }
      }
      html += '<button class="' + cls + '" data-action="tap-slot" data-i="' + i + '" aria-label="' + esc('第 ' + (i + 1) + ' 個空格' + (val ? '，已填 ' + (val === '——' ? '破折號' : val) : '')) + '">' + markHTML(val) + '</button>';
    }
    html += '</span>';
  });
  return html;
}
function feedbackHTML(q, qz){
  if(qz.status === 'answering'){
    if(qz.attempts > 0){
      return '<div class="feedback hint" role="status">' +
        '<span class="fb-icon">' + ICON.bulb + '</span>' +
        '<div><h4>再想一想</h4><p>' +
        (q.mode === 'single'
          ? '讀一讀整句：這個位置是句子中間、句子末尾，還是說話內容之前？'
          : '有空格放錯了。點一下放錯的空格取回，再想想每個位置的作用。') +
        '</p></div></div>';
    }
    return '';
  }
  const first = qz.results.length ? qz.results[qz.results.length - 1].first : false;
  if(first){
    return '<div class="feedback ok" role="status"><span class="fb-icon">' + ICON.check + '</span>' +
      '<div><h4>答對了！</h4><p>' + esc(q.explain) + '</p></div></div>';
  }
  const ans = q.mode === 'single' ? markHTML(q.answer) : q.answers.map(markHTML).join('　');
  return '<div class="feedback no" role="status"><span class="fb-icon">' + ICON.cross + '</span>' +
    '<div><h4>正確答案是 <span class="ans">' + ans + '</span></h4><p>' + richText(q.explain) + '</p></div></div>';
}
function viewQuiz(){
  const qz = state.quiz;
  if(!qz) return viewHome();
  const q = currentQ();
  const total = qz.questions.length;
  const pct = Math.round((qz.index / total) * 100);
  let optionsHTML = '';
  if(q.mode === 'single'){
    optionsHTML = '<div class="options">' + q.options.map(function(o){
      let cls = 'opt';
      if(qz.status === 'resolved'){
        if(o === q.answer) cls += ' correct';
        else cls += ' dim';
      }else if(qz.wrongOpts.indexOf(o) >= 0){
        cls += ' wrong';
      }
      const dis = (qz.status !== 'answering' || qz.wrongOpts.indexOf(o) >= 0) ? ' disabled' : '';
      return '<button class="' + cls + '" data-action="choose" data-mark="' + esc(o) + '"' + dis + '>' + markHTML(o) + '</button>';
    }).join('') + '</div>';
  }else{
    optionsHTML = '<div class="options tray">' + q.tray.map(function(o){
      const dis = qz.status !== 'answering' ? ' disabled' : '';
      return '<button class="opt" data-action="pick-tray" data-mark="' + esc(o) + '"' + dis + '>' + markHTML(o) + '</button>';
    }).join('') + '</div>';
  }
  const resolved = qz.status === 'resolved';
  const isLast = qz.index === total - 1;
  const actions = q.mode === 'multi' && !resolved
    ? '<button class="btn primary big" data-action="check">檢查答案</button>'
    : (resolved ? '<button class="btn primary big" data-action="next">' + (isLast ? '看成績' : '下一題') + '</button>' : '');
  return '<section class="screen">' + topbar() +
    '<div class="quiz-wrap">' +
      '<div class="quiz-head">' +
        '<button class="back-btn" data-action="quiz-exit" aria-label="離開練習">' + ICON.back + '</button>' +
        '<div class="quiz-meta"><h2>' + esc(qz.title) + '</h2><p>' + esc(qz.subtitle) + '</p></div>' +
        '<span class="counter">第 ' + (qz.index + 1) + ' / ' + total + ' 題</span>' +
      '</div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="card q-card">' +
        '<span class="q-type">' + (q.mode === 'single' ? '選一選：把正確標點填入空格' : '排一排：依序點選標點；點已填空格可取回') + '</span>' +
        '<p class="sentence">' + renderSentence(q, qz) + '</p>' +
        optionsHTML +
        '<div aria-live="polite">' + feedbackHTML(q, qz) + '</div>' +
        '<div class="quiz-actions">' + actions + '</div>' +
      '</div>' +
    '</div>' +
  '</section>';
}

/* ======================= 結算頁 ======================= */

    3: '太厲害了！你已經是標點小專家，可以去挑戰更高難度了。',

    1: '完成挑戰！先讀一讀每題的解說，再試一次一定會更好。'
  };

      '<div class="result-art">' + mascot() + '</div>' +
      '<div class="big-stars">' + starsSVG(r.stars, 64).replace('class="stars"', 'class="stars" style="display:contents"').replace(/width="64" height="64"/g, 'width="64" height="64"') + '</div>' +
      '<h2>' + (r.stars === 3 ? '完美通關！' : (r.stars === 2 ? '做得好！' : '完成了！')) + '</h2>' +
      '<p class="scoreline">' + esc(r.title) + '</p>' +
      '<p class="scoreline">首次答對 ' + r.firstTry + ' / ' + r.total + ' 題　·　得分 ' + r.score + ' / ' + r.max + '</p>' +

        '<button class="btn primary" data-action="restart">再玩一次</button>' +
        '<button class="btn ghost" data-action="result-back">' + (isPractice ? '返回教學' : '返回挑戰選單') + '</button>' +

/* ======================= 彈窗 ======================= */
function viewModal(){
  if(!state.modal) return '';
  return '<div class="overlay" data-action="modal-bg">' +
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<h3 id="modal-title">' + esc(state.modal.title) + '</h3>' +
      '<p>' + esc(state.modal.text) + '</p>' +
      '<div class="btn-row">' +
        '<button class="btn ghost small" data-action="modal-cancel">' + (state.modal.kind === 'reset' ? '取消' : '繼續作答') + '</button>' +
        '<button class="btn coral small" data-action="modal-ok">' + (state.modal.kind === 'reset' ? '確定重置' : '確定離開') + '</button>' +
      '</div>' +

/* ======================= 主渲染 ======================= */
function render(){
  let html = '';
  if(state.screen === 'home') html = viewHome();
  else if(state.screen === 'map') html = viewMap();
  else if(state.screen === 'teach') html = viewTeach();
  else if(state.screen === 'challenge') html = viewChallenge();
  else if(state.screen === 'quiz') html = viewQuiz();
  else if(state.screen === 'result') html = viewResult();
  else html = viewHome();
  app.innerHTML = html + viewModal();
  if(state.screen !== lastScreen){
    window.scrollTo(0, 0);
    lastScreen = state.screen;
  }else if(state.screen === 'quiz' && lastQuizIndex !== (state.quiz ? state.quiz.index : -1)){
    lastQuizIndex = state.quiz ? state.quiz.index : -1;
  }
  if(state.screen === 'quiz'){ lastQuizIndex = state.quiz.index; }
}

/* ======================= 導航 ======================= */
function requestQuizExit(){
  const qz = state.quiz;
  if(!qz){ goHome(); return; }
  /* 如果已做完最後一題（result 頁），直接返回；否則彈確認 */
  if(qz.status === 'resolved' && qz.index >= qz.questions.length - 1){
    state.modal = null;
    if(qz.backTo){
      if(qz.backTo.screen === 'teach'){ state.markIndex = qz.backTo.markIndex; state.screen = 'teach'; }
      else { state.screen = 'challenge'; }
    }else{ state.screen = 'home'; }
    render();
    return;
  }
  state.modal = { kind: 'exit', title: '離開練習？', text: '本題組的作答進度不會保存，確定要離開嗎？' };
  render();
}
function goHome(){
  if(state.screen === 'quiz'){ requestQuizExit(); return; }
  state.modal = null;
  state.screen = 'home';
  render();
}
function resetProgress(){
  state.progress = { learned: [], cleared: {} };
  saveProgress();
  state.modal = null;
  toast('學習進度已重置');
  render();
}
function goMap(){
  state.modal = null;
  state.screen = 'map';
  render();
}
function openTeach(i){
  state.markIndex = i;
  state.screen = 'teach';
  render();
}
function goChallenge(){
  state.modal = null;
  state.screen = 'challenge';
  render();
}
function startPractice(){
  const m = DATA.marks[state.markIndex];
  if(!m) return;
  sfx('tap');
  startQuiz({
    title: m.name + ' · 即學即練',
    subtitle: m.modeLabel + ' · 3 題',
    questions: m.practice,
    kind: 'practice',
    markId: m.id,
    key: 'practice-' + m.id,
    backTo: { screen: 'teach', markIndex: state.markIndex }
  });
}
function startGroup(level, gi){
  const lv = DATA.challenges[level];
  if(!lv) return;
  const g = lv.groups[gi];
  if(!g) return;
  sfx('tap');
  startQuiz({
    title: (level === 'easy' ? '初階版' : '高階版') + ' · ' + g.name,
    subtitle: g.theme + ' · ' + g.qs.length + ' 題',
    questions: g.qs,
    kind: 'challenge',
    key: level + '-' + (gi + 1),
    backTo: { screen: 'challenge' }
  });
}
function resultBack(){
  const r = state.result;
  if(!r){ goHome(); return; }
  if(r.kind === 'practice'){
    state.markIndex = r.backTo.markIndex;
    state.screen = 'teach';
  }else{
    state.screen = 'challenge';
  }
  state.result = null;
  render();
}
function restartQuiz(){
  if(!state.result) return;
  const cfg = state.result.config;
  state.result = null;
  startQuiz(cfg);
}

/* ======================= 事件 ======================= */
app.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action === 'go-home'){ sfx('tap'); goHome(); return; }
  if(action === 'go-map'){ sfx('tap'); goMap(); return; }
  if(action === 'go-challenge'){ sfx('tap'); goChallenge(); return; }
  if(action === 'toggle-sound'){
    state.soundOn = !state.soundOn;
    saveProgress();
    if(state.soundOn){ sfx('ok'); }
    render();
    toast(state.soundOn ? '音效已開啟' : '音效已關閉');
    return;
  }
  if(action === 'open-teach'){ sfx('tap'); openTeach(Number(el.getAttribute('data-i'))); return; }
  if(action === 'teach-prev'){ sfx('tap'); openTeach((state.markIndex - 1 + DATA.marks.length) % DATA.marks.length); return; }
  if(action === 'teach-next'){ sfx('tap'); openTeach((state.markIndex + 1) % DATA.marks.length); return; }
  if(action === 'start-practice'){ startPractice(); return; }
  if(action === 'start-group'){ startGroup(el.getAttribute('data-level'), Number(el.getAttribute('data-g'))); return; }
  if(action === 'choose'){ chooseOption(el.getAttribute('data-mark')); return; }
  if(action === 'pick-tray'){ pickTray(el.getAttribute('data-mark')); return; }
  if(action === 'tap-slot'){ tapSlot(Number(el.getAttribute('data-i'))); return; }
  if(action === 'check'){ checkAnswer(); return; }
  if(action === 'next'){ nextQuestion(); return; }
  if(action === 'quiz-exit'){ requestQuizExit(); return; }
  if(action === 'reset-progress'){
    state.modal = { kind: 'reset', title: '重置學習進度？', text: '所有「已學會」與「已完成」的紀錄都會清除，此操作不能復原。' };
    render();
    return;
  }
  if(action === 'modal-cancel'){ state.modal = null; render(); return; }
  if(action === 'modal-ok'){
    if(state.modal && state.modal.kind === 'reset'){ resetProgress(); return; }
    state.modal = null;
    const qz = state.quiz;
    if(qz && qz.backTo){
      if(qz.backTo.screen === 'teach'){ state.markIndex = qz.backTo.markIndex; state.screen = 'teach'; }
      else { state.screen = 'challenge'; }
    }else{ state.screen = 'home'; }
    render();
    return;
  }
  if(action === 'modal-bg'){ return; }
  if(action === 'restart'){ restartQuiz(); return; }
  if(action === 'result-back'){ resultBack(); return; }
});

/* ======================= 啟動 ======================= */
loadProgress();
render();
})();
</script>
</body>
</html>
