<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>嘭嘭嘭．擬聲詞樂園｜小學擬聲詞互動遊戲</title>
<meta name="description" content="初小版與高小版各三種玩法：拼字工坊、圖文配對、句子填空、情境推理、分類高手、句子診所。繁體字、Q版插圖、即時音效，手機可直接玩。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#1F2B45;
  --paper:#FFFBF2;
  --cream:#FFF3DC;
  --coral:#FF6F59;
  --coral-soft:#FFE1DA;
  --sun:#FFC93C;
  --sun-soft:#FFF2C9;
  --mint:#2EC4B6;
  --mint-soft:#D8F6F1;
  --sky:#4EA8DE;
  --sky-soft:#DCEFFB;
  --grape:#8E7DFF;
  --grape-soft:#E8E3FF;
  --pink:#FF9BB3;
  --pink-soft:#FFE4EA;
  --muted:#7C6A5C;
  --line:#E7D6BF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Yuanti TC','YuanTi TC','PingFang TC','Hiragino Sans TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 88% 4%, rgba(255,201,60,.38), transparent 32%),
    radial-gradient(circle at 4% 18%, rgba(78,168,222,.24), transparent 30%),
    radial-gradient(circle at 52% 102%, rgba(46,196,182,.24), transparent 44%),
    var(--cream);
  background-attachment:fixed;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px dashed var(--coral);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(26px + env(safe-area-inset-bottom));min-height:100dvh;position:relative;z-index:1;display:flex;flex-direction:column}
.app::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(31,43,69,.10) 1px, transparent 1px);
  background-size:19px 19px;
  -webkit-mask-image:radial-gradient(circle at 50% 26%, #000 20%, transparent 82%);
  mask-image:radial-gradient(circle at 50% 26%, #000 20%, transparent 82%);
}
.screen{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.9;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 通用 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 8px;position:sticky;top:0;z-index:30;background:rgba(255,243,220,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tb-title{flex:1;min-width:0;font-size:16px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px}
.icon-btn{width:42px;height:42px;flex:0 0 42px;border:2.6px solid var(--ink);border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.icon-btn svg{width:21px;height:21px;display:block}
.icon-btn.off{background:#EFE4D2;color:#A6957F}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border:3px solid var(--ink);border-radius:16px;background:var(--coral);color:#fff;font-weight:900;font-size:16px;letter-spacing:.5px;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:12px;font-weight:800;letter-spacing:.5px}
.art{width:100%;height:100%;display:block;overflow:visible}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- 首頁 ---------- */
.home-top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 4px}
.brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;letter-spacing:1.4px;color:var(--ink);flex:1}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--ink);display:inline-block}
.hero{position:relative;padding:16px 0 0}
.hero-kicker{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:2.4px solid var(--ink);border-radius:999px;background:var(--sun);box-shadow:0 3px 0 var(--ink);font-size:11px;font-weight:900;letter-spacing:1.6px;transform:rotate(-1.4deg)}
.hero-kicker svg{width:14px;height:14px}
.hero h1{
  margin:14px 0 0;font-size:clamp(46px,15vw,64px);line-height:.94;font-weight:900;letter-spacing:3px;
  color:var(--sun);-webkit-text-stroke:2.6px var(--ink);paint-order:stroke fill;
  text-shadow:4px 5px 0 var(--ink);
}
.hero h1 span{display:inline-block;transform:rotate(-3deg)}
.hero h1 span:nth-child(2){transform:rotate(2deg) translateY(-3px);color:var(--coral);-webkit-text-stroke:2.4px var(--ink)}
.hero h1 span:nth-child(3){transform:rotate(-1deg)}
.hero-sub{margin:16px 0 0;max-width:240px;font-size:15px;line-height:1.72;font-weight:700;color:#5E4E42;border-left:4px solid var(--coral);padding-left:10px}
.hero-note{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:800;color:var(--muted)}
.hero-note svg{width:15px;height:15px}
.mascot{position:absolute;right:-8px;bottom:-6px;width:128px;height:128px;pointer-events:none;animation:float 4.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-7px) rotate(-2deg)}}
.tape{margin:22px -16px 0;background:var(--ink);color:var(--sun);padding:9px 0;transform:rotate(-2.2deg);overflow:hidden;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);position:relative;z-index:2}
.tape-track{display:flex;gap:16px;white-space:nowrap;width:max-content;animation:marquee 26s linear infinite;font-size:13px;font-weight:900;letter-spacing:1.5px}
.tape-track span{display:inline-flex;align-items:center;gap:16px}
.tape-track span::after{content:'●';font-size:7px;color:var(--coral)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:1px}
.sec-head p{margin:0;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.ver-card{width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);position:relative;margin-bottom:14px;transition:transform .12s,box-shadow .12s}
.ver-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ver-a{transform:rotate(-1.1deg)}
.ver-b{transform:rotate(1deg)}
.ver-ico{width:88px;height:88px;flex:0 0 88px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;padding:8px;position:relative;overflow:hidden}
.ver-ico::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(31,43,69,.16) 1px,transparent 1px);background-size:9px 9px;opacity:.5}
.ver-info{flex:1;min-width:0}
.ver-info h3{margin:0;font-size:21px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.grade-tag{font-size:10px;font-weight:900;letter-spacing:.5px;padding:3px 7px;border:2px solid var(--ink);border-radius:7px;background:var(--sun-soft);transform:rotate(-2deg)}
.ver-info p{margin:4px 0 7px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.5}
.ver-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver-score{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.3px}
.ver-score svg{width:14px;height:14px;flex:0 0 14px;display:block}
.ver-score b{color:var(--ink);font-size:12px}
.stars{display:inline-flex;align-items:center;gap:2px}
.stars svg{width:15px;height:15px;display:block}
.star-on{fill:var(--sun);stroke:var(--ink);stroke-width:1.6}
.star-off{fill:#EADCC8;stroke:var(--ink);stroke-width:1.5}
.ver-go{margin-left:auto;width:34px;height:34px;flex:0 0 34px;border:2.6px solid var(--ink);border-radius:50%;background:var(--coral);display:grid;place-items:center;color:#fff;box-shadow:0 2px 0 var(--ink)}
.ver-go svg{width:17px;height:17px}
.lesson{margin-top:24px;border:2.6px solid var(--ink);border-radius:18px;background:rgba(255,251,242,.86);padding:0 14px;box-shadow:0 4px 0 rgba(31,43,69,.18)}
.lesson summary{list-style:none;cursor:pointer;padding:13px 0;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary svg{width:17px;height:17px;flex:0 0 17px}
.lesson summary .chev{margin-left:auto;transition:transform .2s;width:14px;height:14px}
.lesson[open] summary .chev{transform:rotate(180deg)}
.lesson-body{padding:0 0 14px;font-size:13px;line-height:1.75;font-weight:600;color:#56463B}
.lesson-body b{color:var(--coral)}
.lesson-body p{margin:0 0 8px}
.lesson-body p:last-child{margin:0}
.foot{margin-top:22px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;line-height:1.8}
.foot b{color:var(--ink)}

/* ---------- 版本頁 ---------- */
.ver-hero{display:flex;align-items:center;gap:12px;padding:6px 0 4px}
.ver-hero .badge-big{width:66px;height:66px;flex:0 0 66px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;padding:6px;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink)}
.ver-hero h1{margin:0;font-size:26px;font-weight:900;letter-spacing:1px}
.ver-hero p{margin:3px 0 0;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.5}
.mode-card{position:relative;width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 13px 13px 20px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--ink);margin-bottom:12px;overflow:hidden;transition:transform .12s,box-shadow .12s}
.mode-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mode-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--tint)}
.mode-ico{width:62px;height:62px;flex:0 0 62px;border:2.6px solid var(--ink);border-radius:15px;background:var(--tint-soft);display:grid;place-items:center;padding:6px;position:relative}
.mode-body{flex:1;min-width:0}
.mode-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.mode-top h3{margin:0;font-size:17px;font-weight:900;letter-spacing:.5px}
.mode-num{font-size:10px;font-weight:900;color:#fff;background:var(--tint);border:1.8px solid var(--ink);border-radius:5px;padding:1px 5px;letter-spacing:.5px}
.mode-body p{margin:0 0 4px;font-size:11.5px;line-height:1.5;font-weight:700;color:var(--muted)}
.mode-meta{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;color:var(--muted)}
.mode-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.mode-arrow{width:30px;height:30px;flex:0 0 30px;border:2.4px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:#fff}
.mode-arrow svg{width:15px;height:15px}
.tint-coral{--tint:var(--coral);--tint-soft:var(--coral-soft)}
.tint-sun{--tint:#E8A400;--tint-soft:var(--sun-soft)}
.tint-mint{--tint:var(--mint);--tint-soft:var(--mint-soft)}
.tint-sky{--tint:var(--sky);--tint-soft:var(--sky-soft)}
.tint-grape{--tint:var(--grape);--tint-soft:var(--grape-soft)}
.tint-pink{--tint:#E8658A;--tint-soft:var(--pink-soft)}
.tip-card{margin-top:18px;display:flex;gap:10px;align-items:flex-start;padding:13px;border:2.6px dashed var(--ink);border-radius:16px;background:rgba(255,255,255,.6);font-size:12px;line-height:1.65;font-weight:700;color:#56463B}
.tip-card svg{width:19px;height:19px;flex:0 0 19px;margin-top:1px}

/* ---------- 遊戲 ---------- */
.game-head{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 0 0}
.game-head .gtitle{flex:1;min-width:0}
.game-head h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-head .gsub{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.6px}
.prog-wrap{margin-top:10px}
.prog-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.prog-top b{color:var(--ink)}
.prog{height:11px;border:2.6px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 2px 0 rgba(31,43,69,.18)}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qcard{margin-top:14px;padding:16px;border:3px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:0 6px 0 var(--ink);position:relative}
.q-eyebrow{font-size:10.5px;font-weight:900;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.q-title{margin:0 0 4px;font-size:21px;font-weight:900;line-height:1.35;letter-spacing:.5px}
.q-desc{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.6}
/* 拼字工坊 */
.build-stage{display:flex;align-items:center;gap:12px;margin:10px 0 14px;padding:10px;border:2.8px solid var(--ink);border-radius:18px;background:linear-gradient(135deg,var(--sun-soft),#fff);box-shadow:0 4px 0 var(--ink)}
.build-stage .bs-art{width:82px;height:82px;flex:0 0 82px;border:2.4px solid var(--ink);border-radius:14px;background:#fff;padding:5px}
.build-stage .bs-label{font-size:10.5px;font-weight:900;letter-spacing:1.4px;color:var(--muted)}
.build-stage .bs-tip{font-size:14px;font-weight:900;line-height:1.5;margin-top:3px}
.slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:4px 0 12px}
.slots.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px) rotate(-1deg)}45%{transform:translateX(7px) rotate(1deg)}70%{transform:translateX(-4px)}}
.slot{width:52px;height:56px;border:3px dashed rgba(31,43,69,.45);border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.slot.filled{border-style:solid;background:#fff;box-shadow:0 3px 0 var(--ink)}
.slot:active{transform:translateY(2px)}
.slot-dot{width:9px;height:9px;border-radius:50%;background:rgba(31,43,69,.22)}
.tile-tray{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:2px}
.ctile{min-width:52px;height:56px;padding:0 8px;border:3px solid var(--ink);border-radius:12px;background:var(--sun);font-size:26px;font-weight:900;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,opacity .15s}
.ctile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ctile.used{opacity:.26;pointer-events:none;box-shadow:none}
/* 情境推理 */
.scene-card{position:relative;margin:10px 0 12px;padding:12px;border:2.8px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.scene-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 6%,rgba(78,168,222,.18),transparent 58%);pointer-events:none}
.scene-inner{position:relative;display:flex;gap:11px;align-items:center}
.scene-art{width:74px;height:74px;flex:0 0 74px;border:2.4px solid var(--ink);border-radius:14px;background:var(--sky-soft);padding:5px}
.scene-txt{flex:1;min-width:0;font-size:15px;line-height:1.85;font-weight:800}
.scene-txt .blank{display:inline-block;min-width:64px;margin:0 3px;border-bottom:3px solid var(--ink);color:var(--coral);text-align:center;letter-spacing:1px}
.sense-box{margin:10px 0 2px;padding:10px;border:2.4px dashed rgba(31,43,69,.35);border-radius:13px;background:rgba(255,255,255,.65)}
.sense-label{display:block;font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.sense-tags{display:flex;flex-wrap:wrap;gap:6px}
.sense-tag{font-size:11.5px;font-weight:900;padding:4px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--mint-soft)}
.sense-note{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.65;margin-top:7px}
.options{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.option{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;background:#fff;border:2.8px solid var(--ink);border-radius:15px;box-shadow:0 4px 0 var(--ink);font-size:18px;font-weight:900;letter-spacing:1.5px;text-align:left;transition:transform .1s,box-shadow .1s,background .15s}
.option:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.option .badge{width:27px;height:27px;flex:0 0 27px;border:2px solid var(--ink);border-radius:50%;background:var(--sky-soft);display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:0}
.option .opt-txt{flex:1;min-width:0}
.option .opt-mark{width:22px;height:22px;flex:0 0 22px;opacity:0}
.option.correct{background:var(--mint-soft);border-color:var(--ink)}
.option.correct .opt-mark{opacity:1}
.option.correct .badge{background:var(--mint);color:#fff}
.option.wrong{background:var(--pink-soft)}
.option.wrong .badge{background:var(--coral);color:#fff}
.option.dim{opacity:.5}
.option:disabled{cursor:default}
.option:disabled:active{transform:none;box-shadow:0 4px 0 var(--ink)}
.fb{margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:18px;background:var(--mint-soft);box-shadow:0 4px 0 var(--ink);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.fb.bad{background:var(--pink-soft)}
@keyframes pop{from{transform:scale(.97);opacity:.9}to{transform:scale(1);opacity:1}}
.fb-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb-head svg{width:23px;height:23px;flex:0 0 23px}
.fb-head h3{margin:0;font-size:17px;font-weight:900;letter-spacing:.5px}
.fb p{margin:0 0 8px;font-size:13.5px;line-height:1.7;font-weight:700;color:#4B3D33}
.fb .word-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.fb .big-word{font-size:24px;font-weight:900;letter-spacing:2px;color:var(--ink);background:#fff;border:2.4px solid var(--ink);border-radius:11px;padding:2px 11px;box-shadow:0 2px 0 var(--ink)}
.fb .example{background:rgba(255,255,255,.7);border-left:4px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.65;font-weight:700;margin-top:8px}
.fb .example b{color:var(--coral)}
.fb .fb-next{margin-top:11px}
.answer-reveal{display:flex;align-items:center;gap:12px;margin:12px 0 2px;padding:9px;border:2.6px solid var(--ink);border-radius:15px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.answer-reveal .mini-art{width:56px;height:56px;flex:0 0 56px;border:2px solid var(--ink);border-radius:11px;padding:3px}
.answer-reveal .ar-txt{font-size:12px;font-weight:700;color:var(--muted);line-height:1.5}
.answer-reveal .ar-txt b{display:block;font-size:16px;color:var(--ink);letter-spacing:1px}

/* 配對 */
.pair-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pair-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px 5px;border:2.6px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.pair-tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

.wchip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;min-height:44px}

var Sfx = {
  ctx:null, on:true, _nb:null,
  init:function(){
    if(!this.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ try{ this.ctx = new AC(); }catch(e){ this.ctx = null; } }
    }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume(); }
    return this.ctx;
  },
  now:function(){ return this.ctx ? this.ctx.currentTime : 0; },
  tone:function(freq, dur, type, vol, delay, slideTo){
    if(!this.on) return;
    var ctx = this.init(); if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05, t0+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  },
  noiseBuf:function(){
    var ctx=this.ctx;
    if(this._nb) return this._nb;
    var len = Math.floor(ctx.sampleRate*2);
    var b = ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._nb=b; return b;
  },
  noise:function(dur, vol, filter, freq, q, delay, slideTo){
    if(!this.on) return;
    var ctx=this.init(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var src=ctx.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
    var bp=ctx.createBiquadFilter(); bp.type=filter||'lowpass'; bp.frequency.setValueAtTime(freq||1200,t0); bp.Q.value=q||1;
    if(slideTo) bp.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0+dur+0.05);
  },
  click:function(){ this.tone(560,0.06,'triangle',0.035); },
  pop:function(){ this.tone(720,0.09,'sine',0.05); },

  win:function(){ var self=this; [523,659,784,1047].forEach(function(f,i){ self.tone(f,0.23,'triangle',0.055,i*0.1); }); },
  star:function(i){ this.tone(660+i*140,0.16,'sine',0.05); },

};

      else cls += ' dim';
    }
    return '<button class="'+cls+'" data-action="option" data-i="'+i+'" '+(S.revealed?'disabled':'')+'>'+
      '<span class="badge">'+String.fromCharCode(65+i)+'</span>'+
      '<span class="opt-txt">'+esc(o)+'</span>'+
      '<span class="opt-mark">'+(i===q.answer?ICON.check:(i===S.chosen?ICON.cross:''))+'</span>'+
    '</button>';
  }).join('');

  return '<div class="qcard">'+head+
    '<div class="options">'+opts+'</div>'+
    (S.revealed?feedbackHTML():'<p class="hintline">'+m.tip+'</p>')+
  '</div>';
}

/* 拼字工坊 */
function renderBuild(m,q){
  var slots='';
  for(var i=0;i<q.word.length;i++){
    var tid = S.slots[i];
    var ch = (tid===undefined) ? '' : S.tiles[tid].ch;
    slots += '<button class="slot '+(ch?'filled':'')+'" data-action="slot" data-i="'+i+'" aria-label="第 '+(i+1)+' 格">'+(ch?esc(ch):'<span class="slot-dot"></span>')+'</button>';
  }
  var tiles = S.tiles.map(function(t,i){
    var used = S.slots.indexOf(i)!==-1;
    return '<button class="ctile '+(used?'used':'')+'" data-action="tile" data-i="'+i+'" '+(used||S.revealed?'disabled':'')+'>'+esc(t.ch)+'</button>';
  }).join('');

  return '<div class="qcard">'+
    '<div class="q-eyebrow">拼字工坊 · 第 '+(S.qIndex+1)+' / 6 題</div>'+
    '<h2 class="q-title" style="font-size:19px">把字卡排成擬聲詞</h2>'+
    '<div class="build-stage"><div class="bs-art">'+artSVG(q.art)+'</div><div><div class="bs-label">'+esc(q.label)+'</div><div class="bs-tip">'+(S.revealed?'排對了！':'看看圖畫，想想它會發出甚麼聲音。')+'</div></div></div>'+
    '<div class="slots'+(S.buildWrong?' shake':'')+'">'+slots+'</div>'+
    '<div class="tile-tray">'+tiles+'</div>'+
    (S.revealed?feedbackHTML():'<p class="hintline">'+m.tip+'</p>')+
  '</div>';
}

/* 情境推理 */
function renderScene(m,q){
  var parts = q.scene.split('＿＿');
  var opts = q.options.map(function(o,i){
    var cls = 'option';
    if(S.revealed){
      if(i===q.answer) cls += ' correct';
      else if(i===S.chosen) cls += ' wrong';
      else cls += ' dim';
    }
    return '<button class="'+cls+'" data-action="option" data-i="'+i+'" '+(S.revealed?'disabled':'')+'>'+
      '<span class="badge">'+String.fromCharCode(65+i)+'</span>'+
      '<span class="opt-txt">'+esc(o)+'</span>'+
      '<span class="opt-mark">'+(i===q.answer?ICON.check:(i===S.chosen?ICON.cross:''))+'</span>'+
    '</button>';
  }).join('');

  return '<div class="qcard">'+
    '<div class="q-eyebrow">情境推理 · 第 '+(S.qIndex+1)+' / 6 題</div>'+
    '<div class="scene-card"><div class="scene-inner">'+
      '<div class="scene-art">'+artSVG(q.art)+'</div>'+
      '<div class="scene-txt">'+esc(parts[0])+'<span class="blank">'+(S.revealed?esc(q.word):'？？')+'</span>'+esc(parts[1]||'')+'</div>'+
    '</div></div>'+
    '<h2 class="q-title" style="font-size:17px">哪個擬聲詞最貼切？</h2>'+
    '<p class="q-desc">'+(S.revealed?'看「聲音質感」，想想它為甚麼貼切。':'留意場合、力度和節奏。')+'</p>'+
    '<div class="options">'+opts+'</div>'+
    (S.revealed?feedbackHTML():'<p class="hintline">'+m.tip+'</p>')+
  '</div>';
}

function feedbackHTML(){
  var q = currentQ(), m = modeDef();
  var good = (m.type==='build') ? true : (S.chosen === q.answer);
  var word = q.word;
  var example = q.sentence || (q.before ? (q.before + '「' + q.word + '」' + q.after) : '');
  var lead = (m.type==='build')
    ? '答對了！你把字卡排成了「'+esc(word)+'」。'
    : (good ? '你選對了本題的擬聲詞。' : '正確答案是「'+esc(word)+'」，再看一次小知識。');
  var sense = '';
  if(m.type==='scene' && q.tags){
    sense = '<div class="sense-box"><span class="sense-label">聲音質感</span><div class="sense-tags">'+
      q.tags.map(function(t){ return '<span class="sense-tag">'+esc(t)+'</span>'; }).join('')+
      '</div><p class="sense-note">'+esc(q.tip)+'</p></div>';
  }
  return '<div class="fb '+(good?'':'bad')+'" role="status">'+
    '<div class="fb-head">'+(good?ICON.check:ICON.cross)+'<h3>'+(good?(m.type==='build'?'拼對了！':'答對了！'):'差一點點')+'</h3></div>'+
    '<p>'+lead+'</p>'+sense+
    '<div class="word-line"><span class="big-word">'+esc(word)+'</span></div>'+
    (example?'<div class="example">例句：'+esc(example)+'</div>':'')+
    (sense?'':'<p style="margin-top:9px"><b style="color:var(--ink)">小知識：</b>'+esc(q.tip)+'</p>')+
    '<button class="btn sun fb-next" data-action="next">'+(S.qIndex>=5?'看成績':'下一題')+ICON.arrow+'</button>'+
  '</div>';
}

/* 配對 */
function renderPair(q){
  var pairs = q.pairs;
  var pics = pairs.map(function(p,i){
    var done = S.matched.indexOf(i)!==-1;
    return '<button class="pair-tile '+(done?'done':'')+'" data-action="pair-art" data-i="'+i+'" '+(done?'disabled':'')+'>'+
      '<span class="p-art">'+artSVG(p.art)+'</span><span class="p-label">'+esc(p.label)+'</span>'+
    '</button>';
  }).join('');
  var order = S.wordOrder || [0,1,2,3,4,5];
  var words = order.map(function(idx){
    var used = S.matched.indexOf(idx)!==-1;
    return '<button class="wchip '+(S.selWord===idx?'sel':'')+' '+(used?'used':'')+'" data-action="pair-word" data-i="'+idx+'" '+(used?'disabled':'')+'>'+esc(pairs[idx].word)+'</button>';
  }).join('');

  var done = S.matched.length===6;
  return '<div class="qcard">'+
    '<div class="q-eyebrow">圖文配對 · 6 組</div>'+
    '<h2 class="q-title">把聲音貼回圖畫</h2>'+
    '<p class="q-desc">先點下面的詞語卡，再點上面的圖畫。</p>'+
    '<div class="pair-grid">'+pics+'</div>'+
    (done?'':'<div class="tray-title"><span>詞語卡</span><b>'+S.matched.length+' / 6</b></div>'+
    '<div class="word-tray">'+words+'</div>')+
    (done?pairDoneHTML(q):'<p class="hintline">'+(S.selWord===null?'先選一張詞語卡':'已選「'+esc(pairs[S.selWord].word)+'」，再點圖畫')+'</p>')+
  '</div>';
}

function pairDoneHTML(q){
  return '<div class="fb" role="status">'+
    '<div class="fb-head">'+ICON.check+'<h3>全部配對成功！</h3></div>'+
    '<p>你已經把 6 個擬聲詞和圖畫連起來了。試着讀出每個詞語，記得會更牢。</p>'+
    '<div class="learned-list" style="margin-top:8px">'+
      q.pairs.map(function(p){ return '<span class="lword">'+esc(p.word)+'</span>'; }).join('')+
    '</div>'+
    '<button class="btn sun fb-next" data-action="finish">看成績'+ICON.arrow+'</button>'+
  '</div>';
}

/* 分類 */
function renderSort(q){
  var bins = q.bins.map(function(b){
    var list = [];
    q.chips.forEach(function(c,i){ if(S.placed[i]===b.id) list.push('<span class="mini-chip">'+esc(c.word)+'</span>'); });
    return '<button class="bin '+(list.length===3?'full':'')+'" data-action="bin" data-bin="'+b.id+'">'+
      '<span class="bin-head"><span class="bin-art">'+artSVG(b.art)+'</span><span>'+b.label+'</span><em>'+list.length+'/3</em></span>'+
      '<span class="bin-placed">'+(list.length?list.join(''):'<span style="font-size:10.5px;font-weight:700;color:var(--muted)">放這裏</span>')+'</span>'+
    '</button>';
  }).join('');
  var bank = q.chips.map(function(c,i){
    if(S.placed[i]) return '';
    return '<button class="schip '+(S.selChip===i?'sel':'')+'" data-action="chip" data-i="'+i+'">'+esc(c.word)+'</button>';
  }).join('');

  var done = Object.keys(S.placed).length===12;
  return '<div class="qcard">'+
    '<div class="q-eyebrow">分類 · 12 個擬聲詞</div>'+
    '<h2 class="q-title">聲音也有家族</h2>'+
    '<p class="q-desc">先點一個詞語，再點它所屬的類別。</p>'+
    (done?'':'<div class="bank">'+bank+'</div>')+
    '<div class="bins">'+bins+'</div>'+
    (done?sortDoneHTML(q):'<p class="hintline">'+(S.selChip===null?'先點一個擬聲詞':'已選「'+esc(q.chips[S.selChip].word)+'」，再點類別箱')+'</p>')+
  '</div>';
}

function sortDoneHTML(q){
  return '<div class="fb" role="status">'+
    '<div class="fb-head">'+ICON.check+'<h3>十二個都歸位了！</h3></div>'+
    '<p>動物、自然、器物、人的聲音，四大家族都齊了。</p>'+
    '<div class="learned-list" style="margin-top:8px">'+
      q.bins.map(function(b){
        var ws = q.chips.filter(function(c){ return c.bin===b.id; }).map(function(c){ return c.word; }).join('、');
        return '<span class="lword" style="letter-spacing:0">'+b.label+'：'+esc(ws)+'</span>';
      }).join('')+
    '</div>'+
    '<button class="btn sun fb-next" data-action="finish">看成績'+ICON.arrow+'</button>'+
  '</div>';
}

/* 句子診所 */
function renderClinic(q){
  var toks = q.tokens.map(function(t,i){
    if(/^[，。！？、；：]$/.test(t)) return '<span class="punct">'+esc(t)+'</span>';
    var cls = 'tok';
    if(S.found && i===q.wrongIndex) cls += ' wrong';
    if(S.fixPick!==null && i===q.wrongIndex) cls += ' fixed';
    var show = (S.fixPick!==null && i===q.wrongIndex) ? q.options[q.answer] : t;
    return '<button class="'+cls+'" data-action="token" data-i="'+i+'" '+(S.found?'disabled':'')+'>'+esc(show)+'</button>';
  }).join('');

  var fixArea = '';
  if(S.found && S.fixPick===null){
    fixArea = '<div class="clinic-fix">'+
      '<p class="q-desc">找到了！把「'+esc(q.wrong)+'」換成哪一個？</p>'+
      '<div class="options">'+q.options.map(function(o,i){
        return '<button class="option" data-action="fix" data-i="'+i+'">'+
          '<span class="badge">'+String.fromCharCode(65+i)+'</span>'+
          '<span class="opt-txt">'+esc(o)+'</span>'+
          '<span class="opt-mark"></span></button>';
      }).join('')+'</div>'+
    '</div>';
  }

  var fb = '';
  if(S.fixPick!==null){
    var good = S.fixPick===q.answer;
    fb = '<div class="fb '+(good?'':'bad')+'" role="status">'+
      '<div class="fb-head">'+(good?ICON.check:ICON.cross)+'<h3>'+(good?'句子醫好了！':'再想一想')+'</h3></div>'+
      '<p>'+(good?'「'+esc(q.tokens[q.wrongIndex])+'」用錯了，換成「'+esc(q.options[q.answer])+'」就通順了。':'這個詞仍然配不上句子的主角。正確答案是「'+esc(q.options[q.answer])+'」。')+'</p>'+
      '<div class="example">修改後：'+esc(q.tokens.map(function(t,i){ return i===q.wrongIndex?q.options[q.answer]:t; }).join(''))+'</div>'+
      '<p style="margin-top:9px"><b style="color:var(--ink)">小知識：</b>'+esc(q.tip)+'</p>'+
      '<button class="btn sun fb-next" data-action="next">'+(S.qIndex>=5?'看成績':'下一題')+ICON.arrow+'</button>'+
    '</div>';
  }

  return '<div class="qcard">'+
    '<div class="q-eyebrow">句子診所 · 第 '+(S.qIndex+1)+' / 6 題</div>'+
    '<h2 class="q-title" style="font-size:18px">'+(S.found?'找到了！把「'+esc(q.wrong)+'」換走。':'句子裏有一個擬聲詞用錯了，點它出來。')+'</h2>'+
    '<div class="sentence">'+toks+'</div>'+
    '<div class="clinic-note">'+ICON.bulb+'<span>'+(S.found?'已找到錯處，選一個詞換進去。':'逐個詞點一點，找出配不上句子的擬聲詞。')+'</span></div>'+
    fixArea+fb+
  '</div>';
}

/* ---------------- 結果 ---------------- */
function resultHTML(){
  var m = modeDef(), total = (m.type==='sort')?12:6;
  var got = (m.type==='sort')?12 : (m.type==='pair'?6:S.correct);
  var stars = S.mistakes===0?3:(S.mistakes<=2?2:1);
  var prev = bestOf(S.version,S.mode);
  if(stars>prev){ S.best[S.version+':'+S.mode]=stars; saveBest(); }
  var titles = {3:'擬聲大師',2:'擬聲小達人',1:'再試一次就更好'};
  var blurbs = {
    3:'你的觀察很細緻，擬聲詞搭配得又準又自然。',
    2:'已經很不錯了，再玩一次，挑戰零失誤。',
    1:'多看幾次圖畫、多讀例句，你會發現聲音裏藏着很多詞語。'
  };
  var words = learnedWords(m);
  return '<div class="screen result">'+
    confettiHTML(stars)+
    '<div class="medal">'+
      '<svg class="rays" viewBox="0 0 200 200" aria-hidden="true">'+
        (function(){
          var out='';
          for(var i=0;i<12;i++) out += '<path d="M100 18l5 16h-10z" fill="#FFC93C" stroke="#1F2B45" stroke-width="2.4" transform="rotate('+(i*30)+' 100 100)"/>';
          return out;
        })()+
      '</svg>'+
      '<div class="medal-core">'+ICON.trophy+'</div>'+
    '</div>'+
    '<h1>'+titles[stars]+'</h1>'+
    '<p class="res-sub">'+blurbs[stars]+'</p>'+
    '<div class="big-stars">'+starSVG(stars>=1)+starSVG(stars>=2)+starSVG(stars>=3)+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+got+'/'+total+'</b><span>'+(m.type==='pair'?'配對完成':(m.type==='sort'?'完成分類':'答對題數'))+'</span></div>'+
      '<div class="stat"><b>'+S.mistakes+'</b><span>失誤次數</span></div>'+
      '<div class="stat"><b>'+stars+'</b><span>本次星級（共 3）</span></div>'+
    '</div>'+
    '<div class="learned"><h2>'+ICON.star+'這次用過的擬聲詞</h2>'+
      '<div class="learned-list">'+words.map(function(w){ return '<span class="lword">'+esc(w)+'</span>'; }).join('')+'</div>'+
    '</div>'+
    '<div class="res-actions">'+
      '<button class="btn" data-action="retry">'+ICON.replay+'再玩一次</button>'+
      '<button class="btn ghost" data-action="back-version">選其他玩法</button>'+
      '<button class="btn ghost" data-action="home">回到首頁</button>'+
    '</div>'+
    '<p class="res-note">星星會保存在這部裝置，下次再來挑戰。</p>'+
  '</div>';
}

function learnedWords(m){
  var out=[], seen={};
  function add(w){ if(w && !seen[w]){ seen[w]=1; out.push(w); } }
  if(m.type==='pair' || m.type==='sort'){
    var q = m.questions[0];
    if(m.type==='pair') q.pairs.forEach(function(p){ add(p.word); });
    else q.chips.forEach(function(c){ add(c.word); });
  }else{
    m.questions.forEach(function(q){
      if(m.type==='clinic'){ add(q.wrong); add(q.options[q.answer]); }
      else add(q.word);
    });
  }
  return out;
}

function confettiHTML(stars){
  if(stars<2) return '';
  var colors=['#FF6F59','#FFC93C','#2EC4B6','#4EA8DE','#8E7DFF','#FF9BB3'];
  var bits='';
  for(var i=0;i<22;i++){
    bits += '<i style="left:'+Math.round(Math.random()*96)+'%;background:'+colors[i%colors.length]+';animation-duration:'+(2.4+Math.random()*1.6).toFixed(2)+'s;animation-delay:'+(Math.random()*0.9).toFixed(2)+'s;transform:rotate('+(i*23)+'deg)"></i>';
  }
  return '<div class="confetti" aria-hidden="true">'+bits+'</div>';
}

/* ---------------- 流程 ---------------- */
function makeTiles(q){
  var arr = q.chars.concat(q.distractors || []);
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr.map(function(ch,i){ return {ch:ch, id:i}; });
}

function checkBuild(){
  var q = currentQ();
  var built = S.slots.map(function(id){ return S.tiles[id].ch; }).join('');
  if(built === q.word){
    S.revealed = true; S.correct++; S.buildWrong = false;
    Sfx.correct(); render();
    var fb = app.querySelector('.fb');
    if(fb) setTimeout(function(){ fb.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
  }else{
    S.mistakes++; S.buildWrong = true;
    Sfx.wrong(); render();
    toast('次序不對，再試一次');
    setTimeout(function(){
      if(S.screen==='game' && S.mode==='build' && !S.revealed){
        S.slots = []; S.buildWrong = false; render();
      }
    }, 620);
  }
}

function render(){
  var html='';
  if(S.screen==='home') html=homeHTML();
  else if(S.screen==='version') html=versionHTML();
  else if(S.screen==='game') html=gameHTML();
  else if(S.screen==='result') html=resultHTML();
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:'auto'});
}

function startMode(v,modeId){
  S.version=v; S.mode=modeId; S.screen='game';
  S.qIndex=0; S.correct=0; S.mistakes=0; S.chosen=null; S.revealed=false;
  S.selWord=null; S.matched=[]; S.selChip=null; S.placed={}; S.found=false; S.fixPick=null;
  S.slots=[]; S.tiles=[]; S.buildWrong=false;
  var m = modeDef();
  if(m.type==='pair') S.wordOrder = [0,1,2,3,4,5].sort(function(){ return Math.random()-0.5; });
  if(m.type==='build') S.tiles = makeTiles(m.questions[0]);
  render();
}

function resetQuestion(){
  S.chosen=null; S.revealed=false; S.found=false; S.fixPick=null;
  S.slots=[]; S.buildWrong=false;
  if(modeDef().type==='build') S.tiles = makeTiles(currentQ());
}

function nextQuestion(){
  var m = modeDef();
  if(S.qIndex >= m.questions.length-1){ goResult(); return; }
  S.qIndex++; resetQuestion(); render();
}

function goResult(){
  S.screen='result'; render(); Sfx.win();
  [0,1,2].forEach(function(i){ setTimeout(function(){ Sfx.star(i); }, 420+i*180); });
}

/* ---------------- 事件 ---------------- */
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  Sfx.init();
  if(['option','chip','bin','token','fix','pair-art','pair-word','tile','slot'].indexOf(action)===-1) Sfx.click();

  if(action==='toggle-sound'){
    S.soundOn=!S.soundOn; Sfx.on=S.soundOn; saveBest();
    if(S.soundOn) Sfx.pop();
    render(); return;
  }
  if(action==='home'){ S.screen='home'; S.version=null; S.mode=null; render(); return; }
  if(action==='pick-version'){ S.version=el.getAttribute('data-v'); S.screen='version'; render(); return; }
  if(action==='back-version'){ S.screen='version'; render(); return; }
  if(action==='open-mode'){ startMode(S.version, el.getAttribute('data-m')); return; }
  if(action==='retry'){ startMode(S.version,S.mode); return; }

  if(action==='option'){
    if(S.revealed) return;
    var pick = parseInt(el.getAttribute('data-i'),10);
    var q = currentQ();
    S.chosen = pick; S.revealed = true;
    if(pick===q.answer){ S.correct++; Sfx.correct(); }
    else { S.mistakes++; Sfx.wrong(); }
    render();
    var fb = app.querySelector('.fb');
    if(fb) setTimeout(function(){ fb.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
    return;
  }
  if(action==='next'){ nextQuestion(); return; }
  if(action==='finish'){ goResult(); return; }

  if(action==='tile'){
    if(S.revealed) return;
    var ti = parseInt(el.getAttribute('data-i'),10);
    var qb = currentQ();
    if(S.slots.indexOf(ti)!==-1 || S.slots.length>=qb.word.length) return;
    S.slots.push(ti); Sfx.pop();
    if(S.slots.length===qb.word.length) checkBuild();
    else render();
    return;
  }
  if(action==='slot'){
    if(S.revealed) return;
    var si = parseInt(el.getAttribute('data-i'),10);
    if(si>=S.slots.length) return;
    S.slots.splice(si,1); Sfx.pop(); render();
    return;
  }

  if(action==='pair-word'){
    var wi = parseInt(el.getAttribute('data-i'),10);
    if(S.matched.indexOf(wi)!==-1) return;
    S.selWord = wi; Sfx.pop(); render(); return;
  }
  if(action==='pair-art'){
    var pi = parseInt(el.getAttribute('data-i'),10);
    if(S.selWord===null){ toast('先選一張詞語卡'); return; }
    if(S.matched.indexOf(pi)!==-1) return;
    if(S.selWord===pi){
      S.matched.push(pi); S.selWord=null; Sfx.correct(); render();
      if(S.matched.length===6) Sfx.win();
    }else{
      S.mistakes++; S.selWord=null; Sfx.wrong(); render();
      toast('這張卡配不上這幅圖，再試一次');
    }
    return;
  }

  if(action==='chip'){
    var ci = parseInt(el.getAttribute('data-i'),10);
    if(S.placed[ci]) return;
    S.selChip = (S.selChip===ci)?null:ci;
    Sfx.pop(); render(); return;
  }
  if(action==='bin'){
    var bid = el.getAttribute('data-bin');
    if(S.selChip===null){ toast('先點一個擬聲詞'); return; }
    var qs = modeDef().questions[0];
    var chip = qs.chips[S.selChip];
    if(chip.bin===bid){
      S.placed[S.selChip]=bid; S.selChip=null; Sfx.correct(); render();
      if(Object.keys(S.placed).length===12) Sfx.win();
    }else{
      S.mistakes++; Sfx.wrong(); toast('「'+chip.word+'」不屬於這一類，再想想');
    }
    return;
  }

  if(action==='token'){
    if(S.found) return;
    var tk = parseInt(el.getAttribute('data-i'),10);
    var qc = currentQ();
    if(tk===qc.wrongIndex){
      S.found=true; Sfx.pop(); render();
      var fixBox = app.querySelector('.clinic-fix');
      if(fixBox) setTimeout(function(){ fixBox.scrollIntoView({behavior:'smooth',block:'center'}); }, 70);
    }else{
      S.mistakes++; Sfx.wrong(); toast('這個詞配得上句子，再找找看');
    }
    return;
  }
  if(action==='fix'){
    var fi = parseInt(el.getAttribute('data-i'),10);
    var qf = currentQ();
    S.fixPick = fi;
    if(fi===qf.answer){ S.correct++; Sfx.correct(); }
    else { S.mistakes++; Sfx.wrong(); }
    render();
    var fb2 = app.querySelector('.fb');
    if(fb2) setTimeout(function(){ fb2.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
    return;
  }
});

document.addEventListener('pointerdown', function once(){
  Sfx.init();
  document.removeEventListener('pointerdown', once);
}, {passive:true});

S.slots=[]; S.tiles=[]; S.buildWrong=false;
Sfx.on = S.soundOn;
render();

})();
</script>
</body>
</html>
