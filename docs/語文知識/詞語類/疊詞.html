<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>疊疊小鎮｜小學疊詞互動遊戲</title>
<meta name="description" content="初小版與高小版，九種疊詞形式、十八個小遊戲：配對、拼字、填空、辨析、分類、句子診所。繁體字、Q版插畫、即時音效，手機可直接玩。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#22304A;
  --paper:#FFFDF7;
  --cream:#FFF4E2;
  --coral:#FF6B5B;
  --coral-soft:#FFE3DC;
  --sun:#FFC53D;
  --sun-soft:#FFF1C9;
  --mint:#22C3A6;
  --mint-soft:#D6F6EF;
  --sky:#3FA9E0;
  --sky-soft:#DCEFFB;
  --grape:#8B7BF7;
  --grape-soft:#E9E4FF;
  --pink:#FF8FA8;
  --pink-soft:#FFE4EA;
  --muted:#7A6A5C;
  --line:#E8D7C0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Yuanti TC','YuanTi TC','PingFang TC','Hiragino Sans TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 88% -4%, rgba(255,197,61,.42), transparent 38%),
    radial-gradient(circle at -8% 20%, rgba(34,195,166,.20), transparent 34%),
    radial-gradient(circle at 52% 104%, rgba(63,169,224,.22), transparent 44%),
    var(--cream);
  background-attachment:fixed;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(34,48,74,.10) 1px, transparent 1px);
  background-size:20px 20px;
  -webkit-mask-image:radial-gradient(circle at 50% 24%, #000 18%, transparent 80%);
  mask-image:radial-gradient(circle at 50% 24%, #000 18%, transparent 80%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px dashed var(--coral);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;position:relative;z-index:1}
.screen{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.94;transform:translateY(10px)}to{opacity:1;transform:none}}
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-deco i{position:absolute;display:block;border:3px solid var(--ink);border-radius:18px;opacity:.13;transform:rotate(-14deg)}
.bg-deco i:nth-child(1){width:96px;height:96px;background:var(--coral);left:-34px;top:16%}
.bg-deco i:nth-child(2){width:70px;height:70px;background:var(--sun);right:-22px;top:44%;transform:rotate(18deg)}
.bg-deco i:nth-child(3){width:120px;height:120px;background:var(--mint);left:-52px;bottom:6%;transform:rotate(10deg)}
.bg-deco i:nth-child(4){width:54px;height:54px;background:var(--sky);right:-16px;bottom:18%;transform:rotate(-22deg)}

/* ---------- 通用元件 ---------- */
.topbar{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 0 8px;position:sticky;top:0;z-index:30;background:rgba(255,244,226,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn{width:42px;height:42px;flex:0 0 42px;border:2.6px solid var(--ink);border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.icon-btn svg{width:19px;height:19px;display:block}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-size:16px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1.2px;margin-top:1px}
.stars{display:inline-flex;align-items:center;gap:2px}
.stars svg{width:15px;height:15px;display:block}
.star-on{fill:var(--sun);stroke:var(--ink);stroke-width:1.6}
.star-off{fill:#EADCC8;stroke:var(--ink);stroke-width:1.5}

/* ---------- 首頁 ---------- */
.brand-row{display:flex;align-items:center;gap:9px;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.brand-mark{width:40px;height:40px;flex:0 0 40px;border:2.6px solid var(--ink);border-radius:12px;background:var(--sun);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transform:rotate(-4deg);padding:4px}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{flex:1;min-width:0}
.brand-name b{display:block;font-size:17px;font-weight:900;letter-spacing:2px}
.brand-name span{display:block;font-size:9px;font-weight:800;letter-spacing:2px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:8px;padding:16px 0 10px;position:relative}
.hero-copy{flex:1;min-width:0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:2px;color:var(--muted);background:rgba(255,255,255,.72);border:2px solid var(--ink);border-radius:999px;padding:4px 9px;margin:0 0 9px;transform:rotate(-1.5deg)}
.kicker::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--coral)}
.hero h1{margin:0;font-size:38px;line-height:1.16;font-weight:900;letter-spacing:2px}
.hero h1 em{font-style:normal;position:relative;display:inline-block;color:var(--coral);z-index:1}
.hero h1 em::after{content:'';position:absolute;left:-2px;right:-2px;bottom:3px;height:11px;background:var(--sun);z-index:-1;border-radius:4px;transform:rotate(-1deg)}
.lead{margin:9px 0 0;font-size:12.5px;line-height:1.65;font-weight:800;color:var(--muted);letter-spacing:.3px}
.hero-art{width:118px;height:118px;flex:0 0 118px;position:relative}
.hero-art .mascot{width:100%;height:100%;display:block;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.hero-art::after{content:'';position:absolute;left:12%;right:12%;bottom:2px;height:9px;background:rgba(34,48,74,.14);border-radius:50%;filter:blur(2px)}
.sec-label{display:flex;align-items:baseline;gap:8px;margin:16px 0 10px}
.sec-label b{font-size:16px;font-weight:900;letter-spacing:1px}
.sec-label span{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.8px}
.sec-label i{flex:1;height:3px;background:var(--ink);opacity:.14;border-radius:9px;margin-left:2px}

.version-card{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:3px solid var(--ink);border-radius:23px;background:var(--paper);box-shadow:0 6px 0 var(--ink);position:relative;margin-bottom:14px;transition:transform .12s,box-shadow .12s;overflow:hidden}
.version-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--vc)}
.version-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.vc-a{transform:rotate(-.7deg)}
.vc-b{transform:rotate(.7deg)}
.vc-num{position:absolute;right:12px;top:8px;font-size:34px;font-weight:900;color:var(--vc);opacity:.22;letter-spacing:-1px}
.vc-art{width:78px;height:78px;flex:0 0 78px;border:2.8px solid var(--ink);border-radius:17px;background:var(--vc-soft);display:grid;place-items:center;padding:6px;position:relative;overflow:hidden}
.vc-art svg{width:100%;height:100%;display:block}
.vc-info{flex:1;min-width:0;padding-left:2px}
.vc-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.vc-title .vc-name{font-size:21px;font-weight:900;letter-spacing:2px}
.grade-tag{font-size:9.5px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border:2px solid var(--ink);border-radius:6px;background:var(--vc-soft);transform:rotate(-2deg)}
.vc-info p{margin:3px 0 7px;font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.5}
.vc-tags{display:flex;gap:5px;flex-wrap:wrap}
.vc-tags span{font-size:9.5px;font-weight:900;letter-spacing:.5px;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:2px 5px}
.vc-tags span.hot{background:var(--sun-soft)}
.vc-go{margin-left:auto;width:34px;height:34px;flex:0 0 34px;border:2.6px solid var(--ink);border-radius:50%;background:var(--vc);display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}
.vc-go svg{width:16px;height:16px;display:block}
.tint-coral{--vc:var(--coral);--vc-soft:var(--coral-soft);--f:var(--coral);--fsoft:var(--coral-soft)}
.tint-mint{--vc:var(--mint);--vc-soft:var(--mint-soft);--f:var(--mint);--fsoft:var(--mint-soft)}
.tint-sky{--vc:var(--sky);--vc-soft:var(--sky-soft);--f:var(--sky);--fsoft:var(--sky-soft)}
.tint-grape{--vc:var(--grape);--vc-soft:var(--grape-soft);--f:var(--grape);--fsoft:var(--grape-soft)}
.tint-sun{--vc:#E8A400;--vc-soft:var(--sun-soft);--f:#E8A400;--fsoft:var(--sun-soft)}
.tint-pink{--vc:#E8658A;--vc-soft:var(--pink-soft);--f:#E8658A;--fsoft:var(--pink-soft)}

.lesson{margin-top:18px;border:2.6px solid var(--ink);border-radius:18px;background:rgba(255,253,247,.9);padding:0 14px;box-shadow:0 4px 0 rgba(34,48,74,.16)}
.lesson summary{list-style:none;cursor:pointer;padding:13px 0;font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary svg{width:18px;height:18px;flex:0 0 18px}
.lesson summary .chev{margin-left:auto;transition:transform .2s;width:14px;height:14px}
.lesson[open] summary .chev{transform:rotate(180deg)}
.lesson-body{padding:0 0 14px;font-size:13px;line-height:1.8;font-weight:600;color:#56463B}
.lesson-body b{color:var(--coral)}
.lesson-body p{margin:0 0 7px}
.lesson-body p:last-child{margin:0}
.foot{margin-top:20px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1px;line-height:1.9}
.foot b{color:var(--ink)}


@media (max-width:345px){
  .form-pattern span{width:28px;height:33px;font-size:13.5px}
  .form-pattern.p4 span{width:23px;font-size:12px}
  .form-title h2{font-size:15.5px;letter-spacing:.8px;gap:4px}
  .form-title h2 .adv-badge{font-size:7.5px;padding:1px 3px}
  .form-count{font-size:8px;padding:2px 5px}
  .form-head{padding:11px 10px;gap:8px}
}

/* ---------- 版本頁 ---------- */
.ver-hero{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.ver-hero .badge-big{width:64px;height:64px;flex:0 0 64px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;padding:5px;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink);background:var(--vc-soft)}
.ver-hero .badge-big svg{width:100%;height:100%;display:block}
.ver-hero h1{margin:0;font-size:27px;font-weight:900;letter-spacing:2px}
.ver-hero p{margin:3px 0 0;font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.5;letter-spacing:.4px}
.ver-stars{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.5px}
.ver-stars .stars svg{width:14px;height:14px}
.ver-stars b{color:var(--ink);font-size:12px}

.group-label{display:flex;align-items:flex-end;gap:8px;margin:20px 0 10px}
.group-label b{display:block;font-size:15px;font-weight:900;letter-spacing:1px;line-height:1.3}
.group-label span{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-top:2px;line-height:1.4}
.group-label i{flex:1;height:3px;background:var(--ink);opacity:.14;border-radius:9px;margin-bottom:8px}
.form-block{position:relative;margin-top:16px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);overflow:hidden}
.form-head{display:flex;align-items:center;gap:10px;padding:12px 13px;background:var(--fsoft);border-bottom:2.6px solid var(--ink)}
.form-pattern{display:flex;gap:3px}
.form-pattern span{width:31px;height:36px;border:2.6px solid var(--ink);border-radius:9px;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:0;box-shadow:0 2px 0 var(--ink)}
.form-pattern span:nth-child(2){transform:translateY(-3px) rotate(2deg);background:var(--f)}
.form-pattern span:nth-child(3){transform:translateY(-6px) rotate(-2deg)}
.form-pattern span:nth-child(4){transform:translateY(-9px) rotate(3deg);background:#fff}
.form-title{flex:1;min-width:0}
.form-title h2{margin:0;font-size:17px;font-weight:900;letter-spacing:1.5px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;row-gap:2px}
.form-title h2 .fname{white-space:nowrap}
.form-pattern.p4 span{width:27px;font-size:13.5px}
.form-title h2 small{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:var(--muted)}
.form-title h2 .adv-badge{font-size:8.5px;letter-spacing:.4px;color:#fff;background:var(--f);border:1.8px solid var(--ink);border-radius:6px;padding:1px 4px;transform:rotate(-2deg);white-space:nowrap}
.form-title p{margin:2px 0 0;font-size:11px;font-weight:800;color:#5B4B3E;line-height:1.4}
.form-count{font-size:9px;font-weight:900;letter-spacing:.6px;border:2px solid var(--ink);border-radius:999px;padding:3px 7px;background:#fff;white-space:nowrap}
.form-body{padding:12px 13px 14px}
.form-desc{margin:0 0 8px;font-size:12px;line-height:1.65;font-weight:700;color:#56463B}
.ex-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.ex-row span{font-size:11px;font-weight:900;letter-spacing:.5px;background:var(--fsoft);border:2px solid var(--ink);border-radius:7px;padding:3px 7px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:10px 9px 9px;border:2.6px solid var(--ink);border-radius:15px;background:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;min-height:112px}
.mode-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mt-ico{width:32px;height:32px;flex:0 0 32px;border:2.2px solid var(--ink);border-radius:10px;background:var(--fsoft);display:grid;place-items:center;padding:5px}
.mt-ico svg{width:100%;height:100%;display:block}
.mt-name{font-size:13.5px;font-weight:900;letter-spacing:.5px;line-height:1.3}
.mt-meta{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;line-height:1.4}
.mt-stars{position:absolute;right:7px;top:8px;display:flex;gap:1px}
.mt-stars svg{width:11px;height:11px}
.form-tip{margin-top:14px;display:flex;gap:8px;align-items:flex-start;padding:11px;border:2.4px dashed rgba(34,48,74,.42);border-radius:14px;background:rgba(255,255,255,.62);font-size:11px;line-height:1.65;font-weight:700;color:#56463B}
.form-tip svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}

/* ---------- 遊戲 ---------- */
.game-head{display:flex;align-items:center;gap:9px;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.game-head .gtitle{flex:1;min-width:0}
.game-head h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-head .gsub{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-top:1px}
.prog-wrap{margin-top:11px}
.prog-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:900;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.prog-top b{color:var(--ink)}
.prog{height:10px;border:2.4px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 2px 0 rgba(34,48,74,.16)}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qcard{margin-top:13px;padding:15px;border:3px solid var(--ink);border-radius:23px;background:var(--paper);box-shadow:0 6px 0 var(--ink);position:relative}
.q-eyebrow{font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:var(--muted);margin-bottom:7px}
.q-title{margin:0 0 4px;font-size:20px;font-weight:900;line-height:1.4;letter-spacing:.8px}
.q-desc{margin:0;font-size:12px;font-weight:700;color:var(--muted);line-height:1.6}
.q-desc b{color:var(--coral)}
.q-sentence{margin:9px 0 0;font-size:17px;line-height:2;font-weight:800;letter-spacing:.5px}
.blank{display:inline-block;min-width:66px;margin:0 3px;border-bottom:3px solid var(--ink);text-align:center;color:var(--coral);letter-spacing:1px;font-weight:900}
.blank.filled{border-bottom-color:var(--mint);color:var(--ink);background:var(--mint-soft);border-radius:7px 7px 0 0;padding:0 4px}

.prompt-card{display:flex;gap:11px;align-items:center;margin:10px 0 4px;padding:10px;border:2.6px solid var(--ink);border-radius:17px;background:linear-gradient(135deg,var(--fsoft),#fff);box-shadow:0 4px 0 var(--ink)}
.prompt-art{width:74px;height:74px;flex:0 0 74px;border:2.4px solid var(--ink);border-radius:13px;background:#fff;padding:4px}
.prompt-art svg{width:100%;height:100%;display:block}
.prompt-copy{flex:1;min-width:0}
.prompt-label{font-size:9px;font-weight:900;letter-spacing:1.4px;color:var(--muted);margin-bottom:2px}
.prompt-text{margin:0;font-size:14px;line-height:1.7;font-weight:800}
.scene-card{margin:10px 0 2px;padding:12px;border:2.6px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:14.5px;line-height:1.85;font-weight:700}
.scene-card .quote{font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:var(--muted);display:block;margin-bottom:4px}

.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.option{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;background:#fff;border:2.6px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:17px;font-weight:900;letter-spacing:1.2px;text-align:left;transition:transform .1s,box-shadow .1s,background .15s}
.option:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.option .badge{width:26px;height:26px;flex:0 0 26px;border:2px solid var(--ink);border-radius:50%;background:var(--fsoft);display:grid;place-items:center;font-size:11.5px;font-weight:900;letter-spacing:0}
.option .opt-txt{flex:1;min-width:0}
.option .opt-mark{width:20px;height:20px;flex:0 0 20px;opacity:0}
.option .opt-mark svg{width:100%;height:100%;display:block}
.option.correct{background:var(--mint-soft)}
.option.correct .opt-mark{opacity:1}
.option.correct .badge{background:var(--mint);color:#fff}
.option.wrong{background:var(--pink-soft)}
.option.wrong .badge{background:var(--coral);color:#fff}
.option.dim{opacity:.45}
.option:disabled{cursor:default}
.option:disabled:active{transform:none;box-shadow:0 4px 0 var(--ink)}

.fb{margin-top:12px;padding:13px;border:3px solid var(--ink);border-radius:17px;background:var(--mint-soft);box-shadow:0 4px 0 var(--ink);animation:pop .26s cubic-bezier(.2,.8,.2,1)}
.fb.bad{background:var(--pink-soft)}
@keyframes pop{from{transform:scale(.975);opacity:.92}to{transform:scale(1);opacity:1}}
.fb-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.fb-head svg{width:22px;height:22px;flex:0 0 22px}
.fb-head h3{margin:0;font-size:15.5px;font-weight:900;letter-spacing:.5px}
.fb p{margin:0 0 6px;font-size:12.5px;line-height:1.7;font-weight:700;color:#4B3D33}
.fb .fb-answer{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:7px 0}
.fb .big-word{font-size:21px;font-weight:900;letter-spacing:2px;color:var(--ink);background:#fff;border:2.4px solid var(--ink);border-radius:10px;padding:1px 10px;box-shadow:0 2px 0 var(--ink)}
.fb .example{background:rgba(255,255,255,.72);border-left:4px solid var(--ink);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.65;font-weight:700;margin-top:6px}
.fb .example b{color:var(--coral)}
.fb-next{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border:2.8px solid var(--ink);border-radius:14px;background:var(--sun);font-size:14px;font-weight:900;letter-spacing:.8px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}

/* 配對 */
.pair-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}

.pair-tile .p-art{width:86px;height:86px;display:block}
.pair-tile .p-label{font-size:11px;font-weight:900;letter-spacing:.5px}
.pair-tile.done{background:var(--mint-soft);pointer-events:none}
.pair-tile.done::after{content:'';position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>");background-size:12px 12px;background-position:center;background-repeat:no-repeat}

@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-1deg)}45%{transform:translateX(6px) rotate(1deg)}70%{transform:translateX(-3px)}}
.tray-title{display:flex;align-items:center;justify-content:space-between;margin:13px 0 7px;font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--muted)}
.tray-title b{color:var(--ink);font-size:11.5px}
.word-tray{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.wchip{padding:11px 4px;border:2.6px solid var(--ink);border-radius:12px;background:var(--sun-soft);font-size:16px;font-weight:900;letter-spacing:1px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s;white-space:nowrap}
.wchip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.wchip.sel{background:var(--sun);transform:translateY(-2px) rotate(-1.5deg);box-shadow:0 5px 0 var(--ink)}
.wchip.used{visibility:hidden}
.match-note{margin:11px 0 0;padding:9px 10px;border:2.4px dashed rgba(34,48,74,.34);border-radius:12px;background:rgba(255,255,255,.6);font-size:11.5px;line-height:1.6;font-weight:700;color:var(--muted);min-height:42px}

.hintline{margin:11px 0 0;font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.3px}

/* 拼字 */
.build-stage{display:flex;align-items:center;gap:11px;margin:9px 0 12px;padding:9px;border:2.6px solid var(--ink);border-radius:16px;background:linear-gradient(135deg,var(--fsoft),#fff);box-shadow:0 4px 0 var(--ink)}
.build-stage .bs-art{width:74px;height:74px;flex:0 0 74px;border:2.4px solid var(--ink);border-radius:12px;background:#fff;padding:4px}
.build-stage .bs-art svg{width:100%;height:100%;display:block}
.build-stage .bs-label{font-size:9.5px;font-weight:900;letter-spacing:1.4px;color:var(--muted)}
.build-stage .bs-tip{font-size:13.5px;font-weight:900;line-height:1.55;margin-top:2px}
.slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:6px 0 14px}
.slots.shake{animation:shake .42s}
.slot{width:52px;height:56px;border:3px dashed rgba(34,48,74,.42);border-radius:12px;background:rgba(255,255,255,.72);display:grid;place-items:center;font-size:25px;font-weight:900;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.slot.filled{border-style:solid;background:#fff;box-shadow:0 3px 0 var(--ink)}

.tile-tray{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.ctile{min-width:52px;height:56px;padding:0 8px;border:3px solid var(--ink);border-radius:12px;background:var(--sun);font-size:25px;font-weight:900;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,opacity .15s}
.ctile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ctile.used{opacity:.24;pointer-events:none;box-shadow:none}

.split-board{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}

.split-head{font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--muted);text-align:center;margin-bottom:1px}
.half{padding:11px 4px;border:2.6px solid var(--ink);border-radius:12px;background:#fff;font-size:17px;font-weight:900;letter-spacing:1.5px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.half:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

.pair-line{display:flex;align-items:center;gap:8px;padding:8px 9px;border:2.4px solid var(--ink);border-radius:11px;background:var(--mint-soft);font-size:12px;font-weight:700;line-height:1.55}

.spot-line{margin:12px 0 4px;padding:12px 10px;border:2.6px solid var(--ink);border-radius:15px;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:17px;line-height:2.1;font-weight:700;letter-spacing:.5px}

/* ---------------- 音效（Web Audio 即時合成） ---------------- */
var Sfx = {
  ctx:null, on:true, _nb:null,
  init:function(){
    if(!this.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ try{ this.ctx = new AC(); }catch(e){ this.ctx = null; } }
    }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume(); }
    return this.ctx;
  },
  tone:function(freq, dur, type, vol, delay, slideTo){
    if(!this.on) return;
    var ctx = this.init(); if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05, t0+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  },
  noiseBuf:function(){
    var ctx=this.ctx; if(this._nb) return this._nb;
    var len=Math.floor(ctx.sampleRate*2);
    var b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._nb=b; return b;
  },
  noise:function(dur, vol, filter, freq, delay){
    if(!this.on) return;
    var ctx=this.init(); if(!ctx) return;
    var t0=ctx.currentTime+(delay||0);
    var src=ctx.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
    var bp=ctx.createBiquadFilter(); bp.type=filter||'lowpass'; bp.frequency.setValueAtTime(freq||1200,t0);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0+dur+0.03);
  },
  click:function(){ this.tone(560,0.055,'triangle',0.03); },
  pop:function(){ this.tone(760,0.09,'sine',0.05); },
  stack:function(){ this.tone(420,0.07,'square',0.028); this.tone(640,0.08,'sine',0.04,0.03); },
  unstack:function(){ this.tone(500,0.07,'sine',0.035); this.tone(340,0.09,'sine',0.03,0.04); },
  correct:function(){ var self=this; [523,659,784].forEach(function(f,i){ self.tone(f,0.16,'sine',0.055,i*0.075); }); },
  wrong:function(){ this.tone(300,0.12,'sine',0.045); this.tone(215,0.19,'sine',0.038,0.11); },
  win:function(){ var self=this; [523,659,784,1047].forEach(function(f,i){ self.tone(f,0.22,'triangle',0.05,i*0.095); }); },
  star:function(i){ this.tone(660+i*140,0.15,'sine',0.045); }
};

/* ---------------- 工具 ---------------- */
var app = document.getElementById('app');
var toastEl = document.getElementById('toast');
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
}
function esc(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function highlightWord(sentence, word){
  var s = esc(sentence);
  if(!word) return s;
  var w = esc(word);
  return s.split(w).join('<b>'+w+'</b>');
}

/* ---------------- 儲存進度 ---------------- */
var STORE_KEY = 'ddtown-v1';
var BEST = (function(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
})();
function saveBest(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(BEST)); }catch(e){} }
function modeBest(v,m){
  var b = BEST[v] && BEST[v][m];
  return b ? b : {stars:0,correct:0,total:0};
}
function setBest(v,m,stars,correct,total){
  var old = modeBest(v,m);
  BEST[v] = BEST[v] || {};
  BEST[v][m] = {stars:Math.max(old.stars||0,stars), correct:Math.max(old.correct||0,correct), total:total};
  saveBest();
}
function versionStars(v){
  var data = DATA[v], sum = 0;
  data.forms.forEach(function(f){ f.modes.forEach(function(m){ sum += modeBest(v,m.id).stars; }); });
  return sum;
}
function maxStars(v){
  var data = DATA[v], n = 0;
  data.forms.forEach(function(f){ n += f.modes.length*3; });
  return n;
}

function modeTotal(mode){
  if(mode.engine==='pair') return mode.items.length;
  if(mode.engine==='split' || mode.engine==='match') return mode.pairs.length;
  if(mode.engine==='sort') return mode.items.length;
  return mode.questions.length;
}

    '<p class="foot">繁體字 · Q 版插畫 · 即時音效 · 手機直玩<br><b>每個遊戲 4 題，摘滿 3 顆星</b></p>'+
  '</div>';
}
function versionCard(v, num, cls, tint){
  var forms = v.forms.map(function(f){ return '<span>'+f.name+'</span>'; }).join('');
  var total = 0; v.forms.forEach(function(f){ total += f.modes.length; });
  return '<button class="version-card '+cls+' tint-'+tint+'" data-act="gover" data-v="'+v.id+'">'+
    '<span class="vc-num">'+num+'</span>'+
    '<span class="vc-art">'+artSVG(v.art)+'</span>'+
    '<span class="vc-info">'+
      '<span class="vc-title"><span class="vc-name">'+v.name+'</span><span class="grade-tag">'+v.grades+'</span></span>'+
      '<p>'+v.tagline+'</p>'+
      '<span class="vc-tags">'+forms+'<span class="hot">'+total+' 個遊戲</span></span>'+
    '</span>'+
    '<span class="vc-go">'+ICO.arrow+'</span>'+
  '</button>';
}

/* ---------------- 版本頁 ---------------- */
function formBlockHTML(v, f){
  var modesHTML = f.modes.map(function(m){
    return '<button class="mode-tile" data-act="start" data-f="'+f.id+'" data-m="'+m.id+'">'+
      '<span class="mt-stars">'+starRow(modeBest(v.id,m.id).stars,3)+'</span>'+
      '<span class="mt-ico">'+ICO[m.icon]+'</span>'+
      '<span class="mt-name">'+m.name+'</span>'+
      '<span class="mt-meta">'+m.meta+'</span>'+
    '</button>';
  }).join('');
  var pat = f.pattern.map(function(p){ return '<span>'+p+'</span>'; }).join('');
  var patCls = f.pattern.length>3 ? ' p4' : '';
  var ex = f.examples.map(function(w){ return '<span>'+w+'</span>'; }).join('');
  return '<section class="form-block tint-'+f.tint+'">'+
    '<div class="form-head">'+
      '<div class="form-pattern'+patCls+'">'+pat+'</div>'+
      '<div class="form-title"><h2><span class="fname">'+f.name+'</span>'+(f.badge?'<small class="adv-badge">'+f.badge+'</small>':'')+'</h2><p>'+f.nickname+'</p></div>'+
      '<span class="form-count">'+f.modes.length+' 個遊戲</span>'+
    '</div>'+
    '<div class="form-body">'+
      '<p class="form-desc">'+f.desc+'</p>'+
      '<div class="ex-row">'+ex+'</div>'+
      '<div class="mode-grid">'+modesHTML+'</div>'+
    '</div>'+
  '</section>';
}
function versionHTML(){
  var v = getVersion();
  var formsHTML;
  if(v.groups){
    formsHTML = v.groups.map(function(g){
      var fs = v.forms.filter(function(f){ return f.group===g.id; });
      if(!fs.length) return '';
      return '<div class="group-label"><div><b>'+g.name+'</b><span>'+g.sub+'</span></div><i></i></div>'+
        fs.map(function(f){ return formBlockHTML(v,f); }).join('');
    }).join('');
  }else{
    formsHTML = v.forms.map(function(f){ return formBlockHTML(v,f); }).join('');
  }
  var formCount = v.forms.length, modeCount = 0;
  v.forms.forEach(function(f){ modeCount += f.modes.length; });
  return '<div class="screen tint-'+v.tint+'">'+
    '<div class="topbar">'+
      '<button class="icon-btn" data-act="home" aria-label="返回首頁">'+ICO.back+'</button>'+
      '<div class="tb-title"><b>'+v.name+'</b><span>'+formCount+' 種形式 · '+modeCount+' 個遊戲</span></div>'+
      soundBtn()+
    '</div>'+
    '<div class="ver-hero">'+
      '<div class="badge-big">'+artSVG(v.art)+'</div>'+
      '<div><h1>'+v.name+'</h1><p>'+v.intro+'</p></div>'+
    '</div>'+
    '<div class="ver-stars"><span class="stars">'+starSVG(true)+'</span> 已摘 <b>'+versionStars(v.id)+' / '+maxStars(v.id)+'</b> 顆星</div>'+
    formsHTML+
    '<div class="form-tip">'+ICO.bulb+'<div>小提示：每個形式都有兩個不同玩法。先玩「認詞」，再玩「用詞」，記得更牢。</div></div>'+
    '<p class="foot"><b>進度會自動保存在這部裝置</b><br>可以隨時回來刷新紀錄</p>'+
  '</div>';
}

/* ---------------- 遊戲頁 ---------------- */
function progressInfo(mode){
  var total = modeTotal(mode);
  var done = 0, label = '';
  if(mode.engine==='pair'){ done = G.done.length; label = '圖詞配對'; }
  else if(mode.engine==='split'){ done = G.done.length; label = '前半後半'; }
  else if(mode.engine==='match'){ done = G.done.length; label = '詞義配對'; }
  else if(mode.engine==='sort'){ done = Object.keys(G.placed).length; label = '疊詞分類'; }
  else { done = G.qi + (G.answered?1:0); label = '第 '+(G.qi+1)+' 題'; }
  return {label:label, text:done+' / '+total, pct:Math.round(done/total*100)};
}
function gameHTML(){
  var v = getVersion(), f = getForm(), m = getMode();
  var p = progressInfo(m);
  return '<div class="screen tint-'+f.tint+'">'+
    '<div class="game-head">'+
      '<button class="icon-btn" data-act="backver" aria-label="返回疊詞表">'+ICO.back+'</button>'+
      '<div class="gtitle"><h2>'+m.name+'</h2><div class="gsub">'+v.name+' · '+f.name+' · '+m.meta+'</div></div>'+
      soundBtn()+
    '</div>'+
    '<div class="prog-wrap">'+
      '<div class="prog-top"><span>'+p.label+'</span><b>'+p.text+'</b></div>'+
      '<div class="prog"><i style="width:'+p.pct+'%"></i></div>'+
    '</div>'+
    '<div id="gamebody">'+engineHTML(m)+'</div>'+
  '</div>';
}
function engineHTML(mode){
  if(mode.engine==='pair') return pairHTML(mode);
  if(mode.engine==='fill') return fillHTML(mode);
  if(mode.engine==='build') return buildHTML(mode);
  if(mode.engine==='choice') return choiceHTML(mode);
  if(mode.engine==='split') return splitHTML(mode);
  if(mode.engine==='spot') return spotHTML(mode);
  if(mode.engine==='match') return matchHTML(mode);
  if(mode.engine==='clinic') return clinicHTML(mode);
  if(mode.engine==='sort') return sortHTML(mode);
  return '';
}

/* 回饋卡 */
function exampleHTML(q){
  var s = q.sentence || '';
  var w = q.answer || q.word || '';
  if(s.indexOf('___')>=0){
    return esc(s).replace('___','<b>'+esc(w)+'</b>');
  }
  return highlightWord(s,w);
}
function feedbackHTML(mode,q){
  var ok = G.lastOK;
  var isLast = G.qi+1 >= modeTotal(mode);
  return '<div class="fb '+(ok?'':'bad')+'">'+
    '<div class="fb-head">'+(ok?ICO.check:ICO.cross)+'<h3>'+(ok?'答對了！':'差一點點')+'</h3></div>'+
    (!ok?'<p>正確答案是：</p>':'')+
    '<div class="fb-answer"><span class="big-word">'+esc(q.answer||q.word||'')+'</span></div>'+
    '<p>'+esc(q.explain||q.tip||'')+'</p>'+
    (q.sentence?'<div class="example">例句：'+exampleHTML(q)+'</div>':'')+
    '<div class="fb-next"><button class="btn" data-act="next">'+(isLast?'看成績':'下一題')+ICO.arrow+'</button></div>'+
  '</div>';
}

/* 1. 圖詞配對 */
function pairHTML(mode){
  var arts = mode.items.map(function(it,i){
    var done = G.done.indexOf(i)>=0;
    var shake = G.shakeArt===i;
    return '<button class="pair-tile'+(done?' done':'')+(shake?' shake':'')+'" data-act="pairart" data-i="'+i+'" aria-label="'+esc(it.label)+'">'+
      artSVG(it.art,'p-art')+
      '<span class="p-label">'+esc(it.label)+'</span>'+
    '</button>';
  }).join('');
  var words = G.wordOrder.map(function(idx){
    var it = mode.items[idx];
    var used = G.done.indexOf(idx)>=0;
    var sel = G.selWord===idx;
    return '<button class="wchip'+(used?' used':'')+(sel?' sel':'')+'" data-act="pairword" data-i="'+idx+'">'+esc(it.word)+'</button>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">玩法 · 看圖配詞</div>'+
    '<p class="q-title">把詞語和圖畫配起來</p>'+
    '<p class="q-desc">先點一張詞語卡，再點對應的圖畫。</p>'+
    '<div class="pair-grid">'+arts+'</div>'+
    '<div class="tray-title"><span>詞語卡</span><b>'+G.done.length+' / '+mode.items.length+'</b></div>'+
    '<div class="word-tray">'+words+'</div>'+
    '<div class="match-note">'+(G.note?'<b>'+G.note.word+'</b>：'+esc(G.note.sentence):'配對成功後，例句會顯示在這裏。')+'</div>'+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 2. 句子填空 */
function fillHTML(mode){
  var q = mode.questions[G.qi];
  var sentence = esc(q.sentence);
  var blank = G.answered ? '<span class="blank filled">'+esc(q.answer)+'</span>' : '<span class="blank">?</span>';
  sentence = sentence.replace('___', blank);
  var opts = q.options.map(function(o,i){
    var cls='option';
    if(G.answered){
      if(o===q.answer) cls+=' correct';
      else if(o===G.picked) cls+=' wrong';
      else cls+=' dim';
    }
    return '<button class="'+cls+'" data-act="answer" data-val="'+esc(o)+'" '+(G.answered?'disabled':'')+'>'+
      '<span class="badge">'+'ABCD'[i]+'</span>'+
      '<span class="opt-txt">'+esc(o)+'</span>'+
      '<span class="opt-mark">'+(G.answered&&o===q.answer?ICO.check:(G.answered&&o===G.picked?ICO.cross:''))+'</span>'+
    '</button>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">第 '+(G.qi+1)+' 題 · 選詞填空</div>'+
    '<div class="prompt-card">'+
      '<div class="prompt-art">'+artSVG(q.art)+'</div>'+
      '<div class="prompt-copy"><div class="prompt-label">'+esc(q.label)+'</div><p class="prompt-text">讀一讀句子，選出最合適的疊詞。</p></div>'+
    '</div>'+
    '<p class="q-sentence">'+sentence+'</p>'+
    '<div class="options">'+opts+'</div>'+
    (G.answered?feedbackHTML(mode,q):'')+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 3. 三格積木 */
function buildHTML(mode){
  var q = mode.questions[G.qi];
  var slots = G.slots.map(function(idx,i){
    var ch = idx===null ? '<span class="slot-dot"></span>' : esc(G.tiles[idx].ch);
    return '<button class="slot'+(idx===null?'':' filled')+'" data-act="slot" data-i="'+i+'" aria-label="第 '+(i+1)+' 格">'+ch+'</button>';
  }).join('');
  var tiles = G.tiles.map(function(t,i){
    return '<button class="ctile'+(t.used?' used':'')+'" data-act="tile" data-i="'+i+'">'+esc(t.ch)+'</button>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">第 '+(G.qi+1)+' 題 · 拼出疊詞</div>'+
    '<div class="build-stage">'+
      '<div class="bs-art">'+artSVG(q.art)+'</div>'+
      '<div><div class="bs-label">看圖拼詞</div><div class="bs-tip">'+esc(q.label)+'的疊詞是？</div></div>'+
    '</div>'+
    '<div class="slots'+(G.shake?' shake':'')+'">'+slots+'</div>'+
    '<div class="tile-tray">'+tiles+'</div>'+
    (G.answered?feedbackHTML(mode,q):'')+
    '<p class="hintline">'+(G.answered?mode.tip:'點字卡放進空格；點空格可以取回字卡。')+'</p>'+
  '</div>';
}

/* 4. 看圖／情境選詞 */
function choiceHTML(mode){
  var q = mode.questions[G.qi];
  var prompt;
  if(q.scene){
    prompt = '<div class="scene-card"><span class="quote">情境</span>'+esc(q.scene)+'</div>';
  }else{
    prompt = '<div class="prompt-card">'+
      '<div class="prompt-art">'+artSVG(q.art)+'</div>'+
      '<div class="prompt-copy"><div class="prompt-label">'+esc(q.label)+'</div><p class="prompt-text">看圖畫，選出最合適的疊詞。</p></div>'+
    '</div>';
  }
  var opts = q.options.map(function(o,i){
    var cls='option';
    if(G.answered){
      if(o===q.answer) cls+=' correct';
      else if(o===G.picked) cls+=' wrong';
      else cls+=' dim';
    }
    return '<button class="'+cls+'" data-act="answer" data-val="'+esc(o)+'" '+(G.answered?'disabled':'')+'>'+
      '<span class="badge">'+'ABCD'[i]+'</span>'+
      '<span class="opt-txt">'+esc(o)+'</span>'+
      '<span class="opt-mark">'+(G.answered&&o===q.answer?ICO.check:(G.answered&&o===G.picked?ICO.cross:''))+'</span>'+
    '</button>';
  }).join('');
  var fullSentence = '';
  if(!q.scene){
    var text = esc(q.text);
    var blank = G.answered ? '<span class="blank filled">'+esc(q.answer)+'</span>' : '<span class="blank">?</span>';
    fullSentence = '<p class="q-sentence">'+text.replace('___', blank)+'</p>';
  }
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">第 '+(G.qi+1)+' 題 · '+(q.scene?'情境選詞':'看圖選詞')+'</div>'+
    '<p class="q-title">哪個疊詞最適合？</p>'+
    prompt+ fullSentence +
    '<div class="options" style="margin-top:12px">'+opts+'</div>'+
    (G.answered?feedbackHTML(mode,q):'')+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 5. 前半後半 */
function splitHTML(mode){
  var left = mode.pairs.map(function(p,i){
    var done = G.done.indexOf(i)>=0;
    return '<button class="half'+(done?' done':'')+(G.selA===i?' sel':'')+'" data-act="splitA" data-i="'+i+'">'+esc(p.a)+'</button>';
  }).join('');
  var right = G.rightOrder.map(function(o,k){
    var isPair = o.type==='pair';
    var done = isPair && G.done.indexOf(o.i)>=0;
    var txt = isPair ? mode.pairs[o.i].b : o.b;
    return '<button class="half'+(done?' done':'')+(G.shakeB===k?' wrong':'')+'" data-act="splitB" data-k="'+k+'">'+esc(txt)+'</button>';
  }).join('');
  var lines = G.done.map(function(i){
    var p = mode.pairs[i];
    return '<div class="pair-line"><b>'+esc(p.word)+'</b><span>'+esc(p.sentence)+'</span></div>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">玩法 · 拼出疊詞</div>'+
    '<p class="q-title">把兩半拼成疊詞</p>'+
    '<p class="q-desc">先點左邊的前半，再點右邊的後半。</p>'+
    '<div class="split-board">'+
      '<div class="split-col"><div class="split-head">前半</div>'+left+'</div>'+
      '<div class="split-col"><div class="split-head">後半</div>'+right+'</div>'+
    '</div>'+
    (lines?'<div class="word-pairs">'+lines+'</div>':'')+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 6. 句子尋寶 */
function spotHTML(mode){
  var q = mode.questions[G.qi];
  var punct = /^[。，！？、；：]$/;
  var chunks = q.chunks.map(function(c,i){
    if(punct.test(c)) return '<span class="punct">'+esc(c)+'</span>';
    var cls = 'chunk';
    if(G.found && c===q.answer) cls += ' correct';
    if(G.wrongChunk===i) cls += ' wrong';
    if(G.found && c!==q.answer) cls += ' dim';
    return '<button class="'+cls+'" data-act="spot" data-i="'+i+'">'+esc(c)+'</button>';
  }).join('');
  var sentence = q.chunks.join('');
  var fq = {answer:q.answer, explain:q.explain, sentence:sentence};
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">第 '+(G.qi+1)+' 題 · 句子尋寶</div>'+
    '<p class="q-title">'+esc(q.prompt||'找出句中的 AABB 疊詞')+'</p>'+
    '<p class="q-desc">點一點你認為是疊詞的部分。</p>'+
    '<div class="spot-line">'+chunks+'</div>'+
    (G.found?feedbackHTML(mode,fq):'')+
    '<p class="hintline">'+(G.found?mode.tip:'點錯不要緊，可以再試。')+'</p>'+
  '</div>';
}

/* 7. 詞義連一連 */
function matchHTML(mode){
  var words = mode.pairs.map(function(p,i){
    var done = G.done.indexOf(i)>=0;
    return '<button class="match-cell word'+(done?' done':'')+(G.selW===i?' sel':'')+'" data-act="matchW" data-i="'+i+'">'+esc(p.word)+'</button>';
  }).join('');
  var defs = G.defOrder.map(function(i){
    var p = mode.pairs[i];
    var done = G.done.indexOf(i)>=0;
    return '<button class="match-cell'+(done?' done':'')+(G.shakeD===i?' wrong':'')+'" data-act="matchD" data-i="'+i+'">'+esc(p.def)+'</button>';
  }).join('');
  var lines = G.done.map(function(i){
    var p = mode.pairs[i];
    return '<div class="pair-line"><b>'+esc(p.word)+'</b><span>'+esc(p.note)+'</span></div>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">玩法 · 詞義配對</div>'+
    '<p class="q-title">把成語和意思配起來</p>'+
    '<p class="q-desc">先點左邊的成語，再點右邊的意思。</p>'+
    '<div class="split-board">'+
      '<div class="split-col"><div class="split-head">成語</div>'+words+'</div>'+
      '<div class="split-col"><div class="split-head">意思</div>'+defs+'</div>'+
    '</div>'+
    (lines?'<div class="word-pairs">'+lines+'</div>':'')+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 8. 句子診所 */
function clinicHTML(mode){
  var q = mode.questions[G.qi];
  var segs = q.segments.map(function(sg,i){
    var cls = 'seg';
    var txt = sg.t;
    if(G.step===2 && i===G.badIdx) cls += ' found';
    if(G.answered && i===G.badIdx){ cls += ' fixed'; txt = q.answer; }
    if(G.wrongSeg===i) cls += ' wrong';
    if(G.step===2 && i!==G.badIdx) cls += '';
    return '<button class="'+cls+'" data-act="clinicSeg" data-i="'+i+'">'+esc(txt)+'</button>';
  }).join('');
  var body = '';
  if(G.step===2){
    var opts = q.options.map(function(o,i){
      var cls='option';
      if(G.answered){
        if(o===q.answer) cls+=' correct';
        else if(o===G.picked) cls+=' wrong';
        else cls+=' dim';
      }
      return '<button class="'+cls+'" data-act="clinicOpt" data-val="'+esc(o)+'" '+(G.answered?'disabled':'')+'>'+
        '<span class="badge">'+'ABCD'[i]+'</span><span class="opt-txt">'+esc(o)+'</span>'+
        '<span class="opt-mark">'+(G.answered&&o===q.answer?ICO.check:(G.answered&&o===G.picked?ICO.cross:''))+'</span>'+
      '</button>';
    }).join('');
    body = '<p class="step-tag"><i>2</i>選一個正確的詞換上去</p><div class="options">'+opts+'</div>';
    if(G.answered) body += feedbackHTML(mode,{answer:q.answer, explain:q.explain});
  }else{
    body = '<p class="step-tag"><i>1</i>先點出句子中用錯的疊詞</p>';
  }
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">第 '+(G.qi+1)+' 題 · 句子診所</div>'+
    '<p class="q-title">哪個詞用錯了？</p>'+
    '<div class="clinic-sentence">'+segs+'</div>'+
    body+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* 9. 疊詞分類 */
function sortHTML(mode){
  var byWord = {};
  mode.items.forEach(function(it){ byWord[it.w] = it; });
  var remaining = G.sortOrder.map(function(w){ return byWord[w]; }).filter(function(it){ return it && !G.placed[it.w]; });
  var chips = remaining.map(function(it){
    return '<button class="sort-chip'+(G.sel===it.w?' sel':'')+'" data-act="sortChip" data-w="'+esc(it.w)+'">'+esc(it.w)+'</button>';
  }).join('');
  var bins = mode.bins.map(function(b){
    var inBin = mode.items.filter(function(it){ return G.placed[it.w]===b.id; });
    var words = inBin.map(function(it){ return '<span class="bin-word">'+esc(it.w)+'</span>'; }).join('');
    return '<button class="sort-bin'+(G.wrongBin===b.id?' shake':'')+'" data-act="sortBin" data-bin="'+b.id+'">'+
      '<span class="bin-title">'+esc(b.name)+'</span>'+
      (words||'<span class="bin-empty">點這裏放進來</span>')+
    '</button>';
  }).join('');
  return '<div class="qcard fadein">'+
    '<div class="q-eyebrow">玩法 · 分類</div>'+
    '<p class="q-title">把疊詞放進正確的籃子</p>'+
    '<p class="q-desc">先點一個疊詞，再點它所屬的類別。</p>'+
    '<div class="sort-words">'+chips+'</div>'+
    '<div class="sort-bins">'+bins+'</div>'+
    '<div class="match-note">'+(G.note?'<b>'+G.note.w+'</b>：'+esc(G.note.note):'放對的詞會留在籃子裏。')+'</div>'+
    '<p class="hintline">'+mode.tip+'</p>'+
  '</div>';
}

/* ---------------- 建立新局 ---------------- */
function setupBuild(g, mode){
  var q = mode.questions[g.qi];
  var arr = [];
  q.chars.forEach(function(c){ arr.push({ch:c, used:false}); });
  var extras = q.extras || (q.extra ? [q.extra] : []);
  extras.forEach(function(c){ arr.push({ch:c, used:false}); });
  g.tiles = shuffle(arr);
  g.slots = [];
  for(var i=0;i<q.word.length;i++) g.slots.push(null);
  g.shake = false;
}
function newGame(mode){
  var g = {qi:0, mistakes:0, correct:0, qMistakes:0, itemMistakes:0, answered:false, picked:null, lastOK:null, note:null};
  if(mode.engine==='pair'){
    g.done = [];
    g.selWord = null;
    g.wordOrder = shuffle(mode.items.map(function(_,i){ return i; }));
    g.shakeArt = null;
  }else if(mode.engine==='build'){
    setupBuild(g, mode);
  }else if(mode.engine==='split'){
    g.done = [];
    g.selA = null;
    var rights = mode.pairs.map(function(_,i){ return {type:'pair', i:i}; });
    (mode.decoys||[]).forEach(function(b){ rights.push({type:'decoy', b:b}); });
    g.rightOrder = shuffle(rights);
    g.shakeB = null;
  }else if(mode.engine==='spot'){
    g.found = false;
    g.wrongChunk = -1;
  }else if(mode.engine==='match'){
    g.done = [];
    g.selW = null;
    g.defOrder = shuffle(mode.pairs.map(function(_,i){ return i; }));
    g.shakeD = null;
  }else if(mode.engine==='clinic'){
    g.step = 1;
    g.badIdx = null;
    g.wrongSeg = -1;
  }else if(mode.engine==='sort'){
    g.placed = {};
    g.sel = null;
    g.sortOrder = shuffle(mode.items.map(function(it){ return it.w; }));
    g.wrongBin = null;
  }
  return g;
}

/* ---------------- 導航 ---------------- */
function render(){
  if(S.screen==='home') app.innerHTML = homeHTML();
  else if(S.screen==='version') app.innerHTML = versionHTML();
  else if(S.screen==='game') app.innerHTML = gameHTML();
  else if(S.screen==='result') app.innerHTML = resultHTML();
}
function goHome(){
  S.screen='home'; S.version=null; S.formId=null; S.modeId=null; G=null;
  render(); window.scrollTo(0,0);
}
function goVersion(v){
  S.screen='version'; S.version=v; S.formId=null; S.modeId=null; G=null;
  render(); window.scrollTo(0,0);
}
function startMode(fid, mid){
  var v = getVersion();
  S.formId = fid; S.modeId = mid;
  var mode = getMode();
  G = newGame(mode);
  S.screen='game';
  render(); window.scrollTo(0,0);
}
function restartMode(){
  var mode = getMode();
  G = newGame(mode);
  S.screen='game';
  render(); window.scrollTo(0,0);
}
function nextQuestion(){
  var mode = getMode();
  var total = modeTotal(mode);
  if(G.qi+1 >= total){ finishGame(); return; }
  G.qi++;
  G.answered = false;
  G.picked = null;
  G.lastOK = null;
  G.qMistakes = 0;
  G.itemMistakes = 0;
  G.found = false;
  G.wrongChunk = -1;
  G.note = null;
  if(mode.engine==='build') setupBuild(G, mode);
  if(mode.engine==='clinic'){ G.step = 1; G.badIdx = null; G.wrongSeg = -1; }
  render(); window.scrollTo(0,0);
}
function finishGame(){
  var mode = getMode();
  var total = modeTotal(mode);
  var stars = G.mistakes===0 ? 3 : (G.mistakes<=2 ? 2 : 1);
  G.stars = stars;
  setBest(S.version, mode.id, stars, G.correct, total);
  S.screen = 'result';
  render(); window.scrollTo(0,0);
  Sfx.win();
  if(stars===3){
    [0,1,2].forEach(function(i){
      setTimeout(function(){ Sfx.star(i); }, 420 + i*150);
    });
  }
}
function scrollFeedback(){
  setTimeout(function(){
    var fb = document.querySelector('.fb');
    if(fb && fb.scrollIntoView) fb.scrollIntoView({block:'nearest', behavior:'smooth'});
  }, 40);
}

/* ---------------- 結果頁 ---------------- */
function resultHTML(){
  var v = getVersion(), f = getForm(), m = getMode();
  var total = modeTotal(m);
  var stars = G.stars || 1;
  var title = stars===3 ? '完美過關！' : (stars===2 ? '過關啦！' : '完成了！');
  var sub = stars===3 ? '一次答對，摘下三顆星' : (stars===2 ? '再細心一點，就能摘三顆星' : '多玩一次，一定會更熟練');
  var words = (m.words||[]).map(function(w){ return '<span>'+esc(w)+'</span>'; }).join('');
  var rays = '';
  for(var i=0;i<12;i++){
    rays += '<line x1="100" y1="10" x2="100" y2="24" transform="rotate('+(i*30)+' 100 100)"/>';
  }
  var conf = '';
  if(stars===3){
    var colors = ['#FF6B5B','#FFC53D','#22C3A6','#3FA9E0','#8B7BF7','#FF8FA8'];
    var bits = '';
    for(var k=0;k<20;k++){
      bits += '<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+colors[k%colors.length]+';animation-delay:'+(Math.random()*1.2).toFixed(2)+'s;transform:rotate('+Math.floor(Math.random()*180)+'deg)"></i>';
    }
    conf = '<div class="confetti" aria-hidden="true">'+bits+'</div>';
  }
  return conf+'<div class="screen result-wrap tint-'+f.tint+'">'+
    '<svg class="rays" viewBox="0 0 200 200" aria-hidden="true" style="color:#FFC53D"><g stroke="#FFC53D" stroke-width="7" stroke-linecap="round">'+rays+'</g></svg>'+
    mascotSVG('result-mascot')+
    '<div class="result-card">'+
      '<div class="big-stars">'+starSVG(stars>=1)+starSVG(stars>=2)+starSVG(stars>=3)+'</div>'+
      '<h2>'+title+'</h2>'+
      '<div class="rsub">'+v.name+' · '+f.name+' · '+m.name+'<br>'+sub+'</div>'+
      '<div class="rscore">一次答對 <b>'+G.correct+'</b> / '+total+' <span>·</span> 失誤 <b>'+G.mistakes+'</b></div>'+
      '<div class="learned"><h3>今天認識的疊詞</h3><div class="lw">'+words+'</div></div>'+
      '<div class="result-actions">'+
        '<button class="btn" data-act="replay">'+ICO.replay+'再玩一次</button>'+
        '<button class="btn ghost" data-act="backver">'+ICO.arrow+'返回本級疊詞表</button>'+
        '<button class="btn ghost" data-act="home">'+ICO.home+'回到首頁</button>'+
      '</div>'+
    '</div>'+
    '<p class="foot">每個遊戲都可以重玩，刷新自己的星星紀錄<br><b>記住：疊詞不是背，是拿來用的。</b></p>'+
  '</div>';
}

/* ---------------- 事件 ---------------- */
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act==='mute'){
    Sfx.on = !Sfx.on;
    if(Sfx.on){ Sfx.init(); Sfx.click(); }
    render();
    return;
  }
  if(act==='home'){ Sfx.init(); Sfx.click(); goHome(); return; }
  if(act==='gover'){ Sfx.init(); Sfx.click(); goVersion(el.getAttribute('data-v')); return; }
  if(act==='backver'){
    Sfx.click();
    S.screen='version'; G=null;
    render(); window.scrollTo(0,0);
    return;
  }
  if(act==='start'){
    Sfx.init(); Sfx.click();
    startMode(el.getAttribute('data-f'), el.getAttribute('data-m'));
    return;
  }
  if(act==='replay'){ Sfx.click(); restartMode(); return; }
  if(act==='next'){ Sfx.click(); nextQuestion(); return; }

  if(S.screen!=='game' || !G) return;
  var mode = getMode();
  if(!mode) return;

  /* 圖詞配對 */
  if(act==='pairword'){
    var wi = parseInt(el.getAttribute('data-i'),10);
    if(G.done.indexOf(wi)>=0) return;
    if(G.selWord!==wi) G.itemMistakes = 0;
    G.selWord = wi;
    Sfx.click();
    render();
    return;
  }
  if(act==='pairart'){
    var ai = parseInt(el.getAttribute('data-i'),10);
    if(G.done.indexOf(ai)>=0) return;
    if(G.selWord===null){ toast('先點一張詞語卡，再點圖畫'); return; }
    var target = mode.items[ai], chosen = mode.items[G.selWord];
    if(target.word === chosen.word){
      G.done.push(ai);
      if(G.itemMistakes===0) G.correct++;
      G.note = {word:target.word, sentence:target.sentence};
      G.selWord = null;
      Sfx.correct();
      if(G.done.length === mode.items.length){ finishGame(); return; }
    }else{
      G.mistakes++; G.itemMistakes++;
      G.shakeArt = ai;
      Sfx.wrong();
      toast('這張圖和詞語不配，再試一次');
      render();
      setTimeout(function(){ if(G && G.shakeArt===ai){ G.shakeArt=null; render(); } }, 450);
      return;
    }
    render();
    return;
  }

  /* 句子填空 / 看圖選詞 */
  if(act==='answer'){
    if(G.answered) return;
    var qa = mode.questions[G.qi];
    var val = el.getAttribute('data-val');
    G.picked = val;
    G.answered = true;
    if(val === qa.answer){
      G.lastOK = true;
      if(G.qMistakes===0) G.correct++;
      Sfx.correct();
    }else{
      G.lastOK = false;
      G.mistakes++; G.qMistakes++;
      Sfx.wrong();
    }
    render();
    scrollFeedback();
    return;
  }

  /* 三格積木 */
  if(act==='tile'){
    if(G.answered) return;
    var ti = parseInt(el.getAttribute('data-i'),10);
    if(G.tiles[ti].used) return;
    var empty = G.slots.indexOf(null);
    if(empty<0) return;
    G.tiles[ti].used = true;
    G.slots[empty] = ti;
    Sfx.stack();
    var full = G.slots.every(function(x){ return x!==null; });
    render();
    if(full){
      setTimeout(function(){ checkBuild(); }, 320);
    }
    return;
  }
  if(act==='slot'){
    if(G.answered) return;
    var si = parseInt(el.getAttribute('data-i'),10);
    var tileIdx = G.slots[si];
    if(tileIdx===null) return;
    G.tiles[tileIdx].used = false;
    G.slots[si] = null;
    Sfx.unstack();
    render();
    return;
  }

  /* 前半後半 */
  if(act==='splitA'){
    var sa = parseInt(el.getAttribute('data-i'),10);
    if(G.done.indexOf(sa)>=0) return;
    if(G.selA!==sa) G.itemMistakes = 0;
    G.selA = sa;
    Sfx.click();
    render();
    return;
  }
  if(act==='splitB'){
    if(G.selA===null){ toast('先點左邊的前半'); return; }
    var sk = parseInt(el.getAttribute('data-k'),10);
    var ro = G.rightOrder[sk];
    if(!ro) return;
    if(ro.type==='pair' && G.done.indexOf(ro.i)>=0) return;
    if(ro.type==='pair' && ro.i === G.selA){
      G.done.push(ro.i);
      if(G.itemMistakes===0) G.correct++;
      G.note = {word:mode.pairs[ro.i].word, sentence:mode.pairs[ro.i].sentence};
      G.selA = null;
      Sfx.correct();
      if(G.done.length === mode.pairs.length){ finishGame(); return; }
    }else{
      G.mistakes++; G.itemMistakes++;
      G.shakeB = sk;
      Sfx.wrong();
      toast('這兩半拼不成疊詞，再試一次');
      render();
      setTimeout(function(){ if(G && G.shakeB===sk){ G.shakeB=null; render(); } }, 450);
      return;
    }
    render();
    return;
  }

  /* 句子尋寶 */
  if(act==='spot'){
    if(G.found) return;
    var qi = parseInt(el.getAttribute('data-i'),10);
    var qs = mode.questions[G.qi];
    if(qs.chunks[qi] === qs.answer){
      G.found = true; G.lastOK = true;
      if(G.qMistakes===0) G.correct++;
      Sfx.correct();
      render(); scrollFeedback();
    }else{
      G.mistakes++; G.qMistakes++;
      G.wrongChunk = qi;
      Sfx.wrong();
      render();
      setTimeout(function(){ if(G && G.wrongChunk===qi){ G.wrongChunk=-1; render(); } }, 430);
    }
    return;
  }

  /* 詞義連一連 */
  if(act==='matchW'){
    var mw = parseInt(el.getAttribute('data-i'),10);
    if(G.done.indexOf(mw)>=0) return;
    if(G.selW!==mw) G.itemMistakes = 0;
    G.selW = mw;
    Sfx.click();
    render();
    return;
  }
  if(act==='matchD'){
    if(G.selW===null){ toast('先點左邊的成語'); return; }
    var md = parseInt(el.getAttribute('data-i'),10);
    if(G.done.indexOf(md)>=0) return;
    if(md === G.selW){
      G.done.push(md);
      if(G.itemMistakes===0) G.correct++;
      G.note = {word:mode.pairs[md].word, sentence:mode.pairs[md].note};
      G.selW = null;
      Sfx.correct();
      if(G.done.length === mode.pairs.length){ finishGame(); return; }
    }else{
      G.mistakes++; G.itemMistakes++;
      G.shakeD = md;
      Sfx.wrong();
      toast('意思配不上，再想一想');
      render();
      setTimeout(function(){ if(G && G.shakeD===md){ G.shakeD=null; render(); } }, 450);
      return;
    }
    render();
    return;
  }

  /* 句子診所 */
  if(act==='clinicSeg'){
    if(G.step!==1) return;
    var ci = parseInt(el.getAttribute('data-i'),10);
    var cq = mode.questions[G.qi];
    if(cq.segments[ci].bad){
      G.step = 2;
      G.badIdx = ci;
      Sfx.pop();
      render();
    }else{
      G.mistakes++; G.qMistakes++;
      G.wrongSeg = ci;
      Sfx.wrong();
      render();
      setTimeout(function(){ if(G && G.wrongSeg===ci){ G.wrongSeg=-1; render(); } }, 430);
    }
    return;
  }
  if(act==='clinicOpt'){
    if(G.answered) return;
    var cq2 = mode.questions[G.qi];
    var cv = el.getAttribute('data-val');
    G.picked = cv;
    G.answered = true;
    if(cv === cq2.answer){
      G.lastOK = true;
      if(G.qMistakes===0) G.correct++;
      Sfx.correct();
    }else{
      G.lastOK = false;
      G.mistakes++; G.qMistakes++;
      Sfx.wrong();
    }
    render();
    scrollFeedback();
    return;
  }

  /* 疊詞分類 */
  if(act==='sortChip'){
    var sw = el.getAttribute('data-w');
    if(G.sel!==sw) G.itemMistakes = 0;
    G.sel = sw;
    Sfx.click();
    render();
    return;
  }
  if(act==='sortBin'){
    if(!G.sel){ toast('先點一個疊詞'); return; }
    var bin = el.getAttribute('data-bin');
    var item = null;
    mode.items.forEach(function(it){ if(it.w===G.sel) item = it; });
    if(!item) return;
    if(item.cat === bin){
      G.placed[item.w] = bin;
      if(G.itemMistakes===0) G.correct++;
      G.note = item;
      G.sel = null;
      Sfx.correct();
      if(Object.keys(G.placed).length === mode.items.length){ finishGame(); return; }
    }else{
      G.mistakes++; G.itemMistakes++;
      G.wrongBin = bin;
      Sfx.wrong();
      toast('這個詞不屬於這一類，再試試');
      render();
      setTimeout(function(){ if(G && G.wrongBin===bin){ G.wrongBin=null; render(); } }, 450);
      return;
    }
    render();
    return;
  }
});

/* 三格積木自動檢查 */
function checkBuild(){
  if(!G || S.screen!=='game') return;
  var mode = getMode();
  if(!mode || mode.engine!=='build' || G.answered) return;
  var q = mode.questions[G.qi];
  var guess = G.slots.map(function(idx){ return idx===null ? '' : G.tiles[idx].ch; }).join('');
  if(guess === q.word){
    G.answered = true;
    G.lastOK = true;
    if(G.qMistakes===0) G.correct++;
    Sfx.correct();
    render();
    scrollFeedback();
  }else{
    G.mistakes++; G.qMistakes++;
    G.shake = true;
    Sfx.wrong();
    render();
    setTimeout(function(){
      if(!G) return;
      G.shake = false;
      G.tiles.forEach(function(t){ t.used = false; });
      G.slots = G.slots.map(function(){ return null; });
      render();
    }, 520);
  }
}

/* 首次觸碰解鎖音效 */
document.addEventListener('pointerdown', function once(){
  Sfx.init();
  document.removeEventListener('pointerdown', once);
}, {passive:true});
window.addEventListener('keydown', function(e){
  if(e.key==='Escape' && S.screen!=='home'){
    if(S.screen==='game'){ S.screen='version'; G=null; render(); }
  }
});

/* 啟動 */
render();
</script>
