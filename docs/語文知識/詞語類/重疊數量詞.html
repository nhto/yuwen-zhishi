<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>量詞大冒險｜小學量詞重疊互動課件</title>
<meta name="description" content="初小與高小兩版、教學四課與雙模式遊戲，看圖選量詞、句子偵探，每題附三層解析與粵語朗讀，可離線使用。">
<style>
/* ===== tokens ===== */
:root{
  --ink:#33403F; --ink-soft:#5C6B6A;
  --cream:#FFF7EC; --card:#FFFFFF;
  --orange:#FF8B3D; --yellow:#FFC94A; --teal:#2FA98C;
  --blue:#62B6E8; --pink:#FF8FA3; --warn:#E8833A;
  --accent:#FF8B3D; --accent-soft:#FFF0E2;
  --shadow:0 .35rem 0 rgba(51,64,63,.16);
  --radius:1.5rem;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
@media(min-width:600px){html{font-size:20px}}
@media(min-width:1024px){html{font-size:22px}}
html.stage{font-size:26px}
html.stage .deco{display:none!important}
html.stage .art-frame{max-height:none}
body{
  margin:0;font-family:"Noto Sans TC","Source Han Sans TC","PingFang HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--ink);background:var(--cream);line-height:1.5;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 10% 4%, #FFE6C8 0 16%, transparent 42%),
    radial-gradient(circle at 92% 12%, #D8F1E7 0 12%, transparent 38%),
    radial-gradient(circle at 50% 104%, #FFEFD4 0 28%, transparent 62%),
    var(--cream);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(51,64,63,.13) 1.3px, transparent 1.4px);
  background-size:1.7rem 1.7rem;
}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:.25rem solid #2F86C9;outline-offset:.18rem}

/* ===== shell ===== */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.45rem;
  padding:.5rem max(.8rem,env(safe-area-inset-left)) .5rem max(.8rem,env(safe-area-inset-right));
  background:rgba(255,247,236,.92);backdrop-filter:blur(10px);
  border-bottom:2px dashed rgba(51,64,63,.16);
}
.topbar .t-title{flex:1;text-align:center;font-weight:900;font-size:1.02rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  flex:0 0 auto;width:3rem;height:3rem;display:grid;place-items:center;padding:0;
  background:#fff;border:2.5px solid var(--ink);border-radius:1rem;
  box-shadow:0 .18rem 0 rgba(51,64,63,.28);cursor:pointer;transition:transform .12s,box-shadow .12s;
}
.icon-btn:active{transform:translateY(.16rem);box-shadow:none}
.icon-btn svg{width:1.45rem;height:1.45rem;display:block}
.icon-btn[hidden]{display:none}
.main{flex:1;width:100%;max-width:72rem;margin:0 auto;padding:.9rem max(.9rem,env(safe-area-inset-left)) 3rem max(.9rem,env(safe-area-inset-right))}
.view{display:none}
.view.active{display:block;animation:viewIn .32s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}

/* ===== typography ===== */
h1,h2,h3,h4,p{margin:0}
.page-title{font-size:1.62rem;font-weight:900;letter-spacing:.04em;line-height:1.25}
.page-sub{font-size:.98rem;color:var(--ink-soft);margin-top:.3rem;line-height:1.55}
.kicker{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:800;letter-spacing:.12em;color:var(--ink-soft)}
.lead{font-size:1.45rem;font-weight:900;line-height:1.35;letter-spacing:.02em}
.small{font-size:.85rem;color:var(--ink-soft)}

/* ===== generic ===== */
.card{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:0 .35rem 0 rgba(51,64,63,.18);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:3.6rem;padding:.6rem 1.3rem;font-size:1.08rem;font-weight:900;letter-spacing:.04em;
  background:#fff;border:3px solid var(--ink);border-radius:1.15rem;
  box-shadow:0 .3rem 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .2s;
  touch-action:manipulation;
}
.btn:active{transform:translateY(.24rem);box-shadow:0 .05rem 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.ghost{background:#fff}
.btn.block{width:100%}
.btn.big{min-height:4.2rem;font-size:1.2rem;border-radius:1.3rem}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:0 .3rem 0 rgba(51,64,63,.35)}
.btn svg{width:1.25rem;height:1.25rem;flex:0 0 auto}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:.85rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== splash ===== */
#view-splash{display:none}
#view-splash.active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;min-height:calc(100dvh - 5rem);text-align:center;padding:1rem 0 2rem}
.splash-mascot{width:min(48vw,13rem);filter:drop-shadow(0 .6rem 0 rgba(51,64,63,.12))}
.title-big{font-size:clamp(2.1rem,9.5vw,3.4rem);font-weight:900;letter-spacing:.1em;line-height:1.12}
.title-big em{font-style:normal;color:var(--orange)}
.title-en{font-size:.72rem;letter-spacing:.22em;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.splash-tags{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.tag{font-size:.82rem;font-weight:800;padding:.3rem .7rem;border:2px solid var(--ink);border-radius:2rem;background:#fff}

/* ===== version ===== */
.version-grid{display:grid;gap:.9rem;margin-top:1rem}
@media(min-width:720px){.version-grid{grid-template-columns:1fr 1fr;gap:1.2rem}}
.version-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;text-align:left;
  padding:1.15rem 1.2rem;cursor:pointer;position:relative;overflow:hidden;
}
.version-card:hover{transform:translateY(-.15rem)}
.version-card .v-badge{font-size:.78rem;font-weight:900;letter-spacing:.1em;padding:.2rem .6rem;border-radius:2rem;border:2px solid var(--ink);background:var(--accent-soft)}
.version-card h3{font-size:1.65rem;font-weight:900;letter-spacing:.06em}
.version-card p{font-size:.95rem;color:var(--ink-soft);line-height:1.6}
.version-card .v-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;width:100%}
.version-card .v-art{width:4.8rem;flex:0 0 auto;margin:-.2rem -.2rem 0 0}
.version-card .v-go{font-weight:900;font-size:.95rem;margin-top:.15rem;display:inline-flex;align-items:center;gap:.35rem}
.version-card .v-go svg{width:1.05rem;height:1.05rem}

/* ===== menu ===== */
.hero{display:flex;align-items:center;gap:.7rem;margin:.2rem 0 1rem}
.hero .h-mascot{width:5.2rem;flex:0 0 auto}
.hero .h-text{flex:1;min-width:0}
.hero .h-title{font-size:1.75rem;font-weight:900;letter-spacing:.06em;line-height:1.2}
.hero .h-sub{font-size:.9rem;color:var(--ink-soft);margin-top:.2rem}
.version-chip{
  display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:900;
  padding:.28rem .65rem;border:2px solid var(--ink);border-radius:2rem;background:#fff;cursor:pointer;
}
.version-chip svg{width:.95rem;height:.95rem}
.progress-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.pcard{padding:.8rem .9rem;display:flex;align-items:center;gap:.7rem;min-width:0}
.pcard .ring{width:3.3rem;height:3.3rem;flex:0 0 auto;position:relative;display:grid;place-items:center}
.pcard .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pcard .ring b{font-size:.8rem;font-weight:900}
.pcard .p-info{min-width:0}
.pcard .p-info strong{display:block;font-size:.95rem;font-weight:900;white-space:nowrap}
.pcard .p-info span{font-size:.74rem;color:var(--ink-soft);display:block;line-height:1.35}
.entry-grid{display:grid;gap:.85rem}
.entry{
  display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;
  padding:1rem;cursor:pointer;text-align:left;width:100%;
}
.entry .e-icon{
  width:4rem;height:4rem;border-radius:1.1rem;border:2.5px solid var(--ink);
  display:grid;place-items:center;background:var(--accent-soft);flex:0 0 auto;
}
.entry .e-icon svg{width:2.4rem;height:2.4rem}
.entry h3{font-size:1.3rem;font-weight:900;letter-spacing:.05em}
.entry p{font-size:.86rem;color:var(--ink-soft);margin-top:.15rem;line-height:1.45}
.entry .e-arrow{width:1.6rem;height:1.6rem;color:var(--ink-soft)}
.entry:hover{transform:translateY(-.12rem)}
.mini-row{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.mini-row .btn{flex:1;min-height:3.2rem;font-size:.95rem}

/* ===== lessons ===== */
.lesson-grid{display:grid;gap:.75rem;margin-top:1rem}
@media(min-width:760px){.lesson-grid{grid-template-columns:1fr 1fr}}
.lesson-card{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.85rem .95rem;cursor:pointer;width:100%;text-align:left}
.lesson-card .l-no{width:2.9rem;height:2.9rem;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.15rem;background:#fff;flex:0 0 auto}
.lesson-card.done .l-no{background:var(--teal);color:#fff}
.lesson-card h3{font-size:1.14rem;font-weight:900}
.lesson-card p{font-size:.83rem;color:var(--ink-soft);margin-top:.1rem}
.lesson-card .l-stamp{font-size:.7rem;font-weight:900;padding:.16rem .45rem;border-radius:2rem;background:var(--yellow);border:2px solid var(--ink);transform:rotate(-6deg)}
.lesson-card .l-stamp[hidden]{display:none}

/* ===== lesson stage ===== */
.lesson-stage{display:grid;gap:.85rem}
.lesson-art{height:clamp(11rem,34vh,20rem);overflow:hidden}
.lesson-line{font-size:1.55rem;font-weight:900;line-height:1.4;text-align:center;letter-spacing:.02em}
.lesson-sub{font-size:.95rem;color:var(--ink-soft);text-align:center;line-height:1.5}
.tap-grid{display:grid;gap:.7rem}
.tap-grid.three{grid-template-columns:repeat(3,1fr)}
@media(min-width:640px){.tap-grid.three{gap:.9rem}}
.tap-card{padding:.6rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:1.2rem;box-shadow:var(--shadow)}
.tap-card .t-art{width:100%;aspect-ratio:4/3;display:grid;place-items:center}
.tap-card.mini{min-height:3.6rem;justify-content:center;padding:.5rem .35rem}
.tap-card .t-label{font-size:.95rem;font-weight:900;text-align:center;line-height:1.3}
.tap-card.found{background:#E9F8F2;border-color:var(--teal)}
.tap-card.found .t-label{color:#1B7A63}
.pick-grid{display:grid;gap:.8rem}
@media(min-width:640px){.pick-grid{grid-template-columns:1fr 1fr}}
.pick-card{padding:.7rem;display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:1.2rem;cursor:pointer;text-align:left}
.pick-card .p-art{width:5.2rem}
.pick-card .p-word{font-size:1.45rem;font-weight:900}
.pick-card .p-mark{font-size:1.4rem;font-weight:900;margin-left:.3rem}
.pick-card.good{background:#E9F8F2;border-color:var(--teal)}
.pick-card.bad{background:#FFF1E4;border-color:var(--warn)}
.kid-row{display:flex;justify-content:center;gap:.3rem;flex-wrap:wrap;padding:.4rem 0}
.kid-btn{background:none;border:none;padding:0;width:min(4.2rem,17vw);cursor:pointer;opacity:.45;filter:grayscale(.6);transition:opacity .25s,filter .25s,transform .25s}
.kid-btn.lit{opacity:1;filter:none;transform:translateY(-.2rem)}
.kid-btn svg{width:100%;display:block}
.kid-labels{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;min-height:2rem}
.kid-label{font-size:.95rem;font-weight:900;padding:.2rem .55rem;border:2px solid var(--teal);border-radius:2rem;background:#E9F8F2}
.stage-wrap{position:relative;border:3px solid var(--ink);border-radius:1.4rem;overflow:hidden;background:#fff}
.stage-wrap svg{display:block;width:100%}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);min-width:2.6rem;min-height:2.6rem;padding:0 .45rem;
  display:grid;place-items:center;font-size:.82rem;font-weight:900;color:var(--ink);white-space:nowrap;max-width:42%;
  background:#fff;border:2.5px solid var(--ink);border-radius:2rem;box-shadow:0 .2rem 0 rgba(51,64,63,.25);cursor:pointer;
}
.hotspot.found{background:var(--teal);color:#fff;border-color:var(--ink)}
.hotspot.found::after{content:" ✓";font-size:.8rem}
.timeline{display:flex;gap:.4rem;flex-wrap:wrap}
.timeline button{flex:1;min-width:5.5rem}
.timeline button.on{background:var(--accent);color:var(--ink)}
.night-scene{position:relative;border:3px solid var(--ink);border-radius:1.4rem;overflow:hidden;background:#2C3A57}
.night-scene svg{display:block;width:100%}
.win{position:absolute;width:8.5%;height:11%;border-radius:.25rem;border:2px solid #1F2A40;background:#46597C;cursor:pointer;padding:0;transition:background .3s,box-shadow .3s}
.win.lit{background:var(--yellow);box-shadow:0 0 1rem rgba(255,201,74,.95)}
.win:focus-visible{outline:.2rem solid #fff}
.phrase-big{text-align:center;font-size:1.8rem;font-weight:900;letter-spacing:.15em;color:var(--teal)}

/* ===== modes ===== */
.mode-grid{display:grid;gap:.9rem;margin-top:1rem}
@media(min-width:720px){.mode-grid{grid-template-columns:1fr 1fr}}
.mode-card{display:grid;gap:.5rem;padding:1.1rem;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.mode-card h3{font-size:1.45rem;font-weight:900;letter-spacing:.05em}
.mode-card p{font-size:.9rem;color:var(--ink-soft);line-height:1.55}
.mode-card .m-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.mode-card .m-art{height:7rem;display:grid;place-items:center}
.mode-card .m-art svg{height:100%;width:auto}
.stars-line{display:inline-flex;align-items:center;gap:.15rem;font-size:.9rem;font-weight:900}
.stars-line svg{width:1rem;height:1rem}
.mode-card .m-best{position:absolute;top:.9rem;right:.9rem;font-size:.78rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:2rem;padding:.15rem .5rem}

/* ===== game ===== */
.game-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.game-top .q-count{font-size:.88rem;font-weight:900;white-space:nowrap}
.game-top .progress-bar{flex:1;height:.65rem;border:2px solid var(--ink);border-radius:1rem;background:#fff;overflow:hidden}
.game-top .progress-bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.q-stars{display:flex;gap:.12rem}
.q-stars svg{width:1.05rem;height:1.05rem}
.prompt-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:800;padding:.25rem .6rem;border:2px solid var(--ink);border-radius:2rem;background:#fff;margin-bottom:.5rem}
.match-art{height:clamp(9.5rem,28vh,17rem);overflow:hidden;margin-bottom:.6rem}
.noun-row{display:flex;align-items:center;gap:.6rem;justify-content:center;margin:.2rem 0 .6rem;flex-wrap:wrap}
.noun{font-size:1.85rem;font-weight:900;letter-spacing:.08em}
.drop-slot{
  min-width:6.6rem;min-height:4rem;display:grid;place-items:center;padding:.3rem .8rem;
  border:3px dashed rgba(51,64,63,.55);border-radius:1rem;background:rgba(255,255,255,.8);
  font-size:1.35rem;font-weight:900;color:var(--ink-soft);
}
.drop-slot.over{border-color:var(--teal);background:#E9F8F2;border-style:solid}
.drop-slot.filled{border-style:solid;border-color:var(--teal);color:var(--ink);background:#E9F8F2}
.sentence-card{padding:1rem;margin-bottom:.8rem;background:#FFFDF8;border:3px solid var(--ink);border-radius:1.3rem;box-shadow:var(--shadow)}
.sentence-card p{font-size:1.32rem;font-weight:800;line-height:1.75;letter-spacing:.03em}
.blank{display:inline-block;min-width:4.4rem;border-bottom:.25rem solid var(--accent);color:var(--warn);text-align:center}
.blank.filled{color:var(--teal);border-color:var(--teal)}
.sent-art{height:clamp(7rem,18vh,11rem);margin-bottom:.7rem;overflow:hidden}
.options{display:grid;gap:.6rem}
@media(min-width:720px){.options.three{grid-template-columns:repeat(3,1fr)}}
.opt{
  position:relative;display:flex;align-items:center;justify-content:center;gap:.4rem;
  min-height:4.6rem;padding:.5rem .8rem;font-size:1.4rem;font-weight:900;letter-spacing:.06em;
  background:#fff;border:3px solid var(--ink);border-radius:1.1rem;box-shadow:0 .28rem 0 rgba(51,64,63,.28);
  cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s,background .2s,border-color .2s;
}
.opt:active{transform:translateY(.15rem);box-shadow:0 .08rem 0 rgba(51,64,63,.28)}
.opt.draggable{touch-action:none;cursor:grab}
.opt.correct{background:#E4F7EF;border-color:var(--teal);box-shadow:0 .28rem 0 rgba(47,169,140,.55)}
.opt.wrong{background:#FFF0E2;border-color:var(--warn);color:#8A4A16}
.opt.faded{opacity:.45}
.opt.drag-src{opacity:.3}
.opt .mark{font-size:1.25rem;font-weight:900}
.opt:disabled{cursor:default}
.opt[data-moved="1"]{cursor:grab}
.ghost-card{
  position:fixed;z-index:120;pointer-events:none;display:flex;align-items:center;justify-content:center;
  background:#fff;border:3px solid var(--teal);border-radius:1.1rem;font-weight:900;font-size:1.4rem;
  box-shadow:0 .6rem 1.4rem rgba(51,64,63,.3);transform:rotate(-2deg);opacity:.95;
}
.hint-line{font-size:.85rem;color:var(--ink-soft);text-align:center;margin-top:.6rem;min-height:1.3rem}
.hint-line.alert{color:#A4551B;font-weight:800}
.match-hint{font-size:.95rem;font-weight:800;color:#A4551B;text-align:center;min-height:1.4rem;margin-top:.4rem}

/* ===== overlay sheet ===== */
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(30,40,39,.48);padding:0}
.overlay.show{display:flex;animation:fade .2s}
.sheet{
  width:min(48rem,100%);max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#fff;border:3px solid var(--ink);border-radius:1.8rem 1.8rem 0 0;
  padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));animation:sheetUp .3s ease-out;
}
@media(min-width:760px){
  .overlay{align-items:center;padding:2rem}
  .sheet{border-radius:1.8rem;max-height:86dvh}
}
@keyframes sheetUp{from{transform:translateY(2rem);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.verdict{display:inline-flex;align-items:center;gap:.35rem;font-size:1.05rem;font-weight:900;padding:.25rem .65rem;border:2.5px solid var(--ink);border-radius:2rem;background:#E4F7EF}
.verdict.miss{background:#FFF0E2}
.verdict svg{width:1.1rem;height:1.1rem}
.sheet .q-no{font-size:.8rem;font-weight:800;color:var(--ink-soft)}
.answer-big{font-size:clamp(2.4rem,12vw,3.4rem);font-weight:900;letter-spacing:.16em;text-align:center;line-height:1.15;color:#1B7A63;margin:.3rem 0 .2rem}
.answer-sub{text-align:center;font-size:.85rem;color:var(--ink-soft);margin-bottom:.7rem}
.layer{border-radius:1rem;padding:.7rem .85rem;margin-bottom:.55rem;border:2px solid rgba(51,64,63,.16);background:#FFFDF8}
.layer h4{display:flex;align-items:center;gap:.35rem;font-size:.88rem;font-weight:900;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:.2rem}
.layer p{font-size:1.02rem;line-height:1.65}
.layer.why{background:#F1FAF7;border-color:rgba(47,169,140,.45)}
.layer.why h4{color:#1B7A63}
.layer.trap{background:#FFF6EC;border-color:rgba(232,131,58,.45)}
.layer.trap h4{color:#A4551B}
.layer .num-badge{width:1.3rem;height:1.3rem;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:#fff;font-size:.72rem}

function mascot(mood){
  mood=mood||"happy";
  const eyeS = mood==="think" ? `<path d="M-16 -12 q6 -8 12 0" fill="none" stroke="${K}" stroke-width="3"/><path d="M4 -12 q6 -8 12 0" fill="none" stroke="${K}" stroke-width="3"/>`
    : mood==="surprise" ? `<circle cx="-10" cy="-10" r="6.4" fill="${WH}" stroke-width="2.6"/><circle cx="12" cy="-10" r="6.4" fill="${WH}" stroke-width="2.6"/>${eye(-10,-10,2.8)}${eye(12,-10,2.8)}`
    : `${eye(-10,-10,3.4)}${eye(12,-10,3.4)}`;
  const mouthS = mood==="surprise" ? `<ellipse cx="1" cy="12" rx="6" ry="7" fill="#C25A4A" stroke-width="2.6"/>`
    : mood==="cheer" ? `<path d="M-8 10 q9 12 18 0 q-9 4 -18 0z" fill="#C25A4A" stroke-width="2.6"/>`
    : `<path d="M-7 8 q8 9 16 0" fill="none" stroke="${K}" stroke-width="3.2"/>`;
  const armD = mood==="cheer" ? "M-30 6 q-18 -16 -22 -28 M30 6 q18 -16 22 -28"
    : mood==="think" ? "M-28 12 q-14 8 -16 18 M28 12 q10 2 14 -8"
    : "M-30 10 q-12 8 -14 16 M30 10 q12 8 14 16";
  const arms = `<path d="${armD}" fill="none" stroke="${K}" stroke-width="10" stroke-linecap="round"/><path d="${armD}" fill="none" stroke="${OR}" stroke-width="6" stroke-linecap="round"/>`;
  const extra = mood==="think" ? `<g><circle cx="34" cy="-46" r="4" fill="${BL}" stroke="none"/><circle cx="42" cy="-56" r="6" fill="${BL}" stroke="none"/><path d="M50 -74 a12 12 0 1 0 12 14 a9 9 0 1 1 -12 -14z" fill="${WH}" stroke-width="2.6"/><path d="M56 -62 q6 -2 4 -8" fill="none" stroke="${K}" stroke-width="2"/></g>` : "";
  return `<svg viewBox="0 0 140 140" role="img" aria-label="小量">
    <g stroke="${K}" stroke-width="3.4" stroke-linejoin="round">
      <ellipse cx="70" cy="128" rx="30" ry="6" fill="rgba(51,64,63,.12)" stroke="none"/>
      <path d="M56 104 q-4 12 -10 18 M84 104 q4 12 10 18" fill="none" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="70" cy="66" rx="40" ry="38" fill="${OR}"/>
      <ellipse cx="70" cy="70" rx="28" ry="26" fill="#FFE0C2" stroke="none"/>
      <g transform="translate(70 62)">
        ${eyeS}
        ${blush(0,6,22)}
        ${mouthS}
      </g>
      ${arms}
      <path d="M70 20 q-4 -12 6 -14" fill="none" stroke="${BR}" stroke-width="3.4"/>
      <path d="M82 8 q10 -6 16 2 q-10 4 -16 -2z" fill="${LF}" stroke-width="3"/>
      ${extra}
    </g>
  </svg>`;

/* ================= 音效 ================= */
const Sound={
  ctx:null,
  unlock(){
    try{
      if(!this.ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return false;
        this.ctx=new AC();
      }
      if(this.ctx.state==="suspended") this.ctx.resume();
      return true;
    }catch(e){return false;}
  },
  tone(freq,dur,type,vol,delay,slide){
    if(!app.sound) return;
    if(!this.unlock()||!this.ctx) return;
    const c=this.ctx, t0=c.currentTime+(delay||0);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=type||"triangle";
    osc.frequency.setValueAtTime(freq,t0);
    if(slide) osc.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  },
  noise(dur,vol){
    if(!app.sound) return;
    if(!this.unlock()||!this.ctx) return;
    const c=this.ctx, len=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1600; f.Q.value=0.8;
    const g=c.createGain(); g.gain.value=vol||0.09;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  },
  tap(){ this.tone(760,0.08,"triangle",0.09); },
  pick(){ this.tone(520,0.12,"sine",0.1,0,760); },
  correct(){ [523.25,659.25,783.99].forEach((f,i)=>this.tone(f,0.32,"triangle",0.15,i*0.09)); },
  wrong(){ this.tone(392,0.22,"sine",0.09,0); this.tone(311,0.3,"sine",0.08,0.14); },
  reveal(){ this.noise(0.22,0.07); this.tone(660,0.16,"sine",0.07,0.02); },
  star(){ [1046,1318,1568].forEach((f,i)=>this.tone(f,0.18,"sine",0.09,i*0.06)); },
  fanfare(){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.5,"triangle",0.13,i*0.1));
    this.noise(0.5,0.05);
  }
};

/* ================= 語音 ================= */
let voiceList=[];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  try{voiceList=window.speechSynthesis.getVoices()||[];}catch(e){voiceList=[];}
}
if("speechSynthesis" in window){
  loadVoices();
  window.speechSynthesis.addEventListener("voiceschanged",loadVoices);
}
function pickVoice(){
  if(!voiceList.length) loadVoices();
  const hk=voiceList.find(v=>/zh[-_]HK/i.test(v.lang));
  if(hk) return hk;
  const tw=voiceList.find(v=>/zh[-_]TW/i.test(v.lang));
  if(tw) return tw;
  return voiceList.find(v=>/^zh/i.test(v.lang))||null;
}
let lastSpoken="",voiceWarned=false;
function speak(text){
  if(!text) return;
  if(!app.voice){ if(!voiceWarned){voiceWarned=true;toast("語音朗讀已關閉，可在「說明」開啟");} return;}
  if(!("speechSynthesis" in window)){ if(!voiceWarned){voiceWarned=true;toast("此裝置不支援語音朗讀，可看文字說明");} return;}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-HK"; u.rate=0.92; u.pitch=1.03;
    const v=pickVoice(); if(v) u.voice=v;
    u.onerror=()=>{ if(!voiceWarned){voiceWarned=true;toast("此裝置暫無粵語語音，可看文字說明");} };
    window.speechSynthesis.speak(u);
    lastSpoken=text;
  }catch(e){toast("語音未能播放，可看文字說明");}
}

function ring(done,total,color){
  const c=2*Math.PI*18, p=total?Math.min(1,done/total):0;
  return `<div class="ring"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(51,64,63,.14)" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg><b>${done}/${total}</b></div>`;
}

let current="splash", stack=[];
const TITLES={splash:"量詞大冒險",version:"選擇版本",menu:"量詞大冒險",lessons:"學習篇",lesson:"教學卡",modes:"遊戲篇",game:"遊戲進行中",result:"本輪成績",guide:"量詞圖鑑",info:"說明與設定",report:"本輪報告"};
function show(view,push=true){
  if(push&&current&&current!==view) stack.push(current);
  if(view!=="lesson"&&view!=="game"){/* keep */}
  current=view;
  const el=$("#view-"+view);
  if(!el) return;
  $$(".view").forEach(v=>v.classList.remove("active"));
  renderView(view,el);
  if(current===view) el.classList.add("active");
  updateChrome();
  window.scrollTo(0,0);
}
function back(){
  if(current==="game"){ G=null; closeSheet(); const prev=stack.pop()||"modes"; show(prev,false); return; }
  if(current==="lesson"){ closeSheet(); const prev=stack.pop()||"lessons"; show(prev,false); return; }
  const prev=stack.pop()||"menu";
  closeSheet();
  show(prev,false);
}
function home(){
  closeSheet(); G=null; stack=[];
  show("menu",false);
}
function updateChrome(){
  $("#topTitle").textContent=TITLES[current]||"量詞大冒險";
  $("#btnBack").hidden=!(stack.length>0||["game","lesson","report"].includes(current));
  $("#btnHome").hidden=["splash","version","menu"].includes(current);
  const on=!!app.sound;
  $("#btnSound").setAttribute("aria-pressed",on?"true":"false");
  $("#btnSound").setAttribute("aria-label",on?"音效已開啟，點擊靜音":"音效已關閉，點擊開啟");

  <div class="card" style="padding:.9rem;margin-top:1rem;display:flex;gap:.7rem;align-items:center">
    <div style="width:3.2rem;flex:0 0 auto">${mascot("think")}</div>
    <p class="small" style="flex:1">小提示：教學卡上的句子都可以按「聽一次」，用粵語跟着讀。</p>
  </div>`;
}

let L=null;
function openLesson(id){
  const les=DATA[app.version].lessons.find(x=>x.id===id);
  if(!les) return;
  L={les,found:new Set(),frame:0,qi:0,answered:false,pickFb:{},feedback:"",complete:(app.lessons[app.version]||[]).includes(les.id)};
  show("lesson");
}
function markLessonDone(){
  const v=app.version, id=L.les.id;
  if(!app.lessons[v]) app.lessons[v]=[];
  if(!app.lessons[v].includes(id)){ app.lessons[v].push(id); persist(); }
  L.complete=true;
}
function lessonShell(les,stageHTML){
  return `<div class="lesson-stage">
    <div class="row between"><span class="kicker">${app.version==="junior"?"初小":"高小"} · 第 ${les.no} 課</span><span class="small">${les.no} / 4</span></div>
    <h2 class="page-title" style="margin:.1rem 0 .2rem">${les.title}</h2>
    ${stageHTML}
  </div>`;
}
function lessonArtBlock(key,label,cls){

}
function lessonDoneBlock(les){
  if(!L.complete) return "";
  return `<div class="card" style="padding:.85rem;background:#E9F8F2;border-color:#2FA98C;display:grid;gap:.6rem;text-align:center">
    <p style="font-weight:900;font-size:1.05rem">✓ ${les.done}</p>
    <button class="btn primary block" data-act="lesson-next" type="button">繼續下一課 ${arrowSVG}</button>

}

          <span class="p-art">${artSVG(it.art,it.label)}</span>

        </button>`).join("")}
      </div>
      ${lessonDoneBlock(les)}`;
  }else if(les.type==="kids"){
    const colors=["#FF8B3D","#2FA98C","#FFC94A","#62B6E8","#FF8FA3"];
    stage=`<p class="lesson-line">${les.lead}</p>
      <p class="lesson-sub">${les.sub}</p>
      <div class="kid-row">
        ${[0,1,2,3,4].map(i=>`<button class="kid-btn${L.found.has(i)?" lit":""}" data-kid="${i}" type="button" aria-label="小朋友 ${i+1}">
          <svg viewBox="0 25 100 105" aria-hidden="true"><g stroke="${K}" stroke-width="3.2" stroke-linejoin="round">${kidUnit(50,122,1,colors[i])}</g></svg>
        </button>`).join("")}
      </div>

      <div class="kid-labels">${L.found.size===5?`<span class="kid-label">一個個 · 很多個，一個接一個</span>`:""}</div>
      ${lessonDoneBlock(les)}`;
  }else if(les.type==="find"){
    stage=`<p class="lesson-line">${les.lead}</p>
      <p class="lesson-sub">${les.sub}</p>
      <div class="stage-wrap">
        ${artSVG("campus","校園場景")}
        ${les.spots.map((s,i)=>`<button class="hotspot${L.found.has(i)?" found":""}" data-spot="${i}" type="button" style="left:${s.x}%;top:${s.y}%">${L.found.has(i)?"✓ ":""}${s.label}</button>`).join("")}
      </div>
      <div class="kid-labels">${les.spots.filter((_,i)=>L.found.has(i)).map(s=>`<span class="kid-label">${s.say}</span>`).join("")}</div>

      ${lessonDoneBlock(les)}`;

          `<button class="win${L.found.has(i)?" lit":""}" data-win="${i}" type="button" aria-label="第 ${i+1} 扇窗" style="left:${w[0]}%;top:${w[1]}%"></button>`).join("")}

function bindLesson(les){
  const el=$("#view-lesson");
  if(les.type==="tap"){
    $$("[data-tap]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.tap;
      L.frame=i;
      Sound.tap();
      if(!L.found.has(i)) L.found.add(i);
      speak(les.items[i].label);
      if(L.found.size===les.items.length){ markLessonDone(); setTimeout(()=>speak(les.done),900); }
      renderLesson(el);
    }));
  }
  if(les.type==="pick"){
    $$("[data-pick]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.pick, it=les.items[i];
      if(it.ok){
        Sound.correct(); b.classList.add("good");
        L.pickFb[i]="✓ "+it.hint;
        speak(it.label+"。"+it.hint);
        markLessonDone(); renderLesson(el);
      }else{
        Sound.wrong(); b.classList.add("bad","shake");
        L.pickFb[i]=it.hint;
        const fb=b.querySelector("[data-fb]"); if(fb) fb.textContent=it.hint;
        speak(it.hint);
        setTimeout(()=>b.classList.remove("shake"),450);
      }
    }));
  }
  if(les.type==="kids"){
    $$("[data-kid]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.kid;
      if(L.found.has(i)) return;
      L.found.add(i); Sound.tap(); b.classList.add("lit");
      speak("一個");
      if(L.found.size===5){ markLessonDone(); Sound.star(); setTimeout(()=>speak("一個個，就是很多個，一個接一個。"),700); }
      renderLesson(el);
    }));
  }
  if(les.type==="find"){
    $$("[data-spot]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.spot, s=les.spots[i];
      if(L.found.has(i)){ speak(s.say); return; }
      L.found.add(i); Sound.tap(); Sound.star(); speak(s.say);
      if(L.found.size===les.spots.length){ markLessonDone(); setTimeout(()=>speak(les.done),900); }
      renderLesson(el);
    }));
  }
  if(les.type==="slider"){
    $$("[data-frame]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.frame;
      L.frame=i; L.found.add(i); Sound.pick();
      speak(les.frames[i].say);
      if(L.found.size===3){ markLessonDone(); }
      renderLesson(el);
    }));
  }
  if(les.type==="windows"){
    $$("[data-win]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.win;
      if(L.found.has(i)) return;
      L.found.add(i);
      Sound.tone(520+i*45,0.22,"sine",0.1);
      b.classList.add("lit");
      if(L.found.size===8){
        markLessonDone(); Sound.star();
        setTimeout(()=>speak("家家戶戶都亮了燈，一個也不漏。"),400);
      }
      renderLesson(el);
    }));
  }
  if(les.type==="trio"){
    $$("[data-trio]",el).forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.trio;
      if(L.found.has(i)){ speak(les.items[i].say); return; }
      L.found.add(i); Sound.tap(); speak(les.items[i].say);
      if(L.found.size===3){ markLessonDone(); }
      renderLesson(el);
    }));
  }
  if(les.type==="quiz"){
    const it=les.items[L.qi];
    $$("[data-quiz]",el).forEach(b=>b.addEventListener("click",()=>{
      if(L.answered) return;
      const val=b.dataset.quiz;
      if(val===it.answer){
        L.answered=true; Sound.correct(); b.classList.add("correct");
        L.feedback=it.why;
        speak(it.answer+"。"+it.why);
        $$("[data-quiz]",el).forEach(x=>{x.disabled=true;});
        if(L.qi===2) markLessonDone();
        renderLesson(el);
      }else{
        Sound.wrong(); b.classList.add("wrong"); b.disabled=true;
        const hint=$("#quizHint"); if(hint){ hint.className="hint-line alert"; hint.textContent="再想想：先看看圖中是甚麼東西，再想它的量詞。"; }
        b.classList.add("shake");
        setTimeout(()=>b.classList.remove("shake"),450);
      }
    }));
  }
}

/* ================= 遊戲 ================= */
let G=null;
function startGame(mode){
  const v=app.version;
  if(!v){ show("version",false); return; }
  const bank=DATA[v][mode];
  G={
    version:v, mode, queue:bank.map((q,i)=>({...q,no:i+1})),
    index:0, attempts:0, stars:0, reasons:0, lock:false, revealed:false,
    chosen:null, answers:[], wrong:[], followDone:false, startedAt:Date.now()
  };
  show("game");
}
function currentQ(){ return G?G.queue[G.index]:null; }
function starsForAttempts(a){ return a===0?3:a===1?1:0; }

function renderGame(el){
  if(!G){ show("modes",false); return; }
  const q=currentQ();
  if(!q){ show("modes",false); return; }
  const idx=G.index, total=G.queue.length;
  const perStar=starsForAttempts(G.attempts);
  const starBar=[0,1,2].map(i=>starSVG(i<perStar?"#FFC94A":"#E7E0D2")).join("");
  const head=`<div class="game-top">
      <span class="q-count">第 ${idx+1} / ${total} 題</span>
      <div class="progress-bar"><i style="width:${(idx/total*100).toFixed(1)}%"></i></div>
      <div class="q-stars" aria-label="本題可得 ${perStar} 星">${starBar}</div>
    </div>`;
  if(G.mode==="match"){
    el.innerHTML=`${head}
      <div class="prompt-chip">配一配 · 看圖選量詞</div>
      <div class="art-frame match-art">${artSVG(q.image,q.noun)}</div>
      <div class="noun-row"><span class="noun">${q.noun}</span><span class="drop-slot" id="dropSlot" aria-label="量詞放置框">？</span></div>
      <div class="options three" id="options">
        ${shuffle(q.options).map(o=>`<button class="opt draggable" data-val="${esc(o)}" type="button">${esc(o)}</button>`).join("")}
      </div>
      <p class="match-hint" id="matchHint" role="status">把量詞卡拖到框裏，也可以直接點一下。</p>
      <p class="hint-line">${q.noun} 應該用哪一個重疊量詞？</p>`;
    bindMatchOptions();
  }else{
    const parts=q.sentence.split("＿＿");
    el.innerHTML=`${head}
      <div class="prompt-chip">句子偵探 · 選出最順的一句</div>
      <div class="sentence-card"><p>${esc(parts[0])}<span class="blank" id="blank">＿＿</span>${esc(parts[1]||"")}</p></div>
      <div class="art-frame sent-art">${artSVG(q.image,"題目插圖")}</div>
      <div class="options three" id="options">
        ${shuffle(q.options).map(o=>`<button class="opt" data-val="${esc(o)}" type="button">${esc(o)}</button>`).join("")}
      </div>
      <p class="hint-line" id="matchHint" role="status">讀一讀整句，哪個最順？</p>`;
    $$("#options .opt",el).forEach(b=>b.addEventListener("click",()=>choose(b.dataset.val,b)));
  }
}

function bindMatchOptions(){
  const slot=$("#dropSlot");
  $$("#options .opt").forEach(btn=>{
    let st=null;
    btn.addEventListener("pointerdown",e=>{
      if(G.lock) return;
      if(e.pointerType==="mouse"&&e.button!==0) return;
      const r=btn.getBoundingClientRect();
      st={x:e.clientX,y:e.clientY,rect:r,ghost:null,moved:false,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,id:e.pointerId};
      btn.setPointerCapture(e.pointerId);
      Sound.pick();
      e.preventDefault();
    });
    btn.addEventListener("pointermove",e=>{
      if(!st) return;
      const dx=e.clientX-st.x, dy=e.clientY-st.y;
      if(!st.moved&&Math.abs(dx)+Math.abs(dy)>7){
        st.moved=true;
        const g=document.createElement("div");
        g.className="ghost-card";
        g.textContent=btn.dataset.val;
        g.style.width=st.rect.width+"px"; g.style.height=st.rect.height+"px";
        g.style.left=(e.clientX-st.offsetX)+"px"; g.style.top=(e.clientY-st.offsetY)+"px";
        document.body.appendChild(g);
        st.ghost=g;
        btn.classList.add("drag-src");
      }
      if(st.ghost){
        st.ghost.style.left=(e.clientX-st.offsetX)+"px";
        st.ghost.style.top=(e.clientY-st.offsetY)+"px";
        const sr=slot?slot.getBoundingClientRect():null;
        const over=sr&&e.clientX>=sr.left&&e.clientX<=sr.right&&e.clientY>=sr.top&&e.clientY<=sr.bottom;
        if(slot) slot.classList.toggle("over",!!over);
      }
    });
    const end=e=>{
      if(!st) return;
      let over=false;
      if(slot&&st.moved){
        const sr=slot.getBoundingClientRect();
        over=e.clientX>=sr.left&&e.clientX<=sr.right&&e.clientY>=sr.top&&e.clientY<=sr.bottom;
      }
      if(st.ghost) st.ghost.remove();
      btn.classList.remove("drag-src");
      if(slot) slot.classList.remove("over");
      const tapped=!st.moved;
      st=null;
      if(tapped||over) choose(btn.dataset.val,btn);
    };
    btn.addEventListener("pointerup",end);
    btn.addEventListener("pointercancel",()=>{
      if(st&&st.ghost) st.ghost.remove();
      btn.classList.remove("drag-src");
      if(slot) slot.classList.remove("over");
      st=null;
    });
    btn.addEventListener("click",e=>{ if(e.detail===0) choose(btn.dataset.val,btn); });
  });
}

function choose(val,btn){
  if(!G||G.lock) return;
  const q=currentQ();
  if(!q||!btn) return;
  if(val===q.answer){
    G.lock=true; G.chosen=val;
    btn.classList.add("correct");
    const m=document.createElement("span"); m.className="mark"; m.textContent="✓"; btn.appendChild(m);
    $$("#options .opt").forEach(x=>{x.disabled=true;});
    if(G.mode==="match"){
      const slot=$("#dropSlot");
      if(slot){slot.textContent=q.answer;slot.classList.add("filled");}
    }else{
      const blank=$("#blank");
      if(blank){blank.textContent=q.answer;blank.classList.add("filled");}
    }
    Sound.correct();
    setTimeout(()=>{Sound.star();},260);
    const reason=G.attempts===0?"first":"second";
    setTimeout(()=>showAnswer(reason),760);
  }else{
    G.attempts++;
    G.chosen=val;
    Sound.wrong();
    btn.classList.add("wrong","shake");
    btn.disabled=true;
    setTimeout(()=>btn.classList.remove("shake"),460);
    const hint=$("#matchHint");
    if(hint){
      hint.classList.add("alert");
      hint.textContent=G.mode==="match"?"再看看圖，是一朵一朵的嗎？再試一次。":"讀一讀整句，哪個最順？再試一次。";
    }
    if(G.attempts>=2){
      G.lock=true;
      $$("#options .opt").forEach(x=>{x.disabled=true;});
      setTimeout(()=>showAnswer("reveal"),850);
    }
  }
}

function showAnswer(reason){
  if(!G||G.revealed) return;
  G.revealed=true;
  G.lock=true;
  const q=currentQ();
  const ok=reason==="first";
  const stars=starsForAttempts(reason==="first"?0:reason==="second"?1:2);
  G.stars+=stars;
  G.answers.push({no:q.no,answer:q.answer,stars,ok,attempts:G.attempts,chosen:G.chosen});
  if(!ok) G.wrong.push({...q,chosen:G.chosen,mode:G.mode});
  const icon=ok
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#1B7A63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="#A4551B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v8"/><circle cx="12" cy="18" r="1.2" fill="#A4551B"/></svg>`;
  const follow=(G.mode==="sentence"&&G.version==="senior"&&ok&&q.follow)?`
    <div class="followup" id="followup">
      <h4>說得出理由：${esc(q.follow.q)}<span class="tag" style="margin-left:.4rem">答對 +1 理由星</span></h4>
      <div class="fu-opts" id="fuOpts">
        ${shuffle(q.follow.opts).map(o=>`<button class="fu-opt" data-fu="${esc(o)}" type="button">${esc(o)}</button>`).join("")}
      </div>
      <p class="fu-note" id="fuNote" hidden></p>
    </div>`:"";
  $("#sheet").innerHTML=`
    <div class="sheet-head">
      <span class="verdict ${ok?"":"miss"}">${icon}${ok?"答對了":"一起看看答案"}</span>
      <span class="q-no">第 ${G.index+1} / ${G.queue.length} 題 · ${"★".repeat(stars)}${"☆".repeat(3-stars)}</span>
    </div>
    <div class="answer-big">${esc(q.answer)}</div>
    <p class="answer-sub">${G.mode==="match"?"「"+esc(q.noun)+"」的正確重疊量詞":"填進句子裏的重疊量詞"}${ok?"":"（已試 " + G.attempts + " 次，一齊看答案）"}</p>
    <div class="layer why"><h4><span class="num-badge">1</span>為甚麼</h4><p>${esc(q.why)}</p></div>
    <div class="layer trap"><h4><span class="num-badge">2</span>易錯提醒</h4><p>${esc(q.trap)}</p></div>
    ${follow}
    <div class="sheet-actions">
      <button class="btn ghost" data-act="speak-answer" type="button">聽一次</button>
      <button class="btn primary" data-act="next-q" type="button">${G.index===G.queue.length-1?"看成績":"下一題"} ${arrowSVG}</button>
    </div>`;
  openSheet(false);
  Sound.reveal();
  if(follow) bindFollow();
  setTimeout(()=>{const b=$("#followup")||$("[data-act='next-q']"); if(b) b.focus({preventScroll:true});},120);
}

function bindFollow(){
  const q=currentQ();
  const correct=q.follow.opts[0];
  $$("#fuOpts .fu-opt").forEach(b=>b.addEventListener("click",()=>{
    if(G.followDone) return;
    G.followDone=true;
    const val=b.dataset.fu;
    $$("#fuOpts .fu-opt").forEach(x=>{
      x.disabled=true;
      if(x.dataset.fu===correct) x.classList.add("good");
    });
    const note=$("#fuNote");
    if(val===correct){
      G.reasons++;
      Sound.star();
      if(note){note.hidden=false;note.textContent="＋1 理由星！"+q.follow.note;}
      speak("答對了。"+q.follow.note);
    }else{
      b.classList.add("bad");
      Sound.wrong();
      if(note){note.hidden=false;note.textContent="再想一次："+q.follow.note;}
      speak(q.follow.note);
    }
  }));
}

function nextQuestion(){
  if(!G) return;
  closeSheet();
  G.index++;
  G.attempts=0; G.lock=false; G.revealed=false; G.chosen=null; G.followDone=false;
  if(G.index>=G.queue.length){ finishGame(); return; }
  renderGame($("#view-game"));
  window.scrollTo(0,0);
}
function finishGame(){
  closeSheet();
  const v=G.version, mode=G.mode;
  app.played[v][mode]=G.queue.length;
  app.best[v][mode]=Math.max(app.best[v][mode]||0,G.stars);
  persist();
  Sound.fanfare();
  show("result",false);
  stack=[];
}

function titleFor(stars,mode){
  const reason=mode==="sentence"&&G&&G.version==="senior";
  if(stars>=27) return {name:"量詞大師",line:reason?"每一題都答對，還說得出理由，了不起！":"幾乎每一題都一次答對，眼力和語感都很好！",mood:"cheer"};
  if(stars>=19) return {name:"量詞小達人",line:"配對和語境都掌握了，再練一次就滿分。",mood:"happy"};
  return {name:"量詞學徒",line:"看完每題的解釋，再玩一次一定進步。",mood:"think"};
}

function renderResult(el){
  if(!G){ show("modes",false); return; }
  const t=titleFor(G.stars,G.mode);
  const total=G.queue.length*3;
  const okCount=G.answers.filter(a=>a.ok).length;
  const mins=Math.max(1,Math.round((Date.now()-G.startedAt)/60000));
  const modeName=G.mode==="match"?"配一配":"句子偵探";
  el.innerHTML=`
  <div class="card" style="padding:1rem">
    <div class="result-hero">
      <div class="r-mascot">${mascot(t.mood)}</div>
      <span class="kicker">${DATA[G.version].label} · ${modeName}</span>
      <div class="r-title">${t.name}</div>
      <div class="r-stars">${starSVG("#FFC94A")}<span>${G.stars}</span><span style="font-size:1rem;color:var(--ink-soft)">/ ${total}</span></div>
      <p class="page-sub" style="text-align:center">${t.line}</p>
      <div class="result-grid">
        <div><b>${okCount}/10</b><span>一次答對</span></div>
        <div><b>${G.wrong.length}</b><span>要看解析</span></div>
        <div><b>${G.reasons}</b><span>理由星</span></div>
      </div>
      <p class="small">本輪用時約 ${mins} 分鐘 · 進度已儲存在本機</p>
    </div>
  </div>
  <div class="result-actions">
    <button class="btn primary" data-act="again" type="button">再玩一次</button>
    <button class="btn" data-act="go" data-view="modes" type="button">換一種模式</button>
    ${G.wrong.length?`<button class="btn" data-act="go" data-view="report" type="button">看錯題報告</button>`:`<button class="btn" data-act="go" data-view="guide" type="button">看量詞圖鑑</button>`}
    <button class="btn" data-act="home" type="button">回主選單</button>
  </div>
  <p class="small" style="margin-top:1rem;text-align:center">星星只加不減：答錯不扣星，看完解釋也算完成。</p>`;
}

function renderReport(el){
  if(!G){ el.innerHTML=`<p class="page-sub">還沒有本輪紀錄。先玩一輪吧。</p><button class="btn primary" data-act="go" data-view="modes" type="button">去遊戲篇</button>`; return; }
  const modeName=G.mode==="match"?"配一配":"句子偵探";
  el.innerHTML=`
  <span class="kicker">給家長與教師</span>
  <h2 class="page-title" style="margin-top:.25rem">本輪報告</h2>

  ${G.wrong.length?`<div class="wrong-list">
    ${G.wrong.map(w=>`<div class="wrong-item">
      <div class="w-top"><span>第 ${w.no} 題${w.mode==="match"?" · "+esc(w.noun):""}</span><span>當時選了「${esc(w.chosen||"未選")}」</span></div>
      <div class="w-main">正確答案：<em>${esc(w.answer)}</em>　<s>${esc(w.chosen||"")}</s></div>
      ${w.mode==="sentence"?`<p style="color:var(--ink);font-weight:700;margin-bottom:.2rem">${esc(w.sentence)}</p>`:""}
      <p>${esc(w.why)}</p>
      <p style="margin-top:.2rem">${esc(w.trap)}</p>
    </div>`).join("")}
  </div>`:`<div class="card" style="padding:1rem;background:#E9F8F2;border-color:#2FA98C"><p style="font-weight:900">這一輪沒有需要重看的題目。</p><p class="small">可以試試另一種模式，或挑戰高小版。</p></div>`}
  <div class="result-actions">
    <button class="btn primary" data-act="go" data-view="modes" type="button">回到遊戲篇</button>

}

/* ---------- 圖鑑 ---------- */

/* ================= Sheet ================= */
function openSheet(closable){
  const ov=$("#overlay");
  ov.classList.add("show");
  ov.dataset.closable=closable?"1":"0";
  document.body.style.overflow="hidden";
}
function closeSheet(){
  const ov=$("#overlay");
  ov.classList.remove("show");
  ov.dataset.closable="0";
  document.body.style.overflow="";
  $("#sheet").innerHTML="";
}

/* ================= 事件 ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act;
  if(act==="start"){ Sound.unlock(); Sound.tap(); show(app.version?"menu":"version"); }
  else if(act==="set-version"){
    Sound.tap();
    app.version=t.dataset.v; persist(); applyTheme();
    show("menu",false); stack=[];
  }
  else if(act==="go"){ Sound.tap(); show(t.dataset.view); }
  else if(act==="lesson"){ Sound.tap(); openLesson(t.dataset.id); }
  else if(act==="lesson-next"){
    Sound.tap();
    const v=app.version, done=app.lessons[v]||[];
    const idx=DATA[v].lessons.findIndex(l=>l.id===L.les.id);
    const next=DATA[v].lessons[idx+1];
    if(next&&!done.includes(next.id)) openLesson(next.id);
    else show("lessons",false);
  }
  else if(act==="quiz-next"){
    Sound.tap();
    if(L.qi>=2){ markLessonDone(); show("lessons",false); toast("第 4 課已完成，可重溫或去玩遊戲"); }
    else { L.qi++; L.answered=false; renderLesson($("#view-lesson")); }
  }
  else if(act==="start-game"){ Sound.unlock(); startGame(t.dataset.mode); }
  else if(act==="next-q"){ nextQuestion(); }
  else if(act==="speak-answer"){
    const q=currentQ();
    if(q) speak(q.answer+"。"+q.why+q.trap);
  }
  else if(act==="again"){ startGame(G?G.mode:"match"); }
  else if(act==="home"){ home(); }
  else if(act==="close-sheet"){ closeSheet(); }
  else if(act==="speak-word"){
    const v=app.version, d=DATA[v];
    const w=d.words.find(x=>x.zi===t.dataset.wordKey);
    if(w) speak(w.form+"。"+w.ex+"。");
  }
  else if(act==="download"){ downloadSelf(); }
  else if(act==="reset"){ confirmReset(); }
  else if(act==="reset-yes"){
    app.lessons={junior:[],senior:[]};
    app.best={junior:{match:0,sentence:0},senior:{match:0,sentence:0}};
    app.played={junior:{match:0,sentence:0},senior:{match:0,sentence:0}};
    persist(); closeSheet(); toast("學習紀錄已清除"); renderView("info",$("#view-info"));
  }
  else if(act==="reset-no"){ closeSheet(); }
});

$("#btnSound").addEventListener("click",()=>{
  app.sound=!app.sound; persist(); updateChrome();
  if(app.sound){Sound.unlock();Sound.tap();toast("音效已開啟");}
  else toast("音效已靜音");
});
$("#btnBack").addEventListener("click",back);
$("#btnHome").addEventListener("click",home);
$("#btnStart").addEventListener("click",()=>{
  Sound.unlock(); Sound.tap();
  show(app.version?"menu":"version");
  stack=[];
});
$("#overlay").addEventListener("click",e=>{
  if(e.target.id==="overlay"&&$("#overlay").dataset.closable==="1") closeSheet();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#overlay").classList.contains("show")){
    if($("#overlay").dataset.closable==="1") closeSheet();
    return;
  }
  if($("#overlay").classList.contains("show")){
    if(e.key==="Enter"&&!(e.target instanceof HTMLButtonElement)){
      const next=$("[data-act='next-q']");
      if(next){e.preventDefault();next.click();}
    }
    return;
  }
  if(current==="game"&&G&&!G.lock&&!G.revealed&&/^[1-3]$/.test(e.key)){
    const opts=$$("#options .opt:not(:disabled)");
    const b=opts[+e.key-1];
    if(b){e.preventDefault();b.click();}
  }
});

function confirmReset(){
  $("#sheet").innerHTML=`
    <div class="sheet-head"><span class="verdict miss">清除紀錄</span></div>
    <h3 style="font-size:1.2rem;font-weight:900;margin:.4rem 0">確定要清除學習進度嗎？</h3>
    <p class="page-sub">四課的完成印章、兩種模式的最佳星星都會歸零。題庫與設定不受影響。</p>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="reset-no" type="button">先不清除</button>
      <button class="btn primary" data-act="reset-yes" type="button">確定清除</button>
    </div>`;
  openSheet(true);
}

function downloadSelf(){
  try{
    const blob=new Blob([SOURCE_HTML],{type:"text/html;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="量詞大冒險.html";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    toast("已開始下載，可離線使用");
    Sound.tap();
  }catch(e){ toast("此瀏覽器不支援直接下載，請用「另存新檔」"); }
}

/* ================= 啟動 ================= */
function init(){
  $("#splashMascot").innerHTML=mascot("happy");
  applyTheme();
  updateChrome();
  show(app.version?"menu":"splash",false);
  if(app.version) stack=[];
  // 首次互動解鎖音效
  const unlock=()=>{Sound.unlock();document.removeEventListener("pointerdown",unlock);};
  document.addEventListener("pointerdown",unlock);
}
init();

</script>
