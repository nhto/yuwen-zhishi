<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>詞語冒險島｜小學介詞‧連詞互動遊戲</title>
<meta name="description" content="八座詞語島嶼、八種互動玩法、64 道題目，讓香港小學生先看懂、再玩會介詞與連詞。">
<style>
:root{
  --ink:#22324a;
  --ink2:#52647d;
  --paper:#fffdf8;
  --line:rgba(34,50,74,.13);
  --shadow:0 12px 0 rgba(34,50,74,.06), 0 22px 46px rgba(52,104,140,.16);
  --font:"Noto Sans HK","Source Han Sans HK","Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --c:#4a9df0;
  --soft:#e7f4ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 6%, rgba(255,238,178,.55) 0 12%, transparent 13%),
    radial-gradient(circle at 92% 2%, rgba(198,236,255,.8) 0 16%, transparent 17%),
    linear-gradient(180deg,#e9f8ff 0%,#f7fcff 38%,#fff9ec 100%);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:4px solid #ffb02e;outline-offset:3px}
[hidden]{display:none!important}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,22px) 48px}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 2px 10px;
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(233,248,255,.98),rgba(233,248,255,.82) 68%,rgba(233,248,255,0));
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:clamp(18px,2.2vw,24px);letter-spacing:.02em;color:#1c3e63}
.brand .mini{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto}
.brand .mini svg{width:100%;height:100%}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;border:2px solid rgba(34,50,74,.12);
  background:#fff;color:#2f4a68;display:grid;place-items:center;cursor:pointer;
  font-size:22px;box-shadow:0 4px 0 rgba(34,50,74,.07);
  transition:transform .15s,box-shadow .15s;
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(34,50,74,.08)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(34,50,74,.08)}
.icon-btn .ic{width:24px;height:24px}

/* ---------- shared ---------- */
.screen{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{
  border:0;border-radius:18px;font-weight:900;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:12px 22px;font-size:18px;line-height:1.2;
  transition:transform .14s,box-shadow .14s,filter .14s;
  text-decoration:none;
}
.btn:active{transform:translateY(3px)}
.btn.primary{background:linear-gradient(180deg,#ffd45e,#ffae2e);color:#4a2b00;box-shadow:0 6px 0 #d98d16,0 12px 22px rgba(217,141,22,.26)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.primary:active{box-shadow:0 2px 0 #d98d16}
.btn.blue{background:linear-gradient(180deg,#79c8ff,#44a5ef);color:#fff;box-shadow:0 6px 0 #2d7fbd,0 12px 22px rgba(45,127,189,.25)}
.btn.blue:active{box-shadow:0 2px 0 #2d7fbd}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid rgba(34,50,74,.14);box-shadow:0 5px 0 rgba(34,50,74,.08)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(34,50,74,.08)}
.btn.small{min-height:44px;font-size:16px;padding:8px 14px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.cat-pill{
  display:inline-flex;align-items:center;gap:8px;font-weight:900;
  background:var(--soft);color:var(--c);border:2px solid rgba(255,255,255,.9);
  padding:8px 14px;border-radius:99px;font-size:clamp(14px,1.5vw,17px);white-space:nowrap;
}
.cat-pill .ic{width:19px;height:19px}

/* ---------- home ---------- */
.hero{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:1.18fr .82fr;gap:18px;align-items:center;
  background:linear-gradient(135deg,#ffffff 0%,#fff8e5 100%);
  border:3px solid #fff;border-radius:34px;
  padding:clamp(20px,4vw,40px);
  box-shadow:0 22px 54px rgba(64,120,160,.17);
}
.hero:after{
  content:"";position:absolute;left:-10%;right:-10%;bottom:-88px;height:150px;
  background:radial-gradient(ellipse at 50% 0,#cdeeff 0 60%,transparent 61%);
  opacity:.8;pointer-events:none;
}
.hero-copy{position:relative;z-index:2}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:clamp(12px,1.4vw,15px);font-weight:900;letter-spacing:.12em;
  color:#2b7cae;background:#e3f5ff;padding:7px 13px;border-radius:99px;
}
.hero h1{
  font-size:clamp(38px,6.2vw,72px);line-height:1.02;margin:12px 0 12px;
  color:#173f68;letter-spacing:.03em;
  text-shadow:0 3px 0 #fff,0 7px 0 rgba(96,176,224,.16);
}
.hero p{margin:0;font-size:clamp(16px,1.9vw,21px);line-height:1.7;color:var(--ink2);font-weight:600;max-width:34em}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat{
  background:#fff;border:2px solid rgba(34,50,74,.1);border-radius:16px;
  padding:9px 14px;font-weight:900;font-size:clamp(13px,1.5vw,16px);color:#2d4d70;
  box-shadow:0 4px 0 rgba(34,50,74,.05);
}
.stat b{color:#e08a00;font-size:1.18em}
.hero-art{position:relative;height:clamp(200px,25vw,280px);z-index:1}
.hero-mascot{position:absolute;filter:drop-shadow(0 10px 14px rgba(30,80,120,.18))}
.hero-mascot.m1{width:56%;left:2%;bottom:0;animation:float 3.6s ease-in-out infinite}
.hero-mascot.m2{width:46%;right:2%;bottom:12%;animation:float 4.2s ease-in-out .5s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.hero-bubble{
  position:absolute;background:#fff;border:3px solid #d8ecfa;border-radius:18px;
  padding:7px 12px;font-weight:900;color:#2b6f9e;font-size:clamp(14px,1.7vw,19px);
  box-shadow:0 6px 0 rgba(34,50,74,.06);
}
.hero-bubble.b1{top:6%;right:2%;transform:rotate(4deg)}
.hero-bubble.b2{bottom:8%;left:0;transform:rotate(-5deg);color:#b25c22;border-color:#ffe0c2}

.map-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:34px 4px 14px}
.map-title{font-size:clamp(24px,3.2vw,36px);margin:0;letter-spacing:.02em}
.map-title small{display:block;font-size:clamp(13px,1.4vw,16px);color:var(--ink2);font-weight:700;letter-spacing:0;margin-top:4px}
.progress-box{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;color:#37567a}
.pbar{width:min(300px,48vw);height:14px;border-radius:99px;background:#d9e9f5;overflow:hidden;box-shadow:inset 0 2px 4px rgba(34,50,74,.08)}
.pbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd45e,#ff9f43);border-radius:99px;transition:width .5s ease}

.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.island{
  --c:#4a9df0;--soft:#e7f4ff;
  background:#fff;border:3px solid #fff;border-radius:26px;padding:17px;
  box-shadow:0 12px 28px rgba(64,120,160,.13);
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s;
}
.island:hover{transform:translateY(-4px);box-shadow:0 18px 34px rgba(64,120,160,.19)}
.island:before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff))}
.island-top{display:flex;align-items:center;gap:11px;margin-top:4px}
.island-icon{
  width:58px;height:58px;border-radius:20px;background:var(--soft);color:var(--c);
  display:grid;place-items:center;flex:0 0 auto;
}
.island-icon .ic{width:33px;height:33px;stroke-width:1.9}
.island h3{margin:0;font-size:clamp(19px,2vw,23px);line-height:1.15;letter-spacing:.01em}
.mode-tag{display:inline-block;font-size:12.5px;font-weight:900;color:var(--c);background:var(--soft);padding:4px 10px;border-radius:99px;margin-top:5px}
.island .mode-name{margin:0;font-size:15px;font-weight:800;color:var(--ink2);line-height:1.4}
.stars{font-size:21px;letter-spacing:3px;color:#f0b429;line-height:1}
.island-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.island-actions .btn{flex:1;min-height:46px;font-size:15.5px;padding:8px 8px;border-radius:14px}
.island-actions .btn.ghost{flex:0 0 auto;padding:8px 11px;color:#a1521f;border-color:#ffd9bd}
.home-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 4px 0;color:#6a7f97;font-size:14px;font-weight:700}
.home-foot .note{display:flex;align-items:center;gap:7px}
.home-foot .ic{width:18px;height:18px}

/* ---------- teach ---------- */
.teach-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.teach-head .dots{margin-left:auto;margin-right:auto}
.teach-card{
  display:grid;grid-template-columns:1.02fr .98fr;
  background:#fff;border:3px solid #fff;border-radius:32px;overflow:hidden;
  box-shadow:var(--shadow);
}
.teach-art{
  position:relative;min-height:390px;overflow:hidden;
  background:linear-gradient(180deg,var(--soft) 0%,#f7fcff 62%,#e8f8dc 100%);
  display:grid;place-items:center;
}
.art-sun{position:absolute;top:8%;right:9%;width:clamp(48px,7vw,76px);height:clamp(48px,7vw,76px);border-radius:50%;background:#ffe08a;box-shadow:0 0 0 14px rgba(255,224,138,.32)}
.art-cloud{position:absolute;background:#fff;border-radius:99px;opacity:.92}
.art-cloud:before,.art-cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.art-cloud.a{width:88px;height:28px;top:13%;left:8%}
.art-cloud.a:before{width:38px;height:38px;left:12px;top:-17px}
.art-cloud.a:after{width:28px;height:28px;right:12px;top:-11px}
.art-cloud.b{width:64px;height:22px;top:31%;right:18%;opacity:.75}
.art-cloud.b:before{width:28px;height:28px;left:10px;top:-13px}
.art-cloud.b:after{width:20px;height:20px;right:9px;top:-8px}
.art-hill{position:absolute;left:-8%;right:-8%;bottom:26%;height:34%;background:#cbeec0;border-radius:50% 50% 0 0/70% 70% 0 0;opacity:.75}
.art-island{position:absolute;left:-10%;right:-10%;bottom:-16%;height:42%;background:linear-gradient(180deg,#b9e6a6,#7cc96b);border-radius:50% 50% 0 0/66% 66% 0 0}
.art-mascot{position:absolute;bottom:9%;left:5%;width:clamp(82px,12vw,124px);z-index:4;filter:drop-shadow(0 8px 10px rgba(30,80,120,.14));animation:float 3.8s ease-in-out infinite}
.art-center{position:relative;z-index:3;display:grid;place-items:center;width:100%;padding:0 10%}
.art-badge{
  width:clamp(132px,19vw,190px);height:clamp(132px,19vw,190px);border-radius:46px;
  background:#fff;display:grid;place-items:center;color:var(--c);
  box-shadow:0 16px 0 rgba(34,50,74,.07),0 24px 40px rgba(52,104,140,.16);
  border:5px solid rgba(255,255,255,.9);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;
}
.art-badge .ic{width:56%;height:56%;stroke-width:1.7}
@keyframes pop{from{transform:scale(.82)}to{transform:scale(1)}}
.art-speech{
  background:#fff;border:4px solid #fff;border-radius:26px;padding:20px 20px 18px;
  box-shadow:0 14px 0 rgba(34,50,74,.07),0 22px 36px rgba(52,104,140,.15);
  font-size:clamp(17px,2.1vw,25px);font-weight:800;line-height:1.65;text-align:center;color:#2d4d70;
  max-width:92%;position:relative;
}
.art-speech:after{
  content:"";position:absolute;left:16%;bottom:-16px;width:26px;height:26px;background:#fff;
  transform:rotate(45deg);border-radius:5px;
}
.art-speech b{color:var(--c);background:var(--soft);padding:1px 7px;border-radius:7px}
.art-scroll{
  background:linear-gradient(180deg,#fffdf3,#fff2c9);border:4px dashed #e8bf45;border-radius:24px;
  padding:18px 20px;max-width:92%;box-shadow:0 12px 0 rgba(34,50,74,.06);text-align:center;
}
.art-scroll span{font-size:13px;font-weight:900;letter-spacing:.2em;color:#a97a0b}
.art-scroll p{margin:6px 0 0;font-size:clamp(17px,2vw,24px);font-weight:900;line-height:1.6;color:#5a4200}
.art-spark{position:absolute;font-size:26px;color:#ffd35e;z-index:2;animation:twinkle 2.2s ease-in-out infinite}
.art-spark.s1{top:20%;left:16%}
.art-spark.s2{top:36%;right:9%;animation-delay:.6s;color:#fff;text-shadow:0 0 0 #fff}
.art-spark.s3{bottom:24%;right:22%;animation-delay:1.1s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

.teach-body{padding:clamp(20px,3.2vw,42px);display:flex;flex-direction:column;min-width:0}
.teach-kicker{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--c)}
.teach-body h2{font-size:clamp(26px,3.6vw,42px);margin:6px 0 12px;line-height:1.2;letter-spacing:.02em}
.def{font-size:clamp(19px,2.2vw,29px);line-height:1.58;font-weight:800;margin:0 0 18px;color:#2a4563}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.word-chip{
  min-height:54px;border-radius:15px;border:2px solid var(--soft);background:var(--soft);
  color:var(--c);font-size:clamp(18px,2vw,23px);font-weight:900;cursor:pointer;
  transition:transform .14s,box-shadow .14s,background .14s;
}
.word-chip:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(34,50,74,.08);background:#fff}
.word-chip:active{transform:translateY(1px)}
.word-ex{
  margin-top:14px;background:#f7fbff;border:2px solid rgba(34,50,74,.1);border-radius:16px;
  padding:13px 16px;font-size:clamp(15px,1.7vw,18px);line-height:1.65;color:#3c5675;font-weight:650;min-height:58px;
}
.word-ex b{color:var(--c)}
.example{background:#f8fbff;border:2px solid rgba(34,50,74,.1);border-radius:20px;padding:16px 18px;margin-bottom:13px}
.example .sentence{font-size:clamp(18px,2vw,26px);line-height:1.8;font-weight:800;margin:0}
.example .note{font-size:clamp(14px,1.5vw,17px);color:var(--ink2);margin:8px 0 0;line-height:1.6;font-weight:650}
.example-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.example-head .tag{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--c);background:var(--soft);padding:3px 9px;border-radius:99px}
.speak-btn{
  width:40px;height:40px;border-radius:12px;border:2px solid rgba(34,50,74,.12);background:#fff;
  color:#2f6f9e;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto;
}
.speak-btn .ic{width:20px;height:20px}
.speak-btn:active{transform:scale(.95)}
mark{background:#ffef9f;color:inherit;padding:0 5px;border-radius:6px;box-shadow:0 2px 0 #eed35a}
.chant .speak-btn{vertical-align:middle;margin-left:8px;background:rgba(255,255,255,.75)}
.chant{
  font-size:clamp(20px,2.5vw,33px);line-height:1.7;font-weight:900;
  background:linear-gradient(180deg,#fff8dd,#ffe9a5);border-radius:20px;padding:18px 20px;
  border:2px dashed #e8bf45;color:#5a4200;margin-bottom:14px;
}
.mistake{border-radius:18px;background:#fff7f5;border:2px solid #ffd9d1;padding:14px 16px;margin-bottom:12px}
.mistake .row{display:flex;gap:10px;align-items:flex-start;font-size:clamp(15px,1.7vw,19px);line-height:1.55;margin:6px 0;font-weight:750}
.mistake .icon-x{color:#c2453d;font-weight:900;font-size:1.2em;line-height:1.2}
.mistake .icon-o{color:#1f7f58;font-weight:900;font-size:1.2em;line-height:1.2}
.mistake .bad{color:#a83a34;text-decoration:line-through;text-decoration-thickness:2px}
.mistake .good{color:#176b49}
.mistake .why{margin:8px 0 0;font-size:clamp(13px,1.5vw,16px);color:#7a5a55;line-height:1.6;font-weight:650}
.demo-line{display:flex;gap:10px;align-items:center;background:#eef9f3;border:2px solid #ccebdc;border-radius:16px;padding:12px 15px;font-size:clamp(14px,1.6vw,18px);font-weight:750;color:#26604a;line-height:1.5}
.demo-line .ic{width:22px;height:22px;flex:0 0 auto}
.teach-nav{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#c9dbe9;transition:.25s}
.dot.on{background:var(--c);width:28px;border-radius:99px}
.teach-cta{margin-top:14px}
.teach-cta .btn{width:100%;min-height:60px;font-size:clamp(18px,2vw,22px)}

/* ---------- game ---------- */
.game-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.q-progress{flex:1;min-width:120px;height:12px;background:#d9e9f5;border-radius:99px;overflow:hidden}
.q-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#ffe08a));border-radius:99px;transition:width .4s}
.q-count{font-weight:900;font-size:15px;white-space:nowrap;color:#37567a}
.q-card{
  background:#fff;border:3px solid #fff;border-radius:32px;
  padding:clamp(16px,3vw,36px);box-shadow:var(--shadow);
}
.stem-tools{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.q-kicker{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--c);background:var(--soft);padding:5px 11px;border-radius:99px}
.q-stem{
  font-size:clamp(23px,3.5vw,50px);line-height:1.55;font-weight:900;text-align:center;
  margin:6px auto 14px;max-width:22em;letter-spacing:.01em;color:#1f3551;
}
.q-stem .blank{display:inline-block;min-width:2.2em;border-bottom:6px solid var(--c);color:var(--c);text-align:center;line-height:1.2}
.q-stem .fill{display:inline-block;color:#147a53;border-bottom:6px solid #7bd3ae;text-align:center;animation:pop .35s cubic-bezier(.2,1.5,.4,1) both}
.hint-bar{
  display:flex;align-items:flex-start;gap:9px;background:#fff8e8;border:2px dashed #f0c873;
  border-radius:14px;padding:11px 14px;margin:0 auto 12px;max-width:760px;
  font-size:clamp(14px,1.6vw,17px);font-weight:750;color:#775512;line-height:1.55;
}
.hint-bar .ic{width:21px;height:21px;flex:0 0 auto;margin-top:1px}
.mode-inst{text-align:center;font-size:clamp(14px,1.6vw,17px);color:var(--ink2);font-weight:700;margin:4px 0 14px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px}
.opt-btn{
  min-height:66px;padding:12px 14px;border-radius:19px;border:3px solid #dbe7f2;
  background:#fff;color:#213950;font-size:clamp(19px,2.1vw,27px);font-weight:900;
  cursor:pointer;box-shadow:0 5px 0 #dbe7f2;transition:transform .12s,box-shadow .12s,border-color .12s;
}
.opt-btn:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,#dbe7f2)}
.opt-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe7f2}
.opt-btn.right{border-color:#43b581;background:#ecfbf3;box-shadow:0 5px 0 #9ad9ba;color:#126a45}
.opt-btn.wrong{border-color:#e06a5e;background:#fff1ef;animation:shake .45s}
.opt-btn:disabled{cursor:default;opacity:.6}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* mode: fangwei */
.scene{
  position:relative;width:100%;max-width:840px;margin:0 auto;height:clamp(270px,38vw,410px);
  border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#d9f1ff 0%,#effbff 58%,#dff5cd 59%,#c8eab1 100%);
  border:3px solid #eaf6ff;
}
.scene-sun{position:absolute;top:7%;right:8%;width:58px;height:58px;border-radius:50%;background:#ffe08a;box-shadow:0 0 0 12px rgba(255,224,138,.3)}
.scene-cloud{position:absolute;background:#fff;border-radius:99px;opacity:.95}
.scene-cloud:before,.scene-cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.scene-cloud.a{width:78px;height:24px;top:10%;left:9%}
.scene-cloud.a:before{width:34px;height:34px;left:10px;top:-15px}
.scene-cloud.a:after{width:24px;height:24px;right:10px;top:-9px}
.scene-cloud.b{width:56px;height:18px;top:26%;right:20%;opacity:.7}
.scene-cloud.b:before{width:24px;height:24px;left:9px;top:-11px}
.scene-cloud.b:after{width:17px;height:17px;right:8px;top:-7px}
.scene-ground{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(164,220,126,.55) 30%,#a7da83 100%)}
.scene-obj{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;color:#6b4a2f;z-index:1;
}
.scene-obj .ic{width:clamp(76px,10.5vw,104px);height:clamp(76px,10.5vw,104px);stroke-width:1.5}
.scene-caption{position:absolute;left:12px;top:12px;z-index:6;background:rgba(255,255,255,.92);color:#42596c;font-size:clamp(13px,1.5vw,16px);font-weight:900;padding:4px 11px;border-radius:99px;border:2px solid rgba(34,50,74,.08);box-shadow:0 3px 0 rgba(34,50,74,.05)}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:transparent;border:0;cursor:pointer;min-width:64px;min-height:64px;
  padding:2px;
}
.hot-dot{
  width:clamp(46px,6.4vw,58px);height:clamp(46px,6.4vw,58px);border-radius:50%;
  background:rgba(255,255,255,.92);border:4px dashed var(--c);
  box-shadow:0 6px 0 rgba(34,50,74,.08);display:block;position:relative;
  animation:pulse 2.4s ease-in-out infinite;
}
.hot-dot:after{content:"";position:absolute;inset:28%;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,#fff)}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(34,50,74,.08),0 0 0 0 color-mix(in srgb,var(--c) 30%,transparent)}50%{box-shadow:0 6px 0 rgba(34,50,74,.08),0 0 0 10px transparent}}
.hot-label{
  font-size:clamp(17px,2.1vw,24px);font-weight:900;color:#20415f;background:#fff;
  border:2px solid rgba(34,50,74,.12);padding:2px 10px;border-radius:10px;box-shadow:0 3px 0 rgba(34,50,74,.08);
}
.hotspot.right .hot-dot{border-style:solid;border-color:#43b581;background:#e9fbf2}
.hotspot.wrong{animation:shake .45s}
.hotspot.wrong .hot-dot{border-color:#e06a5e}
.bear{
  position:absolute;left:50%;top:48%;width:clamp(54px,7.6vw,74px);z-index:4;
  transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;
  transition:top .55s cubic-bezier(.2,1.3,.4,1),left .55s cubic-bezier(.2,1.3,.4,1),opacity .25s,transform .35s;
}
.bear.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* mode: shijian */
.train-wrap{position:relative;padding:6px 0 4px;overflow:hidden}
.timeline{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto 6px;font-size:13px;font-weight:900;color:#7a5a2a}
.timeline i{flex:1;height:4px;border-radius:99px;background:repeating-linear-gradient(90deg,#e8c37a 0 10px,transparent 10px 18px)}
.train{position:relative;width:min(100%,520px);margin:0 auto;aspect-ratio:420/190;transition:transform 1.15s cubic-bezier(.4,0,.2,1)}
.train.go{transform:translateX(16%)}
.train svg{width:100%;height:100%;display:block}
.train-slot{
  position:absolute;left:9.5%;top:34%;width:23%;height:27%;
  border-radius:12px;border:3px dashed #2d6f9e;background:rgba(255,255,255,.92);
  font-size:clamp(18px,2.2vw,26px);font-weight:900;color:#2d6f9e;cursor:pointer;z-index:2;
  display:grid;place-items:center;padding:0;box-shadow:0 4px 0 rgba(34,50,74,.1);
}
.train-slot.filled{border-style:solid;border-color:#43b581;color:#126a45;background:#ecfbf3}
.train-slot.shake{animation:shake .45s}
.ticket-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;max-width:600px;margin:12px auto 0}
.ticket{
  min-height:58px;border-radius:14px;border:3px solid #e6c78f;background:linear-gradient(180deg,#fffdf2,#fff3cf);
  color:#6b4a12;font-size:clamp(19px,2.2vw,25px);font-weight:900;cursor:grab;
  box-shadow:0 5px 0 #e0c184;position:relative;
}
.ticket:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:repeating-linear-gradient(180deg,#e6c78f 0 4px,transparent 4px 8px)}
.ticket.selected{outline:4px solid #ffb02e;outline-offset:2px;transform:translateY(-3px)}
.ticket.right{border-color:#43b581;background:#ecfbf3;color:#126a45;box-shadow:0 5px 0 #9ad9ba}
.ticket:disabled{opacity:.6}

/* mode: duixiang */
.match-wrap{position:relative;display:grid;grid-template-columns:1fr 108px;gap:clamp(38px,7vw,76px);margin:2px 0 14px}
.match-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.match-col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
.match-col.words{justify-content:center}
.match-sentence{
  display:flex;align-items:center;gap:9px;text-align:left;
  min-height:62px;border-radius:16px;border:3px solid #dbe7f2;background:#fff;
  padding:9px 12px;font-size:clamp(15px,1.7vw,20px);font-weight:750;color:#213950;
  cursor:pointer;box-shadow:0 4px 0 #e7eff6;line-height:1.5;
}
.match-sentence.selected{border-color:var(--c);background:var(--soft);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 35%,#e7eff6)}
.ms-num{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--c);display:grid;place-items:center;font-size:14px;font-weight:900;flex:0 0 auto}
.ms-slot{display:inline-block;min-width:2.4em;text-align:center;border-bottom:3px dashed var(--c);color:var(--c);font-weight:900;padding:0 3px}
.ms-slot.filled{border-bottom-style:solid;color:#126a45;border-color:#43b581}
.match-word{
  min-height:62px;border-radius:16px;border:3px solid #d8c9f5;background:linear-gradient(180deg,#fff,#f6f1ff);
  color:#5b3ca6;font-size:clamp(20px,2.3vw,28px);font-weight:900;cursor:pointer;
  box-shadow:0 4px 0 #d8c9f5;
}
.match-word.selected{outline:4px solid #ffb02e;outline-offset:2px}
.match-word.used{opacity:.38}
.match-word:active{transform:translateY(3px);box-shadow:0 1px 0 #d8c9f5}
.match-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.match-foot .btn{min-width:150px}

/* mode: quxiang */
.maze-wrap{position:relative;max-width:520px;margin:0 auto 10px}
.maze{width:100%;height:auto;display:block;border-radius:24px;background:#eef9f3;border:3px solid #d8f0e5}
.maze-goal{
  position:absolute;top:-4px;left:50%;transform:translate(-50%,-50%);
  background:#fff;border:2px solid #cfe9dc;border-radius:99px;padding:5px 14px;
  font-size:14px;font-weight:900;color:#2b6b55;white-space:nowrap;box-shadow:0 3px 0 rgba(34,50,74,.07);
}
.maze-goal b{color:#0f7a57}
.dir-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;max-width:620px;margin:0 auto}
.dir-btn{
  min-height:64px;border-radius:18px;border:3px solid #cfe9df;background:#fff;
  color:#1c5e4c;font-size:clamp(19px,2.1vw,26px);font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 #d9efe6;
}
.dir-btn .ic{width:24px;height:24px;transform:rotate(0)}
.dir-btn.wrong{animation:shake .45s;border-color:#e06a5e}
.dir-btn.right{border-color:#43b581;background:#ecfbf3;color:#126a45;box-shadow:0 5px 0 #9ad9ba}

/* mode: binglie */
.block-sentence{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:clamp(22px,3vw,38px);font-weight:900;line-height:1.7;
  background:#fffaf0;border:3px dashed #efc98b;border-radius:22px;
  padding:clamp(16px,3vw,26px);margin-bottom:14px;text-align:center;
}
.block-slot{
  min-width:2.1em;min-height:1.55em;border-radius:10px;border:3px dashed #d9a44f;
  background:#fff;color:#b57614;font-size:.8em;font-weight:900;cursor:pointer;padding:0 8px;
}
.block-slot.filled{border-style:solid;border-color:#43b581;background:#ecfbf3;color:#126a45}
.block-slot.selected{outline:4px solid #ffb02e;outline-offset:2px}
.blocks{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-bottom:16px}
.block{
  min-width:86px;min-height:62px;padding:10px 18px;border-radius:14px;
  border:3px solid #e6c78f;background:linear-gradient(180deg,#fffdf4,#ffeec6);
  color:#6b4a12;font-size:clamp(20px,2.3vw,28px);font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 #dfc084;
}
.block:active{transform:translateY(3px);box-shadow:0 1px 0 #dfc084}
.block-sentence.shake{animation:shake .45s}
.block.used{opacity:.3;pointer-events:none}

/* mode: zhuanzhe */
.balance-wrap{display:grid;place-items:center;padding:2px 0 8px}
.balance{position:relative;width:min(100%,580px);height:clamp(290px,34vw,320px)}
.beam{
  position:absolute;left:2%;right:2%;top:64px;height:12px;border-radius:99px;z-index:1;
  background:linear-gradient(180deg,#d7ac6c,#b9853f);transform:rotate(-9deg);
  transform-origin:center;transition:transform .65s cubic-bezier(.2,1.3,.4,1);
  box-shadow:0 4px 0 rgba(90,60,20,.18);
}
.beam.level{transform:rotate(0)}
.beam.tilt{transform:rotate(-17deg)}
.beam:after{content:"";position:absolute;left:50%;top:-6px;width:30px;height:24px;background:#8a5b25;border-radius:8px;transform:translateX(-50%)}
.pan{
  position:absolute;top:112px;width:45%;min-height:104px;z-index:2;
  background:#fff;border:3px solid #e6d3b4;border-radius:18px;padding:10px 12px;
  box-shadow:0 8px 0 rgba(34,50,74,.06);display:flex;flex-direction:column;gap:4px;justify-content:center;
}
.pan.left{left:2%}
.pan.right{right:2%}
.pan:before{content:"";position:absolute;top:-18px;left:50%;width:3px;height:18px;background:#b9853f;transform:translateX(-50%)}
.pan-label{font-size:11px;font-weight:900;letter-spacing:.1em;color:#a88757}
.pan p{margin:0;font-size:clamp(15px,1.7vw,20px);font-weight:800;line-height:1.5;color:#31465f}
.pan.glow{border-color:#7bd3ae;background:#f0fdf7}
.pivot{
  position:absolute;left:50%;top:52px;transform:translateX(-50%);
  min-width:96px;min-height:50px;padding:6px 12px;border-radius:14px;
  background:#fff8e8;border:3px solid #e8bf45;color:#8a5f05;font-weight:900;
  display:grid;place-items:center;font-size:clamp(16px,1.9vw,21px);z-index:3;
  box-shadow:0 5px 0 rgba(183,133,20,.25);
}
.pivot.filled{border-color:#43b581;background:#ecfbf3;color:#126a45}
.balance-stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:12px;height:104px;background:linear-gradient(180deg,#c99a5b,#9b6b2e);border-radius:6px}
.balance-stand:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:150px;height:14px;border-radius:99px;background:#9b6b2e}
.option-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;max-width:700px;margin:0 auto}
.rel-card{
  min-height:64px;border-radius:18px;border:3px solid #f0d2a4;background:linear-gradient(180deg,#fffdf6,#ffeed0);
  color:#7a5412;font-size:clamp(19px,2.1vw,26px);font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 #e7c793;padding:8px 12px;
}
.rel-card.long{font-size:clamp(16px,1.7vw,21px)}
.rel-card:active{transform:translateY(3px);box-shadow:0 1px 0 #e7c793}

/* mode: yinguo */
.gear-scene{display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,2vw,26px);margin:4px 0 12px}
.gear-unit{width:min(30%,190px);display:flex;flex-direction:column;align-items:center;gap:4px}
.gear-big{width:100%;aspect-ratio:1;color:#4a9df0;max-width:150px}
.gear-big svg{width:100%;height:100%;display:block;transition:transform .4s}
.gear-unit.result .gear-big{color:#ef8a62}
.gear-tag{font-size:12px;font-weight:900;letter-spacing:.14em;color:#6b7f95;background:#eef4fa;padding:3px 10px;border-radius:99px}
.gear-text{margin:0;text-align:center;font-size:clamp(14px,1.7vw,19px);font-weight:800;line-height:1.45;color:#2f4763;min-height:2.8em}
.gear-slot{
  width:clamp(74px,10vw,96px);aspect-ratio:1;flex:0 0 auto;margin-top:8%;
  border-radius:50%;border:4px dashed #c3a46e;background:#fffaf0;
  display:grid;place-items:center;color:#a97d2a;font-size:clamp(18px,2vw,24px);font-weight:900;
  align-self:center;text-align:center;line-height:1.15;padding:6px;
}
.gear-slot.filled{border-style:solid;border-color:#43b581;background:#ecfbf3;color:#126a45}
.gear-slot.shake{animation:shake .45s}
.gear-scene.spin .gear-big svg{animation:spin 1.1s linear infinite}
.gear-scene.spin .gear-unit.result .gear-big svg{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.gear-options{max-width:640px;margin:0 auto}
.bulb{position:absolute}

/* mode: tiaojian */
.chest-scene{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,20px);flex-wrap:wrap;margin:2px 0 14px}
.chest{width:clamp(120px,18vw,170px);position:relative;flex:0 0 auto}
.chest svg{width:100%;height:auto;display:block;overflow:visible}
.chest .lid{transition:transform .7s cubic-bezier(.2,1.2,.4,1);transform-box:view-box;transform-origin:26px 68px}
.chest.open .lid{transform:translateY(-18px) rotate(-16deg)}
.coin{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.chest.open .coin{animation:coinFly 1s ease-out forwards}
.chest.open .coin.c2{animation-delay:.08s}
.chest.open .coin.c3{animation-delay:.16s}
@keyframes coinFly{0%{opacity:1;transform:translate(0,0) scale(.8)}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.1) rotate(240deg)}}
.chest-plates{display:flex;align-items:center;gap:clamp(6px,1.4vw,12px);flex-wrap:wrap;justify-content:center}
.plate{
  background:#fffaf0;border:3px solid #efd7ad;border-radius:16px;
  padding:9px 12px;min-width:clamp(90px,14vw,150px);max-width:190px;
}
.plate span{font-size:11px;font-weight:900;letter-spacing:.1em;color:#a97d2a}
.plate p{margin:3px 0 0;font-size:clamp(14px,1.6vw,18px);font-weight:800;line-height:1.4;color:#3a4f68}
.key-slot{
  min-width:84px;min-height:58px;border-radius:14px;border:4px dashed #c3a46e;background:#fff;
  display:grid;place-items:center;color:#a97d2a;font-size:clamp(14px,1.6vw,18px);font-weight:900;
  padding:6px;text-align:center;
}
.key-slot.filled{border-style:solid;border-color:#43b581;background:#ecfbf3;color:#126a45}
.key-slot.shake{animation:shake .45s}
.key-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:680px;margin:0 auto}
.key-card{
  min-height:66px;border-radius:16px;border:3px solid #e6c78f;background:linear-gradient(180deg,#fffdf4,#ffedc2);
  color:#6b4a12;font-size:clamp(16px,1.8vw,21px);font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;box-shadow:0 5px 0 #dfc084;
}
.key-card .ic{width:22px;height:22px;flex:0 0 auto}
.key-card:active{transform:translateY(3px);box-shadow:0 1px 0 #dfc084}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,38,58,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:90;
  width:min(760px,100%);max-height:88vh;overflow:auto;
  transform:translate(-50%,105%);
  background:#fffdf8;border-radius:28px 28px 0 0;
  padding:14px clamp(16px,3vw,32px) calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(20,40,60,.28);
  transition:transform .34s cubic-bezier(.2,.9,.25,1);
}
.sheet.show{transform:translate(-50%,0)}
.sheet-grab{width:50px;height:5px;border-radius:99px;background:#d9e3ec;margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet-badge{
  width:56px;height:56px;border-radius:19px;display:grid;place-items:center;flex:0 0 auto;
  font-size:30px;font-weight:900;
}
.sheet-badge.ok{background:#e7fbf1;color:#17845a;border:3px solid #9ad9ba}
.sheet-badge.no{background:#fff2e0;color:#b0700a;border:3px solid #f0c873}
.sheet-head h3{font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.2}
.sheet-head p{margin:3px 0 0;font-size:clamp(13px,1.5vw,16px);color:var(--ink2);font-weight:700}
.answer-box{
  background:#effcf6;border:2px solid #bdebd6;border-radius:16px;
  padding:12px 15px;font-size:clamp(18px,2.1vw,25px);font-weight:900;line-height:1.6;color:#155f43;
  margin-bottom:12px;
}
.answer-box small{display:block;font-size:12px;letter-spacing:.14em;color:#3f8a6b;margin-bottom:2px}
.answer-box b{color:#0d6b49;background:#fff;padding:1px 7px;border-radius:7px;box-shadow:0 2px 0 #bdebd6}
.answer-box .map-line{display:block;font-size:.92em;margin-top:3px}
.exp-block{padding:11px 2px;border-top:1px dashed rgba(34,50,74,.13)}
.exp-block:first-of-type{border-top:0}
.exp-block h4{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:clamp(14px,1.5vw,17px);letter-spacing:.08em;color:#2f6f9e}
.exp-block h4 .num{width:23px;height:23px;border-radius:50%;background:#e3f2fd;color:#2f6f9e;display:grid;place-items:center;font-size:12px}
.exp-block p{margin:0;font-size:clamp(15px,1.65vw,19px);line-height:1.7;font-weight:650;color:#334b67}
.exp-block.tip p{color:#7a5a12}
.exp-block.tip{background:#fff8e6;border-radius:12px;padding:10px 12px;margin-top:8px;border-top:0}
.sheet-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sheet-actions .btn{flex:1;min-width:150px;min-height:58px;font-size:clamp(17px,1.9vw,21px)}
.sheet-speak{display:flex;justify-content:flex-end;margin:-4px 0 4px}

/* ---------- result ---------- */
.result-card{
  max-width:740px;margin:18px auto;background:#fff;border:3px solid #fff;border-radius:34px;
  padding:clamp(24px,4.5vw,50px);text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.result-card:before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(ellipse at 50% 100%,var(--soft),transparent 70%);opacity:.9}
.result-mascot{width:clamp(90px,14vw,130px);margin:0 auto 6px;position:relative;z-index:2;animation:float 3.6s ease-in-out infinite}
.result-card h2{font-size:clamp(26px,3.6vw,42px);margin:4px 0 6px;position:relative;z-index:2}
.result-stars{font-size:clamp(44px,8vw,78px);letter-spacing:clamp(4px,1.4vw,12px);color:#f0b429;line-height:1.1;position:relative;z-index:2}
.result-stars .off{color:#e3e9ef}

      '<div class="art-mascot">' + mascot(c.type) + '</div>';

    var body = $('#teachBody');
    if (i === 0) {
      body.innerHTML =
        '<span class="teach-kicker">卡 1 · 認識</span>' +
        '<h2>' + esc(c.name) + '</h2>' +
        '<p class="def">' + esc(c.def) + '</p>' +
        '<div class="word-grid">' + c.words.map(function (w, k) {
          return '<button class="word-chip" data-word="' + k + '">' + esc(w.w) + '</button>';
        }).join('') + '</div>' +
        '<div class="word-ex" id="wordEx">點一個詞語，聽聽它怎樣用。</div>';

      $$('.word-chip', body).forEach(function (b) {
        b.addEventListener('click', function () {
          var w = c.words[+b.getAttribute('data-word')];
          $('#wordEx').innerHTML = '<b>' + esc(w.w) + '</b>：' + esc(w.ex);
          Sound.click();
          speak(w.w + '。' + w.ex);
        });
      });
    } else if (i === 1) {
      body.innerHTML =
        '<span class="teach-kicker">卡 2 · 用法</span>' +
        '<h2>兩句示範</h2>' +
        c.examples.map(function (e, k) {
          return '<div class="example">' +
            '<div class="example-head"><span class="tag">例句 ' + (k + 1) + '</span>' +
            '<button class="speak-btn" data-speak="' + esc(e.s) + '" aria-label="朗讀例句 ' + (k + 1) + '">' + icon('speaker') + '</button></div>' +
            '<p class="sentence">' + hlSentence(e.s, e.hl) + '</p>' +
            '<p class="note">' + esc(e.note) + '</p></div>';
        }).join('');
    } else {
      body.innerHTML =
        '<span class="teach-kicker">卡 3 · 記一記</span>' +
        '<h2>口訣與辨錯</h2>' +
        '<div class="chant">' + esc(c.chant) +
        '<button class="speak-btn" data-speak="' + esc(c.chant) + '" aria-label="朗讀口訣">' + icon('speaker') + '</button></div>' +
        '<div class="mistake">' +
        '<div class="row"><span class="icon-x">✗</span><span class="bad">' + esc(c.mistake.bad) + '</span></div>' +
        '<div class="row"><span class="icon-o">✓</span><span class="good">' + esc(c.mistake.good) + '</span></div>' +
        '<p class="why">' + esc(c.mistake.why) + '</p></div>' +
        '<div class="demo-line">' + icon('bulb') + '<span>示範：' + esc(c.demo) + '</span></div>';
    }

    $$('[data-speak]', body).forEach(function (b) {
      b.addEventListener('click', function () { Sound.click(); speak(b.getAttribute('data-speak')); });
    });

    $('#teachPrev').disabled = (i === 0);
    $('#teachNext').textContent = (i === 2 ? '進入遊戲 →' : '下一張 →');
  }

  /* ---------- 題幹 ---------- */
  function answerParts(q) {
    if (Array.isArray(q.ans)) return q.ans.slice();
    if (q.ans && String(q.ans).indexOf('……') >= 0) return String(q.ans).split('……');
    return [q.ans];
  }
  function stemHTML(q, filled) {
    var parts = answerParts(q), n = 0;
    return esc(q.stem).replace(/＿＿/g, function () {
      if (!filled) return '<span class="blank" aria-label="空格">　</span>';
      var v = parts[n++] || '';
      return '<span class="fill">' + esc(v) + '</span>';
    });
  }
  function fillStemNow(q) {
    if (String(q.stem).indexOf('＿＿') >= 0) $('#qStem').innerHTML = stemHTML(q, true);
  }
  function solutionHTML(q) {
    if (q.items) {
      var marks = ['①', '②', '③', '④'];
      return q.items.map(function (it, i) {
        return '<span class="map-line">' + marks[i] + ' ' + esc(it.text).replace('＿＿', '<b>' + esc(it.ans) + '</b>') + '</span>';
      }).join('');
    }
    return stemHTML(q, true);
  }
  function solutionText(q) {
    if (q.items) {
      return q.items.map(function (it) { return it.text.replace('＿＿', it.ans); }).join('。');
    }
    var parts = answerParts(q), n = 0;
    return String(q.stem).replace(/＿＿/g, function () { return parts[n++] || ''; });
  }

  /* ---------- 開始遊戲 ---------- */
  function startGame(catId, qids, isRetry) {
    var c = getCat(catId);
    var list;
    if (qids && qids.length) {
      list = [];
      qids.forEach(function (x) {
        if (typeof x === 'number') {
          if (x >= 0 && x < c.questions.length) list.push(x);
        } else {
          for (var qi = 0; qi < c.questions.length; qi++) {
            if (c.questions[qi].id === x) { list.push(qi); break; }
          }
        }
      });
    } else {
      list = c.questions.map(function (_, i) { return i; });
    }
    if (!list.length) { toast('這個類別暫時沒有題目。'); return; }
    state.catId = catId;
    state.session = {
      catId: catId,
      qids: list,
      pos: 0,
      attempts: 0,
      firstTry: 0,
      later: 0,
      score: 0,
      results: [],
      locked: false,
      resolved: false,
      isRetry: !!isRetry
    };
    showScreen('game');
    renderQuestion();
  }

  function renderQuestion() {
    var s = state.session;
    if (!s) return;
    var c = getCat(s.catId);
    var q = c.questions[s.qids[s.pos]];
    if (!q) { finishSession(); return; }

    s.attempts = 0;
    s.locked = false;
    s.resolved = false;

    var card = $('.q-card');
    card.style.setProperty('--c', c.color);
    card.style.setProperty('--soft', c.soft);
    var gameScreen = $('#screen-game');
    gameScreen.style.setProperty('--c', c.color);
    gameScreen.style.setProperty('--soft', c.soft);

    $('#gamePill').innerHTML = icon(c.icon) + ' ' + esc(c.name) + ' · ' + esc(c.mode);
    $('#qBar').style.width = Math.round(s.pos / s.qids.length * 100) + '%';
    $('#qCount').textContent = '第 ' + (s.pos + 1) + ' / ' + s.qids.length + ' 題';
    $('#qKicker').textContent = c.mode;
    $('#qStem').innerHTML = stemHTML(q, false);
    $('#hintBar').hidden = true;
    $('#hintBar').innerHTML = icon('hint') + '<span>' + esc(q.hint || c.hint) + '</span>';

    var mode = MODES[c.modeKey];
    $('#modeArea').innerHTML = mode.html(q, c);
    mode.bind(q, c);

    $('#speakStem').onclick = function () {
      Sound.click();
      var txt = String(q.stem).replace(/＿＿/g, '，空格，');
      if (q.items) txt += '。' + q.items.map(function (it) { return it.text.replace('＿＿', '，空格，'); }).join('。');
      speak(txt);
    };
    $('#hintBtn').onclick = function () {
      var bar = $('#hintBar');
      bar.hidden = !bar.hidden;
      if (!bar.hidden) Sound.pop();
    };
  }

  function showHint() {
    var bar = $('#hintBar');
    if (bar) bar.hidden = false;
  }

  /* ---------- 判定 ---------- */
  function onWrong(msg) {
    var s = state.session;
    if (!s || s.locked || s.resolved) return;
    s.attempts++;
    Sound.wrong();
    if (s.attempts >= 3) {
      s.locked = true;
      reveal(false, false);
      return;
    }
    toast(msg || (s.attempts === 1 ? '再看看句子，還有機會。' : '差一點點，試最後一次。'));
    if (s.attempts === 2) showHint();
  }

  function onCorrect() {
    var s = state.session;
    if (!s || s.resolved) return;
    s.resolved = true;
    s.locked = true;
    var first = (s.attempts === 0);
    if (first) s.firstTry++; else s.later++;
    s.score += first ? 10 : 6;
    Sound.correct();
    if (first) setTimeout(function () { Sound.star(); }, 260);
    setTimeout(function () {
      if (state.session === s) reveal(true, first);
    }, 650);
  }

  function recordResult(q, ok, first) {
    var s = state.session;
    s.results.push({ qid: q.id, ok: !!ok, first: !!first });
    progress.done[q.id] = true;
    var cat = getCat(s.catId);
    var arr = (progress.wrong[cat.id] || []).slice();
    if (ok) {
      arr = arr.filter(function (x) { return x !== q.id; });
    } else if (arr.indexOf(q.id) < 0) {
      arr.push(q.id);
    }
    progress.wrong[cat.id] = arr;
    saveProgress();
  }

  function reveal(ok, first) {
    var s = state.session;
    if (!s) return;
    var c = getCat(s.catId);
    var q = c.questions[s.qids[s.pos]];
    if (!q) return;

    s.locked = true;
    var mode = MODES[c.modeKey];
    if (mode.solve) mode.solve(q, c);

    recordResult(q, ok, first);

    var badge = ok ? '<div class="sheet-badge ok">✓</div>' : '<div class="sheet-badge no">△</div>';
    var title = ok ? '答對了！' : '這是正解';
    var sub = ok
      ? (first ? '第一次就答對，拿到 10 分。' : '再試後答對，拿到 6 分。')
      : '試了三次，一起看清原因，下次就會記得。';

    $('#sheetHead').innerHTML = badge + '<div><h3 id="sheetTitle">' + title + '</h3><p>' + sub + '</p></div>';

    var exp = q.exp;
    $('#sheetBody').innerHTML =
      '<div class="answer-box"><small>正 解</small>' + solutionHTML(q) + '</div>' +
      '<div class="exp-block"><h4><span class="num">1</span>理由</h4><p>' + esc(exp.reason) + '</p></div>' +
      '<div class="exp-block"><h4><span class="num">2</span>辨析</h4><p>' + esc(exp.diff) + '</p></div>' +
      '<div class="exp-block tip"><h4>' + icon('bulb') + '小提示</h4><p>' + esc(exp.tip) + '</p></div>';

    var last = (s.pos >= s.qids.length - 1);
    $('#sheetActions').innerHTML =
      '<button class="btn ghost" id="sheetSpeak">' + icon('speaker') + ' 聽解析</button>' +
      '<button class="btn primary" id="sheetNext">' + (last ? '看成績 →' : '下一題 →') + '</button>';

    $('#sheetSpeak').onclick = function () {
      Sound.click();
      speak(exp.right + '。' + exp.reason + exp.diff + exp.tip);
    };
    $('#sheetNext').onclick = function () {
      Sound.click();
      nextQuestion();
    };

    openSheet();
  }

  function nextQuestion() {
    var s = state.session;
    if (!s) { closeSheet(); return; }
    closeSheet();
    if (s.pos < s.qids.length - 1) {
      s.pos++;
      renderQuestion();
    } else {
      finishSession();
    }
  }

  /* ---------- 結算 ---------- */
  function finishSession() {
    var s = state.session;
    if (!s) { goHome(); return; }
    var c = getCat(s.catId);
    var resultScreen = $('#screen-result');
    resultScreen.style.setProperty('--c', c.color);
    resultScreen.style.setProperty('--soft', c.soft);
    var total = s.qids.length;
    var ratio = total ? s.firstTry / total : 0;
    var stars = ratio >= 1 ? 3 : (ratio >= 0.72 ? 2 : (ratio >= 0.4 ? 1 : 0));
    if (s.isRetry) stars = ratio >= 0.72 ? 3 : (ratio >= 0.4 ? 2 : (ratio > 0 ? 1 : 0));

    if (!s.isRetry) {
      progress.stars[c.id] = Math.max(progress.stars[c.id] || 0, stars);
      saveProgress();
    }

    var wrongIds = [];
    s.results.forEach(function (r) { if (!r.first && wrongIds.indexOf(r.qid) < 0) wrongIds.push(r.qid); });
    var firstCount = s.firstTry;

    $('#resultMascot').innerHTML = mascot(c.type);
    $('#resultTitle').textContent = s.isRetry ? '錯題重練完成！' : '完成「' + c.name + '」！';
    var starHTML = '';
    for (var i = 0; i < 3; i++) starHTML += '<span class="' + (i < stars ? '' : 'off') + '">★</span>';
    $('#resultStars').innerHTML = starHTML;
    $('#resultSub').innerHTML = stars === 3
      ? '太棒了！第一次就答對大部分題目，這一類已經很穩。'
      : (stars === 2 ? '表現不錯！再看清辨析，就能拿到三顆星。'
        : (stars === 1 ? '已經掌握一部分，重看教學卡再挑戰一次吧。'
          : '別灰心，先重看三張教學卡，再回來慢慢試。'));

    $('#resultStats').innerHTML =
      '<div class="result-stat"><b>' + s.score + '</b><span>本局得分</span></div>' +
      '<div class="result-stat"><b>' + firstCount + ' / ' + total + '</b><span>首次答對</span></div>' +
      '<div class="result-stat"><b>' + wrongIds.length + '</b><span>需要再練</span></div>';

    var actions = '';
    if (wrongIds.length) {
      actions += '<button class="btn primary" id="retryWrong">重練錯題 (' + wrongIds.length + ')</button>';
    }
    actions += '<button class="btn ghost" id="playAgain">再玩一次</button>';
    var idx = CATS.map(function (x) { return x.id; }).indexOf(c.id);
    if (idx >= 0 && idx < CATS.length - 1) {
      actions += '<button class="btn blue" id="nextIsland">下一座島 →</button>';
    }
    actions += '<button class="btn ghost" id="backMap">返回地圖</button>';
    $('#resultActions').innerHTML = actions;

    if (wrongIds.length) {
      $('#retryWrong').onclick = function () { Sound.click(); startGame(c.id, wrongIds, true); };
    }
    $('#playAgain').onclick = function () { Sound.click(); startGame(c.id); };
    if (idx >= 0 && idx < CATS.length - 1) {
      $('#nextIsland').onclick = function () { Sound.click(); openTeach(CATS[idx + 1].id); };
    }
    $('#backMap').onclick = function () { Sound.click(); goHome(); };

    showScreen('result');
    Sound.star();
    setTimeout(function () { Sound.star(); }, 320);
  }

  /* =========================================================
     八種互動模式
     ========================================================= */
  var POS_ANCHOR = {
    '上': { t: 20, l: 50 }, '下': { t: 80, l: 50 }, '裏': { t: 50, l: 50 },
    '中': { t: 50, l: 50 }, '外': { t: 50, l: 84 }, '旁': { t: 78, l: 82 },
    '前': { t: 80, l: 18 }, '後': { t: 20, l: 18 }, '對面': { t: 20, l: 82 }
  };

  var MODES = {};

  /* 小熊站位：避開方位點，讓小朋友看得見牠躲在哪裏 */
  function bearPos(w) {
    var a = POS_ANCHOR[w] || { t: 50, l: 50 };
    var l = a.l + (a.l >= 60 ? -15 : 15);
    return { t: a.t, l: Math.max(10, Math.min(90, l)) };
  }

  /* ---- 1. 方位：場景點選 ---- */
  MODES.fangwei = {
    html: function (q) {
      var bp = bearPos(q.ans);
      var spots = q.options.map(function (w) {
        var a = POS_ANCHOR[w] || { t: 50, l: 50 };
        return '<button class="hotspot" data-w="' + esc(w) + '" style="top:' + a.t + '%;left:' + a.l + '%" aria-label="位置：' + esc(w) + '">' +
          '<span class="hot-dot"></span><span class="hot-label">' + esc(w) + '</span></button>';
      }).join('');
      return '<div class="scene" role="img" aria-label="場景圖：' + esc(q.objName) + '，請選出正確位置">' +
        '<div class="scene-sun"></div><div class="scene-cloud a"></div><div class="scene-cloud b"></div>' +
        '<div class="scene-ground"></div>' +
        '<div class="scene-caption">' + esc(q.objName) + '</div>' +
        '<div class="scene-obj">' + icon(q.obj) + '</div>' +
        '<div class="bear show" id="sceneBear" style="top:' + bp.t + '%;left:' + bp.l + '%">' + bearSVG() + '</div>' + spots + '</div>';
    },
    move: function (w) {
      var a = bearPos(w);
      var b = $('#sceneBear');
      if (!b) return;
      b.style.top = a.t + '%';
      b.style.left = a.l + '%';
      b.classList.add('show');
    },
    bind: function (q) {
      var area = $('#modeArea');
      $$('.hotspot', area).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (state.session.locked) return;
          if (btn.getAttribute('data-w') === q.ans) {
            state.session.locked = true;
            btn.classList.add('right');
            MODES.fangwei.move(q.ans);
            Sound.pop();
            fillStemNow(q);
            onCorrect();
          } else {
            btn.classList.add('wrong');
            setTimeout(function () { btn.classList.remove('wrong'); }, 520);
            onWrong('再看看圖，小熊在哪裏？');
          }
        });
      });
    },
    solve: function (q) {
      MODES.fangwei.move(q.ans);
      $$('.hotspot').forEach(function (b) {
        b.disabled = true;
        if (b.getAttribute('data-w') === q.ans) b.classList.add('right');
      });
    }
  };

      '<circle cx="198" cy="20" r="5" fill="#FFD45E" opacity=".4"/>' +

  }

  MODES.shijian = {
    html: function (q) {
      return '<div class="train-wrap">' +
        '<div class="timeline"><span>起點</span><i></i><span>終點</span></div>' +
        '<div class="train" id="train">' + trainSVG() +
        '<button class="train-slot" id="trainSlot" aria-label="車票空格">放車票</button></div>' +
        '<div class="ticket-row" id="ticketRow">' + q.options.map(function (w) {
          return '<button class="ticket" draggable="true" data-w="' + esc(w) + '">' + esc(w) + '</button>';
        }).join('') + '</div></div>';
    },
    bind: function (q) {
      var slot = $('#trainSlot');
      var tickets = $$('.ticket');
      var selected = null;

      function place(w, el) {
        var s = state.session;
        if (!s || s.locked) return;
        if (w === q.ans) {
          s.locked = true;
          slot.textContent = w;
          slot.classList.add('filled');
          if (el) el.classList.add('right');
          $('#train').classList.add('go');
          fillStemNow(q);
          Sound.train();
          setTimeout(onCorrect, 420);
        } else {
          slot.classList.add('shake');
          setTimeout(function () { slot.classList.remove('shake'); }, 520);
          onWrong('這張車票的時間不對，看看起點和終點。');
        }
      }

      tickets.forEach(function (t) {
        t.addEventListener('click', function () {
          if (state.session.locked) return;
          if (selected === t) { place(t.getAttribute('data-w'), t); return; }
          selected = t;
          tickets.forEach(function (x) { x.classList.toggle('selected', x === t); });
          Sound.select();
        });
        t.addEventListener('dragstart', function (e) {
          selected = t;
          try {
            e.dataTransfer.setData('text/plain', t.getAttribute('data-w'));
            e.dataTransfer.effectAllowed = 'move';
          } catch (err) {}
        });
      });

      slot.addEventListener('dragover', function (e) { e.preventDefault(); });
      slot.addEventListener('drop', function (e) {
        e.preventDefault();
        var w = '';
        try { w = e.dataTransfer.getData('text/plain'); } catch (err) {}
        var t = null;
        tickets.forEach(function (x) { if (x.getAttribute('data-w') === w) t = x; });
        if (t) place(w, t);
      });
      slot.addEventListener('click', function () {
        if (state.session.locked) return;
        if (selected) place(selected.getAttribute('data-w'), selected);
        else toast('先點一張車票，再點車廂空格。');
      });
    },
    solve: function (q) {
      var slot = $('#trainSlot');
      if (slot) {
        slot.textContent = q.ans;
        slot.classList.add('filled');
        slot.disabled = true;
      }
      var train = $('#train');
      if (train) train.classList.add('go');
      $$('.ticket').forEach(function (t) {

    walk: function (q) {
      var el = $('#mazeChar');
      if (!el) return;
      var pts = mazePathPoints(q);
      var segs = [], total = 0;
      for (var i = 1; i < pts.length; i++) {
        var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];

        if (!el.isConnected) return;

            var r = segs[k].len ? dist / segs[k].len : 0;
            x = segs[k].a[0] + (segs[k].b[0] - segs[k].a[0]) * r;
            y = segs[k].a[1] + (segs[k].b[1] - segs[k].a[1]) * r;
            break;
          }
          dist -= segs[k].len;
          x = segs[k].b[0]; y = segs[k].b[1];

        if (t < 1) requestAnimationFrame(frame);
      }

            Sound.unlock();
            onCorrect();
          } else {
            slot.classList.add('shake');
            setTimeout(function () { slot.classList.remove('shake'); }, 520);
            onWrong('這把鑰匙不對，先問「這是假設、足夠，還是唯一？」');
          }
        });
      });
    },
    solve: function (q) {
      var slot = $('#keySlot');
      if (slot) { slot.textContent = q.ans; slot.classList.add('filled'); }
      var chest = $('#chest');
      if (chest) chest.classList.add('open');
      $$('.key-card').forEach(function (b) {
        b.disabled = true;
        if (b.getAttribute('data-w') === q.ans) b.style.outline = '4px solid #43b581';
      });
      fillStemNow(q);
    }
  };

  /* ---------- 音效按鈕 ---------- */
  function updateSoundButton() {
    var b = $('#soundBtn');
    if (!b) return;
    b.innerHTML = icon(progress.mute ? 'mute' : 'sound');
    b.setAttribute('aria-label', progress.mute ? '開啟音效' : '關閉音效');
  }

  /* ---------- 初始化 ---------- */
  function init() {
    $('#brandMascot').innerHTML = mascot('jie');
    $('#homeBtn').innerHTML = icon('house');
    $('#heroMascot1').innerHTML = mascot('jie');
    $('#heroMascot2').innerHTML = mascot('lian');
    Sound.setMuted(!!progress.mute);
    updateSoundButton();
    renderHome();

    $('#homeBtn').addEventListener('click', function () {
      Sound.click();
      goHome();
    });
    $('#soundBtn').addEventListener('click', function () {
      progress.mute = !progress.mute;
      Sound.setMuted(progress.mute);
      updateSoundButton();
      saveProgress();
      if (!progress.mute) Sound.pop();
    });

    $('#teachBack').addEventListener('click', function () { Sound.click(); goHome(); });
    $('#teachPrev').addEventListener('click', function () {
      if (state.teachIndex > 0) {
        state.teachIndex--;
        Sound.click();
        renderTeach();
      }
    });
    $('#teachNext').addEventListener('click', function () {
      Sound.click();
      if (state.teachIndex < 2) {
        state.teachIndex++;
        renderTeach();
      } else {
        startGame(state.catId);
      }
    });
    $('#teachPlay').addEventListener('click', function () {
      Sound.click();
      startGame(state.catId);
    });

    $('#gameBack').addEventListener('click', function () {
      Sound.click();
      openTeach(state.catId);
    });

    $('#resetBtn').addEventListener('click', function () {
      Sound.click();
      $('#confirmWrap').hidden = false;
    });
    $('#confirmCancel').addEventListener('click', function () {
      Sound.click();
      $('#confirmWrap').hidden = true;
    });
    $('#confirmOk').addEventListener('click', function () {
      progress = emptyProgress();
      saveProgress();
      $('#confirmWrap').hidden = true;
      Sound.pop();
      toast('學習進度已清除。');
      goHome();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (!$('#confirmWrap').hidden) { $('#confirmWrap').hidden = true; return; }
        if ($('#sheet').classList.contains('show')) { nextQuestion(); }
      }
    });

    document.addEventListener('pointerdown', function once() {
      Sound.init();
      document.removeEventListener('pointerdown', once);
    }, { once: true });

    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.getVoices(); } catch (e) {}
    }
  }

  init();
})();

</script>
</body>
</html>
