<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>詞語牽手 · 近義反義配對遊戲</title>
<meta name="description" content="初小版與高小版各 50 組近義詞、反義詞，看圖配對，全繁體字，手機可直接玩。">
<meta name="theme-color" content="#FFF8EA">
<style>
:root{
  --cream:#FFF8EA; --paper:#FFFDF7; --ink:#4A3B2F; --ink2:#7C6757; --ink3:#A99684;
  --mint:#8FDCC0; --mint2:#E4F8EF; --sky:#93C9F2; --sky2:#E4F3FD;
  --peach:#FFB49A; --peach2:#FFEDE5; --butter:#FFD976; --butter2:#FFF3D4;
  --coral:#FF8E7A; --coral2:#FFE7E1; --lilac:#C9B8F0;
  --accent:var(--mint); --accent2:var(--mint2); --deep:#2F8F6B;
  --shadow:0 4px 0 rgba(74,59,47,.18);
  --shadow-lg:0 7px 0 rgba(74,59,47,.14);
  --font:"Yuanti TC","YuanTi TC","PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
}
body.mode-ant{--accent:var(--peach);--accent2:var(--peach2);--deep:#C25B3C}
body.mode-syn{--accent:var(--mint);--accent2:var(--mint2);--deep:#2F8F6B}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;font-family:var(--font);color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%, #FFE9C8 0%, rgba(255,233,200,0) 48%),
    radial-gradient(circle at 94% 2%, #D8F5E8 0%, rgba(216,245,232,0) 44%),
    radial-gradient(circle at 50% 102%, #FFE3DA 0%, rgba(255,227,218,0) 50%),
    var(--cream);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.34;
  background-image:radial-gradient(rgba(74,59,47,.15) 1.4px, transparent 1.4px);
  background-size:24px 24px;
}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid #4A90D9;outline-offset:3px}
[hidden]{display:none!important}
svg{display:block}

#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.screen{
  flex:1;width:100%;max-width:820px;margin:0 auto;
  padding:0 clamp(14px,4.4vw,22px) calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.screen.play{max-width:760px}
.fade{animation:fadeUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:.92;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;flex:none}
.bar-title{flex:1;min-width:0;text-align:center;font-size:clamp(15px,4.2vw,17px);font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:44px;height:44px;border-radius:15px;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.2)}
.icon-btn.ghost{visibility:hidden;pointer-events:none}
.icon-btn svg{width:21px;height:21px}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;gap:9px;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.05em}
.brand-dots{display:flex;gap:3px}
.brand-dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
.brand-dots i:nth-child(1){background:var(--coral)}
.brand-dots i:nth-child(2){background:var(--butter)}
.brand-dots i:nth-child(3){background:var(--mint)}
.home-top .icon-btn{margin-left:auto}

.hero{padding:clamp(4px,1.6vw,12px) 0 0;text-align:center}
.hero-art{position:relative;height:132px;margin:0 auto 6px;max-width:340px;display:flex;align-items:flex-end;justify-content:center;gap:6px}
.art-card{
  width:104px;padding:9px 4px 7px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);
  box-shadow:0 5px 0 rgba(74,59,47,.16);position:relative;z-index:2;
}
.art-card:nth-child(2){transform:rotate(-7deg) translateY(-6px)}
.art-card:nth-child(4){transform:rotate(7deg) translateY(-6px)}
.art-card .ic{width:42px;height:42px;margin:0 auto 3px}
.art-card b{display:block;font-size:16px;letter-spacing:.04em}
.art-link{width:52px;height:38px;align-self:center;margin-bottom:26px;color:var(--ink3)}
.art-bug{position:absolute;top:0;width:52px;z-index:1;animation:bob 3.4s ease-in-out infinite}
.art-bug.l{left:2px}
.art-bug.r{right:2px;animation-delay:-1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.eyebrow{display:inline-block;margin:6px 0 8px;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--butter2);font-size:11.5px;font-weight:800;letter-spacing:.16em}
.hero h1{margin:0;font-size:clamp(32px,9.4vw,46px);line-height:1.14;letter-spacing:.02em;font-weight:900}
.hero h1 .hl{position:relative;color:var(--deep);white-space:nowrap}
.hero h1 .hl::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:10px;border-radius:6px;background:var(--accent);opacity:.55;z-index:-1}
.lede{margin:10px auto 0;max-width:30em;font-size:14.5px;line-height:1.65;color:var(--ink2)}

.versions{display:grid;gap:12px;margin-top:clamp(16px,4vw,24px)}
.vcard{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:16px 16px 14px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);
  text-align:left;cursor:pointer;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  transition:transform .14s,box-shadow .14s;
}
.vcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,47,.16)}
.vcard::after{content:"";position:absolute;inset:auto -30px -40px auto;width:130px;height:130px;border-radius:50%;background:var(--tint);opacity:.5;z-index:0}
.vcard[data-v="junior"]{--tint:var(--mint)}
.vcard[data-v="senior"]{--tint:var(--sky)}
.vcard>*{position:relative;z-index:1}
.vtag{display:inline-block;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:800;letter-spacing:.06em}
.vcard h2{margin:6px 0 2px;font-size:22px;letter-spacing:.04em}
.vcard p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.vcard .vbar{margin-top:10px;height:8px;border-radius:99px;border:2px solid var(--ink);background:#fff;overflow:hidden;max-width:190px}
.vcard .vbar i{display:block;height:100%;background:var(--tint);transition:width .5s}
.vcard .vgo{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--deep)}
.vcard .vgo svg{width:16px;height:16px}
.vbug{width:62px;margin-bottom:4px}
.foot{margin:18px 0 0;text-align:center;font-size:11.5px;color:var(--ink3);letter-spacing:.03em}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.step{padding:11px 8px 10px;border:2px solid rgba(74,59,47,.22);border-radius:16px;background:rgba(255,253,247,.7);text-align:center}
.step .n{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--ink);background:var(--butter);font-size:12px;font-weight:900}
.step b{display:block;font-size:12.5px;letter-spacing:.04em}
.step span{display:block;margin-top:3px;font-size:11px;color:var(--ink2);line-height:1.4}

/* ---------- mode cards ---------- */
.modes{display:grid;gap:12px;margin-top:8px}
.mcard{
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ico text" "stat stat";
  align-items:center;gap:6px 12px;width:100%;
  padding:15px 14px 12px;border:3px solid var(--ink);border-radius:22px;background:var(--paper);
  box-shadow:var(--shadow-lg);cursor:pointer;text-align:left;transition:transform .14s,box-shadow .14s;position:relative;overflow:hidden;
}
.mcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,47,.16)}
.mcard::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--t1),var(--t2));opacity:.5;z-index:0}
.mcard[data-m="syn"]{--t1:var(--mint2);--t2:#F4FBF6}
.mcard[data-m="ant"]{--t1:var(--peach2);--t2:#FFF7F2}
.mcard>*{position:relative;z-index:1}
.mico{grid-area:ico;display:flex;align-items:center}
.mico span{width:42px;height:42px;border-radius:13px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:5px}
.mico span+span{margin-left:-9px;transform:rotate(8deg)}
.mico svg{width:100%;height:100%}
.mtext{grid-area:text;min-width:0}
.mtext h2{margin:0 0 3px;font-size:20px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.mtext h2 em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;border:2px solid var(--ink);background:#fff}
.mtext p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.mstat{grid-area:stat;display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:9px;border-top:2px dashed rgba(74,59,47,.16);font-size:11.5px;font-weight:800;color:var(--deep)}
.mstat .bar2{flex:1;height:7px;border-radius:99px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.mstat .bar2 i{display:block;height:100%;background:var(--accent)}
.mstat b{font-size:13px}
.book-btn{
  margin-top:14px;width:100%;padding:13px;border:2.5px dashed rgba(74,59,47,.5);border-radius:16px;
  background:rgba(255,253,247,.7);font-size:14px;font-weight:800;letter-spacing:.04em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.book-btn:active{background:#fff}
.book-btn svg{width:18px;height:18px}

/* ---------- demo / summary ---------- */
.demo{margin-top:14px;padding:11px 13px 9px;border:2px dashed rgba(74,59,47,.35);border-radius:18px;background:rgba(255,253,247,.65)}
.demo .dt{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink3);margin-bottom:4px}
.demo .dr{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:15px;letter-spacing:.04em}
.demo .dr i{font-style:normal;font-weight:900;color:var(--accent-deep,var(--deep));font-size:14px}
.demo .dr span{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.demo .dr b{font-weight:800}
.sum{margin-top:16px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}
.sum .sb{width:46px;flex:none}
.sum b{display:block;font-size:14.5px;letter-spacing:.03em}
.sum span{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px}

/* ---------- levels ---------- */
.lv-wrap{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.lv{
  position:relative;padding:13px 12px 12px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);
  box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .14s,box-shadow .14s;
  min-height:112px;display:flex;flex-direction:column;
}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.18)}
.lv .no{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink3)}
.lv h3{margin:3px 0 7px;font-size:17px}
.lv .stars{display:flex;gap:3px}
.lv .stars svg{width:15px;height:15px}
.lv .cnt{margin-top:auto;padding-top:7px;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .tick{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);display:grid;place-items:center}
.lv .tick svg{width:12px;height:12px}
.lv.next{border-color:var(--ink);background:linear-gradient(160deg,#fff,var(--accent2))}
.lv.next::after{content:"繼續";position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:99px;background:var(--accent);border:2px solid var(--ink);font-size:10px;font-weight:800}
.lv-hint{margin:14px 0 0;font-size:12px;color:var(--ink2);text-align:center;line-height:1.6}

/* ---------- play ---------- */
.play-top{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.prompt{
  display:flex;align-items:center;gap:9px;justify-content:center;
  min-height:48px;padding:8px 14px;border:3px solid var(--ink);border-radius:16px;
  background:var(--accent2);font-size:15px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.4;
  transition:background .2s;
}
.prompt svg{width:20px;height:20px;flex:none}
.prompt.reveal{background:var(--butter2);animation:popS .3s}
@keyframes popS{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:700;padding:0 2px}
.hearts{display:flex;gap:5px}
.hearts i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(74,59,47,.4);background:#fff;display:block;transition:transform .2s,background .2s}
.hearts i.on{background:var(--coral);border-color:var(--ink);transform:scale(1.06)}

.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;flex:1;align-content:center;grid-auto-rows:minmax(72px,88px)}
.card{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:72px;padding:6px 8px 6px 6px;border:3px solid var(--ink);border-radius:19px;
  background:var(--paper);box-shadow:0 4px 0 rgba(74,59,47,.15);
  cursor:pointer;text-align:left;transition:transform .12s,background .2s,border-color .2s,box-shadow .12s;
  overflow:hidden;
}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--band,#E8DDD0);opacity:0;transition:opacity .2s}
.card .ic{flex:none;width:clamp(48px,15.2vw,64px);height:clamp(48px,15.2vw,64px);border-radius:15px;background:var(--chip,#FFF3D4);display:grid;place-items:center;padding:2px;border:2px solid rgba(74,59,47,.16);transition:opacity .25s}
.card .ic svg{width:100%;height:100%}
.card .w{font-size:clamp(23px,7.2vw,30px);font-weight:900;letter-spacing:.05em;color:var(--ink);min-width:0;line-height:1.08;white-space:nowrap}
.card .ok{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);display:none;place-items:center}
.card .ok svg{width:11px;height:11px}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,59,47,.14)}
.card.sel{border-color:var(--deep);background:var(--accent2);transform:translateY(-3px);box-shadow:0 7px 0 rgba(74,59,47,.16)}
.card.sel::before{content:"";position:absolute;inset:-6px;border:3px dashed var(--deep);border-radius:22px;opacity:.5;animation:ring 1.5s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.28}50%{opacity:.7}}
.card.done{background:#F5EFE3;border-color:rgba(74,59,47,.35);box-shadow:none;cursor:default}
.card.done::after{opacity:1}
.card.done .ic{opacity:.5}
.card.done .w{color:var(--ink2)}
.card.done .ok{display:grid}
.card.wrong{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.card.pop{animation:pop .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

.play-foot{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink2);padding-bottom:2px}
.play-foot .fb{width:40px;flex:none}
.play-foot span{line-height:1.4}

/* floating heart */
.fly{position:fixed;z-index:60;pointer-events:none;width:16px;height:16px;color:var(--coral);animation:flyUp .9s ease-out forwards}
@keyframes flyUp{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-160%) scale(1.15);opacity:0}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(74,59,47,.42);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result{
  width:100%;max-width:400px;max-height:86dvh;overflow:auto;
  border:3px solid var(--ink);border-radius:26px;background:var(--paper);
  box-shadow:0 10px 0 rgba(74,59,47,.22);padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  animation:rise .34s cubic-bezier(.2,1.3,.4,1);
}
@keyframes rise{from{transform:translateY(18px) scale(.96);opacity:.6}to{transform:none;opacity:1}}
.result h2{margin:2px 0 4px;text-align:center;font-size:22px;letter-spacing:.04em}
.result .sub{margin:0;text-align:center;font-size:12.5px;color:var(--ink2)}
.rstars{display:flex;justify-content:center;gap:8px;margin:10px 0 6px}
.rstars svg{width:40px;height:40px}
.rstars svg:nth-child(2){transform:translateY(-6px) scale(1.12)}
.rstars svg.lit{animation:starIn .5s backwards cubic-bezier(.2,1.6,.4,1)}
.rstars svg:nth-child(1){animation-delay:.05s}
.rstars svg:nth-child(2){animation-delay:.2s}
.rstars svg:nth-child(3){animation-delay:.35s}
@keyframes starIn{from{transform:scale(.2) rotate(-30deg);opacity:.3}to{transform:scale(1)}}
.rlist{list-style:none;margin:10px 0 14px;padding:0;display:grid;gap:8px}
.rlist li{display:grid;gap:2px;padding:8px 10px;border-radius:12px;background:#F8F2E7}
.rlist li .wline{display:flex;align-items:center;gap:6px}
.rlist li .mini{width:34px;height:34px;flex:none}
.rlist li b{font-weight:800;letter-spacing:.04em;font-size:17px}
.rlist li .eq{color:var(--ink3);font-weight:800;font-size:12px}
.rlist li .m{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.5;padding-left:2px}
.rbtns{display:grid;gap:8px}
.btn{
  width:100%;padding:13px;border-radius:16px;border:2.5px solid var(--ink);background:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,box-shadow .12s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,47,.18)}
.btn.primary{background:var(--accent);box-shadow:0 4px 0 rgba(74,59,47,.28)}
.btn.ghost{background:transparent;border-style:dashed;box-shadow:none;font-size:13.5px}
.btn svg{width:17px;height:17px}

/* ---------- book ---------- */
.tabs{display:flex;gap:8px;margin:2px 0 10px}
.tab{
  flex:1;padding:11px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);
  font-size:15px;font-weight:800;cursor:pointer;transition:background .18s,color .18s;
}
.tab.on{background:var(--accent);box-shadow:0 3px 0 rgba(74,59,47,.2)}
.book-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink3)}
.book-list{display:flex;flex-direction:column;gap:9px}
.brow{
  display:flex;flex-direction:column;gap:5px;width:100%;padding:9px 11px;
  border:2.5px solid rgba(74,59,47,.24);border-radius:16px;background:var(--paper);text-align:left;cursor:pointer;
  transition:transform .12s,border-color .2s,background .2s;box-shadow:0 2px 0 rgba(74,59,47,.07);
}
.brow:active{transform:scale(.99)}
.brow .line{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bcell{display:flex;align-items:center;gap:6px;min-width:0}
.bcell .pic{width:46px;height:46px;flex:none;border-radius:13px;background:var(--chip,#FFF3D4);display:grid;place-items:center;padding:2px;border:2px solid rgba(74,59,47,.14)}
.bcell .pic svg{width:100%;height:100%}

  }

  /* ---------------- 狀態 ---------------- */
  var S = { v:'junior', m:'syn', lv:0, page:0, cards:[], sel:null, done:0, miss:0, lock:false, screen:'home', reveal:0 };

  function setMode(v,m){
    document.body.className = m==='ant'?'mode-ant':'mode-syn';
  }

  /* ---------------- 共用元件 ---------------- */
  function bar(title, backTo){
    return '<div class="bar">'
      + (backTo ? '<button class="icon-btn" data-back="'+backTo+'" aria-label="返回">'+UI.back+'</button>' : '<span class="icon-btn ghost"></span>')
      + '<div class="bar-title">'+title+'</div>'
      + '<button class="icon-btn" data-sound aria-label="'+(store.sound?'關閉音效':'開啟音效')+'">'+(store.sound?UI.soundOn:UI.soundOff)+'</button>'
      + '</div>';
  }
  function bug(tone){
    return '<svg viewBox="0 0 110 110" fill="none" aria-hidden="true">'
      + '<path d="M40 30C33 17 26 13 16 13" stroke="#4A3B2F" stroke-width="4" stroke-linecap="round"/>'
      + '<circle cx="14" cy="11" r="6" fill="#FFD976" stroke="#4A3B2F" stroke-width="3.4"/>'
      + '<path d="M70 30C77 17 84 13 94 13" stroke="#4A3B2F" stroke-width="4" stroke-linecap="round"/>'
      + '<circle cx="96" cy="11" r="6" fill="#FFD976" stroke="#4A3B2F" stroke-width="3.4"/>'
      + '<ellipse cx="55" cy="72" rx="38" ry="32" fill="'+tone+'" stroke="#4A3B2F" stroke-width="4"/>'
      + '<circle cx="55" cy="48" r="27" fill="'+tone+'" stroke="#4A3B2F" stroke-width="4"/>'
      + '<circle cx="45" cy="45" r="7.4" fill="#fff" stroke="#4A3B2F" stroke-width="3"/>'
      + '<circle cx="46.6" cy="46.4" r="3.2" fill="#4A3B2F"/>'
      + '<circle cx="65" cy="45" r="7.4" fill="#fff" stroke="#4A3B2F" stroke-width="3"/>'
      + '<circle cx="66.6" cy="46.4" r="3.2" fill="#4A3B2F"/>'
      + '<ellipse cx="35" cy="58" rx="5.4" ry="3.4" fill="#FF9C93" opacity=".65"/>'
      + '<ellipse cx="75" cy="58" rx="5.4" ry="3.4" fill="#FF9C93" opacity=".65"/>'
      + '<path d="M48 60q7 6 14 0" stroke="#4A3B2F" stroke-width="3" stroke-linecap="round"/>'
      + '<path d="M55 75v14M41 82h28" stroke="#4A3B2F" stroke-width="3" opacity=".35"/>'
      + '</svg>';
  }

  /* ---------------- 首頁 ---------------- */
  function home(){
    var j=learnedCount('junior'), s=learnedCount('senior');
    return '<div class="screen fade">'
      + '<div class="home-top"><div class="brand"><span class="brand-dots"><i></i><i></i><i></i></span>詞語果園</div>'
      + '<button class="icon-btn" data-sound aria-label="音效">'+(store.sound?UI.soundOn:UI.soundOff)+'</button></div>'
      + '<section class="hero">'
      +   '<div class="hero-art">'
      +     '<span class="art-bug l">'+bug('#8FDCC0')+'</span>'
      +     '<div class="art-card"><div class="ic">'+ic('smile')+'</div><b>開心</b></div>'
      +     '<svg class="art-link" viewBox="0 0 48 34">'+UI.link+'</svg>'
      +     '<div class="art-card"><div class="ic">'+ic('happy')+'</div><b>快樂</b></div>'
      +     '<span class="art-bug r">'+bug('#FFB49A')+'</span>'
      +   '</div>'
      +   '<span class="eyebrow">詞語 · 配對 · 認讀</span>'
      +   '<h1>詞語<span class="hl">牽手</span></h1>'
      +   '<p class="lede">找出意思相同或相反的兩個詞語，把它們牽在一起。</p>'
      + '</section>'
      + '<div class="versions">'
      +   vcard('junior','初小版','小一至小三',j,'#8FDCC0')
      +   vcard('senior','高小版','小四至小六',s,'#93C9F2')
      + '</div>'
      + '<div class="steps">'
      +   '<div class="step"><i class="n">1</i><b>選版本</b><span>初小或高小</span></div>'
      +   '<div class="step"><i class="n">2</i><b>找關係</b><span>近義或反義</span></div>'
      +   '<div class="step"><i class="n">3</i><b>配成對</b><span>點兩張卡</span></div>'
      + '</div>'
      + '<p class="foot">兩版各 50 組 · 近義 25 組 ＋ 反義 25 組 · 全繁體字</p>'
      + '</div>';
  }
  function vcard(v,name,sub,got,tone){
    var pct = Math.round(got/50*100);
    return '<button class="vcard" data-v="'+v+'">'
      + '<div><span class="vtag">'+sub+'</span><h2>'+name+'</h2>'
      + '<p>近義 25 組 · 反義 25 組</p>'
      + '<div class="vbar"><i style="width:'+pct+'%"></i></div></div>'
      + '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'
      +   '<div class="vbug">'+bug(tone)+'</div>'
      +   '<span class="vgo">已配對 '+got+'/50 '+UI.arrow+'</span>'
      + '</div></button>';
  }

  /* ---------------- 版本主頁 ---------------- */
  function hub(){
    var d=DATA[S.v];
    var syn=0,ant=0;
    for(var i=0;i<25;i++){ if(pairDone(S.v,'syn',i)) syn++; if(pairDone(S.v,'ant',i)) ant++; }
    return '<div class="screen fade">'
      + bar(d.label,'home')
      + '<div class="modes">'
      +   mcard('syn','近義詞','意思相近','把意思相同或相近的兩個詞語配成一對',syn,starSum(S.v,'syn'))
      +   mcard('ant','反義詞','意思相反','把意思相反的兩個詞語配成一對',ant,starSum(S.v,'ant'))
      + '</div>'
      + '<button class="book-btn" data-book="'+S.m+'">'+UI.book+' 我的詞語圖鑑</button>'
      + '<div class="demo"><div class="dt">一分鐘看懂</div>'
      +   '<div class="dr"><b>開心</b><i>≈</i><b>快樂</b><span>意思相近 → 近義詞</span></div>'
      +   '<div class="dr"><b>大</b><i>↔</i><b>小</b><span>意思相反 → 反義詞</span></div>'
      + '</div>'
      + '<p class="lv-hint">每種關係 25 組，分成 5 關；每關 5 對詞語、10 張卡。<br>點兩張卡配對，答錯不扣分，可以再試。</p>'
      + '</div>';
  }
  function mcard(m,name,tag,desc,got,stars){
    var icons = m==='syn' ? [ic('heart'),ic('check')] : [ic('sun'),ic('snowflake')];
    return '<button class="mcard" data-m="'+m+'">'
      + '<span class="mico"><span>'+icons[0]+'</span><span>'+icons[1]+'</span></span>'
      + '<span class="mtext"><h2>'+name+' <em>'+tag+'</em></h2><p>'+desc+'</p></span>'
      + '<span class="mstat"><b>'+got+' / 25</b><span class="bar2"><i style="width:'+Math.round(got/25*100)+'%"></i></span><span>'+stars+' / 15 星</span></span>'
      + '</button>';
  }

  /* ---------------- 關卡 ---------------- */
  function cntDone(m){ var n=0; for(var i=0;i<25;i++){ if(pairDone(S.v,m,i)) n++; } return n; }
  function levels(){
    var d=DATA[S.v], name = S.m==='syn'?'近義詞':'反義詞';
    var cards='';
    for(var i=0;i<5;i++){
      var st=store.stars[vkey(S.v,S.m,i)]||0;
      var done=st>0;
      var isNext = !done && (i===0 || (store.stars[vkey(S.v,S.m,i-1)]||0)>0);
      cards += '<button class="lv'+(isNext?' next':'')+'" data-lv="'+i+'">'
        + (st===3?'<span class="tick">'+UI.check+'</span>':'')
        + '<span class="no">LEVEL '+String(i+1).padStart(2,'0')+'</span>'
        + '<h3>第 '+(i+1)+' 關</h3>'
        + '<div class="stars">'+starRow(st)+'</div>'
        + '<div class="cnt">'+d[S.m].slice(i*5,i*5+5).map(function(p){return p[0];}).slice(0,2).join(' · ')+' …</div>'
        + '</button>';
    }
    return '<div class="screen fade">'
      + bar(name,'hub')
      + '<div class="lv-wrap">'+cards+'</div>'
      + '<div class="sum"><span class="sb">'+bug(S.m==='syn'?'#8FDCC0':'#FFB49A')+'</span>'
      +   '<div><b>已配對 '+cntDone(S.m)+' / 25　共 '+starSum(S.v,S.m)+' / 15 星</b>'
      +   '<span>一次答對全部 → 3 星；錯 1–2 次 → 2 星。</span></div></div>'
      + '</div>';
  }

  /* ---------------- 遊戲 ---------------- */
  var CHIPS=['#FFF3D4','#E4F8EF','#E4F3FD','#FFEDE5','#F1EAFB','#F7F1E4'];
  function play(){
    var pairs = DATA[S.v][S.m].slice(S.lv*5, S.lv*5+5);
    S.cards=[]; S.sel=null; S.done=0; S.miss=0; S.lock=false;
    pairs.forEach(function(p,i){
      S.cards.push({p:i,w:p[0],k:p[2],side:'a'});
      S.cards.push({p:i,w:p[1],k:p[3],side:'b'});
    });
    for(var i=S.cards.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=S.cards[i]; S.cards[i]=S.cards[j]; S.cards[j]=t; }
    var txt = S.m==='syn' ? '找出意思相同或相近的兩個詞語' : '找出意思相反的兩個詞語';
    var ico = S.m==='syn' ? UI.pair : UI.swap;
    var html='<div class="screen play fade">'
      + bar(DATA[S.v].label+' · '+(S.m==='syn'?'近義詞':'反義詞')+' 第'+(S.lv+1)+'關','levels')
      + '<div class="play-top"><div class="prompt" id="prompt">'+ico+'<span>'+txt+'</span></div>'
      + '<div class="meta"><span id="pcount">已配對 0 / 5</span><span class="hearts" id="hearts">'
      +   '<i></i><i></i><i></i><i></i><i></i></span></div></div>'
      + '<div class="board" id="board">';
    S.cards.forEach(function(c,i){
      html += '<button class="card" data-i="'+i+'" style="--chip:'+CHIPS[(c.k.length+i)%CHIPS.length]+'">'
        + '<span class="ic">'+ic(c.k)+'</span><span class="w">'+c.w+'</span>'
        + '<span class="ok">'+UI.check+'</span></button>';
    });
    html += '</div>'
      + '<div class="play-foot"><span class="fb">'+bug('#8FDCC0')+'</span><span>點一張卡，再點它的好朋友。</span></div>'
      + '</div>';
    return html;
  }

  function bindPlay(root){
    var board=$('#board',root);
    board.addEventListener('click', function(e){
      var el=e.target.closest('.card'); if(!el||S.lock) return;
      var i=+el.dataset.i, c=S.cards[i];
      if(el.classList.contains('done')) return;
      if(S.sel===null){ S.sel=i; el.classList.add('sel'); SFX.tap(); return; }
      if(S.sel===i){ S.sel=null; el.classList.remove('sel'); SFX.tap(); return; }
      var a=S.cards[S.sel], aEl=board.querySelector('[data-i="'+S.sel+'"]');
      if(a.p===c.p){ correct(aEl,el,a); } else { wrong(aEl,el); }
    });
  }

  function correct(elA,elB,c){
    S.lock=true;
    var pair=DATA[S.v][S.m][S.lv*5+c.p];
    [elA,elB].forEach(function(el){
      el.classList.remove('sel'); el.classList.add('done','pop');
      el.style.setProperty('--band', S.m==='syn'?'#8FDCC0':'#FFB49A');
    });
    S.sel=null; S.done++;
    SFX.ok();
    $('#pcount').textContent='已配對 '+S.done+' / 5';
    var hs=$('#hearts').children;
    if(hs[S.done-1]) hs[S.done-1].classList.add('on');
    heartBurst(elB);
    showMeaning(pair);
    setTimeout(function(){
      S.lock=false;
      if(S.done===5) finish();
    }, 480);
  }
  function wrong(elA,elB){
    S.miss++;
    SFX.no();
    [elA,elB].forEach(function(el){ el.classList.add('wrong'); setTimeout(function(){el.classList.remove('wrong');},420); });
    elA.classList.remove('sel'); S.sel=null;
    flashPrompt('再想想，這兩個詞語的意思對不上哦');
  }
  var promptTimer=null;
  function flashPrompt(msg){
    var p=$('#prompt'); if(!p) return;
    if(!p.dataset.base) p.dataset.base=p.innerHTML;
    p.classList.add('reveal');
    p.innerHTML='<span>'+msg+'</span>';
    clearTimeout(promptTimer);
    promptTimer=setTimeout(function(){
      p.innerHTML=p.dataset.base; p.classList.remove('reveal');
    }, 1900);
  }
  function showMeaning(pair){
    var p=$('#prompt'); if(!p) return;
    if(!p.dataset.base) p.dataset.base=p.innerHTML;
    p.classList.add('reveal');
    p.innerHTML='<span><b>'+pair[0]+'</b> '+(S.m==='syn'?'≈':'↔')+' <b>'+pair[1]+'</b>　'+pair[4]+'</span>';
    clearTimeout(promptTimer);
    promptTimer=setTimeout(function(){
      var pp=$('#prompt'); if(pp){ pp.innerHTML=pp.dataset.base; pp.classList.remove('reveal'); }
    }, 2600);
  }
  function heartBurst(el){
    var r=el.getBoundingClientRect();
    for(var i=0;i<3;i++){
      var h=document.createElement('span');
      h.className='fly'; h.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21C6 16 3 13 3 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 9 2.5C21 13 18 16 12 21z"/></svg>';
      h.style.left=(r.left+r.width/2+(i-1)*14)+'px';
      h.style.top=(r.top+r.height/2)+'px';
      h.style.color=i%2?'#FF8E7A':'#FFB49A';
      document.body.appendChild(h);
      (function(node){ setTimeout(function(){ node.remove(); },900); })(h);
    }
  }
  function confetti(){
    var wrap=document.createElement('div'); wrap.className='confetti';
    var cols=['#FFD976','#8FDCC0','#FFB49A','#93C9F2','#C9B8F0','#FF8E7A'];
    for(var i=0;i<26;i++){
      var s=document.createElement('i');
      s.style.left=(Math.random()*100)+'%';
      s.style.background=cols[i%cols.length];
      s.style.animationDuration=(1.5+Math.random()*1.1)+'s';
      s.style.animationDelay=(Math.random()*.35)+'s';
      s.style.transform='rotate('+(Math.random()*360)+'deg)';
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(function(){ wrap.remove(); },3000);
  }

  function finish(){
    var st = S.miss===0?3:(S.miss<=2?2:1);
    var key=vkey(S.v,S.m,S.lv);
    store.stars[key]=Math.max(store.stars[key]||0, st);
    for(var i=0;i<5;i++) store.learned[S.v+'|'+S.m+'|'+(S.lv*5+i)]=1;
    save();
    SFX.win(); confetti();

    var pairs=DATA[S.v][S.m].slice(S.lv*5,S.lv*5+5);
    var list=pairs.map(function(p){
      return '<li><div class="wline"><span class="mini">'+ic(p[2])+'</span><b>'+p[0]+'</b>'
        + '<span class="eq">'+(S.m==='syn'?'≈':'↔')+'</span>'
        + '<span class="mini">'+ic(p[3])+'</span><b>'+p[1]+'</b></div>'
        + '<p class="m">'+p[4]+'</p></li>';
    }).join('');
    var last = S.lv>=4;
    var box=document.createElement('div'); box.className='overlay';
    box.innerHTML='<div class="result">'
      + '<div class="rstars">'+starRow(st)+'</div>'
      + '<h2>'+(last?'全部關卡完成！':'這一關完成了！')+'</h2>'
      + '<p class="sub">'+(S.miss===0?'全部一次答對，太厲害了':(S.miss<=2?'只錯了 '+S.miss+' 次，很專心':'錯了 '+S.miss+' 次，再玩一次會更順'))+'</p>'
      + '<ul class="rlist">'+list+'</ul>'
      + '<div class="rbtns">'
      +   (last?'':'<button class="btn primary" data-next="1">下一關 '+UI.arrow+'</button>')
      +   '<button class="btn'+(last?' primary':'')+'" data-replay="1">再玩一次</button>'
      +   '<button class="btn ghost" data-tolv="1">回到關卡地圖</button>'
      + '</div></div>';
    document.body.appendChild(box);
    box.addEventListener('click', function(e){
      if(e.target.closest('[data-next]')){ box.remove(); S.lv++; go('play'); }
      else if(e.target.closest('[data-replay]')){ box.remove(); go('play'); }
      else if(e.target.closest('[data-tolv]')){ box.remove(); go('levels'); }
    });
  }

  /* ---------------- 圖鑑 ---------------- */
  function book(){
    var d=DATA[S.v], list=d[S.m];
    if(S.page==null) S.page=0;
    S.page=Math.max(0,Math.min(4,S.page));
    var start=S.page*5, rows='';
    for(var i=start;i<start+5;i++){
      var p=list[i]; if(!p) continue;
      rows += '<button class="brow'+(pairDone(S.v,S.m,i)?' learned':'')+'" data-say="'+p[0]+' '+p[1]+'">'
        + '<span class="line">'
        +   '<span class="bcell"><span class="pic" style="--chip:'+CHIPS[i%CHIPS.length]+'">'+ic(p[2])+'</span><b>'+p[0]+'</b></span>'
        +   '<span class="sym">'+(S.m==='syn'?'≈':'↔')+'</span>'
        +   '<span class="bcell"><span class="pic" style="--chip:'+CHIPS[(i+2)%CHIPS.length]+'">'+ic(p[3])+'</span><b>'+p[1]+'</b></span>'
        + '</span>'
        + '<p class="m">'+p[4]+'</p></button>';
    }
    return '<div class="screen fade">'
      + bar('詞語圖鑑','hub')
      + '<div class="tabs">'
      +   '<button class="tab'+(S.m==='syn'?' on':'')+'" data-tab="syn">近義詞 25 組</button>'
      +   '<button class="tab'+(S.m==='ant'?' on':'')+'" data-tab="ant">反義詞 25 組</button>'
      + '</div>'
      + '<div class="book-head"><span>第 '+(S.page+1)+' 關 · 5 組</span><span>'+(start+1)+'–'+(start+5)+' / 25</span></div>'
      + '<div class="book-list">'+rows+'</div>'
      + '<div class="pager">'
      +   '<button class="pgbtn" data-page="-1" aria-label="上一頁"'+(S.page===0?' disabled':'')+'>'+UI.back+'</button>'
      +   '<span class="pgnow">'+(S.page+1)+' / 5</span>'
      +   '<button class="pgbtn" data-page="1" aria-label="下一頁"'+(S.page===4?' disabled':'')+'>'+UI.arrow+'</button>'
      + '</div>'
      + '<p class="book-tip">點一下任何一組，可以聽一次讀音。</p>'
      + '</div>';
  }

  /* ---------------- 路由 ---------------- */
  var app=null;
  function render(html, after){
    app.innerHTML=html;
    window.scrollTo(0,0);
    var root=app.firstElementChild;
    if(after) after(root);
    var sb=root.querySelector('[data-sound]');
    if(sb) sb.addEventListener('click', function(){ store.sound=!store.sound; save(); sb.innerHTML=store.sound?UI.soundOn:UI.soundOff; if(store.sound) SFX.tap(); });
    root.querySelectorAll('[data-back]').forEach(function(b){
      b.addEventListener('click', function(){ go(b.dataset.back); });
    });
  }

  function go(name){
    S.screen=name;
    var root;
    if(name==='home'){ document.body.className=''; render(home(), function(r){
      r.querySelectorAll('[data-v]').forEach(function(b){ b.addEventListener('click', function(){ S.v=b.dataset.v; setMode(S.v,'syn'); go('hub'); SFX.tap(); }); });
    }); }
    else if(name==='hub'){ setMode(S.v,S.m); render(hub(), function(r){
      r.querySelectorAll('[data-m]').forEach(function(b){ b.addEventListener('click', function(){ S.m=b.dataset.m; setMode(S.v,S.m); go('levels'); SFX.tap(); }); });
      r.querySelector('[data-book]').addEventListener('click', function(){ go('book'); });
    }); }
    else if(name==='levels'){ setMode(S.v,S.m); render(levels(), function(r){
      r.querySelectorAll('[data-lv]').forEach(function(b){ b.addEventListener('click', function(){ S.lv=+b.dataset.lv; SFX.tap(); go('play'); }); });
    }); }
    else if(name==='play'){ setMode(S.v,S.m); render(play(), bindPlay); }
    else if(name==='book'){ setMode(S.v,S.m); render(book(), function(r){
      r.querySelectorAll('[data-tab]').forEach(function(b){ b.addEventListener('click', function(){ S.m=b.dataset.tab; S.page=0; setMode(S.v,S.m); go('book'); }); });
      r.querySelectorAll('[data-page]').forEach(function(b){ b.addEventListener('click', function(){ S.page=Math.max(0,Math.min(4,S.page+ +b.dataset.page)); SFX.tap(); go('book'); }); });
      if(r.querySelector('[data-say]')) r.querySelectorAll('[data-say]').forEach(function(b){ b.addEventListener('click', function(){ speak(b.dataset.say); SFX.tap(); }); });
    }); }
  }

  document.addEventListener('DOMContentLoaded', function(){
    app=document.getElementById('app');
    if(window.speechSynthesis){ try{ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=function(){}; }catch(e){} }
    go('home');
  });
  window.__go=go; window.__S=S;
})();

</script>
</body>
</html>
