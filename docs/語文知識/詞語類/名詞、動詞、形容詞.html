<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>詞性繪本屋｜小學中文詞性互動繪本</title>
<meta name="description" content="小學名詞、動詞、形容詞互動學習繪本：圖文教學卡、六種遊戲模式、辨析詞性挑戰區，支援手機、平板與電腦。">
<meta name="theme-color" content="#FBF1DE">
<style>
  :root{
    --paper:#FBF1DE;
    --paper-2:#FFF9EC;
    --paper-3:#F6E7CE;
    --ink:#4A3B32;
    --ink-2:#7A6656;
    --ink-3:#A08B78;
    --sky:#8FC7DB;
    --sky-d:#3F7E97;
    --grass:#A9D6A2;
    --apricot:#E8934A;
    --rose:#E98585;
    --butter:#F7C948;
    --lav:#A99BE0;
    --mint:#69B394;
    --noun:#3F7E97;
    --verb:#C46A2A;
    --adj:#3F8A6B;
    --r-hand:26px 20px 24px 22px / 20px 26px 22px 24px;
    --shadow:6px 7px 0 rgba(74,59,50,.13);
    --shadow-sm:4px 4px 0 rgba(74,59,50,.12);
    --font-ui:"Noto Sans TC","Noto Sans CJK HK","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    --font-book:"Noto Serif TC","Noto Serif CJK HK","Songti TC","PingFang HK","Microsoft JhengHei",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:clamp(17px,.6vw + 14.7px,22px);}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:var(--font-ui);
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 8% 6%, rgba(143,199,219,.30), transparent 34%),
      radial-gradient(circle at 94% 12%, rgba(247,201,72,.34), transparent 32%),
      radial-gradient(circle at 88% 78%, rgba(233,133,133,.18), transparent 34%),
      radial-gradient(circle at 4% 84%, rgba(105,179,148,.20), transparent 32%),
      radial-gradient(rgba(74,59,50,.075) 1.1px, transparent 1.2px);
    background-size:100% 100%,100% 100%,100% 100%,100% 100%,20px 20px;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .app{width:100%;max-width:1120px;margin:0 auto;padding:0 14px 44px;}
  @media(min-width:760px){ .app{padding:0 22px 56px;} }

  /* ============ 頂欄 ============ */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(251,241,222,.93);backdrop-filter:blur(9px);}
  .topbar::after{content:"";display:block;height:6px;background:
    repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 26px);opacity:.55;}
  .topin{max-width:1120px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:.6rem;}
  .logo{width:2.5rem;height:2.5rem;flex:0 0 auto;border:2.4px solid var(--ink);border-radius:14px 12px 15px 11px;background:var(--butter);display:grid;place-items:center;box-shadow:2px 2px 0 rgba(74,59,50,.2);}
  .logo svg{width:1.5rem;height:1.5rem;}
  .brand{min-width:0;}
  .brand b{display:block;font-size:1.06rem;line-height:1.2;letter-spacing:.02em;font-weight:900;}
  .brand span{display:block;font-size:.58rem;font-weight:800;letter-spacing:.2em;color:var(--ink-2);margin-top:1px;}
  .topbtns{margin-left:auto;display:flex;align-items:center;gap:.4rem;}
  .starbadge{display:flex;align-items:center;gap:.28rem;font-weight:900;font-size:.88rem;border:2.2px solid var(--ink);border-radius:999px;padding:.28rem .62rem;background:var(--paper-2);box-shadow:2px 2px 0 rgba(74,59,50,.15);}
  .starbadge svg{width:1.05rem;height:1.05rem;}
  .iconbtn{position:relative;min-width:2.7rem;min-height:2.7rem;border:2.4px solid var(--ink);border-radius:13px 11px 14px 12px;background:var(--paper-2);display:inline-grid;place-items:center;cursor:pointer;padding:0;box-shadow:2px 2px 0 rgba(74,59,50,.15);transition:transform .1s;}
  .iconbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(0,0,0,0);}
  .iconbtn svg{width:1.28rem;height:1.28rem;}
  .iconbtn.off{opacity:.55;}
  .iconbtn.off::after{content:"";position:absolute;left:50%;top:50%;width:1.7rem;height:2.5px;background:var(--ink);border-radius:2px;transform:translate(-50%,-50%) rotate(-42deg);}

  /* ============ 通用 ============ */
  main{display:block;}
  .book{background:var(--paper-2);border:2.6px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow);position:relative;}
  .book::before{content:"";position:absolute;inset:6px;border:1.6px dashed rgba(74,59,50,.26);border-radius:20px 16px 18px 17px;pointer-events:none;}
  .pad{padding:1.15rem;}
  @media(min-width:760px){ .pad{padding:1.6rem;} }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
    min-height:3.2rem;padding:0 1.15rem;border-radius:16px 13px 15px 14px;
    border:2.6px solid var(--ink);font-family:var(--font-ui);font-size:1.02rem;font-weight:900;color:var(--ink);
    background:var(--paper-2);cursor:pointer;box-shadow:3px 3px 0 rgba(74,59,50,.2);
    transition:transform .1s,box-shadow .1s;text-align:center;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn svg{width:1.15rem;height:1.15rem;flex:0 0 auto;}
  .btn-noun{background:var(--sky);color:#20323a;}
  .btn-verb{background:var(--apricot);color:#3a2110;}
  .btn-adj{background:#8FCFAF;color:#1f3a2e;}
  .btn-butter{background:var(--butter);}
  .btn-lav{background:var(--lav);color:#2a2340;}
  .btn-block{width:100%;}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;}
  h1,h2,h3,h4,p{margin:0;}
  .eyebrow{font-size:.68rem;font-weight:900;letter-spacing:.22em;color:var(--ink-2);}
  .display{font-family:var(--font-ui);font-weight:900;letter-spacing:.01em;}
  .serif{font-family:var(--font-book);}
  .fadeup{animation:fu .34s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes fu{from{opacity:.001;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes pop{from{opacity:.2;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  @media(prefers-reduced-motion:reduce){.fadeup,.pop{animation:none;}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ============ 首頁 ============ */
  .hero{display:grid;gap:1rem;padding:1.2rem 0 .4rem;}
  @media(min-width:820px){ .hero{grid-template-columns:1.15fr .85fr;align-items:center;gap:1.6rem;padding:1.6rem 0 .6rem;} }
  .hero-tag{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:900;letter-spacing:.14em;border:2px solid var(--ink);border-radius:999px;padding:.24rem .7rem;background:var(--paper-2);box-shadow:2px 2px 0 rgba(74,59,50,.14);}
  .hero h1{font-size:clamp(2rem,6.4vw,3.35rem);line-height:1.14;font-weight:900;margin-top:.55rem;}
  .hero h1 em{font-style:normal;position:relative;white-space:nowrap;}
  .hero h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.06em;height:.32em;background:var(--butter);border-radius:40% 60% 45% 55%;z-index:-1;opacity:.85;}
  .hero p.lead{margin-top:.7rem;font-size:1.02rem;line-height:1.8;color:var(--ink-2);max-width:34ch;}
  .heroart{width:100%;max-width:22rem;margin:0 auto;}
  .heroart svg{width:100%;height:auto;display:block;}

  .section-title{display:flex;align-items:center;gap:.7rem;margin:1.5rem 0 .8rem;}
  .section-title h2{font-size:1.25rem;font-weight:900;}
  .section-title .line{flex:1;height:3px;background:repeating-linear-gradient(90deg,rgba(74,59,50,.35) 0 8px,transparent 8px 15px);}

  .shelf{display:grid;gap:.9rem;}
  @media(min-width:820px){ .shelf{grid-template-columns:repeat(3,1fr);gap:1.1rem;} }
  .bookcard{
    position:relative;display:flex;flex-direction:column;gap:.55rem;padding:.85rem .9rem 1rem 1.35rem;
    text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
    background:var(--paper-2);border:2.6px solid var(--ink);border-radius:8px 20px 20px 8px;
    box-shadow:var(--shadow);overflow:hidden;transition:transform .14s;
  }
  .bookcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.55rem;background:var(--spine,var(--sky));border-right:2.4px solid var(--ink);}
  .bookcard::after{content:"";position:absolute;right:-14px;top:-14px;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--tint,#fff);opacity:.55;}
  @media(max-width:430px){ .brand span{display:none;} }
  .bookcard:hover{transform:translateY(-3px) rotate(-.3deg);}
  .bookcard:active{transform:translate(2px,3px);box-shadow:2px 3px 0 rgba(74,59,50,.16);}
  .bc-cover{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--tint,#F4E6CE);}
  .bc-cover svg{display:block;width:100%;height:auto;}
  .bc-top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;}
  .bc-top b{font-size:1.35rem;font-weight:900;line-height:1.1;}
  .bc-top span{font-size:.68rem;font-weight:900;letter-spacing:.12em;color:var(--ink-2);}
  .bc-sub{font-size:.86rem;font-weight:700;color:var(--ink-2);line-height:1.55;}
  .bc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.78rem;font-weight:900;}
  .bc-go{display:inline-flex;align-items:center;gap:.3rem;border-bottom:2px dashed currentColor;padding-bottom:.22rem;}
  .dots{display:inline-flex;gap:4px;}
  .dot{width:.62rem;height:.62rem;border-radius:50%;border:2px solid var(--ink);background:var(--paper-2);display:inline-block;}
  .dot.on{background:var(--butter);}

  .challengecard{
    position:relative;margin-top:1rem;display:flex;flex-direction:column;gap:.7rem;padding:1.15rem;
    border:2.6px solid var(--ink);border-radius:var(--r-hand);cursor:pointer;text-align:left;
    font-family:inherit;color:var(--ink);box-shadow:var(--shadow);
    background:
      radial-gradient(circle at 92% 20%, rgba(169,155,224,.5), transparent 42%),
      radial-gradient(circle at 8% 110%, rgba(247,201,72,.5), transparent 46%),
      var(--paper-2);
    overflow:hidden;
  }
  @media(min-width:760px){ .challengecard{flex-direction:row;align-items:center;justify-content:space-between;gap:1.4rem;} }
  .challengecard:hover{transform:translateY(-2px);}
  .cc-t{font-size:1.45rem;font-weight:900;margin-top:.2rem;}
  .cc-d{font-size:.9rem;line-height:1.7;color:var(--ink-2);margin-top:.25rem;max-width:46ch;}
  .cc-doodle{position:absolute;right:1rem;bottom:-.4rem;width:5.5rem;opacity:.5;pointer-events:none;}

  .badgeshelf{margin-top:1rem;display:grid;gap:.5rem;grid-template-columns:repeat(4,1fr);}
  @media(min-width:700px){ .badgeshelf{grid-template-columns:repeat(7,1fr);} }
  .badge-item{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.5rem .2rem;border:2px dashed rgba(74,59,50,.3);border-radius:14px;background:rgba(255,249,236,.65);text-align:center;}
  .badge-item i{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;border:2px solid rgba(74,59,50,.25);background:#EDE3D2;color:rgba(74,59,50,.35);font-style:normal;font-weight:900;font-size:.92rem;}
  .badge-item.on{border-style:solid;border-color:var(--ink);background:#FFF4D6;}
  .badge-item.on i{background:var(--butter);border-color:var(--ink);color:var(--ink);}
  .badge-item span{font-size:.6rem;font-weight:900;color:var(--ink-2);line-height:1.3;}

  /* ============ 教學頁 ============ */
  .pagehead{display:flex;align-items:center;gap:.7rem;margin:1.1rem 0 .85rem;flex-wrap:wrap;}
  .ribbon{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:900;letter-spacing:.08em;padding:.32rem .8rem;border:2.2px solid var(--ink);border-radius:10px 14px 12px 13px;background:var(--tint,var(--butter));box-shadow:2px 2px 0 rgba(74,59,50,.16);}
  .speakbtn{display:inline-flex;align-items:center;gap:.35rem;border:2.2px solid var(--ink);border-radius:12px;background:var(--paper-2);padding:.36rem .7rem;font-family:inherit;font-size:.82rem;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(74,59,50,.14);margin-left:auto;}
  .speakbtn svg{width:1.05rem;height:1.05rem;}
  .speakbtn:active{transform:translate(2px,2px);}
  .defbox{font-family:var(--font-book);font-size:clamp(1.3rem,4.4vw,1.85rem);line-height:1.6;font-weight:700;padding:.9rem 1rem;border-radius:18px 14px 16px 15px;background:var(--tint,#FFF4D6);border:2.2px dashed rgba(74,59,50,.4);}
  .defbox b{box-shadow:inset 0 -.42em 0 rgba(247,201,72,.65);}
  .ptgrid{display:grid;gap:.65rem;grid-template-columns:1fr;margin-top:.9rem;}
  @media(min-width:640px){ .ptgrid{grid-template-columns:repeat(3,1fr);} }
  .ptcard{display:flex;align-items:center;gap:.7rem;padding:.6rem;border:2.2px solid var(--ink);border-radius:16px 13px 15px 14px;background:#fff;box-shadow:3px 3px 0 rgba(74,59,50,.1);}
  .ptcard .thumb{width:4.2rem;flex:0 0 auto;border-radius:12px;overflow:hidden;border:1.8px solid rgba(74,59,50,.5);background:var(--tint,#F4E6CE);}
  .ptcard .thumb svg{display:block;width:100%;height:auto;}
  .ptcard b{display:block;font-size:1rem;line-height:1.3;}
  .ptcard span{display:block;font-size:.8rem;line-height:1.5;color:var(--ink-2);font-weight:700;margin-top:.1rem;}
  .expage{margin-top:1rem;padding:.85rem .95rem;border:2.2px solid var(--ink);border-radius:16px 20px 15px 18px;background:#FFFDF6;position:relative;}
  .expage::before{content:"例句";position:absolute;top:-.72rem;left:.8rem;font-size:.62rem;font-weight:900;letter-spacing:.16em;background:var(--butter);border:2px solid var(--ink);border-radius:999px;padding:.1rem .5rem;}
  .exline{display:flex;gap:.55rem;align-items:flex-start;padding:.32rem 0;font-family:var(--font-book);font-size:1.02rem;line-height:1.7;}
  .exline+.exline{border-top:1px dashed rgba(74,59,50,.22);}
  .exline i{font-style:normal;width:1.25rem;height:1.25rem;flex:0 0 auto;border-radius:50%;background:var(--tint,#FFE9B8);border:1.8px solid var(--ink);font-size:.66rem;font-weight:900;display:grid;place-items:center;margin-top:.22rem;}
  .exline mark{background:linear-gradient(transparent 52%,rgba(247,201,72,.85) 52%,rgba(247,201,72,.85) 94%,transparent 94%);color:inherit;font-weight:900;padding:0 .1em;}
  .tipnote{margin-top:.9rem;position:relative;padding:.75rem .9rem .75rem 2.6rem;border:2px dashed rgba(74,59,50,.45);border-radius:14px;background:#FFF6E0;font-size:.88rem;line-height:1.7;font-weight:700;color:var(--ink);}
  .tipnote::before{content:"✎";position:absolute;left:.85rem;top:.62rem;width:1.5rem;height:1.5rem;display:grid;place-items:center;background:var(--butter);border:2px solid var(--ink);border-radius:50%;font-size:.85rem;}

  /* ============ 模式選擇 ============ */
  .modes{display:grid;gap:.85rem;margin-top:.4rem;}
  @media(min-width:760px){ .modes{grid-template-columns:1fr 1fr;gap:1.1rem;} }
  .modecard{
    position:relative;display:flex;flex-direction:column;gap:.5rem;text-align:left;padding:.8rem;cursor:pointer;
    background:var(--paper-2);border:2.6px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow);
    font-family:inherit;color:var(--ink);overflow:hidden;
  }
  .modecard:hover{transform:translateY(-2px);}
  .modecard:active{transform:translate(2px,3px);box-shadow:2px 3px 0 rgba(74,59,50,.16);}
  .modecard .cover{border-radius:14px;overflow:hidden;border:2px solid rgba(74,59,50,.35);background:var(--tint,#F4E6CE);}
  .modecard .cover svg{display:block;width:100%;height:auto;}
  .mc-tag{font-size:.66rem;font-weight:900;letter-spacing:.14em;color:var(--ink-2);}
  .mc-t{font-size:1.3rem;font-weight:900;line-height:1.25;}
  .mc-d{font-size:.86rem;line-height:1.65;color:var(--ink-2);}
  .mc-f{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.2rem;font-size:.76rem;font-weight:900;}

  /* ============ 遊戲 ============ */
  .gamebar{display:flex;align-items:center;gap:.55rem;padding:.8rem 0 .3rem;flex-wrap:wrap;}
  .pagenum{font-size:.72rem;font-weight:900;letter-spacing:.1em;color:var(--ink-2);white-space:nowrap;}
  .rail{display:flex;gap:4px;flex:1;min-width:6rem;}
  .rail i{flex:1;height:.62rem;border-radius:999px;border:1.8px solid var(--ink);background:var(--paper-2);}
  .rail i.done{background:var(--butter);}
  .rail i.now{background:var(--tint,var(--sky));}
  .qwrap{padding:.4rem 0 0;}
  .qtitle{font-family:var(--font-book);font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:700;line-height:1.6;margin-top:.5rem;}
  .qtitle b{box-shadow:inset 0 -.4em 0 rgba(247,201,72,.55);}
  .stage{display:grid;gap:.9rem;margin-top:.7rem;}
  @media(min-width:820px){ .stage{grid-template-columns:1.05fr 1fr;align-items:start;gap:1.4rem;} }

  .frame{position:relative;padding:.55rem;background:var(--paper-2);border:2.6px solid var(--ink);border-radius:6px 18px 18px 18px;box-shadow:var(--shadow);}
  .frame::before{content:"";position:absolute;top:-.62rem;left:1.3rem;width:3.6rem;height:1.15rem;background:rgba(247,201,72,.72);border:1.5px solid rgba(74,59,50,.25);transform:rotate(-3deg);border-radius:2px;}
  .frame .canvas{border-radius:12px;overflow:hidden;border:1.8px solid rgba(74,59,50,.4);background:#F4E6CE;}
  .frame .canvas svg{display:block;width:100%;height:auto;}
  .artcap{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.45rem .25rem .1rem;font-size:.72rem;font-weight:900;color:var(--ink-2);letter-spacing:.06em;}
  .artcap b{font-family:var(--font-book);font-size:.98rem;color:var(--ink);letter-spacing:.04em;}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.7rem;}
  .opt{
    position:relative;min-height:4.3rem;padding:.6rem .5rem;border:2.5px solid var(--ink);border-radius:16px 13px 15px 14px;
    background:var(--paper-2);font-family:var(--font-book);font-size:clamp(1.12rem,4vw,1.42rem);font-weight:700;color:var(--ink);
    cursor:pointer;box-shadow:3px 3px 0 rgba(74,59,50,.15);display:flex;align-items:center;justify-content:center;gap:.4rem;
    transition:transform .1s,background .2s,border-color .2s;
  }
  .opt:hover{background:#FFFDF3;}
  .opt:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(0,0,0,0);}
  .opt .num{position:absolute;left:.45rem;top:.3rem;font-family:var(--font-ui);font-size:.62rem;font-weight:900;color:var(--ink-3);}
  .opt .mk{position:absolute;right:.5rem;top:.3rem;font-size:.9rem;font-weight:900;}
  .opt.ok{background:#E4F6EA;border-color:#3E8A62;box-shadow:3px 3px 0 rgba(62,138,98,.3);}
  .opt.no{background:#FDE7E4;border-color:#C05B4D;box-shadow:3px 3px 0 rgba(192,91,77,.3);}
  .opt:disabled{cursor:default;}

  .paperstrip{margin-top:.7rem;padding:.85rem .75rem;border:2.4px solid var(--ink);border-radius:5px 16px 5px 16px;background:
    repeating-linear-gradient(180deg,transparent 0 2.35rem,rgba(143,199,219,.28) 2.35rem calc(2.35rem + 1.5px)),#FFFDF6;
    box-shadow:var(--shadow);min-height:7rem;}
  .tokens{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.15rem .1rem;line-height:2.5;}
  .tok{
    display:inline-block;border:2px solid transparent;background:transparent;border-radius:9px;
    padding:.06rem .18rem;margin:0;font-family:var(--font-book);font-size:clamp(1.1rem,3.9vw,1.4rem);font-weight:700;color:var(--ink);
    cursor:pointer;transition:background .15s,border-color .15s;
  }
  .tok.sel{background:#EAF3F7;border-color:var(--sky-d);}
  .tok.ok{background:#E4F6EA;border-color:#3E8A62;}
  .tok.no{background:#FDE7E4;border-color:#C05B4D;}
  .tok.punct{cursor:default;opacity:.8;}
  .tok:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px;}

  .hintline{font-size:.74rem;font-weight:800;color:var(--ink-2);margin-top:.55rem;display:flex;align-items:center;gap:.4rem;}
  .hintline::before{content:"";width:1.1rem;height:1.1rem;border-radius:50%;background:var(--butter);border:1.6px solid var(--ink);flex:0 0 auto;}

  .fb{margin-top:.8rem;border:2.6px solid var(--ink);border-radius:18px 15px 17px 16px;padding:.8rem .9rem;background:#FFFDF5;box-shadow:var(--shadow-sm);}

/* =========================================================
   音效（Web Audio 即時合成，無外部音檔）與粵語朗讀
   ========================================================= */
let actx = null;
function ensureAudio(){
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur, type, vol, delay){
  if(!S.sound) return;
  const c = ensureAudio(); if(!c) return;
  try{
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.09, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){ /* 音效失敗不影響遊戲 */ }
}

const hasSpeech = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
function pickVoice(){
  try{
    const vs = window.speechSynthesis.getVoices() || [];
    const pref = ['yue-HK','zh-HK','zh_TW','zh-TW','zh-Hant'];
    for(let i=0;i<pref.length;i++){
      const v = vs.find(function(x){ return (x.lang||'').replace('_','-').indexOf(pref[i].replace('_','-')) === 0; });
      if(v) return v;
    }
  }catch(e){}
  return null;
}
function speak(text){
  if(!hasSpeech || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    u.lang = v ? v.lang : 'zh-HK';
    if(v) u.voice = v;
    u.rate = 0.86; u.pitch = 1.08;
    window.speechSynthesis.speak(u);
  }catch(e){ /* 語音不可用時靜靜降級 */ }
}

    + '<span class="mc-t" style="color:' + m.deep + '">句子尋寶</span>'
    + '<span class="mc-d">在句子中點出所有' + m.label + '，可以選多於一個，再按「確認答案」。</span>'
    + '<span class="mc-f"><span style="color:' + m.deep + '">已獲 ' + b + ' / 3 星</span>' + dots(b) + '</span>'
    + '</button>'
    + '</div>'
    + '<div class="row" style="margin-top:.9rem">'
    + '<button class="btn" style="flex:1 1 8rem" data-act="teach" data-type="' + S.type + '">重看教學卡</button>'
    + '<button class="btn" style="flex:1 1 8rem" data-act="home">返回繪本架</button>'
    + '</div>'
    + '<div class="pagefoot">' + m.book + ' · 2</div>'
    + '</div>';
  updateBadge();
}
</script>
<script>
/* =========================================================
   遊戲頁
   ========================================================= */
function currentQs(){ return S.mode === 'A' ? DATA[S.type].modeA : DATA[S.type].modeB; }
function isCorrect(q){
  if(S.mode === 'A') return S.picked[0] === q.ans;
  const a = S.picked.slice().sort(function(x,y){return x-y;}).join(',');
  const b = q.ans.slice().sort(function(x,y){return x-y;}).join(',');
  return a === b;
}
function answerText(q){
  if(S.mode === 'A') return q.opts[q.ans];
  return q.ans.map(function(i){ return q.tokens[i]; }).join('、');
}

function renderGame(){
  const m = TYPE_META[S.type], qs = currentQs(), q = qs[S.idx], locked = S.locked;
  let rail = '';
  for(let i=0;i<qs.length;i++){
    rail += '<i class="' + (i < S.idx ? 'done' : (i === S.idx ? 'now' : '')) + '" style="--tint:' + m.color + '"></i>';
  }
  let body = '', fb = '';

  if(S.mode === 'A'){
    const opts = q.opts.map(function(o,i){
      let cls = 'opt', mk = '';
      if(locked){
        if(i === q.ans){ cls += ' ok'; mk = '<span class="mk">✓</span>'; }
        else if(S.picked.indexOf(i) > -1){ cls += ' no'; mk = '<span class="mk">✕</span>'; }
      }
      return '<button class="' + cls + '" data-act="opt" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>'
        + '<span class="num">' + (i+1) + '</span>' + esc(o) + mk + '</button>';
    }).join('');

    body = '<div class="stage">'
      + '<div class="frame"><div class="canvas">' + sceneSvg(q.art, m.tint) + '</div>'
      + '<div class="artcap"><span>' + m.label + ' · 第 ' + (S.idx+1) + ' 題</span><b>' + (locked ? esc(q.opts[q.ans]) : '？') + '</b></div></div>'
      + '<div>'
      + '<div class="opts">' + opts + '</div>'
      + '<p class="hintline">' + (locked ? '答案已揭曉，看看解說吧。' : '先看圖，再選出正確的' + m.label + '。') + '</p>'
      + '</div></div>';
  } else {
    const toks = q.tokens.map(function(t,i){
      const punct = /^[，。、！？；：]$/.test(t);
      if(punct) return '<span class="tok punct">' + esc(t) + '</span>';
      let cls = 'tok';
      if(locked){
        const should = q.ans.indexOf(i) > -1;
        if(should) cls += ' ok';
        else if(S.picked.indexOf(i) > -1) cls += ' no';
      } else if(S.picked.indexOf(i) > -1){ cls += ' sel'; }
      return '<button class="' + cls + '" data-act="tok" data-i="' + i + '" aria-pressed="' + (S.picked.indexOf(i) > -1) + '">' + esc(t) + '</button>';
    }).join('');

    body = '<div class="paperstrip" role="group" aria-label="句子，點選' + m.label + '">'
      + '<div class="tokens">' + toks + '</div></div>'
      + '<p class="hintline">' + (locked ? '綠色是正確答案，紅色是你多選的詞。' : '可以點多於一個詞；已選 ' + S.picked.length + ' 個。') + '</p>'
      + (locked ? '' : '<button class="btn btn-block" style="margin-top:.6rem;background:' + m.color + ';color:#fff" data-act="confirm">確認答案</button>');
  }

  if(locked){
    const good = isCorrect(q);
    fb = '<div class="fb ' + (good ? 'ok' : 'no') + '" role="status" aria-live="polite">'
      + '<div class="fb-h"><span class="ico">' + (good ? '✓' : '✕') + '</span>' + (good ? '答對了！' : '差一點！') + '</div>'
      + '<p class="fb-ans"><b>正確答案：</b>' + esc(answerText(q)) + '</p>'
      + '<p class="fb-exp"><b>為甚麼：</b>' + q.exp + '</p>'
      + '<div class="fb-tools">'
      + (hasSpeech ? '<button class="chip" data-act="speak" data-text="' + esc(q.exp) + '">🔊 讀出解說</button>' : '')
      + '<button class="chip" data-act="speak" data-text="' + esc(q.q || '點出句子中的' + m.label) + ' ' + esc(answerText(q)) + '">🔊 讀出答案</button>'
      + '</div>'
      + '<button class="btn btn-block" style="margin-top:.6rem;background:' + (good ? '#8FCFAF' : '#F7C948') + '" data-act="next">'
      + (S.idx === qs.length - 1 ? '看成績' : '下一題') + '</button>'
      + '</div>';
  }

  app.innerHTML = '<div class="screen fadeup">'
    + '<div class="gamebar"><span class="pagenum">第 ' + (S.idx+1) + ' / ' + qs.length + ' 頁</span><div class="rail">' + rail + '</div></div>'
    + '<p class="qtitle">' + (S.mode === 'A' ? q.q : '點出句子中所有的' + m.label + '。') + '</p>'
    + body + fb
    + '<div class="pagefoot">' + m.book + ' · ' + (S.mode === 'A' ? m.modeA : '句子尋寶') + '</div>'
    + '</div>';
  updateBadge();
}

/* =========================================================
   結算
   ========================================================= */
function starsFor(score, total){
  const pct = score / total;
  if(pct >= 0.9) return 3;
  if(pct >= 0.7) return 2;
  if(pct >= 0.5) return 1;
  return 0;
}
function saveStars(key, n){
  if((Number(S.stars[key]) || 0) < n){
    S.stars[key] = n;
    writeStorage('wd2_stars', JSON.stringify(S.stars));
  }
}
function renderResult(){
  const m = TYPE_META[S.type];
  const total = currentQs().length;
  const stars = starsFor(S.score, total);
  saveStars(S.type + '_' + S.mode, stars);
  updateBadge();
  const title = stars === 3 ? '偵探級表現！' : (stars === 2 ? '做得很好！' : (stars === 1 ? '完成任務！' : '再試一次會更好'));
  const wrongHtml = S.wrong.length
    ? '<div class="wronglist"><h3>要留意的 ' + S.wrong.length + ' 題</h3>' + S.wrong.map(function(w){
        return '<div class="wrow"><span class="wtag">第' + w.no + '題</span><span><b>' + esc(w.ans) + '</b>：' + w.exp + '</span></div>';
      }).join('') + '</div>'
    : '<p class="rsub" style="margin-top:.7rem">全部答對，很厲害！</p>';

  app.innerHTML = '<div class="book result fadeup">'
    + '<p class="eyebrow">' + m.label + ' · ' + (S.mode === 'A' ? '模式一' : '模式二') + '</p>'
    + '<h2 class="display" style="margin-top:.3rem">' + title + '</h2>'
    + starRow(stars)
    + '<p class="rsub">答對 ' + S.score + ' / ' + total + ' 題</p>'
    + '<div class="statrow">'
    + '<div class="stat"><b style="color:' + m.deep + '">' + Math.round(S.score/total*100) + '%</b><span>正確率</span></div>'
    + '<div class="stat"><b style="color:#B8860B">' + stars + '</b><span>本輪星星</span></div>'
    + '<div class="stat"><b style="color:#5B4E86">' + starTotal() + '</b><span>累積星星</span></div>'
    + '</div>'
    + wrongHtml
    + '<div class="btnrow">'
    + '<button class="btn" style="background:' + m.color + ';color:#fff" data-act="again">再玩一次</button>'
    + '<button class="btn" data-act="modes" data-type="' + S.type + '">選其他模式</button>'
    + '</div>'
    + '<div class="btnrow"><button class="btn btn-block" data-act="home">返回繪本架</button></div>'
    + '<div class="pagefoot">' + m.book + ' · 完</div>'
    + '</div>';
}

/* =========================================================
   辨析挑戰
   ========================================================= */
const CH_COLS = [
  {t:'名詞', sub:'人 · 事 · 物 · 地', color:'#3F7E97', tint:'#DCEEF5', icon:'<circle cx="9" cy="9" r="3.4"/><path d="M3 20c0-3.6 2.7-5.8 6-5.8s6 2.2 6 5.8"/>'},
  {t:'動詞', sub:'動作 · 行為', color:'#C46A2A', tint:'#FBE3CC', icon:'<circle cx="14" cy="5" r="2.2"/><path d="M13 8l-3.4 5.4 3.6 2.2 1.4 5.4M9.6 13.4l-3 2M13.2 15.6l-3.6 5.4M17 9.4l3.6 2"/>'},
  {t:'形容詞', sub:'樣子 · 感覺', color:'#3F8A6B', tint:'#DDF2E7', icon:'<path d="M12 3.5l2.6 5.2 5.6.8-4.1 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4.1-4 5.6-.8z"/>'}
];

function renderChallenge(){
  if(S.idx >= CHALLENGE.length){ renderCResult(); return; }
  const q = CHALLENGE[S.idx];
  const opts = CH_COLS.map(function(c,i){
    let cls = 'opt', mk = '';
    if(S.locked){
      if(i === q.ans){ cls += ' ok'; mk = '<span class="mk">✓</span>'; }
      else if(S.picked.indexOf(i) > -1){ cls += ' no'; mk = '<span class="mk">✕</span>'; }
    }
    return '<button class="' + cls + '" data-act="copt" data-i="' + i + '"' + (S.locked ? ' disabled' : '') + ' style="background:' + (S.locked && i === q.ans ? '#E4F6EA' : c.tint) + ';border-color:' + INK + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="' + c.color + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + c.icon + '</svg>'
      + '<span style="color:' + c.color + '">' + c.t + '</span><small>' + c.sub + '</small>' + mk + '</button>';
  }).join('');

  let fb = '';
  if(S.locked){
    const good = S.picked[0] === q.ans;
    fb = '<div class="fb ' + (good ? 'ok' : 'no') + '" role="status" aria-live="polite">'
      + '<div class="fb-h"><span class="ico">' + (good ? '✓' : '✕') + '</span>' + (good ? '答對了！' : '正確答案是「' + CH_COLS[q.ans].t + '」') + '</div>'
      + '<p class="fb-exp"><b>為甚麼：</b>' + q.exp + '</p>'
      + '<div class="fb-tools"><span class="chip">小測試：' + q.test + '</span>'
      + (hasSpeech ? '<button class="chip" data-act="speak" data-text="' + esc(q.word + '。' + q.exp) + '">🔊 讀出解說</button>' : '')
      + '</div>'
      + '<button class="btn btn-block" style="margin-top:.6rem;background:#B7A8EE" data-act="cnext">'
      + (S.idx === CHALLENGE.length - 1 ? '看成績' : '下一題') + '</button>'
      + '</div>';
  }

  app.innerHTML = '<div class="screen fadeup">'
    + '<div class="cbar"><span>辨析詞性挑戰</span>'
    + '<span class="combo"><svg viewBox="0 0 24 24" fill="#F7C948" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>連擊 <b>' + S.combo + '</b></span></div>'
    + '<div class="rail" style="margin:.2rem 0 .5rem">'
    + CHALLENGE.map(function(_,i){ return '<i class="' + (i < S.idx ? 'done' : (i === S.idx ? 'now' : '')) + '" style="--tint:#A99BE0"></i>'; }).join('')
    + '</div>'
    + '<p class="hintline" style="margin-top:0">第 ' + (S.idx+1) + ' / ' + CHALLENGE.length + ' 題</p>'
    + '<div class="wordcard"><p class="big">' + esc(q.word) + '</p><p class="sub">這是甚麼詞性？</p></div>'
    + '<div class="three">' + opts + '</div>'
    + fb
    + '<div class="pagefoot">辨析挑戰 · ' + (S.idx+1) + '</div>'
    + '</div>';
}

function renderCResult(){
  const total = CHALLENGE.length;
  const pct = Math.round(S.correct / total * 100);
  const stars = starsFor(S.correct, total);
  saveStars('challenge', stars);
  updateBadge();
  const title = pct >= 90 ? '詞性大師！' : (pct >= 70 ? '很不錯！' : (pct >= 50 ? '繼續加油！' : '再練習一下'));
  app.innerHTML = '<div class="book result fadeup">'
    + '<p class="eyebrow">辨析詞性挑戰</p>'
    + '<h2 class="display" style="margin-top:.3rem">' + title + '</h2>'
    + starRow(stars)
    + '<p class="rsub">答對 ' + S.correct + ' / ' + total + ' 題</p>'
    + '<div class="statrow">'
    + '<div class="stat"><b style="color:#5B4E86">' + pct + '%</b><span>正確率</span></div>'
    + '<div class="stat"><b style="color:#B8860B">' + S.maxCombo + '</b><span>最高連擊</span></div>'
    + '<div class="stat"><b style="color:#2C5F73">' + starTotal() + '</b><span>累積星星</span></div>'
    + '</div>'
    + '<p class="rsub">小提示：判斷詞性時，可以試試「加一個」——加「一個」的是名詞，加「正在」的是動詞，加「很」的是形容詞。</p>'
    + '<div class="btnrow">'
    + '<button class="btn" style="background:#B7A8EE" data-act="gochallenge">再挑戰</button>'
    + '<button class="btn" data-act="home">返回繪本架</button>'
    + '</div>'
    + '<div class="pagefoot">辨析挑戰 · 完</div>'
    + '</div>';
}

/* =========================================================
   流程
   ========================================================= */
function arrangeOptions(){
  ['noun','verb','adj'].forEach(function(k){
    DATA[k].modeA.forEach(function(q,i){
      if(q._arranged) return;
      var n = q.opts.length, off = i % n;
      q.opts = q.opts.slice(off).concat(q.opts.slice(0,off));
      q.ans = (q.ans - off + n) % n;
      q._arranged = true;
    });
  });
}
function startGame(type, mode){
  arrangeOptions();
  S.type = type; S.mode = mode;
  S.idx = 0; S.score = 0; S.wrong = []; S.picked = []; S.locked = false;
  go('game');
}
function startChallenge(){
  S.idx = 0; S.combo = 0; S.maxCombo = 0; S.correct = 0;
  S.picked = []; S.locked = false;
  go('challenge');
}
function render(){
  if(S.view === 'home') return renderHome();
  if(S.view === 'teach') return renderTeach();
  if(S.view === 'modes') return renderModes();
  if(S.view === 'game') return renderGame();
  if(S.view === 'result') return renderResult();
  if(S.view === 'challenge') return renderChallenge();
  if(S.view === 'cresult') return renderCResult();
}

app.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'teach'){ sfx.turn(); S.type = el.dataset.type || S.type; go('teach'); return; }
  if(act === 'modes'){ if(el.dataset.type) S.type = el.dataset.type; sfx.tap(); go('modes'); return; }
  if(act === 'home'){ sfx.turn(); go('home'); return; }
  if(act === 'start'){ sfx.turn(); startGame(S.type, el.dataset.mode); return; }
  if(act === 'again'){ sfx.turn(); startGame(S.type, S.mode); return; }
  if(act === 'gochallenge'){ sfx.turn(); startChallenge(); return; }
  if(act === 'speak'){ speak(el.dataset.text || ''); return; }

  if(act === 'opt'){
    if(S.locked) return;
    S.picked = [parseInt(el.dataset.i,10)];
    S.locked = true;
    const q = currentQs()[S.idx];
    if(isCorrect(q)){ S.score++; sfx.ok(); }
    else{
      sfx.no();
      S.wrong.push({no:S.idx+1, ans:answerText(q), exp:q.exp});
    }
    render(); return;
  }

  if(act === 'tok'){
    if(S.locked) return;
    const i = parseInt(el.dataset.i,10);
    const pos = S.picked.indexOf(i);
    if(pos > -1) S.picked.splice(pos,1); else S.picked.push(i);
    sfx.pick();
    render(); return;
  }

  if(act === 'confirm'){
    if(S.locked) return;
    if(S.picked.length === 0){ sfx.no(); return; }
    S.locked = true;
    const q = currentQs()[S.idx];
    if(isCorrect(q)){ S.score++; sfx.ok(); }
    else{
      sfx.no();
      S.wrong.push({no:S.idx+1, ans:answerText(q), exp:q.exp});
    }
    render(); return;
  }

  if(act === 'next'){
    if(S.idx < currentQs().length - 1){
      S.idx++; S.picked = []; S.locked = false; sfx.tap(); go('game');
    }else{
      sfx.win(); go('result');
    }
    return;
  }

  if(act === 'copt'){
    if(S.locked) return;
    const i = parseInt(el.dataset.i,10);
    S.picked = [i]; S.locked = true;
    if(i === CHALLENGE[S.idx].ans){
      S.correct++; S.combo++;
      if(S.combo > S.maxCombo) S.maxCombo = S.combo;
      sfx.ok();
    }else{
      S.combo = 0; sfx.no();
    }
    render(); return;
  }

  if(act === 'cnext'){
    S.idx++; S.picked = []; S.locked = false; sfx.tap();
    if(S.idx >= CHALLENGE.length){ sfx.win(); go('cresult'); }
    else render();
    return;
  }
});

/* 鍵盤操作（電腦端）：1–4 選答案，Enter 下一題 */
document.addEventListener('keydown', function(e){
  if(e.key >= '1' && e.key <= '4'){
    if(S.view === 'game' && !S.locked){
      const q = currentQs()[S.idx];
      if(S.mode === 'A'){
        const i = parseInt(e.key,10) - 1;
        if(i < q.opts.length){ const btn = app.querySelector('.opt[data-i="' + i + '"]'); if(btn) btn.click(); }
      }
    }else if(S.view === 'challenge' && !S.locked){
      const i = parseInt(e.key,10) - 1;
      if(i < 3){ const btn = app.querySelector('.opt[data-i="' + i + '"]'); if(btn) btn.click(); }
    }
  }
  if(e.key === 'Enter'){
    if(S.view === 'game' && S.locked){ const b = app.querySelector('[data-act="next"]'); if(b) b.click(); }
    else if(S.view === 'challenge' && S.locked){ const b = app.querySelector('[data-act="cnext"]'); if(b) b.click(); }
    else if(S.view === 'game' && S.mode === 'B' && S.picked.length){ const b = app.querySelector('[data-act="confirm"]'); if(b) b.click(); }
  }
});

/* 頂欄按鈕 */
document.getElementById('homeBtn').addEventListener('click', function(){ sfx.turn(); S.locked = false; go('home'); });
const soundBtn = document.getElementById('soundBtn');
soundBtn.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
soundBtn.classList.toggle('off', !S.sound);
soundBtn.addEventListener('click', function(){
  S.sound = !S.sound;
  writeStorage('wd2_sound', S.sound ? '1' : '0');
  this.classList.toggle('off', !S.sound);
  this.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  if(S.sound){ ensureAudio(); sfx.ok(); }
  else if(hasSpeech){ try{ window.speechSynthesis.cancel(); }catch(e){} }
});

/* 啟動 */
render();
updateBadge();
</script>
</body>
</html>
