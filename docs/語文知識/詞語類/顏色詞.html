<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>顏色小宇宙 · 和阿彩收集色精靈</title>
<meta name="description" content="初小版與高小版顏色詞互動遊戲：看圖選色、句子尋寶、顏色分類、精準選色、疊詞填空、成語補色，全繁體字，Q版手繪風，手機可直接玩。">
<meta name="theme-color" content="#FFF7E6">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --paper:#FFF7E6;
  --paper2:#FFFDF7;
  --ink:#3A342C;
  --ink-soft:#6B6153;
  --ink-faint:#A2947F;
  --coral:#E8674F;
  --sun:#F4BE45;
  --mint:#5FAE83;
  --sky:#4E93C4;
  --grape:#8B6BB1;
  --pink:#F08FA8;
  --brown:#A9744F;
  --gold:#D9A227;
  --line:rgba(58,52,44,.14);
  --shadow:4px 5px 0 rgba(58,52,44,.13);
  --shadow-sm:2px 3px 0 rgba(58,52,44,.12);
  --r-card:26px 20px 28px 22px;
  --r-btn:17px 15px 19px 16px;
  --font-hand:"Kaiti TC","BiauKai","DFKai-SB","KaiTi","STKaiti","Noto Serif TC",serif;
  --font-body:"PingFang TC","Hiragino Sans CNS","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --accent:#E8674F;
  --accent-soft:#FDE3DA;
  --accent-deep:#B8432F;
}
body[data-ver="high"]{
  --accent:#2F8F8A;
  --accent-soft:#D9F0EC;
  --accent-deep:#1F6662;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 8% 3%, rgba(232,103,79,.15), transparent 38%),
    radial-gradient(circle at 94% 0%, rgba(78,147,196,.14), transparent 36%),
    radial-gradient(circle at 50% 103%, rgba(244,190,69,.17), transparent 44%),
    radial-gradient(rgba(58,52,44,.10) 1.1px, transparent 1.1px);
  background-size:auto,auto,auto,22px 22px;
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:14px}
[hidden]{display:none!important}
svg{display:block}
::selection{background:var(--accent-soft)}
.app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
.screen{display:none}
.screen.is-active{display:block;animation:screenIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{transform:translateY(8px)}to{transform:translateY(0)}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft)}
.brand-mark{
  width:38px;height:38px;flex:none;display:grid;place-items:center;
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:13px 15px 12px 16px;box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:23px;height:23px}
.icon-btn{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:14px 16px 13px 17px;box-shadow:var(--shadow-sm);
  transition:transform .12s ease,box-shadow .12s ease;
}
.icon-btn:active{transform:translate(2px,3px);box-shadow:none}
.icon-btn svg{width:21px;height:21px}
.ic{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{fill:currentColor;stroke:none}

/* ---------- home ---------- */
.hero-title{
  font-family:var(--font-hand);
  font-size:clamp(42px,12.4vw,64px);
  line-height:1.06;
  letter-spacing:.01em;
  margin:16px 0 8px;
  font-weight:700;
}
.hero-title .hl{position:relative;display:inline-block;color:var(--accent-deep);isolation:isolate}
.hero-title .hl::after{
  content:"";position:absolute;left:-6px;right:-7px;bottom:4px;height:16px;z-index:-1;
  background:var(--accent-soft);border-radius:44% 56% 48% 52%/62% 38% 62% 38%;
  transform:rotate(-1.6deg);
}
.lede{margin:0 0 16px;font-size:15.5px;line-height:1.72;color:var(--ink-soft);max-width:34em}
.hero{display:flex;align-items:flex-end;gap:12px;margin:4px 0 18px}
.mascot{width:104px;flex:none;animation:bob 4.6s ease-in-out infinite;transform-origin:50% 92%}
.mascot svg{width:100%;height:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.speech{
  position:relative;flex:1;min-width:0;
  font-family:var(--font-hand);font-size:16px;line-height:1.6;
  background:var(--paper2);border:2.5px solid var(--ink);
  border-radius:8px 18px 18px 18px;padding:11px 13px;box-shadow:var(--shadow-sm);
  transform:rotate(.7deg);
}
.speech b{color:var(--accent-deep)}
.speech::before{
  content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;
  background:var(--paper2);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);
  transform:rotate(45deg);
}

.version-switch{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding:5px;margin:0 0 18px;
  background:rgba(255,253,247,.78);border:2.5px solid var(--ink);
  border-radius:21px 18px 23px 19px;box-shadow:var(--shadow-sm);
}
.version-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:9px 12px;border-radius:15px 13px 16px 14px;
  border:2.5px solid transparent;background:transparent;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .12s ease;
}
.version-btn:active{transform:scale(.985)}
.version-btn .v-name{font-family:var(--font-hand);font-size:19px;font-weight:700;line-height:1.25;letter-spacing:.02em}
.version-btn .v-sub{font-size:11px;line-height:1.4;color:var(--ink-faint);font-weight:600}
.version-btn.is-active{background:var(--accent-soft);border-color:var(--ink);box-shadow:2px 2px 0 rgba(58,52,44,.10)}
.version-btn.is-active .v-sub{color:var(--accent-deep)}

.mode-list{display:flex;flex-direction:column;gap:13px}
.mode-card{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r-card);
  padding:14px 13px;box-shadow:var(--shadow);overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease;
}
.mode-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,var(--ms) 0%,transparent 58%);
  opacity:.72;
}
.mode-card > *{position:relative;z-index:1}
.mode-card:hover{transform:translateY(-2px);box-shadow:5px 7px 0 rgba(58,52,44,.13)}
.mode-card:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(58,52,44,.14)}
.mode-icon{
  flex:none;width:58px;height:58px;display:grid;place-items:center;
  background:#fff;border:2.5px solid var(--ink);border-radius:18px 15px 19px 16px;
  box-shadow:2px 2px 0 rgba(58,52,44,.10);
}
.mode-icon svg{width:36px;height:36px}
.mode-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mode-name{font-family:var(--font-hand);font-size:21px;font-weight:700;line-height:1.2;letter-spacing:.02em}
.mode-desc{font-size:13px;line-height:1.45;color:var(--ink-soft)}
.mode-stars{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.mode-stars svg{width:13px;height:13px;color:#D9A227}
.mode-stars .off{color:rgba(58,52,44,.20)}
.mode-go{
  flex:none;width:32px;height:32px;display:grid;place-items:center;
  border:2.5px solid var(--ink);border-radius:50%;background:#fff;
}
.mode-go svg{width:16px;height:16px}
.home-album{margin-top:16px}
.album-strip{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 12px;background:var(--paper2);border:2.5px solid var(--ink);
  border-radius:20px 16px 22px 17px;box-shadow:var(--shadow-sm);text-align:left;
}
.album-avatars{display:flex;flex:none;padding-left:2px}
.album-avatars .mini{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);
  margin-left:-7px;background:#fff;overflow:hidden;display:grid;place-items:center;
}
.album-avatars .mini:first-child{margin-left:0}
.album-avatars .mini svg{width:26px;height:26px}
.album-avatars .mini.empty{background:rgba(58,52,44,.07);color:var(--ink-faint)}
.album-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.album-info strong{font-family:var(--font-hand);font-size:16px;letter-spacing:.02em}
.album-info span{font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.home-note{margin:16px 2px 0;font-size:12px;line-height:1.6;color:var(--ink-faint);text-align:center}

/* ---------- game ---------- */
#screen-game{max-width:760px;margin:0 auto}
.game-top{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.game-heading{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px}
.game-heading h2{font-family:var(--font-hand);font-size:20px;line-height:1.2;margin:0;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;
  padding:3px 7px;border:2px solid var(--ink);border-radius:999px;
  background:var(--accent-soft);color:var(--accent-deep);white-space:nowrap;
}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 3px 12px}
.dots{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(58,52,44,.15);border:1.5px solid rgba(58,52,44,.18);transition:all .2s}
.dot.is-done{background:var(--accent);border-color:var(--ink)}
.dot.is-now{width:24px;border-radius:99px;background:var(--accent-soft);border-color:var(--ink)}
.score-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;background:var(--paper2);border:2px solid var(--ink);border-radius:999px;
  font-size:12px;font-weight:800;box-shadow:2px 2px 0 rgba(58,52,44,.09);
}
.score-pill svg{width:13px;height:13px;color:#D9A227}
.q-card{
  position:relative;background:var(--paper2);border:2.5px solid var(--ink);
  border-radius:28px 22px 30px 24px;box-shadow:var(--shadow);
  padding:15px 15px 17px;animation:cardIn .34s cubic-bezier(.2,.8,.2,1);
}
@keyframes cardIn{from{transform:translateY(10px) rotate(.2deg)}to{transform:translateY(0) rotate(0)}}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.q-count{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-soft)}
.q-tag{
  font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 8px;
  border:2px solid var(--ink);border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);
}
.q-visual{
  position:relative;display:grid;place-items:center;height:148px;
  border:2.5px solid var(--ink);border-radius:20px 24px 18px 22px;
  background:radial-gradient(circle at 50% 42%, #fff 0%, var(--accent-soft) 100%);
  overflow:hidden;margin-bottom:13px;
}
.q-visual::before,.q-visual::after{
  content:"";position:absolute;width:48px;height:17px;
  background:rgba(244,190,69,.52);border:1.5px solid rgba(58,52,44,.16);
}
.q-visual::before{top:-8px;left:18px;transform:rotate(-5deg)}
.q-visual::after{top:-8px;right:18px;transform:rotate(4deg)}
.q-visual svg{width:auto;height:130px;max-width:84%}
.q-text{
  font-family:var(--font-hand);font-size:21px;line-height:1.5;font-weight:700;
  margin:0 0 13px;text-align:center;letter-spacing:.02em;
}
.q-text.is-long{font-size:18px;line-height:1.68;text-align:left;letter-spacing:.01em}
.opts{display:grid;gap:8px}
.opts-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts-char .opt{font-size:24px}
.opt{
  position:relative;min-height:54px;padding:8px 5px;
  background:#fff;border:2.5px solid var(--ink);border-radius:15px 13px 17px 14px;
  box-shadow:var(--shadow-sm);font-family:var(--font-hand);font-size:18px;font-weight:700;
  line-height:1.25;transition:transform .12s ease,box-shadow .12s ease,background .18s ease;
}
.opt:hover{transform:translateY(-1px)}
.opt:active{transform:translate(1px,2px);box-shadow:none}
.opt.is-right{background:#E5F7EC;border-color:#2F7D5B;color:#1D5A3D;animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
.opt.is-wrong{background:#FBE5DD;border-color:#B8432F;color:#8E3222;animation:shake .34s}
.opt.is-dim{opacity:.55}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* hunt */
.sentence-wrap{
  position:relative;padding:16px 14px 14px;
  border:2.5px dashed rgba(58,52,44,.42);border-radius:18px 15px 20px 16px;
  background:linear-gradient(180deg,#fff, #FFFCF2);
}
.sentence{font-family:var(--font-hand);font-size:23px;line-height:1.9;letter-spacing:.03em;text-align:center}
.sentence mark{
  background:var(--accent-soft);color:var(--accent-deep);
  border-bottom:3px solid var(--accent);padding:0 2px;border-radius:5px;
  animation:pop .35s;
}
.hunt-sticker{position:absolute;right:7px;bottom:9px;width:52px;height:52px;transform:rotate(4deg);opacity:.95}
.hunt-sticker svg{width:52px;height:52px}
.hunt-hint{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.hunt-hint svg{width:14px;height:14px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.chip-btn{
  min-height:48px;padding:7px 8px;background:#fff;border:2.5px solid var(--ink);
  border-radius:14px 12px 16px 13px;box-shadow:var(--shadow-sm);
  font-size:16px;font-weight:700;transition:transform .12s,box-shadow .12s;
}
.chip-btn:active{transform:translate(1px,2px);box-shadow:none}
.chip-btn.is-right{background:#E5F7EC;border-color:#2F7D5B;color:#1D5A3D;animation:pop .32s}
.chip-btn.is-wrong{background:#FBE5DD;border-color:#B8432F;color:#8E3222;animation:shake .34s}

/* blank / idiom */
.mini-scene{
  position:relative;display:grid;place-items:center;height:92px;margin:0 0 10px;
  border:2.5px solid var(--ink);border-radius:16px 20px 15px 19px;
  background:radial-gradient(circle at 50% 45%, #fff, var(--accent-soft));overflow:hidden;
}
.mini-scene svg{height:84px;width:auto}
.idiom{
  font-family:var(--font-hand);font-size:38px;line-height:1.4;font-weight:700;
  text-align:center;letter-spacing:.12em;margin:8px 0 0;
}
.idiom .blank{
  display:inline-block;min-width:.9em;border-bottom:4px solid var(--accent);
  color:var(--accent-deep);transform:translateY(-2px);
}
.idiom .filled{color:var(--accent-deep);animation:pop .35s}
.idiom-note{margin:2px 0 14px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.05em}
.scroll-wrap{position:relative;display:grid;place-items:center;margin:-2px 0 0}
.scroll-wrap svg{height:94px;width:auto}

/* sort */
.sort-prompt{margin:0 2px 10px;text-align:center;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.sort-tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:2px 0 13px}
.sort-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px 2px 4px;background:#fff;border:2.5px solid var(--ink);
  border-radius:13px 11px 15px 12px;box-shadow:var(--shadow-sm);
  transition:transform .14s ease,box-shadow .14s ease,opacity .2s;
}
.sort-item svg{width:50px;height:50px}
.sort-item span{font-size:11.5px;font-weight:700;line-height:1.2}
.sort-item.is-selected{transform:translateY(-4px) rotate(-2deg);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-sm)}
.sort-item.is-done{opacity:.32;filter:grayscale(.5);pointer-events:none}
.sort-item.is-done::after{
  content:"";position:absolute;top:6px;right:6px;width:13px;height:7px;
  border-left:3px solid #2F7D5B;border-bottom:3px solid #2F7D5B;transform:rotate(-45deg);
}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.basket{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
  min-height:106px;padding:7px 5px 9px;overflow:hidden;
  border:2.5px solid var(--ink);border-radius:8px 8px 17px 17px;
  background:var(--bs);box-shadow:var(--shadow-sm);
  transition:transform .12s ease;
}
.basket::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(58,52,44,.085) 0 2px, transparent 2px 11px);
  opacity:.8;pointer-events:none;
}
.basket-mouth{
  width:100%;height:17px;margin-bottom:auto;border:2.5px solid var(--ink);
  border-radius:50%;background:var(--paper2);
}
.basket-label{
  position:relative;font-family:var(--font-hand);font-size:16px;font-weight:700;
  padding:1px 8px;background:var(--paper2);border:2px solid var(--ink);border-radius:999px;
}
.basket-count{position:relative;font-size:11px;font-weight:800;color:var(--ink-soft)}
.basket.is-shake{animation:shake .34s}
.sort-hint{
  min-height:20px;margin:10px 2px 0;text-align:center;font-size:12px;line-height:1.5;
  font-weight:700;color:var(--ink-faint);
}
.sort-hint.is-warn{color:#B8432F}
.sort-hint.is-ok{color:#2F7D5B}
.mini-burst{position:absolute;inset:0;pointer-events:none}

/* feedback */
.feedback{
  position:relative;margin-top:13px;padding:12px 13px 13px;overflow:hidden;
  border:2.5px solid var(--ink);border-radius:17px 15px 19px 16px;box-shadow:var(--shadow-sm);
  animation:cardIn .28s cubic-bezier(.2,.8,.2,1);
}
.feedback.ok{background:#E9F7EE}
.feedback.ok .fb-head{padding-right:70px}
.feedback.ok .fb-text{padding-right:64px}
.feedback.no{background:#FCEBE5}
.fb-head{display:flex;align-items:center;gap:7px;font-family:var(--font-hand);font-size:18px;font-weight:700;line-height:1.3;margin-bottom:4px}
.fb-head svg{width:21px;height:21px;flex:none}
.fb-text{margin:0 0 11px;font-size:14px;line-height:1.62;color:var(--ink-soft)}
.fb-btn{width:100%}
.stamp{
  position:absolute;top:9px;right:9px;width:70px;height:70px;display:grid;place-items:center;
  border:3px double #2F7D5B;border-radius:50%;color:#2F7D5B;
  font-family:var(--font-hand);font-size:15px;font-weight:800;letter-spacing:.1em;
  background:rgba(255,255,255,.62);transform:rotate(-13deg);
  animation:stampIn .48s cubic-bezier(.2,1.5,.4,1);
}
@keyframes stampIn{0%{transform:rotate(-30deg) scale(1.5);opacity:0}70%{transform:rotate(-10deg) scale(.95);opacity:1}100%{transform:rotate(-13deg) scale(1)}}
.confetti{position:absolute;width:8px;height:12px;border-radius:3px;pointer-events:none;animation:confetti .95s ease-out forwards}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(250deg);opacity:0}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:52px;padding:10px 18px;border:2.5px solid var(--ink);
  border-radius:var(--r-btn);box-shadow:var(--shadow);font-size:15.5px;font-weight:800;
  letter-spacing:.02em;transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translate(2px,3px);box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:#2A1E18}

function loadSave() {

      if (p && p.stars && Array.isArray(p.unlocked)) return p;

  } catch (e) {}

}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function modeTotal(mode) {
  return mode.type === 'sort' ? mode.rounds.length : mode.questions.length;
}

/* ---------------- audio ---------------- */
let audioCtx = null;

function ac() {
  if (muted) return null;
  try {
    if (!audioCtx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audioCtx = new C();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function playTone(freq, dur, type, gain, when) {
  const ctx = ac();
  if (!ctx) return;
  const t = ctx.currentTime + (when || 0);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(gain || 0.045, 0.0002), t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

function sfx(name) {
  if (muted) return;
  if (name === 'tap') playTone(640, 0.06, 'triangle', 0.028);
  if (name === 'correct') { playTone(660, 0.14, 'sine', 0.042, 0); playTone(880, 0.16, 'sine', 0.04, 0.08); playTone(1120, 0.2, 'sine', 0.034, 0.16); }
  if (name === 'wrong') { playTone(250, 0.12, 'triangle', 0.036, 0); playTone(196, 0.17, 'triangle', 0.03, 0.1); }
  if (name === 'finish') { [523, 659, 784, 1047, 1319].forEach(function (f, i) { playTone(f, 0.22, 'sine', 0.046, i * 0.09); }); }
  if (name === 'unlock') { [880, 1108, 1319].forEach(function (f, i) { playTone(f, 0.18, 'triangle', 0.036, i * 0.08); }); }
}

function syncSound() {
  $$('.sound-btn').forEach(function (b) {
    b.innerHTML = muted ? ICONS.mute : ICONS.sound;
    b.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
    b.setAttribute('aria-pressed', muted ? 'false' : 'true');
  });
}

function toggleSound() {
  muted = !muted;
  save.muted = muted;
  persist();
  syncSound();
  if (!muted) sfx('tap');
}

function buzz(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

/* ---------------- screen ---------------- */
function show(name) {
  ['home', 'game', 'result', 'album'].forEach(function (id) {
    const el = document.getElementById('screen-' + id);
    if (el) el.classList.toggle('is-active', id === name);
  });
}

/* ---------------- home ---------------- */
function renderHome() {
  document.body.dataset.ver = S.ver;
  $$('.version-btn').forEach(function (b) {
    const on = b.dataset.ver === S.ver;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const speech = $('#home-speech');
  if (speech) speech.innerHTML = DATA[S.ver].speech;

  const wrap = $('#mode-list');
  if (wrap) {
    wrap.innerHTML = DATA[S.ver].order.map(function (id) {
      const m = DATA[S.ver].modes[id];
      const best = (save.stars[S.ver] && save.stars[S.ver][id]) || 0;
      const stars = [1, 2, 3].map(function (n) {
        return starSVG(n <= best, 'mode-star' + (n <= best ? '' : ' off'));
      }).join('');
      return '<button class="mode-card" type="button" data-mode="' + id + '" style="--mc:' + m.color + ';--ms:' + m.soft + '">' +
        '<span class="mode-icon">' + (ICONS[m.icon] || ICONS.palette) + '</span>' +
        '<span class="mode-body">' +
          '<span class="mode-name">' + m.name + '</span>' +
          '<span class="mode-desc">' + m.desc + '</span>' +
          '<span class="mode-stars">' + stars + '<span>' + (best ? '最佳 ' + best + ' 星' : '尚未挑戰') + '</span></span>' +
        '</span>' +
        '<span class="mode-go">' + ICONS.arrow + '</span>' +
      '</button>';
    }).join('');
  }
  renderAlbumMini();
}

function renderAlbumMini() {
  const el = $('#album-mini');
  if (!el) return;
  let html = '';
  for (let i = 0; i < 6; i++) {
    if (i < save.unlocked.length) {
      html += '<span class="mini">' + spiritSVG(SPIRITS[save.unlocked[i]].color) + '</span>';
    } else {
      html += '<span class="mini empty"></span>';
    }
  }
  el.innerHTML = html;
  const count = $('#album-count');
  if (count) count.textContent = '已收集 ' + save.unlocked.length + ' / 12 隻';
}

/* ---------------- album ---------------- */
function openAlbum(from) {
  S.albumFrom = from || 'home';
  renderAlbum();
  show('album');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderAlbum() {
  const count = save.unlocked.length;
  const pct = Math.round((count / 12) * 100);
  $('#album-progress-label').textContent = '已收集 ' + count + ' / 12 隻';
  $('#album-progress-num').textContent = pct + '%';
  $('#album-bar').style.width = pct + '%';

  $('#album-grid').innerHTML = SPIRIT_ORDER.map(function (id) {
    const sp = SPIRITS[id];
    const on = save.unlocked.indexOf(id) >= 0;
    const src = SPIRIT_SOURCE[id];
    const hint = src ? '完成' + DATA[src.ver].name + '「' + DATA[src.ver].modes[src.mode].name + '」' : '';
    return '<div class="spirit-card ' + (on ? '' : 'is-locked') + '" title="' + (on ? sp.line : hint) + '">' +
      '<div class="sp">' + (on ? spiritSVG(sp.color) : lockedSpiritSVG()) + '</div>' +
      '<strong>' + (on ? sp.name : '？') + '</strong>' +
      '<span class="' + (on ? '' : 'lock-hint') + '">' + (on ? sp.word : hint) + '</span>' +
    '</div>';
  }).join('');
}

/* ---------------- game flow ---------------- */
function startMode(id) {
  const mode = DATA[S.ver].modes[id];
  if (!mode) return;
  S.modeId = id;
  S.mode = mode;
  S.qi = 0;
  S.correct = 0;
  S.locked = false;
  S.transitioning = false;
  S.selectedItem = null;
  S.sortWrong = 0;
  S.sortPlaced = 0;
  S.sortPlacedRound = 0;
  S.newSpirits = [];
  show('game');
  renderQuestion();
  sfx('tap');
}

function updateHeader() {
  const mode = S.mode;
  if (!mode) return;
  $('#game-mode-name').textContent = mode.name;
  $('#game-ver-chip').textContent = DATA[S.ver].name;
  const total = modeTotal(mode);
  $('#dots').innerHTML = Array.from({ length: total }, function (_, i) {
    return '<span class="dot ' + (i < S.qi ? 'is-done ' : '') + (i === S.qi ? 'is-now' : '') + '"></span>';
  }).join('');
  updateScore();
}

function updateScore() {
  const pill = $('#score-pill');
  if (!pill || !S.mode) return;
  const isSort = S.mode.type === 'sort';
  const text = isSort ? '已放 ' + S.sortPlaced : '答對 ' + S.correct;
  pill.innerHTML = (isSort ? ICONS.basket : starSVG(true)) + '<span>' + text + '</span>';
}

function renderQuestion() {
  const mode = S.mode;
  if (!mode) return;
  S.locked = false;
  S.selectedItem = null;
  updateHeader();
  if (mode.type === 'sort') {
    renderSort(mode.rounds[S.qi]);
  } else {
    const q = mode.questions[S.qi];
    if (mode.type === 'pick') renderPick(q);
    else if (mode.type === 'hunt') renderHunt(q);
    else if (mode.type === 'abb') renderBlank(q, 'abb');
    else if (mode.type === 'idiom') renderBlank(q, 'idiom');
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderPick(q) {
  const mode = S.mode;
  const opts = shuffle(q.opts);
  $('#question-area').innerHTML =
    '<div class="q-card">' +
      '<div class="q-top"><span class="q-count">第 ' + (S.qi + 1) + ' 題 · 共 ' + mode.questions.length + ' 題</span><span class="q-tag">選一個</span></div>' +
      '<div class="q-visual" id="q-visual">' + art(q.art, 'q' + S.qi) + '</div>' +
      '<h2 class="q-text ' + (q.text ? 'is-long' : '') + '" id="q-text">' + (q.text || q.q) + '</h2>' +
      '<div class="opts opts-3" id="opts">' + opts.map(function (o) {
        return '<button class="opt" type="button" data-val="' + o + '">' + o + '</button>';
      }).join('') + '</div>' +
      '<div id="feedback-slot" aria-live="polite"></div>' +
    '</div>';

  $('#opts').addEventListener('click', function (e) {
    const btn = e.target.closest('.opt');
    if (!btn || S.locked) return;
    handleChoice(btn, btn.dataset.val, q, 'pick');
  });
}

function renderHunt(q) {
  const mode = S.mode;
  const chips = shuffle(q.chips);
  $('#question-area').innerHTML =
    '<div class="q-card">' +
      '<div class="q-top"><span class="q-count">第 ' + (S.qi + 1) + ' 題 · 共 ' + mode.questions.length + ' 題</span><span class="q-tag">找顏色詞</span></div>' +
      '<div class="sentence-wrap">' +
        '<div class="sentence" id="sentence">' + q.sentence + '</div>' +
        '<div class="hunt-sticker">' + art(q.art, 'h' + S.qi) + '</div>' +
        '<div class="hunt-hint">' + ICONS.search + ' 找出句子裡的顏色詞</div>' +
      '</div>' +
      '<div class="chips" id="opts">' + chips.map(function (c) {
        return '<button class="chip-btn" type="button" data-val="' + c + '">' + c + '</button>';
      }).join('') + '</div>' +
      '<div id="feedback-slot" aria-live="polite"></div>' +
    '</div>';

  $('#opts').addEventListener('click', function (e) {
    const btn = e.target.closest('.chip-btn');
    if (!btn || S.locked) return;
    S.locked = true;
    const correct = btn.dataset.val === q.answer;
    $$('#opts .chip-btn').forEach(function (b) {
      if (b.dataset.val === q.answer) b.classList.add('is-right');
      else if (b === btn) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
      b.disabled = true;
    });
    const sent = $('#sentence');
    if (sent) sent.innerHTML = q.sentence.replace(q.answer, '<mark>' + q.answer + '</mark>');
    if (correct) { S.correct++; sfx('correct'); buzz(14); burst($('.hunt-sticker')); }
    else { sfx('wrong'); buzz(24); }
    updateScore();
    showFeedback(correct, q.answer, q.explain);
  });
}

function renderBlank(q, kind) {
  const mode = S.mode;
  const opts = shuffle(q.opts);
  let body = '';
  if (kind === 'idiom') {
    const parts = q.idiom.split('（　）');
    body = '<div class="scroll-wrap">' + art('scroll', 'i' + S.qi) + '</div>' +
      '<div class="idiom" id="idiom">' + parts[0] + '（<span class="blank">　</span>）' + (parts[1] || '') + '</div>' +
      '<p class="idiom-note">選出缺少的顏色字</p>';
  } else {
    body = '<div class="mini-scene">' + art(q.art, 'b' + S.qi) + '</div>' +
      '<h2 class="q-text is-long" id="q-text">' + q.text + '</h2>';
  }
  $('#question-area').innerHTML =
    '<div class="q-card">' +
      '<div class="q-top"><span class="q-count">第 ' + (S.qi + 1) + ' 題 · 共 ' + mode.questions.length + ' 題</span><span class="q-tag">' + (kind === 'idiom' ? '補一個字' : '填顏色詞') + '</span></div>' +
      body +
      '<div class="opts opts-3' + (kind === 'idiom' ? ' opts-char' : '') + '" id="opts">' + opts.map(function (o) {
        return '<button class="opt" type="button" data-val="' + o + '">' + o + '</button>';
      }).join('') + '</div>' +
      '<div id="feedback-slot" aria-live="polite"></div>' +
    '</div>';

  $('#opts').addEventListener('click', function (e) {
    const btn = e.target.closest('.opt');
    if (!btn || S.locked) return;
    handleChoice(btn, btn.dataset.val, q, kind);
  });
}

function fillBlank(answer) {
  const idiom = document.getElementById('idiom');
  if (idiom) {
    const b = idiom.querySelector('.blank');
    if (b) b.outerHTML = '<span class="filled">' + answer + '</span>';
    return;
  }
  const el = document.getElementById('q-text');
  if (el) el.innerHTML = el.innerHTML.replace(/（\s*）/, '（<span class="filled">' + answer + '</span>）');
}

function handleChoice(btn, val, q, kind) {
  if (S.locked) return;
  S.locked = true;
  const correct = val === q.answer;
  $$('#opts .opt').forEach(function (b) {
    if (b.dataset.val === q.answer) b.classList.add('is-right');
    else if (b === btn) b.classList.add('is-wrong');
    else b.classList.add('is-dim');
    b.disabled = true;
  });
  if (kind === 'abb' || kind === 'idiom') fillBlank(q.answer);
  if (correct) {
    S.correct++;
    sfx('correct');
    buzz(14);
    var burstBox = kind === 'abb' ? $('.mini-scene') : (kind === 'idiom' ? $('.scroll-wrap') : $('#q-visual'));
    burst(burstBox || $('.q-card'));
  } else {
    sfx('wrong');
    buzz(24);
  }
  updateScore();
  showFeedback(correct, q.answer, q.explain);
}

function showFeedback(correct, answer, explain) {
  const slot = $('#feedback-slot');
  if (!slot) return;
  const mode = S.mode;
  const total = modeTotal(mode);
  const last = S.qi >= total - 1;
  const nextLabel = last ? '看成績' : (mode.type === 'sort' ? '下一籃' : '下一題');
  slot.innerHTML =
    '<div class="feedback ' + (correct ? 'ok' : 'no') + '">' +
      (correct ? '<div class="stamp">答對</div>' : '') +
      '<div class="fb-head">' + (correct ? ICONS.check : ICONS.cross) +
        '<span>' + (correct ? '答對了！' : '差一點！答案是「' + answer + '」') + '</span></div>' +
      '<p class="fb-text">' + explain + '</p>' +
      '<button class="btn btn-primary fb-btn" type="button" id="btn-next">' + nextLabel + ' ' + ICONS.arrow + '</button>' +
    '</div>';
  $('#btn-next').addEventListener('click', function () { nextQuestion(this); });
  const fb = slot.querySelector('.feedback');
  setTimeout(function () {
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 90);
}

/* ---------------- sort ---------------- */
function renderSort(round) {
  const mode = S.mode;
  S.selectedItem = null;
  S.sortPlacedRound = 0;
  const items = shuffle(round.items);
  const itemHTML = items.map(function (it, i) {
    return '<button class="sort-item" type="button" data-color="' + it.color + '" data-name="' + it.name + '" aria-label="' + it.name + '">' +
      art(it.art, 's' + S.qi + '_' + i) + '<span>' + it.name + '</span></button>';
  }).join('');
  const basketHTML = mode.baskets.map(function (b) {
    const st = BASKET_STYLE[b.color];
    return '<button class="basket" type="button" data-color="' + b.color + '" data-label="' + b.label + '" style="--bs:' + st.s + ';--bc:' + st.c + '">' +
      '<span class="basket-mouth"></span>' +
      '<span class="basket-label">' + b.label + '</span>' +
      '<span class="basket-count">0 件</span>' +
    '</button>';
  }).join('');

  $('#question-area').innerHTML =
    '<div class="q-card">' +
      '<div class="q-top"><span class="q-count">第 ' + (S.qi + 1) + ' 籃 · 共 ' + mode.rounds.length + ' 籃</span><span class="q-tag">顏色分類</span></div>' +
      '<p class="sort-prompt">' + mode.prompt + '</p>' +
      '<div class="sort-tray" id="sort-tray">' + itemHTML + '</div>' +
      '<div class="baskets" id="baskets">' + basketHTML + '</div>' +
      '<p class="sort-hint" id="sort-hint">先點一件物品，再點相同顏色的籃子。</p>' +
      '<div id="feedback-slot" aria-live="polite"></div>' +
    '</div>';

  $('#sort-tray').addEventListener('click', function (e) {
    const item = e.target.closest('.sort-item');
    if (!item || item.classList.contains('is-done') || S.locked) return;
    $$('.sort-item').forEach(function (x) { x.classList.remove('is-selected'); });
    item.classList.add('is-selected');
    S.selectedItem = item;
    sfx('tap');
    const hint = $('#sort-hint');
    hint.textContent = '選好了，把「' + item.dataset.name + '」放進哪個籃子？';
    hint.className = 'sort-hint';
  });

  $('#baskets').addEventListener('click', function (e) {
    const basket = e.target.closest('.basket');
    if (!basket || S.locked) return;
    const hint = $('#sort-hint');
    if (!S.selectedItem) {
      hint.textContent = '先點一件物品，再點籃子。';
      hint.className = 'sort-hint is-warn';
      sfx('wrong');
      return;
    }
    const item = S.selectedItem;
    if (item.dataset.color === basket.dataset.color) {
      item.classList.remove('is-selected');
      item.classList.add('is-done');
      S.selectedItem = null;
      S.sortPlacedRound++;
      S.sortPlaced++;
      const count = basket.querySelector('.basket-count');
      count.textContent = (parseInt(count.textContent, 10) + 1) + ' 件';
      sfx('correct');
      buzz(10);
      miniBurst(basket);
      hint.textContent = '放對了！繼續找下一件。';
      hint.className = 'sort-hint is-ok';
      updateScore();
      if (S.sortPlacedRound >= round.items.length) {
        S.locked = true;
        showSortDone(round);
      }
    } else {
      S.sortWrong++;
      sfx('wrong');
      buzz(24);
      basket.classList.add('is-shake');
      setTimeout(function () { basket.classList.remove('is-shake'); }, 380);
      hint.textContent = '再看看它的顏色，再試一次。';
      hint.className = 'sort-hint is-warn';
    }
  });
}

function showSortDone(round) {
  const slot = $('#feedback-slot');
  if (!slot) return;
  const last = S.qi >= S.mode.rounds.length - 1;
  slot.innerHTML =
    '<div class="feedback ok">' +
      '<div class="fb-head">' + ICONS.check + '<span>全部分好了！</span></div>' +
      '<p class="fb-text">這一籃全部歸位。累計失誤 ' + S.sortWrong + ' 次' + (S.sortWrong === 0 ? '，太準了！' : '，再試一次會更快。') + '</p>' +
      '<button class="btn btn-primary fb-btn" type="button" id="btn-next">' + (last ? '看成績' : '下一籃') + ' ' + ICONS.arrow + '</button>' +
    '</div>';
  $('#btn-next').addEventListener('click', function () { nextQuestion(this); });
  const fb = slot.querySelector('.feedback');
  setTimeout(function () {
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 90);
}

function nextQuestion(btn) {
  if (S.transitioning) return;
  S.transitioning = true;
  if (btn) btn.disabled = true;
  const total = modeTotal(S.mode);
  S.qi++;
  if (S.qi >= total) {
    finishMode();
    S.transitioning = false;
    return;
  }
  S.locked = false;
  renderQuestion();
  setTimeout(function () { S.transitioning = false; }, 180);
}

/* ---------------- finish ---------------- */
function finishMode() {
  const mode = S.mode;
  const total = modeTotal(mode);
  let stars;
  if (mode.type === 'sort') {
    stars = S.sortWrong === 0 ? 3 : (S.sortWrong <= 2 ? 2 : 1);
  } else {
    stars = S.correct === total ? 3 : (S.correct >= total - 2 ? 2 : 1);
  }
  const prev = (save.stars[S.ver] && save.stars[S.ver][S.modeId]) || 0;
  if (!save.stars[S.ver]) save.stars[S.ver] = {};
  save.stars[S.ver][S.modeId] = Math.max(prev, stars);

  const reward = REWARDS[S.ver][S.modeId] || [];
  const fresh = [];
  reward.forEach(function (id) {
    if (save.unlocked.indexOf(id) < 0) { save.unlocked.push(id); fresh.push(id); }
  });
  S.newSpirits = fresh;
  persist();
  renderResult(stars);
  show('result');
  sfx('finish');
  if (fresh.length) setTimeout(function () { sfx('unlock'); }, 650);
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderResult(stars) {
  const mode = S.mode;
  const total = modeTotal(mode);
  let scoreText;
  if (mode.type === 'sort') {
    const places = mode.rounds.reduce(function (n, r) { return n + r.items.length; }, 0);
    scoreText = '一次放對 ' + (places - S.sortWrong) + ' / ' + places + ' 件';
  } else {
    scoreText = '答對 ' + S.correct + ' / ' + total + ' 題';
  }
  const titles = { 3: '顏色大師！', 2: '很有眼光！', 1: '完成挑戰！' };
  const subs = {
    3: '所有顏色都被你認出來了，色精靈開心地轉圈圈。',
    2: '很不錯！再玩一次，就能把三顆星全部收集到手。',
    1: '完成就是進步。再試一次，你會更熟悉這些顏色詞。'
  };
  const fresh = S.newSpirits;
  let unlockHTML;
  if (fresh.length) {
    unlockHTML = '<div class="unlock-row">' + fresh.map(function (id) {
      const sp = SPIRITS[id];
      return '<div class="unlock-card">' +
        '<div>' + spiritSVG(sp.color) + '</div>' +
        '<div><strong>' + sp.name + '</strong><span>' + sp.word + ' · ' + sp.line + '</span></div>' +
      '</div>';
    }).join('') + '</div>';
  } else {
    unlockHTML = '<p class="already">這兩隻色精靈已經在收集冊裡了。再玩一次，可以刷新最佳星數。</p>';
  }

  $('#result-card').innerHTML =
    '<div class="result-kicker">' + ICONS.spark + ' 本局完成</div>' +
    '<div class="result-stars">' + [1, 2, 3].map(function (n) {
      return starSVG(n <= stars, 'result-star ' + (n <= stars ? 'on' : 'off'));
    }).join('') + '</div>' +
    '<h2 class="result-title">' + titles[stars] + '</h2>' +
    '<p class="result-sub">' + subs[stars] + '</p>' +
    '<div class="result-score">' + starSVG(stars > 0) + ' ' + scoreText + '</div>' +
    '<div class="unlock-title">' + ICONS.spark + ' 新加入的色精靈</div>' +
    unlockHTML +
    '<div class="result-actions">' +
      '<button class="btn btn-primary btn-block" type="button" id="btn-again">' + ICONS.refresh + ' 再玩一次</button>' +
      '<button class="btn btn-soft btn-block" type="button" id="btn-other">' + ICONS.home + ' 挑選其他模式</button>' +
      '<button class="btn btn-paper btn-block" type="button" id="btn-album-result">' + ICONS.book + ' 打開收集冊</button>' +
    '</div>';

  $('#btn-again').addEventListener('click', function () { startMode(S.modeId); });
  $('#btn-other').addEventListener('click', function () {
    renderHome();
    show('home');
    window.scrollTo({ top: 0, behavior: 'auto' });
    sfx('tap');
  });
  $('#btn-album-result').addEventListener('click', function () { openAlbum('result'); });
}

/* ---------------- effects ---------------- */
function burst(container) {
  if (!container) return;
  const colors = ['#E8674F', '#F4BE45', '#5FAE83', '#4E93C4', '#8B6BB1', '#F08FA8'];
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.background = colors[i % colors.length];
    d.style.left = (38 + Math.random() * 34) + '%';
    d.style.top = (36 + Math.random() * 20) + '%';
    d.style.setProperty('--dx', ((Math.random() - 0.5) * 170).toFixed(0) + 'px');
    d.style.setProperty('--dy', (-40 - Math.random() * 90).toFixed(0) + 'px');
    d.style.animationDelay = (Math.random() * 0.08).toFixed(2) + 's';
    container.appendChild(d);
    setTimeout(function () { d.remove(); }, 1200);
  }
}

function miniBurst(el) {
  if (!el) return;
  const colors = ['#E8674F', '#F4BE45', '#5FAE83', '#4E93C4'];
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.width = '6px'; d.style.height = '8px';
    d.style.background = colors[i % colors.length];
    d.style.left = (30 + Math.random() * 40) + '%';
    d.style.top = '58%';
    d.style.setProperty('--dx', ((Math.random() - 0.5) * 70).toFixed(0) + 'px');
    d.style.setProperty('--dy', (-20 - Math.random() * 40).toFixed(0) + 'px');
    el.appendChild(d);
    setTimeout(function () { d.remove(); }, 1000);
  }
}

/* ---------------- init ---------------- */
function init() {
  $('#brand-mark').innerHTML = ICONS.palette;
  $('#mascot-home').innerHTML = MASCOT;
  $('#btn-game-back').innerHTML = ICONS.back;
  $('#btn-album-back').innerHTML = ICONS.back;
  syncSound();
  renderHome();

  $$('.version-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      if (S.ver === b.dataset.ver) return;
      S.ver = b.dataset.ver;
      renderHome();
      sfx('tap');
    });
  });

  $('#mode-list').addEventListener('click', function (e) {
    const card = e.target.closest('.mode-card');
    if (card) startMode(card.dataset.mode);
  });

  $('#btn-album-home').addEventListener('click', function () { openAlbum('home'); sfx('tap'); });
  $('#btn-game-back').addEventListener('click', function () {
    renderHome();
    show('home');
    window.scrollTo({ top: 0, behavior: 'auto' });
    sfx('tap');
  });
  $('#btn-album-back').addEventListener('click', function () {
    if (S.albumFrom === 'result' && S.mode) show('result');
    else show('home');
    window.scrollTo({ top: 0, behavior: 'auto' });
    sfx('tap');
  });

  $$('.sound-btn').forEach(function (b) { b.addEventListener('click', toggleSound); });

  document.addEventListener('keydown', function (e) {
    if (!$('#screen-game').classList.contains('is-active')) return;
    if (e.key === 'Enter') {
      const btn = document.getElementById('btn-next');
      if (btn) { e.preventDefault(); btn.click(); }
      return;
    }
    if (/^[1-9]$/.test(e.key)) {
      const list = $$('#opts .opt, #opts .chip-btn');
      const idx = parseInt(e.key, 10) - 1;
      if (list[idx] && !list[idx].disabled) list[idx].click();
    }
  });
}

init();

</script>
</body>
</html>
