<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>既…也…更… 大挑戰｜小學中文多重複句互動遊戲</title>
<meta name="description" content="用卡通圖解學會「既……也……更……」多重複句，再用兩種互動遊戲各十題鞏固，適合小學課堂與親子共學。">
<style>
  :root{
    --ink:#21324A;
    --cream:#FFF9EF;
    --sky:#5AB9E8;
    --sun:#FFC94A;
    --coral:#FF8A5B;
    --mint:#4EC9A0;
    --ji:#3D8BFD;
    --ye:#1FA76B;
    --geng:#F2673A;
    --soft:#F3F7FB;
    --radius:26px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC","Source Han Sans TC",sans-serif;
    font-size:18px;
    line-height:1.65;
    color:var(--ink);
    background:#EAF6FF;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(circle at 10% 6%, #FFF0BE 0 20%, transparent 52%),
      radial-gradient(circle at 90% 10%, #CFE9FF 0 20%, transparent 50%),
      radial-gradient(circle at 74% 92%, #D6F5E7 0 20%, transparent 52%),
      linear-gradient(180deg,#F3FAFF 0%, #FFF9EF 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(33,50,74,.075) 1.2px, transparent 1.2px);
    background-size:24px 24px;
    opacity:.55;
  }
  h1,h2,h3,p{margin:0}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:4px solid #1B6FD6;outline-offset:3px}

  .app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- 頂欄 ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px clamp(12px,3vw,28px);
    background:rgba(255,251,242,.9);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:3px solid var(--ink);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    background:none;border:none;padding:4px;cursor:pointer;border-radius:14px;
  }
  .brand-mark{
    width:44px;height:44px;flex-shrink:0;border:3px solid var(--ink);border-radius:14px;
    background:linear-gradient(160deg,#FFD86B,#FFB03A);
    display:grid;place-items:center;font-weight:900;font-size:22px;
    box-shadow:0 3px 0 var(--ink);
  }
  .brand-txt{font-weight:900;font-size:clamp(17px,2.2vw,21px);letter-spacing:.02em}
  .brand-sub{display:block;font-size:12px;font-weight:700;color:#6B7C93;letter-spacing:.08em}
  .top-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:52px;height:52px;border:3px solid var(--ink);border-radius:16px;background:#fff;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .icon-btn svg{width:26px;height:26px;display:block}
  .icon-btn.muted{background:#EDE6DA}

  main{flex:1;width:100%}
  .view{display:none;padding:clamp(16px,3.5vw,40px) clamp(14px,4vw,40px) 64px;max-width:1180px;margin:0 auto;width:100%}
  .view.active{display:block;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:.85;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- 通用按鈕 ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    font-size:clamp(17px,2vw,20px);font-weight:900;
    border:3px solid var(--ink);border-radius:20px;
    padding:14px 26px;min-height:58px;
    background:#fff;cursor:pointer;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    text-decoration:none;
  }
  .btn:hover{filter:brightness(1.03)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 6px 0 var(--ink)}
  .btn.sun{background:linear-gradient(160deg,#FFE07A,#FFC94A)}
  .btn.sky{background:linear-gradient(160deg,#A8DDF7,#7BC6E8)}
  .btn.coral{background:linear-gradient(160deg,#FFC0A3,#FF9A6E)}
  .btn.mint{background:linear-gradient(160deg,#A9EFD6,#7FE0BE)}
  .btn.ghost{background:rgba(255,255,255,.86)}
  .btn.small{font-size:16px;padding:10px 18px;min-height:48px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
  .btn svg{width:24px;height:24px;flex-shrink:0}

  /* ---------- 首頁 ---------- */
  .hero{
    display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(16px,3vw,36px);
    align-items:center;margin-bottom:clamp(22px,4vw,42px);
  }
  .eyebrow{
    display:inline-block;font-size:14px;font-weight:900;letter-spacing:.16em;
    background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;
    box-shadow:0 4px 0 var(--ink);margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(40px,7.2vw,76px);line-height:1.04;font-weight:900;letter-spacing:-.01em;
    margin-bottom:8px;
  }
  .hero h1 .hl{
    position:relative;display:inline-block;color:#1B6FD6;
  }
  .hero h1 .hl::after{
    content:"";position:absolute;left:-1%;right:-1%;bottom:.02em;height:.20em;
    background:var(--sun);opacity:.62;z-index:-1;border-radius:6px;
  }
  .lead{font-size:clamp(17px,2.1vw,21px);color:#41556E;font-weight:600;margin-top:14px;max-width:34ch}
  .hero-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .tag{
    font-size:14px;font-weight:800;padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.9);border:2.5px solid var(--ink);
  }
  .tag.ji{background:#DCEAFF}
  .tag.ye{background:#D8F6E8}
  .tag.geng{background:#FFE0D2}
  .hero-art{position:relative;display:grid;place-items:center}
  .owl-wrap{
    width:min(100%,300px);position:relative;animation:bob 3.6s ease-in-out infinite;
  }
  .owl-wrap svg{width:100%;height:auto;display:block}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .speech{
    position:absolute;top:-6px;right:-4px;
    background:#fff;border:3px solid var(--ink);border-radius:20px;
    padding:10px 14px;font-weight:900;font-size:15px;line-height:1.35;
    box-shadow:0 4px 0 var(--ink);max-width:170px;text-align:center;
  }
  .speech::after{
    content:"";position:absolute;left:26px;bottom:-14px;width:16px;height:16px;
    background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
    transform:rotate(45deg);
  }

  .entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,22px)}
  .entry{
    text-align:left;border:3px solid var(--ink);border-radius:var(--radius);
    padding:clamp(16px,2.4vw,26px);cursor:pointer;background:#fff;
    box-shadow:0 7px 0 var(--ink);position:relative;overflow:hidden;
    transition:transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .12s;
    display:flex;flex-direction:column;gap:10px;min-height:190px;
  }
  .entry:hover{transform:translateY(-5px);box-shadow:0 12px 0 var(--ink)}
  .entry:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
  .entry .ico{width:56px;height:56px;flex-shrink:0}
  .entry .ico svg{width:100%;height:100%;display:block}
  .entry h3{font-size:clamp(19px,2.3vw,23px);font-weight:900;line-height:1.3}
  .entry p{font-size:15px;font-weight:700;color:#516478;line-height:1.5}
  .entry .go{
    margin-top:auto;display:inline-flex;align-items:center;gap:6px;
    font-size:14px;font-weight:900;letter-spacing:.04em;color:#1B6FD6;
  }
  .entry .go svg{width:18px;height:18px}
  .entry.e-learn{background:linear-gradient(170deg,#FFF7DF,#FFEFC0)}
  .entry.e-a{background:linear-gradient(170deg,#F0F8FF,#DCEAFF)}
  .entry.e-b{background:linear-gradient(170deg,#FFF4EE,#FFE2D3)}

  .home-note{
    margin-top:clamp(20px,3vw,32px);display:flex;flex-wrap:wrap;gap:12px;
    align-items:center;font-size:15px;font-weight:700;color:#516478;
  }
  .home-note .pin{width:26px;height:26px;flex-shrink:0}

  /* ---------- 教學頁 ---------- */
  .learn-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;
  }
  .dots{display:flex;gap:8px;align-items:center}
  .dot{
    width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;
    transition:background .2s, transform .2s;
  }
  .dot.on{background:var(--sun);transform:scale(1.25)}
  .learn-card{
    background:#fff;border:3px solid var(--ink);border-radius:32px;
    box-shadow:0 9px 0 var(--ink);overflow:hidden;
  }
  .fig-box{
    background:linear-gradient(180deg,#F4FBFF,#EAF4FF);
    border-bottom:3px solid var(--ink);
    padding:clamp(10px,2vw,20px);
    display:grid;place-items:center;
    min-height:clamp(200px,30vw,300px);
  }
  .fig-box svg{width:100%;max-width:640px;height:auto;display:block}
  .learn-body{padding:clamp(20px,3.4vw,36px)}
  .step-no{font-size:14px;font-weight:900;letter-spacing:.14em;color:#1B6FD6;margin-bottom:8px}
  .learn-body h2{font-size:clamp(24px,3.4vw,34px);font-weight:900;line-height:1.25;margin-bottom:12px}
  .learn-body .desc{font-size:clamp(17px,2.1vw,21px);font-weight:600;color:#3E5169;line-height:1.7}
  .example{
    margin-top:18px;padding:16px 18px;border:3px dashed rgba(33,50,74,.35);
    border-radius:18px;background:#FFFDF4;
    font-size:clamp(20px,2.9vw,28px);font-weight:900;line-height:1.6;
  }
  .example em,.fb-full em{font-style:normal;padding:0 4px;border-radius:6px}
  em.k-ji{background:#CFE2FF;color:#0E5AC0}
  em.k-ye{background:#C9F3E0;color:#0C7A4C}
  em.k-geng{background:#FFD6C6;color:#B73E17}
  .notes{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
  .notes li{
    display:flex;gap:12px;align-items:flex-start;font-size:clamp(16px,2vw,19px);
    font-weight:700;color:#3E5169;background:#F4F9FF;border:2.5px solid rgba(33,50,74,.2);
    border-radius:16px;padding:12px 16px;
  }
  .notes li svg{width:24px;height:24px;flex-shrink:0;margin-top:2px}
  .learn-nav{display:flex;gap:12px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
  .speak-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  /* ---------- 遊戲頁 ---------- */
  .game-top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:12px;flex-wrap:wrap;
  }
  .game-meta{display:flex;flex-direction:column;gap:2px;text-align:center;flex:1;min-width:120px}
  .game-meta .m-name{font-size:14px;font-weight:900;letter-spacing:.1em;color:#1B6FD6}
  .game-meta .m-count{font-size:17px;font-weight:900}
  .score-pill{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:6px 16px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ink);
  }
  .score-pill svg{width:22px;height:22px;flex-shrink:0}
  .progress-track{
    height:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;
    overflow:hidden;margin-bottom:20px;
  }
  .progress-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#7BD1F0,#4EC9A0,#FFC94A);
    transition:width .4s cubic-bezier(.2,.8,.2,1);
  }
  .q-card{
    background:#fff;border:3px solid var(--ink);border-radius:30px;
    box-shadow:0 9px 0 var(--ink);padding:clamp(18px,3.4vw,36px);
    animation:rise .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .q-label{
    display:inline-block;font-size:14px;font-weight:900;letter-spacing:.1em;
    background:#EAF4FF;border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;margin-bottom:16px;
  }
  .q-sentence{
    font-size:clamp(23px,3.6vw,38px);font-weight:900;line-height:1.7;letter-spacing:.01em;
    margin-bottom:8px;
  }
  .blank{
    display:inline-block;min-width:1.9em;border-bottom:5px solid var(--ink);
    color:#B9C7D6;text-align:center;
  }
  .blank.filled{color:#1B6FD6}
  .q-hint{font-size:16px;font-weight:700;color:#6B7C93;margin-bottom:6px}

  .options{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,18px);margin-top:22px}
  .opt{
    border:3px solid var(--ink);border-radius:22px;background:#fff;
    padding:16px 10px;cursor:pointer;box-shadow:0 6px 0 var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .1s, box-shadow .1s, background .2s;
    min-height:110px;justify-content:center;
  }
  .opt:hover{background:#F6FBFF}
  .opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .opt .big{font-size:clamp(30px,4.6vw,44px);font-weight:900;line-height:1.2}
  .opt .sub{font-size:14px;font-weight:800;color:#6B7C93}
  .opt.correct{background:#D6F7E7;box-shadow:0 6px 0 #0C7A4C;border-color:#0C7A4C}
  .opt.correct .sub{color:#0C7A4C}
  .opt.wrong{background:#FFE1D8;box-shadow:0 6px 0 #B73E17;border-color:#B73E17}
  .opt.wrong .sub{color:#B73E17}
  .opt.dim{opacity:.5}
  .opt:disabled{cursor:default;transform:none}

  /* 模式二 */
  .subject-line{
    font-size:clamp(22px,3.2vw,32px);font-weight:900;margin-bottom:18px;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .subject-line .who{
    background:#FFF0BE;border:3px solid var(--ink);border-radius:12px;padding:2px 14px;
  }
  .slots{display:grid;gap:12px}
  .slot{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:3px dashed rgba(33,50,74,.4);border-radius:20px;background:#FAFCFF;
    padding:10px 14px;min-height:76px;cursor:pointer;transition:background .15s, border-color .15s;
  }
  .slot.filled{border-style:solid;background:#fff;box-shadow:0 5px 0 rgba(33,50,74,.85)}
  .slot .slot-tag{
    width:56px;height:56px;flex-shrink:0;border-radius:16px;border:3px solid var(--ink);
    display:grid;place-items:center;font-size:26px;font-weight:900;
  }
  .slot[data-slot="ji"] .slot-tag{background:#CFE2FF}
  .slot[data-slot="ye"] .slot-tag{background:#C9F3E0}
  .slot[data-slot="geng"] .slot-tag{background:#FFD6C6}
  .slot .slot-body{font-size:clamp(18px,2.6vw,26px);font-weight:900;color:#B9C7D6}
  .slot.filled .slot-body{color:var(--ink)}
  .slot .slot-tip{font-size:13px;font-weight:800;color:#8FA0B3;display:block;letter-spacing:.06em}
  .slot.right{border-color:#0C7A4C;background:#EFFBF4}
  .slot.off{border-color:#B73E17;background:#FFF2EE}

  .pool{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;min-height:70px}
  .chip{
    border:3px solid var(--ink);border-radius:16px;background:#FFFDF4;
    padding:12px 18px;font-size:clamp(17px,2.4vw,23px);font-weight:900;cursor:pointer;
    box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s, opacity .2s;
  }
  .chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .chip.used{opacity:.28;pointer-events:none;transform:none;box-shadow:0 5px 0 var(--ink)}
  .mode-b-actions{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}

  /* 反饋 */
  .feedback{margin-top:18px}
  .fb{
    border:3px solid var(--ink);border-radius:24px;padding:clamp(16px,2.6vw,26px);
    box-shadow:0 7px 0 var(--ink);animation:pop .3s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes pop{from{opacity:.6;transform:scale(.96)}to{opacity:1;transform:none}}
  .fb.ok{background:linear-gradient(170deg,#EAFFF5,#D6F7E7)}
  .fb.no{background:linear-gradient(170deg,#FFF3EE,#FFE1D8)}
  .fb-head{display:flex;align-items:center;gap:12px;font-size:clamp(21px,2.8vw,26px);font-weight:900;margin-bottom:6px}
  .fb-head svg{width:38px;height:38px;flex-shrink:0}
  .fb-full{
    font-size:clamp(19px,2.5vw,25px);font-weight:900;line-height:1.6;
    background:rgba(255,255,255,.75);border-radius:14px;padding:12px 14px;margin:10px 0;
  }
  .fb-full em{font-style:normal;padding:0 3px;border-radius:5px}
  .fb-why{font-size:clamp(16px,2vw,19px);font-weight:700;color:#39506B;line-height:1.7}
  .fb-act{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}

  /* 結算 */
  .result-card{
    background:#fff;border:3px solid var(--ink);border-radius:32px;box-shadow:0 9px 0 var(--ink);
    padding:clamp(24px,5vw,48px);text-align:center;max-width:760px;margin:0 auto;
  }
  .result-card h2{font-size:clamp(28px,4.4vw,44px);font-weight:900;margin-bottom:6px}
  .result-sub{font-size:clamp(17px,2.2vw,21px);font-weight:700;color:#516478}
  .stars{display:flex;justify-content:center;gap:12px;margin:22px 0 8px}
  .stars svg{width:clamp(52px,9vw,76px);height:auto}
  .star-off{opacity:.22}
  .score-big{font-size:clamp(44px,8vw,72px);font-weight:900;line-height:1;margin:6px 0 4px}
  .score-big small{font-size:.4em;font-weight:800;color:#6B7C93}
  .result-msg{font-size:clamp(17px,2.2vw,21px);font-weight:800;color:#3E5169;margin-top:10px}
  .result-acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .review{margin-top:26px;text-align:left;background:#F6FAFF;border:2.5px solid rgba(33,50,74,.2);border-radius:18px;padding:16px 18px}
  .review h4{font-size:17px;font-weight:900;margin-bottom:8px}
  .review p{font-size:15px;font-weight:700;color:#4A5E75;line-height:1.7}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ---------- 響應式 ---------- */
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;text-align:left}
    .hero-art{order:-1;margin-bottom:8px}
    .owl-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:none}
    .owl-wrap svg{width:min(64%,196px)}
    .speech{position:static;max-width:none;font-size:16px;padding:8px 16px}
    .speech::after{display:none}
    .entry-grid{grid-template-columns:1fr;}
    .entry{min-height:auto;flex-direction:row;align-items:center;flex-wrap:wrap}
    .entry .ico{width:48px;height:48px}
    .entry h3{flex:1;min-width:150px}
    .entry p{flex-basis:100%;order:3;margin-top:-4px}
    .entry .go{order:4;flex-basis:100%}
  }
  @media (max-width:620px){
    body{font-size:17px}
    .view{padding:14px 12px 56px}
    .topbar{padding:8px 12px}
    .brand-sub{display:none}
    .brand-mark{width:38px;height:38px;font-size:19px;border-radius:12px}
    .icon-btn{width:46px;height:46px;border-radius:14px}
    .icon-btn svg{width:23px;height:23px}
    .game-meta .m-name{font-size:12px;letter-spacing:0;white-space:nowrap}
    .game-meta .m-count{font-size:15px}
    .options{grid-template-columns:1fr;gap:10px}
    .opt{flex-direction:row;justify-content:flex-start;min-height:70px;padding:10px 16px;gap:14px}
    .opt .big{font-size:30px;min-width:44px;text-align:center}
    .opt .sub{font-size:15px}
    .slot .slot-tag{width:48px;height:48px;font-size:22px;border-radius:13px}

<script>
/* ============== 音效 ============== */
let actx = null;
let soundOn = true;
function audioCtx(){
  if(!soundOn) return null;
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }catch(e){ return null; }
}
function beep(freq, start, dur, type, vol){
  const ctx = audioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}
const SFX = {
  tap(){ beep(660, 0, 0.08, "triangle", 0.12); },
  page(){ beep(520, 0, 0.07, "sine", 0.1); beep(780, 0.07, 0.09, "sine", 0.09); },
  right(){ beep(660, 0, 0.11, "sine", 0.16); beep(880, 0.1, 0.13, "sine", 0.15); beep(1174, 0.22, 0.2, "sine", 0.13); },
  wrong(){ beep(300, 0, 0.16, "triangle", 0.14); beep(200, 0.14, 0.22, "triangle", 0.13); },
  win(){
    const notes = [523, 659, 784, 1046, 1318];
    notes.forEach((n, i) => beep(n, i * 0.11, 0.26, "triangle", 0.14));
    beep(1568, 0.62, 0.4, "sine", 0.1);
  },
  shuffle(){ beep(520, 0, 0.05, "square", 0.07); beep(700, 0.05, 0.05, "square", 0.06); }
};
function speak(text){
  if(!("speechSynthesis" in window) || !soundOn) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK";
    u.rate = 0.86;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
</script>

<script>
/* ============== 應用邏輯 ============== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const state = {
  step: 0,
  mode: "A",
  index: 0,
  score: 0,
  answered: false,
  locked: false,
  order: [],
  pool: [],
  placed: { ji: null, ye: null, geng: null },
  wrongList: [],
  lastPoolOrder: ""
};

/* ---------- 視圖切換 ---------- */
function go(name){
  const viewName = (name === "gameA" || name === "gameB") ? "game" : name;
  $$(".view").forEach(v => v.classList.remove("active"));
  const el = $("#view-" + viewName);
  if(el) el.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
  SFX.page();
  if(name === "gameA") startGame("A");
  if(name === "gameB") startGame("B");
  if(name === "learn"){ state.step = 0; renderStep(); }
}

/* ---------- 教學 ---------- */
function renderStep(){
  const s = LEARN_STEPS[state.step];
  const fig = $("#learnFig");
  fig.innerHTML = FIG[s.fig] ? FIG[s.fig]() : "";
  $("#learnStepNo").textContent = "第 " + (state.step + 1) + " 步 / 共 " + LEARN_STEPS.length + " 步";
  $("#learnTitle").textContent = s.title;
  $("#learnDesc").textContent = s.desc;

  const exWrap = $("#learnExampleWrap");
  if(s.example){
    exWrap.innerHTML = '<div class="example">' + s.example + '</div>';
  } else {
    exWrap.innerHTML = "";
  }

  const notes = $("#learnNotes");
  notes.innerHTML = "";
  (s.notes || []).forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1B6FD6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.4"/><path d="M8 12.6l2.6 2.6L16 9.6"/></svg>';
    const span = document.createElement("span");
    span.textContent = t;
    li.appendChild(span);
    notes.appendChild(li);
  });

  const speakRow = $("#learnSpeakRow");
  speakRow.innerHTML = "";
  if("speechSynthesis" in window){
    const b = document.createElement("button");
    b.className = "btn small ghost";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 8.6a4.8 4.8 0 0 1 0 6.8"/></svg> 讀一讀';
    b.addEventListener("click", () => { SFX.tap(); speak(s.say); });
    speakRow.appendChild(b);
  }

  $("#learnDots").innerHTML = LEARN_STEPS.map((_, i) =>
    '<span class="dot' + (i === state.step ? " on" : "") + '"></span>').join("");

  $("#btnPrevStep").disabled = state.step === 0;
  $("#btnNextLabel").textContent = state.step === LEARN_STEPS.length - 1 ? "學完了，去挑戰" : "下一步";
}

/* ---------- 工具 ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 開始遊戲 ---------- */
function startGame(mode){
  state.mode = mode;
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.locked = false;
  state.wrongList = [];
  state.lastPoolOrder = "";
  $("#scoreVal").textContent = "0";
  $("#gameModeName").textContent = mode === "A" ? "模式一 · 連接詞大挑戰" : "模式二 · 遞進排隊";
  $("#feedback").innerHTML = "";
  renderQuestion();
}

function renderQuestion(){
  state.answered = false;
  state.locked = false;
  state.placed = { ji: null, ye: null, geng: null };
  const isA = state.mode === "A";
  const total = isA ? MODE_A.length : MODE_B.length;
  $("#gameCounter").textContent = "第 " + (state.index + 1) + " / " + total + " 題";
  $("#progressFill").style.width = ((state.index) / total * 100) + "%";
  $("#feedback").innerHTML = "";

  if(isA) renderA(); else renderB();
}

/* ----- 模式一 ----- */
function renderA(){
  const q = MODE_A[state.index];
  const card = $("#qCard");
  const parts = q.text.split("〇");
  card.innerHTML =
    '<span class="q-label">選出最適合的連接詞</span>' +
    '<p class="q-sentence">' + parts[0] + '<span class="blank" id="blankSlot">？</span>' + (parts[1] || "") + '</p>' +
    '<p class="q-hint">先看三個分句是不是講同一個對象，再想想空格屬於第幾點。</p>' +
    '<div class="options" id="optWrap"></div>';

  const wrap = $("#optWrap");
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.dataset.val = opt;
    const subMap = { "既": "第一點", "也": "第二點", "更": "最強一點" };
    b.innerHTML = '<span class="big">' + opt + '</span><span class="sub">' + subMap[opt] + '</span>';
    b.addEventListener("click", () => answerA(opt, b));
    wrap.appendChild(b);
  });
}

function answerA(choice, btn){
  if(state.locked) return;
  state.locked = true;
  const q = MODE_A[state.index];
  const ok = choice === q.answer;
  const blank = $("#blankSlot");
  if(blank){ blank.textContent = choice; blank.classList.add("filled"); }

  $$("#optWrap .opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.val === q.answer) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  if(ok){
    state.score++;
    $("#scoreVal").textContent = state.score;
    SFX.right();
  } else {
    state.wrongList.push(state.index);
    SFX.wrong();
  }
  showFeedback(ok, q, "模式A");
}

/* ----- 模式二 ----- */
function renderB(){
  const q = MODE_B[state.index];
  const card = $("#qCard");
  let keys = shuffle(["ji", "ye", "geng"]);
  let guard = 0;
  // 卡片一開始不可排成正確次序，也不可與上一題完全相同
  while((keys.join(",") === "ji,ye,geng" || keys.join(",") === state.lastPoolOrder) && guard < 20){
    keys = shuffle(["ji", "ye", "geng"]);
    guard++;
  }
  state.lastPoolOrder = keys.join(",");
  state.pool = keys.map(k => ({ key: k, text: q.parts[k], used: false }));

  card.innerHTML =
    '<span class="q-label">把三張卡放進「既 → 也 → 更」三個位置</span>' +
    '<p class="subject-line"><span class="who">' + q.who + '</span><span class="q-hint" style="margin:0">' + q.hint + '</span></p>' +
    '<div class="slots" id="slotWrap"></div>' +
    '<div class="pool" id="poolWrap"></div>' +
    '<div class="mode-b-actions">' +
      '<button class="btn mint" id="btnCheck" disabled>檢查答案</button>' +
      '<button class="btn small ghost" id="btnReset">重新排過</button>' +
    '</div>';

  const slotWrap = $("#slotWrap");
  const slotMeta = [
    { key: "ji", tag: "既", tip: "第一點" },
    { key: "ye", tag: "也", tip: "第二點" },
    { key: "geng", tag: "更", tip: "最強一點" }
  ];
  slotMeta.forEach(m => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "slot";
    b.dataset.slot = m.key;
    b.innerHTML = '<span class="slot-tag">' + m.tag + '</span>' +
      '<span class="slot-body" data-empty="true">點擊放入卡片<span class="slot-tip">' + m.tip + '</span></span>';
    b.addEventListener("click", () => removeFromSlot(m.key));
    slotWrap.appendChild(b);
  });

  renderPool();
  $("#btnCheck").addEventListener("click", checkB);
  $("#btnReset").addEventListener("click", resetB);
  updateCheckBtn();
}

function renderPool(){
  const pool = $("#poolWrap");
  pool.innerHTML = "";
  state.pool.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (p.used ? " used" : "");
    b.textContent = p.text;
    b.addEventListener("click", () => placeChip(i));
    pool.appendChild(b);
  });
}

function placeChip(i){
  if(state.locked) return;
  const item = state.pool[i];
  if(!item || item.used) return;
  const empty = ["ji", "ye", "geng"].find(k => state.placed[k] === null || state.placed[k] === undefined);
  if(!empty) return;
  state.placed[empty] = i;
  item.used = true;
  SFX.tap();
  paintSlots();
  renderPool();
  updateCheckBtn();
}

function removeFromSlot(key){
  if(state.locked) return;
  const idx = state.placed[key];
  if(idx === null || idx === undefined) return;
  state.pool[idx].used = false;
  state.placed[key] = null;
  SFX.tap();
  paintSlots();
  renderPool();
  updateCheckBtn();
}

function paintSlots(){
  $$(".slot").forEach(slot => {
    const key = slot.dataset.slot;
    const idx = state.placed[key];
    const body = $(".slot-body", slot);
    if(idx === null || idx === undefined){
      slot.classList.remove("filled");
      body.dataset.empty = "true";
      body.innerHTML = '點擊放入卡片<span class="slot-tip">' +
        (key === "ji" ? "第一點" : key === "ye" ? "第二點" : "最強一點") + '</span>';
    } else {
      slot.classList.add("filled");
      body.dataset.empty = "false";
      body.textContent = state.pool[idx].text;
    }
  });
}

function updateCheckBtn(){
  const btn = $("#btnCheck");
  if(!btn) return;
  const full = state.placed.ji !== null && state.placed.ye !== null && state.placed.geng !== null;
  btn.disabled = !full;
}

function resetB(){
  if(state.locked) return;
  state.placed = { ji: null, ye: null, geng: null };
  state.pool.forEach(p => p.used = false);
  SFX.shuffle();
  paintSlots();
  renderPool();
  updateCheckBtn();
}

function checkB(){
  if(state.locked) return;
  const full = state.placed.ji !== null && state.placed.ye !== null && state.placed.geng !== null;
  if(!full) return;
  state.locked = true;
  const q = MODE_B[state.index];
  let ok = true;
  ["ji", "ye", "geng"].forEach(k => {
    const idx = state.placed[k];
    if(!state.pool[idx] || state.pool[idx].key !== k) ok = false;
  });

  $$(".slot").forEach(slot => {
    const k = slot.dataset.slot;
    const idx = state.placed[k];
    const right = state.pool[idx] && state.pool[idx].key === k;
    slot.classList.add(right ? "right" : "off");
    slot.disabled = true;
  });
  $("#btnCheck").disabled = true;
  $("#btnReset").disabled = true;
  const poolWrap = $("#poolWrap");
  const actWrap = $(".mode-b-actions");
  if(poolWrap) poolWrap.style.display = "none";
  if(actWrap) actWrap.style.display = "none";

  if(ok){
    state.score++;
    $("#scoreVal").textContent = state.score;
    SFX.right();
  } else {
    state.wrongList.push(state.index);
    SFX.wrong();
  }
  showFeedback(ok, q, "模式B");
}

/* ----- 反饋 ----- */
function showFeedback(ok, q, kind){
  const fb = $("#feedback");
  const isLast = state.index >= (state.mode === "A" ? MODE_A.length : MODE_B.length) - 1;
  const fullText = kind === "模式A"
    ? q.full
    : (q.who + "<em class='k-ji'>既</em>" + q.parts.ji + "，<em class='k-ye'>也</em>" + q.parts.ye + "，<em class='k-geng'>更</em>" + q.parts.geng + "。");

  const iconOk = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#4EC9A0" stroke="#21324A" stroke-width="3"/><path d="M11 20.5l6 6 12-13" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const iconNo = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FF8A5B" stroke="#21324A" stroke-width="3"/><path d="M13 13l14 14M27 13L13 27" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/></svg>';

  let html = '<div class="fb ' + (ok ? "ok" : "no") + '">' +
    '<div class="fb-head">' + (ok ? iconOk : iconNo) +
      '<span>' + (ok ? "答對了！" : "差一點點，一起看看") + '</span>' +
    '</div>' +
    '<div class="fb-full">' + fullText + '</div>' +
    '<p class="fb-why">' + q.why + '</p>' +
    '<div class="fb-act">';

  if(kind === "模式A"){
    html += '<button class="btn small ghost" id="btnSayFull">讀一讀句子</button>';
  } else {
    html += '<button class="btn small ghost" id="btnSayFull">讀一讀句子</button>';
  }
  html += '<button class="btn small ' + (isLast ? "sun" : "sky") + '" id="btnNextQ">' +
    (isLast ? "看結果" : "下一題") + '</button></div></div>';

  fb.innerHTML = html;

  const plain = fullText.replace(/<[^>]+>/g, "");
  const sayBtn = $("#btnSayFull");
  if(sayBtn){
    if(!("speechSynthesis" in window)) sayBtn.style.display = "none";
    sayBtn.addEventListener("click", () => { SFX.tap(); speak(plain); });
  }
  $("#btnNextQ").addEventListener("click", nextQuestion);
}

function nextQuestion(){
  const total = state.mode === "A" ? MODE_A.length : MODE_B.length;
  if(state.index >= total - 1){
    showResult();
    return;
  }
  state.index++;
  SFX.page();
  renderQuestion();
}

/* ---------- 結算 ---------- */
function showResult(){
  const total = state.mode === "A" ? MODE_A.length : MODE_B.length;
  const s = state.score;
  const ratio = s / total;
  const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;

  $("#resultTitle").textContent = ratio >= 0.9 ? "太厲害了！" : ratio >= 0.7 ? "做得不錯！" : "再試一次會更好！";
  $("#resultSub").textContent = state.mode === "A" ? "模式一 · 連接詞大挑戰" : "模式二 · 遞進排隊";
  $("#resultScore").textContent = s;

  const starPaths = [];
  for(let i = 0; i < 3; i++){
    const on = i < stars;
    starPaths.push('<svg viewBox="0 0 60 60" class="' + (on ? "" : "star-off") + '" aria-hidden="true">' +
      '<path d="M30 5l7.2 14.6 16.1 2.3-11.7 11.4 2.8 16.1L30 41.8 15.6 49.4l2.8-16.1L6.7 21.9l16.1-2.3L30 5z" fill="' + (on ? "#FFC94A" : "#C9D4E0") + '" stroke="#21324A" stroke-width="3" stroke-linejoin="round"/></svg>');
  }
  $("#resultStars").innerHTML = starPaths.join("");

  const msgs = {
    3: "三個連接詞的次序，你已經掌握得很好！試試在日常生活中，用「既……也……更……」讚美身邊的人。",
    2: "大部分題目都答對了！再留意一下「更」後面的那一點，是不是三點之中最強的。",
    1: "先回到教學部分，再看看「既、也、更」的三級樓梯，然後再挑戰一次吧。"
  };
  $("#resultMsg").textContent = msgs[stars];

  if(state.wrongList.length){
    const list = state.wrongList.map(i => {
      if(state.mode === "A"){
        return MODE_A[i].full.replace(/<[^>]+>/g, "");
      }
      const q = MODE_B[i];
      return q.who + "既" + q.parts.ji + "，也" + q.parts.ye + "，更" + q.parts.geng + "。";
    });
    $("#resultReview").innerHTML = '<h4>可以再讀一次的正確句子</h4>' +
      list.map(t => '<p>· ' + t + '</p>').join("");
    $("#resultReview").style.display = "block";
  } else {
    $("#resultReview").innerHTML = '<h4>全部答對！</h4><p>你已經能夠分清「既、也、更」的先後次序，真棒。</p>';
    $("#resultReview").style.display = "block";
  }

  $$(".view").forEach(v => v.classList.remove("active"));
  $("#view-result").classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
  SFX.win();
}

/* ---------- 事件綁定 ---------- */
document.addEventListener("click", e => {
  const goBtn = e.target.closest("[data-go]");
  if(goBtn){
    const g = goBtn.dataset.go;
    if(g === "gameA") go("gameA");
    else if(g === "gameB") go("gameB");
    else if(g === "learn") go("learn");
    else go("home");
    return;
  }
});

$("#btnBrand").addEventListener("click", () => go("home"));

$("#btnSound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("#btnSound").classList.toggle("muted", !soundOn);
  $("#btnSound").setAttribute("aria-pressed", String(soundOn));
  $("#soundIcon").innerHTML = soundOn
    ? '<path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M19 6a8.2 8.2 0 0 1 0 12"/>'
    : '<path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>';
  if(soundOn){ SFX.tap(); } else if("speechSynthesis" in window){ window.speechSynthesis.cancel(); }
});

$("#btnPrevStep").addEventListener("click", () => {
  if(state.step > 0){ state.step--; SFX.tap(); renderStep(); }
});
$("#btnNextStep").addEventListener("click", () => {
  if(state.step < LEARN_STEPS.length - 1){
    state.step++; SFX.tap(); renderStep();
  } else {
    go("home");
  }
});

$("#btnRetry").addEventListener("click", () => {
  SFX.tap();
  go(state.mode === "A" ? "gameA" : "gameB");
});
$("#btnOtherMode").addEventListener("click", () => {
  SFX.tap();
  go(state.mode === "A" ? "gameB" : "gameA");
});

/* 初始化 */
renderStep();
</script>
</body>
</html>
