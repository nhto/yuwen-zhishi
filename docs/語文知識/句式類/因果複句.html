<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>因果複句大冒險｜小學語文互動教室</title>
<meta name="description" content="小學因果複句互動教學遊戲：七組關聯詞、兩種遊戲模式、八十四道題目，配卡通情境插圖與音效，適合手機、平板及電腦使用。">
<style>
:root{
  --cream:#FFF6E7;
  --paper:#FFFDF7;
  --ink:#3E2F2A;
  --ink-soft:#7C6A60;
  --line:#EFE1CC;
  --orange:#FF8A3D;
  --yellow:#FFC94D;
  --mint:#3FBFA0;
  --blue:#4F9FE0;
  --pink:#F47C9C;
  --purple:#8E7BE0;
  --good:#2E9B76;
  --bad:#D95757;
  --r-lg:32px;
  --r-md:22px;
  --shadow:0 14px 34px rgba(62,47,42,.10);
  --shadow-sm:0 6px 16px rgba(62,47,42,.08);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC","Source Han Sans TC",system-ui,-apple-system,sans-serif;
  font-size:clamp(18px,1.02vw + 13.6px,24px);
  line-height:1.62;
  background-color:var(--cream);
  background-image:radial-gradient(rgba(62,47,42,.055) 1.6px, transparent 1.7px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased;
}
html{overflow-x:hidden;}
button{font-family:inherit;}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px;border-radius:14px;}
.app{
  max-width:1200px;
  margin:0 auto;
  padding:clamp(12px,2.2vw,30px) clamp(12px,2.4vw,30px) calc(clamp(18px,3vw,40px) + env(safe-area-inset-bottom));
}
.screen{display:none;}
.screen.is-active{display:block;animation:fadeUp .34s ease both;}

/* ---------- shared bits ---------- */
.topbar{
  display:flex;align-items:center;gap:.65rem;
  margin-bottom:clamp(10px,1.6vw,20px);
}
.icon-btn{
  flex:none;width:clamp(48px,7vw,58px);height:clamp(48px,7vw,58px);
  display:grid;place-items:center;
  background:#fff;border:3px solid var(--ink);border-radius:50%;
  box-shadow:0 5px 0 rgba(62,47,42,.18);cursor:pointer;color:var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(62,47,42,.18);}
.icon-btn[aria-pressed="true"]{background:#FFEFD4;}
.tb-title{
  flex:1;min-width:0;font-weight:900;font-size:clamp(18px,1.9vw,26px);
  line-height:1.25;overflow-wrap:anywhere;
}
.tb-title small{display:block;font-weight:700;font-size:.66em;color:var(--ink-soft);letter-spacing:.04em;}
.btn{
  font:inherit;font-weight:900;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:.62em 1.5em;min-height:56px;cursor:pointer;
  box-shadow:0 6px 0 rgba(62,47,42,.85);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  text-align:center;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(62,47,42,.85);}
.btn-primary{background:var(--orange);}
.btn-mint{background:var(--mint);}
.btn-yellow{background:var(--yellow);}
.btn-ghost{background:#fff;}
.btn-sm{min-height:48px;padding:.45em 1.1em;font-size:.9em;border-width:2.5px;box-shadow:0 4px 0 rgba(62,47,42,.85);}
.panel{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:clamp(16px,2.4vw,32px);
}
rt{font-size:.46em;color:var(--ink-soft);font-weight:600;letter-spacing:0;line-height:1.1;font-family:"Noto Sans TC",system-ui,sans-serif;}
.chip{
  display:inline-flex;align-items:center;gap:.35em;
  background:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:.28em .85em;font-weight:900;font-size:.82em;
}

/* ---------- home ---------- */
.hero{
  display:grid;gap:clamp(16px,3vw,40px);align-items:center;
  grid-template-columns:1fr;
  padding:clamp(18px,3vw,40px) 0 clamp(10px,2vw,22px);
}
@media(min-width:920px){.hero{grid-template-columns:1.06fr .94fr;}}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5em;
  background:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:.3em 1em;font-size:.76em;font-weight:900;letter-spacing:.06em;color:var(--ink-soft);
  margin:0 0 1rem;
}
.hero h1{
  margin:0 0 .5rem;
  font-size:clamp(36px,6.2vw,72px);
  line-height:1.12;font-weight:900;letter-spacing:-.01em;
}
.hero h1 .hl{position:relative;display:inline-block;isolation:isolate;}
.hero h1 .hl::after{
  content:"";position:absolute;left:-2%;right:-2%;bottom:.06em;height:.32em;
  background:var(--yellow);opacity:.75;border-radius:.2em;z-index:-1;
}
.lede{font-size:clamp(16px,1.5vw,22px);color:var(--ink-soft);font-weight:600;margin:0 0 1.4rem;max-width:32em;}
.hero-actions{display:flex;flex-wrap:wrap;gap:.7rem;}
.hero-art{position:relative;display:grid;place-items:center;min-height:clamp(240px,42vw,420px);}
.blob{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,420px);aspect-ratio:1;border-radius:48% 52% 44% 56%/54% 46% 54% 46%;
  background:linear-gradient(150deg,#FFE7BE,#FFD9E2 60%,#D9F3EA);
  filter:blur(.3px);animation:blob 14s ease-in-out infinite;
}
.mascot{position:relative;width:min(80%,360px);height:auto;filter:drop-shadow(0 12px 18px rgba(62,47,42,.16));animation:floaty 5s ease-in-out infinite;}
.float-chip{
  position:absolute;background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:.3em .7em;font-weight:900;font-size:clamp(14px,1.5vw,20px);
  box-shadow:0 5px 0 rgba(62,47,42,.16);animation:floaty 6s ease-in-out infinite;
}
.float-chip.a{left:2%;top:14%;color:#B85E1E;animation-delay:-1s;}
.float-chip.b{right:0%;top:52%;color:#1F7C63;animation-delay:-2.6s;}
.float-chip.c{left:14%;bottom:6%;color:#3D6FA8;animation-delay:-3.8s;}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:clamp(8px,2vw,18px) 0 0;
}
@media(min-width:700px){.stats{max-width:660px;gap:1rem;}}
.stat{
  background:#fff;border:2px solid var(--line);border-radius:var(--r-md);
  padding:.7em .5em;text-align:center;box-shadow:var(--shadow-sm);
}
.stat b{display:block;font-size:clamp(22px,2.8vw,34px);line-height:1.1;color:var(--orange);}
.stat span{font-size:.72em;font-weight:800;color:var(--ink-soft);}
.class-strip{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:clamp(14px,2.6vw,26px);}
.class-strip button{
  font:inherit;font-weight:900;cursor:pointer;font-size:.76em;
  display:inline-flex;align-items:center;gap:.4em;
  border:2.5px solid var(--ink);border-radius:999px;padding:.32em 1em .32em .35em;background:#fff;color:var(--ink);
  transition:transform .12s;
}
.class-strip .cs-ico{width:2em;height:2em;flex:none;border-radius:50%;display:grid;place-items:center;padding:.18em;border:2px solid rgba(62,47,42,.18);}
.class-strip .cs-ico svg{width:100%;height:100%;}
.class-strip button:hover{transform:translateY(-2px);}
.home-foot{margin-top:clamp(16px,3vw,30px);font-size:.74em;color:var(--ink-soft);font-weight:700;text-align:center;}

/* ---------- learn ---------- */
.learn-dots{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:clamp(10px,1.8vw,18px) 0;}
.learn-dots button{
  width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;
  font:inherit;font-weight:900;font-size:.8em;cursor:pointer;color:var(--ink);
}
.learn-dots button[aria-current="true"]{background:var(--yellow);}
.teach-grid{display:grid;gap:clamp(14px,2.6vw,32px);align-items:stretch;grid-template-columns:1fr;}
@media(min-width:900px){.teach-grid{grid-template-columns:.95fr 1.05fr;}}
.art-box{border-radius:26px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;}
.art-svg{display:block;width:100%;height:auto;}
.kicker{font-size:.72em;font-weight:900;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
.pattern{
  margin:.1em 0 .35em;font-size:clamp(28px,4.2vw,52px);font-weight:900;line-height:1.7;
}
.intro{margin:0 0 1rem;font-size:clamp(16px,1.45vw,21px);font-weight:600;color:var(--ink-soft);}
.rules{list-style:none;margin:0 0 1.1rem;padding:0;display:grid;gap:.5rem;}
.rules li{
  display:flex;gap:.6rem;align-items:flex-start;
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:.5em .8em;
  font-weight:700;font-size:.94em;
}
.rules .num{
  flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;
  font-size:.8em;font-weight:900;color:#fff;background:var(--ink);
}
.examples{display:grid;gap:.6rem;margin:0 0 1rem;}
.ex{
  background:#FFF9EC;border:2px dashed #E7CE9E;border-radius:18px;padding:.6em .9em;
  font-size:.98em;font-weight:700;
}
.ex .lab{display:block;font-size:.68em;font-weight:900;color:#B98021;letter-spacing:.1em;margin-bottom:.1em;}
.tip{
  display:flex;gap:.7rem;align-items:center;
  background:#EAF8F3;border:2px solid #B9E6D7;border-radius:18px;padding:.7em .9em;
  font-weight:800;font-size:.94em;color:#1F6B56;
}
.tip svg{flex:none;}
.learn-controls{display:flex;gap:.6rem;align-items:center;justify-content:space-between;margin-top:clamp(12px,2vw,22px);}
/* ---------- menu ---------- */
.menu-head{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:clamp(10px,2vw,18px);}
.menu-head h2{margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:900;}
.menu-grid{display:grid;gap:clamp(10px,1.8vw,20px);grid-template-columns:1fr;}
@media(min-width:720px){.menu-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
.mcard{background:#fff;border-radius:26px;box-shadow:var(--shadow-sm);border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column;}
.mcard-head{padding:.8em 1em .6em;display:flex;align-items:center;gap:.6rem;}
.mcard-ico{width:clamp(52px,5vw,64px);height:clamp(52px,5vw,64px);flex:none;border-radius:18px;display:grid;place-items:center;border:2.5px solid var(--ink);}
.mcard-ico svg{width:70%;height:70%;}
.mcard-head .t{min-width:0;}
.mcard-head .t b{display:block;font-size:clamp(17px,1.7vw,22px);line-height:1.25;}
.mcard-head .t span{font-size:.72em;color:var(--ink-soft);font-weight:800;}
.mcard-body{padding:0 1em 1em;display:grid;gap:.5rem;margin-top:auto;}
.mode-btn{
  display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;
  font:inherit;font-size:.88em;font-weight:900;color:var(--ink);
  background:#FFFCF4;border:2.5px solid var(--line);border-radius:18px;
  padding:.5em .8em;cursor:pointer;min-height:58px;
  transition:transform .12s, border-color .12s, background .12s;
}
.mode-btn:hover{border-color:var(--ink);transform:translateY(-2px);background:#fff;}
.mode-btn .mt{flex:1;min-width:0;}
.mode-btn .mt small{display:block;font-size:.76em;font-weight:700;color:var(--ink-soft);}
.stars{display:flex;gap:.1em;flex:none;}
.stars svg{width:22px;height:22px;}
.mode-btn .stars svg{width:18px;height:18px;}
.menu-note{font-size:.76em;color:var(--ink-soft);font-weight:700;margin-top:clamp(10px,2vw,18px);text-align:center;}

/* ---------- game ---------- */
.g-wrap{display:grid;gap:clamp(10px,1.8vw,18px);}
.progress-row{display:flex;align-items:center;gap:.7rem;}
.pbar{flex:1;height:16px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .4s ease;}
.pnum{font-weight:900;font-size:.82em;white-space:nowrap;color:var(--ink-soft);}
.qcard{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:clamp(16px,2.4vw,32px);
}
.qlabel{
  display:inline-flex;align-items:center;gap:.4em;margin:0 0 .6em;
  font-size:.72em;font-weight:900;letter-spacing:.08em;color:#B85E1E;
  background:#FFEEDC;border-radius:999px;padding:.25em .9em;
}
.qtext{
  margin:0;font-size:clamp(22px,2.6vw,34px);line-height:1.85;font-weight:800;letter-spacing:.01em;
}
.qtext .blank{
  display:inline-block;min-width:2.6em;text-align:center;
  border-bottom:5px solid var(--orange);color:var(--orange);
  margin:0 .12em;font-weight:900;
}
.qtext .blank.filled{
  color:var(--ink);border-bottom-color:var(--ink);background:#FFF0D9;
  border-radius:10px;padding:0 .25em;animation:pop .28s ease;
}
.cause-tag{
  display:inline-block;font-size:.5em;font-weight:900;vertical-align:middle;
  padding:.12em .5em;border-radius:999px;margin-left:.3em;
}
.cause-tag.c1{background:#E5F1FC;color:#2E6C9E;}
.cause-tag.c2{background:#FFE9DD;color:#A9531C;}
/* mode 1 — 貼一貼（詞語貼紙填空） */
.qtext .fslot{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:3.7em;min-height:1.5em;margin:0 .12em;padding:.04em .38em;
  font:inherit;font-weight:900;color:#C99655;line-height:1.25;
  background:#FFF8EC;border:3px dashed #E3B47C;border-radius:16px;
  vertical-align:middle;cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s,box-shadow .15s;
}
.qtext .fslot .sx{font-size:.6em;letter-spacing:.06em;}
.qtext .fslot .smk{display:inline-flex;width:1.05em;height:1.05em;margin-left:.22em;}
.qtext .fslot .smk svg{width:100%;height:100%;}
.qtext .fslot.on{border-color:var(--orange);background:#FFEFD9;color:#B85E1E;transform:translateY(-2px);box-shadow:0 0 0 5px rgba(255,138,61,.14);}
.qtext .fslot.set{border-style:solid;border-color:var(--ink);background:#FFF0D9;color:var(--ink);animation:pop .26s ease;}
.qtext .fslot.ok{border-color:var(--good);background:#E9F8F1;color:var(--good);}
.qtext .fslot.no{border-color:var(--bad);background:#FDECEC;color:var(--bad);animation:shake .38s;}
.bank{display:flex;flex-wrap:wrap;gap:.55rem;margin:.95rem 0 0;}
.wchip{
  position:relative;font:inherit;font-weight:900;font-size:clamp(17px,1.65vw,23px);color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:.3em .85em;min-height:58px;cursor:pointer;
  box-shadow:0 5px 0 rgba(62,47,42,.2);
  transition:transform .12s,box-shadow .12s,opacity .12s;
}
.wchip::after{
  content:'';position:absolute;left:50%;top:-7px;width:20px;height:10px;margin-left:-10px;border-radius:3px;
  background:#FFD98A;border:2px solid rgba(62,47,42,.3);transform:rotate(-5deg);
}
.wchip:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg);}
.wchip:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(62,47,42,.2);}
.wchip.used{opacity:.22;pointer-events:none;box-shadow:none;}
.bank-hint{font-size:.8em;font-weight:800;color:var(--ink-soft);margin:.8rem 0 .55rem;}
.check-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;}
.check-row .btn{flex:1 1 220px;}
.check-row .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 6px 0 rgba(62,47,42,.35);}

/* mode 2 */
.slots{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;align-items:stretch;}
.slot{
  flex:1 1 100%;min-height:78px;display:flex;align-items:center;gap:.5rem;
  border:3px dashed #D9C7AA;border-radius:20px;padding:.4em .6em;background:#FFFCF3;
  font-weight:800;font-size:.95em;line-height:1.4;text-align:left;color:var(--ink);
}
@media(min-width:700px){.slot{flex:1 1 30%;}}
.slot .sn{
  flex:none;width:1.7em;height:1.7em;border-radius:50%;background:#EFE2CC;color:#8A6A3E;
  display:grid;place-items:center;font-size:.8em;font-weight:900;
}
.slot.empty{color:#C3B49F;font-weight:700;}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff;cursor:pointer;animation:pop .22s ease;}
.slot.ok{border-color:var(--good);background:#E9F8F1;border-style:solid;}
.slot.no{border-color:var(--bad);background:#FDECEC;border-style:solid;}
.pool{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.2rem;}
.chunk{
  font:inherit;font-weight:800;font-size:clamp(16px,1.5vw,21px);line-height:1.45;
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:.55em .85em;cursor:pointer;color:var(--ink);text-align:left;
  box-shadow:0 5px 0 rgba(62,47,42,.16);transition:transform .12s, box-shadow .12s;
  max-width:100%;
}
.chunk:hover{transform:translateY(-2px);}
.chunk:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(62,47,42,.16);}
.chunk.used{opacity:0;pointer-events:none;}
.chunk.dim{opacity:.35;}
.chunk{line-height:1.9;}
.pool-hint{font-size:.78em;font-weight:800;color:var(--ink-soft);margin:0 0 .3rem;}

/* feedback */
.feedback{
  display:none;border-radius:26px;border:2px solid var(--line);background:#fff;
  box-shadow:var(--shadow);padding:clamp(14px,2vw,24px);
}
.feedback.show{display:block;animation:pop .3s ease both;}
.feedback .fb-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;}
.feedback .fb-ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;}
.feedback .fb-title{font-size:clamp(19px,2.1vw,26px);font-weight:900;}
.feedback.good .fb-ico{background:var(--good);}
.feedback.good .fb-title{color:var(--good);}
.feedback.bad .fb-ico{background:var(--bad);}
.feedback.bad .fb-title{color:var(--bad);}
.fb-answer{
  background:#FFF9EC;border:2px dashed #E7CE9E;border-radius:16px;
  padding:.6em .8em;font-weight:800;font-size:clamp(18px,1.9vw,25px);line-height:1.9;margin:.4rem 0 .6rem;
}
.fb-ex{font-size:.98em;font-weight:600;color:var(--ink);margin:0;}
.fb-ex b{color:var(--orange);}
.fb-kw{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin:0 0 .55rem;}
.fb-kw-lab{font-size:.74em;font-weight:900;color:var(--ink-soft);letter-spacing:.06em;}
.kw-chip{display:inline-flex;align-items:center;font-weight:900;font-size:clamp(17px,1.7vw,22px);color:#8A4B12;background:#FFE8CB;border:2.5px solid #E9B171;border-radius:12px;padding:.04em .55em;animation:pop .3s ease both;}
.fb-answer em.kw{font-style:normal;color:#A9531C;background:#FFE8CB;border-radius:8px;padding:0 .16em;box-shadow:inset 0 -.3em 0 #FFD7A8;}
.fb-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem;}
.fb-actions .btn{flex:1 1 auto;}

/* result */
.result-wrap{max-width:760px;margin:0 auto;text-align:center;padding-top:clamp(8px,2vw,24px);}
.result-stars{display:flex;justify-content:center;gap:.3em;margin:clamp(6px,2vw,18px) 0;}
.result-stars svg{width:clamp(58px,11vw,96px);height:auto;animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both;}
.result-stars svg:nth-child(2){animation-delay:.14s;}
.result-stars svg:nth-child(3){animation-delay:.28s;}
.result-wrap h2{font-size:clamp(28px,4.4vw,50px);margin:.1em 0 .2em;font-weight:900;}
.score-line{font-size:clamp(19px,2.2vw,26px);font-weight:900;color:var(--ink-soft);}
.score-line b{color:var(--orange);font-size:1.25em;}
.score-line .nw{white-space:nowrap;}
.score-line .dot{margin:0 .45em;color:#C3B49F;}
.result-actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:clamp(16px,3vw,28px);}

/* =========================================================
   音效（Web Audio，自行合成，沒有外部檔案）
   ========================================================= */
var audioCtx = null;

function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
    return audioCtx;
  }
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }catch(e){
    audioCtx = null;
  }
  return audioCtx;
}
function beep(freq, start, dur, type, vol){
  var ctx = audioCtx;
  if(!ctx) return;
  try{
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function sfx(name){
  if(state.muted) return;
  if(!ensureAudio()) return;
  if(name === 'click'){
    beep(520, 0, 0.09, 'triangle', 0.09);
    beep(760, 0.05, 0.08, 'triangle', 0.07);
  }else if(name === 'place'){
    beep(440, 0, 0.07, 'triangle', 0.09);
  }else if(name === 'good'){
    beep(660, 0, 0.14, 'sine', 0.16);
    beep(880, 0.11, 0.16, 'sine', 0.15);
    beep(1180, 0.24, 0.22, 'sine', 0.12);
  }else if(name === 'bad'){
    beep(250, 0, 0.16, 'sawtooth', 0.09);
    beep(170, 0.14, 0.24, 'sawtooth', 0.09);
  }else if(name === 'win'){
    var notes = [523, 659, 784, 1046];
    for(var i = 0; i < notes.length; i++){ beep(notes[i], i * 0.13, 0.32, 'sine', 0.14); }
  }else if(name === 'star'){
    beep(1180, 0, 0.1, 'sine', 0.11);
    beep(1560, 0.08, 0.16, 'sine', 0.09);
  }
}

/* =========================================================
   遊戲
   ========================================================= */
function currentItem(){
  var items = state.mode === 0 ? state.cls.m1 : state.cls.m2;
  return items[state.order[state.qi]];
}
function startGame(clsId, mode){
  var cls = null;
  for(var i = 0; i < DATA.length; i++){ if(DATA[i].id === clsId){ cls = DATA[i]; break; } }
  if(!cls) return;
  state.cls = cls;
  state.mode = mode;
  var items = mode === 0 ? cls.m1 : cls.m2;
  var idx = [];
  for(var k = 0; k < items.length; k++){ idx.push(k); }
  state.order = shuffle(idx);
  state.qi = 0;
  state.correct = 0;
  show('game');
  renderGame();
}

function renderGame(){
  var c = state.cls;
  var item = currentItem();

  state.answered = false;
  state.checked = false;
  state.placed = [];
  state.round += 1;

  var modeName = (state.mode === 0 ? '貼一貼' : '排一排');
  $('#gameTop').innerHTML = '<button type="button" class="icon-btn" data-quit="1" aria-label="返回遊戲選單">' + ICON.back + '</button>'
    + '<div class="tb-title">句子小挑戰<small>' + modeName + ' · 第 ' + (state.qi + 1) + ' 題</small></div>'
    + '<span class="pnum" style="font-size:1em" id="scoreNow">答對 ' + state.correct + ' 題</span>';

  var pic = picFor(c, state.order[state.qi]);

  var html = '<div class="progress-row"><div class="pbar"><i style="width:' + (state.qi / 6 * 100) + '%"></i></div>'
    + '<span class="pnum" id="progText">已完成 ' + state.qi + ' 題</span></div>';

  if(state.mode === 0){
    state.chips = buildChips(item);
    state.slots = [];
    for(var si = 0; si < item.opts[item.ans].length; si++){ state.slots.push(null); }
    state.sel = -1;

    html += '<div class="qcard"><p class="qlabel">貼一貼 · 把詞語貼進句子</p>'
      + '<div class="qbody"><figure class="qfig">' + qFigure(pic.k, c.tint, pic.cap) + '</figure>'
      + '<div class="qcontent"><p class="qtext" id="qtext">' + buildFillSentence(item) + '</p>'
      + '<div class="bank" id="bankWrap" aria-label="詞語貼紙"></div>'
      + '<p class="bank-hint" id="bankHint">先點句子裏的空格，再點下面的詞語貼紙；貼好後按「檢查答案」。貼錯了，點空格上的貼紙就可以取回。</p>'
      + '<div class="check-row"><button type="button" class="btn btn-primary" id="checkBtn" data-check="1" disabled>檢查答案</button></div>'
      + '</div></div></div>';
  }else{
    state.pool = shuffle(item.c.map(function(_, i){ return i; }));
    html += '<div class="qcard"><p class="qlabel">排一排 · 把句子排通順</p>'
      + '<div class="qbody"><figure class="qfig">' + qFigure(pic.k, c.tint, pic.cap) + '</figure>'
      + '<div class="qcontent">'
      + '<p class="qtext" style="font-size:clamp(19px,2.1vw,27px);line-height:1.6">把下面的句子卡按正確順序排成一句通順的話。</p>'
      + '<div class="slots" id="slotWrap"></div>'
      + '<p class="pool-hint">點句子卡放到上面；點已放好的卡可以取回。</p>'
      + '<div class="pool" id="poolWrap"></div>'
      + '</div></div></div>';
  }

  html += '<div class="feedback" id="fb" role="status" aria-live="polite"></div>';
  $('#gameRoot').innerHTML = html;

  if(state.mode === 0){ paintFill(); } else { paintMode2(); }
}

/* 產生貼一貼的句子：空格是可點的貼紙位 */
function buildFillSentence(item){
  var parts = item.q.split('{}');
  var html = '';
  for(var i = 0; i < parts.length; i++){
    html += esc(parts[i]);
    if(i < parts.length - 1){
      html += '<button type="button" class="fslot" id="slot' + i + '" data-fslot="' + i + '" aria-label="第' + (i + 1) + '個空格，未貼"><span class="sx">貼這裏</span></button>';
    }
  }
  return html;
}

/* 每次重新抽一組詞語貼紙：正確詞＋隨機干擾詞，位置每次不同 */
var CHIP_POOL = ['因為','所以','之所以','是因為','既然','就','由於','因此','正因為','才','雖然','但是','如果','只要','即使','於是','不但','而且','卻','便'];
function buildChips(item){
  var words = item.opts[item.ans].slice();
  var plain = item.q.replace(/\{\}/g, '');
  var pool = [];
  for(var i = 0; i < CHIP_POOL.length; i++){
    var w = CHIP_POOL[i];
    if(words.indexOf(w) >= 0) continue;
    if(plain.indexOf(w) >= 0) continue;
    pool.push(w);
  }
  var need = 6 - words.length;
  var picked = shuffle(pool).slice(0, need);
  return shuffle(words.concat(picked)).map(function(w){ return { w: w, used: false }; });
}
function fillSentence(q, words){
  var parts = q.split('{}');
  var out = '';
  for(var i = 0; i < parts.length; i++){
    out += parts[i];
    if(i < parts.length - 1){ out += (words[i] || ''); }
  }
  return out;
}

function paintMode2(){
  var item = currentItem();
  var slotHtml = '';
  for(var i = 0; i < 3; i++){
    var ci = state.placed[i];
    if(ci === undefined){
      slotHtml += '<div class="slot empty"><span class="sn">' + (i + 1) + '</span><span>放句子卡</span></div>';
    }else{
      slotHtml += '<button type="button" class="slot filled" data-slot="' + i + '"><span class="sn">' + (i + 1) + '</span><span>' + esc(item.c[ci]) + '</span></button>';
    }
  }
  $('#slotWrap').innerHTML = slotHtml;

  var poolHtml = '';
  state.pool.forEach(function(ci){
    if(state.placed.indexOf(ci) >= 0) return;
    poolHtml += '<button type="button" class="chunk" data-chunk="' + ci + '">' + esc(item.c[ci]) + '</button>';
  });
  $('#poolWrap').innerHTML = poolHtml;
}

function updateScore(){
  var el = $('#scoreNow');
  if(el){ el.textContent = '答對 ' + state.correct + ' 題'; }
}

function updateGameProgress(doneAdd){
  var bar = $('#gameRoot .pbar i');

/* 貼一貼：畫面上的空格與貼紙 */
function paintFill(){
  for(var i = 0; i < state.slots.length; i++){
    var el = $('#slot' + i);
    if(!el) continue;
    var ci = state.slots[i];
    if(ci === null){
      el.className = 'fslot' + (state.sel === i ? ' on' : '');
      el.innerHTML = '<span class="sx">貼這裏</span>';
      el.setAttribute('aria-label', '第' + (i + 1) + '個空格，未貼');
    }else{
      el.className = 'fslot set';
      el.innerHTML = esc(state.chips[ci].w);
      el.setAttribute('aria-label', '第' + (i + 1) + '個空格，已貼上' + state.chips[ci].w + '，點一下可取回');
    }
  }

  var bank = $('#bankWrap');
  if(bank){
    var bhtml = '';
    state.chips.forEach(function(ch, ci){
      if(ch.used) return;
      bhtml += '<button type="button" class="wchip" data-chip="' + ci + '">' + esc(ch.w) + '</button>';
    });
    bank.innerHTML = bhtml;
  }

  var done = state.slots.indexOf(null) < 0;
  var btn = $('#checkBtn');
  if(btn){ btn.disabled = !done; }
  var hint = $('#bankHint');
  if(hint){
    hint.textContent = done
      ? '貼好了！按「檢查答案」看看句子通不通。'
      : '先點句子裏的空格，再點下面的詞語貼紙；貼好後按「檢查答案」。貼錯了，點空格上的貼紙就可以取回。';
  }
}

function tapSlot(i){
  if(state.answered) return;
  if(i < 0 || i >= state.slots.length) return;
  if(state.slots[i] !== null){
    var ci = state.slots[i];
    state.chips[ci].used = false;
    state.slots[i] = null;
    state.sel = i;
    sfx('place');
  }else{
    state.sel = (state.sel === i ? -1 : i);
    sfx('click');
  }
  paintFill();
}

function tapChip(ci){
  if(state.answered) return;
  var ch = state.chips[ci];
  if(!ch || ch.used) return;
  var target = (state.sel >= 0 && state.slots[state.sel] === null) ? state.sel : state.slots.indexOf(null);
  if(target < 0){
    toast('空格已經貼滿了，先按「檢查答案」吧！');
    return;
  }
  state.slots[target] = ci;
  ch.used = true;
  var next = state.slots.indexOf(null);
  state.sel = (next >= 0) ? next : -1;
  sfx('place');
  paintFill();
}

function checkFill(){
  if(state.answered) return;
  if(state.slots.indexOf(null) >= 0){ toast('還有空格未貼，選一張貼紙放進去。'); return; }
  state.answered = true;

  var item = currentItem();
  var ans = item.opts[item.ans];
  var ok = true;
  for(var i = 0; i < ans.length; i++){
    if(state.chips[state.slots[i]].w !== ans[i]){ ok = false; }
  }
  if(ok){ state.correct += 1; }
  updateScore();
  sfx(ok ? 'good' : 'bad');

  for(var k = 0; k < ans.length; k++){
    var el = $('#slot' + k);
    if(!el) continue;
    var w = state.chips[state.slots[k]].w;
    var right = (w === ans[k]);
    el.className = 'fslot ' + (right ? 'ok' : 'no');
    el.innerHTML = '<span>' + esc(w) + '</span><span class="smk">' + (right ? ICON.check : ICON.cross) + '</span>';
  }
  $$('#bankWrap .wchip').forEach(function(b){ b.disabled = true; b.classList.add('used'); });
  var btn = $('#checkBtn');
  if(btn){ btn.disabled = true; }
  var hint = $('#bankHint');
  if(hint){ hint.textContent = ok ? '貼得真好，句子讀起來很順。' : '看看正確的貼法，再讀一次句子。'; }

  showFeedback(ok, fillSentence(item.q, ans), item.ex, ans);
  updateGameProgress(1);
}

function placeChunk(ci){
  if(state.checked) return;
  if(state.placed.length >= 3) return;
  if(state.placed.indexOf(ci) >= 0) return;
  state.placed.push(ci);
  sfx('place');
  paintMode2();
  if(state.placed.length === 3){
    var token = state.round;
    setTimeout(function(){ if(token === state.round){ checkMode2(); } }, 260);
  }
}

function checkMode2(){
  if(state.checked) return;
  if(state.placed.length !== 3) return;
  state.checked = true;
  var item = currentItem();
  var ok = true;
  for(var i = 0; i < 3; i++){
    if(state.placed[i] !== i){ ok = false; }
  }
  if(ok){ state.correct += 1; }
  updateScore();
  sfx(ok ? 'good' : 'bad');

  var slots = $$('#slotWrap .slot');
  slots.forEach(function(el, i){
    el.classList.remove('filled');
    el.classList.add(state.placed[i] === i ? 'ok' : 'no');
  });
  $$('#poolWrap .chunk').forEach(function(b){
    b.disabled = true;
    b.classList.add('dim');
  });

  showFeedback(ok, item.c.join(''), item.ex, keyWords());
  updateGameProgress(1);
}

var PRAISE = ['答對了！','太棒了！','就是這樣！','好眼力！','完全正確！','抓到重點了！'];
var NUDGE = ['差一點點！','再看清楚前後句…','唔，這樣說不通…','這次貼錯了…','再讀一次句子吧…'];
var lastPick = {p:-1, n:-1};
function pickOne(arr, tag){
  if(!arr || !arr.length) return '';
  if(arr.length < 2) return arr[0];
  var i = Math.floor(Math.random() * arr.length);
  var guard = 0;
  while(i === lastPick[tag] && guard < 12){ i = Math.floor(Math.random() * arr.length); guard += 1; }
  lastPick[tag] = i;
  return arr[i];
}

function markKeywords(text, words){
  var html = esc(text);
  (words || []).forEach(function(w){
    if(!w) return;
    var i = html.indexOf(w);
    if(i >= 0){ html = html.slice(0, i) + '<em class="kw">' + w + '</em>' + html.slice(i + w.length); }
  });
  return html;
}
function keyWords(){
  var f = state.cls.flow;
  var arr = [];
  if(f.lw && f.lw !== '前一句'){ arr.push(f.lw); }
  if(f.rw){ arr.push(f.rw); }
  return arr;
}

function showFeedback(ok, fullSentence, explanation, words){
  var fb = $('#fb');
  if(!fb) return;
  var isLast = (state.qi === 5);
  var kwHtml = '';
  if(words && words.length){
    kwHtml = '<div class="fb-kw"><span class="fb-kw-lab">本題關聯詞</span>';
    words.forEach(function(w){ kwHtml += '<span class="kw-chip">' + esc(w) + '</span>'; });
    kwHtml += '</div>';
  }
  fb.className = 'feedback show ' + (ok ? 'good' : 'bad');
  fb.innerHTML = '<div class="fb-head"><span class="fb-ico">' + (ok ? ICON.check : ICON.cross) + '</span>'
    + '<span class="fb-title">' + (ok ? pickOne(PRAISE, 'p') : pickOne(NUDGE, 'n')) + '</span>'
    + '<span class="fb-owl">' + owlFace(ok ? 'happy' : 'think') + '</span></div>'
    + kwHtml
    + '<div class="fb-answer"><span style="font-size:.72em;color:#B98021;font-weight:900;display:block;margin-bottom:.15em">正確句子</span>' + markKeywords(fullSentence, words) + '</div>'
    + '<p class="fb-ex"><b>說明：</b>' + esc(explanation) + '</p>'
    + '<div class="fb-actions">'
    + '<button type="button" class="btn btn-primary" data-next="1">' + (isLast ? '看成績' : '下一題') + '</button>'
    + '</div>';
  fb.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function nextQuestion(){
  sfx('click');
  if(state.qi >= 5){ finishGame(); return; }
  state.qi += 1;
  renderGame();
  if(state.mode === 0){
    var first = $('#gameRoot .fslot');
    if(first){ try{ first.focus({preventScroll: true}); }catch(e){} }
  }
}

function finishGame(){
  var stars = state.correct >= 6 ? 3 : (state.correct === 5 ? 2 : (state.correct >= 4 ? 1 : 0));
  var key = state.cls.id + '-m' + (state.mode + 1);
  var prev = state.best[key] || 0;
  if(stars > prev){
    state.best[key] = stars;
    saveBest();
  }
  show('result');
  renderResult(stars);
  sfx('win');
}

function renderResult(stars){
  var c = state.cls;
  var msg = stars === 3 ? '太厲害了，全部答對！'
    : stars === 2 ? '很棒！只差一點點就全對。'
    : stars === 1 ? '不錯，再練習一次會更好。'
    : '別灰心，先看看教學再挑戰吧！';

  var html = '<div class="result-wrap">';
  html += resultArt(stars);
  html += '<div class="result-stars">';
  for(var i = 0; i < 3; i++){ html += starSvg(i < stars); }
  html += '</div>';
  html += '<h2>' + msg + '</h2>';
  html += '<p class="score-line">答對 <b>' + state.correct + '</b> / 6 題<span class="dot">·</span><span class="nw">' + esc(c.short) + '</span><span class="dot">·</span><span class="nw">' + (state.mode === 0 ? '貼一貼' : '排一排') + '</span></p>';
  html += '<div class="result-actions">'
    + '<button type="button" class="btn btn-primary" data-again="1">再玩一次</button>'
    + '<button type="button" class="btn btn-ghost" data-go="menu">換一種玩法</button>'
    + '<button type="button" class="btn btn-ghost" data-go="learn">看教學</button>'
    + '<button type="button" class="btn btn-ghost" data-go="home">回首頁</button>'
    + '</div></div>';

  $('#resultRoot').innerHTML = html;
}

   事件
   ========================================================= */
document.addEventListener('click', function(e){
  var target = e.target;

  if(closest(target, '.js-sound')){
    state.muted = !state.muted;
    saveMute();
    updateSoundButtons();
    if(!state.muted){ sfx('click'); }
    return;
  }

  var practiceBtn = closest(target, '[data-practice]');
  if(practiceBtn){ sfx('click'); show('menu'); return; }

  var learnBtn = closest(target, '[data-learn]');
  if(learnBtn){
    state.learn = Number(learnBtn.getAttribute('data-learn'));
    sfx('click');
    show('learn');
    return;
  }
  var prevBtn = closest(target, '[data-learn-prev]');
  if(prevBtn){
    state.learn = (state.learn + DATA.length - 1) % DATA.length;
    sfx('click');
    renderLearn();
    return;
  }
  var nextBtn = closest(target, '[data-learn-next]');
  if(nextBtn){
    state.learn = (state.learn + 1) % DATA.length;
    sfx('click');
    renderLearn();
    return;
  }

  var modeBtnEl = closest(target, '[data-mode]');
  if(modeBtnEl){
    sfx('click');
    startGame(modeBtnEl.getAttribute('data-cls'), Number(modeBtnEl.getAttribute('data-mode')));
    return;
  }

  var chipBtn = closest(target, '[data-chip]');
  if(chipBtn){
    tapChip(Number(chipBtn.getAttribute('data-chip')));
    return;
  }

  var fillSlot = closest(target, '[data-fslot]');
  if(fillSlot){
    tapSlot(Number(fillSlot.getAttribute('data-fslot')));
    return;
  }

  var checkBtnEl = closest(target, '[data-check]');
  if(checkBtnEl){
    if(!checkBtnEl.disabled){ checkFill(); }
    return;
  }

  var chunkBtn = closest(target, '[data-chunk]');
  if(chunkBtn){
    placeChunk(Number(chunkBtn.getAttribute('data-chunk')));
    return;
  }

  var slotBtn = closest(target, '[data-slot]');
  if(slotBtn){
    if(state.checked) return;
    var si = Number(slotBtn.getAttribute('data-slot'));
    var removed = state.placed.splice(si, 1);
    if(removed.length){ sfx('place'); paintMode2(); }
    return;
  }

  var nextQ = closest(target, '[data-next]');
  if(nextQ){ nextQuestion(); return; }

  var again = closest(target, '[data-again]');
  if(again){ sfx('click'); startGame(state.cls.id, state.mode); return; }

  var quit = closest(target, '[data-quit]');
  if(quit){ sfx('click'); show('menu'); return; }

  var go = closest(target, '[data-go]');
  if(go){ sfx('click'); show(go.getAttribute('data-go')); return; }
}, false);

/* 首次互動時解鎖音訊 */
document.addEventListener('pointerdown', function once(){
  ensureAudio();
  document.removeEventListener('pointerdown', once);
}, {passive: true});

/* =========================================================
   啟動
   ========================================================= */
(function init(){
  loadPrefs();
  updateSoundButtons();
  renderHomeStrip();
})();

</script>
</body>
</html>
