<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>條件複句探險隊｜小學關聯詞互動遊戲</title>
<meta name="description" content="用卡通圖示學會八組條件複句關聯詞，再用「選一選」和「配一配」兩種模式挑戰，每類三題、附答案解析與音效，適合小學課堂與平板使用。">
<style>
  :root{
    --ink:#3B3355;
    --ink-2:#6E6688;
    --paper:#FFF9EF;
    --card:#FFFFFF;
    --line:#EADFCB;
    --sky:#5AB9FF;
    --grape:#A98BF6;
    --mint:#37C79B;
    --sun:#FFB13D;
    --coral:#FF7F5F;
    --rose:#FF86B8;
    --r-lg:26px;
    --r-md:18px;
    --shadow:0 7px 0 rgba(59,51,85,.14);
    --font:"PingFang HK","PingFang TC","Hiragino Sans CNS","Noto Sans HK","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:84px}
  .hero::after,.lcard::after,.action::before,.action::after{pointer-events:none}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:var(--paper);
    font-size:clamp(16px,0.42vw + 14.6px,20px);
    line-height:1.65;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 8% 6%, rgba(90,185,255,.20), transparent 42%),
      radial-gradient(circle at 92% 18%, rgba(255,177,61,.22), transparent 40%),
      radial-gradient(circle at 78% 88%, rgba(255,134,184,.18), transparent 42%),
      radial-gradient(circle at 18% 82%, rgba(55,199,155,.16), transparent 40%);
    pointer-events:none;
  }
  h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:.01em}
  p{margin:0}
  button{font-family:inherit}
  svg{display:block}
  [hidden]{display:none !important}

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:0 clamp(12px,2.4vw,26px) calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px clamp(12px,2.4vw,26px);
    margin:0 calc(-1 * clamp(12px,2.4vw,26px));
    background:rgba(255,249,239,.92);
    backdrop-filter:blur(10px);
    border-bottom:3px dashed var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    border:0;
    background:transparent;
    padding:4px 2px;
    cursor:pointer;
    color:var(--ink);
    text-align:left;
    border-radius:16px;
  }
  .brand:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  .brand__mascot{width:clamp(38px,6vw,52px);height:clamp(38px,6vw,52px);flex:none}
  .brand strong{display:block;font-size:clamp(1rem,1.5vw,1.22rem);letter-spacing:.02em}
  .brand small{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.08em}
  .topbar__spacer{flex:1}
  .icon-btn{
    width:clamp(44px,7vw,52px);
    height:clamp(44px,7vw,52px);
    border-radius:50%;
    border:3px solid var(--ink);
    background:#fff;
    box-shadow:0 4px 0 var(--ink);
    display:grid;
    place-items:center;
    cursor:pointer;
    flex:none;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .icon-btn svg{width:56%;height:56%}
  .icon-btn.is-off{background:#F0EADD;color:var(--ink-2)}

  /* ---------- generic ---------- */
  .screen{animation:rise .3s ease both;padding-top:clamp(14px,2.4vw,26px)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.5em;
    font-size:clamp(1rem,1.1vw,1.12rem);
    font-weight:800;
    color:var(--ink);
    background:#fff;
    border:3px solid var(--ink);
    border-radius:999px;
    padding:.62em 1.3em;
    min-height:52px;
    box-shadow:0 5px 0 var(--ink);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s;
    text-decoration:none;
  }
  .btn:hover{background:#FFF6E4}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
  .btn--primary{background:var(--sun)}
  .btn--primary:hover{background:#FFC466}
  .btn--ghost{background:#fff;font-size:.95rem;min-height:46px;padding:.45em 1em;box-shadow:0 4px 0 var(--ink)}
  .btn--small{font-size:.9rem;min-height:44px;padding:.4em .95em;box-shadow:0 3px 0 var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 rgba(59,51,85,.3)}
  .tag{
    display:inline-block;
    font-size:.74rem;
    font-weight:800;
    letter-spacing:.08em;
    padding:.18em .7em;
    border-radius:999px;
    color:var(--ink);
    background:var(--tint,#F0EADD);
    border:2px solid var(--ink);
  }

  /* ---------- home ---------- */
  .hero{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:clamp(14px,3vw,34px);
    align-items:center;
    padding:clamp(18px,3.2vw,36px);
    background:linear-gradient(160deg,#FFFFFF 0%,#FFFDF7 60%,#FFF3DC 100%);
    border:3px solid var(--ink);
    border-radius:calc(var(--r-lg) + 6px);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    width:220px;height:220px;
    right:-70px;bottom:-110px;
    border-radius:50%;
    background:rgba(90,185,255,.16);
  }
  .eyebrow{
    font-size:.8rem;
    font-weight:800;
    letter-spacing:.22em;
    color:var(--ink-2);
    margin-bottom:6px;
  }
  .hero h1{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.1;font-weight:900}
  .hero h1 .hl{
    display:inline-block;
    padding:0 .16em;
    border-radius:14px;
    background:linear-gradient(180deg,transparent 58%, #FFD98A 58%, #FFD98A 92%, transparent 92%);
  }
  .lead{margin-top:.7em;font-size:clamp(1rem,1.2vw,1.16rem);color:var(--ink-2);line-height:1.75}
  .lead strong{color:var(--ink)}
  .hero__btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.1em}
  .hero__art{display:grid;place-items:center;position:relative}
  .hero__art svg{width:min(100%,300px);height:auto}
  .bubble{
    position:absolute;
    top:2%;
    right:2%;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:.35em .8em;
    font-size:.85rem;
    font-weight:800;
    box-shadow:0 4px 0 rgba(59,51,85,.16);
    transform:rotate(6deg);
  }

  .cards3{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:clamp(12px,2vw,20px);
    margin-top:clamp(14px,2.4vw,24px);
  }
  .action{
    text-align:left;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:var(--r-lg);
    box-shadow:0 7px 0 var(--bcol,rgba(59,51,85,.14));
    padding:clamp(16px,2.4vw,24px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:transform .16s ease, box-shadow .16s ease;
    position:relative;
    overflow:hidden;
  }
  .action::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:10px;
    background:var(--c,var(--sky));
  }
  .action:hover{transform:translateY(-4px)}
  .action:active{transform:translateY(2px);box-shadow:0 3px 0 var(--bcol,rgba(59,51,85,.14))}
  .action:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
  .action__icon{width:clamp(62px,9vw,78px);height:clamp(62px,9vw,78px)}
  .action h3{font-size:clamp(1.2rem,1.7vw,1.45rem);font-weight:900}
  .action p{color:var(--ink-2);font-size:.95rem;line-height:1.6}
  .action .go{
    margin-top:auto;
    padding-top:10px;
    font-weight:900;
    font-size:.95rem;
    color:var(--ink);
  }
  .action .go span{border-bottom:3px solid var(--c)}

  .progress-card{
    margin-top:clamp(14px,2.4vw,22px);
    padding:clamp(14px,2vw,20px) clamp(16px,2.4vw,26px);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 24px;
  }
  .progress-card .pt{font-weight:900;font-size:1rem}
  .bar{flex:1;min-width:150px;height:16px;border:3px solid var(--ink);border-radius:999px;background:#F3ECDD;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .5s ease}

  /* ---------- learn ---------- */
  .pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:clamp(12px,2vw,18px)}
  .pagehead h2{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:900}
  .pagehead .hint{color:var(--ink-2);font-size:.92rem}
  .intro{
    display:flex;
    gap:clamp(12px,2vw,20px);
    align-items:center;
    padding:clamp(16px,2.4vw,24px);
    margin-bottom:clamp(14px,2.4vw,22px);
    background:linear-gradient(120deg,#FFFDF6,#FFF4DE);
  }
  .intro__art{flex:none;width:clamp(84px,13vw,120px)}
  .intro h3{font-size:clamp(1.1rem,1.6vw,1.3rem);font-weight:900;margin-bottom:.25em}
  .intro p{color:var(--ink-2);font-size:.98rem}
  .intro .chain{display:flex;flex-wrap:wrap;gap:8px;margin-top:.7em;align-items:center}
  .chip{
    display:inline-block;
    font-weight:800;
    font-size:.9rem;
    padding:.22em .8em;
    border-radius:12px;
    border:2px solid var(--ink);
    background:var(--tint,#FFF);
  }
  .chain .arrow{font-weight:900;color:var(--ink-2)}

  .learn-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
    gap:clamp(14px,2.2vw,22px);
  }
  .lcard{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:var(--r-lg);
    box-shadow:0 7px 0 rgba(59,51,85,.13);
    padding:clamp(16px,2.2vw,22px);
    display:flex;
    flex-direction:column;
    gap:.7em;
    position:relative;
    overflow:hidden;
  }
  .lcard::after{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:120px;height:120px;
    border-radius:50%;
    background:var(--tint,#F5EFDF);
    opacity:.6;
  }
  .lcard__head{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .lcard__icon{
    flex:none;
    width:clamp(64px,9vw,80px);
    height:clamp(64px,9vw,80px);
    border-radius:22px;
    background:var(--tint,#F4EEDF);
    border:3px solid var(--ink);
    display:grid;
    place-items:center;
    padding:6px;
  }
  .lcard__icon svg{width:100%;height:100%}
  .lcard h3{font-size:clamp(1.22rem,1.9vw,1.5rem);font-weight:900;letter-spacing:.02em}
  .lcard__mean{font-size:1rem;color:var(--ink);position:relative;z-index:1}
  .formula{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    padding:.55em .7em;
    border-radius:16px;
    background:#FCF7EC;
    border:2px dashed var(--line);
  }
  .formula b{
    font-weight:900;
    font-size:.95rem;
    padding:.12em .5em;
    border-radius:9px;
    background:#fff;
    border:2px solid var(--ink);
  }
  .formula i{color:var(--ink-2);font-style:normal;font-weight:900}
  .ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ex li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:.5em .7em;
    border-radius:14px;
    background:var(--tint,#F7F2E7);
    font-size:1rem;
    line-height:1.6;
  }
  .ex li .txt{flex:1;min-width:0}
  mark{
    background:transparent;
    color:var(--ink);
    font-weight:900;
    box-shadow:inset 0 -0.42em 0 rgba(255,201,77,.55);
    padding:0 .04em;
  }
  .speak{
    flex:none;
    margin-top:1px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:999px;
    padding:.24em .6em;
    font-size:.76rem;
    font-weight:800;
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:.3em;
    min-height:36px;
  }
  .speak:hover{background:#FFF3D6}
  .speak:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .speak svg{width:16px;height:16px}
  .tip{
    font-size:.92rem;
    color:var(--ink-2);
    border-left:4px solid var(--c,var(--sun));
    padding-left:.7em;
  }
  .tip b{color:var(--ink)}
  .lcard--cmp .cmp{
    display:flex;flex-direction:column;gap:.15em;
    padding:.55em .75em;border-radius:14px;
    background:var(--tint,#F7F2E7);
    border:2px dashed rgba(59,51,85,.16);
  }
  .lcard--cmp .cmp b{font-size:.98rem;font-weight:900;color:var(--ink)}
  .lcard--cmp .cmp span{font-size:.9rem;color:var(--ink-2)}
  .lcard--cmp .cmp em{font-style:normal;font-size:.96rem;line-height:1.6}

  .summary-card{
    margin-top:clamp(16px,2.6vw,24px);
    padding:clamp(16px,2.4vw,24px);
  }
  .summary-card h3{font-size:1.15rem;font-weight:900;margin-bottom:.6em}
  .summary-list{display:flex;flex-wrap:wrap;gap:10px}
  .summary-list button{
    border:3px solid var(--ink);
    background:var(--tint);
    border-radius:16px;
    padding:.5em .9em;
    font-size:.95rem;
    font-weight:800;
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 4px 0 rgba(59,51,85,.18);
  }
  .summary-list button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,51,85,.18)}

  /* ---------- levels ---------- */
  .levels-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
    gap:clamp(12px,2vw,20px);
  }
  .level{
    text-align:left;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:var(--r-lg);
    box-shadow:0 7px 0 rgba(59,51,85,.14);
    padding:clamp(14px,2vw,20px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:.45em;
    transition:transform .15s ease;
    position:relative;
  }
  .level:hover{transform:translateY(-4px)}
  .level:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
  .level__top{display:flex;align-items:center;gap:10px}
  .level__icon{
    width:clamp(52px,7vw,66px);height:clamp(52px,7vw,66px);
    flex:none;border-radius:18px;border:3px solid var(--ink);
    background:var(--tint);display:grid;place-items:center;padding:5px;
  }
  .level__icon svg{width:100%;height:100%}
  .level .lvname{display:block;font-size:1.1rem;font-weight:900;line-height:1.25}
  .level__words{
    align-self:flex-start;
    margin-top:.1em;
    padding:.16em .7em;
    border-radius:11px;
    background:#FFF0CC;
    border:2px solid var(--ink);
    font-size:.9rem;
    font-weight:900;
    color:var(--ink);
  }
  .level__words--q{
    background:#F3ECDD;
    border-style:dashed;
    color:var(--ink-2);
    font-weight:800;
    font-size:.82rem;
  }
  .level small{color:var(--ink-2);font-size:.8rem;font-weight:700;letter-spacing:.06em}
  .stars{display:flex;gap:5px;margin-top:.2em}
  .stars svg{width:26px;height:26px}
  .level__go{
    margin-top:.35em;
    font-weight:900;
    font-size:.92rem;
    color:var(--ink);
    display:flex;align-items:center;gap:.4em;
  }
  .level__go i{
    font-style:normal;
    width:1.5em;height:1.5em;border-radius:50%;
    background:var(--c,var(--sky));
    border:2px solid var(--ink);
    display:grid;place-items:center;
    font-size:.8rem;
  }

  /* ---------- play ---------- */
  .subbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:clamp(12px,2vw,18px);
  }
  .subbar__title{font-weight:900;font-size:clamp(1rem,1.5vw,1.2rem)}
  .subbar__title small{display:block;font-weight:700;font-size:.76rem;color:var(--ink-2);letter-spacing:.08em}
  .dots{display:flex;gap:7px;margin-left:auto}
  .dots i{
    width:15px;height:15px;border-radius:50%;
    border:3px solid var(--ink);
    background:#fff;
    display:block;
    transition:background .2s;
  }
  .dots i.done{background:var(--mint)}
  .dots i.now{background:var(--sun)}

  .qcard{
    padding:clamp(16px,3vw,30px);
    min-height:320px;
    display:flex;
    flex-direction:column;
    gap:clamp(12px,2vw,18px);
  }
  .qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .qmeta .num{margin-left:auto;font-size:.85rem;font-weight:800;color:var(--ink-2)}
  .stem{
    font-size:clamp(1.22rem,2.3vw,1.72rem);
    font-weight:800;
    line-height:1.95;
    letter-spacing:.02em;
  }
  .blank{
    display:inline-block;
    width:2.6em;
    height:1.05em;
    margin:0 .12em;
    vertical-align:-.08em;
    border-bottom:4px solid var(--ink);
    border-radius:4px;
    background:rgba(255,201,77,.28);
  }
  .stem mark.word{
    display:inline-block;
    padding:0 .2em;
    border-radius:10px;
    background:rgba(255,201,77,.55);
    box-shadow:inset 0 -0.36em 0 rgba(255,201,77,.55);
    animation:wordPop .32s ease both;
  }
  @keyframes wordPop{
    0%{transform:scale(.5);opacity:0}
    62%{transform:scale(1.14)}
    100%{transform:scale(1);opacity:1}
  }
  .options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:clamp(10px,1.6vw,14px);
  }
  .opt{
    position:relative;
    display:flex;
    align-items:center;
    gap:.6em;
    text-align:left;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:.7em .85em;
    min-height:64px;
    font-size:clamp(1.02rem,1.3vw,1.16rem);
    font-weight:800;
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 5px 0 rgba(59,51,85,.16);
    transition:transform .12s ease, background .15s, box-shadow .12s;
    line-height:1.5;
  }
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,51,85,.16)}
  @media (hover:hover){.opt:hover{background:#FFF7E6;transform:translateY(-2px)}}
  .opt:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
  .opt__key{
    flex:none;
    width:1.85em;height:1.85em;
    border-radius:50%;
    border:2px solid var(--ink);
    background:#F7F0E1;
    display:grid;place-items:center;
    font-size:.85rem;
    font-weight:900;
  }
  .opt__txt{flex:1;min-width:0}
  .opt.is-right{background:#DFF7EE;border-color:#1E8F6C;box-shadow:0 5px 0 rgba(30,143,108,.35)}
  .opt.is-right .opt__key{background:#37C79B;color:#fff;border-color:#1E8F6C}
  .opt.is-wrong{background:#FFE4DC;border-color:#C2472A;box-shadow:0 5px 0 rgba(194,71,42,.3);animation:shake .4s ease}
  .opt.is-wrong .opt__key{background:#FF7F5F;color:#fff;border-color:#C2472A}
  .opt.is-right,.opt.is-wrong{padding-right:3em}
  .opt.is-right::after,.opt.is-wrong::after{position:absolute;right:.75em;top:50%;transform:translateY(-50%);font-size:1.25em;font-weight:900;line-height:1}
  .opt.is-right::after{content:"✓";color:#1E8F6C}

  var $ = function(sel, root){ return (root || document).querySelector(sel); };

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function markWords(text, words){
    var out = esc(text);
    (words || []).forEach(function(w){
      var e = esc(w);
      var i = out.indexOf(e);
      if(i >= 0){ out = out.slice(0, i) + '<mark>' + e + '</mark>' + out.slice(i + e.length); }
    });
    return out;
  }
  function splitWords(text){

  try{

    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){ store.stars = parsed; }
    }
    var rawPlayed = localStorage.getItem(PLAYED_KEY);
    if(rawPlayed){
      var parsedPlayed = JSON.parse(rawPlayed);
      if(parsedPlayed && typeof parsedPlayed === 'object'){ store.played = parsedPlayed; }

  function saveStars(){
    try{ localStorage.setItem(STAR_KEY, JSON.stringify(store.stars)); }catch(e){}

  }

  var Sound = (function(){
    var ctx = null;
    var master = null;
    var enabled = true;
    try{
      var sv = localStorage.getItem(SOUND_KEY);
      if(sv === '0') enabled = false;
    }catch(e){}

    function ensure(){
      if(ctx) {
        if(ctx.state === 'suspended'){ ctx.resume().catch(function(){}); }
        return ctx;
      }
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(ctx.destination);
      }catch(e){ ctx = null; }
      return ctx;
    }
    function note(freq, start, dur, type, vol, toFreq){
      if(!ctx || !master) return;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, start);
      if(toFreq){ o.frequency.exponentialRampToValueAtTime(toFreq, start + dur); }
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol, start + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g);
      g.connect(master);
      o.start(start);
      o.stop(start + dur + 0.03);
    }
    function play(name){
      if(!enabled) return;
      if(!ensure()) return;
      var t = ctx.currentTime;
      if(name === 'tap'){ note(520, t, 0.07, 'triangle', 0.10); }
      else if(name === 'page'){ note(392, t, 0.08, 'sine', 0.08); note(523, t + 0.07, 0.10, 'sine', 0.07); }
      else if(name === 'correct'){ note(660, t, 0.10, 'triangle', 0.13); note(880, t + 0.10, 0.16, 'triangle', 0.12); }
      else if(name === 'wrong'){ note(240, t, 0.20, 'sine', 0.13, 170); }
      else if(name === 'match'){ note(784, t, 0.09, 'triangle', 0.11); note(1046, t + 0.08, 0.12, 'triangle', 0.10); }
      else if(name === 'win'){
        [523, 659, 784, 1046].forEach(function(f, i){
          note(f, t + i * 0.11, 0.20, 'triangle', 0.12);
        });
      }
    }
    return {
      play:play,
      isEnabled:function(){ return enabled; },
      setEnabled:function(v){
        enabled = !!v;
        try{ localStorage.setItem(SOUND_KEY, enabled ? '1' : '0'); }catch(e){}
        if(enabled){ ensure(); play('tap'); }
      },
      unlock:function(){ if(enabled) ensure(); },
      available:function(){ return !!(window.AudioContext || window.webkitAudioContext); }
    };
  })();

  }

  /* =========================================================
     7. 教學頁
     ========================================================= */
  function compareCardHTML(){
    var rows = [
      { k:'無論／不管……都……', d:'先列出兩種或多種情況，後面配「都」。', ex:'無論晴天還是雨天，他都會提早出門。', hl:['無論','都'] },
      { k:'任憑……也……', d:'把情況說到最極端，後面配「也」，語氣更堅定。', ex:'任憑雨下得多大，他也會提早出門。', hl:['任憑','也'] }
    ];
    return '<article class="lcard lcard--cmp" style="--c:#8A85A8;--tint:#EEF1FF">' +
      '<div class="lcard__head"><div class="lcard__icon">' + ICONS.scale + '</div>' +
        '<div><span class="tag" style="--tint:#EEF1FF">容易混淆</span><h3>比一比：「都」和「也」</h3></div></div>' +
      '<p class="lcard__mean">兩組都表示「情況怎樣變，結果都一樣」，差別主要在後半句最常配哪個字。</p>' +
      rows.map(function(r){
        return '<div class="cmp"><b>' + esc(r.k) + '</b><span>' + esc(r.d) + '</span>' +
          '<em>' + markWords(r.ex, r.hl) + '</em></div>';
      }).join('') +
      '<p class="tip"><b>小提醒：</b>最常見的搭配是「無論……都……」和「任憑……也……」，先記住這一組，寫作時就不容易混淆。</p>' +
    '</article>';
  }

  function renderLearn(){
    var grid = $('#learnGrid');
    if(grid.dataset.ready === '1') return;
    grid.innerHTML = CATS.map(function(c){
      var formula = c.formula.map(function(f){
        return '<b>' + esc(f) + '</b>';
      }).join('<i>＋</i>');
      var exs = c.ex.map(function(txt){
        return '<li><span class="txt">' + markWords(txt, c.hl) + '</span>' +
          (Speech.ok ? '<button class="speak" data-speak="' + esc(txt) + '" aria-label="朗讀例句">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#3B3355" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#FFC94D"/><path d="M17 8.5a5 5 0 010 7"/></svg>讀一讀</button>' : '') +
          '</li>';
      }).join('');
      return '<article class="lcard" data-cat="' + c.id + '" style="--c:' + c.color + ';--tint:' + c.tint + '">' +
        '<div class="lcard__head">' +
          '<div class="lcard__icon">' + ICONS[c.icon] + '</div>' +
          '<div><span class="tag" style="--tint:' + c.tint + '">' + esc(c.tag) + '</span>' +
          '<h3>' + esc(c.name) + '</h3></div>' +
        '</div>' +
        '<p class="lcard__mean">' + esc(c.mean) + '</p>' +
        '<div class="formula">' + formula + '</div>' +
        '<ul class="ex">' + exs + '</ul>' +
        '<p class="tip"><b>小提醒：</b>' + esc(c.tip) + '</p>' +
      '</article>';
    }).join('') + compareCardHTML();

    grid.addEventListener('click', function(e){
      var btn = e.target.closest('[data-speak]');
      if(!btn) return;
      var ok = Speech.speak(btn.getAttribute('data-speak'));
      btn.blur();
      if(ok){ Sound.play('tap'); }
    });

    $('#summaryList').innerHTML = CATS.map(function(c){
      return '<button type="button" data-jump="' + c.id + '" style="--tint:' + c.tint + '">' + esc(c.name) + '</button>';

    $('#summaryList').addEventListener('click', function(e){

  /* =========================================================
     8. 選關卡
     ========================================================= */
  function renderLevels(){
    var mode = MODE[state.mode];
    $('#levelsTitle').textContent = mode.name + '：選一關開始';
    $('#levelsHint').textContent = '每關 3 ' + (state.mode === 'A' ? '題' : '對') + '，答對可拿星星。關聯詞會在揭曉答案時才出現。';

    $('#levelsGrid').innerHTML = CATS.map(function(c, idx){
      var s = getStars(state.mode, c.id);
      var known = hasPlayed(state.mode, c.id);
      var stars = '';
      for(var i = 0; i < 3; i++){ stars += starSVG(i < s); }
      return '<button class="level" data-cat="' + c.id + '" style="--c:' + c.color + ';--tint:' + c.tint + '">' +
        '<span class="level__top">' +
          '<span class="level__icon">' + ICONS[c.icon] + '</span>' +
          '<span><small>第 ' + (idx + 1) + ' 關 · ' + esc(c.tag) + '</small><span class="lvname">' + esc(sceneOf(c)) + '</span></span>' +
        '</span>' +
        (known
          ? '<span class="level__words">' + esc(c.name) + '</span>'
          : '<span class="level__words level__words--q">關聯詞：？ 答完就揭曉</span>') +
        '<span class="stars" aria-label="已獲得 ' + s + ' 顆星">' + stars + '</span>' +
        '<span class="level__go"><i>▶</i>' + (known ? '再挑戰一次' : '開始挑戰') + '</span>' +
      '</button>';
    }).join('');
  }

  /* =========================================================
     9. 模式一：選一選
     ========================================================= */
  function startQuiz(catId){
    state.mode = 'A';
    state.catId = catId;
    state.qIndex = 0;
    state.score = 0;
    state.answered = false;
    go('scr-play');
    renderQuiz();
  }

  function renderQuiz(){
    var cat = catById(state.catId);
    var list = QUIZ[cat.id];
    var q = list[state.qIndex];

    $('#playTitle').innerHTML = esc(MODE.A.name) + '<small>' + esc(sceneOf(cat)) + ' · 第 ' + (state.qIndex + 1) + ' / ' + list.length + ' 題</small>';
    $('#playDots').innerHTML = list.map(function(_, i){
      return '<i class="' + (i < state.qIndex ? 'done' : (i === state.qIndex ? 'now' : '')) + '"></i>';
    }).join('');

    var opts = q.opts.map(function(t, i){ return { t:t, ok:i === q.ans }; });
    if(!state.answered){ opts = shuffle(opts); }
    state.optionOrder = opts;

    var optHTML = opts.map(function(o, i){
      var label = String.fromCharCode(65 + i);
      var long = o.t.length > 13 ? ' style="grid-column:1/-1"' : '';
      return '<button class="opt" data-i="' + i + '"' + long + '>' +
        '<span class="opt__key">' + label + '</span>' +
        '<span class="opt__txt">' + esc(o.t) + '</span></button>';
    }).join('');

    var showNote = state.answered;
    var correctText = q.opts[q.ans];

    $('#qcard').innerHTML =
      '<div class="qmeta">' +
        '<span class="tag" style="--tint:#F6F0E2">條件複句</span>' +
        '<span class="tag" style="--tint:#F6F0E2">選一選</span>' +
        '<span class="num">第 ' + (state.qIndex + 1) + ' / ' + list.length + ' 題</span>' +
      '</div>' +
      '<p class="stem" id="stemText">' + (state.answered ? fillStem(q) : esc(q.stem).replace(/___/g, '<span class="blank" aria-label="空格"></span>')) + '</p>' +
      '<div class="options" id="optionWrap">' + optHTML + '</div>' +
      '<div id="noteWrap" aria-live="polite">' + (showNote ? noteHTML(state.lastCorrect, correctText, q.exp, cat) : '') + '</div>' +
      '<div class="qfoot">' +
        '<button class="btn btn--primary" id="nextBtn"' + (showNote ? '' : ' hidden') + '>' +
          (state.qIndex === list.length - 1 ? '看結果' : '下一題') + '</button>' +
      '</div>';

    if(showNote){ paintAnswer(); }

    $('#optionWrap').addEventListener('click', function(e){
      var btn = e.target.closest('.opt');
      if(!btn || state.answered) return;
      answerQuiz(parseInt(btn.getAttribute('data-i'), 10), btn);
    });

    var next = $('#nextBtn');
    next.addEventListener('click', function(){
      Sound.play('tap');
      if(state.qIndex < list.length - 1){
        state.qIndex++;
        state.answered = false;
        state.lastCorrect = null;
        renderQuiz();
      }else{
        finishQuiz();
      }
    });
  }

  function noteHTML(ok, correctText, exp, cat){
    var badge = '<div class="wline">本題關聯詞：' + wordBadge(cat) + '</div>';
    if(ok){
      return '<div class="note note--ok"><span class="note__icon">' + iconCheck() + '</span>' +
        '<div><strong>答對了！</strong>' + badge + '<p>' + esc(exp) + '</p></div></div>';
    }
    return '<div class="note note--no"><span class="note__icon">' + iconCross() + '</span>' +
      '<div><strong>再看一次說明～</strong>' + badge +
      '<p><b>正確答案：' + esc(correctText) + '</b><br>' + esc(exp) + '</p></div></div>';
  }

  function paintAnswer(){
    var btns = $$('#optionWrap .opt');
    btns.forEach(function(b){
      var i = parseInt(b.getAttribute('data-i'), 10);
      var o = state.optionOrder[i];
      b.disabled = true;
      if(o.ok) b.classList.add('is-right');
      if(i === state.pickedIndex && !o.ok) b.classList.add('is-wrong');
    });
  }

  function answerQuiz(i, btn){
    var o = state.optionOrder[i];
    state.answered = true;
    state.pickedIndex = i;
    state.lastCorrect = !!o.ok;
    if(o.ok){
      state.score++;
      Sound.play('correct');
    }else{
      Sound.play('wrong');
    }
    var cat = catById(state.catId);
    var q = QUIZ[cat.id][state.qIndex];
    paintAnswer();
    var stem = $('#stemText');
    if(stem){ stem.innerHTML = fillStem(q); }
    $('#noteWrap').innerHTML = noteHTML(o.ok, q.opts[q.ans], q.exp, cat);
    var next = $('#nextBtn');
    next.hidden = false;
    next.focus({ preventScroll:true });
    next.scrollIntoView({ block:'nearest' });
  }

  function finishQuiz(){
    var cat = catById(state.catId);
    var list = QUIZ[cat.id];
    setStars('A', cat.id, state.score);
    showResult('A', cat, state.score, list.length, list.map(function(q){ return q.full; }));
  }

  /* =========================================================
     10. 模式二：配一配
     ========================================================= */
  function startMatch(catId){
    state.mode = 'B';
    state.catId = catId;
    var cat = catById(catId);
    var pairs = PAIRS[cat.id];
    var left = pairs.map(function(p, i){ return { id:i, text:p.lm, matched:false }; });
    var right = shuffle(pairs.map(function(p, i){ return { id:i, text:p.rm, matched:false }; }));
    state.match = {
      left:left,
      right:right,
      selected:null,
      matched:0,
      firstTry:{},
      mistakes:0
    };
    pairs.forEach(function(_, i){ state.match.firstTry[i] = true; });
    go('scr-match');
    renderMatch();
  }

  function renderMatch(){
    var cat = catById(state.catId);
    var m = state.match;
    var pairs = PAIRS[cat.id];
    var total = pairs.length;

    $('#matchTitle').innerHTML = esc(MODE.B.name) + '<small>' + esc(sceneOf(cat)) + ' · 已配對 ' + m.matched + ' / ' + total + ' 對</small>';
    $('#matchDots').innerHTML = pairs.map(function(_, i){
      var done = m.left.filter(function(x){ return x.id === i && x.matched; }).length > 0;
      return '<i class="' + (done ? 'done' : '') + '"></i>';
    }).join('');

    var leftHTML = ['<div class="mcol__head">條件句</div>'];
    m.left.forEach(function(item, idx){
      var pair = pairs[item.id];
      var text = item.matched ? markWords(pair.l, cat.hl) : esc(item.text);
      leftHTML.push('<button class="mcard' + (item.matched ? ' matched' : '') + (m.selected === item.id ? ' sel' : '') + '" data-side="L" data-id="' + item.id + '">' +
        '<span class="no">' + (idx + 1) + '</span>' + text + '</button>');
    });
    $('#mcolLeft').innerHTML = leftHTML.join('');

    var rightHTML = ['<div class="mcol__head">後半句</div>'];
    m.right.forEach(function(item, idx){
      var isMatched = m.left.filter(function(x){ return x.id === item.id && x.matched; }).length > 0;
      var rText = isMatched ? markWords(pairs[item.id].r, cat.hl) : esc(item.text);
      rightHTML.push('<button class="mcard' + (isMatched ? ' matched' : '') + '" data-side="R" data-id="' + item.id + '">' +
        '<span class="no">' + String.fromCharCode(65 + idx) + '</span>' + rText + '</button>');
    });
    $('#mcolRight').innerHTML = rightHTML.join('');

    if(!m.feedback){
      $('#matchFeed').innerHTML = '<div class="note note--hint"><span class="note__icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="#3B3355" stroke-width="2.2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.4.9 1 .9 1.6h5.2c0-.6.3-1.2.9-1.6A6 6 0 0012 3z"/></svg>' +
        '</span><div><strong>想一想</strong><p>左邊的條件，接上右邊哪一句最通順？不確定時，先把兩句小聲讀一遍。</p></div></div>';
    }
  }

  function onMatchClick(side, id, btn){
    var m = state.match;
    if(!m) return;
    var cat = catById(state.catId);

    if(side === 'L'){
      if(btn.classList.contains('matched')) return;
      m.selected = (m.selected === id) ? null : id;
      m.feedback = false;
      Sound.play('tap');
      renderMatch();
      return;
    }

    // right side
    if(btn.classList.contains('matched')) return;
    if(m.selected === null){
      Sound.play('wrong');
      $('#matchFeed').innerHTML = '<div class="note note--hint"><span class="note__icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="#3B3355" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>' +
        '</span><div><strong>先選左邊</strong><p>請先點一個左邊的「條件句」，再點右邊的「後半句」。</p></div></div>';
      return;
    }

    var selId = m.selected;
    var leftItem = m.left.filter(function(x){ return x.id === selId; })[0];
    var pair = PAIRS[cat.id][selId];

    if(selId === id){
      // correct
      leftItem.matched = true;
      m.matched++;
      m.selected = null;
      Sound.play(m.matched === m.left.length ? 'win' : 'match');
      m.feedback = true;
      renderMatch();
      $('#matchFeed').innerHTML = '<div class="note note--ok"><span class="note__icon">' + iconCheck() + '</span>' +
        '<div><strong>配對成功！</strong>' +
          '<div class="wline">本關關聯詞：' + wordBadge(cat) + '</div>' +
          '<p class="sent">' + markWords(pair.l + '，' + pair.r, cat.hl) + '</p>' +
          '<p>' + esc(pair.exp) + '</p></div></div>';
      $('#matchFeed').scrollIntoView({ behavior:'smooth', block:'nearest' });
      if(m.matched === m.left.length){
        var token = m;
        setTimeout(function(){
          if(state.match === token && state.screen === 'scr-match'){ finishMatch(); }
        }, 900);
      }
      return;
    }

    // wrong
    Sound.play('wrong');
    m.mistakes++;
    m.firstTry[selId] = false;
    m.feedback = true;
    renderMatch();
    var b2 = $('#mcolRight .mcard[data-id="' + id + '"]');
    if(b2){
      b2.classList.add('bad');
      setTimeout(function(){ b2.classList.remove('bad'); }, 450);
    }
    $('#matchFeed').innerHTML = '<div class="note note--no"><span class="note__icon">' + iconCross() + '</span>' +
      '<div><strong>這兩個接不上喔～</strong><p>再想一想：左邊的條件，接上右邊哪一句最通順、意思最合理？換一個後半句試試看。</p></div></div>';
  }

  function finishMatch(){
    var cat = catById(state.catId);
    var m = state.match;
    var got = 0;
    m.left.forEach(function(item){ if(m.firstTry[item.id]) got++; });
    setStars('B', cat.id, got);
    var lines = PAIRS[cat.id].map(function(p){ return p.l + '，' + p.r; });
    showResult('B', cat, got, m.left.length, lines);
  }

  /* =========================================================
     11. 結果頁
     ========================================================= */
  function resultArt(perfect){
    if(perfect){
      return '<svg viewBox="0 0 160 160" aria-hidden="true">' +
        '<circle cx="80" cy="80" r="62" fill="#FFF0D2" stroke="#3B3355" stroke-width="5"/>' +
        '<path d="M80 26l14 30 32 4-24 22 6 32-28-16-28 16 6-32L34 60l32-4z" fill="#FFC94D" stroke="#3B3355" stroke-width="5" stroke-linejoin="round"/>' +
        '<circle cx="66" cy="84" r="5" fill="#3B3355"/><circle cx="94" cy="84" r="5" fill="#3B3355"/>' +
        '<path d="M68 96q12 10 24 0" stroke="#3B3355" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
    }
    return '<svg viewBox="0 0 160 160" aria-hidden="true">' +
      '<circle cx="80" cy="80" r="62" fill="#E1F2FF" stroke="#3B3355" stroke-width="5"/>' +
      '<circle cx="64" cy="74" r="6" fill="#3B3355"/><circle cx="96" cy="74" r="6" fill="#3B3355"/>' +
      '<path d="M64 102q16 12 32 0" stroke="#3B3355" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M52 56q12-10 24-2" stroke="#3B3355" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M108 56q-12-10-24-2" stroke="#3B3355" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
  }

  function showResult(mode, cat, got, total, lines){
    state.lastResult = { mode:mode, catId:cat.id, got:got, total:total };
    var perfect = got === total;
    var bigStars = '';
    for(var i = 0; i < total; i++){ bigStars += starSVG(i < got); }

    var title = perfect ? '太棒了，全部答對！' : (got >= total - 1 ? '很接近了，就差一點！' : '完成這一關，繼續加油！');
    var msg = perfect
      ? '你已經掌握「' + cat.name + '」的用法：' + cat.tip
      : '答對 ' + got + ' / ' + total + '。再讀一次下面的完整句子，然後挑戰一次，把星星補滿吧！';

    var review = lines.map(function(t, i){
      return '<div><b>' + (i + 1) + '.</b> ' + esc(t) + '</div>';
    }).join('');

    $('#resultCard').innerHTML =
      '<div class="result__art">' + resultArt(perfect) + '</div>' +
      '<h2>' + title + '</h2>' +
      '<div class="bigstars" aria-label="獲得 ' + got + ' 顆星">' + bigStars + '</div>' +
      '<p>' + esc(msg) + '</p>' +
      '<div class="result__review"><h3>本關回顧</h3>' + review + '</div>' +
      '<div class="result__btns">' +
        '<button class="btn btn--primary" id="againBtn">再玩一次</button>' +
        '<button class="btn" id="otherBtn">選其他關卡</button>' +
        '<button class="btn btn--ghost" id="homeBtn">回主頁</button>' +
      '</div>';

    $('#againBtn').addEventListener('click', function(){
      Sound.play('tap');
      if(mode === 'A'){ startQuiz(cat.id); } else { startMatch(cat.id); }
    });
    $('#otherBtn').addEventListener('click', function(){
      Sound.play('page');
      openLevels(mode);
    });
    $('#homeBtn').addEventListener('click', function(){
      Sound.play('page');
      go('scr-home');
      renderHome();
    });

    if(perfect){ Sound.play('win'); }
    go('scr-result');
    renderHome();
  }

  /* =========================================================
     12. 導航與事件
     ========================================================= */
  function openLevels(mode){
    state.mode = mode;
    renderLevels();
    go('scr-levels');
  }

  function bind(){
    // 音效開關
    var soundBtn = $('#btnSound');
    function paintSound(){
      var on = Sound.isEnabled();
      soundBtn.classList.toggle('is-off', !on);
      soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      if(on){
        $('#icoSoundOn').removeAttribute('hidden');
        $('#icoSoundOff').setAttribute('hidden', '');
      }else{
        $('#icoSoundOn').setAttribute('hidden', '');
        $('#icoSoundOff').removeAttribute('hidden');
      }
    }
    if(!Sound.available()){
      soundBtn.hidden = true;
    }
    paintSound();
    soundBtn.addEventListener('click', function(){
      Sound.unlock();
      Sound.setEnabled(!Sound.isEnabled());
      paintSound();
    });

    $('#btnHome').addEventListener('click', function(){
      Sound.play('page');
      go('scr-home');
      renderHome();
    });

    document.addEventListener('click', function(e){
      var goBtn = e.target.closest('[data-go]');
      if(goBtn){
        var target = goBtn.getAttribute('data-go');
        if(target === 'learn'){
          Sound.play('page'); renderLearn(); go('scr-learn');
        }else if(target === 'A' || target === 'B'){
          Sound.play('page'); openLevels(target);
        }else if(target === 'home'){
          Sound.play('page'); go('scr-home'); renderHome();
        }
        return;
      }
      var level = e.target.closest('.level');
      if(level){
        var cid = level.getAttribute('data-cat');
        Sound.play('tap');
        if(state.mode === 'A'){ startQuiz(cid); } else { startMatch(cid); }
      }
    });

    $('#levelsBack').addEventListener('click', function(){
      Sound.play('page'); go('scr-home'); renderHome();
    });

    $('#playBack').addEventListener('click', function(){
      Sound.play('page'); openLevels('A');
    });
    $('#matchBack').addEventListener('click', function(){
      Sound.play('page'); openLevels('B');
    });

    $('#mcolLeft').addEventListener('click', function(e){
      var b = e.target.closest('.mcard');
      if(!b) return;
      onMatchClick('L', parseInt(b.getAttribute('data-id'), 10), b);
    });
    $('#mcolRight').addEventListener('click', function(e){
      var b = e.target.closest('.mcard');
      if(!b) return;
      onMatchClick('R', parseInt(b.getAttribute('data-id'), 10), b);
    });

    // 首次互動解鎖音訊
    document.addEventListener('pointerdown', function once(){
      Sound.unlock();
      document.removeEventListener('pointerdown', once);
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(state.screen === 'scr-play'){ openLevels('A'); }
        else if(state.screen === 'scr-match'){ openLevels('B'); }
        else if(state.screen !== 'scr-home'){ go('scr-home'); renderHome(); }
      }
    });
  }

  /* =========================================================
     13. 啟動
     ========================================================= */
  bind();
  renderHome();
  renderLearn();
  go('scr-home');

  // 提供除錯用資訊（不影響使用者）
  window.__TJF = { cats:CATS.length, quiz:Object.keys(QUIZ).length, pairs:Object.keys(PAIRS).length };
})();
</script>
</body>
</html>
