<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF9EF">
<title>四素句大冒險｜小一至小二語文互動遊戲</title>
<meta name="description" content="以卡通場景和音效，透過教學、拼句挑戰與四素分類兩種遊戲，學習時間、人物、地點、事情四素句。">
<style>
:root{
  --ink:#3B2A20;
  --ink-soft:#6B5546;
  --paper:#FFF9EF;
  --card:#FFFFFF;
  --time:#F59E0B;
  --time-bg:#FFF1D4;
  --person:#E8578F;
  --person-bg:#FFE4F0;
  --place:#0F9D74;
  --place-bg:#DCF6EC;
  --action:#3B82F6;
  --action-bg:#E1EDFF;
  --shadow:0 6px 0 rgba(59,42,32,.14);
  --shadow-sm:0 3px 0 rgba(59,42,32,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%, #FFE7C2 0 9rem, transparent 9.1rem),
    radial-gradient(circle at 94% 2%, #D8F1FF 0 7rem, transparent 7.1rem),
    radial-gradient(circle at 50% 100%, #EAFBE6 0 12rem, transparent 12.1rem),
    var(--paper);
  min-height:100dvh;
  font-size:clamp(17px,1.15vw + 12px,21px);
  line-height:1.6;
}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1D5FB0;outline-offset:3px;border-radius:10px}
.mc-icon svg,.teach-card>svg{width:100%;height:100%;display:block}
.teach-card>svg{width:clamp(78px,10vw,120px);height:clamp(78px,10vw,120px);flex:none}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.app{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:min(1120px,100%);margin:0 auto;padding:0 clamp(14px,3vw,28px)}
/* ---------- appbar ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,249,239,.92);
  backdrop-filter:blur(8px);
  border-bottom:3px solid rgba(59,42,32,.12);
}
.appbar-in{display:flex;align-items:center;gap:10px;min-height:64px;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.04em;font-size:clamp(18px,1.4vw + 12px,24px);min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.appbar-spacer{flex:1}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;min-width:48px;padding:0 14px;border-radius:16px;
  border:3px solid var(--ink);background:var(--card);box-shadow:var(--shadow-sm);
  font-weight:800;font-size:16px;transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:24px;height:24px;display:block}
.hint{
  padding:0 clamp(14px,3vw,28px) 8px;font-size:15px;color:#8A5A12;font-weight:700;
  min-height:0;transition:opacity .2s;
}
.hint:empty{display:none}
/* ---------- screens ---------- */
main{flex:1;padding-top:clamp(14px,2.4vw,28px);padding-bottom:clamp(24px,5vw,56px)}
.screen{animation:pop .32s cubic-bezier(.2,1.2,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
/* ---------- home ---------- */
.hero{text-align:center;padding:clamp(6px,2vw,18px) 0 clamp(10px,2vw,20px)}
.hero h1{
  font-size:clamp(30px,5.2vw,64px);line-height:1.16;letter-spacing:.03em;
  text-shadow:0 4px 0 #FFE0A8;
}
.hero h1 .hl{color:#E8578F}
.hero p{margin-top:10px;font-size:clamp(16px,1.4vw,20px);color:var(--ink-soft);font-weight:700}
.mascots{display:flex;justify-content:center;gap:clamp(6px,2vw,22px);flex-wrap:wrap;margin:clamp(10px,2vw,18px) 0 6px}
.mascot{display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(66px,11vw,102px)}
.mascot svg{width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(59,42,32,.12))}
.mascot span{font-weight:900;font-size:clamp(13px,1vw,16px)}
.mascot.t span{color:var(--time)} .mascot.p span{color:var(--person)} .mascot.l span{color:var(--place)} .mascot.a span{color:var(--action)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.8vw,20px);margin-top:clamp(14px,2.4vw,24px)}
.menu-card{
  position:relative;text-align:left;background:var(--card);border:3px solid var(--ink);
  border-radius:26px;padding:clamp(14px,2vw,24px);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:transform .15s ease, box-shadow .15s ease;
  min-height:100%;
}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(59,42,32,.14)}
.menu-card:active{transform:translateY(3px);box-shadow:none}
.menu-card .mc-icon{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px)}
.menu-card h2{font-size:clamp(19px,1.7vw,26px);line-height:1.3}
.menu-card p{font-size:clamp(14px,1.05vw,17px);color:var(--ink-soft);font-weight:700}
.menu-card .tagline{
  align-self:flex-start;margin-top:auto;font-size:13px;font-weight:900;padding:3px 12px;border-radius:999px;
  background:#F0EAE0;color:#6B5546;
}
.menu-card.m1{border-color:#2F7FD1}.menu-card.m1 .tagline{background:var(--action-bg);color:#1D5FB0}
.menu-card.m2{border-color:#0F9D74}.menu-card.m2 .tagline{background:var(--place-bg);color:#0A7A5A}
.menu-card.teach{border-color:#D08700}.menu-card.teach .tagline{background:var(--time-bg);color:#8A5A12}
.footnote{text-align:center;color:#9A8879;font-size:13px;font-weight:700;margin-top:18px}
/* ---------- section head ---------- */
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:clamp(10px,2vw,18px);flex-wrap:wrap}
.section-head h1{font-size:clamp(24px,3.2vw,40px);line-height:1.2}
.section-head p{color:var(--ink-soft);font-weight:700;font-size:clamp(14px,1.1vw,18px)}
/* ---------- teaching ---------- */
.teach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.8vw,18px)}
.teach-card{
  background:var(--card);border:3px solid var(--ink);border-radius:26px;
  padding:clamp(14px,2vw,22px);box-shadow:var(--shadow);
  display:flex;gap:clamp(10px,1.6vw,18px);align-items:center;
}
.teach-card .tc-icon{width:clamp(76px,10vw,120px);height:clamp(76px,10vw,120px);flex:none}
.teach-card h2{font-size:clamp(20px,2vw,28px)}
.teach-card .q{font-weight:900;font-size:clamp(15px,1.2vw,19px);margin:2px 0 6px}
.teach-card .ex{display:flex;flex-wrap:wrap;gap:6px}
.teach-card .ex span{font-size:clamp(13px,1vw,16px);font-weight:800;padding:3px 10px;border-radius:999px;background:#F5EFE5}
.teach-card.time{border-color:var(--time)} .teach-card.time h2,.teach-card.time .q{color:#B57000}
.teach-card.person{border-color:var(--person)} .teach-card.person h2,.teach-card.person .q{color:#C23A70}
.teach-card.place{border-color:var(--place)} .teach-card.place h2,.teach-card.place .q{color:#0A7A5A}
.teach-card.action{border-color:var(--action)} .teach-card.action h2,.teach-card.action .q{color:#1D5FB0}
.formula{
  margin-top:clamp(14px,2.2vw,22px);background:#FFF3D9;border:3px dashed #D08700;border-radius:24px;
  padding:clamp(14px,2vw,22px);text-align:center;
}
.formula h2{font-size:clamp(17px,1.4vw,22px);color:#8A5A12}
.formula .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:10px}
.pill{font-weight:900;font-size:clamp(16px,1.6vw,24px);padding:6px 16px;border-radius:999px;border:3px solid}
.pill.time{background:var(--time-bg);border-color:var(--time);color:#8A5A12}
.pill.person{background:var(--person-bg);border-color:var(--person);color:#C23A70}
.pill.place{background:var(--place-bg);border-color:var(--place);color:#0A7A5A}
.pill.action{background:var(--action-bg);border-color:var(--action);color:#1D5FB0}
.plus{font-weight:900;font-size:clamp(18px,1.8vw,26px);color:#9A8879}
.example{
  margin-top:clamp(12px,2vw,18px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(12px,2vw,22px);align-items:center;background:var(--card);border:3px solid var(--ink);
  border-radius:26px;padding:clamp(12px,1.8vw,20px);box-shadow:var(--shadow);
}
.example .scene{aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:#EAF7FF}
.example .scene svg{width:100%;height:100%;display:block}
.example h2{font-size:clamp(18px,1.5vw,24px);margin-bottom:8px}
.sentence{font-size:clamp(20px,2.2vw,32px);font-weight:900;line-height:1.9}
.tag{display:inline-block;padding:0 8px;border-radius:10px;line-height:1.55}
.tag.time{background:var(--time-bg);color:#8A5A12;border-bottom:4px solid var(--time)}
.tag.person{background:var(--person-bg);color:#C23A70;border-bottom:4px solid var(--person)}
.tag.place{background:var(--place-bg);color:#0A7A5A;border-bottom:4px solid var(--place)}
.tag.action{background:var(--action-bg);color:#1D5FB0;border-bottom:4px solid var(--action)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:10px 22px;border-radius:18px;border:3px solid var(--ink);
  background:var(--card);font-weight:900;font-size:clamp(16px,1.2vw,19px);
  box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn-primary{background:#FFD86B}
.btn-blue{background:#8ECBFF}
.btn-green{background:#8FE3C4}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,14px);margin-top:clamp(12px,2vw,18px)}
.tip-card{background:#FFFDF7;border:2px solid #E4D8C8;border-radius:18px;padding:12px 14px;font-size:clamp(13px,1vw,16px);font-weight:700;color:var(--ink-soft)}
.tip-card b{display:block;color:var(--ink);font-size:1.05em;margin-bottom:2px}
/* ---------- play ---------- */
.play-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:6px;flex:1;min-width:120px}
.dot{flex:1;max-width:52px;height:10px;border-radius:999px;background:#EDE3D6;border:2px solid rgba(59,42,32,.12)}
.dot.done{background:#8FE3C4;border-color:#0F9D74}
.dot.now{background:#FFD86B;border-color:#D08700}
.score-tag{font-weight:900;font-size:15px;background:#FFF3D9;border:2px solid #E9C98B;border-radius:999px;padding:4px 12px;white-space:nowrap}
.play-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(12px,2vw,24px);align-items:start}
.scene-card{
  background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:10px;
  box-shadow:var(--shadow);position:relative;
}
.scene-card .scene{aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#EAF7FF;border:2px solid rgba(59,42,32,.15)}
.scene-card .scene svg{width:100%;height:100%;display:block}
.scene-cap{
  position:absolute;left:18px;bottom:18px;background:rgba(255,255,255,.94);border:2px solid var(--ink);
  border-radius:14px;padding:4px 12px;font-size:clamp(13px,1vw,16px);font-weight:900;
}
.work{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:clamp(12px,1.8vw,20px);box-shadow:var(--shadow)}
.prompt{font-weight:900;font-size:clamp(16px,1.3vw,20px);margin-bottom:10px}
.prompt small{display:block;font-weight:700;color:var(--ink-soft);font-size:.82em;margin-top:2px}
/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{
  border:3px dashed #D9C9B6;border-radius:16px;min-height:clamp(72px,9vw,90px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px 3px;background:#FFFDF8;transition:background .15s,border-color .15s,transform .12s;
  text-align:center;
}
.slot .lb{font-size:clamp(11px,.9vw,13px);font-weight:900;letter-spacing:.08em;opacity:.85}
.slot .val{font-size:clamp(15px,1.5vw,22px);font-weight:900;line-height:1.3;word-break:break-all}
.slot .empty{color:#CDBCA9;font-size:1.25em}
.slot.time .lb{color:var(--time)} .slot.person .lb{color:var(--person)} .slot.place .lb{color:var(--place)} .slot.action .lb{color:var(--action)}
.slot.filled{border-style:solid;background:#FFF8E9;border-color:var(--ink);transform:translateY(-1px)}
.slot.correct{border-color:#0F9D74;background:#E4F8EF}
.slot.wrong{border-color:#E05A5A;background:#FFEBEB}
.slot .mark{font-size:13px;font-weight:900}
.slot.correct .mark{color:#0A7A5A} .slot.wrong .mark{color:#C23A3A}
.slot:disabled{cursor:default}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  min-height:50px;padding:8px 18px;border-radius:16px;border:3px solid var(--ink);background:#fff;
  font-weight:900;font-size:clamp(16px,1.4vw,21px);box-shadow:var(--shadow-sm);
  transition:transform .12s,box-shadow .12s,opacity .12s;
}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.used{opacity:.28;box-shadow:none;transform:translateY(3px);pointer-events:none}
.chip.picked{background:#FFE9A8;transform:translateY(-2px)}
/* mode 2 */
.bank-label{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.02em}
.sent-card{background:#FFF8EA;border:3px solid var(--ink);border-radius:20px;padding:14px;margin-bottom:12px}
.sent-line{display:block;font-size:clamp(18px,1.9vw,27px);font-weight:900;line-height:2.1}
.sent-line .chunk{margin:3px 2px;padding:2px 10px}
.chunk{
  padding:2px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-weight:900;
  font-size:inherit;box-shadow:var(--shadow-sm);
}
.chunk.sel{background:#FFE9A8;transform:translateY(-2px)}
.chunk.done{opacity:.35;box-shadow:none;text-decoration:line-through}
.chunk.correct{background:#E4F8EF;border-color:#0F9D74}
.chunk.wrong{background:#FFEBEB;border-color:#E05A5A}
.baskets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.basket{
  border:3px solid;border-radius:18px;padding:8px;min-height:clamp(74px,8.5vw,92px);
  display:flex;flex-direction:column;gap:3px;background:#FFFDF8;text-align:left;
  transition:transform .12s;
}
.basket .bh{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(13px,1.05vw,16px)}
.basket .bh svg{width:20px;height:20px;flex:none}
.basket .bv{font-size:clamp(15px,1.35vw,20px);font-weight:900;min-height:1.4em;padding-left:2px}
.basket.time{border-color:var(--time);background:var(--time-bg)} .basket.time .bh{color:#8A5A12}
.basket.person{border-color:var(--person);background:var(--person-bg)} .basket.person .bh{color:#C23A70}
.basket.place{border-color:var(--place);background:var(--place-bg)} .basket.place .bh{color:#0A7A5A}
.basket.action{border-color:var(--action);background:var(--action-bg)} .basket.action .bh{color:#1D5FB0}
.basket.hintable{outline:4px dashed rgba(59,42,32,.22);outline-offset:2px}
.basket.correct{box-shadow:inset 0 0 0 3px #0F9D74}
.basket.wrong{box-shadow:inset 0 0 0 3px #E05A5A}
/* reveal */
.reveal{
  margin-top:12px;border:3px solid var(--ink);border-radius:22px;background:#FFFDF7;padding:clamp(12px,1.8vw,18px);
  animation:pop .3s cubic-bezier(.2,1.2,.5,1);
}
.reveal.good{background:#F1FCF6;border-color:#0F9D74}
.reveal.warn{background:#FFF9EC;border-color:#D08700}
.reveal-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-weight:900;font-size:clamp(15px,1.2vw,18px);padding:3px 12px;border-radius:999px;border:2px solid}
.badge.good{background:#C9F3E1;border-color:#0F9D74;color:#0A7A5A}
.badge.warn{background:#FFE7B0;border-color:#D08700;color:#8A5A12}
.ans-line{font-size:clamp(18px,1.8vw,26px);font-weight:900;line-height:1.9;margin:2px 0 8px}
.explain{display:grid;gap:6px}
.explain li{display:flex;gap:8px;font-size:clamp(14px,1.12vw,17px);font-weight:700;line-height:1.55;align-items:flex-start}
.explain .k{flex:none;font-weight:900;padding:0 8px;border-radius:8px;font-size:.95em}
.explain .k.time{background:var(--time-bg);color:#8A5A12}
.explain .k.person{background:var(--person-bg);color:#C23A70}
.explain .k.place{background:var(--place-bg);color:#0A7A5A}
.explain .k.action{background:var(--action-bg);color:#1D5FB0}
.tip-line{
  margin-top:8px;font-size:clamp(13px,1vw,16px);font-weight:800;color:#7A5A22;
  background:#FFF3D9;border-radius:12px;padding:6px 10px;
}
/* result */
.result{max-width:760px;margin:0 auto;text-align:center}
.result-card{background:var(--card);border:3px solid var(--ink);border-radius:30px;padding:clamp(18px,3vw,34px);box-shadow:var(--shadow)}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.stars svg{width:clamp(44px,7vw,64px);height:auto}
.result h1{font-size:clamp(24px,3.4vw,42px)}
.result .sub{color:var(--ink-soft);font-weight:800;margin-top:4px}
.result-list{margin-top:16px;text-align:left;display:grid;gap:6px}
.result-list li{display:flex;gap:8px;align-items:flex-start;font-size:clamp(14px,1.1vw,17px);font-weight:700;background:#FFFDF7;border:2px solid #EDE2D3;border-radius:14px;padding:8px 12px}
.result-list .rm{flex:none;font-weight:900}
.result-list .rm.ok{color:#0A7A5A} .result-list .rm.no{color:#B57000}
/* misc */
.no-script{padding:24px;text-align:center;font-weight:800}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (max-width:860px){
  .menu{grid-template-columns:1fr}
  .menu-card{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"icon title" "icon desc";align-items:center;column-gap:14px;row-gap:0;min-height:0}
  .menu-card .mc-icon{grid-area:icon;flex:none}
  .menu-card h2{grid-area:title;white-space:nowrap}
  .menu-card p{grid-area:desc}
  .menu-card .tagline{display:none}
  .teach-grid{grid-template-columns:1fr}
  .example{grid-template-columns:1fr}
  .play-grid{grid-template-columns:1fr}
  .tips{grid-template-columns:1fr}
  .section-head h1{font-size:clamp(22px,5.4vw,32px)}
}
@media (max-width:520px){
  .slots{grid-template-columns:repeat(2,1fr)}
  .sent-line{font-size:clamp(16px,4.5vw,19px);line-height:1.95}
  .sent-line .chunk{padding:1px 7px;margin:2px 1px}
  .chip{padding:8px 13px}
  .appbar-in{min-height:58px}
  .brand .txt{font-size:17px}
  .menu-card .tagline{display:none}
  .scene-cap{font-size:12px;left:14px;bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>

function buildScene(q) {
  var art = SCENE_ART[q.id] || SCENE_ART['m1-1'];
  var c = SKY[q.sky] || SKY.day;
  var gid = 'sky-' + q.id;
  var s = '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs>' +
    '<rect width="400" height="300" fill="url(#' + gid + ')"/>';
  // 天空元素
  if (q.sky === 'night') {
    s += moonAt(330, 54, 22);
    s += '<g fill="#FFF9D6"><circle cx="60" cy="42" r="2.2"/><circle cx="120" cy="26" r="1.8"/><circle cx="230" cy="38" r="2.4"/><circle cx="290" cy="22" r="1.6"/><circle cx="160" cy="62" r="1.6"/></g>';
  } else {
    var sx = (q.sky === 'morning' || q.sky === 'day') ? 58 : 330;
    var sy = q.sky === 'noon' ? 44 : (q.sky === 'morning' ? 52 : 58);
    s += sunAt(sx, sy, 25);
    if (q.sky === 'morning') {
      s += cloud(170, 46, .9) + cloud(250, 74, .7);
    } else {
      s += cloud(60, 50, .95) + cloud(160, 32, .75) + cloud(238, 80, .62);
    }
  }
  var bg = SCENES[art.bg] || SCENES.park;
  s += bg();
  s += (POSES[art.pose] || poseRun)(PEOPLE[q.person] || PEOPLE['小明'], art.x, art.y, art.s);
  if (art.fg && FOREGROUND[art.fg]) s += FOREGROUND[art.fg]();
  // 教室故事氣泡（在人物之後）
  if (q.id === 'm2-2') {
    s += '<g transform="translate(286,112) scale(.9)">' +
      P('M-38,-34 q0,-18 38,-18 q38,0 38,18 q0,18 -30,20 L40,26 L22,4 q-60,2 -60,-38Z', '#FFFDF7', 2.8) +
      '<circle cx="-12" cy="-18" r="7" fill="#FFB3C7" stroke="' + INK + '" stroke-width="2"/>' +
      '<circle cx="14" cy="-18" r="7" fill="#FFD86B" stroke="' + INK + '" stroke-width="2"/>' +
      '<path d="M-20,-4 q10,8 20,0 q10,8 20,0" fill="none" stroke="' + INK + '" stroke-width="2.4"/>' +
      '<path d="M-6,-26 q6,-4 12,0" fill="none" stroke="' + INK + '" stroke-width="2"/>' +
      '</g>';
  }
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' +
    (q.time + '，' + q.person + '在' + q.place + q.action) + '">' + s + '</svg>';
}

/* =========================================================
   4. 音效與語音
   ========================================================= */
var actx = null;
var soundOn = true;

function ensureAudio(){
  if(!soundOn) return null;
  try{
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended'){ actx.resume(); }
    return actx;
  }catch(e){ return null; }
}

function beep(freq, delay, dur, type, vol){
  var ctx = ensureAudio();
  if(!ctx) return;
  try{
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    var t = ctx.currentTime + (delay || 0);
    var v = vol || 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.16));
    o.start(t); o.stop(t + (dur || 0.16) + 0.04);
  }catch(e){}
}

function sfx(name){
  if(!soundOn) return;
  if(name==='tap') beep(680, 0, 0.07, 'triangle', 0.07);
  else if(name==='pick'){ beep(880, 0, 0.07, 'sine', 0.09); }
  else if(name==='place'){ beep(520, 0, 0.08, 'triangle', 0.08); beep(780, 0.05, 0.09, 'sine', 0.07); }
  else if(name==='right'){ beep(523.25, 0, 0.14); beep(659.25, 0.12, 0.14); beep(783.99, 0.24, 0.22); }
  else if(name==='wrong'){ beep(233.08, 0, 0.18, 'sawtooth', 0.07); beep(174.61, 0.14, 0.26, 'sawtooth', 0.06); }
  else if(name==='win'){ beep(523.25,0,0.14); beep(659.25,0.13,0.14); beep(783.99,0.26,0.14); beep(1046.5,0.39,0.32); }
}

var speechOK = (typeof window !== 'undefined') && ('speechSynthesis' in window);

function speak(text){
  if(!soundOn) return;
  if(!speechOK || typeof window.SpeechSynthesisUtterance !== 'function'){
    showHint('這個裝置暫時不支援語音朗讀，你可以自己讀一次。');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    u.rate = 0.82;
    u.pitch = 1.08;
    u.onerror = function(){ showHint('語音朗讀未能播放，你可以自己讀一次。'); };
    window.speechSynthesis.speak(u);
  }catch(e){
    showHint('語音朗讀暫時未能使用，你可以自己讀一次。');
  }
}

var MODE1_CORRECT = function(q){ return [q.time, q.person, '在'+q.place, q.action]; };
var MODE2_PARTS = function(q){ return [q.time, q.person, '在'+q.place, q.action]; };

var state = {
  view:'home',
  mode:1,
  qi:0,
  score:0,
  results:[],
  chips:[],
  slots:[null,null,null,null],
  assign:[-1,-1,-1,-1],
  order:[0,1,2,3],
  sel:-1,
  pick:-1,
  reveal:null,
  started:false
};

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function sentenceOf(q){ return q.time + '，' + q.person + '在' + q.place + q.action + '。'; }

function currentList(){ return state.mode === 1 ? MODE1 : MODE2; }
function currentQ(){ return currentList()[state.qi]; }
function correctOf(q){ return state.mode === 1 ? MODE1_CORRECT(q) : MODE2_PARTS(q); }

/* ---------- 遊戲 ---------- */
function startGame(mode){
  state.mode = mode;
  state.qi = 0;
  state.score = 0;
  state.results = [];
  state.view = 'play';
  state.started = true;
  loadQuestion();
  render();
  sfx('tap');
}

function loadQuestion(){
  var q = currentQ();
  state.reveal = null;
  state.sel = -1;
  state.pick = -1;
  if(state.mode === 1){
    state.chips = shuffle(q.words);
    state.slots = [null,null,null,null];
  } else {
    state.assign = [-1,-1,-1,-1];
    state.order = shuffle([0,1,2,3]);
  }
}

function renderPlay(){
  var q = currentQ();
  var dots = '';
  for(var i=0;i<6;i++){
    var cls = i < state.qi ? 'done' : (i === state.qi ? 'now' : '');
    dots += '<span class="dot '+cls+'"></span>';
  }
  var prompt = state.mode === 1
    ? '先點下面的詞語，再點入所屬的格子。<small>點已放入的格子，可以把詞語拿出來。</small>'
    : '點一個詞語，再點它所屬的四素屋子。<small>每個屋子只放一個詞語。</small>';

  var caption = state.mode === 1 ? '看圖找一找：時間、人物、地點、事情。' : '讀一讀句子，再分類。';

  var html = '<section class="screen play">'+
    '<div class="play-top">'+
      '<div class="dots" aria-label="第 '+(state.qi+1)+' 題，共 6 題">'+dots+'</div>'+
      '<span class="score-tag">答對 '+state.score+' / 6</span>'+
      '<span class="score-tag">第 '+(state.qi+1)+' 題</span>'+
    '</div>'+
    '<div class="play-grid">'+
      '<div class="scene-card"><div class="scene">'+buildScene(q)+'</div><span class="scene-cap">'+caption+'</span></div>'+
      '<div class="work">'+
        '<p class="prompt">'+prompt+'</p>'+
        '<div id="workBody"></div>'+
        '<div id="revealBox" aria-live="polite"></div>'+
      '</div>'+
    '</div>'+
  '</section>';
  screen.innerHTML = html;
  paintWork();
}

function paintWork(){
  var q = currentQ();
  var body = document.getElementById('workBody');
  var revealBox = document.getElementById('revealBox');
  if(!body || !revealBox) return;

  if(state.mode === 1){
    var labels = ['時間','人物','地點','事情'];
    var keys = ['time','person','place','action'];
    var slotsHTML = '<div class="slots">';
    for(var i=0;i<4;i++){
      var val = state.slots[i];
      var cls = 'slot ' + keys[i] + (val ? ' filled' : '');
      var mark = '';
      if(state.reveal){
        cls += state.reveal[i] ? ' correct' : ' wrong';
        mark = '<span class="mark">'+(state.reveal[i] ? '✓ 正確' : '✗ 再想想')+'</span>';
      }
      slotsHTML += '<button class="'+cls+'" data-act="slot" data-i="'+i+'" '+(state.reveal?'disabled':'')+' aria-label="'+labels[i]+'：'+(val||'空白')+'">'+
        '<span class="lb">'+labels[i]+'</span>'+
        '<span class="val">'+(val || '<span class="empty">？</span>')+'</span>'+ mark +
      '</button>';
    }
    slotsHTML += '</div>';

    var chipsHTML = '<div class="chips">';
    for(var j=0;j<state.chips.length;j++){
      var w = state.chips[j];
      var used = state.slots.indexOf(w) !== -1;
      var picked = state.pick === j;
      chipsHTML += '<button class="chip'+(used?' used':'')+(picked?' picked':'')+'" data-act="chip" data-i="'+j+'" '+(used||state.reveal?'disabled':'')+' aria-pressed="'+picked+'">'+w+'</button>';
    }
    chipsHTML += '</div>';

    var filled = state.slots.every(function(v){ return v; });
    var btnLabel = state.reveal ? '下一題' : '檢查句子';
    var btnAct = state.reveal ? 'next' : 'check';
    var disabled = state.reveal ? '' : (filled ? '' : 'disabled');

    body.innerHTML = slotsHTML + chipsHTML +
      (state.reveal ? '' : '<div class="btn-row"><button class="btn btn-primary" data-act="check" '+disabled+'>檢查句子</button></div>');
  } else {
    var parts = MODE2_PARTS(q);
    var sent = '<div class="sent-card"><p class="bank-label">詞語卡（已打亂次序）</p><div class="sent-line">';
    for(var oi=0;oi<4;oi++){
      var k = state.order[oi];
      var done = state.assign.indexOf(k) !== -1;
      var sel = state.sel === k;
      var cls2 = 'chunk' + (done ? ' done' : '') + (sel ? ' sel' : '');
      sent += '<button class="'+cls2+'" data-act="chunk" data-i="'+k+'" '+(state.reveal?'disabled':'')+' aria-pressed="'+sel+'">'+parts[k]+'</button>';
    }
    sent += '</div></div>';

    var bLabels = ['時間','人物','地點','事情'];
    var bKeys = ['time','person','place','action'];
    var bIcons = [iconTime(), iconPerson(), iconPlace(), iconAction()];
    var baskets = '<div class="baskets">';
    for(var b=0;b<4;b++){
      var who = state.assign[b];
      var bcls = 'basket ' + bKeys[b];
      if(state.sel !== -1 && who === -1) bcls += ' hintable';
      if(state.reveal){ bcls += (who === b) ? ' correct' : ' wrong'; }
      baskets += '<button class="'+bcls+'" data-act="basket" data-i="'+b+'" '+(state.reveal?'disabled':'')+'>'+
        '<span class="bh">'+bIcons[b]+bLabels[b]+'</span>'+
        '<span class="bv">'+(who === -1 ? '放這裏' : parts[who])+'</span>'+
      '</button>';
    }
    baskets += '</div>';

    var allPlaced = state.assign.every(function(v){ return v !== -1; });
    var btn2 = state.reveal ? '下一題' : '檢查答案';
    var act2 = state.reveal ? 'next' : 'check';
    var dis2 = state.reveal ? '' : (allPlaced ? '' : 'disabled');

    body.innerHTML = sent + baskets +
      '<div class="btn-row"><button class="btn btn-primary" data-act="'+act2+'" '+dis2+'>'+btn2+'</button>'+
      (state.reveal ? '' : '<button class="btn" data-act="speak" data-text="'+sentenceOf(q)+'">聽一聽句子</button>')+'</div>';
  }

  if(state.reveal){
    revealBox.innerHTML = revealHTML(q) +
      '<div class="btn-row"><button class="btn btn-primary" data-act="next">'+(state.qi<5?'下一題':'看成績')+'</button>'+
      '<button class="btn" data-act="speak" data-text="'+sentenceOf(q)+'">聽一聽答案</button></div>';
    revealBox.className = '';
  } else {
    revealBox.innerHTML = '';
  }
}

function sentenceHTML(q){
  return '<span class="tag time">'+q.time+'</span>，<span class="tag person">'+q.person+'</span><span class="tag place">在'+q.place+'</span><span class="tag action">'+q.action+'</span>。';
}

function revealHTML(q){
  var allRight = state.reveal.every(Boolean);
  var rows = [
    ['time','時間',q.time,'告訴我們事情在甚麼時候發生。'],
    ['person','人物',q.person,'是做這件事的人。'],
    ['place','地點','在'+q.place,'說明事情在哪裏發生。'],
    ['action','事情',q.action,'是人物做的事。']
  ];
  var list = '';
  rows.forEach(function(r){
    list += '<li><span class="k '+r[0]+'">'+r[1]+'</span><span>「'+r[2]+'」'+r[3]+'</span></li>';
  });
  return '<div class="reveal '+(allRight?'good':'warn')+'">'+
    '<div class="reveal-head"><span class="badge '+(allRight?'good':'warn')+'">'+(allRight?'答對了，真棒！':'看一下解說，再試下一題')+'</span></div>'+
    '<p class="ans-line">'+sentenceHTML(q)+'</p>'+
    '<ul class="explain">'+list+'</ul>'+
    '<p class="tip-line">小貼士：'+q.tip+'</p>'+
  '</div>';
}

function checkAnswer(){
  var q = currentQ();
  if(state.mode === 1){
    if(state.slots.indexOf(null) !== -1) return;
    var right = MODE1_CORRECT(q);
    state.reveal = state.slots.map(function(v,i){ return v === right[i]; });
  } else {
    if(state.assign.indexOf(-1) !== -1) return;
    state.reveal = state.assign.map(function(v,i){ return v === i; });
  }
  var allRight = state.reveal.every(Boolean);
  state.results[state.qi] = allRight;
  if(allRight) state.score += 1;
  paintWork();
  sfx(allRight ? 'right' : 'wrong');
  var box = document.getElementById('revealBox');
  if(box && typeof box.scrollIntoView === 'function'){
    setTimeout(function(){
      try{ box.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
    }, 80);
  }
}

function nextQuestion(){
  if(state.qi < 5){
    state.qi += 1;
    loadQuestion();
    renderPlay();
    try{ window.scrollTo({top:0,behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
    sfx('tap');
  } else {
    state.view = 'result';
    render();
    sfx('win');
  }
}

function starPath(filled){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.7 1.2 6.5L12 17.5 6.1 20.7l1.2-6.5L2.5 9.5l6.6-.9z" fill="'+(filled?'#FFC93C':'#E8E0D3')+'" stroke="#3B2A20" stroke-width="1.4" stroke-linejoin="round"/></svg>';

function renderResult(){
  var score = state.score;
  var stars = score >= 6 ? 3 : (score >= 4 ? 2 : (score >= 2 ? 1 : 0));
  var title = score >= 6 ? '四素小達人！' : (score >= 4 ? '做得不錯！' : '再練習一下！');
  var starHTML = '';
  for(var s=0;s<3;s++){ starHTML += starPath(s < stars); }

  var list = '';
  var listData = state.mode === 1 ? MODE1 : MODE2;
  for(var i=0;i<listData.length;i++){
    var ok = state.results[i] === true;
    list += '<li><span class="rm '+(ok?'ok':'no')+'">'+(ok?'✓':'△')+'</span><span>'+sentenceOf(listData[i])+'</span></li>';
  }

  var html = '<section class="screen result">'+
    '<div class="result-card">'+
      '<div class="stars">'+starHTML+'</div>'+
      '<h1>'+title+'</h1>'+
      '<p class="sub">'+(state.mode === 1 ? '拼句大挑戰' : '四素分類王')+'：答對 '+score+' / 6 題</p>'+
      '<ul class="result-list">'+list+'</ul>'+
      '<div class="btn-row" style="justify-content:center;margin-top:18px">'+
        '<button class="btn btn-primary" data-act="again">再玩一次</button>'+
        '<button class="btn btn-blue" data-act="start" data-mode="'+(state.mode === 1 ? 2 : 1)+'">試另一個模式</button>'+
        '<button class="btn" data-act="home">返回主頁</button>'+
      '</div>'+
    '</div>'+
  '</section>';
  screen.innerHTML = html;
}

/* =========================================================
   7. 事件
   ========================================================= */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  ensureAudio();

  if(act === 'go'){
    state.view = t.getAttribute('data-view') || 'home';
    sfx('tap');
    render();
    return;
  }
  if(act === 'home'){
    if(window.speechSynthesis) { try{ window.speechSynthesis.cancel(); }catch(err){} }
    state.view = 'home';
    sfx('tap');
    render();
    return;
  }
  if(act === 'start'){
    startGame(parseInt(t.getAttribute('data-mode'),10) || 1);
    return;
  }
  if(act === 'again'){
    startGame(state.mode);
    return;
  }
  if(act === 'speak'){
    speak(t.getAttribute('data-text') || '');
    return;
  }
  if(act === 'slot'){
    if(state.reveal) return;
    var si = parseInt(t.getAttribute('data-i'),10);
    if(state.slots[si]){
      state.slots[si] = null;
      state.pick = -1;
      sfx('tap');
      paintWork();
    } else if(state.pick >= 0){
      var pw = state.chips[state.pick];
      if(state.slots.indexOf(pw) === -1){
        state.slots[si] = pw;
        state.pick = -1;
        sfx('place');
        paintWork();
      }
    } else {
      showHint('先在下面點一個詞語，再點這個格子。');
    }
    return;
  }
  if(act === 'chip'){
    if(state.reveal) return;
    var ci = parseInt(t.getAttribute('data-i'),10);
    if(state.slots.indexOf(state.chips[ci]) !== -1) return;
    state.pick = (state.pick === ci) ? -1 : ci;
    sfx('pick');
    paintWork();
    return;
  }
  if(act === 'chunk'){
    if(state.reveal) return;
    var ki = parseInt(t.getAttribute('data-i'),10);
    var at = state.assign.indexOf(ki);
    if(at !== -1){
      state.assign[at] = -1;
      state.sel = -1;
      sfx('tap');
    } else {
      state.sel = (state.sel === ki) ? -1 : ki;
      sfx('pick');
    }
    paintWork();
    return;
  }
  if(act === 'basket'){
    if(state.reveal) return;
    var bi = parseInt(t.getAttribute('data-i'),10);
    if(state.sel === -1){
      if(state.assign[bi] !== -1){
        showHint('先點上面句子裏的詞語，再點屋子。');
      } else {
        showHint('先點一個詞語，再點它的屋子。');
      }
      return;
    }
    if(state.assign[bi] !== -1){
      state.assign[bi] = -1;
    }
    state.assign[bi] = state.sel;
    state.sel = -1;
    sfx('place');
    paintWork();
    return;
  }
  if(act === 'check'){
    sfx('tap');
    checkAnswer();
    return;
  }
  if(act === 'next'){
    sfx('tap');
    nextQuestion();
    return;
  }
});

soundBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  if(!soundOn && window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  if(soundOn){ ensureAudio(); sfx('tap'); }
  updateChrome();
  showHint(soundOn ? '音效已開啟。' : '音效已關閉。');
});

/* 首次互動解鎖音訊 */
document.addEventListener('pointerdown', function once(){
  ensureAudio();
  document.removeEventListener('pointerdown', once);
}, {passive:true});

/* 啟動 */
soundOn = true;
render();
})();
</script>
