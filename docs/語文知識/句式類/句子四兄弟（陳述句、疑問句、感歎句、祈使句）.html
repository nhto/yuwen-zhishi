<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>句子四兄弟 · 句型探險隊｜小學四類句式互動遊戲</title>
<meta name="description" content="小學語文四類句式（陳述、疑問、祈使、感嘆）互動學習遊戲：四張教學卡、兩種綜合模式、四類專屬小遊戲與限時挑戰塔，卡通 Q 版、繁體字、即時音效，手機、平板、電腦均適用。">
<meta name="theme-color" content="#FFF8EC">
<style>
/* ===== 設計變數 ===== */
:root{
  --ink:#22303C;
  --ink-soft:#5B6B78;
  --cream:#FFF8EC;
  --card:#FFFFFF;
  --blue:#3B7DD8;   --blue-l:#E7F0FC;
  --yellow:#EFA63A; --yellow-l:#FDF1DC;
  --green:#34A07A;  --green-l:#E3F4ED;
  --coral:#E85C4A;  --coral-l:#FCE8E4;
  --line:rgba(34,48,60,.14);
  --hard:0 5px 0 rgba(34,48,60,.14);
  --hard-lg:0 8px 0 rgba(34,48,60,.10);
  --radius:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background-color:var(--cream);
  background-image:radial-gradient(circle at 1px 1px, rgba(34,48,60,.075) 1.2px, transparent 1.4px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Source Han Sans TC","Noto Sans CJK TC","Heiti TC",system-ui,sans-serif;
  font-size:clamp(17px,0.55vw + 13.5px,20px);
  line-height:1.65;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:4px solid rgba(59,125,216,.45);outline-offset:3px}

/* ===== 頂欄 ===== */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:8px clamp(12px,3vw,26px);
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:rgba(255,248,236,.93);
  backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(34,48,60,.07);
}
.topbar-title{
  flex:1;min-width:0;text-align:center;font-weight:900;font-size:1rem;
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;
  border:2px solid var(--line);border-radius:14px;background:#fff;
  cursor:pointer;transition:transform .12s ease,background .12s ease;
  touch-action:manipulation;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px;display:block}
.icon-btn.ghost{visibility:hidden;pointer-events:none}

/* ===== 版面 ===== */
.wrap{width:100%;max-width:1060px;margin:0 auto;padding:clamp(14px,3vw,26px) clamp(14px,4vw,30px) calc(44px + var(--safe-b));}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 按鈕 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:12px 22px;
  font-size:1.02rem;font-weight:900;letter-spacing:.02em;
  color:var(--ink);background:#fff;
  border:3px solid var(--ink);border-radius:18px;
  box-shadow:var(--hard);
  cursor:pointer;touch-action:manipulation;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(34,48,60,.14)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:var(--hard)}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-accent{background:var(--blue);color:#fff;border-color:#2A5FA8;box-shadow:0 5px 0 #2A5FA8}
.btn-block{width:100%}
.btn-lg{min-height:64px;font-size:1.12rem;border-radius:20px}
.btn-sm{min-height:44px;padding:8px 14px;font-size:.9rem;border-width:2px;border-radius:12px;box-shadow:0 3px 0 rgba(34,48,60,.14)}
.btn-ghost{background:rgba(255,255,255,.65)}

/* ===== 啟動頁 ===== */
.hero{
  min-height:calc(100dvh - 32px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:clamp(10px,1.8vh,20px);
  padding:max(4vh,20px) 0 6vh;
}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border:2px solid var(--ink);border-radius:999px;
  background:#fff;font-size:.8rem;font-weight:800;letter-spacing:.12em;
  box-shadow:0 3px 0 rgba(34,48,60,.1);
}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--coral);display:block}
.hero h1{
  font-size:clamp(2.4rem,9vw,4.6rem);
  line-height:1.08;font-weight:900;letter-spacing:.02em;
}
.hero h1 .c1{color:var(--blue)}
.hero h1 .c2{color:var(--yellow)}
.hero h1 .c3{color:var(--green)}
.hero h1 .c4{color:var(--coral)}
.hero-sub{
  font-size:clamp(1rem,3.4vw,1.4rem);font-weight:800;color:var(--ink-soft);
  letter-spacing:.22em;
}
.hero-desc{max-width:30em;font-size:.95rem;color:var(--ink-soft);line-height:1.7}
.char-row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,2vw,18px);width:100%;margin:4px 0}
.char-item{width:clamp(70px,21vw,140px);animation:bob 3.2s ease-in-out infinite}
.char-item:nth-child(2){animation-delay:.35s}
.char-item:nth-child(3){animation-delay:.7s}
.char-item:nth-child(4){animation-delay:1.05s}
.char-item svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero-actions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.hero-note{font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}

/* ===== 主選單 ===== */
.menu-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.menu-head h2{font-size:clamp(1.5rem,4.6vw,2rem);font-weight:900;line-height:1.25}
.menu-head p{font-size:.88rem;color:var(--ink-soft);margin-top:2px}
.total-stars{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  background:#fff;border:2px solid var(--ink);border-radius:999px;
  font-weight:900;font-size:.95rem;box-shadow:0 3px 0 rgba(34,48,60,.1);
}
.total-stars svg{width:18px;height:18px}
.menu-grid{display:block}
.menu-cols{display:grid;grid-template-columns:1fr;gap:12px}
.mode-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;min-height:88px;
  background:#fff;border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--hard);cursor:pointer;touch-action:manipulation;
  transition:transform .14s ease,box-shadow .14s ease;
}
.mode-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,48,60,.14)}
.mode-card .glyph{
  flex:0 0 auto;width:60px;height:60px;border-radius:18px;
  display:grid;place-items:center;background:var(--tl,#E7F0FC);color:var(--tc,#3B7DD8);
  border:2px solid var(--tc,#3B7DD8);
}
.mode-card .glyph svg{width:34px;height:34px}
.mode-card .glyph .char-mini{width:54px;height:54px;margin:-2px}
.mode-card .txt{flex:1;min-width:0}
.mode-card h3{font-size:1.12rem;font-weight:900;line-height:1.3}
.mode-card p{font-size:.82rem;color:var(--ink-soft);margin-top:1px}
.mode-card .side{flex:0 0 auto;font-size:.8rem;font-weight:800;color:var(--ink-soft);text-align:right}
.mode-card .side .stars{color:#EFA63A;letter-spacing:1px;font-size:.95rem;white-space:nowrap}
.section-label{
  display:flex;align-items:center;gap:10px;margin:22px 0 10px;
  font-size:.82rem;font-weight:900;letter-spacing:.16em;color:var(--ink-soft);
}
.section-label::after{content:"";flex:1;height:2px;background:rgba(34,48,60,.1);border-radius:2px}
.sub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sub-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:14px 14px 12px;min-height:118px;text-align:left;
  background:#fff;border:3px solid var(--tc);border-radius:18px;
  box-shadow:var(--hard);cursor:pointer;touch-action:manipulation;
  transition:transform .14s ease,box-shadow .14s ease;
}
.sub-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,48,60,.14)}
.sub-card .dot{
  width:38px;height:38px;border-radius:12px;background:var(--tl);color:var(--tc);
  display:grid;place-items:center;font-weight:900;font-size:1.25rem;margin-bottom:2px;
}
.sub-card h4{font-size:1rem;font-weight:900;line-height:1.3}
.sub-card .sub-desc{display:block;font-size:.8rem;color:var(--ink-soft);line-height:1.5;margin:0}
.sub-card .tag{font-size:.74rem;font-weight:800;color:var(--tc);margin-top:auto}
.challenge-banner{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:18px;border-radius:var(--radius);border:3px solid var(--ink);
  background:linear-gradient(135deg,#22303C 0%,#2E4050 100%);
  color:var(--cream);box-shadow:0 6px 0 rgba(34,48,60,.28);
  cursor:pointer;touch-action:manipulation;
}
.challenge-banner:active{transform:translateY(3px)}
.challenge-banner .glyph{
  flex:0 0 auto;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;
  background:rgba(255,248,236,.12);border:2px solid rgba(255,248,236,.5);
}
.challenge-banner .glyph svg{width:34px;height:34px}
.challenge-banner h3{font-size:1.12rem;font-weight:900}
.challenge-banner p{font-size:.8rem;color:rgba(255,248,236,.75)}
.challenge-banner .side{margin-left:auto;font-weight:900;font-size:.85rem;color:#FFD28A;white-space:nowrap}

/* ===== 教學館 ===== */
.lesson-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:14px}
.lesson-tab{
  padding:10px 4px;border:2px solid var(--line);border-radius:14px;background:#fff;
  font-size:.9rem;font-weight:900;cursor:pointer;touch-action:manipulation;
  transition:background .15s,border-color .15s,color .15s;
}
.lesson-tab[aria-selected="true"]{background:var(--tl);border-color:var(--tc);color:var(--tc);box-shadow:0 3px 0 rgba(34,48,60,.1)}
.lesson-card{
  position:relative;background:#fff;border:3px solid var(--tc);
  border-radius:28px;padding:clamp(16px,4vw,28px);
  box-shadow:var(--hard-lg);overflow:hidden;
}
.lesson-card::before{
  content:"";position:absolute;inset:0 auto auto 0;width:100%;height:9px;background:var(--tc);
}
.lesson-top{display:flex;align-items:center;gap:clamp(8px,3vw,22px);margin-top:6px}
.lesson-char{flex:0 0 auto;width:clamp(96px,25vw,168px)}
.lesson-char svg{width:100%;height:auto;display:block}
.lesson-id{min-width:0}
.lesson-id .en{font-size:.68rem;font-weight:800;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase}
.lesson-id h2{font-size:clamp(1.7rem,5.6vw,2.5rem);font-weight:900;line-height:1.15;color:var(--tc)}
.slogan{
  margin-top:10px;padding:10px 14px;border-radius:14px;
  background:var(--tl);border:2px dashed var(--tc);
  font-size:clamp(1rem,2.8vw,1.22rem);font-weight:900;line-height:1.5;
}
.lesson-sec{margin-top:clamp(14px,3vw,20px)}
.lesson-sec h3{
  display:flex;align-items:center;gap:8px;
  font-size:.78rem;font-weight:900;letter-spacing:.14em;color:var(--ink-soft);
  margin-bottom:8px;
}
.lesson-sec h3 svg{width:19px;height:19px;color:var(--tc);flex:0 0 auto}
.kw-list{display:flex;flex-wrap:wrap;gap:7px}
.kw{
  padding:5px 12px;border-radius:999px;background:var(--tl);border:2px solid var(--tc);
  font-size:.86rem;font-weight:800;color:var(--ink);
}
.example{
  display:flex;gap:9px;align-items:flex-start;
  padding:9px 12px;border-radius:12px;background:rgba(34,48,60,.035);
  font-size:clamp(1.02rem,3vw,1.22rem);line-height:1.6;font-weight:700;
}
.example + .example{margin-top:7px}
.example .no{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--tc);color:#fff;
  font-size:.72rem;font-weight:900;display:grid;place-items:center;margin-top:4px;
}
.hl{background:linear-gradient(transparent 58%, var(--tl) 58%);border-bottom:3px solid var(--tc);padding:0 2px;border-radius:2px}
.pitfall{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border-radius:16px;background:var(--coral-l);
  border:2px dashed #E8A79E;font-size:.94rem;line-height:1.7;
}
.pitfall .pf-icon{flex:0 0 auto;width:26px;height:26px;margin-top:1px}
.pitfall b{color:#B23A2B}
.lesson-nav{display:flex;gap:10px;margin-top:14px}
.lesson-nav .btn{flex:1}
.try-box{
  margin-top:16px;padding:14px;border-radius:18px;background:#fff;
  border:3px solid var(--ink);box-shadow:var(--hard);
}
.try-head{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.95rem}
.try-head .pill{font-size:.68rem;background:var(--ink);color:var(--cream);border-radius:999px;padding:2px 9px;letter-spacing:.08em}
.try-text{font-size:clamp(1.2rem,3.8vw,1.55rem);font-weight:900;margin:8px 0 12px;line-height:1.5}
.try-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.try-opt{
  padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:#fff;
  font-weight:800;font-size:.9rem;cursor:pointer;touch-action:manipulation;
}
.try-opt:disabled{cursor:default}
.try-opt.correct{border-color:var(--green);background:var(--green-l)}
.try-opt.wrong{border-color:var(--coral);background:var(--coral-l)}
.try-fb{margin-top:10px;font-size:.9rem;line-height:1.65;padding:10px 12px;border-radius:12px;background:rgba(34,48,60,.045)}
.try-fb.ok{background:var(--green-l)}
.try-fb.bad{background:var(--coral-l)}

/* ===== 答題頁 ===== */
.play-wrap{max-width:780px;margin:0 auto}
.play-head{margin-bottom:10px}
.progress{height:14px;border-radius:99px;background:rgba(34,48,60,.09);overflow:hidden;border:2px solid rgba(34,48,60,.08)}
.progress-fill{height:100%;width:0;border-radius:99px;background:var(--blue);transition:width .35s ease}
.play-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:.8rem;font-weight:800;color:var(--ink-soft)}
.play-meta .mode-name{color:var(--ink);font-size:.85rem}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.hud-item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:5px 8px;text-align:center}
.hud-item b{display:block;font-size:1.15rem;font-weight:900;line-height:1.3;font-variant-numeric:tabular-nums}
.hud-item span{font-size:.68rem;font-weight:800;color:var(--ink-soft);letter-spacing:.08em}
.hud-item.hot b{color:var(--coral)}
.timer-track{height:10px;border-radius:99px;background:rgba(34,48,60,.09);overflow:hidden;margin:0 0 10px}
.timer-fill{height:100%;width:100%;background:var(--green);transition:width .2s linear,background .3s}
.timer-fill.low{background:var(--coral)}
.play-prompt{font-size:.9rem;font-weight:800;color:var(--ink-soft);margin:0 0 6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.play-prompt .type-chip{padding:2px 10px;border-radius:999px;background:var(--tl);color:var(--tc);border:2px solid var(--tc);font-size:.75rem}
.qcard{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:26px;
  padding:clamp(18px,5vw,34px);box-shadow:var(--hard-lg);margin-bottom:16px;
}
.qcard::after{
  content:"";position:absolute;right:18px;bottom:-11px;width:26px;height:26px;
  background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
  transform:rotate(45deg);border-radius:0 0 6px 0;
}
.qtext{
  font-size:clamp(1.5rem,5.2vw,2.35rem);line-height:1.55;font-weight:900;
  letter-spacing:.02em;word-break:break-word;overflow-wrap:anywhere;
}
.qtext .quote{color:var(--blue)}
.tokens{display:flex;flex-wrap:wrap;gap:clamp(6px,1.8vw,12px);align-items:center}
.token{
  padding:8px 14px;min-height:52px;
  border:3px solid var(--ink);border-radius:14px;background:#fff;
  font-size:clamp(1.3rem,4.6vw,1.9rem);font-weight:900;line-height:1.3;
  box-shadow:0 4px 0 rgba(34,48,60,.13);cursor:pointer;touch-action:manipulation;
  transition:transform .12s,background .15s;
}
.token:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,48,60,.13)}
.token.correct{background:var(--green-l);border-color:var(--green)}
.token.wrong{background:var(--coral-l);border-color:var(--coral)}
.token.muted{opacity:.5}
.token-punc{font-size:clamp(1.4rem,4.8vw,2rem);font-weight:900;line-height:1;padding:0 2px;color:var(--ink-soft)}
.answers{display:grid;gap:10px}
.stations{grid-template-columns:repeat(2,minmax(0,1fr))}
.station{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:104px;padding:10px 6px;
  border:3px solid var(--tc);border-radius:20px;background:var(--tl);
  box-shadow:0 5px 0 rgba(34,48,60,.13);cursor:pointer;touch-action:manipulation;
  transition:transform .12s,box-shadow .12s,filter .15s;
}
.station:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(34,48,60,.13)}
.station .sym{font-size:1.5rem;line-height:1;font-weight:900;color:var(--tc)}
.station .nm{font-size:1.06rem;font-weight:900;line-height:1.3}
.station .hint{font-size:.7rem;font-weight:700;color:var(--ink-soft)}
.station.correct{border-color:var(--green);background:var(--green-l);box-shadow:0 0 0 4px rgba(52,160,122,.22)}
.station.wrong{border-color:var(--coral);background:var(--coral-l);opacity:.85}
.station.dim{opacity:.55}
.options{grid-template-columns:1fr}
.option{
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px 16px;min-height:70px;
  border:3px solid var(--ink);border-radius:18px;background:#fff;
  box-shadow:var(--hard);cursor:pointer;touch-action:manipulation;
  font-size:clamp(1.02rem,3.4vw,1.22rem);font-weight:800;line-height:1.5;
  transition:transform .12s,box-shadow .12s,background .15s;
}
.option:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(34,48,60,.14)}
.option .k{
  flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--cream);
  display:grid;place-items:center;font-weight:900;font-size:1rem;
}
.option.correct{border-color:var(--green);background:var(--green-l)}
.option.correct .k{background:var(--green)}
.option.wrong{border-color:var(--coral);background:var(--coral-l)}
.option.wrong .k{background:var(--coral)}
.option.dim{opacity:.55}
.yesno{grid-template-columns:repeat(2,minmax(0,1fr))}
.yesno .yn{
  min-height:88px;border:3px solid var(--ink);border-radius:20px;background:#fff;
  box-shadow:var(--hard);cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:clamp(1.05rem,3.4vw,1.25rem);font-weight:900;line-height:1.3;padding:8px;
  transition:transform .12s,box-shadow .12s,background .15s;
}
.yesno .yn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(34,48,60,.14)}
.yesno .yn .big{font-size:1.6rem;line-height:1}
.yesno .yn.yes,.yesno .yn.no{background:#fff;border-color:var(--ink)}
.yesno .yn.correct{background:var(--green-l);border-color:var(--green);box-shadow:0 0 0 4px rgba(52,160,122,.22)}
.yesno .yn.correct .big{color:var(--green)}

.yesno .yn.wrong .big{color:var(--coral)}
.feedback{

  animation:popIn .28s ease both;
}
.feedback.ok{background:var(--green-l);border-color:var(--green)}
.feedback.bad{background:var(--coral-l);border-color:var(--coral)}

.fb-head{display:flex;align-items:center;gap:10px;font-size:1.12rem;font-weight:900;line-height:1.4}
.fb-badge{
  flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--green);color:#fff;font-weight:900;font-size:1.15rem;
}
.feedback.bad .fb-badge{background:var(--coral)}
.fb-answer{font-size:.95rem;font-weight:900;margin-top:6px}
.fb-explain{font-size:.95rem;line-height:1.7;margin-top:6px;color:var(--ink)}
.fb-explain b{color:#B23A2B}
.feedback.ok .fb-explain b{color:#1F6B52}

.combo-flash{
  position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);

}
@keyframes comboUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-55%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

/* ===== 結算頁 ===== */
.result-card{
  max-width:720px;margin:0 auto;background:#fff;border:3px solid var(--ink);
  border-radius:30px;padding:clamp(20px,5vw,34px);box-shadow:var(--hard-lg);text-align:center;
  position:relative;overflow:hidden;
}
.result-card::before{
  content:"";position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:320px;height:180px;border-radius:50%;background:rgba(239,166,58,.16);filter:blur(6px);
}
.result-stars{display:flex;justify-content:center;gap:6px;position:relative;margin-bottom:6px}
.result-stars svg{width:clamp(48px,13vw,64px);height:auto;animation:starPop .5s ease both}
.result-stars svg:nth-child(2){animation-delay:.15s}
.result-stars svg:nth-child(3){animation-delay:.3s}
@keyframes starPop{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.result-card h2{font-size:clamp(1.6rem,5.4vw,2.2rem);font-weight:900;margin-top:2px;position:relative}
.result-sub{font-size:.95rem;color:var(--ink-soft);margin-top:4px;position:relative}
.result-score{
  display:inline-flex;align-items:baseline;gap:6px;margin-top:12px;
  padding:6px 18px;border-radius:999px;background:rgba(34,48,60,.06);font-weight:900;
}
.result-score b{font-size:1.7rem;color:var(--tc,var(--blue))}
.result-sec{margin-top:22px;text-align:left}
.result-sec h3{font-size:.82rem;letter-spacing:.14em;font-weight:900;color:var(--ink-soft);margin-bottom:8px}
.type-row{display:grid;grid-template-columns:76px 1fr 52px;gap:10px;align-items:center;margin-bottom:7px;font-size:.82rem;font-weight:800}
.type-row .bar-track{display:block;height:12px;border-radius:99px;background:rgba(34,48,60,.08);overflow:hidden}
.type-row .bar-fill{display:block;height:100%;border-radius:99px;background:var(--tc);width:0;transition:width .7s ease}
.type-row .val{text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wrong-list{display:grid;gap:8px}
.wrong-item{border:2px solid var(--line);border-radius:14px;background:#fff;padding:9px 12px}
.wrong-item summary{cursor:pointer;font-weight:800;font-size:.9rem;line-height:1.5;list-style:none;display:flex;gap:8px;align-items:flex-start}
.wrong-item summary::-webkit-details-marker{display:none}

.wrong-body b{color:var(--ink)}
.all-right{padding:12px 14px;border-radius:14px;background:var(--green-l);font-weight:800;font-size:.9rem;text-align:center}
.result-actions{display:grid;gap:9px;margin-top:22px}
.result-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rank-badge{
  display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 16px;
  border-radius:999px;background:var(--ink);color:var(--cream);font-weight:900;font-size:.9rem;letter-spacing:.06em;
}

/* ===== 學習足跡 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px;box-shadow:var(--hard);text-align:center}

.wrong-book{margin-top:8px;display:grid;gap:8px}
.stats-empty{padding:22px;text-align:center;color:var(--ink-soft);font-size:.9rem;background:#fff;border:2px dashed var(--line);border-radius:16px}

/* ===== 彈層與提示 ===== */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(34,48,60,.45);animation:fadeUp .2s ease}
.modal-card{
  width:100%;max-width:380px;background:var(--cream);border:3px solid var(--ink);

@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  if (name === 'magic') return open + '<path d="M15 4l5 5L9 20l-5-5z"/><path d="M14 5l5 5"/><path d="M6 3v4M4 5h4M18 15v4M16 17h4"/></svg>';
  if (name === 'tower') return open + '<path d="M5 21V9l3-2V4h3v2h2V4h3v2l3 2v12z"/><path d="M10 21v-5h4v5"/></svg>';
  if (name === 'chart') return open + '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
  if (name === 'key') return open + '<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M15 12v3"/></svg>';
  if (name === 'quote') return open + '<path d="M9 7c-3 1-4 3-4 6v4h5v-6H6c0-2 1-3 3-3z"/><path d="M19 7c-3 1-4 3-4 6v4h5v-6h-4c0-2 1-3 3-3z"/></svg>';

function glyphHTML(glyph){
  if (glyph && glyph.indexOf('char:') === 0) return characterSVG(glyph.slice(5), 'char-mini');
  return iconSVG(glyph || 'chart');
}

var STORE_KEY = 'sentence-quartet-v1';
function defaultProgress(){
  return { muted:false, modes:{}, totals:{ attempted:0, correct:0 }, wrong:[] };
}
function loadProgress(){
  var d = defaultProgress();
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return d;
    var p = JSON.parse(raw);
    if (!p || typeof p !== 'object') return d;
    d.muted = !!p.muted;
    if (p.modes && typeof p.modes === 'object') d.modes = p.modes;
    if (p.totals && typeof p.totals === 'object') {
      d.totals.attempted = Math.max(0, Number(p.totals.attempted) || 0);
      d.totals.correct = Math.max(0, Number(p.totals.correct) || 0);
    }
    if (Array.isArray(p.wrong)) d.wrong = p.wrong.slice(0, 30);
    return d;
  } catch (e) {
    return d;
  }
}
var progress = loadProgress();
function saveProgress(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* 私隱模式或額滿時忽略 */ }
}

/* ---------- 六、音效（Web Audio 即時合成） ---------- */
var Sound = {
  ctx: null,
  ensure: function(){
    try {
      if (!this.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone: function(freq, delay, dur, type, vol){
    var ctx = this.ctx;
    if (!ctx) return;
    try {
      var t0 = ctx.currentTime + delay;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* 音效失敗不影響遊戲 */ }
  },
  play: function(kind){
    if (progress.muted) return;
    if (!this.ensure()) return;
    if (kind === 'tap') {
      this.tone(880, 0, 0.055, 'sine', 0.045);
    } else if (kind === 'correct') {
      this.tone(523.25, 0, 0.13, 'sine', 0.1);
      this.tone(659.25, 0.09, 0.13, 'sine', 0.1);
      this.tone(783.99, 0.18, 0.2, 'sine', 0.11);
    } else if (kind === 'wrong') {
      this.tone(349.23, 0, 0.16, 'triangle', 0.08);
      this.tone(261.63, 0.15, 0.24, 'triangle', 0.075);
    } else if (kind === 'win') {
      this.tone(523.25, 0, 0.16, 'sine', 0.1);
      this.tone(659.25, 0.1, 0.16, 'sine', 0.1);
      this.tone(783.99, 0.2, 0.18, 'sine', 0.11);
      this.tone(1046.5, 0.3, 0.34, 'sine', 0.12);
    } else if (kind === 'combo') {
      this.tone(783.99, 0, 0.09, 'square', 0.05);
      this.tone(1046.5, 0.09, 0.14, 'square', 0.05);
    }
  }
};

function showScreen(name){
  $$('.screen').forEach(function(s){ s.classList.remove('active'); });
  var target = $('#screen-' + name);
  if (target) target.classList.add('active');
  state.screen = name;
  dom.topbar.hidden = (name === 'home');
  if (name === 'menu') { renderMenu(); }
  if (name === 'stats') { renderStats(); }
  var titles = {
    home: '句子四兄弟', menu: '句型探險隊', lesson: '教學館',
    play: state.modeKey ? MODES[state.modeKey].short : '答題',
    result: '學習報告', stats: '學習足跡'
  };
  dom.topTitle.textContent = titles[name] || '句子四兄弟';
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function toast(msg){
  dom.toast.textContent = msg;
  dom.toast.hidden = false;
  clearTimeout(toast._t);

}

/* ---------- 十一、答題流程 ---------- */
function startMode(key){
  var m = MODES[key];
  if (!m) return;
  state.modeKey = key;
  state.index = 0;
  state.answers = [];
  state.score = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.locked = false;
  state.finished = false;
  state.timeLeft = 90;
  state.paused = false;
  dom.hud.hidden = (m.kind !== 'challenge');
  dom.timerTrack.hidden = (m.kind !== 'challenge');
  dom.playMode.textContent = m.title;
  showScreen('play');
  if (m.kind === 'challenge') { startTimer(); renderHud(); } else { stopTimer(); }
  renderQuestion();
  Sound.play('tap');
}

function renderQuestion(){
  var m = MODES[state.modeKey];
  var q = m.qs[state.index];
  state.locked = false;
  state.paused = false;
  state.lastTick = performance.now();
  dom.feedback.hidden = true;
  dom.feedback.className = 'feedback';
  dom.feedback.innerHTML = '';
  dom.answers.innerHTML = '';
  dom.answers.className = 'answers';
  dom.qtokens.innerHTML = '';
  dom.qtokens.hidden = true;
  dom.qtext.hidden = false;
  dom.qtext.className = 'qtext';
  dom.progressFill.style.width = ((state.index + 1) / m.count * 100) + '%';
  dom.playCount.textContent = '第 ' + (state.index + 1) + ' / ' + m.count + ' 題';

  if (m.kind === 'transform') {
    var target = TYPES[q.target];
    dom.prompt.innerHTML = '<span class="type-chip" style="--tc:' + target.color + ';--tl:' + target.tint + '">目標：' + target.name + '</span>' +
      '<span>哪一句符合這個句式？</span>';
    dom.qtext.className = 'qtext scene';
    dom.qtext.innerHTML = '<span class="scene-label">情境</span>' + esc(q.scene);
    dom.answers.className = 'answers options';
    dom.answers.innerHTML = q.options.map(function(o, i){
      return '<button class="option" type="button" data-ans="' + i + '">' +
        '<span class="k">' + 'ABC'.charAt(i) + '</span><span class="ot">' + esc(o.text) + '</span>' +
      '</button>';
    }).join('');
  } else if (m.kind === 'token') {
    dom.prompt.innerHTML = '<span>' + esc(m.prompt) + '</span>';
    dom.qtext.hidden = true;
    dom.qtokens.hidden = false;
    dom.qtokens.innerHTML = q.tokens.map(function(tk, i){
      return '<button class="token" type="button" data-tok="' + i + '">' + esc(tk) + '</button>';
    }).join('') + '<span class="token-punc" aria-hidden="true">？</span>';
  } else {
    dom.prompt.innerHTML = '<span>' + esc(m.prompt) + '</span>';
    dom.qtext.innerHTML = '「' + esc(q.text) + '」';
    if (m.kind === 'yesno') {
      dom.answers.className = 'answers yesno';
      dom.answers.innerHTML =
        '<button class="yn yes" type="button" data-ans="yes"><span class="big">是</span><span>' + esc(m.yes) + '</span></button>' +
        '<button class="yn no" type="button" data-ans="no"><span class="big">不是</span><span>這句話不是' + TYPES[m.target].name + '</span></button>';
    } else {
      dom.answers.className = 'answers stations';
      dom.answers.innerHTML = TYPE_KEYS.map(function(k){
        var t = TYPES[k];
        return '<button class="station" type="button" data-ans="' + k + '" style="--tc:' + t.color + ';--tl:' + t.tint + '">' +
          '<span class="sym">' + t.symbol + '</span>' +
          '<span class="nm">' + t.name + '</span>' +
          '<span class="hint">' + t.en + '</span>' +
        '</button>';
      }).join('');
    }
  }
}

function handleAnswer(value){
  if (state.locked || state.finished) return;
  var m = MODES[state.modeKey];
  var q = m.qs[state.index];
  var ok = false;
  var chosenLabel = '';
  var correctLabel = '';
  var okText = '';
  var badText = '';
  var recordType = q.type || m.target || 'statement';

  if (m.kind === 'sort' || m.kind === 'challenge') {
    ok = String(value) === q.type;
    chosenLabel = (TYPES[String(value)] || { name: String(value) }).name;
    correctLabel = TYPES[q.type].name;
    okText = '這是「' + esc(correctLabel) + '」';
    badText = '正確答案：' + esc(correctLabel) + '<br>你選了：' + esc(chosenLabel);
    $$('button[data-ans]', dom.answers).forEach(function(n){
      var k = n.getAttribute('data-ans');
      if (k === q.type) n.classList.add('correct');
      else if (k === String(value)) n.classList.add('wrong');
      else n.classList.add('dim');
    });
  } else if (m.kind === 'transform') {
    var idx = Number(value);
    ok = (idx === q.answer);
    chosenLabel = '第 ' + 'ABC'.charAt(idx) + ' 句「' + q.options[idx].text + '」';
    correctLabel = '第 ' + 'ABC'.charAt(q.answer) + ' 句「' + q.options[q.answer].text + '」';
    recordType = q.target;
    okText = '正確句子是 ' + esc(correctLabel);
    badText = '正確答案：' + esc(correctLabel) + '<br>你選了：' + esc(chosenLabel);
    $$('button[data-ans]', dom.answers).forEach(function(n){
      var i = Number(n.getAttribute('data-ans'));
      if (i === q.answer) n.classList.add('correct');
      else if (i === idx) n.classList.add('wrong');
      else n.classList.add('dim');
    });
  } else if (m.kind === 'yesno') {
    var yes = (value === 'yes');
    ok = (yes === !!q.isTarget);
    chosenLabel = yes ? '是' : '不是';
    correctLabel = q.isTarget ? '是' : '不是';
    recordType = q.type || m.target;
    var actualName = TYPES[recordType] ? TYPES[recordType].name : TYPES[m.target].name;
    okText = '這句話是' + actualName + '。';
    badText = '這句話其實是' + actualName + '。<br>你選了：' + chosenLabel;
    $$('button[data-ans]', dom.answers).forEach(function(n){
      var v = n.getAttribute('data-ans');
      var isCorrectBtn = (v === 'yes') === !!q.isTarget;
      if (isCorrectBtn) n.classList.add('correct');
      else if (v === value) n.classList.add('wrong');
    });
  } else if (m.kind === 'token') {
    var ti = Number(value);
    ok = (ti === q.answer);
    chosenLabel = q.tokens[ti];
    correctLabel = q.tokens[q.answer];
    recordType = q.type || m.target;
    okText = '疑問詞是「' + esc(correctLabel) + '」';
    badText = '疑問詞是「' + esc(correctLabel) + '」。<br>你選了：' + esc(chosenLabel);
    $$('button[data-tok]', dom.qtokens).forEach(function(n){
      var i = Number(n.getAttribute('data-tok'));
      if (i === q.answer) n.classList.add('correct');
      else if (i === ti) n.classList.add('wrong');
      else n.classList.add('muted');
    });
  }

  state.locked = true;

  if (ok) {
    state.combo += 1;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 10 + Math.min(state.combo - 1, 5) * 2;
    Sound.play('correct');
    if (m.kind === 'challenge' && state.combo >= 3) {
      Sound.play('combo');
      flashCombo(state.combo);
    }
  } else {
    state.combo = 0;
    Sound.play('wrong');
  }

  var displayText = q.scene ? '情境：' + q.scene : q.text;
  state.answers.push({
    id: q.id, text: displayText, type: recordType,
    correct: ok, chosen: chosenLabel, answer: correctLabel, explain: q.explain
  });

  progress.totals.attempted += 1;
  if (ok) progress.totals.correct += 1;
  if (!ok) {
    progress.wrong.unshift({
      text: displayText, answer: correctLabel, explain: q.explain,
      mode: m.short, type: recordType
    });
    progress.wrong = progress.wrong.slice(0, 30);
  }
  saveProgress();

  var extra = '';
  if (!ok && (m.kind === 'sort' || m.kind === 'challenge')) {
    extra = '<div class="fb-tip">記住：' + esc(TYPES[q.type].tip) + '</div>';
  }
  if (!ok && m.kind === 'token') {
    extra = '<div class="fb-tip">「' + esc(chosenLabel) + '」只是句子中的普通詞語，不是在提出問題。</div>';
  }

  var isLast = (state.index + 1 >= m.count);
  dom.feedback.className = 'feedback ' + (ok ? 'ok' : 'bad');
  dom.feedback.innerHTML =
    '<div class="fb-head"><span class="fb-badge">' + (ok ? '✓' : '✕') + '</span><span>' +
      (ok ? '答對了！' : '差一點，再想想！') + '</span></div>' +
    '<div class="fb-answer">' + (ok ? okText : badText) + '</div>' +
    '<div class="fb-explain">' + esc(q.explain) + '</div>' + extra +
    '<button class="btn btn-primary btn-block fb-next" type="button" data-next="1">' +
      (isLast ? '看成績' : (m.kind === 'challenge' ? '下一題（計時繼續）' : '下一題')) +
    '</button>';
  dom.feedback.hidden = false;
  if (m.kind === 'challenge') { state.paused = true; renderHud(); }
  try { dom.feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { }
}

function flashCombo(n){
  var d = document.createElement('div');
  d.className = 'combo-flash';
  d.textContent = '連擊 ×' + n + '！';
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 950);
}

function nextQuestion(){
  var m = MODES[state.modeKey];
  if (state.index + 1 >= m.count) { finishRound(false); return; }
  state.index += 1;
  renderQuestion();
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }
}

/* ---------- 十二、計時器 ---------- */
function startTimer(){
  stopTimer();
  state.timeLeft = 90;
  state.lastTick = performance.now();
  state.paused = false;
  state.timerId = setInterval(tick, 200);
  renderHud();
}
function stopTimer(){
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}
function tick(){
  if (!state.timerId) return;
  var now = performance.now();
  if (state.paused) {
    state.lastTick = now;
    return;
  }
  state.timeLeft -= (now - state.lastTick) / 1000;
  state.lastTick = now;
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    renderHud();
    finishRound(true);
    return;
  }
  renderHud();
}
function renderHud(){
  if (!state.modeKey || MODES[state.modeKey].kind !== 'challenge') return;
  dom.hudTime.textContent = Math.ceil(state.timeLeft);
  dom.hudScore.textContent = state.score;
  dom.hudCombo.textContent = state.combo;
  dom.hudComboBox.classList.toggle('hot', state.combo >= 3);
  dom.timerFill.style.width = (state.timeLeft / 90 * 100) + '%';
  dom.timerFill.classList.toggle('low', state.timeLeft <= 20);
}

/* ---------- 十三、結算 ---------- */
function finishRound(timeout){
  if (state.finished) return;
  state.finished = true;
  state.paused = false;
  stopTimer();
  var m = MODES[state.modeKey];
  var answered = state.answers.length;
  var correctCount = state.answers.filter(function(a){ return a.correct; }).length;
  var ratio = answered ? correctCount / answered : 0;
  var stars;
  if (m.kind === 'challenge') {
    stars = state.score >= 100 ? 3 : state.score >= 60 ? 2 : state.score >= 30 ? 1 : 0;
  } else {
    stars = ratio >= 0.83 ? 3 : ratio >= 0.66 ? 2 : ratio > 0 ? 1 : 0;
  }

  var per = {};
  TYPE_KEYS.forEach(function(k){ per[k] = { n: 0, c: 0 }; });
  state.answers.forEach(function(a){
    if (per[a.type]) {
      per[a.type].n += 1;
      if (a.correct) per[a.type].c += 1;
    }
  });
  var weakest = null;
  TYPE_KEYS.forEach(function(k){
    if (per[k].n > 0) {
      if (!weakest || (per[k].c / per[k].n) < (per[weakest].c / per[weakest].n)) weakest = k;
    }
  });

  var rec = progress.modes[m.key] || { stars: 0, best: 0 };
  rec.stars = Math.max(rec.stars || 0, stars);
  var thisBest = m.kind === 'challenge' ? state.score : correctCount;
  rec.best = Math.max(rec.best || 0, thisBest);
  progress.modes[m.key] = rec;
  saveProgress();

  state.lastResult = {
    stars: stars, correct: correctCount, answered: answered, total: m.count,
    ratio: ratio, per: per, weakest: weakest || 'statement', timeout: !!timeout,
    challenge: m.kind === 'challenge'
  };
  renderResult();
  showScreen('result');
  Sound.play(stars > 0 ? 'win' : 'wrong');
}

function renderResult(){
  var m = MODES[state.modeKey];
  var d = state.lastResult;
  dom.resultCard.style.setProperty('--tc', m.accent);

  var title = '';
  if (d.timeout) title = '時間到！再挑戰一次吧';
  else if (d.stars === 3) title = '太厲害了，句型小高手！';
  else if (d.stars === 2) title = '做得不錯，再練一下就滿分！';
  else if (d.stars === 1) title = d.challenge ? '完成挑戰，看看解說再進步！' : '完成這一關，看看解說再進步！';
  else title = '別灰心，先回教學館看一看。';

  var sub = '';
  if (d.challenge) {
    var rank = state.score >= 100 ? '句式大師' : state.score >= 70 ? '句型高手' : state.score >= 40 ? '句型學徒' : '句型新手';
    sub = '答對 ' + d.correct + ' / ' + d.total + ' 題' + (d.answered < d.total ? '（已作答 ' + d.answered + ' 題）' : '') + ' · 最高連擊 ' + state.bestCombo + ' 次';
    title = d.timeout ? '時間到！' : title;
    sub += '<br><span class="rank-badge">段位：' + rank + '</span>';
  } else {
    sub = '答對 ' + d.correct + ' / ' + d.total + ' 題';
  }
  if (d.answered === 0) sub = '這次還沒有作答，先回教學館看一看，再挑戰吧！';

  var typeRows = TYPE_KEYS.filter(function(k){ return d.per[k].n > 0; }).map(function(k){
    var t = TYPES[k];
    var pct = Math.round(d.per[k].c / d.per[k].n * 100);
    return '<div class="type-row" style="--tc:' + t.color + '">' +
      '<span>' + t.name + '</span>' +
      '<span class="bar-track"><span class="bar-fill" data-w="' + pct + '"></span></span>' +
      '<span class="val">' + d.per[k].c + '/' + d.per[k].n + '</span>' +
    '</div>';
  }).join('');

  var wrongs = state.answers.filter(function(a){ return !a.correct; });
  var wrongHTML = '';
  if (wrongs.length === 0) {
    wrongHTML = '<div class="all-right">全部答對，沒有錯題！繼續保持。</div>';
  } else {
    wrongHTML = '<div class="wrong-list">' + wrongs.map(function(a){
      return '<details class="wrong-item"><summary>「' + esc(a.text) + '」</summary>' +
        '<div class="wrong-body"><b>正確答案：</b>' + esc(a.answer) + '<br>' +
        '<b>說明：</b>' + esc(a.explain) + '</div></details>';
    }).join('') + '</div>';
  }

  dom.resultCard.innerHTML =
    '<div class="result-stars">' + [0,1,2].map(function(i){ return starSVG(i < d.stars); }).join('') + '</div>' +
    '<h2>' + title + '</h2>' +
    '<p class="result-sub">' + sub + '</p>' +
    '<div class="result-score"><b>' + (d.challenge ? state.score : d.correct) + '</b>' + (d.challenge ? '分' : '題答對') + '</div>' +
    '<div class="result-sec"><h3>四類句式表現</h3>' + typeRows + '</div>' +
    '<div class="result-sec"><h3>錯題回看</h3>' + wrongHTML + '</div>' +
    '<div class="result-actions">' +
      '<button class="btn btn-primary btn-lg btn-block" type="button" data-act="replay">再玩一次</button>' +
      '<div class="row">' +
        '<button class="btn" type="button" data-act="lesson">看教學卡</button>' +
        '<button class="btn" type="button" data-act="menu">回主選單</button>' +
      '</div>' +
    '</div>';

  // 進度條動畫
  requestAnimationFrame(function(){
    $$('.bar-fill', dom.resultCard).forEach(function(b){
      b.style.width = (b.getAttribute('data-w') || 0) + '%';
    });
  });
}

/* ---------- 十四、學習足跡 ---------- */
function renderStats(){
  var t = progress.totals;
  var rate = t.attempted ? Math.round(t.correct / t.attempted * 100) : 0;
  var totalStars = 0;
  MODE_ORDER.forEach(function(k){
    if (progress.modes[k] && progress.modes[k].stars) totalStars += progress.modes[k].stars;
  });

  var rows = MODE_ORDER.map(function(k){
    var m = MODES[k];
    var rec = progress.modes[k] || { stars: 0, best: 0 };
    var best = m.kind === 'challenge' ? (rec.best || 0) + ' 分' : '答對 ' + (rec.best || 0) + ' / ' + m.count + ' 題';
    return '<div class="stat-row">' +
      '<span class="nm">' + esc(m.short) + '</span>' +
      '<span class="num">' + best + '</span>' +
      '<span class="stars" aria-label="' + (rec.stars || 0) + ' 顆星">' + starsText(rec.stars || 0) + '</span>' +
    '</div>';
  }).join('');

  var wrongHTML = '';
  if (!progress.wrong.length) {
    wrongHTML = '<div class="stats-empty">還沒有錯題紀錄，繼續保持！</div>';
  } else {
    wrongHTML = '<div class="wrong-book">' + progress.wrong.slice(0, 12).map(function(w){
      return '<details class="wrong-item"><summary>' +
        '<span class="tag" style="color:var(--ink-soft);font-size:.7rem;margin-right:4px">' + esc(w.mode || '') + '</span>' +
        '「' + esc(w.text) + '」</summary>' +
        '<div class="wrong-body"><b>正確答案：</b>' + esc(w.answer) + '<br><b>說明：</b>' + esc(w.explain) + '</div></details>';
    }).join('') + '</div>';
  }

  dom.statsBody.innerHTML =
    '<div class="stats-grid">' +
      '<div class="stat-box"><b>' + totalStars + '</b><span>獲得星星</span></div>' +
      '<div class="stat-box"><b>' + t.attempted + '</b><span>累計答題</span></div>' +
      '<div class="stat-box"><b>' + rate + '%</b><span>整體正確率</span></div>' +
      '<div class="stat-box"><b>' + progress.wrong.length + '</b><span>錯題紀錄</span></div>' +
    '</div>' +
    '<div class="section-label">各模式最佳成績</div>' +
    '<div class="stats-list">' + rows + '</div>' +
    '<div class="section-label">錯題本</div>' + wrongHTML;
}

/* ---------- 十五、彈層與音效開關 ---------- */
var modalAction = null;
function openModal(opts){
  dom.modalTitle.textContent = opts.title || '提示';
  dom.modalText.textContent = opts.text || '';
  dom.modalOk.textContent = opts.ok || '確定';
  dom.modalCancel.textContent = opts.cancel || '取消';
  dom.modalOk.hidden = !!opts.hideOk;
  dom.modalCancel.hidden = !!opts.hideCancel;
  modalAction = opts.onOk || null;
  dom.modal.hidden = false;
  if (!dom.modalCancel.hidden) dom.modalCancel.focus();
  else if (!dom.modalOk.hidden) dom.modalOk.focus();
}
function closeModal(){
  dom.modal.hidden = true;
  modalAction = null;
}
function syncSoundUI(){
  dom.sound.setAttribute('aria-pressed', String(!progress.muted));
  dom.sound.setAttribute('aria-label', progress.muted ? '開啟音效' : '關閉音效');
  dom.soundIcon.innerHTML = progress.muted
    ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/>'
    : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>';
  dom.homeSound.textContent = '音效：' + (progress.muted ? '關閉' : '開啟');
  dom.homeSound.setAttribute('aria-pressed', String(!progress.muted));
}
function toggleSound(){
  progress.muted = !progress.muted;
  saveProgress();
  syncSoundUI();
  if (!progress.muted) { Sound.ensure(); Sound.play('tap'); }
  toast(progress.muted ? '已關閉音效' : '已開啟音效');
}

function goBack(){
  if (state.screen === 'home') return;
  if (state.screen === 'menu') { showScreen('home'); return; }
  if (state.screen === 'play') {
    openModal({
      title: '離開這一局？',
      text: '目前的作答進度不會保存，確定要回主選單嗎？',
      ok: '離開', cancel: '繼續作答',
      onOk: function(){ stopTimer(); showScreen('menu'); }
    });
    return;
  }
  showScreen('menu');
}

/* ---------- 十六、事件綁定 ---------- */
function bindEvents(){
  dom.start.addEventListener('click', function(){
    Sound.play('tap');
    showScreen('menu');
  });
  dom.homeSound.addEventListener('click', toggleSound);
  dom.sound.addEventListener('click', toggleSound);
  dom.back.addEventListener('click', goBack);

  dom.menuGrid.addEventListener('click', function(e){
    var b = e.target.closest('[data-go]');
    if (!b) return;
    var go = b.getAttribute('data-go');
    Sound.play('tap');
    if (go === 'lesson') openLesson(state.lessonType);
    else if (go === 'stats') showScreen('stats');
    else startMode(go);
  });

  dom.lessonTabs.addEventListener('click', function(e){
    var b = e.target.closest('.lesson-tab');
    if (!b) return;
    state.lessonType = b.getAttribute('data-type');
    renderLessonCard();
    Sound.play('tap');
  });

  dom.lessonBody.addEventListener('click', function(e){
    var opt = e.target.closest('.try-opt');
    if (opt && !opt.disabled) {
      var box = opt.closest('.try-box');
      var type = box.getAttribute('data-try');
      var q = TRY_Q[type];
      var val = opt.getAttribute('data-val');
      var ok = (val === q.answer);
      $$('.try-opt', box).forEach(function(b){
        b.disabled = true;
        if (b.getAttribute('data-val') === q.answer) b.classList.add('correct');
        else if (b === opt) b.classList.add('wrong');
      });
      var fb = $('.try-fb', box);
      fb.hidden = false;
      fb.className = 'try-fb ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = '<b>' + (ok ? '答對了！' : '再想想，正確答案是「' + TYPES[q.answer].name + '」。') + '</b><br>' + esc(q.explain) +
        '<div style="margin-top:10px"><button class="btn btn-sm" type="button" data-go-mode="' + TRY_MODE[type] + '">去玩這個小遊戲</button></div>';
      Sound.play(ok ? 'correct' : 'wrong');
      return;
    }
    var goMode = e.target.closest('[data-go-mode]');
    if (goMode) { startMode(goMode.getAttribute('data-go-mode')); return; }
    if (e.target.closest('[data-lesson-prev]')) {
      var i = TYPE_KEYS.indexOf(state.lessonType);
      state.lessonType = TYPE_KEYS[(i - 1 + TYPE_KEYS.length) % TYPE_KEYS.length];
      renderLessonCard();
      Sound.play('tap');
    } else if (e.target.closest('[data-lesson-next]')) {
      var j = TYPE_KEYS.indexOf(state.lessonType);
      state.lessonType = TYPE_KEYS[(j + 1) % TYPE_KEYS.length];
      renderLessonCard();
      Sound.play('tap');
    }
  });

  dom.answers.addEventListener('click', function(e){
    var b = e.target.closest('button[data-ans]');
    if (!b || state.locked) return;
    handleAnswer(b.getAttribute('data-ans'));
  });
  dom.qtokens.addEventListener('click', function(e){
    var b = e.target.closest('button[data-tok]');
    if (!b || state.locked) return;
    handleAnswer(b.getAttribute('data-tok'));
  });
  dom.feedback.addEventListener('click', function(e){
    if (e.target.closest('[data-next]')) nextQuestion();
  });

  dom.resultCard.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    Sound.play('tap');
    if (act === 'replay') startMode(state.modeKey);
    else if (act === 'menu') showScreen('menu');
    else if (act === 'lesson') openLesson(state.lastResult ? state.lastResult.weakest : 'statement');
  });

  $('#btn-clear-stats').addEventListener('click', function(){
    openModal({
      title: '清除所有紀錄？',
      text: '星星、正確率和錯題本都會清空，此操作不能復原。',
      ok: '確定清除', cancel: '保留',
      onOk: function(){
        var muted = progress.muted;
        progress = defaultProgress();
        progress.muted = muted;
        saveProgress();
        renderStats();
        renderMenu();
        toast('紀錄已清除');
      }
    });
  });

  dom.modalOk.addEventListener('click', function(){
    var fn = modalAction;
    closeModal();
    if (fn) fn();
  });
  dom.modalCancel.addEventListener('click', closeModal);
  dom.modal.addEventListener('click', function(e){
    if (e.target === dom.modal) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !dom.modal.hidden) closeModal();
  });
  document.addEventListener('visibilitychange', function(){
    if (!state.modeKey || state.finished || MODES[state.modeKey].kind !== 'challenge') return;
    if (document.hidden) {
      state.paused = true;
    } else if (!state.locked) {
      state.paused = false;
      state.lastTick = performance.now();
    }
  });
  document.addEventListener('pointerdown', function once(){
    Sound.ensure();
    document.removeEventListener('pointerdown', once);
  });
}

/* ---------- 十七、啟動 ---------- */
function init(){
  renderHome();
  renderMenu();
  renderLessonCard();
  syncSoundUI();
  bindEvents();
  showScreen('home');
}

init();
})();
</script>
</body>
