<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>「……更……」比較句學習樂園｜初小中文互動教材</title>
<meta name="description" content="香港初小中文「……更……」比較句互動教材：圖示教學七頁，配合「看圖填一填」及「句子小偵探」兩種遊戲模式，各十組題目，附答案解說與音效，適用於手機、平板及電腦。">
<meta name="theme-color" content="#fff8ec">
<style>
/* ========== 1. 設計代碼 ========== */
:root{
  --cream:#fff8ec;
  --paper:#ffffff;
  --ink:#3a2e28;
  --ink2:#7d685b;
  --coral:#f4604f;
  --coral-d:#d94b3c;
  --coral-soft:#ffe7e1;
  --teal:#1fa89b;
  --teal-soft:#dcf5f1;
  --sun:#f5a300;
  --sun-soft:#fff1cd;
  --grape:#7a6cf0;
  --grape-soft:#ece9ff;
  --sky:#3f93e8;
  --sky-soft:#e3f1fd;
  --green:#2f9e44;
  --green-soft:#e8f8ec;
  --red:#d93b32;
  --red-soft:#ffeceb;
  --line:#f0dfc9;
  --line-2:#e6d1b6;
  --shadow:0 14px 36px rgba(122,86,54,.13);
  --shadow-sm:0 5px 16px rgba(122,86,54,.10);
  --font:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC","Hiragino Sans GB","Heiti TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  font-size:clamp(18px,.46vw + 15.4px,22px);
  line-height:1.72;
  color:var(--ink);
  background:var(--cream);
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;
  background:
    radial-gradient(62vw 62vw at 6% -10%, #ffe6b8 0%, rgba(255,230,184,0) 70%),
    radial-gradient(56vw 56vw at 104% 2%, #d3f2ed 0%, rgba(211,242,237,0) 66%),
    radial-gradient(58vw 44vw at 50% 112%, #ffe2de 0%, rgba(255,226,222,0) 72%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:radial-gradient(#e9d3b8 1.3px, transparent 1.3px);
  background-size:26px 26px;opacity:.32;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:16px}
svg{display:block}
.icon{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon--solid{fill:currentColor;stroke:none}

/* ========== 2. 版面骨架 ========== */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px clamp(12px,2.4vw,30px);
  background:rgba(255,248,236,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:2px solid rgba(240,223,201,.8);
}
.brand{display:flex;align-items:center;gap:10px;padding:4px;border-radius:18px}
.brand-badge{
  width:clamp(40px,4.6vw,50px);aspect-ratio:1;
  display:grid;place-items:center;
  border-radius:50% 50% 50% 10px;
  background:linear-gradient(150deg,#ffcf6b,#f4604f);
  color:#fff;font-size:clamp(21px,2.4vw,27px);font-weight:800;line-height:1;
  box-shadow:0 6px 16px rgba(244,96,79,.38), inset 0 -3px 0 rgba(0,0,0,.08);
}
.brand-text{font-weight:800;font-size:clamp(16px,1.5vw,21px);letter-spacing:.02em;text-align:left}
.sound-btn{
  width:clamp(46px,5.2vw,54px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;background:#fff;border:2px solid var(--line);
  color:var(--ink2);box-shadow:var(--shadow-sm);transition:transform .15s,color .15s,border-color .15s;
}
.sound-btn:hover{color:var(--coral);border-color:var(--coral)}
.sound-btn:active{transform:scale(.94)}
.sound-btn .icon{width:1.4em;height:1.4em}
.sound-btn[aria-pressed="false"]{color:#b9a894;background:#f7efe3}

.shell{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(14px,2.6vw,34px) clamp(30px,5vw,68px)}
.screen{animation:screenIn .34s cubic-bezier(.22,1,.36,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ========== 3. 共用元件 ========== */
.pill{
  display:inline-flex;align-items:center;gap:.4em;
  padding:.24em .8em;border-radius:99px;
  font-size:.78em;font-weight:800;letter-spacing:.06em;
  background:var(--sun-soft);color:#9a6200;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  min-height:56px;padding:0 1.5em;border-radius:99px;
  font-weight:800;font-size:1em;letter-spacing:.02em;
  transition:transform .16s,box-shadow .16s,background .16s,color .16s,border-color .16s;
}
.btn-primary{
  background:linear-gradient(180deg,#ff8a6b,#f4604f);color:#fff;
  box-shadow:0 7px 0 var(--coral-d), 0 12px 24px rgba(244,96,79,.28);
}
.btn-primary:hover{background:linear-gradient(180deg,#ff9a7d,#f76c5c)}
.btn-primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--coral-d)}
.btn-ghost{
  background:#fff;border:2.5px solid var(--line-2);color:var(--ink);
  box-shadow:var(--shadow-sm);
}
.btn-ghost:hover{border-color:var(--coral);color:var(--coral)}
.btn-ghost:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn .icon{width:1.15em;height:1.15em}

.card{
  background:var(--paper);border:3px solid var(--line);
  border-radius:clamp(22px,3vw,32px);box-shadow:var(--shadow);
}

/* ========== 4. 主頁 ========== */
.home-hero{display:grid;grid-template-columns:1fr;gap:clamp(6px,2vw,26px);align-items:center;padding:clamp(14px,3vw,42px) 0 clamp(4px,1.6vw,18px)}
.hero-copy{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.2vw,14px)}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5em;
  font-size:clamp(13px,1.1vw,15px);font-weight:800;letter-spacing:.16em;
  color:var(--ink2);text-transform:uppercase;
}
.eyebrow::before{content:"";width:1.8em;height:3px;border-radius:2px;background:var(--coral);opacity:.7}
.home-title{
  font-size:clamp(32px,5.2vw,62px);line-height:1.14;font-weight:800;letter-spacing:-.01em;
}
.home-title .dots-lead{font-size:.5em;vertical-align:.55em;color:#c3ab92;letter-spacing:.02em}
.home-title .hl{
  color:var(--ink);white-space:nowrap;padding:0 .12em;margin:0 .02em;
  background:linear-gradient(180deg,rgba(255,224,138,0) 58%,#ffd166 58%,#ffd166 90%,rgba(255,209,102,0) 90%);
  border-radius:6px;
}
.home-sub{font-size:clamp(16px,1.5vw,21px);color:var(--ink2);max-width:30em;font-weight:500}
.hero-art{justify-self:center;width:100%;max-width:440px}
.hero-art svg{width:100%;height:auto}

.menu{display:grid;grid-template-columns:1fr;gap:clamp(11px,1.5vw,18px);margin-top:clamp(4px,1.6vw,16px)}
.menu-card{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:clamp(10px,1.4vw,18px);
  padding:clamp(14px,2vw,24px);
  background:#fff;border:3px solid var(--line);border-radius:clamp(22px,2.6vw,28px);
  box-shadow:var(--shadow-sm);text-align:left;
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,border-color .2s;
}
.menu-card::before{
  content:attr(data-no);position:absolute;top:.5em;right:.75em;
  font-size:.7em;font-weight:800;letter-spacing:.1em;color:#d8c4ab;
}
.menu-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--coral)}
.menu-card:active{transform:translateY(-2px)}
.menu-ico{
  width:clamp(52px,6vw,66px);aspect-ratio:1;border-radius:20px;
  display:grid;place-items:center;flex:none;
}
.menu-ico .icon{width:55%;height:55%;stroke-width:2.1}
.menu-card h2{font-size:clamp(19px,1.75vw,24px);font-weight:800;line-height:1.35}
.menu-card p{font-size:clamp(13px,1.15vw,15px);color:var(--ink2);line-height:1.55;font-weight:500}
.menu-arrow{color:#cdb79d;transition:transform .2s,color .2s}
.menu-arrow .icon{width:1.5em;height:1.5em;stroke-width:2.6}
.menu-card:hover .menu-arrow{transform:translateX(4px);color:var(--coral)}
.mc-learn .menu-ico{background:var(--sky-soft);color:var(--sky)}
.mc-one .menu-ico{background:var(--teal-soft);color:var(--teal)}
.mc-two .menu-ico{background:var(--grape-soft);color:var(--grape)}
.home-foot{
  margin-top:clamp(14px,2.4vw,26px);text-align:center;
  font-size:clamp(12px,1.05vw,14px);color:#a8917c;font-weight:600;letter-spacing:.03em;
}

/* ========== 5. 教學部 ========== */
.learn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(10px,1.8vw,20px) 0}
.learn-head .pill{background:#fff;border:2px solid var(--line);color:var(--ink2)}
.learn-card{
  display:grid;grid-template-columns:1fr;gap:clamp(14px,2.4vw,34px);
  align-items:center;padding:clamp(16px,2.8vw,40px);
  min-height:clamp(420px,54vh,600px);
}
.learn-art{
  border-radius:clamp(20px,2.6vw,28px);
  background:linear-gradient(160deg,#fff6e2,#eaf7f4 92%);
  border:2px dashed #e4d3bd;
  padding:clamp(10px,2vw,22px);
  display:grid;place-items:center;
}
.learn-art svg{width:100%;height:auto;max-height:44vh}
.learn-text{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px);min-width:0}
.learn-card.is-text-only{align-content:center}
.learn-card.is-text-only .learn-text{max-width:820px;margin:0 auto;width:100%}
.learn-card.is-text-only .cmp-col li{font-size:clamp(19px,1.8vw,25px)}
.learn-card.is-text-only .step p{font-size:clamp(17px,1.7vw,23px)}
.duo{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vw,14px);width:100%}
.duo svg{width:42%;height:auto}
.duo .duo-word{font-size:clamp(20px,2.4vw,30px);font-weight:800;color:var(--coral)}
.learn-text h2{font-size:clamp(24px,3.2vw,40px);line-height:1.3;font-weight:800}
.learn-text .tag{
  align-self:flex-start;font-size:clamp(12px,1.05vw,14px);font-weight:800;
  letter-spacing:.12em;color:var(--coral);background:var(--coral-soft);
  padding:.3em .9em;border-radius:99px;
}
.point-list{display:flex;flex-direction:column;gap:clamp(6px,1vw,12px)}
.point-list li{
  display:flex;gap:.7em;align-items:flex-start;
  font-size:clamp(17px,1.6vw,22px);line-height:1.6;font-weight:600;
}
.dot-num{
  flex:none;width:1.75em;height:1.75em;border-radius:50%;
  display:grid;place-items:center;margin-top:.12em;
  background:var(--sun-soft);color:#a06a00;font-size:.8em;font-weight:800;
}
.note-box{
  display:flex;gap:.6em;align-items:flex-start;
  padding:.7em .9em;border-radius:18px;
  background:var(--sky-soft);border:2px solid #d3e8fa;
  font-size:clamp(14px,1.25vw,17px);color:#2b5f8c;font-weight:600;line-height:1.6;
}
.note-box .icon{flex:none;margin-top:.25em;color:#3f93e8}
.learn-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:clamp(12px,2vw,20px)}
.learn-nav .btn{min-height:56px;padding:0 1.1em;font-size:clamp(15px,1.35vw,17px);white-space:nowrap}
.dots{display:flex;gap:8px;align-items:center}
.dots button{
  width:14px;height:14px;border-radius:50%;background:#e6d1b6;
  transition:transform .2s,background .2s;padding:0;
}
.dots button[aria-current="true"]{background:var(--coral);transform:scale(1.25)}
.dots button:hover{background:#c9ab8b}

/* 公式 */
.formula{display:flex;flex-direction:column;gap:clamp(6px,.9vw,10px);font-weight:800}
.f-row{display:flex;flex-wrap:wrap;align-items:center;gap:.34em;font-size:clamp(17px,1.72vw,24px)}
.chip{padding:.1em .5em;border-radius:12px;line-height:1.5;font-weight:800}
.chip.a{background:var(--sky-soft);color:#1d5c94}
.chip.b{background:var(--grape-soft);color:#4a39c9}
.chip.g{background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d)}
.chip.adj{background:var(--sun-soft);color:#8a5800}
.f-down{display:flex;align-items:center;gap:.5em;color:var(--ink2);font-size:.9em;font-weight:700;padding-left:.4em}
.f-down .icon{width:1.1em;height:1.1em}
.f-row.big{font-size:clamp(18px,1.9vw,26px)}
.f-note{font-size:clamp(14px,1.2vw,16px);color:var(--ink2);font-weight:600}

/* 正誤對照 */
.cmp{display:grid;grid-template-columns:1fr;gap:clamp(8px,1.2vw,14px)}
.cmp-col{border-radius:20px;padding:clamp(10px,1.4vw,16px);border:2.5px solid}
.cmp-col.ok{background:var(--green-soft);border-color:#bfe3c7}
.cmp-col.no{background:var(--red-soft);border-color:#f7cfcc}
.cmp-title{display:flex;align-items:center;gap:.4em;font-weight:800;font-size:.92em;margin-bottom:.4em}
.cmp-col.ok .cmp-title{color:#1f7a33}
.cmp-col.no .cmp-title{color:#b3261e}
.cmp-col li{font-size:clamp(16px,1.5vw,21px);font-weight:700;line-height:1.75}
.cmp-col li span.hi{color:var(--coral);background:#fff3d6;border-radius:6px;padding:0 .18em}

/* 詞語卡 */
.words{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.2vw,14px)}
.word-card{
  display:flex;align-items:center;gap:.55em;
  padding:.5em .6em;border-radius:18px;background:#fff;
  border:2.5px solid var(--line);box-shadow:var(--shadow-sm);
}
.word-card svg{width:clamp(38px,4.4vw,50px);height:clamp(38px,4.4vw,50px);flex:none}
.word-card b{font-size:clamp(19px,1.9vw,25px);font-weight:800;line-height:1.2}
.word-card i{display:block;font-style:normal;font-size:clamp(12px,1.05vw,14px);color:var(--ink2);font-weight:700}
.steps{display:flex;flex-direction:column;gap:clamp(7px,1vw,12px)}
.step{display:flex;gap:.7em;align-items:flex-start}
.step-n{
  flex:none;width:2em;height:2em;border-radius:14px;display:grid;place-items:center;
  background:var(--coral);color:#fff;font-weight:800;font-size:.9em;box-shadow:0 4px 0 var(--coral-d);
}
.step p{font-weight:700;font-size:clamp(16px,1.5vw,21px);line-height:1.55}
.step small{display:block;color:var(--ink2);font-weight:600;font-size:.78em;line-height:1.5}

/* ========== 5b. 合併教學與答題輔助 ========== */
.hw{
  font-style:normal;font-weight:inherit;color:#1d5c94;
  background:#e3f1fd;border-radius:.24em;padding:0 .14em;
}
.hg{
  font-style:normal;font-weight:inherit;color:#d93b32;
  background:#ffe7e1;border-radius:.24em;padding:0 .14em;
  box-shadow:inset 0 -.3em 0 #ffd2c9;
}
.ha{
  font-style:normal;font-weight:inherit;color:#1f7a33;
  background:#e8f8ec;border-radius:.24em;padding:0 .12em;
}

/* 圖 + 句 卡 */
.sc-stack{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,14px);width:100%}
.sc{
  display:flex;align-items:center;gap:.6em;background:#fffdf7;
  border:3px solid var(--line);border-radius:20px;padding:.5em .8em;
}
.sc .art{width:clamp(64px,9vw,92px);height:auto;flex:none}
.sc-b{min-width:0}
.sc-nm{display:inline-block;font-size:clamp(11px,1vw,13px);font-weight:800;color:#8a6a52;letter-spacing:.1em}
.sc-tx{margin:0;font-size:clamp(17px,1.7vw,23px);font-weight:800;line-height:1.45}

/* 兩句對照 */
.lead-line{font-size:clamp(16px,1.5vw,20px);font-weight:700;line-height:1.6;color:var(--ink)}
.lead-line b{color:var(--coral-d)}
.two-lines{display:flex;flex-direction:column;gap:.5em}
.tl{
  display:flex;align-items:center;gap:.6em;background:#fffaf0;
  border:2.5px solid var(--line);border-radius:16px;padding:.45em .8em;
  font-size:clamp(18px,1.8vw,24px);font-weight:800;
}
.tl-tag{
  flex:none;font-size:clamp(11px,1vw,13px);font-weight:800;color:#1d5c94;
  background:var(--sky-soft);border-radius:99px;padding:.15em .7em;letter-spacing:.08em;
}
.big-note{
  font-size:clamp(17px,1.65vw,22px);font-weight:800;color:var(--coral-d);
  line-height:1.5;background:var(--coral-soft);border-radius:16px;padding:.5em .8em;
}

/* 四步合併 */
.msteps{display:flex;flex-direction:column;gap:clamp(6px,.9vw,10px)}
.msteps li{
  display:flex;gap:.65em;align-items:flex-start;background:#fff;
  border:2.5px solid var(--line);border-radius:18px;padding:.55em .8em;
}
.ms-n{
  flex:none;width:1.9em;height:1.9em;border-radius:12px;display:grid;place-items:center;
  background:var(--coral);color:#fff;font-weight:800;font-size:.9em;box-shadow:0 3px 0 var(--coral-d);
}
.ms-body{min-width:0;flex:1}
.ms-t{font-size:clamp(16px,1.5vw,20px);font-weight:800;line-height:1.4}
.ms-d{font-size:clamp(14px,1.3vw,17px);font-weight:600;color:var(--ink2);line-height:1.55;margin-top:.1em}
.ms-ex{margin-top:.28em;font-size:clamp(16px,1.55vw,21px);font-weight:800;line-height:1.6;letter-spacing:.02em}
.cir{font-style:normal;border:2.5px solid var(--sky);border-radius:50%;padding:0 .16em;color:#1d5c94}
.mk{color:var(--coral);font-size:1.15em}
.rail{
  display:flex;align-items:center;gap:.6em;flex-wrap:wrap;
  background:#fff6e6;border:3px solid #f6d9a8;border-radius:18px;padding:.55em .8em;
}
.rail-tag{
  flex:none;font-size:clamp(11px,1vw,13px);font-weight:800;color:#8a5800;
  background:#ffe1a8;border-radius:99px;padding:.15em .7em;letter-spacing:.08em;
}
.rail-s{font-size:clamp(18px,1.9vw,26px);font-weight:800;line-height:1.5}

/* 互動示範 */
.demo{
  display:flex;flex-direction:column;gap:.6em;background:#fffdf7;
  border:3px dashed var(--line-2);border-radius:20px;padding:clamp(10px,1.5vw,18px);
}
.demo-sent{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;font-size:clamp(19px,2vw,27px);font-weight:800}
.ds-tag{
  flex:none;font-size:clamp(11px,1vw,13px);font-weight:800;color:#1d5c94;
  background:var(--sky-soft);border-radius:99px;padding:.15em .7em;letter-spacing:.08em;
}
.ds-tag.b{color:#4a39c9;background:var(--grape-soft)}
.swap-slot{display:inline-block}
.swap-btn{
  font:inherit;font-weight:800;color:#a9600b;background:#ffeccc;
  border:2.5px dashed #e8a33d;border-radius:12px;padding:0 .26em;line-height:1.2;
  animation:breathe 1.8s ease-in-out infinite;
}
.swap-btn--done{
  color:#fff;background:var(--coral);border:2.5px solid var(--coral-d);
  animation:pop .36s cubic-bezier(.22,1.5,.36,1);
}
@keyframes breathe{0%,100%{background:#ffeccc;box-shadow:0 0 0 0 rgba(232,163,61,0)}50%{background:#ffe0b0;box-shadow:0 0 0 4px rgba(232,163,61,.18)}}
.demo-tip{font-size:clamp(14px,1.25vw,17px);font-weight:700;color:var(--ink2)}
.merge-out{

.q-card{padding:clamp(14px,2.4vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.8vw,20px)}
.q-hint{
  display:flex;align-items:center;gap:.5em;justify-content:center;
  font-size:clamp(14px,1.3vw,17px);color:var(--ink2);font-weight:700;
}
.q-hint .icon{color:var(--coral)}

.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(6px,1.2vw,16px);align-items:center}
.panel{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:clamp(6px,1.1vw,14px);

.vs{

}

.src{
  text-align:center;font-size:clamp(15px,1.4vw,19px);font-weight:700;color:var(--ink2);

}

}

}
.blank{
  display:inline-grid;place-items:center;vertical-align:-.1em;
  min-width:1.75em;height:1.42em;margin:0 .12em;
  border:3px dashed var(--coral);border-radius:14px;background:#fff6f1;
  color:var(--coral);font-size:.8em;line-height:1;text-align:center;
}
.blank.filled{
  border:3px solid var(--green);background:var(--green-soft);color:var(--green);
  animation:pop .36s cubic-bezier(.22,1.5,.36,1);
}
@keyframes pop{0%{transform:scale(.72);opacity:0}100%{transform:scale(1);opacity:1}}

.options{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(7px,1.3vw,14px)}
.opt{
  position:relative;min-height:clamp(64px,9vw,84px);
  display:grid;place-items:center;
  border-radius:clamp(16px,2.2vw,22px);
  border:3px solid var(--line-2);background:#fffdf8;
  font-size:clamp(22px,2.6vw,34px);font-weight:800;color:var(--ink);
  transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
  box-shadow:0 4px 0 #e8d6c1;
}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--coral);background:#fff6f1;box-shadow:0 7px 0 #f0c7b8}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #e8d6c1}
.opt:disabled{cursor:default;opacity:1}
.opt::after{
  content:"";position:absolute;top:.45em;right:.55em;
  font-size:.55em;font-weight:800;line-height:1;opacity:0;transition:opacity .2s;
}
.opt.is-correct{border-color:var(--green);background:var(--green-soft);color:#1f7a33;box-shadow:0 4px 0 #a9d9b4}
.opt.is-correct::after{content:"✓";color:var(--green);opacity:1}
.opt.is-wrong{border-color:var(--red);background:var(--red-soft);color:#b3261e;box-shadow:0 4px 0 #f0b8b3}

.opt.dim{opacity:.45}

.options.sent-opts{grid-template-columns:1fr;gap:clamp(8px,1.2vw,12px)}
.opt-s{
  display:flex;align-items:center;gap:.6em;justify-content:flex-start;
  min-height:clamp(58px,8vw,74px);
  padding:.5em .8em;font-size:clamp(16px,1.75vw,23px);
  text-align:left;line-height:1.5;font-weight:700;
}
.opt-s .abbr{
  flex:none;width:1.8em;height:1.8em;border-radius:12px;
  display:grid;place-items:center;background:#f4e7d5;color:#9c7c58;
  font-size:.72em;font-weight:800;
}
.opt-s.is-correct .abbr{background:var(--green);color:#fff}
.opt-s.is-wrong .abbr{background:var(--red);color:#fff}
.opt-s::after{position:static;margin-left:auto;font-size:.8em}

/* 模式二：兩幅圖 + 大句子 */
.q-hint--big{
  font-size:clamp(16px,1.55vw,20px);color:var(--ink);
  font-weight:800;line-height:1.5;text-align:center;

  border-radius:clamp(16px,2vw,22px);
  padding:clamp(6px,1vw,12px) clamp(5px,.9vw,10px) clamp(8px,1.2vw,14px);

.m2-scene.b{background:#fffaf3;border-color:#f3dcc0}
.m2-tag{
  font-size:clamp(11px,1vw,14px);font-weight:800;letter-spacing:.1em;
  color:#1d5c94;background:var(--sky-soft);border-radius:99px;padding:.1em .8em;
}
.m2-scene.b .m2-tag{color:#4a39c9;background:var(--grape-soft)}
.m2-art .art{width:clamp(88px,13vw,148px);height:auto;margin:.1em 0}
.m2-sent{
  font-size:clamp(18px,2.8vw,26px);font-weight:800;line-height:1.5;
  text-align:center;letter-spacing:.01em;
}
.m2-join{
  display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap;
  font-size:clamp(13px,1.2vw,16px);font-weight:800;color:var(--ink2);
}
.mj-chip{
  background:var(--sky-soft);color:#1d5c94;border-radius:99px;padding:.1em .65em;
}

}
.kw-legend span{
  display:inline-flex;align-items:center;gap:.3em;background:#fff;
  border:2px solid var(--line);border-radius:99px;padding:.08em .6em;
}
.kw-legend i{font-style:normal;padding:0 .3em;border-radius:6px}
.options.m2-opts{grid-template-columns:1fr;gap:clamp(10px,1.5vw,16px)}
.opt-m2{
  display:flex;align-items:center;justify-content:flex-start;gap:.55em;
  min-height:clamp(84px,10vw,106px);padding:.5em .75em;
  font-size:clamp(21px,3.2vw,30px);font-weight:800;line-height:1.55;text-align:left;
}
.opt-m2 .abbr{
  flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;
  background:var(--sun-soft);color:#a06a00;font-size:.7em;font-weight:800;
}
.opt-m2 .om-art{flex:none}
.opt-m2 .om-art .art{width:clamp(52px,6.8vw,78px);height:auto}
.opt-m2 .om-sent{min-width:0;flex:1;display:flex;flex-direction:column;gap:.02em;line-height:1.45}
.opt-m2 .om-sent .cl{display:block}
.opt-m2.is-correct .abbr{background:var(--green);color:#fff}
.opt-m2.is-wrong .abbr{background:var(--red);color:#fff}
.opt-m2.is-correct .hg{color:#12833a;background:#d6f5e0;box-shadow:none}
.opt-m2.is-wrong .hg{color:#a32b22;background:#ffdcd8;box-shadow:none}
/* 小幫手：圖示示範 */
.mm-demo{
  display:flex;flex-direction:column;gap:.25em;background:#fff;
  border:2px solid #f0d9b0;border-radius:16px;padding:.55em .7em;
}

}

.fb-actions{display:flex;justify-content:flex-end;margin-top:.2em}

/* ========== 7. 結果 ========== */
.result-wrap{display:grid;place-items:center;padding:clamp(16px,4vw,48px) 0}
.result-card{
  width:100%;max-width:680px;text-align:center;
  padding:clamp(22px,3.6vw,48px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vw,16px);
}

.result-msg{
  font-size:clamp(15px,1.35vw,18px);color:var(--ink2);font-weight:600;line-height:1.7;

}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:22em;margin-top:.4em}
.result-actions .btn{width:100%}
.result-foot{font-size:clamp(12px,1.05vw,14px);color:#a8917c;font-weight:600;line-height:1.6}

@media(min-width:700px){

  .menu-arrow{position:absolute;right:clamp(14px,2vw,22px);bottom:clamp(16px,2vw,24px)}

  .learn-card{grid-template-columns:.92fr 1.08fr}
  .learn-art svg{max-height:50vh}
  .cmp{grid-template-columns:1fr 1fr}
  .words{grid-template-columns:repeat(3,1fr)}
}

  .home-hero{grid-template-columns:1.08fr .92fr;padding-top:clamp(24px,4vw,52px)}

  .result-actions .btn{width:auto}
}
@media(max-width:600px){
  .m2-scenes{grid-template-columns:1fr}

  .m2-scene .m2-tag{align-self:flex-start;margin-top:.35em}
  .m2-art .art{width:clamp(76px,18vw,104px)}
  .m2-sent{text-align:left;font-size:clamp(18px,5vw,22px)}

  .opt-m2 .om-art .art{width:40px}
}
@media(max-width:520px){
  .brand-text{display:none}
  .hero-art{max-width:340px}
  .home-hero{padding-top:10px;gap:0}
  .home-title{font-size:clamp(28px,8.6vw,40px)}
  .home-sub{font-size:15px}
  .opt:not(.opt-m2){font-size:clamp(20px,6.4vw,26px)}
  .sent{font-size:clamp(20px,5.6vw,27px)}
  .result-actions .btn{min-height:58px}
  .learn-card{min-height:0}
  .learn-art svg{max-height:34vh}
}
@media(max-height:640px) and (orientation:landscape){
  .learn-art svg{max-height:40vh}
}


@media(max-width:600px){
  .learn-nav{flex-wrap:wrap;justify-content:center;gap:8px}
  .learn-nav .dots{order:-1;flex:1 0 100%;justify-content:center;margin-bottom:2px}
  .learn-nav .btn{flex:1 1 0;max-width:49%;justify-content:center;padding:0 .5em}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .screen{animation:none}
}

/* 把「很」和「更」標示出來，方便學生看見關鍵字 */
function hl(s) {
  return s.replace(/很/g, '<em class="hw">很</em>').replace(/更/g, '<em class="hg">更</em>');
}

/* 大字版：把「很」「更」和形容詞分別標色 */
function hl2(s, adj) {
  var out = '', i, ch;
  for (i = 0; i < s.length; i++) {
    ch = s.charAt(i);
    if (ch === '很') { out += '<em class="hw">很</em>'; }
    else if (ch === '更') { out += '<em class="hg">更</em>'; }
    else if (adj && adj.indexOf(ch) > -1) { out += '<em class="ha">' + ch + '</em>'; }
    else { out += ch; }
  }
  return out;
}

/* 模式二選項：把甲句、乙句分成兩行，方便小一閱讀 */
function clauseHTML(t, adj) {
  var i = t.indexOf('，');
  if (i < 0) { return '<span class="cl">' + hl2(t, adj) + '</span>'; }
  return '<span class="cl">' + hl2(t.slice(0, i + 1), adj) + '</span>' +
    '<span class="cl">' + hl2(t.slice(i + 1), adj) + '</span>';
}

var Sound = (function () {
  var ctx = null;
  var enabled = true;

  function ensure() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') { ctx.resume(); }
      return ctx;
    } catch (e) { return null; }
  }

  function tone(freq, delay, dur, type, vol) {
    var c = ensure();
    if (!c) return;
    try {
      var t0 = c.currentTime + delay;
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol === undefined ? 0.12 : vol, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) { /* 靜默失敗，不影響學習流程 */ }
  }

  return {
    setEnabled: function (v) { enabled = !!v; if (enabled) { ensure(); } },
    isEnabled: function () { return enabled; },
    click: function () { tone(640, 0, 0.07, 'sine', 0.07); },
    tap: function () { tone(520, 0, 0.06, 'triangle', 0.06); },

var CAN_SPEAK = (typeof window !== 'undefined') && ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance === 'function';
function speak(text) {
  if (!CAN_SPEAK) return false;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    u.rate = 0.85;
    u.pitch = 1.08;
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      if (/zh[-_]HK|yue|Cantonese/i.test(vs[i].lang || '') || /Hong Kong/i.test(vs[i].name || '')) {
        u.voice = vs[i]; break;
      }
    }
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

    '<text x="88" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#f4604f" font-family="inherit">更高！</text>' +
    '</g>' +
    '</svg>';
  var el = $('#hero-art');
  if (el) el.innerHTML = html;
}

/* =====================================================================
   8. 教學部
   ===================================================================== */
function renderLearn() {
  var p = LEARN[S.learnPage];
  var card = $('#learn-card');
  if (!card) return;

  var isFormula = !p.art;
  card.style.gridTemplateColumns = '';
  if (isFormula) { card.classList.add('is-text-only'); } else { card.classList.remove('is-text-only'); }

  var artHTML = p.art
    ? '<div class="learn-art">' + p.art + '</div>'
    : '';

  card.innerHTML = artHTML +
    '<div class="learn-text">' +
    '<span class="tag">' + p.tag + '</span>' +
    '<h2>' + p.title + '</h2>' +
    p.body +
    '</div>';

  if (isFormula) { card.style.gridTemplateColumns = '1fr'; }

  $('#learn-count').textContent = '教學 ' + (S.learnPage + 1) + ' / ' + LEARN.length;

  var dots = $('#learn-dots');
  dots.innerHTML = LEARN.map(function (_, i) {
    return '<button type="button" data-page="' + i + '" aria-label="第 ' + (i + 1) + ' 頁"' +
      (i === S.learnPage ? ' aria-current="true"' : '') + '></button>';
  }).join('');

  $('#learn-prev').disabled = (S.learnPage === 0);

  var next = $('#learn-next');
  if (S.learnPage === LEARN.length - 1) {
    next.innerHTML = '去玩遊戲<svg class="icon" aria-hidden="true"><use href="#ic-game"></use></svg>';
  } else {
    next.innerHTML = '下一頁<svg class="icon" aria-hidden="true"><use href="#ic-arrow"></use></svg>';
  }
}

function goLearn(page) {
  S.learnPage = page;
  renderLearn();
  Sound.tap();
  show('learn');
}

/* =====================================================================
   9. 遊戲
   ===================================================================== */
function startQuiz(mode) {
  S.mode = mode;
  S.order = shuffle(mode === 1 ? Q1 : Q2);
  S.idx = 0;
  S.score = 0;
  S.answered = false;
  S.chosen = '';
  show('quiz');
  renderQuestion();
}

function modeName(m) {
  return m === 1 ? '模式一 · 看圖填一填' : '模式二 · 句子小偵探';
}

function updateHud() {
  var pct = (S.idx / TOTAL) * 100;
  $('#q-bar').style.width = pct + '%';
  $('#q-count').textContent = '第 ' + (S.idx + 1) + ' / ' + TOTAL + ' 題';
  $('#q-score').textContent = String(S.score);
}

function speakLine(text) {
  return CAN_SPEAK
    ? '<button type="button" class="speak-btn" data-act="speak" data-say="' + text.replace(/"/g, '&quot;') + '">' +
    '<svg class="icon" aria-hidden="true"><use href="#ic-speaker"></use></svg>聽一聽</button>'
    : '';
}

function renderQuestion() {
  var item = S.order[S.idx];
  var body = $('#quiz-body');
  S.answered = false;
  S.chosen = '';
  S.hintOpen = false;
  updateHud();

  if (S.mode === 1) {
    var opts = shuffle(item.opts);
    body.innerHTML =
      '<p class="q-hint"><svg class="icon" aria-hidden="true"><use href="#ic-bulb"></use></svg>看看兩幅圖和兩句話，選出正確的字填進空格。</p>' +
      '<div class="pair">' +
      '<div class="panel a">' + pic(item.a) + '<span class="nm">' + item.la + '</span>' +
      '<p class="psent">' + hl(item.s1) + '</p></div>' +
      '<div class="vs" aria-hidden="true"><span>比</span></div>' +
      '<div class="panel b">' + pic(item.b) + '<span class="nm">' + item.lb + '</span>' +
      '<p class="psent">' + hl(item.s2) + '</p></div>' +
      '</div>' +
      '<p class="sent">' + item.pre + '<span class="blank" id="blank">？</span>。</p>' +
      '<div class="tools">' +
      '<button type="button" class="tool-btn" data-act="hint" aria-expanded="false" aria-controls="hint-slot">' +
      '<svg class="icon" aria-hidden="true"><use href="#ic-bulb"></use></svg>小幫手</button>' +
      speakLine(item.s1 + item.s2) +
      '</div>' +
      '<div class="hint-slot" id="hint-slot" hidden></div>' +
      '<div class="options" id="options">' + opts.map(function (o) {
        return '<button type="button" class="opt" data-val="' + o + '">' + o + '</button>';
      }).join('') + '</div>' +
      '<div class="feedback" id="feedback" hidden></div>';
  } else {
    var letters = ['1', '2'];
    var sopts = shuffle(item.opts.map(function (t, i) { return { t: t, ok: i === 0 }; }));
    body.innerHTML =
      '<p class="q-hint q-hint--big"><svg class="icon" aria-hidden="true"><use href="#ic-mag"></use></svg>' +
      '看看兩幅圖，選出合併得<b>對</b>的句子。</p>' +
      '<div class="m2-scenes">' +
      sceneRow(item.f1.art, '甲', item.f1.t, item.adj) +
      sceneRow(item.f2.art, '乙', item.f2.t, item.adj) +
      '</div>' +
      '<div class="m2-join"><span class="mj-chip">甲</span><span>＋</span>' +
      '<span class="mj-chip b">乙</span><span>→</span>' +
      '<span class="mj-out">合成一句</span></div>' +
      '<div class="kw-legend">' +
      '<span><i class="hw">很</i>原本的程度</span>' +
      '<span><i class="hg">更</i>更加</span>' +
      '<span><i class="ha">形容詞</i></span>' +
      '</div>' +
      '<div class="tools">' +
      '<button type="button" class="tool-btn" data-act="hint" aria-expanded="false" aria-controls="hint-slot">' +
      '<svg class="icon" aria-hidden="true"><use href="#ic-bulb"></use></svg>小幫手</button>' +
      speakLine(item.f1.t + item.f2.t) +
      '</div>' +
      '<div class="hint-slot" id="hint-slot" hidden></div>' +
      '<div class="options m2-opts" id="options">' + sopts.map(function (o, i) {
        return '<button type="button" class="opt opt-m2" data-val="' + o.t + '">' +
          '<span class="abbr">' + letters[i] + '</span>' +
          '<span class="om-art">' + pic(item.f2.art) + '</span>' +
          '<span class="om-sent">' + clauseHTML(o.t, item.adj) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="feedback" id="feedback" hidden></div>';
  }
}

function answer(value, btn) {
  if (S.answered) return;
  var item = S.order[S.idx];
  var correctText = (S.mode === 1) ? item.adj : item.full;
  var right = (value === correctText);

  S.answered = true;
  S.chosen = value;
  S.hintOpen = true;
  if (right) S.score += 1;

  $$('#options .opt').forEach(function (b) {
    b.disabled = true;
    var v = b.getAttribute('data-val');
    if (v === correctText) { b.classList.add('is-correct'); }
    else if (v === value) { b.classList.add('is-wrong'); }
    else { b.classList.add('dim'); }
  });

  if (S.mode === 1) {
    var blank = $('#blank');
    if (blank) {
      blank.textContent = item.adj;
      blank.classList.add('filled');
    }
  }

  /* 揭曉答案時，同時展開「合併示範」，讓學生看見兩句怎樣變一句 */
  if (S.mode === 1) {
    var slot = $('#hint-slot');
    if (slot) { slot.innerHTML = mergeHint(item); slot.hidden = false; }
    var hb = $('[data-act="hint"]');
    if (hb) { hb.setAttribute('aria-expanded', 'true'); hb.classList.add('is-on'); }
  }

  if (right) { Sound.correct(); } else { Sound.wrong(); }

  var fb = $('#feedback');
  var isLast = (S.idx === TOTAL - 1);
  var html;

  if (right) {
    html = '<div class="fb-head">' +
      '<svg class="icon" aria-hidden="true"><use href="#ic-check"></use></svg><span>答對了！</span></div>' +
      '<p class="fb-text">' + item.exp + '</p>';
  } else {
    html = '<div class="fb-head">' +
      '<svg class="icon" aria-hidden="true"><use href="#ic-bulb"></use></svg><span>差一點，一齊看看</span></div>' +
      (S.mode === 1
        ? '<p class="fb-text">你選了「' + value + '」，但兩句都在說「' + item.adj + '」，比較的方向要一致。</p>'
        : '<p class="fb-text"><b>' + item.bad + '</b></p>') +
      '<p class="fb-text">' + item.exp + '</p>';
  }

  if (S.mode === 1) {
    html += '<p class="fb-full">完整句子：<b>' + hl(item.full) + '</b></p>' +
      '<p class="fb-rule"><span>合併口訣</span>甲句照抄，句號改逗號；乙句拿走「也」和「很」，換上「更」。</p>';
    if (item.tip) { html += '<p class="fb-text">小貼士：' + item.tip + '</p>'; }
  } else {
    html += mergeHint2(item);
    if (item.tip) { html += '<p class="fb-text">小貼士：' + item.tip + '</p>'; }
  }
  html += '<div class="fb-actions"><button type="button" class="btn btn-primary" data-act="next">' +
    (isLast ? '看成績' : '下一題') +
    '<svg class="icon" aria-hidden="true"><use href="#' + (isLast ? 'ic-star' : 'ic-arrow') + '"></use></svg>' +
    '</button></div>';

  fb.innerHTML = html;
  fb.hidden = false;
  if (!right) fb.classList.add('is-bad');

  var nextBtn = fb.querySelector('[data-act="next"]');
  if (nextBtn && window.matchMedia && window.matchMedia('(min-width:700px)').matches) {
    try { nextBtn.focus({ preventScroll: true }); } catch (e) { }
  }
}

function nextQuestion() {
  if (S.idx >= TOTAL - 1) { finish(); return; }
  S.idx += 1;
  Sound.turn();
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finish() {
  var sc = S.score;
  var stars = sc >= 9 ? 3 : (sc >= 6 ? 2 : 1);
  var msg;
  if (sc === 10) {
    msg = '全部答對！你已經完全掌握「……更……」的句式了，可以做小老師教同學。';
  } else if (sc >= 8) {
    msg = '很好！只差一點點。記得「更」要貼住形容詞，用完「更」就不用再加「很」。';
  } else if (sc >= 5) {
    msg = '不錯的開始！再回去看看教學第 5 頁「『更』放在哪裏？」，然後再挑戰一次。';
  } else {
    msg = '別灰心，先看看教學第 3 頁的「四步合併法」，明白「甲很X，乙更X」再來一次就順暢了。';
  }

  var starSVG = function (on) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-star" style="fill:' +
      (on ? '#ffc93c' : '#f0e4d4') + ';stroke:' + (on ? '#e8a600' : '#e2d3bf') + ';stroke-width:1.2"></use></svg>';
  };

  var otherMode = S.mode === 1 ? 2 : 1;
  var html =
    '<p class="pill">' + modeName(S.mode) + '</p>' +
    '<h2>' + (sc >= 8 ? '做得好！' : '完成啦！') + '</h2>' +
    '<div class="result-stars" role="img" aria-label="獲得 ' + stars + ' 顆星（共 3 顆）">' +
    starSVG(stars >= 1) + starSVG(stars >= 2) + starSVG(stars >= 3) + '</div>' +
    '<p class="result-score">答對 <b>' + sc + '</b> / ' + TOTAL + ' 題</p>' +
    '<p class="result-msg">' + msg + '</p>' +
    '<div class="result-actions">' +
    '<button type="button" class="btn btn-primary" data-act="again">' +
    '<svg class="icon" aria-hidden="true"><use href="#ic-refresh"></use></svg>再玩一次</button>' +
    '<button type="button" class="btn btn-ghost" data-act="other">挑戰' + (otherMode === 1 ? '模式一' : '模式二') + '</button>' +
    '<button type="button" class="btn btn-ghost" data-act="to-learn">看教學</button>' +
    '</div>' +
    '<p class="result-foot">本模式共 10 組題目，每次重玩會重新排列出題次序。</p>';

  $('#result-card').innerHTML = html;
  window.scrollTo(0, 0);
  show('result');
  if (sc >= 6) { Sound.win(); } else { Sound.turn(); }
}

/* =====================================================================
   10. 事件綁定
   ===================================================================== */
function bindEvents() {
  /* 全域點擊委派 */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (t) {
      e.preventDefault();
      Sound.click();
      if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (err) { } }
      show(t.getAttribute('data-go'));
      return;
    }

    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.getAttribute('data-act');

    if (a === 'go-learn') { goLearn(0); return; }
    if (a === 'start') { Sound.click(); startQuiz(parseInt(act.getAttribute('data-mode'), 10)); return; }
    if (a === 'speak') {
      var say = act.getAttribute('data-say') || '';
      if (!speak(say)) { act.textContent = '此裝置未能朗讀'; }
      return;
    }
    if (a === 'hint') {
      var slot = $('#hint-slot');
      if (!slot) return;
      var open = act.getAttribute('aria-expanded') === 'true';
      if (open) {
        slot.hidden = true;
        act.setAttribute('aria-expanded', 'false');
        act.classList.remove('is-on');
      } else {
        if (!slot.innerHTML) {
          slot.innerHTML = (S.mode === 1) ? mergeHint(S.order[S.idx]) : ruleHint();
        }
        slot.hidden = false;
        act.setAttribute('aria-expanded', 'true');
        act.classList.add('is-on');
        Sound.tap();
      }
      return;
    }
    if (a === 'swap') {
      if (act.classList.contains('swap-btn--done')) return;
      act.classList.add('swap-btn--done');
      act.textContent = '更';
      act.setAttribute('aria-label', '已換成「更」字');
      var out = $('#merge-out');
      if (out) { out.hidden = false; }
      Sound.correct();
      return;
    }
    if (a === 'swap-reset') { renderLearn(); Sound.click(); return; }
    if (a === 'next') { nextQuestion(); return; }
    if (a === 'again') { Sound.click(); startQuiz(S.mode); return; }
    if (a === 'other') { Sound.click(); startQuiz(S.mode === 1 ? 2 : 1); return; }
    if (a === 'to-learn') { Sound.click(); goLearn(0); return; }
  });

  /* 選項 */
  $('#quiz-body').addEventListener('click', function (e) {
    var opt = e.target.closest('.opt');
    if (!opt || opt.disabled) return;
    answer(opt.getAttribute('data-val'), opt);
  });

  /* 教學導覽 */
  $('#learn-prev').addEventListener('click', function () {
    if (S.learnPage > 0) { S.learnPage -= 1; renderLearn(); Sound.tap(); }
  });
  $('#learn-next').addEventListener('click', function () {
    if (S.learnPage < LEARN.length - 1) {
      S.learnPage += 1; renderLearn(); Sound.tap();
    } else {
      Sound.click();
      startQuiz(1);
    }
  });
  $('#learn-dots').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-page]');
    if (!b) return;
    S.learnPage = parseInt(b.getAttribute('data-page'), 10);
    renderLearn();
    Sound.tap();
  });

  /* 音效開關 */
  var sBtn = $('#sound-toggle');
  sBtn.addEventListener('click', function () {
    S.sound = !S.sound;
    Sound.setEnabled(S.sound);
    sBtn.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
    sBtn.setAttribute('aria-label', S.sound ? '音效開關（現時：開）' : '音效開關（現時：關）');
    sBtn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#' + (S.sound ? 'ic-volume' : 'ic-mute') + '"></use></svg>';
    if (S.sound) { Sound.correct(); }
    try { window.localStorage.setItem('geng_sound', S.sound ? '1' : '0'); } catch (e) { }
  });

  /* 鍵盤：1/2/3 選項、Enter 下一題 */
  document.addEventListener('keydown', function (e) {
    if (S.screen !== 'quiz') {
      if (S.screen === 'learn' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
        var np = S.learnPage + (e.key === 'ArrowRight' ? 1 : -1);
        if (np >= 0 && np < LEARN.length) { S.learnPage = np; renderLearn(); Sound.tap(); }
      }
      return;
    }
    if (e.key >= '1' && e.key <= '3') {
      var opts = $$('#options .opt');
      var i = parseInt(e.key, 10) - 1;
      if (opts[i] && !opts[i].disabled) { opts[i].click(); }
      return;
    }
    if (e.key === 'Enter') {
      var nb = $('#feedback [data-act="next"]');
      if (nb && !$('#feedback').hidden) { e.preventDefault(); nb.click(); }
    }
  });
}

/* =====================================================================
   11. 啟動
   ===================================================================== */
function init() {
  try {
    var saved = window.localStorage.getItem('geng_sound');
    if (saved === '0') { S.sound = false; Sound.setEnabled(false); }
  } catch (e) { }

  var sBtn = $('#sound-toggle');
  sBtn.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  sBtn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#' + (S.sound ? 'ic-volume' : 'ic-mute') + '"></use></svg>';

  renderHero();
  renderLearn();
  bindEvents();
  show('home');

  /* 預熱語音清單（部分瀏覽器非同步載入） */
  if (CAN_SPEAK) {
    try { window.speechSynthesis.getVoices(); } catch (e) { }
  }
}

init();
</script>
