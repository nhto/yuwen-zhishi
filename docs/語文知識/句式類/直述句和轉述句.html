<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>句式變變變｜直述句與轉述句互動教室</title>
<meta name="description" content="香港小學繁體中文教具：圖示化教學卡加上三種互動遊戲，初小與高小雙版本，手機、平板、電腦均可使用。">
<style>
svg{display:block;}
.icn{width:1.25rem;height:1.25rem;flex:none;}
.hero-eyebrow > svg{width:1.05rem;height:1.05rem;flex:none;}

:root{
  --cream:#FFF6E8;
  --paper:#FFFDF7;
  --ink:#3E2F23;
  --ink-2:#6E5844;
  --ink-3:#9A8570;
  --coral:#FF8A5B;
  --coral-d:#E4673A;
  --mint:#6FCBA4;
  --mint-d:#3E9E78;
  --sky:#6EC1E4;
  --sky-d:#3F94B8;
  --sun:#FFCF5C;
  --berry:#F2739E;
  --violet:#A48BE0;
  --ok:#3E9E78;
  --no:#E4673A;
  --line:3px solid var(--ink);
  --r-xl:30px;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:12px;
  --sh:0 6px 0 rgba(62,47,35,.15);
  --sh-hard:0 5px 0 var(--ink);
  --pad:clamp(.85rem,2.2vw,1.7rem);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{
  font-size:clamp(16.5px,1.02vw + 9.4px,21px);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
  font-weight:600;
  line-height:1.6;
  background-color:var(--cream);
  background-image:
    radial-gradient(circle at 8% 4%, rgba(255,207,92,.42), transparent 40%),
    radial-gradient(circle at 94% 10%, rgba(110,193,228,.32), transparent 42%),
    radial-gradient(circle at 50% 104%, rgba(111,203,164,.30), transparent 52%),
    radial-gradient(rgba(62,47,35,.055) 1.3px, transparent 1.4px);
  background-size:auto,auto,auto,18px 18px;
}
button{font-family:inherit;}
[hidden]{display:none !important;}
:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px;border-radius:10px;}

/* ============ 頂欄 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.5rem;
  padding:.45rem clamp(.6rem,2vw,1.6rem);
  padding-top:max(.45rem,env(safe-area-inset-top));
  background:rgba(255,246,232,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:3px solid rgba(62,47,35,.13);
}
.brand{display:flex;align-items:center;gap:.45rem;min-width:0;flex:1;}
.brand .logo{width:2.35rem;height:2.35rem;flex:none;color:var(--coral);}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:1.02rem;line-height:1.2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-txt span{display:block;font-size:.68rem;color:var(--ink-2);font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-actions{display:flex;align-items:center;gap:.4rem;flex:none;}
.icon-btn{
  width:2.85rem;height:2.85rem;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border:2.5px solid var(--ink);border-radius:14px;
  background:var(--paper);color:var(--ink);
  cursor:pointer;box-shadow:0 3px 0 rgba(62,47,35,.6);
  transition:transform .07s ease,box-shadow .07s ease,background .15s;
}
.icon-btn svg{width:1.45rem;height:1.45rem;}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(62,47,35,.6);}
.icon-btn[aria-pressed="false"]{background:#EFE3D1;color:var(--ink-3);}

/* ============ 版面 ============ */
main{width:min(1180px,100%);margin-inline:auto;padding:var(--pad);padding-bottom:max(2rem, env(safe-area-inset-bottom));}
.view{animation:viewIn .26s cubic-bezier(.2,.9,.3,1.05) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.994);}to{opacity:1;transform:none;}}

/* ============ 通用按鈕 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:3.15rem;padding:.55rem 1.25rem;
  font-size:1.02em;font-weight:800;letter-spacing:.02em;
  color:var(--ink);background:var(--paper);
  border:var(--line);border-radius:999px;
  box-shadow:0 5px 0 rgba(62,47,35,.78);
  cursor:pointer;user-select:none;touch-action:manipulation;
  transition:transform .07s ease,box-shadow .07s ease,filter .15s;
}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 rgba(62,47,35,.78);}
.btn svg{width:1.3rem;height:1.3rem;flex:none;}
.btn-coral{background:var(--coral);}
.btn-mint{background:var(--mint);}
.btn-sky{background:var(--sky);}
.btn-sun{background:var(--sun);}
.btn-berry{background:var(--berry);}
.btn-ghost{background:var(--paper);}
.btn-lg{min-height:3.7rem;font-size:1.12em;padding:.7rem 1.6rem;}
.btn-sm{min-height:2.6rem;font-size:.92em;padding:.35rem .95rem;box-shadow:0 4px 0 rgba(62,47,35,.7);}
.btn[disabled]{filter:grayscale(.35) opacity(.55);cursor:not-allowed;transform:none;}
.btn-block{width:100%;}

/* ============ 首頁 ============ */
.hero{
  display:grid;gap:clamp(1rem,2.6vw,2.2rem);
  grid-template-columns:1fr;
  align-items:center;
  padding-block:.4rem;
}
@media (min-width:900px){.hero{grid-template-columns:1.08fr .92fr;}}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.32rem .9rem;border:2.5px solid var(--ink);border-radius:999px;
  background:var(--sun);font-size:.8rem;font-weight:800;letter-spacing:.08em;
  box-shadow:0 3px 0 rgba(62,47,35,.6);
}
.hero h1{
  margin:.7rem 0 .35rem;
  font-size:clamp(2.1rem,5.4vw,3.6rem);
  line-height:1.16;letter-spacing:.01em;
}
.hero h1 em{font-style:normal;color:var(--coral);text-shadow:0 3px 0 rgba(62,47,35,.12);}
.hero-sub{font-size:clamp(1rem,1.6vw,1.22rem);color:var(--ink-2);margin:0 0 1.1rem;font-weight:700;max-width:34em;}
.hero-points{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem;}
.chip{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.3rem .8rem;border:2.5px solid var(--ink);border-radius:999px;
  background:var(--paper);font-size:.82rem;font-weight:800;
}
.chip svg{width:1rem;height:1rem;}
.hero-art{position:relative;display:flex;justify-content:center;align-items:center;}
.hero-art .scene{width:100%;max-width:26rem;height:auto;}
.bubble-float{
  position:absolute;top:2%;right:0;
  padding:.5rem .9rem;background:var(--paper);
  border:3px solid var(--ink);border-radius:18px 18px 18px 4px;
  font-size:.9rem;font-weight:800;box-shadow:0 4px 0 rgba(62,47,35,.35);
  transform:rotate(3deg);
}
@media (max-width:640px){.bubble-float{font-size:.78rem;right:-2%;}}

#versions-anchor{scroll-margin-top:6.5rem;}
.version-title{display:flex;align-items:center;gap:.6rem;margin:1.6rem 0 .8rem;font-size:1.1rem;}
.version-title .rule{flex:1;height:3px;background:repeating-linear-gradient(90deg,rgba(62,47,35,.35) 0 8px,transparent 8px 16px);border-radius:2px;}
.version-grid{display:grid;gap:clamp(.8rem,2vw,1.2rem);grid-template-columns:1fr;}
@media (min-width:720px){.version-grid{grid-template-columns:1fr 1fr;}}
.version-card{
  position:relative;display:flex;flex-direction:column;gap:.55rem;
  padding:clamp(1rem,2.2vw,1.5rem);
  border:var(--line);border-radius:var(--r-xl);
  background:var(--paper);box-shadow:var(--sh-hard);
  cursor:pointer;text-align:left;color:var(--ink);
  transition:transform .12s ease,box-shadow .12s ease;
  min-height:11rem;
}
.version-card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink);}
.version-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink);}
.version-card .badge{
  align-self:flex-start;padding:.18rem .7rem;border:2.5px solid var(--ink);
  border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.09em;
}
.version-card.jr .badge{background:var(--mint);}
.version-card.sr .badge{background:var(--sky);}
.version-card .vtitle{display:block;margin:.1rem 0 0;font-size:clamp(1.35rem,2.6vw,1.75rem);line-height:1.25;font-weight:800;}
.version-card .vdesc{display:block;margin:0;color:var(--ink-2);font-size:.95rem;font-weight:700;line-height:1.55;}
.version-card .art-row{display:flex;gap:.2rem;align-items:flex-end;margin-top:auto;padding-top:.5rem;}
.version-card .art-row svg{width:3.1rem;height:3.1rem;}
.version-card .go{
  position:absolute;right:1rem;top:1rem;
  width:2.5rem;height:2.5rem;border-radius:50%;
  display:grid;place-items:center;border:2.5px solid var(--ink);
  background:var(--sun);
}
.version-card .go svg{width:1.3rem;height:1.3rem;}

/* ============ 選單 ============ */
.menu-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap;}
.menu-head h2{margin:0;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.25;}
.menu-head .sub{color:var(--ink-2);font-size:.9rem;font-weight:700;}
@media (max-width:560px){.menu-head{display:block;}.menu-head .btn{margin-top:.55rem;}}
.menu-grid{display:grid;gap:clamp(.75rem,1.8vw,1.1rem);grid-template-columns:1fr;}
@media (min-width:640px){.menu-grid{grid-template-columns:1fr 1fr;}}
@media (min-width:1024px){.menu-grid{grid-template-columns:repeat(4,1fr);}}
.menu-card{
  display:flex;flex-direction:column;gap:.4rem;align-items:flex-start;
  padding:1.15rem 1.1rem;border:var(--line);border-radius:var(--r-lg);
  background:var(--paper);box-shadow:var(--sh-hard);
  cursor:pointer;color:var(--ink);text-align:left;min-height:10.5rem;
  transition:transform .12s ease,box-shadow .12s ease;
}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink);}
.menu-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink);}
.menu-card .mc-icon{
  width:3.2rem;height:3.2rem;border-radius:16px;border:2.5px solid var(--ink);
  display:grid;place-items:center;background:var(--sun);
}
.menu-card .mc-icon svg{width:2rem;height:2rem;}
.menu-card .mtitle{display:block;margin:.3rem 0 0;font-size:1.18rem;line-height:1.3;font-weight:800;}
.menu-card .mdesc{display:block;margin:0;font-size:.88rem;color:var(--ink-2);font-weight:700;line-height:1.45;}
.menu-card .meta{
  margin-top:auto;padding-top:.5rem;font-size:.74rem;font-weight:800;
  color:var(--ink-2);letter-spacing:.04em;display:flex;align-items:center;gap:.3rem;
}
.menu-card .stars{display:inline-flex;gap:.12rem;}
.menu-card .stars svg{width:.95rem;height:.95rem;color:#E8D9C4;}
.menu-card .stars svg.on{color:var(--sun);}

/* ============ 教學 ============ */
.teach-wrap{max-width:60rem;margin-inline:auto;}
.teach-progress{display:flex;align-items:center;gap:.35rem;justify-content:center;margin-bottom:.9rem;flex-wrap:wrap;}
.dot{
  width:.72rem;height:.72rem;border-radius:50%;
  border:2.5px solid var(--ink);background:var(--paper);
  transition:background .2s,transform .2s;
}
.dot.on{background:var(--coral);transform:scale(1.25);}
.teach-card{
  background:var(--paper);border:var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-hard);padding:clamp(1rem,3vw,2.1rem);
  display:grid;gap:clamp(.8rem,2.4vw,1.8rem);grid-template-columns:1fr;
}
@media (min-width:820px){.teach-card.has-art{grid-template-columns:.82fr 1.18fr;align-items:center;}}
.teach-art{display:grid;place-items:center;position:relative;}
.teach-art svg{width:100%;max-width:19rem;height:auto;}
.teach-body{min-width:0;}
.teach-step-tag{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.76rem;font-weight:800;letter-spacing:.12em;color:var(--coral-d);
  text-transform:uppercase;
}
.teach-body h2{
  margin:.25rem 0 .6rem;
  font-size:clamp(1.5rem,3.6vw,2.15rem);line-height:1.3;
}
.teach-body p{margin:0 0 .8rem;font-size:clamp(1.04rem,1.55vw,1.2rem);line-height:1.75;color:var(--ink);}
.teach-body p.soft{color:var(--ink-2);font-size:clamp(.95rem,1.35vw,1.05rem);}
.teach-list{list-style:none;margin:0;padding:0;display:grid;gap:.55rem;}
.teach-list li{
  display:flex;gap:.6rem;align-items:flex-start;
  padding:.62rem .8rem;border:2.5px solid rgba(62,47,35,.22);
  border-radius:var(--r-md);background:rgba(255,207,92,.16);
  font-size:clamp(1rem,1.45vw,1.12rem);line-height:1.6;
}
.teach-list li .num{
  flex:none;width:1.75rem;height:1.75rem;border-radius:50%;
  background:var(--sun);border:2.5px solid var(--ink);
  display:grid;place-items:center;font-size:.85rem;font-weight:800;
}
.teach-list li b{color:var(--coral-d);}
.teach-nav{display:flex;gap:.6rem;justify-content:space-between;align-items:center;margin-top:1rem;flex-wrap:wrap;}
.teach-nav .mid{font-size:.85rem;color:var(--ink-2);font-weight:800;}

/* 句式對照 */
.cmp{display:grid;gap:.6rem;margin:.2rem 0 .4rem;}
.cmp-row{
  display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;
  padding:.6rem .75rem;border:2.5px solid var(--ink);border-radius:var(--r-md);
  background:#FFF;
}
.cmp-row .tag{
  font-size:.72rem;font-weight:800;padding:.2rem .5rem;border-radius:999px;
  border:2px solid var(--ink);white-space:nowrap;
}
.cmp-row.direct .tag{background:var(--mint);}
.cmp-row.indirect .tag{background:var(--sky);}
.cmp-row .txt{font-size:clamp(.95rem,1.5vw,1.1rem);line-height:1.55;}
.cmp-row .txt mark{background:rgba(255,207,92,.75);border-radius:4px;padding:0 .1em;color:inherit;}

/* ============ 遊戲共用 ============ */
.game-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap;}
.game-top h2{margin:0;font-size:clamp(1.2rem,2.6vw,1.6rem);line-height:1.25;}
.game-top .sub{font-size:.8rem;color:var(--ink-2);font-weight:800;}
.progress{
  flex:1;min-width:8rem;height:.85rem;border:2.5px solid var(--ink);
  border-radius:999px;background:var(--paper);overflow:hidden;
}
.progress > i{display:block;height:100%;width:0%;background:var(--mint);transition:width .35s ease;}
.pips{display:flex;gap:.25rem;flex-wrap:wrap;}
.pips span{
  width:.85rem;height:.85rem;border-radius:50%;
  border:2.5px solid var(--ink);background:var(--paper);flex:none;
}
.pips span.ok{background:var(--mint);}
.pips span.miss{background:var(--coral);}

.panel{
  background:var(--paper);border:var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-hard);padding:clamp(1rem,2.6vw,1.9rem);
}
.q-label{display:flex;align-items:center;gap:.45rem;font-size:.86rem;font-weight:800;color:var(--ink-2);letter-spacing:.1em;margin-bottom:.6rem;}
.q-label b{color:var(--coral-d);}

/* 句子卡 */
.sentence-card{
  position:relative;
  border:3px solid var(--ink);border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFFFFF,#FFF8EA);
  padding:clamp(1rem,2.6vw,1.7rem);
  font-size:clamp(1.28rem,2.9vw,1.95rem);
  line-height:1.65;font-weight:800;letter-spacing:.02em;
  box-shadow:inset 0 -5px 0 rgba(62,47,35,.06);
}
.sentence-card .mark{color:var(--coral-d);}
.speaker-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.speaker-row svg{width:3.2rem;height:3.2rem;flex:none;}
.speaker-row .who{font-size:.85rem;font-weight:800;color:var(--ink-2);}
.speaker-row .who b{color:var(--ink);font-size:1rem;}

/* 選項 */
.options{display:grid;gap:.65rem;grid-template-columns:1fr;}
@media (min-width:560px){.options.two{grid-template-columns:1fr 1fr;}}
.opt{
  display:flex;align-items:center;gap:.7rem;
  width:100%;min-height:3.6rem;padding:.7rem 1rem;
  font-size:clamp(1rem,2vw,1.16rem);font-weight:800;
  text-align:left;color:var(--ink);
  border:3px solid var(--ink);border-radius:var(--r-md);
  background:#fff;box-shadow:0 5px 0 rgba(62,47,35,.72);
  cursor:pointer;touch-action:manipulation;
  transition:transform .07s,box-shadow .07s,background .15s;
}
.opt:active{transform:translateY(5px);box-shadow:0 0 0 rgba(62,47,35,.72);}
.opt .key{
  flex:none;width:2rem;height:2rem;border-radius:9px;border:2.5px solid var(--ink);
  display:grid;place-items:center;font-size:.9rem;background:rgba(255,207,92,.5);
}
.opt .txt{flex:1;min-width:0;}
.opt .ic{flex:none;width:1.6rem;height:1.6rem;display:none;}
.opt.is-ok{background:rgba(111,203,164,.35);}
.opt.is-ok .ic{display:block;color:var(--ok);}
.opt.is-no{background:rgba(255,138,91,.28);}
.opt.is-no .ic{display:block;color:var(--no);}
.opt[disabled]{cursor:default;}
.opt.dim{opacity:.5;}

/* 分類兩大按鈕 */
.sort-choices{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.2rem;}
.sort-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
  min-height:6.2rem;padding:.7rem .4rem;
  border:3px solid var(--ink);border-radius:var(--r-lg);
  font-size:clamp(1.05rem,2.4vw,1.3rem);font-weight:800;color:var(--ink);
  box-shadow:0 6px 0 rgba(62,47,35,.75);cursor:pointer;
  touch-action:manipulation;transition:transform .07s,box-shadow .07s,filter .15s;
}
.sort-btn:active{transform:translateY(6px);box-shadow:0 0 0 rgba(62,47,35,.75);}
.sort-btn .ico{width:2.5rem;height:2.5rem;}
.sort-btn.d{background:linear-gradient(180deg,#9FE0C2,#6FCBA4);}
.sort-btn.i{background:linear-gradient(180deg,#A9DCF0,#6EC1E4);}
.sort-btn small{font-size:.72rem;font-weight:700;color:var(--ink-2);}
.sort-btn.picked{outline:5px solid var(--sun);outline-offset:3px;}
.sort-btn[disabled]{cursor:default;}
.sort-btn.dim{opacity:.5;}
.sort-btn.right{outline:5px solid var(--ok);outline-offset:3px;}
.sort-btn.wrong{outline:5px solid var(--no);outline-offset:3px;}

/* 步驟（變身魔法） */
.steps{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem;}
.step-pill{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.28rem .7rem;border:2.5px solid var(--ink);border-radius:999px;
  font-size:.78rem;font-weight:800;background:var(--paper);color:var(--ink-3);
}
.step-pill.done{background:var(--mint);color:var(--ink);}
.step-pill.now{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 rgba(62,47,35,.6);}
.step-box{
  border:3px dashed rgba(62,47,35,.35);border-radius:var(--r-lg);
  padding:clamp(.85rem,2.2vw,1.3rem);background:rgba(255,207,92,.10);
}
.step-box h4{margin:0 0 .2rem;font-size:.86rem;letter-spacing:.12em;color:var(--coral-d);font-weight:800;}
.step-box .q{font-size:clamp(1.02rem,2vw,1.2rem);font-weight:800;margin:0 0 .7rem;line-height:1.5;}

/* 捉錯 chips */
.chips{display:flex;flex-wrap:wrap;gap:.15rem .28rem;align-items:center;line-height:1.7;}
.chip-tok{
  display:inline-flex;align-items:center;justify-content:center;
  padding:.24rem .45rem;border-radius:10px;
  border:3px solid transparent;border-bottom:3px dashed rgba(62,47,35,.28);background:transparent;
  font-size:clamp(1.22rem,2.7vw,1.75rem);font-weight:800;
  cursor:pointer;touch-action:manipulation;color:var(--ink);
  transition:background .15s,border-color .15s,transform .1s;
}
.chip-tok:hover{background:rgba(255,207,92,.5);border-bottom-color:var(--ink);}
button.chip-tok{min-height:2.6rem;}
.chip-tok:active{transform:scale(.97);}
.chip-tok.guess{background:rgba(255,138,91,.35);border-color:var(--coral-d);}
.chip-tok.hit{background:rgba(111,203,164,.45);border-color:var(--ok);}
.chip-tok.nope{background:rgba(62,47,35,.10);border-style:dashed;border-color:var(--ink-3);}
.chips-static .chip-tok{cursor:default;border-color:transparent;background:transparent;padding:.05rem 0;}
.chips-static .chip-tok:hover{background:transparent;}

/* 回饋 */
.feedback{
  margin-top:.85rem;border:3px solid var(--ink);border-radius:var(--r-lg);
  background:#fff;padding:clamp(.8rem,2.2vw,1.2rem);
  animation:popIn .28s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.feedback.good{background:rgba(111,203,164,.16);}
.feedback.bad{background:rgba(255,138,91,.14);}
.fb-head{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:800;margin-bottom:.4rem;}
.fb-head svg{width:1.7rem;height:1.7rem;flex:none;}
.fb-head.good{color:var(--ok);}
.fb-head.bad{color:var(--no);}
.explain{display:grid;gap:.45rem;margin-top:.2rem;}
.explain .row{
  display:grid;grid-template-columns:4.6rem 1fr;gap:.5rem;align-items:start;
  padding:.42rem .55rem;border-radius:var(--r-sm);
  background:rgba(62,47,35,.045);
}
.explain .k{
  font-size:.78rem;font-weight:800;letter-spacing:.04em;
  color:var(--ink-2);padding-top:.15rem;
}
.explain .v{font-size:clamp(.96rem,1.5vw,1.08rem);font-weight:700;line-height:1.55;min-width:0;}
.explain .v b{color:var(--coral-d);}
.answer-line{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  margin-top:.6rem;padding:.55rem .7rem;border-radius:var(--r-md);
  border:2.5px solid var(--ok);background:rgba(111,203,164,.14);
  font-size:clamp(1rem,2vw,1.15rem);font-weight:800;line-height:1.5;
}
.answer-line svg{width:1.4rem;height:1.4rem;color:var(--ok);flex:none;}
.fb-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem;flex-wrap:wrap;}
.hint{
  margin-top:.6rem;font-size:.95rem;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;gap:.4rem;
}
.hint svg{width:1.2rem;height:1.2rem;flex:none;}
.scene-line{display:flex;align-items:flex-start;gap:.4rem;margin:0 0 .55rem;padding:.45rem .6rem;border-radius:var(--r-sm);background:rgba(255,207,92,.18);font-size:.9rem;font-weight:700;color:var(--ink-2);line-height:1.5;}
.scene-line svg{width:1.15rem;height:1.15rem;flex:none;margin-top:.05rem;color:var(--coral-d);}

/* 結算 */
.result-wrap{max-width:44rem;margin-inline:auto;text-align:center;}
.result-wrap .medal{width:9rem;height:9rem;margin-inline:auto;display:block;}
.result-wrap h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:.5rem 0 .2rem;line-height:1.25;}
.result-wrap .score-line{font-size:clamp(1.05rem,2.4vw,1.3rem);font-weight:800;color:var(--ink-2);margin:0 0 .8rem;}
.star-row{display:flex;justify-content:center;gap:.35rem;margin:.3rem 0 1rem;}
.star-row svg{width:clamp(2rem,6vw,3rem);height:clamp(2rem,6vw,3rem);color:#E3D3BE;}
.star-row svg.on{color:var(--sun);animation:starPop .4s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes starPop{from{transform:scale(.3) rotate(-25deg);opacity:0;}to{transform:none;opacity:1;}}
.result-list{
  text-align:left;display:grid;gap:.45rem;margin:1rem 0 1.2rem;
  max-height:14rem;overflow:auto;padding-right:.2rem;
}
.result-item{
  display:grid;grid-template-columns:1.6rem 1fr;gap:.55rem;align-items:start;
  padding:.5rem .65rem;border-radius:var(--r-sm);
  border:2.5px solid rgba(62,47,35,.16);background:rgba(255,255,255,.7);
  font-size:.96rem;font-weight:700;line-height:1.5;
}
.result-item svg{width:1.5rem;height:1.5rem;color:var(--ink-3);}
.result-item.ok svg{color:var(--ok);}
.result-item.no svg{color:var(--no);}
.result-actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;}

/* 小工具 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1);}
@keyframes pop{0%{transform:scale(.96);}60%{transform:scale(1.015);}100%{transform:scale(1);}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
.spark{position:absolute;width:.55rem;height:.55rem;border-radius:50%;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0;}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
@media (min-width:1100px){
  .sentence-card{font-size:2rem;}
}
@media (max-width:420px){
  .explain .row{grid-template-columns:1fr;gap:.1rem;}
  .explain .k{font-size:.68rem;}
  .sort-btn{min-height:5.6rem;}
}

/* 教學插畫容器 */
.teach-art > svg{width:100%;max-width:19rem;height:auto;display:block;}
.teach-art .ico-wrap{
  width:min(15rem,74%);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFF3D2,#FFE3A8);
  border:3px dashed rgba(62,47,35,.28);
}
.teach-art .ico-wrap svg{width:48%;height:48%;color:var(--coral-d);}
.result-wrap .panel{margin-top:.2rem;}
</style>

/* ============================================================
   3. 音效（Web Audio 合成，無外部檔案）
   ============================================================ */
const Sound = (function () {
  let ctx = null;
  let broken = false;

  function ensure() {
    if (broken) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { broken = true; return null; }
        ctx = new AC();
      }
      if (ctx.state === 'suspended') { ctx.resume().catch(function () {}); }
      return ctx;
    } catch (e) {
      broken = true;
      return null;
    }
  }

  function note(freq, startAt, dur, type, vol) {
    const c = ensure();
    if (!c) return;
    try {
      const t0 = c.currentTime + startAt;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* 忽略單次發聲失敗 */ }
  }

  return {
    unlock: function () { ensure(); },
    play: function (name) {
      if (!S.sound) return;
      if (!ensure()) return;
      switch (name) {
        case 'tap':
          note(720, 0, 0.06, 'square', 0.05);
          break;
        case 'pop':
          note(880, 0, 0.08, 'sine', 0.12);
          note(1174, 0.05, 0.09, 'sine', 0.07);
          break;
        case 'good':
          note(523.25, 0, 0.12, 'sine', 0.14);
          note(659.25, 0.09, 0.12, 'sine', 0.14);
          note(783.99, 0.18, 0.18, 'sine', 0.13);
          break;
        case 'bad':
          note(233.08, 0, 0.13, 'triangle', 0.13);
          note(185.00, 0.11, 0.18, 'triangle', 0.12);
          break;
        case 'win':
          note(523.25, 0, 0.13, 'sine', 0.13);
          note(659.25, 0.11, 0.13, 'sine', 0.13);
          note(783.99, 0.22, 0.13, 'sine', 0.13);
          note(1046.5, 0.33, 0.28, 'sine', 0.12);
          break;
        default:
          break;
      }
    }
  };
})();

/* ============================================================
   4. 粵語朗讀（SpeechSynthesis，失敗即靜默降級）
   ============================================================ */
let voiceCache = null;

function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  let voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { return null; }
  if (!voices.length) return null;
  let v = voices.find(function (x) { return /zh[-_]HK/i.test(x.lang) || /yue/i.test(x.lang); });
  if (!v) v = voices.find(function (x) { return /zh[-_]TW/i.test(x.lang); });
  if (!v) v = voices.find(function (x) { return /^zh/i.test(x.lang); });
  return v || null;
}

function stopSpeak() {
  if (!('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
}

function speak(text) {
  if (!S.sound) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const clean = String(text).replace(/[「」『』]/g, '').replace(/：/g, '，').replace(/／/g, '或');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'zh-HK';
    u.rate = 0.86;
    u.pitch = 1.03;
    if (!voiceCache) voiceCache = pickVoice();
    if (voiceCache) u.voice = voiceCache;
    u.onerror = function () { /* 沒有可用語音時靜默，不影響遊戲 */ };
    window.speechSynthesis.speak(u);
  } catch (e) { /* 忽略 */ }
}

function speakButton(text) {
  return '<button class="icon-btn" type="button" data-action="speak" data-text="' + esc(text) + '" aria-label="朗讀句子" title="朗讀句子" style="width:2.55rem;height:2.55rem;box-shadow:0 3px 0 rgba(62,47,35,.5)">' +
    icon('i-speak') + '</button>';
}

function loadBest() {
  try {

    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) { return {}; }
}
function saveBest() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.best)); } catch (e) { /* 私隱模式時忽略 */ }
}
function loadSound() {
  try {
    const v = localStorage.getItem(SOUND_KEY);
    if (v === '0') return false;
  } catch (e) { /* 忽略 */ }
  return true;
}
function saveSound() {
  try { localStorage.setItem(SOUND_KEY, S.sound ? '1' : '0'); } catch (e) { /* 忽略 */ }
}

function startMode(mode) {
  clearTimers();
  stopSpeak();
  S.mode = mode;
  S.index = 0;
  S.marks = [];
  initRun();
  show('game');
  renderGame();
}

function initRun() {
  if (S.mode === 'sort') {
    S.run = { answered: false, correct: false, chosen: null };
  } else if (S.mode === 'shift') {
    S.run = { step: 0, done: [], mistakes: 0, finished: false, flash: null, chosen: null };
  } else {
    S.run = { phase: 'find', guess: -1, nope: [], correct: false };
  }
}

function gameHeader(title, sub) {
  let pips = '';
  for (let i = 0; i < TOTAL; i++) {
    let cls = '';
    if (i < S.index) cls = S.marks[i] ? 'ok' : 'miss';
    else if (i === S.index) cls = '';
    pips += '<span class="' + cls + '"></span>';
  }
  return '<div class="game-top">' +
    '<button class="btn btn-sm btn-ghost" type="button" data-action="menu">' + icon('i-back') + '選單</button>' +
    '<div style="min-width:0">' +

    '</div>' +
    '<div class="pips" aria-hidden="true">' + pips + '</div>' +

}

function nextLabel() {

}

/* ---------- 10.1 句子分類機 ---------- */
function sortView() {
  const q = DB[S.version].sort[S.index];
  let head = gameHeader(MODES.sort.name, '第 ' + (S.index + 1) + ' 題，共 ' + TOTAL + ' 題');
  let html = '<div class="panel">' +
    '<div class="q-label">這是哪一種句子？</div>' +
    '<div class="speaker-row">' + fig(q.speaker) +
      '<span class="who">說話人：<b>' + esc(q.who) + '</b></span>' +
      speakButton(q.sentence) +
    '</div>' +
    '<div class="sentence-card">' + esc(q.sentence) + '</div>' +
    '<div class="sort-choices">' +
      sortChoice('direct', 'd', 'i-bubble', '直述句', '原原本本說出來') +
      sortChoice('indirect', 'i', 'i-arrow', '轉述句', '轉告給別人') +
    '</div>';

  if (S.run.answered) {
    const ok = S.run.correct;
    const right = q.type;
    html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '">' +
      '<div class="fb-head ' + (ok ? 'good' : 'bad') + '">' +
        icon(ok ? 'i-check' : 'i-cross') +
        (ok ? '答對了！' : '差一點，這是「' + (right === 'direct' ? '直述句' : '轉述句') + '」。') +
      '</div>' +
      explainBlock([
        { k: '判斷線索', v: q.clue },
        { k: '為甚麼', v: q.why }
      ]) +
      '<div class="fb-actions">' +
        '<button class="btn btn-mint" type="button" data-action="next">' + nextLabel() + '</button>' +
      '</div>' +
    '</div>';
  }
  html += '</div>';
  return head + html;
}

function sortChoice(type, tone, ic, label, sub) {
  const q = DB[S.version].sort[S.index];
  let cls = 'sort-btn ' + tone;
  let lock = '';
  if (S.run.answered) {
    lock = ' disabled';
    if (type === q.type) cls += ' right';
    else if (type === S.run.chosen) cls += ' wrong';
    else cls += ' dim';
  }
  return '<button class="' + cls + '" type="button" data-action="sort" data-type="' + type + '"' + lock + '>' +
    icon(ic, 'ico') + label + '<small>' + sub + '</small>' +
  '</button>';
}

function answerSort(type) {
  if (!S.run || S.run.answered) return;
  const q = DB[S.version].sort[S.index];
  const ok = type === q.type;
  S.run.answered = true;
  S.run.correct = ok;
  S.run.chosen = type;
  S.marks[S.index] = ok;
  if (ok) {
    Sound.play('good');
    speak(q.sentence);
    announce('答對了。' + q.clue);
  } else {
    Sound.play('bad');
    announce('答錯了。正確答案：' + (q.type === 'direct' ? '直述句' : '轉述句'));
  }
  renderGame();
}

  const q = DB[S.version].shift[S.index];
  let head = gameHeader(MODES.shift.name, '第 ' + (S.index + 1) + ' 題，共 ' + TOTAL + ' 題');
  let html = '<div class="panel">';

  if (S.run.finished) {
    html += '<div class="q-label">變身完成</div>' +
      '<div class="speaker-row">' + fig(q.speaker) +
        '<span class="who">說話人：<b>' + esc(q.who) + '</b></span>' +
        speakButton(q.answer) +
      '</div>' +
      '<div class="feedback good" style="margin-top:0">' +
        '<div class="fb-head good">' + icon('i-check') + '句子變身成功！</div>' +
        '<div class="answer-line">' + icon('i-check') + '<span>' + esc(q.answer) + '</span></div>' +
        '<div style="margin-top:.7rem">' + explainBlock([
          { k: '原本是甚麼', v: q.explain.v1 },
          { k: '為甚麼要改', v: q.explain.v2 },
          { k: '改成甚麼', v: q.explain.v3 }
        ]) + '</div>' +
        '<div class="fb-actions">' +
          '<button class="btn btn-mint" type="button" data-action="next">' + nextLabel() + '</button>' +
        '</div>' +
      '</div>';
    html += '</div>';
    return head + html;
  }

  const step = q.steps[S.run.step];
  let pills = '';
  q.steps.forEach(function (s, k) {
    let cls = 'step-pill';
    if (k < S.run.step) cls += ' done';
    else if (k === S.run.step) cls += ' now';
    pills += '<span class="' + cls + '">' + (k < S.run.step ? '✓ ' : (k + 1) + '. ') + esc(s.tag) + '</span>';
  });

  let opts = '';
  step.options.forEach(function (o, k) {
    const disabled = S.run.flash && S.run.flash.ok;
    let cls = 'opt';
    if (disabled) cls += (k === step.answer ? ' is-ok' : ' dim');
    else if (S.run.flash && !S.run.flash.ok && k === S.run.chosen) cls += ' is-no';
    opts += '<button class="' + cls + '" type="button" data-action="shift-opt" data-i="' + k + '"' +
      (disabled ? ' disabled' : '') + '>' +
      '<span class="key">' + 'ABC'.charAt(k) + '</span>' +
      '<span class="txt">' + esc(o) + '</span>' +
      icon('i-check', 'ic') +
    '</button>';
  });

  html += '<div class="q-label">把直述句變成轉述句</div>' +
    '<div class="speaker-row">' + fig(q.speaker) +
      '<span class="who">' + esc(q.who) + '說：</span>' +
      speakButton(q.original) +
    '</div>' +
    '<div class="sentence-card">' + esc(q.original) + '</div>' +
    '<div class="steps" style="margin-top:.9rem">' + pills + '</div>' +
    '<div class="step-box">' +
      '<h4>第 ' + (S.run.step + 1) + ' 步 · ' + esc(step.tag) + '</h4>' +
      '<p class="q">' + esc(step.q) + '</p>' +
      '<div class="options two">' + opts + '</div>' +
    '</div>';

  if (S.run.flash) {
    html += '<div class="feedback ' + (S.run.flash.ok ? 'good' : 'bad') + '">' +
      '<div class="fb-head ' + (S.run.flash.ok ? 'good' : 'bad') + '">' +
        icon(S.run.flash.ok ? 'i-check' : 'i-cross') + esc(S.run.flash.title) +
      '</div>' +
      '<div style="font-size:.95rem;font-weight:700;line-height:1.55">' + esc(S.run.flash.text) + '</div>' +
    '</div>';
  }

  html += '</div>';
  return head + html;
}

function answerShift(idx) {
  if (!S.run || S.run.finished) return;
  if (S.run.flash && S.run.flash.ok) return;
  const q = DB[S.version].shift[S.index];
  const step = q.steps[S.run.step];
  const correct = idx === step.answer;

  if (!correct) {
    S.run.mistakes += 1;
    S.run.chosen = idx;
    S.run.flash = { ok: false, title: '再想一想', text: step.note };
    Sound.play('bad');
    announce('再想一想。' + step.note);
    renderGame();
    return;
  }

  S.run.done.push(S.run.step);
  S.run.chosen = idx;
  S.run.flash = { ok: true, title: '正確！', text: step.note };
  announce('正確。' + step.note);
  Sound.play('good');
  renderGame();

  stepTimer = setTimeout(function () {
    if (!S.run || S.run.finished) return;
    S.run.step += 1;
    S.run.flash = null;
    S.run.chosen = null;
    if (S.run.step >= q.steps.length) {
      S.run.finished = true;
      S.marks[S.index] = S.run.mistakes === 0;
      Sound.play('win');
      speak(q.answer);
      announce('完成。答案是：' + q.answer);
    }
    renderGame();
  }, 1700);
}

/* ---------- 10.3 捉錯小偵探 ---------- */
function detectView() {
  const q = DB[S.version].detect[S.index];
  let head = gameHeader(MODES.detect.name, '第 ' + (S.index + 1) + ' 題，共 ' + TOTAL + ' 題');
  let html = '<div class="panel">';
  const done = S.run.phase === 'done';

  html += '<div class="q-label">' + (done ? '找到錯處了' : '句子裡有一個錯處') + '</div>';

  if (q.scene) {
    html += '<div class="scene-line">' + icon('i-bulb') + '<span>情境：' + esc(q.scene) + '</span></div>';
  }
  html += '<div class="hint" style="margin:0 0 .6rem">' +
    icon('i-search') +
    '<span>原句：' + esc(q.original) + '</span>' +
    '</div>';

  let chips = '';
  q.tokens.forEach(function (t, k) {
    let cls = 'chip-tok';
    if (done) { if (k === q.bad) cls += ' hit'; }
    else if (S.run.phase === 'fix' && k === q.bad) cls += ' hit';
    else if (S.run.nope.indexOf(k) >= 0) cls += ' nope';
    if (done || S.run.phase === 'fix') {
      chips += '<span class="' + cls + '">' + esc(t) + '</span>';
    } else {
      chips += '<button class="' + cls + '" type="button" data-action="tok" data-i="' + k + '">' + esc(t) + '</button>';
    }
  });

  html += '<div class="sentence-card"><div class="chips">' + chips + '</div></div>';

  if (S.run.phase === 'find') {
    html += '<div class="hint">' + icon('i-bulb') +
      '<span>點一下你認為出錯的部分。</span></div>';
    if (S.run.nope.length) {
      html += '<div class="feedback bad" style="margin-top:.7rem">' +
        '<div class="fb-head bad">' + icon('i-cross') + '不是這裡，再找找。</div>' +
        '<div style="font-size:.92rem;font-weight:700">提示：留意句中的「我、你、這、今天」，以及冒號和引號。</div>' +
      '</div>';
    }
  }

  if (S.run.phase === 'fix') {
    let opts = '';
    q.options.forEach(function (o, k) {
      opts += '<button class="opt" type="button" data-action="detect-opt" data-i="' + k + '">' +
        '<span class="key">' + 'ABC'.charAt(k) + '</span>' +
        '<span class="txt">' + esc(o) + '</span>' +
        icon('i-check', 'ic') +
      '</button>';
    });
    html += '<div class="step-box" style="margin-top:.8rem">' +
      '<h4>找到了</h4>' +
      '<p class="q">「' + esc(q.tokens[q.bad]) + '」應該改成甚麼？</p>' +
      '<div class="options">' + opts + '</div>' +
    '</div>';
  }

  if (S.run.phase === 'done') {
    html += '<div class="feedback ' + (S.run.correct ? 'good' : 'bad') + '">' +
      '<div class="fb-head ' + (S.run.correct ? 'good' : 'bad') + '">' +
        icon(S.run.correct ? 'i-check' : 'i-bulb') +
        (S.run.correct ? '捉到了！' : '差一點，正確答案是「' + q.options[q.answer] + '」。') +
      '</div>' +
      '<div class="answer-line">' + icon('i-check') + '<span>' + esc(q.correct) + '</span></div>' +
      '<div style="margin-top:.6rem">' + explainBlock([
        { k: '原本是甚麼', v: q.explain.v1 },
        { k: '為甚麼要改', v: q.explain.v2 },
        { k: '改成甚麼', v: q.explain.v3 }
      ]) + '</div>' +
      '<div class="fb-actions">' +
        '<button class="btn btn-mint" type="button" data-action="next">' + nextLabel() + '</button>' +
      '</div>' +
    '</div>';
  }

  html += '</div>';
  return head + html;
}

function pickToken(i) {
  if (!S.run || S.run.phase !== 'find') return;
  const q = DB[S.version].detect[S.index];
  if (i === q.bad) {
    S.run.phase = 'fix';
    Sound.play('pop');
    announce('找到了，請選擇正確的改法。');
  } else {
    if (S.run.nope.indexOf(i) < 0) S.run.nope.push(i);
    Sound.play('bad');
    announce('不是這裡，再找找。');
  }
  renderGame();
}

function answerDetect(i) {
  if (!S.run || S.run.phase !== 'fix') return;
  const q = DB[S.version].detect[S.index];
  const ok = i === q.answer;
  S.run.phase = 'done';
  S.run.correct = ok;
  S.marks[S.index] = ok;
  if (ok) {
    Sound.play('good');
    speak(q.correct);
    announce('正確。' + q.explain.v2);
  } else {
    Sound.play('bad');
    announce('差一點。正確答案是「' + q.options[q.answer] + '」。' + q.explain.v2);
  }
  renderGame();
}

/* ---------- 10.4 下一題 / 結算 ---------- */
function nextQuestion() {
  clearTimers();
  stopSpeak();
  if (S.index + 1 >= TOTAL) {
    finishMode();
    return;
  }
  S.index += 1;
  initRun();
  renderGame();
  window.scrollTo(0, 0);
}

function finishMode() {
  clearTimers();
  const stars = S.marks.filter(Boolean).length;
  const key = S.version + '-' + S.mode;
  if (!S.best[key] || stars > S.best[key]) {
    S.best[key] = stars;
    saveBest();
  }
  Sound.play(stars >= 4 ? 'win' : 'pop');
  show('result');
  renderResult(stars);
  announce('獲得 ' + stars + ' 顆星，共 ' + TOTAL + ' 題。');
}

function renderResult(stars) {
  const host = $id('view-result');
  const v = DB[S.version];
  const mode = MODES[S.mode];
  const list = v[S.mode];
  const pct = Math.round((stars / TOTAL) * 100);

  let title = '再試一次吧！';
  let sub = '慢慢來，先回教學專區再看一次。';
  if (stars >= 6) { title = '全部答對，太厲害了！'; sub = '你已經完全掌握這個模式了。'; }
  else if (stars >= 4) { title = '做得很好！'; sub = '只差一點點就滿分了。'; }
  else if (stars >= 2) { title = '繼續努力！'; sub = '錯的地方看一看說明，再玩一次。'; }

  let items = '';
  list.forEach(function (q, i) {
    const ok = !!S.marks[i];
    let txt = '';
    if (S.mode === 'sort') txt = q.sentence + '（' + (q.type === 'direct' ? '直述句' : '轉述句') + '）';
    else if (S.mode === 'shift') txt = q.original + ' → ' + q.answer;
    else txt = q.wrong + ' → ' + q.correct;
    items += '<div class="result-item ' + (ok ? 'ok' : 'no') + '">' +
      icon(ok ? 'i-check' : 'i-cross') +
      '<span>' + esc(txt) + '</span>' +
    '</div>';
  });

  host.innerHTML =
    '<div class="result-wrap">' +
      '<svg class="medal" viewBox="0 0 120 120" role="img" aria-label="獎牌"><use href="#i-medal"/></svg>' +
      '<h2>' + esc(title) + '</h2>' +
      '<p class="score-line">' + esc(mode.name) + ' · ' + esc(v.label) + '</p>' +
      '<div class="star-row" aria-label="獲得 ' + stars + ' 顆星，滿分 6 顆">' + starRow(stars, TOTAL) + '</div>' +
      '<p class="score-line">首答答對 <b style="color:var(--coral-d)">' + stars + '</b> / ' + TOTAL + ' 題　·　正確率 ' + pct + '%</p>' +
      '<div class="panel" style="text-align:left">' +
        '<div class="q-label">逐題回顧</div>' +
        '<div class="result-list">' + items + '</div>' +
      '</div>' +
      '<div class="result-actions" style="margin-top:1.1rem">' +
        '<button class="btn btn-coral" type="button" data-action="retry">' + icon('i-refresh') + '再玩一次</button>' +
        '<button class="btn btn-mint" type="button" data-action="menu">' + icon('i-game') + '其他模式</button>' +
      '</div>' +
    '</div>';
}

/* ============================================================
   11. 事件
   ============================================================ */
function route(action, node) {
  switch (action) {
    case 'version': {
      const key = node.getAttribute('data-version');
      if (!DB[key]) return;
      S.version = key;
      S.teachIndex = 0;
      renderMenu();
      show('menu');
      break;
    }
    case 'home':
      clearTimers();
      stopSpeak();
      S.version = null;
      show('home');
      break;
    case 'to-versions': {
      const a = $id('versions-anchor');
      if (a) a.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'teach':
      if (!S.version) return;
      S.teachIndex = 0;
      renderTeach();
      show('teach');
      break;
    case 'teach-prev':
      S.teachIndex = Math.max(0, S.teachIndex - 1);
      renderTeach();
      break;
    case 'teach-next':
      S.teachIndex = Math.min(DB[S.version].teach.length - 1, S.teachIndex + 1);
      renderTeach();
      break;
    case 'teach-finish':
      renderMenu();
      show('menu');
      break;
    case 'mode':
      if (!S.version) return;
      startMode(node.getAttribute('data-mode'));
      break;
    case 'menu':
      clearTimers();
      stopSpeak();
      if (S.version) renderMenu();
      show(S.version ? 'menu' : 'home');
      break;
    case 'sort':
      answerSort(node.getAttribute('data-type'));
      break;
    case 'shift-opt':
      answerShift(Number(node.getAttribute('data-i')));
      break;
    case 'tok':
      pickToken(Number(node.getAttribute('data-i')));
      break;
    case 'detect-opt':
      answerDetect(Number(node.getAttribute('data-i')));
      break;
    case 'next':
      nextQuestion();
      break;
    case 'retry':
      startMode(S.mode);
      break;
    case 'speak':
      speak(node.getAttribute('data-text') || '');
      break;
    default:
      break;
  }
}

function bindEvents() {
  const stage = $id('stage');
  stage.addEventListener('click', function (e) {
    const node = e.target.closest('[data-action]');
    if (!node) return;
    if (node.disabled) return;
    const action = node.getAttribute('data-action');
    if (action !== 'speak') Sound.play('tap');
    route(action, node);
  });

  const soundBtn = $id('btnSound');
  soundBtn.addEventListener('click', function () {
    S.sound = !S.sound;
    saveSound();
    updateSoundBtn();
    if (S.sound) {
      Sound.unlock();
      Sound.play('pop');
    } else if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    }
  });

  $id('btnHome').addEventListener('click', function () {
    clearTimers();
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    }
    S.version = null;
    renderHome();
    show('home');
  });

  document.addEventListener('pointerdown', function once() {
    Sound.unlock();
    document.removeEventListener('pointerdown', once);
  }, { once: true });

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        voiceCache = pickVoice();
      });
    } catch (e) { /* 忽略 */ }
  }
}

function updateSoundBtn() {
  const b = $id('btnSound');
  if (!b) return;
  b.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  b.innerHTML = icon(S.sound ? 'i-sound-on' : 'i-sound-off');
  b.setAttribute('aria-label', S.sound ? '音效已開啟，點擊關閉' : '音效已關閉，點擊開啟');
}

/* ============================================================
   12. 啟動
   ============================================================ */
function init() {
  S.sound = loadSound();
  S.best = loadBest();
  updateSoundBtn();
  renderHome();
  bindEvents();
  show('home');
  const live = document.createElement('div');
  live.id = 'live-region';
  live.className = 'sr-only';
  live.setAttribute('aria-live', 'polite');
  document.body.appendChild(live);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
