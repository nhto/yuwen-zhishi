<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>複句遊樂園｜小學複句句式互動遊戲</title>
<meta name="description" content="初小版與高小版各八類複句、共三十二個關卡。高小版答題時隱藏關聯詞，答對後才揭曉本題實際使用的關聯詞。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#3A2E2A;
  --cream:#FFF4DF;
  --paper:#FFFCF4;
  --coral:#FF8A5B;
  --coral-soft:#FFE3D3;
  --sky:#63BDF6;
  --sky-soft:#DEF2FF;
  --mint:#5FD39A;
  --mint-soft:#DDF7E9;
  --sun:#FFC94A;
  --sun-soft:#FFF1C6;
  --grape:#A98CF7;
  --grape-soft:#EEE7FF;
  --pink:#FF9DB2;
  --muted:#8A7868;
  --line:#EBD9C2;
  --shadow:0 6px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'PingFang TC','Hiragino Sans TC','Microsoft JhengHei','Noto Sans TC','Heiti TC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 4%, rgba(255,201,74,.30), transparent 40%),
    radial-gradient(circle at 92% 0%, rgba(99,189,246,.26), transparent 36%),
    radial-gradient(circle at 50% 104%, rgba(95,211,154,.24), transparent 44%),
    var(--cream);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
#app{
  position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
#app::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(58,46,42,.07) 1px, transparent 1px);
  background-size:20px 20px;
  mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 85%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 85%);
}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(255,244,223,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:2.5px solid rgba(58,46,42,.10);
}
.topbar.hidden{display:none;}
.tb-title{font-size:17px;font-weight:900;letter-spacing:.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{
  width:42px;height:42px;flex:0 0 42px;border:2.5px solid var(--ink);border-radius:14px;
  background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.icon-btn svg{width:21px;height:21px;display:block;}
.icon-btn.off{background:#F1E7D8;color:#B3A493;}
.screen{flex:1;padding:18px 16px 8px;position:relative;z-index:1;}

/* ============ 首頁 ============ */
.hero{text-align:center;padding:6px 0 4px;position:relative;}
.hero-cloud{position:absolute;left:-6px;top:18px;width:82px;opacity:.85;animation:floatY 6s ease-in-out infinite;}
.hero-cloud2{position:absolute;right:2px;top:2px;width:64px;opacity:.8;animation:floatY 7s ease-in-out infinite reverse;}
.brand-pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:1.5px;
  padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);
  box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg);
}
.brand-pill svg{width:14px;height:14px;}
.hero h1{
  margin:14px 0 4px;font-size:38px;line-height:1.05;font-weight:900;letter-spacing:2px;
  text-shadow:0 4px 0 rgba(255,201,74,.55);
}
.hero h1 .accent{color:var(--coral);}
.hero-sub{margin:8px auto 0;max-width:300px;font-size:15px;line-height:1.7;color:#6E5C4C;font-weight:600;}
.mascot-wrap{position:relative;width:132px;height:132px;margin:6px auto 0;}
.mascot-wrap svg{width:100%;height:100%;display:block;}
.mascot-bubble{
  display:inline-flex;align-items:center;gap:5px;position:relative;
  background:#fff;border:2.5px solid var(--ink);border-radius:14px;
  padding:5px 12px;font-size:12px;font-weight:800;box-shadow:0 3px 0 var(--ink);
  white-space:nowrap;margin-top:-4px;animation:floatY 4s ease-in-out infinite;
}
.mascot-bubble::after{content:'';position:absolute;left:50%;top:-7px;width:12px;height:12px;margin-left:-6px;background:#fff;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg);}

.vcard{
  position:relative;border:3px solid var(--ink);border-radius:28px;padding:18px 16px 16px;
  box-shadow:0 7px 0 var(--ink);overflow:hidden;margin-top:16px;
  transition:transform .16s ease, box-shadow .16s ease;
}
.vcard:active{transform:translateY(3px);box-shadow:0 4px 0 var(--ink);}
.vcard.junior{background:linear-gradient(155deg,#E8F8FF 0%,#DCF7EA 100%);}
.vcard.senior{background:linear-gradient(155deg,#FFF1E2 0%,#F1E9FF 100%);}
.vcard::after{
  content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  right:-52px;top:-58px;background:rgba(255,255,255,.55);pointer-events:none;
}
.vcard-top{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:2;}
.vcard-name{font-size:26px;font-weight:900;letter-spacing:1px;line-height:1.1;margin:0;}
.vcard-age{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.85);border:1.5px solid rgba(58,46,42,.28);}
.vcard-desc{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:#5F5044;font-weight:600;}
.vcard-art{width:78px;height:78px;flex:0 0 78px;}
.vcard-art svg{width:100%;height:100%;display:block;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px;position:relative;z-index:2;}
.chip{
  font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.9);border:1.5px solid rgba(58,46,42,.3);color:#4A3C33;
}
.vcard-go{
  display:flex;align-items:center;justify-content:space-between;margin-top:13px;
  background:var(--ink);color:#FFF6E6;border-radius:16px;padding:11px 14px;
  font-size:15px;font-weight:900;letter-spacing:.5px;position:relative;z-index:2;
}
.vcard-go svg{width:20px;height:20px;}
.junior .vcard-go{background:#2E6E8E;}
.senior .vcard-go{background:#7A4F3A;}

.home-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:0 4px;}
.stat-mini{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#6E5C4C;}
.stat-mini svg{width:18px;height:18px;}
.tiny-note{font-size:11.5px;color:#9A8878;font-weight:600;text-align:center;margin:12px 0 0;line-height:1.6;}

/* ============ 關卡列表 ============ */
.level-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px;}
.seg{display:flex;background:#F0E2CE;border:2.5px solid var(--ink);border-radius:14px;padding:3px;box-shadow:0 3px 0 var(--ink);}
.seg button{font-size:13px;font-weight:900;padding:6px 12px;border-radius:10px;color:#7C6A5A;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(58,46,42,.25);}
.unit-card{
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:15px 14px 13px;
  box-shadow:0 6px 0 var(--ink);margin-bottom:14px;position:relative;overflow:hidden;
}
.unit-stripe{position:absolute;left:0;top:0;bottom:0;width:8px;}
.unit-top{display:flex;align-items:center;gap:10px;}
.unit-no{
  width:32px;height:32px;flex:0 0 32px;border-radius:11px;border:2.5px solid var(--ink);
  display:grid;place-items:center;font-size:15px;font-weight:900;background:#fff;box-shadow:0 2px 0 var(--ink);
}
.unit-name{font-size:19px;font-weight:900;letter-spacing:.5px;}
.unit-formula{
  margin-left:auto;font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;
  border:2px solid var(--ink);background:var(--sun-soft);white-space:nowrap;
}
.unit-example{
  margin:10px 0 0;font-size:14px;line-height:1.6;font-weight:700;color:#5C4C40;
  background:rgba(255,255,255,.7);border-left:4px solid var(--sun);border-radius:0 10px 10px 0;padding:7px 10px;
}
.unit-example .lbl{font-size:11px;font-weight:800;color:#9A8878;display:block;margin-bottom:2px;letter-spacing:1px;}
.unit-games{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px;}
.mode-btn{
  display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);
  border-radius:15px;padding:9px 9px;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;text-align:left;
}
.mode-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.mode-btn .mi{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:var(--sky-soft);}
.mode-btn .mi svg{width:18px;height:18px;}
.mode-btn.build .mi{background:var(--mint-soft);}
.mode-txt{min-width:0;flex:1;}
.mode-name{font-size:14px;font-weight:900;line-height:1.2;}
.mode-meta{font-size:10.5px;font-weight:700;color:#9A8878;margin-top:2px;}
.mode-stars{display:flex;gap:1px;margin-top:3px;}
.mode-stars svg{width:11px;height:11px;}
.star-off{fill:#E6D6C0;stroke:#C9B79F;stroke-width:1.4;}
.star-on{fill:var(--sun);stroke:var(--ink);stroke-width:1.4;}

/* ============ 遊戲頁 ============ */
.game-wrap{display:flex;flex-direction:column;gap:12px;}
.progress-row{display:flex;align-items:center;gap:8px;}
.progress{display:flex;gap:5px;flex:1;}
.pip{height:9px;flex:1;border-radius:99px;background:#EBDCC8;border:1.5px solid rgba(58,46,42,.16);transition:background .25s ease;}
.pip.done{background:var(--mint);border-color:var(--ink);}
.pip.now{background:var(--sun);border-color:var(--ink);}
.qcount{font-size:12px;font-weight:900;color:#8A7868;white-space:nowrap;}
.q-card{
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;
  box-shadow:0 6px 0 var(--ink);padding:16px 14px;
}
.q-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.art-frame{
  width:84px;height:84px;flex:0 0 84px;border-radius:22px;border:2.5px solid var(--ink);
  display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);overflow:hidden;
}
.art-frame svg{width:64px;height:64px;display:block;}
.art-meta{min-width:0;flex:1;}
.formula-tag{
  display:inline-block;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;
  background:var(--sun-soft);border:2px solid var(--ink);letter-spacing:.5px;
}
.formula-tag.pending{
  background:#F4EADB;color:#9A8878;border-style:dashed;letter-spacing:1px;
}
.q-hint{font-size:12.5px;line-height:1.5;color:#8A7868;font-weight:700;margin-top:6px;}
.q-text{
  font-size:22px;line-height:1.75;font-weight:800;letter-spacing:.5px;margin:2px 0 4px;
  word-break:break-word;
}
.q-text.small{font-size:19px;}
.ph{
  display:inline-block;min-width:2.4em;height:1.32em;vertical-align:-.22em;margin:0 .1em;
  border-bottom:4px solid var(--coral);border-radius:3px;
  background:linear-gradient(180deg,rgba(255,138,91,0) 45%,rgba(255,138,91,.16) 45%);
}
.q-sub{font-size:13px;color:#8A7868;font-weight:700;margin:8px 0 0;}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:#fff;border:3px solid var(--ink);border-radius:17px;padding:12px 13px;
  box-shadow:0 4px 0 var(--ink);font-size:18px;font-weight:800;line-height:1.4;
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink);}
.opt .idx{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid var(--ink);
  display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--cream);
}
.opt .txt{flex:1;min-width:0;}
.opt.correct{background:var(--mint-soft);border-color:#2F8F60;box-shadow:0 4px 0 #2F8F60;}
.opt.correct .idx{background:var(--mint);border-color:#2F8F60;}
.opt.wrong{background:#FFE3E3;border-color:#C94A4A;box-shadow:0 4px 0 #C94A4A;animation:shake .42s ease;}
.opt.wrong .idx{background:#FFB4B4;border-color:#C94A4A;}
.opt[disabled]{opacity:.65;}
.opt.faded{opacity:.45;}

/* 拼一拼 */
.slot{
  min-height:70px;border:3px dashed #C9B49C;border-radius:18px;background:#FFFDF6;
  padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
  transition:border-color .2s, background .2s;
}
.slot.filled{border-color:var(--mint);border-style:solid;background:#F5FFF9;}
.slot.ok{border-color:#2F8F60;background:var(--mint-soft);}
.slot.no{border-color:#C94A4A;background:#FFF0F0;animation:shake .42s ease;}
.tile{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;line-height:1.2;padding:9px 12px;
  background:var(--sun-soft);border:2.5px solid var(--ink);border-radius:13px;
  box-shadow:0 3px 0 var(--ink);transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
  min-height:40px;
}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.tile.picked{opacity:.28;pointer-events:none;box-shadow:none;transform:none;}
.slot .tile{background:#fff;box-shadow:0 2px 0 var(--ink);font-size:16px;padding:7px 10px;}
.slot .tile .ord{
  font-size:9.5px;font-weight:900;color:#B09A85;margin-right:4px;align-self:flex-start;
}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:46px;}
.pool-empty{font-size:12px;color:#B3A493;font-weight:700;padding:10px 2px;}
.build-actions{display:flex;gap:9px;margin-top:12px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:2.5px solid var(--ink);border-radius:15px;padding:11px 16px;
  font-size:15px;font-weight:900;background:#fff;box-shadow:0 4px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink);}
.btn svg{width:18px;height:18px;}
.btn.primary{background:var(--coral);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn.mint{background:var(--mint);color:#12432C;}
.btn.ghost{background:#FFF7E9;}
.btn:disabled{opacity:.45;box-shadow:0 4px 0 rgba(58,46,42,.35);}
.btn.grow{flex:1;}

.feedback{
  min-height:0;border-radius:16px;padding:0;font-size:14px;line-height:1.6;font-weight:700;
  transition:all .22s ease;overflow:hidden;
}
.feedback.show{padding:11px 13px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);}
.feedback.good{background:var(--mint-soft);}
.feedback.bad{background:#FFECEC;}
.fb-title{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.fb-title svg{width:16px;height:16px;}
.fb-full{font-size:14px;font-weight:800;color:#2F5E45;margin-top:2px;}
.feedback.bad .fb-full{color:#8C3B3B;}
.fb-why{font-size:13px;color:#6E5C4C;margin-top:4px;font-weight:600;}
.fb-conj{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;}
.conj-lbl{
  font-size:11px;font-weight:900;color:#7A6A5A;letter-spacing:.5px;
  background:#fff;border:1.5px solid rgba(58,46,42,.28);border-radius:999px;padding:2px 7px;
}
.conj-chip{
  font-size:12.5px;font-weight:900;color:var(--ink);background:var(--sun);
  border:2px solid var(--ink);border-radius:999px;padding:2px 9px;box-shadow:0 2px 0 var(--ink);
  animation:conjPop .28s cubic-bezier(.2,1.4,.5,1) both;
}
@keyframes conjPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.listen-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:900;
  border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;box-shadow:0 2px 0 var(--ink);
}
.listen-btn svg{width:13px;height:13px;}
.listen-btn:active{transform:translateY(2px);box-shadow:none;}

/* ============ 結算 ============ */
.result{text-align:center;padding:8px 0 4px;}
.result-card{
  background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);
  padding:20px 16px 18px;position:relative;overflow:hidden;
}
.result-card::before{
  content:'';position:absolute;left:50%;top:-90px;width:180px;height:180px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(255,201,74,.4),transparent 70%);
}
.result h2{font-size:26px;font-weight:900;margin:2px 0 2px;letter-spacing:1px;}
.result-sub{font-size:13.5px;color:#8A7868;font-weight:700;margin:0 0 12px;}
.big-stars{display:flex;justify-content:center;gap:8px;margin:8px 0 6px;}
.big-stars svg{width:52px;height:52px;display:block;}
.big-stars .pop{animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both;}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 4px;}
.score-box{background:rgba(255,255,255,.75);border:2.5px solid var(--ink);border-radius:16px;padding:10px 6px;box-shadow:0 3px 0 var(--ink);}
.score-num{font-size:24px;font-weight:900;line-height:1.1;}
.score-lbl{font-size:11px;font-weight:800;color:#8A7868;letter-spacing:1px;margin-top:2px;}
.result-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.result-actions .btn{width:100%;}
.review{margin-top:14px;text-align:left;}
.review h3{font-size:14px;font-weight:900;margin:0 0 8px;letter-spacing:.5px;}
.review-item{
  display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.6;font-weight:700;
  background:#FFF7E9;border:2px solid rgba(58,46,42,.2);border-radius:12px;padding:8px 10px;margin-bottom:6px;
}
.review-item .ri-q{color:#8A7868;font-size:11.5px;display:block;font-weight:700;margin-bottom:1px;}
.review-item .ri-a{color:#2F5E45;}

/* 裝飾 */
.deco-star{position:absolute;pointer-events:none;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.9) rotate(0);}50%{opacity:1;transform:scale(1.12) rotate(8deg);}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
@keyframes starPop{0%{transform:scale(.3) rotate(-25deg);opacity:.3;}70%{transform:scale(1.16) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes popIn{0%{transform:scale(.96);}60%{transform:scale(1.015);}100%{transform:scale(1);}}
@keyframes slideUp{0%{transform:translateY(10px);opacity:.6;}100%{transform:translateY(0);opacity:1;}}
.anim-in{animation:slideUp .32s cubic-bezier(.2,.8,.2,1) both;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;
  background:var(--ink);color:#FFF6E6;font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .25s ease;white-space:nowrap;max-width:90vw;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.9s cubic-bezier(.3,.7,.5,1) forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1;}100%{transform:translateY(90vh) rotate(520deg);opacity:0;}}

/* ============ 八款新玩法 ============ */
/* ① 特點雙選 */
.trait-line{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:18px;font-weight:900;line-height:1.6;margin:10px 0 2px;}
.t-word{color:#8A7868;}
.t-word.t-mask{color:#C9B49C;letter-spacing:1px;font-size:15px;}
.trait-blank{
  min-width:62px;min-height:38px;padding:3px 8px;border-radius:11px;
  border:2.5px dashed #C9B49C;background:#FFFDF6;font-size:16px;font-weight:900;color:#B09A85;
  display:inline-flex;align-items:center;justify-content:center;
}
.trait-blank.filled{border-style:solid;border-color:var(--ink);background:var(--sun-soft);color:var(--ink);box-shadow:0 2px 0 var(--ink);}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;}
.trait-card{
  padding:12px 6px;border:3px solid var(--ink);border-radius:15px;background:#fff;
  box-shadow:0 4px 0 var(--ink);font-size:17px;font-weight:900;
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.trait-card:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink);}
.trait-card.on{background:var(--mint-soft);transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}

/* ② 因果配對 */
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.match-head{
  font-size:11.5px;font-weight:900;text-align:center;padding:4px;border-radius:9px;
  background:var(--sky-soft);border:2px solid var(--ink);margin-bottom:7px;
}
.match-col:last-child .match-head{background:var(--sun-soft);}
.mcard{
  display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--ink);
  padding:8px 7px;font-size:13px;font-weight:800;line-height:1.35;margin-bottom:7px;min-height:52px;
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.mcard .m-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#E3D3BE;border:1.5px solid var(--ink);}
.mcard .m-t{flex:1;min-width:0;}
.mcard.sel{background:var(--sun-soft);transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.mcard.matched{background:var(--mint-soft);border-color:#2F8F60;box-shadow:0 2px 0 #2F8F60;}
.mcard.matched .m-dot{background:var(--mint);}
.mcard.shake{animation:shake .42s ease;}

/* ③ 詞卡填空 */
.fill-line{font-size:18px;font-weight:800;line-height:2.1;margin-top:8px;letter-spacing:.2px;}
.fill-line>span{display:inline-block;}
.blank-slot{
  display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:37px;
  vertical-align:-.35em;margin:0 3px;border-radius:11px;border:2.5px dashed #C9B49C;background:#FFFDF6;
  font-size:15.5px;font-weight:900;color:#B09A85;padding:0 6px;
}
.blank-slot.filled{border-style:solid;border-color:var(--ink);background:var(--sun-soft);color:var(--ink);box-shadow:0 2px 0 var(--ink);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.word-chip{
  padding:9px 14px;border:2.5px solid var(--ink);border-radius:13px;background:#fff;
  font-size:16px;font-weight:900;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
}
.word-chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.word-chip.used{opacity:.28;pointer-events:none;box-shadow:none;transform:translateY(2px);}

/* ④ 假設翻牌 */
.flip-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;}
.fcard{
  height:86px;border:2.5px solid var(--ink);border-radius:15px;background:var(--grape-soft);
  box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;align-items:center;justify-content:center;
  transition:background .2s ease, transform .12s ease;
}
.fcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.fcard .f-back{font-size:26px;font-weight:900;color:var(--grape);}
.fcard .f-face{display:none;font-size:12.5px;font-weight:800;line-height:1.4;color:var(--ink);text-align:center;}
.fcard.open{background:#fff;}
.fcard.open .f-back{display:none;}
.fcard.open .f-face{display:block;}
.fcard.matched{background:var(--mint-soft);border-color:#2F8F60;box-shadow:0 4px 0 #2F8F60;}
.fcard.matched .f-face{color:#1F5B3D;}

/* ⑤ 句子診所 */
.clinic-list{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.patient{
  text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;
  box-shadow:0 4px 0 var(--ink);padding:11px 12px;
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.patient:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.patient .p-tag{font-size:10.5px;font-weight:900;color:#9A8878;display:block;margin-bottom:3px;letter-spacing:1px;}
.patient .p-txt{font-size:15.5px;font-weight:800;line-height:1.55;display:block;}
.patient.sick{background:#FFECEC;border-color:#C94A4A;box-shadow:0 4px 0 #C94A4A;}
.patient.healthy{background:var(--mint-soft);opacity:.8;box-shadow:0 2px 0 #2F8F60;}

/* ⑥ 階梯升級 */
.ladder{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
.step{display:flex;align-items:center;gap:8px;}
.step .step-lbl{font-size:11px;font-weight:900;color:#8A7868;width:42px;flex:0 0 42px;text-align:right;}
.step-2{padding-left:14px;}
.step-slot{
  flex:1;min-width:0;min-height:48px;border:2.5px dashed #C9B49C;border-radius:13px;background:#FFFDF6;
  font-size:14.5px;font-weight:900;color:#B09A85;padding:6px;
}
.step-slot.filled{border-style:solid;border-color:var(--ink);background:var(--sun-soft);color:var(--ink);box-shadow:0 3px 0 var(--ink);}
.card-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.card-chip{
  padding:10px 12px;border:2.5px solid var(--ink);border-radius:13px;background:#fff;
  font-size:14.5px;font-weight:900;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
}
.card-chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.card-chip.used{opacity:.28;pointer-events:none;box-shadow:none;}

/* ⑦ 投票表決 */
.vote-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;}
.vote-card{
  border:3px solid var(--ink);border-radius:17px;background:#fff;box-shadow:0 4px 0 var(--ink);
  padding:11px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:126px;
  transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.vote-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.v-badge{
  font-size:10.5px;font-weight:900;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--ink);display:grid;place-items:center;background:var(--cream);
}
.v-t{font-size:15px;font-weight:900;line-height:1.4;}
.v-tag{font-size:10.5px;font-weight:700;color:#8A7868;line-height:1.4;background:rgba(255,255,255,.85);border-radius:8px;padding:3px 6px;}
.vote-card.yes{background:var(--mint-soft);border-color:#2F8F60;box-shadow:0 4px 0 #2F8F60;}
.vote-card.no{background:#FFECEC;border-color:#C94A4A;box-shadow:0 4px 0 #C94A4A;opacity:.75;}

/* ⑧ 時序排隊 */
.timeline{display:flex;align-items:stretch;gap:4px;margin-top:12px;}
.tl-slot{
  flex:1;min-width:0;min-height:80px;border:2.5px dashed #C9B49C;border-radius:13px;background:#FFFDF6;
  padding:5px 4px;font-size:12px;font-weight:800;color:#B09A85;
  display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;text-align:center;
}
.tl-slot.filled{border-style:solid;border-color:var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);}
.tl-num{font-size:9.5px;font-weight:900;color:#B09A85;letter-spacing:.5px;}
.tl-txt{line-height:1.35;word-break:break-word;}
.tl-arrow{flex:0 0 10px;align-self:center;font-size:10px;color:#B09A85;font-weight:900;}


/* 句式索引與前後關係 */
.unit-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 2px 14px;}
.unit-nav button{
  font-size:12px;font-weight:900;padding:7px 2px;border:2px solid var(--ink);border-radius:10px;
  background:#fff;box-shadow:0 2px 0 var(--ink);letter-spacing:.5px;
}
.unit-nav button:active{transform:translateY(2px);box-shadow:none;}
.unit-nav button .n{font-size:9px;color:#B09A85;display:block;letter-spacing:1px;margin-bottom:1px;}
.unit-relation{
  margin:8px 0 0;font-size:12.5px;line-height:1.6;font-weight:700;color:#6B5A4C;
  background:rgba(255,201,74,.18);border:1.5px dashed rgba(58,46,42,.32);border-radius:10px;padding:6px 9px;
}
.unit-relation b{font-weight:900;color:#4A3C33;}
.unit-card{scroll-margin-top:76px;}

@media (min-width:640px){
  .hero h1{font-size:44px;}
  .screen{padding:22px 22px 10px;}
  #app{max-width:560px;}
}
@media (max-width:359px){
  .hero h1{font-size:32px;}
  .q-text{font-size:20px;}
  .opt{font-size:16.5px;padding:11px 10px;}
  .slot .tile, .tile{font-size:15.5px;padding:8px 10px;}
  .unit-formula{font-size:11px;padding:3px 7px;}
  .mode-name{font-size:13px;}
}

const DATA = {"junior":{"id":"junior","name":"初小版","age":"小一至小三","tagline":"八種複句，由短句開始。先看清前後兩句的關係，再把句子排好。","units":[{"id":"j1","name":"並列複句","formula":"又……又……","accent":"#5FD39A","example":"這個西瓜又大又圓。","relation":"前後兩句地位平等：兩件事同時存在，沒有先後輕重之分。","build":[{"a":"boy","tiles":["弟弟","又高","又壯。"],"full":"弟弟又高又壯。","hint":"先放「誰」，再放兩個特點。","why":"「又高」和「又壯」都是弟弟的特點，兩者同時存在，沒有先後之別。"},{"a":"apple","tiles":["蘋果","又大","又甜。"],"full":"蘋果又大又甜。","hint":"先放水果名稱，再放兩個特點。","why":"大和甜可以同時形容蘋果，兩個特點並列。"},{"a":"cooking","tiles":["媽媽","一邊","煮飯，","一邊","聽音樂。"],"full":"媽媽一邊煮飯，一邊聽音樂。","hint":"「一邊」要出現兩次，兩個動作同時進行。","why":"煮飯和聽音樂同時做，用「一邊……一邊……」把兩件事並列。"},{"a":"dog","tiles":["小狗","又聰明","又乖巧。"],"full":"小狗又聰明又乖巧。","hint":"兩個特點都要適合小狗。","why":"聰明和乖巧都是小狗的好表現，兩者並列。"},{"a":"walk","tiles":["我們","一邊","走路，","一邊","聊天。"],"full":"我們一邊走路，一邊聊天。","hint":"先放人物，再放兩個同時進行的動作。","why":"走路和聊天同時進行，是並列關係。"},{"a":"paint","tiles":["姐姐","一邊","畫畫，","一邊","唱歌。"],"full":"姐姐一邊畫畫，一邊唱歌。","hint":"「一邊」後面接動作，兩個動作可以同時做。","why":"畫畫和唱歌同時進行，用「一邊……一邊……」。"}],"alt":{"mode":"trait","items":[{"a":"watermelon","subject":"這個西瓜","c1":"又","c2":"又","traits":["大","圓","辣","快"],"ans":[0,1],"full":"這個西瓜又大又圓。","why":"「大」和「圓」都是西瓜同時有的特點；辣和快不是西瓜的特點。"},{"a":"cat","subject":"這隻小貓","traits":["胖","可愛","辣","苦"],"ans":[0,1],"full":"這隻小貓又胖又可愛。","why":"「胖」和「可愛」可以同時形容小貓；辣和苦不是小貓的特點。"},{"a":"flower","subject":"花園裡的花","traits":["紅","香","冷","快"],"ans":[0,1],"full":"花園裡的花又紅又香。","why":"花可以又紅又香；冷和快不是花的特點。"},{"a":"apple","subject":"這個蘋果","traits":["大","甜","辣","苦"],"ans":[0,1],"full":"這個蘋果又大又甜。","why":"蘋果不會辣也不會苦，所以選「大」和「甜」。"},{"a":"dog","subject":"這隻小狗","traits":["聰明","乖巧","香","甜"],"ans":[0,1],"full":"這隻小狗又聰明又乖巧。","why":"「聰明」和「乖巧」都是小狗的好表現；香和甜不是小狗的特點。"},{"a":"boy","subject":"弟弟","traits":["高","壯","飛","辣"],"ans":[0,1],"full":"弟弟又高又壯。","why":"「高」和「壯」可以同時形容弟弟；人不會飛，也不辣。"}]}},{"id":"j2","name":"因果複句","formula":"因為……所以……","accent":"#FF8A5B","example":"因為下雨，所以我們帶了雨傘。","relation":"前句是原因，後句是由這個原因引起的結果，順序不能顛倒。","build":[{"a":"rain","tiles":["因為","下雨，","所以","我們","留在家裡。"],"full":"因為下雨，所以我們留在家裡。","hint":"「因為」放最前，「所以」放中間。","why":"先說原因，再說結果：下雨是原因，留在家裡是結果。"},{"a":"run","tiles":["因為","小美","努力練習，","所以","她","進步了。"],"full":"因為小美努力練習，所以她進步了。","hint":"先找原因，再找結果。","why":"努力練習是原因，進步是結果。"},{"a":"swim","tiles":["因為","天氣炎熱，","所以","我們","去游泳。"],"full":"因為天氣炎熱，所以我們去游泳。","hint":"天氣是原因。","why":"炎熱是原因，去游泳是結果。"},{"a":"dog","tiles":["因為","小狗","餓了，","所以","牠","一直叫。"],"full":"因為小狗餓了，所以牠一直叫。","hint":"留意「牠」的位置。","why":"餓了是原因，一直叫是結果。"},{"a":"park","tiles":["因為","功課","做完了，","所以","我們","去公園。"],"full":"因為功課做完了，所以我們去公園。","hint":"功課做完是好事。","why":"做完功課是原因，去公園是結果。"},{"a":"flower","tiles":["因為","春天","來了，","所以","花兒","開了。"],"full":"因為春天來了，所以花兒開了。","hint":"先說季節，再說花。","why":"春天來了是原因，花兒開了是結果。"}],"alt":{"mode":"pair","items":[{"a":"rain","pairs":[["下雨了","我們帶了雨傘"],["天氣很冷","我穿了外套"],["花兒缺水","葉子都枯了"]],"why":"先說原因，再說結果，用「因為……所以……」連起來。"},{"a":"cold","pairs":[["我生病了","沒有上學"],["功課沒做完","小明留在教室"],["媽媽忘了買菜","晚上吃麵條"]],"why":"每一對都是「原因」在前，「結果」在後，不能倒過來。"},{"a":"sleep","pairs":[["小狗餓了","牠一直叫"],["春天來了","花兒開了"],["小美努力練習","她進步了"]],"why":"找到「為甚麼」和「所以怎樣」，就能配成一對。"},{"a":"swim","pairs":[["天氣炎熱","我們去游泳"],["水太滿","溢出來了"],["太陽出來了","衣服曬乾了"]],"why":"原因和結果要對得上，不能張冠李戴。"},{"a":"run","pairs":[["小美每天練習","跑步愈來愈快"],["下雨了","比賽取消了"],["忘記帶功課","老師會提醒我"]],"why":"先有原因，才有結果，順序不能倒過來。"},{"a":"homework","pairs":[["忘了關窗","雨水打濕了地板"],["鉛筆斷了","我拿出鉛筆刨"],["做完功課","我們去公園"]],"why":"把生活裡的前因後果找出來：忘記關窗，雨水才會打濕地板。"}]}},{"id":"j3","name":"條件複句","formula":"只要……就……","accent":"#63BDF6","example":"只要你早點睡，明天就有精神。","relation":"前句提出條件，後句說明做到這個條件後會有的結果。","build":[{"a":"write","tiles":["只要","你","用心，","就","會做得好。"],"full":"只要你用心，就會做得好。","hint":"「只要」開頭，「就」接結果。","why":"用心是條件，做得好是結果。"},{"a":"sun","tiles":["只要","早睡早起，","身體","就","會健康。"],"full":"只要早睡早起，身體就會健康。","hint":"先放條件，再放身體。","why":"早睡早起是健康的條件，身體健康是結果。"},{"a":"team","tiles":["只要","我們","團結，","就","能克服困難。"],"full":"只要我們團結，就能克服困難。","hint":"團結是關鍵條件。","why":"團結是克服困難的條件。"},{"a":"climb","tiles":["只要","堅持下去，","就","會成功。"],"full":"只要堅持下去，就會成功。","hint":"堅持是條件。","why":"堅持下去是成功的條件。"},{"a":"sea","tiles":["只要","打開窗，","就","能看見大海。"],"full":"只要打開窗，就能看見大海。","hint":"先做動作，再看結果。","why":"打開窗是看見大海的條件。"},{"a":"light","tiles":["只要","輕輕一按，","燈","就","亮了。"],"full":"只要輕輕一按，燈就亮了。","hint":"留意「燈」在「就」前面。","why":"按一下是燈亮的條件。"}],"alt":{"mode":"fill","items":[{"a":"sleep","parts":["＿＿","你早點睡，明天","＿＿","有精神。"],"ans":["只要","就"],"chips":["只要","就","因為","所以"],"full":"只要你早點睡，明天就有精神。","why":"「早點睡」是條件，做到就會有精神，用「只要……就……」。"},{"a":"run","parts":["＿＿","每天練習，","＿＿","會進步。"],"ans":["只要","就"],"chips":["只要","就","雖然","但是"],"full":"只要每天練習，就會進步。","why":"「每天練習」是條件，「進步」是結果。"},{"a":"sea","parts":["＿＿","多喝水，","＿＿","不容易生病。"],"ans":["只要","就"],"chips":["只要","就","因為","才"],"full":"只要多喝水，就不容易生病。","why":"多喝水是保持健康的條件。"},{"a":"apple","parts":["＿＿","吃完飯，","＿＿","可以吃水果。"],"ans":["只要","就"],"chips":["只要","就","雖然","但是"],"full":"只要吃完飯，就可以吃水果。","why":"吃完飯是吃水果的條件。"},{"a":"rainbow","parts":["＿＿","雨後有陽光，","＿＿","能看見彩虹。"],"ans":["只要","就"],"chips":["只要","就","如果","所以"],"full":"只要雨後有陽光，就能看見彩虹。","why":"雨後有陽光，是看見彩虹的條件。"},{"a":"light","parts":["＿＿","我們一起想辦法，","問題","＿＿","能解決。"],"ans":["只要","就"],"chips":["只要","就","一邊","又"],"full":"只要我們一起想辦法，問題就能解決。","why":"一起想辦法，是解決問題的條件。"}]}},{"id":"j4","name":"假設複句","formula":"如果……就……","accent":"#A98CF7","example":"如果明天下雨，比賽就會取消。","relation":"前句假設一種未必發生的情況，後句推想它會帶來的結果。","build":[{"a":"rain","tiles":["如果","明天","下雨，","比賽","就會取消。"],"full":"如果明天下雨，比賽就會取消。","hint":"先放「如果」和假設的情況。","why":"明天下雨是假設，取消是結果。"},{"a":"help","tiles":["如果","你","有困難，","我","會幫助你。"],"full":"如果你有困難，我會幫助你。","hint":"留意「我」的位置。","why":"有困難是假設，幫助是結果。"},{"a":"candy","tiles":["如果","吃太多糖，","牙齒","會痛。"],"full":"如果吃太多糖，牙齒會痛。","hint":"先說原因，再說身體。","why":"吃太多糖是假設，牙痛是結果。"},{"a":"map","tiles":["如果","迷路了，","可以","看地圖。"],"full":"如果迷路了，可以看地圖。","hint":"迷路時要做甚麼？","why":"迷路是假設，看地圖是解決方法。"},{"a":"lamp","tiles":["如果","關上燈，","房間","就變黑。"],"full":"如果關上燈，房間就變黑。","hint":"先放動作，再放結果。","why":"關燈是假設，變黑是結果。"},{"a":"seed","tiles":["如果","種下種子，","就會","長出小花。"],"full":"如果種下種子，就會長出小花。","hint":"種子會長成甚麼？","why":"種子是假設，長花是結果。"}],"alt":{"mode":"flip","items":[{"a":"rain","pairs":[["明天下雨","比賽就會取消"],["你願意參加","我們就一起玩"],["吃太多糖","牙齒會痛"]],"full":"如果明天下雨，比賽就會取消。如果你願意參加，我們就一起玩。如果吃太多糖，牙齒就會痛。","why":"「如果」帶出假設的情況，「就」帶出結果。"},{"a":"help","pairs":[["你有困難","我會幫助你"],["迷路了","可以看地圖"],["關上燈","房間就會變黑"]],"full":"如果你有困難，我會幫助你。如果迷路了，就可以看地圖。如果關上燈，房間就會變黑。","why":"假設的情況不一定發生，所以用「如果……就……」。"},{"a":"candy","pairs":[["種下種子","長出小花"],["我有一雙翅膀","飛到天上"],["忘記帶功課","老師會提醒我"]],"full":"如果種下種子，就會長出小花。如果我有一雙翅膀，就會飛到天上。如果忘記帶功課，老師會提醒我。","why":"先想「如果怎樣」，再想「就會怎樣」。"},{"a":"map","pairs":[["水太滿","溢出來"],["小貓餓了","喵喵叫"],["明天放晴","我們就去郊遊"]],"full":"如果水太滿，就會溢出來。如果小貓餓了，就會喵喵叫。如果明天放晴，我們就去郊遊。","why":"把假設和結果配成一對，句子就完整了。"},{"a":"lamp","pairs":[["你用心","就會做得好"],["早睡早起","身體就會健康"],["我們團結","克服困難"]],"full":"如果你用心，就會做得好。如果早睡早起，身體就會健康。如果我們團結，就能克服困難。","why":"假設的情況放前面，結果放後面。"},{"a":"seed","pairs":[["堅持下去","會成功"],["打開窗","看見大海"],["輕輕一按","燈就亮了"]],"full":"如果堅持下去，就會成功。如果打開窗，就能看見大海。如果輕輕一按，燈就亮了。","why":"「如果……就……」可以用來想像未發生的事。"}]}},{"id":"j5","name":"轉折複句","formula":"雖然……但是……","accent":"#FFC94A","example":"雖然天氣很冷，但是我還是去跑步。","relation":"前後意思相反：後句不是順著前句說下去，而是轉到相反的方向。","build":[{"a":"rain","tiles":["雖然","下雨了，","但是","我們","還是去上學。"],"full":"雖然下雨了，但是我們還是去上學。","hint":"「雖然」開頭，「但是」放中間。","why":"下雨本應留在家，但還是去上學，前後意思相反，是轉折關係。"},{"a":"girl","tiles":["雖然","妹妹","年紀小，","但是","她","很懂事。"],"full":"雖然妹妹年紀小，但是她很懂事。","hint":"先說年紀，再說表現。","why":"年紀小本應不懂事，但她很懂事，前後形成對比。"},{"a":"book","tiles":["雖然","這本書","很厚，","但是","內容","很有趣。"],"full":"雖然這本書很厚，但是內容很有趣。","hint":"厚和有趣形成對比。","why":"書厚本應難讀，但內容有趣，前後相反。"},{"a":"road","tiles":["雖然","路","很遠，","但是","他","堅持走路回家。"],"full":"雖然路很遠，但是他堅持走路回家。","hint":"先說困難，再說做法。","why":"路遠本應坐車，但他堅持走路，前後相反。"},{"a":"park","tiles":["雖然","天氣","不好，","但是","我們","玩得很開心。"],"full":"雖然天氣不好，但是我們玩得很開心。","hint":"天氣與心情形成對比。","why":"天氣不好本應不開心，但玩得開心，前後相反。"},{"a":"math","tiles":["雖然","題目","很難，","但是","我","沒有放棄。"],"full":"雖然題目很難，但是我沒有放棄。","hint":"難和堅持形成對比。","why":"題目難本應放棄，但沒有放棄，前後相反。"}],"alt":{"mode":"clinic","items":[{"a":"run","pair":["因為天氣很冷，但是他還是去跑步。","雖然天氣很冷，但是他還是去跑步。"],"why":"前後意思相反，要用「雖然……但是……」，不能用「因為……但是……」。"},{"a":"boy","pair":["如果他年紀小，但是他做事很細心。","雖然他年紀小，但是他做事很細心。"],"why":"「年紀小」和「細心」形成對比，是轉折關係。"},{"a":"math","pair":["只要這道題很難，但是他沒有放棄。","雖然這道題很難，但是他沒有放棄。"],"why":"「題目難」卻「不放棄」，要用轉折的「雖然……但是……」。"},{"a":"book","pair":["因為這本書很厚，但是內容很有趣。","雖然這本書很厚，但是內容很有趣。"],"why":"「厚」和「有趣」不是因果，而是轉折。"},{"a":"rain","pair":["只要下著大雨，但是比賽照常舉行。","雖然下著大雨，但是比賽照常舉行。"],"why":"下雨卻照常比賽，是轉折，不是條件。"},{"a":"sleep","pair":["如果妹妹很想睡，但是她先把功課做完。","雖然妹妹很想睡，但是她先把功課做完。"],"why":"很想睡卻先做功課，前後轉折，用「雖然……但是……」。"}]}},{"id":"j6","name":"遞進複句","formula":"不但……而且……","accent":"#FF8A5B","example":"妹妹不但會唱歌，而且會跳舞。","relation":"後句比前句更進一步：程度更深、本領更多、範圍更廣。","build":[{"a":"music","tiles":["妹妹","不但","會唱歌，","而且","會跳舞。"],"full":"妹妹不但會唱歌，而且會跳舞。","hint":"「不但」在前，「而且」在後。","why":"會唱歌之外還會跳舞，後一項更進一步。"},{"a":"book","tiles":["這本書","不但","有圖畫，","而且","有貼紙。"],"full":"這本書不但有圖畫，而且有貼紙。","hint":"先說圖畫，再說貼紙。","why":"有圖畫之外還有貼紙，後一項更進一步。"},{"a":"study","tiles":["小明","不但","自己完成功課，","而且","主動幫助同學。"],"full":"小明不但自己完成功課，而且主動幫助同學。","hint":"先說自己，再說同學。","why":"完成自己的功課之外還幫助同學，層層遞進。"},{"a":"noodles","tiles":["這家餐廳","不但","價格便宜，","而且","食物美味。"],"full":"這家餐廳不但價格便宜，而且食物美味。","hint":"先說價錢，再說味道。","why":"價格便宜之外食物美味，優點更進一步。"},{"a":"run","tiles":["他","不但","會跑步，","而且","會游泳。"],"full":"他不但會跑步，而且會游泳。","hint":"兩個本領都要放進去。","why":"會跑步之外還會游泳，本領更多。"},{"a":"paint","tiles":["姐姐","不但","會彈琴，","而且","會畫畫。"],"full":"姐姐不但會彈琴，而且會畫畫。","hint":"先放第一個本領。","why":"會彈琴之外還會畫畫，本領更多。"}],"alt":{"mode":"ladder","items":[{"a":"shirt","subject":"妹妹","cards":["會自己穿鞋","會幫弟弟穿鞋","愛吃糖果"],"ans":[0,1],"full":"妹妹不但會自己穿鞋，而且會幫弟弟穿鞋。","why":"會照顧自己之後，還會照顧弟弟，後一項更進一步。"},{"a":"write","subject":"小明","cards":["會寫字","會寫故事","怕黑"],"ans":[0,1],"full":"小明不但會寫字，而且會寫故事。","why":"會寫字是基礎，會寫故事更進一步；怕黑不是本領。"},{"a":"noodles","subject":"這間小店","cards":["價格便宜","食物美味","位置很遠"],"ans":[0,1],"full":"這間小店不但價格便宜，而且食物美味。","why":"價錢實惠之外，食物美味，優點更進一步。"},{"a":"cooking","subject":"爸爸","cards":["會煮飯","會做蛋糕","常看電視"],"ans":[0,1],"full":"爸爸不但會煮飯，而且會做蛋糕。","why":"會煮飯是基礎，會做蛋糕更進一步；看電視不是本領。"},{"a":"dog","subject":"這隻小狗","cards":["會坐下","會接球","愛睡覺"],"ans":[0,1],"full":"這隻小狗不但會坐下，而且會接球。","why":"會坐下是基本指令，會接球更進一步。"},{"a":"music","subject":"姐姐","cards":["會唱歌","會作曲","怕上台"],"ans":[0,1],"full":"姐姐不但會唱歌，而且會作曲。","why":"會唱歌是基礎，會作曲更進一步；怕上台不是本領。"}]}},{"id":"j7","name":"選擇複句","formula":"與其……不如……","accent":"#A98CF7","example":"與其在家看電視，不如出去走走。","relation":"列出兩種做法，比較之後選出較合適的一種：較差的放「與其」，較好的放「不如」。","build":[{"a":"park","tiles":["與其","在家看電視，","不如","出去走走。"],"full":"與其在家看電視，不如出去走走。","hint":"「與其」在前，「不如」在後。","why":"比較「看電視」和「出去走走」，選擇較好的後者。"},{"a":"tool","tiles":["與其","買新的，","不如","把舊的修好。"],"full":"與其買新的，不如把舊的修好。","hint":"先說其中一種做法。","why":"比較「買新的」和「修好舊的」，選擇較環保的後者。"},{"a":"help","tiles":["與其","一個人發愁，","不如","找朋友商量。"],"full":"與其一個人發愁，不如找朋友商量。","hint":"先說較差的做法。","why":"比較「獨自發愁」和「找朋友商量」，選擇後者。"},{"a":"book","tiles":["與其","只看封面，","不如","翻開細讀。"],"full":"與其只看封面，不如翻開細讀。","hint":"先說較表面的做法。","why":"比較「只看封面」和「翻開細讀」，選擇後者。"},{"a":"home","tiles":["與其","亂扔垃圾，","不如","放進垃圾桶。"],"full":"與其亂扔垃圾，不如放進垃圾桶。","hint":"先說不該做的事。","why":"比較「亂扔垃圾」和「放進垃圾桶」，選擇後者。"},{"a":"girl","tiles":["與其","哭着找媽媽，","不如","自己想辦法。"],"full":"與其哭着找媽媽，不如自己想辦法。","hint":"先說依賴的做法。","why":"比較「哭着找媽媽」和「自己想辦法」，選擇後者。"}],"alt":{"mode":"vote","items":[{"a":"park","scene":"週末有半天時間","options":[{"t":"在家看電視","tag":"眼睛會累"},{"t":"出去走走","tag":"精神更好"}],"better":1,"full":"與其在家看電視，不如出去走走。","why":"比較兩個做法，選較好的一個放「不如」，較差的放「與其」。"},{"a":"tool","scene":"玩具車的輪子鬆了","options":[{"t":"丟掉買新的","tag":"花錢又不環保"},{"t":"把舊的修好","tag":"省錢又環保"}],"better":1,"full":"與其丟掉買新的，不如把舊的修好。","why":"先說不理想的做法，再說更好的選擇。"},{"a":"help","scene":"遇到不會做的難題","options":[{"t":"找朋友商量","tag":"多一個辦法"},{"t":"一個人發愁","tag":"越想越亂"}],"better":0,"full":"與其一個人發愁，不如找朋友商量。","why":"「與其」後面放較差的做法，「不如」後面放較好的做法。"},{"a":"math","scene":"功課出了問題","options":[{"t":"坐著抱怨","tag":"問題還在"},{"t":"站起來行動","tag":"才有改變"}],"better":1,"full":"與其坐著抱怨，不如站起來行動。","why":"比較抱怨和行動，選擇能帶來改變的行動。"},{"a":"book","scene":"圖書館有一本好書","options":[{"t":"翻開細讀","tag":"發現閱讀樂趣"},{"t":"只看封面","tag":"錯過好內容"}],"better":0,"full":"與其只看封面，不如翻開細讀。","why":"把較好的做法放在「不如」後面，取捨就清楚了。"},{"a":"home","scene":"地上有一張廢紙","options":[{"t":"假裝沒看見","tag":"地方愈來愈髒"},{"t":"撿起來放進垃圾桶","tag":"環境更整潔"}],"better":1,"full":"與其假裝沒看見，不如撿起來放進垃圾桶。","why":"比較兩個做法，選擇對環境更好的後者。"}]}},{"id":"j8","name":"承接複句","formula":"先……再……","accent":"#63BDF6","example":"放學後，我們先做完功課，再去打球。","relation":"兩件事按時間先後發生：先做的放前面，後做的放後面，次序不能顛倒。","build":[{"a":"park","tiles":["放學後，","我們","先","做完功課，","再","去打球。"],"full":"放學後，我們先做完功課，再去打球。","hint":"先發生的事放前面。","why":"做功課在前，打球在後，兩件事先後相承。"},{"a":"cooking","tiles":["媽媽","先","把米洗乾淨，","再","放進電飯鍋。"],"full":"媽媽先把米洗乾淨，再放進電飯鍋。","hint":"洗米在前，煮飯在後。","why":"洗米是第一步，放進鍋是第二步。"},{"a":"dog","tiles":["他","一","看到小狗，","就","開心地跑過去。"],"full":"他一看到小狗，就開心地跑過去。","hint":"「一」和「就」要相連。","why":"看到小狗後馬上跑過去，用「一……就……」表示先後相接。"},{"a":"home","tiles":["進屋前，","先","把鞋子脫掉，","再","走進客廳。"],"full":"進屋前，先把鞋子脫掉，再走進客廳。","hint":"先脫鞋，再進屋。","why":"脫鞋在前，走進客廳在後。"},{"a":"door","tiles":["他","一","打開門，","就","聞到飯菜的香味。"],"full":"他一打開門，就聞到飯菜的香味。","hint":"開門和聞到香味先後相連。","why":"開門後馬上聞到香味，用「一……就……」。"},{"a":"write","tiles":["吃飯前，","先","洗手，","再","坐下來。"],"full":"吃飯前，先洗手，再坐下來。","hint":"洗手在前，坐下在後。","why":"洗手是第一步，坐下是第二步。"}],"alt":{"mode":"order","items":[{"a":"cooking","steps":["洗手","坐下","吃飯"],"full":"先洗手，再坐下，然後吃飯。","why":"先洗手，再坐下，最後才吃飯，順序不能亂。"},{"a":"home","steps":["脫鞋","走進客廳","坐下休息"],"full":"先脫鞋，再走進客廳，然後坐下休息。","why":"入屋先脫鞋，才可以走進客廳，最後坐下休息。"},{"a":"door","steps":["打開門","放下書包","洗手吃點心"],"full":"先打開門，再放下書包，然後洗手吃點心。","why":"先開門入屋，放下書包後再洗手吃東西。"},{"a":"write","steps":["拿出功課","打開課本","開始寫字"],"full":"先拿出功課，再打開課本，然後開始寫字。","why":"沒有拿出功課，就無法打開課本寫字，次序不能調換。"},{"a":"park","steps":["做完功課","收拾書包","去公園打球"],"full":"先做完功課，再收拾書包，然後去公園打球。","why":"做完功課才可以去玩，收拾書包在出發前。"},{"a":"sleep","steps":["起床","刷牙洗臉","吃早餐"],"full":"先起床，再刷牙洗臉，然後吃早餐。","why":"起床之後才能刷牙洗臉，梳洗完才吃早餐。"}]}}]},"senior":{"id":"senior","name":"高小版","age":"小四至小六","tagline":"八種複句，練習書面語與長句。答題時先不看關聯詞，答對後才揭曉。","units":[{"id":"s1","name":"並列複句","formula":"既……又……","accent":"#5FD39A","example":"這座圖書館既安靜又明亮。","relation":"兩個特點或動作同時並存，地位平等，沒有主次之分。","build":[{"a":"book","tiles":["這座圖書館","既","安靜","又","明亮。"],"full":"這座圖書館既安靜又明亮。","hint":"兩個特點各放一張卡，讀起來要順。","why":"安靜和明亮同時存在，是並列關係，用「既……又……」。"},{"a":"flower","tiles":["爺爺","一邊","澆花，","一邊","哼著小曲。"],"full":"爺爺一邊澆花，一邊哼著小曲。","hint":"兩個動作同時進行。","why":"澆花和哼曲同時進行，兩件事地位平等。"},{"a":"team","tiles":["這次活動","既","考驗耐力，","又","講求合作。"],"full":"這次活動既考驗耐力，又講求合作。","hint":"先放第一個特點。","why":"考驗耐力和講求合作同時存在，兩者並列。"},{"a":"study","tiles":["同學們","一邊","討論，","一邊","把想法寫在白板上。"],"full":"同學們一邊討論，一邊把想法寫在白板上。","hint":"留意句子裡重複出現的那張卡。","why":"討論和寫白板同時進行，是並列關係。"},{"a":"road","tiles":["這條老街","既","有歷史味道，","又","充滿生活氣息。"],"full":"這條老街既有歷史味道，又充滿生活氣息。","hint":"兩個特點都形容老街。","why":"歷史味道和生活氣息同時存在，互不從屬。"},{"a":"paint","tiles":["姐姐","一邊","整理筆記，","一邊","回想老師的講解。"],"full":"姐姐一邊整理筆記，一邊回想老師的講解。","hint":"先放人物，再放兩個動作。","why":"整理筆記和回想講解同時進行，兩者並列。"}],"alt":{"mode":"trait","items":[{"a":"home","subject":"這座城市","c1":"既","c2":"又","traits":["古老","現代","香","甜"],"ans":[0,1],"full":"這座城市既古老又現代。","why":"古城風貌和現代設施可以同時存在；香和甜不是城市的特點。"},{"a":"book","subject":"這篇文章","c1":"既","c2":"又","traits":["簡潔","有力","甜","辣"],"ans":[0,1],"full":"這篇文章既簡潔又有力。","why":"篇幅簡潔和論述有力可以並存；甜和辣不能用來形容文章。"},{"a":"team","subject":"這次比賽","c1":"既","c2":"又","traits":["緊張","刺激","香","甜"],"ans":[0,1],"full":"這次比賽既緊張又刺激。","why":"緊張和刺激同時形容比賽的氣氛，兩者並列。"},{"a":"noodles","subject":"這道菜","c1":"既","c2":"又","traits":["鮮美","香濃","古老","現代"],"ans":[0,1],"full":"這道菜既鮮美又香濃。","why":"鮮美和香濃都是味道，可以同時存在；古老和現代形容不了味道。"},{"a":"climb","subject":"這條山路","c1":"既","c2":"又","traits":["陡峭","狹窄","香","甜"],"ans":[0,1],"full":"這條山路既陡峭又狹窄。","why":"陡峭和狹窄同時形容山路；香和甜不是山路的特點。"},{"a":"girl","subject":"這位老師","c1":"既","c2":"又","traits":["嚴格","幽默","甜","辣"],"ans":[0,1],"full":"這位老師既嚴格又幽默。","why":"嚴格和幽默可以並存，並不矛盾；甜和辣不是性格特點。"}]}},{"id":"s2","name":"因果複句","formula":"由於……因此……","accent":"#FF8A5B","example":"由於事前準備充足，因此這次表演十分順利。","relation":"前句是原因，後句是直接由它引起的結果，因果要對得上。","build":[{"a":"screen","tiles":["由於","長時間","盯著屏幕，","因此","他的眼睛","很容易疲勞。"],"full":"由於長時間盯著屏幕，因此他的眼睛很容易疲勞。","hint":"先說習慣，再說身體反應。","why":"長時間看屏幕是原因，眼睛疲勞是直接結果。"},{"a":"stage","tiles":["由於","事前","準備充足，","因此","這次表演","十分順利。"],"full":"由於事前準備充足，因此這次表演十分順利。","hint":"前後兩張卡要成對。","why":"準備充足是原因，表演順利是結果。"},{"a":"team","tiles":["由於","同學們","齊心協力，","因此","班際比賽","取得了佳績。"],"full":"由於同學們齊心協力，因此班際比賽取得了佳績。","hint":"先說合作，再說成績。","why":"齊心協力是原因，取得佳績是結果。"},{"a":"mountain","tiles":["由於","連日大雨，","因此","山路","出現了塌方。"],"full":"由於連日大雨，因此山路出現了塌方。","hint":"大雨會帶來甚麼後果？","why":"連日大雨是原因，山路塌方是結果。"},{"a":"study","tiles":["由於","他","願意虛心請教，","因此","進步得","特別快。"],"full":"由於他願意虛心請教，因此進步得特別快。","hint":"先說態度，再說進步。","why":"虛心請教是原因，進步快是結果。"},{"a":"city","tiles":["由於","城市","車輛增多，","因此","空氣質素","下降了。"],"full":"由於城市車輛增多，因此空氣質素下降了。","hint":"車輛增多會影響甚麼？","why":"車輛增多是原因，空氣質素下降是結果。"}],"alt":{"mode":"pair","items":[{"a":"screen","pairs":[["長時間盯著屏幕","眼睛容易疲勞"],["事前準備充足","表演十分順利"],["連日大雨","山路出現塌方"]],"why":"每一對都是「原因→直接結果」，用「由於……因此……」連起來。","full":"由於長時間盯著屏幕，因此眼睛容易疲勞。由於事前準備充足，因此表演十分順利。由於連日大雨，因此山路出現塌方。"},{"a":"team","pairs":[["同學們齊心協力","班際比賽取得佳績"],["他虛心請教","進步得特別快"],["城市車輛增多","空氣質素下降"]],"why":"先找出「為甚麼」，再找「所以怎樣」，順序不能顛倒。","full":"由於同學們齊心協力，因此班際比賽取得佳績。由於他虛心請教，因此進步得特別快。由於城市車輛增多，因此空氣質素下降。"},{"a":"run","pairs":[["運動員堅持訓練","體能明顯提升"],["圖書館延長開放","借閱人數上升"],["比賽前緊張失眠","臨場表現失準"]],"why":"原因與結果之間要有直接關係，不能勉強配對。","full":"由於運動員堅持訓練，因此體能明顯提升。由於圖書館延長開放，因此借閱人數上升。由於比賽前緊張失眠，因此臨場表現失準。"},{"a":"cold","pairs":[["天氣突然轉涼","感冒人數增加"],["店舖貨品齊全","顧客樂意光顧"],["劇本改編出色","電影大受歡迎"]],"why":"結果是由原因引起的，配對時要問「這件事真的會導致那個結果嗎」。","full":"由於天氣突然轉涼，因此感冒人數增加。由於店舖貨品齊全，因此顧客樂意光顧。由於劇本改編出色，因此電影大受歡迎。"},{"a":"write","pairs":[["他把筆記整理清楚","溫習時一目了然"],["社區增設路燈","夜間出行更安全"],["球隊默契不足","傳球頻頻失誤"]],"why":"把原因放左邊、結果放右邊，句子才通順。","full":"由於他把筆記整理清楚，因此溫習時一目了然。由於社區增設路燈，因此夜間出行更安全。由於球隊默契不足，因此傳球頻頻失誤。"},{"a":"homework","pairs":[["農田缺水","收成大受影響"],["司機酒後駕駛","釀成嚴重意外"],["學校推行閱讀計劃","學生閱讀量上升"]],"why":"因果關係要合理：缺水果真會影響收成，酒後駕駛果真會釀成意外。","full":"由於農田缺水，因此收成大受影響。由於司機酒後駕駛，因此釀成嚴重意外。由於學校推行閱讀計劃，因此學生閱讀量上升。"}]}},{"id":"s3","name":"條件複句","formula":"只有……才……","accent":"#63BDF6","example":"只有堅持練習，才能在比賽中發揮水準。","relation":"前句提出必要條件，後句說明具備這個條件才會有的結果。","build":[{"a":"run","tiles":["只有","堅持練習，","才","能在比賽中","發揮水準。"],"full":"只有堅持練習，才能在比賽中發揮水準。","hint":"先放條件，再放結果。","why":"堅持練習是發揮水準的必要條件。"},{"a":"map","tiles":["除非","你","親自嘗試，","否則","很難明白","其中的樂趣。"],"full":"除非你親自嘗試，否則很難明白其中的樂趣。","hint":"前後兩張卡要成對。","why":"不親自嘗試，就難以明白樂趣；「除非……否則……」表示必要條件。"},{"a":"team","tiles":["無論","遇到多大困難，","我們","都","要保持冷靜。"],"full":"無論遇到多大困難，我們都要保持冷靜。","hint":"先放讓步的條件。","why":"無論困難多大，結果都不變：要保持冷靜。"},{"a":"study","tiles":["只要","大家","分工合作，","任務","就","能順利完成。"],"full":"只要大家分工合作，任務就能順利完成。","hint":"先放條件，再說結果。","why":"分工合作是完成任務的足夠條件。"},{"a":"sleep","tiles":["只有","養成","良好的作息，","身體","才會","真正健康。"],"full":"只有養成良好的作息，身體才會真正健康。","hint":"先說習慣，再說身體。","why":"良好作息是身體健康的必要條件。"},{"a":"rain","tiles":["不管","天氣怎樣，","比賽","都","會如期舉行。"],"full":"不管天氣怎樣，比賽都會如期舉行。","hint":"先放不受影響的條件。","why":"天氣不影響結果，用「不管……都……」。"}],"alt":{"mode":"fill","items":[{"a":"help","parts":["＿＿","你親身經歷過，","＿＿","明白別人的感受。"],"ans":["只有","才"],"chips":["只有","才","雖然","但是"],"full":"只有你親身經歷過，才明白別人的感受。","why":"親身經歷是明白別人感受的必要條件，用「只有……才……」。"},{"a":"run","parts":["＿＿","早點出發，","＿＿","一定會遲到。"],"ans":["除非","否則"],"chips":["除非","否則","因為","所以"],"full":"除非早點出發，否則一定會遲到。","why":"「除非」提出唯一可以避免遲到的做法，「否則」說出不這樣做的結果。"},{"a":"team","parts":["＿＿","結果如何，我們","＿＿","要盡力而為。"],"ans":["無論","都"],"chips":["無論","都","與其","不如"],"full":"無論結果如何，我們都要盡力而為。","why":"結果不影響做法，用「無論……都……」表示條件不變。"},{"a":"study","parts":["＿＿","肯動腦筋，","＿＿","能找到解決辦法。"],"ans":["只要","就"],"chips":["只要","就","雖然","但是"],"full":"只要肯動腦筋，就能找到解決辦法。","why":"肯動腦筋是找到辦法的足夠條件。"},{"a":"girl","parts":["＿＿","別人怎麼說，你","＿＿","要相信自己。"],"ans":["不管","都"],"chips":["不管","都","因為","所以"],"full":"不管別人怎麼說，你都要相信自己。","why":"別人的說法不影響結果，用「不管……都……」。"},{"a":"write","parts":["＿＿","打好基礎，","＿＿","能學得更快。"],"ans":["只有","才"],"chips":["只有","才","雖然","但是"],"full":"只有打好基礎，才能學得更快。","why":"打好基礎是學得更快的必要條件，所以用「只有……才……」。"}]}},{"id":"s4","name":"假設複句","formula":"即使……也……","accent":"#A98CF7","example":"即使明天下雨，比賽也會照常舉行。","relation":"前句假設一種情況，後句說明在這種情況下仍然不變的結果。","build":[{"a":"rain","tiles":["即使","明天","下雨，","比賽","也會","照常舉行。"],"full":"即使明天下雨，比賽也會照常舉行。","hint":"先放讓步的情況。","why":"下雨這個情況不會改變結果：比賽照常舉行。"},{"a":"climb","tiles":["就算","遇到","再大的困難，","我們","也","不會放棄。"],"full":"就算遇到再大的困難，我們也不會放棄。","hint":"前後兩張卡要成對。","why":"困難再大，結果仍然是不放棄，用「就算……也……」。"},{"a":"book","tiles":["假如","時間","可以倒流，","我","一定","會好好珍惜。"],"full":"假如時間可以倒流，我一定會好好珍惜。","hint":"先放假設，再放想法。","why":"時間倒流是假設，好好珍惜是推想的結果。"},{"a":"help","tiles":["倘若","每個人","都願意伸出援手，","世界","會變得","更美好。"],"full":"倘若每個人都願意伸出援手，世界會變得更美好。","hint":"先放眾人的行動。","why":"人人伸出援手是假設，世界更美好是結果。"},{"a":"math","tiles":["即使","失敗了，","他","也","沒有灰心。"],"full":"即使失敗了，他也沒有灰心。","hint":"留意後半句放在哪裡。","why":"失敗是讓步的情況，不灰心是不變的結果。"},{"a":"homework","tiles":["要是","你","早點告訴我，","我","就","可以幫你。"],"full":"要是你早點告訴我，我就可以幫你。","hint":"先放假設的情況。","why":"早點告訴我是假設，可以幫你是結果。"}],"alt":{"mode":"flip","items":[{"a":"rain","pairs":[["明天下雨","比賽也會照常舉行"],["遇到再大的困難","我們也不會放棄"]],"full":"即使明天下雨，比賽也會照常舉行。即使遇到再大的困難，我們也不會放棄。","why":"「即使」帶出讓步的情況，「也」帶出不受影響的結果。"},{"a":"book","pairs":[["時間可以倒流","我會好好珍惜"],["每個人都願意伸出援手","世界會變得更美好"]],"full":"假如時間可以倒流，我會好好珍惜。假如每個人都願意伸出援手，世界會變得更美好。","why":"「假如」帶出假設，「會」帶出推想的結果。"},{"a":"climb","pairs":[["失敗了一次","也要再站起來"],["別人都不看好","他仍然堅持"]],"full":"即使失敗了一次，也要再站起來。即使別人都不看好，他仍然堅持。","why":"前句讓步，後句的結果不因此改變。"},{"a":"homework","pairs":[["你早點告訴我","我就可以幫你"],["功課做完了","我們就可以去打球"]],"full":"要是你早點告訴我，我就可以幫你。要是功課做完了，我們就可以去打球。","why":"「要是」等於「如果」，後面接會出現的結果。"},{"a":"cold","pairs":[["天氣再冷","他也會去晨跑"],["工作再忙","她仍會抽時間閱讀"]],"full":"就算天氣再冷，他也會去晨跑。就算工作再忙，她仍會抽時間閱讀。","why":"「就算……也……」表示條件再怎麼變，結果都不變。"},{"a":"sun","pairs":[["明天放晴","我們就去郊遊"],["你願意嘗試","就會發現樂趣"]],"full":"如果明天放晴，我們就去郊遊。如果你願意嘗試，就會發現樂趣。","why":"「如果……就……」用於一般的假設，結果跟着假設出現。"}]}},{"id":"s5","name":"轉折複句","formula":"儘管……仍……","accent":"#FFC94A","example":"儘管天氣惡劣，救援人員仍然堅持搜索。","relation":"前後分句意思對立，重點落在後句：後句不是順著前句推下去的。","build":[{"a":"rain","tiles":["儘管","天氣","惡劣，","救援人員","仍然","堅持搜索。"],"full":"儘管天氣惡劣，救援人員仍然堅持搜索。","hint":"先放讓步的情況，再放不變的結果。","why":"天氣惡劣本應阻礙搜索，但救援人員仍然堅持，前後對立。"},{"a":"stage","tiles":["這部電影","場面","不算華麗，","然而","情節","十分感人。"],"full":"這部電影場面不算華麗，然而情節十分感人。","hint":"先說不足，再說優點。","why":"場面不華麗，情節卻感人，重點在後句的「然而」。"},{"a":"help","tiles":["他","不但","沒有責怪同學，","反而","主動","幫忙收拾。"],"full":"他不但沒有責怪同學，反而主動幫忙收拾。","hint":"前後兩張卡要成對。","why":"不但沒有責怪，反而主動幫忙，後句與預期相反。"},{"a":"math","tiles":["雖然","這次實驗","失敗了，","但是","他們","找到了問題所在。 const ALT = {};
['junior', 'senior'].forEach(function (v) {
  DATA[v].units.forEach(function (u) { ALT[u.id] = u.alt; });
});

/* 為配對與翻牌補上完整句子（資料已自帶 full 時不覆蓋） */
Object.keys(ALT).forEach(function (k) {
  const m = ALT[k];
  m.items.forEach(function (q) {
    if (m.mode === 'pair' && !q.full) {
      q.full = q.pairs.map(function (p) { return '因為' + p[0] + '，所以' + p[1] + '。'; }).join('');
    }
    if (m.mode === 'clinic' && !q.full) {
      q.full = q.pair[1];
    }
    if (m.mode === 'flip' && !q.full) {
      q.full = q.pairs.map(function (p) {
        var tail = p[1];
        var complete = /^(就|便|會|能|可以|可)/.test(tail);
        return '如果' + p[0] + '，' + (complete ? tail : '就會' + tail) + '。';
      }).join('');
    }
  });
});

  { u: 's8', re: /一[^。；！？]*?就/, label: '一……就……' }
];

function conjList(text, unitId) {
  const out = [];
  CONJ_PATTERNS.forEach(function (p) {
    if (p.u !== unitId || !p.re.test(text)) return;
    if (p.generic) {
      const hasDetail = out.some(function (l) { return l !== p.label && l.indexOf(p.generic) === 0; });
      if (hasDetail) return;
    }
    if (out.indexOf(p.label) === -1) out.push(p.label);
  });
  ['先……再……'].forEach(function (generic) {
    if (out.length > 1 && out.indexOf(generic) !== -1) out.splice(out.indexOf(generic), 1);
  });
  return out;
}

function conjReveal(q) {
  const list = conjList(q.full || '', currentUnit().id);
  if (!list.length) return '';
  return `<div class="fb-conj"><span class="conj-lbl">本題關聯詞</span>` +
    list.map(function (c) { return `<span class="conj-chip">${c}</span>`; }).join('') + `</div>`;
}

/* ===================== 音效 ===================== */
const Sfx = {
  ctx: null,
  on: true,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, delay) {
    if (!this.on) return;
    this.init();
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + (dur || 0.12) + 0.02);
  },
  click() { this.tone(540, 0.07, 'triangle', 0.045); },
  pop() { this.tone(760, 0.08, 'sine', 0.05); },
  correct() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.17, 'sine', 0.065, i * 0.085)); },
  wrong() { this.tone(310, 0.14, 'sine', 0.055); this.tone(228, 0.2, 'sine', 0.045, 0.13); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.06, i * 0.11)); },
  star(i) { this.tone(660 + i * 140, 0.18, 'sine', 0.06); }
};

function speak(text) {
  if (!('speechSynthesis' in window)) { toast('此裝置不支援語音朗讀'); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/……/g, '，'));
    u.lang = 'zh-HK';
    u.rate = 0.86;
    u.pitch = 1.12;
    window.speechSynthesis.speak(u);
  } catch (e) { toast('語音朗讀暫時不可用'); }
}
