function startGame(v, ui, mode) {
  g.version = v; g.ui = ui; g.mode = mode; g.qi = 0; g.wrong = 0;
  g.results = []; g.locked = false;
  resetRound();
  state.view = 'game';
  topbar.classList.remove('hidden');
  renderGame();
}

function resetRound() {
  g.pick = []; g.pool = null; g.sel = null; g.matched = []; g.open = [];
  g.busy = false; g.blanks = null; g.blankParts = null; g.slots = null;
  g.cards = null; g.tried = [];
}

function currentUnit() { return DATA[g.version].units[g.ui]; }
function altOf(u) { return ALT[u.id]; }
function itemsOf() {
  const u = currentUnit();
  return g.mode === 'build' ? u.build : altOf(u).items;
}
function currentQ() { return itemsOf()[g.qi]; }
function modeInfo() {
  return g.mode === 'build' ? MODE_INFO.build : MODE_INFO[altOf(currentUnit()).mode];
}

function shuffleIdx(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  if (n > 1 && arr.every((v, i) => v === i)) [arr[0], arr[1]] = [arr[1], arr[0]];
  return arr;
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderGame() {
  const u = currentUnit();
  const q = currentQ();
  const total = itemsOf().length;
  const info = modeInfo();
  tbTitle.textContent = u.name + ' · ' + info.name;

  const pips = Array.from({ length: total }, (_, i) =>
    `<span class="pip ${i < g.qi ? 'done' : (i === g.qi ? 'now' : '')}"></span>`).join('');
  const artBg = `background:linear-gradient(160deg,${u.accent}26,#FFFDF7)`;

  screenEl.innerHTML = `
    <div class="game-wrap anim-in">
      <div class="progress-row">
        <div class="progress">${pips}</div>
        <div class="qcount">${g.qi + 1} / ${total}</div>
      </div>
      <div class="q-card">
        <div class="q-top">
          <div class="art-frame" style="${artBg}">${ART[q.a] || ART.star}</div>
          <div class="art-meta">
            ${g.version === 'senior'
              ? `<span class="formula-tag pending">關聯詞待揭曉</span>`
              : `<span class="formula-tag">${esc(u.formula)}</span>`}
            <div class="q-hint">${esc(info.meta)}</div>
          </div>
        </div>
        <div id="modeBody">${bodyFor(q)}</div>
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </div>`;
  bindMode(q);
  window.scrollTo(0, 0);
}

function refresh() {
  const q = currentQ();
  const box = document.getElementById('modeBody');
  if (!box) return;
  box.innerHTML = bodyFor(q);
  bindMode(q);
}

function bodyFor(q) {
  switch (g.mode) {
    case 'trait': return traitBody(q);
    case 'pair': return pairBody(q);
    case 'fill': return fillBody(q);
    case 'flip': return flipBody(q);
    case 'clinic': return clinicBody(q);
    case 'ladder': return ladderBody(q);
    case 'vote': return voteBody(q);
    case 'order': return orderBody(q);
    default: return buildBody(q);
  }
}

function bindMode(q) {
  switch (g.mode) {
    case 'trait': bindTrait(q); break;
    case 'pair': bindPair(q); break;
    case 'fill': bindFill(q); break;
    case 'flip': bindFlip(q); break;
    case 'clinic': bindClinic(q); break;
    case 'ladder': bindLadder(q); break;
    case 'vote': bindVote(q); break;
    case 'order': bindOrder(q); break;
    default: bindBuild(q); break;
  }
}

/* ---------- ① 特點雙選（並列） ---------- */
function traitBody(q) {
  const shown = g.pick.slice().sort((a, b) => a - b);
  const hideConj = g.version === 'senior';
  const word = function (c) {
    return hideConj
      ? '<span class="t-word t-mask" aria-hidden="true">···</span>'
      : `<span class="t-word">${esc(c || '又')}</span>`;
  };
  return `
    <div class="q-text small">給「${esc(q.subject)}」找出兩個特點</div>
    <p class="q-sub">${hideConj ? '兩張卡要能同時放進句子，讀起來才通順；關聯詞會在答對後揭曉。' : '兩張卡要能同時放進「又……又……」，讀起來才通順。'}</p>
    <div class="trait-line${hideConj ? ' masked' : ''}" id="traitLine">
      <span>${esc(q.subject)}</span>
      ${word(q.c1)}
      <span class="trait-blank ${shown[0] !== undefined ? 'filled' : ''}">${shown[0] !== undefined ? esc(q.traits[shown[0]]) : '?'}</span>
      ${word(q.c2)}
      <span class="trait-blank ${shown[1] !== undefined ? 'filled' : ''}">${shown[1] !== undefined ? esc(q.traits[shown[1]]) : '?'}</span>
      <span>。</span>
    </div>
    <div class="trait-grid" id="traitGrid">
      ${q.traits.map((t, i) => `<button class="trait-card ${g.pick.indexOf(i) !== -1 ? 'on' : ''}" data-t="${i}">${esc(t)}</button>`).join('')}
    </div>`;
}

function bindTrait(q) {
  screenEl.querySelectorAll('[data-t]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const i = Number(btn.dataset.t);
      const at = g.pick.indexOf(i);
      if (at !== -1) { g.pick.splice(at, 1); Sfx.pop(); }
      else {
        if (g.pick.length >= 2) { toast('先點一下已選的卡，就可以換掉它'); return; }
        g.pick.push(i); Sfx.click();
      }
      refresh();
      if (g.pick.length === 2) checkTrait(q);
    });
  });
}

function checkTrait(q) {
  if (g.locked) return;
  const picked = g.pick.slice().sort((a, b) => a - b);
  const want = q.ans.slice().sort((a, b) => a - b);
  const ok = picked.length === want.length && picked.every((v, i) => v === want[i]);
  if (ok) {
    Sfx.correct();
    succeed(q);
  } else {
    Sfx.wrong();
    fail(q, '這兩個特點放在一起不太通順，換一張再試試。');
    setTimeout(() => { if (!g.locked) { g.pick = []; refresh(); } }, 780);
  }
}

/* ---------- ② 因果配對 ---------- */
function pairBody(q) {
  if (!g.pool) g.pool = { c: shuffleIdx(q.pairs.length), e: shuffleIdx(q.pairs.length) };
  const card = (i, side) => {
    let c = 'mcard';
    if (g.matched.indexOf(i) !== -1) c += ' matched';
    if (side === 'c' && g.sel === i) c += ' sel';
    return `<button class="${c}" data-side="${side}" data-i="${i}">
      <span class="m-dot"></span><span class="m-t">${esc(side === 'c' ? q.pairs[i][0] : q.pairs[i][1])}</span>
    </button>`;
  };
  return `
    <div class="q-text small">把原因和結果配成一對</div>
    <p class="q-sub">先點一張原因卡，再點它的結果卡，共 3 對。</p>
    <div class="match-wrap">
      <div class="match-col"><div class="match-head">原因</div>${g.pool.c.map(i => card(i, 'c')).join('')}</div>
      <div class="match-col"><div class="match-head">結果</div>${g.pool.e.map(i => card(i, 'e')).join('')}</div>
    </div>
    <p class="q-sub" id="pairCount">已配對 ${g.matched.length} / ${q.pairs.length}</p>`;
}

function bindPair(q) {
  screenEl.querySelectorAll('.mcard').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked || g.busy) return;
      const side = btn.dataset.side;
      const i = Number(btn.dataset.i);
      if (g.matched.indexOf(i) !== -1) return;
      if (side === 'c') { g.sel = i; Sfx.click(); refresh(); return; }
      if (g.sel === null) { toast('先點一張「原因」卡'); return; }
      const cause = g.sel;
      if (cause === i) {
        g.matched.push(i); g.sel = null;
        Sfx.pop(); refresh();
        if (g.matched.length === q.pairs.length) { Sfx.correct(); succeed(q); }
      } else {
        Sfx.wrong(); g.wrong++;
        g.sel = null; g.busy = true;
        refresh();
        showFeedback(false, q, `「${q.pairs[cause][0]}」和「${q.pairs[i][1]}」好像不是一對，再想想。`);
        setTimeout(() => { g.busy = false; }, 600);
      }
    });
  });
}

/* ---------- ③ 詞卡填空（條件） ---------- */
function fillBody(q) {
  if (!g.blanks) {
    g.blankParts = [];
    q.parts.forEach((p, i) => { if (p === '＿＿') g.blankParts.push(i); });
    g.blanks = new Array(g.blankParts.length).fill(null);
  }
  return `
    <div class="q-text small">把關聯詞卡放進空格</div>
    <p class="q-sub">讀一讀整句，選出最通順的詞卡。</p>
    <div class="fill-line" id="fillLine">
      ${q.parts.map((p, i) => {
        if (p === '＿＿') {
          const s = g.blankParts.indexOf(i);
          return `<button class="blank-slot ${g.blanks[s] ? 'filled' : ''}" data-b="${s}">${g.blanks[s] ? esc(g.blanks[s]) : '　'}</button>`;
        }
        return `<span>${esc(p)}</span>`;
      }).join('')}
    </div>
    <div class="chip-row" id="chipRow">
      ${q.chips.map((c, i) => `<button class="word-chip ${g.blanks.indexOf(c) !== -1 ? 'used' : ''}" data-chip="${i}">${esc(c)}</button>`).join('')}
    </div>`;
}

function bindFill(q) {
  screenEl.querySelectorAll('[data-chip]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const c = q.chips[Number(btn.dataset.chip)];
      if (g.blanks.indexOf(c) !== -1) return;
      const s = g.blanks.indexOf(null);
      if (s === -1) { toast('兩個空格都满了，點空格可以取回詞卡'); return; }
      g.blanks[s] = c; Sfx.click(); refresh();
      if (g.blanks.indexOf(null) === -1) checkFill(q);
    });
  });
  screenEl.querySelectorAll('[data-b]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const s = Number(btn.dataset.b);
      if (!g.blanks[s]) return;
      g.blanks[s] = null; Sfx.pop(); refresh();
      hideFeedback();
    });
  });
}

function checkFill(q) {
  if (g.locked) return;
  const ok = g.blanks.length === q.ans.length && g.blanks.every((v, i) => v === q.ans[i]);
  if (ok) { Sfx.correct(); succeed(q); }
  else {
    Sfx.wrong();
    fail(q, '讀一讀整句，哪一個詞放進去才順？點空格可以把詞卡取回。');
    g.busy = true;
    setTimeout(() => { g.busy = false; }, 400);
  }
}

/* ---------- ④ 假設翻牌 ---------- */
function flipBody(q) {
  if (!g.cards) {
    const arr = [];
    q.pairs.forEach((p, pid) => {
      arr.push({ pid: pid, text: p[0] });
      arr.push({ pid: pid, text: p[1] });
    });
    g.cards = shuffleArr(arr);
  }
  return `
    <div class="q-text small">${g.version === 'senior' ? '翻牌配對' : '翻牌配對：如果……就……'}</div>
    <p class="q-sub">${g.version === 'senior' ? '每次翻兩張，把前句和後句配成一對，共 3 對。' : '每次翻兩張，把「如果」和「就會」配成一對，共 3 對。'}</p>
    <div class="flip-grid" id="flipGrid">
      ${g.cards.map((c, i) => {
        const isOpen = g.open.indexOf(i) !== -1 || g.matched.indexOf(c.pid) !== -1;
        return `<button class="fcard ${isOpen ? 'open' : ''} ${g.matched.indexOf(c.pid) !== -1 ? 'matched' : ''}" data-c="${i}">
          <span class="f-back">?</span><span class="f-face">${esc(c.text)}</span>
        </button>`;
      }).join('')}
    </div>
    <p class="q-sub">已配對 ${g.matched.length} / ${q.pairs.length}</p>`;
}

function bindFlip(q) {
  screenEl.querySelectorAll('.fcard').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked || g.busy) return;
      const i = Number(btn.dataset.c);
      const card = g.cards[i];
      if (g.open.indexOf(i) !== -1 || g.matched.indexOf(card.pid) !== -1) return;
      g.open.push(i); Sfx.click(); refresh();
      if (g.open.length < 2) return;

      const x = g.open[0], y = g.open[1];
      if (g.cards[x].pid === g.cards[y].pid) {
        g.matched.push(g.cards[x].pid);
        g.open = [];
        Sfx.pop(); refresh();
        if (g.matched.length === q.pairs.length) { Sfx.correct(); succeed(q); }
      } else {
        Sfx.wrong(); g.wrong++; g.busy = true;
        showFeedback(false, q, '這兩張卡不是一對，記住它們的位置再試一次。');
        setTimeout(() => {
          g.open = []; g.busy = false;
          if (!g.locked) { refresh(); hideFeedback(); }
        }, 900);
      }
    });
  });
}

/* ---------- ⑤ 句子診所（轉折） ---------- */
function clinicBody(q) {
  if (!g.pool) g.pool = Math.random() < 0.5 ? [0, 1] : [1, 0];
  return `
    <div class="q-text small">哪一句「生病」了？</div>
    <p class="q-sub">兩句之中，有一句關聯詞用錯了，把它找出來。</p>
    <div class="clinic-list">
      ${g.pool.map((idx, pos) => {
        let cls = 'patient';
        if (g.tried.indexOf(idx) !== -1) cls += idx === 0 ? ' sick' : ' healthy';
        return `<button class="${cls}" data-p="${idx}">
          <span class="p-tag">句子 ${pos === 0 ? 'A' : 'B'}</span>
          <span class="p-txt">${esc(q.pair[idx])}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function bindClinic(q) {
  screenEl.querySelectorAll('[data-p]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const idx = Number(btn.dataset.p);
      if (g.tried.indexOf(idx) !== -1) return;
      if (idx === 0) {
        Sfx.correct();
        g.tried.push(0);
        refresh();
        succeed(q);
      } else {
        Sfx.wrong(); g.wrong++;
        g.tried.push(1);
        refresh();
        fail(q, '這一句讀起來很順，不是它。再看看另一句。');
      }
    });
  });
}

/* ---------- ⑥ 階梯升級（遞進） ---------- */
function ladderBody(q) {
  if (!g.pool) g.pool = shuffleIdx(q.cards.length);
  if (!g.slots) g.slots = [null, null];
  const slot = i => {
    const v = g.slots[i];
    return `<button class="step-slot ${v !== null ? 'filled' : ''}" data-slot="${i}">${v !== null ? esc(q.cards[v]) : '?'}</button>`;
  };
  return `
    <div class="q-text small">把兩個優點放上台階</div>
    <p class="q-sub">第一級放較普通的，第二級放更進一步的；多出來的一張不要放。</p>
    <div class="ladder">
      <div class="step step-2"><span class="step-lbl">第二級</span>${slot(1)}</div>
      <div class="step step-1"><span class="step-lbl">第一級</span>${slot(0)}</div>
    </div>
    <div class="card-row">
      ${g.pool.map(i => `<button class="card-chip ${g.slots.indexOf(i) !== -1 ? 'used' : ''}" data-card="${i}">${esc(q.cards[i])}</button>`).join('')}
    </div>
    <div class="build-actions">
      <button class="btn ghost grow" id="btnLadderReset">${ICON.refresh}<span>重來</span></button>
      <button class="btn mint grow" id="btnLadder" ${g.slots.indexOf(null) === -1 ? '' : 'disabled'}>${ICON.check}<span>檢查</span></button>
    </div>`;
}

function bindLadder(q) {
  screenEl.querySelectorAll('[data-card]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const i = Number(btn.dataset.card);
      if (g.slots.indexOf(i) !== -1) return;
      const s = g.slots.indexOf(null);
      if (s === -1) { toast('兩個台階都放滿了，點台階可以取回'); return; }
      g.slots[s] = i; Sfx.click(); refresh();
    });
  });
  screenEl.querySelectorAll('[data-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const s = Number(btn.dataset.slot);
      if (g.slots[s] === null) return;
      g.slots[s] = null; Sfx.pop(); refresh();
    });
  });
  const rb = document.getElementById('btnLadderReset');
  if (rb) rb.addEventListener('click', () => { if (g.locked) return; Sfx.pop(); g.slots = [null, null]; refresh(); hideFeedback(); });
  const cb = document.getElementById('btnLadder');
  if (cb) cb.addEventListener('click', () => checkLadder(q));
}

function checkLadder(q) {
  if (g.locked) return;
  const ok = g.slots[0] === q.ans[0] && g.slots[1] === q.ans[1];
  if (ok) { Sfx.correct(); succeed(q); }
  else {
    Sfx.wrong();
    g.wrong++;
    if (g.wrong >= 2) {
      g.slots = [q.ans[0], q.ans[1]];
      refresh();
      succeed(q, '正確的排法是這樣，一起讀一遍。');
      markResult(false);
    } else {
      fail(q, '想一想：哪一項是「更進一步」的？把它放上第二級。');
    }
  }
}

/* ---------- ⑦ 投票表決（選擇） ---------- */
function voteBody(q) {
  return `
    <div class="q-text small">${esc(q.scene)}，你會選哪一個做法？</div>
    <p class="q-sub">想一想：哪個做法更值得推薦？</p>
    <div class="vote-row">
      ${q.options.map((o, i) => {
        let cls = 'vote-card';
        if (g.tried.indexOf(i) !== -1) cls += i === q.better ? ' yes' : ' no';
        return `<button class="${cls}" data-v="${i}">
          <span class="v-badge">${i === 0 ? '甲' : '乙'}</span>
          <span class="v-t">${esc(o.t)}</span>
          <span class="v-tag">${esc(o.tag)}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function bindVote(q) {
  screenEl.querySelectorAll('[data-v]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const i = Number(btn.dataset.v);
      if (g.tried.indexOf(i) !== -1) return;
      if (i === q.better) {
        Sfx.correct();
        g.tried.push(i);
        refresh();
        succeed(q);
      } else {
        Sfx.wrong(); g.wrong++;
        g.tried.push(i);
        refresh();
        fail(q, `「${q.options[i].t}」${q.options[i].tag}，換另一個做法試試。`);
      }
    });
  });
}

/* ---------- ⑧ 時序排隊（承接） ---------- */
function orderBody(q) {
  if (!g.pool) g.pool = shuffleIdx(q.steps.length);
  if (!g.slots) g.slots = new Array(q.steps.length).fill(null);
  return `
    <div class="q-text small">把三張卡按先後排好</div>
    <p class="q-sub">先發生的事放左邊，後發生的事放右邊。</p>
    <div class="timeline">
      ${g.slots.map((v, i) => `<button class="tl-slot ${v !== null ? 'filled' : ''}" data-slot="${i}">
        <span class="tl-num">第 ${i + 1} 步</span>
        <span class="tl-txt">${v !== null ? esc(q.steps[v]) : '?'}</span>
      </button>${i < 2 ? '<span class="tl-arrow">▶</span>' : ''}`).join('')}
    </div>
    <div class="pool" id="orderPool">
      ${g.pool.map(i => `<button class="tile ${g.slots.indexOf(i) !== -1 ? 'picked' : ''}" data-card="${i}">${esc(q.steps[i])}</button>`).join('')}
    </div>
    <div class="build-actions">
      <button class="btn ghost grow" id="btnOrderReset">${ICON.refresh}<span>重來</span></button>
      <button class="btn mint grow" id="btnOrder" ${g.slots.indexOf(null) === -1 ? '' : 'disabled'}>${ICON.check}<span>檢查</span></button>
    </div>`;
}

function bindOrder(q) {
  screenEl.querySelectorAll('[data-card]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const i = Number(btn.dataset.card);
      if (g.slots.indexOf(i) !== -1) return;
      const s = g.slots.indexOf(null);
      if (s === -1) { toast('三步都排滿了，點格子可以取回'); return; }
      g.slots[s] = i; Sfx.click(); refresh();
    });
  });
  screenEl.querySelectorAll('[data-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (g.locked) return;
      const s = Number(btn.dataset.slot);
      if (g.slots[s] === null) return;
      g.slots[s] = null; Sfx.pop(); refresh();
    });
  });
  const rb = document.getElementById('btnOrderReset');
  if (rb) rb.addEventListener('click', () => { if (g.locked) return; Sfx.pop(); g.slots = new Array(q.steps.length).fill(null); refresh(); hideFeedback(); });
  const cb = document.getElementById('btnOrder');
  if (cb) cb.addEventListener('click', () => checkOrder(q));
}

function checkOrder(q) {
  if (g.locked) return;
  const ok = g.slots.every((v, i) => v === i);
  if (ok) { Sfx.correct(); succeed(q); }
  else {
    Sfx.wrong();
    g.wrong++;
    if (g.wrong >= 2) {
      g.slots = q.steps.map((_, i) => i);
      refresh();
      succeed(q, '正確的次序是這樣，一起讀一遍。');
      markResult(false);
    } else {
      fail(q, '次序不太對。想一想：哪一件事一定要先做？');
    }
  }
}

/* ---------- 拼一拼（原有玩法） ---------- */
function buildBody(q) {
  return `
    <div class="q-text small">把詞卡排成完整的句子。</div>
    <p class="q-sub">提示：${esc(q.hint || '先找出句子的開頭。')}</p>
    <div class="slot" id="slot" aria-label="已選詞卡"></div>
    <div class="pool" id="pool" aria-label="詞卡"></div>
    <div class="build-actions">
      <button class="btn ghost grow" id="btnReset">${ICON.refresh}<span>重來</span></button>
      <button class="btn mint grow" id="btnCheck" disabled>${ICON.check}<span>檢查</span></button>
    </div>`;
}

function bindBuild(q) {
  if (!g.pool) g.pool = shuffleIdx(q.tiles.length);
  renderTiles();
  const rb = document.getElementById('btnReset');
  if (rb) rb.addEventListener('click', () => {
    if (g.locked) return;
    Sfx.pop(); g.pick = []; renderTiles(); hideFeedback();
  });
  const cb = document.getElementById('btnCheck');
  if (cb) cb.addEventListener('click', () => checkBuild(q));
}

function renderTiles() {
  const q = currentQ();
  const slot = document.getElementById('slot');
  const pool = document.getElementById('pool');
  if (!slot || !pool) return;
  slot.innerHTML = g.pick.length
    ? g.pick.map((idx, pos) => `<button class="tile" data-remove="${pos}"><span class="ord">${pos + 1}</span>${esc(q.tiles[idx])}</button>`).join('')
    : `<span class="pool-empty">點下面的詞卡，按順序放進來</span>`;
  slot.classList.toggle('filled', g.pick.length > 0);
  pool.innerHTML = g.pool.map(idx => {
    const used = g.pick.indexOf(idx) !== -1;
    return `<button class="tile ${used ? 'picked' : ''}" data-tile="${idx}">${esc(q.tiles[idx])}</button>`;
  }).join('');
  slot.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => {
      if (g.locked) return;
      Sfx.pop();
      g.pick.splice(Number(el.dataset.remove), 1);
      renderTiles();
    });
  });
  pool.querySelectorAll('[data-tile]').forEach(el => {
    el.addEventListener('click', () => {
      if (g.locked) return;
      const idx = Number(el.dataset.tile);
      if (g.pick.indexOf(idx) !== -1) return;
      Sfx.click();
      g.pick.push(idx);
      renderTiles();
      const btn = document.getElementById('btnCheck');
      if (btn) btn.disabled = g.pick.length !== q.tiles.length;
    });
  });
  const btn = document.getElementById('btnCheck');
  if (btn) btn.disabled = g.pick.length !== q.tiles.length;
}

function checkBuild(q) {
  if (g.locked) return;
  if (g.pick.length !== q.tiles.length) { toast('還有詞卡沒放進去'); return; }
  const ok = g.pick.every((v, i) => v === i);
  const slot = document.getElementById('slot');
  if (ok) {
    Sfx.correct();
    slot.classList.add('ok');
    const rb = document.getElementById('btnReset'), cb = document.getElementById('btnCheck');
    if (rb) rb.disabled = true;
    if (cb) cb.disabled = true;
    succeed(q);
  } else {
    Sfx.wrong();
    slot.classList.add('no');
    setTimeout(() => slot.classList.remove('no'), 700);
    g.wrong++;
    if (g.wrong >= 2) {
      g.locked = true;
      g.pick = q.tiles.map((_, i) => i);
      renderTiles();
      slot.classList.add('ok');
      markResult(false);
      showFeedback(true, q, '正確順序是這樣，一起讀一遍。');
    } else {
      showFeedback(false, q, '順序不太對。讀一讀已排好的部分，再調整看看。');
    }
  }
}

/* ---------- 共用流程 ---------- */
function succeed(q, extra) {
  g.locked = true;
  markResult(g.wrong === 0);
  showFeedback(true, q, extra);
  const fb = document.getElementById('fb');
  if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fail(q, msg) {
  g.wrong++;
  showFeedback(false, q, msg);
}

function hideFeedback() {
  const fb = document.getElementById('fb');
  if (fb) { fb.className = 'feedback'; fb.innerHTML = ''; }
}

function showFeedback(ok, q, extra) {
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.className = 'feedback show ' + (ok ? 'good' : 'bad');
  if (ok) {
    fb.innerHTML = `
      <div class="fb-title">${ICON.check}<span>答對了！</span></div>
      <div class="fb-full">「${esc(q.full)}」</div>
      ${g.version === 'senior' ? conjReveal(q) : ''}
      <div class="fb-why">${esc(q.why || extra || '')}</div>
      <button class="listen-btn" id="btnListen">${ICON.speaker}<span>聽一聽</span></button>
      <div style="margin-top:10px"><button class="btn primary" id="btnNext" style="width:100%">下一題 ${ICON.arrow}</button></div>`;
  } else {
    fb.innerHTML = `
      <div class="fb-title">${ICON.bulb}<span>再想一想</span></div>
      <div class="fb-why">${esc(extra || '讀一讀整句，哪一組關聯詞最通順？')}</div>`;
  }
  const l = document.getElementById('btnListen');
  if (l) l.addEventListener('click', () => { Sfx.pop(); speak(q.full); });
  const n = document.getElementById('btnNext');
  if (n) n.addEventListener('click', () => { Sfx.click(); nextQuestion(); });
}

function markResult(ok) {
  g.results[g.qi] = { ok: !!ok, full: currentQ().full };
}

function nextQuestion() {
  const total = itemsOf().length;
  if (g.qi < total - 1) {
    g.qi++; g.wrong = 0; g.locked = false;
    resetRound();
    renderGame();
  } else {
    finishGame();
  }
}

function finishGame() {
  const total = itemsOf().length;
  const right = g.results.filter(r => r && r.ok).length;
  let st = 0;
  if (right >= total) st = 3;
  else if (right >= total - 1) st = 2;
  else if (right >= Math.ceil(total / 2)) st = 1;
  const k = keyOf(g.version, g.ui, g.mode);
  if ((stars[k] || 0) < st) { stars[k] = st; saveStars(); }
  Sfx.win();
  renderResult(right, total, st);
}

function confetti() {
  const box = document.getElementById('confetti');
  const colors = ['#FF8A5B', '#FFC94A', '#5FD39A', '#63BDF6', '#A98CF7', '#FF9DB2'];
  box.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('i');
    el.style.left = Math.random() * 100 + '%';
    el.style.top = '-20px';
    el.style.background = colors[i % colors.length];
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(el);
  }
  setTimeout(() => { box.innerHTML = ''; }, 2800);
}

function renderResult(right, total, st) {
  state.view = 'result';
  const u = currentUnit();
  const info = modeInfo();
  tbTitle.textContent = '本關成績';
  const starHtml = [0, 1, 2].map(i =>
    `<span class="${i < st ? 'pop' : ''}" style="animation-delay:${i * 0.14}s">${bigStar(i < st)}</span>`).join('');

  const wrongList = g.results.map((r, i) => ({ r, i })).filter(x => x.r && !x.r.ok);
  const review = wrongList.length
    ? `<div class="review"><h3>再讀一次這幾句</h3>${wrongList.map(x => `
        <div class="review-item"><span>${ICON.bulb}</span><span><span class="ri-q">第 ${x.i + 1} 題</span><span class="ri-a">${esc(x.r.full)}</span></span></div>`).join('')}</div>`
    : `<p class="tiny-note" style="margin-top:12px">全部一次答對，太棒了！</p>`;

  screenEl.innerHTML = `
    <div class="result anim-in">
      <div class="result-card">
        <div style="width:104px;height:104px;margin:0 auto 2px">${MASCOT}</div>
        <h2>${st === 3 ? '完美通關！' : st === 2 ? '很接近了！' : st === 1 ? '完成挑戰！' : '再試一次吧'}</h2>
        <p class="result-sub">${esc(u.name)} · ${info.name}</p>
        <div class="big-stars">${starHtml}</div>
        <div class="score-row">
          <div class="score-box"><div class="score-num">${right}<span style="font-size:14px;color:#8A7868"> / ${total}</span></div><div class="score-lbl">一次答對</div></div>
          <div class="score-box"><div class="score-num">${st}<span style="font-size:14px;color:#8A7868"> 星</span></div><div class="score-lbl">本關星級</div></div>
        </div>
        ${review}
        <div class="result-actions">
          <button class="btn primary" id="btnAgain">${ICON.refresh}<span>再玩一次</span></button>
          <button class="btn mint" id="btnOther">${ICON.puzzle}<span>試試另一種模式</span></button>
          <button class="btn ghost" id="btnMenu">${ICON.grid}<span>回關卡選單</span></button>
        </div>
      </div>
    </div>`;
  document.getElementById('btnAgain').addEventListener('click', () => { Sfx.click(); startGame(g.version, g.ui, g.mode); });
  document.getElementById('btnOther').addEventListener('click', () => {
    Sfx.click();
    const other = g.mode === 'build' ? altOf(u).mode : 'build';
    startGame(g.version, g.ui, other);
  });
  document.getElementById('btnMenu').addEventListener('click', () => { Sfx.click(); renderLevels(g.version); });
  if (st >= 2) confetti();
  window.scrollTo(0, 0);
}

/* ===================== 啟動 ===================== */
syncSoundBtn();
renderHome();

</script>
</body>
</html>
