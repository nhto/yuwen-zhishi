<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>「其」字大冒險｜小學文言文虛字互動遊戲</title>
<meta name="description" content="用卡通繪本風格學文言文「其」字的三種用法，再玩兩個互動遊戲各 6 題，適合小學階段，手機、平板、電腦均可使用。">
<style>
  :root{
    --paper:#FDF4E1;
    --paper-deep:#F7E6C4;
    --card:#FFFBF0;
    --ink:#3A3026;
    --ink-soft:#7A6952;
    --red:#D4553F;
    --red-soft:#F8DCD4;
    --green:#3F8F70;
    --green-soft:#D8EEE2;
    --gold:#EAB44D;
    --gold-soft:#FBEBC7;
    --blue:#6FA8C9;
    --blue-soft:#DCEBF4;
    --pink:#F0A9A0;
    --line:rgba(58,48,38,.16);
    --radius-xl:34px;
    --radius-lg:24px;
    --radius-md:18px;
    --font-title:"Kaiti TC","DFKai-SB","BiauKai","STKaiti","KaiTi","TW-Kai","Noto Serif TC",serif;
    --font-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    --shadow-hard:0 8px 0 rgba(58,48,38,.14);
  }

  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;font-size:clamp(17px,.55vw + 15.6px,20px)}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.7;
    background:
      radial-gradient(circle at 10% 4%,#FFF9EC 0,rgba(255,249,236,0) 44%),
      radial-gradient(circle at 92% 96%,#F6E1BC 0,rgba(246,225,188,0) 48%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.55;
    background-image:radial-gradient(rgba(58,48,38,.075) 1px,transparent 1px);
    background-size:20px 20px;
  }
  button{font:inherit;color:inherit}
  button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

  /* ============ 頂欄 ============ */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    gap:clamp(8px,1.6vw,16px);
    padding:calc(9px + env(safe-area-inset-top)) clamp(12px,3vw,28px) 9px;
    background:rgba(253,244,225,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:2.5px solid rgba(58,48,38,.12);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--font-title);
    font-weight:700;
    font-size:clamp(1rem,1.4vw,1.2rem);
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .brand-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--red);
    border:2.5px solid var(--ink);
    flex:none;
  }
  .topbar-spacer{flex:1}

  .icon-btn{
    flex:none;
    width:clamp(46px,6vw,52px);
    height:clamp(46px,6vw,52px);
    display:grid;
    place-items:center;
    border:2.5px solid var(--ink);
    border-radius:16px;
    background:var(--card);
    cursor:pointer;
    box-shadow:0 4px 0 rgba(58,48,38,.22);
    transition:transform .12s,box-shadow .12s,background .2s;
    padding:0;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(58,48,38,.22)}
  .icon-btn svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn .ico-off{display:none}
  .icon-btn.muted .ico-on{display:none}
  .icon-btn.muted .ico-off{display:block}

  .progress{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:420px;
    margin:0 auto;
  }
  .progress-track{
    flex:1;
    height:12px;
    border-radius:99px;
    background:rgba(58,48,38,.13);
    border:2px solid rgba(58,48,38,.18);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--red));
    transition:width .35s ease;
  }
  .progress-num{
    font-size:.82rem;
    font-weight:800;
    color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ============ 版面 ============ */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1120px;
    margin:0 auto;
    padding:clamp(16px,2.6vw,32px) clamp(14px,3vw,32px) calc(40px + env(safe-area-inset-bottom));
  }
  .view{animation:rise .38s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes shine{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ============ 按鈕 ============ */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--font-body);
    font-weight:800;
    font-size:clamp(1rem,1.35vw,1.15rem);
    line-height:1.2;
    min-height:clamp(52px,6vw,58px);
    padding:12px clamp(20px,3vw,34px);
    border:3px solid var(--ink);
    border-radius:99px;
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 5px 0 rgba(58,48,38,.9);
    transition:transform .12s,box-shadow .12s,background .2s;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(58,48,38,.9)}
  .btn-primary{background:var(--gold)}
  .btn-primary:hover{background:#F0BE60}
  .btn-ghost{background:var(--card)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 rgba(58,48,38,.4)}
  .btn-sm{
    min-height:46px;
    padding:9px 20px;
    font-size:.95rem;
    border-width:2.5px;
  }

  /* ============ 首頁 ============ */
  .home-hero{
    display:grid;
    gap:clamp(18px,3vw,34px);
    align-items:center;
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:var(--radius-xl);
    box-shadow:var(--shadow-hard);
    padding:clamp(22px,4vw,52px);
    position:relative;
    overflow:hidden;
  }
  .home-hero::after{
    content:"";
    position:absolute;
    right:-70px;top:-70px;
    width:220px;height:220px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(234,180,77,.28),rgba(234,180,77,0) 68%);
    pointer-events:none;
  }
  @media (min-width:860px){
    .home-hero{grid-template-columns:minmax(280px,1fr) 1.15fr;gap:clamp(24px,4vw,56px)}
  }
  .hero-art{display:grid;place-items:center;position:relative}
  .hero-art svg{width:min(100%,340px);height:auto;animation:floaty 5.5s ease-in-out infinite}
  .hero-copy{min-width:0}
  .kicker{
    display:inline-block;
    margin:0 0 12px;
    padding:5px 16px;
    font-size:.82rem;
    font-weight:800;
    letter-spacing:.08em;
    color:var(--ink);
    background:var(--gold-soft);
    border:2.5px solid var(--ink);
    border-radius:99px;
  }
  .hero-title{
    margin:0 0 14px;
    font-family:var(--font-title);
    font-size:clamp(2.3rem,6.4vw,4rem);
    line-height:1.12;
    letter-spacing:.02em;
  }
  .hero-title .hl{
    position:relative;
    z-index:0;
    color:var(--red);
    white-space:nowrap;
  }
  .hero-title .hl::after{
    content:"";
    position:absolute;
    left:-2%;right:-2%;bottom:.04em;
    height:.16em;
    background:var(--gold);
    border-radius:99px;
    z-index:-1;
    opacity:.7;
  }
  .hero-sub{
    margin:0 0 clamp(18px,2.6vw,28px);
    font-size:clamp(1.02rem,1.35vw,1.16rem);
    line-height:1.9;
    color:var(--ink-soft);
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px}
  .hero-tags{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-top:clamp(16px,2.4vw,24px);
  }
  .hero-tags span{
    font-size:.84rem;
    font-weight:700;
    padding:5px 14px;
    border-radius:99px;
    background:rgba(58,48,38,.06);
    border:1.5px solid rgba(58,48,38,.14);
    color:var(--ink-soft);
  }

  /* ============ 教學 ============ */
  .teach-card{
    display:grid;
    gap:clamp(18px,3vw,36px);
    align-items:center;
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:var(--radius-xl);
    box-shadow:var(--shadow-hard);
    padding:clamp(20px,3.6vw,48px);
    position:relative;
  }
  @media (min-width:880px){
    .teach-card{grid-template-columns:minmax(270px,.88fr) 1.12fr;gap:clamp(26px,4vw,52px)}
  }
  .teach-art{
    display:grid;
    place-items:center;
    background:linear-gradient(155deg,#FFF3D9,#FBE4C0);
    border:3px dashed rgba(58,48,38,.26);
    border-radius:var(--radius-lg);
    padding:clamp(12px,2.4vw,24px);
    min-height:clamp(190px,26vw,320px);
  }
  .teach-art svg{width:min(100%,330px);height:auto;max-height:340px}
  .teach-copy{min-width:0}
  .teach-copy .kicker{margin-bottom:14px}
  .teach-title{
    margin:0 0 16px;
    font-family:var(--font-title);
    font-size:clamp(1.75rem,3.8vw,2.7rem);
    line-height:1.28;
  }
  .teach-lead{
    margin:0 0 14px;
    font-size:clamp(1.1rem,1.6vw,1.32rem);
    font-weight:800;
    line-height:1.7;
  }
  .teach-body{
    margin:0 0 18px;
    font-size:clamp(1rem,1.3vw,1.12rem);
    line-height:1.95;
    color:var(--ink-soft);
  }
  .formula{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin:0 0 18px;
    padding:13px 16px;
    border:2.5px solid var(--ink);
    border-radius:var(--radius-md);
    background:var(--gold-soft);
    font-weight:800;
    font-size:clamp(.98rem,1.3vw,1.1rem);
  }
  .formula .chip{
    padding:3px 12px;
    border-radius:10px;
    background:var(--card);
    border:2px solid var(--ink);
  }
  .formula .eq{color:var(--red);font-weight:900}
  .example{
    border-left:9px solid var(--gold);
    background:#FFF7E6;
    border-radius:0 var(--radius-md) var(--radius-md) 0;
    padding:14px 20px;
  }
  .ex-verse{
    font-family:var(--font-title);
    font-size:clamp(1.3rem,2.4vw,1.75rem);
    line-height:1.65;
    font-weight:700;
  }
  .ex-source{font-size:.85rem;color:var(--ink-soft);margin-top:2px}
  .ex-trans{margin:10px 0 0;font-size:clamp(.96rem,1.2vw,1.05rem);line-height:1.8}
  .ex-note{
    display:inline-block;
    margin-top:10px;
    padding:4px 12px;
    border-radius:9px;
    background:var(--green-soft);
    font-size:.9rem;
    font-weight:700;
  }
  .teach-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:clamp(16px,2.6vw,26px);
  }
  .dots{display:flex;gap:8px;align-items:center}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(58,48,38,.2);
    transition:all .25s;
  }
  .dot.on{background:var(--red);transform:scale(1.4)}

  .summary-list{
    display:grid;
    gap:10px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .summary-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-radius:14px;
    border:2.5px solid var(--ink);
    font-weight:800;
    font-size:clamp(.98rem,1.3vw,1.08rem);
  }
  .summary-list li:nth-child(1){background:var(--blue-soft)}
  .summary-list li:nth-child(2){background:var(--green-soft)}
  .summary-list li:nth-child(3){background:var(--red-soft)}
  .summary-list .tag{
    flex:none;
    display:grid;place-items:center;
    min-width:44px;height:38px;
    border-radius:10px;
    background:var(--card);
    border:2px solid var(--ink);
    font-family:var(--font-title);
    font-size:1.05rem;
  }

  /* ============ 模式選單 ============ */
  .menu-head{text-align:center;margin:clamp(8px,2vw,20px) 0 clamp(20px,3vw,32px)}
  .menu-head h2{
    margin:0 0 8px;
    font-family:var(--font-title);
    font-size:clamp(1.8rem,4.2vw,2.9rem);
  }
  .menu-head p{margin:0;color:var(--ink-soft);font-size:clamp(.98rem,1.3vw,1.1rem)}
  .mode-grid{
    display:grid;
    gap:clamp(16px,3vw,28px);
    grid-template-columns:1fr;
  }
  @media (min-width:800px){
    .mode-grid{grid-template-columns:1fr 1fr}
  }
  .mode-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    padding:clamp(20px,3vw,34px);
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:var(--radius-xl);
    box-shadow:0 8px 0 rgba(58,48,38,.16);
    cursor:pointer;
    transition:transform .16s,box-shadow .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .mode-card:hover{transform:translateY(-5px);box-shadow:0 13px 0 rgba(58,48,38,.16)}
  .mode-card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(58,48,38,.16)}
  .mode-badge{
    position:absolute;
    top:-15px;left:26px;
    padding:3px 15px;
    border-radius:99px;
    border:2.5px solid var(--ink);
    background:var(--gold);
    font-size:.8rem;
    font-weight:900;
    letter-spacing:.06em;
  }
  .mode-card[data-mode="b"] .mode-badge{background:var(--blue-soft)}
  .mode-art{width:100%;display:grid;place-items:center;padding:4px 0 8px}
  .mode-art svg{width:min(100%,210px);height:auto}
  .mode-card h3{
    margin:0;
    font-family:var(--font-title);
    font-size:clamp(1.4rem,2.4vw,1.85rem);
  }
  .mode-card p{
    margin:0;
    color:var(--ink-soft);
    font-size:clamp(.95rem,1.2vw,1.05rem);
    line-height:1.75;
  }
  .mode-cta{
    margin-top:6px;
    font-weight:900;
    color:var(--red);
    font-size:1rem;
  }

  /* ============ 遊戲 ============ */
  .game-shell{max-width:820px;margin:0 auto}
  .game-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:clamp(12px,2vw,18px);
  }
  .game-mode{
    padding:4px 15px;
    border-radius:99px;
    background:var(--gold-soft);
    border:2.5px solid var(--ink);
    font-size:.85rem;
    font-weight:900;
  }
  .game-score{
    font-size:.9rem;
    font-weight:800;
    color:var(--ink-soft);
  }
  .q-card{
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:var(--radius-xl);
    box-shadow:var(--shadow-hard);
    padding:clamp(20px,3.4vw,40px);
  }
  .q-index{
    display:inline-block;
    margin-bottom:clamp(12px,2vw,18px);
    padding:3px 14px;
    border-radius:99px;
    background:rgba(58,48,38,.07);
    font-size:.82rem;
    font-weight:800;
    color:var(--ink-soft);
  }
  .verse{
    font-family:var(--font-title);
    font-size:clamp(1.65rem,4.2vw,2.65rem);
    line-height:1.72;
    font-weight:700;
    letter-spacing:.03em;
    margin:0 0 8px;
    word-break:break-word;
  }
  .verse.sm{font-size:clamp(1.3rem,2.6vw,1.85rem);line-height:1.66;margin:0}
  .qi{
    font-style:normal;
    color:var(--red);
    font-weight:900;
    text-decoration:underline wavy var(--gold);
    text-decoration-thickness:3px;
    text-underline-offset:8px;
  }
  .q-source{
    font-size:.86rem;
    color:var(--ink-soft);
    margin:0 0 clamp(16px,2.4vw,24px);
  }
  .q-ask{
    margin:0 0 clamp(14px,2.2vw,20px);
    font-size:clamp(1.02rem,1.4vw,1.15rem);
    font-weight:800;
  }
  .options{
    display:grid;
    gap:clamp(10px,1.6vw,15px);
    grid-template-columns:1fr;
  }
  @media (min-width:560px){
    .options{grid-template-columns:repeat(3,1fr)}
    .options.two{grid-template-columns:repeat(2,1fr)}
  }
  .option{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:clamp(62px,7vw,76px);
    padding:10px 14px;
    font-family:var(--font-body);
    font-size:clamp(1.04rem,1.5vw,1.22rem);
    font-weight:800;
    line-height:1.4;
    color:var(--ink);
    background:#FFFDF7;
    border:3px solid var(--ink);
    border-radius:20px;
    box-shadow:0 5px 0 rgba(58,48,38,.28);
    cursor:pointer;
    transition:transform .12s,box-shadow .12s,background .25s,border-color .25s;
    -webkit-tap-highlight-color:transparent;
  }
  .option:hover:not(:disabled){background:var(--gold-soft)}
  .option:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(58,48,38,.28)}
  .option:disabled{cursor:default}
  .option.correct{background:var(--green-soft);border-color:var(--green);box-shadow:0 5px 0 var(--green)}
  .option.wrong{background:var(--red-soft);border-color:var(--red);box-shadow:0 5px 0 var(--red)}
  .option.dim{opacity:.5}

  .duel{
    display:grid;
    gap:clamp(10px,2vw,18px);
    align-items:stretch;
    margin-bottom:clamp(16px,2.4vw,22px);
  }
  @media (min-width:760px){
    .duel{grid-template-columns:1fr auto 1fr}
  }
  .duel-side{
    padding:clamp(14px,2.2vw,22px);
    border-radius:var(--radius-md);
    border:2.5px solid var(--ink);
    background:#FFF8E9;
    min-width:0;
  }
  .duel-side:first-child{background:var(--blue-soft)}
  .duel-side:last-child{background:var(--green-soft)}
  .duel-vs{
    display:grid;
    place-items:center;
    font-family:var(--font-title);
    font-weight:900;
    font-size:1.1rem;
    color:var(--ink-soft);
    padding:2px 0;
  }
  .duel-side .q-source{margin:6px 0 0}

  .feedback{
    margin-top:clamp(14px,2.2vw,22px);
    border:3px solid var(--ink);
    border-radius:var(--radius-lg);
    padding:clamp(16px,2.6vw,26px);
    background:#FFFBF0;
    animation:pop .3s cubic-bezier(.22,1,.36,1);
  }
  .feedback.ok{border-color:var(--green);background:#F3FBF6}
  .feedback.no{border-color:var(--red);background:#FFF6F3}
  .fb-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:clamp(1.05rem,1.5vw,1.22rem);
    font-weight:900;
  }
  .fb-icon{
    flex:none;
    width:34px;height:34px;
    display:grid;place-items:center;
    border-radius:50%;
    border:2.5px solid var(--ink);
    background:var(--card);
  }
  .fb-icon svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .feedback.ok .fb-icon{background:var(--green-soft)}
  .feedback.no .fb-icon{background:var(--red-soft)}
  .fb-label{
    display:inline-block;
    margin-bottom:6px;
    padding:2px 11px;
    border-radius:8px;
    background:rgba(58,48,38,.07);
    font-size:.85rem;
    font-weight:800;
    color:var(--ink-soft);
  }
  .fb-main{
    margin:0 0 8px;

        osc.start(t0);

  var state = {

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function verseHTML(str){
    return esc(str).replace(/其/g, '<em class="qi">其</em>');
  }

  function shuffle(list){
    var arr = list.slice();
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function labelOf(key){
    for(var i = 0; i < OPTIONS.length; i++){
      if(OPTIONS[i].key === key) return OPTIONS[i].label;
    }
    return '';
  }

  /* =========================================================

  function setProgress(cur, total){
    var pct = Math.round(cur / total * 100);
    $('progressFill').style.width = pct + '%';
    $('progressNum').textContent = cur + ' / ' + total;
  }

  function updateChrome(){
    var v = state.view;
    $('btnBack').hidden = (v === 'home');
    var showProgress = (v === 'teach' || v === 'game');
    $('progress').hidden = !showProgress;
    $('topbarSpacer').hidden = showProgress;
    var appEl = document.querySelector('.app');
    if(appEl){ appEl.setAttribute('data-tight', showProgress ? '1' : '0'); }
    if(v === 'teach') setProgress(state.teach + 1, TEACH.length);
    if(v === 'game') setProgress(Math.min(state.qi + 1, 6), 6);
  }

  function showView(name){
    state.view = name;
    var views = ['home', 'teach', 'menu', 'game', 'result'];
    for(var i = 0; i < views.length; i++){
      var el = $('view-' + views[i]);
      if(el) el.hidden = (views[i] !== name);
    }
    updateChrome();
    try{ window.scrollTo({ top: 0, behavior: 'auto' }); }catch(e){ window.scrollTo(0, 0); }
  }

  /* =========================================================

  function renderTeach(){
    var p = TEACH[state.teach];
    var html = '';

    html += '<div class="teach-art">' + p.art + '</div>';
    html += '<div class="teach-copy">';
    html += '<p class="kicker">' + p.kicker + '</p>';
    html += '<h2 class="teach-title">' + p.title + '</h2>';
    html += '<p class="teach-lead">' + p.lead + '</p>';
    if(p.body) html += '<p class="teach-body">' + p.body + '</p>';
    if(p.formula) html += '<div class="formula">' + p.formula + '</div>';
    if(p.example){
      html += '<div class="example">';
      html += '<div class="ex-verse">' + verseHTML(p.example.text) + '</div>';
      html += '<div class="ex-source">' + p.example.source + '</div>';
      html += '<p class="ex-trans">' + p.example.trans + '</p>';
      html += '<span class="ex-note">' + p.example.note + '</span>';
      html += '</div>';
    }
    if(p.extra) html += p.extra;
    html += '</div>';

    $('teachCard').innerHTML = html;

    var dots = '';
    for(var i = 0; i < TEACH.length; i++){
      dots += '<span class="dot' + (i === state.teach ? ' on' : '') + '"></span>';
    }
    $('teachDots').innerHTML = dots;

    var isLast = state.teach === TEACH.length - 1;
    $('btnTeachNext').textContent = isLast ? '進入遊戲' : '下一頁';

  function goTeach(delta){
    var next = state.teach + delta;
    if(next < 0){ showView('home'); return; }
    if(next >= TEACH.length){ showView('menu'); return; }
    state.teach = next;
    Sound.page();
    renderTeach();
    try{ window.scrollTo({ top: 0, behavior: 'auto' }); }catch(e){ window.scrollTo(0, 0); }
  }

  /* =========================================================
     八、遊戲
     ========================================================= */
  function currentQ(){
    return state.mode === 'a' ? MODE_A[state.qi] : MODE_B[state.qi];
  }

  function startMode(mode){
    state.mode = mode;
    state.qi = 0;
    state.score = 0;
    state.answered = false;
    state.results = [];
    $('gameModeLabel').textContent = mode === 'a' ? '模式一 ‧ 翻譯機' : '模式二 ‧ 雙句對決';
    $('gameScore').textContent = '答對 0 題';
    showView('game');
    renderQuestion();
  }

  function renderQuestion(){
    if(state.qi >= 6){ showResult(); return; }
    state.answered = false;

    var q = currentQ();
    var html = '<div class="q-card">';
    html += '<span class="q-index">第 ' + (state.qi + 1) + ' 題 ‧ 共 6 題</span>';

    if(state.mode === 'a'){
      html += '<p class="verse">' + verseHTML(q.verse) + '</p>';
      html += '<p class="q-source">' + q.source + '</p>';
      html += '<p class="q-ask">句中的「其」是甚麼意思？</p>';
      html += '<div class="options">';
      var shuffled = shuffle(OPTIONS);
      for(var i = 0; i < shuffled.length; i++){
        html += '<button class="option" type="button" data-key="' + shuffled[i].key + '">' + shuffled[i].label + '</button>';
      }
      html += '</div>';
    }else{
      html += '<p class="q-ask" style="margin-bottom:16px">兩句的「其」意思相同嗎？</p>';
      html += '<div class="duel">';
      html += '<div class="duel-side"><p class="verse sm">' + verseHTML(q.a.verse) + '</p><p class="q-source">' + q.a.source + '</p></div>';
      html += '<div class="duel-vs">VS</div>';
      html += '<div class="duel-side"><p class="verse sm">' + verseHTML(q.b.verse) + '</p><p class="q-source">' + q.b.source + '</p></div>';
      html += '</div>';
      html += '<div class="options two">';
      html += '<button class="option" type="button" data-key="same">意思相同</button>';
      html += '<button class="option" type="button" data-key="diff">意思不同</button>';
      html += '</div>';
    }

    html += '</div><div id="fbSlot" aria-live="polite"></div>';
    $('gameBody').innerHTML = html;
    updateChrome();
  }

  function choose(key){
    if(state.answered || state.view !== 'game') return;
    var q = currentQ();
    state.answered = true;

    var ok = (key === q.answer);
    if(ok){ state.score++; Sound.correct(); }
    else{ Sound.wrong(); }
    state.results.push({ correct: ok, key: key });

    $('gameScore').textContent = '答對 ' + state.score + ' 題';

    var btns = document.querySelectorAll('#gameBody .option');
    for(var i = 0; i < btns.length; i++){
      var b = btns[i];
      var k = b.getAttribute('data-key');
      b.disabled = true;
      if(k === q.answer){ b.classList.add('correct'); }
      else if(k === key){ b.classList.add('wrong'); }
      else{ b.classList.add('dim'); }
    }

    renderFeedback(ok, key);
  }

  function renderFeedback(ok, key){
    var q = currentQ();
    var isLast = state.qi >= 5;
    var icon = ok
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 L17 17"/><path d="M17 7 L7 17"/></svg>';
    var html = '<div class="feedback ' + (ok ? 'ok' : 'no') + '">';
    html += '<div class="fb-head"><span class="fb-icon">' + icon + '</span>' + (ok ? '答對了！' : '差一點！') + '</div>';

    if(state.mode === 'a'){
      html += '<span class="fb-label">正確答案：' + labelOf(q.answer) + '</span>';
      html += '<p class="fb-main">' + q.trans + '</p>';
      html += '<p class="fb-text">' + q.explain + '</p>';
      if(!ok){
        html += '<p class="fb-text">你選了「' + labelOf(key) + '」。小提示：先看是不是「其一」「其中」，再把「他的」放進句子讀一讀。</p>';
      }
    }else{
      html += '<span class="fb-label">正確答案：' + (q.answer === 'same' ? '意思相同' : '意思不同') + '</span>';
      html += '<p class="fb-main">A　' + q.aMeaning + '<br>B　' + q.bMeaning + '</p>';
      html += '<p class="fb-text">' + q.explain + '</p>';
      if(!ok){
        html += '<p class="fb-text">小提示：先看「其」後面是不是「一」或「中」，再把「他的」放進句子讀一讀。</p>';
      }
    }

    html += '<div class="fb-actions"><button class="btn btn-primary" type="button" data-act="next">' +
      (isLast ? '看成績' : '下一題') + '</button></div>';
    html += '</div>';

    $('fbSlot').innerHTML = html;

    var nextBtn = $('fbSlot').querySelector('[data-act="next"]');
    if(nextBtn){ try{ nextBtn.focus({ preventScroll: true }); }catch(e){ nextBtn.focus(); } }

    try{
      var fbRect = $('fbSlot').getBoundingClientRect();
      if(fbRect.bottom > window.innerHeight - 8){
        var cardEl = document.querySelector('.q-card');
        var barEl = $('topbar');
        var offset = (barEl ? barEl.offsetHeight : 70) + 12;
        var topPos = cardEl.getBoundingClientRect().top + (window.pageYOffset || 0) - offset;
        if(topPos < 0) topPos = 0;
        window.scrollTo({ top: topPos, behavior: 'smooth' });
      }
    }catch(e){}
  }

  function nextQuestion(){
    state.qi++;
    if(state.qi >= 6){ showResult(); return; }
    renderQuestion();
    try{ window.scrollTo({ top: 0, behavior: 'auto' }); }catch(e){ window.scrollTo(0, 0); }
  }

  function starSVG(on){
    return '<svg viewBox="0 0 24 24" class="' + (on ? '' : 'off') + '" aria-hidden="true">' +
      '<path d="M12 2.4 L15.1 8.9 L22.1 9.8 L16.9 14.5 L18.3 21.4 L12 18 L5.7 21.4 L7.1 14.5 L1.9 9.8 L8.9 8.9 Z" ' +
      'fill="#EAB44D" stroke="#3A3026" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  }

  function showResult(){
    var s = state.score;
    var stars = s >= 6 ? 3 : (s >= 4 ? 2 : 1);
    var title, desc;

    if(s >= 6){
      title = '滿分！你是「其」字小博士';
      desc = '三種用法都分得清清楚楚，快去挑戰另一個模式吧！';
    }else if(s >= 4){
      title = '很棒！只差一點點';
      desc = '你已經掌握大部分用法，回去看看答錯的題目，再來一次就滿分了。';
    }else if(s >= 2){
      title = '不錯的開始';
      desc = '「其」的三步還未記牢，先重看教學，再挑戰一次。';
    }else{
      title = '別灰心，再來一次';
      desc = '先記住三步：見到「其一」「其中」就是「其中的」；把「他的」放進去讀得通，就是「他的」；讀不通，就是「那個」。';
    }

    var starsHTML = '';
    for(var i = 0; i < 3; i++) starsHTML += starSVG(i < stars);

    $('resultStars').innerHTML = starsHTML;
    $('resultTitle').textContent = title;
    $('resultDesc').textContent = desc;
    $('resultScore').textContent = s;

    var wrong = [];
    for(var w = 0; w < state.results.length; w++){
      if(!state.results[w].correct) wrong.push(w);
    }
    var reviewHTML = '';
    if(wrong.length){
      reviewHTML = '<div class="review"><h3>再看一次答錯的 ' + wrong.length + ' 題</h3><ul>';
      for(var k = 0; k < wrong.length; k++){
        var idx = wrong[k];
        reviewHTML += '<li>';
        if(state.mode === 'a'){
          var qa = MODE_A[idx];
          reviewHTML += '<span class="rv-verse">' + verseHTML(qa.verse) + '</span>';
          reviewHTML += '<span class="rv-ans">「其」＝' + labelOf(qa.answer) + '　' + qa.trans + '</span>';
        }else{
          var qb = MODE_B[idx];
          reviewHTML += '<span class="rv-verse">' + verseHTML(qb.a.verse) + '　／　' + verseHTML(qb.b.verse) + '</span>';
          reviewHTML += '<span class="rv-ans">' + (qb.answer === 'same' ? '意思相同' : '意思不同') + '：A ' + qb.aMeaning + '；B ' + qb.bMeaning + '</span>';
        }
        reviewHTML += '</li>';
      }
      reviewHTML += '</ul></div>';
    }
    $('resultReview').innerHTML = reviewHTML;

    showView('result');
    if(stars === 3){ Sound.win(); }
  }

  /* =========================================================
     十、事件綁定
     ========================================================= */
  function bind(){
    $('btnStartTeach').addEventListener('click', function(){
      Sound.click();
      state.teach = 0;
      showView('teach');
      renderTeach();
    });

    $('btnSkipToMenu').addEventListener('click', function(){
      Sound.click();
      showView('menu');
    });

    var rvTeach = $('btnReviewTeach');
    if(rvTeach){
      rvTeach.addEventListener('click', function(){
        Sound.click();
        state.teach = 0;
        showView('teach');
        renderTeach();
      });
    }

    $('btnTeachPrev').addEventListener('click', function(){ goTeach(-1); });
    $('btnTeachNext').addEventListener('click', function(){ goTeach(1); });

    $('btnBack').addEventListener('click', function(){
      Sound.click();
      if(state.view === 'teach'){ showView('home'); }
      else if(state.view === 'menu'){ showView('home'); }
      else if(state.view === 'game'){ showView('menu'); }
      else if(state.view === 'result'){ showView('menu'); }
    });

    var cards = document.querySelectorAll('.mode-card');
    for(var i = 0; i < cards.length; i++){
      cards[i].addEventListener('click', function(){
        Sound.click();
        startMode(this.getAttribute('data-mode'));
      });
    }

    $('gameBody').addEventListener('click', function(e){
      var t = e.target;
      var opt = t.closest ? t.closest('.option') : null;
      if(opt && !opt.disabled){
        choose(opt.getAttribute('data-key'));
        return;
      }
      var act = t.closest ? t.closest('[data-act="next"]') : null;
      if(act){ nextQuestion(); }
    });

    $('btnRetry').addEventListener('click', function(){
      Sound.click();
      if(state.mode) startMode(state.mode);
      else showView('menu');
    });

    $('btnMenu').addEventListener('click', function(){
      Sound.click();
      showView('menu');
    });

    $('btnSound').addEventListener('click', function(){
      Sound.enabled = !Sound.enabled;
      this.classList.toggle('muted', !Sound.enabled);
      this.setAttribute('aria-pressed', String(Sound.enabled));
      this.setAttribute('aria-label', Sound.enabled ? '關閉音效' : '開啟音效');
      if(Sound.enabled){
        Sound.init();
        Sound.unlock();
        Sound.click();
      }
    });

    document.addEventListener('pointerdown', function once(){
      Sound.init();
      Sound.unlock();
      document.removeEventListener('pointerdown', once);
    }, { passive: true });

    document.addEventListener('keydown', function(e){
      Sound.init();
      Sound.unlock();
      if(e.key === 'Escape'){
        if(state.view !== 'home'){ $('btnBack').click(); }
        return;
      }
      if(state.view === 'teach'){
        if(e.key === 'ArrowRight'){ goTeach(1); }
        if(e.key === 'ArrowLeft'){ goTeach(-1); }
        return;
      }
      if(state.view === 'game' && !state.answered){
        var n = parseInt(e.key, 10);
        if(n >= 1 && n <= 3){
          var opts = document.querySelectorAll('#gameBody .option');
          if(opts[n - 1]){ opts[n - 1].click(); }
        }
      }
    });
  }

  /* =========================================================
     十一、啟動
     ========================================================= */
  function init(){
    $('heroArt').innerHTML = artScholar();
    $('artModeA').innerHTML = artModeA();
    $('artModeB').innerHTML = artModeB();
    bind();
    showView('home');
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
})();

</script>
</body>
</html>
